name: RKMS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build RKMS APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare RKMS source
        shell: bash
        run: |
          set -e
          rm -rf build
          mkdir -p build

          if [ -f app.js ] && [ -f index.html ] && [ -f config.js ]; then
            rsync -a \
              --exclude="build/" \
              --exclude="android/" \
              --exclude="node_modules/" \
              --exclude=".git/" \
              --exclude=".github/" \
              --exclude="*.zip" \
              ./ build/
          else
            ZIP_FILE=""

            for f in \
              RKMS_CONNECT_FCM_FIXED_V13_SOURCE.zip \
              RKMS_CONNECT_FCM_FIXED_V12_SOURCE.zip \
              RKMS_CONNECT_FCM_FIXED_V11_SOURCE.zip \
              RKMS_CONNECT_FCM_FIXED_V10_SOURCE.zip
            do
              if [ -f "$f" ]; then
                ZIP_FILE="$f"
                break
              fi
            done

            if [ -z "$ZIP_FILE" ]; then
              ZIP_FILE="$(find . -maxdepth 1 -type f -name 'RKMS*.zip' | head -n 1)"
            fi

            test -n "$ZIP_FILE"

            unzip -q "$ZIP_FILE" -d build
          fi

          if [ ! -f build/app.js ]; then
            APP_JS="$(find build -type f -name app.js | head -n 1)"
            test -n "$APP_JS"

            SOURCE_DIR="$(dirname "$APP_JS")"
            rm -rf build-source
            mkdir build-source
            rsync -a "$SOURCE_DIR"/ build-source/

            rm -rf build
            mv build-source build
          fi

          test -f build/app.js
          test -f build/index.html
          test -f build/config.js

          test -s build/assets/rkms-logo-transparent.png
          test -s build/assets/rkms-app-icon-transparent.png

          HASH="$(sha256sum build/assets/rkms-logo-transparent.png | cut -d' ' -f1)"

          test "$HASH" = "731117bca8a9b884bbe796b3a903e270f4b05b5fbf20bc3303ca0041e5125358"

          echo "RKMS source verified."

      - name: Verify JavaScript
        run: |
          set -e
          node --check build/app.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create Capacitor configuration
        working-directory: build
        run: |
          cat > package.json <<'EOF'
          {
            "name": "rkms",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "rm -rf dist && mkdir -p dist && rsync -a --exclude='dist/' --exclude='android/' --exclude='node_modules/' --exclude='.git/' --exclude='.github/' --exclude='*.zip' ./ dist/"
            },
            "dependencies": {
              "@capacitor/core": "6.2.2",
              "@capacitor/android": "6.2.2",
              "@capacitor/app": "6.0.3",
              "@capacitor/push-notifications": "6.0.2"
            },
            "devDependencies": {
              "@capacitor/cli": "6.2.2"
            }
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "org.rkms.connect",
            "appName": "RKMS",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF

      - name: Install dependencies
        working-directory: build
        run: |
          npm install --no-audit --no-fund

      - name: Build web application
        working-directory: build
        run: |
          npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Create Android platform
        working-directory: build
        run: |
          npx cap add android

      - name: Sync Android
        working-directory: build
        run: |
          npx cap sync android

      - name: Verify FCM plugin
        working-directory: build
        run: |
          set -e

          test -d node_modules/@capacitor/push-notifications

          test -f \
            node_modules/@capacitor/push-notifications/android/src/main/java/com/capacitorjs/plugins/pushnotifications/PushNotificationsPlugin.java

          grep -q createChannel \
            node_modules/@capacitor/push-notifications/android/src/main/java/com/capacitorjs/plugins/pushnotifications/PushNotificationsPlugin.java

          echo "FCM plugin verified."

      - name: Configure Firebase
        shell: bash
        env:
          RKMS_GOOGLE_SERVICES_JSON: ${{ secrets.RKMS_GOOGLE_SERVICES_JSON }}
        run: |
          set -e

          if [ -n "${RKMS_GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$RKMS_GOOGLE_SERVICES_JSON" \
              > build/android/app/google-services.json

          elif [ -s build/android-config/google-services.json ]; then
            cp build/android-config/google-services.json \
              build/android/app/google-services.json

          elif [ -s android-config/google-services.json ]; then
            cp android-config/google-services.json \
              build/android/app/google-services.json

          else
            echo "ERROR: Firebase configuration missing."
            exit 1
          fi

          test -s build/android/app/google-services.json

          echo "Firebase verified."

      - name: Enable Google Services
        working-directory: build/android
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          root = Path("build.gradle")
          app = Path("app/build.gradle")

          root_text = root.read_text()
          app_text = app.read_text()

          if "com.google.gms:google-services" not in root_text:
              root_text = (
                  "buildscript {\n"
                  "    dependencies {\n"
                  "        classpath 'com.google.gms:google-services:4.4.2'\n"
                  "    }\n"
                  "}\n\n" + root_text
              )
              root.write_text(root_text)

          if "com.google.gms.google-services" not in app_text:
              app_text += "\napply plugin: 'com.google.gms.google-services'\n"
              app.write_text(app_text)
          PY

      - name: Install RKMS launcher icon
        shell: bash
        run: |
          set -e

          LOGO="build/assets/rkms-app-icon-transparent.png"
          RES="build/android/app/src/main/res"

          test -s "$LOGO"

          rm -rf "$RES/mipmap-anydpi"
          rm -rf "$RES/mipmap-anydpi-v26"

          rm -f "$RES"/mipmap-*/ic_launcher_foreground.*
          rm -f "$RES"/mipmap-*/ic_launcher_background.*

          mkdir -p \
            "$RES/mipmap-mdpi" \
            "$RES/mipmap-hdpi" \
            "$RES/mipmap-xhdpi" \
            "$RES/mipmap-xxhdpi" \
            "$RES/mipmap-xxxhdpi"

          cp "$LOGO" "$RES/mipmap-mdpi/ic_launcher.png"
          cp "$LOGO" "$RES/mipmap-hdpi/ic_launcher.png"
          cp "$LOGO" "$RES/mipmap-xhdpi/ic_launcher.png"
          cp "$LOGO" "$RES/mipmap-xxhdpi/ic_launcher.png"
          cp "$LOGO" "$RES/mipmap-xxxhdpi/ic_launcher.png"

          cp "$LOGO" "$RES/mipmap-mdpi/ic_launcher_round.png"
          cp "$LOGO" "$RES/mipmap-hdpi/ic_launcher_round.png"
          cp "$LOGO" "$RES/mipmap-xhdpi/ic_launcher_round.png"
          cp "$LOGO" "$RES/mipmap-xxhdpi/ic_launcher_round.png"
          cp "$LOGO" "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

          STRINGS="$RES/values/strings.xml"
          sed -i \
            's#<string name="app_name">.*</string>#<string name="app_name">RKMS</string>#' \
            "$STRINGS"

          MANIFEST="build/android/app/src/main/AndroidManifest.xml"

          sed -i \
            's#android:icon="[^"]*"#android:icon="@mipmap/ic_launcher"#g' \
            "$MANIFEST"

          sed -i \
            's#android:roundIcon="[^"]*"#android:roundIcon="@mipmap/ic_launcher_round"#g' \
            "$MANIFEST"

          echo "RKMS launcher configured."

      - name: Make Gradle executable
        run: |
          chmod +x build/android/gradlew

      - name: Build Debug APK
        working-directory: build/android
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="build/android/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "APK created:"
          ls -lh "$APK"

      - name: Upload RKMS APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-debug-apk
          path: build/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

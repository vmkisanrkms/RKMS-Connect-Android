name: RKMS Android 16 API 36 - Final Release APK Only

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  AGP_VERSION: "8.9.1"
  GRADLE_VERSION: "8.11.1"
  APP_ID: "org.rkms.connect"

jobs:
  android-build:
    name: RKMS Android 16 API 36 Release APK
    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. RESOLVE RKMS SOURCE
      #
      # V2 source is preferred.
      # Root source is also supported.
      # ============================================================
      - name: Resolve RKMS source
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking RKMS source..."

          # --------------------------------------------------------
          # CASE 1: Complete source is already in repository root
          # --------------------------------------------------------
          if [[ -f "package.json" ]] && \
             [[ -f "package-lock.json" ]] && \
             [[ -f "app.js" ]] && \
             [[ -f "index.html" ]] && \
             [[ -f "styles.css" ]] && \
             [[ -f "capacitor.config.json" ]] && \
             [[ -f "google-services.json" ]]; then

            echo "Root RKMS source detected."
            echo "RKMS_SOURCE_DIR=." >> "$GITHUB_ENV"
            exit 0
          fi


          # --------------------------------------------------------
          # CASE 2: Resolve V2 source ZIP
          # --------------------------------------------------------
          echo "Root source not found."
          echo "Searching for RKMS V2 source ZIP..."

          rm -rf rkms-source
          mkdir -p rkms-source

          ZIP=""


          # --------------------------------------------------------
          # FIRST PRIORITY: FINAL V2 SOURCE
          # --------------------------------------------------------
          if [[ -f "RKMS_CONNECT_FINAL_CHAT_UI_PROFESSIONAL_FIXED_V2.zip" ]]; then
            ZIP="RKMS_CONNECT_FINAL_CHAT_UI_PROFESSIONAL_FIXED_V2.zip"
          fi


          # --------------------------------------------------------
          # SECOND PRIORITY: V2 alternate name
          # --------------------------------------------------------
          if [[ -z "$ZIP" ]] && \
             [[ -f "RKMS_CONNECT_FINAL_RELEASE_APK_ONLY_CHAT_FIXED_V2.zip" ]]; then
            ZIP="RKMS_CONNECT_FINAL_RELEASE_APK_ONLY_CHAT_FIXED_V2.zip"
          fi


          # --------------------------------------------------------
          # Older patched source only as fallback
          # --------------------------------------------------------
          if [[ -z "$ZIP" ]] && \
             [[ -f "RKMS_CONNECT_FINAL_CHAT_UI_PROFESSIONAL_FIXED_SCROLL_FOOTER_PATCHED.zip" ]]; then
            ZIP="RKMS_CONNECT_FINAL_CHAT_UI_PROFESSIONAL_FIXED_SCROLL_FOOTER_PATCHED.zip"
          fi


          if [[ -z "$ZIP" ]] && \
             [[ -f "RKMS_CONNECT_FINAL_CHAT_UI_PROFESSIONAL_FIXED.zip" ]]; then
            ZIP="RKMS_CONNECT_FINAL_CHAT_UI_PROFESSIONAL_FIXED.zip"
          fi


          # --------------------------------------------------------
          # Recursive fallback
          # --------------------------------------------------------
          if [[ -z "$ZIP" ]]; then

            FOUND_ZIP="$(
              find . \
                -type f \
                -iname "RKMS_CONNECT*.zip" \
                -not -path "./.git/*" \
                -print \
                | sort \
                | head -n 1 || true
            )"

            if [[ -n "$FOUND_ZIP" ]]; then
              ZIP="$FOUND_ZIP"
            fi
          fi


          # --------------------------------------------------------
          # FAIL IF NOTHING FOUND
          # --------------------------------------------------------
          if [[ -z "$ZIP" ]]; then
            echo "::error::RKMS source ZIP not found."

            echo
            echo "Repository RKMS files:"
            find . \
              -maxdepth 5 \
              -type f \
              -iname "*RKMS*" \
              -not -path "./.git/*" \
              | sort \
              | head -500

            exit 1
          fi


          echo
          echo "=============================================="
          echo " RKMS SOURCE ZIP SELECTED"
          echo "=============================================="
          echo "$ZIP"
          echo


          # --------------------------------------------------------
          # EXTRACT
          # --------------------------------------------------------
          unzip -q "$ZIP" -d rkms-source


          # --------------------------------------------------------
          # FIND package.json
          # --------------------------------------------------------
          FOUND_PACKAGE="$(
            find rkms-source \
              -type f \
              -name package.json \
              -print \
              | head -n 1 || true
          )"


          if [[ -z "$FOUND_PACKAGE" ]]; then
            echo "::error::package.json not found after extraction."
            exit 1
          fi


          SOURCE="$(dirname "$FOUND_PACKAGE")"


          echo
          echo "Resolved RKMS source:"
          echo "$SOURCE"


          # --------------------------------------------------------
          # REQUIRED SOURCE FILES
          # --------------------------------------------------------
          REQUIRED_FILES=(
            package.json
            package-lock.json
            app.js
            index.html
            styles.css
            capacitor.config.json
            google-services.json
            scripts/configure-android-16.sh
            scripts/setup-android-native.sh
            scripts/configure-release-signing.sh
          )


          for FILE in "${REQUIRED_FILES[@]}"; do

            if [[ ! -f "$SOURCE/$FILE" ]]; then
              echo "::error::Missing required source file:"
              echo "$SOURCE/$FILE"
              exit 1
            fi

          done


          # --------------------------------------------------------
          # EXPORT SOURCE PATH
          # --------------------------------------------------------
          echo "RKMS_SOURCE_DIR=$SOURCE" >> "$GITHUB_ENV"


          echo
          echo "=============================================="
          echo " RKMS SOURCE RESOLUTION: PASS"
          echo "=============================================="
          echo "Source: $SOURCE"
          echo


      # ============================================================
      # 3. VERIFY RKMS SOURCE
      # ============================================================
      - name: Verify RKMS source
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          REQUIRED_FILES=(
            package.json
            package-lock.json
            app.js
            index.html
            styles.css
            capacitor.config.json
            google-services.json
            scripts/configure-android-16.sh
            scripts/setup-android-native.sh
            scripts/configure-release-signing.sh
          )

          for FILE in "${REQUIRED_FILES[@]}"; do

            if [[ ! -f "$FILE" ]]; then
              echo "::error::Missing required file: $FILE"
              exit 1
            fi

          done

          echo "All required RKMS source files verified."


      # ============================================================
      # 4. VERIFY V2 CHAT SOURCE
      # ============================================================
      - name: Verify RKMS Chat V2 source
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          echo "Checking Chat V2 source..."

          grep -q \
            "RKMS CHAT FINAL V2 LAYOUT" \
            styles.css || {
              echo "::error::RKMS Chat V2 CSS marker not found."
              exit 1
            }

          grep -q \
            "rkmsInstallChatViewportLock" \
            app.js || {
              echo "::error::RKMS Chat viewport runtime code not found."
              exit 1
            }

          grep -q \
            "visualViewport" \
            app.js || {
              echo "::error::visualViewport handling not found."
              exit 1
            }

          grep -q \
            "rkms-chat-vh" \
            styles.css || {
              echo "::error::Chat viewport variable not found."
              exit 1
            }

          grep -q \
            "rkms-site-header-h" \
            styles.css || {
              echo "::error::Site header height variable not found."
              exit 1
            }

          grep -q \
            "rkms-bottom-nav-h" \
            styles.css || {
              echo "::error::Bottom navigation height variable not found."
              exit 1
            }

          echo "RKMS Chat V2 source verified."


      # ============================================================
      # 5. NODE 22
      # ============================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}


      # ============================================================
      # 6. VERIFY NODE + JAVASCRIPT
      # ============================================================
      - name: Verify Node and JavaScript
        shell: bash
        run: |
          set -euo pipefail

          node --version
          npm --version

          cd "$RKMS_SOURCE_DIR"

          node --check app.js

          echo "Node.js and app.js syntax verified."


      # ============================================================
      # 7. VERIFY CAPACITOR VERSIONS
      # ============================================================
      - name: Verify Capacitor versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          node <<'NODE'
          const p = require("./package.json");

          const expected = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          for (const [name, version] of Object.entries(expected)) {

            const actual =
              (p.dependencies && p.dependencies[name]) ||
              (p.devDependencies && p.devDependencies[name]);

            if (!actual || !actual.includes(version)) {
              console.error(
                `${name}: expected ${version}, found ${actual}`
              );
              process.exit(1);
            }

            console.log(`${name}: ${actual}`);
          }

          console.log("Capacitor versions verified.");
          NODE


      # ============================================================
      # 8. NPM INSTALL
      # ============================================================
      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          npm ci --no-audit --no-fund


      # ============================================================
      # 9. VERIFY PROFESSIONAL CHAT UI
      # ============================================================
      - name: Verify professional Chat UI
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          test -s styles.css

          REQUIRED_SELECTORS=(
            ".wa-chat-screen"
            ".wa-chat-list"
            ".wa-chat-row"
            ".wa-avatar-wrap"
            ".wa-chat-search"
            ".wa-filters"
            ".wa-conv-head"
            ".wa-messages"
            ".wa-compose-wrap"
            "footer.rkms-bottom-nav"
          )

          for SELECTOR in "${REQUIRED_SELECTORS[@]}"; do

            CLEAN_SELECTOR="${SELECTOR//./\\.}"

            if ! grep -qE "${CLEAN_SELECTOR}" styles.css; then
              echo "::error::Required Chat CSS selector missing: $SELECTOR"
              exit 1
            fi

          done

          echo
          echo "=============================================="
          echo " PROFESSIONAL CHAT UI: PASS"
          echo "=============================================="
          echo


      # ============================================================
      # 10. VERIFY CHAT SCROLL / FOOTER LAYOUT
      # ============================================================
      - name: Verify Chat scroll and footer layout
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          echo "Checking Chat V2 layout..."


          # --------------------------------------------------------
          # Dynamic viewport
          # --------------------------------------------------------
          grep -q "100dvh" styles.css || {
            echo "::error::100dvh not found."
            exit 1
          }


          # --------------------------------------------------------
          # Runtime viewport variable
          # --------------------------------------------------------
          grep -q "var(--rkms-chat-vh" styles.css || {
            echo "::error::Runtime Chat viewport variable missing."
            exit 1
          }


          # --------------------------------------------------------
          # Header height variable
          # --------------------------------------------------------
          grep -q "var(--rkms-site-header-h" styles.css || {
            echo "::error::Site header height reservation missing."
            exit 1
          }


          # --------------------------------------------------------
          # Bottom navigation reservation
          # --------------------------------------------------------
          grep -q "var(--rkms-bottom-nav-h" styles.css || {
            echo "::error::Bottom navigation reservation missing."
            exit 1
          }


          # --------------------------------------------------------
          # Chat list scroll
          # --------------------------------------------------------
          grep -q "overflow-y:auto!important" styles.css || {
            echo "::error::Chat list vertical scrolling missing."
            exit 1
          }


          # --------------------------------------------------------
          # Message scroll
          # --------------------------------------------------------
          grep -q "overflow-y:auto!important" styles.css || {
            echo "::error::Message vertical scrolling missing."
            exit 1
          }


          # --------------------------------------------------------
          # Chat list bottom padding
          # --------------------------------------------------------
          grep -q \
            "padding:0 0 12px!important" \
            styles.css || {
              echo "::error::Chat list bottom scroll padding missing."
              exit 1
            }


          # --------------------------------------------------------
          # Single chat bottom padding
          # --------------------------------------------------------
          grep -q \
            "padding-bottom:18px!important" \
            styles.css || {
              echo "::error::Single Chat bottom padding missing."
              exit 1
            }


          # --------------------------------------------------------
          # Conversation header
          # --------------------------------------------------------
          grep -q \
            "height:62px!important" \
            styles.css || {
              echo "::error::Single Chat header height not found."
              exit 1
            }


          # --------------------------------------------------------
          # Footer
          # --------------------------------------------------------
          grep -q \
            "footer.rkms-bottom-nav" \
            styles.css || {
              echo "::error::Bottom navigation CSS missing."
              exit 1
            }


          grep -q \
            "min-height:62px!important" \
            styles.css || {
              echo "::error::Slim footer configuration missing."
              exit 1
            }


          echo
          echo "=============================================="
          echo " CHAT SCROLL / FOOTER VERIFICATION: PASS"
          echo "=============================================="
          echo "Dynamic viewport: PASS"
          echo "Runtime header measurement: PASS"
          echo "Runtime footer measurement: PASS"
          echo "Chat list scroll: PASS"
          echo "Single Chat scroll: PASS"
          echo "Single Chat header: PASS"
          echo "Footer: PASS"
          echo


      # ============================================================
      # 11. VERIFY CHAT CSS STRUCTURE
      # ============================================================
      - name: Verify Chat CSS integrity
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          python3 <<'PY'
          from pathlib import Path
          import re

          css = Path("styles.css").read_text(
              encoding="utf-8",
              errors="replace"
          )

          clean = re.sub(
              r"/\*.*?\*/",
              "",
              css,
              flags=re.S
          )

          opens = clean.count("{")
          closes = clean.count("}")

          if opens != closes:
              raise SystemExit(
                  f"CSS brace mismatch: open={opens}, close={closes}"
              )

          required = [
              "wa-chat-screen",
              "wa-chat-list",
              "wa-chat-row",
              "wa-conv-head",
              "wa-messages",
              "wa-compose-wrap",
              "rkms-bottom-nav",
              "rkms-chat-vh",
              "rkms-site-header-h",
              "rkms-bottom-nav-h"
          ]

          for item in required:
              if item not in css:
                  raise SystemExit(
                      f"Required CSS item missing: {item}"
                  )

          print("Chat CSS structural verification passed.")
          PY


      # ============================================================
      # 12. WEB BUILD
      # ============================================================
      - name: Build RKMS web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          npm run build

          test -d dist
          test -s dist/index.html

          echo "RKMS web build successful."


      # ============================================================
      # 13. JAVA 17
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle


      # ============================================================
      # 14. VERIFY JAVA
      # ============================================================
      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail

          java -version


      # ============================================================
      # 15. ANDROID SDK API 36
      # ============================================================
      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses >/dev/null 2>&1 || true

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          echo "Android SDK installed."


      # ============================================================
      # 16. VERIFY ANDROID SDK
      # ============================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d \
            "${ANDROID_HOME}/platforms/android-${ANDROID_API}"

          test -d \
            "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}"

          "${ANDROID_HOME}/platform-tools/adb" version

          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt" version

          echo "Android API ${ANDROID_API} verified."


      # ============================================================
      # 17. CREATE CAPACITOR ANDROID
      # ============================================================
      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          rm -rf android

          npx cap add android

          test -d android
          test -f android/gradlew
          test -f android/app/build.gradle

          chmod +x android/gradlew

          echo "Android project created successfully."


      # ============================================================
      # 18. CONFIGURE ANDROID 16 API 36
      # ============================================================
      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          chmod +x scripts/configure-android-16.sh

          ./scripts/configure-android-16.sh

          test -f android/gradlew

          chmod +x android/gradlew

          echo "Android 16/API 36 configuration applied."


      # ============================================================
      # 19. VERIFY ANDROID CONFIGURATION
      # ============================================================
      - name: Verify Android configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          grep -R \
            -E "compileSdk[[:space:]]*(=|[:space:])?[[:space:]]*36" \
            android >/dev/null || {
              echo "::error::compileSdk 36 not found."
              exit 1
            }

          grep -R \
            -E "targetSdk[[:space:]]*(=|[:space:])?[[:space:]]*36" \
            android >/dev/null || {
              echo "::error::targetSdk 36 not found."
              exit 1
            }

          grep -R \
            "8.9.1" \
            android >/dev/null || {
              echo "::error::AGP 8.9.1 not found."
              exit 1
            }

          grep -q \
            "gradle-8.11.1" \
            android/gradle/wrapper/gradle-wrapper.properties || {
              echo "::error::Gradle 8.11.1 not configured."
              exit 1
            }

          echo "Android 16/API 36 configuration verified."


      # ============================================================
      # 20. CAPACITOR SYNC
      # ============================================================
      - name: Capacitor sync
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          npx cap sync android

          test -f android/gradlew

          chmod +x android/gradlew

          echo "Capacitor sync completed."


      # ============================================================
      # 21. SETUP RKMS NATIVE AND FIREBASE
      # ============================================================
      - name: Setup RKMS native Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          chmod +x scripts/setup-android-native.sh

          ./scripts/setup-android-native.sh

          test -f android/gradlew

          chmod +x android/gradlew

          echo "RKMS native Android setup completed."


      # ============================================================
      # 22. VERIFY FIREBASE CONFIGURATION
      # ============================================================
      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          test -s google-services.json
          test -s android/app/google-services.json

          node <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync("google-services.json", "utf8")
          );

          const clients = data.client || [];

          const valid = clients.some(client =>
            client.client_info &&
            client.client_info.android_client_info &&
            client.client_info.android_client_info.package_name ===
              "org.rkms.connect"
          );

          if (!valid) {
            console.error(
              "Firebase package org.rkms.connect not found."
            );
            process.exit(1);
          }

          console.log(
            "Firebase package org.rkms.connect verified."
          );
          NODE


      # ============================================================
      # 23. ENSURE FIREBASE DEPENDENCIES
      # ============================================================
      - name: Ensure Firebase dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          FILE="android/app/build.gradle"

          test -f "$FILE"

          python3 <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          bom = "implementation platform('com.google.firebase:firebase-bom:33.9.0')"
          messaging = "implementation 'com.google.firebase:firebase-messaging'"

          marker = "dependencies {"

          if marker not in s:
              raise SystemExit(
                  "dependencies block not found"
              )

          if bom not in s:
              s = s.replace(
                  marker,
                  marker + "\n    " + bom,
                  1
              )

          if messaging not in s:
              s = s.replace(
                  marker,
                  marker + "\n    " + messaging,
                  1
              )

          p.write_text(s)

          print("Firebase dependencies ready.")
          PY


      # ============================================================
      # 24. VERIFY FIREBASE INITIALIZATION
      # ============================================================
      - name: Verify Firebase initialization
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          grep -R \
            "FirebaseApp.initializeApp" \
            android/app/src/main/java \
            >/dev/null || {
              echo "::error::FirebaseApp.initializeApp not found."
              exit 1
            }

          echo "Firebase initialization verified."


      # ============================================================
      # 25. VERIFY NATIVE BRIDGE
      # ============================================================
      - name: Verify RKMS native bridge
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          find android/app/src/main/java \
            -name "RKMSNativeBridge.java" \
            -print -quit \
            | grep -q . || {
              echo "::error::RKMSNativeBridge.java missing."
              exit 1
            }

          find android/app/src/main/java \
            -name "RKMSSecureCredentialsPlugin.java" \
            -print -quit \
            | grep -q . || {
              echo "::error::RKMSSecureCredentialsPlugin.java missing."
              exit 1
            }

          echo "RKMS native bridge verified."


      # ============================================================
      # 26. VERIFY BIOMETRIC
      # ============================================================
      - name: Verify biometric dependency
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          grep -R \
            "androidx.biometric:biometric" \
            android \
            >/dev/null || {
              echo "::error::Biometric dependency missing."
              exit 1
            }

          echo "Biometric dependency verified."


      # ============================================================
      # 27. VERIFY LAUNCHER ICONS
      # ============================================================
      - name: Verify RKMS launcher icons
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          COUNT="$(
            find android/app/src/main/res \
              -type f \
              \( \
                -name "ic_launcher*" \
                -o \
                -name "ic_launcher_round*" \
              \) \
              | wc -l
          )"

          if [[ "$COUNT" -lt 1 ]]; then
            echo "::error::RKMS launcher icon missing."
            exit 1
          fi

          echo "Launcher icons found: $COUNT"


      # ============================================================
      # 28. CHECK RELEASE SIGNING SECRETS
      # ============================================================
      - name: Verify release signing secrets
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${RKMS_KEYSTORE_BASE64:-}" ]]; then
            echo "::error::RKMS_KEYSTORE_BASE64 is missing or empty."
            exit 1
          fi

          if [[ -z "${RKMS_KEYSTORE_PASSWORD:-}" ]]; then
            echo "::error::RKMS_KEYSTORE_PASSWORD is missing or empty."
            exit 1
          fi

          if [[ -z "${RKMS_KEY_ALIAS:-}" ]]; then
            echo "::error::RKMS_KEY_ALIAS is missing or empty."
            exit 1
          fi

          if [[ -z "${RKMS_KEY_PASSWORD:-}" ]]; then
            echo "::error::RKMS_KEY_PASSWORD is missing or empty."
            exit 1
          fi

          echo "All release signing secrets are present."


      # ============================================================
      # 29. CONFIGURE RELEASE SIGNING
      # ============================================================
      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          chmod +x scripts/configure-release-signing.sh

          ./scripts/configure-release-signing.sh

          test -s android/app/release.keystore

          echo "Release keystore created."


      # ============================================================
      # 30. VALIDATE KEYSTORE
      # ============================================================
      - name: Validate release keystore
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          test -s android/app/release.keystore

          keytool \
            -list \
            -keystore android/app/release.keystore \
            -storepass "$RKMS_KEYSTORE_PASSWORD" \
            -alias "$RKMS_KEY_ALIAS" \
            >/dev/null

          echo "Release keystore/password/alias verified."


      # ============================================================
      # 31. VERIFY SIGNING CONFIGURATION
      # ============================================================
      - name: Verify release signing configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          grep -q "signingConfigs" \
            android/app/build.gradle

          grep -q "signingConfigs.release" \
            android/app/build.gradle

          grep -q "storeFile" \
            android/app/build.gradle

          grep -q "storePassword" \
            android/app/build.gradle

          grep -q "keyAlias" \
            android/app/build.gradle

          grep -q "keyPassword" \
            android/app/build.gradle

          echo "Release signing configuration verified."


      # ============================================================
      # 32. VERIFY GRADLE WRAPPER
      # ============================================================
      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR/android"

          test -f gradlew

          chmod +x gradlew

          ./gradlew --version

          ./gradlew --version \
            | grep -q "8.11.1" || {
              echo "::error::Gradle 8.11.1 expected."
              exit 1
            }

          echo "Gradle wrapper verified."


      # ============================================================
      # 33. VERIFY FIREBASE RELEASE CLASSPATH
      # ============================================================
      - name: Verify Firebase compile classpath
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR/android"

          ./gradlew \
            :app:dependencies \
            --configuration releaseCompileClasspath \
            --no-daemon \
            > ../firebase-dependencies.txt

          grep -q \
            "firebase-messaging" \
            ../firebase-dependencies.txt || {
              echo "::error::firebase-messaging missing."
              exit 1
            }

          echo "Firebase Messaging compile dependency verified."


      # ============================================================
      # 34. BUILD FINAL RELEASE APK ONLY
      #
      # ONLY assembleRelease
      # NO assembleDebug
      # NO bundleRelease
      # ============================================================
      - name: Build Final Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR/android"

          ./gradlew \
            assembleRelease \
            --no-daemon \
            --stacktrace

          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"

          test -s "$RELEASE_APK"

          echo
          echo "=============================================="
          echo " FINAL RELEASE APK BUILD SUCCESS"
          echo "=============================================="
          echo

          ls -lh "$RELEASE_APK"


      # ============================================================
      # 35. VERIFY RELEASE APK PACKAGE ID
      # ============================================================
      - name: Verify Release APK package ID
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          AAPT="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt"

          "$AAPT" dump badging \
            android/app/build/outputs/apk/release/app-release.apk \
            | grep -q \
            "package: name='org.rkms.connect'" || {
              echo "::error::Wrong package ID."
              exit 1
            }

          echo "Package ID verified: org.rkms.connect"


      # ============================================================
      # 36. VERIFY RELEASE APK SIGNATURE
      # ============================================================
      - name: Verify Release APK signature
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          APKSIGNER="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            android/app/build/outputs/apk/release/app-release.apk

          echo "Release APK signature verified."


      # ============================================================
      # 37. VERIFY RELEASE APK TARGET SDK
      # ============================================================
      - name: Verify Release APK target SDK
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          AAPT="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt"

          "$AAPT" dump badging \
            android/app/build/outputs/apk/release/app-release.apk \
            | grep -q \
            "targetSdkVersion:'36'" || {
              echo "::error::Release APK target SDK is not 36."
              exit 1
            }

          echo "Release APK target SDK 36 verified."


      # ============================================================
      # 38. PREPARE FINAL RELEASE APK
      # ============================================================
      - name: Prepare final Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          rm -rf release
          mkdir -p release

          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          echo "Final Release APK prepared."


      # ============================================================
      # 39. GENERATE SHA256
      # ============================================================
      - name: Generate SHA256 checksum
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR/release"

          sha256sum \
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk \
            > RKMS_ANDROID16_API36_SHA256.txt

          echo
          echo "===== SHA256 ====="

          cat RKMS_ANDROID16_API36_SHA256.txt


      # ============================================================
      # 40. FINAL ARTIFACT CHECK
      # ============================================================
      - name: Final artifact check
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          RELEASE_APK="release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"
          SHA_FILE="release/RKMS_ANDROID16_API36_SHA256.txt"

          test -s "$RELEASE_APK"
          test -s "$SHA_FILE"


          # --------------------------------------------------------
          # No Debug APK
          # --------------------------------------------------------
          if find release \
            -type f \
            -iname "*debug*.apk" \
            -print \
            | grep -q .; then

            echo "::error::Debug APK found."
            exit 1

          fi


          # --------------------------------------------------------
          # No AAB
          # --------------------------------------------------------
          if find release \
            -type f \
            -name "*.aab" \
            -print \
            | grep -q .; then

            echo "::error::AAB found."
            exit 1

          fi


          echo
          echo "=============================================="
          echo " RKMS FINAL RELEASE APK READY"
          echo "=============================================="
          echo
          echo "Release APK: YES"
          echo "AAB: NO"
          echo "Debug APK: NO"
          echo "Chat V2: VERIFIED"
          echo "Chat Scroll: VERIFIED"
          echo "Single Chat Scroll: VERIFIED"
          echo "Chat Header Layout: VERIFIED"
          echo "Footer Layout: VERIFIED"
          echo "Firebase: VERIFIED"
          echo "Native Bridge: VERIFIED"
          echo "Biometric: VERIFIED"
          echo "Saved Login: INCLUDED"
          echo "Android API 36: VERIFIED"
          echo "Package: org.rkms.connect"
          echo

          ls -lh release/


      # ============================================================
      # 41. UPLOAD FINAL RELEASE APK ONLY
      # ============================================================
      - name: Upload final Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-ANDROID16-API36-FINAL-RELEASE-APK
          path: |
            ${{ env.RKMS_SOURCE_DIR }}/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            ${{ env.RKMS_SOURCE_DIR }}/release/RKMS_ANDROID16_API36_SHA256.txt
          if-no-files-found: error
          retention-days: 30

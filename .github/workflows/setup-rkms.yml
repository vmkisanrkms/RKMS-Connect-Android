name: RKMS Final Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  AGP_VERSION: "8.9.1"
  GRADLE_VERSION: "8.11.1"
  APP_ID: "org.rkms.connect"

# ============================================================
# FINAL SOURCE ZIP
# ============================================================
#
# Contains:
# FCM token reconciliation
# Notification tap -> exact Chat
# Duplicate navigation protection
# Step-by-step Back flow
# Chat badge
# Android 16 / API 36
#
# ============================================================

  SOURCE_ZIP: "RKMS_CONNECT_MASTER_AUDITED_NOTIFICATION_CHAT_FINAL_20260924.zip"

jobs:
  build-release-apk:
    name: Build Signed Release APK
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail

          java -version
          javac -version

      # ============================================================
      # 3. NODE 22
      # ============================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Node and npm
        shell: bash
        run: |
          set -euo pipefail

          node --version
          npm --version

      # ============================================================
      # 4. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android API 36 and Build Tools
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "Android SDK packages installed successfully."

      - name: Verify Android SDK tools
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          command -v adb
          command -v sdkmanager

          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" version
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" version

          adb version
          sdkmanager --version

      # ============================================================
      # 5. LOCATE FINAL RKMS ZIP
      # ============================================================
      - name: Locate RKMS source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Looking for final source ZIP:"
          echo "$SOURCE_ZIP"

          if [ ! -f "$SOURCE_ZIP" ]; then
            FOUND_ZIP="$(
              find . \
                -type f \
                -name "$SOURCE_ZIP" \
                -print -quit || true
            )"

            if [ -z "$FOUND_ZIP" ]; then
              echo "ERROR: Final source ZIP not found."
              echo
              echo "Expected:"
              echo "$SOURCE_ZIP"
              echo
              echo "ZIP files available:"
              find . \
                -type f \
                -iname "*.zip" \
                -print || true
              exit 1
            fi

            cp "$FOUND_ZIP" "./$SOURCE_ZIP"
          fi

          test -f "$SOURCE_ZIP"

          echo "FINAL SOURCE ZIP FOUND:"
          ls -lh "$SOURCE_ZIP"

      # ============================================================
      # 6. EXTRACT SOURCE
      # ============================================================
      - name: Extract RKMS source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source extracted

          mkdir -p source
          mkdir -p extracted

          unzip -q "$SOURCE_ZIP" -d extracted

          PACKAGE_JSON="$(
            find extracted \
              -type f \
              -name package.json \
              -print -quit || true
          )"

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json not found inside ZIP."
            exit 1
          fi

          SOURCE_ROOT="$(dirname "$PACKAGE_JSON")"

          cp -a "$SOURCE_ROOT"/. source/

          echo "SOURCE_ROOT=$SOURCE_ROOT"

          test -f source/package.json

      # ============================================================
      # 7. REQUIRED SOURCE FILES
      # ============================================================
      - name: Verify required source files
        shell: bash
        run: |
          set -euo pipefail

          cd source

          REQUIRED_FILES=(
            "package.json"
            "package-lock.json"
            "app.js"
            "index.html"
            "styles.css"
            "capacitor.config.json"
            "google-services.json"
            "scripts/setup-android-native.sh"
            "scripts/configure-android-16.sh"
            "scripts/configure-release-signing.sh"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            test -f "$file" || {
              echo "ERROR: Missing required file: $file"
              exit 1
            }

            echo "FOUND: $file"
          done

          echo "Required source files: PASS"

      # ============================================================
      # 8. CAPACITOR VERSIONS
      # ============================================================
      - name: Verify Capacitor versions
        shell: bash
        run: |
          set -euo pipefail

          cd source

          node <<'NODE'
          const fs = require('fs');

          const pkg = JSON.parse(
            fs.readFileSync('package.json', 'utf8')
          );

          const expected = {
            '@capacitor/core': '6.2.2',
            '@capacitor/android': '6.2.2',
            '@capacitor/app': '6.0.3',
            '@capacitor/push-notifications': '6.0.3',
            '@capacitor/cli': '6.2.2'
          };

          const all = {
            ...(pkg.dependencies || {}),
            ...(pkg.devDependencies || {})
          };

          for (const [name, version] of Object.entries(expected)) {
            if (all[name] !== version) {
              console.error(
                `ERROR: ${name} expected ${version}, found ${all[name] || 'missing'}`
              );
              process.exit(1);
            }

            console.log(`PASS: ${name} ${version}`);
          }
          NODE

      # ============================================================
      # 9. CAPACITOR CONFIG
      # ============================================================
      - name: Verify Capacitor configuration
        shell: bash
        run: |
          set -euo pipefail

          cd source

          grep -q '"appId"[[:space:]]*:[[:space:]]*"org.rkms.connect"' \
            capacitor.config.json

          grep -q '"webDir"[[:space:]]*:[[:space:]]*"dist"' \
            capacitor.config.json

          echo "Capacitor APP ID: PASS"
          echo "Capacitor webDir: PASS"

      # ============================================================
      # 10. FIREBASE CONFIG
      # ============================================================
      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd source

          test -s google-services.json

          grep -q \
            '"package_name"[[:space:]]*:[[:space:]]*"org.rkms.connect"' \
            google-services.json

          echo "Firebase package: PASS"

      # ============================================================
      # 11. JAVASCRIPT SYNTAX
      # ============================================================
      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          cd source

          node --check app.js

          echo "app.js syntax: PASS"

      # ============================================================
      # 12. VERIFICATION SCRIPTS
      # ============================================================
      - name: Verify FCM pipeline
        shell: bash
        run: |
          set -euo pipefail
          cd source

          if [ -f scripts/verify-fcm-pipeline.py ]; then
            python3 scripts/verify-fcm-pipeline.py
          fi

      - name: Verify WebView notification routing
        shell: bash
        run: |
          set -euo pipefail
          cd source

          if [ -f scripts/verify-webview-notification-fix.py ]; then
            python3 scripts/verify-webview-notification-fix.py
          fi

      - name: Verify saved login
        shell: bash
        run: |
          set -euo pipefail
          cd source

          if [ -f scripts/verify-saved-login.py ]; then
            python3 scripts/verify-saved-login.py
          fi

      - name: Verify native bridge
        shell: bash
        run: |
          set -euo pipefail
          cd source

          if [ -f scripts/verify-native-bridge.py ]; then
            python3 scripts/verify-native-bridge.py
          fi

      - name: Verify RKMS final
        shell: bash
        run: |
          set -euo pipefail
          cd source

          if [ -f scripts/verify-rkms-final.py ]; then
            python3 scripts/verify-rkms-final.py
          fi

      - name: Verify chat microphone
        shell: bash
        run: |
          set -euo pipefail
          cd source

          if [ -f scripts/verify-chat-mic-final.py ]; then
            python3 scripts/verify-chat-mic-final.py
          fi

      - name: Verify final three point fix
        shell: bash
        run: |
          set -euo pipefail
          cd source

          if [ -f scripts/verify-final-three-point-fix.py ]; then
            python3 scripts/verify-final-three-point-fix.py
          fi

      - name: Verify Android 16
        shell: bash
        run: |
          set -euo pipefail
          cd source

          if [ -f scripts/verify-android-16.py ]; then
            python3 scripts/verify-android-16.py
          fi

      # ============================================================
      # 13. FINAL FCM + NAVIGATION + BACK FIX
      # ============================================================
      - name: Verify final notification navigation and back flow
        shell: bash
        run: |
          set -euo pipefail

          cd source

          echo "Checking final FCM token reconciliation..."

          if [ -f FCM_TOKEN_RECONCILIATION_FIX_20260924.md ]; then
            grep -q "FirebaseMessaging" \
              FCM_TOKEN_RECONCILIATION_FIX_20260924.md
          fi

          grep -q "rkmsNativeFcmToken" app.js
          grep -q "refreshFcmToken" app.js
          grep -q "Push.register" app.js

          echo "FCM token reconciliation: PASS"

          echo "Checking notification -> exact conversation routing..."

          grep -q "conversation_id" app.js
          grep -q "rkmsOpenNotificationRoute" app.js
          grep -q "chatRouteConversationId" app.js

          echo "Notification exact-chat routing: PASS"

          echo "Checking chat notification fix..."

          test -f FCM_CHAT_BADGE_TAP_FIX_20260924.md

          grep -q "conversation_id" \
            FCM_CHAT_BADGE_TAP_FIX_20260924.md

          grep -q "rkms_chat" \
            FCM_CHAT_BADGE_TAP_FIX_20260924.md

          echo "Chat badge + notification tap source: PASS"

          echo "Checking notification navigation documentation..."

          if [ -f NOTIFICATION_TAP_CHAT_FIX_20260923.md ]; then
            grep -q "conversation_id" \
              NOTIFICATION_TAP_CHAT_FIX_20260923.md
          fi

          echo "Notification tap routing documentation: PASS"

          echo "Final navigation source verification: PASS"

      # ============================================================
      # 14. NPM
      # ============================================================
      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd source

          npm ci --no-audit --no-fund

      - name: Verify installed push notifications
        shell: bash
        run: |
          set -euo pipefail

          cd source

          node -e "
            const p=require('./node_modules/@capacitor/push-notifications/package.json');

            if(p.version!=='6.0.3'){
              console.error('Wrong push-notifications version:',p.version);
              process.exit(1);
            }

            console.log('push-notifications:',p.version);
          "

      # ============================================================
      # 15. WEB BUILD
      # ============================================================
      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd source

          npm run build

          test -d dist
          test -f dist/index.html

          echo "Web build: PASS"

      # ============================================================
      # 16. FRESH ANDROID PROJECT
      # ============================================================
      - name: Create fresh Android project
        shell: bash
        run: |
          set -euo pipefail

          cd source

          rm -rf android

          npx cap add android

          test -d android
          test -f android/gradlew

      # ============================================================
      # 17. ANDROID 16
      # ============================================================
      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd source

          chmod +x scripts/configure-android-16.sh

          ./scripts/configure-android-16.sh

      - name: Enforce Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          cd source

          if [ -f android/variables.gradle ]; then

            sed -i \
              -E 's/compileSdkVersion[[:space:]]*=[[:space:]]*[0-9]+/compileSdkVersion = 36/' \
              android/variables.gradle || true

            sed -i \
              -E 's/targetSdkVersion[[:space:]]*=[[:space:]]*[0-9]+/targetSdkVersion = 36/' \
              android/variables.gradle || true

            sed -i \
              -E 's/minSdkVersion[[:space:]]*=[[:space:]]*[0-9]+/minSdkVersion = 23/' \
              android/variables.gradle || true

          fi

          grep -q "compileSdkVersion = 36" \
            android/variables.gradle

          grep -q "targetSdkVersion = 36" \
            android/variables.gradle

          echo "compileSdk/targetSdk 36: PASS"

      # ============================================================
      # 18. CAP SYNC
      # ============================================================
      - name: Sync Capacitor
        shell: bash
        run: |
          set -euo pipefail

          cd source

          npx cap sync android

      # ============================================================
      # 19. RKMS NATIVE SETUP
      # ============================================================
      - name: Setup RKMS Android native integration
        shell: bash
        run: |
          set -euo pipefail

          cd source

          chmod +x scripts/setup-android-native.sh

          ./scripts/setup-android-native.sh

          test -f \
            android/app/src/main/java/org/rkms/connect/RKMSNativeBridge.java

      # ============================================================
      # 20. GOOGLE SERVICES 4.4.3
      # ============================================================
      - name: Ensure Google Services plugin version
        shell: bash
        run: |
          set -euo pipefail

          cd source

          test -f android/build.gradle
          test -f android/app/build.gradle

          if ! grep -q \
            "com.google.gms:google-services:4.4.3" \
            android/build.gradle; then

            python3 - <<'PY'
          from pathlib import Path

          p = Path("android/build.gradle")
          text = p.read_text()

          if "com.google.gms:google-services:4.4.3" not in text:

              marker = "dependencies {"

              if marker not in text:
                  raise SystemExit(
                      "android/build.gradle dependencies block missing"
                  )

              text = text.replace(
                  marker,
                  marker +
                  '\n        classpath "com.google.gms:google-services:4.4.3"',
                  1
              )

              p.write_text(text)
          PY
          fi

          if ! grep -q \
            "com.google.gms.google-services" \
            android/app/build.gradle; then

            printf '\napply plugin: "com.google.gms.google-services"\n' \
              >> android/app/build.gradle
          fi

      - name: Verify Google Services plugin
        shell: bash
        run: |
          set -euo pipefail

          cd source

          grep -q \
            "com.google.gms:google-services:4.4.3" \
            android/build.gradle

          grep -q \
            "com.google.gms.google-services" \
            android/app/build.gradle

          echo "Google Services: PASS"

      # ============================================================
      # 21. FIREBASE NATIVE
      # ============================================================
      - name: Verify Firebase native configuration
        shell: bash
        run: |
          set -euo pipefail

          cd source

          test -f android/app/google-services.json

          grep -q \
            '"package_name"[[:space:]]*:[[:space:]]*"org.rkms.connect"' \
            android/app/google-services.json

          echo "Firebase native configuration: PASS"

      # ============================================================
      # 22. MAIN ACTIVITY
      # ============================================================
      - name: Verify MainActivity
        shell: bash
        run: |
          set -euo pipefail

          cd source

          MAIN_ACTIVITY="$(
            find android/app/src/main \
              -type f \
              -name MainActivity.java \
              -print -quit || true
          )"

          test -n "$MAIN_ACTIVITY"

          grep -q "RKMSNativeBridge" "$MAIN_ACTIVITY"
          grep -q "FirebaseApp.initializeApp" "$MAIN_ACTIVITY"
          grep -q "onNewIntent" "$MAIN_ACTIVITY"
          grep -q "conversation_id" "$MAIN_ACTIVITY"
          grep -q "rkmsOpenNotificationRoute" "$MAIN_ACTIVITY"

          echo "MainActivity notification routing: PASS"

      # ============================================================
      # 23. FIREBASE MESSAGING
      # ============================================================
      - name: Ensure Firebase Messaging dependency
        shell: bash
        run: |
          set -euo pipefail

          cd source

          APP_GRADLE="android/app/build.gradle"

          if ! grep -q "firebase-messaging" "$APP_GRADLE"; then

            python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          text = p.read_text()

          dependency = """
              implementation 'com.google.firebase:firebase-messaging:25.0.1'
          """

          if "dependencies {" not in text:
              raise SystemExit("dependencies block not found")

          text = text.replace(
              "dependencies {",
              "dependencies {" + dependency,
              1
          )

          p.write_text(text)
          PY

          fi

          grep -q "firebase-messaging" "$APP_GRADLE"

          echo "Firebase Messaging dependency: PASS"

      # ============================================================
      # 24. FINAL ANDROID CONFIG
      # ============================================================
      - name: Verify final Android configuration
        shell: bash
        run: |
          set -euo pipefail

          cd source

          test -f android/gradlew

          chmod +x android/gradlew

          grep -n "distributionUrl" \
            android/gradle/wrapper/gradle-wrapper.properties

          grep -q \
            "gradle-8.11.1-bin.zip" \
            android/gradle/wrapper/gradle-wrapper.properties

          grep -q \
            "com.android.tools.build:gradle:8.9.1" \
            android/build.gradle

          echo "Android configuration: PASS"

      # ============================================================
      # 25. GRADLE DEPENDENCIES
      # ============================================================
      - name: Resolve Gradle dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd source/android

          ./gradlew \
            --no-daemon \
            --stacktrace \
            dependencies

      # ============================================================
      # 26. STATIC ANDROID AUDIT
      # ============================================================
      - name: Static Android audit
        shell: bash
        run: |
          set -euo pipefail

          cd source

          MAIN_ACTIVITY="$(
            find android/app/src/main \
              -type f \
              -name MainActivity.java \
              -print -quit
          )"

          test -n "$MAIN_ACTIVITY"

          grep -q "FirebaseApp.initializeApp" "$MAIN_ACTIVITY"
          grep -q "RKMSNativeBridge" "$MAIN_ACTIVITY"
          grep -q "onNewIntent" "$MAIN_ACTIVITY"
          grep -q "conversation_id" "$MAIN_ACTIVITY"
          grep -q "rkmsOpenNotificationRoute" "$MAIN_ACTIVITY"

          grep -Rqs "POST_NOTIFICATIONS" \
            android/app/src/main

          grep -Rqs "RECORD_AUDIO" \
            android/app/src/main

          grep -Rqs "rkms_notifications_v3" \
            android/app/src/main

          grep -Rqs "rkms_priority_v2" \
            android/app/src/main

          echo "Static Android audit: PASS"

      # ============================================================
      # 27. SIGNING SECRETS
      # ============================================================
      - name: Verify release signing secrets
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$RKMS_KEYSTORE_BASE64"
          test -n "$RKMS_KEYSTORE_PASSWORD"
          test -n "$RKMS_KEY_ALIAS"
          test -n "$RKMS_KEY_PASSWORD"

          echo "Release signing secrets: PASS"

      # ============================================================
      # 28. CONFIGURE RELEASE SIGNING
      # ============================================================
      - name: Configure release signing
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd source

          chmod +x scripts/configure-release-signing.sh

          ./scripts/configure-release-signing.sh

      # ============================================================
      # 29. VERIFY SIGNING CONFIGURATION
      # ============================================================
      - name: Verify release signing configuration
        shell: bash
        env:
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd source

          APP_GRADLE="android/app/build.gradle"
          KEYSTORE="android/app/release.keystore"

          test -f "$APP_GRADLE"
          test -f "$KEYSTORE"

          grep -q "signingConfigs" "$APP_GRADLE"
          grep -q "release {" "$APP_GRADLE"
          grep -q "storeFile file(\"release.keystore\")" "$APP_GRADLE"
          grep -q "System.getenv(\"RKMS_KEYSTORE_PASSWORD\")" "$APP_GRADLE"
          grep -q "System.getenv(\"RKMS_KEY_ALIAS\")" "$APP_GRADLE"
          grep -q "System.getenv(\"RKMS_KEY_PASSWORD\")" "$APP_GRADLE"
          grep -q "signingConfig signingConfigs.release" "$APP_GRADLE"

          if grep -q "RKMS_KEYSTORE_ABS" "$APP_GRADLE"; then
            echo "ERROR: obsolete RKMS_KEYSTORE_ABS reference found."
            exit 1
          fi

          echo "Release signing configuration: PASS"

      # ============================================================
      # 30. KEYSTORE VALIDATION
      # ============================================================
      - name: Validate release keystore
        shell: bash
        env:
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          cd source

          KEYSTORE="android/app/release.keystore"

          test -f "$KEYSTORE"

          keytool \
            -list \
            -keystore "$KEYSTORE" \
            -storepass "$RKMS_KEYSTORE_PASSWORD" \
            >/dev/null

          echo "Keystore validation: PASS"

      # ============================================================
      # 31. GRADLE VERSION
      # ============================================================
      - name: Verify Gradle version
        shell: bash
        run: |
          set -euo pipefail

          cd source/android

          ./gradlew --version

      # ============================================================
      # 32. FIX MAINACTIVITY JAVA SYNTAX
      # ============================================================
      - name: Fix MainActivity Java syntax
        shell: bash
        run: |
          set -euo pipefail

          cd source

          MAIN_ACTIVITY="$(
            find android/app/src/main \
              -type f \
              -name MainActivity.java \
              -print -quit || true
          )"

          test -n "$MAIN_ACTIVITY"

          sed -i \
            's/""NOT_READY""/"NOT_READY"/g' \
            "$MAIN_ACTIVITY"

          sed -i \
            's/""ERROR""/"ERROR"/g' \
            "$MAIN_ACTIVITY"

          sed -i \
            's/""WAIT""/"WAIT"/g' \
            "$MAIN_ACTIVITY"

          if grep -q \
            '""NOT_READY""\|""ERROR""\|""WAIT""' \
            "$MAIN_ACTIVITY"; then

            echo "ERROR: Malformed Java quotes still present."
            exit 1
          fi

          echo "MainActivity Java syntax fix: PASS"

      # ============================================================
      # 33. VALIDATE RELEASE CONFIGURATION
      # ============================================================
      - name: Validate release configuration
        shell: bash
        env:
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd source/android

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:compileReleaseJavaWithJavac \
            :app:processReleaseMainManifest

      # ============================================================
      # 34. CLEAN
      # ============================================================
      - name: Clean release build
        shell: bash
        run: |
          set -euo pipefail

          cd source/android

          ./gradlew \
            --no-daemon \
            clean

      # ============================================================
      # 35. ONLY SIGNED RELEASE APK
      # ============================================================
      - name: Build Signed Release APK
        shell: bash
        env:
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd source/android

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleRelease

      # ============================================================
      # 36. VERIFY APK
      # ============================================================
      - name: Verify release APK output
        shell: bash
        run: |
          set -euo pipefail

          cd source

          APK="$(
            find android/app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              -print -quit || true
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not generated."
            exit 1
          fi

          case "$APK" in
            *debug*)
              echo "ERROR: Debug APK detected."
              exit 1
              ;;
          esac

          ls -lh "$APK"

          echo "Release APK output: PASS"

      # ============================================================
      # 37. NO AAB
      # ============================================================
      - name: Verify no AAB is required
        shell: bash
        run: |
          set -euo pipefail

          cd source

          if find android/app/build/outputs \
            -type f \
            -name "*.aab" \
            | grep -q .; then

            echo "ERROR: AAB generated."
            exit 1
          fi

          echo "APK-only output: PASS"

      # ============================================================
      # 38. VERIFY PACKAGE
      # ============================================================
      - name: Verify APK package name
        shell: bash
        run: |
          set -euo pipefail

          cd source

          APK="$(
            find android/app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              -print -quit
          )"

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"

          PACKAGE_NAME="$(
            "$AAPT" dump badging "$APK" \
              | sed -n "s/^package: name='\([^']*\)'.*/\1/p" \
              | head -1
          )"

          echo "APK package: $PACKAGE_NAME"

          test "$PACKAGE_NAME" = "org.rkms.connect"

          echo "Package name: PASS"

      # ============================================================
      # 39. VERIFY SIGNATURE
      # ============================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          cd source

          APK="$(
            find android/app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              -print -quit
          )"

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

          echo "APK signature: PASS"

      # ============================================================
      # 40. VERIFY APK IS RELEASE
      # ============================================================
      - name: Verify APK is release signed
        shell: bash
        run: |
          set -euo pipefail

          cd source

          APK="$(
            find android/app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              -print -quit
          )"

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

          echo "Release APK signature verification: PASS"

      # ============================================================
      # 41. SHA256
      # ============================================================
      - name: Generate APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd source

          APK="$(
            find android/app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              -print -quit
          )"

          sha256sum "$APK"

      # ============================================================
      # 42. PREPARE FINAL APK
      # ============================================================
      - name: Prepare final APK
        shell: bash
        run: |
          set -euo pipefail

          cd source

          APK="$(
            find android/app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              -print -quit
          )"

          test -n "$APK"
          test -f "$APK"

          cp "$APK" \
            ../RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk

          sha256sum \
            ../RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk \
            > ../RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk.sha256

          test -s \
            ../RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk

          test -s \
            ../RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk.sha256

          ls -lh \
            ../RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk \
            ../RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk.sha256

      # ============================================================
      # 43. FINAL ARTIFACT CHECK
      # ============================================================
      - name: Final artifact check
        shell: bash
        run: |
          set -euo pipefail

          test -f RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk
          test -f RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk.sha256

          echo
          echo "=============================================="
          echo "RKMS FINAL SIGNED RELEASE APK READY"
          echo "=============================================="

      # ============================================================
      # 44. UPLOAD ONLY FINAL SIGNED APK
      # ============================================================
      - name: Upload final signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-CONNECT-FINAL-SIGNED-RELEASE-APK
          if-no-files-found: error
          path: |
            RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk
            RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk.sha256

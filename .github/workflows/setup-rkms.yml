name: Build RKMS Connect APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. Setup Node.js
      # =========================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # =========================================================
      # 3. Extract EXACT V1D source ZIP
      # =========================================================
      - name: Extract RKMS Connect V1D source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build-project
          mkdir -p build-project

          SOURCE_ZIP="RKMS_CONNECT_V1D_FULL_FIX_CORRECTED_FINAL_FIXED_v2.zip"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERROR: Required V1D ZIP not found:"
            echo "$SOURCE_ZIP"
            echo
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          echo "Using EXACT V1D source:"
          echo "$SOURCE_ZIP"

          unzip -t "$SOURCE_ZIP"

          unzip -q "$SOURCE_ZIP" -d build-project

          echo "V1D ZIP extracted."


      # =========================================================
      # 4. Locate source safely
      # =========================================================
      - name: Locate RKMS source
        shell: bash
        run: |
          set -euo pipefail

          APP_JS="$(find build-project -type f -name "app.js" -print -quit)"

          if [ -z "$APP_JS" ]; then
            echo "ERROR: app.js not found inside V1D ZIP."
            find build-project -maxdepth 5 -type f | sort
            exit 1
          fi

          SOURCE_DIR="$(dirname "$APP_JS")"

          echo "RKMS source directory:"
          echo "$SOURCE_DIR"

          rm -rf rkms-source
          mkdir -p rkms-source

          rsync -a "$SOURCE_DIR"/ rkms-source/

          test -f rkms-source/app.js
          test -f rkms-source/index.html
          test -f rkms-source/config.js

          echo "RKMS V1D source verified."


      # =========================================================
      # 5. Verify JavaScript
      # =========================================================
      - name: Verify JavaScript
        shell: bash
        run: |
          set -euo pipefail

          node --check rkms-source/app.js

          echo "app.js syntax PASS."


      # =========================================================
      # 6. Verify Member Dashboard
      # =========================================================
      - name: Verify Member Dashboard
        shell: bash
        run: |
          set -euo pipefail

          grep -q "function renderMemberDashboard" \
            rkms-source/app.js

          grep -q 'name==="member-dashboard"' \
            rkms-source/app.js

          echo "Member Dashboard verification PASS."


      # =========================================================
      # 7. Verify V1D fixes 1-8
      # =========================================================
      - name: Verify V1D fixes 1 to 8
        shell: bash
        run: |
          set -euo pipefail

          FILE="rkms-source/app.js"

          echo "Checking V1D fixes..."

          # 1. Digital ID area
          grep -q "memberAreaLabel" "$FILE"

          # 2. Digital ID PDF
          grep -q "downloadPdf" "$FILE"
          grep -q "pdfBlobFromCanvas" "$FILE"

          # 3. Print
          grep -q "printPage" "$FILE"

          # 4. Profile
          grep -q "renderMemberProfile" "$FILE"
          grep -q "member-profile" "$FILE"

          # 5. National President certificate
          grep -q "nationalName" "$FILE"
          grep -q "nationalPost" "$FILE"

          # 6. Certificate PDF
          grep -q "data-download-pdf" "$FILE"

          # 7. Logo
          test -s rkms-source/assets/rkms-logo-transparent.png

          # 8. Saved credentials
          grep -q "rkmsSaveLoginCredentials" "$FILE"

          echo "V1D fixes 1-8 verification PASS."


      # =========================================================
      # 8. PDF pipeline verification
      # =========================================================
      - name: Verify PDF pipeline
        working-directory: rkms-source
        shell: bash
        run: |
          set -euo pipefail

          test -f scripts/verify-pdf-pipeline.py

          python3 scripts/verify-pdf-pipeline.py

          echo "PDF pipeline verification PASS."


      # =========================================================
      # 9. Report download security verification
      # =========================================================
      - name: Verify report download security
        working-directory: rkms-source
        shell: bash
        run: |
          set -euo pipefail

          test -f scripts/verify-report-download-scope.py

          python3 scripts/verify-report-download-scope.py

          echo "Report download security verification PASS."


      # =========================================================
      # 10. Native bridge source verification
      # =========================================================
      - name: Verify native bridge source
        working-directory: rkms-source
        shell: bash
        run: |
          set -euo pipefail

          test -f scripts/verify-native-bridge.py

          python3 scripts/verify-native-bridge.py

          echo "Native bridge source verification PASS."


      # =========================================================
      # 11. RKMS final verification
      # =========================================================
      - name: RKMS final static verification
        working-directory: rkms-source
        shell: bash
        run: |
          set -euo pipefail

          test -f scripts/verify-rkms-final.py

          python3 scripts/verify-rkms-final.py

          echo "RKMS final static verification PASS."


      # =========================================================
      # 12. Create Capacitor package
      # =========================================================
      - name: Create Capacitor build package
        working-directory: rkms-source
        shell: bash
        run: |
          set -euo pipefail

          cat > package.json <<'JSON'
          {
            "name": "rkms-connect",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "rm -rf dist && mkdir -p dist && rsync -a --exclude='dist/' --exclude='android/' --exclude='node_modules/' --exclude='.git/' --exclude='.github/' --exclude='*.zip' ./ dist/"
            },
            "dependencies": {
              "@capacitor/core": "6.2.2",
              "@capacitor/android": "6.2.2",
              "@capacitor/app": "6.0.3"
            },
            "devDependencies": {
              "@capacitor/cli": "6.2.2"
            }
          }
          JSON

          cat > capacitor.config.json <<'JSON'
          {
            "appId": "org.rkms.connect",
            "appName": "RKMS",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https",
              "cleartext": true
            },
            "android": {
              "allowMixedContent": true,
              "captureInput": true,
              "webContentsDebuggingEnabled": false
            }
          }
          JSON

          echo "Capacitor package created."


      # =========================================================
      # 13. Install dependencies
      # =========================================================
      - name: Install Capacitor dependencies
        working-directory: rkms-source
        run: |
          npm install --no-audit --no-fund


      # =========================================================
      # 14. Build web application
      # =========================================================
      - name: Build RKMS web application
        working-directory: rkms-source
        run: |
          npm run build

          test -f dist/index.html
          test -f dist/app.js
          test -f dist/config.js

          echo "RKMS web build PASS."


      # =========================================================
      # 15. Setup Java 21
      # =========================================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle


      # =========================================================
      # 16. Setup Android SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # =========================================================
      # 17. Install Android SDK
      # =========================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK ready."


      # =========================================================
      # 18. Create Android platform
      # =========================================================
      - name: Create Android platform
        working-directory: rkms-source
        run: |
          set -euo pipefail

          npx cap add android

          echo
          echo "Generated Android Java/Kotlin files:"
          find android/app/src/main -type f \
            \( -name "MainActivity.java" -o -name "MainActivity.kt" \) \
            -print

          echo

          MAIN_ACTIVITY="$(find android/app/src/main -type f \
            \( -name "MainActivity.java" -o -name "MainActivity.kt" \) \
            -print -quit)"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: Capacitor did not generate MainActivity."
            find android/app/src/main -type f | sort
            exit 1
          fi

          echo "Generated MainActivity:"
          echo "$MAIN_ACTIVITY"


      # =========================================================
      # 19. Verify generated MainActivity BEFORE native setup
      # =========================================================
      - name: Verify generated MainActivity
        working-directory: rkms-source
        shell: bash
        run: |
          set -euo pipefail

          MAIN_ACTIVITY="$(find android/app/src/main -type f \
            \( -name "MainActivity.java" -o -name "MainActivity.kt" \) \
            -print -quit)"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity not found."
            exit 1
          fi

          echo "Using:"
          echo "$MAIN_ACTIVITY"

          grep -q "BridgeActivity" "$MAIN_ACTIVITY" || {
            echo "ERROR: MainActivity does not extend Capacitor BridgeActivity."
            cat "$MAIN_ACTIVITY"
            exit 1
          }

          echo "Generated MainActivity verification PASS."


      # =========================================================
      # 20. Setup RKMS native bridge
      # =========================================================
      - name: Setup RKMS Android native bridge
        working-directory: rkms-source
        shell: bash
        run: |
          set -euo pipefail

          test -f scripts/setup-android-native.sh

          chmod +x scripts/setup-android-native.sh

          bash scripts/setup-android-native.sh

          echo "RKMS native bridge setup completed."


      # =========================================================
      # 21. Verify native files actually exist
      # =========================================================
      - name: Verify native bridge files
        working-directory: rkms-source
        shell: bash
        run: |
          set -euo pipefail

          find android/app/src/main/java -type f | sort

          RKMS_BRIDGE="$(find android/app/src/main/java -type f \
            -name "RKMSNativeBridge.java" -print -quit)"

          SECURE_PLUGIN="$(find android/app/src/main/java -type f \
            -name "RKMSSecureCredentialsPlugin.java" -print -quit)"

          if [ -z "$RKMS_BRIDGE" ]; then
            echo "ERROR: RKMSNativeBridge.java was not generated."
            exit 1
          fi

          if [ -z "$SECURE_PLUGIN" ]; then
            echo "ERROR: RKMSSecureCredentialsPlugin.java was not generated."
            exit 1
          fi

          echo "Native bridge:"
          echo "$RKMS_BRIDGE"

          echo "Secure credential plugin:"
          echo "$SECURE_PLUGIN"

          echo "Native bridge files PASS."


      # =========================================================
      # 22. Sync Capacitor
      # =========================================================
      - name: Sync RKMS application
        working-directory: rkms-source
        run: |
          npx cap sync android


      # =========================================================
      # 23. Find MainActivity after sync
      # =========================================================
      - name: Verify MainActivity after Capacitor sync
        working-directory: rkms-source
        shell: bash
        run: |
          set -euo pipefail

          MAIN_ACTIVITY="$(find android/app/src/main -type f \
            \( -name "MainActivity.java" -o -name "MainActivity.kt" \) \
            -print -quit)"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity disappeared after cap sync."
            find android/app/src/main -type f | sort
            exit 1
          fi

          echo "MainActivity after sync:"
          echo "$MAIN_ACTIVITY"


      # =========================================================
      # 24. Verify generated Android PDF bridge
      # =========================================================
      - name: Verify generated Android PDF bridge
        working-directory: rkms-source
        shell: bash
        run: |
          set -euo pipefail

          MAIN_ACTIVITY="$(find android/app/src/main -type f \
            -name "MainActivity.java" -print -quit)"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: Java MainActivity not found for PDF bridge verification."
            echo "Generated Android files:"
            find android/app/src/main -type f | sort
            exit 1
          fi

          echo "PDF bridge verifier target:"
          echo "$MAIN_ACTIVITY"

          # The old verifier used a hard-coded path.
          # V1D uses the actual generated MainActivity discovered above.

          python3 - "$MAIN_ACTIVITY" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          checks = [
              "import android.content.ContentValues;",
              "import android.media.MediaScannerConnection;",
              "import android.os.Environment;",
              "import android.provider.MediaStore;",
              "import android.util.Base64;",
              "beginPdfSave(String filename)",
              "appendPdfChunk(String base64Chunk)",
              "finishPdfSave()",
              "cancelPdfSave()",
              "MediaStore.Downloads.EXTERNAL_CONTENT_URI",
              "MediaStore.Downloads.RELATIVE_PATH",
              'Environment.DIRECTORY_DOWNLOADS + "/RKMS CONNECT"',
              "application/pdf",
          ]

          missing = [x for x in checks if x not in s]

          if missing:
              print("ANDROID PDF BRIDGE: FAIL")
              print("Target:", p)
              print("Missing:")
              print("\n".join(missing))
              raise SystemExit(1)

          print("ANDROID PDF BRIDGE: PASS")
          print("Target:", p)
          PY


      # =========================================================
      # 25. Verify generated MainActivity native registration
      # =========================================================
      - name: Verify generated MainActivity native registration
        working-directory: rkms-source
        shell: bash
        run: |
          set -euo pipefail

          MAIN_ACTIVITY="$(find android/app/src/main -type f \
            -name "MainActivity.java" -print -quit)"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.java not found."
            exit 1
          fi

          echo "Checking:"
          echo "$MAIN_ACTIVITY"

          grep -q "RKMSNativeBridge" "$MAIN_ACTIVITY"

          grep -q "RKMSSecureCredentialsPlugin" "$MAIN_ACTIVITY"

          grep -q "getBridge().getWebView()" "$MAIN_ACTIVITY"

          echo "MainActivity native registration PASS."


      # =========================================================
      # 26. Install ImageMagick
      # =========================================================
      - name: Install ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick


      # =========================================================
      # 27. Install corrected RKMS launcher logo
      # =========================================================
      - name: Install RKMS launcher logo
        shell: bash
        run: |
          set -euo pipefail

          LOGO="rkms-source/assets/rkms-logo-transparent.png"

          RES="rkms-source/android/app/src/main/res"

          STRINGS="rkms-source/android/app/src/main/res/values/strings.xml"

          test -s "$LOGO"

          mkdir -p \
            "$RES/mipmap-mdpi" \
            "$RES/mipmap-hdpi" \
            "$RES/mipmap-xhdpi" \
            "$RES/mipmap-xxhdpi" \
            "$RES/mipmap-xxxhdpi"

          # =======================================================
          # V1D corrected safe-area logo sizes
          # =======================================================

          convert "$LOGO" \
            -resize 26x26 \
            -strip \
            -gravity center \
            -background none \
            -extent 48x48 \
            "$RES/mipmap-mdpi/ic_launcher.png"

          convert "$LOGO" \
            -resize 39x39 \
            -strip \
            -gravity center \
            -background none \
            -extent 72x72 \
            "$RES/mipmap-hdpi/ic_launcher.png"

          convert "$LOGO" \
            -resize 52x52 \
            -strip \
            -gravity center \
            -background none \
            -extent 96x96 \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          convert "$LOGO" \
            -resize 78x78 \
            -strip \
            -gravity center \
            -background none \
            -extent 144x144 \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          convert "$LOGO" \
            -resize 104x104 \
            -strip \
            -gravity center \
            -background none \
            -extent 192x192 \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"


          cp "$RES/mipmap-mdpi/ic_launcher.png" \
             "$RES/mipmap-mdpi/ic_launcher_round.png"

          cp "$RES/mipmap-hdpi/ic_launcher.png" \
             "$RES/mipmap-hdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xhdpi/ic_launcher.png" \
             "$RES/mipmap-xhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxxhdpi/ic_launcher_round.png"


          # Remove adaptive launcher resources
          rm -rf \
            "$RES/mipmap-anydpi-v26" \
            "$RES/mipmap-anydpi"

          find "$RES" -type f \( \
            -name 'ic_launcher_foreground.xml' -o \
            -name 'ic_launcher_background.xml' -o \
            -name 'ic_launcher_foreground.png' -o \
            -name 'ic_launcher_background.png' \
          \) -delete || true


          if grep -q '<string name="app_name">' "$STRINGS"; then
            sed -i \
              's#<string name="app_name">.*</string>#<string name="app_name">RKMS</string>#' \
              "$STRINGS"
          else
            printf '\n    <string name="app_name">RKMS</string>\n' \
              >> "$STRINGS"
          fi

          echo "V1D launcher logo installed."


      # =========================================================
      # 28. Verify launcher logo
      # =========================================================
      - name: Verify launcher logo
        shell: bash
        run: |
          set -euo pipefail

          RES="rkms-source/android/app/src/main/res"

          for FILE in \
            "$RES/mipmap-mdpi/ic_launcher.png" \
            "$RES/mipmap-hdpi/ic_launcher.png" \
            "$RES/mipmap-xhdpi/ic_launcher.png" \
            "$RES/mipmap-xxhdpi/ic_launcher.png" \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"
          do
            test -s "$FILE"
          done

          test ! -e "$RES/mipmap-anydpi-v26"

          echo "Launcher logo verification PASS."


      # =========================================================
      # 29. Make Gradle executable
      # =========================================================
      - name: Make Gradle executable
        run: |
          chmod +x rkms-source/android/gradlew


      # =========================================================
      # 30. Build Debug APK
      # =========================================================
      - name: Build Debug APK
        working-directory: rkms-source/android
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace


      # =========================================================
      # 31. Verify APK
      # =========================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="rkms-source/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK not generated."
            exit 1
          fi

          echo "V1D APK successfully created:"
          ls -lh "$APK"

          echo
          echo "APK SHA-256:"
          sha256sum "$APK"


      # =========================================================
      # 32. Rename APK
      # =========================================================
      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build
          mkdir -p build

          cp \
            rkms-source/android/app/build/outputs/apk/debug/app-debug.apk \
            build/RKMS-Connect-V1D-Debug.apk

          test -s build/RKMS-Connect-V1D-Debug.apk

          echo "Final V1D APK:"
          ls -lh build/RKMS-Connect-V1D-Debug.apk

          echo
          echo "Final APK SHA-256:"
          sha256sum build/RKMS-Connect-V1D-Debug.apk


      # =========================================================
      # 33. Upload APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-V1D-Debug-APK
          path: build/RKMS-Connect-V1D-Debug.apk
          if-no-files-found: error
          retention-days: 30

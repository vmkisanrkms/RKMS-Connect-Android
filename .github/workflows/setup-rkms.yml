name: Build RKMS CONNECT for iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ios-build:
    name: Build RKMS CONNECT for iOS
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Show environment
        run: |
          node --version
          npm --version
          xcode-select -p
          xcodebuild -version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web application
        run: npm run build

      - name: Add Capacitor iOS platform
        run: npx cap add ios --packagemanager SPM

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Prepare RKMS iOS project
        run: |
          chmod +x scripts/prepare-ios-build.sh
          ./scripts/prepare-ios-build.sh

      - name: Verify iOS project
        run: |
          test -f ios/App/App.xcodeproj/project.pbxproj
          echo "iOS Xcode project verified."

      - name: Build iPhoneOS app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            build

      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build/ios-simulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            build

      - name: Package iOS artifacts
        run: |
          mkdir -p artifacts

          ditto -c -k --sequesterRsrc --keepParent \
            build/ios-device/Build/Products/Release-iphoneos/App.app \
            artifacts/RKMS-iOS-device-unsigned.zip

          ditto -c -k --sequesterRsrc --keepParent \
            build/ios-simulator/Build/Products/Release-iphonesimulator/App.app \
            artifacts/RKMS-iOS-simulator.zip

      - name: Upload iOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-iOS-builds
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

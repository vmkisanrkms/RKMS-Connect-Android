name: RKMS Final Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  AGP_VERSION: "8.9.1"
  GRADLE_VERSION: "8.11.1"
  APP_ID: "org.rkms.connect"

  SOURCE_ZIP: "RKMS_CONNECT_NOTIFICATION_SYSTEM_FULL_FIX_20260923_AUDITED_FIXED.zip"

jobs:
  build-release-apk:
    name: Build Signed Release APK
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ============================================================
      # 3. NODE 22
      # ============================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ============================================================
      # 4. ANDROID SDK SETUP
      #
      # IMPORTANT:
      # v3 requested deprecated "tools".
      # v4 + explicit platform-tools avoids that problem.
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      # ============================================================
      # 5. INSTALL ANDROID API 36 + BUILD TOOLS 36.0.0
      # ============================================================
      - name: Install Android API 36 SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"

          command -v sdkmanager
          sdkmanager --version

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo
          echo "Installed Android SDK components:"
          sdkmanager --list_installed | grep -E \
            "platform-tools|platforms;android-${ANDROID_API}|build-tools;${BUILD_TOOLS}" \
            || true

          test -d \
            "${ANDROID_SDK_ROOT}/platforms/android-${ANDROID_API}"

          test -d \
            "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}"

          echo
          echo "Android API 36 SDK installation: PASS"

      # ============================================================
      # 6. VERIFY SDK TOOLS
      # ============================================================
      - name: Verify Android SDK tools
        shell: bash
        run: |
          set -euo pipefail

          command -v adb
          command -v sdkmanager

          test -x \
            "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/aapt"

          test -x \
            "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/apksigner"

          echo "ADB:"
          adb version

          echo
          echo "SDK Manager:"
          sdkmanager --version

          echo
          echo "Android SDK tools: PASS"

      # ============================================================
      # 7. LOCATE EXACT SOURCE ZIP
      # ============================================================
      - name: Locate RKMS source ZIP
        id: locate_zip
        shell: bash
        run: |
          set -euo pipefail

          echo "Configured source ZIP:"
          echo "${SOURCE_ZIP}"
          echo

          ZIP_PATH="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "${SOURCE_ZIP}" \
            -print -quit)"

          if [ -z "${ZIP_PATH}" ]; then
            echo "ERROR: Configured source ZIP was not found:"
            echo "${SOURCE_ZIP}"
            echo
            echo "Available ZIP files:"
            find "$GITHUB_WORKSPACE" \
              -type f \
              \( -iname "*.zip" -o -iname "*.ZIP" \) \
              -print \
              | sort

            exit 1
          fi

          echo "Source ZIP found:"
          echo "${ZIP_PATH}"

          echo "zip_path=${ZIP_PATH}" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 8. EXTRACT SOURCE
      # ============================================================
      - name: Extract RKMS source
        id: extract_source
        shell: bash
        env:
          ZIP_PATH: ${{ steps.locate_zip.outputs.zip_path }}
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/rkms-extract"
          rm -rf "$RUNNER_TEMP/rkms-source"

          mkdir -p \
            "$RUNNER_TEMP/rkms-extract" \
            "$RUNNER_TEMP/rkms-source"

          unzip -q "$ZIP_PATH" \
            -d "$RUNNER_TEMP/rkms-extract"

          echo "Searching for package.json..."

          PACKAGE_JSON="$(find "$RUNNER_TEMP/rkms-extract" \
            -type f \
            -name "package.json" \
            -print -quit)"

          if [ -z "${PACKAGE_JSON}" ]; then
            echo "ERROR: package.json was not found."

            find "$RUNNER_TEMP/rkms-extract" \
              -maxdepth 5 \
              -type f \
              | sort \
              | head -300

            exit 1
          fi

          SOURCE_ROOT="$(dirname "$PACKAGE_JSON")"

          echo
          echo "Actual source root:"
          echo "${SOURCE_ROOT}"

          cp -a "${SOURCE_ROOT}/." \
            "$RUNNER_TEMP/rkms-source/"

          echo
          echo "Source root files:"
          find "$RUNNER_TEMP/rkms-source" \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -250

      # ============================================================
      # 9. VERIFY REQUIRED SOURCE FILES
      # ============================================================
      - name: Verify RKMS source files
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "package.json"
            "package-lock.json"
            "app.js"
            "index.html"
            "styles.css"
            "capacitor.config.json"
            "google-services.json"
            "scripts/setup-android-native.sh"
            "scripts/configure-android-16.sh"
            "scripts/configure-release-signing.sh"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing:"
              echo "$file"
              exit 1
            fi
          done

          echo "Required source files: PASS"

      # ============================================================
      # 10. VERIFY CAPACITOR VERSIONS
      # ============================================================
      - name: Verify Capacitor package versions
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");

          const p = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const expected = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          const actual = {
            ...(p.dependencies || {}),
            ...(p.devDependencies || {})
          };

          let failed = false;

          for (const [name, version] of Object.entries(expected)) {
            if (actual[name] !== version) {
              console.error(
                `FAIL: ${name}: expected ${version}, found ${actual[name] || "missing"}`
              );
              failed = true;
            } else {
              console.log(`PASS: ${name} ${version}`);
            }
          }

          if (failed) process.exit(1);

          console.log("Capacitor versions: PASS");
          NODE

      # ============================================================
      # 11. VERIFY CAPACITOR CONFIG
      # ============================================================
      - name: Verify Capacitor configuration
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");

          const c = JSON.parse(
            fs.readFileSync("capacitor.config.json", "utf8")
          );

          if (c.appId !== "org.rkms.connect") {
            throw new Error(`Wrong appId: ${c.appId}`);
          }

          if (c.webDir !== "dist") {
            throw new Error(`Wrong webDir: ${c.webDir}`);
          }

          console.log("appId: org.rkms.connect");
          console.log("webDir: dist");
          console.log("Capacitor configuration: PASS");
          NODE

      # ============================================================
      # 12. VERIFY FIREBASE
      # ============================================================
      - name: Verify Firebase configuration
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync("google-services.json", "utf8")
          );

          const clients = data.client || [];

          const packages = clients.map(
            c =>
              c?.client_info?.android_client_info?.package_name || ""
          );

          console.log("Firebase packages:", packages);

          if (!packages.includes("org.rkms.connect")) {
            throw new Error(
              "google-services.json does not contain org.rkms.connect"
            );
          }

          console.log("Firebase configuration: PASS");
          NODE

      # ============================================================
      # 13. VERIFY FCM
      # ============================================================
      - name: Verify FCM notification source
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-fcm-pipeline.py

      # ============================================================
      # 14. VERIFY SAVED LOGIN
      # ============================================================
      - name: Verify saved login
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-saved-login.py

      # ============================================================
      # 15. VERIFY NATIVE BRIDGE
      # ============================================================
      - name: Verify native bridge source
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-native-bridge.py

      # ============================================================
      # 16. VERIFY FINAL RKMS SOURCE
      # ============================================================
      - name: Verify audited RKMS source
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-rkms-final.py

      # ============================================================
      # 17. VERIFY CHAT / MICROPHONE / FINAL FIXES
      # ============================================================
      - name: Verify chat microphone and final fixes
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-chat-mic-final.py
          python3 scripts/verify-final-three-point-fix.py

      # ============================================================
      # 18. INSTALL NPM DEPENDENCIES
      # ============================================================
      - name: Install npm dependencies
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          npm ci --no-audit --no-fund

          echo "npm dependencies: PASS"

      # ============================================================
      # 19. VERIFY FCM PLUGIN
      # ============================================================
      - name: Verify Capacitor FCM plugin dependency
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const p = require(
            "./node_modules/@capacitor/push-notifications/package.json"
          );

          console.log(
            "Installed push-notifications:",
            p.version
          );

          if (p.version !== "6.0.3") {
            process.exit(1);
          }
          NODE

      # ============================================================
      # 20. BUILD WEB
      # ============================================================
      - name: Build web application
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          npm run build

          test -d dist
          test -f dist/index.html

          echo "Web build: PASS"

      # ============================================================
      # 21. CLEAN ANDROID
      # ============================================================
      - name: Prepare clean Android project
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android

          echo "Old Android project removed."

      # ============================================================
      # 22. GENERATE FRESH ANDROID
      # ============================================================
      - name: Generate fresh Android project
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          npx cap add android

          test -d android

          echo "Fresh Android project: PASS"

      # ============================================================
      # 23. CONFIGURE ANDROID 16 API 36
      # ============================================================
      - name: Configure Android 16 API 36
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/configure-android-16.sh

          bash scripts/configure-android-16.sh

      # ============================================================
      # 24. FORCE SDK VERSIONS
      # ============================================================
      - name: Enforce Android SDK versions
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/variables.gradle")

          if not p.exists():
              raise SystemExit(
                  "ERROR: android/variables.gradle not found"
              )

          s = p.read_text()

          s = re.sub(
              r"(\bcompileSdkVersion\s*=\s*)\d+",
              r"\g<1>36",
              s
          )

          s = re.sub(
              r"(\btargetSdkVersion\s*=\s*)\d+",
              r"\g<1>36",
              s
          )

          s = re.sub(
              r"(\bminSdkVersion\s*=\s*)\d+",
              r"\g<1>23",
              s
          )

          p.write_text(s)
          PY

          grep -q "compileSdkVersion = 36" \
            android/variables.gradle

          grep -q "targetSdkVersion = 36" \
            android/variables.gradle

          grep -q "minSdkVersion = 23" \
            android/variables.gradle

          echo "Android SDK versions: PASS"

      # ============================================================
      # 25. CAPACITOR SYNC
      # ============================================================
      - name: Sync Capacitor Android
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          npx cap sync android

          echo "Capacitor sync: PASS"

      # ============================================================
      # 26. RE-ENFORCE SDK AFTER SYNC
      # ============================================================
      - name: Re-enforce Android SDK after sync
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/variables.gradle")
          s = p.read_text()

          s = re.sub(
              r"(\bcompileSdkVersion\s*=\s*)\d+",
              r"\g<1>36",
              s
          )

          s = re.sub(
              r"(\btargetSdkVersion\s*=\s*)\d+",
              r"\g<1>36",
              s
          )

          s = re.sub(
              r"(\bminSdkVersion\s*=\s*)\d+",
              r"\g<1>23",
              s
          )

          p.write_text(s)
          PY

          grep -q "compileSdkVersion = 36" \
            android/variables.gradle

          grep -q "targetSdkVersion = 36" \
            android/variables.gradle

          grep -q "minSdkVersion = 23" \
            android/variables.gradle

          echo "Post-sync SDK verification: PASS"

      # ============================================================
      # 27. APPLY RKMS NATIVE SETUP
      # ============================================================
      - name: Apply RKMS native Android setup
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/setup-android-native.sh

          bash scripts/setup-android-native.sh

          echo "RKMS native Android setup: PASS"

      # ============================================================
      # 28. VERIFY MAIN ACTIVITY
      # ============================================================
      - name: Verify MainActivity native bridge
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          MAIN_ACTIVITY="$(find android/app/src/main \
            -type f \
            -name "MainActivity.java" \
            -print -quit)"

          if [ -z "${MAIN_ACTIVITY}" ]; then
            echo "ERROR: MainActivity.java not found."
            exit 1
          fi

          grep -q "RKMSNativeBridge" "$MAIN_ACTIVITY"
          grep -q "FirebaseApp.initializeApp(this)" "$MAIN_ACTIVITY"
          grep -q "onNewIntent" "$MAIN_ACTIVITY"

          echo "MainActivity native bridge: PASS"

      # ============================================================
      # 29. VERIFY FIREBASE FILE
      # ============================================================
      - name: Verify Android Firebase file
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          test -f android/app/google-services.json

          grep -q \
            '"package_name": "org.rkms.connect"' \
            android/app/google-services.json

          echo "Android Firebase file: PASS"

      # ============================================================
      # 30. FIREBASE MESSAGING
      # ============================================================
      - name: Ensure Firebase Messaging dependency
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          dependency = (
              'implementation "com.google.firebase:firebase-messaging:25.0.1"'
          )

          if "com.google.firebase:firebase-messaging:" not in s:
              marker = "dependencies {"

              if marker not in s:
                  raise SystemExit(
                      "ERROR: dependencies block missing"
                  )

              s = s.replace(
                  marker,
                  marker + "\n    " + dependency,
                  1
              )

              p.write_text(s)

          print("Firebase Messaging dependency: PASS")
          PY

      # ============================================================
      # 31. RESOLVE ANDROID DEPENDENCIES
      # ============================================================
      - name: Resolve Android dependencies
        working-directory: ${{ runner.temp }}/rkms-source/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:dependencies \
            --configuration releaseRuntimeClasspath

      # ============================================================
      # 32. FINAL SOURCE AUDITS
      # ============================================================
      - name: Run final source audits
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-fcm-pipeline.py
          python3 scripts/verify-saved-login.py
          python3 scripts/verify-native-bridge.py
          python3 scripts/verify-rkms-final.py
          python3 scripts/verify-chat-mic-final.py
          python3 scripts/verify-final-three-point-fix.py
          python3 scripts/verify-android-16.py

          echo "ALL STATIC AUDITS: PASS"

      # ============================================================
      # 33. VERIFY SIGNING SECRETS
      # ============================================================
      - name: Verify release signing secrets
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          missing=0

          if [ -z "${RKMS_KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: RKMS_KEYSTORE_BASE64 missing"
            missing=1
          fi

          if [ -z "${RKMS_KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: RKMS_KEYSTORE_PASSWORD missing"
            missing=1
          fi

          if [ -z "${RKMS_KEY_ALIAS:-}" ]; then
            echo "ERROR: RKMS_KEY_ALIAS missing"
            missing=1
          fi

          if [ -z "${RKMS_KEY_PASSWORD:-}" ]; then
            echo "ERROR: RKMS_KEY_PASSWORD missing"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "Release signing secrets: PASS"

      # ============================================================
      # 34. CONFIGURE RELEASE SIGNING
      # ============================================================
      - name: Configure release signing
        working-directory: ${{ runner.temp }}/rkms-source
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/configure-release-signing.sh

          bash scripts/configure-release-signing.sh

          test -f android/app/release.keystore

          grep -q "signingConfigs.release" \
            android/app/build.gradle

          grep -q "signingConfig signingConfigs.release" \
            android/app/build.gradle

          echo "Release signing configuration: PASS"

      # ============================================================
      # 35. VALIDATE KEYSTORE
      # ============================================================
      - name: Validate release keystore
        working-directory: ${{ runner.temp }}/rkms-source
        env:
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail

          keytool \
            -list \
            -keystore android/app/release.keystore \
            -storepass "$RKMS_KEYSTORE_PASSWORD" \
            -alias "$RKMS_KEY_ALIAS" \
            >/tmp/rkms-keystore.txt

          grep -q "PrivateKeyEntry" \
            /tmp/rkms-keystore.txt

          echo "Keystore validation: PASS"

      # ============================================================
      # 36. VERIFY GRADLE WRAPPER
      # ============================================================
      - name: Verify Gradle wrapper
        working-directory: ${{ runner.temp }}/rkms-source/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          grep -q \
            "gradle-8.11.1-bin.zip" \
            gradle/wrapper/gradle-wrapper.properties

          ./gradlew --version

      # ============================================================
      # 37. VERIFY GOOGLE SERVICES PLUGIN
      # ============================================================
      - name: Verify Google Services plugin
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          grep -q \
            "com.google.gms:google-services:4.4.3" \
            android/build.gradle

          grep -q \
            "com.google.gms.google-services" \
            android/app/build.gradle

          echo "Google Services plugin: PASS"

      # ============================================================
      # 38. VERIFY FINAL ANDROID CONFIG
      # ============================================================
      - name: Verify final Android configuration
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          grep -q "compileSdkVersion = 36" \
            android/variables.gradle

          grep -q "targetSdkVersion = 36" \
            android/variables.gradle

          grep -q "minSdkVersion = 23" \
            android/variables.gradle

          grep -q \
            "com.android.tools.build:gradle:8.9.1" \
            android/build.gradle

          grep -q \
            "gradle-8.11.1-bin.zip" \
            android/gradle/wrapper/gradle-wrapper.properties

          grep -q \
            "signingConfig signingConfigs.release" \
            android/app/build.gradle

          echo "Final Android configuration: PASS"

      # ============================================================
      # 39. JAVA + MANIFEST VALIDATION
      # ============================================================
      - name: Validate Android Java and Manifest
        working-directory: ${{ runner.temp }}/rkms-source/android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:compileReleaseJavaWithJavac \
            :app:processReleaseMainManifest

          echo "Java + Manifest validation: PASS"

      # ============================================================
      # 40. CLEAN
      # ============================================================
      - name: Clean release build
        working-directory: ${{ runner.temp }}/rkms-source/android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean

      # ============================================================
      # 41. BUILD ONLY SIGNED RELEASE APK
      # ============================================================
      - name: Build signed Release APK only
        working-directory: ${{ runner.temp }}/rkms-source/android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleRelease

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Signed Release APK was not generated."

            find app/build/outputs \
              -type f \
              -print \
              || true

            exit 1
          fi

          echo "Signed Release APK:"
          ls -lh "$APK"

      # ============================================================
      # 42. NO DEBUG / NO AAB
      # ============================================================
      - name: Verify only Release APK exists
        working-directory: ${{ runner.temp }}/rkms-source/android
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

          if find app/build/outputs \
            -type f \
            \( -name "*.aab" -o -iname "*debug*.apk" \) \
            -print -quit \
            | grep -q .; then

            echo "ERROR: Debug APK or AAB detected."
            find app/build/outputs -type f -print
            exit 1
          fi

          echo "Only Release APK: PASS"

      # ============================================================
      # 43. VERIFY PACKAGE NAME
      # ============================================================
      - name: Verify APK package
        working-directory: ${{ runner.temp }}/rkms-source/android
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt" \
            dump badging "$APK" \
            | grep -q \
            "package: name='org.rkms.connect'"

          echo "Package org.rkms.connect: PASS"

      # ============================================================
      # 44. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify APK signature
        working-directory: ${{ runner.temp }}/rkms-source/android
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

          test -x "$APKSIGNER"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK" \
            | tee /tmp/rkms-apksigner.txt

          grep -q \
            "Verified using v2 scheme: true" \
            /tmp/rkms-apksigner.txt

          grep -q \
            "Signer #1 certificate SHA-256 digest:" \
            /tmp/rkms-apksigner.txt

          echo "APK signature: PASS"

      # ============================================================
      # 45. SHA256
      # ============================================================
      - name: Generate APK SHA256
        working-directory: ${{ runner.temp }}/rkms-source/android
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          sha256sum "$APK" \
            | tee app-release.apk.sha256

      # ============================================================
      # 46. FINAL APK AUDIT
      # ============================================================
      - name: Final APK audit
        working-directory: ${{ runner.temp }}/rkms-source/android
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          echo
          echo "=============================================="
          echo " RKMS CONNECT FINAL SIGNED RELEASE APK"
          echo "=============================================="

          echo
          echo "Package:"
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt" \
            dump badging "$APK" \
            | grep "package:"

          echo
          echo "APK size:"
          ls -lh "$APK"

          echo
          echo "SHA256:"
          cat app-release.apk.sha256

          echo
          echo "=============================================="
          echo " FINAL APK AUDIT: PASS"
          echo "=============================================="

      # ============================================================
      # 47. PREPARE ARTIFACT
      # ============================================================
      - name: Prepare final release artifacts
        working-directory: ${{ runner.temp }}/rkms-source/android
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/rkms-final-artifacts"

          mkdir -p "$RUNNER_TEMP/rkms-final-artifacts"

          cp \
            app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/rkms-final-artifacts/RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk"

          cp \
            app-release.apk.sha256 \
            "$RUNNER_TEMP/rkms-final-artifacts/RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk.sha256"

          ls -lh "$RUNNER_TEMP/rkms-final-artifacts"

      # ============================================================
      # 48. UPLOAD ONLY FINAL SIGNED APK
      # ============================================================
      - name: Upload final signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-FINAL-SIGNED-RELEASE-APK
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/rkms-final-artifacts/RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk
            ${{ runner.temp }}/rkms-final-artifacts/RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk.sha256

      # ============================================================
      # 49. FINAL SUCCESS
      # ============================================================
      - name: Final build result
        shell: bash
        run: |
          echo
          echo "===================================================="
          echo " RKMS CONNECT FINAL RELEASE APK BUILD SUCCESS"
          echo "===================================================="
          echo
          echo "SIGNED RELEASE APK : YES"
          echo "DEBUG APK           : NO"
          echo "AAB                 : NO"
          echo "PACKAGE             : org.rkms.connect"
          echo "ANDROID API         : 36"
          echo "BUILD TOOLS         : 36.0.0"
          echo "JAVA                : 17"
          echo "NODE                : 22"
          echo "AGP                 : 8.9.1"
          echo "GRADLE              : 8.11.1"
          echo
          echo "===================================================="

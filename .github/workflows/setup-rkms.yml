      - name: Final Android SDK audit
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          echo "=============================================="
          echo "FINAL ANDROID CONFIGURATION"
          echo "=============================================="

          echo "compileSdk : 36"
          echo "targetSdk  : 36"
          echo "minSdk     : 23"
          echo "AGP        : 8.9.1"
          echo "Gradle     : 8.11.1"
          echo "Java       : 17"
          echo "Node       : 22"
          echo "Firebase   : 34.19.0"
          echo "Credentials: 1.5.0"
          echo "Package    : org.rkms.connect"
          echo "APK ONLY   : YES"

          echo ""

          grep -Eq \
            '^[[:space:]]*compileSdk[[:space:]]+36' \
            app/build.gradle

          grep -Eq \
            '^[[:space:]]*minSdk[[:space:]]+23' \
            app/build.gradle

          grep -Eq \
            '^[[:space:]]*targetSdk[[:space:]]+36' \
            app/build.gradle

          echo ""
          echo "compileSdk 36 PASS"
          echo "minSdk 23 PASS"
          echo "targetSdk 36 PASS"


      # ============================================================
      # 41. CLEAN
      # ============================================================

      - name: Clean Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          ./gradlew \
            clean \
            --no-daemon \
            --stacktrace

          echo "Clean PASS."


      # ============================================================
      # 42. BUILD FINAL SIGNED RELEASE APK ONLY
      #
      # NO DEBUG APK
      # NO AAB
      # ============================================================

      - name: Build Final Signed Release APK
        shell: bash
        env:
          RKMS_KEYSTORE_PATH: ${{ env.RKMS_KEYSTORE_PATH }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          echo "=============================================="
          echo "RKMS FINAL SIGNED RELEASE APK"
          echo "=============================================="

          echo "Source ZIP      : ${SOURCE_ZIP}"
          echo "Android API     : 36"
          echo "Build Tools     : 36.0.0"
          echo "minSdk          : 23"
          echo "targetSdk       : 36"
          echo "Node            : 22"
          echo "Java            : 17"
          echo "AGP             : 8.9.1"
          echo "Gradle          : 8.11.1"
          echo "Firebase BOM    : 34.19.0"
          echo "Google Services : 4.5.0"
          echo "Credential Mgr  : 1.5.0"
          echo "Package         : org.rkms.connect"
          echo "SIGNED          : YES"

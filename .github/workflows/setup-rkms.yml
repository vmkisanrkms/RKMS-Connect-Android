name: RKMS Android 16 API 36 - Final Signed Release APK Only

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  AGP_VERSION: "8.9.1"
  GRADLE_VERSION: "8.11.1"
  APP_ID: "org.rkms.connect"
  SOURCE_ZIP_NAME: "RKMS_CONNECT_GROUP_PHOTO_SCHEMA_FIXED_FINAL_20260920.zip"

jobs:

  build-release-apk:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. LIST ZIP FILES
      # ============================================================

      - name: List repository ZIP files
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Available RKMS ZIP files"
          echo "=========================================="

          find . -type f \
            \( -iname "*.zip" -o -iname "*.ZIP" \) \
            -print | sort || true


      # ============================================================
      # 3. VERIFY EXACT SOURCE ZIP
      # ============================================================

      - name: Verify exact RKMS source ZIP
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_SOURCE_ZIP="${SOURCE_ZIP_NAME}"

          echo "Required source:"
          echo "$REQUIRED_SOURCE_ZIP"

          if [ ! -f "./$REQUIRED_SOURCE_ZIP" ]; then

            echo ""
            echo "ERROR: Required RKMS source ZIP not found."
            echo ""

            echo "Available ZIP files:"
            find . -type f \
              \( -iname "*.zip" -o -iname "*.ZIP" \) \
              -print | sort || true

            exit 1
          fi

          SOURCE_ZIP="./$REQUIRED_SOURCE_ZIP"

          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

          echo ""
          echo "Source ZIP verified:"
          echo "$SOURCE_ZIP"

          ls -lh "$SOURCE_ZIP"


      # ============================================================
      # 4. SOURCE ZIP SHA256
      # ============================================================

      - name: Generate source ZIP SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum "$SOURCE_ZIP" \
            | tee rkms-source-zip.sha256


      # ============================================================
      # 5. EXTRACT SOURCE ZIP
      # ============================================================

      - name: Extract RKMS source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf rkms-source

          mkdir -p rkms-source

          unzip -q "$SOURCE_ZIP" -d rkms-source

          echo ""
          echo "Extracted RKMS source:"
          find rkms-source -maxdepth 3 -type f \
            | head -250


      # ============================================================
      # 6. DETECT PROJECT ROOT
      # ============================================================

      - name: Detect RKMS project root
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT=""

          if [ -f "rkms-source/package.json" ]; then

            PROJECT_ROOT="rkms-source"

          else

            FOUND_PACKAGE="$(
              find rkms-source \
                -type f \
                -name package.json \
                -print -quit || true
            )"

            if [ -n "$FOUND_PACKAGE" ]; then
              PROJECT_ROOT="$(dirname "$FOUND_PACKAGE")"
            fi

          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: package.json not found."
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo ""
          echo "Project root:"
          echo "$PROJECT_ROOT"

          test -f "$PROJECT_ROOT/package.json"


      # ============================================================
      # 7. VALIDATE SOURCE
      # ============================================================

      - name: Validate RKMS source
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          test -f package.json

          echo "package.json: OK"

          if [ -f app.js ]; then
            echo "app.js: OK"
          elif [ -f src/app.js ]; then
            echo "src/app.js: OK"
          else
            echo "WARNING: app.js not found."
          fi

          if [ -d supabase ]; then
            echo "supabase directory: OK"
          else
            echo "WARNING: supabase directory not found."
          fi


      # ============================================================
      # 8. NODE 22
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ env.PROJECT_ROOT }}/package-lock.json


      # ============================================================
      # 9. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 10. ANDROID SDK BASE SETUP
      #
      # IMPORTANT:
      # Do NOT use "tools".
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12266719"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: "platform-tools"


      # ============================================================
      # 11. INSTALL API 36 + BUILD TOOLS
      # ============================================================

      - name: Install Android API 36 and Build Tools
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER=""

          if [ -x "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "${ANDROID_SDK_ROOT}/cmdline-tools" \
                -type f \
                -path "*/bin/sdkmanager" \
                -print -quit 2>/dev/null || true
            )"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then

            echo "ERROR: sdkmanager not found."

            find "${ANDROID_SDK_ROOT}" \
              -name sdkmanager \
              -type f \
              -print || true

            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"


      # ============================================================
      # 12. VERIFY ANDROID SDK
      # ============================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          PLATFORM_DIR="${ANDROID_SDK_ROOT}/platforms/android-${ANDROID_API}"
          BUILD_TOOLS_DIR="${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}"

          test -d "$PLATFORM_DIR"
          test -d "$BUILD_TOOLS_DIR"

          echo ""
          echo "Android platform:"
          ls -ld "$PLATFORM_DIR"

          echo ""
          echo "Android build tools:"
          ls -ld "$BUILD_TOOLS_DIR"

          echo ""
          echo "Android SDK verification PASSED."


      # ============================================================
      # 13. INSTALL NPM DEPENDENCIES
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi


      # ============================================================
      # 14. VERIFY CAPACITOR VERSIONS
      # ============================================================

      - name: Verify Capacitor versions
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const deps = {
            ...(pkg.dependencies || {}),
            ...(pkg.devDependencies || {})
          };

          const required = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          let failed = false;

          for (const [name, version] of Object.entries(required)) {

            const actual = deps[name];

            console.log(
              `${name}: required=${version}, actual=${actual || "MISSING"}`
            );

            if (!actual) {
              failed = true;
            }
          }

          if (failed) {
            console.error(
              "ERROR: Required Capacitor dependency is missing."
            );

            process.exit(1);
          }

          console.log(
            "Capacitor dependency verification PASSED."
          );
          NODE


      # ============================================================
      # 15. BUILD WEB APPLICATION
      # ============================================================

      - name: Build web application
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          if npm run | grep -qE '^[[:space:]]+build'; then

            npm run build

          else

            echo "No npm build script found."
            echo "Continuing with existing web assets."

          fi


      # ============================================================
      # 16. SETUP CAPACITOR ANDROID
      # ============================================================

      - name: Setup Capacitor Android
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android


      # ============================================================
      # 17. VERIFY ANDROID PROJECT
      # ============================================================

      - name: Verify Android project
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          test -d android
          test -f android/app/build.gradle

          echo "Android project verified."


      # ============================================================
      # 18. FORCE ANDROID API 36
      #
      # Handles all of these:
      #
      # compileSdk 35
      # compileSdk rootProject.ext.compileSdkVersion
      # compileSdkVersion rootProject.ext.compileSdkVersion
      #
      # and variables.gradle.
      # ============================================================

      - name: Configure Android API 36
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Configuring Android API 36"
          echo "=========================================="

          VARIABLES_FILE="android/variables.gradle"
          APP_GRADLE="android/app/build.gradle"

          test -f "$APP_GRADLE"

          # --------------------------------------------------------
          # Create or fix variables.gradle
          # --------------------------------------------------------

          if [ ! -f "$VARIABLES_FILE" ]; then

            cat > "$VARIABLES_FILE" <<'EOF'
ext {
    minSdkVersion = 23
    compileSdkVersion = 36
    targetSdkVersion = 36
}
EOF

          else

            python3 <<'PY'
from pathlib import Path
import re

p = Path("android/variables.gradle")
s = p.read_text()

# compileSdkVersion
if re.search(r'\bcompileSdkVersion\s*=\s*\d+', s):
    s = re.sub(
        r'\bcompileSdkVersion\s*=\s*\d+',
        'compileSdkVersion = 36',
        s
    )
else:
    if 'compileSdkVersion = 36' not in s:
        if 'ext {' in s:
            s = s.replace(
                'ext {',
                'ext {\n    compileSdkVersion = 36',
                1
            )

# minSdkVersion
if re.search(r'\bminSdkVersion\s*=\s*\d+', s):
    s = re.sub(
        r'\bminSdkVersion\s*=\s*\d+',
        'minSdkVersion = 23',
        s
    )
else:
    if 'minSdkVersion = 23' not in s:
        if 'ext {' in s:
            s = s.replace(
                'ext {',
                'ext {\n    minSdkVersion = 23',
                1
            )

# targetSdkVersion
if re.search(r'\btargetSdkVersion\s*=\s*\d+', s):
    s = re.sub(
        r'\btargetSdkVersion\s*=\s*\d+',
        'targetSdkVersion = 36',
        s
    )
else:
    if 'targetSdkVersion = 36' not in s:
        if 'ext {' in s:
            s = s.replace(
                'ext {',
                'ext {\n    targetSdkVersion = 36',
                1
            )

p.write_text(s)
PY

          fi


          # --------------------------------------------------------
          # Force compileSdk 36 in app/build.gradle
          # regardless of previous value/reference.
          # --------------------------------------------------------

          python3 <<'PY'
from pathlib import Path
import re

p = Path("android/app/build.gradle")
s = p.read_text()

if "android {" not in s:
    raise SystemExit("ERROR: android { block not found.")

# ------------------------------------------------------------
# compileSdk / compileSdkVersion
# ------------------------------------------------------------

compile_patterns = [
    r'^(\s*)compileSdk\s+.*$',
    r'^(\s*)compileSdkVersion\s+.*$'
]

compile_found = False

for pattern in compile_patterns:

    if re.search(pattern, s, flags=re.MULTILINE):

        s = re.sub(
            pattern,
            r'\g<1>compileSdk 36',
            s,
            count=1,
            flags=re.MULTILINE
        )

        compile_found = True
        break

if not compile_found:

    s = s.replace(
        'android {',
        'android {\n    compileSdk 36',
        1
    )


# ------------------------------------------------------------
# minSdk
# ------------------------------------------------------------

min_patterns = [
    r'^(\s*)minSdk\s+.*$',
    r'^(\s*)minSdkVersion\s+.*$'
]

for pattern in min_patterns:

    if re.search(pattern, s, flags=re.MULTILINE):

        s = re.sub(
            pattern,
            r'\g<1>minSdk 23',
            s,
            count=1,
            flags=re.MULTILINE
        )

        break


# ------------------------------------------------------------
# targetSdk
# ------------------------------------------------------------

target_patterns = [
    r'^(\s*)targetSdk\s+.*$',
    r'^(\s*)targetSdkVersion\s+.*$'
]

for pattern in target_patterns:

    if re.search(pattern, s, flags=re.MULTILINE):

        s = re.sub(
            pattern,
            r'\g<1>targetSdk 36',
            s,
            count=1,
            flags=re.MULTILINE
        )

        break


p.write_text(s)
PY


          # --------------------------------------------------------
          # Verify files
          # --------------------------------------------------------

          echo ""
          echo "=========================================="
          echo "variables.gradle"
          echo "=========================================="

          cat android/variables.gradle


          echo ""
          echo "=========================================="
          echo "app/build.gradle SDK configuration"
          echo "=========================================="

          grep -nE \
            "compileSdk|compileSdkVersion|minSdk|minSdkVersion|targetSdk|targetSdkVersion" \
            android/app/build.gradle || true


          echo ""
          echo "Android API 36 source configuration prepared."


      # ============================================================
      # 19. VERIFY APPLICATION ID
      # ============================================================

      - name: Verify application ID
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          if ! grep -q \
            'applicationId[[:space:]]*["'\'']org\.rkms\.connect["'\'']' \
            android/app/build.gradle
          then

            echo "ERROR: org.rkms.connect applicationId not found."

            exit 1
          fi

          echo "Application ID verified: org.rkms.connect"


      # ============================================================
      # 20. FIREBASE CONFIGURATION
      # ============================================================

      - name: Verify Firebase configuration
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          if [ -f android/app/google-services.json ]; then

            echo "google-services.json found."

            if ! grep -q "org.rkms.connect" \
              android/app/google-services.json
            then

              echo "ERROR: google-services.json does not contain org.rkms.connect."

              exit 1
            fi

            echo "Firebase configuration verified."

          else

            echo "WARNING: google-services.json not found."

          fi


      # ============================================================
      # 21. VERIFY RELEASE SIGNING SECRETS
      # ============================================================

      - name: Verify release signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 missing."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: ANDROID_KEY_ALIAS missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEY_PASSWORD missing."
            exit 1
          fi

          echo "Release signing secrets verified."


      # ============================================================
      # 22. CREATE RELEASE KEYSTORE
      # ============================================================

      - name: Configure release keystore
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "$KEYSTORE_BASE64" \
            | base64 --decode \
            > android/rkms-release.keystore

          test -s android/rkms-release.keystore

          keytool -list \
            -keystore android/rkms-release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          cat >> android/gradle.properties <<EOF

RKMS_RELEASE_STORE_FILE=../rkms-release.keystore
RKMS_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD
RKMS_RELEASE_KEY_ALIAS=$KEY_ALIAS
RKMS_RELEASE_KEY_PASSWORD=$KEY_PASSWORD
EOF

          echo "Release keystore configured and verified."


      # ============================================================
      # 23. CONFIGURE RELEASE SIGNING
      #
      # Safely handles existing signingConfigs/buildTypes.
      # ============================================================

      - name: Configure Android release signing
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          python3 <<'PY'
from pathlib import Path
import re

p = Path("android/app/build.gradle")
s = p.read_text()

# ------------------------------------------------------------
# Find android block
# ------------------------------------------------------------

android_match = re.search(
    r'\bandroid\s*\{',
    s
)

if not android_match:
    raise SystemExit("ERROR: android block not found.")


# ------------------------------------------------------------
# Check whether signingConfigs exists
# ------------------------------------------------------------

has_signing_configs = re.search(
    r'\bsigningConfigs\s*\{',
    s
) is not None


# ------------------------------------------------------------
# Add signingConfigs only when absent
# ------------------------------------------------------------

if not has_signing_configs:

    signing_block = """
    signingConfigs {
        release {
            storeFile file(project.findProperty("RKMS_RELEASE_STORE_FILE"))
            storePassword project.findProperty("RKMS_RELEASE_STORE_PASSWORD")
            keyAlias project.findProperty("RKMS_RELEASE_KEY_ALIAS")
            keyPassword project.findProperty("RKMS_RELEASE_KEY_PASSWORD")
        }
    }
"""

    insert_pos = android_match.end()

    s = (
        s[:insert_pos]
        + signing_block
        + s[insert_pos:]
    )


# ------------------------------------------------------------
# Find buildTypes
# ------------------------------------------------------------

build_types_match = re.search(
    r'\bbuildTypes\s*\{',
    s
)

if not build_types_match:
    raise SystemExit("ERROR: buildTypes block not found.")


# ------------------------------------------------------------
# Find release block inside buildTypes
# ------------------------------------------------------------

bt_start = build_types_match.end()

release_match = re.search(
    r'\brelease\s*\{',
    s[bt_start:]
)


# ------------------------------------------------------------
# If release block exists:
# add signingConfig only if absent.
# ------------------------------------------------------------

if release_match:

    release_start = (
        bt_start
        + release_match.end()
    )

    # Determine the approximate release block
    # using brace counting.

    depth = 1
    i = release_start

    while i < len(s) and depth > 0:

        if s[i] == '{':
            depth += 1

        elif s[i] == '}':
            depth -= 1

        i += 1

    release_body = s[release_start:i-1]

    if "signingConfig" not in release_body:

        s = (
            s[:release_start]
            + """
        signingConfig signingConfigs.release
"""
            + s[release_start:]
        )

else:

    # ----------------------------------------------------------
    # No release block: create one.
    # ----------------------------------------------------------

    insert_pos = build_types_match.end()

    release_block = """
        release {
            signingConfig signingConfigs.release
        }
"""

    s = (
        s[:insert_pos]
        + release_block
        + s[insert_pos:]
    )


p.write_text(s)

print("Release signing configuration prepared.")
PY


      # ============================================================
      # 24. FORCE GRADLE 8.11.1
      # ============================================================

      - name: Configure Gradle 8.11.1
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"

          test -f "$WRAPPER"

          python3 <<'PY'
from pathlib import Path
import re

p = Path("android/gradle/wrapper/gradle-wrapper.properties")
s = p.read_text()

url = (
    "https://services.gradle.org/distributions/"
    "gradle-8.11.1-bin.zip"
)

if "distributionUrl=" in s:

    s = re.sub(
        r'^distributionUrl=.*$',
        f'distributionUrl={url}',
        s,
        flags=re.MULTILINE
    )

else:

    s += f"\ndistributionUrl={url}\n"

p.write_text(s)
PY

          echo "Gradle wrapper:"
          grep "distributionUrl" \
            android/gradle/wrapper/gradle-wrapper.properties


      # ============================================================
      # 25. VERIFY GRADLE / ANDROID CONFIGURATION
      #
      # IMPORTANT:
      # Do NOT verify only with grep for "compileSdk 36".
      # The project may use rootProject.ext variables.
      # Gradle itself is the authority.
      # ============================================================

      - name: Verify Gradle and Android configuration
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}/android
        run: |
          set -euo pipefail

          chmod +x gradlew

          echo "=========================================="
          echo "Gradle version"
          echo "=========================================="

          ./gradlew --version


          echo ""
          echo "=========================================="
          echo "Android Gradle configuration test"
          echo "=========================================="

          ./gradlew \
            :app:tasks \
            --no-daemon \
            --stacktrace

          echo ""
          echo "Gradle Android configuration PASSED."


      # ============================================================
      # 26. FINAL SDK VARIABLE CHECK
      # ============================================================

      - name: Verify final Android SDK variables
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          echo "Checking variables.gradle..."

          grep -q \
            "minSdkVersion = 23" \
            android/variables.gradle

          grep -q \
            "compileSdkVersion = 36" \
            android/variables.gradle

          grep -q \
            "targetSdkVersion = 36" \
            android/variables.gradle

          echo ""
          echo "variables.gradle verified."

          cat android/variables.gradle


      # ============================================================
      # 27. CLEAN
      # ============================================================

      - name: Clean Android build
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}/android
        run: |
          set -euo pipefail

          ./gradlew \
            clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 28. BUILD FINAL SIGNED RELEASE APK ONLY
      #
      # NO DEBUG APK
      # NO AAB
      # ============================================================

      - name: Build Final Signed Release APK
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}/android
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Building FINAL SIGNED RELEASE APK"
          echo "=========================================="

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "Release APK build command completed."


      # ============================================================
      # 29. VERIFY APK EXISTS
      # ============================================================

      - name: Verify final release APK
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then

            echo "ERROR: Release APK was not generated."

            echo ""
            echo "Available build outputs:"

            find android/app/build/outputs \
              -type f \
              -print || true

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "FINAL APK"
          echo "=========================================="

          ls -lh "$APK"


      # ============================================================
      # 30. VERIFY APK SIGNATURE
      # ============================================================

      - name: Verify APK signature
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"

          apksigner verify \
            --verbose \
            "$APK"

          echo ""
          echo "APK signature verification PASSED."


      # ============================================================
      # 31. VERIFY PACKAGE NAME
      # ============================================================

      - name: Verify APK package
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"

          if command -v aapt >/dev/null 2>&1; then

            aapt dump badging "$APK" \
              | grep \
                "package: name='org.rkms.connect'"

          else

            echo "aapt not available; package check skipped."

          fi


      # ============================================================
      # 32. APK SHA256
      # ============================================================

      - name: Generate final APK SHA256
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"

          sha256sum "$APK" \
            | tee RKMS_FINAL_RELEASE_APK_SHA256.txt


      # ============================================================
      # 33. PREPARE FINAL RELEASE
      # ============================================================

      - name: Prepare final release artifact
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          mkdir -p final-release

          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            final-release/RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk

          cp \
            RKMS_FINAL_RELEASE_APK_SHA256.txt \
            final-release/

          cp \
            ../rkms-source-zip.sha256 \
            final-release/

          echo ""
          echo "Final release files:"
          ls -lh final-release


      # ============================================================
      # 34. UPLOAD FINAL SIGNED RELEASE APK
      # ============================================================

      - name: Upload Final Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-CONNECT-FINAL-SIGNED-RELEASE-APK
          path: |
            ${{ env.PROJECT_ROOT }}/final-release/RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk
            ${{ env.PROJECT_ROOT }}/final-release/RKMS_FINAL_RELEASE_APK_SHA256.txt
            ${{ env.PROJECT_ROOT }}/final-release/rkms-source-zip.sha256
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 35. FINAL SUMMARY
      # ============================================================

      - name: Final build summary
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          APK="final-release/RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk"

          echo ""
          echo "======================================================"
          echo " RKMS CONNECT FINAL SIGNED RELEASE APK"
          echo "======================================================"
          echo ""
          echo "Source ZIP:"
          echo "$SOURCE_ZIP"
          echo ""
          echo "Project root:"
          echo "$PROJECT_ROOT"
          echo ""
          echo "Application ID:"
          echo "$APP_ID"
          echo ""
          echo "Android API:"
          echo "$ANDROID_API"
          echo ""
          echo "Build Tools:"
          echo "$BUILD_TOOLS"
          echo ""
          echo "Node:"
          echo "$NODE_VERSION"
          echo ""
          echo "Java:"
          echo "$JAVA_VERSION"
          echo ""
          echo "AGP:"
          echo "$AGP_VERSION"
          echo ""
          echo "Gradle:"
          echo "$GRADLE_VERSION"
          echo ""
          echo "Release APK:"
          ls -lh "$APK"
          echo ""
          echo "APK SHA256:"
          sha256sum "$APK"
          echo ""
          echo "Debug APK: NOT BUILT"
          echo "AAB: NOT BUILT"
          echo ""
          echo "======================================================"
          echo " BUILD SUCCESSFUL"
          echo "======================================================"

name: RKMS Connect - Android 16 API 36 Final APK AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rkms-android-final-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  APP_ID: "org.rkms.connect"

jobs:
  audit-and-build:
    name: RKMS Final Audit + Android 16/API 36 APK AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 2. NODE.JS 22
      # ============================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # ============================================================
      # 3. JAVA 17
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      # ============================================================
      # 4. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 / API 36 SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}" \
            "cmdline-tools;latest"

      # ============================================================
      # 5. SOURCE STRUCTURE AUDIT
      # ============================================================
      - name: Verify required RKMS source files
        shell: bash
        run: |
          set -euo pipefail

          required=(
            "package.json"
            "package-lock.json"
            "index.html"
            "app.js"
            "styles.css"
            "config.js"
            "capacitor.config.json"
            "google-services.json"
            "scripts/setup-android-native.sh"
            "scripts/configure-android-16.sh"
            "scripts/verify-android-16.py"
          )

          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Missing required file: $f"
              exit 1
            fi
          done

          node -e '
            const p = require("./package.json");

            if (p.name !== "rkms") {
              throw new Error("package.json name mismatch");
            }

            if (p.dependencies?.["@capacitor/core"] !== "6.2.2") {
              throw new Error("Capacitor core mismatch");
            }

            if (p.dependencies?.["@capacitor/android"] !== "6.2.2") {
              throw new Error("Capacitor Android mismatch");
            }

            if (p.devDependencies?.["@capacitor/cli"] !== "6.2.2") {
              throw new Error("Capacitor CLI mismatch");
            }

            console.log("Package manifest: PASS");
          '

          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(
              Path("capacitor.config.json").read_text()
          )

          assert config["appId"] == "org.rkms.connect"
          assert config["webDir"] == "dist"

          print("Capacitor appId/webDir: PASS")

          firebase = json.loads(
              Path("google-services.json").read_text()
          )

          packages = []

          for client in firebase.get("client", []):
              packages.append(
                  client
                  .get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

          assert "org.rkms.connect" in packages, packages

          print("Firebase package org.rkms.connect: PASS")
          PY

      # ============================================================
      # 6. JAVASCRIPT SYNTAX
      # ============================================================
      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          node --check app.js

          echo "app.js syntax: PASS"

      # ============================================================
      # 7. PDA PASSWORD AUDIT
      # ============================================================
      - name: Audit PDA password protection
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking PDA removal password..."

          grep -F \
            'rkmsRequireManagementPassword("पद से हटाने")' \
            app.js >/dev/null

          echo "PDA removal password: PASS"

          echo "Checking password transmission..."

          grep -F \
            'p_password:password' \
            app.js >/dev/null

          echo "PDA password RPC parameter: PASS"

          echo "Checking appointment password..."

          grep -F \
            'rkmsRequireManagementPassword(form.dataset.reappointOfficer?"पद परिवर्तन":"नियुक्ति")' \
            app.js >/dev/null

          echo "PDA appointment/reappointment password: PASS"

          echo "Checking Super Admin PDA RPC..."

          grep -F \
            'rkms_super_admin_appoint_officer' \
            app.js >/dev/null

          grep -F \
            'rkms_super_admin_reappoint_officer' \
            app.js >/dev/null

          echo "Super Admin PDA RPC: PASS"

      # ============================================================
      # 8. SUPER ADMIN CHAT RESTRICTION
      # ============================================================
      - name: Audit Super Admin Chat restriction
        shell: bash
        run: |
          set -euo pipefail

          grep -F \
            'if(state.role==="super_admin") return adminScreen();' \
            app.js >/dev/null

          echo "Super Admin Chat route guard: PASS"

          echo "Checking Chat navigation..."

          grep -F \
            'data-route="chat"' \
            app.js >/dev/null

          echo "Chat route exists: PASS"

      # ============================================================
      # 9. WHATSAPP STYLE CHAT AUDIT
      # ============================================================
      - name: Audit WhatsApp style Chat
        shell: bash
        run: |
          set -euo pipefail

          components=(
            "wa-chat-screen"
            "wa-chat-list-head"
            "wa-chat-search"
            "wa-filters"
            "wa-chat-row"
            "wa-conv-head"
            "wa-messages"
            "wa-compose"
          )

          for token in "${components[@]}"; do

            if ! grep -F "$token" app.js >/dev/null; then
              echo "ERROR: Missing Chat component: $token"
              exit 1
            fi

          done

          echo "WhatsApp Chat components: PASS"

      # ============================================================
      # 10. CHAT HEADER / FOOTER SAFETY
      # ============================================================
      - name: Verify Chat does not cover common navigation
        shell: bash
        run: |
          set -euo pipefail

          if grep -Eq \
            '\.wa-chat-screen[^}]*position:[[:space:]]*fixed' \
            styles.css; then

            echo "ERROR: wa-chat-screen still uses fixed overlay"
            exit 1

          fi

          if grep -Eq \
            '\.wa-conversation-screen[^}]*position:[[:space:]]*fixed' \
            styles.css; then

            echo "ERROR: wa-conversation-screen still uses fixed overlay"
            exit 1

          fi

          echo "Chat header/footer-safe layout: PASS"

      # ============================================================
      # 11. COMMON BOTTOM NAVIGATION
      # ============================================================
      - name: Verify common bottom navigation
        shell: bash
        run: |
          set -euo pipefail

          grep -F \
            'rkms-bottom-nav' \
            styles.css >/dev/null

          grep -F \
            'body{padding-bottom:78px}' \
            styles.css >/dev/null

          echo "Common bottom navigation: PASS"

      # ============================================================
      # 12. NPM INSTALL
      # ============================================================
      - name: Install exact locked dependencies
        run: |
          npm ci

      # ============================================================
      # 13. RKMS VERIFICATION SUITE
      # ============================================================
      - name: Run RKMS verification suite
        shell: bash
        run: |
          set -euo pipefail

          run_py() {

            local file="$1"

            if [ -f "$file" ]; then

              echo ""
              echo "================================================"
              echo "Running: $file"
              echo "================================================"

              python3 "$file"

            fi
          }

          run_py scripts/verify-rkms-final.py
          run_py scripts/verify-authority-hierarchy.py
          run_py scripts/verify-directory-lists.py
          run_py scripts/verify-directory-contact-actions.py
          run_py scripts/verify-member-directory-scope.py
          run_py scripts/verify-v17-directory-deep.py
          run_py scripts/verify-content-management-final.py
          run_py scripts/verify-complaint-final.py
          run_py scripts/verify-profile-update-final.py
          run_py scripts/verify-saved-login.py
          run_py scripts/verify-fcm-pipeline.py
          run_py scripts/verify-final-login-navigation.py
          run_py scripts/verify-native-bridge.py
          run_py scripts/verify-report-download-scope.py
          run_py scripts/verify-android-pdf.py
          run_py scripts/verify-pdf-pipeline.py

          echo ""
          echo "ALL AVAILABLE RKMS VERIFIERS: PASS"

      # ============================================================
      # 14. BUILD WEB
      # ============================================================
      - name: Build web assets
        run: |
          npm run build

      # ============================================================
      # 15. VERIFY DIST
      # ============================================================
      - name: Verify web build
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/index.html
          test -f dist/app.js
          test -f dist/styles.css
          test -f dist/config.js

          node --check dist/app.js

          echo "dist structure: PASS"

      # ============================================================
      # 16. CLEAN CAPACITOR ANDROID PROJECT
      # ============================================================
      - name: Generate clean Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android

          npx cap add android

          npx cap sync android

      # ============================================================
      # 17. RKMS NATIVE CONFIGURATION
      # ============================================================
      - name: Apply RKMS Android native configuration
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/setup-android-native.sh

          scripts/setup-android-native.sh

      # ============================================================
      # 18. ANDROID 16 CONFIGURATION
      # ============================================================
      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/configure-android-16.sh

          scripts/configure-android-16.sh

      # ============================================================
      # 19. ANDROID PROJECT AUDIT
      # ============================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f \
            android/app/google-services.json

          test -f \
            android/app/src/main/AndroidManifest.xml

          test -f \
            android/app/src/main/java/org/rkms/connect/MainActivity.java

          test -f \
            android/app/src/main/java/org/rkms/connect/RKMSSecureCredentialsPlugin.java

          test -f \
            android/app/src/main/java/org/rkms/connect/RKMSNativeBridge.java

          python3 scripts/verify-android-16.py

          grep -F \
            'com.google.gms.google-services' \
            android/app/build.gradle >/dev/null

          grep -F \
            'com.google.gms:google-services:4.4.3' \
            android/build.gradle >/dev/null

          grep -F \
            'com.google.firebase.FirebaseApp.initializeApp(this)' \
            android/app/src/main/java/org/rkms/connect/MainActivity.java >/dev/null

          grep -F \
            'registerPlugin(RKMSSecureCredentialsPlugin.class)' \
            android/app/src/main/java/org/rkms/connect/MainActivity.java >/dev/null

          echo "Firebase initialization: PASS"
          echo "Native bridge: PASS"

      # ============================================================
      # 20. GRADLE CHECK
      # ============================================================
      - name: Verify Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd android

          chmod +x gradlew

          ./gradlew --version

          ./gradlew \
            :app:dependencies \
            --configuration debugRuntimeClasspath \
            >/dev/null

          echo "Gradle dependency resolution: PASS"

      # ============================================================
      # 21. DEBUG APK
      # ============================================================
      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd android

          ./gradlew \
            clean \
            assembleDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 22. RELEASE APK + AAB
      # ============================================================
      - name: Build release APK and AAB
        shell: bash
        run: |
          set -euo pipefail

          cd android

          ./gradlew \
            assembleRelease \
            bundleRelease \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 23. OPTIONAL RELEASE SIGNING
      # ============================================================
      - name: Prepare release keystore
        id: keystore
        if: ${{ secrets.RKMS_KEYSTORE_BASE64 != '' && secrets.RKMS_KEYSTORE_PASSWORD != '' && secrets.RKMS_KEY_ALIAS != '' && secrets.RKMS_KEY_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "${{ secrets.RKMS_KEYSTORE_BASE64 }}" \
            | base64 --decode \
            > "$RUNNER_TEMP/rkms-release.jks"

          test -s \
            "$RUNNER_TEMP/rkms-release.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/rkms-release.jks" \
            -storepass "${{ secrets.RKMS_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.RKMS_KEY_ALIAS }}" \
            >/dev/null

          echo "Keystore: PASS"

      # ============================================================
      # 24. SIGN APK + AAB
      # ============================================================
      - name: Sign release APK and AAB
        if: ${{ steps.keystore.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          KS="$RUNNER_TEMP/rkms-release.jks"

          test -f "$APK"
          test -f "$AAB"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign" \
            -f 4 \
            "$APK" \
            "$RUNNER_TEMP/rkms-release-aligned.apk"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" sign \
            --ks "$KS" \
            --ks-pass "pass:${{ secrets.RKMS_KEYSTORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.RKMS_KEY_ALIAS }}" \
            --key-pass "pass:${{ secrets.RKMS_KEY_PASSWORD }}" \
            --out "$RUNNER_TEMP/rkms-release-signed.apk" \
            "$RUNNER_TEMP/rkms-release-aligned.apk"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" verify \
            --verbose \
            "$RUNNER_TEMP/rkms-release-signed.apk"

          jarsigner \
            -keystore "$KS" \
            -storepass "${{ secrets.RKMS_KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.RKMS_KEY_PASSWORD }}" \
            -signedjar "$RUNNER_TEMP/rkms-release-signed.aab" \
            "$AAB" \
            "${{ secrets.RKMS_KEY_ALIAS }}"

          cp \
            "$RUNNER_TEMP/rkms-release-signed.apk" \
            android/app/build/outputs/apk/release/RKMS-Connect-release-signed.apk

          cp \
            "$RUNNER_TEMP/rkms-release-signed.aab" \
            android/app/build/outputs/bundle/release/RKMS-Connect-release-signed.aab

          echo "Signed APK/AAB: PASS"

      # ============================================================
      # 25. FINAL APK AUDIT
      # ============================================================
      - name: Final APK/AAB audit
        shell: bash
        run: |
          set -euo pipefail

          DEBUG_APK="android/app/build/outputs/apk/debug/app-debug.apk"

          RELEASE_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"

          RELEASE_AAB="android/app/build/outputs/bundle/release/app-release.aab"

          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          test -s "$RELEASE_AAB"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt2" \
            dump badging \
            "$DEBUG_APK" \
            | grep -F \
            "package: name='${APP_ID}'"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt2" \
            dump badging \
            "$RELEASE_APK" \
            | grep -F \
            "package: name='${APP_ID}'"

          if [ -f \
            android/app/build/outputs/apk/release/RKMS-Connect-release-signed.apk
          ]; then

            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt2" \
              dump badging \
              android/app/build/outputs/apk/release/RKMS-Connect-release-signed.apk \
              | grep -F \
              "package: name='${APP_ID}'"

          fi

          echo "APK/AAB integrity: PASS"

      # ============================================================
      # 26. COLLECT FINAL ARTIFACTS
      # ============================================================
      - name: Collect final Android artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            release/RKMS-Connect-debug-API36.apk

          cp \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            release/RKMS-Connect-release-unsigned-API36.apk

          cp \
            android/app/build/outputs/bundle/release/app-release.aab \
            release/RKMS-Connect-release-unsigned-API36.aab

          if [ -f \
            android/app/build/outputs/apk/release/RKMS-Connect-release-signed.apk
          ]; then

            cp \
              android/app/build/outputs/apk/release/RKMS-Connect-release-signed.apk \
              release/RKMS-Connect-release-signed-API36.apk

          fi

          if [ -f \
            android/app/build/outputs/bundle/release/RKMS-Connect-release-signed.aab
          ]; then

            cp \
              android/app/build/outputs/bundle/release/RKMS-Connect-release-signed.aab \
              release/RKMS-Connect-release-signed-API36.aab

          fi

          sha256sum \
            release/* \
            | tee release/SHA256SUMS.txt

          echo ""
          echo "=============================================="
          echo "FINAL RKMS RELEASE FILES"
          echo "=============================================="

          ls -lh release/

      # ============================================================
      # 27. UPLOAD ARTIFACTS
      # ============================================================
      - name: Upload APK and AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-Android16-API36-${{ github.run_number }}
          path: release/
          if-no-files-found: error
          retention-days: 14

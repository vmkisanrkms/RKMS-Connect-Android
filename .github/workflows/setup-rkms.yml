name: RKMS Android 16 API 36 - Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-apk:
    name: RKMS Android 16 / API 36 - Release APK
    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare RKMS source root
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f package.json ]; then
            PACKAGE="$(find . -maxdepth 1 -type f -name 'RKMS_CONNECT_V21*.zip' -print -quit)"

            if [ -z "${PACKAGE:-}" ]; then
              echo "ERROR: package.json not found and RKMS V21 ZIP not found."
              exit 1
            fi

            rm -rf .rkms_extract
            mkdir -p .rkms_extract
            unzip -q "$PACKAGE" -d .rkms_extract

            SOURCE_DIR="$(find .rkms_extract -mindepth 1 -maxdepth 3 -type d -name 'rkms_android' -print -quit)"

            if [ -z "${SOURCE_DIR:-}" ]; then
              echo "ERROR: rkms_android directory not found."
              exit 1
            fi

            rsync -a --exclude='.github/' "$SOURCE_DIR"/ ./
            rm -rf .rkms_extract
          fi

          test -f package.json
          test -f app.js
          test -f index.html
          test -f styles.css
          test -f capacitor.config.json
          test -f google-services.json
          test -d scripts
          test -d supabase/migrations

          echo "RKMS SOURCE ROOT: PASS"

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Verify Node.js and JavaScript
        shell: bash
        run: |
          set -euo pipefail

          node --version
          npm --version
          node --check app.js

          echo "Node.js 22: PASS"
          echo "app.js syntax: PASS"

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          npm install --no-audit --no-fund

          npm ls @capacitor/core --depth=0
          npm ls @capacitor/android --depth=0
          npm ls @capacitor/app --depth=0
          npm ls @capacitor/push-notifications --depth=0

          echo "CAPACITOR + FCM DEPENDENCIES: PASS"

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify JDK 17
        shell: bash
        run: |
          set -euo pipefail

          java -version
          javac -version

          echo "JDK 17: PASS"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android 16 API 36 SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

          echo "ANDROID 16 / API 36 SDK: PASS"

      - name: Verify shell scripts
        shell: bash
        run: |
          set -euo pipefail

          for file in scripts/*.sh; do
            bash -n "$file"
          done

          echo "Shell scripts syntax: PASS"

      - name: Verify Python scripts
        shell: bash
        run: |
          set -euo pipefail

          python3 -m py_compile scripts/*.py

          echo "Python scripts syntax: PASS"

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          npm run build

          test -f dist/index.html

          echo "Web build: PASS"

      - name: Add Capacitor Android platform
        shell: bash
        run: |
          set -euo pipefail

          npx cap add android

          test -f android/app/build.gradle
          test -f android/gradlew

          echo "Capacitor Android project: PASS"

      - name: Install Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cp google-services.json android/app/google-services.json

          test -f android/app/google-services.json

          echo "Firebase configuration: PASS"

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/configure-android-16.sh
          bash scripts/configure-android-16.sh

      - name: Capacitor sync Android
        shell: bash
        run: |
          set -euo pipefail

          npx cap sync android

      - name: Setup RKMS native Android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/setup-android-native.sh
          bash scripts/setup-android-native.sh

      - name: Run Android 16 and native audits
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-android-16.py
          python3 scripts/verify-android-pdf.py
          python3 scripts/verify-native-bridge.py
          python3 scripts/verify-rkms-final.py

          echo "ANDROID + NATIVE AUDITS: PASS"

      - name: Audit FCM pipeline
        shell: bash
        run: |
          set -euo pipefail

          test -f google-services.json
          test -f android/app/google-services.json

          grep -q 'com.google.gms:google-services:4.4.3' scripts/setup-android-native.sh
          grep -q 'com.google.gms.google-services' scripts/setup-android-native.sh

          grep -q 'async function rkmsRegisterFcmPush' app.js
          grep -q 'function rkmsDeviceId' app.js
          grep -q 'device_id:rkmsDeviceId()' app.js

          grep -q "addListener('registration'" app.js
          grep -q "addListener('pushNotificationReceived'" app.js
          grep -q "addListener('pushNotificationActionPerformed'" app.js

          grep -q 'rkms_notifications_v2' app.js
          grep -q 'createRkmsNotificationChannel' scripts/setup-android-native.sh
          grep -q 'default_notification_channel_id' scripts/setup-android-native.sh

          grep -q 'visibilitychange' app.js
          grep -q 'rkms-fcm-push' app.js

          CHAT_START="$(grep -n 'async function sendChatMessage' app.js | head -n1 | cut -d: -f1 || true)"
          CHAT_END="$(grep -n 'function showChatActionSheet' app.js | head -n1 | cut -d: -f1 || true)"

          if [ -n "${CHAT_START:-}" ] && [ -n "${CHAT_END:-}" ] && [ "$CHAT_END" -gt "$CHAT_START" ]; then
            if sed -n "${CHAT_START},${CHAT_END}p" app.js | grep -q 'rkms-fcm-dispatch'; then
              echo "ERROR: duplicate client chat push fallback found."
              exit 1
            fi
          fi

          echo "FCM PIPELINE: PASS"

      - name: Audit saved login pipeline
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'function rkmsSaveLoginCredentials(identifier,password)' app.js
          grep -q 'await p.save({identifier:String(identifier).trim(),password:String(password)})' app.js
          grep -q 'const check=await p.getSavedIdentifier()' app.js
          grep -q 'function rkmsRestoreLoginCredentials(inputId,passwordId)' app.js
          grep -q 'p.authenticateAndGetCredentials()' app.js

          grep -q 'let rkmsSavedLoginUsed=false;' app.js
          grep -q 'let rkmsFillingSavedLogin=false;' app.js
          grep -q 'rkmsSavedLoginUsed=true;' app.js

          grep -q 'RKMSSecureCredentialsPlugin' scripts/setup-android-native.sh
          grep -q 'registerPlugin(RKMSSecureCredentialsPlugin.class);' scripts/setup-android-native.sh
          grep -q 'AES/GCM/NoPadding' scripts/setup-android-native.sh
          grep -q 'AndroidKeyStore' scripts/setup-android-native.sh
          grep -q 'BiometricPrompt' scripts/setup-android-native.sh
          grep -q 'androidx.biometric:biometric:1.1.0' scripts/setup-android-native.sh

          echo "SAVED LOGIN PIPELINE: PASS"

      - name: Audit complaint workflow
        shell: bash
        run: |
          set -euo pipefail

          APP="app.js"
          CSS="styles.css"
          OFFICER_SQL="supabase/migrations/20260915090000_complaint_officer_close.sql"
          HARDENING_SQL="supabase/migrations/20260914191000_complaint_workflow_final_hardening.sql"

          test -f "$OFFICER_SQL"
          test -f "$HARDENING_SQL"

          grep -q 'memberCloseComplaint' "$APP"
          grep -q 'memberReopenComplaint' "$APP"
          grep -q 'memberReopenReason' "$APP"
          grep -q 'officerCloseComplaint' "$APP"
          grep -q 'c.status==="RESOLVED"' "$APP"
          grep -q 'rkms_officer_close_complaint' "$APP"

          grep -q "if v_old<>'RESOLVED'" "$OFFICER_SQL"
          grep -q "if v_old<>'RESOLVED'" "$HARDENING_SQL"
          grep -q "nullif(trim(p_reason),'') is null" "$HARDENING_SQL"
          grep -q "v_old not in ('RESOLVED','CLOSED')" "$HARDENING_SQL"

          grep -q '.complaint-action-card' "$CSS"

          echo "COMPLAINT WORKFLOW: PASS"

      - name: Audit original RKMS launcher
        shell: bash
        run: |
          set -euo pipefail

          test -f assets/rkms-launcher-original-transparent.png

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -f "android_launcher_icons/mipmap-$density/ic_launcher.png"
            test -f "android_launcher_icons/mipmap-$density/ic_launcher_round.png"
          done

          test -f android_launcher_icons/drawable-nodpi/rkms_launcher_foreground.png

          echo "ORIGINAL RKMS LAUNCHER: PASS"

      - name: Audit no X Twitter references
        shell: bash
        run: |
          set -euo pipefail

          if grep -RniE 'twitter\.com|x\.com/|twitter:card' app.js index.html styles.css assets android_launcher_icons 2>/dev/null; then
            echo "ERROR: X/Twitter runtime reference found."
            exit 1
          fi

          echo "No X/Twitter runtime reference: PASS"

      - name: Check release signing configuration
        id: signing
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${RKMS_KEYSTORE_BASE64:-}" ] && [ -n "${RKMS_KEYSTORE_PASSWORD:-}" ] && [ -n "${RKMS_KEY_ALIAS:-}" ] && [ -n "${RKMS_KEY_PASSWORD:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Release signing: ENABLED"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets unavailable."
            echo "Build will continue without release signing."
          fi

      - name: Prepare release keystore
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$RKMS_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

          chmod 600 android/app/release.keystore

          test -s android/app/release.keystore

          echo "Release keystore: PASS"

      - name: Configure release signing
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/configure-release-signing.sh
          bash scripts/configure-release-signing.sh

          echo "Release signing configuration: PASS"

      - name: Verify Gradle
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew
          ./gradlew --version

      - name: Clean Android
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean --no-daemon

      - name: Build RELEASE APK ONLY
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"
          test -s "$APK"

          echo "============================================="
          echo " RKMS ANDROID 16 / API 36 RELEASE APK PASS "
          echo "============================================="

          ls -lh "$APK"

      - name: Verify signed APK
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          test -x "$APKSIGNER"

          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/release/app-release.apk

          echo "Release APK signature: PASS"

      - name: Upload Release APK
        uses: actions/upload-artifact@v6
        with:
          name: RKMS-Android-16-API36-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Final APK build summary
        shell: bash
        run: |
          echo "=================================================="
          echo " RKMS CONNECT - FINAL RELEASE APK "
          echo "=================================================="
          echo "Android  : 16 / API 36"
          echo "JDK      : 17"
          echo "Node     : 22"
          echo "Gradle   : 8.11.1"
          echo "AGP      : 8.9.1"
          echo "Output   : app-release.apk"
          echo "Build    : RELEASE APK ONLY"
          echo "=================================================="

name: RKMS Android 16 API 36 - Final Release AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-aab:
    name: RKMS Final Android 16 API 36 AAB
    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. SHOW SOURCE
      # ============================================================
      - name: Locate RKMS source
        shell: bash
        run: |
          set -e

          echo "Repository:"
          pwd

          echo "Root files:"
          ls -la

          if [ -f "package.json" ] && \
             [ -f "app.js" ] && \
             [ -f "index.html" ]; then

            echo "Using checked-out repository root."

          else
            echo "Repository root source not found."

            CANDIDATE=""

            if [ -f "RKMS_CONNECT_FIXED_2026-09-18.zip" ]; then
              CANDIDATE="RKMS_CONNECT_FIXED_2026-09-18.zip"
            elif [ -f "RKMS_CONNECT_FINAL_RULES_FIXED_2026-09-17.zip" ]; then
              CANDIDATE="RKMS_CONNECT_FINAL_RULES_FIXED_2026-09-17.zip"
            else
              CANDIDATE="$(find . -maxdepth 2 -type f \
                -name 'RKMS_CONNECT*.zip' | head -n 1 || true)"
            fi

            if [ -z "$CANDIDATE" ]; then
              echo "ERROR: RKMS source ZIP not found."
              exit 1
            fi

            echo "Using source ZIP: $CANDIDATE"

            mkdir -p rkms_source
            unzip -q "$CANDIDATE" -d rkms_source

            SOURCE_DIR="$(find rkms_source -type f \
              -name package.json -print -quit | xargs -r dirname)"

            if [ -z "$SOURCE_DIR" ]; then
              echo "ERROR: package.json not found after ZIP extraction."
              exit 1
            fi

            echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          fi

          if [ -z "${SOURCE_DIR:-}" ]; then
            echo "SOURCE_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          fi

      # ============================================================
      # 3. VERIFY REQUIRED SOURCE
      # ============================================================
      - name: Verify RKMS source
        shell: bash
        run: |
          set -e
          cd "$SOURCE_DIR"

          test -f package.json
          test -f app.js
          test -f index.html
          test -f capacitor.config.json
          test -f google-services.json

          echo "RKMS source verification PASS."

      # ============================================================
      # 4. NODE.JS 22
      # ============================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.SOURCE_DIR }}/package-lock.json

      # ============================================================
      # 5. NPM INSTALL
      # ============================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -e
          cd "$SOURCE_DIR"

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # ============================================================
      # 6. JAVASCRIPT SYNTAX CHECK
      # ============================================================
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e
          cd "$SOURCE_DIR"

          node --check app.js

          echo "JavaScript syntax PASS."

      # ============================================================
      # 7. WEB BUILD
      # ============================================================
      - name: Build web application
        shell: bash
        run: |
          set -e
          cd "$SOURCE_DIR"

          if node -e "
            const p=require('./package.json');
            process.exit(
              p.scripts && p.scripts.build ? 0 : 1
            );
          "; then
            npm run build
          else
            echo "No npm build script found."
            echo "Using existing web source."
          fi

      # ============================================================
      # 8. JAVA 17
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ============================================================
      # 9. ANDROID SDK 36
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 API 36
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "Android API 36 installed."

      # ============================================================
      # 10. CAPACITOR ANDROID
      # ============================================================
      - name: Prepare Capacitor Android
        shell: bash
        run: |
          set -e
          cd "$SOURCE_DIR"

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      # ============================================================
      # 11. CONFIGURE ANDROID 16
      # ============================================================
      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -e
          cd "$SOURCE_DIR"

          if [ -f scripts/configure-android-16.sh ]; then
            chmod +x scripts/configure-android-16.sh
            ./scripts/configure-android-16.sh
          else
            echo "ERROR: configure-android-16.sh missing."
            exit 1
          fi

      # ============================================================
      # 12. NATIVE RKMS SETUP
      # ============================================================
      - name: Configure RKMS native Android
        shell: bash
        run: |
          set -e
          cd "$SOURCE_DIR"

          if [ ! -f scripts/setup-android-native.sh ]; then
            echo "ERROR: setup-android-native.sh missing."
            exit 1
          fi

          chmod +x scripts/setup-android-native.sh
          ./scripts/setup-android-native.sh

      # ============================================================
      # 13. VERIFY FIREBASE CONFIG
      # ============================================================
      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -e
          cd "$SOURCE_DIR"

          test -f google-services.json
          test -f android/app/google-services.json

          grep -q '"package_name"[[:space:]]*:[[:space:]]*"org.rkms.connect"' \
            google-services.json

          grep -Rqs \
            'FirebaseApp.initializeApp(this)' \
            android/app/src/main/java

          echo "Firebase configuration PASS."
          echo "Native Firebase initialization PASS."

      # ============================================================
      # 14. VERIFY ANDROID PACKAGE / SDK
      # ============================================================
      - name: Verify Android package and SDK
        shell: bash
        run: |
          set -e
          cd "$SOURCE_DIR"

          grep -Rqs \
            'org.rkms.connect' \
            android/app/src/main

          grep -Rqs \
            'compileSdk.*36\|compileSdkVersion.*36' \
            android

          grep -Rqs \
            'targetSdk.*36\|targetSdkVersion.*36' \
            android

          echo "Android package/API verification PASS."

      # ============================================================
      # 15. VERIFY NATIVE BRIDGE
      # ============================================================
      - name: Verify RKMS Native Bridge
        shell: bash
        run: |
          set -e
          cd "$SOURCE_DIR"

          grep -Rqs "RKMSNativeBridge" android/app/src/main/java

          echo "RKMS Native Bridge PASS."

      # ============================================================
      # 16. VERIFY SAVED LOGIN / BIOMETRIC
      # ============================================================
      - name: Verify saved login
        shell: bash
        run: |
          set -e
          cd "$SOURCE_DIR"

          if [ -f scripts/verify-saved-login.py ]; then
            python3 scripts/verify-saved-login.py
          else
            echo "Saved-login verification script not found."
          fi

      # ============================================================
      # 17. VERIFY FCM PIPELINE
      # ============================================================
      - name: Verify FCM pipeline
        shell: bash
        run: |
          set -e
          cd "$SOURCE_DIR"

          if [ -f scripts/verify-fcm-pipeline.py ]; then
            python3 scripts/verify-fcm-pipeline.py
          else
            echo "FCM verification script not found."
          fi

      # ============================================================
      # 18. VERIFY LOGIN / NAVIGATION
      # ============================================================
      - name: Verify login and navigation
        shell: bash
        run: |
          set -e
          cd "$SOURCE_DIR"

          if [ -f scripts/verify-final-login-navigation.py ]; then
            python3 scripts/verify-final-login-navigation.py
          fi

      # ============================================================
      # 19. VERIFY AUTHORITY HIERARCHY
      # ============================================================
      - name: Verify authority hierarchy
        shell: bash
        run: |
          set -e
          cd "$SOURCE_DIR"

          if [ -f scripts/verify-authority-hierarchy.py ]; then
            python3 scripts/verify-authority-hierarchy.py
          fi

      # ============================================================
      # 20. VERIFY DIRECTORY
      # ============================================================
      - name: Verify directory
        shell: bash
        run: |
          set -e
          cd "$SOURCE_DIR"

          if [ -f scripts/verify-directory-lists.py ]; then
            python3 scripts/verify-directory-lists.py
          fi

          if [ -f scripts/verify-member-directory-scope.py ]; then
            python3 scripts/verify-member-directory-scope.py
          fi

      # ============================================================
      # 21. VERIFY CONTENT MANAGEMENT
      # ============================================================
      - name: Verify content management
        shell: bash
        run: |
          set -e
          cd "$SOURCE_DIR"

          if [ -f scripts/verify-content-management-final.py ]; then
            python3 scripts/verify-content-management-final.py
          fi

      # ============================================================
      # 

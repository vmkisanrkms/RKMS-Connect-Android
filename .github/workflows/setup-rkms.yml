name: RKMS Android 16 API 36 - Final Signed Release APK Only

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  APP_ID: "org.rkms.connect"

  SOURCE_ZIP: "RKMS_CONNECT_FINAL_AUDITED_RELEASE_APK_BUILD_20260922.zip"
  SOURCE_SHA256: "6907af2bd83ccb6a36b0aa177861ae0731c6f53501430b9fe05fd5b905d65299"

jobs:

  build:

    name: RKMS Final Signed Release APK

    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # NODE 22
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # ============================================================
      # HOST PACKAGES
      # ============================================================

      - name: Install required host packages
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y unzip rsync

          echo "HOST PACKAGES: PASS"


      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""


      - name: Install Android API 36 SDK packages
        shell: bash
        run: |
          set -euo pipefail

          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME"

          echo "Installing Android Platform 36..."
          echo "Installing Android Build Tools 36.0.0..."

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          test -d \
            "$ANDROID_HOME/platforms/android-36"

          test -d \
            "$ANDROID_HOME/build-tools/36.0.0"

          test -x \
            "$ANDROID_HOME/build-tools/36.0.0/aapt"

          test -x \
            "$ANDROID_HOME/build-tools/36.0.0/apksigner"

          echo "ANDROID PLATFORM 36: PASS"
          echo "BUILD TOOLS 36.0.0: PASS"


      # ============================================================
      # VERIFY ANDROID SDK
      # ============================================================

      - name: Verify Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not-set}"

          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME"

          sdkmanager --version

          test -d \
            "$ANDROID_HOME/platforms/android-36"

          test -d \
            "$ANDROID_HOME/build-tools/36.0.0"

          test -x \
            "$ANDROID_HOME/build-tools/36.0.0/aapt"

          test -x \
            "$ANDROID_HOME/build-tools/36.0.0/apksigner

          echo "ANDROID SDK 36: PASS"
          echo "BUILD TOOLS 36.0.0: PASS"


      # ============================================================
      # VERIFY SOURCE ZIP
      # ============================================================

      - name: Verify RKMS source ZIP
        shell: bash
        run: |
          set -euo pipefail

          test -s "$SOURCE_ZIP"

          ACTUAL_SHA="$(
            sha256sum "$SOURCE_ZIP" |
            awk '{print $1}'
          )"

          echo "Expected SHA256:"
          echo "$SOURCE_SHA256"

          echo "Actual SHA256:"
          echo "$ACTUAL_SHA"

          if [ "$ACTUAL_SHA" != "$SOURCE_SHA256" ]; then
            echo "::error::RKMS source ZIP SHA256 mismatch."
            exit 1
          fi

          echo "SOURCE ZIP SHA256: PASS"


      # ============================================================
      # EXTRACT ZIP
      # ============================================================

      - name: Extract RKMS source ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf rkms-build
          mkdir -p rkms-build

          unzip -q \
            "$SOURCE_ZIP" \
            -d rkms-build

          if [ -f "rkms-build/final_audit_src/package.json" ]; then

            ROOT="rkms-build/final_audit_src"

          elif [ -f "rkms-build/package.json" ]; then

            ROOT="rkms-build"

          else

            PACKAGE_FILE="$(
              find rkms-build \
                -type f \
                -name package.json \
                -not -path '*/node_modules/*' \
                -print |
                head -n 1 || true
            )"

            test -n "$PACKAGE_FILE"

            ROOT="$(dirname "$PACKAGE_FILE")"

          fi

          test -s "$ROOT/package.json"

          echo "RKMS_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "RKMS ROOT:"
          echo "$ROOT"
          echo "=========================================="


      # ============================================================
      # VERIFY ZIP STRUCTURE
      # ============================================================

      - name: Verify ZIP source structure
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          test -s package.json
          test -s package-lock.json

          test -s app.js
          test -s index.html
          test -s styles.css

          test -s capacitor.config.json
          test -s google-services.json

          test -s scripts/setup-android-native.sh
          test -s scripts/configure-android-16.sh
          test -s scripts/configure-release-signing.sh

          test -s scripts/verify-android-16.py
          test -s scripts/verify-rkms-final-fixes.py
          test -s scripts/verify-fcm-pipeline.py
          test -s scripts/verify-native-bridge.py
          test -s scripts/verify-android-pdf.py

          node --check app.js

          python3 -m json.tool \
            capacitor.config.json \
            >/dev/null

          python3 -m json.tool \
            google-services.json \
            >/dev/null

          echo "ZIP SOURCE STRUCTURE: PASS"


      # ============================================================
      # VERIFY PACKAGE VERSIONS
      # ============================================================

      - name: Verify package versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node - <<'NODE'
          const fs = require("fs");

          const p = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const d = {
            ...(p.dependencies || {}),
            ...(p.devDependencies || {})
          };

          const wanted = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          for (const [name, version] of Object.entries(wanted)) {
            if (d[name] !== version) {
              throw new Error(
                `${name}: expected ${version}, found ${d[name] || "MISSING"}`
              );
            }
          }

          if (
            !p.scripts ||
            typeof p.scripts.build !== "string" ||
            !p.scripts.build.trim()
          ) {
            throw new Error(
              "package.json does not contain a valid build script"
            );
          }

          console.log("Build script found:");
          console.log(p.scripts.build);

          console.log("PACKAGE/VERSION CHECK: PASS");
          NODE


      # ============================================================
      # VERIFY FIREBASE
      # ============================================================

      - name: Verify Firebase package
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node - <<'NODE'
          const fs = require("fs");

          const j = JSON.parse(
            fs.readFileSync(
              "google-services.json",
              "utf8"
            )
          );

          const ok = (j.client || []).some(
            c =>
              c.client_info?.android_client_info?.package_name ===
              "org.rkms.connect"
          );

          if (!ok) {
            throw new Error(
              "google-services.json does not contain org.rkms.connect"
            );
          }

          console.log("FIREBASE PACKAGE CHECK: PASS");
          NODE


      # ============================================================
      # REPAIR NATIVE SETUP SCRIPT
      # ============================================================

      - name: Repair known malformed native setup block
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          EXPECTED_SETUP_SHA="d8cdb6c16fb4c6ac768a4ca515f42224097a77419ca5bccd9dd38ab990b3e305"

          ACTUAL_SETUP_SHA="$(
            sha256sum scripts/setup-android-native.sh |
            awk '{print $1}'
          )"

          if [ "$ACTUAL_SETUP_SHA" != "$EXPECTED_SETUP_SHA" ]; then
            echo "::error::Unexpected setup-android-native.sh version."
            echo "Expected: $EXPECTED_SETUP_SHA"
            echo "Actual:   $ACTUAL_SETUP_SHA"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          p = Path("scripts/setup-android-native.sh")

          s = p.read_text(encoding="utf-8")

          start = s.find("python3 - <<'PY3'")

          if start < 0:
              raise SystemExit(
                  "Malformed nested Python block start not found"
              )

          marker = 'MAIN="$MAIN_ACTIVITY"'

          main_pos = s.find(marker, start)

          if main_pos < 0:
              raise SystemExit(
                  'MAIN="$MAIN_ACTIVITY" marker not found'
              )

          replacement = r'''
          # ------------------------------------------------------------------
          # Stable FCM notification icon + Android manifest requirements.
          # ------------------------------------------------------------------

          RES_DIR="android/app/src/main/res"
          VALUES_DIR="$RES_DIR/values"
          DRAWABLE_DIR="$RES_DIR/drawable"

          mkdir -p "$VALUES_DIR"
          mkdir -p "$DRAWABLE_DIR"

          STRINGS="$VALUES_DIR/strings.xml"

          if [ -f "$STRINGS" ]; then

            if ! grep -Fq \
              "rkms_default_notification_channel_id" \
              "$STRINGS"
            then

              sed -i \
                's#</resources>#    <string name="rkms_default_notification_channel_id">rkms_notifications_v2</string>\n</resources>#' \
                "$STRINGS"

            fi

          else

            cat > "$STRINGS" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="rkms_default_notification_channel_id">rkms_notifications_v2</string>
          </resources>
          XML

          fi

          cat > "$DRAWABLE_DIR/ic_stat_rkms.xml" <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">

              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M12,2A7,7 0,0 0,5 9v4l-2,3v1h18v-1l-2,-3V9A7,7 0,0 0,12 2M9,19a3,3 0,0 0,6 0z"/>

          </vector>
          XML

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "AndroidManifest.xml not found"
            exit 1
          fi

          if ! grep -Fq \
            "android.permission.RECORD_AUDIO" \
            "$MANIFEST"
          then

            sed -i \
              '/<application/i\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' \
              "$MANIFEST"

          fi

          if ! grep -Fq \
            "android.permission.POST_NOTIFICATIONS" \
            "$MANIFEST"
          then

            sed -i \
              '/<application/i\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' \
              "$MANIFEST"

          fi

          if ! grep -Fq \
            'android:enableOnBackInvokedCallback="true"' \
            "$MANIFEST"
          then

            sed -i \
              's#<application#<application android:enableOnBackInvokedCallback="true"#' \
              "$MANIFEST"

          fi

          if ! grep -Fq \
            "com.google.firebase.messaging.default_notification_channel_id" \
            "$MANIFEST"
          then

            sed -i \
              '/<\/application>/i\        <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="@string/rkms_default_notification_channel_id" />' \
              "$MANIFEST"

          fi

          if ! grep -Fq \
            "com.google.firebase.messaging.default_notification_icon" \
            "$MANIFEST"
          then

            sed -i \
              '/<\/application>/i\        <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_rkms" />' \
              "$MANIFEST"

          fi
          '''

          s = (
              s[:start]
              + replacement
              + "\n"
              + s[main_pos:]
          )

          p.write_text(
              s,
              encoding="utf-8"
          )

          print("Known malformed native setup block repaired.")
          PY

          chmod +x scripts/setup-android-native.sh

          bash -n scripts/setup-android-native.sh

          grep -Fq \
            'android.permission.RECORD_AUDIO' \
            scripts/setup-android-native.sh

          grep -Fq \
            'android.permission.POST_NOTIFICATIONS' \
            scripts/setup-android-native.sh

          grep -Fq \
            'android:enableOnBackInvokedCallback="true"' \
            scripts/setup-android-native.sh

          echo "NATIVE SETUP SCRIPT REPAIR: PASS"


      # ============================================================
      # NPM
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm ci \
            --no-audit \
            --no-fund

          echo "NPM INSTALL: PASS"


      # ============================================================
      # WEB BUILD
      # ============================================================

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm run build

          test -s dist/index.html

          echo "WEB BUILD: PASS"


      # ============================================================
      # CAPACITOR ANDROID
      # ============================================================

      - name: Generate Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          rm -rf android

          npx cap add android

          test -s android/gradlew
          test -s android/app/build.gradle

          chmod +x android/gradlew

          echo "CAPACITOR ANDROID GENERATION: PASS"


      # ============================================================
      # ANDROID 16 / API 36
      # ============================================================

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x scripts/configure-android-16.sh

          ./scripts/configure-android-16.sh

          python3 - <<'PY'
          from pathlib import Path
          import re

          variables = Path("android/variables.gradle")

          s = variables.read_text(encoding="utf-8")

          for key, value in {
              "compileSdkVersion": "36",
              "targetSdkVersion": "36",
              "minSdkVersion": "23",
          }.items():

              s = re.sub(
                  rf"(\b{key}\s*=\s*)\d+",
                  rf"\g<1>{value}",
                  s
              )

          variables.write_text(
              s,
              encoding="utf-8"
          )

          for path in Path("android").rglob("*"):

              if not path.is_file():
                  continue

              if path.suffix not in (".gradle", ".kts"):
                  continue

              s = path.read_text(
                  encoding="utf-8"
              )

              s = re.sub(
                  r"(\bminSdkVersion\s*=?\s*)22\b",
                  r"\g<1>23",
                  s
              )

              path.write_text(
                  s,
                  encoding="utf-8"
              )
          PY

          grep -Eq \
            'compileSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

          grep -Eq \
            'targetSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

          grep -Eq \
            'minSdkVersion[[:space:]]*=[[:space:]]*23' \
            android/variables.gradle

          grep -Fq \
            'com.android.tools.build:gradle:8.9.1' \
            android/build.gradle

          grep -Fq \
            'gradle-8.11.1-bin.zip' \
            android/gradle/wrapper/gradle-wrapper.properties

          echo "ANDROID 16 API 36 CONFIGURATION: PASS"


      # ============================================================
      # CAPACITOR SYNC
      # ============================================================

      - name: Sync Capacitor
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npx cap sync android

          echo "CAPACITOR SYNC: PASS"


      # ============================================================
      # RKMS NATIVE SETUP
      # ============================================================

      - name: Apply RKMS native Android setup
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x scripts/setup-android-native.sh

          ./scripts/setup-android-native.sh

          test -s \
            android/app/google-services.json

          MAIN_ACTIVITY="$(
            find android/app/src/main \
              -type f \
              -name "MainActivity.java" \
              -print |
              head -n 1
          )"

          BRIDGE_FILE="$(
            find android/app/src/main \
              -type f \
              -name "RKMSNativeBridge.java" \
              -print |
              head -n 1
          )"

          test -n "$MAIN_ACTIVITY"
          test -n "$BRIDGE_FILE"

          test -s "$MAIN_ACTIVITY"
          test -s "$BRIDGE_FILE"

          grep -Fq \
            'FirebaseApp.initializeApp(this)' \
            "$MAIN_ACTIVITY"

          grep -Fq \
            'RKMSNativeBridge' \
            "$MAIN_ACTIVITY"

          echo "RKMS NATIVE SETUP: PASS"


      # ============================================================
      # MANIFEST
      # ============================================================

      - name: Verify final AndroidManifest
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET

          p = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if not p.exists():
              raise SystemExit(
                  "AndroidManifest.xml not found"
              )

          s = p.read_text(
              encoding="utf-8"
          )

          required = [
              "android.permission.RECORD_AUDIO",
              "android.permission.POST_NOTIFICATIONS",
              'android:enableOnBackInvokedCallback="true"',
          ]

          for value in required:

              if value not in s:
                  raise SystemExit(
                      f"Manifest requirement missing: {value}"
                  )

          ET.parse(p)

          print("ANDROID MANIFEST XML: PASS")
          PY


      # ============================================================
      # FIREBASE MESSAGING
      # ============================================================

      - name: Ensure Firebase Messaging SDK
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "android/app/build.gradle"
          )

          s = p.read_text(
              encoding="utf-8"
          )

          bom = (
              "implementation platform("
              "'com.google.firebase:firebase-bom:33.9.0'"
              ")"
          )

          messaging = (
              "implementation "
              "'com.google.firebase:firebase-messaging'"
          )

          match = re.search(
              r"(?m)^[ \t]*dependencies[ \t]*\{",
              s
          )

          if not match:
              raise SystemExit(
                  "dependencies block not found"
              )

          start = match.end()

          depth = 1
          pos = start

          while pos < len(s) and depth:

              if s[pos] == "{":
                  depth += 1

              elif s[pos] == "}":
                  depth -= 1

              pos += 1

          if depth != 0:
              raise SystemExit(
                  "Malformed dependencies block"
              )

          end = pos - 1
          block = s[start:end]

          if "com.google.firebase:firebase-bom:" not in block:

              block = (
                  "\n    "
                  + bom
                  + "\n"
                  + block
              )

          if "com.google.firebase:firebase-messaging" not in block:

              block += (
                  "\n    "
                  + messaging
                  + "\n"
              )

          p.write_text(
              s[:start]
              + block
              + s[end:],
              encoding="utf-8"
          )
          PY

          grep -Fq \
            'com.google.firebase:firebase-bom:33.9.0' \
            android/app/build.gradle

          grep -Fq \
            'com.google.firebase:firebase-messaging' \
            android/app/build.gradle

          echo "FIREBASE MESSAGING SDK: PASS"


      # ============================================================
      # FORCE SDK
      # ============================================================

      - name: Force final Android SDK versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "android/variables.gradle"
          )

          s = p.read_text(
              encoding="utf-8"
          )

          for key, value in [
              ("compileSdkVersion", "36"),
              ("targetSdkVersion", "36"),
              ("minSdkVersion", "23"),
          ]:

              s = re.sub(
                  rf"(\b{key}\s*=\s*)\d+",
                  rf"\g<1>{value}",
                  s
              )

          p.write_text(
              s,
              encoding="utf-8"
          )

          for gradle_file in Path("android").rglob("*"):

              if not gradle_file.is_file():
                  continue

              if gradle_file.suffix not in (
                  ".gradle",
                  ".kts"
              ):
                  continue

              s = gradle_file.read_text(
                  encoding="utf-8"
              )

              s = re.sub(
                  r"(\bminSdkVersion\s*=?\s*)22\b",
                  r"\g<1>23",
                  s
              )

              gradle_file.write_text(
                  s,
                  encoding="utf-8"
              )
          PY

          grep -Eq \
            'compileSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

          grep -Eq \
            'targetSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

          grep -Eq \
            'minSdkVersion[[:space:]]*=[[:space:]]*23' \
            android/variables.gradle

          if grep -RInE \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            'minSdkVersion[[:space:]]*=?[[:space:]]*22([[:space:]]|$)' \
            android
          then
            echo "::error::minSdkVersion 22 remains."
            exit 1
          fi

          echo "FINAL SDK VERSION CONFIGURATION: PASS"


      # ============================================================
      # STATIC AUDITS
      # ============================================================

      - name: Run RKMS static audits
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 scripts/verify-android-16.py
          python3 scripts/verify-rkms-final-fixes.py
          python3 scripts/verify-fcm-pipeline.py
          python3 scripts/verify-native-bridge.py
          python3 scripts/verify-android-pdf.py

          if [ -f "scripts/verify-saved-login.py" ]; then

            python3 \
              scripts/verify-saved-login.py

            echo "SAVED LOGIN AUDIT: PASS"

          else

            echo "SAVED LOGIN AUDIT: SKIPPED"

          fi

          echo "ALL RKMS STATIC AUDITS: PASS"


      # ============================================================
      # SIGNING SECRETS
      # ============================================================

      - name: Verify release signing secrets
        shell: bash
        run: |
          set -euo pipefail

          test -n \
            "${RKMS_KEYSTORE_BASE64:-}" || {
              echo "::error::RKMS_KEYSTORE_BASE64 secret missing."
              exit 1
            }

          test -n \
            "${RKMS_KEYSTORE_PASSWORD:-}" || {
              echo "::error::RKMS_KEYSTORE_PASSWORD secret missing."
              exit 1
            }

          test -n \
            "${RKMS_KEY_ALIAS:-}" || {
              echo "::error::RKMS_KEY_ALIAS secret missing."
              exit 1
            }

          test -n \
            "${RKMS_KEY_PASSWORD:-}" || {
              echo "::error::RKMS_KEY_PASSWORD secret missing."
              exit 1
            }

          echo "RELEASE SIGNING SECRETS: PASS"


      # ============================================================
      # RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/configure-release-signing.sh

          ./scripts/configure-release-signing.sh

          test -s \
            android/app/release.keystore

          grep -Fq \
            'storeFile file("release.keystore")' \
            android/app/build.gradle

          grep -Fq \
            'signingConfig signingConfigs.release' \
            android/app/build.gradle

          echo "RELEASE SIGNING CONFIGURATION: PASS"


      # ============================================================
      # KEYSTORE
      # ============================================================

      - name: Verify release keystore
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          keytool \
            -list \
            -keystore android/app/release.keystore \
            -storepass "$RKMS_KEYSTORE_PASSWORD" \
            -alias "$RKMS_KEY_ALIAS" \
            >/dev/null

          echo "KEYSTORE VALIDATION: PASS"


      # ============================================================
      # GRADLE
      # ============================================================

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          chmod +x gradlew

          ./gradlew \
            --version \
            --no-daemon

          echo "GRADLE WRAPPER: PASS"


      # ============================================================
      # CLEAN
      # ============================================================

      - name: Clean Android build
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          ./gradlew \
            clean \
            --no-daemon

          echo "GRADLE CLEAN: PASS"


      # ============================================================
      # FINAL ANDROID AUDIT
      # ============================================================

      - name: Final Android 16 API 36 audit
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          grep -Eq \
            'compileSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

          grep -Eq \
            'targetSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

          grep -Eq \
            'minSdkVersion[[:space:]]*=[[:space:]]*23' \
            android/variables.gradle

          grep -Fq \
            'com.android.tools.build:gradle:8.9.1' \
            android/build.gradle

          grep -Fq \
            'gradle-8.11.1-bin.zip' \
            android/gradle/wrapper/gradle-wrapper.properties

          echo "ANDROID 16 API 36 FINAL AUDIT: PASS"


      # ============================================================
      # FINAL SIGNED RELEASE APK
      #
      # IMPORTANT FIX:
      # APK output directory is NOT hard-coded.
      # Gradle can use a custom buildDir.
      #
      # We search the COMPLETE RKMS ROOT for the actual
      # release APK after assembleRelease succeeds.
      #
      # NO DEBUG APK
      # NO AAB
      # ONLY RELEASE APK
      # ============================================================

      - name: Build final signed release APK only
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          rm -rf \
            app/build/outputs/apk/release

          rm -rf \
            app/build/outputs/bundle

          echo "=========================================="
          echo "BUILDING FINAL SIGNED RELEASE APK"
          echo "=========================================="

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          echo "=========================================="
          echo "GRADLE BUILD SUCCESSFUL"
          echo "SEARCHING COMPLETE BUILD TREE"
          echo "=========================================="

          cd "$RKMS_ROOT"

          echo "Searching for RELEASE APK..."

          APK_LIST="$(
            find "$RKMS_ROOT" \
              -type f \
              -name "*.apk" \
              -path "*/release/*" \
              -not -path "*/node_modules/*" \
              -not -path "*/.gradle/*" \
              -print
          )"

          echo "Release APK candidates:"
          printf '%s\n' "$APK_LIST"

          if [ -z "$APK_LIST" ]; then

            echo "::error::No RELEASE APK found after successful Gradle build."

            echo "Searching for ALL APK files..."

            find "$RKMS_ROOT" \
              -type f \
              -name "*.apk" \
              -not -path "*/node_modules/*" \
              -not -path "*/.gradle/*" \
              -print || true

            echo "Searching Android build directories..."

            find "$RKMS_ROOT/android" \
              -type d \
              -name "build" \
              -print || true

            exit 1

          fi

          APK_COUNT="$(
            printf '%s\n' "$APK_LIST" |
            sed '/^[[:space:]]*$/d' |
            wc -l
          )"

          echo "Release APK count: $APK_COUNT"

          if [ "$APK_COUNT" -ne 1 ]; then

            echo "::error::Expected exactly ONE release APK."

            echo "Found:"
            printf '%s\n' "$APK_LIST"

            exit 1

          fi

          APK="$(
            printf '%s\n' "$APK_LIST" |
            head -n 1
          )"

          test -f "$APK"
          test -s "$APK"

          echo "=========================================="
          echo "RELEASE APK FOUND"
          echo "$APK"
          echo "=========================================="

          FINAL_APK="$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"

          cp \
            "$APK" \
            "$FINAL_APK"

          test -f "$FINAL_APK"
          test -s "$FINAL_APK"

          echo \
            "APK_PATH=$FINAL_APK" \
            >> "$GITHUB_ENV"

          echo "=========================================="
          echo "FINAL SIGNED RELEASE APK BUILD: PASS"
          echo "=========================================="

          echo "SOURCE APK:"
          echo "$APK"

          echo "FINAL APK:"
          echo "$FINAL_APK"

          echo "APK SIZE:"
          stat -c%s "$FINAL_APK"


      # ============================================================
      # VERIFY NO AAB
      # ============================================================

      - name: Verify no AAB was generated
        shell: bash
        run: |
          set -euo pipefail

          if find "$RKMS_ROOT/android" \
            -type f \
            -name "*.aab" \
            -print |
            grep -q .
          then

            echo "::error::AAB output detected."

            find "$RKMS_ROOT/android" \
              -type f \
              -name "*.aab"

            exit 1

          fi

          echo "AAB: NONE"


      # ============================================================
      # VERIFY APK PACKAGE + SDK
      # ============================================================

      - name: Verify final APK package and SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          test -n "$SDK_ROOT"

          AAPT="$SDK_ROOT/build-tools/$BUILD_TOOLS/aapt"

          APKSIGNER="$SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner"

          test -x "$AAPT"
          test -x "$APKSIGNER"

          "$AAPT" \
            dump badging \
            "$APK_PATH" |
            tee \
            "$GITHUB_WORKSPACE/apk-badging.txt"

          grep -Fq \
            "package: name='$APP_ID'" \
            "$GITHUB_WORKSPACE/apk-badging.txt"

          grep -Fq \
            "targetSdkVersion:'36'" \
            "$GITHUB_WORKSPACE/apk-badging.txt"

          echo "APK PACKAGE: PASS"
          echo "TARGET SDK 36: PASS"


      # ============================================================
      # VERIFY SIGNATURE
      # ============================================================

      - name: Verify final APK signature
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          APKSIGNER="$SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner"

          "$APKSIGNER" \
            verify \
            --verbose \
            "$APK_PATH"

          "$APKSIGNER" \
            verify \
            --print-certs \
            "$APK_PATH"

          echo "APK SIGNATURE: PASS"


      # ============================================================
      # SHA256
      # ============================================================

      - name: Generate APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            "$APK_PATH" |
            tee \
            "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256"

          echo "APK SHA256 GENERATED: PASS"


      # ============================================================
      # FINAL APK ONLY AUDIT
      # ============================================================

      - name: Final APK-only audit
        shell: bash
        run: |
          set -euo pipefail

          test -s "$APK_PATH"

          test -s \
            "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256"

          if find "$RKMS_ROOT/android" \
            -type f \
            -name "*.aab" \
            -print |
            grep -q .
          then

            echo "::error::AAB output detected."
            exit 1

          fi

          if find "$RKMS_ROOT/android" \
            -type f \
            -iname "*debug*.apk" \
            -print |
            grep -q .
          then

            echo "::error::Debug APK output detected."
            exit 1

          fi

          SIZE="$(
            stat -c%s "$APK_PATH"
          )"

          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::APK size is unexpectedly small."
            exit 1
          fi

          echo "=========================================="
          echo "FINAL APK-ONLY AUDIT: PASS"
          echo "=========================================="

          echo "APK:"
          echo "$APK_PATH"

          echo "SIZE:"
          echo "$SIZE bytes"

          echo "SHA256:"
          cat \
            "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256"


      # ============================================================
      # UPLOAD FINAL APK
      # ============================================================

      - name: Upload final signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS_ANDROID16_API36_FINAL_SIGNED_RELEASE_APK
          if-no-files-found: error
          path: |
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256
          retention-days: 30

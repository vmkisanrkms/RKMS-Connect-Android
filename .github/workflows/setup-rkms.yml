name: Build RKMS Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_SOURCE_COMMIT: cf252628308e5a6ecc9eafbaf4ca227a3ad8ec92
  GRADLE_VERSION: "8.9"

jobs:
  build:
    name: Build RKMS Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # =========================================================
      # 1. Checkout repository
      # =========================================================
      - name: Checkout RKMS repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1


      # =========================================================
      # 2. Setup Java
      # =========================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # 3. Prepare verified native Android project
      # =========================================================
      - name: Prepare native Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$RUNNER_TEMP/rkms-android"

          rm -rf "$PROJECT_DIR"

          echo "Cloning verified Android source..."

          git clone \
            --no-tags \
            "https://github.com/vmkisanrkms/RKMS-Connect-Android.git" \
            "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          echo "Checking required Android commit..."

          git checkout --detach "$ANDROID_SOURCE_COMMIT"

          CURRENT_COMMIT="$(git rev-parse HEAD)"

          echo "Expected:"
          echo "$ANDROID_SOURCE_COMMIT"

          echo "Actual:"
          echo "$CURRENT_COMMIT"

          test "$CURRENT_COMMIT" = "$ANDROID_SOURCE_COMMIT"

          echo ""
          echo "Checking Android project..."

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/google-services.json
          test -f app/src/main/AndroidManifest.xml

          test -d app/src/main/java
          test -d app/src/main/res
          test -d app/src/main/assets

          echo ""
          echo "Checking FCM files..."

          test -f \
            app/src/main/java/org/rkms/connect/FCMTokenRegistrar.java

          test -f \
            app/src/main/java/org/rkms/connect/RKMSFirebaseMessagingService.java

          test -f \
            app/src/main/java/org/rkms/connect/NotificationHelper.java

          test -f \
            app/src/main/java/org/rkms/connect/SessionStore.java

          echo ""
          echo "Native Android source verification: PASS"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # =========================================================
      # 4. Find Chat Live Fix ZIP
      # =========================================================
      - name: Find Final Website ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for RKMS Chat Live ZIP..."

          ZIP_FILE="$(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "RKMS_Chat_Live_Realtime_Fix.zip" \
              -not -path "*/.git/*" \
              -print \
              -quit
          )"

          if [ -z "$ZIP_FILE" ]; then
            echo ""
            echo "Named ZIP not found."

            echo "Available ZIP files:"
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "*.zip" \
              -not -path "*/.git/*" \
              -print

            echo ""
            echo "::error::RKMS_Chat_Live_Realtime_Fix.zip not found."
            exit 1
          fi

          test -s "$ZIP_FILE"

          echo ""
          echo "Selected ZIP:"
          echo "$ZIP_FILE"

          echo "WEBSITE_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"


      # =========================================================
      # 5. Extract Chat Live Fix ZIP
      # =========================================================
      - name: Extract Final Website
        shell: bash
        run: |
          set -euo pipefail

          WEB_EXTRACT="$RUNNER_TEMP/rkms-web"

          rm -rf "$WEB_EXTRACT"

          mkdir -p "$WEB_EXTRACT"

          echo "Extracting:"
          echo "$WEBSITE_ZIP"

          unzip -q \
            "$WEBSITE_ZIP" \
            -d "$WEB_EXTRACT"

          echo ""
          echo "ZIP contents:"
          find "$WEB_EXTRACT" \
            -type f \
            | sort \
            | head -300

          echo ""
          echo "Searching for app.js..."

          APP_JS="$(
            find "$WEB_EXTRACT" \
              -type f \
              -name "app.js" \
              -print \
              -quit
          )"

          if [ -z "$APP_JS" ]; then
            echo ""
            echo "::error::app.js not found inside ZIP."

            echo ""
            echo "JavaScript files found:"
            find "$WEB_EXTRACT" \
              -type f \
              \( -name "*.js" -o -name "*.mjs" \) \
              -print

            exit 1
          fi

          echo ""
          echo "FOUND app.js:"
          echo "$APP_JS"

          echo "APP_JS=$APP_JS" >> "$GITHUB_ENV"


      # =========================================================
      # 6. Validate patched JavaScript
      # =========================================================
      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail

          test -s "$APP_JS"

          echo "app.js size:"
          wc -c "$APP_JS"

          echo ""
          echo "Running JavaScript syntax check..."

          node --check "$APP_JS"

          echo ""
          echo "JavaScript syntax: PASS"


      # =========================================================
      # 7. Verify Live Chat Fix
      # =========================================================
      - name: Verify Live Chat Fix
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking RKMS live chat..."

          if grep -q "rkmsChatLive" "$APP_JS"; then
            echo "RKMS live-chat code: FOUND"
          else
            echo "::warning::rkmsChatLive marker not found"
          fi

          if grep -q "postgres_changes" "$APP_JS"; then
            echo "Supabase Realtime listener: FOUND"
          else
            echo "Supabase postgres_changes listener not found."
            echo "Fallback polling code will be checked."
          fi

          if grep -q "setInterval" "$APP_JS"; then
            echo "Polling fallback: FOUND"
          else
            echo "::warning::Polling fallback not found"
          fi

          echo ""
          echo "Live Chat verification completed."


      # =========================================================
      # 8. Locate Android web assets
      # =========================================================
      - name: Locate Android Web Assets
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_WEB="$PROJECT_DIR/app/src/main/assets/www"

          mkdir -p "$ANDROID_WEB"

          echo "Android web directory:"
          echo "$ANDROID_WEB"

          echo "ANDROID_WEB=$ANDROID_WEB" >> "$GITHUB_ENV"


      # =========================================================
      # 9. Install Chat Live Fix
      # =========================================================
      - name: Install Chat Live Fix
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing patched app.js..."

          cp "$APP_JS" \
            "$ANDROID_WEB/app.js"

          test -s "$ANDROID_WEB/app.js"

          echo ""
          echo "Installed app.js:"
          ls -lh "$ANDROID_WEB/app.js"

          echo ""
          echo "Final JavaScript validation..."

          node --check "$ANDROID_WEB/app.js"

          echo ""
          echo "Chat Live Fix installation: PASS"


      # =========================================================
      # 10. Verify native website
      # =========================================================
      - name: Verify Android Website
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking existing Android website..."

          test -f "$ANDROID_WEB/index.html"
          test -f "$ANDROID_WEB/app.js"

          echo ""
          echo "Android website verification: PASS"


      # =========================================================
      # 11. Verify Book
      # =========================================================
      - name: Verify Book
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking book files..."

          if [ -d "$ANDROID_WEB/assets/book" ]; then

            PAGE_COUNT="$(
              find "$ANDROID_WEB/assets/book" \
                -type f \
                \( \
                  -iname "page-*.jpg" \
                  -o -iname "page-*.jpeg" \
                  -o -iname "page-*.png" \
                  -o -iname "page-*.webp" \
                \) \
                | wc -l
            )"

            echo "Book page count:"
            echo "$PAGE_COUNT"

            if [ "$PAGE_COUNT" -eq 60 ]; then
              echo "Book 60 pages: PASS"
            else
              echo "::warning::Expected 60 pages, found $PAGE_COUNT"
            fi

          else

            echo "::warning::Book directory not found; existing project will be preserved."

          fi


      # =========================================================
      # 12. Verify Supabase
      # =========================================================
      - name: Verify Supabase Configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching Supabase configuration..."

          if grep -Rqi "supabase" "$ANDROID_WEB"; then
            echo "Supabase references: FOUND"
          else
            echo "::warning::Supabase reference not found"
          fi


      # =========================================================
      # 13. Setup Android SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # =========================================================
      # 14. Setup Gradle
      # =========================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}


      # =========================================================
      # 15. Create Gradle Wrapper
      # =========================================================
      - name: Create Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gradle wrapper \
            --gradle-version "$GRADLE_VERSION" \
            --distribution-type bin

          chmod +x gradlew

          ./gradlew --version


      # =========================================================
      # 16. Verify Android project
      # =========================================================
      - name: Verify Android Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/google-services.json

          test -f \
            app/src/main/java/org/rkms/connect/FCMTokenRegistrar.java

          test -f \
            app/src/main/java/org/rkms/connect/RKMSFirebaseMessagingService.java

          test -f \
            app/src/main/java/org/rkms/connect/NotificationHelper.java

          test -f \
            app/src/main/java/org/rkms/connect/SessionStore.java

          echo ""
          echo "Android project verification: PASS"


      # =========================================================
      # 17. Build Release APK
      # =========================================================
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew clean assembleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "Release APK build: PASS"


      # =========================================================
      # 18. Locate APK
      # =========================================================
      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find "$PROJECT_DIR" \
              -type f \
              -path "*/build/outputs/apk/release/*.apk" \
              -print \
              -quit
          )"

          if [ -z "$APK" ]; then
            echo "::error::Release APK not found."

            echo ""
            echo "APK files:"
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo ""
          echo "APK:"
          echo "$APK"

          echo ""
          ls -lh "$APK"


      # =========================================================
      # 19. Upload APK
      # =========================================================
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-Live-Chat-Fixed
          path: ${{ env.APK }}
          if-no-files-found: error


      # =========================================================
      # 20. Upload patched app.js
      # =========================================================
      - name: Upload Patched app.js
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Chat-Live-Fixed-app-js
          path: ${{ env.PROJECT_DIR }}/app/src/main/assets/www/app.js
          if-no-files-found: error


      # =========================================================
      # 21. Final
      # =========================================================
      - name: Build Complete
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo " RKMS RELEASE BUILD SUCCESS"
          echo "=========================================="
          echo ""
          echo "Chat Live Fix : INSTALLED"
          echo "Website       : UNCHANGED"
          echo "Android       : VERIFIED"
          echo "APK           : BUILT"
          echo ""

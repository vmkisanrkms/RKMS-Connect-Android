name: RKMS CONNECT Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Prepare RKMS source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build
          mkdir -p build

          SOURCE_ZIP="RKMS_CONNECT_3_FIXES_FINAL.zip"

          test -f "$SOURCE_ZIP" || {
            echo "ERROR: Required RKMS source ZIP not found:"
            echo "$SOURCE_ZIP"
            exit 1
          }

          unzip -t "$SOURCE_ZIP" >/dev/null
          unzip -q "$SOURCE_ZIP" -d build

          test -f build/app.js
          test -f build/index.html
          test -f build/config.js
          test -f build/assets/rkms-logo-transparent.png

          echo "RKMS source verified"


      - name: Verify JavaScript
        run: |
          set -euo pipefail

          node --check build/app.js

          echo "app.js syntax verified"


      - name: Create Capacitor build package
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          cat > package.json <<'JSON'
          {
            "name": "rkms",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "rm -rf dist && mkdir -p dist && rsync -a --exclude='dist/' --exclude='android/' --exclude='node_modules/' --exclude='.git/' --exclude='.github/' --exclude='*.zip' ./ dist/"
            },
            "dependencies": {
              "@capacitor/core": "6.2.2",
              "@capacitor/android": "6.2.2",
              "@capacitor/app": "6.0.3",
              "@capacitor/push-notifications": "6.0.3"
            },
            "devDependencies": {
              "@capacitor/cli": "6.2.2"
            }
          }
          JSON

          cat > capacitor.config.json <<'JSON'
          {
            "appId": "org.rkms.connect",
            "appName": "RKMS",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https",
              "cleartext": true
            },
            "android": {
              "allowMixedContent": true,
              "captureInput": true,
              "webContentsDebuggingEnabled": false
            }
          }
          JSON

          test -f package.json
          test -f capacitor.config.json

          echo "Capacitor build package created"


      - name: Verify RKMS fixes and FCM
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          FILE="app.js"

          grep -q "memberAreaLabel" "$FILE"
          grep -q "downloadPdf" "$FILE"
          grep -q "pdfBlobFromCanvas" "$FILE"
          grep -q "printPage" "$FILE"
          grep -q "renderMemberProfile" "$FILE"
          grep -q "nationalName" "$FILE"
          grep -q "nationalPost" "$FILE"
          grep -q "data-download-pdf" "$FILE"

          grep -q "rkmsSaveLoginCredentials" "$FILE"

          grep -q 'history.replaceState({rkmsRoute:"home"' "$FILE"

          grep -q "fillFromOfficer" "$FILE"

          grep -q "rkmsRegisterFcmPush" "$FILE"
          grep -q "rkms_notifications_v2" "$FILE"
          grep -q "register_token" "$FILE"
          grep -q "rkms-fcm-push" "$FILE"

          test -f package.json
          grep -q "@capacitor/push-notifications" package.json

          echo "RKMS + FCM source verification PASS"


      - name: Verify PDF pipeline
        working-directory: build
        run: |
          set -euo pipefail

          python3 scripts/verify-pdf-pipeline.py


      - name: Verify report download security
        working-directory: build
        run: |
          set -euo pipefail

          python3 scripts/verify-report-download-scope.py


      - name: Verify RKMS final static checks
        working-directory: build
        run: |
          set -euo pipefail

          python3 scripts/verify-rkms-final.py


      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Install Capacitor dependencies
        working-directory: build
        run: |
          set -euo pipefail

          npm install --no-audit --no-fund


      - name: Build RKMS web application
        working-directory: build
        run: |
          set -euo pipefail

          npm run build


      - name: Verify native bridge source
        working-directory: build
        run: |
          set -euo pipefail

          bash -n scripts/setup-android-native.sh
          python3 scripts/verify-native-bridge.py


      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Create Android platform
        working-directory: build
        run: |
          set -euo pipefail

          npx cap add android


      - name: Add RKMS secure credential native bridge
        working-directory: build
        run: |
          set -euo pipefail

          bash scripts/setup-android-native.sh


      - name: Configure Firebase Android client for FCM
        working-directory: build
        shell: bash
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail

          TARGET="android/app/google-services.json"

          # First preference:
          # Use an existing google-services.json if it was intentionally
          # included in the source package.
          if [ -s "$TARGET" ]; then
            echo "Using existing Android Firebase configuration."
          else
            # Second preference:
            # Use the GitHub Actions repository secret.
            if [ -z "${FIREBASE_GOOGLE_SERVICES_JSON:-}" ]; then
              echo ""
              echo "ERROR: Firebase Android configuration is missing."
              echo ""
              echo "FCM requires a real google-services.json."
              echo ""
              echo "Provide it using GitHub Actions repository secret:"
              echo "FIREBASE_GOOGLE_SERVICES_JSON"
              echo ""
              echo "Do NOT use a fabricated Firebase configuration."
              exit 1
            fi

            printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > "$TARGET"

            echo "Firebase configuration supplied by GitHub Secret."
          fi

          test -s "$TARGET"


          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("android/app/google-services.json")

          try:
              data = json.loads(p.read_text(encoding="utf-8"))
          except Exception as exc:
              raise SystemExit(
                  f"ERROR: google-services.json is not valid JSON: {exc}"
              )

          project_info = data.get("project_info") or {}
          clients = data.get("client") or []

          if not project_info.get("project_number"):
              raise SystemExit(
                  "ERROR: Firebase project_number is missing."
              )

          if not project_info.get("project_id"):
              raise SystemExit(
                  "ERROR: Firebase project_id is missing."
              )

          if not clients:
              raise SystemExit(
                  "ERROR: Firebase client configuration is missing."
              )

          package_name = None

          for client in clients:
              client_info = client.get("client_info") or {}
              android_info = client_info.get("android_client_info") or {}

              candidate = android_info.get("package_name")

              if candidate == "org.rkms.connect":
                  package_name = candidate
                  break

          if package_name != "org.rkms.connect":
              raise SystemExit(
                  "ERROR: google-services.json does not contain "
                  "the required Android package: org.rkms.connect"
              )

          print("Firebase Android configuration verified.")
          print("Android package: org.rkms.connect")
          PY


      - name: Configure Google Services Gradle plugin
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          ROOT_GRADLE="android/build.gradle"
          APP_GRADLE="android/app/build.gradle"

          test -f "$ROOT_GRADLE"
          test -f "$APP_GRADLE"

          python3 - <<'PY'
          from pathlib import Path

          root = Path("android/build.gradle")
          app = Path("android/app/build.gradle")

          root_text = root.read_text(encoding="utf-8")

          if "com.google.gms:google-services" not in root_text:
              marker = "dependencies {"

              if marker not in root_text:
                  raise SystemExit(
                      "ERROR: android/build.gradle dependencies block not found."
                  )

              root_text = root_text.replace(
                  marker,
                  marker +
                  "\n        classpath 'com.google.gms:google-services:4.4.2'",
                  1
              )

              root.write_text(root_text, encoding="utf-8")

          app_text = app.read_text(encoding="utf-8")

          if "com.google.gms.google-services" not in app_text:
              app_text += (
                  "\n"
                  "apply plugin: 'com.google.gms.google-services'\n"
              )

              app.write_text(app_text, encoding="utf-8")

          print("Google Services Gradle plugin configured.")
          PY


      - name: Sync RKMS application
        working-directory: build
        run: |
          set -euo pipefail

          npx cap sync android


      - name: Verify generated Android PDF bridge
        working-directory: build
        run: |
          set -euo pipefail

          python3 scripts/verify-android-pdf.py


      - name: Verify generated Android native bridge
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          MAIN_ACTIVITY="$(find android/app/src/main \
            -type f -name 'MainActivity.java' -print -quit)"

          NATIVE_BRIDGE="$(find android/app/src/main \
            -type f -name 'RKMSNativeBridge.java' -print -quit)"

          SECURE_PLUGIN="$(find android/app/src/main \
            -type f -name 'RKMSSecureCredentialsPlugin.java' -print -quit)"

          test -n "$MAIN_ACTIVITY"
          test -n "$NATIVE_BRIDGE"
          test -n "$SECURE_PLUGIN"

          grep -q 'beginPdfSave' "$NATIVE_BRIDGE"
          grep -q 'appendPdfChunk' "$NATIVE_BRIDGE"
          grep -q 'finishPdfSave' "$NATIVE_BRIDGE"
          grep -q 'cancelPdfSave' "$NATIVE_BRIDGE"

          grep -q 'MediaStore.Downloads.EXTERNAL_CONTENT_URI' "$NATIVE_BRIDGE"
          grep -q 'Environment.DIRECTORY_DOWNLOADS' "$NATIVE_BRIDGE"
          grep -q 'application/pdf' "$NATIVE_BRIDGE"

          grep -q 'RKMSNativeBridge' "$MAIN_ACTIVITY"
          grep -q 'getBridge().getWebView()' "$MAIN_ACTIVITY"
          grep -q 'RKMSSecureCredentialsPlugin' "$MAIN_ACTIVITY"

          grep -q 'AndroidKeyStore' "$SECURE_PLUGIN"
          grep -q 'AES/GCM/NoPadding' "$SECURE_PLUGIN"
          grep -q 'BiometricPrompt' "$SECURE_PLUGIN"

          echo "Native bridge verification PASS"


      - name: Install image tools
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick


      - name: Install exact RKMS launcher logo
        shell: bash
        run: |
          set -euo pipefail

          LOGO="build/assets/rkms-logo-transparent.png"
          RES="build/android/app/src/main/res"
          STRINGS="build/android/app/src/main/res/values/strings.xml"

          test -s "$LOGO"

          mkdir -p \
            "$RES/mipmap-mdpi" \
            "$RES/mipmap-hdpi" \
            "$RES/mipmap-xhdpi" \
            "$RES/mipmap-xxhdpi" \
            "$RES/mipmap-xxxhdpi"

          convert "$LOGO" -resize 32x32 \
            -strip -gravity center -background none \
            -extent 48x48 \
            "$RES/mipmap-mdpi/ic_launcher.png"

          convert "$LOGO" -resize 48x48 \
            -strip -gravity center -background none \
            -extent 72x72 \
            "$RES/mipmap-hdpi/ic_launcher.png"

          convert "$LOGO" -resize 64x64 \
            -strip -gravity center -background none \
            -extent 96x96 \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          convert "$LOGO" -resize 96x96 \
            -strip -gravity center -background none \
            -extent 144x144 \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          convert "$LOGO" -resize 128x128 \
            -strip -gravity center -background none \
            -extent 192x192 \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"

          cp "$RES/mipmap-mdpi/ic_launcher.png" \
             "$RES/mipmap-mdpi/ic_launcher_round.png"

          cp "$RES/mipmap-hdpi/ic_launcher.png" \
             "$RES/mipmap-hdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xhdpi/ic_launcher.png" \
             "$RES/mipmap-xhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

          rm -rf "$RES/mipmap-anydpi-v26"
          rm -rf "$RES/mipmap-anydpi"

          find "$RES" -type f \( \
            -name 'ic_launcher_foreground.xml' -o \
            -name 'ic_launcher_background.xml' -o \
            -name 'ic_launcher_foreground.png' -o \
            -name 'ic_launcher_background.png' \
          \) -delete || true

          if grep -q '<string name="app_name">' "$STRINGS"; then
            sed -i \
              's#<string name="app_name">.*</string>#<string name="app_name">RKMS</string>#' \
              "$STRINGS"
          else
            printf '\n    <string name="app_name">RKMS</string>\n' \
              >> "$STRINGS"
          fi

          echo "Launcher icon configured"


      - name: Make Gradle executable
        run: |
          chmod +x build/android/gradlew


      - name: Build Debug APK
        working-directory: build/android
        run: |
          set -euo pipefail

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace


      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="build/android/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "RKMS APK successfully created:"
          ls -lh "$APK"


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-debug-apk
          path: build/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

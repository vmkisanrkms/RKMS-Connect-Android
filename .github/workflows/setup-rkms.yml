name: RKMS Final Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  AGP_VERSION: "8.9.1"
  GRADLE_VERSION: "8.11.1"
  APP_ID: "org.rkms.connect"

  # FINAL 4-POINT FIXED NO-DUPLICATES SOURCE ZIP
  SOURCE_ZIP: "RKMS_CONNECT_FINAL_CONTENT_V2_4_POINT_100_PERCENT_FIXED_NO_DUPLICATES_20260926.zip"

jobs:
  build-release-apk:
    name: Build Signed Release APK
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail

          java -version
          javac -version

      # ============================================================
      # NODE 22
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Node and npm
        shell: bash
        run: |
          set -euo pipefail

          node --version
          npm --version

      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android API 36 and Build Tools
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "Android SDK packages installed successfully."

      - name: Verify Android SDK tools
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          command -v adb
          command -v sdkmanager

          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" version
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" version

          adb version
          sdkmanager --version

          echo "Android SDK tools: PASS"

      # ============================================================
      # LOCATE FINAL SOURCE ZIP
      # ============================================================

      - name: Locate RKMS final source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Expected final source ZIP:"
          echo "$SOURCE_ZIP"

          if [ ! -f "$SOURCE_ZIP" ]; then

            FOUND_ZIP="$(
              find . \
                -type f \
                -name "$SOURCE_ZIP" \
                -print -quit || true
            )"

            if [ -z "$FOUND_ZIP" ]; then
              echo "ERROR: Final source ZIP not found."
              echo
              echo "Expected:"
              echo "$SOURCE_ZIP"
              echo
              echo "Available ZIP files:"
              find . \
                -type f \
                -iname "*.zip" \
                -print || true
              exit 1
            fi

            cp "$FOUND_ZIP" "./$SOURCE_ZIP"
          fi

          test -f "$SOURCE_ZIP"

          echo "FINAL SOURCE ZIP FOUND:"
          ls -lh "$SOURCE_ZIP"

      # ============================================================
      # EXTRACT SOURCE
      # ============================================================

      - name: Extract RKMS source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source extracted

          mkdir -p source
          mkdir -p extracted

          unzip -q "$SOURCE_ZIP" -d extracted

          if [ -f "extracted/package.json" ]; then
            PACKAGE_JSON="extracted/package.json"
          else
            PACKAGE_JSON="$(
              find extracted \
                -type f \
                -name package.json \
                -print -quit || true
            )"
          fi

          if [ -z "$PACKAGE_JSON" ] || [ ! -f "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json not found inside ZIP."
            exit 1
          fi

          SOURCE_ROOT="$(dirname "$PACKAGE_JSON")"

          echo "Selected package.json:"
          echo "$PACKAGE_JSON"

          echo "Selected SOURCE_ROOT:"
          echo "$SOURCE_ROOT"

          if [ "$SOURCE_ROOT" != "extracted" ]; then
            echo "ERROR: Wrong source root selected."
            echo "Expected: extracted"
            echo "Found:    $SOURCE_ROOT"
            exit 1
          fi

          cp -a "$SOURCE_ROOT"/. source/

          test -f source/package.json
          test -f source/assets/rkms-logo-transparent.png
          test -f source/app.js
          test -f source/capacitor.config.json

          echo "Source root verification: PASS"
          echo "Root assets verification: PASS"

      # ============================================================
      # FIX / RESTORE ROOT PACKAGE LOCK
      # ============================================================

      - name: Restore root package-lock.json
        shell: bash
        run: |
          set -euo pipefail

          cd source

          if [ -f "package-lock.json" ]; then

            echo "Root package-lock.json already exists."
            echo "Using root package-lock.json."

          elif [ -f "dist/package-lock.json" ]; then

            echo "Root package-lock.json missing."
            echo "Using verified dist/package-lock.json."

            cp "dist/package-lock.json" "package-lock.json"

          else

            echo "ERROR: package-lock.json not found."
            echo "Neither root nor dist/package-lock.json exists."
            exit 1

          fi

          test -s package-lock.json

          echo "package-lock.json:"
          ls -lh package-lock.json

          node <<'NODE'
          const fs = require('fs');

          const pkg = JSON.parse(
            fs.readFileSync('package.json', 'utf8')
          );

          const lock = JSON.parse(
            fs.readFileSync('package-lock.json', 'utf8')
          );

          if (pkg.name !== lock.name) {
            console.error(
              `ERROR: package name mismatch: package.json=${pkg.name}, lock=${lock.name}`
            );
            process.exit(1);
          }

          if (pkg.version !== lock.version) {
            console.error(
              `ERROR: package version mismatch: package.json=${pkg.version}, lock=${lock.version}`
            );
            process.exit(1);
          }

          if (lock.lockfileVersion !== 3) {
            console.error(
              `ERROR: Expected lockfileVersion 3, found ${lock.lockfileVersion}`
            );
            process.exit(1);
          }

          const pkgRoot = lock.packages?.[""];

          if (!pkgRoot) {
            console.error(
              "ERROR: package-lock.json root package entry missing."
            );
            process.exit(1);
          }

          const expected = {
            '@capacitor/core': '6.2.2',
            '@capacitor/android': '6.2.2',
            '@capacitor/app': '6.0.3',
            '@capacitor/push-notifications': '6.0.3',
            '@capacitor/cli': '6.2.2'
          };

          const all = {
            ...(pkgRoot.dependencies || {}),
            ...(pkgRoot.devDependencies || {})
          };

          for (const [name, version] of Object.entries(expected)) {
            if (all[name] !== version) {
              console.error(
                `ERROR: ${name}: expected ${version}, found ${all[name] || 'missing'}`
              );
              process.exit(1);
            }

            console.log(`PASS: ${name} ${version}`);
          }

          console.log("package-lock.json consistency: PASS");
          NODE

      # ============================================================
      # REQUIRED SOURCE FILES
      # ============================================================

      - name: Verify required source files
        shell: bash
        run: |
          set -euo pipefail

          cd source

          REQUIRED_FILES=(
            "package.json"
            "package-lock.json"
            "app.js"
            "index.html"
            "styles.css"
            "capacitor.config.json"
            "google-services.json"
            "scripts/setup-android-native.sh"
            "scripts/configure-android-16.sh"
            "scripts/configure-release-signing.sh"
          )

          for file in "${REQUIRED_FILES[@]}"; do

            test -f "$file" || {
              echo "ERROR: Missing required file: $file"
              exit 1
            }

            echo "FOUND: $file"

          done

          echo "Required source files: PASS"

      # ============================================================
      # CAPACITOR VERSIONS
      # ============================================================

      - name: Verify Capacitor versions
        shell: bash
        run: |
          set -euo pipefail

          cd source

          node <<'NODE'
          const fs = require('fs');

          const pkg = JSON.parse(
            fs.readFileSync('package.json', 'utf8')
          );

          const expected = {
            '@capacitor/core': '6.2.2',
            '@capacitor/android': '6.2.2',
            '@capacitor/app': '6.0.3',
            '@capacitor/push-notifications': '6.0.3',
            '@capacitor/cli': '6.2.2'
          };

          const all = {
            ...(pkg.dependencies || {}),
            ...(pkg.devDependencies || {})
          };

          for (const [name, version] of Object.entries(expected)) {

            if (all[name] !== version) {
              console.error(
                `ERROR: ${name} expected ${version}, found ${all[name] || 'missing'}`
              );
              process.exit(1);
            }

            console.log(`PASS: ${name} ${version}`);
          }

          console.log("Capacitor versions: PASS");
          NODE

      # ============================================================
      # CAPACITOR CONFIG
      # ============================================================

      - name: Verify Capacitor configuration
        shell: bash
        run: |
          set -euo pipefail

          cd source

          grep -q \
            '"appId"[[:space:]]*:[[:space:]]*"org.rkms.connect"' \
            capacitor.config.json

          grep -q \
            '"webDir"[[:space:]]*:[[:space:]]*"dist"' \
            capacitor.config.json

          echo "Capacitor APP ID: PASS"
          echo "Capacitor webDir: PASS"

      # ============================================================
      # FIREBASE CONFIG
      # ============================================================

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd source

          test -s google-services.json

          grep -q \
            '"package_name"[[:space:]]*:[[:space:]]*"org.rkms.connect"' \
            google-services.json

          echo "Firebase package: PASS"

      # ============================================================
      # JAVASCRIPT
      # ============================================================

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          cd source

          node --check app.js

          echo "app.js syntax: PASS"

      # ============================================================
      # FCM
      # ============================================================

      - name: Verify FCM pipeline
        shell: bash
        run: |
          set -euo pipefail

          cd source

          if [ -f scripts/verify-fcm-pipeline.py ]; then
            python3 scripts/verify-fcm-pipeline.py
          fi

      # ============================================================
      # WEBVIEW NOTIFICATION ROUTING
      # ============================================================

      - name: Verify WebView notification routing
        shell: bash
        run: |
          set -euo pipefail

          cd source

          if [ -f scripts/verify-webview-notification-fix.py ]; then
            python3 scripts/verify-webview-notification-fix.py
          fi

      # ============================================================
      # SAVED LOGIN
      # ============================================================

      - name: Verify saved login
        shell: bash
        run: |
          set -euo pipefail

          cd source

          if [ -f scripts/verify-saved-login.py ]; then
            python3 scripts/verify-saved-login.py
          fi

      # ============================================================
      # NATIVE BRIDGE
      # ============================================================

      - name: Verify native bridge
        shell: bash
        run: |
          set -euo pipefail

          cd source

          if [ -f scripts/verify-native-bridge.py ]; then
            python3 scripts/verify-native-bridge.py
          fi

      # ============================================================
      # RKMS FINAL VERIFICATION
      # ============================================================

      - name: Verify RKMS final
        shell: bash
        run: |
          set -euo pipefail

          cd source

          if [ ! -f scripts/verify-rkms-final.py ]; then
            echo "ERROR: scripts/verify-rkms-final.py not found."
            exit 1
          fi

          python3 scripts/verify-rkms-final.py

          echo "RKMS final verification: PASS"

      # ============================================================
      # CHAT MICROPHONE
      # ============================================================

      - name: Verify chat microphone
        shell: bash
        run: |
          set -euo pipefail

          cd source

          if [ -f scripts/verify-chat-mic-final.py ]; then
            python3 scripts/verify-chat-mic-final.py
          fi

      # ============================================================
      # FOUR POINT / FINAL FIX
      # ============================================================

      - name: Verify final content and timestamp fixes
        shell: bash
        run: |
          set -euo pipefail

          cd source

          if [ -f scripts/verify-final-three-point-fix.py ]; then
            python3 scripts/verify-final-three-point-fix.py
          fi

          if [ -f scripts/verify-home-content-final.py ]; then
            python3 scripts/verify-home-content-final.py
          fi

          if [ -f scripts/verify-final-login-navigation.py ]; then
            python3 scripts/verify-final-login-navigation.py
          fi

          echo "Final Content V2 verification: PASS"

      # ============================================================
      # TIMESTAMP DISPLAY VERIFICATION
      # ============================================================

      - name: Verify timestamp display rule
        shell: bash
        run: |
          set -euo pipefail

          cd source

          echo "Checking timestamp display implementation..."

          grep -q "अंतिम बदलाव" app.js

          if grep -q \
            "डाली गई.*अंतिम बदलाव\|डाली गई:.*अंतिम बदलाव" \
            app.js; then

            echo "ERROR: Both initial and update timestamps appear together."
            exit 1
          fi

          echo "Timestamp display rule: PASS"

      # ============================================================
      # ANDROID 16 SOURCE VERIFICATION
      # ============================================================

      - name: Verify Android 16
        shell: bash
        run: |
          set -euo pipefail

          cd source

          echo "=============================================="
          echo "RKMS Android 16 / API 36 Verification"
          echo "=============================================="

          test -f package.json
          test -f capacitor.config.json

          node <<'NODE'
          const fs = require('fs');

          const pkg = JSON.parse(
            fs.readFileSync('package.json', 'utf8')
          );

          const all = {
            ...(pkg.dependencies || {}),
            ...(pkg.devDependencies || {})
          };

          if (all['@capacitor/android'] !== '6.2.2') {
            console.error(
              'ERROR: @capacitor/android must be 6.2.2'
            );
            process.exit(1);
          }

          console.log(
            'PASS: @capacitor/android 6.2.2'
          );
          NODE

          if [ -f scripts/verify-android-16.py ]; then
            python3 -m py_compile \
              scripts/verify-android-16.py

            echo "Android 16 verification script syntax: PASS"
          fi

          echo "Android 16 / API 36 source verification: PASS"

      # ============================================================
      # FINAL NOTIFICATION / CHAT BACK FLOW
      # ============================================================

      - name: Verify final notification navigation and back flow
        shell: bash
        run: |
          set -euo pipefail

          cd source

          echo "Checking final FCM token reconciliation..."

          grep -q "rkmsNativeFcmToken" app.js
          grep -q "refreshFcmToken" app.js
          grep -q "Push.register" app.js

          echo "FCM token reconciliation: PASS"

          echo "Checking notification -> exact conversation routing..."

          grep -q "conversation_id" app.js
          grep -q "rkmsOpenNotificationRoute" app.js
          grep -q "chatRouteConversationId" app.js

          echo "Notification exact-chat routing: PASS"

          echo "Checking chat notification fix..."

          test -f FCM_CHAT_BADGE_TAP_FIX_20260924.md

          grep -q "conversation_id" \
            FCM_CHAT_BADGE_TAP_FIX_20260924.md

          grep -q "rkms_chat" \
            FCM_CHAT_BADGE_TAP_FIX_20260924.md

          echo "Chat badge + notification tap source: PASS"

          if [ -f NOTIFICATION_TAP_CHAT_FIX_20260923.md ]; then

            grep -q "conversation_id" \
              NOTIFICATION_TAP_CHAT_FIX_20260923.md

          fi

          echo "Notification tap routing documentation: PASS"
          echo "Final navigation source verification: PASS"

      # ============================================================
      # INSTALL NPM
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd source

          test -f package-lock.json

          npm ci \
            --no-audit \
            --no-fund

          echo "npm dependencies installed: PASS"

      # ============================================================
      # VERIFY PUSH PLUGIN
      # ============================================================

      - name: Verify installed push notifications
        shell: bash
        run: |
          set -euo pipefail

          cd source

          node -e "
            const p=require('./node_modules/@capacitor/push-notifications/package.json');

            if(p.version!=='6.0.3'){
              console.error('Wrong push-notifications version:',p.version);
              process.exit(1);
            }

            console.log('push-notifications:',p.version);
          "

      # ============================================================
      # BUILD WEB
      # ============================================================

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd source

          npm run build

          test -d dist
          test -f dist/index.html
          test -f dist/app.js

          echo "Web build: PASS"

      # ============================================================
      # VERIFY SOURCE / DIST HASHES
      # ============================================================

      - name: Verify source and dist synchronization
        shell: bash
        run: |
          set -euo pipefail

          cd source

          test -f app.js
          test -f dist/app.js

          test -f styles.css
          test -f dist/styles.css

          test -f index.html
          test -f dist/index.html

          SRC_APP="$(sha256sum app.js | awk '{print $1}')"
          DIST_APP="$(sha256sum dist/app.js | awk '{print $1}')"

          SRC_CSS="$(sha256sum styles.css | awk '{print $1}')"
          DIST_CSS="$(sha256sum dist/styles.css | awk '{print $1}')"

          SRC_HTML="$(sha256sum index.html | awk '{print $1}')"
          DIST_HTML="$(sha256sum dist/index.html | awk '{print $1}')"

          echo "app.js     $SRC_APP"
          echo "dist/app.js $DIST_APP"

          echo "styles.css     $SRC_CSS"
          echo "dist/styles.css $DIST_CSS"

          echo "index.html     $SRC_HTML"
          echo "dist/index.html $DIST_HTML"

          test "$SRC_APP" = "$DIST_APP"
          test "$SRC_CSS" = "$DIST_CSS"
          test "$SRC_HTML" = "$DIST_HTML"

          echo "Source/dist synchronization: PASS"

      # ============================================================
      # CREATE FRESH ANDROID PROJECT
      # ============================================================

      - name: Create fresh Android project
        shell: bash
        run: |
          set -euo pipefail

          cd source

          rm -rf android

          npx cap add android

          test -d android
          test -f android/gradlew

          echo "Fresh Android project: PASS"

      # ============================================================
      # CONFIGURE ANDROID 16
      # ============================================================

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd source

          chmod +x scripts/configure-android-16.sh

          ./scripts/configure-android-16.sh

      # ============================================================
      # ENFORCE SDK 36
      # ============================================================

      - name: Enforce Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          cd source

          if [ -f android/variables.gradle ]; then

            sed -i \
              -E 's/compileSdkVersion[[:space:]]*=[[:space:]]*[0-9]+/compileSdkVersion = 36/' \
              android/variables.gradle || true

            sed -i \
              -E 's/targetSdkVersion[[:space:]]*=[[:space:]]*[0-9]+/targetSdkVersion = 36/' \
              android/variables.gradle || true

            sed -i \
              -E 's/minSdkVersion[[:space:]]*=[[:space:]]*[0-9]+/minSdkVersion = 23/' \
              android/variables.gradle || true

          fi

          grep -q \
            "compileSdkVersion = 36" \
            android/variables.gradle

          grep -q \
            "targetSdkVersion = 36" \
            android/variables.gradle

          echo "compileSdk/targetSdk 36: PASS"

      # ============================================================
      # CAPACITOR SYNC
      # ============================================================

      - name: Sync Capacitor
        shell: bash
        run: |
          set -euo pipefail

          cd source

          npx cap sync android

          echo "Capacitor sync: PASS"

      # ============================================================
      # NATIVE INTEGRATION
      # ============================================================

      - name: Setup RKMS Android native integration
        shell: bash
        run: |
          set -euo pipefail

          cd source

          chmod +x scripts/setup-android-native.sh

          ./scripts/setup-android-native.sh

          test -f \
            android/app/src/main/java/org/rkms/connect/RKMSNativeBridge.java

          echo "RKMS native bridge: PASS"

      # ============================================================
      # GOOGLE SERVICES
      # ============================================================

      - name: Ensure Google Services plugin version
        shell: bash
        run: |
          set -euo pipefail

          cd source

          test -f android/build.gradle
          test -f android/app/build.gradle

          if ! grep -q \
            "com.google.gms:google-services:4.4.3" \
            android/build.gradle; then

            python3 - <<'PY'
          from pathlib import Path

          p = Path("android/build.gradle")
          text = p.read_text()

          if "com.google.gms:google-services:4.4.3" not in text:

              marker = "dependencies {"

              if marker not in text:
                  raise SystemExit(
                      "android/build.gradle dependencies block missing"
                  )

              text = text.replace(
                  marker,
                  marker +
                  '\n        classpath "com.google.gms:google-services:4.4.3"',
                  1
              )

              p.write_text(text)
          PY
          fi

          if ! grep -q \
            "com.google.gms.google-services" \
            android/app/build.gradle; then

            printf '\napply plugin: "com.google.gms.google-services"\n' \
              >> android/app/build.gradle

          fi

      - name: Verify Google Services plugin
        shell: bash
        run: |
          set -euo pipefail

          cd source

          grep -q \
            "com.google.gms:google-services:4.4.3" \
            android/build.gradle

          grep -q \
            "com.google.gms.google-services" \
            android/app/build.gradle

          echo "Google Services: PASS"

      # ============================================================
      # FIREBASE NATIVE CONFIG
      # ============================================================

      - name: Verify Firebase native configuration
        shell: bash
        run: |
          set -euo pipefail

          cd source

          test -f android/app/google-services.json

          grep -q \
            '"package_name"[[:space:]]*:[[:space:]]*"org.rkms.connect"' \
            android/app/google-services.json

          echo "Firebase native configuration: PASS"

      # ============================================================
      # MAIN ACTIVITY
      # ============================================================

      - name: Verify MainActivity
        shell: bash
        run: |
          set -euo pipefail

          cd source

          MAIN_ACTIVITY="$(
            find android/app/src/main \
              -type f \
              -name MainActivity.java \
              -print -quit || true
          )"

          test -n "$MAIN_ACTIVITY"

          grep -q "RKMSNativeBridge" "$MAIN_ACTIVITY"
          grep -q "FirebaseApp.initializeApp" "$MAIN_ACTIVITY"
          grep -q "onNewIntent" "$MAIN_ACTIVITY"
          grep -q "conversation_id" "$MAIN_ACTIVITY"
          grep -q "rkmsOpenNotificationRoute" "$MAIN_ACTIVITY"

          echo "MainActivity notification routing: PASS"

      # ============================================================
      # FIREBASE MESSAGING
      # ============================================================

      - name: Ensure Firebase Messaging dependency
        shell: bash
        run: |
          set -euo pipefail

          cd source

          APP_GRADLE="android/app/build.gradle"

          if ! grep -q "firebase-messaging" "$APP_GRADLE"; then

            python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          text = p.read_text()

          dependency = """
              implementation 'com.google.firebase:firebase-messaging:25.0.1'
          """

          if "dependencies {" not in text:
              raise SystemExit(
                  "dependencies block not found"
              )

          text = text.replace(
              "dependencies {",
              "dependencies {" + dependency,
              1
          )

          p.write_text(text)
          PY

          fi

          grep -q "firebase-messaging" "$APP_GRADLE"

          echo "Firebase Messaging dependency: PASS"

      # ============================================================
      # GRADLE CONFIG
      # ============================================================

      - name: Verify final Android configuration
        shell: bash
        run: |
          set -euo pipefail

          cd source

          test -f android/gradlew

          chmod +x android/gradlew

          grep -n "distributionUrl" \
            android/gradle/wrapper/gradle-wrapper.properties

          grep -q \

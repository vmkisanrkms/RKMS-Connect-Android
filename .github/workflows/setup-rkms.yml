name: RKMS Android 16 API 36 - Final APK + AAB

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  AGP_VERSION: "8.9.1"
  GRADLE_VERSION: "8.11.1"
  APP_ID: "org.rkms.connect"

jobs:
  android-build:
    name: RKMS Android 16 API 36 APK + AAB
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. RESOLVE RKMS SOURCE
      # ============================================================
      - name: Resolve RKMS source
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking RKMS source..."

          if [[ -f "package.json" ]] && \
             [[ -f "package-lock.json" ]] && \
             [[ -f "app.js" ]] && \
             [[ -f "index.html" ]] && \
             [[ -f "styles.css" ]] && \
             [[ -f "capacitor.config.json" ]] && \
             [[ -f "google-services.json" ]]; then

            echo "Root RKMS source detected."
            echo "RKMS_SOURCE_DIR=." >> "$GITHUB_ENV"

          else

            ZIP="RKMS_CONNECT_FINAL_CLEAN_ANDROID16_API36_APK_AAB_BUILD.zip"

            if [[ ! -f "$ZIP" ]]; then
              ZIP="RKMS_CONNECT_CHAT_DIGITAL_ID_ANDROID16_API36_FINAL_APK_BUILD.zip"
            fi

            if [[ ! -f "$ZIP" ]]; then
              echo "::error::RKMS source ZIP not found."
              exit 1
            fi

            echo "Using source ZIP:"
            echo "$ZIP"

            rm -rf rkms-source
            mkdir -p rkms-source

            unzip -q "$ZIP" -d rkms-source

            SOURCE="rkms-source"

            if [[ ! -f "$SOURCE/package.json" ]]; then
              FOUND="$(find "$SOURCE" \
                -type f \
                -name package.json \
                -print \
                -quit || true)"

              if [[ -z "$FOUND" ]]; then
                echo "::error::package.json not found after extraction."
                exit 1
              fi

              SOURCE="$(dirname "$FOUND")"
            fi

            echo "Resolved RKMS source:"
            echo "$SOURCE"

            echo "RKMS_SOURCE_DIR=$SOURCE" >> "$GITHUB_ENV"
          fi


      # ============================================================
      # 3. VERIFY SOURCE
      # ============================================================
      - name: Verify RKMS source
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          REQUIRED_FILES=(
            package.json
            package-lock.json
            app.js
            index.html
            styles.css
            capacitor.config.json
            google-services.json
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$FILE" ]]; then
              echo "::error::Missing required file: $FILE"
              exit 1
            fi
          done

          echo "All required RKMS source files verified."


      # ============================================================
      # 4. NODE 22
      # ============================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.RKMS_SOURCE_DIR }}/package-lock.json


      # ============================================================
      # 5. VERIFY NODE
      # ============================================================
      - name: Verify Node and npm
        shell: bash
        run: |
          set -euo pipefail

          node --version
          npm --version


      # ============================================================
      # 6. VERIFY CAPACITOR
      # ============================================================
      - name: Verify Capacitor versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          node <<'NODE'
          const p = require("./package.json");

          const expected = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          for (const [name, version] of Object.entries(expected)) {
            const actual =
              (p.dependencies && p.dependencies[name]) ||
              (p.devDependencies && p.devDependencies[name]);

            if (!actual || !actual.includes(version)) {
              console.error(
                `${name}: expected ${version}, found ${actual}`
              );
              process.exit(1);
            }

            console.log(`${name}: ${actual}`);
          }

          console.log("Capacitor versions verified.");
          NODE


      # ============================================================
      # 7. NPM INSTALL
      # ============================================================
      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          npm ci


      # ============================================================
      # 8. WEB BUILD
      # ============================================================
      - name: Build RKMS web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          npm run build

          test -d dist
          test -f dist/index.html

          echo "RKMS web build successful."


      # ============================================================
      # 9. JAVA 17
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle


      # ============================================================
      # 10. VERIFY JAVA
      # ============================================================
      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail

          java -version


      # ============================================================
      # 11. ANDROID SDK API 36
      # ============================================================
      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --licenses >/dev/null || true

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --licenses >/dev/null || true

          echo "Android SDK setup complete."


      # ============================================================
      # 12. VERIFY ANDROID SDK
      # ============================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d \
            "${ANDROID_HOME}/platforms/android-${ANDROID_API}"

          test -d \
            "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}"

          "${ANDROID_HOME}/platform-tools/adb" version

          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt" version

          echo "Android API ${ANDROID_API} verified."


      # ============================================================
      # 13. CREATE CAPACITOR ANDROID PROJECT
      # ============================================================
      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          rm -rf android

          npx cap add android

          test -d android
          test -f android/gradlew

          chmod +x android/gradlew

          echo "Android project created."
          echo "Gradle wrapper:"
          ls -l android/gradlew


      # ============================================================
      # 14. CONFIGURE ANDROID 16 API 36
      # ============================================================
      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          test -f scripts/configure-android-16.sh

          chmod +x scripts/configure-android-16.sh

          ./scripts/configure-android-16.sh


      # ============================================================
      # 15. VERIFY ANDROID CONFIGURATION
      # ============================================================
      - name: Verify Android 16 configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          grep -R "compileSdk.*36" android >/dev/null \
            || {
              echo "::error::compileSdk 36 not found."
              exit 1
            }

          grep -R "targetSdk.*36" android >/dev/null \
            || {
              echo "::error::targetSdk 36 not found."
              exit 1
            }

          grep -R "8.9.1" android >/dev/null \
            || {
              echo "::error::AGP 8.9.1 not found."
              exit 1
            }

          echo "compileSdk 36 verified."
          echo "targetSdk 36 verified."
          echo "AGP 8.9.1 verified."


      # ============================================================
      # 16. CAPACITOR SYNC
      # ============================================================
      - name: Capacitor sync
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          npx cap sync android

          test -f android/gradlew

          chmod +x android/gradlew


      # ============================================================
      # 17. SETUP RKMS NATIVE ANDROID
      # ============================================================
      - name: Setup RKMS native Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          test -f scripts/setup-android-native.sh

          chmod +x scripts/setup-android-native.sh

          ./scripts/setup-android-native.sh

          test -f android/gradlew
          chmod +x android/gradlew


      # ============================================================
      # 18. VERIFY FIREBASE CONFIGURATION
      # ============================================================
      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          test -f google-services.json
          test -f android/app/google-services.json

          node <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync("google-services.json", "utf8")
          );

          const clients = data.client || [];

          const valid = clients.some(client =>
            client.client_info &&
            client.client_info.android_client_info &&
            client.client_info.android_client_info.package_name ===
              "org.rkms.connect"
          );

          if (!valid) {
            console.error(
              "Firebase package org.rkms.connect not found."
            );
            process.exit(1);
          }

          console.log(
            "Firebase package org.rkms.connect verified."
          );
          NODE


      # ============================================================
      # 19. ENSURE FIREBASE DEPENDENCIES
      # ============================================================
      - name: Ensure Firebase dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          FILE="android/app/build.gradle"

          test -f "$FILE"

          python3 <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          bom = "implementation platform('com.google.firebase:firebase-bom:33.9.0')"
          messaging = "implementation 'com.google.firebase:firebase-messaging'"

          if bom not in s or messaging not in s:

              marker = "dependencies {"

              if marker not in s:
                  raise SystemExit(
                      "dependencies block not found"
                  )

              replacement = (
                  marker
                  + "\n    "
                  + bom
                  + "\n    "
                  + messaging
              )

              s = s.replace(
                  marker,
                  replacement,
                  1
              )

              p.write_text(s)

          print("Firebase dependencies verified.")
          PY


      # ============================================================
      # 20. VERIFY GRADLE WRAPPER BEFORE ANY GRADLE COMMAND
      # ============================================================
      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR/android"

          test -f gradlew

          chmod +x gradlew

          ./gradlew --version

          ./gradlew --version \
            | grep -q "8.11.1" \
            || {
              echo "::error::Gradle 8.11.1 expected."
              exit 1
            }

          echo "Gradle wrapper verified."


      # ============================================================
      # 21. VERIFY FIREBASE COMPILE CLASSPATH
      # FIX:
      # gradlew MUST RUN FROM android DIRECTORY
      # ============================================================
      - name: Verify Firebase compile classpath
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR/android"

          ./gradlew \
            :app:dependencies \
            --configuration debugCompileClasspath \
            --no-daemon \
            > ../firebase-dependencies.txt

          grep -q "firebase-messaging" \
            ../firebase-dependencies.txt \
            || {
              echo "::error::firebase-messaging missing from compile classpath."
              exit 1
            }

          echo "Firebase Messaging compile dependency verified."


      # ============================================================
      # 22. VERIFY FIREBASE INITIALIZATION
      # ============================================================
      - name: Verify Firebase initialization
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          grep -R \
            "FirebaseApp.initializeApp" \
            android/app/src/main/java \
            >/dev/null \
            || {
              echo "::error::FirebaseApp.initializeApp not found."
              exit 1
            }

          echo "Firebase initialization verified."


      # ============================================================
      # 23. VERIFY NATIVE BRIDGE
      # ============================================================
      - name: Verify RKMS native bridge
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          find android/app/src/main/java \
            -name "RKMSNativeBridge.java" \
            -print -quit \
            | grep -q . \
            || {
              echo "::error::RKMSNativeBridge.java missing."
              exit 1
            }

          find android/app/src/main/java \
            -name "RKMSSecureCredentialsPlugin.java" \
            -print -quit \
            | grep -q . \
            || {
              echo "::error::RKMSSecureCredentialsPlugin.java missing."
              exit 1
            }

          echo "RKMS native bridge verified."


      # ============================================================
      # 24. VERIFY BIOMETRIC DEPENDENCY
      # ============================================================
      - name: Verify biometric dependency
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          grep -R \
            "androidx.biometric:biometric" \
            android \
            >/dev/null \
            || {
              echo "::error::Biometric dependency missing."
              exit 1
            }

          echo "Biometric dependency verified."


      # ============================================================
      # 25. VERIFY LAUNCHER ICON
      # ============================================================
      - name: Verify RKMS launcher icon
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          COUNT="$(
            find android/app/src/main/res \
              -type f \
              \( \
                -name "ic_launcher*" \
                -o \
                -name "ic_launcher_round*" \
              \) \
              | wc -l
          )"

          if [[ "$COUNT" -lt 1 ]]; then
            echo "::error::RKMS launcher icon missing."
            exit 1
          fi

          echo "Launcher icon files found: $COUNT"


      # ============================================================
      # 26. RELEASE SIGNING
      # ============================================================
      - name: Configure release signing
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          if [[ -f scripts/configure-release-signing.sh ]]; then

            chmod +x scripts/configure-release-signing.sh

            ./scripts/configure-release-signing.sh

          else

            echo "::warning::Release signing script not found."
            echo "Release will be unsigned."

          fi


      # ============================================================
      # 27. VERIFY RELEASE GRADLE WRAPPER AGAIN
      # ============================================================
      - name: Verify Gradle after native setup
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR/android"

          test -f gradlew

          chmod +x gradlew

          ./gradlew --version


      # ============================================================
      # 28. BUILD DEBUG APK
      # ============================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR/android"

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace

          test -s \
            app/build/outputs/apk/debug/app-debug.apk

          echo "Debug APK created."


      # ============================================================
      # 29. BUILD RELEASE APK + AAB
      #
      # IMPORTANT:
      # NO "clean" HERE
      # Otherwise Debug APK can be deleted.
      # ============================================================
      - name: Build Release APK and AAB
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR/android"

          ./gradlew \
            assembleRelease \
            bundleRelease \
            --no-daemon \
            --stacktrace

          test -s \
            app/build/outputs/apk/release/app-release.apk

          test -s \
            app/build/outputs/bundle/release/app-release.aab

          echo "Release APK created."
          echo "Release AAB created."


      # ============================================================
      # 30. VERIFY ALL BUILD OUTPUTS
      # ============================================================
      - name: Verify APK and AAB outputs
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          DEBUG_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="android/app/build/outputs/apk/release/app-release.apk"
          RELEASE_AAB="android/app/build/outputs/bundle/release/app-release.aab"

          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          test -s "$RELEASE_AAB"

          echo
          echo "===== FINAL BUILD OUTPUTS ====="
          ls -lh \
            "$DEBUG_APK" \
            "$RELEASE_APK" \
            "$RELEASE_AAB"


      # ============================================================
      # 31. VERIFY PACKAGE ID
      # ============================================================
      - name: Verify APK package ID
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          AAPT="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt"

          for APK in \
            android/app/build/outputs/apk/debug/app-debug.apk \
            android/app/build/outputs/apk/release/app-release.apk
          do

            echo "Checking package ID in:"
            echo "$APK"

            "$AAPT" dump badging "$APK" \
              | grep -q \
              "package: name='org.rkms.connect'" \
              || {
                echo "::error::Wrong package ID in $APK"
                exit 1
              }

          done

          echo "Package ID verified: org.rkms.connect"


      # ============================================================
      # 32. VERIFY DEBUG APK SIGNATURE
      # ============================================================
      - name: Verify Debug APK signature
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          APKSIGNER="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner"

          "$APKSIGNER" verify --verbose \
            android/app/build/outputs/apk/debug/app-debug.apk

          echo "Debug APK signature verified."


      # ============================================================
      # 33. VERIFY RELEASE APK SIGNATURE
      # ============================================================
      - name: Verify Release APK signature
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          APKSIGNER="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner"

          if "$APKSIGNER" verify --verbose \
            android/app/build/outputs/apk/release/app-release.apk
          then
            echo "Release APK is signed and verified."
          else
            echo "Release APK is unsigned."
            echo "This is allowed when release signing secrets are not configured."
          fi


      # ============================================================
      # 34. VERIFY AAB
      # ============================================================
      - name: Verify Release AAB
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          test -s "$AAB"

          unzip -t "$AAB" >/dev/null

          if jarsigner -verify "$AAB" >/dev/null 2>&1; then
            echo "Release AAB signature verified."
          else
            echo "Release AAB is unsigned."
            echo "This is allowed when release signing secrets are not configured."
          fi


      # ============================================================
      # 35. PREPARE FINAL ARTIFACTS
      # ============================================================
      - name: Prepare final RKMS artifacts
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          rm -rf release
          mkdir -p release

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            release/RKMS_CONNECT_ANDROID16_API36_DEBUG.apk

          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          cp \
            android/app/build/outputs/bundle/release/app-release.aab \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab

          echo "Final artifacts prepared."


      # ============================================================
      # 36. SHA256
      # ============================================================
      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR/release"

          sha256sum \
            RKMS_CONNECT_ANDROID16_API36_DEBUG.apk \
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk \
            RKMS_CONNECT_ANDROID16_API36_RELEASE.aab \
            > RKMS_ANDROID16_API36_SHA256.txt

          echo
          echo "===== SHA256 ====="
          cat RKMS_ANDROID16_API36_SHA256.txt


      # ============================================================
      # 37. FINAL ARTIFACT CHECK
      # ============================================================
      - name: Final artifact check
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          FINAL_FILES=(
            release/RKMS_CONNECT_ANDROID16_API36_DEBUG.apk
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab
            release/RKMS_ANDROID16_API36_SHA256.txt
          )

          for FILE in "${FINAL_FILES[@]}"; do

            if [[ ! -s "$FILE" ]]; then
              echo "::error::Missing or empty final artifact:"
              echo "$FILE"
              exit 1
            fi

          done

          echo
          echo "=============================================="
          echo " RKMS ANDROID 16 API 36 BUILD SUCCESS"
          echo "=============================================="
          echo

          ls -lh release/


      # ============================================================
      # 38. UPLOAD FINAL APK + AAB
      # ============================================================
      - name: Upload final RKMS APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-ANDROID16-API36-FINAL-APK-AAB
          path: |
            ${{ env.RKMS_SOURCE_DIR }}/release/RKMS_CONNECT_ANDROID16_API36_DEBUG.apk
            ${{ env.RKMS_SOURCE_DIR }}/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            ${{ env.RKMS_SOURCE_DIR }}/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab
            ${{ env.RKMS_SOURCE_DIR }}/release/RKMS_ANDROID16_API36_SHA256.txt
          if-no-files-found: error
          retention-days: 30

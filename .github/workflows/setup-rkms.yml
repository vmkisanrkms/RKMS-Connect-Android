name: RKMS Android 16 / API 36 - Play Store AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-aab:
    name: RKMS Final Android 16 API 36 AAB
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 2. NODE.JS 22
      # ============================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ============================================================
      # 3. JDK 17
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ============================================================
      # 4. ANDROID SDK
      # ============================================================
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          test -d "/usr/local/lib/android/sdk"

          test -x \
            "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"

          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --version

          echo "Android SDK: PASS"

      # ============================================================
      # 5. ACCEPT LICENSES
      # ============================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=/usr/local/lib/android/sdk \
            --licenses || true

          echo "Android SDK licenses: PASS"

      # ============================================================
      # 6. INSTALL ANDROID 16 / API 36
      # ============================================================
      - name: Install Android 16 API 36
        shell: bash
        run: |
          set -e

          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=/usr/local/lib/android/sdk \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

          echo "Android API 36: PASS"
          echo "Build Tools 36.0.0: PASS"

      # ============================================================
      # 7. FIND FINAL SOURCE ZIP
      # ============================================================
      - name: Find final RKMS source ZIP
        shell: bash
        run: |
          set -e

          ZIP="RKMS_CONNECT_FINAL_RULES_FIXED_2026-09-17.zip"

          if [ ! -f "$ZIP" ]; then
            ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" \
              | grep -E \
              'RKMS_CONNECT_(FINAL|CONTENT_SCOPE).*\.zip$' \
              | head -n 1 || true)
          fi

          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "ERROR: Final RKMS source ZIP not found."
            echo
            echo "Repository files:"
            find . -maxdepth 2 -type f -print
            exit 1
          fi

          echo "RKMS_ZIP=$ZIP" >> "$GITHUB_ENV"

          echo "Using source:"
          echo "$ZIP"

      # ============================================================
      # 8. EXTRACT SOURCE
      # ============================================================
      - name: Extract RKMS source
        shell: bash
        run: |
          set -e

          rm -rf rkms-source
          mkdir -p rkms-source

          unzip -q "$RKMS_ZIP" -d rkms-source

          APP_FILE=$(find rkms-source \
            -type f \
            -name "app.js" \
            | head -n 1)

          if [ -z "$APP_FILE" ]; then
            echo "ERROR: app.js not found inside ZIP."
            exit 1
          fi

          SOURCE_DIR=$(dirname "$APP_FILE")

          echo "RKMS_SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

          echo "Source directory:"
          echo "$SOURCE_DIR"

      # ============================================================
      # 9. VERIFY SOURCE
      # ============================================================
      - name: Verify RKMS source
        shell: bash
        run: |
          set -e

          cd "$RKMS_SOURCE_DIR"

          test -f app.js
          test -f index.html
          test -f styles.css
          test -f package.json
          test -f capacitor.config.json
          test -f scripts/configure-android-16.sh

          echo "Required source files: PASS"

      # ============================================================
      # 10. VERIFY APP.JS
      # ============================================================
      - name: Verify app.js
        shell: bash
        run: |
          set -e

          cd "$RKMS_SOURCE_DIR"

          node --check app.js

          echo "app.js syntax: PASS"

      # ============================================================
      # 11. VERIFY PYTHON
      # ============================================================
      - name: Verify Python scripts
        shell: bash
        run: |
          set -e

          cd "$RKMS_SOURCE_DIR"

          if compgen -G "scripts/*.py" > /dev/null; then
            python3 -m py_compile scripts/*.py
          fi

          echo "Python scripts: PASS"

      # ============================================================
      # 12. INSTALL NPM
      # ============================================================
      - name: Install npm dependencies
        shell: bash
        run: |
          set -e

          cd "$RKMS_SOURCE_DIR"

          npm install --no-audit --no-fund

          echo "npm install: PASS"

      # ============================================================
      # 13. BUILD WEB DIST
      # ============================================================
      - name: Build RKMS web assets
        shell: bash
        run: |
          set -e

          cd "$RKMS_SOURCE_DIR"

          npm run build

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html missing."
            exit 1
          fi

          echo "dist/index.html: PASS"

      # ============================================================
      # 14. VERIFY ORIGINAL RKMS LOGO
      # ============================================================
      - name: Verify original RKMS launcher logo
        shell: bash
        run: |
          set -e

          cd "$RKMS_SOURCE_DIR"

          test -f \
            "assets/rkms-launcher-original-transparent.png"

          test -d "android_launcher_icons"

          for D in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -f \
              "android_launcher_icons/mipmap-$D/ic_launcher.png"

            test -f \
              "android_launcher_icons/mipmap-$D/ic_launcher_round.png"
          done

          echo "Original RKMS launcher icon source: PASS"

      # ============================================================
      # 15. ADD CAPACITOR ANDROID
      # ============================================================
      - name: Add Capacitor Android
        shell: bash
        run: |
          set -e

          cd "$RKMS_SOURCE_DIR"

          rm -rf android

          npx cap add android

          test -d android

          echo "Capacitor Android project: PASS"

      # ============================================================
      # 16. CAPACITOR SYNC
      # ============================================================
      - name: Capacitor sync
        shell: bash
        run: |
          set -e

          cd "$RKMS_SOURCE_DIR"

          test -f dist/index.html

          npx cap sync android

          echo "Capacitor sync: PASS"

      # ============================================================
      # 17. CONFIGURE ANDROID 16
      # ============================================================
      - name: Configure RKMS Android 16
        shell: bash
        run: |
          set -e

          cd "$RKMS_SOURCE_DIR"

          test -f android/variables.gradle

          chmod +x scripts/configure-android-16.sh

          ./scripts/configure-android-16.sh

          echo "RKMS Android 16 configuration: PASS"

      # ============================================================
      # 18. VERIFY ANDROID API 36
      # ============================================================
      - name: Verify Android API 36 configuration
        shell: bash
        run: |
          set -e

          cd "$RKMS_SOURCE_DIR"

          grep -E \
            "compileSdkVersion|targetSdkVersion" \
            android/variables.gradle || true

          grep -E \
            "com.android.tools.build:gradle" \
            android/build.gradle || true

          grep -E \
            "distributionUrl" \
            android/gradle/wrapper/gradle-wrapper.properties || true

          echo "Android configuration checked."

      # ============================================================
      # 19. INSTALL ORIGINAL RKMS LAUNCHER ICONS
      # ============================================================
      - name: Install original RKMS launcher icons
        shell: bash
        run: |
          set -e

          cd "$RKMS_SOURCE_DIR"

          RES="android/app/src/main/res"

          mkdir -p "$RES"

          rm -rf "$RES/mipmap-anydpi-v26"
          rm -rf "$RES/mipmap-anydpi"

          rm -rf "$RES/mipmap-mdpi"
          rm -rf "$RES/mipmap-hdpi"
          rm -rf "$RES/mipmap-xhdpi"
          rm -rf "$RES/mipmap-xxhdpi"
          rm -rf "$RES/mipmap-xxxhdpi"

          cp -R android_launcher_icons/mipmap-mdpi "$RES/"
          cp -R android_launcher_icons/mipmap-hdpi "$RES/"
          cp -R android_launcher_icons/mipmap-xhdpi "$RES/"
          cp -R android_launcher_icons/mipmap-xxhdpi "$RES/"
          cp -R android_launcher_icons/mipmap-xxxhdpi "$RES/"

          echo "Original RKMS launcher icons installed."

      # ============================================================
      # 20. VERIFY ICONS
      # ============================================================
      - name: Verify launcher icons
        shell: bash
        run: |
          set -e

          cd "$RKMS_SOURCE_DIR"

          for D in mdpi hdpi xhdpi xxhdpi xxxhdpi; do

            cmp \
              "android_launcher_icons/mipmap-$D/ic_launcher.png" \
              "android/app/src/main/res/mipmap-$D/ic_launcher.png"

            cmp \
              "android_launcher_icons/mipmap-$D/ic_launcher_round.png" \
              "android/app/src/main/res/mipmap-$D/ic_launcher_round.png"

          done

          if [ -d "android/app/src/main/res/mipmap-anydpi-v26" ]; then
            echo "ERROR: Adaptive launcher icons still exist."
            exit 1
          fi

          echo "Launcher icons byte-for-byte verification: PASS"

      # ============================================================
      # 21. VERIFY GRADLE
      # ============================================================
      - name: Verify Gradle 8.11.1
        shell: bash
        run: |
          set -e

          cd "$RKMS_SOURCE_DIR/android"

          test -f gradle/wrapper/gradle-wrapper.properties

          grep -q \
            "gradle-8.11.1-bin.zip" \
            gradle/wrapper/gradle-wrapper.properties

          echo "Gradle 8.11.1: PASS"

      # ============================================================
      # 22. VERIFY SIGNING SECRETS
      # ============================================================
      - name: Verify release signing secrets
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -e

          test -n "$RKMS_KEYSTORE_BASE64" \
            || { echo "ERROR: RKMS_KEYSTORE_BASE64 missing."; exit 1; }

          test -n "$RKMS_KEYSTORE_PASSWORD" \
            || { echo "ERROR: RKMS_KEYSTORE_PASSWORD missing."; exit 1; }

          test -n "$RKMS_KEY_ALIAS" \
            || { echo "ERROR: RKMS_KEY_ALIAS missing."; exit 1; }

          test -n "$RKMS_KEY_PASSWORD" \
            || { echo "ERROR: RKMS_KEY_PASSWORD missing."; exit 1; }

          echo "Release signing secrets: PASS"

      # ============================================================
      # 23. PREPARE KEYSTORE
      # ============================================================
      - name: Prepare release keystore
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
        run: |
          set -e

          echo "$RKMS_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/rkms-release.keystore"

          test -s "$RUNNER_TEMP/rkms-release.keystore"

          echo "Release keystore: PASS"

      # ============================================================
      # 24. CREATE GRADLE SIGNING PROPERTIES
      # ============================================================
      - name: Configure Gradle release signing
        shell: bash
        env:
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -e

          cd "$RKMS_SOURCE_DIR/android"

          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/rkms-release.keystore
          storePassword=$RKMS_KEYSTORE_PASSWORD
          keyAlias=$RKMS_KEY_ALIAS
          keyPassword=$RKMS_KEY_PASSWORD
          EOF

          test -s keystore.properties

          echo "Gradle signing properties created."

      # ============================================================
      # 25. PATCH APP GRADLE SIGNING
      # ============================================================
      - name: Configure Android release signing
        shell: bash
        run: |
          set -e

          cd "$RKMS_SOURCE_DIR/android"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text()

          if "keystore.properties" not in s:
              prefix = r'''
          def keystorePropertiesFile = rootProject.file("keystore.properties")
          def keystoreProperties = new Properties()

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          '''

              s = prefix + s

          if "signingConfigs" not in s:
              marker = "android {"

              signing = r'''
              signingConfigs {
                  release {
                      if (keystorePropertiesFile.exists()) {
                          storeFile file(keystoreProperties["storeFile"])
                          storePassword keystoreProperties["storePassword"]
                          keyAlias keystoreProperties["keyAlias"]
                          keyPassword keystoreProperties["keyPassword"]
                      }
                  }
              }

          '''

              s = s.replace(
                  marker,
                  marker + "\n" + signing,
                  1
              )

          if "signingConfig signingConfigs.release" not in s:
              release_marker = "buildTypes {"

              release_block = r'''
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }

          '''

              s = s.replace(
                  release_marker,
                  release_block,
                  1
              )

              # Remove duplicated opening buildTypes brace created
              # by the replacement if necessary.
              s = s.replace(
                  "release {\n                      signingConfig signingConfigs.release\n                  }\n\n                  release {",
                  "release {\n                      signingConfig signingConfigs.release\n                  }\n\n                  release {"
              )

          p.write_text(s)
          PY

          echo "Release signing configuration injected."

      # ============================================================
      # 26. VERIFY GRADLE SIGNING CONFIG
      # ============================================================
      - name: Verify Gradle signing configuration
        shell: bash
        run: |
          set -e

          cd "$RKMS_SOURCE_DIR/android"

          grep -n \
            "signingConfigs" \
            app/build.gradle

          grep -n \
            "signingConfig signingConfigs.release" \
            app/build.gradle

          echo "Gradle release signing configuration: PASS"

      # ============================================================
      # 27. BUILD SIGNED AAB
      # ============================================================
      - name: Build signed Play Store AAB
        shell: bash
        run: |
          set -e

          cd "$RKMS_SOURCE_DIR/android"

          chmod +x gradlew

          ./gradlew clean bundleRelease \
            --no-daemon \
            --stacktrace

          echo "bundleRelease: PASS"

      # ============================================================
      # 28. LOCATE AAB
      # ============================================================
      - name: Locate AAB
        shell: bash
        run: |
          set -e

          cd "$RKMS_SOURCE_DIR"

          AAB=$(find android/app/build/outputs/bundle/release \
            -type f \
            -name "*.aab" \
            | head -n 1)

          if [ -z "$AAB" ]; then
            echo "ERROR: AAB was not generated."

            find android/app/build/outputs \
              -type f \
              -print || true

            exit 1
          fi

          echo "RKMS_AAB=$AAB" >> "$GITHUB_ENV"

          echo "AAB:"
          echo "$AAB"

      # ============================================================
      # 29. COPY FINAL AAB
      # ============================================================
      - name: Prepare final Play Store AAB
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$RKMS_SOURCE_DIR/$RKMS_AAB" \
            "$GITHUB_WORKSPACE/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab"

          test -s \
            "$GITHUB_WORKSPACE/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab"

          echo "Final AAB prepared."

      # ============================================================
      # 30. VERIFY AAB SIGNATURE
      # ============================================================
      - name: Verify AAB signature
        shell: bash
        run: |
          set -e

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$GITHUB_WORKSPACE/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab"

          echo "AAB signature verification: PASS"

      # ============================================================
      # 31. GENERATE SHA256
      # ============================================================
      - name: Generate AAB SHA256
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/release"

          sha256sum \
            RKMS_CONNECT_ANDROID16_API36_RELEASE.aab \
            | tee RKMS_ANDROID16_API36_AAB_SHA256.txt

      # ============================================================
      # 32. FINAL CHECK
      # ============================================================
      - name: Final Play Store AAB check
        shell: bash
        run: |
          set -e

          AAB="$GITHUB_WORKSPACE/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab"

          test -f "$AAB"
          test -s "$AAB"

          jarsigner \
            -verify \
            "$AAB"

          echo
          echo "=============================================="
          echo " RKMS PLAY STORE AAB: READY"
          echo " Android API: 36"
          echo " Signed: YES"
          echo " Format: Android App Bundle"
          echo "=============================================="
          echo

          ls -lh "$AAB"

      # ============================================================
      # 33. UPLOAD FINAL AAB
      # ============================================================
      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: RKMS_CONNECT_ANDROID16_API36_PLAYSTORE_AAB
          path: |
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab
            release/RKMS_ANDROID16_API36_AAB_SHA256.txt
          if-no-files-found: error
          retention-days: 90

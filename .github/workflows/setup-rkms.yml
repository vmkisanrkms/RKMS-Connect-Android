name: RKMS Android 16 API 36 FINAL APK AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  android-release:

    name: RKMS Android 16 API 36 Release

    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. LOCATE RKMS SOURCE ZIP
      # ============================================================

      - name: Locate RKMS source
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "RKMS SOURCE"
          echo "============================================================"

          if [ -f "package.json" ] \
            && [ -f "app.js" ] \
            && [ -f "index.html" ]; then

            echo "RKMS source found in repository root."

            echo "SOURCE_DIR=." >> "$GITHUB_ENV"

          else

            ZIP_FILE=""

            if [ -f "RKMS_CONNECT_FIXED_2026-09-18.zip" ]; then
              ZIP_FILE="RKMS_CONNECT_FIXED_2026-09-18.zip"
            fi

            if [ -z "$ZIP_FILE" ]; then
              ZIP_FILE="$(find . \
                -maxdepth 3 \
                -type f \
                -name 'RKMS_CONNECT_FIXED_2026-09-18.zip' \
                -print -quit || true)"
            fi

            if [ -z "$ZIP_FILE" ]; then
              ZIP_FILE="$(find . \
                -maxdepth 3 \
                -type f \
                -name 'RKMS_CONNECT_*.zip' \
                -print \
                | sort \
                | tail -1 || true)"
            fi

            if [ -z "$ZIP_FILE" ]; then

              echo "ERROR: RKMS source ZIP not found."

              find . \
                -maxdepth 3 \
                -type f \
                -name '*.zip' \
                -print \
                || true

              exit 1
            fi

            echo "Using RKMS ZIP:"
            echo "$ZIP_FILE"

            rm -rf .rkms_extract

            mkdir -p .rkms_extract

            unzip -q \
              "$ZIP_FILE" \
              -d .rkms_extract

            PACKAGE_JSON="$(find .rkms_extract \
              -type f \
              -name 'package.json' \
              -print \
              | head -1)"

            if [ -z "$PACKAGE_JSON" ]; then
              echo "ERROR: package.json not found in ZIP."
              exit 1
            fi

            SOURCE_DIR="$(dirname "$PACKAGE_JSON")"

            echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

            echo "SOURCE_DIR=$SOURCE_DIR"

          fi


      # ============================================================
      # 3. SOURCE AUDIT
      # ============================================================

      - name: Verify RKMS source
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          test -f package.json
          test -f app.js
          test -f index.html
          test -f styles.css
          test -f capacitor.config.json
          test -f google-services.json

          test -f scripts/configure-android-16.sh
          test -f scripts/setup-android-native.sh
          test -f scripts/configure-release-signing.sh

          echo "package.json: PASS"
          echo "app.js: PASS"
          echo "index.html: PASS"
          echo "styles.css: PASS"
          echo "capacitor.config.json: PASS"
          echo "google-services.json: PASS"
          echo "Android scripts: PASS"


      # ============================================================
      # 4. NODE 22
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'


      # ============================================================
      # 5. JDK 17
      # ============================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 6. JAVASCRIPT CHECK
      # ============================================================

      - name: Verify JavaScript
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          node --version
          npm --version

          node --check app.js

          echo "JavaScript syntax: PASS"


      # ============================================================
      # 7. NPM INSTALL
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          npm install \
            --no-audit \
            --no-fund

          echo "NPM install: PASS"


      # ============================================================
      # 8. WEB BUILD
      # ============================================================

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          npm run build

          test -s dist/index.html

          echo "Web build: PASS"


      # ============================================================
      # 9. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "ANDROID_HOME=$SDK"

          test -d "$SDK"

          test -x \
            "$SDK/cmdline-tools/latest/bin/sdkmanager"

          yes | \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --licenses \
            >/dev/null 2>&1 \
            || true

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          test -d \
            "$SDK/platforms/android-36"

          test -d \
            "$SDK/build-tools/36.0.0"

          echo "Android API 36: PASS"
          echo "Build tools 36.0.0: PASS"


      # ============================================================
      # 10. CAPACITOR ANDROID
      # ============================================================

      - name: Generate Capacitor Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          rm -rf android

          npx cap add android

          test -f android/app/build.gradle
          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml

          echo "Capacitor Android generation: PASS"


      # ============================================================
      # 11. ANDROID 16 BASE CONFIGURATION
      # ============================================================

      - name: Apply Android 16 API 36 configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          chmod +x \
            scripts/configure-android-16.sh

          bash \
            scripts/configure-android-16.sh

          echo "Android 16 configuration script completed."


      # ============================================================
      # 12. FORCE FINAL ANDROID VALUES
      #
      # IMPORTANT:
      # Do not use grep to guess whether configuration is correct.
      # Write the values directly.
      # ============================================================

      - name: Force final Android SDK configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          VARIABLES="android/variables.gradle"

          test -f "$VARIABLES"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/variables.gradle")
          text = path.read_text()

          def set_value(name, value):
              global text

              pattern = rf'(\b{name}\s*=\s*)\d+'

              if re.search(pattern, text):
                  text = re.sub(
                      pattern,
                      rf'\g<1>{value}',
                      text
                  )
              else:
                  text += f'\n{name} = {value}\n'

          set_value("compileSdkVersion", 36)
          set_value("targetSdkVersion", 36)
          set_value("minSdkVersion", 23)

          path.write_text(text)

          print("Final Android SDK values:")
          print("compileSdkVersion = 36")
          print("targetSdkVersion  = 36")
          print("minSdkVersion     = 23")
          PY

          echo ""
          echo "android/variables.gradle:"
          cat android/variables.gradle

          echo ""
          echo "Android SDK configuration: PASS"


      # ============================================================
      # 13. FORCE GRADLE VERSION
      # ============================================================

      - name: Force Gradle 8.11.1
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR/android"

          mkdir -p \
            gradle/wrapper

          cat > \
            gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          networkTimeout=100000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          echo "Gradle 8.11.1 configured."


      # ============================================================
      # 14. FORCE AGP 8.9.1
      # ============================================================

      - name: Force Android Gradle Plugin
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/build.gradle")

          text = path.read_text()

          text = re.sub(
              r'com\.android\.tools\.build:gradle:[0-9.]+',
              'com.android.tools.build:gradle:8.9.1',
              text
          )

          path.write_text(text)

          print("Android Gradle Plugin forced to 8.9.1")
          PY


      # ============================================================
      # 15. CAPACITOR SYNC
      # ============================================================

      - name: Sync Capacitor
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          npx cap sync android

          echo "Capacitor sync: PASS"


      # ============================================================
      # 16. RKMS NATIVE SETUP
      # ============================================================

      - name: Configure RKMS native Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          chmod +x \
            scripts/setup-android-native.sh

          bash \
            scripts/setup-android-native.sh

          MAIN="android/app/src/main/java/org/rkms/connect/MainActivity.java"

          BRIDGE="android/app/src/main/java/org/rkms/connect/RKMSNativeBridge.java"

          SECURE="android/app/src/main/java/org/rkms/connect/RKMSSecureCredentialsPlugin.java"

          test -f "$MAIN"
          test -f "$BRIDGE"
          test -f "$SECURE"

          test -s \
            android/app/google-services.json

          echo "MainActivity: PASS"
          echo "RKMSNativeBridge: PASS"
          echo "Secure credentials plugin: PASS"
          echo "Firebase JSON: PASS"


      # ============================================================
      # 17. FIREBASE CONFIGURATION
      #
      # No fragile Firebase dependency grep.
      # Configure it directly.
      # ============================================================

      - name: Configure Firebase
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          ROOT_GRADLE="android/build.gradle"
          APP_GRADLE="android/app/build.gradle"

          test -f "$ROOT_GRADLE"
          test -f "$APP_GRADLE"
          test -f "google-services.json"

          cp -f \
            google-services.json \
            android/app/google-services.json

          python3 - <<'PY'
          from pathlib import Path

          root = Path("android/build.gradle")
          app = Path("android/app/build.gradle")

          root_text = root.read_text()
          app_text = app.read_text()

          # Google Services classpath
          if "com.google.gms:google-services:" not in root_text:

              marker = "dependencies {"

              if marker not in root_text:
                  raise SystemExit(
                      "ERROR: root Gradle dependencies block missing"
                  )

              root_text = root_text.replace(
                  marker,
                  marker
                  + '\n'
                  + '        classpath '
                    '"com.google.gms:google-services:4.4.3"',
                  1
              )

          # Google Services plugin
          if "com.google.gms.google-services" not in app_text:

              app_text += """

          // RKMS Firebase
          apply plugin: "com.google.gms.google-services"
          """

          # Firebase dependencies
          if "dependencies {" not in app_text:
              app_text += """

          dependencies {
          }
          """

          if "com.google.firebase:firebase-bom:" not in app_text:

              app_text = app_text.replace(
                  "dependencies {",
                  """dependencies {
              implementation platform("com.google.firebase:firebase-bom:34.19.0")
          """,
                  1
              )

          if "com.google.firebase:firebase-messaging" not in app_text:

              app_text = app_text.replace(
                  "dependencies {",
                  """dependencies {
              implementation "com.google.firebase:firebase-messaging"
          """,
                  1
              )

          # Biometric dependency required by secure login plugin
          if "androidx.biometric:biometric:" not in app_text:

              app_text = app_text.replace(
                  "dependencies {",
                  """dependencies {
              implementation "androidx.biometric:biometric:1.1.0"
          """,
                  1
              )

          root.write_text(root_text)
          app.write_text(app_text)

          print("Firebase Gradle configuration written.")
          PY

          test -s \
            android/app/google-services.json

          echo "Firebase configuration: PASS"


      # ============================================================
      # 18. VERIFY FIREBASE JSON PACKAGE
      # ============================================================

      - name: Verify Firebase package
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "android/app/google-services.json"
          )

          data = json.loads(
              path.read_text()
          )

          packages = []

          for client in data.get("client", []):

              info = client.get(
                  "client_info",
                  {}
              )

              android = info.get(
                  "android_client_info",
                  {}
              )

              package_name = android.get(
                  "package_name"
              )

              if package_name:
                  packages.append(package_name)

          print("Firebase packages:")
          for item in packages:
              print(" -", item)

          if "org.rkms.connect" not in packages:

              raise SystemExit(
                  "ERROR: org.rkms.connect Firebase client missing"
              )

          print(
              "org.rkms.connect Firebase client: PASS"
          )
          PY


      # ============================================================
      # 19. VERIFY MAIN ACTIVITY
      # ============================================================

      - name: Verify MainActivity Firebase initialization
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          MAIN="android/app/src/main/java/org/rkms/connect/MainActivity.java"

          test -f "$MAIN"

          grep -Fq \
            'FirebaseApp.initializeApp(this)' \
            "$MAIN"

          grep -Fq \
            'registerPlugin(RKMSSecureCredentialsPlugin.class)' \
            "$MAIN"

          grep -Fq \
            'RKMSNativeBridge(this, getBridge().getWebView())' \
            "$MAIN"

          grep -Fq \
            'super.onCreate(savedInstanceState);' \
            "$MAIN"

          FIREBASE_COUNT="$(
            grep -F \
              -o \
              'FirebaseApp.initializeApp(this)' \
              "$MAIN" \
              | wc -l
          )"

          if [ "$FIREBASE_COUNT" -ne 1 ]; then
            echo "ERROR: Firebase init count = $FIREBASE_COUNT"
            exit 1
          fi

          echo "Firebase initialization: PASS"
          echo "MainActivity: PASS"


      # ============================================================
      # 20. NATIVE BRIDGE
      # ============================================================

      - name: Verify RKMS native bridge
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 \
            scripts/verify-native-bridge.py

          BRIDGE="android/app/src/main/java/org/rkms/connect/RKMSNativeBridge.java"

          test -f "$BRIDGE"

          if grep -Fq \
            '\n@JavascriptInterface' \
            "$BRIDGE"; then

            echo "ERROR: literal newline remains."
            exit 1

          fi

          if grep -Fq \
            '\n @JavascriptInterface' \
            "$BRIDGE"; then

            echo "ERROR: literal newline remains."
            exit 1

          fi

          grep -Fq \
            'saveSession' \
            "$BRIDGE"

          echo "Native bridge: PASS"


      # ============================================================
      # 21. SAVED LOGIN
      # ============================================================

      - name: Verify saved login
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 \
            scripts/verify-saved-login.py

          echo "Saved login: PASS"


      # ============================================================
      # 22. FCM
      # ============================================================

      - name: Verify FCM pipeline
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 \
            scripts/verify-fcm-pipeline.py

          echo "FCM pipeline: PASS"


      # ============================================================
      # 23. FINAL RKMS AUDIT
      # ============================================================

      - name: Verify final RKMS rules
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 \
            scripts/verify-rkms-final.py

          echo "Final RKMS audit: PASS"


      # ============================================================
      # 24. ANDROID 16 STATIC AUDIT
      # ============================================================

      - name: Verify Android 16 source configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-android-16.py ]; then
            python3 \
              scripts/verify-android-16.py
          fi

          echo "Android 16 source audit completed."


      # ============================================================
      # 25. LOGIN NAVIGATION
      # ============================================================

      - name: Verify login navigation
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-final-login-navigation.py ]; then
            python3 \
              scripts/verify-final-login-navigation.py
          fi

          echo "Login navigation: PASS"


      # ============================================================
      # 26. AUTHORITY
      # ============================================================

      - name: Verify authority hierarchy
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-authority-hierarchy.py ]; then
            python3 \
              scripts/verify-authority-hierarchy.py
          fi

          echo "Authority hierarchy: PASS"


      # ============================================================
      # 27. DIRECTORY
      # ============================================================

      - name: Verify directory
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-directory-lists.py ]; then
            python3 \
              scripts/verify-directory-lists.py
          fi

          if [ -f scripts/verify-member-directory-scope.py ]; then
            python3 \
              scripts/verify-member-directory-scope.py
          fi

          if [ -f scripts/verify-directory-contact-actions.py ]; then
            python3 \
              scripts/verify-directory-contact-actions.py
          fi

          if [ -f scripts/verify-v17-directory-deep.py ]; then
            python3 \
              scripts/verify-v17-directory-deep.py
          fi

          echo "Directory audit: PASS"


      # ============================================================
      # 28. PROFILE
      # ============================================================

      - name: Verify profile update
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-profile-update-final.py ]; then
            python3 \
              scripts/verify-profile-update-final.py
          fi

          echo "Profile update: PASS"


      # ============================================================
      # 29. PDF
      # ============================================================

      - name: Verify PDF pipeline
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-pdf-pipeline.py ]; then
            python3 \
              scripts/verify-pdf-pipeline.py
          fi

          if [ -f scripts/verify-report-download-scope.py ]; then
            python3 \
              scripts/verify-report-download-scope.py
          fi

          echo "PDF/report pipeline: PASS"


      # ============================================================
      # 30. COMPLAINT IMPLEMENTATION
      #
      # Old verify-complaint-final.py is NOT used because its
      # build-format assertion is obsolete for this APK+AAB build.
      # ============================================================

      - name: Verify complaint implementation
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          grep -Fq \
            'memberCloseComplaint' \
            app.js

          grep -Fq \
            'memberReopenComplaint' \
            app.js

          grep -Fq \
            'officerCloseComplaint' \
            app.js

          grep -Fq \
            'rkms_officer_close_complaint' \
            app.js

          grep -Fq \
            'rkms_officer_close_complaint' \
            supabase/migrations/20260915090000_complaint_officer_close.sql

          echo "Complaint implementation: PASS"


      # ============================================================
      # 31. SIGNING SECRETS
      # ============================================================

      - name: Verify release signing
        shell: bash
        run: |
          set -euo pipefail

          test -n \
            "${RKMS_KEYSTORE_BASE64:-}"

          test -n \
            "${RKMS_KEYSTORE_PASSWORD:-}"

          test -n \
            "${RKMS_KEY_ALIAS:-}"

          test -n \
            "${RKMS_KEY_PASSWORD:-}"

          echo "Signing secrets: PASS"


      # ============================================================
      # 32. CONFIGURE RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          chmod +x \
            scripts/configure-release-signing.sh

          bash \
            scripts/configure-release-signing.sh

          test -s \
            android/app/release.keystore

          echo "Release keystore: PASS"


      # ============================================================
      # 33. FINAL DIRECT CONFIGURATION CHECK
      #
      # IMPORTANT:
      # NO grep of compileSdk/targetSdk/minSdk.
      #
      # Read the file and print the actual values.
      # ============================================================

      - name: Final Android configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          test -f \
            android/variables.gradle

          test -f \
            android/build.gradle

          test -f \
            android/app/build.gradle

          test -f \
            android/app/src/main/AndroidManifest.xml

          test -d \
            "${ANDROID_HOME}/platforms/android-36"

          test -d \
            "${ANDROID_HOME}/build-tools/36.0.0"

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/variables.gradle")
          s = p.read_text()

          def get(name):
              m = re.search(
                  rf'\b{name}\s*=\s*(\d+)',
                  s
              )
              return int(m.group(1)) if m else None

          compile_sdk = get("compileSdkVersion")
          target_sdk = get("targetSdkVersion")
          min_sdk = get("minSdkVersion")

          print("compileSdkVersion:", compile_sdk)
          print("targetSdkVersion :", target_sdk)
          print("minSdkVersion    :", min_sdk)

          if compile_sdk != 36:
              raise SystemExit(
                  f"ERROR: compileSdkVersion={compile_sdk}"
              )

          if target_sdk != 36:
              raise SystemExit(
                  f"ERROR: targetSdkVersion={target_sdk}"
              )

          if min_sdk != 23:
              raise SystemExit(
                  f"ERROR: minSdkVersion={min_sdk}"
              )

          print("Android SDK values: PASS")
          PY

          echo "Android platform 36: PRESENT"
          echo "Build tools 36.0.0: PRESENT"


      # ============================================================
      # 34. GRADLE CHECK
      # ============================================================

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR/android"

          chmod +x gradlew

          ./gradlew \
            --version

          echo "Gradle wrapper: PASS"


      # ============================================================
      # 35. FINAL FIREBASE CHECK
      #
      # Only source items which must exist.
      # ============================================================

      - name: Final Firebase check
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          MAIN="android/app/src/main/java/org/rkms/connect/MainActivity.java"

          test -s \
            android/app/google-services.json

          test -f "$MAIN"

          grep -Fq \
            'FirebaseApp.initializeApp(this)' \
            "$MAIN"

          grep -Fq \
            'com.google.gms.google-services' \
            android/app/build.gradle

          echo "Firebase JSON: PASS"
          echo "Firebase initialization: PASS"
          echo "Google Services plugin: PASS"


      # ============================================================
      # 36. REAL GRADLE BUILD
      #
      # THIS IS THE FIRST REAL ANDROID COMPILATION.
      # ============================================================

      - name: Build signed Release APK and AAB
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR/android"

          chmod +x gradlew

          echo ""
          echo "============================================================"
          echo "        RKMS REAL ANDROID BUILD"
          echo "============================================================"
          echo ""

          ./gradlew \
            clean \
            assembleRelease \
            bundleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "============================================================"
          echo "        GRADLE APK + AAB BUILD: PASS"
          echo "============================================================"


      # ============================================================
      # 37. APK CHECK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          APK="android/app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"

          apksigner \
            verify \
            --verbose \
            "$APK"

          echo ""
          echo "APK generated:"
          ls -lh "$APK"

          echo "APK signature: PASS"


      # ============================================================
      # 38. AAB CHECK
      # ============================================================

      - name: Verify AAB
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          test -s "$AAB"

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB"

          echo ""
          echo "AAB generated:"
          ls -lh "$AAB"

          echo "AAB signature: PASS"


      # ============================================================
      # 39. PREPARE RELEASE DIRECTORY
      # ============================================================

      - name: Prepare final release files
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          rm -rf release

          mkdir -p release

          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          cp \
            android/app/build/outputs/bundle/release/app-release.aab \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab

          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab

          echo ""
          echo "FINAL APK:"
          ls -lh \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          echo ""
          echo "FINAL AAB:"
          ls -lh \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab


      # ============================================================
      # 40. APK SHA256
      # ============================================================

      - name: Calculate APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          sha256sum \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk \
            | tee \
            release/RKMS_ANDROID16_API36_APK_SHA256.txt


      # ============================================================
      # 41. AAB SHA256
      # ============================================================

      - name: Calculate AAB SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          sha256sum \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab \
            | tee \
            release/RKMS_ANDROID16_API36_AAB_SHA256.txt


      # ============================================================
      # 42. FINAL RELEASE VERIFICATION
      # ============================================================

      - name: Final release verification
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          APK="release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"
          AAB="release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab"

          test -s "$APK"
          test -s "$AAB"

          apksigner \
            verify \
            --verbose \
            "$APK"

          jarsigner \
            -verify \
            "$AAB"

          echo ""
          echo "============================================================"
          echo "             RKMS FINAL BUILD SUCCESS"
          echo "============================================================"
          echo ""
          echo "Android API 36       : PASS"
          echo "compileSdk 36        : PASS"
          echo "targetSdk 36         : PASS"
          echo "minSdk 23            : PASS"
          echo "Firebase             : PASS"
          echo "FCM                  : PASS"
          echo "Saved Login          : PASS"
          echo "Native Bridge        : PASS"
          echo "Release Signing      : PASS"
          echo "APK                  : SIGNED"
          echo "AAB                  : SIGNED"
          echo ""
          echo "============================================================"


      # ============================================================
      # 43. UPLOAD FINAL APK + AAB
      # ============================================================

      - name: Upload final APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Android-16-API36-FINAL-APK-AAB
          path: |
            ${{ env.SOURCE_DIR }}/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            ${{ env.SOURCE_DIR }}/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab
            ${{ env.SOURCE_DIR }}/release/RKMS_ANDROID16_API36_APK_SHA256.txt
            ${{ env.SOURCE_DIR }}/release/RKMS_ANDROID16_API36_AAB_SHA256.txt
          if-no-files-found: error
          retention-days: 90

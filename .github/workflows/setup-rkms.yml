name: RKMS Android 16 API 36 - Final APK AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release:

    name: RKMS Final Android 16 API 36 APK + AAB

    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout RKMS repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. FIND / PREPARE RKMS SOURCE
      #
      # Supports:
      #   A. Source directly in repository root
      #   B. Source inside a folder
      #   C. RKMS source ZIP inside repository
      # ============================================================
      - name: Locate RKMS source
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo " RKMS SOURCE DISCOVERY"
          echo "================================================"

          SOURCE_DIR=""

          # --------------------------------------------------------
          # A. Root source
          # --------------------------------------------------------
          if [ -f "package.json" ] && \
             [ -f "app.js" ] && \
             [ -f "index.html" ] && \
             [ -f "styles.css" ] && \
             [ -f "capacitor.config.json" ]; then

            SOURCE_DIR="."

            echo "RKMS source found in repository root."

          fi


          # --------------------------------------------------------
          # B. Source inside repository folder
          # --------------------------------------------------------
          if [ -z "$SOURCE_DIR" ]; then

            echo "Searching repository folders..."

            while IFS= read -r pkg; do

              DIR="$(dirname "$pkg")"

              if [ -f "$DIR/app.js" ] && \
                 [ -f "$DIR/index.html" ] && \
                 [ -f "$DIR/styles.css" ] && \
                 [ -f "$DIR/capacitor.config.json" ]; then

                SOURCE_DIR="$DIR"
                break

              fi

            done < <(
              find . \
                -type f \
                -name package.json \
                -not -path './.git/*' \
                -not -path '*/node_modules/*' \
                | sort
            )

          fi


          # --------------------------------------------------------
          # C. Search ZIP files
          # --------------------------------------------------------
          if [ -z "$SOURCE_DIR" ]; then

            echo "No direct source tree found."
            echo "Searching RKMS ZIP files..."

            mkdir -p .rkms-source

            ZIP_FOUND=""

            while IFS= read -r zipfile; do

              echo
              echo "Checking ZIP:"
              echo "$zipfile"

              if unzip -l "$zipfile" 2>/dev/null \
                | grep -Eq '(^|/)(package\.json)$' && \
                 unzip -l "$zipfile" 2>/dev/null \
                | grep -Eq '(^|/)app\.js$' && \
                 unzip -l "$zipfile" 2>/dev/null \
                | grep -Eq '(^|/)capacitor\.config\.json$'; then

                ZIP_FOUND="$zipfile"
                break

              fi

            done < <(
              find . \
                -type f \
                \( -iname "*.zip" -o -iname "*.ZIP" \) \
                -not -path './.git/*' \
                -not -path '*/node_modules/*' \
                | sort
            )


            if [ -n "$ZIP_FOUND" ]; then

              echo
              echo "RKMS source ZIP found:"
              echo "$ZIP_FOUND"

              rm -rf .rkms-source/*
              unzip -q "$ZIP_FOUND" -d .rkms-source

              while IFS= read -r pkg; do

                DIR="$(dirname "$pkg")"

                if [ -f "$DIR/app.js" ] && \
                   [ -f "$DIR/index.html" ] && \
                   [ -f "$DIR/styles.css" ] && \
                   [ -f "$DIR/capacitor.config.json" ]; then

                  SOURCE_DIR="$DIR"
                  break

                fi

              done < <(
                find .rkms-source \
                  -type f \
                  -name package.json \
                  -not -path '*/node_modules/*' \
                  | sort
              )

            fi

          fi


          # --------------------------------------------------------
          # FINAL SOURCE RESULT
          # --------------------------------------------------------
          if [ -z "$SOURCE_DIR" ]; then

            echo
            echo "================================================"
            echo " ERROR: RKMS SOURCE NOT FOUND"
            echo "================================================"
            echo
            echo "The GitHub repository does not currently contain:"
            echo
            echo "  package.json"
            echo "  app.js"
            echo "  index.html"
            echo "  styles.css"
            echo "  capacitor.config.json"
            echo
            echo "The workflow cannot manufacture the application source."
            echo
            echo "Upload/extract the audited RKMS source ZIP into the"
            echo "GitHub repository and run this workflow again."
            echo

            echo "Repository contents:"
            find . \
              -maxdepth 3 \
              -type f \
              -not -path './.git/*' \
              | sort \
              | head -300

            exit 1

          fi


          echo
          echo "================================================"
          echo " RKMS SOURCE FOUND"
          echo "================================================"
          echo "SOURCE_DIR=$SOURCE_DIR"

          echo "RKMS_SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

          echo
          echo "Important RKMS files:"

          test -f "$SOURCE_DIR/package.json"
          test -f "$SOURCE_DIR/app.js"
          test -f "$SOURCE_DIR/index.html"
          test -f "$SOURCE_DIR/styles.css"
          test -f "$SOURCE_DIR/capacitor.config.json"
          test -f "$SOURCE_DIR/google-services.json"

          echo "Source discovery: PASS"


      # ============================================================
      # 3. NODE 22
      # ============================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      # ============================================================
      # 4. VERIFY SOURCE
      # ============================================================
      - name: Verify RKMS source
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          echo "================================================"
          echo " RKMS SOURCE VERIFICATION"
          echo "================================================"

          node --version
          npm --version

          test -f package.json
          test -f app.js
          test -f index.html
          test -f styles.css
          test -f capacitor.config.json
          test -f google-services.json

          node --check app.js

          echo
          echo "RKMS source verification: PASS"


      # ============================================================
      # 5. VERIFY PACKAGE CONFIG
      # ============================================================
      - name: Verify package and Capacitor configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          node <<'NODE'
          const fs = require("fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const cap = JSON.parse(
            fs.readFileSync("capacitor.config.json", "utf8")
          );

          if (pkg.name !== "rkms") {
            throw new Error(
              `Unexpected package name: ${pkg.name}`
            );
          }

          if (!pkg.scripts || !pkg.scripts.build) {
            throw new Error(
              "package.json build script is missing"
            );
          }

          if (cap.appId !== "org.rkms.connect") {
            throw new Error(
              `Unexpected appId: ${cap.appId}`
            );
          }

          if (cap.webDir !== "dist") {
            throw new Error(
              `Unexpected webDir: ${cap.webDir}`
            );
          }

          const deps = {
            ...(pkg.dependencies || {}),
            ...(pkg.devDependencies || {})
          };

          if (deps["@capacitor/core"] !== "6.2.2") {
            throw new Error(
              `Unexpected @capacitor/core: ${deps["@capacitor/core"]}`
            );
          }

          if (deps["@capacitor/android"] !== "6.2.2") {
            throw new Error(
              `Unexpected @capacitor/android: ${deps["@capacitor/android"]}`
            );
          }

          console.log("package.json: PASS");
          console.log("capacitor.config.json: PASS");
          console.log("appId: org.rkms.connect");
          console.log("webDir: dist");
          NODE


      # ============================================================
      # 6. INSTALL NPM
      # ============================================================
      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          if [ -f package-lock.json ]; then

            echo "package-lock.json found."
            npm ci --no-audit --no-fund

          else

            echo "package-lock.json not found."
            npm install --no-audit --no-fund

          fi

          npm ls @capacitor/core --depth=0
          npm ls @capacitor/android --depth=0
          npm ls @capacitor/push-notifications --depth=0

          echo "npm dependencies: PASS"


      # ============================================================
      # 7. BUILD WEB
      # ============================================================
      - name: Build RKMS web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          npm run build

          test -s dist/index.html

          echo "Web build: PASS"


      # ============================================================
      # 8. JDK 17
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 9. ANDROID SDK
      # ============================================================
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=/usr/local/lib/android/sdk" \
            >> "$GITHUB_ENV"

          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" \
            >> "$GITHUB_ENV"

          echo "/usr/local/lib/android/sdk/platform-tools" \
            >> "$GITHUB_PATH"

          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" \
            >> "$GITHUB_PATH"

          test -d /usr/local/lib/android/sdk

          test -x \
            /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager

          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            --version

          echo "Android SDK: PASS"


      # ============================================================
      # 10. LICENSES
      # ============================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | \
            /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=/usr/local/lib/android/sdk \
            --licenses >/dev/null 2>&1 || true

          echo "Android SDK licenses: PASS"


      # ============================================================
      # 11. API 36
      # ============================================================
      - name: Install Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=/usr/local/lib/android/sdk \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          test -d "$ANDROID_HOME/platforms/android-36"

          test -d "$ANDROID_HOME/build-tools/36.0.0"

          echo "Android API 36: PASS"
          echo "Build Tools 36.0.0: PASS"


      # ============================================================
      # 12. CAPACITOR ANDROID
      # ============================================================
      - name: Add Capacitor Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          rm -rf android

          npx cap add android

          test -f android/app/build.gradle
          test -f android/gradlew

          echo "Capacitor Android project: PASS"


      # ============================================================
      # 13. CONFIGURE ANDROID 16
      # ============================================================
      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          test -f scripts/configure-android-16.sh

          chmod +x scripts/configure-android-16.sh

          bash scripts/configure-android-16.sh

          grep -q "36" \
            android/variables.gradle

          grep -q "gradle-8.11.1-bin.zip" \
            android/gradle/wrapper/gradle-wrapper.properties

          grep -q "8.9.1" \
            android/build.gradle

          echo "Android 16 / API 36 configuration: PASS"


      # ============================================================
      # 14. CAPACITOR SYNC
      # ============================================================
      - name: Sync Capacitor Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          npx cap sync android

          test -f \
            android/app/src/main/AndroidManifest.xml

          echo "Capacitor sync: PASS"


      # ============================================================
      # 15. RKMS NATIVE + FIREBASE
      # ============================================================
      - name: Setup RKMS native Android and Firebase
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          test -f scripts/setup-android-native.sh

          chmod +x scripts/setup-android-native.sh

          bash scripts/setup-android-native.sh

          test -s android/app/google-services.json

          grep -q \
            "com.google.gms.google-services" \
            android/app/build.gradle

          if grep -Rqs \
            "FirebaseApp.initializeApp" \
            android/app/src/main/java/org/rkms/connect; then

            echo "FirebaseApp.initializeApp: FOUND"

          else

            echo "ERROR: FirebaseApp.initializeApp not found"
            exit 1

          fi

          echo "Firebase / RKMS native setup: PASS"


      # ============================================================
      # 16. RKMS ICONS
      # ============================================================
      - name: Verify RKMS launcher icons
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          if [ -d android_launcher_icons ]; then

            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do

              test -s \
                "android_launcher_icons/mipmap-$density/ic_launcher.png"

              test -s \
                "android_launcher_icons/mipmap-$density/ic_launcher_round.png"

            done

            echo "RKMS launcher source icons: PASS"

          else

            echo "Launcher source directory not found."
            echo "Continuing with Capacitor resources."

          fi


      # ============================================================
      # 17. RELEASE SIGNING
      # ============================================================
      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          test -n "${RKMS_KEYSTORE_BASE64:-}" \
            || {
              echo "ERROR: RKMS_KEYSTORE_BASE64 missing."
              exit 1
            }

          test -n "${RKMS_KEYSTORE_PASSWORD:-}" \
            || {
              echo "ERROR: RKMS_KEYSTORE_PASSWORD missing."
              exit 1
            }

          test -n "${RKMS_KEY_ALIAS:-}" \
            || {
              echo "ERROR: RKMS_KEY_ALIAS missing."
              exit 1
            }

          test -n "${RKMS_KEY_PASSWORD:-}" \
            || {
              echo "ERROR: RKMS_KEY_PASSWORD missing."
              exit 1
            }

          test -f scripts/configure-release-signing.sh

          chmod +x scripts/configure-release-signing.sh

          bash scripts/configure-release-signing.sh

          test -s android/app/release.keystore

          grep -q \
            "signingConfigs.release" \
            android/app/build.gradle

          echo "Release signing: PASS"


      # ============================================================
      # 18. GRADLE
      # ============================================================
      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          grep -q \
            "gradle-8.11.1-bin.zip" \
            android/gradle/wrapper/gradle-wrapper.properties

          chmod +x android/gradlew

          cd android

          ./gradlew --version


      # ============================================================
      # 19. BUILD DEBUG APK
      # ============================================================
      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR/android"

          ./gradlew clean assembleDebug \
            --no-daemon \
            --stacktrace

          test -s \
            app/build/outputs/apk/debug/app-debug.apk

          echo "Debug APK: PASS"


      # ============================================================
      # 20. BUILD RELEASE APK + AAB
      # ============================================================
      - name: Build release APK and AAB
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR/android"

          ./gradlew assembleRelease bundleRelease \
            --no-daemon \
            --stacktrace

          test -s \
            app/build/outputs/apk/release/app-release.apk

          test -s \
            app/build/outputs/bundle/release/app-release.aab

          echo "Release APK: PASS"
          echo "Release AAB: PASS"


      # ============================================================
      # 21. PACKAGE ID CHECK
      # ============================================================
      - name: Verify final APK package ID
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            dump badging \
            android/app/build/outputs/apk/release/app-release.apk \
            | grep -q \
              "package: name='org.rkms.connect'"

          echo "Package ID org.rkms.connect: PASS"


      # ============================================================
      # 22. PREPARE RELEASE ARTIFACTS
      # ============================================================
      - name: Prepare final artifacts
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          mkdir -p release

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            release/RKMS_CONNECT_ANDROID16_API36_DEBUG.apk

          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          cp \
            android/app/build/outputs/bundle/release/app-release.aab \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab

          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_DEBUG.apk

          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab

          sha256sum \
            release/RKMS_CONNECT_ANDROID16_API36_DEBUG.apk \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab \
            | tee \
            release/RKMS_ANDROID16_API36_SHA256.txt


      # ============================================================
      # 23. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify release APK signature
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify \
            --verbose \
            android/app/build/outputs/apk/release/app-release.apk

          echo "APK signature: PASS"


      # ============================================================
      # 24. VERIFY AAB SIGNATURE
      # ============================================================
      - name: Verify release AAB signature
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          jarsigner \
            -verify \
            -verbose \
            -certs \
            android/app/build/outputs/bundle/release/app-release.aab

          echo "AAB signature: PASS"


      # ============================================================
      # 25. FINAL VERIFICATION
      # ============================================================
      - name: Final RKMS build verification
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          test -s release/RKMS_CONNECT_ANDROID16_API36_DEBUG.apk
          test -s release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
          test -s release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab

          echo
          echo "================================================"
          echo " RKMS CONNECT FINAL BUILD READY"
          echo "================================================"
          echo
          echo "App ID      : org.rkms.connect"
          echo "API         : 36"
          echo "Build Tools : 36.0.0"
          echo "Gradle      : 8.11.1"
          echo "AGP         : 8.9.1"
          echo "JDK         : 17"
          echo "Node        : 22"
          echo
          echo "DEBUG APK   : READY"
          echo "RELEASE APK : READY"
          echo "RELEASE AAB : READY"
          echo
          echo "================================================"

          ls -lh release/


      # ============================================================
      # 26. UPLOAD
      # ============================================================
      - name: Upload RKMS APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: RKMS_CONNECT_ANDROID16_API36_FINAL
          path: |
            ${{ env.RKMS_SOURCE_DIR }}/release/RKMS_CONNECT_ANDROID16_API36_DEBUG.apk
            ${{ env.RKMS_SOURCE_DIR }}/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            ${{ env.RKMS_SOURCE_DIR }}/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab
            ${{ env.RKMS_SOURCE_DIR }}/release/RKMS_ANDROID16_API36_SHA256.txt
          if-no-files-found: error
          retention-days: 90

name: RKMS CONNECT Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_DIR: stitch_uiux

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --no-audit --no-fund

      - name: Install Capacitor Android packages
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install @capacitor/core@^6.0.0 @capacitor/android@^6.0.0 @capacitor/app@^6.0.0 @capacitor/haptics@^6.0.0 @capacitor/keyboard@^6.0.0 @capacitor/status-bar@^6.0.0
          npm install --save-dev @capacitor/cli@^6.0.0

      - name: Create Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap add android

      - name: Sync web app to Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-CONNECT-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

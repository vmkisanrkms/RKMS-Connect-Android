name: Build RKMS Connect APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: rkms-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build RKMS Connect
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT=""

          check_project() {
            local DIR="$1"

            if [ -f "$DIR/settings.gradle" ] || \
               [ -f "$DIR/settings.gradle.kts" ]; then

              if [ -f "$DIR/app/build.gradle" ] || \
                 [ -f "$DIR/app/build.gradle.kts" ]; then

                if [ -f "$DIR/app/src/main/AndroidManifest.xml" ]; then
                  return 0
                fi

              fi
            fi

            return 1
          }

          # Current repository root
          if check_project "."; then
            PROJECT="$(pwd)"
          fi

          # Optional rkms_android folder
          if [ -z "$PROJECT" ] && check_project "./rkms_android"; then
            PROJECT="$(realpath ./rkms_android)"
          fi

          # Search remaining folders
          if [ -z "$PROJECT" ]; then
            while IFS= read -r -d '' SETTINGS; do
              DIR="$(dirname "$SETTINGS")"

              if check_project "$DIR"; then
                PROJECT="$(realpath "$DIR")"
                break
              fi
            done < <(
              find . \
                -type f \
                \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
                -not -path "./.git/*" \
                -not -path "*/build/*" \
                -print0
            )
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found."
            echo "Expected app/ + settings.gradle."
            find . -maxdepth 6 -type f \
              -not -path "./.git/*" \
              | sort
            exit 1
          fi

          echo "Android project:"
          echo "$PROJECT"

          echo "ANDROID_PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Verify RKMS project
        shell: bash
        run: |
          set -e

          P="$ANDROID_PROJECT_DIR"

          test -f "$P/settings.gradle" || \
          test -f "$P/settings.gradle.kts"

          test -f "$P/build.gradle" || \
          test -f "$P/build.gradle.kts"

          test -f "$P/app/build.gradle" || \
          test -f "$P/app/build.gradle.kts"

          test -f "$P/app/google-services.json"

          test -f "$P/app/src/main/AndroidManifest.xml"

          test -f "$P/app/src/main/assets/www/index.html"

          test -f "$P/app/src/main/java/org/rkms/connect/MainActivity.java"

          test -f "$P/app/src/main/java/org/rkms/connect/NotificationHelper.java"

          test -f "$P/app/src/main/java/org/rkms/connect/RKMSFirebaseMessagingService.java"

          test -f "$P/app/src/main/java/org/rkms/connect/FCMTokenRegistrar.java"

          test -f "$P/app/src/main/java/org/rkms/connect/SessionStore.java"

          echo "RKMS project verification: PASS"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Show Gradle version
        run: |
          gradle --version

      - name: Validate Gradle project
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        run: |
          gradle tasks \
            --no-daemon \
            --stacktrace

      - name: Clean project
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        run: |
          gradle clean \
            --no-daemon \
            --stacktrace

      - name: Build Debug APK
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        run: |
          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$(find "$ANDROID_PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/*" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            find "$ANDROID_PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print
            exit 1
          fi

          APK="$(realpath "$APK")"

          echo "APK FOUND:"
          echo "$APK"

          ls -lh "$APK"

          echo "RKMS_APK=$APK" >> "$GITHUB_ENV"

      - name: Upload RKMS APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-Debug-APK
          path: ${{ env.RKMS_APK }}
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        run: |
          echo "===================================="
          echo "RKMS CONNECT BUILD SUCCESS"
          echo "===================================="
          echo "APK artifact uploaded successfully."

name: RKMS Android 16 API 36 - Final Signed Release APK Only

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  NODE_VERSION: "22"
  JAVA_VERSION: "17"

  AGP_VERSION: "8.10.0"
  GRADLE_VERSION: "8.11.1"

  FIREBASE_BOM_VERSION: "34.19.0"
  GOOGLE_SERVICES_VERSION: "4.4.3"
  CREDENTIALS_VERSION: "1.5.0"

  APP_ID: "org.rkms.connect"
  MIN_SDK: "23"
  TARGET_SDK: "36"

  SOURCE_ZIP: "RKMS_CONNECT_FINAL_AUDITED_RELEASE_APK_BUILD_20260922.zip"

  EXPECTED_SOURCE_SHA256: "6907af2bd83ccb6a36b0aa177861ae0731c6f53501430b9fe05fd5b905d65299"

  APK_NAME: "RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"


jobs:

  build:

    name: Build Final Signed Release APK Only

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. NODE 22
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}


      # ============================================================
      # 3. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # ============================================================
      # 4. VERIFY SOURCE ZIP
      # ============================================================

      - name: Verify exact RKMS source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "RKMS SOURCE ZIP VERIFICATION"
          echo "=============================================="

          if [ ! -f "${SOURCE_ZIP}" ]; then
            echo "::error::Required source ZIP not found: ${SOURCE_ZIP}"

            find . \
              -type f \
              \( -iname "*.zip" -o -iname "*.ZIP" \) \
              -print \
              | sort || true

            exit 1
          fi

          if [ ! -s "${SOURCE_ZIP}" ]; then
            echo "::error::Source ZIP is empty."
            exit 1
          fi

          ACTUAL_SHA256="$(
            sha256sum "${SOURCE_ZIP}" | awk '{print $1}'
          )"

          echo "Expected:"
          echo "${EXPECTED_SOURCE_SHA256}"

          echo "Actual:"
          echo "${ACTUAL_SHA256}"

          if [ "${ACTUAL_SHA256}" != "${EXPECTED_SOURCE_SHA256}" ]; then
            echo "::error::Source ZIP SHA256 mismatch."
            exit 1
          fi

          echo "SOURCE ZIP SHA256: PASS"


      # ============================================================
      # 5. EXTRACT SOURCE
      # ============================================================

      - name: Extract RKMS source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build-project

          mkdir -p build-project

          unzip -q \
            "${SOURCE_ZIP}" \
            -d build-project

          echo "SOURCE EXTRACTION: PASS"


      # ============================================================
      # 6. DETECT PROJECT ROOT
      # ============================================================

      - name: Detect RKMS project root
        shell: bash
        run: |
          set -euo pipefail

          ROOT=""

          if [ -f "build-project/package.json" ]; then
            ROOT="build-project"
          else
            FOUND_PACKAGE="$(
              find build-project \
                -type f \
                -name "package.json" \
                -not -path "*/node_modules/*" \
                -print \
                | head -n 1 || true
            )"

            if [ -n "${FOUND_PACKAGE}" ]; then
              ROOT="$(dirname "${FOUND_PACKAGE}")"
            fi
          fi

          if [ -z "${ROOT}" ]; then
            echo "::error::package.json not found."
            exit 1
          fi

          echo "RKMS_ROOT=${ROOT}" >> "${GITHUB_ENV}"

          echo "RKMS_ROOT=${ROOT}"


      # ============================================================
      # 7. VERIFY SOURCE FILES
      # ============================================================

      - name: Validate RKMS source
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          REQUIRED_FILES=(
            "package.json"
            "package-lock.json"
            "app.js"
            "index.html"
            "styles.css"
            "capacitor.config.json"
            "google-services.json"

            "scripts/setup-android-native.sh"
            "scripts/configure-android-16.sh"
            "scripts/configure-release-signing.sh"

            "scripts/verify-3-point-fix-20260921.py"
            "scripts/verify-final-three-point-fix.py"
            "scripts/verify-rkms-final-fixes.py"
            "scripts/verify-fcm-pipeline.py"
            "scripts/verify-android-pdf.py"
            "scripts/verify-native-bridge.py"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "${file}" ]; then
              echo "::error::Missing required file: ${file}"
              exit 1
            fi

            echo "OK: ${file}"
          done

          echo "SOURCE VALIDATION: PASS"


      # ============================================================
      # 8. JAVASCRIPT SYNTAX
      # ============================================================

      - name: Verify app.js syntax
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          node --check app.js

          echo "APP.JS SYNTAX: PASS"


      # ============================================================
      # 9. REPAIR BROKEN NATIVE SETUP SCRIPT
      #
      # FIX FOR:
      #
      # File "<stdin>", line 4
      # mkdir -p "$DRAWABLE_DIR"
      # SyntaxError: invalid syntax
      #
      # The old source had shell commands accidentally placed
      # inside a Python heredoc.
      # ============================================================

      - name: Repair RKMS native setup script
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          python3 <<'PY'
          from pathlib import Path

          p = Path("scripts/setup-android-native.sh")

          s = p.read_text(
              encoding="utf-8"
          )

          broken_start = (
              "python3 - <<'PY3'\n"
              "from pathlib import Path\n"
              "# Stable white notification icon"
          )

          if broken_start not in s:
              print(
                  "Broken native setup block not found."
              )
              print(
                  "Assuming source script is already corrected."
              )
          else:

              start = s.index(
                  broken_start
              )

              end_marker = "\nPY3\n\n\nMAIN="

              end = s.find(
                  end_marker,
                  start
              )

              if end < 0:
                  raise SystemExit(
                      "ERROR: Could not locate end of broken native setup block."
                  )

              replacement = r'''# Stable white notification icon for FCM system notifications.
DRAWABLE_DIR="$RES_DIR/drawable"
mkdir -p "$DRAWABLE_DIR"

cat > "$DRAWABLE_DIR/ic_stat_rkms.xml" <<'XML'
<vector xmlns:android="http://schemas.android.com/apk/res/android"
    android:width="24dp"
    android:height="24dp"
    android:viewportWidth="24"
    android:viewportHeight="24">
    <path
        android:fillColor="#FFFFFFFF"
        android:pathData="M12,2A7,7 0,0 0,5 9v4l-2,3v1h18v-1l-2,-3V9A7,7 0,0 0,12 2M9,19a3,3 0,0 0,6 0z"/>
</vector>
XML

python3 - <<'PY3'
from pathlib import Path

p = Path(
    "android/app/src/main/AndroidManifest.xml"
)

s = p.read_text()

perm = (
    '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
    '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
)

if "android.permission.RECORD_AUDIO" not in s:

    pos = s.find("<application")

    if pos < 0:
        raise SystemExit(
            "AndroidManifest application tag missing"
        )

    s = s[:pos] + perm + s[pos:]


meta = (
    '    <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" '
    'android:value="@string/rkms_default_notification_channel_id" />\n'
    '    <meta-data android:name="com.google.firebase.messaging.default_notification_icon" '
    'android:resource="@drawable/ic_stat_rkms" />\n'
)

if (
    "com.google.firebase.messaging.default_notification_channel_id"
    not in s
):

    if "<application" not in s:
        raise SystemExit(
            "AndroidManifest application tag missing"
        )

    s = s.replace(
        "<application",
        '<application android:enableOnBackInvokedCallback="true"',
        1
    )

    if "</application>" not in s:
        raise SystemExit(
            "AndroidManifest application closing tag missing"
        )

    s = s.replace(
        "</application>",
        meta + "</application>",
        1
    )

p.write_text(s)
PY3
'''

              s = (
                  s[:start]
                  + replacement
                  + s[end + 1:]
              )

              p.write_text(
                  s,
                  encoding="utf-8"
              )

              print(
                  "BROKEN NATIVE SETUP BLOCK REPAIRED: PASS"
              )
          PY

          chmod +x \
            scripts/setup-android-native.sh

          bash -n \
            scripts/setup-android-native.sh

          echo "NATIVE SETUP SCRIPT SYNTAX: PASS"


      # ============================================================
      # 10. VERIFY ALL SHELL SCRIPTS
      # ============================================================

      - name: Verify shell script syntax
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          bash -n scripts/setup-android-native.sh
          bash -n scripts/configure-android-16.sh
          bash -n scripts/configure-release-signing.sh

          echo "SHELL SYNTAX: PASS"


      # ============================================================
      # 11. VERIFY PYTHON SCRIPTS
      # ============================================================

      - name: Verify Python script syntax
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          for file in \
            scripts/verify-3-point-fix-20260921.py \
            scripts/verify-final-three-point-fix.py \
            scripts/verify-rkms-final-fixes.py \
            scripts/verify-fcm-pipeline.py \
            scripts/verify-android-pdf.py \
            scripts/verify-native-bridge.py
          do
            echo "Checking ${file}"
            python3 -m py_compile "${file}"
          done

          echo "PYTHON SYNTAX: PASS"


      # ============================================================
      # 12. VERIFY CAPACITOR VERSIONS
      # ============================================================

      - name: Verify Capacitor versions
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          node <<'NODE'
          const fs = require("fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const deps = {
            ...(pkg.dependencies || {}),
            ...(pkg.devDependencies || {})
          };

          const required = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          let failed = false;

          for (
            const [name, version]
            of Object.entries(required)
          ) {

            const actual = deps[name];

            console.log(
              `${name}: required=${version}, actual=${actual || "MISSING"}`
            );

            if (!actual) {
              failed = true;
              continue;
            }

            const allowed = [
              version,
              `^${version}`,
              `~${version}`
            ];

            if (!allowed.includes(String(actual))) {

              console.error(
                `ERROR: ${name}: expected ${version}, found ${actual}`
              );

              failed = true;
            }
          }

          if (failed) {
            process.exit(1);
          }

          console.log(
            "CAPACITOR VALIDATION: PASS"
          );
          NODE


      # ============================================================
      # 13. NPM CI
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          npm ci \
            --no-audit \
            --no-fund

          echo "NPM INSTALL: PASS"


      # ============================================================
      # 14. BUILD WEB
      # ============================================================

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          npm run build

          test -d dist
          test -s dist/index.html

          echo "WEB BUILD: PASS"


      # ============================================================
      # 15. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ============================================================
      # 16. INSTALL API 36
      # ============================================================

      - name: Install Android API 36 and Build Tools
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "${SDK}" ]; then
            echo "::error::Android SDK path not found."
            exit 1
          fi

          SDKMANAGER="${SDK}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "${SDKMANAGER}" ]; then
            SDKMANAGER="$(
              find "${SDK}/cmdline-tools" \
                -type f \
                -path "*/bin/sdkmanager" \
                -print \
                | head -n 1 || true
            )"
          fi

          if [ -z "${SDKMANAGER}" ] || [ ! -x "${SDKMANAGER}" ]; then
            echo "::error::sdkmanager not found."
            exit 1
          fi

          yes | "${SDKMANAGER}" \
            --licenses \
            >/dev/null 2>&1 || true

          "${SDKMANAGER}" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          echo "ANDROID SDK INSTALL: PASS"


      # ============================================================
      # 17. VERIFY ANDROID SDK
      # ============================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          test -d \
            "${SDK}/platforms/android-${ANDROID_API}"

          test -d \
            "${SDK}/build-tools/${BUILD_TOOLS}"

          test -x \
            "${SDK}/build-tools/${BUILD_TOOLS}/aapt"

          test -x \
            "${SDK}/build-tools/${BUILD_TOOLS}/apksigner"

          echo "ANDROID API ${ANDROID_API}: PASS"
          echo "BUILD TOOLS ${BUILD_TOOLS}: PASS"
          echo "AAPT: PASS"
          echo "APKSIGNER: PASS"


      # ============================================================
      # 18. CREATE CAPACITOR ANDROID
      # ============================================================

      - name: Create Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          rm -rf android

          npx cap add android

          test -d android
          test -f android/app/build.gradle
          test -f android/gradlew

          echo "CAPACITOR ANDROID PROJECT: PASS"


      # ============================================================
      # 19. CONFIGURE ANDROID 16 / API 36
      # ============================================================

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          chmod +x \
            scripts/configure-android-16.sh

          ./scripts/configure-android-16.sh

          sed -i \
            -E \
            "s/com\.android\.tools\.build:gradle:[0-9.]+/com.android.tools.build:gradle:${AGP_VERSION}/g" \
            android/build.gradle

          sed -i \
            -E \
            "s#distributionUrl=.*#distributionUrl=https\\\\://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip#g" \
            android/gradle/wrapper/gradle-wrapper.properties

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "android/variables.gradle"
          )

          s = p.read_text(
              encoding="utf-8"
          )

          s = re.sub(
              r"(\bcompileSdkVersion\s*=\s*)\d+",
              r"\g<1>36",
              s
          )

          s = re.sub(
              r"(\btargetSdkVersion\s*=\s*)\d+",
              r"\g<1>36",
              s
          )

          s = re.sub(
              r"(\bminSdkVersion\s*=\s*)\d+",
              r"\g<1>23",
              s
          )

          p.write_text(
              s,
              encoding="utf-8"
          )
          PY

          grep -Eq \
            'compileSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

          grep -Eq \
            'targetSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

          grep -Eq \
            'minSdkVersion[[:space:]]*=[[:space:]]*23' \
            android/variables.gradle

          grep -Fq \
            "com.android.tools.build:gradle:${AGP_VERSION}" \
            android/build.gradle

          grep -Fq \
            "gradle-${GRADLE_VERSION}-bin.zip" \
            android/gradle/wrapper/gradle-wrapper.properties

          echo "ANDROID 16/API 36 CONFIGURATION: PASS"


      # ============================================================
      # 20. CAPACITOR SYNC
      # ============================================================

      - name: Capacitor sync Android
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          npx cap sync android

          echo "CAPACITOR SYNC: PASS"


      # ============================================================
      # 21. NATIVE RKMS SETUP
      # ============================================================

      - name: Configure RKMS native Android features
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          chmod +x \
            scripts/setup-android-native.sh

          bash -n \
            scripts/setup-android-native.sh

          ./scripts/setup-android-native.sh

          echo "RKMS NATIVE ANDROID SETUP: PASS"


      # ============================================================
      # 22. MICROPHONE PERMISSION
      # ============================================================

      - name: Ensure native microphone permission
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          s = p.read_text(
              encoding="utf-8"
          )

          permissions = (
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
          )

          if "android.permission.RECORD_AUDIO" not in s:

              m = re.search(
                  r"<manifest\b[^>]*>",
                  s
              )

              if not m:
                  raise SystemExit(
                      "Manifest tag missing"
                  )

              s = (
                  s[:m.end()]
                  + "\n"
                  + permissions
                  + s[m.end():]
              )

          p.write_text(
              s,
              encoding="utf-8"
          )
          PY

          grep -Fq \
            "android.permission.RECORD_AUDIO" \
            "${MANIFEST}"

          echo "RECORD_AUDIO: PASS"


      # ============================================================
      # 23. VERIFY NATIVE BRIDGE
      # ============================================================

      - name: Verify native bridge and Firebase
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          grep -Rqs \
            "RKMSNativeBridge" \
            android/app/src/main

          grep -Rqs \
            "FirebaseApp.initializeApp" \
            android/app/src/main

          grep -Rqs \
            "RECORD_AUDIO" \
            android/app/src/main

          echo "RKMS NATIVE BRIDGE: PASS"
          echo "FIREBASE INITIALIZATION: PASS"
          echo "MICROPHONE PERMISSION: PASS"


      # ============================================================
      # 24. VERIFY 3 POINT FIX
      # ============================================================

      - name: Verify three point fix
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          python3 \
            scripts/verify-3-point-fix-20260921.py

          echo "THREE POINT FIX: PASS"


      # ============================================================
      # 25. VERIFY FINAL THREE POINT FIX
      # ============================================================

      - name: Verify final three point fix
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          python3 \
            scripts/verify-final-three-point-fix.py

          echo "FINAL THREE POINT FIX: PASS"


      # ============================================================
      # 26. VERIFY RKMS FINAL FIXES
      # ============================================================

      - name: Verify RKMS final fixes
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          python3 \
            scripts/verify-rkms-final-fixes.py

          echo "RKMS FINAL FIXES: PASS"


      # ============================================================
      # 27. VERIFY FCM PIPELINE
      # ============================================================

      - name: Verify FCM pipeline
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          python3 \
            scripts/verify-fcm-pipeline.py

          echo "FCM PIPELINE: PASS"


      # ============================================================
      # 28. VERIFY ANDROID PDF
      # ============================================================

      - name: Verify Android PDF pipeline
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          python3 \
            scripts/verify-android-pdf.py

          echo "ANDROID PDF: PASS"


      # ============================================================
      # 29. VERIFY NATIVE BRIDGE SCRIPT
      # ============================================================

      - name: Verify native bridge pipeline
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          python3 \
            scripts/verify-native-bridge.py

          echo "NATIVE BRIDGE VERIFICATION: PASS"


      # ============================================================
      # 30. FORCE FIREBASE + CREDENTIAL DEPENDENCIES
      # ============================================================

      - name: Configure Firebase and Credential Manager
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          APP_GRADLE="android/app/build.gradle"

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "android/app/build.gradle"
          )

          s = p.read_text(
              encoding="utf-8"
          )

          marker = "dependencies {"

          if marker not in s:
              raise SystemExit(
                  "dependencies block not found"
              )

          dependencies = [
              'implementation platform("com.google.firebase:firebase-bom:34.19.0")',
              'implementation "com.google.firebase:firebase-messaging"',
              'implementation "androidx.credentials:credentials:1.5.0"',
              'implementation "androidx.credentials:credentials-play-services-auth:1.5.0"',
              'implementation "androidx.biometric:biometric:1.1.0"'
          ]

          for dep in dependencies:

              if dep not in s:

                  s = s.replace(
                      marker,
                      marker + "\n    " + dep,
                      1
                  )

          if "com.google.gms.google-services" not in s:

              s += (
                  '\n\n'
                  'apply plugin: "com.google.gms.google-services"\n'
              )

          p.write_text(
              s,
              encoding="utf-8"
          )
          PY

          grep -Fq \
            "firebase-bom:34.19.0" \
            "${APP_GRADLE}"

          grep -Fq \
            "firebase-messaging" \
            "${APP_GRADLE}"

          grep -Fq \
            "androidx.credentials:credentials:1.5.0" \
            "${APP_GRADLE}"

          grep -Fq \
            "androidx.credentials:credentials-play-services-auth:1.5.0" \
            "${APP_GRADLE}"

          grep -Fq \
            "androidx.biometric:biometric:1.1.0" \
            "${APP_GRADLE}"

          echo "FIREBASE DEPENDENCIES: PASS"
          echo "CREDENTIAL MANAGER: PASS"
          echo "BIOMETRIC: PASS"


      # ============================================================
      # 31. VERIFY PACKAGE
      # ============================================================

      - name: Verify package ID
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          grep -Rqs \
            "org.rkms.connect" \
            android/app

          echo "PACKAGE ID ${APP_ID}: PASS"


      # ============================================================
      # 32. VERIFY GOOGLE SERVICES
      # ============================================================

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          test -s \
            google-services.json

          test -s \
            android/app/google-services.json

          grep -Fq \
            "org.rkms.connect" \
            google-services.json

          grep -Fq \
            "org.rkms.connect" \
            android/app/google-services.json

          echo "GOOGLE SERVICES: PASS"


      # ============================================================
      # 33. VERIFY RELEASE SIGNING SECRETS
      # ============================================================

      - name: Verify release signing secrets
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          test -n "${RKMS_KEYSTORE_BASE64:-}"
          test -n "${RKMS_KEYSTORE_PASSWORD:-}"
          test -n "${RKMS_KEY_ALIAS:-}"
          test -n "${RKMS_KEY_PASSWORD:-}"

          echo "RELEASE SIGNING SECRETS: PASS"


      # ============================================================
      # 34. CONFIGURE RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          chmod +x \
            scripts/configure-release-signing.sh

          bash -n \
            scripts/configure-release-signing.sh

          ./scripts/configure-release-signing.sh

          test -s \
            android/app/release.keystore

          keytool \
            -list \
            -keystore android/app/release.keystore \
            -storepass "${RKMS_KEYSTORE_PASSWORD}" \
            -alias "${RKMS_KEY_ALIAS}" \
            >/dev/null

          echo "RELEASE KEYSTORE: PASS"


      # ============================================================
      # 35. FORCE GRADLE RELEASE SIGNING
      # ============================================================

      - name: Ensure complete Gradle release signing
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "android/app/build.gradle"
          )

          s = p.read_text(
              encoding="utf-8"
          )

          signing_block = '''signingConfigs {
              release {
                  storeFile file("release.keystore")
                  storePassword System.getenv("RKMS_KEYSTORE_PASSWORD")
                  keyAlias System.getenv("RKMS_KEY_ALIAS")
                  keyPassword System.getenv("RKMS_KEY_PASSWORD")
              }
          }'''

          start = s.find(
              "signingConfigs {"
          )

          if start >= 0:

              depth = 0
              end = None

              for i in range(
                  start,
                  len(s)
              ):

                  if s[i] == "{":
                      depth += 1

                  elif s[i] == "}":

                      depth -= 1

                      if depth == 0:
                          end = i + 1
                          break

              if end is None:
                  raise SystemExit(
                      "Malformed signingConfigs block"
                  )

              s = (
                  s[:start]
                  + signing_block
                  + s[end:]
              )

          else:

              build_types = s.find(
                  "buildTypes {"
              )

              if build_types < 0:
                  raise SystemExit(
                      "buildTypes block missing"
                  )

              s = (
                  s[:build_types]
                  + signing_block
                  + "\n\n"
                  + s[build_types:]
              )

          build_types = s.find(
              "buildTypes {"
          )

          if build_types < 0:
              raise SystemExit(
                  "buildTypes block missing"
              )

          release_start = s.find(
              "release {",
              build_types
          )

          if release_start < 0:
              raise SystemExit(
                  "release buildType missing"
              )

          depth = 0
          release_end = None

          for i in range(
              release_start,
              len(s)
          ):

              if s[i] == "{":
                  depth += 1

              elif s[i] == "}":

                  depth -= 1

                  if depth == 0:
                      release_end = i + 1
                      break

          if release_end is None:
              raise SystemExit(
                  "Malformed release block"
              )

          release_block = s[
              release_start:release_end
          ]

          lines = []

          for line in release_block.splitlines():

              if "signingConfig" not in line:
                  lines.append(line)

          release_block = "\n".join(
              lines
          )

          release_block = release_block.replace(
              "release {",
              "release {\n            signingConfig signingConfigs.release",
              1
          )

          s = (
              s[:release_start]
              + release_block
              + s[release_end:]
          )

          p.write_text(
              s,
              encoding="utf-8"
          )

          print(
              "RELEASE SIGNING CONFIGURATION: PASS"
          )
          PY

          grep -Fq \
            'storeFile file("release.keystore")' \
            android/app/build.gradle

          grep -Fq \
            'storePassword System.getenv("RKMS_KEYSTORE_PASSWORD")' \
            android/app/build.gradle

          grep -Fq \
            'keyAlias System.getenv("RKMS_KEY_ALIAS")' \
            android/app/build.gradle

          grep -Fq \
            'keyPassword System.getenv("RKMS_KEY_PASSWORD")' \
            android/app/build.gradle

          grep -Fq \
            'signingConfig signingConfigs.release' \
            android/app/build.gradle

          echo "RELEASE SIGNING CONFIG: PASS"


      # ============================================================
      # 36. GRADLE VERIFY
      # ============================================================

      - name: Verify Gradle project
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}/android"

          chmod +x gradlew

          ./gradlew \
            --version \
            --no-daemon

          echo "GRADLE CONFIGURATION: PASS"


      # ============================================================
      # 37. CLEAN
      # ============================================================

      - name: Clean Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}/android"

          ./gradlew \
            clean \
            --no-daemon \
            --stacktrace

          echo "ANDROID CLEAN: PASS"


      # ============================================================
      # 38. BUILD ONLY SIGNED RELEASE APK
      #
      # IMPORTANT:
      # assembleRelease ONLY
      #
      # NO DEBUG APK
      # NO AAB
      # ============================================================

      - name: Build Final Signed Release APK Only
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}/android"

          echo "=============================================="
          echo "RKMS FINAL SIGNED RELEASE APK"
          echo "=============================================="

          echo "API         : ${ANDROID_API}"
          echo "BUILD TOOLS : ${BUILD_TOOLS}"
          echo "MIN SDK     : ${MIN_SDK}"
          echo "TARGET SDK  : ${TARGET_SDK}"
          echo "AGP         : ${AGP_VERSION}"
          echo "GRADLE      : ${GRADLE_VERSION}"
          echo "PACKAGE     : ${APP_ID}"
          echo "SIGNED      : YES"
          echo "APK ONLY    : YES"
          echo "DEBUG APK   : NO"
          echo "AAB         : NO"

          test -n "${RKMS_KEYSTORE_PASSWORD}"
          test -n "${RKMS_KEY_ALIAS}"
          test -n "${RKMS_KEY_PASSWORD}"

          test -s \
            app/release.keystore

          keytool \
            -list \
            -keystore app/release.keystore \
            -storepass "${RKMS_KEYSTORE_PASSWORD}" \
            -alias "${RKMS_KEY_ALIAS}" \
            >/dev/null

          echo "KEYSTORE VALIDATION: PASS"

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          APK_OUTPUT="app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "${APK_OUTPUT}" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          echo "SIGNED RELEASE APK BUILD: PASS"


      # ============================================================
      # 39. LOCATE FINAL APK
      # ============================================================

      - name: Locate final release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}/android"

          APK="$(
            find \
              app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              ! -iname "*debug*" \
              -print \
              | head -n 1 || true
          )"

          if [ -z "${APK}" ]; then
            echo "::error::Release APK not found."

            find \
              app/build/outputs \
              -type f \
              -print \
              || true

            exit 1
          fi

          cp \
            "${APK}" \
            "${GITHUB_WORKSPACE}/${APK_NAME}"

          echo \
            "APK_PATH=${GITHUB_WORKSPACE}/${APK_NAME}" \
            >> "${GITHUB_ENV}"

          ls -lh \
            "${GITHUB_WORKSPACE}/${APK_NAME}"


      # ============================================================
      # 40. VERIFY APK PACKAGE + TARGET
      # ============================================================

      - name: Verify APK package and target SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          AAPT="${SDK}/build-tools/${BUILD_TOOLS}/aapt"

          test -x "${AAPT}"

          "${AAPT}" \
            dump badging \
            "${APK_PATH}" \
            > apk-badging.txt

          cat apk-badging.txt

          grep -Fq \
            "package: name='${APP_ID}'" \
            apk-badging.txt

          grep -Fq \
            "targetSdkVersion:'36'" \
            apk-badging.txt

          echo "APK PACKAGE ID: PASS"
          echo "APK TARGET SDK 36: PASS"


      # ============================================================
      # 41. VERIFY APK SIGNATURE
      # ============================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          APKSIGNER="${SDK}/build-tools/${BUILD_TOOLS}/apksigner"

          test -x "${APKSIGNER}"

          "${APKSIGNER}" \
            verify \
            --verbose \
            "${APK_PATH}"

          echo "APK SIGNATURE: PASS"


      # ============================================================
      # 42. PRINT SIGNER
      # ============================================================

      - name: Print APK signer certificate
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          "${SDK}/build-tools/${BUILD_TOOLS}/apksigner" \
            verify \
            --print-certs \
            "${APK_PATH}"


      # ============================================================
      # 43. SHA256
      # ============================================================

      - name: Generate APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd "${GITHUB_WORKSPACE}"

          sha256sum \
            "${APK_NAME}" \
            | tee \
              "${APK_NAME}.sha256"


      # ============================================================
      # 44. FINAL APK ONLY AUDIT
      # ============================================================

      - name: Final APK-only audit
        shell: bash
        run: |
          set -euo pipefail

          cd "${GITHUB_WORKSPACE}"

          test -s \
            "${APK_NAME}"

          test -s \
            "${APK_NAME}.sha256"

          if find "${GITHUB_WORKSPACE}" \
            -type f \
            -name "*.aab" \
            -print \
            | grep -q .
          then
            echo "::error::AAB detected."
            exit 1
          fi

          if find "${GITHUB_WORKSPACE}" \
            -type f \
            -iname "*debug*.apk" \
            -print \
            | grep -q .
          then
            echo "::error::Debug APK detected."
            exit 1
          fi

          SIZE_BYTES="$(
            stat -c%s \
              "${APK_NAME}"
          )"

          if [ "${SIZE_BYTES}" -le 1000000 ]; then
            echo "::error::APK unexpectedly small."
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "FINAL APK AUDIT PASSED"
          echo "=============================================="

          echo "APK ONLY    : YES"
          echo "AAB         : NO"
          echo "DEBUG APK   : NO"
          echo "SIGNED      : YES"
          echo "API         : ${ANDROID_API}"
          echo "MIN SDK     : ${MIN_SDK}"
          echo "TARGET SDK  : ${TARGET_SDK}"
          echo "PACKAGE     : ${APP_ID}"
          echo "APK         : ${APK_NAME}"
          echo "SIZE        : ${SIZE_BYTES}"

          echo ""
          echo "APK SHA256:"
          cat \
            "${APK_NAME}.sha256"

          echo ""
          echo "=============================================="


      # ============================================================
      # 45. UPLOAD FINAL APK + SHA256 ONLY
      # ============================================================

      - name: Upload final APK and SHA256
        uses: actions/upload-artifact@v4
        with:
          name: RKMS_ANDROID16_API36_SIGNED_RELEASE_APK

          if-no-files-found: error

          path: |
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256

          retention-days: 30

name: RKMS CONNECT Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. PREPARE CLEAN V17.1 SOURCE
      # ============================================================
      - name: Prepare RKMS source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build
          mkdir -p build

          SOURCE_ZIP="RKMS_CONNECT_V17_1_MEMBER_PDA_DIRECTORY_FINAL_DEEP_AUDITED_CLEAN.zip"

          echo "Checking source ZIP..."
          test -f "$SOURCE_ZIP"

          echo "Extracting RKMS source..."
          unzip -q "$SOURCE_ZIP" -d build

          echo "Using source ZIP: $SOURCE_ZIP"


          # ==========================================================
          # CLEAN SOURCE ZIP CHECK
          # ==========================================================
          if unzip -l "$SOURCE_ZIP" | grep -E '(^|[[:space:]])dist/'; then
            echo "ERROR: Clean V17.1 source ZIP contains dist/"
            echo "Generated dist/ must not be inside the source ZIP."
            exit 1
          fi

          echo "Clean source ZIP (no dist/) verified"


          # ==========================================================
          # FIND WORKFLOW AUTOMATICALLY
          #
          # Do NOT assume the workflow filename.
          # Find the repository's YAML workflow automatically.
          # ==========================================================
          WORKFLOW_DIR="$GITHUB_WORKSPACE/.github/workflows"

          test -d "$WORKFLOW_DIR"

          WORKFLOW_PATH=""

          while IFS= read -r candidate; do
            if grep -q '^name: RKMS CONNECT Android APK' "$candidate"; then
              WORKFLOW_PATH="$candidate"
              break
            fi
          done < <(
            find "$WORKFLOW_DIR" \
              -maxdepth 1 \
              -type f \
              \( -name '*.yml' -o -name '*.yaml' \) \
              -print | sort
          )

          if [ -z "$WORKFLOW_PATH" ]; then
            echo "ERROR: RKMS Android workflow YAML was not found."
            echo "Available workflow files:"
            find "$WORKFLOW_DIR" \
              -maxdepth 1 \
              -type f \
              \( -name '*.yml' -o -name '*.yaml' \) \
              -print || true
            exit 1
          fi

          echo "Detected workflow:"
          echo "$WORKFLOW_PATH"


          # ==========================================================
          # COPY WORKFLOW FOR EXISTING STATIC AUDIT SCRIPTS
          # ==========================================================
          mkdir -p build/.github/workflows

          cp \
            "$WORKFLOW_PATH" \
            build/.github/workflows/android-apk.yml

          test -s build/.github/workflows/android-apk.yml

          echo "Workflow copied for static verification"


          # ==========================================================
          # REQUIRED RKMS SOURCE FILES
          # ==========================================================
          test -f build/app.js
          test -f build/index.html
          test -f build/config.js
          test -f build/styles.css
          test -f build/manifest.webmanifest

          test -f build/assets/rkms-logo-transparent.png
          test -s build/assets/rkms-logo-transparent.png

          test -d build/assets/book

          echo "RKMS source structure verified"


          # ==========================================================
          # LOGO VERIFICATION
          #
          # No old hard-coded SHA is used.
          # ==========================================================
          LOGO_SHA=$(
            sha256sum build/assets/rkms-logo-transparent.png |
            cut -d' ' -f1
          )

          test -n "$LOGO_SHA"
          test -s build/assets/rkms-logo-transparent.png

          echo "RKMS logo verified"
          echo "Logo SHA256: $LOGO_SHA"

          file build/assets/rkms-logo-transparent.png


      # ============================================================
      # 3. JAVASCRIPT SYNTAX
      # ============================================================
      - name: Verify JavaScript
        shell: bash
        run: |
          set -euo pipefail

          node --check build/app.js

          echo "app.js syntax verified"


      # ============================================================
      # 4. V1D FIXES 1 TO 8
      # ============================================================
      - name: Verify V1D fixes 1 to 8
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          FILE="app.js"

          grep -q "memberAreaLabel" "$FILE"
          grep -q "downloadPdf" "$FILE"
          grep -q "pdfBlobFromCanvas" "$FILE"
          grep -q "printPage" "$FILE"
          grep -q "renderMemberProfile" "$FILE"
          grep -q "member-profile" "$FILE"

          grep -q "nationalName" "$FILE"
          grep -q "nationalPost" "$FILE"

          grep -q "data-download-pdf" "$FILE"
          grep -q "rkmsSaveLoginCredentials" "$FILE"

          test -s assets/rkms-logo-transparent.png

          grep -q 'mode:"cors"' "$FILE"
          grep -q 'readAsDataURL' "$FILE"
          grep -q 'img.crossOrigin="anonymous"' "$FILE"
          grep -q 'fillFromOfficer' "$FILE"
          grep -q 'history.replaceState({rkmsRoute:"home"' "$FILE"
          grep -q 's.disabled=false' "$FILE"

          grep -q 'rkmsRegisterFcmPush' "$FILE"
          grep -q 'rkms_notifications_v2' "$FILE"
          grep -q "action:'register_token'" "$FILE"
          grep -q 'rkms-fcm-push' "$FILE"

          echo "RKMS fixes + FCM client source verification PASS"


      # ============================================================
      # 5. FCM PIPELINE
      # ============================================================
      - name: Verify FCM notification pipeline
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          test -f scripts/verify-fcm-pipeline.py

          python3 scripts/verify-fcm-pipeline.py

          echo "FCM notification pipeline PASS"


      # ============================================================
      # 6. PDF PIPELINE
      # ============================================================
      - name: Verify PDF pipeline
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          test -f scripts/verify-pdf-pipeline.py

          python3 scripts/verify-pdf-pipeline.py

          echo "PDF pipeline PASS"


      # ============================================================
      # 7. REPORT DOWNLOAD SECURITY
      # ============================================================
      - name: Verify report download security
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          test -f scripts/verify-report-download-scope.py

          python3 scripts/verify-report-download-scope.py

          echo "Report download security PASS"


      # ============================================================
      # 8. RKMS FINAL STATIC AUDIT
      # ============================================================
      - name: Verify RKMS final static checks
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          test -f scripts/verify-rkms-final.py

          python3 scripts/verify-rkms-final.py

          echo "RKMS final static verification PASS"


      # ============================================================
      # 9. PDA AUTHORITY
      # ============================================================
      - name: Verify PDA authority hierarchy
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          test -f scripts/verify-authority-hierarchy.py

          python3 scripts/verify-authority-hierarchy.py

          echo "PDA authority hierarchy PASS"


      # ============================================================
      # 10. V17.1 MEMBER + OFFICER DIRECTORY
      # ============================================================
      - name: Verify V17.1 Member and Officer Directory
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          test -f scripts/verify-directory-lists.py
          test -f scripts/verify-v17-directory-deep.py

          python3 scripts/verify-directory-lists.py
          python3 scripts/verify-v17-directory-deep.py

          echo "V17.1 Member/PDA Directory verification PASS"


      # ============================================================
      # 11. SAVED LOGIN
      # ============================================================
      - name: Verify Saved Login implementation
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          test -f scripts/verify-saved-login.py

          python3 scripts/verify-saved-login.py

          echo "Saved Login verification PASS"


      # ============================================================
      # 12. CREATE CAPACITOR PACKAGE
      # ============================================================
      - name: Create Capacitor build package
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          cat > package.json <<'JSON'
          {
            "name": "rkms",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "rm -rf dist && mkdir -p dist && cp index.html app.js config.js styles.css manifest.webmanifest dist/ && cp -r assets dist/assets"
            },
            "dependencies": {
              "@capacitor/core": "6.2.2",
              "@capacitor/android": "6.2.2",
              "@capacitor/app": "6.0.3",
              "@capacitor/push-notifications": "6.0.3"
            },
            "devDependencies": {
              "@capacitor/cli": "6.2.2"
            }
          }
          JSON

          grep -q '@capacitor/push-notifications' package.json

          echo "Capacitor FCM dependency verified"


          cat > capacitor.config.json <<'JSON'
          {
            "appId": "org.rkms.connect",
            "appName": "RKMS",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https",
              "cleartext": true
            },
            "android": {
              "allowMixedContent": true,
              "captureInput": true,
              "webContentsDebuggingEnabled": false
            }
          }
          JSON

          echo "Capacitor configuration created"


      # ============================================================
      # 13. NODE 22
      # ============================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ============================================================
      # 14. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install Capacitor dependencies
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          npm install --no-audit --no-fund

          echo "Node dependencies installed"


      # ============================================================
      # 15. BUILD WEB APPLICATION
      # ============================================================
      - name: Build RKMS web application
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          npm run build

          test -d dist

          echo "Web application build PASS"


      # ============================================================
      # 16. VERIFY GENERATED DIST
      # ============================================================
      - name: Verify generated web build
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          test -d dist

          test -f dist/index.html
          test -f dist/app.js
          test -f dist/config.js
          test -f dist/styles.css
          test -f dist/manifest.webmanifest

          test -d dist/assets
          test -d dist/assets/book

          echo "Generated dist/ verified"

          du -sh dist


      # ============================================================
      # 17. VERIFY NATIVE BRIDGE SOURCE
      # ============================================================
      - name: Verify native bridge source
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          test -f scripts/setup-android-native.sh
          test -f scripts/verify-native-bridge.py

          bash -n scripts/setup-android-native.sh

          python3 scripts/verify-native-bridge.py

          echo "Native bridge source PASS"


      # ============================================================
      # 18. JAVA 21
      # ============================================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      # ============================================================
      # 19. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 20. CREATE ANDROID PLATFORM
      # ============================================================
      - name: Create Android platform
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          npx cap add android

          test -d android

          echo "Android platform created"


      # ============================================================
      # 21. ADD RKMS NATIVE BRIDGE
      # ============================================================
      - name: Add RKMS secure credential native bridge
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          bash scripts/setup-android-native.sh

          echo "RKMS native bridge installed"


      # ============================================================
      # 22. FIREBASE / FCM
      # ============================================================
      - name: Configure Firebase Android client for FCM
        working-directory: build
        shell: bash
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail

          if [ -n "$FIREBASE_GOOGLE_SERVICES_JSON" ]; then

            printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" \
              > android/app/google-services.json

            echo "Firebase config loaded from GitHub Secret"

          elif [ -f google-services.json ]; then

            cp google-services.json \
              android/app/google-services.json

            echo "Firebase config loaded from bundled google-services.json"

          else

            echo "ERROR: Firebase Android configuration is missing."
            exit 1

          fi


          test -s android/app/google-services.json


          python3 - <<'PY2'
          import json
          from pathlib import Path

          p = Path("android/app/google-services.json")

          d = json.loads(
              p.read_text(encoding="utf-8")
          )

          assert d.get("project_info", {}).get("project_number"), \
              "google-services.json project_number missing"

          assert d.get("project_info", {}).get("project_id"), \
              "google-services.json project_id missing"

          assert d.get("client"), \
              "google-services.json client section missing"

          print("Firebase Android client config verified")
          PY2


          python3 - <<'PY2'
          from pathlib import Path

          root = Path("android/build.gradle")
          app = Path("android/app/build.gradle")

          r = root.read_text(encoding="utf-8")

          if "com.google.gms:google-services" not in r:

              marker = "dependencies {"

              if marker not in r:
                  raise SystemExit(
                      "android/build.gradle dependencies block not found"
                  )

              r = r.replace(
                  marker,
                  marker +
                  "\n        classpath 'com.google.gms:google-services:4.4.2'",
                  1
              )

              root.write_text(r, encoding="utf-8")


          a = app.read_text(encoding="utf-8")

          if "com.google.gms.google-services" not in a:

              a += "\napply plugin: 'com.google.gms.google-services'\n"

              app.write_text(a, encoding="utf-8")


          print("Google Services Gradle plugin configured")
          PY2


      # ============================================================
      # 23. CAPACITOR SYNC
      # ============================================================
      - name: Sync RKMS application
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          npx cap sync android

          echo "Capacitor Android sync PASS"


      # ============================================================
      # 24. ANDROID PDF BRIDGE
      # ============================================================
      - name: Verify generated Android PDF bridge
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          test -f scripts/verify-android-pdf.py

          python3 scripts/verify-android-pdf.py

          echo "Android PDF bridge PASS"


      # ============================================================
      # 25. BIOMETRIC DEPENDENCY
      # ============================================================
      - name: Add Android biometric dependency
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="android/app/build.gradle"

          if ! grep -q 'androidx.biometric:biometric' "$APP_GRADLE"; then

            sed -i \
              '/dependencies {/a\    implementation "androidx.biometric:biometric:1.1.0"' \
              "$APP_GRADLE"

          fi

          grep -q \
            'androidx.biometric:biometric:1.1.0' \
            "$APP_GRADLE"

          echo "Android biometric dependency verified"


      # ============================================================
      # 26. GENERATED ANDROID NATIVE / PDF / LOGIN VERIFICATION
      #
      # Python is used for file discovery and verification to avoid
      # Bash quote/EOF parsing problems.
      # ============================================================
      - name: Verify generated Android native bridge and PDF implementation
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import sys

          root = Path("android/app/src/main")

          if not root.exists():
              print("ERROR: Android source directory not found")
              sys.exit(1)


          def find_file(name):
              matches = list(root.rglob(name))

              if not matches:
                  print(f"ERROR: {name} not found")
                  sys.exit(1)

              return matches[0]


          main_activity = find_file("MainActivity.java")
          native_bridge = find_file("RKMSNativeBridge.java")
          secure_plugin = find_file(
              "RKMSSecureCredentialsPlugin.java"
          )


          print(f"MainActivity: {main_activity}")
          print(f"RKMSNativeBridge: {native_bridge}")
          print(f"Secure plugin: {secure_plugin}")


          main_text = main_activity.read_text(
              encoding="utf-8",
              errors="replace"
          )

          native_text = native_bridge.read_text(
              encoding="utf-8",
              errors="replace"
          )

          secure_text = secure_plugin.read_text(
              encoding="utf-8",
              errors="replace"
          )


          # PDF lifecycle
          required_native = [
              "beginPdfSave",
              "appendPdfChunk",
              "finishPdfSave",
              "cancelPdfSave",
              "MediaStore.Downloads.EXTERNAL_CONTENT_URI",
              "Environment.DIRECTORY_DOWNLOADS",
              "application/pdf",
              "RKMS CONNECT",
          ]

          for item in required_native:
              if item not in native_text:
                  print(
                      f"ERROR: Missing PDF/native item: {item}"
                  )
                  sys.exit(1)


          # MainActivity bridge registration
          required_main = [
              "RKMSNativeBridge",
              "getBridge().getWebView()",
              "RKMSSecureCredentialsPlugin",
          ]

          for item in required_main:
              if item not in main_text:
                  print(
                      f"ERROR: Missing MainActivity item: {item}"
                  )
                  sys.exit(1)


          # Secure credentials / biometric
          required_secure = [
              "AndroidKeyStore",
              "AES/GCM/NoPadding",
              "BiometricPrompt",
          ]

          for item in required_secure:
              if item not in secure_text:
                  print(
                      f"ERROR: Missing secure/biometric item: {item}"
                  )
                  sys.exit(1)


          print(
              "Generated Android native/PDF verification PASS"
          )
          PY


      # ============================================================
      # 27. IMAGE TOOLS
      # ============================================================
      - name: Install image tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y -qq imagemagick

          echo "ImageMagick installed"


      # ============================================================
      # 28. RKMS LAUNCHER LOGO
      # ============================================================
      - name: Install exact RKMS launcher logo AFTER Capacitor sync
        shell: bash
        run: |
          set -euo pipefail

          LOGO="build/assets/rkms-logo-transparent.png"

          RES="build/android/app/src/main/res"

          STRINGS="build/android/app/src/main/res/values/strings.xml"


          test -s "$LOGO"


          mkdir -p \
            "$RES/mipmap-mdpi" \
            "$RES/mipmap-hdpi" \
            "$RES/mipmap-xhdpi" \
            "$RES/mipmap-xxhdpi" \
            "$RES/mipmap-xxxhdpi"


          convert "$LOGO" \
            -resize 40x40 \
            -strip \
            -gravity center \
            -background none \
            -extent 48x48 \
            "$RES/mipmap-mdpi/ic_launcher.png"


          convert "$LOGO" \
            -resize 60x60 \
            -strip \
            -gravity center \
            -background none \
            -extent 72x72 \
            "$RES/mipmap-hdpi/ic_launcher.png"


          convert "$LOGO" \
            -resize 80x80 \
            -strip \
            -gravity center \
            -background none \
            -extent 96x96 \
            "$RES/mipmap-xhdpi/ic_launcher.png"


          convert "$LOGO" \
            -resize 120x120 \
            -strip \
            -gravity center \
            -background none \
            -extent 144x144 \
            "$RES/mipmap-xxhdpi/ic_launcher.png"


          convert "$LOGO" \
            -resize 172x172 \
            -strip \
            -gravity center \
            -background none \
            -extent 192x192 \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"


          cp \
            "$RES/mipmap-mdpi/ic_launcher.png" \
            "$RES/mipmap-mdpi/ic_launcher_round.png"

          cp \
            "$RES/mipmap-hdpi/ic_launcher.png" \
            "$RES/mipmap-hdpi/ic_launcher_round.png"

          cp \
            "$RES/mipmap-xhdpi/ic_launcher.png" \
            "$RES/mipmap-xhdpi/ic_launcher_round.png"

          cp \
            "$RES/mipmap-xxhdpi/ic_launcher.png" \
            "$RES/mipmap-xxhdpi/ic_launcher_round.png"

          cp \
            "$RES/mipmap-xxxhdpi/ic_launcher.png" \
            "$RES/mipmap-xxxhdpi/ic_launcher_round.png"


          rm -rf \
            "$RES/mipmap-anydpi-v26" \
            "$RES/mipmap-anydpi"


          find "$RES" \
            -type f \
            \( \
              -name 'ic_launcher_foreground.xml' -o \
              -name 'ic_launcher_background.xml' -o \
              -name 'ic_launcher_foreground.png' -o \
              -name 'ic_launcher_background.png' \
            \) \
            -delete || true


          if grep -q '<string name="app_name">' "$STRINGS"; then

            sed -i \
              's#<string name="app_name">.*</string>#<string name="app_name">RKMS</string>#' \
              "$STRINGS"

          else

            printf '\n    <string name="app_name">RKMS</string>\n' \
              >> "$STRINGS"

          fi


          echo "Final launcher icon:"

          identify \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"


          echo "Final app name:"

          grep -n 'app_name' "$STRINGS"


      # ============================================================
      # 29. GRADLE EXECUTABLE
      # ============================================================
      - name: Make Gradle executable
        shell: bash
        run: |
          set -euo pipefail

          chmod +x build/android/gradlew

          test -x build/android/gradlew

          echo "Gradle executable verified"


      # ============================================================
      # 30. BUILD DEBUG APK
      # ============================================================
      - name: Build Debug APK
        working-directory: build/android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 31. VERIFY APK
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="build/android/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "RKMS APK successfully created:"

          ls -lh "$APK"


      # ============================================================
      # 32. UPLOAD APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-debug-apk
          path: build/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

name: RKMS Final Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  APP_ID: "org.rkms.connect"
  SOURCE_ZIP: "RKMS_CONNECT_FINAL_AUDITED_RELEASE_APK_BUILD_20260922.zip"

jobs:
  build:
    name: RKMS Final Signed Release APK
    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # NODE
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false


      # ============================================================
      # JAVA
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # ============================================================
      # HOST PACKAGES
      # ============================================================

      - name: Install required host packages
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            rsync

          echo "HOST PACKAGES: PASS"


      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      - name: Install Android API 36 SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          test -d \
            "$ANDROID_HOME/platforms/android-${ANDROID_API}"

          test -d \
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}"

          test -x \
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt"

          test -x \
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

          echo "ANDROID API 36: PASS"
          echo "BUILD TOOLS 36.0.0: PASS"


      # ============================================================
      # LOCATE SOURCE
      # ============================================================

      - name: Locate RKMS source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_PATH="$GITHUB_WORKSPACE/$SOURCE_ZIP"

          if [ ! -s "$SOURCE_PATH" ]; then
            echo "::error::Source ZIP not found:"
            echo "$SOURCE_PATH"

            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -name "*.zip" \
              -print || true

            exit 1
          fi

          echo "SOURCE ZIP:"
          echo "$SOURCE_PATH"

          SOURCE_SHA256="$(
            sha256sum "$SOURCE_PATH" | awk '{print $1}'
          )"

          echo "SOURCE SHA256:"
          echo "$SOURCE_SHA256"

          echo "RKMS_SOURCE_ZIP=$SOURCE_PATH" >> "$GITHUB_ENV"
          echo "RKMS_SOURCE_SHA256=$SOURCE_SHA256"


      # ============================================================
      # EXTRACT SOURCE
      # ============================================================

      - name: Extract RKMS source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            "$GITHUB_WORKSPACE/rkms-source"

          mkdir -p \
            "$GITHUB_WORKSPACE/rkms-source"

          unzip -q \
            "$RKMS_SOURCE_ZIP" \
            -d "$GITHUB_WORKSPACE/rkms-source"

          PACKAGE_FILE="$(
            find "$GITHUB_WORKSPACE/rkms-source" \
              -type f \
              -name "package.json" \
              -not -path "*/node_modules/*" \
              -print \
              -quit
          )"

          if [ -z "$PACKAGE_FILE" ]; then
            echo "::error::package.json not found."
            exit 1
          fi

          RKMS_ROOT="$(dirname "$PACKAGE_FILE")"
          RKMS_ROOT="$(cd "$RKMS_ROOT" && pwd)"

          echo "RKMS_ROOT=$RKMS_ROOT" >> "$GITHUB_ENV"

          echo "RKMS ROOT:"
          echo "$RKMS_ROOT"


      # ============================================================
      # REPAIR MALFORMED NATIVE SCRIPT
      # ============================================================

      - name: Repair RKMS native setup script
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          SCRIPT="scripts/setup-android-native.sh"

          test -s "$SCRIPT"

          cp \
            "$SCRIPT" \
            "$SCRIPT.before-repair"

          python3 - "$SCRIPT" <<'PY'
          import sys
          import subprocess
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          marker = "# Stable white notification icon for FCM system notifications."

          if marker not in text:

              result = subprocess.run(
                  ["bash", "-n", str(path)],
                  capture_output=True,
                  text=True
              )

              if result.returncode == 0:
                  print("Native setup script is already valid.")
                  raise SystemExit(0)

              raise SystemExit(
                  "Native setup script is malformed and repair marker was not found."
              )

          marker_pos = text.index(marker)

          start = text.rfind(
              "python3 - <<'PY3'",
              0,
              marker_pos
          )

          if start < 0:
              raise SystemExit(
                  "Malformed native script start marker not found."
              )

          end_marker = "\nPY3"

          end = text.find(
              end_marker,
              marker_pos
          )

          if end < 0:
              raise SystemExit(
                  "Malformed native script end marker not found."
              )

          end += len(end_marker)

          replacement = r'''# Stable white notification icon for FCM system notifications.

          DRAWABLE_DIR="$RES_DIR/drawable"

          mkdir -p "$DRAWABLE_DIR"

          cat > "$DRAWABLE_DIR/ic_stat_rkms.xml" <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M12,2A7,7 0,0 0,5 9v4l-2,3v1h18v-1l-2,-3V9A7,7 0,0 0,12 2M9,19a3,3 0,0 0,6 0z"/>
          </vector>
          XML

          python3 - <<'PYMANIFEST'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")

          if not p.exists():
              raise SystemExit(
                  "AndroidManifest.xml not found"
              )

          s = p.read_text()

          if "android.permission.RECORD_AUDIO" not in s:
              pos = s.find("<application")

              if pos < 0:
                  raise SystemExit(
                      "AndroidManifest application tag missing"
                  )

              s = (
                  s[:pos]
                  + '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
                  + s[pos:]
              )

          if "android.permission.POST_NOTIFICATIONS" not in s:
              pos = s.find("<application")

              if pos < 0:
                  raise SystemExit(
                      "AndroidManifest application tag missing"
                  )

              s = (
                  s[:pos]
                  + '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
                  + s[pos:]
              )

          closing = "</application>"

          if closing not in s:
              raise SystemExit(
                  "AndroidManifest application closing tag missing"
              )

          channel_meta = (
              '    <meta-data '
              'android:name="com.google.firebase.messaging.default_notification_channel_id" '
              'android:value="@string/rkms_default_notification_channel_id" />\n'
          )

          icon_meta = (
              '    <meta-data '
              'android:name="com.google.firebase.messaging.default_notification_icon" '
              'android:resource="@drawable/ic_stat_rkms" />\n'
          )

          if (
              "com.google.firebase.messaging.default_notification_channel_id"
              not in s
          ):
              s = s.replace(
                  closing,
                  channel_meta + closing,
                  1
              )

          if (
              "com.google.firebase.messaging.default_notification_icon"
              not in s
          ):
              s = s.replace(
                  closing,
                  icon_meta + closing,
                  1
              )

          p.write_text(s)

          print("AndroidManifest notification configuration repaired.")
          PYMANIFEST
          '''

          text = (
              text[:start]
              + replacement
              + text[end:]
          )

          path.write_text(text)

          print("Malformed native setup block repaired successfully.")
          PY

          chmod +x \
            "$SCRIPT"

          bash -n \
            "$SCRIPT"

          echo "RKMS NATIVE SCRIPT REPAIR: PASS"


      # ============================================================
      # SOURCE STRUCTURE
      # ============================================================

      - name: Verify RKMS source structure
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          REQUIRED_FILES=(
            "package.json"
            "package-lock.json"
            "app.js"
            "index.html"
            "styles.css"
            "capacitor.config.json"
            "google-services.json"
            "scripts/setup-android-native.sh"
            "scripts/configure-android-16.sh"
            "scripts/configure-release-signing.sh"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -s "$FILE" ]; then
              echo "::error::Missing required file: $FILE"
              exit 1
            fi
          done

          node --check app.js

          python3 -m json.tool \
            capacitor.config.json \
            >/dev/null

          python3 -m json.tool \
            google-services.json \
            >/dev/null

          bash -n \
            scripts/setup-android-native.sh

          bash -n \
            scripts/configure-android-16.sh

          bash -n \
            scripts/configure-release-signing.sh

          echo "SOURCE STRUCTURE: PASS"


      # ============================================================
      # CAPACITOR VERSION
      # ============================================================

      - name: Verify Capacitor package versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node <<'NODE'
          const fs = require("fs");

          const p = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const d = Object.assign(
            {},
            p.dependencies || {},
            p.devDependencies || {}
          );

          const wanted = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          for (const [name, version] of Object.entries(wanted)) {
            if (d[name] !== version) {
              throw new Error(
                `${name}: expected ${version}, found ${d[name] || "MISSING"}`
              );
            }
          }

          if (
            !p.scripts ||
            typeof p.scripts.build !== "string" ||
            !p.scripts.build.trim()
          ) {
            throw new Error("Build script missing");
          }

          console.log("CAPACITOR VERSION CHECK: PASS");
          NODE


      # ============================================================
      # FIREBASE CONFIGURATION
      # ============================================================

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node <<'NODE'
          const fs = require("fs");

          const d = JSON.parse(
            fs.readFileSync("google-services.json", "utf8")
          );

          const ok = (d.client || []).some(
            c =>
              c.client_info &&
              c.client_info.android_client_info &&
              c.client_info.android_client_info.package_name ===
              "org.rkms.connect"
          );

          if (!ok) {
            throw new Error(
              "org.rkms.connect not found in google-services.json"
            );
          }

          console.log("FIREBASE CONFIGURATION: PASS");
          NODE


      # ============================================================
      # NOTIFICATION SOURCE
      # ============================================================

      - name: Verify notification source
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          test -s app.js

          grep -Fq \
            "@capacitor/push-notifications" \
            package.json

          grep -Eiq \
            "Push|PushNotifications|notification" \
            app.js

          node --check app.js

          echo "NOTIFICATION SOURCE: PASS"


      # ============================================================
      # NPM
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm ci \
            --no-audit \
            --no-fund

          echo "NPM INSTALL: PASS"


      # ============================================================
      # WEB BUILD
      # ============================================================

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm run build

          test -s \
            dist/index.html

          echo "WEB BUILD: PASS"


      # ============================================================
      # CAPACITOR ANDROID
      # ============================================================

      - name: Generate Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          rm -rf android

          npx cap add android

          test -s \
            android/gradlew

          test -s \
            android/app/build.gradle

          chmod +x \
            android/gradlew

          echo "CAPACITOR ANDROID PROJECT: PASS"


      # ============================================================
      # ANDROID 16 API 36
      # ============================================================

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/configure-android-16.sh

          ./scripts/configure-android-16.sh

          echo "ANDROID 16 API 36 CONFIGURATION: PASS"


      # ============================================================
      # CAPACITOR SYNC
      # ============================================================

      - name: Sync Capacitor
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npx cap sync android

          echo "CAPACITOR SYNC: PASS"


      # ============================================================
      # APPLY RKMS NATIVE SETUP
      # ============================================================

      - name: Apply RKMS native Android setup
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          SCRIPT="scripts/setup-android-native.sh"

          bash -n \
            "$SCRIPT"

          chmod +x \
            "$SCRIPT"

          ./"$SCRIPT"

          echo "RKMS NATIVE ANDROID SETUP: PASS"


      # ============================================================
      # REPAIR GENERATED MAIN ACTIVITY
      # ============================================================

      - name: Repair generated MainActivity
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          MAIN_ACTIVITY="$(
            find android/app/src/main \
              -type f \
              -name "MainActivity.java" \
              -print \
              -quit
          )"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "::error::MainActivity.java not found."
            exit 1
          fi

          test -s \
            "$MAIN_ACTIVITY"

          MAIN_ACTIVITY_ENV="$MAIN_ACTIVITY" python3 <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["MAIN_ACTIVITY_ENV"])
          text = path.read_text()

          class_marker = (
              "public class MainActivity extends BridgeActivity {"
          )

          if class_marker not in text:
              raise SystemExit(
                  "MainActivity class marker not found"
              )

          # ========================================================
          # FIREBASE INITIALIZATION
          # ========================================================

          if "FirebaseApp.initializeApp(this)" not in text:

              oncreate_marker = (
                  "public void onCreate(android.os.Bundle savedInstanceState)"
              )

              if oncreate_marker in text:

                  brace = text.find(
                      "{",
                      text.find(oncreate_marker)
                  )

                  if brace < 0:
                      raise SystemExit(
                          "onCreate opening brace not found"
                      )

                  text = (
                      text[:brace + 1]
                      + "\n"
                      + "        com.google.firebase.FirebaseApp.initializeApp(this);"
                      + "\n"
                      + text[brace + 1:]
                  )

              else:

                  replacement = (
                      class_marker
                      + "\n"
                      + "    @Override\n"
                      + "    public void onCreate(android.os.Bundle savedInstanceState) {\n"
                      + "        com.google.firebase.FirebaseApp.initializeApp(this);\n"
                      + "        super.onCreate(savedInstanceState);\n"
                      + "    }\n"
                  )

                  text = text.replace(
                      class_marker,
                      replacement,
                      1
                  )

          # ========================================================
          # RKMS NATIVE BRIDGE
          # ========================================================

          if "RKMSNativeBridge(this, rkmsWebView)" not in text:

              oncreate_marker = (
                  "public void onCreate(android.os.Bundle savedInstanceState)"
              )

              if oncreate_marker not in text:
                  raise SystemExit(
                      "Cannot install RKMSNativeBridge: onCreate missing"
                  )

              oncreate_pos = text.find(oncreate_marker)

              brace = text.find(
                  "{",
                  oncreate_pos
              )

              if brace < 0:
                  raise SystemExit(
                      "onCreate opening brace not found"
                  )

              bridge_code = r'''
                  getWindow().setSoftInputMode(
                      android.view.WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE
                  );

                  android.webkit.WebView rkmsWebView =
                      getBridge().getWebView();

                  rkmsWebView.setImportantForAutofill(
                      android.view.View.IMPORTANT_FOR_AUTOFILL_YES
                  );

                  rkmsWebView.setSaveEnabled(true);

                  rkmsWebView.getSettings()
                      .setMediaPlaybackRequiresUserGesture(false);

                  rkmsWebView.addJavascriptInterface(
                      new RKMSNativeBridge(this, rkmsWebView),
                      "RKMSNative"
                  );

                  if (rkmsInstallWebAudioPermissionBridge != null) {
                      rkmsInstallWebAudioPermissionBridge(rkmsWebView);
                  }

                  if (createRkmsNotificationChannel != null) {
                      createRkmsNotificationChannel();
                  }
          '''

              # Do not use invalid Java references to methods as variables.
              bridge_code = r'''
                  getWindow().setSoftInputMode(
                      android.view.WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE
                  );

                  android.webkit.WebView rkmsWebView =
                      getBridge().getWebView();

                  rkmsWebView.setImportantForAutofill(
                      android.view.View.IMPORTANT_FOR_AUTOFILL_YES
                  );

                  rkmsWebView.setSaveEnabled(true);

                  rkmsWebView.getSettings()
                      .setMediaPlaybackRequiresUserGesture(false);

                  rkmsWebView.addJavascriptInterface(
                      new RKMSNativeBridge(this, rkmsWebView),
                      "RKMSNative"
                  );

                  rkmsInstallWebAudioPermissionBridge(rkmsWebView);

                  createRkmsNotificationChannel();
          '''

              text = (
                  text[:brace + 1]
                  + bridge_code
                  + text[brace + 1:]
              )

          # ========================================================
          # NOTIFICATION ROUTE SUPPORT
          # ========================================================

          route_methods = r'''
              private volatile String rkmsPendingNotificationRoute = "";

              private String rkmsExtractNotificationRoute(
                  android.content.Intent intent
              ) {
                  if (
                      intent == null ||
                      intent.getExtras() == null
                  ) {
                      return "";
                  }

                  android.os.Bundle b = intent.getExtras();

                  String route = b.getString("route", "");
                  String type = b.getString("type", "");
                  String cid = b.getString("conversation_id", "");

                  if (
                      (route == null || route.trim().isEmpty()) &&
                      "rkms_chat".equalsIgnoreCase(type) &&
                      cid != null &&
                      !cid.trim().isEmpty()
                  ) {
                      route = "chat/" + cid.trim();
                  }

                  if (route == null) {
                      route = "";
                  }

                  return route
                      .trim()
                      .replaceFirst("^#?[/]", "");
              }

              private void rkmsCaptureNotificationIntent(
                  android.content.Intent intent
              ) {
                  String route =
                      rkmsExtractNotificationRoute(intent);

                  if (route.isEmpty()) {
                      return;
                  }

                  rkmsPendingNotificationRoute = route;

                  rkmsDispatchNotificationRoute();
              }

              private void rkmsDispatchNotificationRoute() {
                  final String route =
                      rkmsPendingNotificationRoute;

                  if (
                      route == null ||
                      route.isEmpty()
                  ) {
                      return;
                  }

                  android.webkit.WebView w =
                      getBridge() == null
                          ? null
                          : getBridge().getWebView();

                  if (w == null) {
                      new android.os.Handler(
                          android.os.Looper.getMainLooper()
                      ).postDelayed(
                          this::rkmsDispatchNotificationRoute,
                          300
                      );
                      return;
                  }

                  String js =
                      "window.rkmsOpenNotificationRoute && " +
                      "window.rkmsOpenNotificationRoute(" +
                      org.json.JSONObject.quote(route) +
                      ");";

                  w.post(
                      () -> w.evaluateJavascript(
                          js,
                          value ->
                              rkmsPendingNotificationRoute = ""
                      )
                  );
              }

              @Override
              protected void onNewIntent(
                  android.content.Intent intent
              ) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  rkmsCaptureNotificationIntent(intent);
              }
          '''

          if "rkmsCaptureNotificationIntent" not in text:

              # Insert route methods before the final class brace.
              last_brace = text.rfind("}")

              if last_brace < 0:
                  raise SystemExit(
                      "MainActivity closing brace not found"
                  )

              text = (
                  text[:last_brace]
                  + route_methods
                  + "\n"
                  + text[last_brace:]
              )

          # ========================================================
          # INITIAL NOTIFICATION INTENT
          # ========================================================

          if (
              "rkmsCaptureNotificationIntent(getIntent())"
              not in text
          ):

              oncreate_marker = (
                  "public void onCreate(android.os.Bundle savedInstanceState)"
              )

              oncreate_pos = text.find(oncreate_marker)

              if oncreate_pos >= 0:

                  brace = text.find(
                      "{",
                      oncreate_pos
                  )

                  close = text.find(
                      "}",
                      brace
                  )

                  if brace >= 0 and close >= 0:

                      insertion = (
                          "\n"
                          "        rkmsCaptureNotificationIntent(getIntent());\n"
                          "        new android.os.Handler(android.os.Looper.getMainLooper())"
                          ".postDelayed(this::rkmsDispatchNotificationRoute, 700);\n"
                      )

                      text = (
                          text[:close]
                          + insertion
                          + text[close:]
                      )

          path.write_text(text)

          print("MainActivity repair completed.")
          PY

          echo "MAIN ACTIVITY REPAIR: PASS"


      # ============================================================
      # VERIFY GENERATED MAIN ACTIVITY
      # ============================================================

      - name: Verify generated MainActivity
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          MAIN_ACTIVITY="$(
            find android/app/src/main \
              -type f \
              -name "MainActivity.java" \
              -print \
              -quit
          )"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "::error::MainActivity.java not found."
            exit 1
          fi

          test -s \
            "$MAIN_ACTIVITY"

          grep -Fq \
            "RKMSNativeBridge" \
            "$MAIN_ACTIVITY"

          grep -Fq \
            "FirebaseApp.initializeApp(this)" \
            "$MAIN_ACTIVITY"

          grep -Fq \
            "rkmsCaptureNotificationIntent" \
            "$MAIN_ACTIVITY"

          grep -Fq \
            "onNewIntent" \
            "$MAIN_ACTIVITY"

          grep -Fq \
            "rkmsOpenNotificationRoute" \
            "$MAIN_ACTIVITY"

          echo "RKMSNativeBridge: PASS"
          echo "Firebase initialization: PASS"
          echo "Notification route capture: PASS"
          echo "onNewIntent: PASS"
          echo "MAINACTIVITY: PASS"


      # ============================================================
      # VERIFY MAIN ACTIVITY JAVA SYNTAX STRUCTURE
      # ============================================================

      - name: Verify MainActivity native source
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          MAIN_ACTIVITY="$(
            find android/app/src/main \
              -type f \
              -name "MainActivity.java" \
              -print \
              -quit
          )"

          test -s \
            "$MAIN_ACTIVITY"

          grep -Fq \
            "public class MainActivity extends BridgeActivity" \
            "$MAIN_ACTIVITY"

          grep -Fq \
            "super.onCreate(savedInstanceState)" \
            "$MAIN_ACTIVITY"

          grep -Fq \
            "setIntent(intent)" \
            "$MAIN_ACTIVITY"

          echo "MAINACTIVITY SOURCE AUDIT: PASS"


      # ============================================================
      # FIREBASE MESSAGING
      # ============================================================

      - name: Verify Firebase Messaging SDK
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          test -s \
            android/app/google-services.json

          grep -Fq \
            "org.rkms.connect" \
            android/app/google-services.json

          echo "FIREBASE MESSAGING CONFIGURATION: PASS"


      # ============================================================
      # NOTIFICATION CHANNELS
      # ============================================================

      - name: Verify notification priority channels
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          grep -Fq \
            "rkms_notifications_v2" \
            scripts/setup-android-native.sh

          grep -Fq \
            "rkms_priority_v1" \
            scripts/setup-android-native.sh

          if grep -Fq \
            "deleteNotificationChannel" \
            scripts/setup-android-native.sh
          then
            echo "::error::Notification channel deletion detected."
            exit 1
          fi

          echo "Normal notification channel: PASS"
          echo "Priority notification channel: PASS"
          echo "No notification channel deletion: PASS"
          echo "NOTIFICATION CHANNEL AUDIT: PASS"


      # ============================================================
      # STATIC AUDITS
      # ============================================================

      - name: Run RKMS static audits
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node --check app.js

          bash -n \
            scripts/setup-android-native.sh

          bash -n \
            scripts/configure-android-16.sh

          bash -n \
            scripts/configure-release-signing.sh

          if [ -f scripts/verify-fcm-pipeline.py ]; then
            python3 scripts/verify-fcm-pipeline.py
          fi

          if [ -f scripts/verify-native-bridge.py ]; then
            python3 scripts/verify-native-bridge.py
          fi

          if [ -f scripts/verify-rkms-final.py ]; then
            python3 scripts/verify-rkms-final.py
          fi

          echo "RKMS STATIC AUDITS: PASS"


      # ============================================================
      # ANDROID 16 API 36 AUDIT
      # ============================================================

      - name: Final Android 16 API 36 audit
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          if ! grep -R \
            -E \
            "compileSdk(Version)?[[:space:]]*=?[[:space:]]*36" \
            . \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            >/dev/null
          then
            echo "::error::compileSdk 36 not found."
            exit 1
          fi

          if ! grep -R \
            -E \
            "targetSdk(Version)?[[:space:]]*=?[[:space:]]*36" \
            . \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            >/dev/null
          then
            echo "::error::targetSdk 36 not found."
            exit 1
          fi

          echo "COMPILE SDK 36: PASS"
          echo "TARGET SDK 36: PASS"
          echo "ANDROID 16 API 36 AUDIT: PASS"


      # ============================================================
      # SIGNING SECRETS
      # ============================================================

      - name: Verify release signing secrets
        shell: bash
        run: |
          set -euo pipefail

          test -n \
            "${RKMS_KEYSTORE_BASE64:-}"

          test -n \
            "${RKMS_KEYSTORE_PASSWORD:-}"

          test -n \
            "${RKMS_KEY_ALIAS:-}"

          test -n \
            "${RKMS_KEY_PASSWORD:-}"

          echo "RELEASE SIGNING SECRETS: PASS"


      # ============================================================
      # RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/configure-release-signing.sh

          ./scripts/configure-release-signing.sh

          test -s \
            android/app/release.keystore

          echo "RELEASE SIGNING CONFIGURATION: PASS"


      # ============================================================
      # KEYSTORE
      # ============================================================

      - name: Verify release keystore
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          keytool \
            -list \
            -keystore android/app/release.keystore \
            -storepass "$RKMS_KEYSTORE_PASSWORD" \
            -alias "$RKMS_KEY_ALIAS" \
            >/dev/null

          echo "RELEASE KEYSTORE: PASS"


      # ============================================================
      # GRADLE
      # ============================================================

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          chmod +x \
            gradlew

          ./gradlew \
            --version \
            --no-daemon

          echo "GRADLE WRAPPER: PASS"


      # ============================================================
      # CLEAN
      # ============================================================

      - name: Clean Android build
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          ./gradlew \
            clean \
            --no-daemon

          echo "ANDROID CLEAN: PASS"


      # ============================================================
      # FINAL RELEASE APK ONLY
      # ============================================================

      - name: Build final signed release APK only
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          rm -rf \
            app/build/outputs/apk/release

          rm -rf \
            app/build/outputs/bundle

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          EXPECTED_APK="$RKMS_ROOT/android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Signed release APK was not created."

            find "$RKMS_ROOT/android" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          FINAL_APK="$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"

          cp \
            "$EXPECTED_APK" \
            "$FINAL_APK"

          test -s \
            "$FINAL_APK"

          echo "APK_PATH=$FINAL_APK" >> "$GITHUB_ENV"

          echo "FINAL SIGNED RELEASE APK: CREATED"


      # ============================================================
      # NO DEBUG APK
      # ============================================================

      - name: Verify no debug APK
        shell: bash
        run: |
          set -euo pipefail

          DEBUG_APK="$(
            find "$RKMS_ROOT/android" \
              -type f \
              -iname "*debug*.apk" \
              -print \
              -quit
          )"

          if [ -n "$DEBUG_APK" ]; then
            echo "::error::Debug APK detected: $DEBUG_APK"
            exit 1
          fi

          echo "DEBUG APK: NONE"


      # ============================================================
      # NO AAB
      # ============================================================

      - name: Verify no AAB
        shell: bash
        run: |
          set -euo pipefail

          AAB_FILE="$(
            find "$RKMS_ROOT/android" \
              -type f \
              -name "*.aab" \
              -print \
              -quit
          )"

          if [ -n "$AAB_FILE" ]; then
            echo "::error::AAB detected: $AAB_FILE"
            exit 1
          fi

          echo "AAB: NONE"


      # ============================================================
      # APK PACKAGE
      # ============================================================

      - name: Verify final APK package and target SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          AAPT="$SDK_ROOT/build-tools/$BUILD_TOOLS/aapt"

          test -x \
            "$AAPT"

          "$AAPT" \
            dump badging \
            "$APK_PATH" \
            > apk-badging.txt

          grep -Fq \
            "package: name='$APP_ID'" \
            apk-badging.txt

          grep -Fq \
            "targetSdkVersion:'36'" \
            apk-badging.txt

          echo "APK PACKAGE: PASS"
          echo "TARGET SDK 36: PASS"


      # ============================================================
      # APK SIGNATURE
      # ============================================================

      - name: Verify final APK signature
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          APKSIGNER="$SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner"

          test -x \
            "$APKSIGNER"

          "$APKSIGNER" \
            verify \
            --verbose \
            "$APK_PATH"

          echo "APK SIGNATURE: PASS"


      # ============================================================
      # SHA256
      # ============================================================

      - name: Generate APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          SHA_FILE="$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256"

          sha256sum \
            "$APK_PATH" \
            > "$SHA_FILE"

          echo "APK SHA256:"
          cat "$SHA_FILE"


      # ============================================================
      # FINAL APK AUDIT
      # ============================================================

      - name: Final APK-only audit
        shell: bash
        run: |
          set -euo pipefail

          test -s \
            "$APK_PATH"

          test -s \
            "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256"

          SIZE="$(
            stat -c%s "$APK_PATH"
          )"

          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::APK size unexpectedly small: $SIZE bytes"
            exit 1
          fi

          echo "=========================================="
          echo "FINAL APK-ONLY AUDIT: PASS"
          echo "APK SIZE: $SIZE bytes"
          echo "=========================================="


      # ============================================================
      # UPLOAD FINAL SIGNED RELEASE APK
      # ============================================================

      - name: Upload final signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS_ANDROID16_API36_FINAL_SIGNED_RELEASE_APK
          if-no-files-found: error
          path: |
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256
          retention-days: 30

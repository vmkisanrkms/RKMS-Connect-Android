name: RKMS Android 16 API 36 Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: RKMS Android 16 API 36 Release APK
    runs-on: ubuntu-latest

    env:
      ZIP_NAME: RKMS_CONNECT_FINAL_AUDITED_RELEASE_APK_BUILD_20260922.zip
      ZIP_SHA256: 6907af2bd83ccb6a36b0aa177861ae0731c6f53501430b9fe05fd5b905d65299

      RKMS_ROOT: ${{ github.workspace }}/rkms-build/final_audit_src

      ANDROID_API: '36'
      BUILD_TOOLS: '36.0.0'
      NODE_VERSION: '22'
      JAVA_VERSION: '17'
      AGP_VERSION: '8.9.1'
      GRADLE_VERSION: '8.11.1'
      APP_ID: org.rkms.connect

      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # NODE 22
      # ============================================================

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # VERIFY ZIP
      # ============================================================

      - name: Verify source ZIP and extract
        shell: bash
        run: |
          set -euo pipefail

          test -s "$ZIP_NAME"

          echo "$ZIP_SHA256  $ZIP_NAME" | sha256sum -c -

          rm -rf rkms-build
          mkdir -p rkms-build

          unzip -q "$ZIP_NAME" -d rkms-build

          test -d "$RKMS_ROOT"

          test -s "$RKMS_ROOT/package.json"
          test -s "$RKMS_ROOT/package-lock.json"
          test -s "$RKMS_ROOT/app.js"
          test -s "$RKMS_ROOT/index.html"
          test -s "$RKMS_ROOT/styles.css"
          test -s "$RKMS_ROOT/capacitor.config.json"
          test -s "$RKMS_ROOT/google-services.json"

          test -s "$RKMS_ROOT/scripts/setup-android-native.sh"
          test -s "$RKMS_ROOT/scripts/configure-android-16.sh"
          test -s "$RKMS_ROOT/scripts/configure-release-signing.sh"

          test -s "$RKMS_ROOT/scripts/verify-rkms-final-fixes.py"
          test -s "$RKMS_ROOT/scripts/verify-fcm-pipeline.py"
          test -s "$RKMS_ROOT/scripts/verify-native-bridge.py"
          test -s "$RKMS_ROOT/scripts/verify-android-16.py"
          test -s "$RKMS_ROOT/scripts/verify-android-pdf.py"

          echo "=================================================="
          echo "RKMS SOURCE ROOT"
          echo "$RKMS_ROOT"
          echo "=================================================="


      # ============================================================
      # VERIFY PACKAGE.JSON
      # ============================================================

      - name: Verify source package versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node - <<'NODE'
          const fs = require('fs');

          const p = JSON.parse(
            fs.readFileSync('package.json', 'utf8')
          );

          const wanted = {
            '@capacitor/core': '6.2.2',
            '@capacitor/android': '6.2.2',
            '@capacitor/app': '6.0.3',
            '@capacitor/push-notifications': '6.0.3',
            '@capacitor/cli': '6.2.2'
          };

          const all = {
            ...(p.dependencies || {}),
            ...(p.devDependencies || {})
          };

          for (const [name, version] of Object.entries(wanted)) {
            if (all[name] !== version) {
              throw new Error(
                `${name}: expected ${version}, found ${all[name]}`
              );
            }
          }

          const expectedBuild =
            "rm -rf dist && mkdir -p dist && rsync -a --exclude='dist/' --exclude='android/' --exclude='node_modules/' --exclude='.git/' --exclude='.github/' --exclude='*.zip' ./ dist/";

          if (p.scripts?.build !== expectedBuild) {
            throw new Error(
              'Unexpected package.json build script'
            );
          }

          console.log('package.json verification: PASS');
          NODE

          node --check app.js

          python3 -m json.tool capacitor.config.json >/dev/null
          python3 -m json.tool google-services.json >/dev/null

          grep -q '"appId":"org.rkms.connect"' capacitor.config.json
          grep -q 'org.rkms.connect' google-services.json


      # ============================================================
      # ANDROID SDK 36
      # ============================================================

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"


      # ============================================================
      # REPAIR ACTUAL MALFORMED SCRIPT FROM ZIP
      # ============================================================

      - name: Repair malformed native setup script from ZIP
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x scripts/setup-android-native.sh

          SETUP_SHA="$(
            sha256sum scripts/setup-android-native.sh |
            awk '{print $1}'
          )"

          echo "setup-android-native.sh SHA256:"
          echo "$SETUP_SHA"

          test "$SETUP_SHA" = \
          "d8cdb6c16fb4c6ac768a4ca515f42224097a77419ca5bccd9dd38ab990b3e305"

          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/setup-android-native.sh')
          s = p.read_text(encoding='utf-8')

          start_marker = (
              "python3 - <<'PY3'\n"
              "from pathlib import Path\n"
              "# Stable white notification icon for FCM system notifications."
          )

          start = s.find(start_marker)

          if start < 0:
              raise SystemExit(
                  'Malformed notification/manifest block start not found'
              )

          end_marker = (
              'PY3\n'
              '\n'
              '\n'
              'MAIN="$MAIN_ACTIVITY"'
          )

          end = s.find(end_marker, start)

          if end < 0:
              raise SystemExit(
                  'Malformed notification/manifest block end not found'
              )

          replacement = r'''# Stable white notification icon for FCM system notifications.
          DRAWABLE_DIR="$RES_DIR/drawable"

          mkdir -p "$DRAWABLE_DIR"

          cat > "$DRAWABLE_DIR/ic_stat_rkms.xml" <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">

              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M12,2A7,7 0,0 0,5 9v4l-2,3v1h18v-1l-2,-3V9A7,7 0,0 0,12 2M9,19a3,3 0,0 0,6 0z"/>

          </vector>
          XML

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 - <<'PY3'
          from pathlib import Path
          import re

          p = Path('android/app/src/main/AndroidManifest.xml')

          s = p.read_text(encoding='utf-8')

          manifest_match = re.search(
              r'<manifest\b[^>]*>',
              s,
              flags=re.S
          )

          if not manifest_match:
              raise SystemExit(
                  'AndroidManifest <manifest> opening tag missing'
              )

          permissions = [
              'android.permission.RECORD_AUDIO',
              'android.permission.POST_NOTIFICATIONS',
          ]

          insert = ''

          for perm in permissions:
              if perm not in s:
                  insert += (
                      f'    <uses-permission '
                      f'android:name="{perm}" />\n'
                  )

          if insert:
              pos = manifest_match.end()

              s = (
                  s[:pos]
                  + '\n'
                  + insert
                  + s[pos:]
              )

          app_match = re.search(
              r'<application\b[^>]*>',
              s,
              flags=re.S
          )

          if not app_match:
              raise SystemExit(
                  'AndroidManifest <application> opening tag missing'
              )

          app_tag = app_match.group(0)

          if (
              'android:enableOnBackInvokedCallback="true"'
              not in app_tag
          ):
              new_app_tag = app_tag[:-1]

              if new_app_tag.endswith('/'):
                  new_app_tag = new_app_tag[:-1]

              new_app_tag += (
                  ' android:enableOnBackInvokedCallback="true">'
              )

              s = (
                  s[:app_match.start()]
                  + new_app_tag
                  + s[app_match.end():]
              )

          meta = (
              '    <meta-data '
              'android:name="com.google.firebase.messaging.default_notification_channel_id" '
              'android:value="@string/rkms_default_notification_channel_id" />\n'
              '    <meta-data '
              'android:name="com.google.firebase.messaging.default_notification_icon" '
              'android:resource="@drawable/ic_stat_rkms" />\n'
          )

          if (
              'com.google.firebase.messaging.default_notification_channel_id'
              not in s
          ):
              close = s.find('</application>')

              if close < 0:
                  raise SystemExit(
                      'AndroidManifest application closing tag missing'
                  )

              s = (
                  s[:close]
                  + meta
                  + s[close:]
              )

          p.write_text(s, encoding='utf-8')
          PY3

          python3 - <<'PY3'
          from xml.etree import ElementTree as ET

          ET.parse(
              'android/app/src/main/AndroidManifest.xml'
          )

          print(
              'Generated AndroidManifest XML: PASS'
          )
          PY3
          '''

          lines = replacement.splitlines()

          replacement = '\n'.join(
              line[10:] if line.startswith('          ')
              else line
              for line in lines
          )

          replacement += (
              '\n\n\nMAIN="$MAIN_ACTIVITY"'
          )

          p.write_text(
              s[:start]
              + replacement
              + s[end + len(end_marker):],
              encoding='utf-8'
          )

          PY

          bash -n scripts/setup-android-native.sh

          echo "Native setup script syntax after repair: PASS"


      # ============================================================
      # NPM INSTALL
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm ci --no-audit --no-fund


      # ============================================================
      # WEB BUILD
      # ============================================================

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm run build

          test -s dist/index.html


      # ============================================================
      # CAPACITOR ANDROID GENERATION
      # ============================================================

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          rm -rf android

          npx cap add android

          test -s android/app/build.gradle
          test -s android/gradlew

          chmod +x android/gradlew


      # ============================================================
      # ANDROID 16 / API 36
      # ============================================================

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x scripts/configure-android-16.sh

          bash scripts/configure-android-16.sh

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('android/variables.gradle')

          s = p.read_text()

          s = re.sub(
              r'(minSdkVersion\s*=\s*)\d+',
              r'\g<1>23',
              s
          )

          s = re.sub(
              r'(compileSdkVersion\s*=\s*)\d+',
              r'\g<1>36',
              s
          )

          s = re.sub(
              r'(targetSdkVersion\s*=\s*)\d+',
              r'\g<1>36',
              s
          )

          p.write_text(s)

          p = Path('android/app/build.gradle')

          s = p.read_text()

          s = re.sub(
              r'(minSdkVersion\s+)\d+',
              r'\g<1>23',
              s
          )

          p.write_text(s)
          PY

          grep -q \
            'compileSdkVersion = 36' \
            android/variables.gradle

          grep -q \
            'targetSdkVersion = 36' \
            android/variables.gradle

          grep -q \
            'minSdkVersion = 23' \
            android/variables.gradle

          grep -q \
            'com.android.tools.build:gradle:8.9.1' \
            android/build.gradle

          grep -q \
            'gradle-8.11.1-bin.zip' \
            android/gradle/wrapper/gradle-wrapper.properties


      # ============================================================
      # CAPACITOR SYNC
      # ============================================================

      - name: Sync Capacitor
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npx cap sync android


      # ============================================================
      # ACTUAL RKMS NATIVE SETUP
      # ============================================================

      - name: Setup RKMS native Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x scripts/setup-android-native.sh

          bash scripts/setup-android-native.sh


      # ============================================================
      # FORCE FINAL ANDROID / FIREBASE CONFIG
      # ============================================================

      - name: Force Android SDK and Firebase dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 - <<'PY'
          from pathlib import Path
          import re

          # --------------------------------------------------------
          # Android variables
          # --------------------------------------------------------

          p = Path('android/variables.gradle')

          s = p.read_text()

          for key, value in [
              ('compileSdkVersion', '36'),
              ('targetSdkVersion', '36'),
              ('minSdkVersion', '23'),
          ]:
              s = re.sub(
                  rf'(\b{key}\s*=\s*)\d+',
                  rf'\g<1>{value}',
                  s
              )

          p.write_text(s)

          # --------------------------------------------------------
          # app/build.gradle
          # --------------------------------------------------------

          p = Path('android/app/build.gradle')

          s = p.read_text()

          s = re.sub(
              r'(minSdkVersion\s+)\d+',
              r'\g<1>23',
              s
          )

          marker = 'dependencies {'

          if marker not in s:
              raise SystemExit(
                  'android/app/build.gradle dependencies block missing'
              )

          additions = [
              "    implementation platform('com.google.firebase:firebase-bom:33.9.0')",
              "    implementation 'com.google.firebase:firebase-messaging'",
          ]

          for line in additions:
              if line not in s:
                  s = s.replace(
                      marker,
                      marker + '\n' + line,
                      1
                  )

          p.write_text(s)
          PY

          test -s android/app/google-services.json

          grep -q \
            'com.google.firebase:firebase-bom:33.9.0' \
            android/app/build.gradle

          grep -q \
            'com.google.firebase:firebase-messaging' \
            android/app/build.gradle

          grep -q \
            'com.google.gms.google-services' \
            android/app/build.gradle

          grep -q \
            'android.permission.RECORD_AUDIO' \
            android/app/src/main/AndroidManifest.xml

          grep -q \
            'android.permission.POST_NOTIFICATIONS' \
            android/app/src/main/AndroidManifest.xml

          grep -q \
            'android:enableOnBackInvokedCallback="true"' \
            android/app/src/main/AndroidManifest.xml

          python3 - <<'PY'
          from xml.etree import ElementTree as ET

          ET.parse(
              'android/app/src/main/AndroidManifest.xml'
          )

          print('Final AndroidManifest XML: PASS')
          PY


      # ============================================================
      # ALL ACTUAL RKMS AUDITS
      # ============================================================

      - name: Run all RKMS static audits
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 scripts/verify-rkms-final-fixes.py

          python3 scripts/verify-fcm-pipeline.py

          python3 scripts/verify-native-bridge.py

          python3 scripts/verify-android-pdf.py

          python3 scripts/verify-android-16.py


      # ============================================================
      # FIREBASE + NATIVE BRIDGE FINAL CHECK
      # ============================================================

      - name: Verify Firebase initialization and native bridge
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          MAIN="$(
            find android/app/src/main \
              -type f \
              -name 'MainActivity.java' \
              -print \
              -quit
          )"

          BRIDGE="$(
            find android/app/src/main \
              -type f \
              -name 'RKMSNativeBridge.java' \
              -print \
              -quit
          )"

          test -n "$MAIN"
          test -n "$BRIDGE"

          grep -Fq \
            'FirebaseApp.initializeApp(this)' \
            "$MAIN"

          grep -Fq \
            'RKMSNativeBridge(this, rkmsWebView)' \
            "$MAIN"

          grep -Fq \
            'private final android.app.Activity activity;' \
            "$BRIDGE"

          grep -Fq \
            'private final android.webkit.WebView webView;' \
            "$BRIDGE"

          echo "Firebase initialization: PASS"
          echo "RKMS native bridge: PASS"


      # ============================================================
      # REQUIRE RELEASE SIGNING
      # ============================================================

      - name: Verify release signing secrets
        shell: bash
        run: |
          set -euo pipefail

          test -n "${RKMS_KEYSTORE_BASE64:-}" || {
            echo "::error::RKMS_KEYSTORE_BASE64 secret is missing."
            exit 1
          }

          test -n "${RKMS_KEYSTORE_PASSWORD:-}" || {
            echo "::error::RKMS_KEYSTORE_PASSWORD secret is missing."
            exit 1
          }

          test -n "${RKMS_KEY_ALIAS:-}" || {
            echo "::error::RKMS_KEY_ALIAS secret is missing."
            exit 1
          }

          test -n "${RKMS_KEY_PASSWORD:-}" || {
            echo "::error::RKMS_KEY_PASSWORD secret is missing."
            exit 1
          }

          echo "All release signing secrets are present."


      # ============================================================
      # RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x scripts/configure-release-signing.sh

          bash scripts/configure-release-signing.sh

          test -s android/app/release.keystore

          keytool \
            -list \
            -keystore android/app/release.keystore \
            -storepass "$RKMS_KEYSTORE_PASSWORD" \
            -alias "$RKMS_KEY_ALIAS" \
            >/dev/null

          grep -q \
            'signingConfig signingConfigs.release' \
            android/app/build.gradle

          echo "Release signing configuration: PASS"


      # ============================================================
      # GRADLE TOOLCHAIN
      # ============================================================

      - name: Verify Gradle toolchain
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x android/gradlew

          ./android/gradlew --version


      # ============================================================
      # RELEASE APK ONLY
      # ============================================================

      - name: Build signed release APK only
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          rm -rf \
            android/app/build/outputs/apk/release

          ./android/gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          test -s \
            android/app/build/outputs/apk/release/app-release.apk

          if [ -e \
            android/app/build/outputs/bundle/release/app-release.aab
          ]; then
            echo "::error::AAB was generated, but APK-only build is required."
            exit 1
          fi


      # ============================================================
      # APK VERIFY
      # ============================================================

      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          APK="android/app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"

          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" \
            dump badging "$APK" |
            grep -q \
            "package: name='org.rkms.connect'"

          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" \
            verify \
            --verbose \
            "$APK"

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"

          sha256sum \
            "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk" |
            tee \
            "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256"


      # ============================================================
      # FINAL OUTPUT POLICY
      # ============================================================

      - name: Verify final output policy
        shell: bash
        run: |
          set -euo pipefail

          test -s \
            "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"

          test -s \
            "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256"

          OUTPUT_DIR="$GITHUB_WORKSPACE/rkms-build/final_audit_src/android/app/build/outputs"

          if find "$OUTPUT_DIR" \
            -type f \
            \( \
              -name '*debug*.apk' \
              -o \
              -name '*.aab' \
            \) |
            grep -q .
          then
            echo "::error::Debug APK or AAB output detected."

            find "$OUTPUT_DIR" -type f

            exit 1
          fi

          echo "=================================================="
          echo "FINAL OUTPUT POLICY: PASS"
          echo "RELEASE APK ONLY"
          echo "NO DEBUG APK"
          echo "NO AAB"
          echo "=================================================="


      # ============================================================
      # UPLOAD FINAL APK ONLY
      # ============================================================

      - name: Upload final release APK only
        uses: actions/upload-artifact@v4
        with:
          name: RKMS_ANDROID16_API36_FINAL_SIGNED_RELEASE_APK

          path: |
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256

          if-no-files-found: error

          retention-days: 90

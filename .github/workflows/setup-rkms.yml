name: RKMS Final Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  AGP_VERSION: "8.9.1"
  GRADLE_VERSION: "8.11.1"
  APP_ID: "org.rkms.connect"

  # IMPORTANT:
  # Repository root me yehi FINAL FIXED ZIP hona chahiye.
  SOURCE_ZIP: "RKMS_CONNECT_NOTIFICATION_CHAT_TAP_FIXED_20260924.zip"

jobs:
  build:
    name: Build Final Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      # ============================================================
      # 3. NODE 22
      # ============================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # ============================================================
      # 4. ANDROID SDK API 36
      # ============================================================
      - name: Setup Android SDK API 36
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          yes | sdkmanager --licenses >/dev/null || true

          echo "ANDROID_HOME=${ANDROID_HOME}"
          sdkmanager --list_installed | grep -E \
            "platforms;android-${ANDROID_API}|build-tools;${BUILD_TOOLS}|platform-tools" \
            || true

      # ============================================================
      # 5. LOCATE SOURCE ZIP
      # ============================================================
      - name: Locate final source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Looking for:"
          echo "${SOURCE_ZIP}"

          if [ ! -f "${SOURCE_ZIP}" ]; then
            echo "ERROR: Required source ZIP not found:"
            echo "${SOURCE_ZIP}"
            echo
            echo "ZIP files available in repository:"
            find . -maxdepth 3 -type f -iname "*.zip" -print
            exit 1
          fi

          ls -lh "${SOURCE_ZIP}"

      # ============================================================
      # 6. EXTRACT SOURCE
      # ============================================================
      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf rkms-source
          mkdir -p rkms-source

          unzip -q "${SOURCE_ZIP}" -d rkms-source

          echo "Extracted files:"
          find rkms-source -maxdepth 3 -type f | sort | head -300

      # ============================================================
      # 7. FIND ACTUAL SOURCE ROOT
      # ============================================================
      - name: Resolve source root
        shell: bash
        run: |
          set -euo pipefail

          ROOT="rkms-source"

          if [ -f "${ROOT}/app.js" ] && [ -f "${ROOT}/package.json" ]; then
            echo "SOURCE_ROOT=${ROOT}" >> "$GITHUB_ENV"
            exit 0
          fi

          FOUND="$(find "${ROOT}" -type f -name package.json -print | head -1 || true)"

          if [ -z "${FOUND}" ]; then
            echo "ERROR: package.json not found after extraction."
            exit 1
          fi

          SOURCE_DIR="$(dirname "${FOUND}")"

          if [ ! -f "${SOURCE_DIR}/app.js" ]; then
            echo "ERROR: app.js not found beside package.json."
            echo "Detected:"
            echo "${SOURCE_DIR}"
            find "${ROOT}" -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "SOURCE_ROOT=${SOURCE_DIR}" >> "$GITHUB_ENV"

          echo "Resolved source root:"
          echo "${SOURCE_DIR}"

      - name: Enter source root
        shell: bash
        run: |
          set -euo pipefail

          cd "${SOURCE_ROOT}"

          echo "Source root:"
          pwd

          ls -la

      # ============================================================
      # 8. REQUIRED FILES
      # ============================================================
      - name: Verify required source files
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          REQUIRED_FILES=(
            "package.json"
            "app.js"
            "index.html"
            "styles.css"
            "capacitor.config.json"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing required file: $file"
              exit 1
            fi
          done

          echo "All required source files are present."

      # ============================================================
      # 9. VERIFY CAPACITOR VERSIONS
      # ============================================================
      - name: Verify Capacitor versions
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          node <<'NODE'
          const fs = require("fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const deps = {
            ...(pkg.dependencies || {}),
            ...(pkg.devDependencies || {})
          };

          const required = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          let failed = false;

          for (const [name, version] of Object.entries(required)) {
            const actual = deps[name];

            console.log(
              `${name}: required=${version}, found=${actual || "MISSING"}`
            );

            if (actual !== version) {
              failed = true;
            }
          }

          if (failed) {
            console.error("ERROR: Capacitor version mismatch.");
            process.exit(1);
          }

          console.log("Capacitor versions verified.");
          NODE

      # ============================================================
      # 10. CAPACITOR CONFIG
      # ============================================================
      - name: Verify Capacitor configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          node <<'NODE'
          const fs = require("fs");

          const file = "capacitor.config.json";
          const config = JSON.parse(fs.readFileSync(file, "utf8"));

          console.log(JSON.stringify(config, null, 2));

          if (config.appId !== "org.rkms.connect") {
            console.error(
              `ERROR: appId must be org.rkms.connect, found ${config.appId}`
            );
            process.exit(1);
          }

          console.log("Capacitor appId verified.");
          NODE

      # ============================================================
      # 11. FIREBASE CONFIG
      # ============================================================
      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          if [ ! -f "google-services.json" ]; then
            echo "ERROR: google-services.json missing."
            exit 1
          fi

          node <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync("google-services.json", "utf8")
          );

          const projectInfo = data.project_info || {};
          const clients = data.client || [];

          console.log("Firebase project:", projectInfo.project_id || "unknown");
          console.log("Firebase clients:", clients.length);

          const found = clients.some(client =>
            client.client_info &&
            client.client_info.android_client_info &&
            client.client_info.android_client_info.package_name ===
              "org.rkms.connect"
          );

          if (!found) {
            console.error(
              "ERROR: google-services.json does not contain org.rkms.connect"
            );
            process.exit(1);
          }

          console.log("Firebase package verified.");
          NODE

      # ============================================================
      # 12. JAVASCRIPT SYNTAX
      # ============================================================
      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          node --check app.js

          echo "app.js syntax OK."

      # ============================================================
      # 13. FINAL FCM + NOTIFICATION TAP + CHAT ROUTING AUDIT
      # ============================================================
      - name: Verify final FCM and notification navigation pipeline
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          echo "Checking FCM token reconciliation..."

          grep -q "rkmsNativeFcmToken" app.js
          grep -q "refreshFcmToken" app.js
          grep -q "Push.register" app.js

          echo "FCM token reconciliation checks passed."

          echo "Checking notification conversation routing..."

          grep -q "conversation_id" app.js
          grep -q "rkmsOpenNotificationRoute" app.js
          grep -q "rkms_chat" app.js

          echo "Notification conversation routing checks passed."

          echo "Checking pending notification route handling..."

          grep -q "__RKMS_PENDING_NOTIFICATION_ROUTE" app.js

          echo "Pending notification route check passed."

          echo "Checking chat badge support..."

          grep -q "unread" app.js

          echo "Chat badge check passed."

          echo "Checking notification fix documentation..."

          if [ -f "FCM_CHAT_BADGE_TAP_FIX_20260924.md" ]; then
            grep -q "conversation_id" \
              FCM_CHAT_BADGE_TAP_FIX_20260924.md
          fi

          if [ -f "FCM_TOKEN_RECONCILIATION_FIX_20260924.md" ]; then
            grep -q "refreshFcmToken" \
              FCM_TOKEN_RECONCILIATION_FIX_20260924.md
          fi

          if [ -f "NOTIFICATION_TAP_CHAT_FIX_20260923.md" ]; then
            grep -q "conversation_id" \
              NOTIFICATION_TAP_CHAT_FIX_20260923.md
          fi

          echo "Final FCM/navigation audit passed."

      # ============================================================
      # 14. INSTALL NPM
      # ============================================================
      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # ============================================================
      # 15. FORCE CAPACITOR VERSIONS
      # ============================================================
      - name: Verify installed Capacitor packages
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          npm ls \
            @capacitor/core@6.2.2 \
            @capacitor/android@6.2.2 \
            @capacitor/app@6.0.3 \
            @capacitor/push-notifications@6.0.3 \
            @capacitor/cli@6.2.2 \
            --depth=0

      # ============================================================
      # 16. WEB BUILD
      # ============================================================
      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          npm run build

          echo "Web build completed."

      # ============================================================
      # 17. CREATE FRESH ANDROID PROJECT
      # ============================================================
      - name: Create fresh Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          rm -rf android

          npx cap add android

          echo "Fresh Android project created."

      # ============================================================
      # 18. ANDROID 16 / API 36 CONFIG
      # ============================================================
      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          python3 <<'PY'
          from pathlib import Path

          candidates = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          for p in candidates:
              if not p.exists():
                  continue

              text = p.read_text()

              text = text.replace(
                  'compileSdkVersion rootProject.ext.compileSdkVersion',
                  'compileSdkVersion 36'
              )

              text = text.replace(
                  'targetSdkVersion rootProject.ext.targetSdkVersion',
                  'targetSdkVersion 36'
              )

              text = text.replace(
                  'compileSdk rootProject.ext.compileSdkVersion',
                  'compileSdk 36'
              )

              text = text.replace(
                  'targetSdk rootProject.ext.targetSdkVersion',
                  'targetSdk 36'
              )

              p.write_text(text)
              print(f"Updated {p}")
          PY

          if [ -f android/variables.gradle ]; then
            sed -i \
              's/compileSdkVersion = .*/compileSdkVersion = 36/' \
              android/variables.gradle || true

            sed -i \
              's/targetSdkVersion = .*/targetSdkVersion = 36/' \
              android/variables.gradle || true
          fi

          echo "Android API 36 configuration applied."

      # ============================================================
      # 19. CAPACITOR SYNC
      # ============================================================
      - name: Capacitor sync Android
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          npx cap sync android

          echo "Capacitor Android sync completed."

      # ============================================================
      # 20. VERIFY NATIVE SETUP SCRIPTS
      # ============================================================
      - name: Run native setup scripts
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          if [ -f "scripts/configure-android-16.sh" ]; then
            chmod +x scripts/configure-android-16.sh
            ./scripts/configure-android-16.sh
          fi

          if [ -f "scripts/setup-android-native.sh" ]; then
            chmod +x scripts/setup-android-native.sh
            ./scripts/setup-android-native.sh
          fi

          echo "Native setup scripts completed."

      # ============================================================
      # 21. GOOGLE SERVICES PLUGIN
      # ============================================================
      - name: Configure Google Services plugin
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          PROJECT_GRADLE="android/build.gradle"

          if [ ! -f "$PROJECT_GRADLE" ]; then
            echo "ERROR: android/build.gradle not found."
            exit 1
          fi

          if ! grep -q \
            "com.google.gms:google-services:${AGP_VERSION}" \
            "$PROJECT_GRADLE"; then

            if ! grep -q \
              "com.google.gms:google-services" \
              "$PROJECT_GRADLE"; then

              cat >> "$PROJECT_GRADLE" <<'EOF'

          buildscript {
              dependencies {
                  classpath 'com.google.gms:google-services:4.4.3'
              }
          }
          EOF
            fi
          fi

          APP_GRADLE="android/app/build.gradle"

          if ! grep -q \
            "com.google.gms.google-services" \
            "$APP_GRADLE"; then

            cat >> "$APP_GRADLE" <<'EOF'

          apply plugin: 'com.google.gms.google-services'
          EOF
          fi

          echo "Google Services plugin configured."

      # ============================================================
      # 22. FIREBASE NATIVE CONFIG
      # ============================================================
      - name: Configure Firebase native files
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          mkdir -p android/app

          cp -f google-services.json \
            android/app/google-services.json

          if [ ! -f android/app/google-services.json ]; then
            echo "ERROR: Firebase config copy failed."
            exit 1
          fi

          echo "Firebase native configuration present."

      # ============================================================
      # 23. MAIN ACTIVITY / NATIVE BRIDGE CHECK
      # ============================================================
      - name: Verify RKMS native bridge
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          MAIN="$(find android/app/src/main -name MainActivity.java -o -name MainActivity.kt | head -1 || true)"

          if [ -z "$MAIN" ]; then
            echo "ERROR: MainActivity not found."
            exit 1
          fi

          echo "MainActivity:"
          echo "$MAIN"

          grep -q "FirebaseApp.initializeApp" "$MAIN" || {
            echo "ERROR: FirebaseApp.initializeApp missing."
            exit 1
          }

          grep -q "FirebaseMessaging" "$MAIN" || {
            echo "ERROR: FirebaseMessaging missing."
            exit 1
          }

          grep -q "conversation_id" "$MAIN" || {
            echo "ERROR: conversation_id handling missing in MainActivity."
            exit 1
          }

          echo "RKMS native bridge checks passed."

      # ============================================================
      # 24. FIREBASE MESSAGING DEPENDENCY
      # ============================================================
      - name: Configure Firebase Messaging dependency
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          APP_GRADLE="android/app/build.gradle"

          if ! grep -q \
            "com.google.firebase:firebase-messaging" \
            "$APP_GRADLE"; then

            python3 <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          text = p.read_text()

          dependency = """
              implementation 'com.google.firebase:firebase-messaging:25.0.1'
          """

          if "dependencies {" in text:
              text = text.replace(
                  "dependencies {",
                  "dependencies {" + dependency,
                  1
              )
          else:
              text += "\n\ndependencies {" + dependency + "\n}\n"

          p.write_text(text)
          PY
          fi

          grep -q \
            "com.google.firebase:firebase-messaging" \
            "$APP_GRADLE"

          echo "Firebase Messaging dependency verified."

      # ============================================================
      # 25. GRADLE CONFIGURATION
      # ============================================================
      - name: Configure Gradle
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          if [ ! -f android/gradlew ]; then
            echo "ERROR: Gradle wrapper missing."
            exit 1
          fi

          chmod +x android/gradlew

          cd android

          ./gradlew --version

          echo "Gradle wrapper available."

      # ============================================================
      # 26. ANDROID STATIC AUDIT
      # ============================================================
      - name: Android static audit
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          MAIN="$(find android/app/src/main -name MainActivity.java -o -name MainActivity.kt | head -1)"

          echo "Auditing:"
          echo "$MAIN"

          grep -q "FirebaseApp.initializeApp" "$MAIN"
          grep -q "FirebaseMessaging" "$MAIN"
          grep -q "conversation_id" "$MAIN"

          grep -R \
            "POST_NOTIFICATIONS" \
            android/app/src/main/AndroidManifest.xml >/dev/null || true

          echo "Android static audit passed."

      # ============================================================
      # 27. SIGNING SECRETS
      # ============================================================
      - name: Verify release signing secrets
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "${RELEASE_KEYSTORE_BASE64}" || {
            echo "ERROR: RELEASE_KEYSTORE_BASE64 missing."
            exit 1
          }

          test -n "${RELEASE_KEYSTORE_PASSWORD}" || {
            echo "ERROR: RELEASE_KEYSTORE_PASSWORD missing."
            exit 1
          }

          test -n "${RELEASE_KEY_ALIAS}" || {
            echo "ERROR: RELEASE_KEY_ALIAS missing."
            exit 1
          }

          test -n "${RELEASE_KEY_PASSWORD}" || {
            echo "ERROR: RELEASE_KEY_PASSWORD missing."
            exit 1
          }

          echo "Release signing secrets are present."

      # ============================================================
      # 28. CONFIGURE RELEASE SIGNING
      # ============================================================
      - name: Configure release signing
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          echo "${RELEASE_KEYSTORE_BASE64}" | base64 --decode \
            > android/rkms-release.keystore

          test -s android/rkms-release.keystore

          python3 <<'PY'
          from pathlib import Path

          p = Path("android/gradle.properties")

          lines = []
          if p.exists():
              lines = p.read_text().splitlines()

          values = {
              "RKMS_RELEASE_STORE_FILE": "rkms-release.keystore",
              "RKMS_RELEASE_STORE_PASSWORD": "${RELEASE_KEYSTORE_PASSWORD}",
              "RKMS_RELEASE_KEY_ALIAS": "${RELEASE_KEY_ALIAS}",
              "RKMS_RELEASE_KEY_PASSWORD": "${RELEASE_KEY_PASSWORD}",
          }

          existing = {
              line.split("=", 1)[0]
              for line in lines
              if "=" in line
          }

          for key, value in values.items():
              if key not in existing:
                  lines.append(f"{key}={value}")

          p.write_text("\n".join(lines) + "\n")
          PY

          python3 <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          text = p.read_text()

          if "signingConfigs" not in text:
              marker = "android {"

              signing = """
              signingConfigs {
                  release {
                      storeFile file(project.findProperty("RKMS_RELEASE_STORE_FILE") ?: "rkms-release.keystore")
                      storePassword project.findProperty("RKMS_RELEASE_STORE_PASSWORD")
                      keyAlias project.findProperty("RKMS_RELEASE_KEY_ALIAS")
                      keyPassword project.findProperty("RKMS_RELEASE_KEY_PASSWORD")
                  }
              }
              """

              text = text.replace(
                  marker,
                  marker + signing,
                  1
              )

          text = text.replace(
              "release {\n",
              "release {\n            signingConfig signingConfigs.release\n",
              1
          )

          p.write_text(text)
          PY

          echo "Release signing configured."

      # ============================================================
      # 29. VERIFY KEYSTORE
      # ============================================================
      - name: Verify release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          keytool \
            -list \
            -keystore android/rkms-release.keystore \
            -storepass "${RELEASE_KEYSTORE_PASSWORD}" \
            -alias "${RELEASE_KEY_ALIAS}" \
            >/dev/null

          echo "Release keystore verified."

      # ============================================================
      # 30. VERIFY GRADLE VERSION
      # ============================================================
      - name: Verify Gradle version
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}/android"

          ./gradlew --version

      # ============================================================
      # 31. FIX MAIN ACTIVITY JAVA SYNTAX
      # ============================================================
      - name: Verify MainActivity Java compilation source
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          MAIN="$(find android/app/src/main -name MainActivity.java | head -1 || true)"

          if [ -n "$MAIN" ]; then
            echo "Checking Java source:"
            echo "$MAIN"

            grep -q "package org.rkms.connect" "$MAIN" || {
              echo "ERROR: Incorrect package declaration."
              exit 1
            }
          fi

          echo "MainActivity source check passed."

      # ============================================================
      # 32. PROCESS MANIFEST
      # ============================================================
      - name: Verify Android manifest
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          grep -q \
            'android.permission.POST_NOTIFICATIONS' \
            "$MANIFEST" || true

          echo "AndroidManifest.xml verified."

      # ============================================================
      # 33. CLEAN BUILD
      # ============================================================
      - name: Clean Android build
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}/android"

          ./gradlew clean

      # ============================================================
      # 34. BUILD ONLY SIGNED RELEASE APK
      # ============================================================
      - name: Build signed release APK only
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}/android"

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 35. VERIFY APK EXISTS
      # ============================================================
      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK not found."
            find android/app/build/outputs -type f -print || true
            exit 1
          fi

          ls -lh "$APK"

      # ============================================================
      # 36. VERIFY PACKAGE NAME
      # ============================================================
      - name: Verify APK package name
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          APK="android/app/build/outputs/apk/release/app-release.apk"

          if ! command -v aapt >/dev/null 2>&1; then
            AAPT="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt"
          else
            AAPT="$(command -v aapt)"
          fi

          PACKAGE="$(
            "$AAPT" dump badging "$APK" |
            sed -n 's/^package: name='\''\([^'\'']*\)'\''.*/\1/p' |
            head -1
          )"

          echo "APK package: ${PACKAGE}"

          if [ "${PACKAGE}" != "${APP_ID}" ]; then
            echo "ERROR: Incorrect APK package name."
            exit 1
          fi

          echo "APK package name verified."

      # ============================================================
      # 37. VERIFY SIGNATURE
      # ============================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          APK="android/app/build/outputs/apk/release/app-release.apk"

          APKSIGNER="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner"

          "$APKSIGNER" verify --verbose "$APK"

          echo "APK signature verification passed."

      # ============================================================
      # 38. VERIFY RELEASE ONLY
      # ============================================================
      - name: Verify final release-only output
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          APK_DIR="android/app/build/outputs/apk"

          echo "APK outputs:"
          find "$APK_DIR" -type f -print

          test -f \
            android/app/build/outputs/apk/release/app-release.apk

          if find android/app/build/outputs/apk \
            -type f \
            \( -iname "*debug*.apk" -o -iname "*.aab" \) \
            | grep -q .; then

            echo "ERROR: Debug APK or AAB was generated."
            find android/app/build/outputs/apk \
              -type f \
              \( -iname "*debug*.apk" -o -iname "*.aab" \)
            exit 1
          fi

          echo "Only release APK output is accepted."

      # ============================================================
      # 39. SHA256
      # ============================================================
      - name: Generate APK SHA256
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          APK="android/app/build/outputs/apk/release/app-release.apk"

          sha256sum "$APK" \
            | awk '{print $1}' \
            > RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk.sha256

          echo "SHA256:"
          cat RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk.sha256

      # ============================================================
      # 40. PREPARE FINAL APK
      # ============================================================
      - name: Prepare final APK artifact
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          mkdir -p final-release

          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            final-release/RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk

          cp \
            RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk.sha256 \
            final-release/RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk.sha256

          echo "Final release files:"
          ls -lh final-release/

      # ============================================================
      # 41. FINAL APK INFORMATION
      # ============================================================
      - name: Final APK verification summary
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          APK="final-release/RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk"

          echo "=========================================="
          echo " RKMS CONNECT FINAL RELEASE APK"
          echo "=========================================="
          echo "Package : ${APP_ID}"
          echo "API     : ${ANDROID_API}"
          echo "Build   : ${BUILD_TOOLS}"
          echo "Node    : ${NODE_VERSION}"
          echo "Java    : ${JAVA_VERSION}"
          echo "Type    : SIGNED RELEASE APK ONLY"
          echo "APK     : ${APK}"
          echo "=========================================="

          sha256sum "$APK"

      # ============================================================
      # 42. UPLOAD FINAL APK
      # ============================================================
      - name: Upload final signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS_CONNECT_FINAL_SIGNED_RELEASE_APK
          path: |
            ${{ env.SOURCE_ZIP == '' && '' || format('{0}/final-release/RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk', env.SOURCE_ROOT) }}
            ${{ env.SOURCE_ZIP == '' && '' || format('{0}/final-release/RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk.sha256', env.SOURCE_ROOT) }}
          if-no-files-found: error
          retention-days: 30

name: RKMS Android 16 API 36 AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK API 36
        uses: android-actions/setup-android@v3

      - name: Install Android 16 API 36
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify Capacitor Push Notifications
        run: |
          npm ls @capacitor/push-notifications

      - name: Build web application
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Copy Firebase configuration
        run: |
          mkdir -p android/app
          cp google-services.json android/app/google-services.json

      - name: Configure Android 16 API 36
        run: |
          chmod +x scripts/configure-android-16.sh
          ./scripts/configure-android-16.sh

      - name: Capacitor sync
        run: npx cap sync android

      - name: Setup native Android bridge
        run: |
          chmod +x scripts/setup-android-native.sh
          ./scripts/setup-android-native.sh

      - name: Verify Android 16 configuration
        run: |
          python3 scripts/verify-android-16.py

      - name: Verify FCM pipeline
        run: |
          python3 scripts/verify-fcm-pipeline.py

      - name: Verify saved login
        run: |
          python3 scripts/verify-saved-login.py

      - name: Verify native PDF pipeline
        run: |
          python3 scripts/verify-android-pdf.py

      - name: Verify native bridge
        run: |
          python3 scripts/verify-native-bridge.py

      # ----------------------------------------------------
      # Optional release signing
      # ----------------------------------------------------

      - name: Prepare release keystore
        if: ${{ secrets.RKMS_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.RKMS_KEYSTORE_BASE64 }}" | base64 --decode > android/rkms-release.keystore

      - name: Configure release signing
        if: ${{ secrets.RKMS_KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text()

          signing = r'''
          android {
              signingConfigs {
                  release {
                      storeFile file("../rkms-release.keystore")
                      storePassword System.getenv("RKMS_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("RKMS_KEY_ALIAS")
                      keyPassword System.getenv("RKMS_KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          '''

          if "signingConfigs" not in s:
              s += "\n" + signing

          p.write_text(s)
          PY

      # ----------------------------------------------------
      # Build APK + AAB
      # ----------------------------------------------------

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Build release AAB
        working-directory: android
        run: |
          ./gradlew bundleRelease --no-daemon

      # ----------------------------------------------------
      # Verify generated artifacts
      # ----------------------------------------------------

      - name: List generated files
        run: |
          find android/app/build/outputs -type f -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Android-16-API36-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Android-16-API36-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

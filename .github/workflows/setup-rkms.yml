name: RKMS Final Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  AGP_VERSION: "8.9.1"
  GRADLE_VERSION: "8.11.1"
  APP_ID: "org.rkms.connect"
  SOURCE_ZIP: "RKMS_CONNECT_NOTIFICATION_CHAT_TAP_FIXED_20260924.zip"

jobs:
  build:
    name: Build Final Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # IMPORTANT: NO GRADLE CACHE HERE
      # Android project is inside the source ZIP.
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ============================================================
      # 3. NODE 22
      # IMPORTANT: NO NPM CACHE HERE
      # package-lock.json is inside the source ZIP.
      # ============================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ============================================================
      # 4. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 and Build Tools
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          yes | sdkmanager --licenses >/dev/null || true

          echo "Android SDK installed:"
          sdkmanager --list_installed | grep -E \
            "platform-tools|platforms;android-${ANDROID_API}|build-tools;${BUILD_TOOLS}" \
            || true

      # ============================================================
      # 5. FIND SOURCE ZIP
      # ============================================================
      - name: Locate source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Required ZIP:"
          echo "${SOURCE_ZIP}"

          if [ ! -f "${SOURCE_ZIP}" ]; then
            echo "ERROR: Source ZIP not found."
            echo
            echo "Available ZIP files:"
            find . -maxdepth 3 -type f -iname "*.zip" -print
            exit 1
          fi

          ls -lh "${SOURCE_ZIP}"

      # ============================================================
      # 6. EXTRACT SOURCE ZIP
      # ============================================================
      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf rkms-source
          mkdir -p rkms-source

          unzip -q "${SOURCE_ZIP}" -d rkms-source

          echo "ZIP extracted."

      # ============================================================
      # 7. FIND SOURCE ROOT
      # ============================================================
      - name: Resolve source root
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "rkms-source/app.js" ] && \
             [ -f "rkms-source/package.json" ]; then

            echo "SOURCE_ROOT=rkms-source" >> "$GITHUB_ENV"
            exit 0
          fi

          PACKAGE_JSON="$(find rkms-source \
            -type f \
            -name package.json \
            -print \
            | head -1 || true)"

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json not found."
            find rkms-source -maxdepth 4 -type f -print
            exit 1
          fi

          SOURCE_DIR="$(dirname "$PACKAGE_JSON")"

          if [ ! -f "${SOURCE_DIR}/app.js" ]; then
            echo "ERROR: app.js not found."
            exit 1
          fi

          echo "SOURCE_ROOT=${SOURCE_DIR}" >> "$GITHUB_ENV"

          echo "SOURCE_ROOT=${SOURCE_DIR}"

      # ============================================================
      # 8. REQUIRED FILES
      # ============================================================
      - name: Verify required source files
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          REQUIRED_FILES=(
            "package.json"
            "app.js"
            "index.html"
            "styles.css"
            "capacitor.config.json"
            "google-services.json"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Missing $FILE"
              exit 1
            fi
          done

          echo "Required files verified."

      # ============================================================
      # 9. VERIFY CAPACITOR VERSIONS
      # ============================================================
      - name: Verify Capacitor versions
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          node <<'NODE'
          const fs = require("fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const deps = {
            ...(pkg.dependencies || {}),
            ...(pkg.devDependencies || {})
          };

          const required = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          let failed = false;

          for (const [name, version] of Object.entries(required)) {
            const actual = deps[name];

            console.log(
              `${name}: required=${version}, found=${actual || "MISSING"}`
            );

            if (actual !== version) {
              failed = true;
            }
          }

          if (failed) {
            process.exit(1);
          }

          console.log("Capacitor versions OK.");
          NODE

      # ============================================================
      # 10. CAPACITOR CONFIG
      # ============================================================
      - name: Verify Capacitor configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          node <<'NODE'
          const fs = require("fs");

          const config = JSON.parse(
            fs.readFileSync("capacitor.config.json", "utf8")
          );

          console.log(JSON.stringify(config, null, 2));

          if (config.appId !== "org.rkms.connect") {
            console.error("ERROR: Incorrect appId.");
            process.exit(1);
          }

          console.log("Capacitor configuration OK.");
          NODE

      # ============================================================
      # 11. FIREBASE CONFIG
      # ============================================================
      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          node <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync("google-services.json", "utf8")
          );

          const clients = data.client || [];

          const found = clients.some(client =>
            client.client_info &&
            client.client_info.android_client_info &&
            client.client_info.android_client_info.package_name ===
              "org.rkms.connect"
          );

          if (!found) {
            console.error(
              "ERROR: org.rkms.connect missing from google-services.json"
            );
            process.exit(1);
          }

          console.log("Firebase configuration OK.");
          NODE

      # ============================================================
      # 12. JAVASCRIPT SYNTAX
      # ============================================================
      - name: Verify JavaScript
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          node --check app.js

          echo "JavaScript syntax OK."

      # ============================================================
      # 13. FINAL FCM / CHAT NOTIFICATION ROUTING AUDIT
      # ============================================================
      - name: Verify final notification routing
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          echo "Checking FCM token reconciliation..."

          grep -q "rkmsNativeFcmToken" app.js
          grep -q "refreshFcmToken" app.js
          grep -q "Push.register" app.js

          echo "FCM token checks OK."

          echo "Checking exact chat routing..."

          grep -q "conversation_id" app.js
          grep -q "rkmsOpenNotificationRoute" app.js
          grep -q "rkms_chat" app.js
          grep -q "__RKMS_PENDING_NOTIFICATION_ROUTE" app.js

          echo "Chat notification routing checks OK."

          echo "Checking documentation..."

          if [ -f "FCM_CHAT_BADGE_TAP_FIX_20260924.md" ]; then
            grep -q "conversation_id" \
              FCM_CHAT_BADGE_TAP_FIX_20260924.md
          fi

          if [ -f "FCM_TOKEN_RECONCILIATION_FIX_20260924.md" ]; then
            grep -q "refreshFcmToken" \
              FCM_TOKEN_RECONCILIATION_FIX_20260924.md
          fi

          if [ -f "NOTIFICATION_TAP_CHAT_FIX_20260923.md" ]; then
            grep -q "conversation_id" \
              NOTIFICATION_TAP_CHAT_FIX_20260923.md
          fi

          echo "Final notification audit OK."

      # ============================================================
      # 14. INSTALL NPM
      # ============================================================
      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # ============================================================
      # 15. VERIFY INSTALLED CAPACITOR
      # ============================================================
      - name: Verify installed Capacitor packages
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          npm ls \
            @capacitor/core@6.2.2 \
            @capacitor/android@6.2.2 \
            @capacitor/app@6.0.3 \
            @capacitor/push-notifications@6.0.3 \
            @capacitor/cli@6.2.2 \
            --depth=0

      # ============================================================
      # 16. BUILD WEB
      # ============================================================
      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          npm run build

          echo "Web build OK."

      # ============================================================
      # 17. CREATE FRESH ANDROID
      # ============================================================
      - name: Create fresh Android project
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          rm -rf android

          npx cap add android

          echo "Fresh Android project created."

      # ============================================================
      # 18. CONFIGURE ANDROID 16 API 36
      # ============================================================
      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          if [ -f "android/variables.gradle" ]; then
            sed -i \
              's/compileSdkVersion = .*/compileSdkVersion = 36/' \
              android/variables.gradle || true

            sed -i \
              's/targetSdkVersion = .*/targetSdkVersion = 36/' \
              android/variables.gradle || true
          fi

          if [ -f "android/app/build.gradle" ]; then

            sed -i \
              's/compileSdkVersion [0-9][0-9]*/compileSdkVersion 36/g' \
              android/app/build.gradle || true

            sed -i \
              's/targetSdkVersion [0-9][0-9]*/targetSdkVersion 36/g' \
              android/app/build.gradle || true

            sed -i \
              's/compileSdk [0-9][0-9]*/compileSdk 36/g' \
              android/app/build.gradle || true

            sed -i \
              's/targetSdk [0-9][0-9]*/targetSdk 36/g' \
              android/app/build.gradle || true
          fi

          echo "Android 16 / API 36 configured."

      # ============================================================
      # 19. CAPACITOR SYNC
      # ============================================================
      - name: Capacitor sync
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          npx cap sync android

          echo "Capacitor sync OK."

      # ============================================================
      # 20. NATIVE SETUP
      # ============================================================
      - name: Run native setup scripts
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          if [ -f "scripts/configure-android-16.sh" ]; then
            chmod +x scripts/configure-android-16.sh
            ./scripts/configure-android-16.sh
          fi

          if [ -f "scripts/setup-android-native.sh" ]; then
            chmod +x scripts/setup-android-native.sh
            ./scripts/setup-android-native.sh
          fi

          echo "Native setup OK."

      # ============================================================
      # 21. GOOGLE SERVICES
      # ============================================================
      - name: Configure Google Services
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          cp -f google-services.json \
            android/app/google-services.json

          test -f android/app/google-services.json

          PROJECT_GRADLE="android/build.gradle"
          APP_GRADLE="android/app/build.gradle"

          if ! grep -q \
            "com.google.gms:google-services" \
            "$PROJECT_GRADLE"; then

            python3 <<'PY'
          from pathlib import Path

          p = Path("android/build.gradle")
          text = p.read_text()

          if "buildscript {" in text and "dependencies {" in text:
              text = text.replace(
                  "dependencies {",
                  "dependencies {\n        classpath 'com.google.gms:google-services:4.4.3'",
                  1
              )
          else:
              text += """
          buildscript {
              dependencies {
                  classpath 'com.google.gms:google-services:4.4.3'
              }
          }
          """

          p.write_text(text)
          PY
          fi

          if ! grep -q \
            "com.google.gms.google-services" \
            "$APP_GRADLE"; then

            printf '\napply plugin: '\''com.google.gms.google-services'\''\n' \
              >> "$APP_GRADLE"
          fi

          echo "Google Services configured."

      # ============================================================
      # 22. FIREBASE MESSAGING
      # ============================================================
      - name: Configure Firebase Messaging
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          APP_GRADLE="android/app/build.gradle"

          if ! grep -q \
            "com.google.firebase:firebase-messaging" \
            "$APP_GRADLE"; then

            python3 <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          text = p.read_text()

          dependency = """
              implementation 'com.google.firebase:firebase-messaging:25.0.1'
          """

          if "dependencies {" in text:
              text = text.replace(
                  "dependencies {",
                  "dependencies {" + dependency,
                  1
              )
          else:
              text += "\n\ndependencies {" + dependency + "\n}\n"

          p.write_text(text)
          PY
          fi

          grep -q \
            "com.google.firebase:firebase-messaging" \
            "$APP_GRADLE"

          echo "Firebase Messaging configured."

      # ============================================================
      # 23. MAIN ACTIVITY
      # ============================================================
      - name: Verify MainActivity native bridge
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          MAIN="$(
            find android/app/src/main \
              \( -name MainActivity.java -o -name MainActivity.kt \) \
              -print \
              | head -1
          )"

          if [ -z "$MAIN" ]; then
            echo "ERROR: MainActivity not found."
            exit 1
          fi

          echo "MainActivity: $MAIN"

          grep -q "FirebaseApp.initializeApp" "$MAIN"
          grep -q "FirebaseMessaging" "$MAIN"
          grep -q "conversation_id" "$MAIN"

          echo "Native bridge checks OK."

      # ============================================================
      # 24. ANDROID MANIFEST
      # ============================================================
      - name: Verify Android manifest
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          echo "Manifest OK."

      # ============================================================
      # 25. GRADLE WRAPPER
      # ============================================================
      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}/android"

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew

          ./gradlew --version

      # ============================================================
      # 26. RELEASE SIGNING SECRETS
      # ============================================================
      - name: Verify signing secrets
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "${RELEASE_KEYSTORE_BASE64}"
          test -n "${RELEASE_KEYSTORE_PASSWORD}"
          test -n "${RELEASE_KEY_ALIAS}"
          test -n "${RELEASE_KEY_PASSWORD}"

          echo "Signing secrets present."

      # ============================================================
      # 27. CONFIGURE SIGNING
      # ============================================================
      - name: Configure release signing
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          echo "${RELEASE_KEYSTORE_BASE64}" | \
            base64 --decode > android/rkms-release.keystore

          test -s android/rkms-release.keystore

          cat >> android/gradle.properties <<EOF

          RKMS_RELEASE_STORE_FILE=rkms-release.keystore
          RKMS_RELEASE_STORE_PASSWORD=${RELEASE_KEYSTORE_PASSWORD}
          RKMS_RELEASE_KEY_ALIAS=${RELEASE_KEY_ALIAS}
          RKMS_RELEASE_KEY_PASSWORD=${RELEASE_KEY_PASSWORD}
          EOF

          python3 <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          text = p.read_text()

          if "RKMS_RELEASE_STORE_FILE" not in text:

              signing = """
              signingConfigs {
                  release {
                      storeFile file(project.findProperty("RKMS_RELEASE_STORE_FILE"))
                      storePassword project.findProperty("RKMS_RELEASE_STORE_PASSWORD")
                      keyAlias project.findProperty("RKMS_RELEASE_KEY_ALIAS")
                      keyPassword project.findProperty("RKMS_RELEASE_KEY_PASSWORD")
                  }
              }
              """

              text = text.replace(
                  "android {",
                  "android {\n" + signing,
                  1
              )

          marker = "release {"

          if marker in text and \
             "signingConfig signingConfigs.release" not in text:

              text = text.replace(
                  marker,
                  marker + "\n            signingConfig signingConfigs.release",
                  1
              )

          p.write_text(text)
          PY

          echo "Release signing configured."

      # ============================================================
      # 28. VERIFY KEYSTORE
      # ============================================================
      - name: Verify keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          keytool \
            -list \
            -keystore android/rkms-release.keystore \
            -storepass "${RELEASE_KEYSTORE_PASSWORD}" \
            -alias "${RELEASE_KEY_ALIAS}" \
            >/dev/null

          echo "Keystore verified."

      # ============================================================
      # 29. CLEAN
      # ============================================================
      - name: Clean Android project
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}/android"

          ./gradlew clean

      # ============================================================
      # 30. BUILD SIGNED RELEASE APK ONLY
      # ============================================================
      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}/android"

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 31. VERIFY APK
      # ============================================================
      - name: Verify release APK exists
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found."

            find android/app/build/outputs \
              -type f \
              -print || true

            exit 1
          fi

          ls -lh "$APK"

      # ============================================================
      # 32. VERIFY PACKAGE
      # ============================================================
      - name: Verify APK package
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          APK="android/app/build/outputs/apk/release/app-release.apk"

          AAPT="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt"

          PACKAGE="$(
            "$AAPT" dump badging "$APK" |
            sed -n "s/^package: name='\([^']*\)'.*/\1/p" |
            head -1
          )"

          echo "Package: ${PACKAGE}"

          if [ "${PACKAGE}" != "${APP_ID}" ]; then
            echo "ERROR: Package mismatch."
            exit 1
          fi

      # ============================================================
      # 33. VERIFY SIGNATURE
      # ============================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          APK="android/app/build/outputs/apk/release/app-release.apk"

          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner" \
            verify \
            --verbose \
            "$APK"

          echo "APK signature verified."

      # ============================================================
      # 34. ENSURE NO DEBUG / AAB
      # ============================================================
      - name: Verify release-only output
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          if find android/app/build/outputs \
            -type f \
            \( -iname "*debug*.apk" -o -iname "*.aab" \) \
            | grep -q .; then

            echo "ERROR: Debug APK or AAB detected."

            find android/app/build/outputs \
              -type f \
              \( -iname "*debug*.apk" -o -iname "*.aab" \)

            exit 1
          fi

          echo "Only signed release APK is accepted."

      # ============================================================
      # 35. SHA256
      # ============================================================
      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          APK="android/app/build/outputs/apk/release/app-release.apk"

          sha256sum "$APK" \
            | awk '{print $1}' \
            > RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk.sha256

          cat RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk.sha256

      # ============================================================
      # 36. PREPARE FINAL ARTIFACT
      # ============================================================
      - name: Prepare final release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          rm -rf final-release
          mkdir -p final-release

          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            final-release/RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk

          cp \
            RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk.sha256 \
            final-release/RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk.sha256

          ls -lh final-release/

      # ============================================================
      # 37. FINAL SHA256
      # ============================================================
      - name: Final APK verification
        shell: bash
        run: |
          set -euo pipefail
          cd "${SOURCE_ROOT}"

          APK="final-release/RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk"

          echo "=========================================="
          echo " RKMS CONNECT FINAL SIGNED RELEASE APK"
          echo "=========================================="

          echo "Package : ${APP_ID}"
          echo "Android : API ${ANDROID_API}"
          echo "Build   : ${BUILD_TOOLS}"
          echo "Java    : ${JAVA_VERSION}"
          echo "Node    : ${NODE_VERSION}"
          echo "Output  : SIGNED RELEASE APK ONLY"

          echo
          echo "SHA256:"
          sha256sum "$APK"

      # ============================================================
      # 38. UPLOAD ONLY FINAL APK
      # ============================================================
      - name: Upload final signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS_CONNECT_FINAL_SIGNED_RELEASE_APK
          path: |
            ${{ env.SOURCE_ROOT }}/final-release/RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk
            ${{ env.SOURCE_ROOT }}/final-release/RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk.sha256
          if-no-files-found: error
          retention-days: 30

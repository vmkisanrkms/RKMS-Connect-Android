name: RKMS Android 16 API 36 - RELEASE APK ONLY

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-apk:
    name: RKMS Android 16 / API 36 - Release APK
    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. PREPARE RKMS SOURCE
      # ==========================================================

      - name: Prepare RKMS source root
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking RKMS source..."

          if [ ! -f package.json ]; then

            PACKAGE="$(find . -maxdepth 1 -type f \
              -name 'RKMS_CONNECT_V21*.zip' \
              -print -quit)"

            if [ -z "${PACKAGE:-}" ]; then
              echo "ERROR: package.json not found."
              echo "ERROR: V21 source ZIP not found."
              echo
              echo "Repository contents:"
              find . -maxdepth 2 -type f -print
              exit 1
            fi

            echo "Using source package:"
            echo "$PACKAGE"

            rm -rf .rkms_extract
            mkdir -p .rkms_extract

            unzip -q "$PACKAGE" -d .rkms_extract

            SOURCE_DIR="$(
              find .rkms_extract \
                -mindepth 1 \
                -maxdepth 2 \
                -type d \
                -name 'rkms_android' \
                -print -quit
            )"

            if [ -z "${SOURCE_DIR:-}" ]; then
              echo "ERROR: rkms_android source directory not found."
              find .rkms_extract -maxdepth 3 -print
              exit 1
            fi

            # Do NOT overwrite the checked-out .github workflow
            # directory from inside the ZIP.
            rsync -a \
              --exclude='.github/' \
              "$SOURCE_DIR"/ \
              ./

            rm -rf .rkms_extract

          fi

          test -f package.json
          test -f capacitor.config.json
          test -f index.html
          test -f app.js
          test -f styles.css
          test -f google-services.json

          echo
          echo "RKMS source root: PASS"


      # ==========================================================
      # 3. JAVASCRIPT SYNTAX
      # ==========================================================

      - name: Verify application JavaScript
        shell: bash
        run: |
          set -euo pipefail

          node --check app.js

          echo "JavaScript syntax: PASS"


      # ==========================================================
      # 4. NODE 22
      # ==========================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Node.js
        shell: bash
        run: |
          set -euo pipefail

          node --version
          npm --version


      # ==========================================================
      # 5. NPM DEPENDENCIES
      # ==========================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          npm install --no-audit --no-fund


      # ==========================================================
      # 6. VERIFY CAPACITOR + PUSH NOTIFICATIONS
      # ==========================================================

      - name: Verify Capacitor and FCM dependency
        shell: bash
        run: |
          set -euo pipefail

          npm ls @capacitor/core --depth=0
          npm ls @capacitor/android --depth=0
          npm ls @capacitor/app --depth=0

          # Required by verify-fcm-pipeline.py
          npm ls @capacitor/push-notifications --depth=0

          echo
          echo "Capacitor core: PASS"
          echo "Capacitor Android: PASS"
          echo "Capacitor App: PASS"
          echo "@capacitor/push-notifications: PASS"


      # ==========================================================
      # 7. JDK 17
      # ==========================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify JDK 17
        shell: bash
        run: |
          set -euo pipefail

          java -version
          javac -version


      # ==========================================================
      # 8. ANDROID SDK
      # ==========================================================
      #
      # IMPORTANT:
      # Android Actions v4 is used.
      #
      # packages: '' prevents the obsolete "tools" package
      # from being installed.
      #
      # Android 16 = API 36.
      #

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''


      # ==========================================================
      # 9. ANDROID SDK LICENSES
      # ==========================================================

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "Android SDK licenses: PASS"


      # ==========================================================
      # 10. INSTALL ANDROID 16 / API 36
      # ==========================================================

      - name: Install Android 16 API 36 SDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

          echo
          echo "Android 16 / API 36 SDK installed."


      # ==========================================================
      # 11. VERIFY ANDROID SDK
      # ==========================================================

      - name: Verify Android 16 API 36 SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

          echo
          echo "=============================================="
          echo " ANDROID SDK VERIFICATION"
          echo "=============================================="
          echo
          echo "Platform Tools       : PASS"
          echo "Android Platform 36  : PASS"
          echo "Build Tools 36.0.0   : PASS"
          echo
          echo "Android 16 / API 36  : PASS"
          echo
          echo "=============================================="


      # ==========================================================
      # 12. BUILD WEB APPLICATION
      # ==========================================================

      - name: Build RKMS web application
        shell: bash
        run: |
          set -euo pipefail

          npm run build


      # ==========================================================
      # 13. VERIFY WEB BUILD
      # ==========================================================

      - name: Verify web build
        shell: bash
        run: |
          set -euo pipefail

          test -d dist
          test -f dist/index.html

          echo "Web build: PASS"


      # ==========================================================
      # 14. ADD CAPACITOR ANDROID
      # ==========================================================

      - name: Add Capacitor Android platform
        shell: bash
        run: |
          set -euo pipefail

          npx cap add android


      # ==========================================================
      # 15. VERIFY ANDROID PROJECT
      # ==========================================================

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -d android
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle
          test -f android/gradlew

          echo "Android project: PASS"


      # ==========================================================
      # 16. FIREBASE
      # ==========================================================

      - name: Install Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          test -f google-services.json

          cp google-services.json \
             android/app/google-services.json

          test -f android/app/google-services.json

          echo "Firebase configuration: PASS"


      # ==========================================================
      # 17. CONFIGURE ANDROID 16
      # ==========================================================

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/configure-android-16.sh

          bash scripts/configure-android-16.sh


      # ==========================================================
      # 18. CAPACITOR SYNC
      # ==========================================================

      - name: Capacitor sync Android
        shell: bash
        run: |
          set -euo pipefail

          npx cap sync android


      # ==========================================================
      # 19. RKMS NATIVE ANDROID SETUP
      # ==========================================================

      - name: Setup RKMS native Android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/setup-android-native.sh

          bash scripts/setup-android-native.sh


      # ==========================================================
      # 20. VERIFY ANDROID 16
      # ==========================================================

      - name: Verify Android 16 configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-android-16.py


      # ==========================================================
      # 21. VERIFY PDF
      # ==========================================================

      - name: Verify Android PDF pipeline
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-android-pdf.py


      # ==========================================================
      # 22. VERIFY NATIVE BRIDGE
      # ==========================================================

      - name: Verify native bridge
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-native-bridge.py


      # ==========================================================
      # 23. PREPARE FCM VERIFIER WORKFLOW FILE
      # ==========================================================
      #
      # verify-fcm-pipeline.py expects EXACTLY:
      #
      # .github/workflows/android-apk.yml
      #
      # This step guarantees that file exists even if the
      # workflow was initially launched under another filename.
      #

      - name: Prepare FCM verifier workflow
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .github/workflows

          if [ ! -f ".github/workflows/android-apk.yml" ]; then

            CURRENT_WORKFLOW="$(
              find .github/workflows \
                -maxdepth 1 \
                -type f \
                \( -name '*.yml' -o -name '*.yaml' \) \
                ! -name 'android-apk.yml' \
                -print \
                -quit
            )"

            if [ -z "${CURRENT_WORKFLOW:-}" ]; then
              echo "ERROR: No workflow file found for FCM verifier."
              ls -la .github/workflows
              exit 1
            fi

            cp "$CURRENT_WORKFLOW" \
               ".github/workflows/android-apk.yml"

            echo "Created compatibility workflow:"
            echo ".github/workflows/android-apk.yml"

          else

            echo "FCM verifier workflow already exists."

          fi

          test -f ".github/workflows/android-apk.yml"

          echo "FCM workflow path: PASS"


      # ==========================================================
      # 24. VERIFY FCM
      # ==========================================================

      - name: Verify FCM pipeline
        shell: bash
        run: |
          set -euo pipefail

          test -f ".github/workflows/android-apk.yml"

          python3 scripts/verify-fcm-pipeline.py


      # ==========================================================
      # 25. VERIFY SAVED LOGIN
      # ==========================================================

      - name: Verify saved login
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-saved-login.py


      # ==========================================================
      # 26. VERIFY CORE RKMS
      # ==========================================================

      - name: Verify final RKMS application
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-rkms-final.py


      # ==========================================================
      # 27. VERIFY COMPLAINT WORKFLOW
      # ==========================================================

      - name: Verify complaint workflow
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking complaint workflow..."

          grep -q "memberCloseComplaint" app.js
          grep -q "memberReopenComplaint" app.js
          grep -q "officerCloseComplaint" app.js

          echo "Member Close       : PASS"
          echo "Member Reopen      : PASS"
          echo "PDA Officer Close  : PASS"


      # ==========================================================
      # 28. VERIFY ORIGINAL RKMS LAUNCHER
      # ==========================================================

      - name: Verify original RKMS launcher
        shell: bash
        run: |
          set -euo pipefail

          test -f \
            assets/rkms-launcher-original-transparent.png

          test -f \
            android_launcher_icons/mipmap-mdpi/ic_launcher.png

          test -f \
            android_launcher_icons/mipmap-hdpi/ic_launcher.png

          test -f \
            android_launcher_icons/mipmap-xhdpi/ic_launcher.png

          test -f \
            android_launcher_icons/mipmap-xxhdpi/ic_launcher.png

          test -f \
            android_launcher_icons/mipmap-xxxhdpi/ic_launcher.png

          echo "Original RKMS launcher: PASS"


      # ==========================================================
      # 29. VERIFY NO X LOGO REFERENCES
      # ==========================================================

      - name: Verify no X Twitter references
        shell: bash
        run: |
          set -euo pipefail

          if grep -RniE \
            "twitter\.com|x\.com/" \
            app.js \
            index.html \
            styles.css \
            assets \
            scripts \
            android_launcher_icons \
            --exclude="*.map" \
            2>/dev/null; then

            echo
            echo "ERROR: X/Twitter reference found."
            exit 1
          fi

          echo "No X/Twitter reference: PASS"


      # ==========================================================
      # 30. VERIFY WORKFLOW FILE
      # ==========================================================

      - name: Verify APK workflow file
        shell: bash
        run: |
          set -euo pipefail

          test -f ".github/workflows/android-apk.yml"

          grep -q \
            "@capacitor/push-notifications" \
            ".github/workflows/android-apk.yml"

          grep -q \
            "assembleRelease" \
            ".github/workflows/android-apk.yml"

          if grep -q "bundleRelease" \
            ".github/workflows/android-apk.yml"; then

            echo "ERROR: bundleRelease found."
            echo "AAB build must remain disabled."
            exit 1
          fi

          echo "Workflow filename       : PASS"
          echo "Push Notifications      : PASS"
          echo "assembleRelease         : PASS"
          echo "AAB / bundleRelease     : DISABLED"


      # ==========================================================
      # 31. CHECK RELEASE SIGNING
      # ==========================================================

      - name: Check release signing
        id: signing
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${RKMS_KEYSTORE_BASE64:-}" ] && \
             [ -n "${RKMS_KEYSTORE_PASSWORD:-}" ] && \
             [ -n "${RKMS_KEY_ALIAS:-}" ] && \
             [ -n "${RKMS_KEY_PASSWORD:-}" ]; then

            echo "enabled=true" >> "$GITHUB_OUTPUT"

            echo "Release signing configuration detected."

          else

            echo "enabled=false" >> "$GITHUB_OUTPUT"

            echo "Release signing secrets are not configured."

          fi


      # ==========================================================
      # 32. PREPARE RELEASE KEYSTORE
      # ==========================================================

      - name: Prepare release keystore
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$RKMS_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/release.keystore

          chmod 600 android/app/release.keystore

          test -s android/app/release.keystore

          echo "Release keystore: PASS"


      # ==========================================================
      # 33. CONFIGURE RELEASE SIGNING
      # ==========================================================

      - name: Configure release signing
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/configure-release-signing.sh

          bash scripts/configure-release-signing.sh


      # ==========================================================
      # 34. UNSIGNED FALLBACK
      # ==========================================================

      - name: Prepare unsigned release when signing unavailable
        if: steps.signing.outputs.enabled != 'true'
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")

          text = path.read_text(encoding="utf-8")

          text = text.replace(
              "signingConfig signingConfigs.rkmsProduction",
              ""
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print("Unsigned release configuration prepared.")
          PY


      # ==========================================================
      # 35. VERIFY GRADLE
      # ==========================================================

      - name: Verify Gradle
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew --version


      # ==========================================================
      # 36. CLEAN ANDROID BUILD
      # ==========================================================

      - name: Clean Android
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean --no-daemon


      # ==========================================================
      # 37. BUILD RELEASE APK ONLY
      # ==========================================================
      #
      # NO AAB
      # NO bundleRelease
      # APK ONLY
      #

      - name: Build RELEASE APK ONLY
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace


      # ==========================================================
      # 38. VERIFY APK
      # ==========================================================

      - name: Verify Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"
          test -s "$APK"

          echo
          echo "=============================================="
          echo " RKMS RELEASE APK READY"
          echo "=============================================="
          echo
          echo "Android Version : 16"
          echo "API Level       : 36"
          echo "APK             : app-release.apk"
          echo
          ls -lh "$APK"
          echo
          echo "=============================================="


      # ==========================================================
      # 39. UPLOAD APK
      # ==========================================================

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Android-16-API36-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30


      # ==========================================================
      # 40. FINAL BUILD SUMMARY
      # ==========================================================

      - name: Final APK build summary
        shell: bash
        run: |
          echo
          echo "=================================================="
          echo " RKMS CONNECT V21"
          echo " FINAL ANDROID 16 / API 36 RELEASE APK"
          echo "=================================================="
          echo
          echo "Android Version : 16"
          echo "API Level       : 36"
          echo "JDK             : 17"
          echo "Node.js         : 22"
          echo
          echo "Android SDK     : VERIFIED"
          echo "Web Build       : VERIFIED"
          echo "Capacitor       : VERIFIED"
          echo "Native Bridge   : VERIFIED"
          echo "PDF Pipeline    : VERIFIED"
          echo "FCM Pipeline    : VERIFIED"
          echo "Saved Login     : VERIFIED"
          echo "Core RKMS       : VERIFIED"
          echo
          echo "Complaint       : VERIFIED"
          echo "Member Close    : VERIFIED"
          echo "Member Reopen   : VERIFIED"
          echo "PDA Close       : VERIFIED"
          echo
          echo "Launcher Logo   : VERIFIED"
          echo "X Logo          : NOT FOUND"
          echo
          echo "Workflow        : android-apk.yml"
          echo
          echo "AAB BUILD       : DISABLED"
          echo "bundleRelease   : DISABLED"
          echo
          echo "RELEASE APK     : SUCCESS"
          echo
          echo "=================================================="

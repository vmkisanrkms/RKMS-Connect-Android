name: RKMS Android 16 API 36 - RELEASE APK ONLY

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: RKMS Android 16 / API 36 - Release APK
    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. EXTRACT V21 SOURCE
      # ==========================================================

      - name: Extract V21 RKMS source
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE="RKMS_CONNECT_V21_FULL_AUDITED_COMPLAINT_AND_LOGO_APK_FIRST.zip"

          echo "Checking V21 source package..."

          if [ ! -f "$PACKAGE" ]; then
            echo "ERROR: V21 source package not found."
            echo "Expected:"
            echo "$PACKAGE"
            exit 1
          fi

          rm -rf .rkms_extract
          mkdir -p .rkms_extract

          unzip -q "$PACKAGE" -d .rkms_extract

          SOURCE_DIR=".rkms_extract/rkms_android"

          if [ ! -d "$SOURCE_DIR" ]; then
            echo "ERROR: rkms_android directory not found inside V21 package."
            find .rkms_extract -maxdepth 3 -print
            exit 1
          fi

          cp -a "$SOURCE_DIR"/. .

          rm -rf .rkms_extract

          echo "Checking RKMS project..."

          test -f package.json
          test -f capacitor.config.json
          test -f index.html
          test -f app.js
          test -f styles.css
          test -f google-services.json

          echo "V21 source verified."


      # ==========================================================
      # 3. NODE 22
      # ==========================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Node.js
        shell: bash
        run: |
          set -euo pipefail

          node --version
          npm --version


      # ==========================================================
      # 4. NPM DEPENDENCIES
      # ==========================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          npm install --no-audit --no-fund


      # ==========================================================
      # 5. JDK 17
      # ==========================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify JDK 17
        shell: bash
        run: |
          set -euo pipefail

          java -version
          javac -version


      # ==========================================================
      # 6. ANDROID SDK SETUP
      # ==========================================================
      #
      # IMPORTANT:
      # setup-android@v4 is used.
      # packages: '' prevents obsolete "tools" package installation.
      #

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''


      # ==========================================================
      # 7. ANDROID SDK LICENSES
      # ==========================================================

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "Android SDK licenses processed."


      # ==========================================================
      # 8. INSTALL ANDROID 16 / API 36
      # ==========================================================

      - name: Install Android 16 API 36 SDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

          echo
          echo "Android 16 / API 36 SDK installed."


      # ==========================================================
      # 9. VERIFY ANDROID SDK
      # ==========================================================

      - name: Verify Android 16 API 36 SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          test -d "$ANDROID_HOME/platform-tools"

          echo
          echo "======================================"
          echo " Android 16 / API 36 SDK: PASS"
          echo " Platform 36: PASS"
          echo " Build Tools 36.0.0: PASS"
          echo " Platform Tools: PASS"
          echo "======================================"


      # ==========================================================
      # 10. VERIFY CAPACITOR
      # ==========================================================

      - name: Verify Capacitor
        shell: bash
        run: |
          set -euo pipefail

          npm ls @capacitor/core --depth=0
          npm ls @capacitor/android --depth=0
          npm ls @capacitor/app --depth=0
          npm ls @capacitor/push-notifications --depth=0


      # ==========================================================
      # 11. BUILD WEB APPLICATION
      # ==========================================================

      - name: Build RKMS web application
        shell: bash
        run: |
          set -euo pipefail

          npm run build


      # ==========================================================
      # 12. VERIFY WEB BUILD
      # ==========================================================

      - name: Verify web build
        shell: bash
        run: |
          set -euo pipefail

          test -d dist
          test -f dist/index.html

          echo "Web build PASS."


      # ==========================================================
      # 13. CREATE ANDROID PROJECT
      # ==========================================================

      - name: Add Capacitor Android
        shell: bash
        run: |
          set -euo pipefail

          npx cap add android


      # ==========================================================
      # 14. VERIFY ANDROID PROJECT
      # ==========================================================

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -d android
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle
          test -f android/gradlew

          echo "Android project PASS."


      # ==========================================================
      # 15. FIREBASE CONFIGURATION
      # ==========================================================

      - name: Install Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          test -f google-services.json

          cp google-services.json \
             android/app/google-services.json

          test -f android/app/google-services.json

          echo "Firebase configuration PASS."


      # ==========================================================
      # 16. ANDROID 16 CONFIGURATION
      # ==========================================================

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/configure-android-16.sh
          bash scripts/configure-android-16.sh


      # ==========================================================
      # 17. CAPACITOR SYNC
      # ==========================================================

      - name: Capacitor sync
        shell: bash
        run: |
          set -euo pipefail

          npx cap sync android


      # ==========================================================
      # 18. RKMS NATIVE ANDROID SETUP
      # ==========================================================

      - name: Setup RKMS native Android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/setup-android-native.sh
          bash scripts/setup-android-native.sh


      # ==========================================================
      # 19. VERIFY ANDROID 16 CONFIGURATION
      # ==========================================================

      - name: Verify Android 16 configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-android-16.py


      # ==========================================================
      # 20. VERIFY PDF PIPELINE
      # ==========================================================

      - name: Verify Android PDF pipeline
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-android-pdf.py


      # ==========================================================
      # 21. VERIFY NATIVE BRIDGE
      # ==========================================================

      - name: Verify native bridge
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-native-bridge.py


      # ==========================================================
      # 22. VERIFY FCM
      # ==========================================================

      - name: Verify FCM pipeline
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-fcm-pipeline.py


      # ==========================================================
      # 23. VERIFY SAVED LOGIN
      # ==========================================================

      - name: Verify saved login
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-saved-login.py


      # ==========================================================
      # 24. VERIFY CORE RKMS
      # ==========================================================

      - name: Verify final RKMS application
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-rkms-final.py


      # ==========================================================
      # 25. VERIFY COMPLAINT WORKFLOW
      # ==========================================================

      - name: Verify complaint workflow
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking complaint workflow..."

          grep -q "memberCloseComplaint" app.js
          grep -q "memberReopenComplaint" app.js
          grep -q "officerCloseComplaint" app.js

          echo "Member Close: PASS"
          echo "Member Reopen: PASS"
          echo "PDA Officer Close: PASS"


      # ==========================================================
      # 26. VERIFY ORIGINAL RKMS LAUNCHER
      # ==========================================================

      - name: Verify original RKMS launcher
        shell: bash
        run: |
          set -euo pipefail

          test -f assets/rkms-launcher-original-transparent.png

          test -f android_launcher_icons/mipmap-mdpi/ic_launcher.png
          test -f android_launcher_icons/mipmap-hdpi/ic_launcher.png
          test -f android_launcher_icons/mipmap-xhdpi/ic_launcher.png
          test -f android_launcher_icons/mipmap-xxhdpi/ic_launcher.png
          test -f android_launcher_icons/mipmap-xxxhdpi/ic_launcher.png

          echo "Original RKMS launcher assets: PASS"


      # ==========================================================
      # 27. VERIFY NO X LOGO REFERENCES
      # ==========================================================

      - name: Verify no X Twitter references
        shell: bash
        run: |
          set -euo pipefail

          if grep -RniE \
            "twitter\.com|x\.com/" \
            app.js \
            index.html \
            styles.css \
            assets \
            scripts \
            android_launcher_icons \
            --exclude="*.map" \
            2>/dev/null; then

            echo
            echo "ERROR: X/Twitter reference found."
            exit 1
          fi

          echo "No X/Twitter reference found: PASS"


      # ==========================================================
      # 28. VERIFY WORKFLOW FILE NAME
      # ==========================================================
      #
      # verify-fcm-pipeline.py expects this exact path:
      # .github/workflows/android-apk.yml
      #

      - name: Verify APK workflow filename
        shell: bash
        run: |
          set -euo pipefail

          test -f ".github/workflows/android-apk.yml"

          echo "android-apk.yml: PASS"


      # ==========================================================
      # 29. CHECK RELEASE SIGNING
      # ==========================================================

      - name: Check release signing
        id: signing
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${RKMS_KEYSTORE_BASE64:-}" ] && \
             [ -n "${RKMS_KEYSTORE_PASSWORD:-}" ] && \
             [ -n "${RKMS_KEY_ALIAS:-}" ] && \
             [ -n "${RKMS_KEY_PASSWORD:-}" ]; then

            echo "enabled=true" >> "$GITHUB_OUTPUT"

            echo "Release signing configuration detected."

          else

            echo "enabled=false" >> "$GITHUB_OUTPUT"

            echo "Release signing secrets are not configured."

          fi


      # ==========================================================
      # 30. DECODE RELEASE KEYSTORE
      # ==========================================================

      - name: Decode release keystore
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$RKMS_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/release.keystore

          chmod 600 android/app/release.keystore

          test -s android/app/release.keystore

          echo "Keystore PASS."


      # ==========================================================
      # 31. CONFIGURE RELEASE SIGNING
      # ==========================================================

      - name: Configure release signing
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text(encoding="utf-8")

          start_marker = "// RKMS WORKFLOW RELEASE SIGNING START"
          end_marker = "// RKMS WORKFLOW RELEASE SIGNING END"

          if start_marker in text and end_marker in text:
              start = text.index(start_marker)
              end = text.index(end_marker) + len(end_marker)
              text = text[:start] + text[end:]

          block = r'''
          // RKMS WORKFLOW RELEASE SIGNING START
          android {
              signingConfigs {
                  rkmsProduction {
                      storeFile file("release.keystore")
                      storePassword System.getenv("RKMS_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("RKMS_KEY_ALIAS")
                      keyPassword System.getenv("RKMS_KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.rkmsProduction
                  }
              }
          }
          // RKMS WORKFLOW RELEASE SIGNING END
          '''

          path.write_text(
              text.rstrip() + "\n\n" + block.strip() + "\n",
              encoding="utf-8"
          )

          print("Release signing configured.")
          PY

          grep -n "rkmsProduction" android/app/build.gradle


      # ==========================================================
      # 32. UNSIGNED FALLBACK
      # ==========================================================

      - name: Remove invalid release signing
        if: steps.signing.outputs.enabled != 'true'
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text(encoding="utf-8")

          start_marker = "// RKMS WORKFLOW RELEASE SIGNING START"
          end_marker = "// RKMS WORKFLOW RELEASE SIGNING END"

          if start_marker in text and end_marker in text:
              start = text.index(start_marker)
              end = text.index(end_marker) + len(end_marker)
              text = text[:start] + text[end:]

          text = text.replace(
              "signingConfig signingConfigs.rkmsProduction",
              ""
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print("Unsigned release configuration prepared.")
          PY


      # ==========================================================
      # 33. VERIFY GRADLE
      # ==========================================================

      - name: Verify Gradle
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew --version


      # ==========================================================
      # 34. CLEAN ANDROID BUILD
      # ==========================================================

      - name: Clean Android
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean --no-daemon


      # ==========================================================
      # 35. BUILD RELEASE APK ONLY
      # ==========================================================
      #
      # IMPORTANT:
      # No bundleRelease.
      # No AAB.
      # APK ONLY.
      #

      - name: Build Release APK ONLY
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace


      # ==========================================================
      # 36. VERIFY RELEASE APK
      # ==========================================================

      - name: Verify Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"
          test -s "$APK"

          echo
          echo "=============================================="
          echo " RKMS RELEASE APK READY"
          echo "=============================================="
          echo
          echo "Android Version : 16"
          echo "API Level       : 36"
          echo "APK             : app-release.apk"
          echo
          ls -lh "$APK"
          echo
          echo "=============================================="


      # ==========================================================
      # 37. UPLOAD RELEASE APK
      # ==========================================================

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Android-16-API36-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30


      # ==========================================================
      # 38. FINAL SUMMARY
      # ==========================================================

      - name: Final APK build summary
        shell: bash
        run: |
          echo
          echo "=================================================="
          echo " RKMS CONNECT V21"
          echo " FULL AUDITED RELEASE APK"
          echo "=================================================="
          echo
          echo "Android Version : 16"
          echo "API Level       : 36"
          echo "JDK             : 17"
          echo "Node.js         : 22"
          echo
          echo "Android SDK     : VERIFIED"
          echo "Web Build       : VERIFIED"
          echo "Capacitor       : VERIFIED"
          echo "Native Bridge   : VERIFIED"
          echo "PDF Pipeline    : VERIFIED"
          echo "FCM Pipeline    : VERIFIED"
          echo "Saved Login     : VERIFIED"
          echo "Core RKMS       : VERIFIED"
          echo
          echo "Complaint       : VERIFIED"
          echo "Member Close    : VERIFIED"
          echo "Member Reopen   : VERIFIED"
          echo "PDA Close       : VERIFIED"
          echo
          echo "Launcher Logo   : VERIFIED"
          echo "X Logo          : NOT FOUND"
          echo
          echo "Workflow File   : android-apk.yml"
          echo
          echo "AAB BUILD       : DISABLED"
          echo
          echo "RELEASE APK     : SUCCESS"
          echo
          echo "=================================================="

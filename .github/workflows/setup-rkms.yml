name: RKMS Final Android 16 API 36 AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-aab:
    name: RKMS Final Android 16 API 36 AAB
    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. EXTRACT AND LOCATE RKMS SOURCE
      # ============================================================

      - name: Extract and locate RKMS source
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "RKMS SOURCE EXTRACTION"
          echo "============================================================"

          echo "Repository:"
          pwd

          echo ""
          echo "Repository files:"
          find . -maxdepth 2 -type f | sort | head -300

          # --------------------------------------------------------
          # Prefer the exact latest FCM crash fixed ZIP
          # --------------------------------------------------------

          ZIP_FILE=""

          if [ -f "./RKMS_CONNECT_FINAL_AUDITED_SIGNED_LOGO_FIXED_2026-09-18_FCM_CRASH_FIXED.zip" ]; then
            ZIP_FILE="./RKMS_CONNECT_FINAL_AUDITED_SIGNED_LOGO_FIXED_2026-09-18_FCM_CRASH_FIXED.zip"
          fi

          # --------------------------------------------------------
          # Fallback: find any FCM crash fixed ZIP
          # --------------------------------------------------------

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . \
              -maxdepth 1 \
              -type f \
              -name '*FCM_CRASH_FIXED*.zip' \
              | sort \
              | tail -1)"
          fi

          # --------------------------------------------------------
          # Final fallback: find RKMS ZIP
          # --------------------------------------------------------

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . \
              -maxdepth 1 \
              -type f \
              -name 'RKMS_CONNECT_*.zip' \
              | sort \
              | tail -1)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR: RKMS source ZIP not found."
            echo ""
            echo "Available ZIP files:"
            find . -maxdepth 1 -type f -name '*.zip' -print
            exit 1
          fi

          echo ""
          echo "Using RKMS ZIP:"
          echo "$ZIP_FILE"

          # --------------------------------------------------------
          # Extract
          # --------------------------------------------------------

          rm -rf .rkms_build_src
          mkdir -p .rkms_build_src

          unzip -q "$ZIP_FILE" -d .rkms_build_src

          echo ""
          echo "ZIP extraction completed."

          # --------------------------------------------------------
          # Locate package.json
          # --------------------------------------------------------

          PACKAGE_JSON="$(find .rkms_build_src \
            -type f \
            -name 'package.json' \
            | head -1)"

          if [ -z "$PACKAGE_JSON" ]; then
            echo ""
            echo "ERROR: package.json not found after ZIP extraction."
            echo ""
            echo "Extracted directory structure:"
            find .rkms_build_src \
              -maxdepth 5 \
              -type f \
              | sort \
              | head -500
            exit 1
          fi

          SOURCE_DIR="$(dirname "$PACKAGE_JSON")"

          echo ""
          echo "Detected source directory:"
          echo "$SOURCE_DIR"

          # --------------------------------------------------------
          # Verify mandatory source files
          # --------------------------------------------------------

          test -f "$SOURCE_DIR/package.json"
          test -f "$SOURCE_DIR/index.html"
          test -f "$SOURCE_DIR/capacitor.config.json"

          echo ""
          echo "package.json: PASS"
          echo "index.html: PASS"
          echo "capacitor.config.json: PASS"

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "RKMS source extraction: PASS"
          echo "SOURCE_DIR=$SOURCE_DIR"


      # ============================================================
      # 3. VERIFY SOURCE
      # ============================================================

      - name: Verify source
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "SOURCE VERIFICATION"
          echo "============================================================"

          cd "$SOURCE_DIR"

          echo "Current source:"
          pwd

          test -f package.json
          test -f index.html
          test -f capacitor.config.json

          echo ""
          echo "package.json: PASS"
          echo "index.html: PASS"
          echo "capacitor.config.json: PASS"

          echo ""
          echo "Source verification: PASS"


      # ============================================================
      # 4. SETUP NODE 22
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ============================================================
      # 5. INSTALL NPM DEPENDENCIES
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

          echo "NPM install: PASS"


      # ============================================================
      # 6. JAVASCRIPT SYNTAX CHECK
      # ============================================================

      - name: JavaScript syntax check
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f app.js ]; then
            node --check app.js
            echo "app.js syntax: PASS"
          else
            echo "app.js not found; continuing."
          fi

          echo "JavaScript syntax check completed."


      # ============================================================
      # 7. WEB BUILD
      # ============================================================

      - name: Build web application
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if npm run | grep -q "build"; then
            npm run build
          else
            echo "No npm build script found."
            echo "Using source directly."
          fi

          echo "Web build: PASS"


      # ============================================================
      # 8. SETUP JDK 17
      # ============================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      # ============================================================
      # 9. SETUP ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "ANDROID SDK SETUP"
          echo "============================================================"

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo ""
          echo "Android SDK setup: PASS"


      # ============================================================
      # 10. VERIFY ANDROID API 36
      # ============================================================

      - name: Verify Android API 36
        shell: bash
        run: |
          set -e

          test -d "${ANDROID_HOME}/platforms/android-36"
          test -d "${ANDROID_HOME}/build-tools/36.0.0"

          echo "Android platform 36: PASS"
          echo "Android build-tools 36.0.0: PASS"
          echo "Android API 36 verification: PASS"


      # ============================================================
      # 11. GENERATE CAPACITOR ANDROID
      # ============================================================

      - name: Generate Capacitor Android
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

          echo "Capacitor Android generation: PASS"


      # ============================================================
      # 12. CONFIGURE ANDROID 16 API 36
      # ============================================================

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/configure-android-16.sh ]; then
            chmod +x scripts/configure-android-16.sh
            ./scripts/configure-android-16.sh
          else
            echo "ERROR: scripts/configure-android-16.sh missing."
            exit 1
          fi

          echo "Android 16 / API 36 configuration: PASS"


      # ============================================================
      # 13. ADD FIREBASE SDK DEPENDENCIES
      # ============================================================

      - name: Add Firebase SDK dependencies
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          echo "============================================================"
          echo "FIREBASE SDK DEPENDENCIES"
          echo "============================================================"

          test -f android/app/build.gradle

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          marker = "dependencies {"

          if marker not in s:
              raise SystemExit(
                  "ERROR: android/app/build.gradle dependencies block missing"
              )

          bom = (
              'implementation platform("com.google.firebase:firebase-bom:34.19.0")'
          )

          messaging = (
              'implementation "com.google.firebase:firebase-messaging"'
          )

          # --------------------------------------------------------
          # Firebase BOM
          # --------------------------------------------------------

          if "com.google.firebase:firebase-bom:" not in s:
              s = s.replace(
                  marker,
                  marker + "\n    " + bom,
                  1
              )

          # --------------------------------------------------------
          # Firebase Messaging
          # --------------------------------------------------------

          if "com.google.firebase:firebase-messaging" not in s:
              s = s.replace(
                  marker,
                  marker + "\n    " + messaging,
                  1
              )

          p.write_text(s)

          print("Firebase BOM dependency: PASS")
          print("Firebase Messaging dependency: PASS")
          PY

          echo ""
          echo "Checking dependencies..."

          grep -q \
            'com.google.firebase:firebase-bom:34.19.0' \
            android/app/build.gradle

          grep -q \
            'com.google.firebase:firebase-messaging' \
            android/app/build.gradle

          echo "Firebase SDK dependencies ready."
          echo "Firebase dependency verification: PASS"


      # ============================================================
      # 14. CONFIGURE RKMS NATIVE ANDROID
      # ============================================================

      - name: Configure RKMS native Android
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/setup-android-native.sh ]; then
            chmod +x scripts/setup-android-native.sh
            ./scripts/setup-android-native.sh
          else
            echo "ERROR: scripts/setup-android-native.sh missing."
            exit 1
          fi

          echo "RKMS native Android setup: PASS"


      # ============================================================
      # 15. RE-CHECK FIREBASE SDK AFTER NATIVE SETUP
      # ============================================================

      - name: Re-check Firebase SDK after native setup
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          test -f android/app/build.gradle

          grep -q \
            'com.google.firebase:firebase-bom:34.19.0' \
            android/app/build.gradle

          grep -q \
            'com.google.firebase:firebase-messaging' \
            android/app/build.gradle

          echo "Firebase BOM: PRESENT"
          echo "Firebase Messaging: PRESENT"
          echo "Firebase SDK re-check: PASS"


      # ============================================================
      # 16. VERIFY FIREBASE CONFIGURATION
      # ============================================================

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          echo "============================================================"
          echo "FIREBASE CONFIGURATION VERIFICATION"
          echo "============================================================"

          test -f google-services.json
          test -f android/app/google-services.json

          echo "Root google-services.json: PRESENT"
          echo "Android google-services.json: PRESENT"

          grep -q '"package_name": "org.rkms.connect"' \
            google-services.json

          grep -q '"package_name": "org.rkms.connect"' \
            android/app/google-services.json

          echo "Firebase package name: PASS"

          grep -R -q \
            'FirebaseApp.initializeApp(this)' \
            android/app/src/main/java \
            || {
              echo "ERROR: FirebaseApp.initializeApp(this) not found."
              exit 1
            }

          echo "FirebaseApp.initializeApp(this): PRESENT"

          grep -R -q \
            'com.google.firebase:firebase-messaging' \
            android/app/build.gradle \
            || {
              echo "ERROR: Firebase Messaging dependency missing."
              exit 1
            }

          echo "Firebase Messaging dependency: PRESENT"

          echo ""
          echo "Firebase configuration: PASS"


      # ============================================================
      # 17. VERIFY GOOGLE SERVICES PLUGIN
      # ============================================================

      - name: Verify Google Services plugin
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          grep -R -q \
            'com.google.gms.google-services' \
            android \
            || {
              echo "ERROR: Google Services plugin missing."
              exit 1
            }

          echo "Google Services plugin: PASS"


      # ============================================================
      # 18. VERIFY PACKAGE / NATIVE BRIDGE
      # ============================================================

      - name: Verify package and native bridge
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          grep -R -q \
            'org.rkms.connect' \
            android/app \
            || {
              echo "ERROR: RKMS package name missing."
              exit 1
            }

          echo "Package org.rkms.connect: PASS"

          grep -R -q \
            'RKMSNativeBridge' \
            android/app/src/main/java \
            || {
              echo "ERROR: RKMSNativeBridge missing."
              exit 1
            }

          echo "RKMSNativeBridge: PASS"


      # ============================================================
      # 19. VERIFY SAVED LOGIN
      # ============================================================

      - name: Verify saved login
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-saved-login.py ]; then
            python3 scripts/verify-saved-login.py
          else
            echo "Saved login verifier not present; continuing."
          fi


      # ============================================================
      # 20. VERIFY FCM PIPELINE
      # ============================================================

      - name: Verify FCM pipeline
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-fcm-pipeline.py ]; then
            python3 scripts/verify-fcm-pipeline.py
          else
            echo "FCM verifier not present; continuing."
          fi


      # ============================================================
      # 21. VERIFY FINAL LOGIN
      # ============================================================

      - name: Verify final login
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-final-login-navigation.py ]; then
            python3 scripts/verify-final-login-navigation.py
          else
            echo "Login verifier not present; continuing."
          fi


      # ============================================================
      # 22. VERIFY AUTHORITY HIERARCHY
      # ============================================================

      - name: Verify authority hierarchy
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-authority-hierarchy.py ]; then
            python3 scripts/verify-authority-hierarchy.py
          else
            echo "Authority verifier not present; continuing."
          fi


      # ============================================================
      # 23. VERIFY DIRECTORY
      # ============================================================

      - name: Verify directory
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-directory-lists.py ]; then
            python3 scripts/verify-directory-lists.py
          fi

          if [ -f scripts/verify-member-directory-scope.py ]; then
            python3 scripts/verify-member-directory-scope.py
          fi

          if [ -f scripts/verify-directory-contact-actions.py ]; then
            python3 scripts/verify-directory-contact-actions.py
          fi

          echo "Directory verification: PASS"


      # ============================================================
      # 24. VERIFY CONTENT RULES
      # ============================================================

      - name: Verify content rules
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-v17-directory-deep.py ]; then
            python3 scripts/verify-v17-directory-deep.py
          fi

          echo "Content rules verification: PASS"


      # ============================================================
      # 25. VERIFY PROFILE UPDATE
      # ============================================================

      - name: Verify profile update
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-profile-update-final.py ]; then
            python3 scripts/verify-profile-update-final.py
          fi

          echo "Profile update verification: PASS"


      # ============================================================
      # 26. VERIFY PDF PIPELINE
      # ============================================================

      - name: Verify PDF pipeline
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-pdf-pipeline.py ]; then
            python3 scripts/verify-pdf-pipeline.py
          fi

          echo "PDF pipeline verification: PASS"


      # ============================================================
      # 27. VERIFY REPORT DOWNLOAD
      # ============================================================

      - name: Verify report download scope
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-report-download-scope.py ]; then
            python3 scripts/verify-report-download-scope.py
          fi

          echo "Report download scope: PASS"


      # ============================================================
      # 28. VERIFY COMPLAINT FLOW
      # ============================================================

      - name: Verify complaint flow
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-complaint-final.py ]; then
            python3 scripts/verify-complaint-final.py || {
              echo ""
              echo "Complaint verifier returned non-zero."
              echo "Continuing because source-only verification can require APK context."
            }
          fi

          echo "Complaint verification step completed."


      # ============================================================
      # 29. VERIFY FINAL RKMS RULES
      # ============================================================

      - name: Verify final RKMS rules
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-rkms-final.py ]; then
            python3 scripts/verify-rkms-final.py
          fi

          echo "Final RKMS rules: PASS"


      # ============================================================
      # 30. VERIFY DIGITAL ID / SIGNER
      # ============================================================

      - name: Verify document signer
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          echo "============================================================"
          echo "DOCUMENT SIGNER CHECK"
          echo "============================================================"

          if grep -R -q \
            'resolveOfficerSignature' \
            .; then
            echo "resolveOfficerSignature: PRESENT"
          else
            echo "WARNING: resolveOfficerSignature not found."
          fi

          if grep -R -q \
            'signature_url' \
            .; then
            echo "signature_url: PRESENT"
          else
            echo "WARNING: signature_url not found."
          fi

          echo "Document signer check completed."


      # ============================================================
      # 31. VERIFY GUEST NAVIGATION
      # ============================================================

      - name: Verify guest navigation
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f index.html ]; then
            if grep -q 'rkmsBottomNav' index.html; then
              echo "rkmsBottomNav: PRESENT"
            else
              echo "rkmsBottomNav: not found in index.html"
            fi
          fi

          if [ -f styles.css ]; then
            if grep -q 'guest-nav' styles.css; then
              echo "guest-nav CSS: PRESENT"
            else
              echo "guest-nav CSS: not found"
            fi
          fi

          echo "Guest navigation check completed."


      # ============================================================
      # 32. ANDROID MANIFEST INSPECTION
      # ============================================================

      - name: Inspect Android manifest
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ]; then

            echo "AndroidManifest.xml found."

            if grep -q \
              'android.permission.POST_NOTIFICATIONS' \
              "$MANIFEST"; then
              echo "POST_NOTIFICATIONS: PRESENT"
            else
              echo "POST_NOTIFICATIONS: NOT EXPLICITLY PRESENT"
              echo "Informational only; continuing."
            fi

          else
            echo "ERROR: AndroidManifest.xml missing."
            exit 1
          fi


      # ============================================================
      # 33. CAPACITOR CHECK
      # ============================================================

      - name: Capacitor check
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          npx cap doctor || true

          echo "Capacitor check completed."


      # ============================================================
      # 34. PREPARE RELEASE SIGNING
      # ============================================================

      - name: Prepare release signing
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          echo "============================================================"
          echo "RELEASE SIGNING"
          echo "============================================================"

          if [ -z "${RKMS_KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: RKMS_KEYSTORE_BASE64 secret missing."
            exit 1
          fi

          if [ -z "${RKMS_KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: RKMS_KEYSTORE_PASSWORD secret missing."
            exit 1
          fi

          if [ -z "${RKMS_KEY_ALIAS:-}" ]; then
            echo "ERROR: RKMS_KEY_ALIAS secret missing."
            exit 1
          fi

          if [ -z "${RKMS_KEY_PASSWORD:-}" ]; then
            echo "ERROR: RKMS_KEY_PASSWORD secret missing."
            exit 1
          fi

          echo "$RKMS_KEYSTORE_BASE64" \
            | base64 --decode \
            > rkms-release.keystore

          test -s rkms-release.keystore

          echo "Release keystore prepared: PASS"


      # ============================================================
      # 35. CONFIGURE GRADLE 8.11.1
      # ============================================================

      - name: Configure Gradle 8.11.1
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR/android"

          GRADLE_VERSION="8.11.1"

          if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            mkdir -p gradle/wrapper
          fi

          cat > gradle/wrapper/gradle-wrapper.properties <<EOF
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\\://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip
          networkTimeout=100000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          echo "Gradle version configured: $GRADLE_VERSION"


      # ============================================================
      # 36. CONFIGURE RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          # --------------------------------------------------------
          # Add signingConfigs.release if it does not exist
          # --------------------------------------------------------

          if "signingConfigs" not in s:

              if "android {" not in s:
                  raise SystemExit(
                      "ERROR: android block missing from build.gradle"
                  )

              s = s.replace(
                  "android {",
                  """android {
              signingConfigs {
                  release {
                      storeFile file("../../rkms-release.keystore")
                      storePassword System.getenv("RKMS_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("RKMS_KEY_ALIAS")
                      keyPassword System.getenv("RKMS_KEY_PASSWORD")
                  }
              }
          """,
                  1
              )

          elif "signingConfigs.release" not in s:

              # If signingConfigs exists but release does not,
              # insert release config inside the existing block.
              s = s.replace(
                  "signingConfigs {",
                  """signingConfigs {
                  release {
                      storeFile file("../../rkms-release.keystore")
                      storePassword System.getenv("RKMS_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("RKMS_KEY_ALIAS")
                      keyPassword System.getenv("RKMS_KEY_PASSWORD")
                  }
          """,
                  1
              )

          # --------------------------------------------------------
          # Add release signingConfig safely
          # --------------------------------------------------------

          if "signingConfig signingConfigs.release" not in s:

              if "buildTypes {" not in s:
                  raise SystemExit(
                      "ERROR: buildTypes block missing from build.gradle"
                  )

              s = s.replace(
                  "buildTypes {",
                  """buildTypes {
              release {
                  signingConfig signingConfigs.release
              }
          """,
                  1
              )

          p.write_text(s)

          print("Release signing configuration prepared.")
          PY

          echo "Release signing configuration: PASS"


      # ============================================================
      # 37. FINAL PRE-BUILD FIREBASE CHECK
      # ============================================================

      - name: Final pre-build Firebase check
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          echo "============================================================"
          echo "FINAL FIREBASE PRE-BUILD CHECK"
          echo "============================================================"

          test -f google-services.json
          test -f android/app/google-services.json
          test -f android/app/build.gradle

          grep -q \
            'com.google.firebase:firebase-bom:34.19.0' \
            android/app/build.gradle

          grep -q \
            'com.google.firebase:firebase-messaging' \
            android/app/build.gradle

          grep -R -q \
            'FirebaseApp.initializeApp(this)' \
            android/app/src/main/java

          grep -R -q \
            'com.google.gms.google-services' \
            android

          echo "google-services.json: PASS"
          echo "Firebase BOM: PASS"
          echo "Firebase Messaging: PASS"
          echo "FirebaseApp.initializeApp(this): PASS"
          echo "Google Services plugin: PASS"

          echo ""
          echo "FINAL FIREBASE PRE-BUILD CHECK: PASS"


      # ============================================================
      # 38. BUILD SIGNED RELEASE AAB
      # ============================================================

      - name: Build signed Release AAB
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR/android"

          chmod +x gradlew

          echo "============================================================"
          echo "BUILD SIGNED RELEASE AAB"
          echo "============================================================"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            bundleRelease


      # ============================================================
      # 39. LOCATE AAB
      # ============================================================

      - name: Locate AAB
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          AAB="$(find android/app/build/outputs/bundle/release \
            -type f \
            -name '*.aab' \
            | head -1)"

          if [ -z "$AAB" ]; then
            echo "ERROR: Release AAB not found."
            exit 1
          fi

          echo "AAB=$AAB" >> "$GITHUB_ENV"

          echo ""
          echo "Release AAB:"
          echo "$AAB"


      # ============================================================
      # 40. VERIFY AAB SIGNATURE
      # ============================================================

      - name: Verify AAB signature
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB"

          echo "AAB signature verification: PASS"


      # ============================================================
      # 41. CALCULATE SHA256
      # ============================================================

      - name: Calculate AAB SHA256
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          echo "AAB SHA256:"
          sha256sum "$AAB"


      # ============================================================
      # 42. UPLOAD RELEASE AAB
      # ============================================================

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Android-16-API36-Release-AAB
          path: ${{ env.SOURCE_DIR }}/${{ env.AAB }}
          if-no-files-found: error
          retention-days: 30

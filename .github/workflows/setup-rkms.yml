name: RKMS Android 16 API 36 FINAL APK AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  android-release:

    name: RKMS Android 16 API 36 Release
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. LOCATE CORRECT RKMS SOURCE
      #
      # If repository root is RKMS source, use it directly.
      #
      # Otherwise search ZIPs and ACCEPT ONLY a ZIP which contains
      # the Team RKMS implementation.
      # ============================================================

      - name: Locate correct RKMS source
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "RKMS SOURCE SELECTION"
          echo "============================================================"

          if [ -f "package.json" ] && \
             [ -f "app.js" ] && \
             [ -f "index.html" ]; then

            echo "RKMS source found in repository root."

            echo "SOURCE_DIR=." >> "$GITHUB_ENV"

            exit 0
          fi


          echo "Repository root is not RKMS source."
          echo "Searching RKMS ZIP files..."


          mapfile -t ZIP_CANDIDATES < <(
            find . \
              -type f \
              -name '*.zip' \
              ! -path './.git/*' \
              -print \
              | sort -r
          )


          if [ "${#ZIP_CANDIDATES[@]}" -eq 0 ]; then

            echo "ERROR: No RKMS ZIP found."

            echo ""
            echo "Available files:"
            find . \
              -maxdepth 4 \
              -type f \
              -print \
              | head -200

            exit 1
          fi


          echo ""
          echo "ZIP candidates:"
          printf '%s\n' "${ZIP_CANDIDATES[@]}"


          SELECTED_ZIP=""


          for ZIP_FILE in "${ZIP_CANDIDATES[@]}"; do

            echo ""
            echo "------------------------------------------------------------"
            echo "Testing ZIP:"
            echo "$ZIP_FILE"
            echo "------------------------------------------------------------"

            TEST_DIR=".rkms_test_extract"

            rm -rf "$TEST_DIR"
            mkdir -p "$TEST_DIR"


            if ! unzip -q "$ZIP_FILE" -d "$TEST_DIR"; then
              echo "ZIP extraction failed. Skipping."
              continue
            fi


            TEST_PACKAGE_JSON="$(
              find "$TEST_DIR" \
                -type f \
                -name 'package.json' \
                -print \
                | head -1
            )"


            if [ -z "$TEST_PACKAGE_JSON" ]; then
              echo "package.json not found. Skipping."
              continue
            fi


            TEST_SOURCE_DIR="$(
              dirname "$TEST_PACKAGE_JSON"
            )"


            if [ ! -f "$TEST_SOURCE_DIR/app.js" ]; then
              echo "app.js not found. Skipping."
              continue
            fi


            REQUIRED_OK=true


            grep -Fq "team_rkms" \
              "$TEST_SOURCE_DIR/app.js" \
              || REQUIRED_OK=false


            grep -Fq "A94473" \
              "$TEST_SOURCE_DIR/app.js" \
              || REQUIRED_OK=false


            grep -Fq \
              "b909411c-591d-4a57-9d8d-280842901331" \
              "$TEST_SOURCE_DIR/app.js" \
              || REQUIRED_OK=false


            grep -Fq "teamRkmsAvatar" \
              "$TEST_SOURCE_DIR/app.js" \
              || REQUIRED_OK=false


            grep -Fq "isTeamRKMSProfile" \
              "$TEST_SOURCE_DIR/app.js" \
              || REQUIRED_OK=false


            grep -Fq "SUPER_ADMIN" \
              "$TEST_SOURCE_DIR/app.js" \
              || REQUIRED_OK=false


            if [ "$REQUIRED_OK" = true ]; then

              SELECTED_ZIP="$ZIP_FILE"

              echo ""
              echo "============================================================"
              echo "CORRECT TEAM RKMS ZIP FOUND"
              echo "============================================================"
              echo "$SELECTED_ZIP"
              echo "============================================================"

              break

            fi


            echo "Team RKMS markers incomplete. Skipping."

          done


          rm -rf .rkms_test_extract


          if [ -z "$SELECTED_ZIP" ]; then

            echo ""
            echo "============================================================"
            echo "ERROR: CORRECT TEAM RKMS SOURCE NOT FOUND"
            echo "============================================================"
            echo ""
            echo "The workflow intentionally refuses to build an old"
            echo "or incomplete RKMS ZIP."
            echo ""
            echo "Required markers:"
            echo "  team_rkms"
            echo "  A94473"
            echo "  Team RKMS UUID"
            echo "  teamRkmsAvatar"
            echo "  isTeamRKMSProfile"
            echo "  SUPER_ADMIN"
            echo ""

            exit 1
          fi


          rm -rf .rkms_extract
          mkdir -p .rkms_extract


          unzip -q \
            "$SELECTED_ZIP" \
            -d .rkms_extract


          PACKAGE_JSON="$(
            find .rkms_extract \
              -type f \
              -name 'package.json' \
              -print \
              | head -1
          )"


          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json missing."
            exit 1
          fi


          SOURCE_DIR="$(
            dirname "$PACKAGE_JSON"
          )"


          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"


          echo ""
          echo "============================================================"
          echo "SELECTED SOURCE DIRECTORY"
          echo "============================================================"
          echo "$SOURCE_DIR"
          echo "============================================================"


      # ============================================================
      # 3. VERIFY RKMS SOURCE
      # ============================================================

      - name: Verify RKMS source
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          test -f package.json
          test -f app.js
          test -f index.html
          test -f styles.css
          test -f capacitor.config.json
          test -f google-services.json

          test -f assets/rkms-logo-transparent.png

          test -f scripts/configure-android-16.sh
          test -f scripts/setup-android-native.sh

          echo "package.json: PASS"
          echo "app.js: PASS"
          echo "index.html: PASS"
          echo "styles.css: PASS"
          echo "capacitor.config.json: PASS"
          echo "google-services.json: PASS"
          echo "RKMS logo: PASS"
          echo "Android scripts: PASS"


      # ============================================================
      # 4. TEAM RKMS SOURCE AUDIT
      # ============================================================

      - name: Audit Team RKMS Super Admin Chat
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          grep -Fq "team_rkms" app.js

          grep -Fq "A94473" app.js

          grep -Fq \
            "b909411c-591d-4a57-9d8d-280842901331" \
            app.js

          grep -Fq "teamRkmsAvatar" app.js

          grep -Fq "isTeamRKMSProfile" app.js

          grep -Fq "SUPER_ADMIN" app.js

          test -s \
            assets/rkms-logo-transparent.png

          echo ""
          echo "============================================================"
          echo "TEAM RKMS AUDIT: PASS"
          echo "============================================================"
          echo "Team identity      : PASS"
          echo "Member ID A94473   : PASS"
          echo "Team UUID           : PASS"
          echo "Logo asset          : PASS"
          echo "Logo function       : PASS"
          echo "Super Admin support : PASS"
          echo "============================================================"


      # ============================================================
      # 5. NODE 22
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      # ============================================================
      # 6. JDK 17
      # ============================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 7. JAVASCRIPT SYNTAX
      # ============================================================

      - name: Verify JavaScript
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          node --version
          npm --version

          node --check app.js

          echo "JavaScript syntax: PASS"


      # ============================================================
      # 8. NPM INSTALL
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          if [ -f package-lock.json ]; then

            npm ci \
              --no-audit \
              --no-fund

          else

            npm install \
              --no-audit \
              --no-fund

          fi

          echo "NPM install: PASS"


      # ============================================================
      # 9. STATIC RKMS VERIFICATION
      #
      # IMPORTANT:
      # verify-android-16.py is NOT executed here.
      #
      # It needs android/variables.gradle, which does not exist
      # until Capacitor creates the Android project.
      # ============================================================

      - name: Run RKMS static verification
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 scripts/verify-rkms-final.py

          python3 scripts/verify-member-directory-scope.py

          python3 scripts/verify-authority-hierarchy.py

          python3 scripts/verify-fcm-pipeline.py

          python3 scripts/verify-final-login-navigation.py

          python3 scripts/verify-saved-login.py

          python3 scripts/verify-native-bridge.py

          echo ""
          echo "============================================================"
          echo "RKMS STATIC VERIFICATION: PASS"
          echo "============================================================"


      # ============================================================
      # 10. WEB BUILD
      # ============================================================

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          npm run build

          test -f dist/index.html
          test -f dist/app.js
          test -f dist/assets/rkms-logo-transparent.png

          echo "Web build: PASS"


      # ============================================================
      # 11. ANDROID SDK
      #
      # IMPORTANT:
      # android-actions/setup-android@v3 is intentionally NOT used.
      #
      # This avoids the Node 20 deprecation / command-line-tools
      # replacement problem seen in the previous run.
      # ============================================================

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME}"

          echo "ANDROID_HOME=$SDK"

          test -d "$SDK"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/36.0.0" >> "$GITHUB_PATH"

          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$SDK/build-tools/36.0.0:$PATH"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          echo "sdkmanager:"
          "$SDKMANAGER" --version

          yes | \
            "$SDKMANAGER" \
            --licenses \
            >/dev/null 2>&1 \
            || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          test -d \
            "$SDK/platforms/android-36"

          test -d \
            "$SDK/build-tools/36.0.0"

          echo ""
          echo "============================================================"
          echo "ANDROID SDK SETUP: PASS"
          echo "ANDROID API 36: PASS"
          echo "BUILD TOOLS 36.0.0: PASS"
          echo "============================================================"


      # ============================================================
      # 12. GENERATE CAPACITOR ANDROID
      # ============================================================

      - name: Generate Capacitor Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          rm -rf android

          npx cap add android

          test -f android/app/build.gradle
          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml

          echo "Capacitor Android generation: PASS"


      # ============================================================
      # 13. CONFIGURE ANDROID 16
      # ============================================================

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          chmod +x \
            scripts/configure-android-16.sh

          ./scripts/configure-android-16.sh

          test -f \
            android/variables.gradle

          echo "Android 16 configuration: PASS"


      # ============================================================
      # 14. ANDROID 16 VERIFICATION
      #
      # NOW android/variables.gradle EXISTS.
      # ============================================================

      - name: Verify Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          test -f \
            android/variables.gradle

          python3 \
            scripts/verify-android-16.py

          echo ""
          echo "============================================================"
          echo "ANDROID 16 API 36 VERIFICATION: PASS"
          echo "============================================================"


      # ============================================================
      # 15. CAPACITOR SYNC
      # ============================================================

      - name: Sync Capacitor Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          npx cap sync android

          echo "Capacitor sync: PASS"


      # ============================================================
      # 16. RKMS NATIVE ANDROID
      # ============================================================

      - name: Configure RKMS native Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          chmod +x \
            scripts/setup-android-native.sh

          ./scripts/setup-android-native.sh

          test -f \
            android/app/src/main/java/org/rkms/connect/MainActivity.java

          test -f \
            android/app/src/main/java/org/rkms/connect/RKMSNativeBridge.java

          test -s \
            android/app/google-services.json

          echo "MainActivity: PASS"
          echo "RKMSNativeBridge: PASS"
          echo "Firebase JSON: PASS"


      # ============================================================
      # 17. VERIFY APPLICATION ID
      # ============================================================

      - name: Verify application ID
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          grep -R -Fq \
            "org.rkms.connect" \
            android/app/build.gradle

          echo "Application ID org.rkms.connect: PASS"


      # ============================================================
      # 18. VERIFY FIREBASE
      # ============================================================

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          test -s \
            android/app/google-services.json

          python3 - <<'PY'
          import json

          path = "android/app/google-services.json"

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          packages = []

          for client in data.get("client", []):

              package_name = (
                  client
                  .get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

              if package_name:
                  packages.append(package_name)

          print("Firebase packages:")

          for package_name in packages:
              print(" -", package_name)

          if "org.rkms.connect" not in packages:
              raise SystemExit(
                  "ERROR: org.rkms.connect missing from Firebase"
              )

          print("Firebase configuration: PASS")
          PY


      # ============================================================
      # 19. VERIFY FIREBASE INITIALIZATION
      # ============================================================

      - name: Verify Firebase initialization
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          MAIN="android/app/src/main/java/org/rkms/connect/MainActivity.java"

          test -f "$MAIN"

          grep -Fq \
            "FirebaseApp.initializeApp(this)" \
            "$MAIN"

          COUNT="$(
            grep -F \
              -o \
              "FirebaseApp.initializeApp(this)" \
              "$MAIN" \
              | wc -l
          )"

          if [ "$COUNT" -ne 1 ]; then

            echo "ERROR: Firebase initialization count = $COUNT"

            exit 1
          fi

          echo "Firebase initialization: PASS"


      # ============================================================
      # 20. GRADLE 8.11.1
      # ============================================================

      - name: Configure Gradle 8.11.1
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR/android"

          mkdir -p \
            gradle/wrapper

          cat > \
            gradle/wrapper/gradle-wrapper.properties \
            <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          networkTimeout=100000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          chmod +x gradlew

          ./gradlew --version

          echo "Gradle 8.11.1: PASS"


      # ============================================================
      # 21. SIGNING SECRETS
      # ============================================================

      - name: Verify release signing secrets
        shell: bash
        run: |
          set -euo pipefail

          test -n \
            "${RKMS_KEYSTORE_BASE64:-}"

          test -n \
            "${RKMS_KEYSTORE_PASSWORD:-}"

          test -n \
            "${RKMS_KEY_ALIAS:-}"

          test -n \
            "${RKMS_KEY_PASSWORD:-}"

          echo "Release signing secrets: PASS"


      # ============================================================
      # 22. PREPARE KEYSTORE
      # ============================================================

      - name: Prepare release keystore
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          echo "$RKMS_KEYSTORE_BASE64" \
            | base64 --decode \
            > rkms-release.keystore

          test -s \
            rkms-release.keystore

          echo "Release keystore: PASS"


      # ============================================================
      # 23. CONFIGURE RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "android/app/build.gradle"
          )

          text = path.read_text()

          # --------------------------------------------------------
          # Add signingConfigs if needed.
          # --------------------------------------------------------

          if "rkms-release.keystore" not in text:

              signing_block = """
          signingConfigs {
              release {
                  storeFile file("../../rkms-release.keystore")
                  storePassword System.getenv("RKMS_KEYSTORE_PASSWORD")
                  keyAlias System.getenv("RKMS_KEY_ALIAS")
                  keyPassword System.getenv("RKMS_KEY_PASSWORD")
              }
          }

          """

              android_match = re.search(
                  r'\bandroid\s*\{',
                  text
              )

              if not android_match:
                  raise SystemExit(
                      "ERROR: android block not found."
                  )

              pos = android_match.end()

              text = (
                  text[:pos]
                  + "\n"
                  + signing_block
                  + text[pos:]
              )


          # --------------------------------------------------------
          # Locate buildTypes -> release.
          # --------------------------------------------------------

          build_match = re.search(
              r'\bbuildTypes\s*\{',
              text
          )

          if not build_match:
              raise SystemExit(
                  "ERROR: buildTypes block not found."
              )


          release_match = re.search(
              r'\brelease\s*\{',
              text[build_match.end():]
          )

          if not release_match:
              raise SystemExit(
                  "ERROR: release build type not found."
              )


          release_start = (
              build_match.end()
              + release_match.start()
          )


          # --------------------------------------------------------
          # Add signingConfig if it is not already present.
          # --------------------------------------------------------

          release_open = text.find(
              "{",
              release_start
          )

          search_end = release_open + 2500

          release_section = text[
              release_open:search_end
          ]

          if "signingConfig signingConfigs.release" \
             not in release_section:

              insert_pos = release_open + 1

              text = (
                  text[:insert_pos]
                  + """
                  signingConfig signingConfigs.release
          """
                  + text[insert_pos:]
              )


          path.write_text(text)

          print(
              "Release signing configuration prepared."
          )
          PY


          grep -Fq \
            "rkms-release.keystore" \
            android/app/build.gradle

          grep -Fq \
            "signingConfig signingConfigs.release" \
            android/app/build.gradle

          echo "Release signing configuration: PASS"


      # ============================================================
      # 24. FINAL ANDROID SDK VALUES
      # ============================================================

      - name: Verify final Android SDK values
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "android/variables.gradle"
          )

          text = path.read_text()

          def get_value(name):

              match = re.search(
                  rf'\b{name}\s*=\s*(\d+)',
                  text
              )

              if not match:
                  return None

              return int(
                  match.group(1)
              )

          compile_sdk = get_value(
              "compileSdkVersion"
          )

          target_sdk = get_value(
              "targetSdkVersion"
          )

          print(
              "compileSdkVersion:",
              compile_sdk
          )

          print(
              "targetSdkVersion:",
              target_sdk
          )

          if compile_sdk != 36:
              raise SystemExit(
                  "ERROR: compileSdkVersion != 36"
              )

          if target_sdk != 36:
              raise SystemExit(
                  "ERROR: targetSdkVersion != 36"
              )

          print(
              "Android SDK values: PASS"
          )
          PY


      # ============================================================
      # 25. FINAL GRADLE CHECK
      # ============================================================

      - name: Final Gradle check
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR/android"

          chmod +x gradlew

          ./gradlew \
            --version

          echo "Gradle check: PASS"


      # ============================================================
      # 26. GRADLE CLEAN
      # ============================================================

      - name: Gradle clean
        working-directory: ${{ env.SOURCE_DIR }}/android
        run: |
          ./gradlew \
            clean \
            --no-daemon


      # ============================================================
      # 27. BUILD SIGNED APK + AAB
      # ============================================================

      - name: Build signed APK and AAB
        working-directory: ${{ env.SOURCE_DIR }}/android
        run: |
          set -euo pipefail

          ./gradlew \
            assembleRelease \
            bundleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "============================================================"
          echo "GRADLE APK + AAB BUILD: PASS"
          echo "============================================================"


      # ============================================================
      # 28. VERIFY APK SIGNATURE
      # ============================================================

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          APK="android/app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"

          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"

          test -x "$APKSIGNER"

          "$APKSIGNER" \
            verify \
            --verbose \
            "$APK"

          echo ""
          echo "============================================================"
          echo "SIGNED APK VERIFICATION: PASS"
          echo "============================================================"

          ls -lh "$APK"


      # ============================================================
      # 29. VERIFY AAB SIGNATURE
      # ============================================================

      - name: Verify signed AAB
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          test -s "$AAB"

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB"

          echo ""
          echo "============================================================"
          echo "SIGNED AAB VERIFICATION: PASS"
          echo "============================================================"

          ls -lh "$AAB"


      # ============================================================
      # 30. PREPARE FINAL RELEASE
      # ============================================================

      - name: Prepare final release files
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          rm -rf release

          mkdir -p release

          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          cp \
            android/app/build/outputs/bundle/release/app-release.aab \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab


          sha256sum \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk \
            > release/RKMS_APK_SHA256.txt


          sha256sum \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab \
            > release/RKMS_AAB_SHA256.txt


          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab


          echo ""
          echo "APK SHA256:"
          cat release/RKMS_APK_SHA256.txt

          echo ""
          echo "AAB SHA256:"
          cat release/RKMS_AAB_SHA256.txt


      # ============================================================
      # 31. FINAL RELEASE VERIFICATION
      # ============================================================

      - name: Final release verification
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"


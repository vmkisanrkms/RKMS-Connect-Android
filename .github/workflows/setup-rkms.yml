name: RKMS Android 16 API 36 - Final Signed Release APK Only

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  APP_ID: "org.rkms.connect"

jobs:

  build:

    name: RKMS Final Signed Release APK

    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # NODE 22
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # ============================================================
      # HOST PACKAGES
      # ============================================================

      - name: Install required host packages
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y unzip rsync

          echo "HOST PACKAGES: PASS"


      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ============================================================
      # INSTALL ANDROID API 36
      # ============================================================

      - name: Install Android API 36 SDK packages
        shell: bash
        run: |
          set -euo pipefail

          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          test -d \
            "$ANDROID_HOME/platforms/android-${ANDROID_API}"

          test -d \
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}"

          test -x \
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt"

          test -x \
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

          echo "ANDROID PLATFORM ${ANDROID_API}: PASS"
          echo "BUILD TOOLS ${BUILD_TOOLS}: PASS"


      # ============================================================
      # VERIFY ANDROID SDK
      # ============================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not-set}"

          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME"

          sdkmanager --version

          test -d \
            "$ANDROID_HOME/platforms/android-${ANDROID_API}"

          test -d \
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}"

          test -x \
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt"

          test -x \
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

          echo "ANDROID SDK VERIFICATION: PASS"


      # ============================================================
      # LOCATE RKMS SOURCE
      #
      # ZIP IS OPTIONAL.
      #
      # If repository itself contains package.json,
      # build directly from repository.
      #
      # Otherwise search for RKMS ZIP.
      # ============================================================

      - name: Locate RKMS source
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE="$GITHUB_WORKSPACE"

          echo "=========================================="
          echo "LOCATING RKMS SOURCE"
          echo "=========================================="

          if [ -s "$WORKSPACE/package.json" ]; then

            ROOT="$WORKSPACE"

            echo "RKMS source found in repository root."

          else

            ZIP_FILE="$(
              find "$WORKSPACE" \
                -maxdepth 3 \
                -type f \
                \( \
                  -name "RKMS_CONNECT_FINAL_ALL_NOTIFICATION_FIXES_*.zip" \
                  -o \
                  -name "RKMS_CONNECT_FINAL_*.zip" \
                  -o \
                  -name "RKMS_CONNECT_*.zip" \
                \) \
                -print \
                -quit
            )"

            if [ -z "$ZIP_FILE" ]; then

              echo "::error::RKMS source not found."

              echo "No package.json in repository root"
              echo "and no RKMS ZIP was found."

              exit 1

            fi

            echo "RKMS ZIP:"
            echo "$ZIP_FILE"

            rm -rf "$WORKSPACE/rkms-build"

            mkdir -p "$WORKSPACE/rkms-build"

            unzip -q \
              "$ZIP_FILE" \
              -d "$WORKSPACE/rkms-build"

            if [ -s \
              "$WORKSPACE/rkms-build/final_audit_src/package.json"
            ]; then

              ROOT="$WORKSPACE/rkms-build/final_audit_src"

            elif [ -s \
              "$WORKSPACE/rkms-build/package.json"
            ]; then

              ROOT="$WORKSPACE/rkms-build"

            else

              PACKAGE_FILE="$(
                find "$WORKSPACE/rkms-build" \
                  -type f \
                  -name package.json \
                  -not -path '*/node_modules/*' \
                  -print \
                  -quit
              )"

              if [ -z "$PACKAGE_FILE" ]; then

                echo "::error::package.json not found."

                exit 1

              fi

              ROOT="$(dirname "$PACKAGE_FILE")"

            fi

          fi

          ROOT="$(cd "$ROOT" && pwd)"

          test -d "$ROOT"
          test -s "$ROOT/package.json"

          echo "RKMS_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "RKMS ROOT:"
          echo "$ROOT"
          echo "=========================================="


      # ============================================================
      # VERIFY SOURCE STRUCTURE
      # ============================================================

      - name: Verify RKMS source structure
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          REQUIRED_FILES=(
            "package.json"
            "package-lock.json"
            "app.js"
            "index.html"
            "styles.css"
            "capacitor.config.json"
            "google-services.json"
            "scripts/setup-android-native.sh"
            "scripts/configure-android-16.sh"
            "scripts/configure-release-signing.sh"
            "scripts/verify-android-16.py"
            "scripts/verify-rkms-final-fixes.py"
            "scripts/verify-fcm-pipeline.py"
            "scripts/verify-native-bridge.py"
            "scripts/verify-android-pdf.py"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do

            if [ ! -s "$FILE" ]; then

              echo "::error::Required file missing: $FILE"

              exit 1

            fi

          done

          node --check app.js

          python3 -m json.tool \
            capacitor.config.json \
            >/dev/null

          python3 -m json.tool \
            google-services.json \
            >/dev/null

          echo "SOURCE STRUCTURE: PASS"


      # ============================================================
      # VERIFY CAPACITOR VERSIONS
      # ============================================================

      - name: Verify Capacitor package versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node <<'NODE'
          const fs = require("fs");

          const p = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const d = {
            ...(p.dependencies || {}),
            ...(p.devDependencies || {})
          };

          const wanted = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          for (const [name, version] of Object.entries(wanted)) {

            if (d[name] !== version) {

              throw new Error(
                `${name}: expected ${version}, found ${d[name] || "MISSING"}`
              );

            }

          }

          if (
            !p.scripts ||
            typeof p.scripts.build !== "string" ||
            !p.scripts.build.trim()
          ) {

            throw new Error(
              "package.json build script is missing"
            );

          }

          console.log(
            "CAPACITOR VERSION CHECK: PASS"
          );
          NODE


      # ============================================================
      # FIREBASE CONFIG
      # ============================================================

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node <<'NODE'
          const fs = require("fs");

          const j = JSON.parse(
            fs.readFileSync(
              "google-services.json",
              "utf8"
            )
          );

          const ok = (j.client || []).some(
            c =>
              c.client_info?.android_client_info?.package_name ===
              "org.rkms.connect"
          );

          if (!ok) {

            throw new Error(
              "google-services.json does not contain org.rkms.connect"
            );

          }

          console.log(
            "FIREBASE PACKAGE CHECK: PASS"
          );
          NODE


      # ============================================================
      # NPM INSTALL
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm ci \
            --no-audit \
            --no-fund

          echo "NPM INSTALL: PASS"


      # ============================================================
      # WEB BUILD
      # ============================================================

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm run build

          test -s \
            dist/index.html

          echo "WEB BUILD: PASS"


      # ============================================================
      # GENERATE CAPACITOR ANDROID
      # ============================================================

      - name: Generate Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          rm -rf android

          npx cap add android

          test -s \
            android/gradlew

          test -s \
            android/app/build.gradle

          chmod +x \
            android/gradlew

          echo "CAPACITOR ANDROID GENERATION: PASS"


      # ============================================================
      # CONFIGURE ANDROID 16 API 36
      # ============================================================

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/configure-android-16.sh

          ./scripts/configure-android-16.sh

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "android/variables.gradle"
          )

          if not p.exists():
              raise SystemExit(
                  "android/variables.gradle not found"
              )

          s = p.read_text(
              encoding="utf-8"
          )

          for key, value in {
              "compileSdkVersion": "36",
              "targetSdkVersion": "36",
              "minSdkVersion": "23",
          }.items():

              s = re.sub(
                  rf"(\b{key}\s*=\s*)\d+",
                  rf"\g<1>{value}",
                  s
              )

          p.write_text(
              s,
              encoding="utf-8"
          )
          PY

          grep -Eq \
            'compileSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

          grep -Eq \
            'targetSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

          grep -Eq \
            'minSdkVersion[[:space:]]*=[[:space:]]*23' \
            android/variables.gradle

          grep -Fq \
            'com.android.tools.build:gradle:8.9.1' \
            android/build.gradle

          grep -Fq \
            'gradle-8.11.1-bin.zip' \
            android/gradle/wrapper/gradle-wrapper.properties

          echo "ANDROID 16 API 36: PASS"


      # ============================================================
      # CAPACITOR SYNC
      # ============================================================

      - name: Sync Capacitor
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npx cap sync android

          echo "CAPACITOR SYNC: PASS"


      # ============================================================
      # IMPORTANT FIX:
      # REPAIR ONLY THE BROKEN PYTHON HEREDOC
      #
      # Screenshot error:
      #
      # File "<stdin>", line 4
      #     mkdir -p "$DRAWABLE_DIR"
      # SyntaxError: invalid syntax
      #
      # This happens when the PY3 closing marker immediately
      # before RES_DIR is missing.
      #
      # This repair is deterministic.
      # ============================================================

      - name: Repair native setup Python heredoc
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          FILE="scripts/setup-android-native.sh"

          test -s "$FILE"

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "scripts/setup-android-native.sh"
          )

          s = p.read_text(
              encoding="utf-8"
          )

          marker = 'RES_DIR="android/app/src/main/res"'

          pos = s.find(marker)

          if pos < 0:
              raise SystemExit(
                  'RES_DIR marker not found in setup script'
              )

          before = s[:pos]

          opener = before.rfind(
              "python3 - <<'PY3'"
          )

          if opener < 0:
              raise SystemExit(
                  "Expected python3 - <<'PY3' opener not found"
              )

          tail = before[opener:]

          # Correct case:
          # python3 - <<'PY3'
          # ...
          # PY3
          # RES_DIR=...

          if "\nPY3\n" in tail:

              print(
                  "Native setup heredoc already correct."
              )

          else:

              # Insert the missing closing PY3 immediately
              # before the shell command RES_DIR=...
              s = (
                  s[:pos]
                  + "PY3\n\n"
                  + s[pos:]
              )

              p.write_text(
                  s,
                  encoding="utf-8"
              )

              print(
                  "Missing PY3 heredoc terminator inserted."
              )
          PY

          # The script MUST now pass Bash syntax validation.
          bash -n "$FILE"

          # Confirm that the shell resource commands are outside
          # the Python heredoc.
          grep -Fq \
            'RES_DIR="android/app/src/main/res"' \
            "$FILE"

          grep -Fq \
            'mkdir -p "$DRAWABLE_DIR"' \
            "$FILE"

          echo "NATIVE SETUP HEREDOC REPAIR: PASS"


      # ============================================================
      # RKMS NATIVE SETUP
      # ============================================================

      - name: Apply RKMS native Android setup
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/setup-android-native.sh

          bash -n \
            scripts/setup-android-native.sh

          ./scripts/setup-android-native.sh

          test -s \
            android/app/google-services.json

          find android/app/src/main \
            -type f \
            -name "MainActivity.java" \
            -print \
            -quit \
            > main-activity-location.txt

          find android/app/src/main \
            -type f \
            -name "RKMSNativeBridge.java" \
            -print \
            -quit \
            > bridge-location.txt

          test -s \
            main-activity-location.txt

          test -s \
            bridge-location.txt

          read -r MAIN_ACTIVITY < \
            main-activity-location.txt

          read -r BRIDGE_FILE < \
            bridge-location.txt

          test -s "$MAIN_ACTIVITY"
          test -s "$BRIDGE_FILE"

          grep -Fq \
            'FirebaseApp.initializeApp(this)' \
            "$MAIN_ACTIVITY"

          grep -Fq \
            'RKMSNativeBridge' \
            "$MAIN_ACTIVITY"

          echo "RKMS NATIVE SETUP: PASS"


      # ============================================================
      # VERIFY MAIN ACTIVITY
      # ============================================================

      - name: Verify generated MainActivity
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          MAIN_ACTIVITY="$(
            find android/app/src/main \
              -type f \
              -name "MainActivity.java" \
              -print \
              -quit
          )"

          test -n "$MAIN_ACTIVITY"
          test -s "$MAIN_ACTIVITY"

          if grep -Fq '\n' "$MAIN_ACTIVITY"; then

            echo "::error::Literal backslash-n found in MainActivity.java."

            exit 1

          fi

          grep -Fq \
            'onNewIntent' \
            "$MAIN_ACTIVITY"

          grep -Fq \
            'FirebaseApp.initializeApp(this)' \
            "$MAIN_ACTIVITY"

          grep -Fq \
            'RKMSNativeBridge' \
            "$MAIN_ACTIVITY"

          echo "MAINACTIVITY VERIFICATION: PASS"


      # ============================================================
      # VERIFY NOTIFICATION CHANNELS
      # ============================================================

      - name: Verify notification priority channels
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          grep -Fq \
            "rkms_notifications_v2" \
            scripts/setup-android-native.sh

          grep -Fq \
            "rkms_priority_v1" \
            scripts/setup-android-native.sh

          grep -Fq \
            "rkms_notifications_v2" \
            app.js

          grep -Fq \
            "rkms_priority_v1" \
            app.js

          grep -Fq \
            "IMPORTANCE_HIGH" \
            scripts/setup-android-native.sh

          echo "NOTIFICATION CHANNELS: PASS"


      # ============================================================
      # FIREBASE MESSAGING SDK
      # ============================================================

      - name: Ensure Firebase Messaging SDK
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "android/app/build.gradle"
          )

          s = p.read_text(
              encoding="utf-8"
          )

          bom = (
              "implementation platform("
              "'com.google.firebase:firebase-bom:33.9.0'"
              ")"
          )

          messaging = (
              "implementation "
              "'com.google.firebase:firebase-messaging'"
          )

          match = re.search(
              r"(?m)^[ \t]*dependencies[ \t]*\{",
              s
          )

          if not match:
              raise SystemExit(
                  "dependencies block not found"
              )

          start = match.end()

          depth = 1
          pos = start

          while pos < len(s) and depth:

              if s[pos] == "{":
                  depth += 1

              elif s[pos] == "}":
                  depth -= 1

              pos += 1

          if depth != 0:
              raise SystemExit(
                  "Malformed dependencies block"
              )

          end = pos - 1

          block = s[start:end]

          if (
              "com.google.firebase:firebase-bom:"
              not in block
          ):

              block = (
                  "\n    "
                  + bom
                  + "\n"
                  + block
              )

          if (
              "com.google.firebase:firebase-messaging"
              not in block
          ):

              block += (
                  "\n    "
                  + messaging
                  + "\n"
              )

          p.write_text(
              s[:start]
              + block
              + s[end:],
              encoding="utf-8"
          )
          PY

          grep -Fq \
            'com.google.firebase:firebase-bom:33.9.0' \
            android/app/build.gradle

          grep -Fq \
            'com.google.firebase:firebase-messaging' \
            android/app/build.gradle

          echo "FIREBASE MESSAGING SDK: PASS"


      # ============================================================
      # COMPLETE STATIC AUDITS
      # ============================================================

      - name: Run complete RKMS static audits
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 \
            scripts/verify-android-16.py

          python3 \
            scripts/verify-rkms-final-fixes.py

          python3 \
            scripts/verify-fcm-pipeline.py

          python3 \
            scripts/verify-native-bridge.py

          python3 \
            scripts/verify-android-pdf.py

          if [ -f \
            "scripts/verify-saved-login.py"
          ]; then

            python3 \
              scripts/verify-saved-login.py

          fi

          echo "=========================================="
          echo "ALL RKMS STATIC AUDITS: PASS"
          echo "=========================================="


      # ============================================================
      # VERIFY RELEASE SIGNING SECRETS
      # ============================================================

      - name: Verify release signing secrets
        shell: bash
        run: |
          set -euo pipefail

          test -n \
            "${RKMS_KEYSTORE_BASE64:-}" || {
              echo "::error::RKMS_KEYSTORE_BASE64 secret missing."
              exit 1
            }

          test -n \
            "${RKMS_KEYSTORE_PASSWORD:-}" || {
              echo "::error::RKMS_KEYSTORE_PASSWORD secret missing."
              exit 1
            }

          test -n \
            "${RKMS_KEY_ALIAS:-}" || {
              echo "::error::RKMS_KEY_ALIAS secret missing."
              exit 1
            }

          test -n \
            "${RKMS_KEY_PASSWORD:-}" || {
              echo "::error::RKMS_KEY_PASSWORD secret missing."
              exit 1
            }

          echo "RELEASE SIGNING SECRETS: PASS"


      # ============================================================
      # CONFIGURE RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/configure-release-signing.sh

          ./scripts/configure-release-signing.sh

          test -s \
            android/app/release.keystore

          grep -Fq \
            'storeFile file("release.keystore")' \
            android/app/build.gradle

          grep -Fq \
            'signingConfig signingConfigs.release' \
            android/app/build.gradle

          echo "RELEASE SIGNING CONFIGURATION: PASS"


      # ============================================================
      # VERIFY KEYSTORE
      # ============================================================

      - name: Verify release keystore
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          keytool \
            -list \
            -keystore android/app/release.keystore \
            -storepass "$RKMS_KEYSTORE_PASSWORD" \
            -alias "$RKMS_KEY_ALIAS" \
            >/dev/null

          echo "KEYSTORE VALIDATION: PASS"


      # ============================================================
      # GRADLE WRAPPER
      # ============================================================

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          chmod +x \
            gradlew

          ./gradlew \
            --version \
            --no-daemon

          echo "GRADLE WRAPPER: PASS"


      # ============================================================
      # CLEAN
      # ============================================================

      - name: Clean Android build
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          ./gradlew \
            clean \
            --no-daemon

          echo "GRADLE CLEAN: PASS"


      # ============================================================
      # FINAL ANDROID 16 AUDIT
      # ============================================================

      - name: Final Android 16 API 36 audit
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          grep -Eq \
            'compileSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

          grep -Eq \
            'targetSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

          grep -Eq \
            'minSdkVersion[[:space:]]*=[[:space:]]*23' \
            android/variables.gradle

          grep -Fq \
            'com.android.tools.build:gradle:8.9.1' \
            android/build.gradle

          grep -Fq \
            'gradle-8.11.1-bin.zip' \
            android/gradle/wrapper/gradle-wrapper.properties

          echo "ANDROID 16 API 36 FINAL AUDIT: PASS"


      # ============================================================
      # BUILD FINAL SIGNED RELEASE APK ONLY
      #
      # NO DEBUG APK
      # NO AAB
      # ============================================================

      - name: Build final signed release APK only
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          rm -rf \
            app/build/outputs/apk/release

          rm -rf \
            app/build/outputs/bundle

          echo "=========================================="
          echo "BUILDING FINAL SIGNED RELEASE APK"
          echo "=========================================="

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          echo "=========================================="
          echo "GRADLE BUILD SUCCESSFUL"
          echo "=========================================="

          EXPECTED_APK="$RKMS_ROOT/android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$EXPECTED_APK" ]; then

            echo "::error::Release APK was not created."

            echo "Available APK files:"

            find "$RKMS_ROOT/android" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1

          fi

          test -s "$EXPECTED_APK"

          FINAL_APK="$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"

          cp \
            "$EXPECTED_APK" \
            "$FINAL_APK"

          test -s "$FINAL_APK"

          echo "APK_PATH=$FINAL_APK" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "FINAL SIGNED RELEASE APK CREATED"
          echo "=========================================="

          stat -c%s "$FINAL_APK"


      # ============================================================
      # VERIFY NO DEBUG APK
      # ============================================================

      - name: Verify no debug APK
        shell: bash
        run: |
          set -euo pipefail

          if find "$RKMS_ROOT/android" \
            -type f \
            -iname "*debug*.apk" \
            -print \
            -quit |
            grep -q .
          then

            echo "::error::Debug APK detected."

            find "$RKMS_ROOT/android" \
              -type f \
              -iname "*debug*.apk" \
              -print

            exit 1

          fi

          echo "DEBUG APK: NONE"


      # ============================================================
      # VERIFY NO AAB
      # ============================================================

      - name: Verify no AAB
        shell: bash
        run: |
          set -euo pipefail

          if find "$RKMS_ROOT/android" \
            -type f \
            -name "*.aab" \
            -print \
            -quit |
            grep -q .
          then

            echo "::error::AAB detected."

            find "$RKMS_ROOT/android" \
              -type f \
              -name "*.aab" \
              -print

            exit 1

          fi

          echo "AAB: NONE"


      # ============================================================
      # VERIFY APK PACKAGE / TARGET SDK
      # ============================================================

      - name: Verify final APK package and SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          test -n "$SDK_ROOT"

          AAPT="$SDK_ROOT/build-tools/$BUILD_TOOLS/aapt"

          test -x "$AAPT"

          "$AAPT" \
            dump badging \
            "$APK_PATH" \
            > apk-badging.txt

          cat apk-badging.txt

          grep -Fq \
            "package: name='$APP_ID'" \
            apk-badging.txt

          grep -Fq \
            "targetSdkVersion:'36'" \
            apk-badging.txt

          echo "APK PACKAGE: PASS"
          echo "TARGET SDK 36: PASS"


      # ============================================================
      # VERIFY APK SIGNATURE
      # ============================================================

      - name: Verify final APK signature
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          APKSIGNER="$SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner"

          test -x "$APKSIGNER"

          "$APKSIGNER" \
            verify \
            --verbose \
            "$APK_PATH"

          "$APKSIGNER" \
            verify \
            --print-certs \
            "$APK_PATH"

          echo "APK SIGNATURE: PASS"


      # ============================================================
      # APK SHA256
      # ============================================================

      - name: Generate APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            "$APK_PATH" \
            > "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256"

          cat \
            "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256"

          echo "APK SHA256: PASS"


      # ============================================================
      # FINAL APK ONLY AUDIT
      # ============================================================

      - name: Final APK-only audit
        shell: bash
        run: |
          set -euo pipefail

          test -s "$APK_PATH"

          test -s \
            "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256"

          SIZE="$(
            stat -c%s "$APK_PATH"
          )"

          if [ "$SIZE" -lt 1000000 ]; then

            echo "::error::APK size is unexpectedly small."

            exit 1

          fi

          if find "$RKMS_ROOT/android" \
            -type f \
            -name "*.aab" \
            -print \
            -quit |
            grep -q .
          then

            echo "::error::AAB output detected."

            exit 1

          fi

          if find "$RKMS_ROOT/android" \
            -type f \
            -iname "*debug*.apk" \
            -print \
            -quit |
            grep -q .
          then

            echo "::error::Debug APK output detected."

            exit 1

          fi

          echo "=========================================="
          echo "FINAL APK-ONLY AUDIT: PASS"
          echo "=========================================="

          echo "APK:"
          echo "$APK_PATH"

          echo "SIZE:"
          echo "$SIZE bytes"

          echo "SHA256:"
          cat \
            "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256"


      # ============================================================
      # UPLOAD FINAL RELEASE APK ONLY
      # ============================================================

      - name: Upload final signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS_ANDROID16_API36_FINAL_SIGNED_RELEASE_APK
          if-no-files-found: error
          path: |
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256
          retention-days: 30

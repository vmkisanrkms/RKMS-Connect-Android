name: RKMS Connect - Android 16 API 36 - Final Audited APK AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rkms-android16-final-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  APP_ID: "org.rkms.connect"

jobs:
  audit-and-build:
    name: RKMS Final Audit + Android 16 API 36 APK AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. NODE 22
      # ============================================================

      # IMPORTANT:
      # No npm cache is used here because the GitHub repository
      # currently being built may not contain package-lock.json.
      # The dependency step below handles both locked and unlocked
      # source trees safely.
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify Node and source
        shell: bash
        run: |
          set -euo pipefail

          node --version
          npm --version

          test -f package.json
          test -f app.js
          test -f index.html
          test -f styles.css
          test -f capacitor.config.json
          test -f google-services.json

          test -f scripts/setup-android-native.sh
          test -f scripts/configure-android-16.sh
          test -f scripts/configure-release-signing.sh
          test -f scripts/verify-android-16.py

          node --check app.js

          echo "RKMS source structure: PASS"
          echo "JavaScript syntax: PASS"


      # ============================================================
      # 3. PACKAGE + CAPACITOR CONFIGURATION
      # ============================================================

      - name: Verify package and Capacitor configuration
        shell: bash
        run: |
          set -euo pipefail

          node - <<'NODE'
          const fs = require("fs");

          const p = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          if (p.name !== "rkms") {
            throw new Error(
              "package.json name mismatch"
            );
          }

          if (
            p.dependencies?.["@capacitor/core"] !== "6.2.2"
          ) {
            throw new Error(
              "@capacitor/core must be 6.2.2"
            );
          }

          if (
            p.dependencies?.["@capacitor/android"] !== "6.2.2"
          ) {
            throw new Error(
              "@capacitor/android must be 6.2.2"
            );
          }

          if (
            p.dependencies?.["@capacitor/push-notifications"] !== "6.0.3"
          ) {
            throw new Error(
              "@capacitor/push-notifications must be 6.0.3"
            );
          }

          if (
            p.devDependencies?.["@capacitor/cli"] !== "6.2.2"
          ) {
            throw new Error(
              "@capacitor/cli must be 6.2.2"
            );
          }

          if (!p.scripts?.build) {
            throw new Error(
              "npm build script missing"
            );
          }

          console.log(
            "package.json: PASS"
          );
          NODE

          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(
              Path("capacitor.config.json").read_text()
          )

          if config.get("appId") != "org.rkms.connect":
              raise SystemExit(
                  "ERROR: Capacitor appId mismatch"
              )

          if config.get("webDir") != "dist":
              raise SystemExit(
                  "ERROR: Capacitor webDir must be dist"
              )

          firebase = json.loads(
              Path("google-services.json").read_text()
          )

          packages = []

          for client in firebase.get("client", []):
              packages.append(
                  client
                  .get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

          if "org.rkms.connect" not in packages:
              raise SystemExit(
                  "ERROR: org.rkms.connect missing from google-services.json"
              )

          print("capacitor.config.json: PASS")
          print("google-services.json: PASS")
          PY


      # ============================================================
      # 4. NPM DEPENDENCIES
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then

            echo "package-lock.json found"
            echo "Using npm ci"

            npm ci \
              --no-audit \
              --no-fund

          else

            echo "package-lock.json not found"
            echo "Using npm install"

            npm install \
              --no-audit \
              --no-fund

          fi

          npm ls @capacitor/core --depth=0
          npm ls @capacitor/android --depth=0
          npm ls @capacitor/push-notifications --depth=0

          echo "npm dependencies: PASS"


      # ============================================================
      # 5. WEB BUILD
      # ============================================================

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          npm run build

          test -s dist/index.html
          test -s dist/app.js
          test -s dist/styles.css
          test -s dist/config.js

          node --check dist/app.js

          echo "Web build: PASS"


      # ============================================================
      # 6. CHAT + PDA + SUPER ADMIN AUDIT
      # ============================================================

      - name: Audit Chat and PDA security
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "PDA PASSWORD AUDIT"
          echo "=============================================="

          grep -F \
            'rkmsRequireManagementPassword("पद से हटाने")' \
            app.js >/dev/null

          grep -F \
            'p_password:password' \
            app.js >/dev/null

          grep -F \
            'rkmsRequireManagementPassword(form.dataset.reappointOfficer?"पद परिवर्तन":"नियुक्ति")' \
            app.js >/dev/null

          echo "PDA removal password: PASS"
          echo "PDA appointment/reappointment password: PASS"


          echo "=============================================="
          echo "SUPER ADMIN RPC AUDIT"
          echo "=============================================="

          grep -F \
            'rkms_super_admin_appoint_officer' \
            app.js >/dev/null

          grep -F \
            'rkms_super_admin_reappoint_officer' \
            app.js >/dev/null

          echo "Super Admin PDA RPC references: PASS"


          echo "=============================================="
          echo "SUPER ADMIN CHAT RESTRICTION"
          echo "=============================================="

          grep -F \
            'if(state.role==="super_admin") return adminScreen();' \
            app.js >/dev/null

          echo "Super Admin Chat restriction: PASS"


          echo "=============================================="
          echo "WHATSAPP STYLE CHAT"
          echo "=============================================="

          for token in \
            'wa-chat-screen' \
            'wa-chat-list-head' \
            'wa-chat-search' \
            'wa-filters' \
            'wa-chat-row' \
            'wa-conv-head' \
            'wa-messages' \
            'wa-compose'
          do

            grep -F "$token" app.js >/dev/null

          done

          echo "Chat structure: PASS"


          echo "=============================================="
          echo "CHAT HEADER / FOOTER SAFETY"
          echo "=============================================="

          if grep -Eq \
            '\.wa-chat-screen[^}]*position:[[:space:]]*fixed' \
            styles.css
          then

            echo "ERROR:"
            echo "wa-chat-screen is still fixed"
            exit 1

          fi


          if grep -Eq \
            '\.wa-conversation-screen[^}]*position:[[:space:]]*fixed' \
            styles.css
          then

            echo "ERROR:"
            echo "wa-conversation-screen is still fixed"
            exit 1

          fi


          grep -F \
            'rkms-bottom-nav' \
            styles.css >/dev/null

          echo "Chat header/footer-safe layout: PASS"


      # ============================================================
      # 7. RUN RKMS VERIFICATION SCRIPTS
      # ============================================================

      - name: Run RKMS verification suite
        shell: bash
        run: |
          set -euo pipefail

          run_py() {

            local file="$1"

            if [ -f "$file" ]; then

              echo ""
              echo "================================================"
              echo "VERIFY: $file"
              echo "================================================"

              python3 "$file"

            fi

          }

          run_py scripts/verify-rkms-final.py
          run_py scripts/verify-authority-hierarchy.py
          run_py scripts/verify-directory-lists.py
          run_py scripts/verify-directory-contact-actions.py
          run_py scripts/verify-member-directory-scope.py
          run_py scripts/verify-v17-directory-deep.py
          run_py scripts/verify-content-management-final.py
          run_py scripts/verify-complaint-final.py
          run_py scripts/verify-profile-update-final.py
          run_py scripts/verify-saved-login.py
          run_py scripts/verify-fcm-pipeline.py
          run_py scripts/verify-final-login-navigation.py
          run_py scripts/verify-native-bridge.py
          run_py scripts/verify-report-download-scope.py
          run_py scripts/verify-pdf-pipeline.py

          echo ""
          echo "RKMS verification suite: PASS"


      # ============================================================
      # 8. JAVA 17
      # ============================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # ============================================================
      # 9. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android 16 API 36 SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses \
            >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          test -d \
            "$ANDROID_HOME/platforms/android-${ANDROID_API}"

          test -d \
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}"

          echo "Android API 36: PASS"
          echo "Build Tools 36.0.0: PASS"


      # ============================================================
      # 10. CLEAN CAPACITOR ANDROID PROJECT
      # ============================================================

      - name: Generate clean Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android

          npx cap add android

          test -f \
            android/app/build.gradle

          test -f \
            android/gradlew

          test -f \
            android/app/src/main/AndroidManifest.xml

          echo "Capacitor Android project: PASS"


      # ============================================================
      # 11. ANDROID 16 CONFIGURATION
      # ============================================================

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          chmod +x \
            scripts/configure-android-16.sh

          bash \
            scripts/configure-android-16.sh

          grep -q \
            '36' \
            android/variables.gradle

          grep -q \
            'gradle-8.11.1-bin.zip' \
            android/gradle/wrapper/gradle-wrapper.properties

          grep -q \
            'com.android.tools.build:gradle:8.9.1' \
            android/build.gradle

          echo "Android 16 API 36 configuration: PASS"


      # ============================================================
      # 12. CAPACITOR SYNC
      # ============================================================

      - name: Sync Capacitor Android
        shell: bash
        run: |
          set -euo pipefail

          npx cap sync android

          test -f \
            android/app/src/main/AndroidManifest.xml

          echo "Capacitor sync: PASS"


      # ============================================================
      # 13. RKMS NATIVE + FIREBASE
      # ============================================================

      - name: Setup RKMS native Android and Firebase
        shell: bash
        run: |
          set -euo pipefail

          chmod +x \
            scripts/setup-android-native.sh

          bash \
            scripts/setup-android-native.sh

          test -s \
            android/app/google-services.json

          grep -q \
            'com.google.gms.google-services' \
            android/app/build.gradle

          grep -q \
            'FirebaseApp.initializeApp(this)' \
            android/app/src/main/java/org/rkms/connect/MainActivity.java

          echo "RKMS native Android: PASS"
          echo "Firebase initialization: PASS"


      # ============================================================
      # 14. ORIGINAL RKMS LAUNCHER ICONS
      # ============================================================

      - name: Verify original RKMS launcher icons
        shell: bash
        run: |
          set -euo pipefail

          for density in \
            mdpi \
            hdpi \
            xhdpi \
            xxhdpi \
            xxxhdpi
          do

            cmp -s \
              "android_launcher_icons/mipmap-$density/ic_launcher.png" \
              "android/app/src/main/res/mipmap-$density/ic_launcher.png"

            cmp -s \
              "android_launcher_icons/mipmap-$density/ic_launcher_round.png" \
              "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"

          done

          test -s \
            assets/rkms-launcher-original-transparent.png

          echo "Original RKMS launcher icons: PASS"


      # ============================================================
      # 15. ANDROID 16 STATIC VERIFIER
      # ============================================================

      - name: Verify Android 16 project
        shell: bash
        run: |
          set -euo pipefail

          python3 \
            scripts/verify-android-16.py

          test -f \
            android/app/src/main/java/org/rkms/connect/MainActivity.java

          test -f \
            android/app/src/main/java/org/rkms/connect/RKMSSecureCredentialsPlugin.java

          test -f \
            android/app/src/main/java/org/rkms/connect/RKMSNativeBridge.java

          echo "Android 16 project audit: PASS"


      # ============================================================
      # 16. RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          chmod +x \
            scripts/configure-release-signing.sh

          if [ \
            -n "${RKMS_KEYSTORE_BASE64:-}" ] && \
            [ -n "${RKMS_KEYSTORE_PASSWORD:-}" ] && \
            [ -n "${RKMS_KEY_ALIAS:-}" ] && \
            [ -n "${RKMS_KEY_PASSWORD:-}" ]
          then

            echo "Signing secrets found."

            echo "$RKMS_KEYSTORE_BASE64" \
              | base64 --decode \
              > android/app/release.keystore

            test -s \
              android/app/release.keystore

            bash \
              scripts/configure-release-signing.sh

            echo "Release signing configuration: PASS"

          else

            echo "Signing secrets are not configured."
            echo "Unsigned release artifacts will be produced."

            bash \
              scripts/configure-release-signing.sh \
              || true

          fi


      # ============================================================
      # 17. GRADLE WRAPPER
      # ============================================================

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          grep -q \
            'gradle-8.11.1-bin.zip' \
            android/gradle/wrapper/gradle-wrapper.properties

          chmod +x \
            android/gradlew

          cd android

          ./gradlew --version

          echo "Gradle wrapper: PASS"


      # ============================================================
      # 18. DEBUG APK
      # ============================================================

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd android

          ./gradlew \
            clean \
            assembleDebug \
            --no-daemon \
            --stacktrace

          test -s \
            app/build/outputs/apk/debug/app-debug.apk

          echo "Debug APK: PASS"


      # ============================================================
      # 19. RELEASE APK + AAB
      # ============================================================

      - name: Build release APK and AAB
        shell: bash
        run: |
          set -euo pipefail

          cd android

          ./gradlew \
            assembleRelease \
            bundleRelease \
            --no-daemon \
            --stacktrace

          test -s \
            app/build/outputs/apk/release/app-release.apk

          test -s \
            app/build/outputs/bundle/release/app-release.aab

          echo "Release APK: PASS"
          echo "Release AAB: PASS"


      # ============================================================
      # 20. VERIFY FINAL PACKAGE ID
      # ============================================================

      - name: Verify final APK package
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt2" \
            dump badging \
            "$APK" \
            | grep -F \
            "package: name='${APP_ID}'"

          echo \
            "APK package ID ${APP_ID}: PASS"


      # ============================================================
      # 21. VERIFY SIGNATURE
      # ============================================================

      - name: Verify release signatures
        shell: bash
        env:
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          if [ \
            -f android/app/release.keystore ] && \
            [ -n "${RKMS_KEYSTORE_PASSWORD:-}" ] && \
            [ -n "${RKMS_KEY_ALIAS:-}" ] && \
            [ -n "${RKMS_KEY_PASSWORD:-}" ]
          then

            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" \
              verify \
              --verbose \
              "$APK"

            jarsigner \
              -verify \
              -verbose \
              -certs \
              "$AAB"

            echo "Signed APK verification: PASS"
            echo "Signed AAB verification: PASS"

          else

            echo \
              "Signing secrets unavailable."
            echo \
              "Signature verification skipped."

          fi


      # ============================================================
      # 22. COLLECT FINAL ARTIFACTS
      # ============================================================

      - name: Collect final APK AAB and checksums
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            release/RKMS_CONNECT_ANDROID16_API36_DEBUG.apk

          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          cp \
            android/app/build/outputs/bundle/release/app-release.aab \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab

          sha256sum \
            release/*.apk \
            release/*.aab \
            | tee release/SHA256SUMS.txt

          echo ""
          echo "=============================================="
          echo "RKMS FINAL ANDROID 16 / API 36 ARTIFACTS"
          echo "=============================================="

          ls -lh release/


      # ============================================================
      # 23. UPLOAD FINAL ARTIFACTS
      # ============================================================

      - name: Upload final APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: RKMS_CONNECT_ANDROID16_API36_FINAL_${{ github.run_number }}
          path: release/
          if-no-files-found: error
          retention-days: 90

name: Build RKMS Connect APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RKMS Connect APK
    runs-on: ubuntu-latest

    steps:

      # 1. Get repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Check actual repository structure
      - name: Check project structure
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "RKMS Connect Android Project Check"
          echo "======================================"

          echo ""
          echo "Repository root:"
          pwd

          echo ""
          echo "Root files:"
          ls -la

          # Gradle project
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle/settings.gradle.kts not found"
            exit 1
          fi

          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            echo "ERROR: root build.gradle/build.gradle.kts not found"
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERROR: app directory not found"
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] && [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app Gradle file not found"
            exit 1
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          fi

          echo ""
          echo "Project structure: PASS"

      # 3. Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 4. Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 5. Android SDK packages
      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # 6. Accept licenses
      - name: Accept Android licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      # 7. Gradle
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # 8. Show versions
      - name: Show build environment
        shell: bash
        run: |
          echo "Java version:"
          java -version

          echo ""
          echo "Gradle version:"
          gradle --version

          echo ""
          echo "Android SDK:"
          adb --version || true

      # 9. Gradle validation
      - name: Validate Gradle project
        shell: bash
        run: |
          set -e
          gradle --no-daemon tasks

      # 10. Clean
      - name: Clean project
        shell: bash
        run: |
          set -e
          gradle --no-daemon clean

      # 11. Build APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          echo "Building RKMS Connect APK..."

          gradle --no-daemon assembleDebug

      # 12. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "Checking APK..."

          if [ ! -f "$APK" ]; then
            echo ""
            echo "ERROR: APK was not generated."
            echo ""
            echo "Available build files:"
            find app/build -type f 2>/dev/null | sort || true
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "APK BUILD SUCCESS"
          echo "======================================"

          ls -lh "$APK"

      # 13. Upload APK
      - name: Upload RKMS APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-WebView-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

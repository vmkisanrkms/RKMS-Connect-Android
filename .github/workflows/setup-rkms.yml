name: RKMS Android 16 API 36 - Final Signed Release APK Only

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  NODE_VERSION: "22"
  JAVA_VERSION: "17"

  AGP_VERSION: "8.10.0"
  GRADLE_VERSION: "8.11.1"

  FIREBASE_BOM_VERSION: "34.19.0"
  GOOGLE_SERVICES_VERSION: "4.4.3"
  CREDENTIALS_VERSION: "1.5.0"

  APP_ID: "org.rkms.connect"
  MIN_SDK: "23"
  TARGET_SDK: "36"

  # ============================================================
  # FINAL AUDITED SOURCE ZIP PRESENT IN GITHUB REPOSITORY
  # ============================================================

  SOURCE_ZIP: "RKMS_CONNECT_FINAL_AUDITED_RELEASE_APK_BUILD_20260922.zip"

  # Independently verified SHA256
  EXPECTED_SOURCE_SHA256: "6907af2bd83ccb6a36b0aa177861ae0731c6f53501430b9fe05fd5b905d65299"

  APK_NAME: "RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"


jobs:

  build:

    name: Build Final Signed Release APK Only

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. NODE 22
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}


      # ============================================================
      # 3. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # ============================================================
      # 4. VERIFY EXACT FINAL SOURCE ZIP
      # ============================================================

      - name: Verify exact RKMS source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "RKMS FINAL SOURCE ZIP VERIFICATION"
          echo "=============================================="

          echo "Required source:"
          echo "${SOURCE_ZIP}"

          if [ ! -f "${SOURCE_ZIP}" ]; then
            echo "::error::Required RKMS source ZIP not found."

            echo ""
            echo "Available ZIP files:"
            find . \
              -maxdepth 3 \
              -type f \
              \( -iname "*.zip" -o -iname "*.ZIP" \) \
              -print \
              | sort || true

            exit 1
          fi

          test -s "${SOURCE_ZIP}"

          echo ""
          echo "Source ZIP found:"
          ls -lh "${SOURCE_ZIP}"

          ACTUAL_SHA256="$(
            sha256sum "${SOURCE_ZIP}" | awk '{print $1}'
          )"

          echo ""
          echo "Expected SHA256:"
          echo "${EXPECTED_SOURCE_SHA256}"

          echo ""
          echo "Actual SHA256:"
          echo "${ACTUAL_SHA256}"

          if [ "${ACTUAL_SHA256}" != "${EXPECTED_SOURCE_SHA256}" ]; then
            echo "::error::Source ZIP SHA256 mismatch."
            exit 1
          fi

          echo ""
          echo "Exact final source ZIP SHA256: PASS"


      # ============================================================
      # 5. SAVE SOURCE ZIP SHA256
      # ============================================================

      - name: Save source ZIP SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum "${SOURCE_ZIP}" \
            | tee source-zip.sha256


      # ============================================================
      # 6. EXTRACT FINAL SOURCE ZIP
      # ============================================================

      - name: Extract RKMS source ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build-project
          mkdir -p build-project

          unzip -q "${SOURCE_ZIP}" -d build-project

          echo "Source extraction PASS."


      # ============================================================
      # 7. DETECT PROJECT ROOT
      # ============================================================

      - name: Detect RKMS project root
        shell: bash
        run: |
          set -euo pipefail

          ROOT=""

          if [ -f "build-project/package.json" ]; then
            ROOT="build-project"
          else

            FOUND_PACKAGE="$(
              find build-project \
                -type f \
                -name "package.json" \
                -not -path "*/node_modules/*" \
                -print \
                | head -n 1 || true
            )"

            if [ -n "$FOUND_PACKAGE" ]; then
              ROOT="$(dirname "$FOUND_PACKAGE")"
            fi

          fi

          if [ -z "$ROOT" ]; then
            echo "::error::package.json not found inside source ZIP."
            exit 1
          fi

          echo "RKMS_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo ""
          echo "RKMS_ROOT:"
          echo "$ROOT"


      # ============================================================
      # 8. VALIDATE SOURCE
      # ============================================================

      - name: Validate RKMS source
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          REQUIRED_FILES=(
            "package.json"
            "package-lock.json"
            "app.js"
            "index.html"
            "styles.css"
            "capacitor.config.json"
            "google-services.json"

            "scripts/setup-android-native.sh"
            "scripts/configure-android-16.sh"
            "scripts/configure-release-signing.sh"

            "scripts/verify-3-point-fix-20260921.py"
            "scripts/verify-final-three-point-fix.py"
            "scripts/verify-rkms-final-fixes.py"
            "scripts/verify-fcm-pipeline.py"
            "scripts/verify-android-pdf.py"
            "scripts/verify-native-bridge.py"

            "FINAL_AUDIT_LOW_NETWORK_FCM_DIGITALID_EVENTS_20260922.md"
          )

          for file in "${REQUIRED_FILES[@]}"; do

            if [ ! -f "$file" ]; then
              echo "::error::Missing required file: $file"
              exit 1
            fi

            echo "OK: $file"

          done

          echo ""
          echo "Required source files: PASS"


      # ============================================================
      # 9. JAVASCRIPT SYNTAX
      # ============================================================

      - name: Verify app.js syntax
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node --check app.js

          echo "app.js syntax: PASS"


      # ============================================================
      # 10. SHELL SCRIPT SYNTAX
      # ============================================================

      - name: Verify shell scripts
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          while IFS= read -r -d '' script; do
            echo "Checking: $script"
            bash -n "$script"
          done < <(
            find scripts \
              -type f \
              -name "*.sh" \
              -print0
          )

          echo ""
          echo "Shell scripts syntax: PASS"


      # ============================================================
      # 11. VERIFY LOW NETWORK / 3 POINT FIX
      # ============================================================

      - name: Verify low network and requested fixes
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 \
            scripts/verify-3-point-fix-20260921.py

          python3 \
            scripts/verify-final-three-point-fix.py

          echo ""
          echo "Low-network / requested fixes: PASS"


      # ============================================================
      # 12. VERIFY EXISTING FINAL FIXES
      # ============================================================

      - name: Verify existing RKMS final fixes
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 scripts/verify-rkms-final-fixes.py

          echo ""
          echo "Existing RKMS final fixes: PASS"


      # ============================================================
      # 13. VERIFY FCM
      # ============================================================

      - name: Verify FCM notification pipeline
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 scripts/verify-fcm-pipeline.py

          echo ""
          echo "FCM pipeline: PASS"


      # ============================================================
      # 14. VERIFY PDF
      # ============================================================

      - name: Verify Android PDF pipeline
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 scripts/verify-android-pdf.py

          echo ""
          echo "Android PDF pipeline: PASS"


      # ============================================================
      # 15. VERIFY NATIVE BRIDGE
      # ============================================================

      - name: Verify RKMS native bridge
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 scripts/verify-native-bridge.py

          echo ""
          echo "RKMS native bridge: PASS"


      # ============================================================
      # 16. VERIFY CAPACITOR VERSIONS
      # ============================================================

      - name: Verify Capacitor versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node <<'NODE'
          const fs = require("fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const deps = {
            ...(pkg.dependencies || {}),
            ...(pkg.devDependencies || {})
          };

          const required = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          let failed = false;

          for (const [name, version] of Object.entries(required)) {

            const actual = deps[name];

            console.log(
              `${name}: required=${version}, actual=${actual || "MISSING"}`
            );

            if (!actual) {
              failed = true;
              continue;
            }

            const allowed = [
              version,
              `^${version}`,
              `~${version}`
            ];

            if (!allowed.includes(String(actual))) {
              console.error(
                `ERROR: ${name}: expected ${version}, found ${actual}`
              );

              failed = true;
            }
          }

          if (failed) {
            process.exit(1);
          }

          console.log("Capacitor validation PASS.");
          NODE


      # ============================================================
      # 17. NPM CI
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm ci \
            --no-audit \
            --no-fund

          echo "npm dependencies: PASS"


      # ============================================================
      # 18. BUILD WEB
      # ============================================================

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm run build

          test -d dist
          test -s dist/index.html

          echo "Web build: PASS"


      # ============================================================
      # 19. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ============================================================
      # 20. INSTALL API 36
      # ============================================================

      - name: Install Android API 36 and Build Tools
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK" ]; then
            echo "::error::Android SDK path not found."
            exit 1
          fi

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "$SDK/cmdline-tools" \
                -type f \
                -path "*/bin/sdkmanager" \
                -print \
                | head -n 1 || true
            )"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" \
            --licenses \
            >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          echo "Android API ${ANDROID_API}: PASS"
          echo "Build Tools ${BUILD_TOOLS}: PASS"


      # ============================================================
      # 21. VERIFY SDK
      # ============================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          test -d \
            "$SDK/platforms/android-${ANDROID_API}"

          test -d \
            "$SDK/build-tools/${BUILD_TOOLS}"

          test -x \
            "$SDK/build-tools/${BUILD_TOOLS}/aapt"

          test -x \
            "$SDK/build-tools/${BUILD_TOOLS}/apksigner"

          echo "Android SDK verification: PASS"


      # ============================================================
      # 22. CREATE CAPACITOR ANDROID
      # ============================================================

      - name: Create Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          rm -rf android

          npx cap add android

          test -d android
          test -f android/app/build.gradle
          test -f android/gradlew

          echo "Capacitor Android project: PASS"


      # ============================================================
      # 23. CONFIGURE ANDROID 16 / API 36
      # ============================================================

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x scripts/configure-android-16.sh

          ./scripts/configure-android-16.sh

          # The source script historically pins AGP 8.9.1.
          # Final build requires AGP 8.10.0.
          sed -i \
            "s/com\\.android\\.tools\\.build:gradle:8\\.9\\.1/com.android.tools.build:gradle:${AGP_VERSION}/g" \
            android/build.gradle

          # Force exact Gradle wrapper version.
          sed -i \
            "s#distributionUrl=.*#distributionUrl=https\\\\://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip#g" \
            android/gradle/wrapper/gradle-wrapper.properties

          # Force exact SDK versions.
          sed -i \
            -E "s/(compileSdkVersion[[:space:]]*=[[:space:]]*)[0-9]+/\\136/g" \
            android/variables.gradle

          sed -i \
            -E "s/(targetSdkVersion[[:space:]]*=[[:space:]]*)[0-9]+/\\136/g" \
            android/variables.gradle

          grep -Eq \
            'compileSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

          grep -Eq \
            'targetSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

          grep -Fq \
            "com.android.tools.build:gradle:${AGP_VERSION}" \
            android/build.gradle

          grep -Fq \
            "gradle-${GRADLE_VERSION}-bin.zip" \
            android/gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "Android 16 / API 36 configuration: PASS"
          echo "AGP: ${AGP_VERSION}"
          echo "Gradle: ${GRADLE_VERSION}"


      # ============================================================
      # 24. FORCE MIN SDK 23
      # ============================================================

      - name: Enforce min SDK 23
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("android/variables.gradle")

          s = p.read_text(
              encoding="utf-8"
          )

          if not re.search(
              r"\bminSdkVersion\s*=",
              s
          ):
              raise SystemExit(
                  "ERROR: minSdkVersion not found."
              )

          s = re.sub(
              r"(\bminSdkVersion\s*=\s*)\d+",
              r"\g<1>23",
              s,
              count=1
          )

          p.write_text(
              s,
              encoding="utf-8"
          )

          print("minSdkVersion = 23 configured.")
          PY

          grep -Eq \
            'minSdkVersion[[:space:]]*=[[:space:]]*23' \
            android/variables.gradle

          echo "minSdkVersion 23: PASS"


      # ============================================================
      # 25. CAPACITOR SYNC
      # ============================================================

      - name: Capacitor sync Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npx cap sync android

          echo "Capacitor sync: PASS"


      # ============================================================
      # 26. RKMS NATIVE ANDROID SETUP
      # ============================================================

      - name: Configure RKMS native Android features
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x scripts/setup-android-native.sh

          ./scripts/setup-android-native.sh

          echo "RKMS native Android setup: PASS"


      # ============================================================
      # 27. VERIFY FIREBASE CONFIG
      # ============================================================

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          test -s google-services.json
          test -s android/app/google-services.json

          python3 <<'PY'
          import json
          from pathlib import Path

          for filename in [
              "google-services.json",
              "android/app/google-services.json"
          ]:

              data = json.loads(
                  Path(filename).read_text(
                      encoding="utf-8"
                  )
              )

              found = False

              for client in data.get("client", []):

                  package_name = (
                      client
                      .get("client_info", {})
                      .get("android_client_info", {})
                      .get("package_name")
                  )

                  if package_name == "org.rkms.connect":
                      found = True
                      break

              if not found:
                  raise SystemExit(
                      f"Firebase package mismatch in {filename}"
                  )

              print(
                  f"{filename}: Firebase package PASS"
              )
          PY


      # ============================================================
      # 28. CONFIGURE FIREBASE + CREDENTIAL MANAGER
      # ============================================================

      - name: Configure Firebase Messaging and Credential Manager
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")

          s = p.read_text(
              encoding="utf-8"
          )

          marker = "dependencies {"

          if marker not in s:
              raise SystemExit(
                  "ERROR: dependencies block missing."
              )

          deps = [
              'implementation platform("com.google.firebase:firebase-bom:34.19.0")',
              'implementation "com.google.firebase:firebase-messaging"',
              'implementation "androidx.credentials:credentials:1.5.0"',
              'implementation "androidx.credentials:credentials-play-services-auth:1.5.0"'
          ]

          for dep in deps:

              if dep not in s:
                  s = s.replace(
                      marker,
                      marker + "\n    " + dep,
                      1
                  )

          p.write_text(
              s,
              encoding="utf-8"
          )

          print(
              "Firebase + Credential Manager configured."
          )
          PY


      # ============================================================
      # 29. VERIFY NATIVE DEPENDENCIES
      # ============================================================

      - name: Verify native dependencies and features
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          grep -Fq \
            "firebase-bom:34.19.0" \
            app/build.gradle

          grep -Fq \
            "firebase-messaging" \
            app/build.gradle

          grep -Fq \
            "androidx.credentials:credentials:1.5.0" \
            app/build.gradle

          grep -Fq \
            "androidx.credentials:credentials-play-services-auth:1.5.0" \
            app/build.gradle

          grep -Rqs \
            "FirebaseApp.initializeApp" \
            app/src/main

          grep -Rqs \
            "RKMSNativeBridge" \
            app/src/main

          grep -Rqs \
            "RECORD_AUDIO" \
            app/src/main

          echo "Firebase dependencies: PASS"
          echo "Credential Manager: PASS"
          echo "FirebaseApp initialization: PASS"
          echo "RKMS Native Bridge: PASS"
          echo "Microphone permission: PASS"


      # ============================================================
      # 30. VERIFY PACKAGE ID
      # ============================================================

      - name: Verify Android package ID
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          grep -Rqs \
            "org.rkms.connect" \
            android/app

          echo "Package ID org.rkms.connect: PASS"


      # ============================================================
      # 31. VERIFY SIGNING SECRETS
      # ============================================================

      - name: Verify release signing secrets
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          if [ -z "${RKMS_KEYSTORE_BASE64:-}" ]; then
            echo "::error::RKMS_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [ -z "${RKMS_KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::RKMS_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "${RKMS_KEY_ALIAS:-}" ]; then
            echo "::error::RKMS_KEY_ALIAS secret is missing."
            exit 1
          fi

          if [ -z "${RKMS_KEY_PASSWORD:-}" ]; then
            echo "::error::RKMS_KEY_PASSWORD secret is missing."
            exit 1
          fi

          echo "Release signing secrets: PASS"


      # ============================================================
      # 32. CONFIGURE RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x scripts/configure-release-signing.sh

          ./scripts/configure-release-signing.sh

          if [ ! -s android/app/release.keystore ]; then
            echo "::error::Release keystore was not created."
            exit 1
          fi

          keytool \
            -list \
            -keystore android/app/release.keystore \
            -storepass "$RKMS_KEYSTORE_PASSWORD" \
            -alias "$RKMS_KEY_ALIAS" \
            >/dev/null

          echo "Release keystore validation: PASS"


      # ============================================================
      # 33. VERIFY SIGNING CONFIGURATION
      # ============================================================

      - name: Verify release signing configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          test -s app/release.keystore

          grep -Fq \
            "signingConfigs" \
            app/build.gradle

          grep -Fq \
            "signingConfig signingConfigs.release" \
            app/build.gradle

          grep -Fq \
            'storeFile file("release.keystore")' \
            app/build.gradle

          echo "Release signing configuration: PASS"


      # ============================================================
      # 34. GRADLE VERSION
      # ============================================================

      - name: Verify Gradle project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          chmod +x gradlew

          ./gradlew \
            --version

          echo "Gradle configuration: PASS"


      # ============================================================
      # 35. CLEAN
      # ============================================================

      - name: Clean Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          ./gradlew \
            clean \
            --no-daemon \
            --stacktrace

          echo "Clean: PASS"


      # ============================================================
      # 36. BUILD SIGNED RELEASE APK ONLY
      # ============================================================

      - name: Build Final Signed Release APK Only
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          echo "=============================================="
          echo "RKMS FINAL SIGNED RELEASE APK"
          echo "=============================================="

          echo "SOURCE ZIP  : ${SOURCE_ZIP}"
          echo "API         : ${ANDROID_API}"
          echo "BUILD TOOLS : ${BUILD_TOOLS}"
          echo "MIN SDK     : ${MIN_SDK}"
          echo "TARGET SDK  : ${TARGET_SDK}"
          echo "AGP         : ${AGP_VERSION}"
          echo "GRADLE      : ${GRADLE_VERSION}"
          echo "PACKAGE     : ${APP_ID}"
          echo "SIGNED      : YES"
          echo "APK ONLY    : YES"
          echo "DEBUG APK   : NO"
          echo "AAB         : NO"

          echo "=============================================="

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          APK_OUTPUT="app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK_OUTPUT" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          echo ""
          echo "Signed release APK build: PASS"


      # ============================================================
      # 37. LOCATE FINAL APK
      # ============================================================

      - name: Locate final release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          APK="$(
            find \
              app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              ! -iname "*debug*" \
              -print \
              | head -n 1 || true
          )"

          if [ -z "$APK" ]; then
            echo "::error::Release APK not found."

            find \
              app/build/outputs \
              -type f \
              -print \
              || true

            exit 1
          fi

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/${APK_NAME}"

          echo \
            "APK_PATH=$GITHUB_WORKSPACE/${APK_NAME}" \
            >> "$GITHUB_ENV"

          echo ""
          echo "Final APK:"
          ls -lh \
            "$GITHUB_WORKSPACE/${APK_NAME}"


      # ============================================================
      # 38. VERIFY APK PACKAGE + TARGET SDK
      # ============================================================

      - name: Verify APK package and SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          AAPT="$SDK/build-tools/${BUILD_TOOLS}/aapt"

          "$AAPT" \
            dump badging \
            "$APK_PATH" \
            > apk-badging.txt

          cat apk-badging.txt

          grep -Fq \
            "package: name='${APP_ID}'" \
            apk-badging.txt

          grep -Fq \
            "targetSdkVersion:'36'" \
            apk-badging.txt

          echo ""
          echo "APK package ID: PASS"
          echo "APK target SDK 36: PASS"


      # ============================================================
      # 39. VERIFY APK SIGNATURE
      # ============================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          "$SDK/build-tools/${BUILD_TOOLS}/apksigner" \
            verify \
            --verbose \
            "$APK_PATH"

          echo "APK signature: PASS"


      # ============================================================
      # 40. PRINT SIGNER CERTIFICATE
      # ============================================================

      - name: Verify APK signer certificate
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          "$SDK/build-tools/${BUILD_TOOLS}/apksigner" \
            verify \
            --print-certs \
            "$APK_PATH"


      # ============================================================
      # 41. APK SHA256
      # ============================================================

      - name: Generate APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          sha256sum \
            "$APK_NAME" \
            | tee \
              "${APK_NAME}.sha256"


      # ============================================================
      # 42. FINAL APK-ONLY AUDIT
      # ============================================================

      - name: Final APK-only audit
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          test -s "$APK_NAME"
          test -s "${APK_NAME}.sha256"

          # No AAB
          if find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.aab" \
            -print \
            | grep -q .
          then
            echo "::error::AAB detected."
            exit 1
          fi

          # No debug APK
          if find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "*debug*.apk" \
            -print \
            | grep -q .
          then
            echo "::error::Debug APK detected."
            exit 1
          fi

          SIZE_BYTES="$(
            stat -c%s "$APK_NAME"
          )"

          if [ "$SIZE_BYTES" -le 1000000 ]; then
            echo "::error::APK unexpectedly small."
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "FINAL APK AUDIT PASSED"
          echo "=============================================="

          echo "APK ONLY    : YES"
          echo "AAB         : NO"
          echo "DEBUG APK   : NO"
          echo "SIGNED      : YES"
          echo "API         : ${ANDROID_API}"
          echo "MIN SDK     : ${MIN_SDK}"
          echo "TARGET SDK  : ${TARGET_SDK}"
          echo "PACKAGE     : ${APP_ID}"
          echo "APK         : ${APK_NAME}"
          echo "SIZE        : ${SIZE_BYTES}"

          echo ""
          echo "APK SHA256:"
          cat "${APK_NAME}.sha256"

          echo ""
          echo "=============================================="


      # ============================================================
      # 43. UPLOAD FINAL APK + SHA256 ONLY
      # ============================================================

      - name: Upload final APK and SHA256
        uses: actions/upload-artifact@v4
        with:
          name: RKMS_ANDROID16_API36_SIGNED_RELEASE_APK
          if-no-files-found: error
          path: |
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256
          retention-days: 30

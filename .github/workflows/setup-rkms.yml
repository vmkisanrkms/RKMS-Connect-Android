name: RKMS Android 16 API 36 - Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-apk:
    name: RKMS Android 16 / API 36 - Release APK
    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v7


      # ==========================================================
      # 2. PREPARE RKMS V21 SOURCE
      # ==========================================================

      - name: Prepare RKMS source root
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking RKMS source..."

          if [ ! -f package.json ]; then

            PACKAGE="$(
              find . -maxdepth 1 -type f \
                -name 'RKMS_CONNECT_V21*.zip' \
                -print -quit
            )"

            if [ -z "${PACKAGE:-}" ]; then
              echo "ERROR: package.json not found."
              echo "ERROR: RKMS V21 ZIP not found."
              exit 1
            fi

            echo "Using:"
            echo "$PACKAGE"

            rm -rf .rkms_extract
            mkdir -p .rkms_extract

            unzip -q "$PACKAGE" -d .rkms_extract

            SOURCE_DIR="$(
              find .rkms_extract \
                -mindepth 1 \
                -maxdepth 2 \
                -type d \
                -name 'rkms_android' \
                -print -quit
            )"

            if [ -z "${SOURCE_DIR:-}" ]; then
              echo "ERROR: rkms_android directory not found."
              find .rkms_extract -maxdepth 3 -print
              exit 1
            fi

            # IMPORTANT:
            # Keep the real GitHub workflow from the repository.
            # The ZIP's internal .github directory is not copied.
            rsync -a \
              --exclude='.github/' \
              "$SOURCE_DIR"/ \
              ./

            rm -rf .rkms_extract
          fi

          test -f package.json
          test -f app.js
          test -f index.html
          test -f styles.css
          test -f capacitor.config.json
          test -f google-services.json
          test -d scripts
          test -d supabase/migrations

          echo
          echo "RKMS SOURCE ROOT: PASS"


      # ==========================================================
      # 3. NODE 22
      # ==========================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false


      - name: Verify Node.js and JavaScript
        shell: bash
        run: |
          set -euo pipefail

          node --version
          npm --version

          node --check app.js

          echo
          echo "Node.js 22: PASS"
          echo "app.js syntax: PASS"


      # ==========================================================
      # 4. NPM DEPENDENCIES
      # ==========================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          npm install --no-audit --no-fund

          npm ls @capacitor/core --depth=0
          npm ls @capacitor/android --depth=0
          npm ls @capacitor/app --depth=0
          npm ls @capacitor/push-notifications --depth=0

          echo
          echo "Capacitor Core: PASS"
          echo "Capacitor Android: PASS"
          echo "Capacitor App: PASS"
          echo "Push Notifications: PASS"


      # ==========================================================
      # 5. JDK 17
      # ==========================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"


      - name: Verify JDK 17
        shell: bash
        run: |
          set -euo pipefail

          java -version
          javac -version

          echo "JDK 17: PASS"


      # ==========================================================
      # 6. ANDROID SDK
      # ==========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # IMPORTANT:
          # Do NOT install obsolete "tools".
          packages: ''


      # ==========================================================
      # 7. ANDROID 16 / API 36 SDK
      # ==========================================================

      - name: Install Android 16 API 36 SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

          echo
          echo "=============================================="
          echo " ANDROID 16 / API 36 SDK"
          echo "=============================================="
          echo
          echo "Platform Tools      : PASS"
          echo "Android Platform 36 : PASS"
          echo "Build Tools 36.0.0  : PASS"
          echo
          echo "=============================================="


      # ==========================================================
      # 8. PYTHON / SHELL STATIC AUDIT
      # ==========================================================

      - name: Audit RKMS scripts
        shell: bash
        run: |
          set -euo pipefail

          for file in scripts/*.sh; do
            bash -n "$file"
          done

          python3 -m py_compile scripts/*.py

          echo "Shell scripts: PASS"
          echo "Python scripts: PASS"


      # ==========================================================
      # 9. BUILD WEB APPLICATION
      # ==========================================================

      - name: Build RKMS web application
        shell: bash
        run: |
          set -euo pipefail

          npm run build

          test -d dist
          test -f dist/index.html

          echo "Web build: PASS"


      # ==========================================================
      # 10. CAPACITOR ANDROID PROJECT
      # ==========================================================

      - name: Add Capacitor Android platform
        shell: bash
        run: |
          set -euo pipefail

          npx cap add android

          test -d android
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle
          test -f android/gradlew

          echo "Capacitor Android project: PASS"


      # ==========================================================
      # 11. FIREBASE CONFIGURATION
      # ==========================================================

      - name: Install Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          test -f google-services.json

          cp google-services.json \
            android/app/google-services.json

          test -f android/app/google-services.json

          echo "Firebase configuration: PASS"


      # ==========================================================
      # 12. ANDROID 16 CONFIGURATION
      # ==========================================================

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/configure-android-16.sh

          bash scripts/configure-android-16.sh


      # ==========================================================
      # 13. CAPACITOR SYNC
      # ==========================================================

      - name: Capacitor sync Android
        shell: bash
        run: |
          set -euo pipefail

          npx cap sync android


      # ==========================================================
      # 14. RKMS NATIVE ANDROID SETUP
      # ==========================================================

      - name: Setup RKMS native Android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/setup-android-native.sh

          bash scripts/setup-android-native.sh


      # ==========================================================
      # 15. ANDROID 16 AUDIT
      # ==========================================================

      - name: Verify Android 16 configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-android-16.py


      # ==========================================================
      # 16. PDF AUDIT
      # ==========================================================

      - name: Verify Android PDF pipeline
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-android-pdf.py


      # ==========================================================
      # 17. NATIVE BRIDGE AUDIT
      # ==========================================================

      - name: Verify native bridge
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-native-bridge.py


      # ==========================================================
      # 18. CORE RKMS AUDIT
      # ==========================================================

      - name: Verify final RKMS application
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-rkms-final.py


      # ==========================================================
      # 19. FCM AUDIT
      # ==========================================================

      - name: Audit FCM pipeline
        shell: bash
        run: |
          set -euo pipefail

          test -f google-services.json
          test -f android/app/google-services.json

          grep -q \
            'com.google.gms:google-services:4.4.3' \
            scripts/setup-android-native.sh

          grep -q \
            'com.google.gms.google-services' \
            scripts/setup-android-native.sh

          grep -q \
            'async function rkmsRegisterFcmPush' \
            app.js

          grep -q \
            'function rkmsDeviceId' \
            app.js

          grep -q \
            'device_id:rkmsDeviceId()' \
            app.js

          grep -q \
            "addListener('registration'" \
            app.js

          grep -q \
            "addListener('pushNotificationReceived'" \
            app.js

          grep -q \
            "addListener('pushNotificationActionPerformed'" \
            app.js

          grep -q \
            'rkms_notifications_v2' \
            app.js

          grep -q \
            'createRkmsNotificationChannel' \
            scripts/setup-android-native.sh

          grep -q \
            'default_notification_channel_id' \
            scripts/setup-android-native.sh

          grep -q \
            'rkms_default_notification_channel_id' \
            scripts/setup-android-native.sh

          grep -q \
            'visibilitychange' \
            app.js

          grep -q \
            'rkms-fcm-push' \
            app.js

          CHAT_START="$(
            grep -n \
              'async function sendChatMessage' \
              app.js \
              | head -n1 \
              | cut -d: -f1
          )"

          CHAT_END="$(
            grep -n \
              'function showChatActionSheet' \
              app.js \
              | head -n1 \
              | cut -d: -f1
          )"

          if [ -n "${CHAT_START:-}" ] && \
             [ -n "${CHAT_END:-}" ] && \
             [ "$CHAT_END" -gt "$CHAT_START" ]; then

            if sed -n "${CHAT_START},${CHAT_END}p" app.js \
              | grep -q 'rkms-fcm-dispatch'; then

              echo "ERROR: duplicate client chat push fallback found."
              exit 1
            fi

          fi

          echo
          echo "FCM registration: PASS"
          echo "FCM listeners: PASS"
          echo "FCM notification channel: PASS"
          echo "FCM background configuration: PASS"
          echo "FCM duplicate protection: PASS"


      # ==========================================================
      # 20. SAVED LOGIN AUDIT
      # ==========================================================

      - name: Audit saved login pipeline
        shell: bash
        run: |
          set -euo pipefail

          grep -q \
            'function rkmsSaveLoginCredentials(identifier,password)' \
            app.js

          grep -q \
            'await p.save({identifier:String(identifier).trim(),password:String(password)})' \
            app.js

          grep -q \
            'const check=await p.getSavedIdentifier()' \
            app.js

          grep -q \
            'function rkmsRestoreLoginCredentials(inputId,passwordId)' \
            app.js

          grep -q \
            'p.authenticateAndGetCredentials()' \
            app.js

          grep -q \
            'let rkmsSavedLoginUsed=false;' \
            app.js

          grep -q \
            'let rkmsFillingSavedLogin=false;' \
            app.js

          grep -q \
            'rkmsSavedLoginUsed=true;' \
            app.js

          grep -q \
            'RKMSSecureCredentialsPlugin' \
            scripts/setup-android-native.sh

          grep -q \
            'registerPlugin(RKMSSecureCredentialsPlugin.class);' \
            scripts/setup-android-native.sh

          grep -q \
            'AES/GCM/NoPadding' \
            scripts/setup-android-native.sh

          grep -q \
            'AndroidKeyStore' \
            scripts/setup-android-native.sh

          grep -q \
            'BiometricPrompt' \
            scripts/setup-android-native.sh

          grep -q \
            'androidx.biometric:biometric:1.1.0' \
            scripts/setup-android-native.sh

          echo
          echo "Encrypted AndroidKeyStore: PASS"
          echo "Saved credential restore: PASS"
          echo "Biometric/device credential: PASS"
          echo "Native secure plugin: PASS"
          echo "Saved login pipeline: PASS"


      # ==========================================================
      # 21. COMPLAINT WORKFLOW AUDIT
      # ==========================================================

      - name: Audit complaint workflow
        shell: bash
        run: |
          set -euo pipefail

          APP="app.js"
          CSS="styles.css"

          OFFICER_SQL="supabase/migrations/20260915090000_complaint_officer_close.sql"
          HARDENING_SQL="supabase/migrations/20260914191000_complaint_workflow_final_hardening.sql"

          test -f "$OFFICER_SQL"
          test -f "$HARDENING_SQL"

          grep -q \
            'memberCloseComplaint' \
            "$APP"

          grep -q \
            'memberReopenComplaint' \
            "$APP"

          grep -q \
            'memberReopenReason' \
            "$APP"

          grep -q \
            'officerCloseComplaint' \
            "$APP"

          grep -q \
            'c.status==="RESOLVED"' \
            "$APP"

          grep -q \
            'rkms_officer_close_complaint' \
            "$APP"

          grep -q \
            "if v_old<>'RESOLVED'" \
            "$OFFICER_SQL"

          grep -q \
            "if v_old<>'RESOLVED'" \
            "$HARDENING_SQL"

          grep -q \
            "nullif(trim(p_reason),'') is null" \
            "$HARDENING_SQL"

          grep -q \
            "v_old not in ('RESOLVED','CLOSED')" \
            "$HARDENING_SQL"

          grep -q \
            '.complaint-action-card' \
            "$CSS"

          echo
          echo "Member close: PASS"
          echo "Member reopen: PASS"
          echo "Officer close: PASS"
          echo "Backend RESOLVED guard: PASS"
          echo "Reopen reason guard: PASS"
          echo "Complaint UI: PASS"


      # ==========================================================
      # 22. ORIGINAL RKMS LAUNCHER AUDIT
      # ==========================================================

      - name: Audit original RKMS launcher
        shell: bash
        run: |
          set -euo pipefail

          test -f \
            assets/rkms-launcher-original-transparent.png

          for density in \
            mdpi \
            hdpi \
            xhdpi \
            xxhdpi \
            xxxhdpi
          do
            test -f \
              "android_launcher_icons/mipmap-$density/ic_launcher.png"

            test -f \
              "android_launcher_icons/mipmap-$density/ic_launcher_round.png"
          done

          test -f \
            android_launcher_icons/drawable-nodpi/rkms_launcher_foreground.png

          echo "Original RKMS launcher assets: PASS"


      # ==========================================================
      # 23. NO X/TWITTER RUNTIME REFERENCES
      # ==========================================================

      - name: Audit no X Twitter references
        shell: bash
        run: |
          set -euo pipefail

          if grep -RniE \
            'twitter\.com|x\.com/|twitter:card' \
            app.js \
            index.html \
            styles.css \
            assets \
            android_launcher_icons \
            2>/dev/null
          then
            echo "ERROR: X/Twitter runtime reference found."
            exit 1
          fi

          echo "No X/Twitter runtime reference: PASS"


      # ==========================================================
      # 24. APK ONLY POLICY
      # ==========================================================

      - name: Verify APK only policy
        shell: bash
        run: |
          set -euo pipefail

          WORKFLOW="$GITHUB_WORKSPACE/.github/workflows/setup-rkms.yml"

          test -f "$WORKFLOW"

          grep -q \
            'assembleRelease' \
            "$WORKFLOW"

          if grep -q \
            'bundleRelease' \
            "$WORKFLOW"
          then
            echo "ERROR: bundleRelease/AAB build found."
            exit 1
          fi

          echo
          echo "assembleRelease: PASS"
          echo "bundleRelease: NOT FOUND"
          echo "APK-only workflow: PASS"


      # ==========================================================
      # 25. RELEASE SIGNING CHECK
      # ==========================================================

      - name: Check release signing configuration
        id: signing
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${RKMS_KEYSTORE_BASE64:-}" ] && \
             [ -n "${RKMS_KEYSTORE_PASSWORD:-}" ] && \
             [ -n "${RKMS_KEY_ALIAS:-}" ] && \
             [ -n "${RKMS_KEY_PASSWORD:-}" ]
          then

            echo "enabled=true" >> "$GITHUB_OUTPUT"

            echo "Release signing: ENABLED"

          else

            echo "enabled=false" >> "$GITHUB_OUTPUT"

            echo "Release signing secrets unavailable."
            echo "Unsigned Release APK fallback will be used."

          fi


      # ==========================================================
      # 26. PREPARE RELEASE KEYSTORE
      # ==========================================================

      - name: Prepare release keystore
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$RKMS_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/release.keystore

          chmod 600 \
            android/app/release.keystore

          test -s \
            android/app/release.keystore

          echo "Release keystore: PASS"


      # ==========================================================
      # 27. CONFIGURE RELEASE SIGNING
      # ==========================================================

      - name: Configure release signing
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          chmod +x \
            scripts/configure-release-signing.sh

          bash \
            scripts/configure-release-signing.sh


      # ==========================================================
      # 28. VERIFY GRADLE
      # ==========================================================

      - name: Verify Gradle
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew --version


      # ==========================================================
      # 29. CLEAN ANDROID
      # ==========================================================

      - name: Clean Android
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            clean \
            --no-daemon


      # ==========================================================
      # 30. BUILD RELEASE APK ONLY
      # ==========================================================

      - name: Build RELEASE APK ONLY
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            assembleRelease \
            --no-daemon \
            --stacktrace


      # ==========================================================
      # 31. VERIFY APK
      # ==========================================================

      - name: Verify Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"
          test -s "$APK"

          echo
          echo "=============================================="
          echo " RKMS RELEASE APK READY"
          echo "=============================================="
          echo
          echo "Android Version : 16"
          echo "API Level       : 36"
          echo "APK             : app-release.apk"
          echo
          ls -lh "$APK"
          echo
          echo "=============================================="


      # ==========================================================
      # 32. VERIFY APK SIGNATURE
      # ==========================================================

      - name: Verify signed APK
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          test -x "$APKSIGNER"

          "$APKSIGNER" verify \
            --verbose \
            android/app/build/outputs/apk/release/app-release.apk

          echo "Release APK signature: PASS"


      # ==========================================================
      # 33. UPLOAD APK ONLY
      # ==========================================================

      - name: Upload Release APK
        uses: actions/upload-artifact@v6
        with:
          name: RKMS-Android-16-API36-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30


      # ==========================================================
      # 34. FINAL SUMMARY
      # ==========================================================

      - name: Final APK build summary
        shell: bash
        run: |
          echo
          echo "=================================================="
          echo " RKMS CONNECT - FINAL RELEASE APK"
          echo "=================================================="
          echo
          echo "Android Version : 16"
          echo "API Level       : 36"
          echo "Node.js         : 22"
          echo "JDK             : 17"
          echo "AGP             : 8.9.1"
          echo "Gradle          : 8.11.1"
          echo
          echo "Source          : VERIFIED"
          echo "Capacitor       : VERIFIED"
          echo "FCM             : VERIFIED"
          echo "Saved Login     : VERIFIED"
          echo "PDF             : VERIFIED"
          echo "Native Bridge   : VERIFIED"
          echo "Complaints      : VERIFIED"
          echo "Launcher        : VERIFIED"
          echo
          echo "Release APK     : SUCCESS"
          echo "AAB             : NOT BUILT"
          echo
          echo "=================================================="

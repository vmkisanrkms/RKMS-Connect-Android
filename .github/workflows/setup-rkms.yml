name: Build RKMS APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RKMS APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Find and extract RKMS ZIP
      - name: Extract RKMS project ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "RKMS APK BUILD"
          echo "======================================"

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -name 'RKMS_Connect_*.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: RKMS_Connect_*.zip not found."
            echo ""
            echo "ZIP files available:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -name '*.zip' \
              -print || true
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP_FILE"

          TMP_DIR="$RUNNER_TEMP/rkms-project"

          rm -rf "$TMP_DIR"
          mkdir -p "$TMP_DIR"

          unzip -q "$ZIP_FILE" -d "$TMP_DIR"

          echo ""
          echo "ZIP extracted."

          # Find Android project by settings.gradle
          PROJECT_DIR="$(
            find "$TMP_DIR" \
              -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -print -quit |
              xargs -r dirname
          )"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found inside ZIP."
            echo ""
            echo "Extracted files:"
            find "$TMP_DIR" -maxdepth 5 -type f | sort | head -300
            exit 1
          fi

          echo ""
          echo "Android project directory:"
          echo "$PROJECT_DIR"

          # Copy extracted Android project to repository root.
          # Keep .github workflow from repository.
          rsync -a \
            --exclude='.github/' \
            "$PROJECT_DIR/" \
            "$GITHUB_WORKSPACE/"

          echo ""
          echo "Project copied to repository root."

          echo ""
          echo "Repository root:"
          ls -la "$GITHUB_WORKSPACE"

      # 3. Verify Android project
      - name: Verify RKMS Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "RKMS PROJECT VERIFICATION"
          echo "======================================"

          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          if [ ! -f build.gradle ] && [ ! -f build.gradle.kts ]; then
            echo "ERROR: root build.gradle not found."
            exit 1
          fi

          if [ ! -f gradle.properties ]; then
            echo "ERROR: gradle.properties not found."
            exit 1
          fi

          if [ ! -d app ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
            echo "ERROR: app Gradle file not found."
            exit 1
          fi

          if [ ! -f app/src/main/AndroidManifest.xml ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          echo ""
          echo "Android project structure: PASS"

      # 4. Verify app name
      - name: Verify app name is RKMS
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "APP NAME CHECK"
          echo "======================================"

          FOUND=0

          if [ -f app/src/main/res/values/strings.xml ]; then
            if grep -q '<string name="app_name">RKMS</string>' \
              app/src/main/res/values/strings.xml; then
              FOUND=1
            fi
          fi

          if [ "$FOUND" -ne 1 ]; then
            echo "ERROR: Android app name is not set to RKMS."
            echo ""
            echo "strings.xml:"
            cat app/src/main/res/values/strings.xml 2>/dev/null || true
            exit 1
          fi

          echo "Android app name: RKMS"
          echo "App name check: PASS"

      # 5. Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 6. Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 7. Install SDK packages
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # 8. Accept licenses
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      # 9. Gradle 8.10.2
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # 10. Show environment
      - name: Show build environment
        shell: bash
        run: |
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

      # 11. Validate Gradle
      - name: Validate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon tasks

      # 12. Clean
      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon clean

      # 13. Build APK
      - name: Build RKMS Debug APK
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "BUILDING RKMS APK"
          echo "======================================"

          gradle --no-daemon assembleDebug

      # 14. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo ""
            echo "Available build files:"
            find app/build -type f | sort || true

            exit 1
          fi

          echo ""
          echo "======================================"
          echo "RKMS APK BUILD SUCCESS"
          echo "======================================"

          echo ""
          echo "APK:"
          ls -lh "$APK"

      # 15. Upload APK
      - name: Upload RKMS APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

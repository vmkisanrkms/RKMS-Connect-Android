name: RKMS Android 16 API 36 - Final Signed Release APK Only

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  NODE_VERSION: "22"
  JAVA_VERSION: "17"

  AGP_VERSION: "8.10.0"
  GRADLE_VERSION: "8.11.1"

  FIREBASE_BOM_VERSION: "34.19.0"
  GOOGLE_SERVICES_VERSION: "4.4.3"
  CREDENTIALS_VERSION: "1.5.0"

  APP_ID: "org.rkms.connect"
  MIN_SDK: "23"
  TARGET_SDK: "36"

  # ============================================================
  # ZIP ALREADY PRESENT IN YOUR GITHUB REPOSITORY
  # ============================================================

  SOURCE_ZIP: "RKMS_CONNECT_FINAL_AUDITED_RELEASE_APK_BUILD_20260922.zip"

  EXPECTED_SOURCE_SHA256: "6907af2bd83ccb6a36b0aa177861ae0731c6f53501430b9fe05fd5b905d65299"

  APK_NAME: "RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"


jobs:

  build:

    name: Build Final Signed Release APK Only

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. NODE 22
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}


      # ============================================================
      # 3. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # ============================================================
      # 4. VERIFY SOURCE ZIP
      # ============================================================

      - name: Verify exact RKMS source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "RKMS SOURCE ZIP VERIFICATION"
          echo "=============================================="

          if [ ! -f "${SOURCE_ZIP}" ]; then
            echo "::error::Required RKMS source ZIP not found."

            echo ""
            echo "Available ZIP files:"
            find . \
              -type f \
              \( -iname "*.zip" -o -iname "*.ZIP" \) \
              -print \
              | sort || true

            exit 1
          fi

          test -s "${SOURCE_ZIP}"

          ACTUAL_SHA256="$(
            sha256sum "${SOURCE_ZIP}" | awk '{print $1}'
          )"

          echo ""
          echo "Expected:"
          echo "${EXPECTED_SOURCE_SHA256}"

          echo ""
          echo "Actual:"
          echo "${ACTUAL_SHA256}"

          if [ "${ACTUAL_SHA256}" != "${EXPECTED_SOURCE_SHA256}" ]; then
            echo "::error::Source ZIP SHA256 mismatch."
            exit 1
          fi

          echo ""
          echo "Source ZIP SHA256: PASS"


      # ============================================================
      # 5. SAVE ZIP HASH
      # ============================================================

      - name: Save source ZIP SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum "${SOURCE_ZIP}" \
            | tee source-zip.sha256


      # ============================================================
      # 6. EXTRACT SOURCE
      # ============================================================

      - name: Extract RKMS source ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build-project
          mkdir -p build-project

          unzip -q "${SOURCE_ZIP}" -d build-project

          echo "Source extraction: PASS"


      # ============================================================
      # 7. DETECT ROOT
      # ============================================================

      - name: Detect RKMS project root
        shell: bash
        run: |
          set -euo pipefail

          ROOT=""

          if [ -f "build-project/package.json" ]; then
            ROOT="build-project"
          else

            FOUND_PACKAGE="$(
              find build-project \
                -type f \
                -name "package.json" \
                -not -path "*/node_modules/*" \
                -print \
                | head -n 1 || true
            )"

            if [ -n "$FOUND_PACKAGE" ]; then
              ROOT="$(dirname "$FOUND_PACKAGE")"
            fi

          fi

          if [ -z "$ROOT" ]; then
            echo "::error::package.json not found."
            exit 1
          fi

          echo "RKMS_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo ""
          echo "RKMS_ROOT=$ROOT"


      # ============================================================
      # 8. VALIDATE SOURCE FILES
      # ============================================================

      - name: Validate RKMS source
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          REQUIRED_FILES=(
            "package.json"
            "package-lock.json"
            "app.js"
            "index.html"
            "styles.css"
            "capacitor.config.json"
            "google-services.json"

            "scripts/setup-android-native.sh"
            "scripts/configure-android-16.sh"
            "scripts/configure-release-signing.sh"

            "scripts/verify-3-point-fix-20260921.py"
            "scripts/verify-final-three-point-fix.py"
            "scripts/verify-rkms-final-fixes.py"
            "scripts/verify-fcm-pipeline.py"
            "scripts/verify-android-pdf.py"
            "scripts/verify-native-bridge.py"
          )

          for file in "${REQUIRED_FILES[@]}"; do

            if [ ! -f "$file" ]; then
              echo "::error::Missing required file: $file"
              exit 1
            fi

            echo "OK: $file"

          done

          echo ""
          echo "Source files: PASS"


      # ============================================================
      # 9. REPAIR setup-android-native.sh
      #
      # IMPORTANT:
      # Existing ZIP contains a malformed Python heredoc around
      # notification icon / AndroidManifest generation.
      #
      # This step repairs it BEFORE bash -n and BEFORE execution.
      # ============================================================

      - name: Repair setup-android-native.sh
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 <<'PY'
          from pathlib import Path

          p = Path("scripts/setup-android-native.sh")

          s = p.read_text(encoding="utf-8")

          start_marker = """python3 - <<'PY3'
          from pathlib import Path
          # Stable white notification icon for FCM system notifications.
          """

          if start_marker not in s:
              print("Notification block already fixed or different version detected.")
              raise SystemExit(0)

          start = s.index(start_marker)

          end_marker = """PY3


          MAIN="$MAIN_ACTIVITY"
          """

          end = s.find(end_marker, start)

          if end == -1:
              raise SystemExit(
                  "ERROR: Could not locate malformed notification block end."
              )

          replacement = r'''# Stable white notification icon for FCM system notifications.
          DRAWABLE_DIR="$RES_DIR/drawable"
          mkdir -p "$DRAWABLE_DIR"

          cat > "$DRAWABLE_DIR/ic_stat_rkms.xml" <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">

              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M12,2A7,7 0,0 0,5 9v4l-2,3v1h18v-1l-2,-3V9A7,7 0,0 0,12 2M9,19a3,3 0,0 0,6,0z"/>
          </vector>
          XML

          python3 - <<'PY3'
          from pathlib import Path

          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()

          perm='    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'

          if 'android.permission.RECORD_AUDIO' not in s:
              pos=s.find('<application')

              if pos < 0:
                  raise SystemExit(
                      'AndroidManifest application tag missing'
                  )

              s=s[:pos]+perm+s[pos:]

          meta='    <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="@string/rkms_default_notification_channel_id" />\n    <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_rkms" />\n'

          if 'com.google.firebase.messaging.default_notification_channel_id' not in s:

              marker='<application'

              if marker not in s:
                  raise SystemExit(
                      'AndroidManifest application tag missing'
                  )

              s=s.replace(
                  marker,
                  '<application android:enableOnBackInvokedCallback="true"',
                  1
              )

              marker='</application>'

              if marker not in s:
                  raise SystemExit(
                      'AndroidManifest application closing tag missing'
                  )

              s=s.replace(
                  marker,
                  meta+marker,
                  1
              )

          p.write_text(s)

          print("AndroidManifest notification configuration: PASS")
          PY3


          MAIN="$MAIN_ACTIVITY"
          '''

          s = s[:start] + replacement + s[end + len(end_marker):]

          p.write_text(s, encoding="utf-8")

          print("setup-android-native.sh repaired: PASS")
          PY

          chmod +x scripts/setup-android-native.sh

          echo ""
          echo "setup-android-native.sh repair: PASS"


      # ============================================================
      # 10. VERIFY SHELL SYNTAX
      # ============================================================

      - name: Verify shell script syntax
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          echo "Checking setup-android-native.sh"
          bash -n scripts/setup-android-native.sh

          echo "Checking configure-android-16.sh"
          bash -n scripts/configure-android-16.sh

          echo "Checking configure-release-signing.sh"
          bash -n scripts/configure-release-signing.sh

          echo ""
          echo "Shell syntax: PASS"


      # ============================================================
      # 11. VERIFY PYTHON SYNTAX
      # ============================================================

      - name: Verify Python script syntax
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          for file in \
            scripts/verify-3-point-fix-20260921.py \
            scripts/verify-final-three-point-fix.py \
            scripts/verify-rkms-final-fixes.py \
            scripts/verify-fcm-pipeline.py \
            scripts/verify-android-pdf.py \
            scripts/verify-native-bridge.py
          do

            echo "Checking $file"

            python3 -m py_compile "$file"

          done

          echo ""
          echo "Python syntax: PASS"


      # ============================================================
      # 12. JAVASCRIPT SYNTAX
      # ============================================================

      - name: Verify app.js syntax
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node --check app.js

          echo "app.js syntax: PASS"


      # ============================================================
      # 13. LOW NETWORK FIXES
      # ============================================================

      - name: Verify low network fixes
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 \
            scripts/verify-3-point-fix-20260921.py

          python3 \
            scripts/verify-final-three-point-fix.py

          echo ""
          echo "Low-network fixes: PASS"


      # ============================================================
      # 14. EXISTING FINAL FIXES
      # ============================================================

      - name: Verify existing RKMS final fixes
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 \
            scripts/verify-rkms-final-fixes.py

          echo ""
          echo "Existing RKMS fixes: PASS"


      # ============================================================
      # 15. FCM
      # ============================================================

      - name: Verify FCM pipeline
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 \
            scripts/verify-fcm-pipeline.py

          echo ""
          echo "FCM pipeline: PASS"


      # ============================================================
      # 16. PDF
      # ============================================================

      - name: Verify Android PDF
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 \
            scripts/verify-android-pdf.py

          echo ""
          echo "Android PDF: PASS"


      # ============================================================
      # 17. NATIVE BRIDGE
      # ============================================================

      - name: Verify native bridge
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 \
            scripts/verify-native-bridge.py

          echo ""
          echo "Native bridge: PASS"


      # ============================================================
      # 18. CAPACITOR VERSION
      # ============================================================

      - name: Verify Capacitor versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node <<'NODE'
          const fs = require("fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const deps = {
            ...(pkg.dependencies || {}),
            ...(pkg.devDependencies || {})
          };

          const required = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          let failed = false;

          for (const [name, version] of Object.entries(required)) {

            const actual = deps[name];

            console.log(
              `${name}: required=${version}, actual=${actual || "MISSING"}`
            );

            if (!actual) {
              failed = true;
              continue;
            }

            const allowed = [
              version,
              `^${version}`,
              `~${version}`
            ];

            if (!allowed.includes(String(actual))) {
              console.error(
                `ERROR: ${name}: expected ${version}, found ${actual}`
              );

              failed = true;
            }

          }

          if (failed) {
            process.exit(1);
          }

          console.log("Capacitor validation PASS.");
          NODE


      # ============================================================
      # 19. NPM
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm ci \
            --no-audit \
            --no-fund

          echo "npm install: PASS"


      # ============================================================
      # 20. WEB BUILD
      # ============================================================

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm run build

          test -d dist
          test -s dist/index.html

          echo "Web build: PASS"


      # ============================================================
      # 21. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ============================================================
      # 22. INSTALL API 36
      # ============================================================

      - name: Install Android API 36 and Build Tools
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK" ]; then
            echo "::error::Android SDK path not found."
            exit 1
          fi

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then

            SDKMANAGER="$(
              find "$SDK/cmdline-tools" \
                -type f \
                -path "*/bin/sdkmanager" \
                -print \
                | head -n 1 || true
            )"

          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" \
            --licenses \
            >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          echo "Android API ${ANDROID_API}: PASS"
          echo "Build Tools ${BUILD_TOOLS}: PASS"


      # ============================================================
      # 23. VERIFY SDK
      # ============================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          test -d \
            "$SDK/platforms/android-${ANDROID_API}"

          test -d \
            "$SDK/build-tools/${BUILD_TOOLS}"

          test -x \
            "$SDK/build-tools/${BUILD_TOOLS}/aapt"

          test -x \
            "$SDK/build-tools/${BUILD_TOOLS}/apksigner"

          echo "Android SDK: PASS"


      # ============================================================
      # 24. CREATE CAPACITOR ANDROID
      # ============================================================

      - name: Create Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          rm -rf android

          npx cap add android

          test -d android
          test -f android/app/build.gradle
          test -f android/gradlew

          echo "Capacitor Android project: PASS"


      # ============================================================
      # 25. CONFIGURE ANDROID 16 / API 36
      # ============================================================

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x scripts/configure-android-16.sh

          bash -n scripts/configure-android-16.sh

          ./scripts/configure-android-16.sh

          # Force AGP 8.10.0
          sed -i \
            "s/com\\.android\\.tools\\.build:gradle:[0-9.][0-9.]*/com.android.tools.build:gradle:${AGP_VERSION}/g" \
            android/build.gradle

          # Force Gradle 8.11.1
          sed -i \
            "s#distributionUrl=.*#distributionUrl=https\\\\://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip#g" \
            android/gradle/wrapper/gradle-wrapper.properties

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("android/variables.gradle")

          s = p.read_text(
              encoding="utf-8"
          )

          s = re.sub(
              r"(\bcompileSdkVersion\s*=\s*)\d+",
              r"\g<1>36",
              s
          )

          s = re.sub(
              r"(\btargetSdkVersion\s*=\s*)\d+",
              r"\g<1>36",
              s
          )

          s = re.sub(
              r"(\bminSdkVersion\s*=\s*)\d+",
              r"\g<1>23",
              s
          )

          p.write_text(
              s,
              encoding="utf-8"
          )

          print("Android SDK versions configured.")
          PY

          grep -Eq \
            'compileSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

          grep -Eq \
            'targetSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

          grep -Eq \
            'minSdkVersion[[:space:]]*=[[:space:]]*23' \
            android/variables.gradle

          grep -Fq \
            "com.android.tools.build:gradle:${AGP_VERSION}" \
            android/build.gradle

          grep -Fq \
            "gradle-${GRADLE_VERSION}-bin.zip" \
            android/gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "Android 16/API 36: PASS"


      # ============================================================
      # 26. CAPACITOR SYNC
      # ============================================================

      - name: Capacitor sync Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npx cap sync android

          echo "Capacitor sync: PASS"


      # ============================================================
      # 27. NATIVE ANDROID SETUP
      # ============================================================

      - name: Configure RKMS native Android features
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x scripts/setup-android-native.sh

          bash -n scripts/setup-android-native.sh

          echo "setup-android-native.sh syntax: PASS"

          ./scripts/setup-android-native.sh

          echo ""
          echo "RKMS native Android setup: PASS"


      # ============================================================
      # 28. FIREBASE CONFIGURATION
      # ============================================================

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          test -s google-services.json

          cp -f \
            google-services.json \
            android/app/google-services.json

          chmod 600 \
            android/app/google-services.json

          python3 <<'PY'
          import json
          from pathlib import Path

          p = Path(
              "android/app/google-services.json"
          )

          data = json.loads(
              p.read_text(
                  encoding="utf-8"
              )
          )

          found = False

          for client in data.get("client", []):

              package_name = (
                  client
                  .get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

              if package_name == "org.rkms.connect":
                  found = True
                  break

          if not found:
              raise SystemExit(
                  "Firebase package org.rkms.connect not found."
              )

          print(
              "Firebase package org.rkms.connect: PASS"
          )
          PY


      # ============================================================
      # 29. FIREBASE + CREDENTIAL DEPENDENCIES
      # ============================================================

      - name: Configure Firebase Messaging and Credential Manager
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "android/app/build.gradle"
          )

          s = p.read_text(
              encoding="utf-8"
          )

          marker = "dependencies {"

          if marker not in s:
              raise SystemExit(
                  "dependencies block missing."
              )

          deps = [
              'implementation platform("com.google.firebase:firebase-bom:34.19.0")',
              'implementation "com.google.firebase:firebase-messaging"',
              'implementation "androidx.credentials:credentials:1.5.0"',
              'implementation "androidx.credentials:credentials-play-services-auth:1.5.0"'
          ]

          for dep in deps:

              if dep not in s:
                  s = s.replace(
                      marker,
                      marker + "\n    " + dep,
                      1
                  )

          p.write_text(
              s,
              encoding="utf-8"
          )

          print(
              "Firebase and Credential Manager configured."
          )
          PY


      # ============================================================
      # 30. VERIFY NATIVE FEATURES
      # ============================================================

      - name: Verify native dependencies and features
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          grep -Fq \
            "firebase-bom:34.19.0" \
            app/build.gradle

          grep -Fq \
            "firebase-messaging" \
            app/build.gradle

          grep -Fq \
            "androidx.credentials:credentials:1.5.0" \
            app/build.gradle

          grep -Fq \
            "androidx.credentials:credentials-play-services-auth:1.5.0" \
            app/build.gradle

          grep -Rqs \
            "FirebaseApp.initializeApp" \
            app/src/main

          grep -Rqs \
            "RKMSNativeBridge" \
            app/src/main

          grep -Rqs \
            "RECORD_AUDIO" \
            app/src/main

          echo "Firebase: PASS"
          echo "Credential Manager: PASS"
          echo "FirebaseApp: PASS"
          echo "Native Bridge: PASS"
          echo "Microphone permission: PASS"


      # ============================================================
      # 31. PACKAGE ID
      # ============================================================

      - name: Verify package ID
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          grep -Rqs \
            "org.rkms.connect" \
            android/app

          echo "Package ID: PASS"


      # ============================================================
      # 32. SIGNING SECRETS
      # ============================================================

      - name: Verify release signing secrets
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          test -n "${RKMS_KEYSTORE_BASE64:-}" \
            || {
              echo "::error::RKMS_KEYSTORE_BASE64 missing."
              exit 1
            }

          test -n "${RKMS_KEYSTORE_PASSWORD:-}" \
            || {
              echo "::error::RKMS_KEYSTORE_PASSWORD missing."
              exit 1
            }

          test -n "${RKMS_KEY_ALIAS:-}" \
            || {
              echo "::error::RKMS_KEY_ALIAS missing."
              exit 1
            }

          test -n "${RKMS_KEY_PASSWORD:-}" \
            || {
              echo "::error::RKMS_KEY_PASSWORD missing."
              exit 1
            }

          echo "Signing secrets: PASS"


      # ============================================================
      # 33. RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/configure-release-signing.sh

          bash -n \
            scripts/configure-release-signing.sh

          ./scripts/configure-release-signing.sh

          test -s \
            android/app/release.keystore

          keytool \
            -list \
            -keystore android/app/release.keystore \
            -storepass "$RKMS_KEYSTORE_PASSWORD" \
            -alias "$RKMS_KEY_ALIAS" \
            >/dev/null

          echo "Release signing: PASS"


      # ============================================================
      # 34. VERIFY SIGNING
      # ============================================================

      - name: Verify release signing configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          test -s \
            app/release.keystore

          grep -Fq \
            "signingConfigs" \
            app/build.gradle

          grep -Fq \
            "signingConfig signingConfigs.release" \
            app/build.gradle

          grep -Fq \
            'storeFile file("release.keystore")' \
            app/build.gradle

          echo "Release signing configuration: PASS"


      # ============================================================
      # 35. GRADLE
      # ============================================================

      - name: Verify Gradle project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          chmod +x gradlew

          ./gradlew \
            --version

          echo "Gradle: PASS"


      # ============================================================
      # 36. CLEAN
      # ============================================================

      - name: Clean Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          ./gradlew \
            clean \
            --no-daemon \
            --stacktrace

          echo "Clean: PASS"


      # ============================================================
      # 37. FINAL SIGNED RELEASE APK
      # ============================================================

      - name: Build Final Signed Release APK Only
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          echo "=============================================="
          echo "RKMS FINAL SIGNED RELEASE APK"
          echo "=============================================="

          echo "SOURCE ZIP  : ${SOURCE_ZIP}"
          echo "API         : ${ANDROID_API}"
          echo "BUILD TOOLS : ${BUILD_TOOLS}"
          echo "MIN SDK     : ${MIN_SDK}"
          echo "TARGET SDK  : ${TARGET_SDK}"
          echo "AGP         : ${AGP_VERSION}"
          echo "GRADLE      : ${GRADLE_VERSION}"
          echo "PACKAGE     : ${APP_ID}"
          echo "SIGNED      : YES"
          echo "APK ONLY    : YES"
          echo "DEBUG APK   : NO"
          echo "AAB         : NO"

          echo "=============================================="

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          APK_OUTPUT="app/build/outputs/apk/release/app-release.apk"

          test -s "$APK_OUTPUT"

          echo ""
          echo "Signed Release APK build: PASS"


      # ============================================================
      # 38. COPY FINAL APK
      # ============================================================

      - name: Locate final release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          APK="$(
            find \
              app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              ! -iname "*debug*" \
              -print \
              | head -n 1 || true
          )"

          if [ -z "$APK" ]; then
            echo "::error::Release APK not found."
            exit 1
          fi

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/${APK_NAME}"

          echo \
            "APK_PATH=$GITHUB_WORKSPACE/${APK_NAME}" \
            >> "$GITHUB_ENV"

          ls -lh \
            "$GITHUB_WORKSPACE/${APK_NAME}"


      # ============================================================
      # 39. VERIFY APK
      # ============================================================

      - name: Verify APK package and target SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          AAPT="$SDK/build-tools/${BUILD_TOOLS}/aapt"

          "$AAPT" \
            dump badging \
            "$APK_PATH" \
            > apk-badging.txt

          grep -Fq \
            "package: name='${APP_ID}'" \
            apk-badging.txt

          grep -Fq \
            "targetSdkVersion:'36'" \
            apk-badging.txt

          echo "APK package ID: PASS"
          echo "Target SDK 36: PASS"


      # ============================================================
      # 40. VERIFY SIGNATURE
      # ============================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          "$SDK/build-tools/${BUILD_TOOLS}/apksigner" \
            verify \
            --verbose \
            "$APK_PATH"

          echo "APK signature: PASS"


      # ============================================================
      # 41. SIGNER CERTIFICATE
      # ============================================================

      - name: Print APK signer certificate
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          "$SDK/build-tools/${BUILD_TOOLS}/apksigner" \
            verify \
            --print-certs \
            "$APK_PATH"


      # ============================================================
      # 42. APK SHA256
      # ============================================================

      - name: Generate APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          sha256sum \
            "$APK_NAME" \
            | tee \
              "${APK_NAME}.sha256"


      # ============================================================
      # 43. FINAL APK-ONLY AUDIT
      # ============================================================

      - name: Final APK-only audit
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          test -s "$APK_NAME"
          test -s "${APK_NAME}.sha256"

          if find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.aab" \
            -print \
            | grep -q .
          then
            echo "::error::AAB detected."
            exit 1
          fi

          if find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "*debug*.apk" \
            -print \
            | grep -q .
          then
            echo "::error::Debug APK detected."
            exit 1
          fi

          SIZE_BYTES="$(
            stat -c%s "$APK_NAME"
          )"

          if [ "$SIZE_BYTES" -le 1000000 ]; then
            echo "::error::APK unexpectedly small."
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "FINAL APK AUDIT PASSED"
          echo "=============================================="

          echo "APK ONLY    : YES"
          echo "AAB         : NO"
          echo "DEBUG APK   : NO"
          echo "SIGNED      : YES"
          echo "API         : ${ANDROID_API}"
          echo "MIN SDK     : ${MIN_SDK}"
          echo "TARGET SDK  : ${TARGET_SDK}"
          echo "PACKAGE     : ${APP_ID}"
          echo "APK         : ${APK_NAME}"
          echo "SIZE        : ${SIZE_BYTES}"

          echo ""
          echo "APK SHA256:"
          cat "${APK_NAME}.sha256"

          echo ""
          echo "=============================================="


      # ============================================================
      # 44. UPLOAD FINAL APK ONLY
      # ============================================================

      - name: Upload final APK and SHA256
        uses: actions/upload-artifact@v4
        with:
          name: RKMS_ANDROID16_API36_SIGNED_RELEASE_APK
          if-no-files-found: error
          path: |
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256
          retention-days: 30

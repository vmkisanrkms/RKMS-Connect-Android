name: RKMS Android 16 API 36 - Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-apk:
    name: RKMS Android 16 / API 36 - Release APK
    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. PREPARE RKMS SOURCE
      # ==========================================================

      - name: Prepare RKMS source root
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking RKMS source..."

          if [ ! -f package.json ]; then

            PACKAGE="$(
              find . -maxdepth 1 -type f \
                -name 'RKMS_CONNECT_V21*.zip' \
                -print -quit
            )"

            if [ -z "${PACKAGE:-}" ]; then
              echo "ERROR: RKMS source package not found."
              exit 1
            fi

            echo "Using source package: $PACKAGE"

            rm -rf .rkms_extract
            mkdir -p .rkms_extract

            unzip -q "$PACKAGE" -d .rkms_extract

            SOURCE_DIR="$(
              find .rkms_extract \
                -mindepth 1 \
                -maxdepth 2 \
                -type d \
                -name 'rkms_android' \
                -print -quit
            )"

            if [ -z "${SOURCE_DIR:-}" ]; then
              echo "ERROR: rkms_android source directory not found."
              find .rkms_extract -maxdepth 3 -print
              exit 1
            fi

            rsync -a \
              --exclude='.github/' \
              "$SOURCE_DIR"/ \
              ./

            rm -rf .rkms_extract
          fi

          test -f package.json
          test -f capacitor.config.json
          test -f index.html
          test -f app.js
          test -f styles.css
          test -f google-services.json

          echo "RKMS source root: PASS"


      # ==========================================================
      # 3. JAVASCRIPT SYNTAX
      # ==========================================================

      - name: Verify application JavaScript
        shell: bash
        run: |
          set -euo pipefail

          node --check app.js

          echo "JavaScript syntax: PASS"


      # ==========================================================
      # 4. NODE 22
      # ==========================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify Node.js
        shell: bash
        run: |
          set -euo pipefail

          node --version
          npm --version

          echo "Node.js 22: PASS"


      # ==========================================================
      # 5. INSTALL NPM DEPENDENCIES
      # ==========================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          npm install --no-audit --no-fund

          echo "npm dependencies: PASS"


      # ==========================================================
      # 6. VERIFY CAPACITOR + FCM DEPENDENCIES
      # ==========================================================

      - name: Verify Capacitor and FCM dependency
        shell: bash
        run: |
          set -euo pipefail

          npm ls @capacitor/core --depth=0
          npm ls @capacitor/android --depth=0
          npm ls @capacitor/app --depth=0
          npm ls @capacitor/push-notifications --depth=0

          echo
          echo "Capacitor Core: PASS"
          echo "Capacitor Android: PASS"
          echo "Capacitor App: PASS"
          echo "Push Notifications: PASS"


      # ==========================================================
      # 7. JDK 17
      # ==========================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify JDK 17
        shell: bash
        run: |
          set -euo pipefail

          java -version
          javac -version

          echo "JDK 17: PASS"


      # ==========================================================
      # 8. ANDROID SDK
      # ==========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''


      # ==========================================================
      # 9. ANDROID SDK LICENSES
      # ==========================================================

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "Android SDK licenses: PASS"


      # ==========================================================
      # 10. INSTALL ANDROID 16 / API 36
      # ==========================================================

      - name: Install Android 16 API 36 SDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

          echo
          echo "Android 16 / API 36 SDK installed."


      # ==========================================================
      # 11. VERIFY ANDROID SDK
      # ==========================================================

      - name: Verify Android 16 API 36 SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

          echo
          echo "=============================================="
          echo " ANDROID 16 / API 36 SDK"
          echo "=============================================="
          echo
          echo "Platform Tools       : PASS"
          echo "Android Platform 36  : PASS"
          echo "Build Tools 36.0.0   : PASS"
          echo "Android 16 / API 36  : PASS"
          echo
          echo "=============================================="


      # ==========================================================
      # 12. BUILD WEB APPLICATION
      # ==========================================================

      - name: Build RKMS web application
        shell: bash
        run: |
          set -euo pipefail

          npm run build


      # ==========================================================
      # 13. VERIFY WEB BUILD
      # ==========================================================

      - name: Verify web build
        shell: bash
        run: |
          set -euo pipefail

          test -d dist
          test -f dist/index.html

          echo "Web build: PASS"


      # ==========================================================
      # 14. ADD CAPACITOR ANDROID
      # ==========================================================

      - name: Add Capacitor Android platform
        shell: bash
        run: |
          set -euo pipefail

          npx cap add android


      # ==========================================================
      # 15. VERIFY ANDROID PROJECT
      # ==========================================================

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -d android
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle
          test -f android/gradlew

          echo "Android project: PASS"


      # ==========================================================
      # 16. FIREBASE CONFIGURATION
      # ==========================================================

      - name: Install Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          test -f google-services.json

          cp google-services.json \
            android/app/google-services.json

          test -f android/app/google-services.json

          echo "Firebase configuration: PASS"


      # ==========================================================
      # 17. ANDROID 16 CONFIGURATION
      # ==========================================================

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/configure-android-16.sh

          bash scripts/configure-android-16.sh


      # ==========================================================
      # 18. CAPACITOR SYNC
      # ==========================================================

      - name: Capacitor sync Android
        shell: bash
        run: |
          set -euo pipefail

          npx cap sync android


      # ==========================================================
      # 19. RKMS NATIVE ANDROID SETUP
      # ==========================================================

      - name: Setup RKMS native Android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/setup-android-native.sh

          bash scripts/setup-android-native.sh


      # ==========================================================
      # 20. VERIFY ANDROID 16
      # ==========================================================

      - name: Verify Android 16 configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-android-16.py


      # ==========================================================
      # 21. VERIFY PDF PIPELINE
      # ==========================================================

      - name: Verify Android PDF pipeline
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-android-pdf.py


      # ==========================================================
      # 22. VERIFY NATIVE BRIDGE
      # ==========================================================

      - name: Verify native bridge
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-native-bridge.py


      # ==========================================================
      # 23. DIRECT FCM PIPELINE AUDIT
      #
      # IMPORTANT:
      # The previous verify-fcm-pipeline.py was dependent on
      # reading this workflow file itself. That created a fragile
      # self-reference.
      #
      # This step directly verifies the actual FCM implementation.
      # ==========================================================

      - name: Verify FCM pipeline
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Firebase configuration..."

          test -f google-services.json
          test -f android/app/google-services.json

          echo "Firebase files: PASS"

          echo
          echo "Checking FCM application code..."

          grep -q \
            "async function rkmsRegisterFcmPush" \
            app.js

          grep -q \
            "function rkmsDeviceId" \
            app.js

          grep -q \
            "device_id:rkmsDeviceId()" \
            app.js

          grep -q \
            "addListener('registration'" \
            app.js

          grep -q \
            "addListener('pushNotificationReceived'" \
            app.js

          grep -q \
            "addListener('pushNotificationActionPerformed'" \
            app.js

          grep -q \
            "rkms_notifications_v2" \
            app.js

          grep -q \
            "visibilitychange" \
            app.js

          grep -q \
            "rkmsRegisterFcmPush()" \
            app.js

          grep -q \
            "rkms-fcm-push" \
            app.js

          echo "FCM registration: PASS"
          echo "Stable device ID: PASS"
          echo "Registration listener: PASS"
          echo "Foreground listener: PASS"
          echo "Notification tap listener: PASS"
          echo "Notification channel: PASS"
          echo "Resume re-registration: PASS"
          echo "FCM server endpoint: PASS"

          echo
          echo "Checking native FCM configuration..."

          grep -q \
            "com.google.gms:google-services:4.4.3" \
            scripts/setup-android-native.sh

          grep -q \
            "com.google.gms.google-services" \
            scripts/setup-android-native.sh

          grep -q \
            "createRkmsNotificationChannel" \
            scripts/setup-android-native.sh

          grep -q \
            "default_notification_channel_id" \
            scripts/setup-android-native.sh

          grep -q \
            "rkms_default_notification_channel_id" \
            scripts/setup-android-native.sh

          echo "Google Services Gradle plugin: PASS"
          echo "Notification channel creation: PASS"
          echo "Background default channel: PASS"

          echo
          echo "Checking duplicate chat notification protection..."

          CHAT_START="$(
            grep -n \
              "async function sendChatMessage" \
              app.js \
              | head -n1 \
              | cut -d: -f1
          )"

          CHAT_END="$(
            grep -n \
              "function showChatActionSheet" \
              app.js \
              | head -n1 \
              | cut -d: -f1
          )"

          if [ -n "${CHAT_START:-}" ] && \
             [ -n "${CHAT_END:-}" ] && \
             [ "$CHAT_END" -gt "$CHAT_START" ]; then

            if sed -n "${CHAT_START},${CHAT_END}p" app.js \
              | grep -q "rkms-fcm-dispatch"; then

              echo "ERROR: Duplicate client chat push fallback found."
              exit 1
            fi

          fi

          echo "Chat duplicate protection: PASS"

          echo
          echo "FCM PIPELINE VERIFICATION: PASS"


      # ==========================================================
      # 24. SAVED LOGIN
      # ==========================================================

      - name: Verify saved login
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-saved-login.py


      # ==========================================================
      # 25. CORE RKMS
      # ==========================================================

      - name: Verify final RKMS application
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-rkms-final.py


      # ==========================================================
      # 26. COMPLAINT WORKFLOW
      # ==========================================================

      - name: Verify complaint workflow
        shell: bash
        run: |
          set -euo pipefail

          grep -q \
            "memberCloseComplaint" \
            app.js

          grep -q \
            "memberReopenComplaint" \
            app.js

          grep -q \
            "officerCloseComplaint" \
            app.js

          echo "Member Close: PASS"
          echo "Member Reopen: PASS"
          echo "PDA Officer Close: PASS"


      # ==========================================================
      # 27. ORIGINAL RKMS LAUNCHER
      # ==========================================================

      - name: Verify original RKMS launcher
        shell: bash
        run: |
          set -euo pipefail

          test -f \
            assets/rkms-launcher-original-transparent.png

          test -f \
            android_launcher_icons/mipmap-mdpi/ic_launcher.png

          test -f \
            android_launcher_icons/mipmap-hdpi/ic_launcher.png

          test -f \
            android_launcher_icons/mipmap-xhdpi/ic_launcher.png

          test -f \
            android_launcher_icons/mipmap-xxhdpi/ic_launcher.png

          test -f \
            android_launcher_icons/mipmap-xxxhdpi/ic_launcher.png

          echo "Original RKMS launcher: PASS"


      # ==========================================================
      # 28. NO X/TWITTER REFERENCES
      # ==========================================================

      - name: Verify no X Twitter references
        shell: bash
        run: |
          set -euo pipefail

          if grep -RniE \
            "twitter\.com|x\.com/" \
            app.js \
            index.html \
            styles.css \
            assets \
            android_launcher_icons \
            --exclude="*.map" \
            2>/dev/null; then

            echo "ERROR: X/Twitter reference found."
            exit 1
          fi

          echo "No X/Twitter reference: PASS"


      # ==========================================================
      # 29. RELEASE SIGNING CHECK
      # ==========================================================

      - name: Check release signing
        id: signing
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${RKMS_KEYSTORE_BASE64:-}" ] && \
             [ -n "${RKMS_KEYSTORE_PASSWORD:-}" ] && \
             [ -n "${RKMS_KEY_ALIAS:-}" ] && \
             [ -n "${RKMS_KEY_PASSWORD:-}" ]; then

            echo "enabled=true" >> "$GITHUB_OUTPUT"

            echo "Release signing configuration detected."

          else

            echo "enabled=false" >> "$GITHUB_OUTPUT"

            echo "Release signing secrets are not configured."

          fi


      # ==========================================================
      # 30. PREPARE RELEASE KEYSTORE
      # ==========================================================

      - name: Prepare release keystore
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$RKMS_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/release.keystore

          chmod 600 android/app/release.keystore

          test -s android/app/release.keystore

          echo "Release keystore: PASS"


      # ==========================================================
      # 31. CONFIGURE RELEASE SIGNING
      # ==========================================================

      - name: Configure release signing
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [ -f scripts/configure-release-signing.sh ]; then

            chmod +x scripts/configure-release-signing.sh

            bash scripts/configure-release-signing.sh

          else

            python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text(encoding="utf-8")

          marker_start = "// RKMS WORKFLOW RELEASE SIGNING START"
          marker_end = "// RKMS WORKFLOW RELEASE SIGNING END"

          if marker_start in text and marker_end in text:
              start = text.index(marker_start)
              end = text.index(marker_end) + len(marker_end)
              text = text[:start] + text[end:]

          block = """
          // RKMS WORKFLOW RELEASE SIGNING START
          android {
              signingConfigs {
                  rkmsProduction {
                      storeFile file("release.keystore")
                      storePassword System.getenv("RKMS_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("RKMS_KEY_ALIAS")
                      keyPassword System.getenv("RKMS_KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.rkmsProduction
                  }
              }
          }
          // RKMS WORKFLOW RELEASE SIGNING END
          """

          path.write_text(
              text.rstrip() + "\\n\\n" + block.strip() + "\\n",
              encoding="utf-8"
          )

          print("Release signing configured.")
          PY

          fi


      # ==========================================================
      # 32. UNSIGNED RELEASE FALLBACK
      # ==========================================================

      - name: Prepare unsigned release
        if: steps.signing.outputs.enabled != 'true'
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")

          text = path.read_text(encoding="utf-8")

          text = text.replace(
              "signingConfig signingConfigs.rkmsProduction",
              ""
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print("Unsigned release configuration prepared.")
          PY


      # ==========================================================
      # 33. VERIFY GRADLE
      # ==========================================================

      - name: Verify Gradle
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew --version


      # ==========================================================
      # 34. CLEAN ANDROID
      # ==========================================================

      - name: Clean Android
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean --no-daemon


      # ==========================================================
      # 35. BUILD RELEASE APK
      # ==========================================================

      - name: Build RELEASE APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace


      # ==========================================================
      # 36. VERIFY RELEASE APK
      # ==========================================================

      - name: Verify Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"
          test -s "$APK"

          echo
          echo "=============================================="
          echo " RKMS RELEASE APK READY"
          echo "=============================================="
          echo
          echo "Android Version : 16"
          echo "API Level       : 36"
          echo "APK             : app-release.apk"
          echo
          ls -lh "$APK"
          echo
          echo "=============================================="


      # ==========================================================
      # 37. UPLOAD RELEASE APK
      # ==========================================================

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Android-16-API36-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30


      # ==========================================================
      # 38. FINAL SUMMARY
      # ==========================================================

      - name: Final APK build summary
        shell: bash
        run: |
          echo
          echo "=================================================="
          echo " RKMS CONNECT V21"
          echo " ANDROID 16 / API 36 RELEASE APK"
          echo "=================================================="
          echo
          echo "Android Version : 16"
          echo "API Level       : 36"
          echo "JDK             : 17"
          echo "Node.js         : 22"
          echo
          echo "Android SDK     : VERIFIED"
          echo "Web Build       : VERIFIED"
          echo "Capacitor       : VERIFIED"
          echo "Native Bridge   : VERIFIED"
          echo "PDF Pipeline    : VERIFIED"
          echo "FCM Pipeline    : VERIFIED"
          echo "Saved Login     : VERIFIED"
          echo "Core RKMS       : VERIFIED"
          echo "Complaint       : VERIFIED"
          echo "Launcher Logo   : VERIFIED"
          echo
          echo "RELEASE APK     : SUCCESS"
          echo
          echo "=================================================="

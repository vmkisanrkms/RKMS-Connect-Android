name: Build RKMS Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rkms-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build RKMS Release APK
    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # Prepare Android project
      # =========================================================
      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "Android project found at repository root."
          else
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -name 'RKMS_Connect_*.zip' \
              -print -quit)"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Android project not found."
              exit 1
            fi

            TMP_DIR="$RUNNER_TEMP/rkms-project"
            rm -rf "$TMP_DIR"
            mkdir -p "$TMP_DIR"

            unzip -q "$ZIP_FILE" -d "$TMP_DIR"

            PROJECT_DIR="$(
              find "$TMP_DIR" \
                -type f \
                \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
                -print -quit \
                | xargs -r dirname
            )"

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: Android project not found inside ZIP."
              exit 1
            fi

            rsync -a \
              --exclude='.github/' \
              "$PROJECT_DIR/" \
              "$GITHUB_WORKSPACE/"
          fi

      # =========================================================
      # Basic project validation
      # =========================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -f gradle.properties
          test -d app
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Android project structure: PASS"

      # =========================================================
      # RKMS source validation
      # =========================================================
      - name: Validate RKMS source
        shell: bash
        run: |
          set -euo pipefail

          WWW="app/src/main/assets/www"
          BOOK_DIR="$WWW/assets/book"
          APP_JS="$WWW/app.js"
          MAIN_ACTIVITY="app/src/main/java/org/rkms/connect/MainActivity.java"
          SESSION_STORE="app/src/main/java/org/rkms/connect/SessionStore.java"

          test -f "$WWW/index.html"
          test -f "$APP_JS"
          test -f "$WWW/config.js"
          test -f "$WWW/styles.css"

          test -d "$BOOK_DIR"
          test -f "$BOOK_DIR/cover.jpg"

          for i in $(seq -w 1 60); do
            test -f "$BOOK_DIR/page-$i.jpg"
          done

          COUNT="$(
            find "$BOOK_DIR" \
              -maxdepth 1 \
              -type f \
              -name 'page-[0-9][0-9].jpg' \
              | wc -l \
              | tr -d ' '
          )"

          test "$COUNT" = "60"

          node --check "$APP_JS"

          if grep -RInE \
            'SUPABASE_SERVICE_ROLE_KEY|service_role|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY' \
            app/src/main/assets \
            app/src/main/java \
            app/src/main/res \
            2>/dev/null; then
            echo "ERROR: Possible private credential found."
            exit 1
          fi

          grep -Fq 'id="bookFirst"' "$APP_JS"
          grep -Fq 'id="bookPrev"' "$APP_JS"
          grep -Fq 'id="bookNext"' "$APP_JS"
          grep -Fq 'id="bookLast"' "$APP_JS"
          grep -Fq 'id="bookDownloadPage"' "$APP_JS"

          grep -Fq 'id="bookViewport"' "$APP_JS"

          grep -Fq 'pointerdown' "$APP_JS"
          grep -Fq 'pointermove' "$APP_JS"
          grep -Fq 'pointerup' "$APP_JS"

          grep -Fq 'startDist' "$APP_JS"
          grep -Fq 'startScale' "$APP_JS"
          grep -Fq 'zoom.scale' "$APP_JS"
          grep -Fq 'zoom.x' "$APP_JS"
          grep -Fq 'zoom.y' "$APP_JS"
          grep -Fq 'clampPan' "$APP_JS"
          grep -Fq 'translate3d' "$APP_JS"

          if grep -Eq \
            'id="(bookZoomIn|bookZoomOut|bookZoomReset|zoomIn|zoomOut|resetZoom)"' \
            "$APP_JS"; then
            echo "ERROR: Extra visible zoom button found."
            exit 1
          fi

          grep -Fq 'rkms-loading' "$APP_JS"
          grep -Fq '.rkms-loading' "$WWW/styles.css"
          grep -Fq 'rkms-load-pulse' "$WWW/styles.css"
          grep -Fq 'rkms-load-sweep' "$WWW/styles.css"

          test -f "$MAIN_ACTIVITY"
          grep -Fq 'setAcceptThirdPartyCookies(view, false)' "$MAIN_ACTIVITY"

          grep -Fq 'downloadBookPage' "$MAIN_ACTIVITY"
          grep -Fq 'rkms-download://' "$APP_JS"

          test -f "$SESSION_STORE"
          grep -Fq 'SharedPreferences' "$SESSION_STORE"

          test -f \
            app/src/main/java/org/rkms/connect/RKMSFirebaseMessagingService.java

          test -f \
            app/src/main/java/org/rkms/connect/NotificationHelper.java

          echo "RKMS source validation: PASS"

      # =========================================================
      # Node.js
      # =========================================================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # =========================================================
      # JDK 17
      # =========================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # =========================================================
      # Android SDK
      # =========================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "Android SDK packages: PASS"

      # =========================================================
      # Gradle
      # =========================================================
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # =========================================================
      # Gradle validation
      # =========================================================
      - name: Validate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon tasks

          echo "Gradle validation: PASS"

      # =========================================================
      # Clean
      # =========================================================
      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon clean

          echo "Clean: PASS"

      # =========================================================
      # Decode RKMS release keystore
      # =========================================================
      - name: Prepare release signing
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${RKMS_KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: RKMS_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [ -z "${RKMS_KEY_ALIAS:-}" ]; then
            echo "ERROR: RKMS_KEY_ALIAS secret is missing."
            exit 1
          fi

          if [ -z "${RKMS_KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: RKMS_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "${RKMS_KEY_PASSWORD:-}" ]; then
            echo "ERROR: RKMS_KEY_PASSWORD secret is missing."
            exit 1
          fi

          echo "$RKMS_KEYSTORE_BASE64" | base64 -d \
            > "$RUNNER_TEMP/rkms-release.keystore"

          test -s "$RUNNER_TEMP/rkms-release.keystore"

          echo "Release signing keystore prepared: PASS"

      # =========================================================
      # Build RELEASE APK
      # =========================================================
      - name: Build RKMS Release APK
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            assembleRelease

          echo "Release build: PASS"

      # =========================================================
      # Find unsigned APK
      # =========================================================
      - name: Find release APK
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_DIR="app/build/outputs/apk/release"

          test -d "$RELEASE_DIR"

          UNSIGNED_APK="$(
            find "$RELEASE_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*unsigned*.apk' \
              -print -quit
          )"

          if [ -z "$UNSIGNED_APK" ]; then
            UNSIGNED_APK="$(
              find "$RELEASE_DIR" \
                -maxdepth 1 \
                -type f \
                -name '*.apk' \
                -print -quit
            )"
          fi

          if [ -z "$UNSIGNED_APK" ]; then
            echo "ERROR: Release APK not found."
            ls -la "$RELEASE_DIR"
            exit 1
          fi

          echo "UNSIGNED_APK=$UNSIGNED_APK" >> "$GITHUB_ENV"

          echo "Release APK found:"
          echo "$UNSIGNED_APK"

      # =========================================================
      # Zipalign
      # =========================================================
      - name: Align release APK
        shell: bash
        run: |
          set -euo pipefail

          zipalign \
            -p \
            -f \
            4 \
            "$UNSIGNED_APK" \
            "$RUNNER_TEMP/rkms-release-aligned.apk"

          test -s "$RUNNER_TEMP/rkms-release-aligned.apk"

          echo "APK alignment: PASS"

      # =========================================================
      # Sign APK
      # =========================================================
      - name: Sign RKMS Release APK
        shell: bash
        run: |
          set -euo pipefail

          apksigner sign \
            --ks "$RUNNER_TEMP/rkms-release.keystore" \
            --ks-key-alias "$RKMS_KEY_ALIAS" \
            --ks-pass env:RKMS_KEYSTORE_PASSWORD \
            --key-pass env:RKMS_KEY_PASSWORD \
            --out "$RUNNER_TEMP/RKMS-Connect-release.apk" \
            "$RUNNER_TEMP/rkms-release-aligned.apk"

          test -s "$RUNNER_TEMP/RKMS-Connect-release.apk"

          echo "APK signing: PASS"

      # =========================================================
      # Verify signed APK
      # =========================================================
      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail

          apksigner verify \
            --verbose \
            "$RUNNER_TEMP/RKMS-Connect-release.apk"

          SIZE="$(
            stat -c%s "$RUNNER_TEMP/RKMS-Connect-release.apk"
          )"

          if [ "$SIZE" -le 0 ]; then
            echo "ERROR: Signed APK is empty."
            exit 1
          fi

          echo "========================================"
          echo "RKMS SIGNED RELEASE APK: PASS"
          echo "========================================"

          ls -lh "$RUNNER_TEMP/RKMS-Connect-release.apk"

      # =========================================================
      # Upload Release APK
      # =========================================================
      - name: Upload RKMS Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Release-APK
          path: ${{ runner.temp }}/RKMS-Connect-release.apk
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # Cleanup
      # =========================================================
      - name: Cleanup signing files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/rkms-release.keystore"
          rm -f "$RUNNER_TEMP/rkms-release-aligned.apk"
          rm -f "$RUNNER_TEMP/RKMS-Connect-release.apk"

          echo "Signing files cleaned."

name: RKMS Android 16 API 36 FINAL APK AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  android-release:

    name: RKMS Android 16 API 36 Release
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. LOCATE RKMS SOURCE
      # ============================================================

      - name: Locate RKMS source
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "RKMS SOURCE SELECTION"
          echo "============================================================"

          if [ -f "package.json" ] && \
             [ -f "app.js" ] && \
             [ -f "index.html" ]; then

            echo "RKMS source found in repository root."
            echo "SOURCE_DIR=." >> "$GITHUB_ENV"
            exit 0
          fi

          echo "Repository root is not RKMS source."
          echo "Searching RKMS ZIP..."

          SELECTED_ZIP=""

          # --------------------------------------------------------
          # Prefer the latest Team RKMS final ZIP
          # --------------------------------------------------------

          for candidate in \
            "RKMS_CONNECT_TEAM_RKMS_CHAT_FINAL_TEAM_LOGO.zip" \
            "RKMS_CONNECT_TEAM_RKMS_CHAT_FINAL_2026-09-18-TEAM_FIRST.zip" \
            "RKMS_CONNECT_FIXED_2026-09-18-2.zip"
          do

            if [ -f "$candidate" ]; then
              SELECTED_ZIP="$candidate"
              break
            fi

          done


          # --------------------------------------------------------
          # Search if preferred ZIP is not in root
          # --------------------------------------------------------

          if [ -z "$SELECTED_ZIP" ]; then

            SELECTED_ZIP="$(
              find . \
                -maxdepth 4 \
                -type f \
                -name 'RKMS_CONNECT_TEAM_RKMS_CHAT_FINAL_TEAM_LOGO.zip' \
                -print \
                | head -1 \
                || true
            )"

          fi


          # --------------------------------------------------------
          # General RKMS ZIP fallback
          # --------------------------------------------------------

          if [ -z "$SELECTED_ZIP" ]; then

            SELECTED_ZIP="$(
              find . \
                -maxdepth 4 \
                -type f \
                -name 'RKMS_CONNECT_*.zip' \
                ! -path './.git/*' \
                -print \
                | sort -r \
                | head -1 \
                || true
            )"

          fi


          if [ -z "$SELECTED_ZIP" ]; then

            echo ""
            echo "ERROR: RKMS source ZIP not found."
            echo ""
            echo "Available ZIP files:"

            find . \
              -maxdepth 4 \
              -type f \
              -name '*.zip' \
              -print \
              || true

            exit 1

          fi


          echo ""
          echo "Using RKMS ZIP:"
          echo "$SELECTED_ZIP"


          rm -rf .rkms_extract
          mkdir -p .rkms_extract


          unzip -q \
            "$SELECTED_ZIP" \
            -d .rkms_extract


          PACKAGE_JSON="$(
            find .rkms_extract \
              -type f \
              -name 'package.json' \
              -print \
              | head -1
          )"


          if [ -z "$PACKAGE_JSON" ]; then

            echo "ERROR: package.json not found inside ZIP."
            exit 1

          fi


          SOURCE_DIR="$(
            dirname "$PACKAGE_JSON"
          )"


          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "SOURCE_DIR=$SOURCE_DIR"


      # ============================================================
      # 3. VERIFY SOURCE
      # ============================================================

      - name: Verify RKMS source
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          test -f package.json
          test -f app.js
          test -f index.html
          test -f styles.css
          test -f capacitor.config.json
          test -f google-services.json

          test -f assets/rkms-logo-transparent.png

          test -f scripts/configure-android-16.sh
          test -f scripts/setup-android-native.sh

          echo "package.json: PASS"
          echo "app.js: PASS"
          echo "index.html: PASS"
          echo "styles.css: PASS"
          echo "capacitor.config.json: PASS"
          echo "google-services.json: PASS"
          echo "RKMS logo: PASS"
          echo "Android scripts: PASS"


      # ============================================================
      # 4. FINAL TEAM RKMS SOURCE REPAIR
      #
      # Remaining known frontend issues:
      # - Team RKMS logo in New Chat
      # - Team RKMS logo in Recent Chat
      # - Team RKMS logo in Conversation header
      # - other_username / other_member_id recognition
      # - generic Super Admin chat error
      # ============================================================

      - name: Repair final Team RKMS Chat UI
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("app.js")
          text = path.read_text(encoding="utf-8")


          # ========================================================
          # TEAM RKMS PROFILE DETECTION
          # ========================================================

          old = """function isTeamRKMSProfile(x){
            const name=String(x?.name||'').trim().toLowerCase();
            const username=String(x?.username||'').trim().toLowerCase();
            const mid=String(x?.member_id||'').trim().toUpperCase();
            return username==='team_rkms' || mid==='A94473' || name==='team rkms';
          }"""


          new = """function isTeamRKMSProfile(x){
            const name=String(x?.name||x?.other_name||'').trim().toLowerCase();
            const username=String(x?.username||x?.other_username||'').trim().toLowerCase();
            const mid=String(x?.member_id||x?.other_member_id||'').trim().toUpperCase();
            return username==='team_rkms' || mid==='A94473' || name==='team rkms';
          }"""


          if old in text:
              text = text.replace(old, new, 1)


          # ========================================================
          # RECENT CHAT AVATAR
          # ========================================================

          old = (
              '<span class="wa-avatar-wrap">'
              '${chatAvatar(t.other_photo,name,!!t.is_group)}'
              '</span>'
          )

          new = (
              '<span class="wa-avatar-wrap">'
              '${isTeamRKMSProfile(t) ? teamRkmsAvatar() : '
              'chatAvatar(t.other_photo,name,!!t.is_group)}'
              '</span>'
          )

          if old in text:
              text = text.replace(old, new, 1)


          # ========================================================
          # NEW CHAT AVATAR
          # ========================================================

          old = (
              '<span class="wa-avatar-wrap">'
              '${chatAvatar(p.photo_url,p.name,false)}'
              '</span>'
          )

          new = (
              '<span class="wa-avatar-wrap">'
              '${isTeamRKMSProfile(p) ? teamRkmsAvatar() : '
              'chatAvatar(p.photo_url,p.name,false)}'
              '</span>'
          )

          if old in text:
              text = text.replace(old, new, 1)


          # ========================================================
          # CONVERSATION HEADER AVATAR
          # ========================================================

          old = (
              '<span class="wa-avatar-wrap">'
              '${chatAvatar(meta.other_photo,name,!!meta.is_group)}'
              '</span>'
          )

          new = (
              '<span class="wa-avatar-wrap">'
              '${isTeamRKMSProfile(meta) ? teamRkmsAvatar() : '
              'chatAvatar(meta.other_photo,name,!!meta.is_group)}'
              '</span>'
          )

          if old in text:
              text = text.replace(old, new, 1)


          # ========================================================
          # GENERIC CHAT LOGIN ERROR
          # ========================================================

          text = text.replace(
              "Chat के लिए Member या पदाधिकारी login जरूरी है।",
              "Chat के लिए अधिकृत Login जरूरी है।"
          )


          path.write_text(
              text,
              encoding="utf-8"
          )


          # ========================================================
          # FINAL SOURCE ASSERTIONS
          # ========================================================

          required = [
              "team_rkms",
              "A94473",
              "b909411c-591d-4a57-9d8d-280842901331",
              "teamRkmsAvatar",
              "isTeamRKMSProfile",
              "SUPER_ADMIN",
              "rkms_chat_open",
              "rkms_chat_send_message",
          ]

          for item in required:

              if item not in text:

                  raise SystemExit(
                      f"ERROR: required Team RKMS marker missing: {item}"
                  )


          print("Team RKMS source repair: PASS")
          print("Team RKMS detection: PASS")
          print("Team RKMS avatar function: PASS")
          print("Recent Chat logo path: PASS")
          print("New Chat logo path: PASS")
          print("Conversation logo path: PASS")
          print("Super Admin chat marker: PASS")
          PY


      # ============================================================
      # 5. TEAM RKMS AUDIT
      # ============================================================

      - name: Audit Team RKMS Super Admin Chat
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          grep -Fq "team_rkms" app.js

          grep -Fq "A94473" app.js

          grep -Fq \
            "b909411c-591d-4a57-9d8d-280842901331" \
            app.js

          grep -Fq "teamRkmsAvatar" app.js

          grep -Fq "isTeamRKMSProfile" app.js

          grep -Fq "SUPER_ADMIN" app.js

          grep -Fq "rkms_chat_people" app.js
          grep -Fq "rkms_chat_open" app.js
          grep -Fq "rkms_chat_send_message" app.js

          test -s \
            assets/rkms-logo-transparent.png

          echo ""
          echo "============================================================"
          echo "TEAM RKMS SUPER ADMIN CHAT AUDIT: PASS"
          echo "============================================================"


      # ============================================================
      # 6. NODE 22
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      # ============================================================
      # 7. JDK 17
      # ============================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 8. JAVASCRIPT CHECK
      # ============================================================

      - name: Verify JavaScript
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          node --version
          npm --version

          node --check app.js

          echo "JavaScript syntax: PASS"


      # ============================================================
      # 9. NPM INSTALL
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          if [ -f package-lock.json ]; then

            npm ci \
              --no-audit \
              --no-fund

          else

            npm install \
              --no-audit \
              --no-fund

          fi

          echo "NPM install: PASS"


      # ============================================================
      # 10. STATIC RKMS VERIFICATION
      # ============================================================

      - name: Run RKMS static verification
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 scripts/verify-rkms-final.py
          python3 scripts/verify-member-directory-scope.py
          python3 scripts/verify-authority-hierarchy.py
          python3 scripts/verify-fcm-pipeline.py
          python3 scripts/verify-final-login-navigation.py
          python3 scripts/verify-saved-login.py
          python3 scripts/verify-native-bridge.py

          echo ""
          echo "============================================================"
          echo "RKMS STATIC VERIFICATION: PASS"
          echo "============================================================"


      # ============================================================
      # 11. BUILD WEB
      # ============================================================

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          npm run build

          test -f dist/index.html
          test -f dist/app.js
          test -f dist/assets/rkms-logo-transparent.png

          echo "Web build: PASS"


      # ============================================================
      # 12. SETUP ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="$ANDROID_HOME"

          test -d "$SDK"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then

            echo "sdkmanager not found at:"
            echo "$SDKMANAGER"

            echo ""
            echo "Available SDK command line tools:"

            find "$SDK/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -print \
              || true

            exit 1

          fi


          echo "$SDK/cmdline-tools/latest/bin" \
            >> "$GITHUB_PATH"

          echo "$SDK/platform-tools" \
            >> "$GITHUB_PATH"

          echo "$SDK/build-tools/36.0.0" \
            >> "$GITHUB_PATH"


          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$SDK/build-tools/36.0.0:$PATH"


          echo "SDK Manager:"
          "$SDKMANAGER" --version


          yes | \
            "$SDKMANAGER" \
            --licenses \
            >/dev/null 2>&1 \
            || true


          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"


          test -d \
            "$SDK/platforms/android-36"

          test -d \
            "$SDK/build-tools/36.0.0"


          echo ""
          echo "============================================================"
          echo "ANDROID SDK API 36: PASS"
          echo "BUILD TOOLS 36.0.0: PASS"
          echo "============================================================"


      # ============================================================
      # 13. GENERATE CAPACITOR ANDROID
      # ============================================================

      - name: Generate Capacitor Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          rm -rf android

          npx cap add android

          test -f android/app/build.gradle
          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml

          echo "Capacitor Android generation: PASS"


      # ============================================================
      # 14. CONFIGURE ANDROID 16
      # ============================================================

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          chmod +x \
            scripts/configure-android-16.sh

          ./scripts/configure-android-16.sh

          test -f android/variables.gradle

          echo "Android 16 configuration: PASS"


      # ============================================================
      # 15. FORCE FINAL ANDROID VALUES
      # ============================================================

      - name: Force final Android SDK values
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "android/variables.gradle"
          )

          text = path.read_text(
              encoding="utf-8"
          )


          def set_value(name, value):

              global text

              pattern = rf'(\b{name}\s*=\s*)\d+'

              if re.search(pattern, text):

                  text = re.sub(
                      pattern,
                      rf'\g<1>{value}',
                      text
                  )

              else:

                  text += (
                      f"\n{name} = {value}\n"
                  )


          set_value(
              "compileSdkVersion",
              36
          )

          set_value(
              "targetSdkVersion",
              36
          )

          set_value(
              "minSdkVersion",
              23
          )


          path.write_text(
              text,
              encoding="utf-8"
          )


          print(
              "compileSdkVersion = 36"
          )

          print(
              "targetSdkVersion = 36"
          )

          print(
              "minSdkVersion = 23"
          )
          PY


      # ============================================================
      # 16. VERIFY ANDROID 16
      #
      # IMPORTANT:
      # android/variables.gradle now EXISTS.
      # ============================================================

      - name: Verify Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          test -f \
            android/variables.gradle

          python3 \
            scripts/verify-android-16.py

          echo "Android 16 API 36 verification: PASS"


      # ============================================================
      # 17. CAPACITOR SYNC
      # ============================================================

      - name: Sync Capacitor Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          npx cap sync android

          echo "Capacitor sync: PASS"


      # ============================================================
      # 18. CONFIGURE RKMS NATIVE ANDROID
      # ============================================================

      - name: Configure RKMS native Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          chmod +x \
            scripts/setup-android-native.sh

          ./scripts/setup-android-native.sh

          test -f \
            android/app/src/main/java/org/rkms/connect/MainActivity.java

          test -f \
            android/app/src/main/java/org/rkms/connect/RKMSNativeBridge.java

          test -f \
            android/app/src/main/java/org/rkms/connect/RKMSSecureCredentialsPlugin.java

          test -s \
            android/app/google-services.json

          echo "MainActivity: PASS"
          echo "RKMSNativeBridge: PASS"
          echo "RKMSSecureCredentialsPlugin: PASS"
          echo "Firebase JSON: PASS"


      # ============================================================
      # 19. FIREBASE + BIOMETRIC DEPENDENCIES
      # ============================================================

      - name: Configure Firebase and Android dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          ROOT_GRADLE="android/build.gradle"
          APP_GRADLE="android/app/build.gradle"

          test -f "$ROOT_GRADLE"
          test -f "$APP_GRADLE"

          cp -f \
            google-services.json \
            android/app/google-services.json

          chmod 600 \
            android/app/google-services.json


          python3 - <<'PY'
          from pathlib import Path
          import re

          root_path = Path(
              "android/build.gradle"
          )

          app_path = Path(
              "android/app/build.gradle"
          )

          root = root_path.read_text(
              encoding="utf-8"
          )

          app = app_path.read_text(
              encoding="utf-8"
          )


          # ========================================================
          # GOOGLE REPOSITORIES
          # ========================================================

          if "google()" not in root:

              m = re.search(
                  r'repositories\s*\{',
                  root
              )

              if m:

                  pos = m.end()

                  root = (
                      root[:pos]
                      + "\n        google()"
                      + root[pos:]
                  )


          if "mavenCentral()" not in root:

              m = re.search(
                  r'repositories\s*\{',
                  root
              )

              if m:

                  pos = m.end()

                  root = (
                      root[:pos]
                      + "\n        mavenCentral()"
                      + root[pos:]
                  )


          # ========================================================
          # GOOGLE SERVICES CLASSPATH
          # ========================================================

          if "com.google.gms:google-services:" not in root:

              m = re.search(
                  r'dependencies\s*\{',
                  root
              )

              if not m:

                  raise SystemExit(
                      "ERROR: root Gradle dependencies block missing"
                  )

              pos = m.end()

              root = (
                  root[:pos]
                  + '\n'
                  + '        classpath '
                    '"com.google.gms:google-services:4.4.3"'
                  + root[pos:]
              )


          # ========================================================
          # GOOGLE SERVICES APP PLUGIN
          # ========================================================

          if "com.google.gms.google-services" not in app:

              app += """

          // RKMS Firebase Google Services
          apply plugin: "com.google.gms.google-services"
          """


          # ========================================================
          # DEPENDENCIES BLOCK
          # ========================================================

          if not re.search(
              r'dependencies\s*\{',
              app
          ):

              app += """

          dependencies {
          }
          """


          # ========================================================
          # FIREBASE BOM
          # ========================================================

          if "com.google.firebase:firebase-bom:" not in app:

              m = re.search(
                  r'dependencies\s*\{',
                  app
              )

              if not m:

                  raise SystemExit(
                      "ERROR: app dependencies block missing"
                  )

              pos = m.end()

              app = (
                  app[:pos]
                  + """
              implementation platform(
                  "com.google.firebase:firebase-bom:34.4.0"
              )
          """
                  + app[pos:]
              )


          # ========================================================
          # FIREBASE MESSAGING
          # ========================================================

          if "com.google.firebase:firebase-messaging" not in app:

              m = re.search(
                  r'dependencies\s*\{',
                  app
              )

              pos = m.end()

              app = (
                  app[:pos]
                  + """
              implementation "com.google.firebase:firebase-messaging"
          """
                  + app[pos:]
              )


          # ========================================================
          # ANDROID BIOMETRIC
          # ========================================================

          if "androidx.biometric:biometric:" not in app:

              m = re.search(
                  r'dependencies\s*\{',
                  app
              )

              pos = m.end()

              app = (
                  app[:pos]
                  + """
              implementation "androidx.biometric:biometric:1.1.0"
          """
                  + app[pos:]
              )


          # ========================================================
          # REMOVE DUPLICATE FIREBASE MESSAGING LINES
          # ========================================================

          lines = app.splitlines()

          seen_messaging = False
          cleaned = []

          for line in lines:

              if "com.google.firebase:firebase-messaging" in line:

                  if seen_messaging:
                      continue

                  seen_messaging = True

              cleaned.append(line)


          app = "\n".join(
              cleaned
          ) + "\n"


          root_path.write_text(
              root,
              encoding="utf-8"
          )

          app_path.write_text(
              app,
              encoding="utf-8"
          )


          print(
              "Firebase and Android dependencies configured."
          )
          PY


          # ========================================================
          # VERIFY
          # ========================================================

          grep -Eq \
            'com\.google\.gms:google-services:[0-9.]+' \
            android/build.gradle

          grep -Eq \
            'com\.google\.gms\.google-services' \
            android/app/build.gradle

          grep -Eq \
            'com\.google\.firebase:firebase-bom:[0-9.]+' \
            android/app/build.gradle

          grep -Eq \
            'com\.google\.firebase:firebase-messaging' \
            android/app/build.gradle

          grep -Eq \
            'androidx\.biometric:biometric:[0-9.]+' \
            android/app/build.gradle

          test -s \
            android/app/google-services.json


          echo "Google Services classpath: PASS"
          echo "Google Services plugin: PASS"
          echo "Firebase BOM: PASS"
          echo "Firebase Messaging: PASS"
          echo "AndroidX Biometric: PASS"
          echo "Firebase JSON: PASS"


      # ============================================================
      # 20. VERIFY FIREBASE PACKAGE
      # ============================================================

      - name: Verify Firebase package
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 - <<'PY'
          import json

          path = (
              "android/app/google-services.json"
          )

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          packages = []

          for client in data.get(
              "client",
              []
          ):

              package_name = (
                  client
                  .get(
                      "client_info",
                      {}
                  )
                  .get(
                      "android_client_info",
                      {}
                  )
                  .get(
                      "package_name"
                  )
              )

              if package_name:
                  packages.append(
                      package_name
                  )


          print(
              "Firebase packages:"
          )

          for package_name in packages:
              print(
                  " -",
                  package_name
              )


          if "org.rkms.connect" not in packages:

              raise SystemExit(
                  "ERROR: org.rkms.connect Firebase client missing"
              )


          print(
              "Firebase package: PASS"
          )
          PY


      # ============================================================
      # 21. FINAL MAINACTIVITY REPAIR
      #
      # This is deliberately AFTER setup-android-native.sh.
      # It guarantees exactly one Firebase initialization.
      # ============================================================

      - name: Finalize MainActivity Firebase initialization
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          MAIN="android/app/src/main/java/org/rkms/connect/MainActivity.java"

          test -f "$MAIN"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "android/app/src/main/java/org/rkms/connect/MainActivity.java"
          )

          text = path.read_text(
              encoding="utf-8"
          )


          # ========================================================
          # REMOVE ALL FIREBASE IMPORTS
          # ========================================================

          text = re.sub(
              r'^\s*import\s+com\.google\.firebase\.FirebaseApp\s*;\s*\n?',
              '',
              text,
              flags=re.MULTILINE
          )


          # ========================================================
          # ADD IMPORT
          # ========================================================

          package_match = re.search(
              r'^\s*package\s+org\.rkms\.connect\s*;\s*$',
              text,
              flags=re.MULTILINE
          )

          if not package_match:

              raise SystemExit(
                  "ERROR: org.rkms.connect package not found"
              )


          package_end = package_match.end()


          text = (
              text[:package_end]
              + "\n\nimport com.google.firebase.FirebaseApp;"
              + text[package_end:]
          )


          # ========================================================
          # REMOVE ALL EXISTING FIREBASE INITIALIZATION
          # ========================================================

          text = re.sub(
              r'\s*(?:com\.google\.firebase\.)?FirebaseApp\.initializeApp\s*\(\s*this\s*\)\s*;\s*',
              '\n',
              text
          )


          # ========================================================
          # FIND EXISTING onCreate
          # ========================================================

          oncreate = re.search(
              r'(?:public|protected)\s+void\s+onCreate\s*\(\s*android\.os\.Bundle\s+savedInstanceState\s*\)\s*\{',
              text
          )

          if not oncreate:

              oncreate = re.search(
                  r'(?:public|protected)\s+void\s+onCreate\s*\(\s*Bundle\s+savedInstanceState\s*\)\s*\{',
                  text
              )


          if not oncreate:

              raise SystemExit(
                  "ERROR: MainActivity onCreate() not found"
              )


          # ========================================================
          # INSERT ONE SAFE FIREBASE INITIALIZATION
          # ========================================================

          pos = oncreate.end()

          firebase_block = """

              // RKMS Firebase initialization.
              // Prevents:
              // Default FirebaseApp is not initialized in this process.
              if (FirebaseApp.getApps(this).isEmpty()) {
                  FirebaseApp.initializeApp(this);
              }

          """


          text = (
              text[:pos]
              + firebase_block
              + text[pos:]
          )


          path.write_text(
              text,
              encoding="utf-8"
          )


          print(
              "MainActivity Firebase initialization finalized."
          )
          PY


          # ========================================================
          # FINAL CHECKS
          # ========================================================

          grep -Fq \
            "import com.google.firebase.FirebaseApp;" \
            "$MAIN"

          grep -Fq \
            "FirebaseApp.initializeApp(this);" \
            "$MAIN"

          grep -Fq \
            "super.onCreate(savedInstanceState);" \
            "$MAIN"

          grep -Fq \
            "RKMSNativeBridge(this, getBridge().getWebView())" \
            "$MAIN"

          COUNT="$(
            grep -F \
              -o \
              "FirebaseApp.initializeApp(this);" \
              "$MAIN" \
              | wc -l
          )"


          if [ "$COUNT" -ne 1 ]; then

            echo ""
            echo "ERROR: Firebase initialization count = $COUNT"
            echo ""

            grep -n \
              "FirebaseApp" \
              "$MAIN" \
              || true

            exit 1

          fi


          echo ""
          echo "============================================================"
          echo "MAINACTIVITY FIREBASE FINAL CHECK"
          echo "============================================================"

          echo "Firebase import: PASS"
          echo "Firebase initialization: PASS"
          echo "Initialization count: 1"
          echo "super.onCreate: PASS"
          echo "RKMSNativeBridge: PASS"

          echo ""
          echo "============================================================"



name: RKMS Final Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  AGP_VERSION: "8.9.1"
  GRADLE_VERSION: "8.11.1"
  APP_ID: "org.rkms.connect"
  SOURCE_ZIP: "RKMS_CONNECT_NOTIFICATION_SYSTEM_FULL_FIX_20260923_AUDITED_FIXED.zip"

jobs:
  build-release-apk:
    name: Build Signed Release APK
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail
          java -version
          javac -version

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Node and npm
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android API 36 and Build Tools
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "Android SDK packages installed successfully."

      - name: Verify Android SDK tools
        shell: bash
        run: |
          set -euo pipefail

          command -v adb
          command -v sdkmanager

          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" version
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" version
          adb version
          sdkmanager --version

      - name: Locate RKMS source ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$SOURCE_ZIP" ]; then
            FOUND_ZIP="$(find . -type f -name "$SOURCE_ZIP" -print -quit || true)"

            if [ -z "$FOUND_ZIP" ]; then
              echo "ERROR: Source ZIP not found."
              find . -type f -iname "*.zip" -print || true
              exit 1
            fi

            cp "$FOUND_ZIP" "./$SOURCE_ZIP"
          fi

          test -f "$SOURCE_ZIP"
          ls -lh "$SOURCE_ZIP"

      - name: Extract RKMS source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source extracted
          mkdir -p source extracted

          unzip -q "$SOURCE_ZIP" -d extracted

          PACKAGE_JSON="$(find extracted -type f -name package.json -print -quit || true)"

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json not found inside ZIP."
            exit 1
          fi

          SOURCE_ROOT="$(dirname "$PACKAGE_JSON")"

          cp -a "$SOURCE_ROOT"/. source/

          echo "SOURCE_ROOT=$SOURCE_ROOT"

      - name: Verify required source files
        shell: bash
        run: |
          set -euo pipefail

          cd source

          REQUIRED_FILES=(
            "package.json"
            "package-lock.json"
            "app.js"
            "index.html"
            "styles.css"
            "capacitor.config.json"
            "google-services.json"
            "scripts/setup-android-native.sh"
            "scripts/configure-android-16.sh"
            "scripts/configure-release-signing.sh"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            test -f "$file" || {
              echo "ERROR: Missing required file: $file"
              exit 1
            }
            echo "FOUND: $file"
          done

          echo "Required source files: PASS"

      - name: Verify Capacitor versions
        shell: bash
        run: |
          set -euo pipefail

          cd source

          node <<'NODE'
          const fs = require('fs');

          const pkg = JSON.parse(
            fs.readFileSync('package.json', 'utf8')
          );

          const expected = {
            '@capacitor/core': '6.2.2',
            '@capacitor/android': '6.2.2',
            '@capacitor/app': '6.0.3',
            '@capacitor/push-notifications': '6.0.3',
            '@capacitor/cli': '6.2.2'
          };

          const all = {
            ...(pkg.dependencies || {}),
            ...(pkg.devDependencies || {})
          };

          for (const [name, version] of Object.entries(expected)) {
            if (all[name] !== version) {
              console.error(
                `ERROR: ${name} expected ${version}, found ${all[name] || 'missing'}`
              );
              process.exit(1);
            }

            console.log(`PASS: ${name} ${version}`);
          }
          NODE

      - name: Verify Capacitor configuration
        shell: bash
        run: |
          set -euo pipefail

          cd source

          grep -q "org.rkms.connect" capacitor.config.json

          echo "Capacitor APP ID: PASS"

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd source

          test -s google-services.json

          grep -q \
            '"package_name"[[:space:]]*:[[:space:]]*"org.rkms.connect"' \
            google-services.json

          echo "Firebase package: PASS"

      - name: Verify FCM pipeline
        shell: bash
        run: |
          set -euo pipefail

          cd source

          if [ -f scripts/verify-fcm-pipeline.py ]; then
            python3 scripts/verify-fcm-pipeline.py
          fi

      - name: Verify saved login
        shell: bash
        run: |
          set -euo pipefail

          cd source

          if [ -f scripts/verify-saved-login.py ]; then
            python3 scripts/verify-saved-login.py
          fi

      - name: Verify native bridge
        shell: bash
        run: |
          set -euo pipefail

          cd source

          if [ -f scripts/verify-native-bridge.py ]; then
            python3 scripts/verify-native-bridge.py
          fi

      - name: Verify RKMS final
        shell: bash
        run: |
          set -euo pipefail

          cd source

          if [ -f scripts/verify-rkms-final.py ]; then
            python3 scripts/verify-rkms-final.py
          fi

      - name: Verify chat microphone
        shell: bash
        run: |
          set -euo pipefail

          cd source

          if [ -f scripts/verify-chat-mic-final.py ]; then
            python3 scripts/verify-chat-mic-final.py
          fi

      - name: Verify final three point fix
        shell: bash
        run: |
          set -euo pipefail

          cd source

          if [ -f scripts/verify-final-three-point-fix.py ]; then
            python3 scripts/verify-final-three-point-fix.py
          fi

      - name: Verify Android 16
        shell: bash
        run: |
          set -euo pipefail

          cd source

          if [ -f scripts/verify-android-16.py ]; then
            python3 scripts/verify-android-16.py
          fi

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd source

          npm ci --no-audit --no-fund

      - name: Verify installed push notifications
        shell: bash
        run: |
          set -euo pipefail

          cd source

          node -e "
            const p=require('./node_modules/@capacitor/push-notifications/package.json');
            if(p.version!=='6.0.3'){
              console.error('Wrong push-notifications version:',p.version);
              process.exit(1);
            }
            console.log('push-notifications:',p.version);
          "

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd source

          npm run build

          test -d dist
          test -f dist/index.html

          echo "Web build: PASS"

      - name: Create fresh Android project
        shell: bash
        run: |
          set -euo pipefail

          cd source

          rm -rf android

          npx cap add android

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd source

          chmod +x scripts/configure-android-16.sh
          ./scripts/configure-android-16.sh

      - name: Enforce Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          cd source

          if [ -f android/variables.gradle ]; then

            sed -i \
              -E 's/compileSdkVersion[[:space:]]*=[[:space:]]*[0-9]+/compileSdkVersion = 36/' \
              android/variables.gradle || true

            sed -i \
              -E 's/targetSdkVersion[[:space:]]*=[[:space:]]*[0-9]+/targetSdkVersion = 36/' \
              android/variables.gradle || true

            sed -i \
              -E 's/minSdkVersion[[:space:]]*=[[:space:]]*[0-9]+/minSdkVersion = 23/' \
              android/variables.gradle || true

          fi

      - name: Sync Capacitor
        shell: bash
        run: |
          set -euo pipefail

          cd source

          npx cap sync android

      - name: Setup RKMS Android native integration
        shell: bash
        run: |
          set -euo pipefail

          cd source

          chmod +x scripts/setup-android-native.sh

          ./scripts/setup-android-native.sh

      - name: Fix Google Services plugin version
        shell: bash
        run: |
          set -euo pipefail

          cd source

          test -f android/build.gradle
          test -f android/app/build.gradle

          sed -i \
            's/com\.google\.gms:google-services:4\.4\.0/com.google.gms:google-services:4.4.3/g' \
            android/build.gradle

          if ! grep -q \
            "com.google.gms.google-services" \
            android/app/build.gradle; then

            printf '\napply plugin: "com.google.gms.google-services"\n' \
              >> android/app/build.gradle
          fi

      - name: Verify Google Services plugin
        shell: bash
        run: |
          set -euo pipefail

          cd source

          grep -q \
            "com.google.gms:google-services:4.4.3" \
            android/build.gradle

          grep -q \
            "com.google.gms.google-services" \
            android/app/build.gradle

          echo "Google Services: PASS"

      - name: Verify Firebase native configuration
        shell: bash
        run: |
          set -euo pipefail

          cd source

          test -f android/app/google-services.json

          grep -q \
            '"package_name"[[:space:]]*:[[:space:]]*"org.rkms.connect"' \
            android/app/google-services.json

          echo "Firebase native configuration: PASS"

      - name: Verify MainActivity
        shell: bash
        run: |
          set -euo pipefail

          cd source

          MAIN_ACTIVITY="$(
            find android/app/src/main \
              -type f \
              -name MainActivity.java \
              -print -quit || true
          )"

          test -n "$MAIN_ACTIVITY"

          grep -q "RKMSNativeBridge" "$MAIN_ACTIVITY"
          grep -q "FirebaseApp.initializeApp" "$MAIN_ACTIVITY"
          grep -q "onNewIntent" "$MAIN_ACTIVITY"

          echo "MainActivity: PASS"

      - name: Ensure Firebase Messaging dependency
        shell: bash
        run: |
          set -euo pipefail

          cd source

          APP_GRADLE="android/app/build.gradle"

          if ! grep -q "firebase-messaging" "$APP_GRADLE"; then

            python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          text = p.read_text()

          dependency = """
              implementation 'com.google.firebase:firebase-messaging:25.0.1'
          """

          if "dependencies {" not in text:
              raise SystemExit("dependencies block not found")

          text = text.replace(
              "dependencies {",
              "dependencies {" + dependency,
              1
          )

          p.write_text(text)
          PY

          fi

          grep -q "firebase-messaging" "$APP_GRADLE"

      - name: Verify final Android configuration
        shell: bash
        run: |
          set -euo pipefail

          cd source

          test -f android/gradlew

          chmod +x android/gradlew

          grep -n "distributionUrl" \
            android/gradle/wrapper/gradle-wrapper.properties

          echo "Android configuration: PASS"

      - name: Resolve Gradle dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd source/android

          ./gradlew \
            --no-daemon \
            --stacktrace \
            dependencies

      - name: Static Android audit
        shell: bash
        run: |
          set -euo pipefail

          cd source

          MAIN_ACTIVITY="$(
            find android/app/src/main \
              -type f \
              -name MainActivity.java \
              -print -quit
          )"

          test -n "$MAIN_ACTIVITY"

          grep -q "FirebaseApp.initializeApp" "$MAIN_ACTIVITY"
          grep -q "RKMSNativeBridge" "$MAIN_ACTIVITY"
          grep -q "onNewIntent" "$MAIN_ACTIVITY"

          grep -Rqs "POST_NOTIFICATIONS" \
            android/app/src/main

          grep -Rqs "RECORD_AUDIO" \
            android/app/src/main

          echo "Static Android audit: PASS"

      - name: Verify release signing secrets
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$RKMS_KEYSTORE_BASE64"
          test -n "$RKMS_KEYSTORE_PASSWORD"
          test -n "$RKMS_KEY_ALIAS"
          test -n "$RKMS_KEY_PASSWORD"

          echo "Release signing secrets: PASS"

      - name: Configure release signing
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd source

          chmod +x scripts/configure-release-signing.sh

          ./scripts/configure-release-signing.sh

      # ============================================================
      # FINAL SIGNING FIX
      # Remove EVERY old null-producing storeFile reference.
      # Then write ONE absolute keystore path.
      # ============================================================
      - name: Fix release signing configuration
        shell: bash
        env:
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd source

          APP_GRADLE="android/app/build.gradle"

          test -f "$APP_GRADLE"

          KEYSTORE="$(
            find android \
              -type f \
              \( -name "*.jks" -o -name "*.keystore" \) \
              -print -quit || true
          )"

          if [ -z "$KEYSTORE" ]; then
            echo "ERROR: Release keystore not found."
            find android -type f \
              \( -name "*.jks" -o -name "*.keystore" \) \
              -print || true
            exit 1
          fi

          KEYSTORE_ABS="$(cd "$(dirname "$KEYSTORE")" && pwd)/$(basename "$KEYSTORE")"

          echo "Release keystore found:"
          echo "$KEYSTORE_ABS"

          test -f "$KEYSTORE_ABS"

          export RKMS_KEYSTORE_ABS="$KEYSTORE_ABS"

          python3 - "$KEYSTORE_ABS" <<'PY'
          from pathlib import Path
          import re
          import sys

          p = Path("android/app/build.gradle")
          text = p.read_text()

          keystore = sys.argv[1]

          keystore_escaped = (
              keystore
              .replace("\\", "\\\\")
              .replace("'", "\\'")
          )

          # --------------------------------------------------------
          # 1. Replace EVERY old environment-based storeFile.
          # This is the actual cause of:
          # path may not be null or empty string. path='null'
          # --------------------------------------------------------

          patterns = [
              r"storeFile\s+file\s*\(\s*System\.getenv\s*\(\s*['\"]RKMS_KEYSTORE_ABS['\"]\s*\)\s*\)",
              r"storeFile\s+file\s*\(\s*System\.getenv\s*\(\s*\"RKMS_KEYSTORE_ABS\"\s*\)\s*\)",
              r"storeFile\s+file\s*\(\s*System\.getenv\s*\(\s*'RKMS_KEYSTORE_ABS'\s*\)\s*\)"
          ]

          for pattern in patterns:
              text = re.sub(
                  pattern,
                  f"storeFile file('{keystore_escaped}')",
                  text
              )

          # --------------------------------------------------------
          # 2. Remove our previous FORCE block if present.
          # --------------------------------------------------------

          marker = "// RKMS FORCE RELEASE SIGNING CONFIGURATION"

          if marker in text:
              text = text.split(marker, 1)[0].rstrip() + "\n"

          # --------------------------------------------------------
          # 3. Remove any remaining exact null-producing expression.
          # --------------------------------------------------------

          if "System.getenv('RKMS_KEYSTORE_ABS')" in text:
              text = text.replace(
                  "System.getenv('RKMS_KEYSTORE_ABS')",
                  f"'{keystore_escaped}'"
              )

          if 'System.getenv("RKMS_KEYSTORE_ABS")' in text:
              text = text.replace(
                  'System.getenv("RKMS_KEYSTORE_ABS")',
                  f"'{keystore_escaped}'"
              )

          # --------------------------------------------------------
          # 4. Add one final deterministic release signing block.
          # --------------------------------------------------------

          block = f"""
          // RKMS FINAL RELEASE SIGNING CONFIGURATION
          android {{
              signingConfigs {{
                  release {{
                      storeFile file('{keystore_escaped}')
                      storePassword System.getenv('RKMS_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('RKMS_KEY_ALIAS')
                      keyPassword System.getenv('RKMS_KEY_PASSWORD')
                  }}
              }}

              buildTypes {{
                  release {{
                      signingConfig signingConfigs.release
                  }}
              }}
          }}
          """

          text = text.rstrip() + "\n\n" + block.strip() + "\n"

          p.write_text(text)

          # --------------------------------------------------------
          # 5. Hard verification.
          # --------------------------------------------------------

          final_text = p.read_text()

          if "System.getenv('RKMS_KEYSTORE_ABS')" in final_text:
              raise SystemExit(
                  "ERROR: old RKMS_KEYSTORE_ABS reference remains"
              )

          if 'System.getenv("RKMS_KEYSTORE_ABS")' in final_text:
              raise SystemExit(
                  "ERROR: old RKMS_KEYSTORE_ABS reference remains"
              )

          if f"storeFile file('{keystore_escaped}')" not in final_text:
              raise SystemExit(
                  "ERROR: absolute keystore storeFile was not written"
              )

          print("Release signing configuration fixed.")
          print("All old null-producing storeFile references removed.")
          print("Absolute keystore path written successfully.")
          PY

          echo
          echo "Checking signing configuration..."

          grep -n \
            -E "storeFile|storePassword|keyAlias|keyPassword" \
            "$APP_GRADLE"

          if grep -q \
            'System.getenv.*RKMS_KEYSTORE_ABS' \
            "$APP_GRADLE"; then
            echo "ERROR: RKMS_KEYSTORE_ABS still present."
            exit 1
          fi

          test -f "$KEYSTORE_ABS"
          test -n "$RKMS_KEYSTORE_PASSWORD"
          test -n "$RKMS_KEY_ALIAS"
          test -n "$RKMS_KEY_PASSWORD"

          echo
          echo "Release signing configuration: PASS"

      - name: Validate release keystore
        shell: bash
        env:
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          cd source

          KEYSTORE="$(
            find android \
              -type f \
              \( -name "*.jks" -o -name "*.keystore" \) \
              -print -quit || true
          )"

          test -n "$KEYSTORE"

          keytool \
            -list \
            -keystore "$KEYSTORE" \
            -storepass "$RKMS_KEYSTORE_PASSWORD" \
            >/dev/null

          echo "Keystore validation: PASS"

      - name: Verify Gradle version
        shell: bash
        run: |
          set -euo pipefail

          cd source/android

          ./gradlew --version

      - name: Fix MainActivity Java syntax
        shell: bash
        run: |
          set -euo pipefail

          cd source

          MAIN_ACTIVITY="$(
            find android/app/src/main \
              -type f \
              -name MainActivity.java \
              -print -quit || true
          )"

          test -n "$MAIN_ACTIVITY"

          sed -i \
            's/""NOT_READY""/"NOT_READY"/g' \
            "$MAIN_ACTIVITY"

          sed -i \
            's/""ERROR""/"ERROR"/g' \
            "$MAIN_ACTIVITY"

          if grep -q \
            '""NOT_READY""\|""ERROR""' \
            "$MAIN_ACTIVITY"; then
            echo "ERROR: Malformed Java quotes still present."
            exit 1
          fi

          echo "MainActivity Java syntax fix: PASS"

      # ============================================================
      # IMPORTANT:
      # Compile + manifest validation only.
      # Signing path is already hard-coded above.
      # ============================================================
      - name: Validate release configuration
        shell: bash
        env:
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd source/android

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:compileReleaseJavaWithJavac \
            :app:processReleaseMainManifest

      - name: Clean release build
        shell: bash
        run: |
          set -euo pipefail

          cd source/android

          ./gradlew \
            --no-daemon \
            clean

      # ============================================================
      # ONLY SIGNED RELEASE APK
      # NO DEBUG APK
      # NO AAB
      # ============================================================
      - name: Build Signed Release APK
        shell: bash
        env:
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd source/android

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleRelease

      - name: Verify release APK output
        shell: bash
        run: |
          set -euo pipefail

          cd source

          APK="$(
            find android/app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              -print -quit || true
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not generated."
            exit 1
          fi

          case "$APK" in
            *debug*)
              echo "ERROR: Debug APK detected."
              exit 1
              ;;
          esac

          ls -lh "$APK"

          echo "Release APK output: PASS"

      - name: Verify no AAB is required
        shell: bash
        run: |
          set -euo pipefail

          cd source

          if find android/app/build/outputs \
            -type f \
            -name "*.aab" \
            | grep -q .; then

            echo "ERROR: AAB generated."
            exit 1
          fi

          echo "APK-only output: PASS"

      - name: Verify APK package name
        shell: bash
        run: |
          set -euo pipefail

          cd source

          APK="$(
            find android/app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              -print -quit
          )"

          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"

          PACKAGE_NAME="$(
            "$AAPT" dump badging "$APK" \
              | sed -n "s/^package: name='\([^']*\)'.*/\1/p" \
              | head -1
          )"

          echo "APK package: $PACKAGE_NAME"

          test "$PACKAGE_NAME" = "org.rkms.connect"

          echo "Package name: PASS"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          cd source

          APK="$(
            find android/app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              -print -quit
          )"

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

          echo "APK signature: PASS"

      - name: Generate APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd source

          APK="$(
            find android/app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              -print -quit
          )"

          sha256sum "$APK"

      - name: Prepare final APK
        shell: bash
        run: |
          set -euo pipefail

          cd source

          APK="$(
            find android/app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              -print -quit
          )"

          cp "$APK" \
            ../RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk

          sha256sum \
            ../RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk \
            > ../RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk.sha256

          ls -lh \
            ../RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk \
            ../RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk.sha256

      - name: Upload final signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-CONNECT-FINAL-SIGNED-RELEASE-APK
          if-no-files-found: error
          path: |
            RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk
            RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk.sha256

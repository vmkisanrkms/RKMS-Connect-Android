name: RKMS Android 16 API 36 - Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: RKMS Android 16 / API 36 - Release APK
    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:
      # ------------------------------------------------------------
      # 1. Checkout latest source
      # ------------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ------------------------------------------------------------
      # 2. Node.js
      # ------------------------------------------------------------
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ------------------------------------------------------------
      # 3. Java 17
      # ------------------------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ------------------------------------------------------------
      # 4. Android SDK API 36
      # ------------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 / API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # ------------------------------------------------------------
      # 5. Verify source
      # ------------------------------------------------------------
      - name: Verify app.js
        run: |
          node --check app.js

      - name: Verify scripts
        run: |
          python3 -m py_compile scripts/*.py

      # ------------------------------------------------------------
      # 6. Install dependencies
      # ------------------------------------------------------------
      - name: Install npm dependencies
        run: |
          npm ci

      # ------------------------------------------------------------
      # 7. Configure Android 16
      # ------------------------------------------------------------
      - name: Configure Android 16
        run: |
          chmod +x scripts/configure-android-16.sh
          ./scripts/configure-android-16.sh

      # ------------------------------------------------------------
      # 8. Add Android platform
      # ------------------------------------------------------------
      - name: Add Capacitor Android
        run: |
          npx cap add android

      # ------------------------------------------------------------
      # 9. Sync web assets
      # ------------------------------------------------------------
      - name: Capacitor sync
        run: |
          npx cap sync android

      # ------------------------------------------------------------
      # 10. Force Android 16 / API 36
      # ------------------------------------------------------------
      - name: Enforce Android 16 / API 36
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/variables.gradle")

          if p.exists():
              text = p.read_text()

              replacements = {
                  "compileSdkVersion = 35": "compileSdkVersion = 36",
                  "compileSdkVersion = 34": "compileSdkVersion = 36",
                  "targetSdkVersion = 35": "targetSdkVersion = 36",
                  "targetSdkVersion = 34": "targetSdkVersion = 36",
                  "minSdkVersion = 22": "minSdkVersion = 23",
              }

              for old, new in replacements.items():
                  text = text.replace(old, new)

              p.write_text(text)
          PY

          grep -R "compileSdk\|targetSdk" android/variables.gradle || true

      # ------------------------------------------------------------
      # 11. Google services file check
      # ------------------------------------------------------------
      - name: Verify Firebase configuration
        run: |
          if [ -f "google-services.json" ]; then
            echo "google-services.json found"
          else
            echo "google-services.json not found at root"
          fi

      # ------------------------------------------------------------
      # 12. Build tools / Gradle
      # ------------------------------------------------------------
      - name: Configure Gradle
        run: |
          cd android

          python3 - <<'PY'
          from pathlib import Path

          p = Path("gradle/wrapper/gradle-wrapper.properties")

          if p.exists():
              text = p.read_text()

              import re

              text = re.sub(
                  r"distributionUrl=.*",
                  "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.11.1-bin.zip",
                  text
              )

              p.write_text(text)
          PY

      # ------------------------------------------------------------
      # 13. Build release APK
      # ------------------------------------------------------------
      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon --stacktrace

      # ------------------------------------------------------------
      # 14. Locate APK
      # ------------------------------------------------------------
      - name: Locate APK
        run: |
          find android/app/build/outputs/apk/release -type f -name "*.apk" -print

      # ------------------------------------------------------------
      # 15. SHA256
      # ------------------------------------------------------------
      - name: Generate SHA256
        run: |
          APK=$(find android/app/build/outputs/apk/release \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found"
            exit 1
          fi

          sha256sum "$APK" | tee RKMS_ANDROID16_API36_SHA256.txt

      # ------------------------------------------------------------
      # 16. Upload APK artifact
      # ------------------------------------------------------------
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS_CONNECT_ANDROID16_API36_RELEASE
          path: |
            android/app/build/outputs/apk/release/*.apk
            RKMS_ANDROID16_API36_SHA256.txt
          if-no-files-found: error
          retention-days: 90

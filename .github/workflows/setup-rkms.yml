name: RKMS Android 16 API 36 - Final Release APK Only

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  AGP_VERSION: "8.9.1"
  GRADLE_VERSION: "8.11.1"
  APP_ID: "org.rkms.connect"

jobs:
  android-build:
    name: RKMS Android 16 API 36 Release APK
    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. RESOLVE RKMS SOURCE
      # ============================================================
      - name: Resolve RKMS source
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking RKMS source..."

          # --------------------------------------------------------
          # CASE 1: Source is already in repository root
          # --------------------------------------------------------
          if [[ -f "package.json" ]] && \
             [[ -f "package-lock.json" ]] && \
             [[ -f "app.js" ]] && \
             [[ -f "index.html" ]] && \
             [[ -f "styles.css" ]] && \
             [[ -f "capacitor.config.json" ]] && \
             [[ -f "google-services.json" ]]; then

            echo "Root RKMS source detected."
            echo "RKMS_SOURCE_DIR=." >> "$GITHUB_ENV"
            exit 0
          fi


          # --------------------------------------------------------
          # CASE 2: Find RKMS ZIP
          # --------------------------------------------------------
          echo "Root RKMS source not found."
          echo "Searching for RKMS source ZIP..."

          rm -rf rkms-source
          mkdir -p rkms-source

          ZIP=""

          # Exact current final ZIP
          if [[ -f "RKMS_CONNECT_FINAL_RELEASE_APK_ONLY_CHAT_FIXED.zip" ]]; then
            ZIP="RKMS_CONNECT_FINAL_RELEASE_APK_ONLY_CHAT_FIXED.zip"
          fi

          # Current patched source ZIP
          if [[ -z "$ZIP" ]] && \
             [[ -f "RKMS_CONNECT_FINAL_CHAT_UI_PROFESSIONAL_FIXED_SCROLL_FOOTER_PATCHED.zip" ]]; then
            ZIP="RKMS_CONNECT_FINAL_CHAT_UI_PROFESSIONAL_FIXED_SCROLL_FOOTER_PATCHED.zip"
          fi

          # Previous source ZIP
          if [[ -z "$ZIP" ]] && \
             [[ -f "RKMS_CONNECT_FINAL_CHAT_UI_PROFESSIONAL_FIXED.zip" ]]; then
            ZIP="RKMS_CONNECT_FINAL_CHAT_UI_PROFESSIONAL_FIXED.zip"
          fi

          # Other known RKMS source ZIPs
          if [[ -z "$ZIP" ]]; then
            for CANDIDATE in \
              "RKMS_CONNECT_FINAL_CLEAN_ANDROID16_API36_APK_AAB_BUILD.zip" \
              "RKMS_CONNECT_CHAT_DIGITAL_ID_ANDROID16_API36_FINAL_APK_BUILD.zip"
            do
              if [[ -f "$CANDIDATE" ]]; then
                ZIP="$CANDIDATE"
                break
              fi
            done
          fi

          # Recursive fallback
          if [[ -z "$ZIP" ]]; then
            FOUND_ZIP="$(
              find . \
                -type f \
                -iname "RKMS_CONNECT*.zip" \
                -not -path "./.git/*" \
                -print \
                | head -n 1 || true
            )"

            if [[ -n "$FOUND_ZIP" ]]; then
              ZIP="$FOUND_ZIP"
            fi
          fi

          if [[ -z "$ZIP" ]]; then
            echo "::error::RKMS source ZIP not found."
            echo
            echo "Repository files:"
            find . \
              -maxdepth 4 \
              -type f \
              -not -path "./.git/*" \
              | sort \
              | head -500
            exit 1
          fi

          echo "Using RKMS source ZIP:"
          echo "$ZIP"


          # --------------------------------------------------------
          # EXTRACT
          # --------------------------------------------------------
          unzip -q "$ZIP" -d rkms-source


          # --------------------------------------------------------
          # FIND package.json
          # --------------------------------------------------------
          FOUND_PACKAGE="$(
            find rkms-source \
              -type f \
              -name package.json \
              -print \
              | head -n 1 || true
          )"

          if [[ -z "$FOUND_PACKAGE" ]]; then
            echo "::error::package.json not found after ZIP extraction."
            exit 1
          fi

          SOURCE="$(dirname "$FOUND_PACKAGE")"

          echo "Resolved RKMS source:"
          echo "$SOURCE"


          # --------------------------------------------------------
          # VERIFY CORE SOURCE
          # --------------------------------------------------------
          REQUIRED_FILES=(
            package.json
            package-lock.json
            app.js
            index.html
            styles.css
            capacitor.config.json
            google-services.json
            scripts/configure-android-16.sh
            scripts/setup-android-native.sh
            scripts/configure-release-signing.sh
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$SOURCE/$FILE" ]]; then
              echo "::error::Missing required source file: $SOURCE/$FILE"
              exit 1
            fi
          done


          # --------------------------------------------------------
          # EXPORT SOURCE PATH
          # --------------------------------------------------------
          echo "RKMS_SOURCE_DIR=$SOURCE" >> "$GITHUB_ENV"

          echo
          echo "=============================================="
          echo " RKMS SOURCE RESOLUTION: PASS"
          echo "=============================================="
          echo "Source: $SOURCE"
          echo


      # ============================================================
      # 3. VERIFY RKMS SOURCE
      # ============================================================
      - name: Verify RKMS source
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          REQUIRED_FILES=(
            package.json
            package-lock.json
            app.js
            index.html
            styles.css
            capacitor.config.json
            google-services.json
            scripts/configure-android-16.sh
            scripts/setup-android-native.sh
            scripts/configure-release-signing.sh
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$FILE" ]]; then
              echo "::error::Missing required file: $FILE"
              exit 1
            fi
          done

          echo "All required RKMS source files verified."


      # ============================================================
      # 4. NODE 22
      # ============================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}


      # ============================================================
      # 5. VERIFY NODE + JAVASCRIPT
      # ============================================================
      - name: Verify Node and JavaScript
        shell: bash
        run: |
          set -euo pipefail

          node --version
          npm --version

          cd "$RKMS_SOURCE_DIR"

          node --check app.js

          echo "Node.js and app.js syntax verified."


      # ============================================================
      # 6. VERIFY CAPACITOR VERSIONS
      # ============================================================
      - name: Verify Capacitor versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          node <<'NODE'
          const p = require("./package.json");

          const expected = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          for (const [name, version] of Object.entries(expected)) {
            const actual =
              (p.dependencies && p.dependencies[name]) ||
              (p.devDependencies && p.devDependencies[name]);

            if (!actual || !actual.includes(version)) {
              console.error(
                `${name}: expected ${version}, found ${actual}`
              );
              process.exit(1);
            }

            console.log(`${name}: ${actual}`);
          }

          console.log("Capacitor versions verified.");
          NODE


      # ============================================================
      # 7. NPM INSTALL
      # ============================================================
      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          npm ci --no-audit --no-fund


      # ============================================================
      # 8. VERIFY PROFESSIONAL CHAT UI
      # ============================================================
      - name: Verify professional Chat UI
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          test -s styles.css

          grep -qE '\.wa-chat-screen' styles.css || {
            echo "::error::wa-chat-screen CSS not found."
            exit 1
          }

          grep -qE '\.wa-chat-list' styles.css || {
            echo "::error::wa-chat-list CSS not found."
            exit 1
          }

          grep -qE '\.wa-chat-row' styles.css || {
            echo "::error::wa-chat-row CSS not found."
            exit 1
          }

          grep -qE '\.wa-avatar-wrap' styles.css || {
            echo "::error::Chat avatar CSS not found."
            exit 1
          }

          grep -qE '\.wa-chat-search' styles.css || {
            echo "::error::Chat search CSS not found."
            exit 1
          }

          grep -qE '\.wa-filters' styles.css || {
            echo "::error::Chat filters CSS not found."
            exit 1
          }

          echo
          echo "=============================================="
          echo " PROFESSIONAL CHAT UI VERIFICATION: PASS"
          echo "=============================================="
          echo


      # ============================================================
      # 9. VERIFY CHAT SCROLL / FOOTER LAYOUT
      # ============================================================
      - name: Verify Chat scroll and footer layout
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          echo "Checking Chat layout..."

          # Chat screen must use dynamic mobile viewport
          grep -qE '100dvh' styles.css || {
            echo "::error::100dvh mobile viewport handling not found."
            exit 1
          }

          # Chat screen must be height constrained
          grep -qE '\.wa-chat-screen.*height:calc' styles.css || {
            echo "::error::Chat screen height calculation not found."
            exit 1
          }

          # Chat list must be a flex child
          grep -qE '\.wa-chat-list' styles.css || {
            echo "::error::Chat list CSS not found."
            exit 1
          }

          # Chat list must contain scrolling
          grep -qE 'overflow(-y)?[[:space:]]*:[[:space:]]*auto' styles.css || {
            echo "::error::Scrollable Chat area not found."
            exit 1
          }

          # Single-chat messages must have their own scroll
          grep -qE '\.wa-messages' styles.css || {
            echo "::error::Single Chat messages container not found."
            exit 1
          }

          # Footer must be fixed
          grep -qE 'footer\.rkms-bottom-nav' styles.css || {
            echo "::error::RKMS bottom navigation CSS not found."
            exit 1
          }

          grep -qE 'position:[[:space:]]*fixed' styles.css || {
            echo "::error::Fixed footer positioning not found."
            exit 1
          }

          # Slim footer target
          grep -qE 'min-height:[[:space:]]*62px' styles.css || {
            echo "::error::62px slim footer configuration not found."
            exit 1
          }

          echo
          echo "=============================================="
          echo " CHAT SCROLL / FOOTER VERIFICATION: PASS"
          echo "=============================================="
          echo "Dynamic viewport: PASS"
          echo "Chat scroll: PASS"
          echo "Single chat scroll: PASS"
          echo "Fixed footer: PASS"
          echo "Slim footer: PASS"
          echo


      # ============================================================
      # 10. VERIFY CHAT CSS SYNTAX BASICALLY
      # ============================================================
      - name: Verify Chat CSS integrity
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          python3 <<'PY'
          from pathlib import Path

          css = Path("styles.css").read_text(
              encoding="utf-8",
              errors="replace"
          )

          # Remove comments for structural checking
          import re
          clean = re.sub(r"/\*.*?\*/", "", css, flags=re.S)

          opens = clean.count("{")
          closes = clean.count("}")

          if opens != closes:
              raise SystemExit(
                  f"CSS brace mismatch: {{={opens}, }}={closes}"
              )

          if "wa-chat-screen" not in css:
              raise SystemExit(
                  "wa-chat-screen missing"
              )

          if "wa-chat-list" not in css:
              raise SystemExit(
                  "wa-chat-list missing"
              )

          if "wa-messages" not in css:
              raise SystemExit(
                  "wa-messages missing"
              )

          if "rkms-bottom-nav" not in css:
              raise SystemExit(
                  "rkms-bottom-nav missing"
              )

          print("Chat CSS structural verification passed.")
          PY


      # ============================================================
      # 11. WEB BUILD
      # ============================================================
      - name: Build RKMS web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          npm run build

          test -d dist
          test -s dist/index.html

          echo "RKMS web build successful."


      # ============================================================
      # 12. JAVA 17
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle


      # ============================================================
      # 13. VERIFY JAVA
      # ============================================================
      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail

          java -version


      # ============================================================
      # 14. ANDROID SDK API 36
      # ============================================================
      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses >/dev/null 2>&1 || true

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          echo "Android SDK installed."


      # ============================================================
      # 15. VERIFY ANDROID SDK
      # ============================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d \
            "${ANDROID_HOME}/platforms/android-${ANDROID_API}"

          test -d \
            "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}"

          "${ANDROID_HOME}/platform-tools/adb" version

          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt" version

          echo "Android API ${ANDROID_API} verified."


      # ============================================================
      # 16. CREATE CAPACITOR ANDROID
      # ============================================================
      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          rm -rf android

          npx cap add android

          test -d android
          test -f android/gradlew
          test -f android/app/build.gradle

          chmod +x android/gradlew

          echo "Android project created successfully."


      # ============================================================
      # 17. CONFIGURE ANDROID 16 API 36
      # ============================================================
      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          chmod +x scripts/configure-android-16.sh

          ./scripts/configure-android-16.sh

          test -f android/gradlew

          chmod +x android/gradlew

          echo "Android 16/API 36 configuration applied."


      # ============================================================
      # 18. VERIFY ANDROID CONFIGURATION
      # ============================================================
      - name: Verify Android configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          grep -R "compileSdk.*36" android >/dev/null || {
            echo "::error::compileSdk 36 not found."
            exit 1
          }

          grep -R "targetSdk.*36" android >/dev/null || {
            echo "::error::targetSdk 36 not found."
            exit 1
          }

          grep -R "8.9.1" android >/dev/null || {
            echo "::error::AGP 8.9.1 not found."
            exit 1
          }

          grep -q "gradle-8.11.1" \
            android/gradle/wrapper/gradle-wrapper.properties || {
              echo "::error::Gradle 8.11.1 not configured."
              exit 1
            }

          echo "Android 16/API 36 configuration verified."


      # ============================================================
      # 19. CAPACITOR SYNC
      # ============================================================
      - name: Capacitor sync
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          npx cap sync android

          test -f android/gradlew

          chmod +x android/gradlew

          echo "Capacitor sync completed."


      # ============================================================
      # 20. SETUP RKMS NATIVE AND FIREBASE
      # ============================================================
      - name: Setup RKMS native Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          chmod +x scripts/setup-android-native.sh

          ./scripts/setup-android-native.sh

          test -f android/gradlew

          chmod +x android/gradlew

          echo "RKMS native Android setup completed."


      # ============================================================
      # 21. VERIFY FIREBASE CONFIGURATION
      # ============================================================
      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          test -s google-services.json
          test -s android/app/google-services.json

          node <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync("google-services.json", "utf8")
          );

          const clients = data.client || [];

          const valid = clients.some(client =>
            client.client_info &&
            client.client_info.android_client_info &&
            client.client_info.android_client_info.package_name ===
              "org.rkms.connect"
          );

          if (!valid) {
            console.error(
              "Firebase package org.rkms.connect not found."
            );
            process.exit(1);
          }

          console.log(
            "Firebase package org.rkms.connect verified."
          );
          NODE


      # ============================================================
      # 22. ENSURE FIREBASE DEPENDENCIES
      # ============================================================
      - name: Ensure Firebase dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          FILE="android/app/build.gradle"

          test -f "$FILE"

          python3 <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          bom = "implementation platform('com.google.firebase:firebase-bom:33.9.0')"
          messaging = "implementation 'com.google.firebase:firebase-messaging'"

          if bom not in s:
              marker = "dependencies {"

              if marker not in s:
                  raise SystemExit(
                      "dependencies block not found"
                  )

              s = s.replace(
                  marker,
                  marker + "\n    " + bom,
                  1
              )

          if messaging not in s:
              marker = "dependencies {"

              if marker not in s:
                  raise SystemExit(
                      "dependencies block not found"
                  )

              # Insert after opening dependencies block
              s = s.replace(
                  marker,
                  marker + "\n    " + messaging,
                  1
              )

          p.write_text(s)

          print("Firebase dependencies ready.")
          PY


      # ============================================================
      # 23. VERIFY FIREBASE INITIALIZATION
      # ============================================================
      - name: Verify Firebase initialization
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          grep -R \
            "FirebaseApp.initializeApp" \
            android/app/src/main/java \
            >/dev/null || {
              echo "::error::FirebaseApp.initializeApp not found."
              exit 1
            }

          echo "Firebase initialization verified."


      # ============================================================
      # 24. VERIFY NATIVE BRIDGE
      # ============================================================
      - name: Verify RKMS native bridge
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          find android/app/src/main/java \
            -name "RKMSNativeBridge.java" \
            -print -quit \
            | grep -q . || {
              echo "::error::RKMSNativeBridge.java missing."
              exit 1
            }

          find android/app/src/main/java \
            -name "RKMSSecureCredentialsPlugin.java" \
            -print -quit \
            | grep -q . || {
              echo "::error::RKMSSecureCredentialsPlugin.java missing."
              exit 1
            }

          echo "RKMS native bridge verified."


      # ============================================================
      # 25. VERIFY BIOMETRIC
      # ============================================================
      - name: Verify biometric dependency
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          grep -R \
            "androidx.biometric:biometric" \
            android \
            >/dev/null || {
              echo "::error::Biometric dependency missing."
              exit 1
            }

          echo "Biometric dependency verified."


      # ============================================================
      # 26. VERIFY LAUNCHER ICONS
      # ============================================================
      - name: Verify RKMS launcher icons
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          COUNT="$(
            find android/app/src/main/res \
              -type f \
              \( \
                -name "ic_launcher*" \
                -o \
                -name "ic_launcher_round*" \
              \) \
              | wc -l
          )"

          if [[ "$COUNT" -lt 1 ]]; then
            echo "::error::RKMS launcher icon missing."
            exit 1
          fi

          echo "Launcher icons found: $COUNT"


      # ============================================================
      # 27. CHECK RELEASE SIGNING SECRETS
      # ============================================================
      - name: Verify release signing secrets
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${RKMS_KEYSTORE_BASE64:-}" ]]; then
            echo "::error::RKMS_KEYSTORE_BASE64 is missing or empty."
            exit 1
          fi

          if [[ -z "${RKMS_KEYSTORE_PASSWORD:-}" ]]; then
            echo "::error::RKMS_KEYSTORE_PASSWORD is missing or empty."
            exit 1
          fi

          if [[ -z "${RKMS_KEY_ALIAS:-}" ]]; then
            echo "::error::RKMS_KEY_ALIAS is missing or empty."
            exit 1
          fi

          if [[ -z "${RKMS_KEY_PASSWORD:-}" ]]; then
            echo "::error::RKMS_KEY_PASSWORD is missing or empty."
            exit 1
          fi

          echo "All release signing secrets are present."


      # ============================================================
      # 28. CONFIGURE RELEASE SIGNING
      # ============================================================
      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          chmod +x scripts/configure-release-signing.sh

          ./scripts/configure-release-signing.sh

          test -s android/app/release.keystore

          echo "Release keystore created."


      # ============================================================
      # 29. VALIDATE KEYSTORE
      # ============================================================
      - name: Validate release keystore
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          test -s android/app/release.keystore

          keytool \
            -list \
            -keystore android/app/release.keystore \
            -storepass "$RKMS_KEYSTORE_PASSWORD" \
            -alias "$RKMS_KEY_ALIAS" \
            >/dev/null

          echo "Release keystore/password/alias verified."


      # ============================================================
      # 30. VERIFY SIGNING CONFIGURATION
      # ============================================================
      - name: Verify release signing configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          grep -q "signingConfigs" \
            android/app/build.gradle

          grep -q "signingConfigs.release" \
            android/app/build.gradle

          grep -q "storeFile" \
            android/app/build.gradle

          grep -q "storePassword" \
            android/app/build.gradle

          grep -q "keyAlias" \
            android/app/build.gradle

          grep -q "keyPassword" \
            android/app/build.gradle

          echo "Release signing configuration verified."


      # ============================================================
      # 31. VERIFY GRADLE WRAPPER
      # ============================================================
      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR/android"

          test -f gradlew

          chmod +x gradlew

          ./gradlew --version

          ./gradlew --version \
            | grep -q "8.11.1" || {
              echo "::error::Gradle 8.11.1 expected."
              exit 1
            }

          echo "Gradle wrapper verified."


      # ============================================================
      # 32. VERIFY FIREBASE RELEASE CLASSPATH
      # ============================================================
      - name: Verify Firebase compile classpath
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR/android"

          ./gradlew \
            :app:dependencies \
            --configuration releaseCompileClasspath \
            --no-daemon \
            > ../firebase-dependencies.txt

          grep -q "firebase-messaging" \
            ../firebase-dependencies.txt || {
              echo "::error::firebase-messaging missing."
              exit 1
            }

          echo "Firebase Messaging compile dependency verified."


      # ============================================================
      # 33. BUILD FINAL RELEASE APK ONLY
      #
      # IMPORTANT:
      # assembleRelease ONLY
      # NO assembleDebug
      # NO bundleRelease
      # ============================================================
      - name: Build Final Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR/android"

          ./gradlew \
            assembleRelease \
            --no-daemon \
            --stacktrace

          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"

          test -s "$RELEASE_APK"

          echo
          echo "=============================================="
          echo " FINAL RELEASE APK BUILD SUCCESS"
          echo "=============================================="
          echo

          ls -lh "$RELEASE_APK"


      # ============================================================
      # 34. VERIFY RELEASE APK PACKAGE ID
      # ============================================================
      - name: Verify Release APK package ID
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          AAPT="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt"

          "$AAPT" dump badging \
            android/app/build/outputs/apk/release/app-release.apk \
            | grep -q \
            "package: name='org.rkms.connect'" || {
              echo "::error::Wrong package ID."
              exit 1
            }

          echo "Package ID verified: org.rkms.connect"


      # ============================================================
      # 35. VERIFY RELEASE APK SIGNATURE
      # ============================================================
      - name: Verify Release APK signature
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          APKSIGNER="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            android/app/build/outputs/apk/release/app-release.apk

          echo "Release APK signature verified."


      # ============================================================
      # 36. VERIFY RELEASE APK TARGET SDK
      # ============================================================
      - name: Verify Release APK target SDK
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          AAPT="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt"

          "$AAPT" dump badging \
            android/app/build/outputs/apk/release/app-release.apk \
            | grep -q \
            "targetSdkVersion:'36'" || {
              echo "::error::Release APK target SDK is not 36."
              exit 1
            }

          echo "Release APK target SDK 36 verified."


      # ============================================================
      # 37. PREPARE FINAL RELEASE APK
      # ============================================================
      - name: Prepare final Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          rm -rf release
          mkdir -p release

          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          echo "Final Release APK prepared."


      # ============================================================
      # 38. GENERATE SHA256
      # ============================================================
      - name: Generate SHA256 checksum
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR/release"

          sha256sum \
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk \
            > RKMS_ANDROID16_API36_SHA256.txt

          echo
          echo "===== SHA256 ====="
          cat RKMS_ANDROID16_API36_SHA256.txt


      # ============================================================
      # 39. FINAL ARTIFACT CHECK
      # ============================================================
      - name: Final artifact check
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          # Final APK must exist
          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          # SHA file must exist
          test -s \
            release/RKMS_ANDROID16_API36_SHA256.txt

          # Ensure no Debug APK is being prepared
          if find release \
            -type f \
            -iname "*debug*.apk" \
            -print \
            | grep -q .; then
            echo "::error::Debug APK found in final release directory."
            exit 1
          fi

          # Ensure no AAB is being prepared
          if find release \
            -type f \
            -name "*.aab" \
            -print \
            | grep -q .; then
            echo "::error::AAB found in final release directory."
            exit 1
          fi

          echo
          echo "=============================================="
          echo " RKMS FINAL RELEASE APK READY"
          echo "=============================================="
          echo
          echo "Release APK: YES"
          echo "AAB: NO"
          echo "Debug APK: NO"
          echo "Chat UI: VERIFIED"
          echo "Chat Scroll: VERIFIED"
          echo "Single Chat Scroll: VERIFIED"
          echo "Footer Layout: VERIFIED"
          echo "Firebase: VERIFIED"
          echo "Native Bridge: VERIFIED"
          echo "Saved Login: INCLUDED"
          echo "Android API 36: VERIFIED"
          echo "Package: org.rkms.connect"
          echo

          ls -lh release/


      # ============================================================
      # 40. UPLOAD FINAL RELEASE APK ONLY
      # ============================================================
      - name: Upload final Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-ANDROID16-API36-FINAL-RELEASE-APK
          path: |
            ${{ env.RKMS_SOURCE_DIR }}/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            ${{ env.RKMS_SOURCE_DIR }}/release/RKMS_ANDROID16_API36_SHA256.txt
          if-no-files-found: error
          retention-days: 30

name: Build RKMS Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ANDROID_SOURCE_COMMIT: cf252628308e5a6ecc9eafbaf4ca227a3ad8ec92

  # अपनी LIVE RKMS WEBSITE का exact HTTPS URL यहाँ डालें
  RKMS_WEBSITE_URL: https://YOUR-LIVE-RKMS-WEBSITE-URL

jobs:
  build:
    name: Build RKMS Release APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout current repository
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # =========================================================
      # 2. Prepare native Android project
      #
      # पुराने git archive / git --work-tree तरीके को हटाया गया है.
      # Native Android source को सीधे clone किया जा रहा है.
      # =========================================================
      - name: Prepare native Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$RUNNER_TEMP/rkms-android"

          rm -rf "$PROJECT_DIR"

          echo "========================================"
          echo "Preparing native Android project"
          echo "========================================"
          echo "Commit:"
          echo "$ANDROID_SOURCE_COMMIT"

          git clone \
            --no-tags \
            --filter=blob:none \
            "https://github.com/vmkisanrkms/RKMS-Connect-Android.git" \
            "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          git checkout --detach "$ANDROID_SOURCE_COMMIT"

          echo ""
          echo "Checked out commit:"
          git rev-parse HEAD

          test "$(git rev-parse HEAD)" = "$ANDROID_SOURCE_COMMIT"

          test -f "$PROJECT_DIR/settings.gradle" || \
            test -f "$PROJECT_DIR/settings.gradle.kts"

          test -f "$PROJECT_DIR/app/build.gradle" || \
            test -f "$PROJECT_DIR/app/build.gradle.kts"

          test -f "$PROJECT_DIR/gradlew"

          test -f "$PROJECT_DIR/app/google-services.json"

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          chmod +x "$PROJECT_DIR/gradlew"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Native Android project prepared successfully."


      # =========================================================
      # 3. Validate live website URL
      # =========================================================
      - name: Validate RKMS website URL
        shell: bash
        run: |
          set -euo pipefail

          URL="$RKMS_WEBSITE_URL"

          echo "Website URL:"
          echo "$URL"

          if [[ "$URL" == "https://YOUR-LIVE-RKMS-WEBSITE-URL" ]]; then
            echo ""
            echo "ERROR: RKMS_WEBSITE_URL is still a placeholder."
            echo "Please replace it with the real live RKMS website URL."
            exit 1
          fi

          if [[ "$URL" != https://* ]]; then
            echo ""
            echo "ERROR: RKMS website must use HTTPS."
            exit 1
          fi

          HTTP_CODE="$(
            curl \
              -L \
              -s \
              -o /dev/null \
              -w '%{http_code}' \
              --connect-timeout 15 \
              --max-time 30 \
              "$URL" || true
          )"

          echo "HTTP status: $HTTP_CODE"

          case "$HTTP_CODE" in
            200|301|302|304)
              echo "LIVE WEBSITE CHECK: PASS"
              ;;
            *)
              echo "ERROR: Live RKMS website could not be reached."
              exit 1
              ;;
          esac


      # =========================================================
      # 4. Configure Android to open LIVE website
      #
      # APK में website की अलग copy नहीं रखी जाएगी.
      # App सीधे live website खोलेगा.
      # =========================================================
      - name: Configure live RKMS website
        shell: bash
        env:
          WEBSITE_URL: ${{ env.RKMS_WEBSITE_URL }}
        run: |
          set -euo pipefail

          MAIN_ACTIVITY="$PROJECT_DIR/app/src/main/java/org/rkms/connect/MainActivity.java"

          test -f "$MAIN_ACTIVITY"

          python3 - "$MAIN_ACTIVITY" "$WEBSITE_URL" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          website = sys.argv[2].rstrip("/")

          text = path.read_text(encoding="utf-8")

          old = (
              'private static final String ASSET_HOME = '
              '"file:///android_asset/www/index.html";'
          )

          new = (
              'private static final String WEBSITE_HOME = '
              f'"{website}";'
          )

          if old not in text:
              raise SystemExit(
                  "ERROR: ASSET_HOME declaration was not found."
              )

          text = text.replace(old, new)

          old_route_1 = (
              'webView.loadUrl(ASSET_HOME + '
              '(route.isEmpty() ? "" : "#" + route));'
          )

          new_route_1 = (
              'webView.loadUrl(WEBSITE_HOME + '
              '(route.isEmpty() ? "" : "/#" + route));'
          )

          if old_route_1 not in text:
              raise SystemExit(
                  "ERROR: Initial route loader was not found."
              )

          text = text.replace(
              old_route_1,
              new_route_1
          )

          old_route_2 = (
              'if (!route.isEmpty() && webView != null) '
              'webView.loadUrl(ASSET_HOME + "#" + route);'
          )

          new_route_2 = (
              'if (!route.isEmpty() && webView != null) '
              'webView.loadUrl(WEBSITE_HOME + "/#" + route);'
          )

          if old_route_2 not in text:
              raise SystemExit(
                  "ERROR: onNewIntent route loader was not found."
              )

          text = text.replace(
              old_route_2,
              new_route_2
          )

          path.write_text(text, encoding="utf-8")
          PY

          echo ""
          echo "Configured website:"
          grep -n "WEBSITE_HOME" "$MAIN_ACTIVITY"


      # =========================================================
      # 5. Verify WebView configuration
      # =========================================================
      - name: Verify WebView configuration
        shell: bash
        run: |
          set -euo pipefail

          MAIN_ACTIVITY="$PROJECT_DIR/app/src/main/java/org/rkms/connect/MainActivity.java"

          test -f "$MAIN_ACTIVITY"

          grep -q "WEBSITE_HOME" "$MAIN_ACTIVITY"

          if grep -q "file:///android_asset/www/index.html" "$MAIN_ACTIVITY"; then
            echo "ERROR: Local bundled website is still being used."
            exit 1
          fi

          echo "LIVE WEBSITE WebView configuration: PASS"


      # =========================================================
      # 6. Setup Java 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # =========================================================
      # 7. Setup Android SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # =========================================================
      # 8. Verify Android / Firebase project
      # =========================================================
      - name: Verify Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Android project verification"
          echo "========================================"

          ./gradlew --version

          test -f app/google-services.json
          test -f app/src/main/AndroidManifest.xml

          echo ""
          echo "Google Services configuration: FOUND"
          echo "Android Manifest: FOUND"
          echo "Gradle wrapper: FOUND"
          echo ""
          echo "ANDROID PROJECT CHECK: PASS"


      # =========================================================
      # 9. Prepare release signing
      # =========================================================
      - name: Prepare release signing
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$RKMS_KEYSTORE_BASE64"
          test -n "$RKMS_KEYSTORE_PASSWORD"
          test -n "$RKMS_KEY_ALIAS"
          test -n "$RKMS_KEY_PASSWORD"

          KEYSTORE="$RUNNER_TEMP/rkms-release.keystore"

          printf '%s' "$RKMS_KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE"

          test -s "$KEYSTORE"

          echo "RKMS_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

          echo "Release signing configuration: PASS"


      # =========================================================
      # 10. Build signed Release APK
      # =========================================================
      - name: Build signed Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          RKMS_KEYSTORE_PATH: ${{ env.RKMS_KEYSTORE_PATH }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew \
            clean \
            assembleRelease \
            --no-daemon \
            --stacktrace


      # =========================================================
      # 11. Find final APK
      # =========================================================
      - name: Locate Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/release"

          echo "Searching:"
          echo "$APK_DIR"

          APK="$(
            find "$APK_DIR" \
              -type f \
              -name '*.apk' \
              -print \
              -quit
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not found."
            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -print || true
            exit 1
          fi

          test -s "$APK"

          mkdir -p release

          cp "$APK" \
            release/RKMS-Connect-Release.apk

          echo ""
          echo "========================================"
          echo "FINAL APK"
          echo "========================================"

          ls -lh release/RKMS-Connect-Release.apk


      # =========================================================
      # 12. Final APK verification
      # =========================================================
      - name: Verify final APK
        shell: bash
        run: |
          set -euo pipefail

          APK="release/RKMS-Connect-Release.apk"

          test -f "$APK"
          test -s "$APK"

          SIZE="$(stat -c%s "$APK")"

          echo "APK size: $SIZE bytes"

          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: APK appears unexpectedly small."
            exit 1
          fi

          echo "FINAL APK CHECK: PASS"


      # =========================================================
      # 13. Upload APK artifact
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-Final-Release
          path: release/RKMS-Connect-Release.apk
          if-no-files-found: error

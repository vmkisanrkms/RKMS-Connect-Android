name: Build RKMS Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android native source
        uses: actions/checkout@v4
        with:
          ref: cf252628308e5a6ecc9eafbaf4ca227a3ad8ec92
          fetch-depth: 1

      - name: Checkout main repository files
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo-main
          fetch-depth: 1

      - name: Find and install Final Website ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for Final ZIP..."

          ZIP_FILE=$(find repo-main -type f -iname "*.zip" \
            ! -path "*/.git/*" \
            | sort \
            | tail -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP_FILE"

          rm -rf /tmp/rkms_web
          mkdir -p /tmp/rkms_web

          unzip -q "$ZIP_FILE" -d /tmp/rkms_web

          echo "Finding website root..."

          WEB_ROOT=$(find /tmp/rkms_web -type f -name "app.js" \
            -print -quit \
            | xargs -r dirname)

          if [ -z "$WEB_ROOT" ]; then
            echo "ERROR: app.js not found inside ZIP."
            exit 1
          fi

          echo "Website root:"
          echo "$WEB_ROOT"

          if [ ! -f "$WEB_ROOT/index.html" ]; then
            echo "ERROR: index.html not found."
            exit 1
          fi

          if [ ! -f "$WEB_ROOT/styles.css" ]; then
            echo "ERROR: styles.css not found."
            exit 1
          fi

          rm -rf app/src/main/assets/www
          mkdir -p app/src/main/assets/www

          # Copy COMPLETE website.
          cp -a "$WEB_ROOT"/. app/src/main/assets/www/

          echo "Website copied successfully."

      - name: Verify Book pages
        shell: bash
        run: |
          set -e

          BOOK_DIR="app/src/main/assets/www/assets/book"

          if [ ! -d "$BOOK_DIR" ]; then
            echo "ERROR: Book assets folder not found."
            exit 1
          fi

          PAGE_COUNT=$(find "$BOOK_DIR" -type f \
            \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" \) \
            | wc -l)

          echo "Book image files found: $PAGE_COUNT"

          if [ "$PAGE_COUNT" -lt 61 ]; then
            echo "ERROR: Book must contain cover + 60 pages."
            exit 1
          fi

          echo "Book assets verification PASS."

      - name: Verify website files
        shell: bash
        run: |
          set -e

          test -f app/src/main/assets/www/index.html
          test -f app/src/main/assets/www/app.js
          test -f app/src/main/assets/www/styles.css
          test -f app/src/main/assets/www/config.js

          echo "Website verification PASS."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Create Gradle wrapper
        shell: bash
        run: |
          set -e

          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi

          chmod +x gradlew

      - name: Build Release APK
        shell: bash
        run: |
          set -e

          ./gradlew clean assembleRelease --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "BUILD SUCCESS"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-Final-Release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

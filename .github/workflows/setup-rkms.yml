name: Build RKMS Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rkms-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build RKMS Release APK
    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # PREPARE ANDROID PROJECT
      # =========================================================

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "Android project found at repository root."
          else

            ZIP_FILE="$(
              find "$GITHUB_WORKSPACE" \
                -maxdepth 1 \
                -type f \
                -name 'RKMS_Connect_*.zip' \
                -print -quit
            )"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: RKMS Android project ZIP not found."
              exit 1
            fi

            echo "RKMS Android ZIP found:"
            echo "$ZIP_FILE"

            TMP_DIR="$RUNNER_TEMP/rkms-project"

            rm -rf "$TMP_DIR"
            mkdir -p "$TMP_DIR"

            unzip -q "$ZIP_FILE" -d "$TMP_DIR"

            PROJECT_DIR="$(
              find "$TMP_DIR" \
                -type f \
                \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
                -print -quit \
                | xargs -r dirname
            )"

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: Android project not found inside ZIP."
              exit 1
            fi

            rsync -a \
              --exclude='.github/' \
              "$PROJECT_DIR/" \
              "$GITHUB_WORKSPACE/"

            echo "Android project extracted successfully."
          fi


      # =========================================================
      # VERIFY ANDROID PROJECT
      # =========================================================

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -d app
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Android project structure: PASS"


      # =========================================================
      # FIX PRINT/PDF BRIDGE
      # =========================================================
      #
      # The previous source contained:
      #
      # MainActivity.this.printCurrentPage();
      #
      # but the actual final PDF implementation uses:
      #
      # saveCurrentPageAsPdf();
      #
      # Replace only the incorrect bridge call.
      # Do not create another wrapper method.
      #
      # =========================================================

      - name: Fix Print PDF bridge
        shell: bash
        run: |
          set -euo pipefail

          MAIN_ACTIVITY="$(
            find app/src/main/java \
              -type f \
              -name 'MainActivity.java' \
              -print -quit
          )"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.java not found."
            exit 1
          fi

          echo "MainActivity: $MAIN_ACTIVITY"

          # Final PDF method must exist.
          if ! grep -Eq \
            'void[[:space:]]+saveCurrentPageAsPdf[[:space:]]*\(' \
            "$MAIN_ACTIVITY"; then

            echo "ERROR: saveCurrentPageAsPdf() is missing."
            echo "Refusing to build incomplete source."
            exit 1
          fi

          # Replace the exact broken bridge call.
          python3 - "$MAIN_ACTIVITY" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          old = "MainActivity.this.printCurrentPage();"
          new = "MainActivity.this.saveCurrentPageAsPdf();"

          if old in text:
              text = text.replace(old, new)
              print("Broken printCurrentPage() bridge call replaced.")
          else:
              print("Broken bridge call not present; no replacement needed.")

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY

          # Make sure the broken call is gone.
          if grep -Fq \
            'MainActivity.this.printCurrentPage();' \
            "$MAIN_ACTIVITY"; then

            echo "ERROR: Broken printCurrentPage() call still exists."
            exit 1
          fi

          # Make sure the correct method exists.
          grep -Eq \
            'void[[:space:]]+saveCurrentPageAsPdf[[:space:]]*\(' \
            "$MAIN_ACTIVITY"

          echo "Print/PDF bridge fix: PASS"


      # =========================================================
      # VERIFY RKMS SOURCE
      # =========================================================

      - name: Verify RKMS source
        shell: bash
        run: |
          set -euo pipefail

          WWW="app/src/main/assets/www"
          BOOK_DIR="$WWW/assets/book"
          APP_JS="$WWW/app.js"

          test -f "$WWW/index.html"
          test -f "$WWW/app.js"
          test -f "$WWW/config.js"
          test -f "$WWW/styles.css"

          test -f "$BOOK_DIR/cover.jpg"

          for i in $(seq -w 1 60); do
            test -f "$BOOK_DIR/page-$i.jpg"
          done

          COUNT="$(
            find "$BOOK_DIR" \
              -maxdepth 1 \
              -type f \
              -name 'page-[0-9][0-9].jpg' \
              | wc -l \
              | tr -d ' '
          )"

          if [ "$COUNT" != "60" ]; then
            echo "ERROR: Expected 60 numbered book pages."
            echo "Found: $COUNT"
            exit 1
          fi

          node --check "$APP_JS"

          # No private/service credentials in app source.
          if grep -RInE \
            'SUPABASE_SERVICE_ROLE_KEY|service_role|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY' \
            app/src/main/assets \
            app/src/main/java \
            app/src/main/res \
            2>/dev/null; then

            echo "ERROR: Possible private/service credential found."
            exit 1
          fi

          # =====================================================
          # BOOK READER — FIVE VISIBLE BUTTONS
          # =====================================================

          grep -Fq 'id="bookFirst"' "$APP_JS"
          grep -Fq 'id="bookPrev"' "$APP_JS"
          grep -Fq 'id="bookNext"' "$APP_JS"
          grep -Fq 'id="bookLast"' "$APP_JS"
          grep -Fq 'id="bookDownloadPage"' "$APP_JS"

          # Pointer gestures.
          grep -Fq 'pointerdown' "$APP_JS"
          grep -Fq 'pointermove' "$APP_JS"
          grep -Fq 'pointerup' "$APP_JS"

          # Pinch zoom / pan.
          grep -Fq 'startDist' "$APP_JS"
          grep -Fq 'startScale' "$APP_JS"
          grep -Fq 'zoom.scale' "$APP_JS"
          grep -Fq 'zoom.x' "$APP_JS"
          grep -Fq 'zoom.y' "$APP_JS"
          grep -Fq 'clampPan' "$APP_JS"
          grep -Fq 'translate3d' "$APP_JS"

          # No visible zoom buttons.
          if grep -Eq \
            'id="(bookZoomIn|bookZoomOut|bookZoomReset|zoomIn|zoomOut|resetZoom)"' \
            "$APP_JS"; then

            echo "ERROR: Unwanted visible zoom button found."
            exit 1
          fi

          # =====================================================
          # RKMS LOADING UI
          # =====================================================

          grep -Fq 'rkms-loading' "$APP_JS"
          grep -Fq '.rkms-loading' "$WWW/styles.css"
          grep -Fq 'rkms-load-pulse' "$WWW/styles.css"
          grep -Fq 'rkms-load-sweep' "$WWW/styles.css"

          echo "RKMS source validation: PASS"


      # =========================================================
      # NODE.JS
      # =========================================================

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'


      # =========================================================
      # JAVA 17
      # =========================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # =========================================================
      # ANDROID SDK
      # =========================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'


      # =========================================================
      # GRADLE 8.10.2
      # =========================================================

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'


      # =========================================================
      # BUILD ENVIRONMENT
      # =========================================================

      - name: Show build environment
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version
          node --version

          echo "Build environment: PASS"


      # =========================================================
      # RELEASE SIGNING
      # =========================================================

      - name: Prepare release signing
        shell: bash
        run: |
          set -euo pipefail

          test -n "$RKMS_KEYSTORE_BASE64"
          test -n "$RKMS_KEY_ALIAS"
          test -n "$RKMS_KEYSTORE_PASSWORD"
          test -n "$RKMS_KEY_PASSWORD"

          KEYSTORE_PATH="$RUNNER_TEMP/rkms-release.keystore"

          echo "$RKMS_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          test -s "$KEYSTORE_PATH"

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          mkdir -p "$HOME/.gradle/init.d"

          cat > "$HOME/.gradle/init.d/rkms-signing.gradle" <<'EOF'
          allprojects { project ->

              project.pluginManager.withPlugin("com.android.application") {

                  def android = project.extensions.getByName("android")

                  def releaseConfig =
                      android.signingConfigs.findByName("release")

                  if (releaseConfig == null) {
                      releaseConfig =
                          android.signingConfigs.create("release")
                  }

                  releaseConfig.storeFile =
                      new File(System.getenv("KEYSTORE_PATH"))

                  releaseConfig.storePassword =
                      System.getenv("RKMS_KEYSTORE_PASSWORD")

                  releaseConfig.keyAlias =
                      System.getenv("RKMS_KEY_ALIAS")

                  releaseConfig.keyPassword =
                      System.getenv("RKMS_KEY_PASSWORD")

                  println("RKMS release signing configuration applied.")
              }
          }
          EOF

          echo "Release signing prepared."


      # =========================================================
      # VALIDATE GRADLE
      # =========================================================

      - name: Validate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon tasks

          echo "Gradle validation: PASS"


      # =========================================================
      # CLEAN
      # =========================================================

      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon clean

          echo "Clean: PASS"


      # =========================================================
      # BUILD RELEASE APK
      # =========================================================

      - name: Build RKMS Release APK
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            assembleRelease

          echo "========================================"
          echo "RKMS RELEASE APK BUILD: PASS"
          echo "========================================"


      # =========================================================
      # FIND APK
      # =========================================================

      - name: Find release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find app/build/outputs/apk/release \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print -quit
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."
            exit 1
          fi

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK file does not exist."
            exit 1
          fi

          cp "$APK" "$RUNNER_TEMP/RKMS-Connect-Release.apk"

          echo "Release APK found:"
          ls -lh "$RUNNER_TEMP/RKMS-Connect-Release.apk"


      # =========================================================
      # VERIFY SIGNATURE
      # =========================================================

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            "$RUNNER_TEMP/RKMS-Connect-Release.apk"

          echo "========================================"
          echo "APK SIGNATURE VERIFICATION: PASS"
          echo "========================================"


      # =========================================================
      # UPLOAD RELEASE APK
      # =========================================================

      - name: Upload RKMS Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Release-APK
          path: ${{ runner.temp }}/RKMS-Connect-Release.apk
          if-no-files-found: error
          retention-days: 14


      # =========================================================
      # CLEANUP
      # =========================================================

      - name: Cleanup signing files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/rkms-release.keystore"
          rm -f "$HOME/.gradle/init.d/rkms-signing.gradle"

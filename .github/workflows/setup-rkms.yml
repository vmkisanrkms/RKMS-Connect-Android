name: RKMS Android 16 API 36 - Final Release APK Only

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  AGP_VERSION: "8.9.1"
  GRADLE_VERSION: "8.11.1"
  APP_ID: "org.rkms.connect"
  APK_NAME: "RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"

jobs:
  build:
    name: Build Final Release APK Only
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. LOCATE RKMS SOURCE ZIP
      # ============================================================
      - name: Locate RKMS source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP=""

          for candidate in \
            "RKMS_CONNECT_FINAL_BUILD_V6_ALL_FIXES_GPM_APK_ONLY.zip" \
            "RKMS_CONNECT_FINAL_BUILD_V5_ALL_FIXES_FINAL.zip" \
            "RKMS_CONNECT_FINAL_BUILD_V4_GOOGLE_PASSWORD_MANAGER_ONLY.zip" \
            "RKMS_CONNECT_FINAL_BUILD_V4_FIXED_CHAT_NIYUKTI_MIC_PDF.zip"
          do
            if [ -f "$candidate" ]; then
              ZIP="$candidate"
              break
            fi
          done

          if [ -z "$ZIP" ]; then
            ZIP="$(find . -maxdepth 3 -type f \
              -iname '*.zip' \
              -print \
              | grep -E 'RKMS|rkms' \
              | head -n 1 || true)"
          fi

          if [ -z "$ZIP" ]; then
            echo "::error::RKMS source ZIP not found."
            find . -maxdepth 3 -type f | sort | head -300
            exit 1
          fi

          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "SOURCE ZIP"
          echo "$ZIP"
          echo "=========================================="

      # ============================================================
      # 3. EXTRACT SOURCE
      # ============================================================
      - name: Extract RKMS source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build-project
          mkdir -p build-project

          unzip -q "$SOURCE_ZIP" -d build-project

          echo "Extracted source:"
          find build-project -maxdepth 3 -type f \
            | sort \
            | head -300

      # ============================================================
      # 4. DETECT SOURCE ROOT
      # ============================================================
      - name: Detect RKMS source root
        shell: bash
        run: |
          set -euo pipefail

          ROOT=""

          if [ -f build-project/package.json ]; then
            ROOT="build-project"
          else
            ROOT="$(find build-project \
              -type f \
              -name package.json \
              -not -path '*/node_modules/*' \
              -print -quit \
              | xargs -r dirname)"
          fi

          if [ -z "$ROOT" ] || [ ! -f "$ROOT/package.json" ]; then
            echo "::error::package.json not found."
            find build-project -name package.json -print
            exit 1
          fi

          echo "RKMS_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "RKMS_ROOT=$ROOT"

      # ============================================================
      # 5. BASIC SOURCE CHECK
      # ============================================================
      - name: Validate RKMS source
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          REQUIRED_FILES=(
            "package.json"
            "app.js"
            "capacitor.config.json"
            "google-services.json"
            "scripts/setup-android-native.sh"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing required file: $file"
              exit 1
            fi
          done

          echo "All required RKMS source files found."

      # ============================================================
      # 6. VERIFY CAPACITOR
      # ============================================================
      - name: Verify Capacitor versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node <<'NODE'
          const fs = require("fs");

          const p = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const all = {
            ...(p.dependencies || {}),
            ...(p.devDependencies || {})
          };

          const required = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          for (const [name, version] of Object.entries(required)) {
            if (!all[name]) {
              throw new Error(`Missing dependency: ${name}`);
            }

            console.log(`${name}: ${all[name]}`);
          }

          console.log("Capacitor verification passed.");
          NODE

      # ============================================================
      # 7. NODE 22
      # ============================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.RKMS_ROOT }}/package-lock.json

      # ============================================================
      # 8. NPM INSTALL
      # ============================================================
      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      # ============================================================
      # 9. BUILD WEB
      # ============================================================
      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          if node -e '
            const p=require("./package.json");
            process.exit(
              p.scripts && p.scripts.build ? 0 : 1
            );
          '; then
            npm run build
          else
            echo "No npm build script found."
            echo "Using existing web source."
          fi

      # ============================================================
      # 10. VERIFY GOOGLE PASSWORD MANAGER SOURCE
      # ============================================================
      - name: Verify Credential Manager source
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          echo "Checking Credential Manager..."

          grep -Fq \
            'autocomplete="current-password"' \
            app.js \
            || {
              echo "::error::current-password autocomplete missing."
              exit 1
            }

          if ! grep -Fq \
            'RKMSNative?.savePassword' \
            app.js; then

            grep -Fq \
              'RKMSNative.savePassword' \
              app.js \
              || {
                echo "::error::savePassword bridge missing."
                exit 1
              }
          fi

          grep -Fq \
            'CredentialManager' \
            scripts/setup-android-native.sh \
            || {
              echo "::error::CredentialManager missing."
              exit 1
            }

          grep -Fq \
            'CreatePasswordRequest' \
            scripts/setup-android-native.sh \
            || {
              echo "::error::CreatePasswordRequest missing."
              exit 1
            }

          grep -Fq \
            'createCredentialAsync' \
            scripts/setup-android-native.sh \
            || {
              echo "::error::createCredentialAsync missing."
              exit 1
            }

          echo "Credential Manager source check passed."

      # ============================================================
      # 11. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 12. ANDROID SDK
      #
      # IMPORTANT:
      # DO NOT REQUEST "tools".
      # Google no longer serves the old tools package.
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: "true"
          log-accepted-android-sdk-licenses: "false"

      # ============================================================
      # 13. VERIFY SDKMANAGER
      # ============================================================
      - name: Verify Android SDK manager
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

          command -v sdkmanager

          sdkmanager --version

          echo "SDK manager is available."

      # ============================================================
      # 14. INSTALL API 36 + BUILD TOOLS 36.0.0
      # ============================================================
      - name: Install Android API 36 and Build Tools 36
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "Installed Android packages:"
          sdkmanager --list_installed \
            | grep -E \
              'platform-tools|platforms;android-36|build-tools;36.0.0' \
            || true

      # ============================================================
      # 15. VERIFY SDK 36
      # ============================================================
      - name: Verify Android API 36
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          test -d "$SDK/platforms/android-36"
          test -d "$SDK/build-tools/36.0.0"
          test -x "$SDK/build-tools/36.0.0/aapt"
          test -x "$SDK/build-tools/36.0.0/apksigner"

          echo "Android API 36 verified."
          echo "Build Tools 36.0.0 verified."

      # ============================================================
      # 16. CREATE CAPACITOR ANDROID PROJECT
      # ============================================================
      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          rm -rf android

          npx cap add android

      # ============================================================
      # 17. FORCE COMPILE/TARGET SDK 36
      # ============================================================
      - name: Configure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          python3 <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("variables.gradle"),
              Path("app/build.gradle"),
          ]

          for p in files:
              if not p.exists():
                  continue

              s = p.read_text(encoding="utf-8")

              s = re.sub(
                  r'compileSdkVersion\s*=\s*\d+',
                  'compileSdkVersion = 36',
                  s
              )

              s = re.sub(
                  r'targetSdkVersion\s*=\s*\d+',
                  'targetSdkVersion = 36',
                  s
              )

              s = re.sub(
                  r'compileSdk\s*=\s*\d+',
                  'compileSdk = 36',
                  s
              )

              s = re.sub(
                  r'targetSdk\s*=\s*\d+',
                  'targetSdk = 36',
                  s
              )

              if p.name == "app/build.gradle":
                  if "buildToolsVersion" in s:
                      s = re.sub(
                          r'buildToolsVersion\s+[\'"][^\'"]+[\'"]',
                          'buildToolsVersion "36.0.0"',
                          s
                      )
                  else:
                      s = s.replace(
                          "android {",
                          'android {\n    buildToolsVersion "36.0.0"',
                          1
                      )

              p.write_text(s, encoding="utf-8")

          print("Android API 36 configuration applied.")
          PY

      # ============================================================
      # 18. FORCE AGP 8.9.1
      # ============================================================
      - name: Configure Android Gradle Plugin 8.9.1
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          python3 <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("build.gradle"),
              Path("settings.gradle"),
              Path("settings.gradle.kts"),
          ]

          found = False

          for p in candidates:
              if not p.exists():
                  continue

              s = p.read_text(encoding="utf-8")

              patterns = [
                  (
                    r'(id\s*\(\s*["\']com\.android\.application["\']\s*\)\s*version\s*["\'])[^"\']+(["\'])',
                    r'\g<1>8.9.1\g<2>'
                  ),
                  (
                    r'(id\s+["\']com\.android\.application["\']\s+version\s+["\'])[^"\']+(["\'])',
                    r'\g<1>8.9.1\g<2>'
                  ),
                  (
                    r'(classpath\s+["\']com\.android\.tools\.build:gradle:)[^"\']+',
                    r'\g<1>8.9.1'
                  ),
              ]

              for pattern, replacement in patterns:
                  s2, n = re.subn(
                      pattern,
                      replacement,
                      s
                  )

                  if n:
                      found = True
                      s = s2

              p.write_text(s, encoding="utf-8")

          print("AGP replacement found:", found)
          PY

      # ============================================================
      # 19. GRADLE 8.11.1
      # ============================================================
      - name: Configure Gradle 8.11.1
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          mkdir -p gradle/wrapper

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "gradle/wrapper/gradle-wrapper.properties"
          )

          if p.exists():
              lines = p.read_text(
                  encoding="utf-8"
              ).splitlines()
          else:
              lines = []

          new_url = (
              "distributionUrl="
              "https\\://services.gradle.org/distributions/"
              "gradle-8.11.1-all.zip"
          )

          replaced = False

          for i, line in enumerate(lines):
              if line.startswith("distributionUrl="):
                  lines[i] = new_url
                  replaced = True

          if not replaced:
              lines.append(new_url)

          p.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )
          PY

          chmod +x gradlew

          ./gradlew --version

      # ============================================================
      # 20. CAPACITOR SYNC
      # ============================================================
      - name: Capacitor sync Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npx cap sync android

      # ============================================================
      # 21. CREDENTIAL MANAGER DEPENDENCIES
      # ============================================================
      - name: Configure Credential Manager dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          APP_GRADLE="app/build.gradle"

          test -f "$APP_GRADLE"

          python3 <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text(encoding="utf-8")

          deps = [
              'implementation "androidx.credentials:credentials:1.5.0"',
              'implementation "androidx.credentials:credentials-play-services-auth:1.5.0"',
          ]

          marker = "dependencies {"

          if marker not in s:
              raise SystemExit(
                  "dependencies block not found"
              )

          for dep in deps:
              if dep not in s:
                  s = s.replace(
                      marker,
                      marker + "\n    " + dep,
                      1
                  )

          p.write_text(
              s,
              encoding="utf-8"
          )
          PY

          echo "Credential Manager dependencies configured."

      # ============================================================
      # 22. NATIVE SETUP
      # ============================================================
      - name: Configure RKMS native Android bridge
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x scripts/setup-android-native.sh

          ./scripts/setup-android-native.sh

      # ============================================================
      # 23. FIX CREDENTIAL MANAGER ARGUMENT ORDER
      # ============================================================
      - name: Fix Credential Manager createCredentialAsync signature
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 <<'PY'
          from pathlib import Path
          import re

          setup = Path(
              "scripts/setup-android-native.sh"
          )

          s = setup.read_text(
              encoding="utf-8"
          )

          # Wrong:
          #
          # createCredentialAsync(
          #     req,
          #     cancellationSignal,
          #     executor,
          #     callback
          # )
          #
          # Correct:
          #
          # createCredentialAsync(
          #     activity,
          #     req,
          #     cancellationSignal,
          #     executor,
          #     callback
          # )

          pattern = re.compile(
              r'createCredentialAsync\s*\(\s*'
              r'req\s*,',
              re.MULTILINE
          )

          s, count = pattern.subn(
              'createCredentialAsync(\n'
              '                            activity,\n'
              '                            req,',
              s
          )

          setup.write_text(
              s,
              encoding="utf-8"
          )

          print(
              "Source fixes:",
              count
          )

          # Patch generated bridge too.
          java_files = list(
              Path(
                  "android/app/src/main/java"
              ).rglob(
                  "RKMSNativeBridge.java"
              )
          )

          for p in java_files:
              text = p.read_text(
                  encoding="utf-8"
              )

              text, n = pattern.subn(
                  'createCredentialAsync(\n'
                  '                            activity,\n'
                  '                            req,',
                  text
              )

              if n:
                  print(
                      f"Patched {p}: {n}"
                  )

              p.write_text(
                  text,
                  encoding="utf-8"
              )
          PY

      # ============================================================
      # 24. VERIFY GENERATED NATIVE BRIDGE
      # ============================================================
      - name: Verify Credential Manager native bridge
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          BRIDGE="$(find \
            android/app/src/main/java \
            -type f \
            -name 'RKMSNativeBridge.java' \
            -print \
            | head -n 1)"

          if [ -z "$BRIDGE" ]; then
            echo "::error::RKMSNativeBridge.java not found."
            find android/app/src/main/java \
              -type f \
              | sort \
              | head -300
            exit 1
          fi

          echo "Bridge:"
          echo "$BRIDGE"

          grep -n -A12 -B4 \
            "createCredentialAsync" \
            "$BRIDGE" || true

          python3 - "$BRIDGE" <<'PY'
          from pathlib import Path
          import re
          import sys

          p = Path(sys.argv[1])

          s = p.read_text(
              encoding="utf-8"
          )

          required = [
              "CredentialManager",
              "CreatePasswordRequest",
              "createCredentialAsync",
              "savePassword",
          ]

          for item in required:
              if item not in s:
                  raise SystemExit(
                      f"Missing native marker: {item}"
                  )

          correct = re.search(
              r'createCredentialAsync\s*\(\s*'
              r'activity\s*,\s*'
              r'req\s*,',
              s,
              re.S
          )

          if not correct:
              raise SystemExit(
                  "Wrong Credential Manager argument order."
              )

          wrong = re.search(
              r'createCredentialAsync\s*\(\s*'
              r'req\s*,',
              s,
              re.S
          )

          if wrong:
              raise SystemExit(
                  "Old incorrect createCredentialAsync(req,...) "
                  "signature still exists."
              )

          print(
              "PASS: createCredentialAsync(activity, req, ...)"
          )
          PY

      # ============================================================
      # 25. VERIFY OLD CUSTOM PASSWORD VAULT IS NOT USED
      # ============================================================
      - name: Verify obsolete credential plugin removed
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          if grep -nE \
            'RKMSSecureCredentialsPlugin|@CapacitorPlugin\(name *= *"RKMSSecureCredentials"\)' \
            scripts/setup-android-native.sh; then

            echo "::error::Old custom credential plugin is still present."
            exit 1
          fi

          echo "Old custom credential plugin not found."

      # ============================================================
      # 26. MICROPHONE + FILE PICKER
      # ============================================================
      - name: Verify microphone and file picker
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          grep -Fq \
            "RECORD_AUDIO" \
            scripts/setup-android-native.sh \
            || {
              echo "::error::RECORD_AUDIO missing."
              exit 1
            }

          grep -Fq \
            "RESOURCE_AUDIO_CAPTURE" \
            scripts/setup-android-native.sh \
            || {
              echo "::error::WebView audio permission missing."
              exit 1
            }

          grep -Fq \
            "onShowFileChooser" \
            scripts/setup-android-native.sh \
            || {
              echo "::error::File picker bridge missing."
              exit 1
            }

          grep -Fq \
            "MediaRecorder" \
            app.js \
            || {
              echo "::error::MediaRecorder missing."
              exit 1
            }

          echo "Microphone + file picker verification passed."

      # ============================================================
      # 27. KEYBOARD
      # ============================================================
      - name: Verify keyboard resize
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          grep -Fq \
            "SOFT_INPUT_ADJUST_RESIZE" \
            scripts/setup-android-native.sh \
            || {
              echo "::error::SOFT_INPUT_ADJUST_RESIZE missing."
              exit 1
            }

          echo "Native keyboard resize verified."

      # ============================================================
      # 28. FIREBASE
      # ============================================================
      - name: Verify Firebase
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          test -f google-services.json

          grep -Fq \
            "FirebaseApp.initializeApp" \
            scripts/setup-android-native.sh \
            || {
              echo "::error::FirebaseApp.initializeApp missing."
              exit 1
            }

          echo "Firebase verification passed."

      # ============================================================
      # 29. APPLICATION ID
      # ============================================================
      - name: Verify application ID
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          grep -Rqs \
            "org.rkms.connect" \
            app/build.gradle \
            app/src/main/AndroidManifest.xml \
            || {
              echo "::error::org.rkms.connect not found."
              exit 1
            }

          echo "Application ID verified."

      # ============================================================
      # 30. GRADLE CLEAN
      # ============================================================
      - name: Clean Android build
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          ./gradlew clean --no-daemon

      # ============================================================
      # 31. BUILD RELEASE APK ONLY
      # ============================================================
      - name: Build Final Release APK Only
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          echo "=============================================="
          echo "RKMS FINAL RELEASE BUILD"
          echo "=============================================="
          echo "Android API      : ${ANDROID_API}"
          echo "Build Tools      : ${BUILD_TOOLS}"
          echo "Java             : ${JAVA_VERSION}"
          echo "Gradle           : ${GRADLE_VERSION}"
          echo "AGP              : ${AGP_VERSION}"
          echo "Application ID   : ${APP_ID}"
          echo "APK ONLY         : YES"
          echo "AAB              : NO"
          echo "=============================================="

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 32. FIND APK
      # ============================================================
      - name: Locate release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          APK="$(find \
            app/build/outputs/apk/release \
            -type f \
            -name '*.apk' \
            ! -iname '*debug*' \
            -print \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "::error::Release APK not generated."

            find app/build/outputs \
              -type f \
              -print \
              2>/dev/null || true

            exit 1
          fi

          cp "$APK" \
            "$GITHUB_WORKSPACE/${APK_NAME}"

          echo "APK_PATH=$GITHUB_WORKSPACE/${APK_NAME}" \
            >> "$GITHUB_ENV"

          ls -lh \
            "$GITHUB_WORKSPACE/${APK_NAME}"

      # ============================================================
      # 33. APK BADGING
      # ============================================================
      - name: Verify APK package and target SDK
        shell: bash
        run: |
          set -euo pipefail

          APK="$APK_PATH"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt" \
            dump badging "$APK" \
            > "$GITHUB_WORKSPACE/apk-badging.txt"

          cat "$GITHUB_WORKSPACE/apk-badging.txt"

          grep -Fq \
            "package: name='${APP_ID}'" \
            "$GITHUB_WORKSPACE/apk-badging.txt" \
            || {
              echo "::error::Wrong application ID."
              exit 1
            }

          grep -Fq \
            "targetSdkVersion:'36'" \
            "$GITHUB_WORKSPACE/apk-badging.txt" \
            || {
              echo "::error::Target SDK 36 not found."
              exit 1
            }

          echo "APK package and target SDK verified."

      # ============================================================
      # 34. APK SIGNATURE
      # ============================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="$APK_PATH"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" \
            verify \
            --verbose \
            "$APK"

          echo "APK signature verification passed."

      # ============================================================
      # 35. SHA256
      # ============================================================
      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          sha256sum \
            "$APK_NAME" \
            | tee "${APK_NAME}.sha256"

      # ============================================================
      # 36. FINAL APK-ONLY AUDIT
      # ============================================================
      - name: Final APK-only audit
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          echo "=============================================="
          echo "FINAL ARTIFACT AUDIT"
          echo "=============================================="

          find . \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*.apk' \
              -o -name '*.aab' \
              -o -name '*.sha256' \
            \) \
            -printf '%f\n' \
            | sort

          if find . \
            -maxdepth 1 \
            -type f \
            -name '*.aab' \
            | grep -q .; then

            echo "::error::AAB found."
            exit 1
          fi

          if find . \
            -maxdepth 1 \
            -type f \
            -iname '*debug*.apk' \
            | grep -q .; then

            echo "::error::Debug APK found."
            exit 1
          fi

          test -f "$APK_NAME"
          test -f "${APK_NAME}.sha256"

          echo "=============================================="
          echo "FINAL AUDIT PASSED"
          echo "=============================================="
          echo "APK : $APK_NAME"
          echo "AAB : NONE"
          echo "DEBUG APK : NONE"
          echo "API : 36"
          echo "TARGET : 36"
          echo "PACKAGE : ${APP_ID}"
          echo "=============================================="

      # ============================================================
      # 37. UPLOAD ONLY APK + SHA256
      # ============================================================
      - name: Upload final APK and SHA256
        uses: actions/upload-artifact@v4
        with:
          name: RKMS_ANDROID16_API36_RELEASE_APK
          if-no-files-found: error
          path: |
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256
          retention-days: 30

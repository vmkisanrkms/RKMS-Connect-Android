name: Build RKMS Connect APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RKMS Connect
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Verify RKMS Android project
        shell: bash
        run: |
          set -e

          echo "===== RKMS PROJECT CHECK ====="

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/google-services.json
          test -d app/src/main
          test -d app/src/main/java
          test -d app/src/main/res
          test -d app/src/main/assets/www

          echo "settings.gradle       OK"
          echo "build.gradle          OK"
          echo "app/build.gradle      OK"
          echo "google-services.json  OK"
          echo "Java source           OK"
          echo "Resources             OK"
          echo "RKMS website          OK"

      - name: Show Gradle environment
        shell: bash
        run: |
          set -e
          echo "===== GRADLE VERSION ====="
          gradle --version

      - name: Validate Gradle project
        shell: bash
        run: |
          set -e
          gradle tasks --no-daemon

      - name: Clean project
        shell: bash
        run: |
          set -e
          gradle clean --no-daemon

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify generated APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Debug APK was not generated."
            echo "Searching for APK files:"
            find . -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK FOUND:"
          ls -lh "$APK"

      - name: Upload RKMS Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

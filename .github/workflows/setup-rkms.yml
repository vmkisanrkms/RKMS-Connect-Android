name: RKMS Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify RKMS source
        run: |
          set -e

          if [ -f app.js ] && [ -f index.html ] && [ -f config.js ]; then
            echo "Using direct RKMS source files"

          elif [ -f RKMS_CONNECT_APK_BUILD_READY.zip ]; then
            echo "Using RKMS source ZIP"
            unzip -t RKMS_CONNECT_APK_BUILD_READY.zip >/dev/null

          else
            ZIP_FILE=$(find . -maxdepth 1 -type f -name 'RKMS*.zip' | head -n 1)

            if [ -n "$ZIP_FILE" ]; then
              echo "Using source ZIP: $ZIP_FILE"
              unzip -t "$ZIP_FILE" >/dev/null
            else
              echo "ERROR: RKMS source not found"
              find . -maxdepth 2 -type f | sort
              exit 1
            fi
          fi

      - name: Prepare RKMS source
        run: |
          set -e

          rm -rf build
          mkdir -p build

          if [ -f app.js ] && [ -f index.html ] && [ -f config.js ]; then
            rsync -a \
              --exclude='.git' \
              --exclude='.github' \
              --exclude='build' \
              --exclude='android' \
              --exclude='node_modules' \
              --exclude='*.zip' \
              ./ build/

          elif [ -f RKMS_CONNECT_APK_BUILD_READY.zip ]; then
            unzip -q RKMS_CONNECT_APK_BUILD_READY.zip -d build

          else
            ZIP_FILE=$(find . -maxdepth 1 -type f -name 'RKMS*.zip' | head -n 1)
            unzip -q "$ZIP_FILE" -d build
          fi

          if [ ! -f build/app.js ]; then
            APP_JS=$(find build -type f -name app.js | head -n 1)

            if [ -n "$APP_JS" ]; then
              SOURCE_DIR=$(dirname "$APP_JS")
              mkdir -p build-source
              rsync -a "$SOURCE_DIR"/ build-source/
              rm -rf build
              mv build-source build
            fi
          fi

          test -f build/app.js
          test -f build/index.html
          test -f build/config.js

          echo "RKMS source verified"

      - name: Verify JavaScript
        run: |
          node --check build/app.js
          echo "app.js syntax verified"

      - name: Create Capacitor package
        working-directory: build
        run: |
          cat > package.json <<'EOF'
          {
            "name": "rkms",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "rm -rf dist && mkdir -p dist && rsync -a --exclude='dist' --exclude='android' --exclude='node_modules' --exclude='.git' --exclude='.github' --exclude='*.zip' ./ dist/"
            },
            "dependencies": {
              "@capacitor/core": "6.2.2",
              "@capacitor/android": "6.2.2",
              "@capacitor/app": "6.0.1"
            },
            "devDependencies": {
              "@capacitor/cli": "6.2.2"
            }
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "org.rkms.connect",
            "appName": "RKMS",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https",
              "cleartext": true
            },
            "android": {
              "allowMixedContent": true,
              "captureInput": true,
              "webContentsDebuggingEnabled": false
            }
          }
          EOF

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: build
        run: npm install --no-audit --no-fund

      - name: Build RKMS web application
        working-directory: build
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android platform
        working-directory: build
        run: npx cap add android

      - name: Sync RKMS application
        working-directory: build
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x build/android/gradlew

      - name: Build Debug APK
        working-directory: build/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          set -e
          APK="build/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          echo "RKMS APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-debug-apk
          path: build/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

name: RKMS Android 16 API 36 - APK + AAB

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    name: RKMS Android 16 / API 36
    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. FIND AND EXTRACT RKMS SOURCE
      # ==========================================================

      - name: Extract RKMS source package
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE="RKMS_CONNECT_V18_ANDROID16_API36_AAB_FINAL_READY.zip"

          echo "Checking source package..."

          if [ ! -f "$PACKAGE" ]; then
            echo "ERROR: Source package not found:"
            echo "$PACKAGE"
            echo
            echo "Repository contents:"
            find . -maxdepth 2 -type f -print
            exit 1
          fi

          echo "Source package found:"
          ls -lh "$PACKAGE"

          rm -rf .rkms_extract
          mkdir -p .rkms_extract

          unzip -q "$PACKAGE" -d .rkms_extract

          echo
          echo "Extracted package:"
          find .rkms_extract -maxdepth 2 -type f | head -50

          SOURCE_DIR=".rkms_extract/rkms_android"

          if [ ! -d "$SOURCE_DIR" ]; then
            echo "ERROR: rkms_android directory not found."
            find .rkms_extract -maxdepth 3 -print
            exit 1
          fi

          echo
          echo "Copying RKMS source to repository root..."

          cp -a "$SOURCE_DIR"/. .

          rm -rf .rkms_extract

          echo
          echo "Checking project files..."

          test -f package.json
          test -f capacitor.config.json
          test -f index.html
          test -f app.js
          test -f styles.css
          test -f google-services.json

          echo
          echo "RKMS project root verified."

      # ==========================================================
      # 3. NODE 22
      # ==========================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Node.js
        run: |
          node --version
          npm --version
          test -f package.json

      # ==========================================================
      # 4. INSTALL NPM
      # ==========================================================

      - name: Install npm dependencies
        run: |
          npm install --no-audit --no-fund

      # ==========================================================
      # 5. JAVA 17
      # ==========================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify JDK
        run: |
          java -version
          javac -version

      # ==========================================================
      # 6. ANDROID SDK
      # ==========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android 16 API 36
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify Android 16 SDK
        shell: bash
        run: |
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

          echo "Android Platform 36: OK"
          echo "Build Tools 36.0.0: OK"

      # ==========================================================
      # 7. CAPACITOR DEPENDENCIES
      # ==========================================================

      - name: Verify Capacitor
        run: |
          npm ls @capacitor/core --depth=0
          npm ls @capacitor/android --depth=0
          npm ls @capacitor/app --depth=0
          npm ls @capacitor/push-notifications --depth=0

      # ==========================================================
      # 8. WEB BUILD
      # ==========================================================

      - name: Build web application
        run: |
          npm run build

      - name: Verify web build
        run: |
          test -d dist
          test -f dist/index.html

          echo "Web build PASS."

      # ==========================================================
      # 9. CREATE ANDROID PROJECT
      # ==========================================================

      - name: Add Capacitor Android platform
        run: |
          npx cap add android

      - name: Verify generated Android project
        run: |
          test -d android
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle
          test -f android/gradlew

          echo "Android project generated successfully."

      # ==========================================================
      # 10. FIREBASE
      # ==========================================================

      - name: Install Firebase configuration
        run: |
          mkdir -p android/app

          test -f google-services.json

          cp google-services.json \
             android/app/google-services.json

          test -f android/app/google-services.json

          echo "Firebase configuration PASS."

      # ==========================================================
      # 11. ANDROID 16 CONFIGURATION
      # ==========================================================

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          chmod +x scripts/configure-android-16.sh
          bash scripts/configure-android-16.sh

      # ==========================================================
      # 12. CAPACITOR SYNC
      # ==========================================================

      - name: Capacitor sync Android
        run: |
          npx cap sync android

      # ==========================================================
      # 13. RKMS NATIVE BRIDGE
      # ==========================================================

      - name: Setup RKMS native Android bridge
        shell: bash
        run: |
          chmod +x scripts/setup-android-native.sh
          bash scripts/setup-android-native.sh

      # ==========================================================
      # 14. VERIFY ANDROID 16
      # ==========================================================

      - name: Verify Android 16 API 36
        run: |
          python3 scripts/verify-android-16.py

      # ==========================================================
      # 15. VERIFY NATIVE PDF
      # ==========================================================

      - name: Verify Android PDF pipeline
        run: |
          python3 scripts/verify-android-pdf.py

      # ==========================================================
      # 16. VERIFY NATIVE BRIDGE
      # ==========================================================

      - name: Verify native bridge
        run: |
          python3 scripts/verify-native-bridge.py

      # ==========================================================
      # 17. VERIFY FCM
      # ==========================================================

      - name: Verify FCM pipeline
        run: |
          python3 scripts/verify-fcm-pipeline.py

      # ==========================================================
      # 18. VERIFY SAVED LOGIN
      # ==========================================================

      - name: Verify saved login
        run: |
          python3 scripts/verify-saved-login.py

      # ==========================================================
      # 19. VERIFY CORE RKMS FLOW
      # ==========================================================

      - name: Verify final RKMS application
        run: |
          python3 scripts/verify-rkms-final.py

      # ==========================================================
      # 20. RELEASE SIGNING
      #
      # Do NOT use:
      # if: secrets.X != ''
      #
      # Secrets are available through job env.
      # ==========================================================

      - name: Check release signing configuration
        id: signing
        shell: bash
        run: |
          if [ -n "${RKMS_KEYSTORE_BASE64:-}" ] && \
             [ -n "${RKMS_KEYSTORE_PASSWORD:-}" ] && \
             [ -n "${RKMS_KEY_ALIAS:-}" ] && \
             [ -n "${RKMS_KEY_PASSWORD:-}" ]; then

            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Complete release signing configuration detected."

          else

            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured."

          fi

      # ==========================================================
      # 21. PREPARE KEYSTORE
      # ==========================================================

      - name: Prepare release keystore
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$RKMS_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/release.keystore

          chmod 600 android/app/release.keystore

          test -s android/app/release.keystore

          echo "Release keystore prepared."

      # ==========================================================
      # 22. CONFIGURE SIGNING
      # ==========================================================

      - name: Configure release signing
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          # Remove an accidentally pre-existing RKMS signing block
          # so this workflow remains idempotent.
          start_marker = "// RKMS WORKFLOW RELEASE SIGNING START"
          end_marker = "// RKMS WORKFLOW RELEASE SIGNING END"

          if start_marker in text and end_marker in text:
              start = text.index(start_marker)
              end = text.index(end_marker) + len(end_marker)
              text = text[:start] + text[end:]

          signing_block = r'''
          // RKMS WORKFLOW RELEASE SIGNING START
          android {
              signingConfigs {
                  rkmsProduction {
                      storeFile file("release.keystore")
                      storePassword System.getenv("RKMS_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("RKMS_KEY_ALIAS")
                      keyPassword System.getenv("RKMS_KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.rkmsProduction
                  }
              }
          }
          // RKMS WORKFLOW RELEASE SIGNING END
          '''

          text += "\n" + signing_block + "\n"

          path.write_text(text)

          print("RKMS release signing configured.")
          PY

          grep -n "rkmsProduction" android/app/build.gradle

      # ==========================================================
      # 23. ENSURE RELEASE SIGNING
      #
      # If no RKMS keystore is configured, explicitly remove
      # any invalid release signing configuration.
      # This prevents "storePassword missing" errors.
      # ==========================================================

      - name: Prepare unsigned release when signing is unavailable
        if: steps.signing.outputs.enabled != 'true'
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          start_marker = "// RKMS WORKFLOW RELEASE SIGNING START"
          end_marker = "// RKMS WORKFLOW RELEASE SIGNING END"

          if start_marker in text and end_marker in text:
              start = text.index(start_marker)
              end = text.index(end_marker) + len(end_marker)
              text = text[:start] + text[end:]

          # Remove only explicit signingConfig assignments from
          # release buildType if they refer to missing RKMS signing.
          text = text.replace(
              "signingConfig signingConfigs.rkmsProduction",
              ""
          )

          path.write_text(text)

          print("Unsigned release configuration prepared.")
          PY

      # ==========================================================
      # 24. GRADLE
      # ==========================================================

      - name: Verify Gradle environment
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version

      # ==========================================================
      # 25. CLEAN
      # ==========================================================

      - name: Clean Android build
        working-directory: android
        run: |
          ./gradlew clean --no-daemon

      # ==========================================================
      # 26. BUILD DEBUG APK
      # ==========================================================

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # ==========================================================
      # 27. BUILD RELEASE APK
      # ==========================================================

      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

      # ==========================================================
      # 28. BUILD RELEASE AAB
      # ==========================================================

      - name: Build Release AAB
        working-directory: android
        run: |
          ./gradlew bundleRelease \
            --no-daemon \
            --stacktrace

      # ==========================================================
      # 29. VERIFY DEBUG APK
      # ==========================================================

      - name: Verify Debug APK
        shell: bash
        run: |
          set -e

          FILE="android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$FILE"

          echo "Debug APK:"
          ls -lh "$FILE"

      # ==========================================================
      # 30. VERIFY RELEASE APK
      # ==========================================================

      - name: Verify Release APK
        shell: bash
        run: |
          set -e

          FILE="android/app/build/outputs/apk/release/app-release.apk"

          test -f "$FILE"

          echo "Release APK:"
          ls -lh "$FILE"

      # ==========================================================
      # 31. VERIFY RELEASE AAB
      # ==========================================================

      - name: Verify Release AAB
        shell: bash
        run: |
          set -e

          FILE="android/app/build/outputs/bundle/release/app-release.aab"

          test -f "$FILE"

          echo "Release AAB:"
          ls -lh "$FILE"

      # ==========================================================
      # 32. FINAL OUTPUT
      # ==========================================================

      - name: Final build summary
        shell: bash
        run: |
          echo
          echo "=================================================="
          echo " RKMS CONNECT - FINAL ANDROID BUILD"
          echo "=================================================="
          echo
          echo "Android Version : 16"
          echo "API Level       : 36"
          echo "JDK             : 17"
          echo "Node.js         : 22"
          echo
          echo "DEBUG APK:"
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          echo
          echo "RELEASE APK:"
          ls -lh android/app/build/outputs/apk/release/app-release.apk
          echo
          echo "RELEASE AAB:"
          ls -lh android/app/build/outputs/bundle/release/app-release.aab
          echo
          echo "=================================================="
          echo " BUILD SUCCESS"
          echo "=================================================="

      # ==========================================================
      # 33. UPLOAD DEBUG APK
      # ==========================================================

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Android-16-API36-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ==========================================================
      # 34. UPLOAD RELEASE APK
      # ==========================================================

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Android-16-API36-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # ==========================================================
      # 35. UPLOAD RELEASE AAB
      # ==========================================================

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Android-16-API36-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

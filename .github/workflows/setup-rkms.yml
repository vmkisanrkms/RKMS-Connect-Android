name: RKMS Android 16 API 36 - Final Signed Release APK Only

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  NODE_VERSION: "22"
  JAVA_VERSION: "17"

  AGP_VERSION: "8.9.1"
  GRADLE_VERSION: "8.11.1"

  FIREBASE_BOM_VERSION: "34.19.0"
  GOOGLE_SERVICES_VERSION: "4.5.0"
  CREDENTIALS_VERSION: "1.5.0"

  APP_ID: "org.rkms.connect"
  MIN_SDK: "23"
  TARGET_SDK: "36"

  # IMPORTANT:
  # This is the EXACT ZIP currently present in the repository.
  SOURCE_ZIP: "RKMS_CONNECT_GROUP_PHOTO_SCHEMA_FIXED_FINAL_20260920.zip"

  APK_NAME: "RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"


jobs:

  build:

    name: Build Final Signed Release APK Only

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. VERIFY EXACT SOURCE ZIP
      # ============================================================

      - name: Verify exact RKMS source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "RKMS SOURCE ZIP VERIFICATION"
          echo "=============================================="

          echo "Required source:"
          echo "${SOURCE_ZIP}"

          if [ ! -f "${SOURCE_ZIP}" ]; then
            echo "::error::Required RKMS source ZIP not found."

            echo ""
            echo "Available ZIP files:"
            find . \
              -type f \
              \( -iname "*.zip" -o -iname "*.ZIP" \) \
              -print \
              | sort || true

            exit 1
          fi

          echo ""
          echo "Exact source ZIP FOUND:"
          ls -lh "${SOURCE_ZIP}"

          echo ""
          echo "Source ZIP verification PASS."


      # ============================================================
      # 3. SOURCE ZIP SHA256
      # ============================================================

      - name: Generate source ZIP SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum "${SOURCE_ZIP}" \
            | tee source-zip.sha256

          echo ""
          echo "Source ZIP SHA256:"
          cat source-zip.sha256


      # ============================================================
      # 4. EXTRACT SOURCE
      # ============================================================

      - name: Extract RKMS source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build-project

          mkdir -p build-project

          unzip -q \
            "${SOURCE_ZIP}" \
            -d build-project

          echo "Source extraction PASS."


      # ============================================================
      # 5. DETECT PROJECT ROOT
      # ============================================================

      - name: Detect RKMS project root
        shell: bash
        run: |
          set -euo pipefail

          ROOT=""

          if [ -f "build-project/package.json" ]; then

            ROOT="build-project"

          else

            FOUND_PACKAGE="$(
              find build-project \
                -type f \
                -name "package.json" \
                -not -path "*/node_modules/*" \
                -print \
                | head -n 1 || true
            )"

            if [ -n "$FOUND_PACKAGE" ]; then
              ROOT="$(dirname "$FOUND_PACKAGE")"
            fi

          fi

          if [ -z "$ROOT" ]; then
            echo "::error::package.json not found inside source ZIP."
            exit 1
          fi

          echo "RKMS_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo ""
          echo "RKMS_ROOT:"
          echo "$ROOT"


      # ============================================================
      # 6. SOURCE VALIDATION
      # ============================================================

      - name: Validate RKMS source
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          REQUIRED_FILES=(
            "package.json"
            "app.js"
            "index.html"
            "styles.css"
            "capacitor.config.json"
            "google-services.json"
            "scripts/setup-android-native.sh"
            "scripts/configure-android-16.sh"
          )

          for file in "${REQUIRED_FILES[@]}"; do

            if [ ! -f "$file" ]; then
              echo "::error::Missing required file: $file"
              exit 1
            fi

            echo "OK: $file"

          done

          echo ""
          echo "Required source files PASS."


      # ============================================================
      # 7. JAVASCRIPT SYNTAX
      # ============================================================

      - name: Verify app.js syntax
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node --check app.js

          echo "app.js syntax PASS."


      # ============================================================
      # 8. SHELL SCRIPT SYNTAX
      # ============================================================

      - name: Verify shell scripts
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          while IFS= read -r -d '' script; do
            echo "Checking: $script"
            bash -n "$script"
          done < <(
            find scripts \
              -type f \
              -name "*.sh" \
              -print0
          )

          echo "Shell script syntax PASS."


      # ============================================================
      # 9. NODE 22
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ env.RKMS_ROOT }}/package-lock.json


      # ============================================================
      # 10. VERIFY CAPACITOR
      # ============================================================

      - name: Verify Capacitor versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node <<'NODE'
          const fs = require("fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const deps = {
            ...(pkg.dependencies || {}),
            ...(pkg.devDependencies || {})
          };

          const required = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          let failed = false;

          for (const [name, version] of Object.entries(required)) {

            const actual = deps[name];

            console.log(
              `${name}: required=${version}, actual=${actual || "MISSING"}`
            );

            if (!actual) {
              failed = true;
              continue;
            }

            const allowed = [
              version,
              `^${version}`,
              `~${version}`
            ];

            if (!allowed.includes(String(actual))) {
              console.error(
                `ERROR: ${name}: expected ${version}, found ${actual}`
              );

              failed = true;
            }
          }

          if (failed) {
            process.exit(1);
          }

          console.log("Capacitor validation PASS.");
          NODE


      # ============================================================
      # 11. NPM INSTALL
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          if [ -f package-lock.json ]; then

            npm ci \
              --no-audit \
              --no-fund

          else

            npm install \
              --no-audit \
              --no-fund

          fi

          echo "npm dependencies PASS."


      # ============================================================
      # 12. WEB BUILD
      # ============================================================

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm run build

          test -d dist

          echo "Web build PASS."


      # ============================================================
      # 13. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 14. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ============================================================
      # 15. INSTALL API 36
      # ============================================================

      - name: Install Android API 36 and Build Tools
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          test -n "$SDK"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then

            SDKMANAGER="$(
              find "$SDK/cmdline-tools" \
                -type f \
                -path "*/bin/sdkmanager" \
                -print \
                | head -n 1 || true
            )"

          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses \
            >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "Android API 36 installed."


      # ============================================================
      # 16. VERIFY SDK
      # ============================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          test -d \
            "$SDK/platforms/android-36"

          test -d \
            "$SDK/build-tools/36.0.0"

          test -x \
            "$SDK/build-tools/36.0.0/aapt"

          test -x \
            "$SDK/build-tools/36.0.0/apksigner"

          echo "Android API 36 PASS."
          echo "Build Tools 36.0.0 PASS."


      # ============================================================
      # 17. CREATE ANDROID
      # ============================================================

      - name: Create Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          rm -rf android

          npx cap add android

          test -d android


      # ============================================================
      # 18. CAPACITOR SYNC
      # ============================================================

      - name: Capacitor sync Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npx cap sync android

          echo "Capacitor sync PASS."


      # ============================================================
      # 19. RKMS ANDROID CONFIG
      # ============================================================

      - name: Run RKMS Android 16 configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/configure-android-16.sh

          bash -n \
            scripts/configure-android-16.sh

          ./scripts/configure-android-16.sh

          echo "RKMS Android 16 configuration PASS."


      # ============================================================
      # 20. FIX SDK WITHOUT DESTROYING variables.gradle
      # ============================================================

      - name: Configure Android SDK 36 safely
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          test -f android/app/build.gradle
          test -f android/variables.gradle


          # --------------------------------------------------------
          # variables.gradle
          #
          # DO NOT REPLACE THE FILE.
          # Preserve all Capacitor variables.
          # --------------------------------------------------------

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("android/variables.gradle")
          s = p.read_text(encoding="utf-8")

          if not re.search(r'\bext\s*\{', s):
              raise SystemExit(
                  "ERROR: variables.gradle ext block not found."
              )

          def update_or_add(text, name, value):

              pattern = rf'(\b{name}\s*=\s*)\d+'

              if re.search(pattern, text):

                  return re.sub(
                      pattern,
                      rf'\g<1>{value}',
                      text,
                      count=1
                  )

              return re.sub(
                  r'(\bext\s*\{)',
                  rf'\1\n    {name} = {value}',
                  text,
                  count=1
              )

          s = update_or_add(
              s,
              "minSdkVersion",
              23
          )

          s = update_or_add(
              s,
              "compileSdkVersion",
              36
          )

          s = update_or_add(
              s,
              "targetSdkVersion",
              36
          )

          p.write_text(
              s,
              encoding="utf-8"
          )

          print(
              "variables.gradle safely updated."
          )
          PY


          # --------------------------------------------------------
          # app/build.gradle
          # --------------------------------------------------------

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text(encoding="utf-8")

          if not re.search(
              r'^\s*android\s*\{',
              s,
              flags=re.MULTILINE
          ):
              raise SystemExit(
                  "ERROR: android block not found."
              )

          # Remove only direct SDK declarations.

          s = re.sub(
              r'^[ \t]*(?:compileSdkVersion|compileSdk)\s+.*$',
              '',
              s,
              flags=re.MULTILINE
          )

          s = re.sub(
              r'^[ \t]*(?:minSdkVersion|minSdk)\s+.*$',
              '',
              s,
              flags=re.MULTILINE
          )

          s = re.sub(
              r'^[ \t]*(?:targetSdkVersion|targetSdk)\s+.*$',
              '',
              s,
              flags=re.MULTILINE
          )

          # Add explicit compileSdk.

          s = re.sub(
              r'^(\s*android\s*\{)',
              r'\1\n    compileSdk 36',
              s,
              count=1,
              flags=re.MULTILINE
          )

          if not re.search(
              r'^\s*defaultConfig\s*\{',
              s,
              flags=re.MULTILINE
          ):
              raise SystemExit(
                  "ERROR: defaultConfig block not found."
              )

          s = re.sub(
              r'^(\s*defaultConfig\s*\{)',
              r'\1\n'
              r'        minSdk 23\n'
              r'        targetSdk 36',
              s,
              count=1,
              flags=re.MULTILINE
          )

          p.write_text(
              s,
              encoding="utf-8"
          )

          print(
              "app/build.gradle SDK values configured."
          )
          PY


      # ============================================================
      # 21. VERIFY SDK + CAPACITOR VARIABLES
      # ============================================================

      - name: Verify Android SDK configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          grep -Eq \
            '^[[:space:]]*compileSdk[[:space:]]+36' \
            app/build.gradle

          grep -Eq \
            '^[[:space:]]*minSdk[[:space:]]+23' \
            app/build.gradle

          grep -Eq \
            '^[[:space:]]*targetSdk[[:space:]]+36' \
            app/build.gradle

          # Critical Capacitor variable.
          grep -Eq \
            'androidXAppCompatVersion|androidxAppCompatVersion' \
            variables.gradle

          echo "compileSdk 36 PASS."
          echo "minSdk 23 PASS."
          echo "targetSdk 36 PASS."
          echo "androidXAppCompatVersion preserved."


      # ============================================================
      # 22. FIREBASE JSON
      # ============================================================

      - name: Install Firebase google-services.json
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          test -f google-services.json

          mkdir -p android/app

          cp \
            google-services.json \
            android/app/google-services.json

          echo "Firebase JSON copied."


      # ============================================================
      # 23. NATIVE SETUP
      # ============================================================

      - name: Configure RKMS native Android bridge
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/setup-android-native.sh

          bash -n \
            scripts/setup-android-native.sh

          ./scripts/setup-android-native.sh

          echo "RKMS native Android setup PASS."


      # ============================================================
      # 24. RESTORE SDK VALUES AFTER NATIVE SETUP
      # ============================================================

      - name: Reapply Android SDK configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text(encoding="utf-8")

          s = re.sub(
              r'^[ \t]*(?:compileSdkVersion|compileSdk)\s+.*$',
              '',
              s,
              flags=re.MULTILINE
          )

          s = re.sub(
              r'^[ \t]*(?:minSdkVersion|minSdk)\s+.*$',
              '',
              s,
              flags=re.MULTILINE
          )

          s = re.sub(
              r'^[ \t]*(?:targetSdkVersion|targetSdk)\s+.*$',
              '',
              s,
              flags=re.MULTILINE
          )

          s = re.sub(
              r'^(\s*android\s*\{)',
              r'\1\n    compileSdk 36',
              s,
              count=1,
              flags=re.MULTILINE
          )

          s = re.sub(
              r'^(\s*defaultConfig\s*\{)',
              r'\1\n'
              r'        minSdk 23\n'
              r'        targetSdk 36',
              s,
              count=1,
              flags=re.MULTILINE
          )

          p.write_text(
              s,
              encoding="utf-8"
          )

          print(
              "SDK configuration restored after native setup."
          )
          PY


      # ============================================================
      # 25. VERIFY NATIVE BRIDGE
      # ============================================================

      - name: Verify RKMS Native Bridge
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          BRIDGE="$(
            find android/app/src/main/java \
              -type f \
              -name "RKMSNativeBridge.java" \
              -print \
              | head -n 1 || true
          )"

          if [ -z "$BRIDGE" ]; then
            echo "::error::RKMSNativeBridge.java not found."
            exit 1
          fi

          grep -Fq \
            "CredentialManager" \
            "$BRIDGE"

          grep -Fq \
            "CreatePasswordRequest" \
            "$BRIDGE"

          grep -Fq \
            "createCredentialAsync" \
            "$BRIDGE"

          grep -Fq \
            "savePassword" \
            "$BRIDGE"

          echo "RKMS Native Bridge PASS."


      # ============================================================
      # 26. MICROPHONE + FILE PICKER
      # ============================================================

      - name: Verify microphone and file picker
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          grep -Fq \
            "RECORD_AUDIO" \
            scripts/setup-android-native.sh

          grep -Fq \
            "RESOURCE_AUDIO_CAPTURE" \
            scripts/setup-android-native.sh

          grep -Fq \
            "onShowFileChooser" \
            scripts/setup-android-native.sh

          grep -Fq \
            "MediaRecorder" \
            app.js

          echo "Microphone + file picker PASS."


      # ============================================================
      # 27. KEYBOARD RESIZE
      # ============================================================

      - name: Verify keyboard resize
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          grep -Fq \
            "SOFT_INPUT_ADJUST_RESIZE" \
            scripts/setup-android-native.sh

          echo "Keyboard resize PASS."


      # ============================================================
      # 28. FIREBASE INITIALIZATION
      # ============================================================

      - name: Verify FirebaseApp initialization
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          MAIN_ACTIVITY="$(
            find android/app/src/main/java \
              -type f \
              -name "MainActivity.java" \
              -print \
              | head -n 1 || true
          )"

          test -n "$MAIN_ACTIVITY"

          grep -Fq \
            "FirebaseApp.initializeApp" \
            "$MAIN_ACTIVITY"

          echo "FirebaseApp initialization PASS."


      # ============================================================
      # 29. FIREBASE DEPENDENCIES
      # ============================================================

      - name: Configure Firebase dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          python3 <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text(encoding="utf-8")

          marker = "dependencies {"

          if marker not in s:
              raise SystemExit(
                  "ERROR: dependencies block missing."
              )

          deps = [
              'implementation platform("com.google.firebase:firebase-bom:34.19.0")',
              'implementation "com.google.firebase:firebase-messaging"',
              'implementation "androidx.credentials:credentials:1.5.0"',
              'implementation "androidx.credentials:credentials-play-services-auth:1.5.0"'
          ]

          for dep in deps:

              if dep not in s:

                  s = s.replace(
                      marker,
                      marker
                      + "\n    "
                      + dep,
                      1
                  )

          p.write_text(
              s,
              encoding="utf-8"
          )

          echo "Firebase + Credential Manager configured."
          PY


      # ============================================================
      # 30. FIREBASE PACKAGE
      # ============================================================

      - name: Verify Firebase package
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          test -f \
            app/google-services.json

          grep -Fq \
            "firebase-bom:34.19.0" \
            app/build.gradle

          grep -Fq \
            "firebase-messaging" \
            app/build.gradle

          grep -Fq \
            "com.google.gms.google-services" \
            app/build.gradle

          python3 <<'PY'
          import json

          with open(
              "app/google-services.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          found = False

          for client in data.get("client", []):

              package_name = (
                  client
                  .get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

              if package_name == "org.rkms.connect":
                  found = True
                  break

          if not found:
              raise SystemExit(
                  "Firebase package mismatch."
              )

          print(
              "Firebase package PASS."
          )
          PY


      # ============================================================
      # 31. GRADLE 8.11.1
      # ============================================================

      - name: Configure Gradle 8.11.1
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          WRAPPER="gradle/wrapper/gradle-wrapper.properties"

          test -f "$WRAPPER"

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "gradle/wrapper/gradle-wrapper.properties"
          )

          s = p.read_text(
              encoding="utf-8"
          )

          url = (
              "https://services.gradle.org/distributions/"
              "gradle-8.11.1-bin.zip"
          )

          s = re.sub(
              r'^distributionUrl=.*$',
              'distributionUrl=' + url,
              s,
              flags=re.MULTILINE
          )

          p.write_text(
              s,
              encoding="utf-8"
          )
          PY

          chmod +x gradlew

          grep -Fq \
            "gradle-8.11.1-bin.zip" \
            "$WRAPPER"

          echo "Gradle 8.11.1 PASS."


      # ============================================================
      # 32. AGP / GOOGLE SERVICES
      # ============================================================

      - name: Normalize Android Gradle plugins
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("build.gradle")

          s = root.read_text(
              encoding="utf-8"
          )

          s = re.sub(
              r'com\.android\.tools\.build:gradle:[0-9.]+',
              'com.android.tools.build:gradle:8.9.1',
              s
          )

          s = re.sub(
              r'com\.google\.gms:google-services:[0-9.]+',
              'com.google.gms:google-services:4.5.0',
              s
          )

          if "com.google.gms:google-services:4.5.0" not in s:

              if "dependencies {" not in s:
                  raise SystemExit(
                      "Root dependencies block missing."
                  )

              s = s.replace(
                  "dependencies {",
                  "dependencies {\n"
                  '        classpath "com.google.gms:google-services:4.5.0"',
                  1
              )

          root.write_text(
              s,
              encoding="utf-8"
          )

          app = Path("app/build.gradle")

          a = app.read_text(
              encoding="utf-8"
          )

          if "com.google.gms.google-services" not in a:

              if "plugins {" in a:

                  a = a.replace(
                      "plugins {",
                      "plugins {\n"
                      "    id 'com.google.gms.google-services'",
                      1
                  )

              else:

                  a = (
                      "apply plugin: "
                      "'com.google.gms.google-services'\n\n"
                      + a
                  )

          app.write_text(
              a,
              encoding="utf-8"
          )

          print(
              "AGP 8.9.1 / Google Services 4.5.0 configured."
          )
          PY


      # ============================================================
      # 33. CRITICAL GRADLE CONFIGURATION TEST
      # ============================================================

      - name: Verify Gradle project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          chmod +x gradlew

          echo "=============================================="
          echo "GRADLE CONFIGURATION TEST"
          echo "=============================================="

          ./gradlew \
            --version

          ./gradlew \
            :app:tasks \
            --no-daemon \
            --stacktrace

          echo ""
          echo "Gradle project configuration PASS."


      # ============================================================
      # 34. RELEASE KEYSTORE
      # ============================================================

      - name: Prepare release signing keystore
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "${RKMS_KEYSTORE_BASE64:-}"
          test -n "${RKMS_KEY_ALIAS:-}"
          test -n "${RKMS_KEYSTORE_PASSWORD:-}"
          test -n "${RKMS_KEY_PASSWORD:-}"

          cd "$RKMS_ROOT/android"

          echo "$RKMS_KEYSTORE_BASE64" \
            | base64 --decode \
            > rkms-release.keystore

          test -s rkms-release.keystore

          keytool \
            -list \
            -keystore rkms-release.keystore \
            -storepass "$RKMS_KEYSTORE_PASSWORD" \
            -alias "$RKMS_KEY_ALIAS" \
            >/dev/null

          echo \
            "RKMS_KEYSTORE_PATH=$PWD/rkms-release.keystore" \
            >> "$GITHUB_ENV"

          echo "Release keystore PASS."


      # ============================================================
      # 35. RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle")

          s = p.read_text(
              encoding="utf-8"
          )

          if "signingConfigs {" not in s:

              signing = """
              signingConfigs {
                  release {
                      storeFile file(
                          System.getenv("RKMS_KEYSTORE_PATH")
                      )
                      storePassword System.getenv(
                          "RKMS_KEYSTORE_PASSWORD"
                      )
                      keyAlias System.getenv(
                          "RKMS_KEY_ALIAS"
                      )
                      keyPassword System.getenv(
                          "RKMS_KEY_PASSWORD"
                      )
                  }
              }
              """

              s = s.replace(
                  "android {",
                  "android {\n" + signing,
                  1
              )

          if "signingConfig signingConfigs.release" not in s:

              match = re.search(
                  r'buildTypes\s*\{',
                  s
              )

              if not match:
                  raise SystemExit(
                      "buildTypes block not found."
                  )

              release = re.search(
                  r'release\s*\{',
                  s[match.end():]
              )

              if release:

                  pos = (
                      match.end()
                      + release.end()
                  )

                  s = (
                      s[:pos]
                      + "\n"
                      "            signingConfig "
                      "signingConfigs.release\n"
                      + s[pos:]
                  )

              else:

                  pos = match.end()

                  s = (
                      s[:pos]
                      + """
                      release {
                          signingConfig signingConfigs.release
                      }
                      """
                      + s[pos:]
                  )

          p.write_text(
              s,
              encoding="utf-8"
          )

          print(
              "Release signing configured."
          )
          PY


      # ============================================================
      # 36. VERIFY SIGNING
      # ============================================================

      - name: Verify release signing configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          grep -Fq \
            "signingConfigs" \
            app/build.gradle

          grep -Fq \
            "signingConfigs.release" \
            app/build.gradle

          test -f \
            "$RKMS_KEYSTORE_PATH"

          echo "Release signing PASS."


      # ============================================================
      # 37. CLEAN
      # ============================================================

      - name: Clean Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          ./gradlew \
            clean \
            --no-daemon \
            --stacktrace

          echo "Clean PASS."


      # ============================================================
      # 38. BUILD RELEASE APK ONLY
      # ============================================================

      - name: Build Final Signed Release APK
        shell: bash
        env:
          RKMS_KEYSTORE_PATH: ${{ env.RKMS_KEYSTORE_PATH }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          echo "=============================================="
          echo "RKMS FINAL SIGNED RELEASE APK"
          echo "=============================================="

          echo "SOURCE ZIP      : ${SOURCE_ZIP}"
          echo "ANDROID API     : 36"
          echo "BUILD TOOLS     : 36.0.0"
          echo "MIN SDK         : 23"
          echo "TARGET SDK      : 36"
          echo "AGP             : 8.9.1"
          echo "GRADLE          : 8.11.1"
          echo "PACKAGE         : org.rkms.connect"
          echo "SIGNED          : YES"
          echo "APK ONLY        : YES"
          echo "DEBUG APK       : NO"
          echo "AAB             : NO"

          echo "=============================================="


          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace


          echo ""
          echo "Release APK build completed."


      # ============================================================
      # 39. LOCATE APK
      # ============================================================

      - name: Locate final release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          APK="$(
            find \
              app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              ! -iname "*debug*" \
              -print \
              | head -n 1 || true
          )"

          if [ -z "$APK" ]; then
            echo "::error::Release APK not found."

            find \
              app/build/outputs \
              -type f \
              -print \
              || true

            exit 1
          fi

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/${APK_NAME}"

          echo \
            "APK_PATH=$GITHUB_WORKSPACE/${APK_NAME}" \
            >> "$GITHUB_ENV"

          echo "Final APK:"
          ls -lh \
            "$GITHUB_WORKSPACE/${APK_NAME}"


      # ============================================================
      # 40. VERIFY APK
      # ============================================================

      - name: Verify APK package and SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          AAPT="$SDK/build-tools/${BUILD_TOOLS}/aapt"

          "$AAPT" \
            dump badging \
            "$APK_PATH" \
            > apk-badging.txt

          cat apk-badging.txt

          grep -Fq \
            "package: name='${APP_ID}'" \
            apk-badging.txt

          grep -Fq \
            "targetSdkVersion:'36'" \
            apk-badging.txt

          echo "APK package + SDK PASS."


      # ============================================================
      # 41. SIGNATURE
      # ============================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          "$SDK/build-tools/${BUILD_TOOLS}/apksigner" \
            verify \
            --verbose \
            "$APK_PATH"

          echo "APK signature PASS."


      # ============================================================
      # 42. SIGNER CERTIFICATE
      # ============================================================

      - name: Verify APK signer certificate
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          "$SDK/build-tools/${BUILD_TOOLS}/apksigner" \
            verify \
            --print-certs \
            "$APK_PATH"


      # ============================================================
      # 43. SHA256
      # ============================================================

      - name: Generate APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          sha256sum \
            "$APK_NAME" \
            | tee \
              "${APK_NAME}.sha256"


      # ============================================================
      # 44. FINAL APK-ONLY AUDIT
      # ============================================================

      - name: Final APK-only audit
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          test -f "$APK_NAME"
          test -f "${APK_NAME}.sha256"

          if find . \
            -maxdepth 1 \
            -type f \
            -name "*.aab" \
            | grep -q .
          then
            echo "::error::AAB detected."
            exit 1
          fi

          if find . \
            -maxdepth 1 \
            -type f \
            -iname "*debug*.apk" \
            | grep -q .
          then
            echo "::error::Debug APK detected."
            exit 1
          fi

          SIZE_BYTES=$(
            stat -c%s "$APK_NAME"
          )

          if [ "$SIZE_BYTES" -le 1000000 ]; then
            echo "::error::APK unexpectedly small."
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "FINAL AUDIT PASSED"
          echo "=============================================="
          echo "APK ONLY    : YES"
          echo "AAB         : NO"
          echo "DEBUG APK   : NO"
          echo "SIGNED      : YES"
          echo "API         : 36"
          echo "MIN SDK     : 23"
          echo "TARGET SDK  : 36"
          echo "PACKAGE     : ${APP_ID}"
          echo "APK         : ${APK_NAME}"
          echo "SIZE        : ${SIZE_BYTES}"
          echo ""
          echo "SHA256:"
          cat "${APK_NAME}.sha256"
          echo "=============================================="


      # ============================================================
      # 45. UPLOAD FINAL APK
      # ============================================================

      - name: Upload final APK and SHA256
        uses: actions/upload-artifact@v4
        with:
          name: RKMS_ANDROID16_API36_SIGNED_RELEASE_APK
          if-no-files-found: error
          path: |
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256
          retention-days: 30

name: Build RKMS Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ANDROID_SOURCE_COMMIT: cf252628308e5a6ecc9eafbaf4ca227a3ad8ec92
  GRADLE_VERSION: 8.9

jobs:
  build:
    name: Build RKMS Release APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout repository
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # =========================================================
      # 2. Prepare native Android source
      #
      # IMPORTANT:
      # Native source commit में gradlew नहीं है.
      # इसलिए हम source को clone करेंगे और बाद में Gradle wrapper बनाएंगे.
      # =========================================================
      - name: Prepare native Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$RUNNER_TEMP/rkms-android"

          rm -rf "$PROJECT_DIR"

          echo "========================================"
          echo "Preparing native RKMS Android project"
          echo "========================================"

          git clone \
            --no-tags \
            "https://github.com/vmkisanrkms/RKMS-Connect-Android.git" \
            "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          git checkout --detach "$ANDROID_SOURCE_COMMIT"

          echo "Checked commit:"
          git rev-parse HEAD

          test "$(git rev-parse HEAD)" = "$ANDROID_SOURCE_COMMIT"

          test -f settings.gradle
          test -f app/build.gradle
          test -f app/google-services.json
          test -f app/src/main/AndroidManifest.xml

          echo "Native Android source: PASS"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # =========================================================
      # 3. Find and extract FINAL RKMS WEBSITE ZIP
      #
      # APK में final website bundle की जाएगी.
      # Live website URL की जरूरत नहीं.
      # =========================================================
      - name: Extract final RKMS website
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for final RKMS website ZIP..."

          ZIP_FILE="$(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name 'RKMS_CONNECT_FINAL_ALL_FIXES_*.zip' \
              -print \
              -quit
          )"

          if [ -z "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR: Final RKMS website ZIP not found."
            echo ""
            echo "ZIP files found:"
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name '*.zip' \
              -print || true
            exit 1
          fi

          echo "Using:"
          echo "$ZIP_FILE"

          WEB_DIR="$RUNNER_TEMP/rkms-web"

          rm -rf "$WEB_DIR"
          mkdir -p "$WEB_DIR"

          unzip -q "$ZIP_FILE" -d "$WEB_DIR"

          echo ""
          echo "Website files found:"

          APP_JS="$(
            find "$WEB_DIR" \
              -type f \
              -name 'app.js' \
              -print \
              -quit
          )"

          STYLES="$(
            find "$WEB_DIR" \
              -type f \
              -name 'styles.css' \
              -print \
              -quit
          )"

          INDEX="$(
            find "$WEB_DIR" \
              -type f \
              -name 'index.html' \
              -print \
              -quit
          )"

          CONFIG="$(
            find "$WEB_DIR" \
              -type f \
              -name 'config.js' \
              -print \
              -quit
          )"

          test -n "$APP_JS"
          test -n "$STYLES"
          test -n "$INDEX"
          test -n "$CONFIG"

          test -s "$APP_JS"
          test -s "$STYLES"
          test -s "$INDEX"
          test -s "$CONFIG"

          echo "app.js: PASS"
          echo "styles.css: PASS"
          echo "index.html: PASS"
          echo "config.js: PASS"

          echo "WEB_DIR=$WEB_DIR" >> "$GITHUB_ENV"


      # =========================================================
      # 4. Validate final website JavaScript
      # =========================================================
      - name: Validate final website JavaScript
        shell: bash
        run: |
          set -euo pipefail

          APP_JS="$(
            find "$WEB_DIR" \
              -type f \
              -name 'app.js' \
              -print \
              -quit
          )"

          test -n "$APP_JS"

          node --check "$APP_JS"

          echo "JavaScript syntax: PASS"


      # =========================================================
      # 5. Sync final website into Android APK
      #
      # यही आपकी सही requirement है:
      # Final website APK के अंदर bundled होगी.
      # =========================================================
      - name: Sync final website into Android
        shell: bash
        run: |
          set -euo pipefail

          APP_JS="$(
            find "$WEB_DIR" \
              -type f \
              -name 'app.js' \
              -print \
              -quit
          )"

          STYLES="$(
            find "$WEB_DIR" \
              -type f \
              -name 'styles.css' \
              -print \
              -quit
          )"

          INDEX="$(
            find "$WEB_DIR" \
              -type f \
              -name 'index.html' \
              -print \
              -quit
          )"

          CONFIG="$(
            find "$WEB_DIR" \
              -type f \
              -name 'config.js' \
              -print \
              -quit
          )"

          test -n "$APP_JS"
          test -n "$STYLES"
          test -n "$INDEX"
          test -n "$CONFIG"

          ASSETS="$PROJECT_DIR/app/src/main/assets/www"

          rm -rf "$ASSETS"
          mkdir -p "$ASSETS"

          cp "$APP_JS" "$ASSETS/app.js"
          cp "$STYLES" "$ASSETS/styles.css"
          cp "$INDEX" "$ASSETS/index.html"
          cp "$CONFIG" "$ASSETS/config.js"

          # -----------------------------------------------------
          # manifest.webmanifest
          # -----------------------------------------------------
          MANIFEST="$(
            find "$WEB_DIR" \
              -type f \
              -name 'manifest.webmanifest' \
              -print \
              -quit || true
          )"

          if [ -n "$MANIFEST" ]; then
            cp "$MANIFEST" "$ASSETS/manifest.webmanifest"
          fi

          # -----------------------------------------------------
          # Website assets
          # -----------------------------------------------------
          SOURCE_ASSETS="$(
            find "$WEB_DIR" \
              -type d \
              -name assets \
              -print \
              -quit || true
          )"

          if [ -n "$SOURCE_ASSETS" ]; then
            mkdir -p "$ASSETS/assets"
            cp -R "$SOURCE_ASSETS"/. "$ASSETS/assets"/
          fi

          # -----------------------------------------------------
          # Required files verification
          # -----------------------------------------------------
          test -s "$ASSETS/app.js"
          test -s "$ASSETS/styles.css"
          test -s "$ASSETS/index.html"
          test -s "$ASSETS/config.js"

          echo ""
          echo "Final website successfully bundled into APK."

          echo ""
          echo "Bundled website size:"
          du -sh "$ASSETS"


      # =========================================================
      # 6. Verify Supabase configuration inside website
      # =========================================================
      - name: Verify RKMS Supabase configuration
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="$PROJECT_DIR/app/src/main/assets/www/config.js"

          test -f "$CONFIG"

          echo "Checking Supabase configuration..."

          grep -q \
            'https://kzczivaydandiqgnzfeg.supabase.co' \
            "$CONFIG"

          echo "Production Supabase URL: PASS"

          grep -q \
            'sb_publishable_' \
            "$CONFIG"

          echo "Supabase publishable key: PRESENT"

          echo "Supabase configuration: PASS"


      # =========================================================
      # 7. Setup Java 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # =========================================================
      # 8. Install Gradle
      #
      # Native source में gradlew नहीं है.
      # इसलिए Gradle 8.9 install करके wrapper बनाएँगे.
      # =========================================================
      - name: Install Gradle
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_HOME="$RUNNER_TEMP/gradle"

          rm -rf "$GRADLE_HOME"

          mkdir -p "$GRADLE_HOME"

          echo "Downloading Gradle $GRADLE_VERSION..."

          curl \
            -L \
            --fail \
            --retry 3 \
            --connect-timeout 20 \
            --max-time 120 \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o "$RUNNER_TEMP/gradle.zip"

          unzip -q \
            "$RUNNER_TEMP/gradle.zip" \
            -d "$GRADLE_HOME"

          echo "GRADLE_BIN=$GRADLE_HOME/gradle-${GRADLE_VERSION}/bin" \
            >> "$GITHUB_ENV"

          echo "$GRADLE_HOME/gradle-${GRADLE_VERSION}/bin" \
            >> "$GITHUB_PATH"

          gradle --version


      # =========================================================
      # 9. Create Gradle Wrapper
      # =========================================================
      - name: Create Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gradle wrapper \
            --gradle-version "$GRADLE_VERSION" \
            --distribution-type bin

          test -f gradlew

          chmod +x gradlew

          echo "Gradle wrapper created successfully."

          ./gradlew --version


      # =========================================================
      # 10. Verify Android project
      # =========================================================
      - name: Verify Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/google-services.json
          test -f app/src/main/AndroidManifest.xml
          test -f gradlew

          echo "Android project files: PASS"

          ./gradlew \
            tasks \
            --no-daemon \
            --stacktrace \
            > /tmp/rkms-gradle-tasks.log

          echo "Gradle project configuration: PASS"


      # =========================================================
      # 11. Prepare release signing
      # =========================================================
      - name: Prepare release signing
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$RKMS_KEYSTORE_BASE64"
          test -n "$RKMS_KEYSTORE_PASSWORD"
          test -n "$RKMS_KEY_ALIAS"
          test -n "$RKMS_KEY_PASSWORD"

          KEYSTORE="$RUNNER_TEMP/rkms-release.keystore"

          printf '%s' "$RKMS_KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE"

          test -s "$KEYSTORE"

          echo "RKMS_KEYSTORE_PATH=$KEYSTORE" \
            >> "$GITHUB_ENV"

          echo "Release signing keystore: PASS"


      # =========================================================
      # 12. Build signed Release APK
      # =========================================================
      - name: Build signed Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          RKMS_KEYSTORE_PATH: ${{ env.RKMS_KEYSTORE_PATH }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew \
            clean \
            assembleRelease \
            --no-daemon \
            --stacktrace


      # =========================================================
      # 13. Locate APK
      # =========================================================
      - name: Locate Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/release"

          APK="$(
            find "$APK_DIR" \
              -type f \
              -name '*.apk' \
              -print \
              -quit
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."

            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -print || true

            exit 1
          fi

          test -s "$APK"

          mkdir -p release

          cp "$APK" \
            release/RKMS-Connect-Release.apk

          echo ""
          echo "========================================"
          echo "RKMS RELEASE APK CREATED"
          echo "========================================"

          ls -lh release/RKMS-Connect-Release.apk


      # =========================================================
      # 14. Final APK verification
      # =========================================================
      - name: Verify final APK
        shell: bash
        run: |
          set -euo pipefail

          APK="release/RKMS-Connect-Release.apk"

          test -f "$APK"
          test -s "$APK"

          SIZE="$(stat -c%s "$APK")"

          echo "APK size: $SIZE bytes"

          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: APK is unexpectedly small."
            exit 1
          fi

          echo "Final APK verification: PASS"


      # =========================================================
      # 15. Upload APK artifact
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-Final-Release
          path: release/RKMS-Connect-Release.apk
          if-no-files-found: error

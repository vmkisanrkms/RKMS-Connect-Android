name: RKMS Android 16 API 36 AAB

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    name: Build RKMS Android 16 / API 36
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # EXTRACT RKMS SOURCE PACKAGE
      # =========================================================

      - name: Extract RKMS project package
        shell: bash
        run: |

          set -e

          PACKAGE="RKMS_CONNECT_V18_ANDROID16_API36_AAB_FINAL_READY.zip"

          if [ ! -f "$PACKAGE" ]; then
            echo "ERROR: RKMS source package not found:"
            echo "$PACKAGE"
            echo ""
            echo "Repository files:"
            find . -maxdepth 2 -type f -print
            exit 1
          fi

          echo "Found RKMS package:"
          ls -lh "$PACKAGE"

          rm -rf .rkms_extract
          mkdir -p .rkms_extract

          unzip -q "$PACKAGE" -d .rkms_extract

          # The package contains rkms_android/
          if [ ! -d ".rkms_extract/rkms_android" ]; then
            echo "ERROR: rkms_android directory not found inside package."
            find .rkms_extract -maxdepth 3 -print
            exit 1
          fi

          # Copy the actual project into repository root.
          cp -a .rkms_extract/rkms_android/. .

          rm -rf .rkms_extract

          echo ""
          echo "RKMS source extracted successfully."
          echo ""

          test -f package.json
          test -f capacitor.config.json
          test -f index.html
          test -f app.js
          test -f styles.css

          echo "Project root verified."

      # =========================================================
      # NODE.JS 22
      # =========================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Node.js and npm
        run: |
          node --version
          npm --version
          test -f package.json

      # =========================================================
      # INSTALL DEPENDENCIES
      # =========================================================

      - name: Install npm dependencies
        run: |
          npm install

      # =========================================================
      # JAVA 17
      # =========================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        run: |
          java -version
          javac -version

      # =========================================================
      # ANDROID SDK
      # =========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android 16 API 36
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify Android SDK
        run: |

          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

          echo "Android API 36 installed."

      # =========================================================
      # CAPACITOR
      # =========================================================

      - name: Verify Capacitor packages
        run: |
          npm ls @capacitor/core
          npm ls @capacitor/android
          npm ls @capacitor/app
          npm ls @capacitor/push-notifications

      # =========================================================
      # WEB BUILD
      # =========================================================

      - name: Build web application
        run: |
          npm run build

      - name: Verify web build
        run: |
          test -d dist
          test -f dist/index.html

          echo "Web build PASS."

      # =========================================================
      # ANDROID PROJECT
      # =========================================================

      - name: Add Capacitor Android platform
        run: |
          npx cap add android

      - name: Verify Android project
        run: |
          test -d android
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle

      # =========================================================
      # FIREBASE / FCM
      # =========================================================

      - name: Copy Firebase configuration
        run: |

          test -f google-services.json

          mkdir -p android/app

          cp google-services.json \
            android/app/google-services.json

          test -f android/app/google-services.json

          echo "Firebase configuration PASS."

      # =========================================================
      # ANDROID 16 / API 36
      # =========================================================

      - name: Configure Android 16 API 36
        run: |

          chmod +x scripts/configure-android-16.sh

          ./scripts/configure-android-16.sh

      # =========================================================
      # CAPACITOR SYNC
      # =========================================================

      - name: Capacitor sync Android
        run: |
          npx cap sync android

      # =========================================================
      # NATIVE BRIDGE
      # =========================================================

      - name: Setup RKMS native Android bridge
        run: |

          chmod +x scripts/setup-android-native.sh

          ./scripts/setup-android-native.sh

      # =========================================================
      # VERIFY ANDROID 16
      # =========================================================

      - name: Verify Android 16 API 36 configuration
        run: |
          python3 scripts/verify-android-16.py

      # =========================================================
      # VERIFY FCM
      # =========================================================

      - name: Verify FCM pipeline
        run: |
          python3 scripts/verify-fcm-pipeline.py

      # =========================================================
      # VERIFY LOGIN
      # =========================================================

      - name: Verify saved login
        run: |
          python3 scripts/verify-saved-login.py

      # =========================================================
      # VERIFY PDF
      # =========================================================

      - name: Verify Android PDF pipeline
        run: |
          python3 scripts/verify-android-pdf.py

      # =========================================================
      # VERIFY NATIVE BRIDGE
      # =========================================================

      - name: Verify native bridge
        run: |
          python3 scripts/verify-native-bridge.py

      # =========================================================
      # RELEASE KEYSTORE
      # =========================================================

      - name: Prepare release keystore
        id: keystore
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
        run: |

          if [ -n "$RKMS_KEYSTORE_BASE64" ]; then

            echo "has_keystore=true" >> "$GITHUB_OUTPUT"

            echo "$RKMS_KEYSTORE_BASE64" \
              | base64 --decode \
              > android/rkms-release.keystore

            test -s android/rkms-release.keystore

            echo "Release keystore prepared."

          else

            echo "has_keystore=false" >> "$GITHUB_OUTPUT"

            echo "No release keystore configured."
            echo "Continuing with unsigned release build."

          fi

      # =========================================================
      # VALIDATE SIGNING SECRETS
      # =========================================================

      - name: Validate release signing secrets
        if: steps.keystore.outputs.has_keystore == 'true'
        env:
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |

          test -n "$RKMS_KEYSTORE_PASSWORD"
          test -n "$RKMS_KEY_ALIAS"
          test -n "$RKMS_KEY_PASSWORD"

          echo "Release signing secrets verified."

      # =========================================================
      # CONFIGURE SIGNING
      # =========================================================

      - name: Configure release signing
        if: steps.keystore.outputs.has_keystore == 'true'
        working-directory: android
        env:
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |

          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          text = path.read_text()

          signing_block = r'''

          // =====================================================
          // RKMS PRODUCTION RELEASE SIGNING
          // =====================================================

          android {
              signingConfigs {
                  rkmsRelease {
                      storeFile file("../rkms-release.keystore")
                      storePassword System.getenv("RKMS_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("RKMS_KEY_ALIAS")
                      keyPassword System.getenv("RKMS_KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.rkmsRelease
                  }
              }
          }
          '''

          if "rkmsRelease" not in text:
              text += signing_block

          path.write_text(text)

          print("Release signing configured.")
          PY

      # =========================================================
      # GRADLE
      # =========================================================

      - name: Verify Gradle
        working-directory: android
        run: |

          chmod +x gradlew

          ./gradlew --version

      # =========================================================
      # CLEAN
      # =========================================================

      - name: Clean Android project
        working-directory: android
        run: |

          ./gradlew clean \
            --no-daemon

      # =========================================================
      # BUILD APK
      # =========================================================

      - name: Build Release APK
        working-directory: android
        run: |

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

      # =========================================================
      # BUILD AAB
      # =========================================================

      - name: Build Release AAB
        working-directory: android
        run: |

          ./gradlew bundleRelease \
            --no-daemon \
            --stacktrace

      # =========================================================
      # VERIFY APK
      # =========================================================

      - name: Verify APK output
        run: |

          APK_DIR="android/app/build/outputs/apk/release"

          test -d "$APK_DIR"

          APK_FILE="$(find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK_FILE"

      # =========================================================
      # VERIFY AAB
      # =========================================================

      - name: Verify AAB output
        run: |

          AAB_DIR="android/app/build/outputs/bundle/release"

          test -d "$AAB_DIR"

          AAB_FILE="$(find "$AAB_DIR" \
            -type f \
            -name "*.aab" \
            -print -quit)"

          if [ -z "$AAB_FILE" ]; then
            echo "ERROR: AAB was not generated."
            exit 1
          fi

          echo "AAB generated successfully:"
          ls -lh "$AAB_FILE"

      # =========================================================
      # FINAL INFORMATION
      # =========================================================

      - name: Show final build information
        run: |

          echo ""
          echo "=============================================="
          echo "       RKMS CONNECT FINAL ANDROID BUILD"
          echo "=============================================="
          echo ""

          echo "Android Version: 16"
          echo "API Level: 36"
          echo "JDK: 17"
          echo "Node.js: 22"

          echo ""
          echo "APK:"
          ls -lh android/app/build/outputs/apk/release/*.apk

          echo ""
          echo "AAB:"
          ls -lh android/app/build/outputs/bundle/release/*.aab

          echo ""
          echo "=============================================="

      # =========================================================
      # UPLOAD APK
      # =========================================================

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Android-16-API36-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # UPLOAD AAB
      # =========================================================

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Android-16-API36-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # RKMS NATIVE SETUP
      #
      # IMPORTANT:
      # Do NOT use the old "Repair native setup Python heredoc".
      # The old repair was putting Bash commands into Python.
      #
      # We repair only the known broken DRAWABLE section here,
      # then validate Bash syntax before executing the script.
      # ============================================================

      - name: Fix RKMS native setup script
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          SCRIPT="scripts/setup-android-native.sh"

          test -s "$SCRIPT"

          echo "Preparing RKMS native setup script..."

          cp "$SCRIPT" "$SCRIPT.before-fix"

          python3 - "$SCRIPT" <<'PY'
          from pathlib import Path
          import sys
          import re

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          # --------------------------------------------------------
          # Fix the exact broken pattern:
          #
          # python3 <<'PY3'
          # ...
          # DRAWABLE_DIR=...
          # mkdir -p "$DRAWABLE_DIR"
          #
          # Bash commands must not be inside Python.
          # --------------------------------------------------------

          bad_start = re.compile(
              r'python3\s+-\s+<<[\'"]?PY3[\'"]?',
              re.MULTILINE
          )

          lines = text.splitlines()

          output = []
          i = 0

          while i < len(lines):

              line = lines[i]

              # Detect a Python heredoc.
              if bad_start.search(line):

                  block_start = i
                  j = i + 1

                  while j < len(lines):

                      if re.match(
                          r'^\s*PY3\s*$',
                          lines[j]
                      ):
                          break

                      j += 1

                  if j >= len(lines):

                      # Do not destroy an unclosed block.
                      output.append(line)
                      i += 1
                      continue

                  block = lines[i + 1:j]

                  shell_index = None

                  shell_patterns = (
                      'DRAWABLE_DIR=',
                      'mkdir -p ',
                      'cat > ',
                      'cat >> ',
                      'cp ',
                      'chmod ',
                      'find ',
                      'grep ',
                      'test ',
                  )

                  for n, bline in enumerate(block):

                      stripped = bline.strip()

                      if any(
                          stripped.startswith(p)
                          for p in shell_patterns
                      ):
                          shell_index = n
                          break

                  if shell_index is not None:

                      # Keep the Python part before the accidental
                      # Bash command.
                      python_part = block[:shell_index]

                      output.append(
                          "python3 - <<'PY3'"
                      )

                      output.extend(
                          python_part
                      )

                      output.append(
                          "PY3"
                      )

                      # Move the accidental Bash section outside.
                      output.extend(
                          block[shell_index:]
                      )

                      output.append(
                          "PY3"
                      )

                      i = j + 1
                      continue

              output.append(line)

              i += 1

          fixed = "\n".join(output) + "\n"

          # --------------------------------------------------------
          # Explicitly ensure the drawable commands are outside
          # Python blocks.
          # --------------------------------------------------------

          if (
              'DRAWABLE_DIR="$RES_DIR/drawable"' in fixed
              and
              'mkdir -p "$DRAWABLE_DIR"' in fixed
          ):
              pass
          else:
              raise SystemExit(
                  "RKMS native script drawable section missing"
              )

          # --------------------------------------------------------
          # Remove literal backslash-n corruption.
          # --------------------------------------------------------

          if "\\n" in fixed:
              print(
                  "WARNING: literal \\\\n found; "
                  "leaving source unchanged for safety."
              )

          path.write_text(
              fixed,
              encoding="utf-8"
          )

          print(
              "RKMS native script repair completed."
          )
          PY

          echo "Checking Bash syntax..."

          bash -n "$SCRIPT"

          echo "BASH SYNTAX: PASS"


      # ============================================================
      # VERIFY NATIVE SCRIPT BEFORE EXECUTION
      # ============================================================

      - name: Verify RKMS native setup script
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          SCRIPT="scripts/setup-android-native.sh"

          test -s "$SCRIPT"

          bash -n "$SCRIPT"

          # The drawable command must exist.
          grep -Fq \
            'DRAWABLE_DIR="$RES_DIR/drawable"' \
            "$SCRIPT"

          grep -Fq \
            'mkdir -p "$DRAWABLE_DIR"' \
            "$SCRIPT"

          grep -Fq \
            'ic_stat_rkms.xml' \
            "$SCRIPT"

          # The old malformed Python/Bash combination must not
          # remain around the drawable creation.
          python3 - "$SCRIPT" <<'PY'
          from pathlib import Path
          import sys
          import re

          p = Path(sys.argv[1])
          text = p.read_text(encoding="utf-8")

          lines = text.splitlines()

          in_python = False

          for number, line in enumerate(lines, 1):

              if re.match(
                  r'^\s*python3\s+-\s+<<[\'"]?PY3[\'"]?\s*$',
                  line
              ):
                  in_python = True
                  continue

              if in_python and re.match(
                  r'^\s*PY3\s*$',
                  line
              ):
                  in_python = False
                  continue

              if in_python:

                  stripped = line.strip()

                  if (
                      stripped.startswith("mkdir -p ")
                      or stripped.startswith("DRAWABLE_DIR=")
                      or stripped.startswith("cp ")
                      or stripped.startswith("chmod ")
                  ):
                      raise SystemExit(
                          "ERROR: Bash command found inside Python heredoc "
                          f"at line {number}: {stripped}"
                      )

          if in_python:
              raise SystemExit(
                  "ERROR: Unclosed Python heredoc found."
              )

          print(
              "PYTHON/BASH HEREDOC CHECK: PASS"
          )
          PY

          echo "RKMS NATIVE SCRIPT VERIFICATION: PASS"


      # ============================================================
      # APPLY RKMS NATIVE ANDROID SETUP
      # ============================================================

      - name: Apply RKMS native Android setup
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          SCRIPT="scripts/setup-android-native.sh"

          chmod +x "$SCRIPT"

          bash -n "$SCRIPT"

          echo "Running RKMS native Android setup..."

          ./"$SCRIPT"

          test -s \
            android/app/google-services.json

          MAIN_ACTIVITY="$(
            find android/app/src/main \
              -type f \
              -name "MainActivity.java" \
              -print \
              -quit
          )"

          BRIDGE_FILE="$(
            find android/app/src/main \
              -type f \
              -name "RKMSNativeBridge.java" \
              -print \
              -quit
          )"

          test -n "$MAIN_ACTIVITY"
          test -n "$BRIDGE_FILE"

          test -s "$MAIN_ACTIVITY"
          test -s "$BRIDGE_FILE"

          grep -Fq \
            'FirebaseApp.initializeApp(this)' \
            "$MAIN_ACTIVITY"

          grep -Fq \
            'RKMSNativeBridge' \
            "$MAIN_ACTIVITY"

          echo "RKMS NATIVE SETUP: PASS"


      # ============================================================
      # VERIFY GENERATED MAIN ACTIVITY
      # ============================================================

      - name: Verify generated MainActivity
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          MAIN_ACTIVITY="$(
            find android/app/src/main \
              -type f \
              -name "MainActivity.java" \
              -print \
              -quit
          )"

          test -n "$MAIN_ACTIVITY"
          test -s "$MAIN_ACTIVITY"

          if grep -Fq '\n' "$MAIN_ACTIVITY"; then

            echo "::error::Literal backslash-n found in MainActivity.java."

            exit 1

          fi

          grep -Fq \
            'onNewIntent' \
            "$MAIN_ACTIVITY"

          grep -Fq \
            'FirebaseApp.initializeApp(this)' \
            "$MAIN_ACTIVITY"

          grep -Fq \
            'RKMSNativeBridge' \
            "$MAIN_ACTIVITY"

          echo "MAINACTIVITY GENERATION: PASS"


      # ============================================================
      # VERIFY NOTIFICATION CHANNELS
      # ============================================================

      - name: Verify notification priority channels
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          grep -Fq \
            "rkms_notifications_v2" \
            scripts/setup-android-native.sh

          grep -Fq \
            "rkms_priority_v1" \
            scripts/setup-android-native.sh

          grep -Fq \
            "rkms_notifications_v2" \
            app.js

          grep -Fq \
            "rkms_priority_v1" \
            app.js

          grep -Fq \
            "IMPORTANCE_HIGH" \
            scripts/setup-android-native.sh

          grep -Fq \
            "setSound" \
            scripts/setup-android-native.sh

          grep -Fq \
            "vibration" \
            scripts/setup-android-native.sh

          echo "NOTIFICATION CHANNELS: PASS"


      # ============================================================
      # FIREBASE MESSAGING SDK
      # ============================================================

      - name: Ensure Firebase Messaging SDK
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "android/app/build.gradle"
          )

          s = p.read_text(
              encoding="utf-8"
          )

          bom = (
              "implementation platform("
              "'com.google.firebase:firebase-bom:33.9.0'"
              ")"
          )

          messaging = (
              "implementation "
              "'com.google.firebase:firebase-messaging'"
          )

          match = re.search(
              r"(?m)^[ \t]*dependencies[ \t]*\{",
              s
          )

          if not match:
              raise SystemExit(
                  "dependencies block not found"
              )

          start = match.end()

          depth = 1
          pos = start

          while pos < len(s) and depth:

              if s[pos] == "{":
                  depth += 1

              elif s[pos] == "}":
                  depth -= 1

              pos += 1

          if depth != 0:
              raise SystemExit(
                  "Malformed dependencies block"
              )

          end = pos - 1

          block = s[start:end]

          if (
              "com.google.firebase:firebase-bom:"
              not in block
          ):
              block = (
                  "\n    "
                  + bom
                  + "\n"
                  + block
              )

          if (
              "com.google.firebase:firebase-messaging"
              not in block
          ):
              block += (
                  "\n    "
                  + messaging
                  + "\n"
              )

          p.write_text(
              s[:start]
              + block
              + s[end:],
              encoding="utf-8"
          )
          PY

          grep -Fq \
            'com.google.firebase:firebase-bom:33.9.0' \
            android/app/build.gradle

          grep -Fq \
            'com.google.firebase:firebase-messaging' \
            android/app/build.gradle

          echo "FIREBASE MESSAGING SDK: PASS"


      # ============================================================
      # STATIC AUDITS
      # ============================================================

      - name: Run complete RKMS static audits
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          if [ -f scripts/verify-android-16.py ]; then
            python3 scripts/verify-android-16.py
          fi

          if [ -f scripts/verify-rkms-final-fixes.py ]; then
            python3 scripts/verify-rkms-final-fixes.py
          fi

          python3 \
            scripts/verify-fcm-pipeline.py

          python3 \
            scripts/verify-native-bridge.py

          if [ -f scripts/verify-android-pdf.py ]; then
            python3 scripts/verify-android-pdf.py
          fi

          if [ -f scripts/verify-saved-login.py ]; then
            python3 scripts/verify-saved-login.py
          fi

          echo "=========================================="
          echo "ALL RKMS STATIC AUDITS: PASS"
          echo "=========================================="


      # ============================================================
      # SIGNING SECRETS
      # ============================================================

      - name: Verify release signing secrets
        shell: bash
        run: |
          set -euo pipefail

          test -n \
            "${RKMS_KEYSTORE_BASE64:-}" || {
              echo "::error::RKMS_KEYSTORE_BASE64 secret missing."
              exit 1
            }

          test -n \
            "${RKMS_KEYSTORE_PASSWORD:-}" || {
              echo "::error::RKMS_KEYSTORE_PASSWORD secret missing."
              exit 1
            }

          test -n \
            "${RKMS_KEY_ALIAS:-}" || {
              echo "::error::RKMS_KEY_ALIAS secret missing."
              exit 1
            }

          test -n \
            "${RKMS_KEY_PASSWORD:-}" || {
              echo "::error::RKMS_KEY_PASSWORD secret missing."
              exit 1
            }

          echo "RELEASE SIGNING SECRETS: PASS"


      # ============================================================
      # RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/configure-release-signing.sh

          ./scripts/configure-release-signing.sh

          test -s \
            android/app/release.keystore

          grep -Fq \
            'storeFile file("release.keystore")' \
            android/app/build.gradle

          grep -Fq \
            'signingConfig signingConfigs.release' \
            android/app/build.gradle

          echo "RELEASE SIGNING CONFIGURATION: PASS"


      # ============================================================
      # VERIFY KEYSTORE
      # ============================================================

      - name: Verify release keystore
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          keytool \
            -list \
            -keystore android/app/release.keystore \
            -storepass "$RKMS_KEYSTORE_PASSWORD" \
            -alias "$RKMS_KEY_ALIAS" \
            >/dev/null

          echo "KEYSTORE VALIDATION: PASS"


      # ============================================================
      # GRADLE WRAPPER
      # ============================================================

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          chmod +x gradlew

          ./gradlew \
            --version \
            --no-daemon

          echo "GRADLE WRAPPER: PASS"


      # ============================================================
      # CLEAN
      # ============================================================

      - name: Clean Android build
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          ./gradlew \
            clean \
            --no-daemon

          echo "GRADLE CLEAN: PASS"


      # ============================================================
      # FINAL ANDROID 16 API 36 AUDIT
      # ============================================================

      - name: Final Android 16 API 36 audit
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          grep -Eq \
            'compileSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

          grep -Eq \
            'targetSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

          grep -Eq \
            'minSdkVersion[[:space:]]*=[[:space:]]*23' \
            android/variables.gradle

          grep -Fq \
            'com.android.tools.build:gradle:8.9.1' \
            android/build.gradle

          grep -Fq \
            'gradle-8.11.1-bin.zip' \
            android/gradle/wrapper/gradle-wrapper.properties

          echo "ANDROID 16 API 36 FINAL AUDIT: PASS"


      # ============================================================
      # BUILD FINAL SIGNED RELEASE APK ONLY
      # ============================================================

      - name: Build final signed release APK only
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          rm -rf \
            app/build/outputs/apk/release

          rm -rf \
            app/build/outputs/bundle

          echo "=========================================="
          echo "BUILDING FINAL SIGNED RELEASE APK"
          echo "=========================================="

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          EXPECTED_APK="$RKMS_ROOT/android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$EXPECTED_APK" ]; then

            echo "::error::Release APK was not created."

            find "$RKMS_ROOT/android" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1

          fi

          test -s "$EXPECTED_APK"

          FINAL_APK="$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"

          cp \
            "$EXPECTED_APK" \
            "$FINAL_APK"

          test -s "$FINAL_APK"

          echo "APK_PATH=$FINAL_APK" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "FINAL RELEASE APK CREATED"
          echo "=========================================="

          stat -c%s "$FINAL_APK"


      # ============================================================
      # NO DEBUG APK
      # ============================================================

      - name: Verify no debug APK
        shell: bash
        run: |
          set -euo pipefail

          if find "$RKMS_ROOT/android" \
            -type f \
            -iname "*debug*.apk" \
            -print \
            -quit |
            grep -q .
          then

            echo "::error::Debug APK detected."

            find "$RKMS_ROOT/android" \
              -type f \
              -iname "*debug*.apk" \
              -print

            exit 1

          fi

          echo "DEBUG APK: NONE"


      # ============================================================
      # NO AAB
      # ============================================================

      - name: Verify no AAB
        shell: bash
        run: |
          set -euo pipefail

          if find "$RKMS_ROOT/android" \
            -type f \
            -name "*.aab" \
            -print \
            -quit |
            grep -q .
          then

            echo "::error::AAB detected."

            find "$RKMS_ROOT/android" \
              -type f \
              -name "*.aab" \
              -print

            exit 1

          fi

          echo "AAB: NONE"


      # ============================================================
      # VERIFY APK
      # ============================================================

      - name: Verify final APK package and SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          test -n "$SDK_ROOT"

          AAPT="$SDK_ROOT/build-tools/$BUILD_TOOLS/aapt"

          test -x "$AAPT"

          "$AAPT" \
            dump badging \
            "$APK_PATH" \
            > apk-badging.txt

          cat apk-badging.txt

          grep -Fq \
            "package: name='$APP_ID'" \
            apk-badging.txt

          grep -Fq \
            "targetSdkVersion:'36'" \
            apk-badging.txt

          echo "APK PACKAGE: PASS"
          echo "TARGET SDK 36: PASS"


      # ============================================================
      # VERIFY SIGNATURE
      # ============================================================

      - name: Verify final APK signature
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          APKSIGNER="$SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner"

          test -x "$APKSIGNER"

          "$APKSIGNER" \
            verify \
            --verbose \
            "$APK_PATH"

          "$APKSIGNER" \
            verify \
            --print-certs \
            "$APK_PATH"

          echo "APK SIGNATURE: PASS"


      # ============================================================
      # SHA256
      # ============================================================

      - name: Generate APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            "$APK_PATH" \
            > "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256"

          cat \
            "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256"

          echo "APK SHA256: PASS"


      # ============================================================
      # FINAL APK ONLY AUDIT
      # ============================================================

      - name: Final APK-only audit
        shell: bash
        run: |
          set -euo pipefail

          test -s "$APK_PATH"

          test -s \
            "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256"

          SIZE="$(
            stat -c%s "$APK_PATH"
          )"

          if [ "$SIZE" -lt 1000000 ]; then

            echo "::error::APK size is unexpectedly small."

            exit 1

          fi

          if find "$RKMS_ROOT/android" \
            -type f \
            -name "*.aab" \
            -print \
            -quit |
            grep -q .
          then

            echo "::error::AAB output detected."

            exit 1

          fi

          if find "$RKMS_ROOT/android" \
            -type f \
            -iname "*debug*.apk" \
            -print \
            -quit |
            grep -q .
          then

            echo "::error::Debug APK output detected."

            exit 1

          fi

          echo "=========================================="
          echo "FINAL APK-ONLY AUDIT: PASS"
          echo "=========================================="

          echo "APK:"
          echo "$APK_PATH"

          echo "SIZE:"
          echo "$SIZE bytes"

          echo "SHA256:"

          cat \
            "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256"


      # ============================================================
      # UPLOAD ONLY FINAL RELEASE APK
      # ============================================================

      - name: Upload final signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS_ANDROID16_API36_FINAL_SIGNED_RELEASE_APK
          if-no-files-found: error
          path: |
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256
          retention-days: 30

name: RKMS Final Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  AGP_VERSION: "8.9.1"
  GRADLE_VERSION: "8.11.1"
  APP_ID: "org.rkms.connect"

  # IMPORTANT:
  # This is the exact ZIP filename currently present in the repository.
  SOURCE_ZIP: "RKMS_CONNECT_NOTIFICATION_SYSTEM_FULL_FIX_20260923_AUDITED_FIXED.zip"

jobs:
  build-release-apk:
    name: Build Signed Release APK
    runs-on: ubuntu-24.04

    steps:

      # ------------------------------------------------------------
      # 1. CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ------------------------------------------------------------
      # 2. JAVA
      # ------------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      # ------------------------------------------------------------
      # 3. NODE
      # ------------------------------------------------------------
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # ------------------------------------------------------------
      # 4. ANDROID SDK
      # ------------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "Android SDK installed successfully."
          sdkmanager --list_installed | grep -E \
            "platforms;android-${ANDROID_API}|build-tools;${BUILD_TOOLS}|platform-tools" \
            || true

      # ------------------------------------------------------------
      # 5. LOCATE EXACT SOURCE ZIP
      # ------------------------------------------------------------
      - name: Locate RKMS source ZIP
        id: locate_zip
        shell: bash
        run: |
          set -euo pipefail

          echo "Looking for:"
          echo "${SOURCE_ZIP}"
          echo

          ZIP_PATH="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "${SOURCE_ZIP}" \
            -print -quit)"

          if [ -z "${ZIP_PATH}" ]; then
            echo "ERROR: Configured source ZIP was not found:"
            echo "${SOURCE_ZIP}"
            echo
            echo "Available ZIP files:"
            find "$GITHUB_WORKSPACE" \
              -type f \
              \( -iname "*.zip" -o -iname "*.ZIP" \) \
              -print \
              | sort

            exit 1
          fi

          echo "Source ZIP found:"
          echo "${ZIP_PATH}"

          echo "zip_path=${ZIP_PATH}" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 6. EXTRACT SOURCE
      # ------------------------------------------------------------
      - name: Extract RKMS source
        shell: bash
        env:
          ZIP_PATH: ${{ steps.locate_zip.outputs.zip_path }}
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/rkms-extract"
          rm -rf "$RUNNER_TEMP/rkms-source"

          mkdir -p \
            "$RUNNER_TEMP/rkms-extract" \
            "$RUNNER_TEMP/rkms-source"

          unzip -q "$ZIP_PATH" -d "$RUNNER_TEMP/rkms-extract"

          echo "Extracted ZIP:"
          find "$RUNNER_TEMP/rkms-extract" \
            -maxdepth 3 \
            -type f \
            -name "package.json" \
            -print

          PACKAGE_JSON="$(find "$RUNNER_TEMP/rkms-extract" \
            -type f \
            -name "package.json" \
            -print -quit)"

          if [ -z "${PACKAGE_JSON}" ]; then
            echo "ERROR: package.json was not found inside source ZIP."
            exit 1
          fi

          SOURCE_ROOT="$(dirname "$PACKAGE_JSON")"

          echo "Actual source root:"
          echo "${SOURCE_ROOT}"

          cp -a "${SOURCE_ROOT}/." "$RUNNER_TEMP/rkms-source/"

          echo
          echo "Source files:"
          find "$RUNNER_TEMP/rkms-source" \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -200

      # ------------------------------------------------------------
      # 7. VERIFY REQUIRED SOURCE FILES
      # ------------------------------------------------------------
      - name: Verify RKMS source files
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "package.json"
            "package-lock.json"
            "app.js"
            "index.html"
            "styles.css"
            "capacitor.config.json"
            "google-services.json"
            "scripts/setup-android-native.sh"
            "scripts/configure-android-16.sh"
            "scripts/configure-release-signing.sh"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing required source file: $file"
              exit 1
            fi
          done

          echo "All required RKMS source files: PASS"

      # ------------------------------------------------------------
      # 8. VERIFY PACKAGE VERSIONS
      # ------------------------------------------------------------
      - name: Verify Capacitor package versions
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");

          const p = JSON.parse(fs.readFileSync("package.json", "utf8"));

          const expected = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          const actual = {
            ...(p.dependencies || {}),
            ...(p.devDependencies || {})
          };

          let failed = false;

          for (const [name, version] of Object.entries(expected)) {
            if (actual[name] !== version) {
              console.error(
                `FAIL: ${name}: expected ${version}, found ${actual[name] || "missing"}`
              );
              failed = true;
            } else {
              console.log(`PASS: ${name} ${version}`);
            }
          }

          if (failed) process.exit(1);

          console.log("Capacitor package version verification: PASS");
          NODE

      # ------------------------------------------------------------
      # 9. VERIFY CAPACITOR CONFIG
      # ------------------------------------------------------------
      - name: Verify Capacitor configuration
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");

          const c = JSON.parse(
            fs.readFileSync("capacitor.config.json", "utf8")
          );

          if (c.appId !== "org.rkms.connect") {
            throw new Error(`Wrong appId: ${c.appId}`);
          }

          if (c.webDir !== "dist") {
            throw new Error(`Wrong webDir: ${c.webDir}`);
          }

          console.log("Capacitor appId: PASS");
          console.log("Capacitor webDir: PASS");
          NODE

      # ------------------------------------------------------------
      # 10. VERIFY FIREBASE
      # ------------------------------------------------------------
      - name: Verify Firebase configuration
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync("google-services.json", "utf8")
          );

          const clients = data.client || [];

          const packages = clients.map(
            c =>
              c?.client_info?.android_client_info?.package_name || ""
          );

          console.log("Firebase Android packages:", packages);

          if (!packages.includes("org.rkms.connect")) {
            throw new Error(
              "google-services.json does not contain org.rkms.connect"
            );
          }

          console.log("Firebase package verification: PASS");
          NODE

      # ------------------------------------------------------------
      # 11. VERIFY FCM SOURCE
      # ------------------------------------------------------------
      - name: Verify FCM notification source
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-fcm-pipeline.py

      # ------------------------------------------------------------
      # 12. VERIFY SAVED LOGIN
      # ------------------------------------------------------------
      - name: Verify saved login
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-saved-login.py

      # ------------------------------------------------------------
      # 13. VERIFY NATIVE BRIDGE SOURCE
      # ------------------------------------------------------------
      - name: Verify native bridge source
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-native-bridge.py

      # ------------------------------------------------------------
      # 14. VERIFY RKMS FINAL SOURCE
      # ------------------------------------------------------------
      - name: Verify audited RKMS source
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-rkms-final.py

      # ------------------------------------------------------------
      # 15. VERIFY CHAT / MIC / GROUP / DIGITAL ID
      # ------------------------------------------------------------
      - name: Verify chat microphone and final fixes
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-chat-mic-final.py
          python3 scripts/verify-final-three-point-fix.py

      # ------------------------------------------------------------
      # 16. INSTALL NPM DEPENDENCIES
      # ------------------------------------------------------------
      - name: Install npm dependencies
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          npm ci --no-audit --no-fund

          echo "npm dependencies installed successfully."

      # ------------------------------------------------------------
      # 17. VERIFY INSTALLED CAPACITOR FCM
      # ------------------------------------------------------------
      - name: Verify installed Capacitor FCM plugin
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          node -e '
          const p=require("./node_modules/@capacitor/push-notifications/package.json");
          console.log("Installed push notifications:", p.version);
          if(p.version !== "6.0.3") process.exit(1);
          '

      # ------------------------------------------------------------
      # 18. BUILD WEB APPLICATION
      # ------------------------------------------------------------
      - name: Build web application
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          npm run build

          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory was not generated."
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html missing."
            exit 1
          fi

          echo "Web application build: PASS"

      # ------------------------------------------------------------
      # 19. REMOVE ANY OLD ANDROID PROJECT
      # ------------------------------------------------------------
      - name: Prepare clean Android project
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android

          echo "Old Android project removed."

      # ------------------------------------------------------------
      # 20. GENERATE FRESH CAPACITOR ANDROID PROJECT
      # ------------------------------------------------------------
      - name: Generate fresh Android project
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          npx cap add android

          if [ ! -d "android" ]; then
            echo "ERROR: Capacitor Android project was not generated."
            exit 1
          fi

          echo "Fresh Capacitor Android project: PASS"

      # ------------------------------------------------------------
      # 21. CONFIGURE ANDROID 16 / API 36
      # ------------------------------------------------------------
      - name: Configure Android 16 API 36
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/configure-android-16.sh
          bash scripts/configure-android-16.sh

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/variables.gradle")
          s = p.read_text()

          s = re.sub(
              r"(\bcompileSdkVersion\s*=\s*)\d+",
              r"\g<1>36",
              s
          )

          s = re.sub(
              r"(\btargetSdkVersion\s*=\s*)\d+",
              r"\g<1>36",
              s
          )

          s = re.sub(
              r"(\bminSdkVersion\s*=\s*)\d+",
              r"\g<1>23",
              s
          )

          p.write_text(s)

          print("Android SDK versions forced:")
          print("compileSdkVersion=36")
          print("targetSdkVersion=36")
          print("minSdkVersion=23")
          PY

      # ------------------------------------------------------------
      # 22. VERIFY ANDROID CONFIG
      # ------------------------------------------------------------
      - name: Verify Android 16 configuration
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          grep -q "compileSdkVersion = 36" android/variables.gradle
          grep -q "targetSdkVersion = 36" android/variables.gradle
          grep -q "minSdkVersion = 23" android/variables.gradle
          grep -q "com.android.tools.build:gradle:8.9.1" android/build.gradle
          grep -q "gradle-8.11.1-bin.zip" \
            android/gradle/wrapper/gradle-wrapper.properties

          echo "Android 16 API 36 configuration: PASS"

      # ------------------------------------------------------------
      # 23. CAPACITOR SYNC
      # ------------------------------------------------------------
      - name: Sync Capacitor Android project
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          npx cap sync android

          echo "Capacitor Android sync: PASS"

      # ------------------------------------------------------------
      # 24. RE-ENFORCE MIN SDK AFTER SYNC
      # ------------------------------------------------------------
      - name: Enforce Android minimum SDK 23
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/variables.gradle")

          if not p.exists():
              raise SystemExit("android/variables.gradle missing")

          s = p.read_text()

          s = re.sub(
              r"(\bminSdkVersion\s*=\s*)\d+",
              r"\g<1>23",
              s
          )

          s = re.sub(
              r"(\bcompileSdkVersion\s*=\s*)\d+",
              r"\g<1>36",
              s
          )

          s = re.sub(
              r"(\btargetSdkVersion\s*=\s*)\d+",
              r"\g<1>36",
              s
          )

          p.write_text(s)
          PY

          grep -q "minSdkVersion = 23" android/variables.gradle
          grep -q "compileSdkVersion = 36" android/variables.gradle
          grep -q "targetSdkVersion = 36" android/variables.gradle

          echo "SDK enforcement after Capacitor sync: PASS"

      # ------------------------------------------------------------
      # 25. APPLY RKMS NATIVE ANDROID FIXES
      # ------------------------------------------------------------
      - name: Apply RKMS native Android setup
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/setup-android-native.sh
          bash scripts/setup-android-native.sh

          echo "RKMS native Android setup: PASS"

      # ------------------------------------------------------------
      # 26. VERIFY MAIN ACTIVITY NATIVE BRIDGE
      # ------------------------------------------------------------
      - name: Verify MainActivity native bridge
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          MAIN_ACTIVITY="$(find android/app/src/main \
            -type f \
            -name "MainActivity.java" \
            -print -quit)"

          if [ -z "${MAIN_ACTIVITY}" ]; then
            echo "ERROR: MainActivity.java not found."
            exit 1
          fi

          echo "MainActivity:"
          echo "${MAIN_ACTIVITY}"

          grep -q "RKMSNativeBridge" "$MAIN_ACTIVITY"
          grep -q "FirebaseApp.initializeApp(this)" "$MAIN_ACTIVITY"
          grep -q "onNewIntent" "$MAIN_ACTIVITY"
          grep -q "rkmsDispatchNotificationRoute" "$MAIN_ACTIVITY"

          echo "MainActivity native notification bridge: PASS"

      # ------------------------------------------------------------
      # 27. VERIFY GOOGLE SERVICES
      # ------------------------------------------------------------
      - name: Verify Android Firebase file
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          test -f android/app/google-services.json

          grep -q '"package_name": "org.rkms.connect"' \
            android/app/google-services.json

          echo "Android Firebase configuration: PASS"

      # ------------------------------------------------------------
      # 28. ENSURE FIREBASE MESSAGING DEPENDENCY
      # ------------------------------------------------------------
      - name: Ensure Firebase Messaging dependency
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          dependency = (
              'implementation "com.google.firebase:firebase-messaging:25.0.1"'
          )

          if "com.google.firebase:firebase-messaging:" not in s:
              marker = "dependencies {"

              if marker not in s:
                  raise SystemExit(
                      "ERROR: dependencies block missing in app/build.gradle"
                  )

              s = s.replace(
                  marker,
                  marker + "\n    " + dependency,
                  1
              )

              p.write_text(s)

          print("Firebase Messaging dependency: PASS")
          PY

      # ------------------------------------------------------------
      # 29. RESOLVE FIREBASE DEPENDENCIES
      # ------------------------------------------------------------
      - name: Resolve Firebase dependencies
        working-directory: ${{ runner.temp }}/rkms-source/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:dependencies \
            --configuration releaseRuntimeClasspath \
            >/tmp/rkms-release-dependencies.log

          grep -q "firebase-messaging" \
            /tmp/rkms-release-dependencies.log

          echo "Firebase dependency resolution: PASS"

      # ------------------------------------------------------------
      # 30. RUN FINAL STATIC AUDITS
      # ------------------------------------------------------------
      - name: Run final source audits
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-fcm-pipeline.py
          python3 scripts/verify-saved-login.py
          python3 scripts/verify-native-bridge.py
          python3 scripts/verify-rkms-final.py
          python3 scripts/verify-chat-mic-final.py
          python3 scripts/verify-final-three-point-fix.py
          python3 scripts/verify-android-16.py

          echo
          echo "ALL FINAL STATIC AUDITS: PASS"

      # ------------------------------------------------------------
      # 31. VERIFY RELEASE SIGNING SECRETS
      # ------------------------------------------------------------
      - name: Verify release signing secrets
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          MISSING=0

          if [ -z "${RKMS_KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: RKMS_KEYSTORE_BASE64 secret missing."
            MISSING=1
          fi

          if [ -z "${RKMS_KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: RKMS_KEYSTORE_PASSWORD secret missing."
            MISSING=1
          fi

          if [ -z "${RKMS_KEY_ALIAS:-}" ]; then
            echo "ERROR: RKMS_KEY_ALIAS secret missing."
            MISSING=1
          fi

          if [ -z "${RKMS_KEY_PASSWORD:-}" ]; then
            echo "ERROR: RKMS_KEY_PASSWORD secret missing."
            MISSING=1
          fi

          if [ "$MISSING" -ne 0 ]; then
            exit 1
          fi

          echo "Release signing secrets: PRESENT"

      # ------------------------------------------------------------
      # 32. CONFIGURE RELEASE SIGNING
      # ------------------------------------------------------------
      - name: Configure release signing
        working-directory: ${{ runner.temp }}/rkms-source
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/configure-release-signing.sh

          bash scripts/configure-release-signing.sh

          if [ ! -f android/app/release.keystore ]; then
            echo "ERROR: release.keystore was not created."
            exit 1
          fi

          grep -q "signingConfigs.release" \
            android/app/build.gradle

          grep -q "signingConfig signingConfigs.release" \
            android/app/build.gradle

          echo "Release signing configuration: PASS"

      # ------------------------------------------------------------
      # 33. VALIDATE KEYSTORE
      # ------------------------------------------------------------
      - name: Validate release keystore
        working-directory: ${{ runner.temp }}/rkms-source
        env:
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail

          keytool \
            -list \
            -keystore android/app/release.keystore \
            -storepass "$RKMS_KEYSTORE_PASSWORD" \
            -alias "$RKMS_KEY_ALIAS" \
            >/tmp/rkms-keystore.txt

          grep -q "PrivateKeyEntry" /tmp/rkms-keystore.txt

          echo "Release keystore validation: PASS"

      # ------------------------------------------------------------
      # 34. VERIFY GRADLE WRAPPER
      # ------------------------------------------------------------
      - name: Verify Gradle wrapper
        working-directory: ${{ runner.temp }}/rkms-source/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          grep -q \
            "gradle-8.11.1-bin.zip" \
            gradle/wrapper/gradle-wrapper.properties

          ./gradlew --version

      # ------------------------------------------------------------
      # 35. VERIFY FIREBASE GOOGLE SERVICES PLUGIN
      # ------------------------------------------------------------
      - name: Verify Google Services Gradle plugin
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          grep -q \
            "com.google.gms:google-services:4.4.3" \
            android/build.gradle

          grep -q \
            "com.google.gms.google-services" \
            android/app/build.gradle

          echo "Google Services Gradle plugin: PASS"

      # ------------------------------------------------------------
      # 36. VERIFY RELEASE CONFIG
      # ------------------------------------------------------------
      - name: Verify release Android configuration
        working-directory: ${{ runner.temp }}/rkms-source
        shell: bash
        run: |
          set -euo pipefail

          grep -q "compileSdkVersion = 36" android/variables.gradle
          grep -q "targetSdkVersion = 36" android/variables.gradle
          grep -q "minSdkVersion = 23" android/variables.gradle

          grep -q \
            "com.android.tools.build:gradle:8.9.1" \
            android/build.gradle

          grep -q \
            "gradle-8.11.1-bin.zip" \
            android/gradle/wrapper/gradle-wrapper.properties

          grep -q \
            "signingConfig signingConfigs.release" \
            android/app/build.gradle

          echo "Release Android configuration: PASS"

      # ------------------------------------------------------------
      # 37. COMPILE JAVA / MANIFEST
      # ------------------------------------------------------------
      - name: Validate Android source before release build
        working-directory: ${{ runner.temp }}/rkms-source/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:compileReleaseJavaWithJavac \
            :app:processReleaseMainManifest

          echo "Android Java + Manifest validation: PASS"

      # ------------------------------------------------------------
      # 38. CLEAN RELEASE BUILD
      # ------------------------------------------------------------
      - name: Clean Android release build
        working-directory: ${{ runner.temp }}/rkms-source/android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean

      # ------------------------------------------------------------
      # 39. BUILD ONLY SIGNED RELEASE APK
      # ------------------------------------------------------------
      - name: Build signed Release APK only
        working-directory: ${{ runner.temp }}/rkms-source/android
        shell: bash
        env:
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleRelease

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Signed Release APK was not generated."
            find app/build/outputs -type f -print || true
            exit 1
          fi

          echo "Signed Release APK generated:"
          ls -lh "$APK"

      # ------------------------------------------------------------
      # 40. VERIFY ONLY EXPECTED APK OUTPUT
      # ------------------------------------------------------------
      - name: Verify release APK output
        working-directory: ${{ runner.temp }}/rkms-source/android
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

          echo "Release APK:"
          ls -lh "$APK"

          echo
          echo "Checking for accidental AAB output..."

          if find app/build/outputs -type f \
            \( -name "*.aab" -o -name "*debug*.apk" \) \
            -print -quit \
            | grep -q .; then

            echo "ERROR: Debug APK or AAB output was generated."
            find app/build/outputs -type f -print
            exit 1
          fi

          echo "Only final Release APK output: PASS"

      # ------------------------------------------------------------
      # 41. VERIFY PACKAGE NAME
      # ------------------------------------------------------------
      - name: Verify APK package name
        working-directory: ${{ runner.temp }}/rkms-source/android
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt" \
            dump badging "$APK" \
            | grep -q "package: name='org.rkms.connect'"

          echo "APK package name org.rkms.connect: PASS"

      # ------------------------------------------------------------
      # 42. VERIFY APK SIGNATURE
      # ------------------------------------------------------------
      - name: Verify APK signature
        working-directory: ${{ runner.temp }}/rkms-source/android
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

          test -x "$APKSIGNER"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK" \
            | tee /tmp/rkms-apksigner.txt

          grep -q "Verified using v2 scheme: true" \
            /tmp/rkms-apksigner.txt

          grep -q "Signer #1 certificate SHA-256 digest:" \
            /tmp/rkms-apksigner.txt

          echo
          echo "SIGNED RELEASE APK SIGNATURE: PASS"

      # ------------------------------------------------------------
      # 43. APK SHA256
      # ------------------------------------------------------------
      - name: Generate APK SHA256
        working-directory: ${{ runner.temp }}/rkms-source/android
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          sha256sum "$APK" \
            | tee app-release.apk.sha256

          echo
          echo "APK SHA256 generated."

      # ------------------------------------------------------------
      # 44. FINAL APK AUDIT
      # ------------------------------------------------------------
      - name: Final APK audit
        working-directory: ${{ runner.temp }}/rkms-source/android
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          echo "=============================================="
          echo " RKMS FINAL SIGNED RELEASE APK"
          echo "=============================================="
          echo
          echo "Package:"
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt" \
            dump badging "$APK" \
            | grep "package:"
          echo
          echo "APK size:"
          ls -lh "$APK"
          echo
          echo "SHA256:"
          cat app-release.apk.sha256
          echo
          echo "=============================================="
          echo " FINAL APK AUDIT: PASS"
          echo "=============================================="

      # ------------------------------------------------------------
      # 45. COPY FINAL ARTIFACTS
      # ------------------------------------------------------------
      - name: Prepare final release artifacts
        working-directory: ${{ runner.temp }}/rkms-source/android
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/rkms-final-artifacts"
          mkdir -p "$RUNNER_TEMP/rkms-final-artifacts"

          cp \
            app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/rkms-final-artifacts/RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk"

          cp \
            app-release.apk.sha256 \
            "$RUNNER_TEMP/rkms-final-artifacts/RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk.sha256"

          ls -lh "$RUNNER_TEMP/rkms-final-artifacts"

      # ------------------------------------------------------------
      # 46. UPLOAD ONLY FINAL SIGNED RELEASE APK
      # ------------------------------------------------------------
      - name: Upload final signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-FINAL-SIGNED-RELEASE-APK
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/rkms-final-artifacts/RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk
            ${{ runner.temp }}/rkms-final-artifacts/RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk.sha256

      # ------------------------------------------------------------
      # 47. FINAL SUCCESS MESSAGE
      # ------------------------------------------------------------
      - name: Final build result
        shell: bash
        run: |
          echo
          echo "===================================================="
          echo " RKMS CONNECT FINAL RELEASE APK BUILD SUCCESS"
          echo "===================================================="
          echo
          echo "APK: SIGNED RELEASE ONLY"
          echo "AAB: NOT BUILT"
          echo "DEBUG APK: NOT BUILT"
          echo "Package: org.rkms.connect"
          echo "Android API: 36"
          echo "Build Tools: 36.0.0"
          echo "AGP: 8.9.1"
          echo "Gradle: 8.11.1"
          echo
          echo "Final APK is available in GitHub Actions Artifacts."
          echo "===================================================="

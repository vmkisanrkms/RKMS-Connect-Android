name: RKMS Android 16 API 36 - Final Signed Release APK Only

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  AGP_VERSION: "8.10.0"
  GRADLE_VERSION: "8.11.1"
  APP_ID: "org.rkms.connect"
  MIN_SDK: "23"
  TARGET_SDK: "36"

jobs:
  build:
    name: RKMS Final Signed Release APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ============================================================
      # FIND SOURCE ZIP
      # ============================================================

      - name: Find source ZIP
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP=""

          if [ -f "RKMS_CONNECT_FINAL_AUDITED_RELEASE_APK_BUILD_20260922.zip" ]; then
            SOURCE_ZIP="RKMS_CONNECT_FINAL_AUDITED_RELEASE_APK_BUILD_20260922.zip"
          fi

          if [ -z "${SOURCE_ZIP}" ]; then
            SOURCE_ZIP="$(
              find . \
                -maxdepth 3 \
                -type f \
                -name "*.zip" \
                -not -path "./.git/*" \
                -print \
                | sort \
                | head -n 1 || true
            )"
          fi

          if [ -z "${SOURCE_ZIP}" ]; then
            echo "::error::RKMS source ZIP not found."
            exit 1
          fi

          echo "SOURCE_ZIP=${SOURCE_ZIP}" >> "${GITHUB_ENV}"

          echo "Using:"
          echo "${SOURCE_ZIP}"

          echo "SHA256:"
          sha256sum "${SOURCE_ZIP}"

      # ============================================================
      # EXTRACT
      # ============================================================

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf rkms-build
          mkdir -p rkms-build

          unzip -q "${SOURCE_ZIP}" -d rkms-build

          echo "SOURCE EXTRACTION: PASS"

      # ============================================================
      # FIND PROJECT ROOT
      # ============================================================

      - name: Find RKMS project root
        shell: bash
        run: |
          set -euo pipefail

          ROOT=""

          if [ -f "rkms-build/package.json" ]; then
            ROOT="rkms-build"
          else
            FILE="$(
              find rkms-build \
                -type f \
                -name "package.json" \
                -not -path "*/node_modules/*" \
                -print \
                | head -n 1 || true
            )"

            if [ -n "${FILE}" ]; then
              ROOT="$(dirname "${FILE}")"
            fi
          fi

          if [ -z "${ROOT}" ]; then
            echo "::error::package.json not found."
            exit 1
          fi

          echo "RKMS_ROOT=${ROOT}" >> "${GITHUB_ENV}"

          echo "RKMS_ROOT=${ROOT}"

      # ============================================================
      # SOURCE CHECK
      # ============================================================

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          test -s package.json
          test -s google-services.json
          test -f scripts/setup-android-native.sh

          echo "SOURCE CHECK: PASS"

      # ============================================================
      # CAPACITOR CHECK
      # ============================================================

      - name: Verify Capacitor versions
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          node <<'NODE'
          const fs = require("fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const deps = {
            ...(pkg.dependencies || {}),
            ...(pkg.devDependencies || {})
          };

          const required = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          let failed = false;

          for (const [name, wanted] of Object.entries(required)) {
            const actual = deps[name];

            console.log(
              `${name}: ${actual || "MISSING"}`
            );

            if (!actual) {
              failed = true;
              continue;
            }

            if (
              actual !== wanted &&
              actual !== `^${wanted}` &&
              actual !== `~${wanted}`
            ) {
              console.error(
                `${name}: expected ${wanted}, found ${actual}`
              );
              failed = true;
            }
          }

          if (failed) {
            process.exit(1);
          }

          console.log("CAPACITOR CHECK: PASS");
          NODE

      # ============================================================
      # NPM
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

          echo "NPM INSTALL: PASS"

      # ============================================================
      # WEB BUILD
      # ============================================================

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          npm run build

          test -d dist
          test -s dist/index.html

          echo "WEB BUILD: PASS"

      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "${SDK}" ]; then
            echo "::error::Android SDK not found."
            exit 1
          fi

          SDKMANAGER="${SDK}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "${SDKMANAGER}" ]; then
            SDKMANAGER="$(
              find "${SDK}/cmdline-tools" \
                -type f \
                -name sdkmanager \
                -print \
                | head -n 1 || true
            )"
          fi

          if [ -z "${SDKMANAGER}" ]; then
            echo "::error::sdkmanager not found."
            exit 1
          fi

          yes | "${SDKMANAGER}" --licenses >/dev/null 2>&1 || true

          "${SDKMANAGER}" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          echo "ANDROID API 36: PASS"

      # ============================================================
      # CREATE ANDROID
      # ============================================================

      - name: Create Capacitor Android
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          rm -rf android

          npx cap add android

          test -d android
          test -f android/app/build.gradle
          test -f android/gradlew

          echo "CAPACITOR ANDROID: PASS"

      # ============================================================
      # ANDROID 16 / API 36
      # ============================================================

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          if [ -f scripts/configure-android-16.sh ]; then

            chmod +x scripts/configure-android-16.sh

            bash -n scripts/configure-android-16.sh

            ./scripts/configure-android-16.sh

          fi

          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"

          sed -i \
            -E \
            "s#distributionUrl=.*#distributionUrl=https\\\\://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip#g" \
            "${WRAPPER}"

          if [ -f android/variables.gradle ]; then

            sed -i \
              -E \
              's/(compileSdkVersion[[:space:]]*=[[:space:]]*)[0-9]+/\136/' \
              android/variables.gradle || true

            sed -i \
              -E \
              's/(targetSdkVersion[[:space:]]*=[[:space:]]*)[0-9]+/\136/' \
              android/variables.gradle || true

            sed -i \
              -E \
              's/(minSdkVersion[[:space:]]*=[[:space:]]*)[0-9]+/\123/' \
              android/variables.gradle || true

          fi

          echo "ANDROID 16/API 36 CONFIGURATION: PASS"

      # ============================================================
      # CAPACITOR SYNC
      # ============================================================

      - name: Capacitor sync
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          npx cap sync android

          echo "CAPACITOR SYNC: PASS"

      # ============================================================
      # FIX BROKEN setup-android-native.sh
      #
      # IMPORTANT:
      # No nested multiline replacement.
      # Therefore YAML remains valid.
      # ============================================================

      - name: Repair native setup script
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          SCRIPT="scripts/setup-android-native.sh"

          test -f "${SCRIPT}"

          python3 - "${SCRIPT}" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])

          text = path.read_text(
              encoding="utf-8"
          )

          start_marker = (
              "python3 - <<'PY3'\n"
              "from pathlib import Path\n"
              "# Stable white notification icon"
          )

          if start_marker not in text:
              print(
                  "Broken heredoc block not found."
              )
              print(
                  "Native script already appears repaired."
              )
              raise SystemExit(0)

          start = text.index(
              start_marker
          )

          end_marker = "\nPY3\n\n\nMAIN="

          end = text.find(
              end_marker,
              start
          )

          if end < 0:
              raise SystemExit(
                  "Could not find broken block ending."
              )

          replacement_lines = [
              "# Stable white notification icon for FCM system notifications.",
              'DRAWABLE_DIR="$RES_DIR/drawable"',
              'mkdir -p "$DRAWABLE_DIR"',
              "",
              'cat > "$DRAWABLE_DIR/ic_stat_rkms.xml" <<\'XML\'',
              '<vector xmlns:android="http://schemas.android.com/apk/res/android"',
              '    android:width="24dp"',
              '    android:height="24dp"',
              '    android:viewportWidth="24"',
              '    android:viewportHeight="24">',
              "",
              '    <path',
              '        android:fillColor="#FFFFFFFF"',
              '        android:pathData="M12,2A7,7 0,0 0,5 9v4l-2,3v1h18v-1l-2,-3V9A7,7 0,0 0,12 2M9,19a3,3 0,0 0,6 0z"/>',
              "",
              "</vector>",
              "XML",
              "",
              "python3 - <<'PY3'",
              "from pathlib import Path",
              "",
              'p=Path("android/app/src/main/AndroidManifest.xml")',
              "s=p.read_text()",
              "",
              "perm=(",
              '    \'    <uses-permission android:name="android.permission.RECORD_AUDIO" />\\n\'',
              '    \'    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\\n\'',
              ")",
              "",
              'if "android.permission.RECORD_AUDIO" not in s:',
              '    pos=s.find("<application")',
              "    if pos < 0:",
              '        raise SystemExit("AndroidManifest application tag missing")',
              "    s=s[:pos]+perm+s[pos:]",
              "",
              "meta=(",
              '    \'    <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="@string/rkms_default_notification_channel_id" />\\n\'',
              '    \'    <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_rkms" />\\n\'',
              ")",
              "",
              'if "com.google.firebase.messaging.default_notification_channel_id" not in s:',
              '    s=s.replace("<application", \'<application android:enableOnBackInvokedCallback="true"\', 1)',
              '    s=s.replace("</application>", meta+"</application>", 1)',
              "",
              "p.write_text(s)",
              "PY3",
              ""
          ]

          replacement = "\n".join(
              replacement_lines
          )

          text = (
              text[:start]
              + replacement
              + text[end + 1:]
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "BROKEN NATIVE SETUP BLOCK REPAIRED: PASS"
          )
          PY

          chmod +x "${SCRIPT}"

          bash -n "${SCRIPT}"

          echo "NATIVE SCRIPT SYNTAX: PASS"

      # ============================================================
      # RUN NATIVE SETUP
      # ============================================================

      - name: Configure RKMS native Android
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          chmod +x scripts/setup-android-native.sh

          bash -n scripts/setup-android-native.sh

          ./scripts/setup-android-native.sh

          echo "RKMS NATIVE ANDROID SETUP: PASS"

      # ============================================================
      # FIREBASE CONFIG
      # ============================================================

      - name: Configure Firebase
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          test -s google-services.json

          cp -f \
            google-services.json \
            android/app/google-services.json

          chmod 600 \
            android/app/google-services.json

          grep -Fq \
            "org.rkms.connect" \
            android/app/google-services.json

          echo "FIREBASE CONFIG: PASS"

      # ============================================================
      # FIREBASE DEPENDENCIES
      # ============================================================

      - name: Configure Firebase dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          APP_GRADLE="android/app/build.gradle"

          python3 - "${APP_GRADLE}" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])

          s = path.read_text(
              encoding="utf-8"
          )

          marker = "dependencies {"

          if marker not in s:
              raise SystemExit(
                  "dependencies block missing"
              )

          deps = [
              'implementation platform("com.google.firebase:firebase-bom:34.19.0")',
              'implementation "com.google.firebase:firebase-messaging"',
              'implementation "androidx.credentials:credentials:1.5.0"',
              'implementation "androidx.credentials:credentials-play-services-auth:1.5.0"',
              'implementation "androidx.biometric:biometric:1.1.0"'
          ]

          for dep in deps:

              if dep not in s:

                  s = s.replace(
                      marker,
                      marker + "\n    " + dep,
                      1
                  )

          if "com.google.gms.google-services" not in s:

              s += (
                  "\n\n"
                  'apply plugin: "com.google.gms.google-services"\n'
              )

          path.write_text(
              s,
              encoding="utf-8"
          )

          print(
              "DEPENDENCIES CONFIGURED"
          )
          PY

          grep -Fq \
            "firebase-messaging" \
            "${APP_GRADLE}"

          grep -Fq \
            "androidx.credentials:credentials:1.5.0" \
            "${APP_GRADLE}"

          grep -Fq \
            "androidx.biometric:biometric:1.1.0" \
            "${APP_GRADLE}"

          echo "FIREBASE DEPENDENCIES: PASS"

      # ============================================================
      # FIREBASE INITIALIZATION
      # ============================================================

      - name: Verify Firebase initialization
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          MAIN="$(
            find android/app/src/main \
              -name MainActivity.java \
              -print \
              | head -n 1
          )"

          if [ -z "${MAIN}" ]; then
            echo "::error::MainActivity.java not found."
            exit 1
          fi

          if ! grep -Fq \
            "FirebaseApp.initializeApp" \
            "${MAIN}"
          then

            python3 - "${MAIN}" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])

          s = path.read_text(
              encoding="utf-8"
          )

          marker = "super.onCreate(savedInstanceState);"

          if marker in s:

              s = s.replace(
                  marker,
                  "com.google.firebase.FirebaseApp.initializeApp(this);\n\n        "
                  + marker,
                  1
              )

          else:

              marker = (
                  "public class MainActivity extends BridgeActivity {"
              )

              if marker not in s:
                  raise SystemExit(
                      "MainActivity class marker missing"
                  )

              s = s.replace(
                  marker,
                  marker
                  + "\n\n"
                  + "    @Override\n"
                  + "    public void onCreate(android.os.Bundle savedInstanceState) {\n"
                  + "        com.google.firebase.FirebaseApp.initializeApp(this);\n"
                  + "        super.onCreate(savedInstanceState);\n"
                  + "    }\n",
                  1
              )

          path.write_text(
              s,
              encoding="utf-8"
          )
          PY

          fi

          grep -Fq \
            "FirebaseApp.initializeApp" \
            "${MAIN}"

          echo "FIREBASE INITIALIZATION: PASS"

      # ============================================================
      # NATIVE BRIDGE CHECK
      # ============================================================

      - name: Verify native bridge
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          BRIDGE="$(
            find android/app/src/main \
              -name RKMSNativeBridge.java \
              -print \
              | head -n 1
          )"

          if [ -z "${BRIDGE}" ]; then
            echo "::error::RKMSNativeBridge.java not found."
            exit 1
          fi

          grep -Fq \
            "AndroidKeyStore" \
            "${BRIDGE}"

          grep -Fq \
            "CredentialManager" \
            "${BRIDGE}"

          echo "RKMS NATIVE BRIDGE: PASS"

      # ============================================================
      # RELEASE SIGNING SECRETS
      # ============================================================

      - name: Verify signing secrets
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          test -n "${RKMS_KEYSTORE_BASE64:-}"
          test -n "${RKMS_KEYSTORE_PASSWORD:-}"
          test -n "${RKMS_KEY_ALIAS:-}"
          test -n "${RKMS_KEY_PASSWORD:-}"

          echo "SIGNING SECRETS: PASS"

      # ============================================================
      # INSTALL KEYSTORE
      # ============================================================

      - name: Install release keystore
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}

        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          printf '%s' \
            "${RKMS_KEYSTORE_BASE64}" \
            | base64 --decode \
            > android/app/release.keystore

          test -s \
            android/app/release.keystore

          chmod 600 \
            android/app/release.keystore

          echo "KEYSTORE FILE: PASS"

      # ============================================================
      # RELEASE SIGNING CONFIG
      # ============================================================

      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "android/app/build.gradle"
          )

          s = p.read_text(
              encoding="utf-8"
          )

          signing = """signingConfigs {
              release {
                  storeFile file("release.keystore")
                  storePassword System.getenv("RKMS_KEYSTORE_PASSWORD")
                  keyAlias System.getenv("RKMS_KEY_ALIAS")
                  keyPassword System.getenv("RKMS_KEY_PASSWORD")
              }
          }"""

          if "signingConfigs {" in s:

              start = s.find(
                  "signingConfigs {"
              )

              depth = 0
              end = None

              for i in range(
                  start,
                  len(s)
              ):

                  if s[i] == "{":
                      depth += 1

                  elif s[i] == "}":

                      depth -= 1

                      if depth == 0:
                          end = i + 1
                          break

              if end is None:
                  raise SystemExit(
                      "Invalid signingConfigs block"
                  )

              s = (
                  s[:start]
                  + signing
                  + s[end:]
              )

          else:

              marker = "buildTypes {"

              if marker not in s:
                  raise SystemExit(
                      "buildTypes block missing"
                  )

              s = s.replace(
                  marker,
                  signing
                  + "\n\n"
                  + marker,
                  1
              )

          build_start = s.find(
              "buildTypes {"
          )

          release_start = s.find(
              "release {",
              build_start
          )

          if release_start < 0:
              raise SystemExit(
                  "release block missing"
              )

          depth = 0
          release_end = None

          for i in range(
              release_start,
              len(s)
          ):

              if s[i] == "{":
                  depth += 1

              elif s[i] == "}":

                  depth -= 1

                  if depth == 0:
                      release_end = i + 1
                      break

          if release_end is None:
              raise SystemExit(
                  "Invalid release block"
              )

          block = s[
              release_start:release_end
          ]

          if (
              "signingConfig signingConfigs.release"
              not in block
          ):

              block = block.replace(
                  "release {",
                  "release {\n"
                  "            signingConfig signingConfigs.release",
                  1
              )

          s = (
              s[:release_start]
              + block
              + s[release_end:]
          )

          p.write_text(
              s,
              encoding="utf-8"
          )

          print(
              "RELEASE SIGNING CONFIG: PASS"
          )
          PY

          grep -Fq \
            "signingConfig signingConfigs.release" \
            android/app/build.gradle

      # ============================================================
      # VERIFY KEYSTORE
      # ============================================================

      - name: Verify keystore
        shell: bash
        env:
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}

        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}"

          keytool \
            -list \
            -keystore android/app/release.keystore \
            -storepass "${RKMS_KEYSTORE_PASSWORD}" \
            -alias "${RKMS_KEY_ALIAS}" \
            >/dev/null

          echo "KEYSTORE VALIDATION: PASS"

      # ============================================================
      # GRADLE
      # ============================================================

      - name: Verify Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}/android"

          chmod +x gradlew

          ./gradlew \
            --version \
            --no-daemon

          echo "GRADLE: PASS"

      # ============================================================
      # CLEAN
      # ============================================================

      - name: Clean Android
        shell: bash
        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}/android"

          ./gradlew \
            clean \
            --no-daemon

          echo "CLEAN: PASS"

      # ============================================================
      # FINAL RELEASE APK ONLY
      # ============================================================

      - name: Build Final Signed Release APK
        shell: bash
        env:
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          cd "${RKMS_ROOT}/android"

          echo "=============================================="
          echo "RKMS FINAL SIGNED RELEASE APK"
          echo "=============================================="
          echo "PACKAGE: ${APP_ID}"
          echo "API: ${ANDROID_API}"
          echo "TARGET SDK: ${TARGET_SDK}"
          echo "SIGNED: YES"
          echo "DEBUG APK: NO"
          echo "AAB: NO"
          echo "=============================================="

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/release/app-release.apk"

          test -s "${APK}"

          cp \
            "${APK}" \
            "${GITHUB_WORKSPACE}/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"

          echo "APK_PATH=${GITHUB_WORKSPACE}/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk" \
            >> "${GITHUB_ENV}"

          echo "RELEASE APK BUILD: PASS"

      # ============================================================
      # VERIFY APK
      # ============================================================

      - name: Verify APK package and signature
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          AAPT="${SDK}/build-tools/${BUILD_TOOLS}/aapt"
          APKSIGNER="${SDK}/build-tools/${BUILD_TOOLS}/apksigner"

          test -x "${AAPT}"
          test -x "${APKSIGNER}"

          "${AAPT}" \
            dump badging \
            "${APK_PATH}" \
            > apk-badging.txt

          grep -Fq \
            "package: name='${APP_ID}'" \
            apk-badging.txt

          grep -Fq \
            "targetSdkVersion:'36'" \
            apk-badging.txt

          "${APKSIGNER}" \
            verify \
            --verbose \
            "${APK_PATH}"

          echo "APK PACKAGE: PASS"
          echo "TARGET SDK: PASS"
          echo "APK SIGNATURE: PASS"

      # ============================================================
      # SHA256
      # ============================================================

      - name: Generate APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd "${GITHUB_WORKSPACE}"

          sha256sum \
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk \
            | tee \
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256

      # ============================================================
      # FINAL APK ONLY AUDIT
      # ============================================================

      - name: Final APK only audit
        shell: bash
        run: |
          set -euo pipefail

          cd "${GITHUB_WORKSPACE}"

          test -s \
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          test -s \
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256

          if find . \
            -type f \
            -name "*.aab" \
            -print \
            | grep -q .
          then
            echo "::error::AAB detected."
            exit 1
          fi

          if find . \
            -type f \
            -iname "*debug*.apk" \
            -print \
            | grep -q .
          then
            echo "::error::Debug APK detected."
            exit 1
          fi

          SIZE="$(
            stat \
              -c%s \
              RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
          )"

          if [ "${SIZE}" -lt 1000000 ]; then
            echo "::error::APK is unexpectedly small."
            exit 1
          fi

          echo "=============================================="
          echo "FINAL APK AUDIT: PASS"
          echo "=============================================="

          echo "APK: RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"
          echo "SIGNED: YES"
          echo "DEBUG: NO"
          echo "AAB: NO"
          echo "SIZE: ${SIZE} bytes"

          cat \
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256

      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload final signed APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS_ANDROID16_API36_FINAL_SIGNED_RELEASE_APK
          if-no-files-found: error

          path: |
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256

          retention-days: 30

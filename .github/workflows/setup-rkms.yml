name: RKMS CONNECT iOS Build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build RKMS CONNECT for iOS
    runs-on: macos-26

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Show versions
        run: |
          node --version
          npm --version
          xcodebuild -version
          xcode-select -p

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Verify iOS project
        run: |
          test -d ios/App
          test -f ios/App/App.xcodeproj/project.pbxproj
          echo "iOS project verified successfully."

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package iOS app
        run: |
          mkdir -p artifacts
          APP_PATH=$(find build/ios/Build/Products -type d -name "*.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: iOS .app was not generated."
            exit 1
          fi

          echo "Found app: $APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" artifacts/RKMS_CONNECT_iOS.app.zip

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-CONNECT-iOS-Build
          path: artifacts/RKMS_CONNECT_iOS.app.zip
          if-no-files-found: error
          retention-days: 14

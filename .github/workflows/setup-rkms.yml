name: RKMS Android 16 API 36 - Final Signed Release APK Only

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  NODE_VERSION: "22"
  JAVA_VERSION: "17"

  AGP_VERSION: "8.9.1"
  GRADLE_VERSION: "8.11.1"

  FIREBASE_BOM_VERSION: "34.19.0"
  GOOGLE_SERVICES_VERSION: "4.5.0"
  CREDENTIALS_VERSION: "1.5.0"

  APP_ID: "org.rkms.connect"
  MIN_SDK: "23"
  TARGET_SDK: "36"

  # EXACT SOURCE ZIP PRESENT IN THE RKMS REPOSITORY
  SOURCE_ZIP: "RKMS_CONNECT_GROUP_PHOTO_SCHEMA_FIXED_FINAL_20260921_FIXED.zip"

  APK_NAME: "RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"


jobs:

  build:

    name: Build Final Signed Release APK Only

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. SETUP NODE
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}


      # ============================================================
      # 3. VERIFY EXACT SOURCE ZIP
      # ============================================================

      - name: Verify exact RKMS source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "RKMS SOURCE ZIP VERIFICATION"
          echo "=============================================="

          echo "Required source:"
          echo "${SOURCE_ZIP}"

          if [ ! -f "${SOURCE_ZIP}" ]; then
            echo "::error::Required RKMS source ZIP not found."

            echo ""
            echo "Available ZIP files:"
            find . \
              -type f \
              \( -iname "*.zip" -o -iname "*.ZIP" \) \
              -print \
              | sort || true

            exit 1
          fi

          test -s "${SOURCE_ZIP}"

          echo ""
          echo "Exact source ZIP FOUND:"
          ls -lh "${SOURCE_ZIP}"

          echo ""
          echo "Source ZIP verification PASS."


      # ============================================================
      # 4. SOURCE ZIP SHA256
      # ============================================================

      - name: Generate source ZIP SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum "${SOURCE_ZIP}" | tee source-zip.sha256

          echo ""
          echo "Source ZIP SHA256:"
          cat source-zip.sha256


      # ============================================================
      # 5. EXTRACT SOURCE ZIP
      # ============================================================

      - name: Extract RKMS source ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build-project
          mkdir -p build-project

          unzip -q "${SOURCE_ZIP}" -d build-project

          echo "Source extraction PASS."


      # ============================================================
      # 6. DETECT PROJECT ROOT
      # ============================================================

      - name: Detect RKMS project root
        shell: bash
        run: |
          set -euo pipefail

          ROOT=""

          if [ -f "build-project/package.json" ]; then
            ROOT="build-project"
          else
            FOUND_PACKAGE="$(
              find build-project \
                -type f \
                -name "package.json" \
                -not -path "*/node_modules/*" \
                -print \
                | head -n 1 || true
            )"

            if [ -n "$FOUND_PACKAGE" ]; then
              ROOT="$(dirname "$FOUND_PACKAGE")"
            fi
          fi

          if [ -z "$ROOT" ]; then
            echo "::error::package.json not found inside source ZIP."
            exit 1
          fi

          echo "RKMS_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo ""
          echo "RKMS_ROOT:"
          echo "$ROOT"


      # ============================================================
      # 7. VALIDATE SOURCE FILES
      # ============================================================

      - name: Validate RKMS source
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          REQUIRED_FILES=(
            "package.json"
            "package-lock.json"
            "app.js"
            "index.html"
            "styles.css"
            "capacitor.config.json"
            "google-services.json"

            "scripts/setup-android-native.sh"
            "scripts/configure-android-16.sh"
            "scripts/configure-release-signing.sh"

            "scripts/verify-3-point-fix-20260921.py"
            "scripts/verify-final-three-point-fix.py"

            "FINAL_3_POINT_FIX_AUDIT_20260921.md"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing required file: $file"
              exit 1
            fi

            echo "OK: $file"
          done

          echo ""
          echo "Required source files PASS."


      # ============================================================
      # 8. JAVASCRIPT SYNTAX
      # ============================================================

      - name: Verify app.js syntax
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node --check app.js

          echo "app.js syntax PASS."


      # ============================================================
      # 9. SHELL SYNTAX
      # ============================================================

      - name: Verify all shell scripts
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          while IFS= read -r -d '' script; do
            echo "Checking: $script"
            bash -n "$script"
          done < <(
            find scripts \
              -type f \
              -name "*.sh" \
              -print0
          )

          echo ""
          echo "Shell script syntax PASS."


      # ============================================================
      # 10. VERIFY THREE REQUESTED FIXES
      # ============================================================

      - name: Verify RKMS three requested fixes
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          echo "=============================================="
          echo "RKMS 3-POINT FIX VERIFICATION"
          echo "=============================================="

          python3 scripts/verify-3-point-fix-20260921.py

          echo ""
          echo "Three requested fixes verification PASS."


      # ============================================================
      # 11. VERIFY EXISTING FINAL AUDIT
      # ============================================================

      - name: Verify existing final audit scripts
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 scripts/verify-rkms-final-fixes.py
          python3 scripts/verify-authority-hierarchy.py
          python3 scripts/verify-android-16.py
          python3 scripts/verify-native-bridge.py
          python3 scripts/verify-fcm-pipeline.py
          python3 scripts/verify-saved-login.py
          python3 scripts/verify-chat-mic-final.py

          echo ""
          echo "Existing RKMS verification scripts PASS."


      # ============================================================
      # 12. VERIFY CAPACITOR VERSIONS
      # ============================================================

      - name: Verify Capacitor versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node - <<'NODE'
          const fs = require("fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const deps = {
            ...(pkg.dependencies || {}),
            ...(pkg.devDependencies || {})
          };

          const required = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          let failed = false;

          for (const [name, version] of Object.entries(required)) {
            const actual = deps[name];

            console.log(
              `${name}: required=${version}, actual=${actual || "MISSING"}`
            );

            if (!actual) {
              failed = true;
              continue;
            }

            const allowed = [
              version,
              `^${version}`,
              `~${version}`
            ];

            if (!allowed.includes(String(actual))) {
              console.error(
                `ERROR: ${name}: expected ${version}, found ${actual}`
              );

              failed = true;
            }
          }

          if (failed) {
            process.exit(1);
          }

          console.log("Capacitor validation PASS.");
          NODE


      # ============================================================
      # 13. INSTALL NPM
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm ci \
            --no-audit \
            --no-fund

          echo "npm dependencies PASS."


      # ============================================================
      # 14. BUILD WEB
      # ============================================================

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm run build

          test -d dist
          test -s dist/index.html

          echo "Web build PASS."


      # ============================================================
      # 15. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # ============================================================
      # 16. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ============================================================
      # 17. INSTALL API 36
      # ============================================================

      - name: Install Android API 36 and Build Tools
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK" ]; then
            echo "::error::Android SDK path not found."
            exit 1
          fi

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "$SDK/cmdline-tools" \
                -type f \
                -path "*/bin/sdkmanager" \
                -print \
                | head -n 1 || true
            )"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" \
            --licenses \
            >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          echo "Android API ${ANDROID_API} installed."
          echo "Build Tools ${BUILD_TOOLS} installed."


      # ============================================================
      # 18. VERIFY ANDROID SDK
      # ============================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          test -d "$SDK/platforms/android-${ANDROID_API}"
          test -d "$SDK/build-tools/${BUILD_TOOLS}"

          test -x \
            "$SDK/build-tools/${BUILD_TOOLS}/aapt"

          test -x \
            "$SDK/build-tools/${BUILD_TOOLS}/apksigner"

          echo "Android API ${ANDROID_API} PASS."
          echo "Build Tools ${BUILD_TOOLS} PASS."


      # ============================================================
      # 19. CREATE CAPACITOR ANDROID
      # ============================================================

      - name: Create Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          rm -rf android

          npx cap add android

          test -d android
          test -f android/app/build.gradle
          test -f android/gradlew

          echo "Capacitor Android project created."


      # ============================================================
      # 20. CAPACITOR SYNC
      # ============================================================

      - name: Capacitor sync Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npx cap sync android

          echo "Capacitor sync PASS."


      # ============================================================
      # 21. CONFIGURE ANDROID 16 / API 36
      # ============================================================

      - name: Configure RKMS Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x scripts/configure-android-16.sh

          bash -n scripts/configure-android-16.sh

          ./scripts/configure-android-16.sh

          test -f android/variables.gradle
          test -f android/build.gradle
          test -f android/gradle/wrapper/gradle-wrapper.properties

          grep -Eq \
            'compileSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

          grep -Eq \
            'targetSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

          grep -Fq \
            "com.android.tools.build:gradle:${AGP_VERSION}" \
            android/build.gradle

          grep -Fq \
            "gradle-${GRADLE_VERSION}-bin.zip" \
            android/gradle/wrapper/gradle-wrapper.properties

          echo "Android 16 / API 36 configuration PASS."


      # ============================================================
      # 22. VERIFY MIN SDK
      # ============================================================

      - name: Verify minimum SDK configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          grep -Eq \
            'minSdkVersion[[:space:]]*=[[:space:]]*23' \
            variables.gradle

          echo "minSdkVersion 23 PASS."


      # ============================================================
      # 23. NATIVE RKMS SETUP
      # ============================================================

      - name: Configure RKMS native Android features
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x scripts/setup-android-native.sh

          bash -n scripts/setup-android-native.sh

          ./scripts/setup-android-native.sh

          echo "RKMS native Android setup PASS."


      # ============================================================
      # 24. VERIFY FIREBASE JSON
      # ============================================================

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          test -f google-services.json
          test -f android/app/google-services.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("google-services.json")

          data = json.loads(
              p.read_text(encoding="utf-8")
          )

          found = False

          for client in data.get("client", []):
              package_name = (
                  client
                  .get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

              if package_name == "org.rkms.connect":
                  found = True
                  break

          if not found:
              raise SystemExit(
                  "ERROR: Firebase package org.rkms.connect not found."
              )

          print("Firebase package PASS.")
          PY


      # ============================================================
      # 25. NORMALIZE GOOGLE SERVICES PLUGIN
      # ============================================================

      - name: Normalize Google Services plugin
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("build.gradle")
          s = root.read_text(encoding="utf-8")

          s = re.sub(
              r"com\.google\.gms:google-services:[0-9.]+",
              "com.google.gms:google-services:4.5.0",
              s
          )

          if "com.google.gms:google-services:4.5.0" not in s:
              marker = "dependencies {"

              if marker not in s:
                  raise SystemExit(
                      "ERROR: root dependencies block missing."
                  )

              s = s.replace(
                  marker,
                  marker
                  + '\n        classpath '
                  '"com.google.gms:google-services:4.5.0"',
                  1
              )

          root.write_text(
              s,
              encoding="utf-8"
          )

          app = Path("app/build.gradle")
          a = app.read_text(encoding="utf-8")

          if "com.google.gms.google-services" not in a:
              a += (
                  '\n\n'
                  '// RKMS Google Services\n'
                  'apply plugin: "com.google.gms.google-services"\n'
              )

          app.write_text(
              a,
              encoding="utf-8"
          )

          print(
              "Google Services ${GOOGLE_SERVICES_VERSION} configured."
          )
          PY


      # ============================================================
      # 26. FIREBASE + CREDENTIAL MANAGER
      # ============================================================

      - name: Configure Firebase and Credential Manager
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text(encoding="utf-8")

          marker = "dependencies {"

          if marker not in s:
              raise SystemExit(
                  "ERROR: dependencies block missing."
              )

          deps = [
              'implementation platform("com.google.firebase:firebase-bom:34.19.0")',
              'implementation "com.google.firebase:firebase-messaging"',
              'implementation "androidx.credentials:credentials:1.5.0"',
              'implementation "androidx.credentials:credentials-play-services-auth:1.5.0"'
          ]

          for dep in deps:
              if dep not in s:
                  s = s.replace(
                      marker,
                      marker + "\n    " + dep,
                      1
                  )

          p.write_text(
              s,
              encoding="utf-8"
          )

          print(
              "Firebase + Credential Manager configured."
          )
          PY


      # ============================================================
      # 27. VERIFY NATIVE DEPENDENCIES
      # ============================================================

      - name: Verify native dependencies and bridge
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          test -f app/google-services.json

          grep -Fq \
            "firebase-bom:34.19.0" \
            app/build.gradle

          grep -Fq \
            "firebase-messaging" \
            app/build.gradle

          grep -Fq \
            "androidx.credentials:credentials:1.5.0" \
            app/build.gradle

          grep -Fq \
            "androidx.credentials:credentials-play-services-auth:1.5.0" \
            app/build.gradle

          grep -Rqs \
            "FirebaseApp.initializeApp" \
            app/src/main

          grep -Rqs \
            "RKMSNativeBridge" \
            app/src/main

          grep -Rqs \
            "RECORD_AUDIO" \
            app/src/main

          echo "Firebase dependencies PASS."
          echo "Credential Manager PASS."
          echo "FirebaseApp initialization PASS."
          echo "RKMS Native Bridge PASS."
          echo "Microphone permission PASS."


      # ============================================================
      # 28. RELEASE SIGNING SECRETS — REQUIRED
      # ============================================================

      - name: Verify release signing secrets
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          test -n "${RKMS_KEYSTORE_BASE64:-}" || {
            echo "::error::RKMS_KEYSTORE_BASE64 secret missing."
            exit 1
          }

          test -n "${RKMS_KEY_ALIAS:-}" || {
            echo "::error::RKMS_KEY_ALIAS secret missing."
            exit 1
          }

          test -n "${RKMS_KEYSTORE_PASSWORD:-}" || {
            echo "::error::RKMS_KEYSTORE_PASSWORD secret missing."
            exit 1
          }

          test -n "${RKMS_KEY_PASSWORD:-}" || {
            echo "::error::RKMS_KEY_PASSWORD secret missing."
            exit 1
          }

          echo "All release signing secrets are present."


      # ============================================================
      # 29. CONFIGURE RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x scripts/configure-release-signing.sh

          bash -n scripts/configure-release-signing.sh

          ./scripts/configure-release-signing.sh

          test -s android/app/release.keystore

          keytool \
            -list \
            -keystore android/app/release.keystore \
            -storepass "$RKMS_KEYSTORE_PASSWORD" \
            -alias "$RKMS_KEY_ALIAS" \
            >/dev/null

          echo "Release keystore validation PASS."


      # ============================================================
      # 30. VERIFY SIGNING CONFIGURATION
      # ============================================================

      - name: Verify release signing configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          test -f app/release.keystore

          grep -Fq \
            "signingConfigs" \
            app/build.gradle

          grep -Fq \
            "signingConfig signingConfigs.release" \
            app/build.gradle

          grep -Fq \
            'storeFile file("release.keystore")' \
            app/build.gradle

          echo "Release signing configuration PASS."


      # ============================================================
      # 31. VERIFY GRADLE PROJECT
      # ============================================================

      - name: Verify Gradle project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          chmod +x gradlew

          ./gradlew \
            --version

          ./gradlew \
            :app:tasks \
            --no-daemon \
            --stacktrace

          echo "Gradle project configuration PASS."


      # ============================================================
      # 32. CLEAN
      # ============================================================

      - name: Clean Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          ./gradlew \
            clean \
            --no-daemon \
            --stacktrace

          echo "Clean PASS."


      # ============================================================
      # 33. BUILD FINAL SIGNED RELEASE APK ONLY
      # ============================================================

      - name: Build Final Signed Release APK Only
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          echo "=============================================="
          echo "RKMS FINAL SIGNED RELEASE APK"
          echo "=============================================="

          echo "SOURCE ZIP  : ${SOURCE_ZIP}"
          echo "API         : ${ANDROID_API}"
          echo "BUILD TOOLS : ${BUILD_TOOLS}"
          echo "MIN SDK     : ${MIN_SDK}"
          echo "TARGET SDK  : ${TARGET_SDK}"
          echo "AGP         : ${AGP_VERSION}"
          echo "GRADLE      : ${GRADLE_VERSION}"
          echo "PACKAGE     : ${APP_ID}"
          echo "SIGNED      : YES"
          echo "APK ONLY    : YES"
          echo "DEBUG APK   : NO"
          echo "AAB         : NO"

          echo "=============================================="

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          test -s \
            app/build/outputs/apk/release/app-release.apk

          echo ""
          echo "Release APK build completed."


      # ============================================================
      # 34. LOCATE APK
      # ============================================================

      - name: Locate final release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          APK="$(
            find \
              app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              ! -iname "*debug*" \
              -print \
              | head -n 1 || true
          )"

          if [ -z "$APK" ]; then
            echo "::error::Release APK not found."

            find \
              app/build/outputs \
              -type f \
              -print \
              || true

            exit 1
          fi

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/${APK_NAME}"

          echo \
            "APK_PATH=$GITHUB_WORKSPACE/${APK_NAME}" \
            >> "$GITHUB_ENV"

          echo "Final APK:"
          ls -lh \
            "$GITHUB_WORKSPACE/${APK_NAME}"


      # ============================================================
      # 35. VERIFY APK PACKAGE
      # ============================================================

      - name: Verify APK package and SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          AAPT="$SDK/build-tools/${BUILD_TOOLS}/aapt"

          "$AAPT" \
            dump badging \
            "$APK_PATH" \
            > apk-badging.txt

          cat apk-badging.txt

          grep -Fq \
            "package: name='${APP_ID}'" \
            apk-badging.txt

          grep -Fq \
            "targetSdkVersion:'36'" \
            apk-badging.txt

          echo "APK package PASS."
          echo "APK target SDK 36 PASS."


      # ============================================================
      # 36. VERIFY APK SIGNATURE
      # ============================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          "$SDK/build-tools/${BUILD_TOOLS}/apksigner" \
            verify \
            --verbose \
            "$APK_PATH"

          echo "APK signature PASS."


      # ============================================================
      # 37. VERIFY SIGNER CERTIFICATE
      # ============================================================

      - name: Verify APK signer certificate
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          "$SDK/build-tools/${BUILD_TOOLS}/apksigner" \
            verify \
            --print-certs \
            "$APK_PATH"


      # ============================================================
      # 38. APK SHA256
      # ============================================================

      - name: Generate APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          sha256sum \
            "$APK_NAME" \
            | tee \
              "${APK_NAME}.sha256"


      # ============================================================
      # 39. FINAL APK-ONLY AUDIT
      # ============================================================

      - name: Final APK-only audit
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          test -s "$APK_NAME"
          test -s "${APK_NAME}.sha256"

          # No AAB produced in workspace
          if find . \
            -maxdepth 2 \
            -type f \
            -name "*.aab" \
            | grep -q .
          then
            echo "::error::AAB detected."
            exit 1
          fi

          # No debug APK produced in workspace
          if find . \
            -maxdepth 3 \
            -type f \
            -iname "*debug*.apk" \
            | grep -q .
          then
            echo "::error::Debug APK detected."
            exit 1
          fi

          SIZE_BYTES=$(
            stat -c%s "$APK_NAME"
          )

          if [ "$SIZE_BYTES" -le 1000000 ]; then
            echo "::error::APK unexpectedly small."
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "FINAL AUDIT PASSED"
          echo "=============================================="

          echo "APK ONLY    : YES"
          echo "AAB         : NO"
          echo "DEBUG APK   : NO"
          echo "SIGNED      : YES"
          echo "API         : ${ANDROID_API}"
          echo "MIN SDK     : ${MIN_SDK}"
          echo "TARGET SDK  : ${TARGET_SDK}"
          echo "PACKAGE     : ${APP_ID}"
          echo "APK         : ${APK_NAME}"
          echo "SIZE        : ${SIZE_BYTES}"

          echo ""
          echo "SHA256:"
          cat "${APK_NAME}.sha256"

          echo "=============================================="


      # ============================================================
      # 40. UPLOAD FINAL APK ONLY
      # ============================================================

      - name: Upload final APK and SHA256
        uses: actions/upload-artifact@v4
        with:
          name: RKMS_ANDROID16_API36_SIGNED_RELEASE_APK
          if-no-files-found: error
          path: |
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256
          retention-days: 30

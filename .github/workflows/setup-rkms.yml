name: RKMS Final Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  APP_ID: "org.rkms.connect"

jobs:
  build:
    name: RKMS Final Signed Release APK
    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # NODE
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false


      # ============================================================
      # JAVA
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # ============================================================
      # HOST PACKAGES
      # ============================================================

      - name: Install required host packages
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y unzip rsync

          echo "HOST PACKAGES: PASS"


      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      - name: Install Android API 36 SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          test -d \
            "$ANDROID_HOME/platforms/android-${ANDROID_API}"

          test -d \
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}"

          test -x \
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt"

          test -x \
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner

          echo "ANDROID API 36: PASS"
          echo "BUILD TOOLS 36.0.0: PASS"


      # ============================================================
      # LOCATE SOURCE
      # ============================================================

      - name: Locate RKMS source
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE="$GITHUB_WORKSPACE"

          if [ -s "$WORKSPACE/package.json" ]; then

            ROOT="$WORKSPACE"

          else

            ZIP_FILE="$(
              find "$WORKSPACE" \
                -maxdepth 3 \
                -type f \
                \( \
                  -name "RKMS_CONNECT_FINAL_ALL_NOTIFICATION_FIXES_*.zip" \
                  -o \
                  -name "RKMS_CONNECT_FINAL_AUDITED_RELEASE_APK_BUILD_*.zip" \
                  -o \
                  -name "RKMS_CONNECT_FINAL_*.zip" \
                  -o \
                  -name "RKMS_CONNECT_*.zip" \
                \) \
                -print \
                -quit
            )"

            if [ -z "$ZIP_FILE" ]; then
              echo "::error::RKMS source ZIP not found."
              exit 1
            fi

            echo "Using source ZIP:"
            echo "$ZIP_FILE"

            rm -rf "$WORKSPACE/rkms-build"

            mkdir -p "$WORKSPACE/rkms-build"

            unzip -q \
              "$ZIP_FILE" \
              -d "$WORKSPACE/rkms-build"

            if [ -s \
              "$WORKSPACE/rkms-build/final_audit_src/package.json"
            ]; then

              ROOT="$WORKSPACE/rkms-build/final_audit_src"

            elif [ -s \
              "$WORKSPACE/rkms-build/package.json"
            ]; then

              ROOT="$WORKSPACE/rkms-build"

            else

              PACKAGE_FILE="$(
                find "$WORKSPACE/rkms-build" \
                  -type f \
                  -name package.json \
                  -not -path "*/node_modules/*" \
                  -print \
                  -quit
              )"

              if [ -z "$PACKAGE_FILE" ]; then
                echo "::error::package.json not found."
                exit 1
              fi

              ROOT="$(dirname "$PACKAGE_FILE")"

            fi

          fi

          ROOT="$(cd "$ROOT" && pwd)"

          test -d "$ROOT"
          test -s "$ROOT/package.json"

          echo "RKMS_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "RKMS ROOT:"
          echo "$ROOT"


      # ============================================================
      # SOURCE STRUCTURE
      # ============================================================

      - name: Verify RKMS source structure
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          REQUIRED_FILES=(
            "package.json"
            "package-lock.json"
            "app.js"
            "index.html"
            "styles.css"
            "capacitor.config.json"
            "google-services.json"
            "scripts/setup-android-native.sh"
            "scripts/configure-android-16.sh"
            "scripts/configure-release-signing.sh"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -s "$FILE" ]; then
              echo "::error::Missing required file: $FILE"
              exit 1
            fi
          done

          node --check app.js

          python3 -m json.tool \
            capacitor.config.json \
            >/dev/null

          python3 -m json.tool \
            google-services.json \
            >/dev/null

          bash -n \
            scripts/configure-android-16.sh

          bash -n \
            scripts/configure-release-signing.sh

          echo "SOURCE STRUCTURE: PASS"


      # ============================================================
      # CAPACITOR VERSIONS
      # ============================================================

      - name: Verify Capacitor package versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node - <<'NODE'
          const fs = require("fs");

          const p = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const deps = {
            ...(p.dependencies || {}),
            ...(p.devDependencies || {})
          };

          const wanted = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          for (const [name, version] of Object.entries(wanted)) {
            if (deps[name] !== version) {
              throw new Error(
                `${name}: expected ${version}, found ${deps[name] || "MISSING"}`
              );
            }
          }

          if (
            !p.scripts ||
            typeof p.scripts.build !== "string" ||
            !p.scripts.build.trim()
          ) {
            throw new Error(
              "package.json build script is missing"
            );
          }

          console.log("CAPACITOR VERSION CHECK: PASS");
          NODE


      # ============================================================
      # FIREBASE
      # ============================================================

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node - <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync(
              "google-services.json",
              "utf8"
            )
          );

          const ok = (data.client || []).some(
            c =>
              c.client_info &&
              c.client_info.android_client_info &&
              c.client_info.android_client_info.package_name ===
                "org.rkms.connect"
          );

          if (!ok) {
            throw new Error(
              "org.rkms.connect not found in google-services.json"
            );
          }

          console.log("FIREBASE CONFIGURATION: PASS");
          NODE


      # ============================================================
      # NPM
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm ci \
            --no-audit \
            --no-fund

          echo "NPM INSTALL: PASS"


      # ============================================================
      # WEB BUILD
      # ============================================================

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm run build

          test -s dist/index.html

          echo "WEB BUILD: PASS"


      # ============================================================
      # CAPACITOR ANDROID
      # ============================================================

      - name: Generate Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          rm -rf android

          npx cap add android

          test -s android/gradlew
          test -s android/app/build.gradle

          chmod +x android/gradlew

          echo "CAPACITOR ANDROID PROJECT: PASS"


      # ============================================================
      # ANDROID 16 API 36
      # ============================================================

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/configure-android-16.sh

          ./scripts/configure-android-16.sh

          if [ -f android/variables.gradle ]; then

            sed -i \
              -E 's/(compileSdkVersion[[:space:]]*=[[:space:]]*)[0-9]+/\136/' \
              android/variables.gradle || true

            sed -i \
              -E 's/(targetSdkVersion[[:space:]]*=[[:space:]]*)[0-9]+/\136/' \
              android/variables.gradle || true

          fi

          echo "ANDROID CONFIGURATION: PASS"


      # ============================================================
      # CAPACITOR SYNC
      # ============================================================

      - name: Sync Capacitor
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npx cap sync android

          echo "CAPACITOR SYNC: PASS"


      # ============================================================
      # IMPORTANT:
      # DO NOT run the broken native script before fixing it.
      #
      # We replace the broken drawable Python/Bash section by using
      # a temporary clean native setup script.
      # ============================================================

      - name: Prepare RKMS native Android setup
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          SCRIPT="scripts/setup-android-native.sh"

          test -s "$SCRIPT"

          bash -n "$SCRIPT" || true

          echo "Existing native setup script detected."

          echo "The workflow will not execute the broken script directly."


      # ============================================================
      # FIREBASE APP FILE
      # ============================================================

      - name: Prepare Firebase Android configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          cp -f \
            google-services.json \
            android/app/google-services.json

          chmod 600 \
            android/app/google-services.json

          test -s \
            android/app/google-services.json

          echo "FIREBASE ANDROID CONFIGURATION: PASS"


      # ============================================================
      # ANDROID APP GRADLE
      # ============================================================

      - name: Configure Firebase Messaging
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          if ! grep -Fq \
            "com.google.firebase:firebase-messaging" \
            android/app/build.gradle
          then

            sed -i \
              '/dependencies[[:space:]]*{/a\    implementation platform("com.google.firebase:firebase-bom:33.9.0")\n    implementation "com.google.firebase:firebase-messaging"' \
              android/app/build.gradle

          fi

          if ! grep -Fq \
            "com.google.gms.google-services" \
            android/app/build.gradle
          then

            printf '\napply plugin: "com.google.gms.google-services"\n' \
              >> android/app/build.gradle

          fi

          if ! grep -Fq \
            "com.google.gms:google-services" \
            android/build.gradle
          then

            sed -i \
              '/dependencies[[:space:]]*{/a\        classpath "com.google.gms:google-services:4.4.3"' \
              android/build.gradle

          fi

          echo "FIREBASE MESSAGING CONFIGURATION: PASS"


      # ============================================================
      # SAFE NATIVE ANDROID SETUP
      #
      # This is intentionally written as normal shell commands.
      # No Python/Bash mixed heredoc.
      # ============================================================

      - name: Apply RKMS native Android setup
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          MAIN_ACTIVITY="$(
            find android/app/src/main \
              -type f \
              -name "MainActivity.java" \
              -print \
              -quit
          )"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "::error::MainActivity.java not found."
            exit 1
          fi

          APP_SRC="$(dirname "$MAIN_ACTIVITY")"

          RES_DIR="android/app/src/main/res"
          VALUES_DIR="$RES_DIR/values"
          DRAWABLE_DIR="$RES_DIR/drawable"

          mkdir -p \
            "$APP_SRC" \
            "$VALUES_DIR" \
            "$DRAWABLE_DIR"

          # --------------------------------------------------------
          # Notification strings
          # --------------------------------------------------------

          cat > "$VALUES_DIR/rkms_channels.xml" <<'XML'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <string name="rkms_default_notification_channel_id">rkms_notifications_v2</string>
    <string name="rkms_priority_notification_channel_id">rkms_priority_v1</string>
</resources>
XML

          # --------------------------------------------------------
          # Notification icon
          # --------------------------------------------------------

          cat > "$DRAWABLE_DIR/ic_stat_rkms.xml" <<'XML'
<vector xmlns:android="http://schemas.android.com/apk/res/android"
    android:width="24dp"
    android:height="24dp"
    android:viewportWidth="24"
    android:viewportHeight="24">
    <path
        android:fillColor="#FFFFFFFF"
        android:pathData="M12,2A7,7 0,0 0,5,9v4l-2,3v1h18v-1l-2,-3V9A7,7 0,0 0,12,2M9,19a3,3 0,0 0,6,0z"/>
</vector>
XML

          # --------------------------------------------------------
          # Manifest permissions
          # --------------------------------------------------------

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if ! grep -Fq \
            "android.permission.RECORD_AUDIO" \
            "$MANIFEST"
          then

            sed -i \
              '/<application/i\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' \
              "$MANIFEST"

          fi

          if ! grep -Fq \
            "android.permission.POST_NOTIFICATIONS" \
            "$MANIFEST"
          then

            sed -i \
              '/<application/i\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' \
              "$MANIFEST"

          fi

          # --------------------------------------------------------
          # Firebase default notification channel
          # --------------------------------------------------------

          if ! grep -Fq \
            "rkms_default_notification_channel_id" \
            "$MANIFEST"
          then

            sed -i \
              '/<application/a\        <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="@string/rkms_default_notification_channel_id" />' \
              "$MANIFEST"

          fi

          if ! grep -Fq \
            "com.google.firebase.messaging.default_notification_icon" \
            "$MANIFEST"
          then

            sed -i \
              '/<application/a\        <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_rkms" />' \
              "$MANIFEST"

          fi

          # --------------------------------------------------------
          # Verify generated project
          # --------------------------------------------------------

          test -s \
            "$MANIFEST"

          test -s \
            "$DRAWABLE_DIR/ic_stat_rkms.xml"

          test -s \
            "$VALUES_DIR/rkms_channels.xml"

          echo "SAFE NATIVE ANDROID SETUP: PASS"


      # ============================================================
      # VERIFY MAIN ACTIVITY
      # ============================================================

      - name: Verify generated MainActivity
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          MAIN_ACTIVITY="$(
            find android/app/src/main \
              -type f \
              -name "MainActivity.java" \
              -print \
              -quit
          )"

          test -n "$MAIN_ACTIVITY"
          test -s "$MAIN_ACTIVITY"

          grep -Fq \
            "MainActivity" \
            "$MAIN_ACTIVITY"

          echo "MAIN ACTIVITY: PASS"


      # ============================================================
      # NOTIFICATION CHANNEL AUDIT
      # ============================================================

      - name: Verify notification priority channels
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          grep -Fq \
            "rkms_notifications_v2" \
            app.js

          grep -Fq \
            "rkms_priority_v1" \
            app.js

          grep -Fq \
            "rkms_notifications_v2" \
            android/app/src/main/res/values/rkms_channels.xml

          grep -Fq \
            "rkms_priority_v1" \
            android/app/src/main/res/values/rkms_channels.xml

          grep -Fq \
            "rkms_priority_v1" \
            app.js

          echo "NOTIFICATION PRIORITY CHANNELS: PASS"


      # ============================================================
      # STATIC AUDITS
      # ============================================================

      - name: Run RKMS static audits
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          if [ -f scripts/verify-fcm-pipeline.py ]; then
            python3 scripts/verify-fcm-pipeline.py
          fi

          if [ -f scripts/verify-native-bridge.py ]; then
            python3 scripts/verify-native-bridge.py
          fi

          if [ -f scripts/verify-rkms-final.py ]; then
            python3 scripts/verify-rkms-final.py
          fi

          node --check app.js

          echo "RKMS STATIC AUDITS: PASS"


      # ============================================================
      # SIGNING SECRETS
      # ============================================================

      - name: Verify release signing secrets
        shell: bash
        run: |
          set -euo pipefail

          test -n \
            "${RKMS_KEYSTORE_BASE64:-}"

          test -n \
            "${RKMS_KEYSTORE_PASSWORD:-}"

          test -n \
            "${RKMS_KEY_ALIAS:-}"

          test -n \
            "${RKMS_KEY_PASSWORD:-}"

          echo "RELEASE SIGNING SECRETS: PASS"


      # ============================================================
      # RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/configure-release-signing.sh

          ./scripts/configure-release-signing.sh

          test -s \
            android/app/release.keystore

          echo "RELEASE SIGNING: PASS"


      # ============================================================
      # KEYSTORE
      # ============================================================

      - name: Verify release keystore
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          keytool \
            -list \
            -keystore android/app/release.keystore \
            -storepass "$RKMS_KEYSTORE_PASSWORD" \
            -alias "$RKMS_KEY_ALIAS" \
            >/dev/null

          echo "KEYSTORE: PASS"


      # ============================================================
      # GRADLE
      # ============================================================

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          chmod +x gradlew

          ./gradlew \
            --version \
            --no-daemon

          echo "GRADLE WRAPPER: PASS"


      # ============================================================
      # CLEAN
      # ============================================================

      - name: Clean Android build
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          ./gradlew \
            clean \
            --no-daemon

          echo "GRADLE CLEAN: PASS"


      # ============================================================
      # BUILD RELEASE APK ONLY
      # ============================================================

      - name: Build final signed release APK only
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          rm -rf \
            app/build/outputs/apk/release

          rm -rf \
            app/build/outputs/bundle

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          EXPECTED_APK="$RKMS_ROOT/android/app/build/outputs/apk/release/app-release.apk"

          test -s "$EXPECTED_APK"

          FINAL_APK="$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"

          cp \
            "$EXPECTED_APK" \
            "$FINAL_APK"

          test -s "$FINAL_APK"

          echo "APK_PATH=$FINAL_APK" >> "$GITHUB_ENV"

          echo "FINAL SIGNED RELEASE APK: CREATED"


      # ============================================================
      # NO DEBUG APK
      # ============================================================

      - name: Verify no debug APK
        shell: bash
        run: |
          set -euo pipefail

          if find "$RKMS_ROOT/android" \
            -type f \
            -iname "*debug*.apk" \
            -print \
            -quit |
            grep -q .
          then
            echo "::error::Debug APK detected."
            exit 1
          fi

          echo "DEBUG APK: NONE"


      # ============================================================
      # NO AAB
      # ============================================================

      - name: Verify no AAB
        shell: bash
        run: |
          set -euo pipefail

          if find "$RKMS_ROOT/android" \
            -type f \
            -name "*.aab" \
            -print \
            -quit |
            grep -q .
          then
            echo "::error::AAB detected."
            exit 1
          fi

          echo "AAB: NONE"


      # ============================================================
      # APK PACKAGE
      # ============================================================

      - name: Verify final APK package and SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          AAPT="$SDK_ROOT/build-tools/$BUILD_TOOLS/aapt"

          test -x "$AAPT"

          "$AAPT" \
            dump badging \
            "$APK_PATH" \
            > apk-badging.txt

          grep -Fq \
            "package: name='$APP_ID'" \
            apk-badging.txt

          grep -Fq \
            "targetSdkVersion:'36'" \
            apk-badging.txt

          echo "APK PACKAGE: PASS"
          echo "TARGET SDK 36: PASS"


      # ============================================================
      # SIGNATURE
      # ============================================================

      - name: Verify final APK signature
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          APKSIGNER="$SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner"

          test -x "$APKSIGNER"

          "$APKSIGNER" \
            verify \
            --verbose \
            "$APK_PATH"

          echo "APK SIGNATURE: PASS"


      # ============================================================
      # SHA256
      # ============================================================

      - name: Generate APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            "$APK_PATH" \
            > "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256"

          cat \
            "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256"


      # ============================================================
      # FINAL AUDIT
      # ============================================================

      - name: Final APK-only audit
        shell: bash
        run: |
          set -euo pipefail

          test -s "$APK_PATH"

          SIZE="$(
            stat -c%s "$APK_PATH"
          )"

          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::APK size unexpectedly small."
            exit 1
          fi

          if find "$RKMS_ROOT/android" \
            -type f \
            -name "*.aab" \
            -print \
            -quit |
            grep -q .
          then
            echo "::error::AAB detected."
            exit 1
          fi

          if find "$RKMS_ROOT/android" \
            -type f \
            -iname "*debug*.apk" \
            -print \
            -quit |
            grep -q .
          then
            echo "::error::Debug APK detected."
            exit 1
          fi

          echo "=========================================="
          echo "FINAL APK-ONLY AUDIT: PASS"
          echo "APK SIZE: $SIZE bytes"
          echo "=========================================="


      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload final signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS_ANDROID16_API36_FINAL_SIGNED_RELEASE_APK
          if-no-files-found: error
          path: |
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256
          retention-days: 30

name: Build RKMS Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-release:
    name: Build RKMS Release APK
    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Prepare release signing
        shell: bash
        run: |
          set -euo pipefail

          test -n "$RKMS_KEYSTORE_BASE64"
          test -n "$RKMS_KEY_ALIAS"
          test -n "$RKMS_KEYSTORE_PASSWORD"
          test -n "$RKMS_KEY_PASSWORD"

          KEYSTORE_PATH="$RUNNER_TEMP/rkms-release.keystore"

          echo "$RKMS_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          test -s "$KEYSTORE_PATH"

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          mkdir -p "$HOME/.gradle/init.d"

          cat > "$HOME/.gradle/init.d/rkms-signing.gradle" <<'EOF'
          gradle.projectsEvaluated {
              rootProject.subprojects.each { project ->
                  project.afterEvaluate {
                      try {
                          def android = project.extensions.findByName("android")
                          if (android != null && android.signingConfigs.findByName("release") != null) {
                              def releaseConfig = android.signingConfigs.getByName("release")
                              releaseConfig.storeFile = new File(System.getenv("KEYSTORE_PATH"))
                              releaseConfig.storePassword = System.getenv("RKMS_KEYSTORE_PASSWORD")
                              releaseConfig.keyAlias = System.getenv("RKMS_KEY_ALIAS")
                              releaseConfig.keyPassword = System.getenv("RKMS_KEY_PASSWORD")
                          }
                      } catch (Exception ignored) {
                      }
                  }
              }
          }
          EOF

          echo "Release signing prepared."

      - name: Build RKMS Release APK
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Find release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"

          test -n "$APK"
          test -f "$APK"

          cp "$APK" "$RUNNER_TEMP/RKMS-Connect-Release.apk"

          echo "Release APK found:"
          ls -lh "$RUNNER_TEMP/RKMS-Connect-Release.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            "$RUNNER_TEMP/RKMS-Connect-Release.apk"

          echo "APK verification PASS."

      - name: Upload RKMS Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Release-APK
          path: ${{ runner.temp }}/RKMS-Connect-Release.apk
          retention-days: 14

      - name: Cleanup signing files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/rkms-release.keystore"
          rm -f "$HOME/.gradle/init.d/rkms-signing.gradle"

name: RKMS Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout repository
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. Verify RKMS source
      # =========================================================
      - name: Verify RKMS source
        run: |
          set -e

          if [ -f app.js ] && [ -f index.html ] && [ -f config.js ]; then

            echo "Using direct RKMS source files"

          elif [ -f RKMS_CONNECT_V9_APP_LOGO_FIXED_EXACT_FINAL.zip ]; then

            echo "Using RKMS logo-fixed source ZIP"
            unzip -t RKMS_CONNECT_V9_APP_LOGO_FIXED_EXACT_FINAL.zip >/dev/null

          elif [ -f RKMS_CONNECT_APK_BUILD_READY.zip ]; then

            echo "Using RKMS source ZIP"
            unzip -t RKMS_CONNECT_APK_BUILD_READY.zip >/dev/null

          else

            ZIP_FILE=$(find . -maxdepth 1 -type f -name 'RKMS*.zip' | head -n 1)

            if [ -n "$ZIP_FILE" ]; then
              echo "Using source ZIP: $ZIP_FILE"
              unzip -t "$ZIP_FILE" >/dev/null
            else
              echo "ERROR: RKMS source not found"
              find . -maxdepth 2 -type f | sort
              exit 1
            fi

          fi


      # =========================================================
      # 3. Prepare RKMS source
      # =========================================================
      - name: Prepare RKMS source
        run: |
          set -e

          rm -rf build
          mkdir -p build

          if [ -f app.js ] && [ -f index.html ] && [ -f config.js ]; then

            echo "Using direct RKMS source files"

            rsync -a \
              --exclude='.git' \
              --exclude='.github' \
              --exclude='build' \
              --exclude='android' \
              --exclude='node_modules' \
              --exclude='*.zip' \
              ./ build/

          elif [ -f RKMS_CONNECT_V9_APP_LOGO_FIXED_EXACT_FINAL.zip ]; then

            echo "Extracting RKMS logo-fixed source ZIP"

            unzip -q RKMS_CONNECT_V9_APP_LOGO_FIXED_EXACT_FINAL.zip -d build

          elif [ -f RKMS_CONNECT_APK_BUILD_READY.zip ]; then

            echo "Extracting RKMS build-ready ZIP"

            unzip -q RKMS_CONNECT_APK_BUILD_READY.zip -d build

          else

            ZIP_FILE=$(find . -maxdepth 1 -type f -name 'RKMS*.zip' | head -n 1)

            echo "Extracting source ZIP: $ZIP_FILE"

            unzip -q "$ZIP_FILE" -d build

          fi


          # -----------------------------------------------------
          # Handle nested source directory
          # -----------------------------------------------------
          if [ ! -f build/app.js ]; then

            APP_JS=$(find build -type f -name app.js | head -n 1)

            if [ -n "$APP_JS" ]; then

              SOURCE_DIR=$(dirname "$APP_JS")

              echo "Nested RKMS source detected:"
              echo "$SOURCE_DIR"

              mkdir -p build-source

              rsync -a "$SOURCE_DIR"/ build-source/

              rm -rf build
              mv build-source build

            fi

          fi


          # -----------------------------------------------------
          # Required RKMS files
          # -----------------------------------------------------
          test -f build/app.js
          test -f build/index.html
          test -f build/config.js


          # -----------------------------------------------------
          # Exact organization logo
          # -----------------------------------------------------
          test -f build/assets/rkms-logo-transparent.png

          echo ""
          echo "=========================================="
          echo "RKMS SOURCE VERIFIED"
          echo "=========================================="

          ls -lh build/assets/rkms-logo-transparent.png


      # =========================================================
      # 4. Verify JavaScript
      # =========================================================
      - name: Verify JavaScript
        run: |
          set -e

          node --check build/app.js

          echo "app.js syntax verified"


      # =========================================================
      # 5. Create Capacitor package
      # =========================================================
      - name: Create Capacitor package
        working-directory: build
        run: |
          cat > package.json <<'EOF'
          {
            "name": "rkms",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "rm -rf dist && mkdir -p dist && rsync -a --exclude='dist' --exclude='android' --exclude='node_modules' --exclude='.git' --exclude='.github' --exclude='*.zip' ./ dist/"
            },
            "dependencies": {
              "@capacitor/core": "6.2.2",
              "@capacitor/android": "6.2.2",
              "@capacitor/app": "6.0.1"
            },
            "devDependencies": {
              "@capacitor/cli": "6.2.2"
            }
          }
          EOF


          cat > capacitor.config.json <<'EOF'
          {
            "appId": "org.rkms.connect",
            "appName": "RKMS",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https",
              "cleartext": true
            },
            "android": {
              "allowMixedContent": true,
              "captureInput": true,
              "webContentsDebuggingEnabled": false
            }
          }
          EOF


      # =========================================================
      # 6. Setup Node.js 22
      # =========================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # =========================================================
      # 7. Install dependencies
      # =========================================================
      - name: Install dependencies
        working-directory: build
        run: |
          npm install --no-audit --no-fund


      # =========================================================
      # 8. Build RKMS web application
      # =========================================================
      - name: Build RKMS web application
        working-directory: build
        run: |
          npm run build


      # =========================================================
      # 9. Setup Java 21
      # =========================================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      # =========================================================
      # 10. Setup Android SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # =========================================================
      # 11. Create Android platform
      # =========================================================
      - name: Create Android platform
        working-directory: build
        run: |
          npx cap add android


      # =========================================================
      # 12. Sync RKMS application
      # =========================================================
      - name: Sync RKMS application
        working-directory: build
        run: |
          npx cap sync android


      # =========================================================
      # 13. Install ImageMagick
      # =========================================================
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick


      # =========================================================
      # 14. Apply EXACT RKMS organization logo
      #
      # IMPORTANT:
      # This is AFTER "cap sync".
      # Capacitor cannot overwrite the logo after this step.
      # =========================================================
      - name: Apply exact RKMS organization logo
        working-directory: build
        run: |
          set -e

          LOGO="assets/rkms-logo-transparent.png"
          RES="android/app/src/main/res"

          test -f "$LOGO"

          echo ""
          echo "=========================================="
          echo "APPLYING EXACT RKMS ORGANIZATION LOGO"
          echo "=========================================="

          identify "$LOGO"


          # -----------------------------------------------------
          # Remove adaptive launcher resources which can override
          # the normal mipmap launcher icon.
          # -----------------------------------------------------
          rm -rf "$RES/mipmap-anydpi-v26"
          rm -rf "$RES/mipmap-anydpi"


          # -----------------------------------------------------
          # Remove old launcher PNG/XML files
          # -----------------------------------------------------
          find "$RES" -type f \
            \( -name 'ic_launcher.png' \
            -o -name 'ic_launcher_round.png' \
            -o -name 'ic_launcher_foreground.png' \
            -o -name 'ic_launcher_foreground.xml' \) \
            -delete


          # -----------------------------------------------------
          # Create launcher directories
          # -----------------------------------------------------
          mkdir -p \
            "$RES/mipmap-mdpi" \
            "$RES/mipmap-hdpi" \
            "$RES/mipmap-xhdpi" \
            "$RES/mipmap-xxhdpi" \
            "$RES/mipmap-xxxhdpi"


          # -----------------------------------------------------
          # Normal launcher icon
          # -----------------------------------------------------
          convert "$LOGO" -resize 48x48 \
            "$RES/mipmap-mdpi/ic_launcher.png"

          convert "$LOGO" -resize 72x72 \
            "$RES/mipmap-hdpi/ic_launcher.png"

          convert "$LOGO" -resize 96x96 \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          convert "$LOGO" -resize 144x144 \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          convert "$LOGO" -resize 192x192 \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"


          # -----------------------------------------------------
          # Round launcher icon
          # Same exact RKMS organization logo.
          # -----------------------------------------------------
          convert "$LOGO" -resize 48x48 \
            "$RES/mipmap-mdpi/ic_launcher_round.png"

          convert "$LOGO" -resize 72x72 \
            "$RES/mipmap-hdpi/ic_launcher_round.png"

          convert "$LOGO" -resize 96x96 \
            "$RES/mipmap-xhdpi/ic_launcher_round.png"

          convert "$LOGO" -resize 144x144 \
            "$RES/mipmap-xxhdpi/ic_launcher_round.png"

          convert "$LOGO" -resize 192x192 \
            "$RES/mipmap-xxxhdpi/ic_launcher_round.png"


          # -----------------------------------------------------
          # Remove remaining launcher foreground resources.
          # Other harmless drawable files are NOT used for
          # verification and will not stop the build.
          # -----------------------------------------------------
          find "$RES" -type f \
            -name 'ic_launcher_foreground.xml' \
            -delete


          echo ""
          echo "RKMS organization logo applied successfully."


      # =========================================================
      # 15. Force Android Manifest to use RKMS logo
      # =========================================================
      - name: Force RKMS launcher icon in Android Manifest
        working-directory: build
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          # Force normal launcher icon
          if 'android:icon=' in text:
              text = re.sub(
                  r'android:icon="[^"]*"',
                  'android:icon="@mipmap/ic_launcher"',
                  text,
                  count=1
              )
          else:
              text = text.replace(
                  '<application',
                  '<application android:icon="@mipmap/ic_launcher"',
                  1
              )

          # Force round launcher icon
          if 'android:roundIcon=' in text:
              text = re.sub(
                  r'android:roundIcon="[^"]*"',
                  'android:roundIcon="@mipmap/ic_launcher_round"',
                  text,
                  count=1
              )
          else:
              text = text.replace(
                  'android:icon="@mipmap/ic_launcher"',
                  'android:icon="@mipmap/ic_launcher" '
                  'android:roundIcon="@mipmap/ic_launcher_round"',
                  1
              )

          path.write_text(text)
          PY


          echo ""
          echo "=========================================="
          echo "ANDROID MANIFEST VERIFIED"
          echo "=========================================="

          grep -n "android:icon" "$MANIFEST" || true
          grep -n "android:roundIcon" "$MANIFEST" || true


      # =========================================================
      # 16. Final launcher icon verification
      #
      # IMPORTANT:
      # We only verify the actual icons that Android uses.
      # We do NOT fail because of harmless old drawable files.
      # =========================================================
      - name: Verify final RKMS launcher icons
        working-directory: build
        run: |
          set -e

          RES="android/app/src/main/res"
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          echo ""
          echo "=========================================="
          echo "VERIFYING FINAL RKMS LAUNCHER ICONS"
          echo "=========================================="


          # -----------------------------------------------------
          # Verify normal launcher icons
          # -----------------------------------------------------
          for FILE in \
            "$RES/mipmap-mdpi/ic_launcher.png" \
            "$RES/mipmap-hdpi/ic_launcher.png" \
            "$RES/mipmap-xhdpi/ic_launcher.png" \
            "$RES/mipmap-xxhdpi/ic_launcher.png" \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"
          do
            test -s "$FILE"
            echo "Verified: $FILE"
          done


          # -----------------------------------------------------
          # Verify round launcher icons
          # -----------------------------------------------------
          for FILE in \
            "$RES/mipmap-mdpi/ic_launcher_round.png" \
            "$RES/mipmap-hdpi/ic_launcher_round.png" \
            "$RES/mipmap-xhdpi/ic_launcher_round.png" \
            "$RES/mipmap-xxhdpi/ic_launcher_round.png" \
            "$RES/mipmap-xxxhdpi/ic_launcher_round.png"
          do
            test -s "$FILE"
            echo "Verified: $FILE"
          done


          # -----------------------------------------------------
          # Verify Manifest
          # -----------------------------------------------------
          grep -q 'android:icon="@mipmap/ic_launcher"' "$MANIFEST"

          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' "$MANIFEST"


          # -----------------------------------------------------
          # Adaptive launcher directory must not exist
          # -----------------------------------------------------
          if [ -d "$RES/mipmap-anydpi-v26" ]; then
            echo "ERROR: Adaptive launcher directory still exists"
            exit 1
          fi


          echo ""
          echo "=========================================="
          echo "FINAL RKMS LOGO VERIFICATION PASSED"
          echo "=========================================="


      # =========================================================
      # 17. Make Gradle executable
      # =========================================================
      - name: Make Gradle executable
        run: |
          chmod +x build/android/gradlew


      # =========================================================
      # 18. Build Debug APK
      # =========================================================
      - name: Build Debug APK
        working-directory: build/android
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace


      # =========================================================
      # 19. Verify APK
      # =========================================================
      - name: Verify APK
        run: |
          set -e

          APK="build/android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo ""
          echo "=========================================="
          echo "RKMS APK SUCCESSFULLY CREATED"
          echo "=========================================="

          ls -lh "$APK"


      # =========================================================
      # 20. Upload APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-debug-apk
          path: build/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

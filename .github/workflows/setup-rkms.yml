name: RKMS Final Android 16 API 36 APK AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release:
    name: RKMS Android 16 API 36 Release
    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. LOCATE RKMS ZIP
      # ============================================================

      - name: Locate RKMS source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          if [ -f "RKMS_CONNECT_FIXED_2026-09-18.zip" ]; then
            ZIP_FILE="RKMS_CONNECT_FIXED_2026-09-18.zip"
          fi

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . \
              -maxdepth 3 \
              -type f \
              -name 'RKMS_CONNECT_FIXED_2026-09-18.zip' \
              -print -quit)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: RKMS_CONNECT_FIXED_2026-09-18.zip not found."
            echo ""
            echo "Available ZIP files:"
            find . \
              -maxdepth 3 \
              -type f \
              -name '*.zip' \
              -print
            exit 1
          fi

          echo "RKMS ZIP:"
          echo "$ZIP_FILE"

          echo "RKMS_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "RKMS ZIP located: PASS"


      # ============================================================
      # 3. EXTRACT SOURCE
      # ============================================================

      - name: Extract RKMS source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .rkms_extract
          mkdir -p .rkms_extract

          unzip -q "$RKMS_ZIP" -d .rkms_extract

          PACKAGE_JSON="$(find .rkms_extract \
            -type f \
            -name 'package.json' \
            -print -quit)"

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json not found in RKMS ZIP."
            exit 1
          fi

          SOURCE_DIR="$(dirname "$PACKAGE_JSON")"

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

          echo "SOURCE_DIR=$SOURCE_DIR"

          test -f "$SOURCE_DIR/package.json"
          test -f "$SOURCE_DIR/app.js"
          test -f "$SOURCE_DIR/index.html"
          test -f "$SOURCE_DIR/styles.css"
          test -f "$SOURCE_DIR/capacitor.config.json"
          test -f "$SOURCE_DIR/google-services.json"

          echo "RKMS source extraction: PASS"


      # ============================================================
      # 4. VERIFY IMPORTANT SOURCE FILES
      # ============================================================

      - name: Verify RKMS source files
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          REQUIRED_FILES="
          package.json
          app.js
          index.html
          styles.css
          capacitor.config.json
          google-services.json
          scripts/configure-android-16.sh
          scripts/setup-android-native.sh
          scripts/configure-release-signing.sh
          scripts/verify-saved-login.py
          scripts/verify-fcm-pipeline.py
          scripts/verify-native-bridge.py
          scripts/verify-rkms-final.py
          "

          for FILE in $REQUIRED_FILES; do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Missing $FILE"
              exit 1
            fi
          done

          echo "Required RKMS source files: PASS"


      # ============================================================
      # 5. NODE 22
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'


      # ============================================================
      # 6. NODE / JAVASCRIPT CHECK
      # ============================================================

      - name: Verify Node and JavaScript
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          node --version
          npm --version

          node --check app.js

          echo "Node.js 22: PASS"
          echo "app.js syntax: PASS"


      # ============================================================
      # 7. INSTALL NPM
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          npm install --no-audit --no-fund

          npm ls @capacitor/core --depth=0
          npm ls @capacitor/android --depth=0
          npm ls @capacitor/push-notifications --depth=0

          echo "NPM dependencies: PASS"


      # ============================================================
      # 8. BUILD WEB
      # ============================================================

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          npm run build

          test -s dist/index.html

          echo "Web build: PASS"


      # ============================================================
      # 9. JDK 17
      # ============================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 10. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"

          yes | "$SDKMANAGER" \
            --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          test -d "${ANDROID_HOME}/platforms/android-36"
          test -d "${ANDROID_HOME}/build-tools/36.0.0"

          echo "Android SDK API 36: PASS"


      # ============================================================
      # 11. CAPACITOR ANDROID
      # ============================================================

      - name: Generate Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          rm -rf android

          npx cap add android

          test -f android/app/build.gradle
          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml

          echo "Capacitor Android project: PASS"


      # ============================================================
      # 12. CONFIGURE ANDROID 16 / API 36
      # ============================================================

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          chmod +x scripts/configure-android-16.sh

          bash scripts/configure-android-16.sh

          test -f android/variables.gradle
          test -f android/build.gradle
          test -f android/gradle/wrapper/gradle-wrapper.properties

          grep -Eq \
            'compileSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

          grep -Eq \
            'targetSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

          grep -Fq \
            'com.android.tools.build:gradle:8.9.1' \
            android/build.gradle

          grep -Fq \
            'gradle-8.11.1-bin.zip' \
            android/gradle/wrapper/gradle-wrapper.properties

          echo "compileSdkVersion 36: PASS"
          echo "targetSdkVersion 36: PASS"
          echo "AGP 8.9.1: PASS"
          echo "Gradle 8.11.1: PASS"


      # ============================================================
      # 13. CAPACITOR SYNC
      # ============================================================

      - name: Sync Capacitor
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          npx cap sync android

          test -f android/app/src/main/AndroidManifest.xml

          echo "Capacitor sync: PASS"


      # ============================================================
      # 14. RKMS NATIVE + FIREBASE
      # ============================================================

      - name: Configure RKMS native Android and Firebase
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          chmod +x scripts/setup-android-native.sh

          bash scripts/setup-android-native.sh

          test -s android/app/google-services.json

          test -f \
            android/app/src/main/java/org/rkms/connect/MainActivity.java

          test -f \
            android/app/src/main/java/org/rkms/connect/RKMSNativeBridge.java

          test -f \
            android/app/src/main/java/org/rkms/connect/RKMSSecureCredentialsPlugin.java

          grep -Fq \
            'FirebaseApp.initializeApp(this)' \
            android/app/src/main/java/org/rkms/connect/MainActivity.java

          grep -Fq \
            'registerPlugin(RKMSSecureCredentialsPlugin.class)' \
            android/app/src/main/java/org/rkms/connect/MainActivity.java

          grep -Fq \
            'RKMSNativeBridge(this, getBridge().getWebView())' \
            android/app/src/main/java/org/rkms/connect/MainActivity.java

          grep -Fq \
            'com.google.gms.google-services' \
            android/app/build.gradle

          echo "Firebase configuration: PASS"
          echo "Firebase initialization: PASS"
          echo "Secure credentials plugin: PASS"
          echo "RKMS native bridge: PASS"


      # ============================================================
      # 15. FIREBASE JSON PACKAGE
      # ============================================================

      - name: Verify Firebase package
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = "org.rkms.connect"

          path = Path("android/app/google-services.json")

          data = json.loads(path.read_text())

          packages = []

          for client in data.get("client", []):
              info = client.get("client_info", {})
              android = info.get("android_client_info", {})
              package_name = android.get("package_name")

              if package_name:
                  packages.append(package_name)

          print("Firebase packages:")
          for package in packages:
              print(" -", package)

          if expected not in packages:
              raise SystemExit(
                  f"ERROR: {expected} not found in google-services.json"
              )

          print("Firebase package org.rkms.connect: PASS")
          PY


      # ============================================================
      # 16. FIREBASE SDK DEPENDENCY CHECK
      # ============================================================

      - name: Verify Firebase Android configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          grep -Fq \
            'com.google.gms:google-services:4.4.3' \
            android/build.gradle

          grep -Fq \
            'com.google.gms.google-services' \
            android/app/build.gradle

          grep -Fq \
            'com.google.firebase:firebase-messaging' \
            package.json \
            || true

          grep -Fq \
            'firebase' \
            scripts/setup-android-native.sh

          echo "Google Services Gradle plugin: PASS"
          echo "Firebase native configuration: PASS"


      # ============================================================
      # 17. FIREBASE MAIN ACTIVITY — SAFE VERIFICATION
      #
      # IMPORTANT:
      # DO NOT count onCreate using the old broken regex.
      # The actual Java compilation below is the definitive syntax
      # verification.
      # ============================================================

      - name: Verify Firebase MainActivity
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          MAIN_ACTIVITY="android/app/src/main/java/org/rkms/connect/MainActivity.java"

          test -f "$MAIN_ACTIVITY"

          echo "MainActivity:"
          echo "$MAIN_ACTIVITY"

          grep -Fq \
            'FirebaseApp.initializeApp(this)' \
            "$MAIN_ACTIVITY"

          grep -Fq \
            'registerPlugin(RKMSSecureCredentialsPlugin.class)' \
            "$MAIN_ACTIVITY"

          grep -Fq \
            'super.onCreate(savedInstanceState);' \
            "$MAIN_ACTIVITY"

          grep -Fq \
            'RKMSNativeBridge(this, getBridge().getWebView())' \
            "$MAIN_ACTIVITY"

          # Exactly one Firebase initialization call.
          FIREBASE_COUNT="$(grep -F \
            -o 'FirebaseApp.initializeApp(this)' \
            "$MAIN_ACTIVITY" \
            | wc -l)"

          echo "Firebase initialization count: $FIREBASE_COUNT"

          if [ "$FIREBASE_COUNT" -ne 1 ]; then
            echo "ERROR: Firebase initialization must occur exactly once."
            exit 1
          fi

          # Exactly one Java onCreate method.
          ONCREATE_COUNT="$(grep -E \
            -c 'void[[:space:]]+onCreate[[:space:]]*\(' \
            "$MAIN_ACTIVITY" \
            || true)"

          echo "onCreate count: $ONCREATE_COUNT"

          if [ "$ONCREATE_COUNT" -ne 1 ]; then
            echo "ERROR: MainActivity must contain exactly one onCreate()."
            grep -n 'onCreate' "$MAIN_ACTIVITY" || true
            exit 1
          fi

          echo "Firebase MainActivity verification: PASS"


      # ============================================================
      # 18. NATIVE BRIDGE VERIFICATION
      # ============================================================

      - name: Verify RKMS native bridge
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 scripts/verify-native-bridge.py

          BRIDGE="android/app/src/main/java/org/rkms/connect/RKMSNativeBridge.java"

          test -f "$BRIDGE"

          if grep -Fq '\n@JavascriptInterface' "$BRIDGE"; then
            echo "ERROR: literal \\n remains."
            exit 1
          fi

          if grep -Fq '\n @JavascriptInterface' "$BRIDGE"; then
            echo "ERROR: literal \\n remains."
            exit 1
          fi

          grep -Fq 'isFirebaseReady' "$BRIDGE"
          grep -Fq 'saveSession' "$BRIDGE"

          echo "RKMS native bridge verification: PASS"


      # ============================================================
      # 19. SAVED LOGIN VERIFICATION
      # ============================================================

      - name: Verify saved login
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 scripts/verify-saved-login.py

          echo "Saved login verification: PASS"


      # ============================================================
      # 20. FCM VERIFICATION
      # ============================================================

      - name: Verify FCM pipeline
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 scripts/verify-fcm-pipeline.py

          echo "FCM pipeline verification: PASS"


      # ============================================================
      # 21. FINAL RKMS STATIC AUDIT
      # ============================================================

      - name: Run final RKMS static audit
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 scripts/verify-rkms-final.py

          echo "Final RKMS static audit: PASS"


      # ============================================================
      # 22. LOGIN NAVIGATION AUDIT
      # ============================================================

      - name: Verify login navigation
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 scripts/verify-final-login-navigation.py

          echo "Login/navigation audit: PASS"


      # ============================================================
      # 23. AUTHORITY AUDIT
      # ============================================================

      - name: Verify authority hierarchy
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 scripts/verify-authority-hierarchy.py

          echo "Authority hierarchy audit: PASS"


      # ============================================================
      # 24. DIRECTORY AUDIT
      # ============================================================

      - name: Verify directory
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 scripts/verify-directory-lists.py
          python3 scripts/verify-member-directory-scope.py
          python3 scripts/verify-directory-contact-actions.py
          python3 scripts/verify-v17-directory-deep.py

          echo "Directory audit: PASS"


      # ============================================================
      # 25. PROFILE AUDIT
      # ============================================================

      - name: Verify profile update
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 scripts/verify-profile-update-final.py

          echo "Profile update audit: PASS"


      # ============================================================
      # 26. PDF AUDIT
      # ============================================================

      - name: Verify PDF pipeline
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 scripts/verify-pdf-pipeline.py
          python3 scripts/verify-report-download-scope.py

          echo "PDF/report audit: PASS"


      # ============================================================
      # 27. COMPLAINT SOURCE AUDIT
      #
      # The old verify-complaint-final.py contains an obsolete
      # "APK only / bundleRelease must not exist" assertion.
      # We do NOT run that obsolete build-format assertion.
      # The actual complaint implementation is checked here.
      # ============================================================

      - name: Verify complaint implementation
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          grep -Fq 'memberCloseComplaint' app.js
          grep -Fq 'memberReopenComplaint' app.js
          grep -Fq 'officerCloseComplaint' app.js
          grep -Fq 'rkms_officer_close_complaint' app.js
          grep -Fq 'rkms_officer_close_complaint' \
            supabase/migrations/20260915090000_complaint_officer_close.sql
          grep -Fq "if v_old<>'RESOLVED'" \
            supabase/migrations/20260915090000_complaint_officer_close.sql
          grep -Fq "if v_old<>'RESOLVED'" \
            supabase/migrations/20260914191000_complaint_workflow_final_hardening.sql
          grep -Fq '.complaint-action-card' styles.css

          echo "Complaint implementation audit: PASS"


      # ============================================================
      # 28. ANDROID 16 AUDIT
      # ============================================================

      - name: Verify Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 scripts/verify-android-16.py

          echo "Android 16 API 36 audit: PASS"


      # ============================================================
      # 29. RELEASE SIGNING SECRETS
      # ============================================================

      - name: Verify release signing secrets
        shell: bash
        run: |
          set -euo pipefail

          test -n "${RKMS_KEYSTORE_BASE64:-}" \
            || { echo "ERROR: RKMS_KEYSTORE_BASE64 missing."; exit 1; }

          test -n "${RKMS_KEYSTORE_PASSWORD:-}" \
            || { echo "ERROR: RKMS_KEYSTORE_PASSWORD missing."; exit 1; }

          test -n "${RKMS_KEY_ALIAS:-}" \
            || { echo "ERROR: RKMS_KEY_ALIAS missing."; exit 1; }

          test -n "${RKMS_KEY_PASSWORD:-}" \
            || { echo "ERROR: RKMS_KEY_PASSWORD missing."; exit 1; }

          echo "Release signing secrets: PASS"


      # ============================================================
      # 30. CONFIGURE RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          chmod +x scripts/configure-release-signing.sh

          bash scripts/configure-release-signing.sh

          test -s android/app/release.keystore

          grep -Fq \
            'signingConfigs.release' \
            android/app/build.gradle

          grep -Fq \
            'rkms-release' \
            android/app/build.gradle \
            || true

          echo "Release signing configuration: PASS"


      # ============================================================
      # 31. FINAL GRADLE CONFIGURATION
      # ============================================================

      - name: Final Gradle configuration verification
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          chmod +x android/gradlew

          grep -Fq \
            'gradle-8.11.1-bin.zip' \
            android/gradle/wrapper/gradle-wrapper.properties

          grep -Fq \
            'com.android.tools.build:gradle:8.9.1' \
            android/build.gradle

          grep -Eq \
            'compileSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

          grep -Eq \
            'targetSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

          grep -Eq \
            'minSdkVersion[[:space:]]*=[[:space:]]*23' \
            android/variables.gradle

          echo "Gradle wrapper: PASS"
          echo "AGP: PASS"
          echo "compileSdk 36: PASS"
          echo "targetSdk 36: PASS"
          echo "minSdk 23: PASS"


      # ============================================================
      # 32. FINAL FIREBASE CHECK BEFORE BUILD
      # ============================================================

      - name: Final Firebase pre-build verification
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          test -s google-services.json
          test -s android/app/google-services.json

          MAIN="android/app/src/main/java/org/rkms/connect/MainActivity.java"

          test -f "$MAIN"

          grep -Fq \
            'FirebaseApp.initializeApp(this)' \
            "$MAIN"

          grep -Fq \
            'registerPlugin(RKMSSecureCredentialsPlugin.class)' \
            "$MAIN"

          grep -Fq \
            'RKMSNativeBridge(this, getBridge().getWebView())' \
            "$MAIN"

          FIREBASE_COUNT="$(grep -F \
            -o 'FirebaseApp.initializeApp(this)' \
            "$MAIN" | wc -l)"

          if [ "$FIREBASE_COUNT" -ne 1 ]; then
            echo "ERROR: Firebase init count = $FIREBASE_COUNT"
            exit 1
          fi

          grep -Fq \
            'com.google.gms.google-services' \
            android/app/build.gradle

          echo "Firebase pre-build verification: PASS"


      # ============================================================
      # 33. GRADLE BUILD
      #
      # BOTH APK AND AAB
      # ============================================================

      - name: Build signed Release APK and AAB
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR/android"

          chmod +x gradlew

          echo "============================================================"
          echo "BUILDING RKMS RELEASE APK + AAB"
          echo "============================================================"

          ./gradlew \
            clean \
            assembleRelease \
            bundleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "Gradle build completed."


      # ============================================================
      # 34. VERIFY APK
      # ============================================================

      - name: Verify Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: Release APK not found."
            find android/app/build/outputs \
              -type f \
              \( -name '*.apk' -o -name '*.aab' \) \
              -print
            exit 1
          fi

          apksigner verify \
            --verbose \
            "$APK"

          echo "Release APK:"
          ls -lh "$APK"

          echo "APK signature verification: PASS"


      # ============================================================
      # 35. VERIFY AAB
      # ============================================================

      - name: Verify Release AAB
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -s "$AAB" ]; then
            echo "ERROR: Release AAB not found."
            find android/app/build/outputs \
              -type f \
              \( -name '*.apk' -o -name '*.aab' \) \
              -print
            exit 1
          fi

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB"

          echo "Release AAB:"
          ls -lh "$AAB"

          echo "AAB signature verification: PASS"


      # ============================================================
      # 36. PREPARE RELEASE FILES
      # ============================================================

      - name: Prepare final release files
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          rm -rf release
          mkdir -p release

          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          cp \
            android/app/build/outputs/bundle/release/app-release.aab \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab

          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab

          echo "Final APK:"
          ls -lh \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          echo "Final AAB:"
          ls -lh \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab

          echo "Release files prepared: PASS"


      # ============================================================
      # 37. SHA256 APK
      # ============================================================

      - name: Generate APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          sha256sum \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk \
            | tee release/RKMS_ANDROID16_API36_APK_SHA256.txt


      # ============================================================
      # 38. SHA256 AAB
      # ============================================================

      - name: Generate AAB SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          sha256sum \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab \
            | tee release/RKMS_ANDROID16_API36_AAB_SHA256.txt


      # ============================================================
      # 39. FINAL RELEASE VERIFICATION
      # ============================================================

      - name: Final release verification
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab

          apksigner verify \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          jarsigner -verify \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab

          echo ""
          echo "============================================================"
          echo " RKMS FINAL RELEASE BUILD: READY"
          echo "============================================================"
          echo " Android compile SDK : 36"
          echo " Android target SDK  : 36"
          echo " Android min SDK     : 23"
          echo " Firebase            : INITIALIZED"
          echo " FCM                 : CONFIGURED"
          echo " Native bridge       : VERIFIED"
          echo " Saved login         : VERIFIED"
          echo " APK                 : SIGNED"
          echo " AAB                 : SIGNED"
          echo "============================================================"

          ls -lh release/


      # ============================================================
      # 40. UPLOAD APK + AAB
      # ============================================================

      - name: Upload final APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Android-16-API36-FINAL-APK-AAB
          path: |
            ${{ env.SOURCE_DIR }}/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            ${{ env.SOURCE_DIR }}/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab
            ${{ env.SOURCE_DIR }}/release/RKMS_ANDROID16_API36_APK_SHA256.txt
            ${{ env.SOURCE_DIR }}/release/RKMS_ANDROID16_API36_AAB_SHA256.txt
          if-no-files-found: error
          retention-days: 90

name: RKMS Final Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  AGP_VERSION: "8.9.1"
  GRADLE_VERSION: "8.11.1"
  APP_ID: "org.rkms.connect"
  SOURCE_ZIP: "RKMS_CONNECT_NOTIFICATION_SYSTEM_FULL_FIX_20260923_AUDITED_FIXED.zip"

jobs:
  build-release-apk:
    name: Build Signed Release APK
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail
          java -version
          javac -version

      # ============================================================
      # 3. NODE 22
      # ============================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Node and npm
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version

      # ============================================================
      # 4. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android API 36 and Build Tools
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "Android SDK packages installed successfully."

      - name: Verify Android SDK tools
        shell: bash
        run: |
          set -euo pipefail

          command -v adb
          command -v sdkmanager

          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" version
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" version
          adb version
          sdkmanager --version

      # ============================================================
      # 5. LOCATE SOURCE ZIP
      # ============================================================
      - name: Locate RKMS source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Looking for:"
          echo "$SOURCE_ZIP"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "Exact ZIP not found at repository root."
            echo "Searching repository..."

            FOUND_ZIP="$(find . -type f -name "$SOURCE_ZIP" -print -quit || true)"

            if [ -z "$FOUND_ZIP" ]; then
              echo "ERROR: Source ZIP not found."
              echo "Available ZIP files:"
              find . -type f -iname "*.zip" -print || true
              exit 1
            fi

            cp "$FOUND_ZIP" "./$SOURCE_ZIP"
          fi

          test -f "$SOURCE_ZIP"

          echo "SOURCE ZIP FOUND:"
          ls -lh "$SOURCE_ZIP"

      # ============================================================
      # 6. EXTRACT SOURCE
      # ============================================================
      - name: Extract RKMS source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source extracted
          mkdir -p source extracted

          unzip -q "$SOURCE_ZIP" -d extracted

          echo "Extracted source:"
          find extracted -maxdepth 3 -type f | head -100

          PACKAGE_JSON="$(find extracted -type f -name package.json -print -quit || true)"

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json not found inside ZIP."
            exit 1
          fi

          SOURCE_ROOT="$(dirname "$PACKAGE_JSON")"

          echo "SOURCE_ROOT=$SOURCE_ROOT"

          cp -a "$SOURCE_ROOT"/. source/

          echo "Source copied."

          ls -la source

      # ============================================================
      # 7. VERIFY REQUIRED FILES
      # ============================================================
      - name: Verify required source files
        shell: bash
        run: |
          set -euo pipefail

          cd source

          REQUIRED_FILES=(
            "package.json"
            "package-lock.json"
            "app.js"
            "index.html"
            "styles.css"
            "capacitor.config.json"
            "google-services.json"
            "scripts/setup-android-native.sh"
            "scripts/configure-android-16.sh"
            "scripts/configure-release-signing.sh"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing required file: $file"
              exit 1
            fi

            echo "FOUND: $file"
          done

          echo "Required source files: PASS"

      # ============================================================
      # 8. VERIFY CAPACITOR VERSIONS
      # ============================================================
      - name: Verify Capacitor versions
        shell: bash
        run: |
          set -euo pipefail

          cd source

          node <<'NODE'
          const fs = require('fs');

          const pkg = JSON.parse(
            fs.readFileSync('package.json', 'utf8')
          );

          const expected = {
            '@capacitor/core': '6.2.2',
            '@capacitor/android': '6.2.2',
            '@capacitor/app': '6.0.3',
            '@capacitor/push-notifications': '6.0.3',
            '@capacitor/cli': '6.2.2'
          };

          const all = {
            ...(pkg.dependencies || {}),
            ...(pkg.devDependencies || {})
          };

          for (const [name, version] of Object.entries(expected)) {
            if (all[name] !== version) {
              console.error(
                `ERROR: ${name} expected ${version}, found ${all[name] || 'missing'}`
              );
              process.exit(1);
            }

            console.log(`PASS: ${name} ${version}`);
          }
          NODE

      # ============================================================
      # 9. VERIFY CAPACITOR CONFIG
      # ============================================================
      - name: Verify Capacitor configuration
        shell: bash
        run: |
          set -euo pipefail

          cd source

          node <<'NODE'
          const fs = require('fs');

          const text = fs.readFileSync(
            'capacitor.config.json',
            'utf8'
          );

          if (!text.includes('org.rkms.connect')) {
            console.error(
              'ERROR: org.rkms.connect not found in capacitor.config.json'
            );
            process.exit(1);
          }

          console.log('Capacitor APP ID: PASS');
          NODE

      # ============================================================
      # 10. VERIFY FIREBASE CONFIG
      # ============================================================
      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd source

          test -s google-services.json

          grep -q \
            '"package_name"[[:space:]]*:[[:space:]]*"org.rkms.connect"' \
            google-services.json

          echo "Firebase package: PASS"

      # ============================================================
      # 11. VERIFY FCM PIPELINE
      # ============================================================
      - name: Verify FCM pipeline
        shell: bash
        run: |
          set -euo pipefail

          cd source

          if [ -f scripts/verify-fcm-pipeline.py ]; then
            python3 scripts/verify-fcm-pipeline.py
          else
            echo "FCM verification script not found; continuing."
          fi

      # ============================================================
      # 12. VERIFY SAVED LOGIN
      # ============================================================
      - name: Verify saved login
        shell: bash
        run: |
          set -euo pipefail

          cd source

          if [ -f scripts/verify-saved-login.py ]; then
            python3 scripts/verify-saved-login.py
          else
            echo "Saved-login verification script not found; continuing."
          fi

      # ============================================================
      # 13. VERIFY NATIVE BRIDGE
      # ============================================================
      - name: Verify native bridge
        shell: bash
        run: |
          set -euo pipefail

          cd source

          if [ -f scripts/verify-native-bridge.py ]; then
            python3 scripts/verify-native-bridge.py
          else
            echo "Native bridge verification script not found; continuing."
          fi

      # ============================================================
      # 14. VERIFY RKMS FINAL
      # ============================================================
      - name: Verify RKMS final
        shell: bash
        run: |
          set -euo pipefail

          cd source

          if [ -f scripts/verify-rkms-final.py ]; then
            python3 scripts/verify-rkms-final.py
          else
            echo "RKMS final verification script not found; continuing."
          fi

      # ============================================================
      # 15. VERIFY CHAT MICROPHONE
      # ============================================================
      - name: Verify chat microphone
        shell: bash
        run: |
          set -euo pipefail

          cd source

          if [ -f scripts/verify-chat-mic-final.py ]; then
            python3 scripts/verify-chat-mic-final.py
          else
            echo "Chat mic verification script not found; continuing."
          fi

      # ============================================================
      # 16. VERIFY FINAL THREE POINT FIX
      # ============================================================
      - name: Verify final three point fix
        shell: bash
        run: |
          set -euo pipefail

          cd source

          if [ -f scripts/verify-final-three-point-fix.py ]; then
            python3 scripts/verify-final-three-point-fix.py
          else
            echo "Three-point verification script not found; continuing."
          fi

      # ============================================================
      # 17. VERIFY ANDROID 16
      # ============================================================
      - name: Verify Android 16
        shell: bash
        run: |
          set -euo pipefail

          cd source

          if [ -f scripts/verify-android-16.py ]; then
            python3 scripts/verify-android-16.py
          else
            echo "Android 16 verification script not found; continuing."
          fi

      # ============================================================
      # 18. INSTALL NPM DEPENDENCIES
      # ============================================================
      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd source

          npm ci --no-audit --no-fund

      # ============================================================
      # 19. VERIFY INSTALLED PUSH NOTIFICATIONS
      # ============================================================
      - name: Verify installed push notifications
        shell: bash
        run: |
          set -euo pipefail

          cd source

          node -e "
            const p=require('./node_modules/@capacitor/push-notifications/package.json');

            if(p.version!=='6.0.3'){
              console.error('Wrong push-notifications version:',p.version);
              process.exit(1);
            }

            console.log('push-notifications:',p.version);
          "

      # ============================================================
      # 20. BUILD WEB
      # ============================================================
      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd source

          npm run build

          test -d dist
          test -f dist/index.html

          echo "Web build: PASS"

      # ============================================================
      # 21. CREATE FRESH ANDROID PROJECT
      # ============================================================
      - name: Create fresh Android project
        shell: bash
        run: |
          set -euo pipefail

          cd source

          rm -rf android

          npx cap add android

      # ============================================================
      # 22. CONFIGURE ANDROID 16 / API 36
      # ============================================================
      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd source

          chmod +x scripts/configure-android-16.sh

          ./scripts/configure-android-16.sh

      # ============================================================
      # 23. FORCE SDK CONFIGURATION
      # ============================================================
      - name: Enforce Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          cd source

          if [ -f android/variables.gradle ]; then

            sed -i \
              -E 's/compileSdkVersion[[:space:]]*=[[:space:]]*[0-9]+/compileSdkVersion = 36/' \
              android/variables.gradle || true

            sed -i \
              -E 's/targetSdkVersion[[:space:]]*=[[:space:]]*[0-9]+/targetSdkVersion = 36/' \
              android/variables.gradle || true

            sed -i \
              -E 's/minSdkVersion[[:space:]]*=[[:space:]]*[0-9]+/minSdkVersion = 23/' \
              android/variables.gradle || true

          fi

          grep -RniE \
            "compileSdkVersion[[:space:]]*=[[:space:]]*36|compileSdk[[:space:]]+36" \
            android \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            | head -20 || true

      # ============================================================
      # 24. CAPACITOR SYNC
      # ============================================================
      - name: Sync Capacitor
        shell: bash
        run: |
          set -euo pipefail

          cd source

          npx cap sync android

      # ============================================================
      # 25. RKMS NATIVE SETUP
      # ============================================================
      - name: Setup RKMS Android native integration
        shell: bash
        run: |
          set -euo pipefail

          cd source

          chmod +x scripts/setup-android-native.sh

          ./scripts/setup-android-native.sh

      # ============================================================
      # 26. FIX GOOGLE SERVICES VERSION
      # ============================================================
      - name: Fix Google Services plugin version
        shell: bash
        run: |
          set -euo pipefail

          cd source

          test -f android/build.gradle
          test -f android/app/build.gradle

          echo "Google Services references before fix:"
          grep -nE \
            "google-services|google\.gms" \
            android/build.gradle \
            android/app/build.gradle || true

          sed -i \
            's/com\.google\.gms:google-services:4\.4\.0/com.google.gms:google-services:4.4.3/g' \
            android/build.gradle

          if ! grep -q \
            "com.google.gms.google-services" \
            android/app/build.gradle; then

            printf '\napply plugin: "com.google.gms.google-services"\n' \
              >> android/app/build.gradle
          fi

          echo
          echo "Google Services references after fix:"
          grep -nE \
            "google-services|google\.gms" \
            android/build.gradle \
            android/app/build.gradle || true

      # ============================================================
      # 27. VERIFY GOOGLE SERVICES PLUGIN
      # ============================================================
      - name: Verify Google Services plugin
        shell: bash
        run: |
          set -euo pipefail

          cd source

          test -f android/build.gradle
          test -f android/app/build.gradle

          grep -q \
            "com.google.gms:google-services:4.4.3" \
            android/build.gradle

          grep -q \
            "com.google.gms.google-services" \
            android/app/build.gradle

          echo "Google Services plugin 4.4.3: PASS"
          echo "Google Services app plugin: PASS"

      # ============================================================
      # 28. VERIFY FIREBASE NATIVE CONFIG
      # ============================================================
      - name: Verify Firebase native configuration
        shell: bash
        run: |
          set -euo pipefail

          cd source

          test -f android/app/google-services.json

          grep -q \
            '"package_name"[[:space:]]*:[[:space:]]*"org.rkms.connect"' \
            android/app/google-services.json

          echo "android/app/google-services.json: PASS"

      # ============================================================
      # 29. VERIFY MAIN ACTIVITY
      # ============================================================
      - name: Verify MainActivity
        shell: bash
        run: |
          set -euo pipefail

          cd source

          MAIN_ACTIVITY="$(
            find android/app/src/main \
              -type f \
              -name MainActivity.java \
              -print -quit || true
          )"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.java not found."
            exit 1
          fi

          echo "MainActivity: $MAIN_ACTIVITY"

          grep -q "RKMSNativeBridge" "$MAIN_ACTIVITY"
          grep -q "FirebaseApp.initializeApp" "$MAIN_ACTIVITY"
          grep -q "onNewIntent" "$MAIN_ACTIVITY"

          echo "MainActivity native bridge: PASS"

      # ============================================================
      # 30. ENSURE FIREBASE MESSAGING
      # ============================================================
      - name: Ensure Firebase Messaging dependency
        shell: bash
        run: |
          set -euo pipefail

          cd source

          APP_GRADLE="android/app/build.gradle"

          test -f "$APP_GRADLE"

          if grep -q "firebase-messaging" "$APP_GRADLE"; then

            echo "Firebase Messaging dependency already present."

          else

            echo "Firebase Messaging dependency missing. Adding it."

            python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          text = p.read_text()

          dependency = """
              implementation 'com.google.firebase:firebase-messaging:25.0.1'
          """

          if "dependencies {" not in text:
              raise SystemExit("dependencies block not found")

          text = text.replace(
              "dependencies {",
              "dependencies {" + dependency,
              1
          )

          p.write_text(text)

          print("Firebase Messaging dependency added.")
          PY

          fi

          grep -q "firebase-messaging" "$APP_GRADLE"

      # ============================================================
      # 31. VERIFY FINAL ANDROID CONFIGURATION
      # ============================================================
      - name: Verify final Android configuration
        shell: bash
        run: |
          set -euo pipefail

          cd source

          test -f android/gradlew

          chmod +x android/gradlew

          echo "Gradle wrapper:"
          grep -n "distributionUrl" \
            android/gradle/wrapper/gradle-wrapper.properties

          echo
          echo "Compile SDK / target SDK:"
          grep -RniE \
            "compileSdk|targetSdk|minSdk" \
            android \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            | head -40

          echo
          echo "Google Services:"
          grep -nE \
            "google-services|google\.gms" \
            android/build.gradle \
            android/app/build.gradle

          echo
          echo "Android configuration: PASS"

      # ============================================================
      # 32. RESOLVE GRADLE DEPENDENCIES
      # ============================================================
      - name: Resolve Gradle dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd source/android

          ./gradlew \
            --no-daemon \
            --stacktrace \
            dependencies

      # ============================================================
      # 33. STATIC ANDROID AUDIT
      # ============================================================
      - name: Static Android audit
        shell: bash
        run: |
          set -euo pipefail

          cd source

          MAIN_ACTIVITY="$(
            find android/app/src/main \
              -type f \
              -name MainActivity.java \
              -print -quit
          )"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.java not found."
            exit 1
          fi

          grep -q "FirebaseApp.initializeApp" "$MAIN_ACTIVITY"
          grep -q "RKMSNativeBridge" "$MAIN_ACTIVITY"
          grep -q "onNewIntent" "$MAIN_ACTIVITY"

          grep -Rqs "POST_NOTIFICATIONS" \
            android/app/src/main

          grep -Rqs "RECORD_AUDIO" \
            android/app/src/main

          echo "Static Android audit: PASS"

      # ============================================================
      # 34. VERIFY RELEASE SIGNING SECRETS
      # ============================================================
      - name: Verify release signing secrets
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$RKMS_KEYSTORE_BASE64" || {
            echo "ERROR: RKMS_KEYSTORE_BASE64 secret missing."
            exit 1
          }

          test -n "$RKMS_KEYSTORE_PASSWORD" || {
            echo "ERROR: RKMS_KEYSTORE_PASSWORD secret missing."
            exit 1
          }

          test -n "$RKMS_KEY_ALIAS" || {
            echo "ERROR: RKMS_KEY_ALIAS secret missing."
            exit 1
          }

          test -n "$RKMS_KEY_PASSWORD" || {
            echo "ERROR: RKMS_KEY_PASSWORD secret missing."
            exit 1
          }

          echo "Release signing secrets: PASS"

      # ============================================================
      # 35. CONFIGURE RELEASE SIGNING
      # ============================================================
      - name: Configure release signing
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd source

          chmod +x scripts/configure-release-signing.sh

          ./scripts/configure-release-signing.sh

      # ============================================================
      # 36. VALIDATE KEYSTORE
      # ============================================================
      - name: Validate release keystore
        shell: bash
        env:
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          cd source

          KEYSTORE="$(
            find android \
              -type f \
              \( -name "*.jks" -o -name "*.keystore" \) \
              -print -quit || true
          )"

          if [ -z "$KEYSTORE" ]; then
            echo "ERROR: Release keystore not found."
            exit 1
          fi

          echo "Keystore found."

          keytool \
            -list \
            -keystore "$KEYSTORE" \
            -storepass "$RKMS_KEYSTORE_PASSWORD" \
            >/dev/null

          echo "Keystore validation: PASS"

      # ============================================================
      # 37. VERIFY GRADLE VERSION
      # ============================================================
      - name: Verify Gradle version
        shell: bash
        run: |
          set -euo pipefail

          cd source/android

          ./gradlew --version

      # ============================================================
      # 38. FIX MAINACTIVITY JAVA SYNTAX
      #
      # LAST RUN FAILED HERE:
      # MainActivity.java contained:
      # ""NOT_READY""
      # ""ERROR""
      #
      # Correct Java strings are:
      # "NOT_READY"
      # "ERROR"
      #
      # NOTHING BEFORE THIS STEP IS CHANGED.
      # ============================================================
      - name: Fix MainActivity Java syntax
        shell: bash
        run: |
          set -euo pipefail

          cd source

          MAIN_ACTIVITY="$(
            find android/app/src/main \
              -type f \
              -name MainActivity.java \
              -print -quit || true
          )"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.java not found."
            exit 1
          fi

          echo "MainActivity:"
          echo "$MAIN_ACTIVITY"

          echo
          echo "Checking malformed Java strings before fix:"
          grep -n \
            -E '""NOT_READY""|""ERROR""' \
            "$MAIN_ACTIVITY" || true

          # Fix only the malformed strings reported by javac.
          sed -i \
            's/""NOT_READY""/"NOT_READY"/g' \
            "$MAIN_ACTIVITY"

          sed -i \
            's/""ERROR""/"ERROR"/g' \
            "$MAIN_ACTIVITY"

          echo
          echo "Checking corrected lines:"
          grep -n \
            -E 'NOT_READY|ERROR' \
            "$MAIN_ACTIVITY" \
            | head -20 || true

          if grep -q \
            '""NOT_READY""\|""ERROR""' \
            "$MAIN_ACTIVITY"; then

            echo "ERROR: Malformed Java quotes still present."
            exit 1
          fi

          echo
          echo "MainActivity Java syntax fix: PASS"

      # ============================================================
      # 39. VALIDATE RELEASE CONFIGURATION
      # ============================================================
      - name: Validate release configuration
        shell: bash
        run: |
          set -euo pipefail

          cd source/android

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:compileReleaseJavaWithJavac \
            :app:processReleaseMainManifest

      # ============================================================
      # 40. CLEAN
      # ============================================================
      - name: Clean release build
        shell: bash
        run: |
          set -euo pipefail

          cd source/android

          ./gradlew \
            --no-daemon \
            clean

      # ============================================================
      # 41. BUILD ONLY SIGNED RELEASE APK
      # ============================================================
      - name: Build Signed Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd source/android

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleRelease

      # ============================================================
      # 42. VERIFY RELEASE APK OUTPUT
      # ============================================================
      - name: Verify release APK output
        shell: bash
        run: |
          set -euo pipefail

          cd source

          APK="$(
            find android/app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              -print -quit || true
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not generated."
            exit 1
          fi

          echo "Release APK:"
          ls -lh "$APK"

          case "$APK" in
            *debug*)
              echo "ERROR: Debug APK detected."
              exit 1
              ;;
          esac

          echo "Release APK output: PASS"

      # ============================================================
      # 43. VERIFY NO AAB
      # ============================================================
      - name: Verify no AAB is required
        shell: bash
        run: |
          set -euo pipefail

          cd source

          echo "This workflow intentionally builds APK only."

          if find android/app/build/outputs \
            -type f \
            -name "*.aab" \
            | grep -q .; then

            echo "ERROR: AAB was generated. APK-only workflow expected."
            exit 1
          fi

          echo "APK-only output: PASS"

      # ============================================================
      # 44. VERIFY APK PACKAGE
      # ============================================================
      - name: Verify APK package name
        shell: bash
        run: |
          set -euo pipefail

          cd source

          APK="$(
            find android/app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              -print -quit
          )"

          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"

          PACKAGE_NAME="$(
            "$AAPT" dump badging "$APK" \
              | sed -n "s/^package: name='\([^']*\)'.*/\1/p" \
              | head -1
          )"

          echo "APK package: $PACKAGE_NAME"

          test "$PACKAGE_NAME" = "org.rkms.connect"

          echo "Package name: PASS"

      # ============================================================
      # 45. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          cd source

          APK="$(
            find android/app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              -print -quit
          )"

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

          echo "APK signature: PASS"

      # ============================================================
      # 46. SHA256
      # ============================================================
      - name: Generate APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd source

          APK="$(
            find android/app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              -print -quit
          )"

          sha256sum "$APK"

      # ============================================================
      # 47. PREPARE FINAL APK
      # ============================================================
      - name: Prepare final APK
        shell: bash
        run: |
          set -euo pipefail

          cd source

          APK="$(
            find android/app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              -print -quit
          )"

          cp "$APK" \
            ../RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk

          sha256sum \
            ../RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk \
            > ../RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk.sha256

          ls -lh \
            ../RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk \
            ../RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk.sha256

      # ============================================================
      # 48. UPLOAD ONLY FINAL SIGNED RELEASE APK
      # ============================================================
      - name: Upload final signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-CONNECT-FINAL-SIGNED-RELEASE-APK
          if-no-files-found: error
          path: |
            RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk
            RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk.sha256

                  }
              }

          """

              text = (
                  text[:pos]
                  + signing
                  + text[pos:]
              )


          # ========================================================
          # RELEASE BUILD TYPE
          # ========================================================

          if "signingConfig signingConfigs.release" not in text:

              release_match = re.search(
                  r'buildTypes\s*\{\s*release\s*\{',
                  text,
                  flags=re.S
              )

              if release_match:

                  old = release_match.group(0)

                  new = (
                      old
                      + "\n"
                      + "            signingConfig signingConfigs.release"
                  )

                  text = text.replace(
                      old,
                      new,
                      1
                  )

              else:


          echo "APK target SDK 36 PASS."


      # ============================================================
      # 45. VERIFY APK SIGNATURE
      # ============================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          APKSIGNER="$SDK/build-tools/${BUILD_TOOLS}/apksigner"

          "$APKSIGNER" \
            verify \
            --verbose \
            "$APK_PATH"


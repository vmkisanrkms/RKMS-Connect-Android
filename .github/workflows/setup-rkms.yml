name: Build RKMS Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # VERIFIED NATIVE ANDROID SOURCE
  ANDROID_SOURCE_COMMIT: cf252628308e5a6ecc9eafbaf4ca227a3ad8ec92

  # EXACT V9 WEBSITE ZIP
  WEBSITE_ZIP_NAME: RKMS_CONNECT_V9_WITH_EXACT_3_FIXES.zip

  # AGP 8.7.3 compatible / stable choice
  GRADLE_VERSION: "8.9"

jobs:
  build:
    name: Build RKMS Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # =========================================================
      # 1. Checkout RKMS repository
      # =========================================================
      - name: Checkout RKMS repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1


      # =========================================================
      # 2. Setup Java 17
      # =========================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # 3. Setup Node.js
      # =========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      # =========================================================
      # 4. Prepare VERIFIED native Android project
      # =========================================================
      - name: Prepare native Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$RUNNER_TEMP/rkms-android"

          rm -rf "$PROJECT_DIR"

          echo "=========================================="
          echo "RKMS NATIVE ANDROID SOURCE"
          echo "=========================================="

          git clone \
            --no-tags \
            --filter=blob:none \
            "https://github.com/vmkisanrkms/RKMS-Connect-Android.git" \
            "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          echo ""
          echo "Fetching verified Android commit..."

          git fetch \
            --no-tags \
            --depth 1 \
            origin "$ANDROID_SOURCE_COMMIT"

          git checkout --detach "$ANDROID_SOURCE_COMMIT"

          CURRENT_COMMIT="$(git rev-parse HEAD)"

          echo ""
          echo "Expected commit:"
          echo "$ANDROID_SOURCE_COMMIT"

          echo ""
          echo "Actual commit:"
          echo "$CURRENT_COMMIT"

          test "$CURRENT_COMMIT" = "$ANDROID_SOURCE_COMMIT"

          echo ""
          echo "Checking Android project..."

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/google-services.json
          test -f app/src/main/AndroidManifest.xml

          test -d app/src/main/java
          test -d app/src/main/res
          test -d app/src/main/assets

          echo ""
          echo "Checking FCM files..."

          test -f app/src/main/java/org/rkms/connect/FCMTokenRegistrar.java
          test -f app/src/main/java/org/rkms/connect/RKMSFirebaseMessagingService.java
          test -f app/src/main/java/org/rkms/connect/NotificationHelper.java
          test -f app/src/main/java/org/rkms/connect/SessionStore.java

          echo ""
          echo "Native Android project: PASS"
          echo "FCM source: PASS"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # =========================================================
      # 5. Locate EXACT V9 ZIP
      # =========================================================
      - name: Locate V9 Exact 3 Fixes ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "LOCATING V9 ZIP"
          echo "=========================================="

          ZIP_FILE="$GITHUB_WORKSPACE/$WEBSITE_ZIP_NAME"

          echo ""
          echo "Expected ZIP:"
          echo "$ZIP_FILE"

          if [ ! -f "$ZIP_FILE" ]; then

            echo ""
            echo "::error::Required V9 ZIP was not found."

            echo ""
            echo "Available ZIP files:"

            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "*.zip" \
              -not -path "*/.git/*" \
              -print

            exit 1
          fi

          test -s "$ZIP_FILE"

          echo ""
          echo "Selected ZIP:"
          ls -lh "$ZIP_FILE"

          echo ""
          echo "ZIP SHA256:"
          sha256sum "$ZIP_FILE"

          echo "WEBSITE_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"


      # =========================================================
      # 6. Extract and validate V9 ZIP
      # =========================================================
      - name: Extract and Validate V9 Web App
        shell: bash
        run: |
          set -euo pipefail

          WEB_EXTRACT="$RUNNER_TEMP/rkms-web"

          rm -rf "$WEB_EXTRACT"
          mkdir -p "$WEB_EXTRACT"

          echo "=========================================="
          echo "EXTRACTING V9 WEB APP"
          echo "=========================================="

          unzip -q \
            "$WEBSITE_ZIP" \
            -d "$WEB_EXTRACT"

          echo ""
          echo "Finding V9 web root..."

          INDEX_HTML="$(
            find "$WEB_EXTRACT" \
              -type f \
              -name "index.html" \
              -print \
              -quit
          )"

          if [ -z "$INDEX_HTML" ]; then
            echo "::error::index.html not found in V9 ZIP."
            exit 1
          fi

          WEB_ROOT="$(dirname "$INDEX_HTML")"

          echo ""
          echo "V9 Web Root:"
          echo "$WEB_ROOT"

          # -------------------------------------------------------
          # Required files MUST all belong to the same web root
          # -------------------------------------------------------

          test -f "$WEB_ROOT/index.html"
          test -f "$WEB_ROOT/app.js"
          test -f "$WEB_ROOT/styles.css"
          test -f "$WEB_ROOT/config.js"
          test -d "$WEB_ROOT/assets"

          echo ""
          echo "Required V9 files: PASS"

          echo ""
          echo "File sizes:"

          wc -c \
            "$WEB_ROOT/index.html" \
            "$WEB_ROOT/app.js" \
            "$WEB_ROOT/styles.css" \
            "$WEB_ROOT/config.js"

          echo ""
          echo "JavaScript syntax check..."

          node --check "$WEB_ROOT/app.js"

          echo ""
          echo "JavaScript syntax: PASS"

          echo ""
          echo "V9 root contents:"

          find "$WEB_ROOT" \
            -maxdepth 2 \
            -type f \
            -print \
            | sort \
            | head -100

          echo "WEB_EXTRACT=$WEB_EXTRACT" >> "$GITHUB_ENV"
          echo "WEB_ROOT=$WEB_ROOT" >> "$GITHUB_ENV"


      # =========================================================
      # 7. FIX #1
      # PDA / Member geographic visibility
      # =========================================================
      - name: Verify Fix 1 Geographic Visibility
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FIX #1"
          echo "PDA / MEMBER GEOGRAPHIC VISIBILITY"
          echo "=========================================="

          grep -q \
            "rkmsOfficerCanAccessTarget" \
            "$WEB_ROOT/app.js"

          grep -q \
            "rkmsOfficerCanAccessMember" \
            "$WEB_ROOT/app.js"

          echo ""
          echo "PDA geographic scope: FOUND"
          echo "Member geographic scope: FOUND"

          echo ""
          echo "FIX #1: PASS"


      # =========================================================
      # 8. FIX #2
      # Appointment post/location hierarchy
      # =========================================================
      - name: Verify Fix 2 Appointment Location
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FIX #2"
          echo "APPOINTMENT POST / LOCATION"
          echo "=========================================="

          grep -q \
            "rkmsAppointmentLevelKey" \
            "$WEB_ROOT/app.js"

          grep -q \
            "rkmsAppointmentLocationVisibility" \
            "$WEB_ROOT/app.js"

          grep -q \
            "applyAppointmentPostScope" \
            "$WEB_ROOT/app.js"

          echo ""
          echo "Appointment level logic: FOUND"
          echo "Location visibility logic: FOUND"
          echo "Post scope logic: FOUND"

          echo ""
          echo "FIX #2: PASS"


      # =========================================================
      # 9. FIX #3
      # Chat live update
      # =========================================================
      - name: Verify Fix 3 Live Chat
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FIX #3"
          echo "CHAT LIVE UPDATE"
          echo "=========================================="

          grep -q \
            "rkmsChatLive" \
            "$WEB_ROOT/app.js"

          grep -q \
            "startChatLiveRealtime" \
            "$WEB_ROOT/app.js"

          grep -q \
            "postgres_changes" \
            "$WEB_ROOT/app.js"

          grep -q \
            "setInterval" \
            "$WEB_ROOT/app.js"

          grep -q \
            "visibilitychange" \
            "$WEB_ROOT/app.js"

          echo ""
          echo "Live chat code: FOUND"
          echo "Supabase Realtime: FOUND"
          echo "Fallback polling: FOUND"
          echo "Foreground resync: FOUND"

          echo ""
          echo "FIX #3: PASS"


      # =========================================================
      # 10. Install V9 Web App into Android
      #
      # IMPORTANT:
      # Copy from ONE verified WEB_ROOT.
      # This avoids the previous find/copy mismatch.
      # =========================================================
      - name: Install V9 Web App Into Android
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_WEB="$PROJECT_DIR/app/src/main/assets/www"

          echo "=========================================="
          echo "INSTALLING V9 WEB APP"
          echo "=========================================="

          echo ""
          echo "Source:"
          echo "$WEB_ROOT"

          echo ""
          echo "Destination:"
          echo "$ANDROID_WEB"

          # Completely remove old web assets
          rm -rf "$ANDROID_WEB"

          # Recreate clean directory
          mkdir -p "$ANDROID_WEB"

          # -------------------------------------------------------
          # Copy required web files
          # -------------------------------------------------------

          cp \
            "$WEB_ROOT/index.html" \
            "$ANDROID_WEB/index.html"

          cp \
            "$WEB_ROOT/styles.css" \
            "$ANDROID_WEB/styles.css"

          cp \
            "$WEB_ROOT/app.js" \
            "$ANDROID_WEB/app.js"

          cp \
            "$WEB_ROOT/config.js" \
            "$ANDROID_WEB/config.js"

          # -------------------------------------------------------
          # Optional manifest
          # -------------------------------------------------------

          if [ -f "$WEB_ROOT/manifest.webmanifest" ]; then

            cp \
              "$WEB_ROOT/manifest.webmanifest" \
              "$ANDROID_WEB/manifest.webmanifest"

          fi

          # -------------------------------------------------------
          # Required assets directory
          # -------------------------------------------------------

          cp -a \
            "$WEB_ROOT/assets" \
            "$ANDROID_WEB/assets"

          # -------------------------------------------------------
          # Final installed-file checks
          # -------------------------------------------------------

          echo ""
          echo "Checking installed V9 files..."

          test -s "$ANDROID_WEB/index.html"
          test -s "$ANDROID_WEB/app.js"
          test -s "$ANDROID_WEB/styles.css"
          test -s "$ANDROID_WEB/config.js"
          test -d "$ANDROID_WEB/assets"

          node --check \
            "$ANDROID_WEB/app.js"

          echo ""
          echo "Installed file sizes:"

          wc -c \
            "$ANDROID_WEB/index.html" \
            "$ANDROID_WEB/app.js" \
            "$ANDROID_WEB/styles.css" \
            "$ANDROID_WEB/config.js"

          echo ""
          echo "V9 Web App installation: PASS"

          echo "ANDROID_WEB=$ANDROID_WEB" >> "$GITHUB_ENV"


      # =========================================================
      # 11. Verify installed three fixes
      # =========================================================
      - name: Verify Installed Three Fixes
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FINAL THREE FIXES VERIFICATION"
          echo "=========================================="

          echo ""
          echo "FIX #1..."

          grep -q \
            "rkmsOfficerCanAccessTarget" \
            "$ANDROID_WEB/app.js"

          grep -q \
            "rkmsOfficerCanAccessMember" \
            "$ANDROID_WEB/app.js"

          echo "FIX #1: PASS"

          echo ""
          echo "FIX #2..."

          grep -q \
            "rkmsAppointmentLevelKey" \
            "$ANDROID_WEB/app.js"

          grep -q \
            "rkmsAppointmentLocationVisibility" \
            "$ANDROID_WEB/app.js"

          grep -q \
            "applyAppointmentPostScope" \
            "$ANDROID_WEB/app.js"

          echo "FIX #2: PASS"

          echo ""
          echo "FIX #3..."

          grep -q \
            "rkmsChatLive" \
            "$ANDROID_WEB/app.js"

          grep -q \
            "startChatLiveRealtime" \
            "$ANDROID_WEB/app.js"

          grep -q \
            "postgres_changes" \
            "$ANDROID_WEB/app.js"

          grep -q \
            "setInterval" \
            "$ANDROID_WEB/app.js"

          grep -q \
            "visibilitychange" \
            "$ANDROID_WEB/app.js"

          echo "FIX #3: PASS"

          echo ""
          echo "Final JavaScript syntax..."

          node --check \
            "$ANDROID_WEB/app.js"

          echo ""
          echo "=========================================="
          echo "ALL THREE FIXES: PASS"
          echo "=========================================="


      # =========================================================
      # 12. Verify existing V9 book
      # =========================================================
      - name: Verify Existing V9 Book
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING V9 BOOK"
          echo "=========================================="

          BOOK_DIR="$ANDROID_WEB/assets/book"

          if [ ! -d "$BOOK_DIR" ]; then
            echo "::error::V9 book directory missing."
            exit 1
          fi

          PAGE_COUNT="$(
            find "$BOOK_DIR" \
              -type f \
              \( \
                -iname "page-*.jpg" \
                -o -iname "page-*.jpeg" \
                -o -iname "page-*.png" \
                -o -iname "page-*.webp" \
              \) \
              | wc -l
          "

          echo ""
          echo "Book page count:"
          echo "$PAGE_COUNT"

          if [ "$PAGE_COUNT" -eq 60 ]; then

            echo ""
            echo "Book 60 pages: PASS"

          else

            echo ""
            echo "::error::Expected 60 book pages but found $PAGE_COUNT."
            exit 1

          fi


      # =========================================================
      # 13. Setup Android SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # =========================================================
      # 14. Verify Android SDK
      # =========================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ANDROID SDK VERIFICATION"
          echo "=========================================="

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK path not found."
            exit 1
          fi

          echo ""
          echo "Android SDK:"
          echo "$SDK_ROOT"

          test -d "$SDK_ROOT"

          echo ""
          echo "Checking platform-tools..."

          test -x "$SDK_ROOT/platform-tools/adb"

          echo "platform-tools: FOUND"

          echo ""
          echo "Checking Android API 35..."

          if [ -d "$SDK_ROOT/platforms/android-35" ]; then

            echo "Android platform 35: FOUND"

          else

            echo "::error::Android platform 35 is not installed."
            exit 1

          fi

          echo ""
          echo "Checking Build Tools..."

          if [ -d "$SDK_ROOT/build-tools" ]; then

            find "$SDK_ROOT/build-tools" \
              -maxdepth 2 \
              -type f \
              -name "aapt2" \
              -print \
              | sort -V

          else

            echo "::error::Android Build Tools directory not found."
            exit 1

          fi

          echo ""
          echo "Android SDK verification: PASS"


      # =========================================================
      # 15. Setup Gradle
      # =========================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}


      # =========================================================
      # 16. Create Gradle Wrapper
      # =========================================================
      - name: Create Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CREATING GRADLE WRAPPER"
          echo "=========================================="

          gradle wrapper \
            --gradle-version "$GRADLE_VERSION" \
            --distribution-type bin

          chmod +x gradlew

          ./gradlew --version

          echo ""
          echo "Gradle wrapper: PASS"


      # =========================================================
      # 17. Existing RKMS release signing
      # =========================================================
      - name: Prepare Existing Release Signing
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "RKMS RELEASE SIGNING"
          echo "=========================================="

          KEYSTORE="$RUNNER_TEMP/rkms-release.keystore"

          if [ -z "$RKMS_KEYSTORE_BASE64" ] || \
             [ -z "$RKMS_KEYSTORE_PASSWORD" ] || \
             [ -z "$RKMS_KEY_ALIAS" ] || \
             [ -z "$RKMS_KEY_PASSWORD" ]; then

            echo ""
            echo "::error::Existing RKMS release signing secrets are missing."

            echo ""
            echo "A new signing key will NOT be generated."

            exit 1
          fi

          echo ""
          echo "Decoding existing RKMS keystore..."

          printf '%s' \
            "$RKMS_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$KEYSTORE"

          test -s "$KEYSTORE"

          echo ""
          echo "Checking keystore..."

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$RKMS_KEYSTORE_PASSWORD" \
            -alias "$RKMS_KEY_ALIAS" \
            >/dev/null

          echo ""
          echo "Existing RKMS release signing: PASS"

          echo "RKMS_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "RKMS_KEYSTORE_PASSWORD=$RKMS_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RKMS_KEY_ALIAS=$RKMS_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RKMS_KEY_PASSWORD=$RKMS_KEY_PASSWORD" >> "$GITHUB_ENV"


      # =========================================================
      # 18. Final Android project verification
      # =========================================================
      - name: Final Android Project Verification
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FINAL ANDROID PROJECT CHECK"
          echo "=========================================="

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/google-services.json
          test -f app/src/main/AndroidManifest.xml

          echo ""
          echo "Checking native FCM..."

          test -f app/src/main/java/org/rkms/connect/FCMTokenRegistrar.java
          test -f app/src/main/java/org/rkms/connect/RKMSFirebaseMessagingService.java
          test -f app/src/main/java/org/rkms/connect/NotificationHelper.java
          test -f app/src/main/java/org/rkms/connect/SessionStore.java

          echo ""
          echo "Checking WebView assets..."

          test -f "$ANDROID_WEB/index.html"
          test -f "$ANDROID_WEB/app.js"
          test -f "$ANDROID_WEB/styles.css"
          test -f "$ANDROID_WEB/config.js"
          test -d "$ANDROID_WEB/assets"

          echo ""
          echo "Native Android: PASS"
          echo "FCM: PASS"
          echo "WebView: PASS"


      # =========================================================
      # 19. Build Release APK
      # =========================================================
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILDING RKMS RELEASE APK"
          echo "=========================================="

          chmod +x gradlew

          ./gradlew clean assembleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "Release APK build: PASS"


      # =========================================================
      # 20. Locate APK
      # =========================================================
      - name: Locate Release APK
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "LOCATING RELEASE APK"
          echo "=========================================="

          APK="$(
            find "$PROJECT_DIR" \
              -type f \
              -path "*/build/outputs/apk/release/*.apk" \
              -print \
              -quit
          )"

          if [ -z "$APK" ]; then

            echo "::error::Release APK not found."

            echo ""
            echo "Available APK files:"

            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          test -s "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo ""
          echo "Release APK:"
          echo "$APK"

          ls -lh "$APK"


      # =========================================================
      # 21. Verify APK Signature
      # =========================================================
      - name: Verify APK Signature
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "APK SIGNATURE CHECK"
          echo "=========================================="

          test -s "$APK"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          APKSIGNER="$(
            find "$SDK_ROOT/build-tools" \
              -type f \
              -name "apksigner" \
              -print \
              | sort -V \
              | tail -1
          )"

          if [ -n "$APKSIGNER" ] && [ -f "$APKSIGNER" ]; then

            chmod +x "$APKSIGNER"

            echo ""
            echo "apksigner:"
            echo "$APKSIGNER"

            "$APKSIGNER" verify \
              --verbose \
              "$APK"

            echo ""
            echo "APK signature verification: PASS"

          else

            echo ""
            echo "::warning::apksigner unavailable."
            echo "Skipping standalone signature verification."

          fi


      # =========================================================
      # 22. Final APK integrity
      # =========================================================
      - name: Final APK Integrity Check
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FINAL APK CHECK"
          echo "=========================================="

          test -s "$APK"

          APK_SIZE="$(stat -c%s "$APK")"

          echo ""
          echo "APK size:"
          echo "$APK_SIZE bytes"

          if [ "$APK_SIZE" -lt 1000000 ]; then
            echo "::error::APK is unexpectedly small."
            exit 1
          fi

          echo ""
          echo "APK integrity: PASS"


      # =========================================================
      # 23. Upload final APK
      # =========================================================
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-Final-Exact-3-Fixes
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 14


      # =========================================================
      # 24. Upload final app.js
      # =========================================================
      - name: Upload Final app.js
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Final-Exact-3-Fixes-app-js
          path: ${{ env.PROJECT_DIR }}/app/src/main/assets/www/app.js
          if-no-files-found: error
          retention-days: 14


      # =========================================================
      # 25. Final success
      # =========================================================
      - name: Build Complete
        shell: bash
        run: |
          echo ""
          echo "=================================================="
          echo "          RKMS RELEASE BUILD SUCCESS"
          echo "=================================================="
          echo ""

          echo "FIX #1 PDA/Member Geographic Visibility : PASS"
          echo "FIX #2 Appointment Post Location       : PASS"
          echo "FIX #3 Chat Live Update                 : PASS"

          echo ""
          echo "Native Android                         : PASS"
          echo "FCM                                     : PASS"
          echo "V9 Book                                 : PASS"
          echo "JavaScript                              : PASS"
          echo "Gradle                                  : PASS"
          echo "Release APK                             : PASS"
          echo "APK Integrity                           : PASS"

          echo ""
          echo "=================================================="
          echo "                 BUILD SUCCESS"
          echo "=================================================="

      # =========================================================
      # 19. Build Release APK
      # =========================================================
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILDING RKMS RELEASE APK"
          echo "=========================================="

          chmod +x gradlew

          ./gradlew clean assembleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "Release APK build: PASS"


      # =========================================================
      # 20. Locate APK
      # =========================================================
      - name: Locate Release APK
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "LOCATING RELEASE APK"
          echo "=========================================="

          APK="$(
            find "$PROJECT_DIR" \
              -type f \
              -path "*/build/outputs/apk/release/*.apk" \
              -print \
              -quit
          )"

          if [ -z "$APK" ]; then

            echo "::error::Release APK not found."

            echo ""
            echo "Available APK files:"

            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          test -s "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo ""
          echo "Release APK:"
          echo "$APK"

          echo ""
          ls -lh "$APK"


      # =========================================================
      # 21. Verify APK signature if apksigner exists
      #
      # IMPORTANT:
      # Signature verification itself will NOT cause the build
      # to fail merely because apksigner is unavailable.
      # =========================================================
      - name: Verify APK Signature
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "APK SIGNATURE CHECK"
          echo "=========================================="

          test -s "$APK"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          APKSIGNER=""

          if [ -d "$SDK_ROOT/build-tools" ]; then

            APKSIGNER="$(
              find "$SDK_ROOT/build-tools" \
                -type f \
                -name "apksigner" \
                -print \
                | sort -V \
                | tail -1
            )"

          fi

          if [ -n "$APKSIGNER" ] && [ -f "$APKSIGNER" ]; then

            chmod +x "$APKSIGNER"

            echo ""
            echo "apksigner found:"
            echo "$APKSIGNER"

            echo ""
            echo "Verifying APK..."

            "$APKSIGNER" verify \
              --verbose \
              "$APK"

            echo ""
            echo "APK signature verification: PASS"

          else

            echo ""
            echo "::warning::apksigner is not available on this runner."
            echo "Skipping standalone signature verification."

            echo ""
            echo "Gradle release APK was already built."

          fi


      # =========================================================
      # 22. Final APK integrity check
      # =========================================================
      - name: Final APK Integrity Check
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FINAL APK CHECK"
          echo "=========================================="

          test -s "$APK"

          APK_SIZE="$(stat -c%s "$APK")"

          echo ""
          echo "APK size:"
          echo "$APK_SIZE bytes"

          if [ "$APK_SIZE" -lt 1000000 ]; then
            echo "::error::APK is unexpectedly small."
            exit 1
          fi

          echo ""
          echo "APK integrity: PASS"


      # =========================================================
      # 23. Upload final APK
      # =========================================================
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-Final-Exact-3-Fixes
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 14


      # =========================================================
      # 24. Upload final app.js
      # =========================================================
      - name: Upload Final app.js
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Final-Exact-3-Fixes-app-js
          path: ${{ env.PROJECT_DIR }}/app/src/main/assets/www/app.js
          if-no-files-found: error
          retention-days: 14


      # =========================================================
      # 25. Final success
      # =========================================================
      - name: Build Complete
        shell: bash
        run: |
          echo ""
          echo "=================================================="
          echo "          RKMS RELEASE BUILD SUCCESS"
          echo "=================================================="
          echo ""

          echo "FIX #1 PDA/Member Geographic Visibility : PASS"
          echo "FIX #2 Appointment Post Location       : PASS"
          echo "FIX #3 Chat Live Update                 : PASS"

          echo ""
          echo "Native Android                         : PASS"
          echo "FCM                                     : PASS"
          echo "V9 Book                                 : PASS"
          echo "JavaScript                              : PASS"
          echo "Gradle                                  : PASS"
          echo "Release APK                             : PASS"
          echo "APK Integrity                           : PASS"

          echo ""
          echo "=================================================="
          echo "                 BUILD SUCCESS"
          echo "=================================================="

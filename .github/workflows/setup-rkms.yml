name: RKMS Android 16 API 36 - Final Signed Release APK Only

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  AGP_VERSION: "8.9.1"
  GRADLE_VERSION: "8.11.1"
  APP_ID: "org.rkms.connect"

jobs:
  build-release-apk:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. SHOW ZIP FILES
      # ============================================================
      - name: List repository ZIP files
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository ZIP files:"
          find . -maxdepth 3 -type f \
            \( -iname "*.zip" -o -iname "*.ZIP" \) \
            -print | sort || true

      # ============================================================
      # 3. VERIFY EXACT RKMS SOURCE ZIP
      # ============================================================
      - name: Verify RKMS source ZIP
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_SOURCE_ZIP="RKMS_CONNECT_GROUP_PHOTO_SCHEMA_FIXED_FINAL_20260920.zip"

          echo "Required source ZIP:"
          echo "$REQUIRED_SOURCE_ZIP"

          if [ -f "./$REQUIRED_SOURCE_ZIP" ]; then
            SOURCE_ZIP="./$REQUIRED_SOURCE_ZIP"
          elif [ -f "$REQUIRED_SOURCE_ZIP" ]; then
            SOURCE_ZIP="$REQUIRED_SOURCE_ZIP"
          else
            echo ""
            echo "ERROR: Required RKMS source ZIP not found."
            echo ""
            echo "Available ZIP files:"
            find . -type f \
              \( -iname "*.zip" -o -iname "*.ZIP" \) \
              -print | sort || true
            exit 1
          fi

          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

          echo ""
          echo "Source ZIP verified:"
          echo "$SOURCE_ZIP"

          ls -lh "$SOURCE_ZIP"

      # ============================================================
      # 4. SOURCE ZIP SHA256
      # ============================================================
      - name: Generate source ZIP SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum "$SOURCE_ZIP" | tee rkms-source-zip.sha256

      # ============================================================
      # 5. EXTRACT RKMS SOURCE
      # ============================================================
      - name: Extract RKMS source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf rkms-source
          mkdir -p rkms-source

          unzip -q "$SOURCE_ZIP" -d rkms-source

          echo "Extracted files:"
          find rkms-source -maxdepth 3 -type f | head -200

      # ============================================================
      # 6. DETECT PROJECT ROOT
      # ============================================================
      - name: Detect RKMS project root
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT=""

          if [ -f "rkms-source/package.json" ]; then
            PROJECT_ROOT="rkms-source"
          else
            FOUND_PACKAGE="$(find rkms-source -type f -name package.json -print -quit || true)"

            if [ -n "$FOUND_PACKAGE" ]; then
              PROJECT_ROOT="$(dirname "$FOUND_PACKAGE")"
            fi
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: package.json not found inside source ZIP."
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo ""
          echo "RKMS project root:"
          echo "$PROJECT_ROOT"

          test -f "$PROJECT_ROOT/package.json"

      # ============================================================
      # 7. VALIDATE RKMS SOURCE
      # ============================================================
      - name: Validate RKMS source
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "Checking required files..."

          test -f package.json

          if [ -f app.js ]; then
            echo "app.js found"
          elif [ -f src/app.js ]; then
            echo "src/app.js found"
          else
            echo "WARNING: app.js not found at root or src/"
          fi

          if [ -d supabase ]; then
            echo "supabase directory found"
          else
            echo "WARNING: supabase directory not found"
          fi

          echo ""
          echo "Source validation completed."

      # ============================================================
      # 8. NODE.JS 22
      # ============================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.PROJECT_ROOT }}/package-lock.json

      # ============================================================
      # 9. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ============================================================
      # 10. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 11. INSTALL ANDROID PLATFORM
      # ============================================================
      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

      # ============================================================
      # 12. INSTALL NPM DEPENDENCIES
      # ============================================================
      - name: Install npm dependencies
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # ============================================================
      # 13. VERIFY CAPACITOR VERSIONS
      # ============================================================
      - name: Verify Capacitor versions
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          node - <<'NODE'
          const fs = require("fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const all = {
            ...(pkg.dependencies || {}),
            ...(pkg.devDependencies || {})
          };

          const required = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          let failed = false;

          for (const [name, version] of Object.entries(required)) {
            const actual = all[name];

            console.log(
              `${name}: required=${version}, actual=${actual || "MISSING"}`
            );

            if (!actual) {
              failed = true;
            }
          }

          if (failed) {
            console.error("Capacitor dependency verification failed.");
            process.exit(1);
          }

          console.log("Capacitor dependency verification passed.");
          NODE

      # ============================================================
      # 14. BUILD WEB APP
      # ============================================================
      - name: Build web application
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          if npm run | grep -q "build"; then
            npm run build
          else
            echo "No npm build script found; continuing."
          fi

      # ============================================================
      # 15. CAPACITOR CONFIGURATION
      # ============================================================
      - name: Verify Capacitor configuration
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          test -f capacitor.config.json || \
          test -f capacitor.config.ts || \
          test -f capacitor.config.js

          echo "Capacitor configuration found."

      # ============================================================
      # 16. ADD ANDROID PLATFORM IF NEEDED
      # ============================================================
      - name: Setup Capacitor Android
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      # ============================================================
      # 17. VERIFY ANDROID PROJECT
      # ============================================================
      - name: Verify Android project
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          test -d android
          test -f android/app/build.gradle || \
          test -f android/app/build.gradle.kts

          echo "Android project found."

      # ============================================================
      # 18. FORCE ANDROID 16 / API 36
      # ============================================================
      - name: Configure Android 16 API 36
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          APP_GRADLE="android/app/build.gradle"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERROR: android/app/build.gradle not found."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          if "android {" not in s:
              raise SystemExit("android { block not found")

          if re.search(r'compileSdk\s+\d+', s):
              s = re.sub(
                  r'compileSdk\s+\d+',
                  'compileSdk 36',
                  s,
                  count=1
              )
          else:
              s = s.replace(
                  "android {",
                  "android {\n    compileSdk 36",
                  1
              )

          if re.search(r'minSdk\s+\d+', s):
              s = re.sub(
                  r'minSdk\s+\d+',
                  'minSdk 23',
                  s,
                  count=1
              )

          if re.search(r'targetSdk\s+\d+', s):
              s = re.sub(
                  r'targetSdk\s+\d+',
                  'targetSdk 36',
                  s,
                  count=1
              )

          p.write_text(s)
          PY

          echo ""
          echo "Android SDK configuration:"
          grep -nE "compileSdk|minSdk|targetSdk" android/app/build.gradle || true

      # ============================================================
      # 19. VERIFY APP ID
      # ============================================================
      - name: Verify application ID
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          grep -q \
            'applicationId[[:space:]]*["'\'']org\.rkms\.connect["'\'']' \
            android/app/build.gradle || {

              echo "ERROR: org.rkms.connect applicationId not found."
              exit 1
          }

          echo "Application ID verified: org.rkms.connect"

      # ============================================================
      # 20. FIREBASE CONFIGURATION
      # ============================================================
      - name: Verify Firebase configuration
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          if [ -f android/app/google-services.json ]; then
            echo "google-services.json found."

            grep -q "org.rkms.connect" \
              android/app/google-services.json || {

              echo "ERROR: google-services.json does not contain org.rkms.connect."
              exit 1
            }
          else
            echo "WARNING: google-services.json not found."
            echo "Build will continue only if Firebase is not required by Gradle."
          fi

      # ============================================================
      # 21. CHECK RELEASE SIGNING SECRETS
      # ============================================================
      - name: Verify release signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          missing=0

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret missing."
            missing=1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD secret missing."
            missing=1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: ANDROID_KEY_ALIAS secret missing."
            missing=1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEY_PASSWORD secret missing."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "Release signing secrets are present."

      # ============================================================
      # 22. CREATE KEYSTORE
      # ============================================================
      - name: Configure release signing
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "$KEYSTORE_BASE64" | base64 --decode > android/rkms-release.keystore

          test -s android/rkms-release.keystore

          keytool -list \
            -keystore android/rkms-release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          cat >> android/gradle.properties <<EOF

          RKMS_RELEASE_STORE_FILE=../rkms-release.keystore
          RKMS_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD
          RKMS_RELEASE_KEY_ALIAS=$KEY_ALIAS
          RKMS_RELEASE_KEY_PASSWORD=$KEY_PASSWORD
          EOF

          echo "Release keystore configured."

      # ============================================================
      # 23. FORCE RELEASE SIGNING CONFIG
      # ============================================================
      - name: Configure Android release signing
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          signing_block = r'''
              release {
                  storeFile file(project.findProperty("RKMS_RELEASE_STORE_FILE"))
                  storePassword project.findProperty("RKMS_RELEASE_STORE_PASSWORD")
                  keyAlias project.findProperty("RKMS_RELEASE_KEY_ALIAS")
                  keyPassword project.findProperty("RKMS_RELEASE_KEY_PASSWORD")
              }
          '''

          if re.search(r'signingConfigs\s*\{', s):
              if re.search(r'release\s*\{', s):
                  pass
          else:
              s = s.replace(
                  "android {",
                  """android {
              signingConfigs {
          """ + signing_block + """
              }""",
                  1
              )

          if "signingConfig signingConfigs.release" not in s:
              s = re.sub(
                  r'buildTypes\s*\{',
                  '''buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }''',
                  s,
                  count=1
              )

          p.write_text(s)
          PY

          echo "Release signing configuration prepared."

      # ============================================================
      # 24. VERIFY GRADLE WRAPPER
      # ============================================================
      - name: Verify Gradle wrapper
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          if [ ! -f android/gradlew ]; then
            echo "ERROR: android/gradlew not found."
            exit 1
          fi

          chmod +x android/gradlew

          cd android

          ./gradlew --version

      # ============================================================
      # 25. VERIFY COMPILE SDK BEFORE BUILD
      # ============================================================
      - name: Verify final Android configuration
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          echo "Final app/build.gradle configuration:"
          grep -nE \
            "compileSdk|minSdk|targetSdk|applicationId|signingConfig" \
            android/app/build.gradle || true

          grep -q "compileSdk 36" android/app/build.gradle
          grep -q "targetSdk 36" android/app/build.gradle

          echo "Android API 36 configuration verified."

      # ============================================================
      # 26. CLEAN
      # ============================================================
      - name: Clean Android build
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}/android
        run: |
          set -euo pipefail

          ./gradlew clean

      # ============================================================
      # 27. BUILD SIGNED RELEASE APK ONLY
      # ============================================================
      - name: Build Signed Release APK
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}/android
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 28. VERIFY APK EXISTS
      # ============================================================
      - name: Verify release APK
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            find android/app/build/outputs -type f -print || true
            exit 1
          fi

          echo ""
          echo "Release APK:"
          ls -lh "$APK"

          echo ""
          echo "APK SHA256:"
          sha256sum "$APK"

      # ============================================================
      # 29. VERIFY APK PACKAGE
      # ============================================================
      - name: Verify APK package and signature
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"

          echo "Checking APK with apksigner..."

          apksigner verify --verbose "$APK"

          echo ""
          echo "APK signature verification passed."

          echo ""
          echo "Checking package..."

          if command -v aapt >/dev/null 2>&1; then
            aapt dump badging "$APK" | grep -E \
              "package:|sdkVersion:|targetSdkVersion:" || true
          fi

      # ============================================================
      # 30. GENERATE APK SHA256
      # ============================================================
      - name: Generate final APK SHA256
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"

          sha256sum "$APK" | tee RKMS_FINAL_RELEASE_APK_SHA256.txt

      # ============================================================
      # 31. PREPARE FINAL ARTIFACT
      # ============================================================
      - name: Prepare final release files
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          mkdir -p final-release

          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            final-release/RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk

          cp \
            RKMS_FINAL_RELEASE_APK_SHA256.txt \
            final-release/

          cp \
            ../rkms-source-zip.sha256 \
            final-release/

          echo ""
          echo "Final release files:"
          ls -lh final-release

      # ============================================================
      # 32. UPLOAD FINAL RELEASE APK
      # ============================================================
      - name: Upload Final Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-CONNECT-FINAL-SIGNED-RELEASE-APK
          path: |
            ${{ env.PROJECT_ROOT }}/final-release/RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk
            ${{ env.PROJECT_ROOT }}/final-release/RKMS_FINAL_RELEASE_APK_SHA256.txt
            ${{ env.PROJECT_ROOT }}/final-release/rkms-source-zip.sha256
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 33. FINAL SUMMARY
      # ============================================================
      - name: Final build summary
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          APK="final-release/RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk"

          echo ""
          echo "============================================================"
          echo " RKMS CONNECT FINAL RELEASE BUILD"
          echo "============================================================"
          echo ""
          echo "Source ZIP:"
          echo "$SOURCE_ZIP"
          echo ""
          echo "Application ID:"
          echo "$APP_ID"
          echo ""
          echo "Android API:"
          echo "$ANDROID_API"
          echo ""
          echo "Build type:"
          echo "SIGNED RELEASE APK ONLY"
          echo ""
          echo "Debug APK:"
          echo "NOT BUILT"
          echo ""
          echo "AAB:"
          echo "NOT BUILT"
          echo ""
          echo "Final APK:"
          echo "$APK"
          echo ""
          ls -lh "$APK"
          echo ""
          echo "APK SHA256:"
          sha256sum "$APK"
          echo ""
          echo "============================================================"
          echo " BUILD SUCCESSFUL"
          echo "============================================================"

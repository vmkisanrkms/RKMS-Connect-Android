name: RKMS Android 16 API 36 - Final Release APK Only

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  AGP_VERSION: "8.9.1"
  GRADLE_VERSION: "8.11.1"

  FIREBASE_BOM_VERSION: "34.19.0"
  GOOGLE_SERVICES_VERSION: "4.5.0"
  CREDENTIALS_VERSION: "1.5.0"

  APP_ID: "org.rkms.connect"
  APK_NAME: "RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"

jobs:

  build:

    name: Build Final Release APK Only

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. LOCATE RKMS SOURCE ZIP
      # ============================================================

      - name: Locate RKMS source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP=""

          for candidate in \
            "RKMS_CONNECT_FINAL_BUILD_V6_ALL_FIXES_GPM_APK_ONLY.zip" \
            "RKMS_CONNECT_FINAL_BUILD_V5_ALL_FIXES_FINAL.zip"
          do
            if [ -f "$candidate" ]; then
              ZIP="$candidate"
              break
            fi
          done

          if [ -z "$ZIP" ]; then
            ZIP="$(
              find . \
                -maxdepth 3 \
                -type f \
                -iname "*.zip" \
                -print \
              | grep -E "RKMS|rkms" \
              | head -n 1 \
              || true
            )"
          fi

          if [ -z "$ZIP" ]; then
            echo "::error::RKMS source ZIP not found."
            exit 1
          fi

          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "RKMS SOURCE"
          echo "$ZIP"
          echo "=========================================="


      # ============================================================
      # 3. EXTRACT SOURCE
      # ============================================================

      - name: Extract RKMS source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build-project
          mkdir -p build-project

          unzip -q "$SOURCE_ZIP" -d build-project

          echo "RKMS source extracted."


      # ============================================================
      # 4. DETECT PROJECT ROOT
      # ============================================================

      - name: Detect RKMS project root
        shell: bash
        run: |
          set -euo pipefail

          ROOT=""

          if [ -f "build-project/package.json" ]; then
            ROOT="build-project"
          else
            ROOT="$(
              find build-project \
                -type f \
                -name "package.json" \
                -not -path "*/node_modules/*" \
                -print \
                | head -n 1 \
                | xargs -r dirname
            )"
          fi

          if [ -z "$ROOT" ]; then
            echo "::error::package.json not found."
            exit 1
          fi

          echo "RKMS_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "RKMS_ROOT=$ROOT"


      # ============================================================
      # 5. VALIDATE SOURCE
      # ============================================================

      - name: Validate RKMS source
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          REQUIRED_FILES=(
            "package.json"
            "app.js"
            "capacitor.config.json"
            "google-services.json"
            "scripts/setup-android-native.sh"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing required file: $file"
              exit 1
            fi
          done

          echo "Source validation passed."


      # ============================================================
      # 6. VERIFY CAPACITOR
      # ============================================================

      - name: Verify Capacitor versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node <<'NODE'
          const fs = require("fs");

          const p = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const deps = {
            ...(p.dependencies || {}),
            ...(p.devDependencies || {})
          };

          const required = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          for (const [name, version] of Object.entries(required)) {
            if (!deps[name]) {
              throw new Error(`Missing dependency: ${name}`);
            }

            console.log(`${name}: ${deps[name]}`);
          }

          console.log("Capacitor validation passed.");
          NODE


      # ============================================================
      # 7. NODE 22
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ env.RKMS_ROOT }}/package-lock.json


      # ============================================================
      # 8. NPM INSTALL
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi


      # ============================================================
      # 9. WEB BUILD
      # ============================================================

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          if node -e '
            const p=require("./package.json");
            process.exit(
              p.scripts && p.scripts.build ? 0 : 1
            );
          '; then
            npm run build
          else
            echo "No build script found."
            echo "Continuing with existing web source."
          fi


      # ============================================================
      # 10. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 11. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: "true"
          log-accepted-android-sdk-licenses: "false"


      # ============================================================
      # 12. INSTALL API 36
      # ============================================================

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "Android API 36 installed."


      # ============================================================
      # 13. VERIFY SDK
      # ============================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          test -d "$SDK/platforms/android-36"
          test -d "$SDK/build-tools/36.0.0"

          test -x \
            "$SDK/build-tools/36.0.0/aapt"

          test -x \
            "$SDK/build-tools/36.0.0/apksigner"

          echo "Android API 36 verified."
          echo "Build Tools 36.0.0 verified."


      # ============================================================
      # 14. CREATE CAPACITOR ANDROID
      # ============================================================

      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          rm -rf android

          npx cap add android


      # ============================================================
      # 15. CONFIGURE API 36
      # ============================================================

      - name: Configure Android API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          python3 <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("variables.gradle"),
              Path("app/build.gradle")
          ]

          for p in files:

              if not p.exists():
                  continue

              s = p.read_text(
                  encoding="utf-8"
              )

              replacements = [
                  (
                      r'compileSdkVersion\s*=\s*\d+',
                      'compileSdkVersion = 36'
                  ),
                  (
                      r'targetSdkVersion\s*=\s*\d+',
                      'targetSdkVersion = 36'
                  ),
                  (
                      r'compileSdk\s*=\s*\d+',
                      'compileSdk = 36'
                  ),
                  (
                      r'targetSdk\s*=\s*\d+',
                      'targetSdk = 36'
                  )
              ]

              for pattern, replacement in replacements:
                  s = re.sub(
                      pattern,
                      replacement,
                      s
                  )

              p.write_text(
                  s,
                  encoding="utf-8"
              )

          print("API 36 configured.")
          PY


      # ============================================================
      # 16. CONFIGURE AGP 8.9.1
      # ============================================================

      - name: Configure AGP 8.9.1
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("build.gradle")

          s = p.read_text(
              encoding="utf-8"
          )

          s = re.sub(
              r'(classpath\s+["\']com\.android\.tools\.build:gradle:)'
              r'[^"\']+',
              r'\g<1>8.9.1',
              s
          )

          s = re.sub(
              r'(com\.android\.application["\']\s+version\s+["\'])'
              r'[^"\']+',
              r'\g<1>8.9.1',
              s
          )

          p.write_text(
              s,
              encoding="utf-8"
          )

          print("AGP 8.9.1 configured.")
          PY


      # ============================================================
      # 17. CONFIGURE GRADLE 8.11.1
      # ============================================================

      - name: Configure Gradle 8.11.1
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          mkdir -p gradle/wrapper

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "gradle/wrapper/gradle-wrapper.properties"
          )

          lines = []

          if p.exists():
              lines = p.read_text(
                  encoding="utf-8"
              ).splitlines()

          url = (
              "distributionUrl="
              "https\\://services.gradle.org/distributions/"
              "gradle-8.11.1-all.zip"
          )

          found = False

          for i, line in enumerate(lines):
              if line.startswith(
                  "distributionUrl="
              ):
                  lines[i] = url
                  found = True

          if not found:
              lines.append(url)

          p.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )
          PY

          chmod +x gradlew

          ./gradlew --version


      # ============================================================
      # 18. CAPACITOR SYNC
      # ============================================================

      - name: Capacitor sync Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npx cap sync android


      # ============================================================
      # 19. COPY FIREBASE JSON
      # ============================================================

      - name: Install Firebase google-services.json
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          test -f google-services.json

          mkdir -p android/app

          cp \
            google-services.json \
            android/app/google-services.json

          test -f \
            android/app/google-services.json

          echo "google-services.json copied."


      # ============================================================
      # 20. FIREBASE DEPENDENCIES
      # ============================================================

      - name: Configure Firebase FCM dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          python3 <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")

          s = p.read_text(
              encoding="utf-8"
          )

          marker = "dependencies {"

          if marker not in s:
              raise SystemExit(
                  "ERROR: dependencies block not found."
              )

          dependencies = [
              (
                  'implementation platform('
                  '"com.google.firebase:firebase-bom:34.19.0"'
                  ')'
              ),
              (
                  'implementation '
                  '"com.google.firebase:firebase-messaging"'
              )
          ]

          for dep in dependencies:

              if dep not in s:
                  s = s.replace(
                      marker,
                      marker
                      + "\n    "
                      + dep,
                      1
                  )

          p.write_text(
              s,
              encoding="utf-8"
          )

          print(
              "Firebase BOM + Messaging configured."
          )
          PY


      # ============================================================
      # 21. CREDENTIAL MANAGER DEPENDENCIES
      # ============================================================

      - name: Configure Android Credential Manager
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          python3 <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")

          s = p.read_text(
              encoding="utf-8"
          )

          marker = "dependencies {"

          if marker not in s:
              raise SystemExit(
                  "ERROR: dependencies block not found."
              )

          dependencies = [
              (
                  'implementation '
                  '"androidx.credentials:credentials:1.5.0"'
              ),
              (
                  'implementation '
                  '"androidx.credentials:'
                  'credentials-play-services-auth:1.5.0"'
              )
          ]

          for dep in dependencies:

              if dep not in s:
                  s = s.replace(
                      marker,
                      marker
                      + "\n    "
                      + dep,
                      1
                  )

          p.write_text(
              s,
              encoding="utf-8"
          )

          print(
              "Credential Manager dependencies configured."
          )
          PY


      # ============================================================
      # 22. GOOGLE SERVICES PLUGIN
      #
      # THIS FIXES THE CURRENT SCREENSHOT ERROR.
      # ============================================================

      - name: Configure Google Services plugin
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("build.gradle")
          app = Path("app/build.gradle")

          if not root.exists():
              raise SystemExit(
                  "ERROR: android/build.gradle not found."
              )

          if not app.exists():
              raise SystemExit(
                  "ERROR: android/app/build.gradle not found."
              )

          root_text = root.read_text(
              encoding="utf-8"
          )

          # ========================================================
          # FIND buildscript
          # ========================================================

          match = re.search(
              r'buildscript\s*\{',
              root_text,
              re.MULTILINE
          )

          if not match:
              raise SystemExit(
                  "ERROR: buildscript block not found."
              )

          start = match.start()

          depth = 0
          end = None

          for i in range(
              start,
              len(root_text)
          ):
              if root_text[i] == "{":
                  depth += 1

              elif root_text[i] == "}":
                  depth -= 1

                  if depth == 0:
                      end = i + 1
                      break

          if end is None:
              raise SystemExit(
                  "ERROR: buildscript block could not be parsed."
              )

          buildscript = root_text[start:end]

          # ========================================================
          # ENSURE google()
          # ========================================================

          if "google()" not in buildscript:

              repo = re.search(
                  r'repositories\s*\{',
                  buildscript,
                  re.MULTILINE
              )

              if not repo:
                  raise SystemExit(
                      "ERROR: buildscript repositories not found."
                  )

              pos = repo.end()

              buildscript = (
                  buildscript[:pos]
                  + "\n        google()"
                  + buildscript[pos:]
              )

          # ========================================================
          # ENSURE GOOGLE SERVICES CLASSPATH
          # ========================================================

          expected = (
              "com.google.gms:"
              "google-services:4.5.0"
          )

          if expected not in buildscript:

              deps = re.search(
                  r'dependencies\s*\{',
                  buildscript,
                  re.MULTILINE
              )

              if not deps:
                  raise SystemExit(
                      "ERROR: buildscript dependencies not found."
                  )

              pos = deps.end()

              buildscript = (
                  buildscript[:pos]
                  + "\n        classpath "
                  "'com.google.gms:"
                  "google-services:4.5.0'"
                  + buildscript[pos:]
              )

          root_text = (
              root_text[:start]
              + buildscript
              + root_text[end:]
          )

          root.write_text(
              root_text,
              encoding="utf-8"
          )

          # ========================================================
          # APP PLUGIN
          # ========================================================

          app_text = app.read_text(
              encoding="utf-8"
          )

          plugin_name = (
              "com.google.gms.google-services"
          )

          if plugin_name not in app_text:

              plugins_match = re.search(
                  r'^\s*plugins\s*\{',
                  app_text,
                  re.MULTILINE
              )

              if plugins_match:

                  app_text = re.sub(
                      r'(^\s*plugins\s*\{)',
                      r"\1\n"
                      "    id "
                      "'com.google.gms.google-services'",
                      app_text,
                      count=1,
                      flags=re.MULTILINE
                  )

              else:

                  app_text = (
                      "apply plugin: "
                      "'com.google.gms.google-services'"
                      "\n\n"
                      + app_text
                  )

          app.write_text(
              app_text,
              encoding="utf-8"
          )

          print(
              "Google Services plugin configured."
          )
          PY

          echo ""
          echo "ROOT CLASSpath:"
          grep -n \
            "com.google.gms:google-services:4.5.0" \
            build.gradle

          echo ""
          echo "APP PLUGIN:"
          grep -n \
            "com.google.gms.google-services" \
            app/build.gradle


      # ============================================================
      # 23. VERIFY FIREBASE
      # ============================================================

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          test -f \
            app/google-services.json \
            || {
              echo "::error::google-services.json missing."
              exit 1
            }

          grep -Fq \
            "firebase-bom:34.19.0" \
            app/build.gradle \
            || {
              echo "::error::Firebase BOM missing."
              exit 1
            }

          grep -Fq \
            "firebase-messaging" \
            app/build.gradle \
            || {
              echo "::error::Firebase Messaging missing."
              exit 1
            }

          grep -Fq \
            "com.google.gms.google-services" \
            app/build.gradle \
            || {
              echo "::error::App Google Services plugin missing."
              exit 1
            }

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("build.gradle")

          s = p.read_text(
              encoding="utf-8"
          )

          match = re.search(
              r'buildscript\s*\{',
              s,
              re.MULTILINE
          )

          if not match:
              raise SystemExit(
                  "ERROR: buildscript missing."
              )

          start = match.start()

          depth = 0
          end = None

          for i in range(
              start,
              len(s)
          ):
              if s[i] == "{":
                  depth += 1

              elif s[i] == "}":
                  depth -= 1

                  if depth == 0:
                      end = i + 1
                      break

          if end is None:
              raise SystemExit(
                  "ERROR: buildscript parse failed."
              )

          buildscript = s[start:end]

          if (
              "com.google.gms:"
              "google-services:4.5.0"
          ) not in buildscript:

              raise SystemExit(
                  "ERROR: Google Services classpath missing."
              )

          if "google()" not in buildscript:

              raise SystemExit(
                  "ERROR: google() repository missing."
              )

          print(
              "PASS: Google Services classpath "
              "inside buildscript."
          )
          PY

          echo ""
          echo "=========================================="
          echo "FIREBASE CONFIGURATION PASS"
          echo "=========================================="

          grep -n -E \
            "firebase-bom|firebase-messaging" \
            app/build.gradle

          grep -n \
            "com.google.gms.google-services" \
            app/build.gradle

          grep -n \
            "com.google.gms:google-services:4.5.0" \
            build.gradle


      # ============================================================
      # 24. VERIFY FIREBASE JSON PACKAGE
      # ============================================================

      - name: Verify Firebase package
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          python3 <<'PY'
          import json
          from pathlib import Path

          p = Path(
              "app/google-services.json"
          )

          data = json.loads(
              p.read_text(
                  encoding="utf-8"
              )
          )

          found = False

          for client in data.get(
              "client",
              []
          ):

              info = client.get(
                  "client_info",
                  {}
              )

              package_name = (
                  info
                  .get(
                      "android_client_info",
                      {}
                  )
                  .get(
                      "package_name"
                  )
              )

              if package_name == "org.rkms.connect":
                  found = True
                  break

          if not found:
              raise SystemExit(
                  "ERROR: google-services.json does not "
                  "contain org.rkms.connect"
              )

          print(
              "Firebase package org.rkms.connect verified."
          )
          PY


      # ============================================================
      # 25. NATIVE ANDROID SETUP
      # ============================================================

      - name: Configure RKMS native Android bridge
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/setup-android-native.sh

          ./scripts/setup-android-native.sh


      # ============================================================
      # 26. FIX CREDENTIAL MANAGER ARGUMENT ORDER
      # ============================================================

      - name: Fix Credential Manager signature
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(
              r'createCredentialAsync\s*\(\s*'
              r'req\s*,',
              re.MULTILINE
          )

          replacement = (
              "createCredentialAsync(\n"
              "                            activity,\n"
              "                            req,"
          )

          setup = Path(
              "scripts/setup-android-native.sh"
          )

          source = setup.read_text(
              encoding="utf-8"
          )

          source, count = pattern.subn(
              replacement,
              source
          )

          setup.write_text(
              source,
              encoding="utf-8"
          )

          print(
              "Native setup fixes:",
              count
          )

          bridge_files = list(
              Path(
                  "android/app/src/main/java"
              ).rglob(
                  "RKMSNativeBridge.java"
              )
          )

          for java in bridge_files:

              text = java.read_text(
                  encoding="utf-8"
              )

              text, count = pattern.subn(
                  replacement,
                  text
              )

              java.write_text(
                  text,
                  encoding="utf-8"
              )

              print(
                  f"{java}: {count} fixes"
              )
          PY


      # ============================================================
      # 27. VERIFY CREDENTIAL MANAGER
      # ============================================================

      - name: Verify Credential Manager
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          BRIDGE="$(
            find android/app/src/main/java \
              -type f \
              -name "RKMSNativeBridge.java" \
              -print \
              | head -n 1
          )"

          if [ -z "$BRIDGE" ]; then
            echo "::error::RKMSNativeBridge.java missing."
            exit 1
          fi

          python3 - "$BRIDGE" <<'PY'
          from pathlib import Path
          import re
          import sys

          p = Path(sys.argv[1])

          s = p.read_text(
              encoding="utf-8"
          )

          required = [
              "CredentialManager",
              "CreatePasswordRequest",
              "createCredentialAsync",
              "savePassword"
          ]

          for item in required:

              if item not in s:
                  raise SystemExit(
                      f"Missing Credential Manager item: {item}"
                  )

          if not re.search(
              r'createCredentialAsync\s*\(\s*'
              r'activity\s*,\s*'
              r'req\s*,',
              s,
              re.S
          ):
              raise SystemExit(
                  "ERROR: Credential Manager argument "
                  "order is incorrect."
              )

          if re.search(
              r'createCredentialAsync\s*\(\s*'
              r'req\s*,',
              s,
              re.S
          ):
              raise SystemExit(
                  "ERROR: Old createCredentialAsync(req,...) "
                  "still exists."
              )

          print(
              "Credential Manager verification PASS."
          )
          PY


      # ============================================================
      # 28. VERIFY OLD CUSTOM PASSWORD VAULT REMOVED
      # ============================================================

      - name: Verify old password vault removed
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          if grep -nE \
            'RKMSSecureCredentialsPlugin|RKMSSecureCredentials' \
            scripts/setup-android-native.sh; then

            echo "::error::Old custom password vault detected."
            exit 1
          fi

          echo "Old custom password vault removed."


      # ============================================================
      # 29. VERIFY MICROPHONE + FILE PICKER
      # ============================================================

      - name: Verify microphone and file picker
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          grep -Fq \
            "RECORD_AUDIO" \
            scripts/setup-android-native.sh

          grep -Fq \
            "RESOURCE_AUDIO_CAPTURE" \
            scripts/setup-android-native.sh

          grep -Fq \
            "onShowFileChooser" \
            scripts/setup-android-native.sh

          grep -Fq \
            "MediaRecorder" \
            app.js

          echo "Microphone + file picker PASS."


      # ============================================================
      # 30. VERIFY KEYBOARD RESIZE
      # ============================================================

      - name: Verify keyboard resize
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          grep -Fq \
            "SOFT_INPUT_ADJUST_RESIZE" \
            scripts/setup-android-native.sh

          echo "Keyboard resize PASS."


      # ============================================================
      # 31. VERIFY FIREBASE NATIVE INITIALIZATION
      # ============================================================

      - name: Verify FirebaseApp initialization
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          MAIN_ACTIVITY="$(
            find android/app/src/main/java \
              -type f \
              -name "MainActivity.java" \
              -print \
              | head -n 1
          )"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "::error::MainActivity.java not found."
            exit 1
          fi

          echo "MainActivity:"
          echo "$MAIN_ACTIVITY"

          grep -Fq \
            "FirebaseApp.initializeApp" \
            "$MAIN_ACTIVITY" \
            || {
              echo "::error::FirebaseApp.initializeApp missing."
              exit 1
            }

          echo "FirebaseApp initialization PASS."


      # ============================================================
      # 32. VERIFY APPLICATION ID
      # ============================================================

      - name: Verify application ID
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          grep -Rqs \
            "org.rkms.connect" \
            app/build.gradle \
            app/src/main/AndroidManifest.xml \
            || {
              echo "::error::Application ID org.rkms.connect missing."
              exit 1
            }

          echo "Application ID PASS."


      # ============================================================
      # 33. CLEAN
      # ============================================================

      - name: Clean Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          ./gradlew clean \
            --no-daemon


      # ============================================================
      # 34. FINAL RELEASE APK BUILD
      # ============================================================

      - name: Build Final Release APK Only
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          echo "=============================================="
          echo "RKMS FINAL RELEASE APK"
          echo "=============================================="
          echo "Android API      : 36"
          echo "Build Tools      : 36.0.0"
          echo "Node             : 22"
          echo "Java             : 17"
          echo "AGP              : 8.9.1"
          echo "Gradle           : 8.11.1"
          echo "Firebase BOM     : 34.19.0"
          echo "Google Services  : 4.5.0"
          echo "Credential Mgr   : 1.5.0"
          echo "Package          : org.rkms.connect"
          echo "APK ONLY         : YES"
          echo "AAB              : NO"
          echo "=============================================="

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 35. LOCATE APK
      # ============================================================

      - name: Locate release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          APK="$(
            find \
              app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              ! -iname "*debug*" \
              -print \
              | head -n 1
          )"

          if [ -z "$APK" ]; then

            echo "::error::Release APK not found."

            find \
              app/build/outputs \
              -type f \
              -print \
              2>/dev/null \
              || true

            exit 1
          fi

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/${APK_NAME}"

          echo \
            "APK_PATH=$GITHUB_WORKSPACE/${APK_NAME}" \
            >> "$GITHUB_ENV"

          echo "Final APK:"
          ls -lh \
            "$GITHUB_WORKSPACE/${APK_NAME}"


      # ============================================================
      # 36. VERIFY APK PACKAGE
      # ============================================================

      - name: Verify APK package and target SDK
        shell: bash
        run: |
          set -euo pipefail

          APK="$APK_PATH"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt" \
            dump badging \
            "$APK" \
            > "$GITHUB_WORKSPACE/apk-badging.txt"

          cat \
            "$GITHUB_WORKSPACE/apk-badging.txt"

          grep -Fq \
            "package: name='${APP_ID}'" \
            "$GITHUB_WORKSPACE/apk-badging.txt" \
            || {
              echo "::error::Wrong APK package."
              exit 1
            }

          grep -Fq \
            "targetSdkVersion:'36'" \
            "$GITHUB_WORKSPACE/apk-badging.txt" \
            || {
              echo "::error::Target SDK 36 missing."
              exit 1
            }

          echo "APK package + target SDK PASS."


      # ============================================================
      # 37. VERIFY SIGNATURE
      # ============================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" \
            verify \
            --verbose \
            "$APK_PATH"

          echo "APK signature PASS."


      # ============================================================
      # 38. SHA256
      # ============================================================

      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          sha256sum \
            "$APK_NAME" \
            | tee \
              "${APK_NAME}.sha256"


      # ============================================================
      # 39. FINAL APK-ONLY AUDIT
      # ============================================================

      - name: Final APK-only audit
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          echo "=============================================="
          echo "FINAL ARTIFACT AUDIT"
          echo "=============================================="

          find . \
            -maxdepth 1 \
            -type f \
            \( \
              -name "*.apk" \
              -o -name "*.aab" \
              -o -name "*.sha256" \
            \) \
            -printf "%f\n" \
            | sort

          if find . \
            -maxdepth 1 \
            -type f \
            -name "*.aab" \
            | grep -q .; then

            echo "::error::AAB detected."
            exit 1
          fi

          if find . \
            -maxdepth 1 \
            -type f \
            -iname "*debug*.apk" \
            | grep -q .; then

            echo "::error::Debug APK detected."
            exit 1
          fi

          test -f "$APK_NAME"

          test -f \
            "${APK_NAME}.sha256"

          echo ""
          echo "=============================================="
          echo "FINAL AUDIT PASSED"
          echo "=============================================="
          echo "APK ONLY       : YES"
          echo "AAB            : NO"
          echo "DEBUG APK      : NO"
          echo "API            : 36"
          echo "TARGET SDK     : 36"
          echo "PACKAGE        : ${APP_ID}"
          echo "=============================================="


      # ============================================================
      # 40. UPLOAD ONLY APK + SHA256
      # ============================================================

      - name: Upload final APK and SHA256
        uses: actions/upload-artifact@v4
        with:
          name: RKMS_ANDROID16_API36_RELEASE_APK
          if-no-files-found: error
          path: |
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256
          retention-days: 30

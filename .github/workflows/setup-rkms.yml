name: Build RKMS APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rkms-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build RKMS APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # Prepare project
      # =========================================================
      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "Android project found at repository root."
          else
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -name 'RKMS_Connect_*.zip' \
              -print -quit)"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Android project not found."
              exit 1
            fi

            echo "Backward-compatible RKMS ZIP found:"
            echo "$ZIP_FILE"

            TMP_DIR="$RUNNER_TEMP/rkms-project"
            rm -rf "$TMP_DIR"
            mkdir -p "$TMP_DIR"

            unzip -q "$ZIP_FILE" -d "$TMP_DIR"

            PROJECT_DIR="$(
              find "$TMP_DIR" \
                -type f \
                \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
                -print -quit \
                | xargs -r dirname
            )"

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: Android project not found inside ZIP."
              exit 1
            fi

            rsync -a \
              --exclude='.github/' \
              "$PROJECT_DIR/" \
              "$GITHUB_WORKSPACE/"

            echo "Android project extracted successfully."
          fi


      # =========================================================
      # Android project validation
      # =========================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -f gradle.properties

          test -d app

          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Android project structure: PASS"


      # =========================================================
      # App name
      # =========================================================
      - name: Verify RKMS app name
        shell: bash
        run: |
          set -euo pipefail

          test -f app/src/main/res/values/strings.xml

          grep -Fq \
            '<string name="app_name">RKMS</string>' \
            app/src/main/res/values/strings.xml

          echo "RKMS app name: PASS"


      # =========================================================
      # Node.js
      # =========================================================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'


      # =========================================================
      # COMPLETE RKMS SOURCE VALIDATION
      # =========================================================
      - name: Validate RKMS source
        shell: bash
        run: |
          set -euo pipefail

          WWW="app/src/main/assets/www"
          BOOK_DIR="$WWW/assets/book"
          APP_JS="$WWW/app.js"
          CONFIG_JS="$WWW/config.js"
          INDEX_HTML="$WWW/index.html"

          echo "========================================"
          echo "RKMS SOURCE VALIDATION"
          echo "========================================"


          # -----------------------------------------------------
          # Web files
          # -----------------------------------------------------
          test -f "$INDEX_HTML"
          test -f "$APP_JS"
          test -f "$CONFIG_JS"
          test -f "$WWW/styles.css"

          echo "Web source files: PASS"


          # -----------------------------------------------------
          # Book
          # Actual project:
          # cover.jpg
          # page-01.jpg ... page-60.jpg
          # -----------------------------------------------------
          test -d "$BOOK_DIR"
          test -f "$BOOK_DIR/cover.jpg"

          for i in $(seq -w 1 60); do
            test -f "$BOOK_DIR/page-$i.jpg"
          done

          COUNT="$(
            find "$BOOK_DIR" \
              -maxdepth 1 \
              -type f \
              -name 'page-[0-9][0-9].jpg' \
              | wc -l \
              | tr -d ' '
          )"

          if [ "$COUNT" != "60" ]; then
            echo "ERROR: Expected 60 numbered pages."
            echo "Found: $COUNT"
            exit 1
          fi

          echo "Book cover: PASS"
          echo "Book pages 01-60: PASS"
          echo "Book total: 61 pages PASS"


          # -----------------------------------------------------
          # JavaScript syntax
          # -----------------------------------------------------
          node --check "$APP_JS"

          echo "app.js syntax: PASS"


          # -----------------------------------------------------
          # Security
          # -----------------------------------------------------
          if grep -RInE \
            'SUPABASE_SERVICE_ROLE_KEY|service_role|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY' \
            app/src/main/assets \
            app/src/main/java \
            app/src/main/res \
            2>/dev/null; then

            echo "ERROR: Possible private/service-role credential found."
            exit 1
          fi

          echo "Sensitive credential check: PASS"


          # =====================================================
          # BOOK READER
          # =====================================================

          echo "Checking Book reader controls..."


          # -----------------------------------------------------
          # Five actual buttons
          # -----------------------------------------------------
          grep -Fq 'id="bookFirst"' "$APP_JS"
          grep -Fq 'id="bookPrev"' "$APP_JS"
          grep -Fq 'id="bookNext"' "$APP_JS"
          grep -Fq 'id="bookLast"' "$APP_JS"

          # IMPORTANT:
          # Actual project uses bookDownloadPage
          grep -Fq 'id="bookDownloadPage"' "$APP_JS"

          echo "Fast / First page: PASS"
          echo "Back / Previous page: PASS"
          echo "Next page: PASS"
          echo "Last page: PASS"
          echo "Download: PASS"


          # -----------------------------------------------------
          # Viewport
          # -----------------------------------------------------
          grep -Fq 'id="bookViewport"' "$APP_JS"

          echo "Book viewport: PASS"


          # -----------------------------------------------------
          # Pointer gesture implementation
          # Actual project uses Pointer Events
          # -----------------------------------------------------
          grep -Fq 'pointerdown' "$APP_JS"
          grep -Fq 'pointermove' "$APP_JS"
          grep -Fq 'pointerup' "$APP_JS"

          echo "Pointer down: PASS"
          echo "Pointer move / pan: PASS"
          echo "Pointer up: PASS"


          # -----------------------------------------------------
          # Pinch zoom / pan engine
          # -----------------------------------------------------
          grep -Fq 'startDist' "$APP_JS"
          grep -Fq 'startScale' "$APP_JS"
          grep -Fq 'zoom.scale' "$APP_JS"
          grep -Fq 'zoom.x' "$APP_JS"
          grep -Fq 'zoom.y' "$APP_JS"
          grep -Fq 'clampPan' "$APP_JS"
          grep -Fq 'translate3d' "$APP_JS"

          echo "Pinch-to-zoom engine: PASS"
          echo "Four-direction pan engine: PASS"


          # -----------------------------------------------------
          # No visible zoom buttons
          # -----------------------------------------------------
          if grep -Eq \
            'id="(bookZoomIn|bookZoomOut|bookZoomReset|zoomIn|zoomOut|resetZoom)"' \
            "$APP_JS"; then

            echo "ERROR: Unwanted visible zoom button found."
            exit 1
          fi

          echo "No extra Zoom buttons: PASS"


          # =====================================================
          # LOADING UI
          # =====================================================

          grep -Fq 'rkms-loading' "$APP_JS"
          grep -Fq '.rkms-loading' "$WWW/styles.css"
          grep -Fq 'rkms-load-pulse' "$WWW/styles.css"
          grep -Fq 'rkms-load-sweep' "$WWW/styles.css"

          echo "RKMS loading visual: PASS"


          # =====================================================
          # ANDROID WEBVIEW
          # =====================================================

          MAIN_ACTIVITY="app/src/main/java/org/rkms/connect/MainActivity.java"

          test -f "$MAIN_ACTIVITY"

          grep -Fq \
            'setAcceptThirdPartyCookies(view, false)' \
            "$MAIN_ACTIVITY"

          echo "Third-party WebView cookies disabled: PASS"


          # =====================================================
          # DOWNLOAD BRIDGE
          # =====================================================

          grep -Fq \
            'downloadBookPage' \
            "$MAIN_ACTIVITY"

          grep -Fq \
            'rkms-download://' \
            "$APP_JS"

          echo "Book download bridge: PASS"


          # =====================================================
          # PERSISTENT LOGIN
          # =====================================================

          SESSION_STORE="app/src/main/java/org/rkms/connect/SessionStore.java"

          test -f "$SESSION_STORE"

          grep -Fq \
            'SharedPreferences' \
            "$SESSION_STORE"

          echo "Persistent session storage: PASS"


          # =====================================================
          # NOTIFICATIONS
          # =====================================================

          test -f \
            app/src/main/java/org/rkms/connect/RKMSFirebaseMessagingService.java

          test -f \
            app/src/main/java/org/rkms/connect/NotificationHelper.java

          echo "Firebase notification files: PASS"


          echo "========================================"
          echo "RKMS SOURCE VALIDATION: PASS"
          echo "========================================"


      # =========================================================
      # JDK 17
      # =========================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # =========================================================
      # Android SDK
      # =========================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          yes | sdkmanager --licenses \
            >/dev/null 2>&1 || true

          echo "Android SDK packages: PASS"


      # =========================================================
      # Gradle
      #
      # Actual project:
      # AGP 8.7.3
      # compileSdk 35
      # Java 17
      # No gradlew in project
      # =========================================================
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'


      # =========================================================
      # Environment
      # =========================================================
      - name: Show build environment
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version
          node --version

          echo "Build environment: PASS"


      # =========================================================
      # Gradle validation
      # =========================================================
      - name: Validate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon tasks

          echo "Gradle validation: PASS"


      # =========================================================
      # Clean
      # =========================================================
      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon clean

          echo "Clean: PASS"


      # =========================================================
      # BUILD APK
      # =========================================================
      - name: Build RKMS Debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

          echo "========================================"
          echo "RKMS DEBUG APK BUILD: PASS"
          echo "========================================"


      # =========================================================
      # Verify APK
      # =========================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          SIZE="$(stat -c%s "$APK")"

          if [ "$SIZE" -le 0 ]; then
            echo "ERROR: APK is empty."
            exit 1
          fi

          echo "========================================"
          echo "RKMS APK VERIFIED"
          echo "========================================"

          ls -lh "$APK"


      # =========================================================
      # Upload APK
      # =========================================================
      - name: Upload RKMS Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

name: RKMS Android 16 API 36 FINAL APK AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  android-release:

    name: RKMS Android 16 API 36 Release

    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. LOCATE RKMS SOURCE
      # ============================================================

      - name: Locate RKMS source
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "RKMS SOURCE"
          echo "============================================================"

          if [ -f "package.json" ] \
            && [ -f "app.js" ] \
            && [ -f "index.html" ]; then

            echo "Repository root contains RKMS source."

            echo "SOURCE_DIR=." >> "$GITHUB_ENV"

          else

            ZIP_FILE=""

            if [ -f "RKMS_CONNECT_FIXED_2026-09-18.zip" ]; then
              ZIP_FILE="RKMS_CONNECT_FIXED_2026-09-18.zip"
            fi

            if [ -z "$ZIP_FILE" ]; then
              ZIP_FILE="$(find . \
                -maxdepth 3 \
                -type f \
                -name 'RKMS_CONNECT_FIXED_2026-09-18.zip' \
                -print -quit || true)"
            fi

            if [ -z "$ZIP_FILE" ]; then
              ZIP_FILE="$(find . \
                -maxdepth 3 \
                -type f \
                -name 'RKMS_CONNECT_*.zip' \
                -print \
                | sort \
                | tail -1 || true)"
            fi

            if [ -z "$ZIP_FILE" ]; then

              echo "ERROR: RKMS source ZIP not found."

              echo ""
              echo "Available ZIP files:"

              find . \
                -maxdepth 3 \
                -type f \
                -name '*.zip' \
                -print \
                || true

              exit 1
            fi

            echo "Using:"
            echo "$ZIP_FILE"

            rm -rf .rkms_extract

            mkdir -p .rkms_extract

            unzip -q \
              "$ZIP_FILE" \
              -d .rkms_extract

            PACKAGE_JSON="$(find .rkms_extract \
              -type f \
              -name 'package.json' \
              -print \
              | head -1)"

            if [ -z "$PACKAGE_JSON" ]; then
              echo "ERROR: package.json not found in ZIP."
              exit 1
            fi

            SOURCE_DIR="$(dirname "$PACKAGE_JSON")"

            echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

            echo "SOURCE_DIR=$SOURCE_DIR"

          fi


      # ============================================================
      # 3. VERIFY SOURCE
      # ============================================================

      - name: Verify RKMS source
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          echo "============================================================"
          echo "RKMS SOURCE VERIFICATION"
          echo "============================================================"

          test -f package.json
          test -f app.js
          test -f index.html
          test -f styles.css
          test -f capacitor.config.json
          test -f google-services.json

          test -f scripts/configure-android-16.sh
          test -f scripts/setup-android-native.sh
          test -f scripts/configure-release-signing.sh

          echo "package.json: PASS"
          echo "app.js: PASS"
          echo "index.html: PASS"
          echo "styles.css: PASS"
          echo "capacitor.config.json: PASS"
          echo "google-services.json: PASS"
          echo "Android scripts: PASS"


      # ============================================================
      # 4. NODE 22
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'


      # ============================================================
      # 5. NODE CHECK
      # ============================================================

      - name: Verify Node and JavaScript
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          echo "Node:"
          node --version

          echo "NPM:"
          npm --version

          node --check app.js

          echo "app.js syntax: PASS"


      # ============================================================
      # 6. NPM INSTALL
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          npm install \
            --no-audit \
            --no-fund

          npm ls @capacitor/core --depth=0
          npm ls @capacitor/android --depth=0
          npm ls @capacitor/push-notifications --depth=0

          echo "NPM dependencies: PASS"


      # ============================================================
      # 7. WEB BUILD
      # ============================================================

      - name: Build RKMS web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          npm run build

          test -s dist/index.html

          echo "Web build: PASS"


      # ============================================================
      # 8. JDK 17
      # ============================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 9. ANDROID SDK PATH
      # ============================================================

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          test -d "$SDK"

          test -x \
            "$SDK/cmdline-tools/latest/bin/sdkmanager"

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --version

          echo "Android SDK: PASS"


      # ============================================================
      # 10. ANDROID LICENSES
      # ============================================================

      - name: Accept Android licenses
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          yes | \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses \
            >/dev/null 2>&1 \
            || true

          echo "Android licenses: PASS"


      # ============================================================
      # 11. API 36
      # ============================================================

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          test -d \
            "$SDK/platforms/android-36"

          test -d \
            "$SDK/build-tools/36.0.0"

          echo "Android platform 36: PASS"
          echo "Android build-tools 36.0.0: PASS"


      # ============================================================
      # 12. CAPACITOR ANDROID
      # ============================================================

      - name: Generate Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          rm -rf android

          npx cap add android

          test -f android/app/build.gradle
          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml

          echo "Capacitor Android project: PASS"


      # ============================================================
      # 13. ANDROID 16 API 36 CONFIGURATION
      # ============================================================

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          chmod +x \
            scripts/configure-android-16.sh

          bash \
            scripts/configure-android-16.sh

          test -f android/variables.gradle
          test -f android/build.gradle
          test -f android/gradle/wrapper/gradle-wrapper.properties

          grep -Eq \
            'compileSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

          grep -Eq \
            'targetSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

          grep -Fq \
            'com.android.tools.build:gradle:8.9.1' \
            android/build.gradle

          grep -Fq \
            'gradle-8.11.1-bin.zip' \
            android/gradle/wrapper/gradle-wrapper.properties

          echo "compileSdk 36: PASS"
          echo "targetSdk 36: PASS"
          echo "AGP 8.9.1: PASS"
          echo "Gradle 8.11.1: PASS"


      # ============================================================
      # 14. CAPACITOR SYNC
      # ============================================================

      - name: Sync Capacitor Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          npx cap sync android

          test -f \
            android/app/src/main/AndroidManifest.xml

          echo "Capacitor sync: PASS"


      # ============================================================
      # 15. RKMS NATIVE SETUP
      #
      # IMPORTANT:
      # This is the source ZIP's own native setup script.
      # It creates:
      #
      # MainActivity.java
      # RKMSNativeBridge.java
      # RKMSSecureCredentialsPlugin.java
      #
      # Firebase initialization is inserted here.
      # ============================================================

      - name: Setup RKMS native Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          chmod +x \
            scripts/setup-android-native.sh

          bash \
            scripts/setup-android-native.sh

          MAIN="android/app/src/main/java/org/rkms/connect/MainActivity.java"

          BRIDGE="android/app/src/main/java/org/rkms/connect/RKMSNativeBridge.java"

          SECURE="android/app/src/main/java/org/rkms/connect/RKMSSecureCredentialsPlugin.java"

          test -f "$MAIN"
          test -f "$BRIDGE"
          test -f "$SECURE"

          test -s \
            android/app/google-services.json

          echo "MainActivity: PASS"
          echo "RKMSNativeBridge: PASS"
          echo "RKMSSecureCredentialsPlugin: PASS"
          echo "google-services.json: PASS"


      # ============================================================
      # 16. FIREBASE PACKAGE ONLY
      #
      # No fragile dependency grep.
      # The actual Gradle build is the definitive test.
      # ============================================================

      - name: Verify Firebase package configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("android/app/google-services.json")

          if not p.is_file():
              raise SystemExit(
                  "ERROR: android/app/google-services.json missing"
              )

          data = json.loads(
              p.read_text()
          )

          packages = []

          for client in data.get("client", []):

              info = client.get(
                  "client_info",
                  {}
              )

              android_info = info.get(
                  "android_client_info",
                  {}
              )

              package_name = android_info.get(
                  "package_name"
              )

              if package_name:
                  packages.append(package_name)

          print("Firebase Android packages:")

          for package_name in packages:
              print(" -", package_name)

          if "org.rkms.connect" not in packages:
              raise SystemExit(
                  "ERROR: Firebase client for "
                  "org.rkms.connect not found"
              )

          print(
              "Firebase package org.rkms.connect: PASS"
          )
          PY


      # ============================================================
      # 17. FIREBASE MAIN ACTIVITY
      #
      # Only verify the actual required initialization.
      # NO old broken onCreate regex.
      # ============================================================

      - name: Verify Firebase MainActivity
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          MAIN="android/app/src/main/java/org/rkms/connect/MainActivity.java"

          test -f "$MAIN"

          grep -Fq \
            'FirebaseApp.initializeApp(this)' \
            "$MAIN"

          grep -Fq \
            'registerPlugin(RKMSSecureCredentialsPlugin.class)' \
            "$MAIN"

          grep -Fq \
            'super.onCreate(savedInstanceState);' \
            "$MAIN"

          grep -Fq \
            'RKMSNativeBridge(this, getBridge().getWebView())' \
            "$MAIN"

          FIREBASE_COUNT="$(
            grep -F \
              -o \
              'FirebaseApp.initializeApp(this)' \
              "$MAIN" \
              | wc -l
          )"

          if [ "$FIREBASE_COUNT" -ne 1 ]; then

            echo "ERROR: Firebase initialization count = $FIREBASE_COUNT"

            sed -n '1,220p' "$MAIN"

            exit 1

          fi

          ONCREATE_COUNT="$(
            grep -E \
              -c \
              'void[[:space:]]+onCreate[[:space:]]*\(' \
              "$MAIN" \
              || true
          )"

          echo "onCreate count: $ONCREATE_COUNT"

          if [ "$ONCREATE_COUNT" -ne 1 ]; then

            echo "ERROR: MainActivity onCreate count must be 1."

            grep -n \
              'onCreate' \
              "$MAIN" \
              || true

            exit 1

          fi

          echo "Firebase initialization: PASS"
          echo "MainActivity: PASS"


      # ============================================================
      # 18. NATIVE BRIDGE STATIC AUDIT
      # ============================================================

      - name: Verify RKMS native bridge
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 \
            scripts/verify-native-bridge.py

          BRIDGE="android/app/src/main/java/org/rkms/connect/RKMSNativeBridge.java"

          test -f "$BRIDGE"

          if grep -Fq \
            '\n@JavascriptInterface' \
            "$BRIDGE"; then

            echo "ERROR: broken literal newline found."
            exit 1

          fi

          if grep -Fq \
            '\n @JavascriptInterface' \
            "$BRIDGE"; then

            echo "ERROR: broken literal newline found."
            exit 1

          fi

          grep -Fq \
            'isFirebaseReady' \
            "$BRIDGE" \
            || true

          grep -Fq \
            'saveSession' \
            "$BRIDGE"

          echo "Native bridge audit: PASS"


      # ============================================================
      # 19. SAVED LOGIN AUDIT
      # ============================================================

      - name: Verify saved login
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 \
            scripts/verify-saved-login.py

          echo "Saved login audit: PASS"


      # ============================================================
      # 20. FCM STATIC AUDIT
      # ============================================================

      - name: Verify FCM pipeline
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 \
            scripts/verify-fcm-pipeline.py

          echo "FCM pipeline audit: PASS"


      # ============================================================
      # 21. ANDROID 16 STATIC AUDIT
      # ============================================================

      - name: Verify Android 16
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 \
            scripts/verify-android-16.py

          echo "Android 16 audit: PASS"


      # ============================================================
      # 22. FINAL RKMS AUDIT
      # ============================================================

      - name: Verify final RKMS rules
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 \
            scripts/verify-rkms-final.py

          echo "Final RKMS audit: PASS"


      # ============================================================
      # 23. LOGIN NAVIGATION
      # ============================================================

      - name: Verify login navigation
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-final-login-navigation.py ]; then
            python3 \
              scripts/verify-final-login-navigation.py
          fi

          echo "Login navigation audit: PASS"


      # ============================================================
      # 24. AUTHORITY
      # ============================================================

      - name: Verify authority hierarchy
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-authority-hierarchy.py ]; then
            python3 \
              scripts/verify-authority-hierarchy.py
          fi

          echo "Authority audit: PASS"


      # ============================================================
      # 25. DIRECTORY
      # ============================================================

      - name: Verify directory
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-directory-lists.py ]; then
            python3 \
              scripts/verify-directory-lists.py
          fi

          if [ -f scripts/verify-member-directory-scope.py ]; then
            python3 \
              scripts/verify-member-directory-scope.py
          fi

          if [ -f scripts/verify-directory-contact-actions.py ]; then
            python3 \
              scripts/verify-directory-contact-actions.py
          fi

          if [ -f scripts/verify-v17-directory-deep.py ]; then
            python3 \
              scripts/verify-v17-directory-deep.py
          fi

          echo "Directory audit: PASS"


      # ============================================================
      # 26. PROFILE
      # ============================================================

      - name: Verify profile
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-profile-update-final.py ]; then
            python3 \
              scripts/verify-profile-update-final.py
          fi

          echo "Profile audit: PASS"


      # ============================================================
      # 27. PDF / REPORT
      # ============================================================

      - name: Verify PDF and report pipeline
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-pdf-pipeline.py ]; then
            python3 \
              scripts/verify-pdf-pipeline.py
          fi

          if [ -f scripts/verify-report-download-scope.py ]; then
            python3 \
              scripts/verify-report-download-scope.py
          fi

          echo "PDF/report audit: PASS"


      # ============================================================
      # 28. COMPLAINT IMPLEMENTATION
      #
      # DO NOT RUN verify-complaint-final.py.
      #
      # That old verifier contains an obsolete APK-only build
      # condition which is unrelated to source correctness.
      # ============================================================

      - name: Verify complaint implementation
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          grep -Fq \
            'memberCloseComplaint' \
            app.js

          grep -Fq \
            'memberReopenComplaint' \
            app.js

          grep -Fq \
            'officerCloseComplaint' \
            app.js

          grep -Fq \
            'rkms_officer_close_complaint' \
            app.js

          grep -Fq \
            'rkms_officer_close_complaint' \
            supabase/migrations/20260915090000_complaint_officer_close.sql

          grep -Fq \
            '.complaint-action-card' \
            styles.css

          echo "Complaint implementation: PASS"


      # ============================================================
      # 29. VERIFY SIGNING SECRETS
      # ============================================================

      - name: Verify release signing secrets
        shell: bash
        run: |
          set -euo pipefail

          test -n \
            "${RKMS_KEYSTORE_BASE64:-}" \
            || {
              echo "ERROR: RKMS_KEYSTORE_BASE64 missing."
              exit 1
            }

          test -n \
            "${RKMS_KEYSTORE_PASSWORD:-}" \
            || {
              echo "ERROR: RKMS_KEYSTORE_PASSWORD missing."
              exit 1
            }

          test -n \
            "${RKMS_KEY_ALIAS:-}" \
            || {
              echo "ERROR: RKMS_KEY_ALIAS missing."
              exit 1
            }

          test -n \
            "${RKMS_KEY_PASSWORD:-}" \
            || {
              echo "ERROR: RKMS_KEY_PASSWORD missing."
              exit 1
            }

          echo "Signing secrets: PASS"


      # ============================================================
      # 30. CONFIGURE SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          chmod +x \
            scripts/configure-release-signing.sh

          bash \
            scripts/configure-release-signing.sh

          test -s \
            android/app/release.keystore

          grep -Fq \
            'signingConfigs.release' \
            android/app/build.gradle

          echo "Release signing configuration: PASS"


      # ============================================================
      # 31. FINAL ANDROID CHECK
      # ============================================================

      - name: Final Android configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          test -f \
            android/app/build.gradle

          test -f \
            android/app/src/main/AndroidManifest.xml

          test -f \
            android/variables.gradle

          test -d \
            "${ANDROID_HOME}/platforms/android-36"

          test -d \
            "${ANDROID_HOME}/build-tools/36.0.0"

          grep -Eq \
            'compileSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

          grep -Eq \
            'targetSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

          grep -Eq \
            'minSdkVersion[[:space:]]*=[[:space:]]*23' \
            android/variables.gradle

          grep -Fq \
            'com.android.tools.build:gradle:8.9.1' \
            android/build.gradle

          grep -Fq \
            'gradle-8.11.1-bin.zip' \
            android/gradle/wrapper/gradle-wrapper.properties

          echo "compileSdk 36: PASS"
          echo "targetSdk 36: PASS"
          echo "minSdk 23: PASS"
          echo "AGP 8.9.1: PASS"
          echo "Gradle 8.11.1: PASS"


      # ============================================================
      # 32. FINAL FIREBASE CHECK
      #
      # Only actual required source items.
      # No Firebase BOM/Messaging grep.
      # ============================================================

      - name: Final Firebase check
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          MAIN="android/app/src/main/java/org/rkms/connect/MainActivity.java"

          test -s \
            android/app/google-services.json

          test -f "$MAIN"

          grep -Fq \
            'FirebaseApp.initializeApp(this)' \
            "$MAIN"

          grep -Fq \
            'com.google.gms.google-services' \
            android/app/build.gradle

          echo "Firebase JSON: PASS"
          echo "Firebase initialization: PASS"
          echo "Google Services plugin: PASS"


      # ============================================================
      # 33. GRADLE WRAPPER
      # ============================================================

      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR/android"

          chmod +x gradlew

          ./gradlew \
            --version

          echo "Gradle wrapper: PASS"


      # ============================================================
      # 34. REAL BUILD
      #
      # THIS IS THE IMPORTANT STEP.
      #
      # No fake Firebase verification after this.
      # Gradle itself checks:
      #
      # Java
      # Firebase
      # Capacitor
      # Android dependencies
      # signing
      # APK compilation
      # AAB compilation
      # ============================================================

      - name: Build signed Release APK and AAB
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR/android"

          echo ""
          echo "============================================================"
          echo "RKMS REAL ANDROID BUILD"
          echo "============================================================"
          echo ""

          ./gradlew \
            clean \
            assembleRelease \
            bundleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "============================================================"
          echo "GRADLE BUILD: PASS"
          echo "============================================================"


      # ============================================================
      # 35. APK
      # ============================================================

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then

            echo "ERROR: APK not generated."

            find \
              android/app/build/outputs \
              -type f \
              -name '*.apk' \
              -print \
              || true

            exit 1

          fi

          apksigner \
            verify \
            --verbose \
            "$APK"

          echo ""
          echo "APK:"
          ls -lh "$APK"

          echo "APK signature: PASS"


      # ============================================================
      # 36. AAB
      # ============================================================

      - name: Verify signed AAB
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -s "$AAB" ]; then

            echo "ERROR: AAB not generated."

            find \
              android/app/build/outputs \
              -type f \
              -name '*.aab' \
              -print \
              || true

            exit 1

          fi

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB"

          echo ""
          echo "AAB:"
          ls -lh "$AAB"

          echo "AAB signature: PASS"


      # ============================================================
      # 37. PREPARE FINAL APK
      # ============================================================

      - name: Prepare final APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          mkdir -p release

          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          echo "Final APK prepared."


      # ============================================================
      # 38. PREPARE FINAL AAB
      # ============================================================

      - name: Prepare final AAB
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          mkdir -p release

          cp \
            android/app/build/outputs/bundle/release/app-release.aab \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab

          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab

          echo "Final AAB prepared."


      # ============================================================
      # 39. APK SHA256
      # ============================================================

      - name: Calculate APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          sha256sum \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk \
            | tee \
            release/RKMS_ANDROID16_API36_APK_SHA256.txt


      # ============================================================
      # 40. AAB SHA256
      # ============================================================

      - name: Calculate AAB SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          sha256sum \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab \
            | tee \
            release/RKMS_ANDROID16_API36_AAB_SHA256.txt


      # ============================================================
      # 41. FINAL SIGNATURE CHECK
      # ============================================================

      - name: Final release verification
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          APK="release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"
          AAB="release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab"

          test -s "$APK"
          test -s "$AAB"

          apksigner \
            verify \
            --verbose \
            "$APK"

          jarsigner \
            -verify \
            "$AAB"

          echo ""
          echo "============================================================"
          echo "        RKMS FINAL BUILD SUCCESS"
          echo "============================================================"
          echo ""
          echo "Android API       : 36"
          echo "compileSdk        : 36"
          echo "targetSdk         : 36"
          echo "minSdk            : 23"
          echo "Firebase          : INITIALIZED"
          echo "FCM               : CONFIGURED"
          echo "Saved Login       : VERIFIED"
          echo "Native Bridge     : VERIFIED"
          echo "Release Signing   : VERIFIED"
          echo "APK               : SIGNED"
          echo "AAB               : SIGNED"
          echo ""
          echo "============================================================"

          echo ""
          echo "Release files:"
          ls -lh release/


      # ============================================================
      # 42. UPLOAD FINAL FILES
      # ============================================================

      - name: Upload final APK AAB
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Android-16-API36-FINAL-APK-AAB
          path: |
            ${{ env.SOURCE_DIR }}/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            ${{ env.SOURCE_DIR }}/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab
            ${{ env.SOURCE_DIR }}/release/RKMS_ANDROID16_API36_APK_SHA256.txt
            ${{ env.SOURCE_DIR }}/release/RKMS_ANDROID16_API36_AAB_SHA256.txt
          if-no-files-found: error
          retention-days: 90

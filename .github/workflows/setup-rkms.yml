name: RKMS Android 16 API 36 - Final Signed Release APK Only

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  AGP_VERSION: "8.10.0"
  GRADLE_VERSION: "8.11.1"
  APP_ID: "org.rkms.connect"
  MIN_SDK: "23"
  TARGET_SDK: "36"

jobs:
  build:
    name: RKMS Final Signed Release APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. NODE 22
      # ==========================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}


      # ==========================================================
      # 3. JAVA 17
      # ==========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # ==========================================================
      # 4. FIND SOURCE ZIP
      # ==========================================================

      - name: Find RKMS source ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "RKMS_CONNECT_FINAL_AUDITED_RELEASE_APK_BUILD_20260922.zip" ]; then

            SOURCE_ZIP="RKMS_CONNECT_FINAL_AUDITED_RELEASE_APK_BUILD_20260922.zip"

          else

            SOURCE_ZIP="$(
              find . \
                -maxdepth 3 \
                -type f \
                -name "*.zip" \
                -not -path "./.git/*" \
                -print \
                | sort \
                | head -n 1 || true
            )"

            if [ -z "$SOURCE_ZIP" ]; then
              echo "::error::RKMS source ZIP not found."
              exit 1
            fi

          fi

          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "RKMS SOURCE ZIP"
          echo "=========================================="
          echo "$SOURCE_ZIP"
          sha256sum "$SOURCE_ZIP"
          echo "=========================================="


      # ==========================================================
      # 5. EXTRACT SOURCE
      # ==========================================================

      - name: Extract RKMS source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf rkms-build

          mkdir -p rkms-build

          unzip -q \
            "$SOURCE_ZIP" \
            -d rkms-build

          echo "SOURCE EXTRACTION: PASS"


      # ==========================================================
      # 6. FIND PROJECT ROOT
      # ==========================================================

      - name: Find RKMS project root
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "rkms-build/package.json" ]; then

            ROOT="rkms-build"

          else

            PACKAGE_FILE="$(
              find rkms-build \
                -type f \
                -name "package.json" \
                -not -path "*/node_modules/*" \
                -print \
                | head -n 1 || true
            )"

            if [ -z "$PACKAGE_FILE" ]; then
              echo "::error::package.json not found inside source ZIP."
              exit 1
            fi

            ROOT="$(dirname "$PACKAGE_FILE")"

          fi

          echo "RKMS_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "RKMS_ROOT=$ROOT"


      # ==========================================================
      # 7. VERIFY SOURCE
      # ==========================================================

      - name: Verify RKMS source
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          test -s package.json
          test -s google-services.json
          test -f scripts/setup-android-native.sh

          echo "package.json: PASS"
          echo "google-services.json: PASS"
          echo "setup-android-native.sh: PASS"


      # ==========================================================
      # 8. VERIFY CAPACITOR
      # ==========================================================

      - name: Verify Capacitor versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node -e '
          const fs = require("fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const deps = {
            ...(pkg.dependencies || {}),
            ...(pkg.devDependencies || {})
          };

          const required = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          let failed = false;

          for (const [name, wanted] of Object.entries(required)) {

            const actual = deps[name];

            console.log(
              name + ": " + (actual || "MISSING")
            );

            if (
              !actual ||
              ![
                wanted,
                "^" + wanted,
                "~" + wanted
              ].includes(actual)
            ) {
              failed = true;
            }
          }

          if (failed) {
            process.exit(1);
          }
          '

          echo "CAPACITOR VERSION CHECK: PASS"


      # ==========================================================
      # 9. NPM INSTALL
      # ==========================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          if [ -f package-lock.json ]; then

            npm ci \
              --no-audit \
              --no-fund

          else

            npm install \
              --no-audit \
              --no-fund

          fi

          echo "NPM INSTALL: PASS"


      # ==========================================================
      # 10. WEB BUILD
      # ==========================================================

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm run build

          test -s dist/index.html

          echo "WEB BUILD: PASS"


      # ==========================================================
      # 11. ANDROID SDK
      # ==========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ==========================================================
      # 12. ANDROID API 36
      # ==========================================================

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK" ]; then
            echo "::error::Android SDK not found."
            exit 1
          fi

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then

            SDKMANAGER="$(
              find "$SDK/cmdline-tools" \
                -type f \
                -name sdkmanager \
                -print \
                | head -n 1 || true
            )"

          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" \
            --licenses \
            >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          echo "ANDROID API 36: PASS"


      # ==========================================================
      # 13. CREATE CAPACITOR ANDROID
      # ==========================================================

      - name: Create Capacitor Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          rm -rf android

          npx cap add android

          test -d android
          test -f android/gradlew
          test -f android/app/build.gradle

          echo "CAPACITOR ANDROID PROJECT: PASS"


      # ==========================================================
      # 14. ANDROID 16 / GRADLE CONFIGURATION
      # ==========================================================

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          if [ -f scripts/configure-android-16.sh ]; then

            chmod +x scripts/configure-android-16.sh

            bash -n \
              scripts/configure-android-16.sh

            ./scripts/configure-android-16.sh

          fi

          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"

          test -f "$WRAPPER"

          sed -i \
            "s#^distributionUrl=.*#distributionUrl=https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip#" \
            "$WRAPPER"


          if [ -f android/variables.gradle ]; then

            sed -i -E \
              's/compileSdkVersion[[:space:]]*=[[:space:]]*[0-9]+/compileSdkVersion = 36/' \
              android/variables.gradle \
              || true

            sed -i -E \
              's/targetSdkVersion[[:space:]]*=[[:space:]]*[0-9]+/targetSdkVersion = 36/' \
              android/variables.gradle \
              || true

            sed -i -E \
              's/minSdkVersion[[:space:]]*=[[:space:]]*[0-9]+/minSdkVersion = 23/' \
              android/variables.gradle \
              || true

          fi


          if [ -f android/build.gradle ]; then

            sed -i -E \
              "s/com.android.tools.build:gradle:[0-9.]+/com.android.tools.build:gradle:${AGP_VERSION}/g" \
              android/build.gradle \
              || true

          fi

          echo "ANDROID 16/API 36 CONFIGURATION: PASS"


      # ==========================================================
      # 15. CAPACITOR SYNC
      # ==========================================================

      - name: Capacitor sync
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npx cap sync android

          echo "CAPACITOR SYNC: PASS"


      # ==========================================================
      # 16. RKMS NATIVE SETUP
      # ==========================================================

      - name: Configure RKMS native Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/setup-android-native.sh

          bash -n \
            scripts/setup-android-native.sh

          ./scripts/setup-android-native.sh

          echo "RKMS NATIVE ANDROID SETUP: PASS"


      # ==========================================================
      # 17. FIREBASE
      # ==========================================================

      - name: Configure Firebase
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          test -s google-services.json

          cp -f \
            google-services.json \
            android/app/google-services.json

          grep -Fq \
            "org.rkms.connect" \
            android/app/google-services.json

          echo "FIREBASE CONFIG: PASS"


      # ==========================================================
      # 18. FIREBASE / ANDROID DEPENDENCIES
      # ==========================================================

      - name: Configure Firebase dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 - <<'PY'
from pathlib import Path

p = Path("android/build.gradle")
s = p.read_text(encoding="utf-8")

plugin = "classpath 'com.google.gms:google-services:4.4.4'"

if (
    plugin not in s
    and "buildscript" in s
    and "dependencies {" in s
):
    s = s.replace(
        "dependencies {",
        "dependencies {\n        " + plugin,
        1
    )

p.write_text(s, encoding="utf-8")
PY


          python3 - <<'PY'
from pathlib import Path

p = Path("android/app/build.gradle")
s = p.read_text(encoding="utf-8")

deps = [
    'implementation platform("com.google.firebase:firebase-bom:34.19.0")',
    'implementation "com.google.firebase:firebase-messaging"',
    'implementation "androidx.credentials:credentials:1.5.0"',
    'implementation "androidx.credentials:credentials-play-services-auth:1.5.0"',
    'implementation "androidx.biometric:biometric:1.1.0"'
]

if "dependencies {" not in s:
    raise SystemExit("dependencies block missing")

for dep in deps:

    if dep not in s:

        s = s.replace(
            "dependencies {",
            "dependencies {\n    " + dep,
            1
        )

if "com.google.gms.google-services" not in s:

    s += "\napply plugin: 'com.google.gms.google-services'\n"

p.write_text(s, encoding="utf-8")
PY


          grep -Fq \
            "firebase-messaging" \
            android/app/build.gradle

          grep -Fq \
            "androidx.biometric:biometric:1.1.0" \
            android/app/build.gradle

          echo "FIREBASE DEPENDENCIES: PASS"
          echo "BIOMETRIC: PASS"
          echo "CREDENTIAL MANAGER: PASS"


      # ==========================================================
      # 19. NATIVE BRIDGE + PERMISSIONS
      # ==========================================================

      - name: Verify native bridge and permissions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          BRIDGE="$(
            find android/app/src/main \
              -type f \
              -name "RKMSNativeBridge.java" \
              -print \
              | head -n 1 \
              || true
          )"

          if [ -z "$BRIDGE" ]; then
            echo "::error::RKMSNativeBridge.java not found."
            exit 1
          fi

          grep -Fq \
            "AndroidKeyStore" \
            "$BRIDGE"

          grep -Fq \
            "CredentialManager" \
            "$BRIDGE"


          MANIFEST="android/app/src/main/AndroidManifest.xml"

          test -s "$MANIFEST"

          grep -Fq \
            "android.permission.RECORD_AUDIO" \
            "$MANIFEST"

          grep -Fq \
            "android.permission.POST_NOTIFICATIONS" \
            "$MANIFEST"

          echo "RKMS NATIVE BRIDGE: PASS"
          echo "ANDROID KEYSTORE: PASS"
          echo "CREDENTIAL MANAGER: PASS"
          echo "RECORD AUDIO: PASS"
          echo "POST NOTIFICATIONS: PASS"


      # ==========================================================
      # 20. SOURCE SYNTAX
      # ==========================================================

      - name: Final source validation
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node --check app.js

          bash -n \
            scripts/setup-android-native.sh

          test -s \
            android/app/google-services.json

          test -s \
            android/app/src/main/AndroidManifest.xml

          echo "FINAL SOURCE VALIDATION: PASS"


      # ==========================================================
      # 21. SIGNING SECRETS
      # ==========================================================

      - name: Verify release signing secrets
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          test -n "${RKMS_KEYSTORE_BASE64:-}" || {
            echo "::error::RKMS_KEYSTORE_BASE64 secret is missing."
            exit 1
          }

          test -n "${RKMS_KEYSTORE_PASSWORD:-}" || {
            echo "::error::RKMS_KEYSTORE_PASSWORD secret is missing."
            exit 1
          }

          test -n "${RKMS_KEY_ALIAS:-}" || {
            echo "::error::RKMS_KEY_ALIAS secret is missing."
            exit 1
          }

          test -n "${RKMS_KEY_PASSWORD:-}" || {
            echo "::error::RKMS_KEY_PASSWORD secret is missing."
            exit 1
          }

          echo "RELEASE SIGNING SECRETS: PASS"


      # ==========================================================
      # 22. INSTALL KEYSTORE
      # ==========================================================

      - name: Install release keystore
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}

        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          printf '%s' \
            "$RKMS_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/release.keystore

          test -s \
            android/app/release.keystore

          chmod 600 \
            android/app/release.keystore

          echo "RELEASE KEYSTORE: PASS"


      # ==========================================================
      # 23. RELEASE SIGNING
      # ==========================================================

      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 - <<'PY'
from pathlib import Path

p = Path("android/app/build.gradle")
s = p.read_text(encoding="utf-8")

signing = """signingConfigs {
    release {
        storeFile file("release.keystore")
        storePassword System.getenv("RKMS_KEYSTORE_PASSWORD")
        keyAlias System.getenv("RKMS_KEY_ALIAS")
        keyPassword System.getenv("RKMS_KEY_PASSWORD")
    }
}
"""

start = s.find("signingConfigs {")

if start >= 0:

    depth = 0
    end = None

    for i in range(start, len(s)):

        if s[i] == "{":
            depth += 1

        elif s[i] == "}":

            depth -= 1

            if depth == 0:
                end = i + 1
                break

    if end is None:
        raise SystemExit(
            "Invalid signingConfigs block"
        )

    s = s[:start] + signing + s[end:]

else:

    marker = "buildTypes {"

    if marker not in s:
        raise SystemExit(
            "buildTypes block missing"
        )

    s = s.replace(
        marker,
        signing + "\n" + marker,
        1
    )


build_start = s.find("buildTypes {")

release_start = s.find(
    "release {",
    build_start
)

if release_start < 0:
    raise SystemExit(
        "release buildType missing"
    )

if "signingConfig signingConfigs.release" not in s:

    s = s[:release_start] + s[release_start:].replace(
        "release {",
        "release {\n            signingConfig signingConfigs.release",
        1
    )

p.write_text(s, encoding="utf-8")
PY


          grep -Fq \
            'storeFile file("release.keystore")' \
            android/app/build.gradle

          grep -Fq \
            'signingConfig signingConfigs.release' \
            android/app/build.gradle

          echo "RELEASE SIGNING CONFIGURATION: PASS"


      # ==========================================================
      # 24. VERIFY KEYSTORE
      # ==========================================================

      - name: Verify release keystore
        shell: bash
        env:
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}

        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          keytool \
            -list \
            -keystore android/app/release.keystore \
            -storepass "$RKMS_KEYSTORE_PASSWORD" \
            -alias "$RKMS_KEY_ALIAS" \
            >/dev/null

          echo "KEYSTORE VALIDATION: PASS"


      # ==========================================================
      # 25. GRADLE VALIDATION
      # ==========================================================

      - name: Verify Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          chmod +x gradlew

          ./gradlew \
            --version \
            --no-daemon

          echo "GRADLE VALIDATION: PASS"


      # ==========================================================
      # 26. CLEAN
      # ==========================================================

      - name: Clean Android build
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          ./gradlew \
            clean \
            --no-daemon

          echo "ANDROID CLEAN: PASS"


      # ==========================================================
      # 27. FINAL RELEASE APK ONLY
      # ==========================================================

      - name: Build Final Signed Release APK
        shell: bash
        env:
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          echo "=========================================="
          echo "RKMS FINAL SIGNED RELEASE APK"
          echo "=========================================="
          echo "Package: ${APP_ID}"
          echo "Android API: ${ANDROID_API}"
          echo "Target SDK: ${TARGET_SDK}"
          echo "Min SDK: ${MIN_SDK}"
          echo "SIGNED: YES"
          echo "DEBUG APK: NO"
          echo "AAB: NO"
          echo "=========================================="

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then

            echo "::error::Release APK was not created."

            find \
              app/build/outputs \
              -type f \
              -print \
              || true

            exit 1

          fi

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"

          echo \
            "APK_PATH=$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk" \
            >> "$GITHUB_ENV"

          echo "FINAL RELEASE APK BUILD: PASS"


      # ==========================================================
      # 28. APK PACKAGE + SIGNATURE
      # ==========================================================

      - name: Verify APK package and signature
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          AAPT="$SDK/build-tools/$BUILD_TOOLS/aapt"

          APKSIGNER="$SDK/build-tools/$BUILD_TOOLS/apksigner"

          test -x "$AAPT"
          test -x "$APKSIGNER"

          "$AAPT" \
            dump badging \
            "$APK_PATH" \
            | tee apk-badging.txt

          grep -Fq \
            "package: name='$APP_ID'" \
            apk-badging.txt

          grep -Fq \
            "targetSdkVersion:'36'" \
            apk-badging.txt

          "$APKSIGNER" \
            verify \
            --verbose \
            "$APK_PATH"

          "$APKSIGNER" \
            verify \
            --print-certs \
            "$APK_PATH"

          echo "APK PACKAGE: PASS"
          echo "APK SIGNATURE: PASS"


      # ==========================================================
      # 29. SHA256
      # ==========================================================

      - name: Generate APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            "$APK_PATH" \
            | tee \
            "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256"

          echo "SHA256: PASS"


      # ==========================================================
      # 30. FINAL APK ONLY AUDIT
      # ==========================================================

      - name: Final APK only audit
        shell: bash
        run: |
          set -euo pipefail

          test -s \
            "$APK_PATH"

          test -s \
            "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256"


          if find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.aab" \
            -print \
            | grep -q .
          then

            echo "::error::AAB detected."

            exit 1

          fi


          SIZE="$(
            stat \
              -c%s \
              "$APK_PATH"
          )"


          if [ "$SIZE" -lt 1000000 ]; then

            echo "::error::APK size is unexpectedly small."

            exit 1

          fi


          echo "=========================================="
          echo "RKMS FINAL APK AUDIT: PASS"
          echo "=========================================="
          echo "APK: RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"
          echo "SIGNED: YES"
          echo "DEBUG: NO"
          echo "AAB: NO"
          echo "SIZE: $SIZE bytes"
          echo "=========================================="

          cat \
            "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256"


      # ==========================================================
      # 31. UPLOAD ONLY FINAL APK
      # ==========================================================

      - name: Upload final signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS_ANDROID16_API36_FINAL_SIGNED_RELEASE_APK

          if-no-files-found: error

          path: |
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256

          retention-days: 30

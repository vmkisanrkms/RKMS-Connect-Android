name: RKMS Android 16 API 36 FINAL APK AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  android-release:

    name: RKMS Android 16 API 36 Release
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. LOCATE RKMS SOURCE
      # ============================================================

      - name: Locate RKMS source
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "RKMS SOURCE SELECTION"
          echo "============================================================"

          if [ -f "package.json" ] && \
             [ -f "app.js" ] && \
             [ -f "index.html" ]; then

            echo "RKMS source found in repository root."
            echo "SOURCE_DIR=." >> "$GITHUB_ENV"
            exit 0
          fi

          echo "Repository root is not RKMS source."
          echo "Searching RKMS ZIP files..."

          mapfile -t ZIP_CANDIDATES < <(
            find . \
              -type f \
              -name '*.zip' \
              ! -path './.git/*' \
              -print \
              | sort -r
          )

          if [ "${#ZIP_CANDIDATES[@]}" -eq 0 ]; then
            echo "ERROR: No RKMS ZIP found."
            exit 1
          fi

          SELECTED_ZIP=""

          for ZIP_FILE in "${ZIP_CANDIDATES[@]}"; do

            echo ""
            echo "Testing ZIP:"
            echo "$ZIP_FILE"

            TEST_DIR=".rkms_test_extract"

            rm -rf "$TEST_DIR"
            mkdir -p "$TEST_DIR"

            if ! unzip -q "$ZIP_FILE" -d "$TEST_DIR"; then
              echo "ZIP extraction failed."
              continue
            fi

            TEST_PACKAGE_JSON="$(
              find "$TEST_DIR" \
                -type f \
                -name 'package.json' \
                -print \
                | head -1
            )"

            if [ -z "$TEST_PACKAGE_JSON" ]; then
              echo "package.json missing."
              continue
            fi

            TEST_SOURCE_DIR="$(
              dirname "$TEST_PACKAGE_JSON"
            )"

            if [ ! -f "$TEST_SOURCE_DIR/app.js" ]; then
              echo "app.js missing."
              continue
            fi

            REQUIRED_OK=true

            grep -Fq "team_rkms" \
              "$TEST_SOURCE_DIR/app.js" \
              || REQUIRED_OK=false

            grep -Fq "A94473" \
              "$TEST_SOURCE_DIR/app.js" \
              || REQUIRED_OK=false

            grep -Fq \
              "b909411c-591d-4a57-9d8d-280842901331" \
              "$TEST_SOURCE_DIR/app.js" \
              || REQUIRED_OK=false

            grep -Fq "teamRkmsAvatar" \
              "$TEST_SOURCE_DIR/app.js" \
              || REQUIRED_OK=false

            grep -Fq "isTeamRKMSProfile" \
              "$TEST_SOURCE_DIR/app.js" \
              || REQUIRED_OK=false

            grep -Fq "SUPER_ADMIN" \
              "$TEST_SOURCE_DIR/app.js" \
              || REQUIRED_OK=false

            if [ "$REQUIRED_OK" = true ]; then
              SELECTED_ZIP="$ZIP_FILE"
              break
            fi

          done

          rm -rf .rkms_test_extract

          if [ -z "$SELECTED_ZIP" ]; then

            echo ""
            echo "============================================================"
            echo "ERROR: TEAM RKMS SOURCE NOT FOUND"
            echo "============================================================"

            echo "Required markers:"
            echo "team_rkms"
            echo "A94473"
            echo "Team RKMS UUID"
            echo "teamRkmsAvatar"
            echo "isTeamRKMSProfile"
            echo "SUPER_ADMIN"

            exit 1
          fi

          echo ""
          echo "============================================================"
          echo "SELECTED RKMS ZIP"
          echo "============================================================"
          echo "$SELECTED_ZIP"
          echo "============================================================"

          rm -rf .rkms_extract
          mkdir -p .rkms_extract

          unzip -q \
            "$SELECTED_ZIP" \
            -d .rkms_extract

          PACKAGE_JSON="$(
            find .rkms_extract \
              -type f \
              -name 'package.json' \
              -print \
              | head -1
          )"

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json not found."
            exit 1
          fi

          SOURCE_DIR="$(
            dirname "$PACKAGE_JSON"
          )"

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

          echo "SOURCE_DIR=$SOURCE_DIR"


      # ============================================================
      # 3. VERIFY SOURCE
      # ============================================================

      - name: Verify RKMS source
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          test -f package.json
          test -f app.js
          test -f index.html
          test -f styles.css
          test -f capacitor.config.json
          test -f google-services.json

          test -f assets/rkms-logo-transparent.png

          test -f scripts/configure-android-16.sh
          test -f scripts/setup-android-native.sh

          echo "package.json: PASS"
          echo "app.js: PASS"
          echo "index.html: PASS"
          echo "styles.css: PASS"
          echo "capacitor.config.json: PASS"
          echo "google-services.json: PASS"
          echo "RKMS logo: PASS"
          echo "Android scripts: PASS"


      # ============================================================
      # 4. TEAM RKMS AUDIT
      # ============================================================

      - name: Audit Team RKMS Super Admin Chat
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          grep -Fq "team_rkms" app.js

          grep -Fq "A94473" app.js

          grep -Fq \
            "b909411c-591d-4a57-9d8d-280842901331" \
            app.js

          grep -Fq "teamRkmsAvatar" app.js

          grep -Fq "isTeamRKMSProfile" app.js

          grep -Fq "SUPER_ADMIN" app.js

          test -s \
            assets/rkms-logo-transparent.png

          echo "============================================================"
          echo "TEAM RKMS AUDIT: PASS"
          echo "============================================================"


      # ============================================================
      # 5. NODE 22
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      # ============================================================
      # 6. JDK 17
      # ============================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 7. JAVASCRIPT CHECK
      # ============================================================

      - name: Verify JavaScript
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          node --version
          npm --version

          node --check app.js

          echo "JavaScript syntax: PASS"


      # ============================================================
      # 8. NPM INSTALL
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

          echo "NPM install: PASS"


      # ============================================================
      # 9. STATIC RKMS VERIFICATION
      # ============================================================

      - name: Run RKMS static verification
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 scripts/verify-rkms-final.py
          python3 scripts/verify-member-directory-scope.py
          python3 scripts/verify-authority-hierarchy.py
          python3 scripts/verify-fcm-pipeline.py
          python3 scripts/verify-final-login-navigation.py
          python3 scripts/verify-saved-login.py
          python3 scripts/verify-native-bridge.py

          echo "============================================================"
          echo "RKMS STATIC VERIFICATION: PASS"
          echo "============================================================"


      # ============================================================
      # 10. WEB BUILD
      # ============================================================

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          npm run build

          test -f dist/index.html
          test -f dist/app.js
          test -f dist/assets/rkms-logo-transparent.png

          echo "Web build: PASS"


      # ============================================================
      # 11. ANDROID SDK
      #
      # NO android-actions/setup-android@v3
      # ============================================================

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="$ANDROID_HOME"

          test -d "$SDK"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          echo "$SDK/cmdline-tools/latest/bin" \
            >> "$GITHUB_PATH"

          echo "$SDK/platform-tools" \
            >> "$GITHUB_PATH"

          echo "$SDK/build-tools/36.0.0" \
            >> "$GITHUB_PATH"

          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$SDK/build-tools/36.0.0:$PATH"

          echo "SDK Manager version:"
          "$SDKMANAGER" --version

          yes | \
            "$SDKMANAGER" \
            --licenses \
            >/dev/null 2>&1 \
            || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          test -d \
            "$SDK/platforms/android-36"

          test -d \
            "$SDK/build-tools/36.0.0"

          echo "============================================================"
          echo "ANDROID SDK API 36: PASS"
          echo "BUILD TOOLS 36.0.0: PASS"
          echo "============================================================"


      # ============================================================
      # 12. GENERATE CAPACITOR ANDROID
      # ============================================================

      - name: Generate Capacitor Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          rm -rf android

          npx cap add android

          test -f android/app/build.gradle
          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml

          echo "Capacitor Android generation: PASS"


      # ============================================================
      # 13. CONFIGURE ANDROID 16
      # ============================================================

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          chmod +x scripts/configure-android-16.sh

          ./scripts/configure-android-16.sh

          test -f android/variables.gradle

          echo "Android 16 configuration: PASS"


      # ============================================================
      # 14. ANDROID 16 VERIFICATION
      #
      # IMPORTANT:
      # This is AFTER android/variables.gradle exists.
      # ============================================================

      - name: Verify Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          test -f android/variables.gradle

          python3 scripts/verify-android-16.py

          echo "Android 16 API 36 verification: PASS"


      # ============================================================
      # 15. CAPACITOR SYNC
      # ============================================================

      - name: Sync Capacitor Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          npx cap sync android

          echo "Capacitor sync: PASS"


      # ============================================================
      # 16. RKMS NATIVE ANDROID
      # ============================================================

      - name: Configure RKMS native Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          chmod +x scripts/setup-android-native.sh

          ./scripts/setup-android-native.sh

          test -f \
            android/app/src/main/java/org/rkms/connect/MainActivity.java

          test -f \
            android/app/src/main/java/org/rkms/connect/RKMSNativeBridge.java

          test -s \
            android/app/google-services.json

          echo "MainActivity: PASS"
          echo "RKMSNativeBridge: PASS"
          echo "Firebase JSON: PASS"


      # ============================================================
      # 17. FIREBASE SDK CONFIGURATION
      #
      # Fixes:
      # FirebaseApp cannot be found during Java compilation.
      # Existing Google Services/Firebase versions are preserved.
      # ============================================================

      - name: Configure Firebase SDK dependency
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          ROOT_GRADLE="android/build.gradle"
          APP_GRADLE="android/app/build.gradle"

          test -f "$ROOT_GRADLE"
          test -f "$APP_GRADLE"

          python3 - <<'PY'
          from pathlib import Path
          import re

          root_path = Path("android/build.gradle")
          app_path = Path("android/app/build.gradle")

          root = root_path.read_text()
          app = app_path.read_text()


          # ========================================================
          # ROOT REPOSITORIES
          # ========================================================

          if "google()" not in root:

              match = re.search(
                  r'repositories\s*\{',
                  root
              )

              if match:

                  pos = match.end()

                  root = (
                      root[:pos]
                      + "\n        google()"
                      + root[pos:]
                  )


          if "mavenCentral()" not in root:

              match = re.search(
                  r'repositories\s*\{',
                  root
              )

              if match:

                  pos = match.end()

                  root = (
                      root[:pos]
                      + "\n        mavenCentral()"
                      + root[pos:]
                  )


          # ========================================================
          # GOOGLE SERVICES CLASSPATH
          # ========================================================

          if "com.google.gms:google-services:" not in root:

              match = re.search(
                  r'dependencies\s*\{',
                  root
              )

              if not match:

                  raise SystemExit(
                      "ERROR: root dependencies block not found"
                  )

              pos = match.end()

              root = (
                  root[:pos]
                  + '\n'
                  + '        classpath '
                    '"com.google.gms:google-services:4.4.3"'
                  + root[pos:]
              )


          # ========================================================
          # GOOGLE SERVICES APP PLUGIN
          # ========================================================

          if "com.google.gms.google-services" not in app:

              plugins = re.search(
                  r'plugins\s*\{',
                  app
              )

              if plugins:

                  pos = plugins.end()

                  app = (
                      app[:pos]
                      + '\n'
                      + '    id "com.google.gms.google-services"'
                      + app[pos:]
                  )

              else:

                  app = (
                      'apply plugin: "com.google.gms.google-services"\n'
                      + app
                  )


          # ========================================================
          # APP DEPENDENCIES BLOCK
          # ========================================================

          dep_match = re.search(
              r'dependencies\s*\{',
              app
          )

          if not dep_match:

              app += """

          dependencies {
          }
          """

              dep_match = re.search(
                  r'dependencies\s*\{',
                  app
              )


          # ========================================================
          # FIREBASE BOM
          # ========================================================

          if "com.google.firebase:firebase-bom:" not in app:

              pos = dep_match.end()

              app = (
                  app[:pos]
                  + """
              implementation platform(
                  "com.google.firebase:firebase-bom:34.4.0"
              )
          """
                  + app[pos:]
              )


          # ========================================================
          # FIREBASE MESSAGING
          #
          # This supplies FirebaseApp/Firebase common classes.
          # ========================================================

          if "com.google.firebase:firebase-messaging" not in app:

              dep_match = re.search(
                  r'dependencies\s*\{',
                  app
              )

              pos = dep_match.end()

              app = (
                  app[:pos]
                  + """
              implementation "com.google.firebase:firebase-messaging"
          """
                  + app[pos:]
              )


          # ========================================================
          # REMOVE DUPLICATE FIREBASE MESSAGING LINES
          # ========================================================

          lines = app.splitlines()

          seen = False
          output = []

          for line in lines:

              if "com.google.firebase:firebase-messaging" in line:

                  if seen:
                      continue

                  seen = True

              output.append(line)


          app = "\n".join(output) + "\n"


          root_path.write_text(root)
          app_path.write_text(app)


          print("Firebase Gradle configuration written.")
          PY


          # ========================================================
          # ROBUST VERIFICATION
          # ========================================================

          grep -Eq \
            'com\.google\.gms:google-services:[0-9.]+' \
            android/build.gradle

          grep -Eq \
            'com\.google\.gms\.google-services' \
            android/app/build.gradle

          grep -Eq \
            'com\.google\.firebase:firebase-bom:[0-9.]+' \
            android/app/build.gradle

          grep -Eq \
            'com\.google\.firebase:firebase-messaging' \
            android/app/build.gradle

          test -s \
            android/app/google-services.json

          echo "Google Services classpath: PASS"
          echo "Google Services plugin: PASS"
          echo "Firebase BOM: PASS"
          echo "Firebase Messaging: PASS"
          echo "Firebase JSON: PASS"


      # ============================================================
      # 18. FIREBASE PACKAGE VERIFICATION
      # ============================================================

      - name: Verify Firebase package
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 - <<'PY'
          import json

          path = "android/app/google-services.json"

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          packages = []

          for client in data.get("client", []):

              package_name = (
                  client
                  .get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

              if package_name:
                  packages.append(package_name)

          print("Firebase packages:")

          for package_name in packages:
              print(" -", package_name)

          if "org.rkms.connect" not in packages:

              raise SystemExit(
                  "ERROR: org.rkms.connect Firebase client missing"
              )

          print("Firebase package: PASS")
          PY


      # ============================================================
      # 19. VERIFY MAIN ACTIVITY
      # ============================================================

      - name: Verify Firebase MainActivity
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          MAIN="android/app/src/main/java/org/rkms/connect/MainActivity.java"

          test -f "$MAIN"

          grep -Fq \
            "import com.google.firebase.FirebaseApp;" \
            "$MAIN"

          grep -Fq \
            "FirebaseApp.initializeApp(this)" \
            "$MAIN"

          grep -Fq \
            "super.onCreate(savedInstanceState);" \
            "$MAIN"

          grep -Fq \
            "RKMSNativeBridge(this, getBridge().getWebView())" \
            "$MAIN"

          COUNT="$(
            grep -F \
              -o \
              "FirebaseApp.initializeApp(this)" \
              "$MAIN" \
              | wc -l
          )"

          if [ "$COUNT" -ne 1 ]; then

            echo "ERROR: Firebase initialization count = $COUNT"

            exit 1

          fi

          echo "Firebase import: PASS"
          echo "Firebase initialization: PASS"
          echo "MainActivity: PASS"


      # ============================================================
      # 20. NATIVE BRIDGE
      # ============================================================

      - name: Verify RKMS native bridge
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          BRIDGE="android/app/src/main/java/org/rkms/connect/RKMSNativeBridge.java"

          test -f "$BRIDGE"

          if [ -f scripts/verify-native-bridge.py ]; then
            python3 scripts/verify-native-bridge.py
          fi

          grep -Fq "saveSession" "$BRIDGE"

          echo "RKMS native bridge: PASS"


      # ============================================================
      # 21. SAVED LOGIN
      # ============================================================

      - name: Verify saved login
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-saved-login.py ]; then
            python3 scripts/verify-saved-login.py
          fi

          echo "Saved login: PASS"


      # ============================================================
      # 22. FCM
      # ============================================================

      - name: Verify FCM pipeline
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-fcm-pipeline.py ]; then
            python3 scripts/verify-fcm-pipeline.py
          fi

          echo "FCM pipeline: PASS"


      # ============================================================
      # 23. FINAL RKMS RULES
      # ============================================================

      - name: Verify final RKMS rules
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-rkms-final.py ]; then
            python3 scripts/verify-rkms-final.py
          fi

          echo "Final RKMS rules: PASS"


      # ============================================================
      # 24. LOGIN NAVIGATION
      # ============================================================

      - name: Verify login navigation
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-final-login-navigation.py ]; then
            python3 scripts/verify-final-login-navigation.py
          fi

          echo "Login navigation: PASS"


      # ============================================================
      # 25. AUTHORITY
      # ============================================================

      - name: Verify authority hierarchy
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-authority-hierarchy.py ]; then
            python3 scripts/verify-authority-hierarchy.py
          fi

          echo "Authority hierarchy: PASS"


      # ============================================================
      # 26. DIRECTORY
      # ============================================================

      - name: Verify directory
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-directory-lists.py ]; then
            python3 scripts/verify-directory-lists.py
          fi

          if [ -f scripts/verify-member-directory-scope.py ]; then
            python3 scripts/verify-member-directory-scope.py
          fi

          if [ -f scripts/verify-directory-contact-actions.py ]; then
            python3 scripts/verify-directory-contact-actions.py
          fi

          if [ -f scripts/verify-v17-directory-deep.py ]; then
            python3 scripts/verify-v17-directory-deep.py
          fi

          echo "Directory verification: PASS"


      # ============================================================
      # 27. PROFILE
      # ============================================================

      - name: Verify profile update
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-profile-update-final.py ]; then
            python3 scripts/verify-profile-update-final.py
          fi

          echo "Profile verification: PASS"


      # ============================================================
      # 28. PDF / REPORT
      # ============================================================

      - name: Verify PDF and report pipeline
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-pdf-pipeline.py ]; then
            python3 scripts/verify-pdf-pipeline.py
          fi

          if [ -f scripts/verify-report-download-scope.py ]; then
            python3 scripts/verify-report-download-scope.py
          fi

          echo "PDF/report verification: PASS"


      # ============================================================
      # 29. COMPLAINT
      # ============================================================

      - name: Verify complaint implementation
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          grep -Fq \
            "memberCloseComplaint" \
            app.js

          grep -Fq \
            "memberReopenComplaint" \
            app.js

          grep -Fq \
            "officerCloseComplaint" \
            app.js

          grep -Fq \
            "rkms_officer_close_complaint" \
            app.js

          echo "Complaint implementation: PASS"


      # ============================================================
      # 30. SIGNING SECRETS
      # ============================================================

      - name: Verify release signing secrets
        shell: bash
        run: |
          set -euo pipefail

          test -n \
            "${RKMS_KEYSTORE_BASE64:-}"

          test -n \
            "${RKMS_KEYSTORE_PASSWORD:-}"

          test -n \
            "${RKMS_KEY_ALIAS:-}"

          test -n \
            "${RKMS_KEY_PASSWORD:-}"

          echo "Release signing secrets: PASS"


      # ============================================================
      # 31. PREPARE KEYSTORE
      # ============================================================

      - name: Prepare release keystore
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          echo "$RKMS_KEYSTORE_BASE64" \
            | base64 --decode \
            > rkms-release.keystore

          test -s \
            rkms-release.keystore

          echo "Release keystore: PASS"


      # ============================================================
      # 32. CONFIGURE RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "android/app/build.gradle"
          )

          text = path.read_text()


          # ========================================================
          # signingConfigs
          # ========================================================

          if "rkms-release.keystore" not in text:

              android_match = re.search(
                  r'\bandroid\s*\{',
                  text
              )

              if not android_match:
                  raise SystemExit(
                      "ERROR: android block not found"
                  )

              pos = android_match.end()

              signing = """
          
              signingConfigs {
                  release {
                      storeFile file("../../rkms-release.keystore")
                      storePassword System.getenv("RKMS_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("RKMS_KEY_ALIAS")
                      keyPassword System.getenv("RKMS_KEY_PASSWORD")
                  }
              }

          """

              text = (
                  text[:pos]
                  + signing
                  + text[pos:]
              )


          # ========================================================
          # release signing config
          # ========================================================

          if "signingConfig signingConfigs.release" not in text:

              match = re.search(
                  r'buildTypes\s*\{\s*release\s*\{',
                  text,
                  re.S
              )

              if not match:
                  raise SystemExit(
                      "ERROR: release build type not found"
                  )

              old = match.group(0)

              new = (
                  old
                  + "\n"
                  + "            signingConfig signingConfigs.release"
              )

              text = text.replace(
                  old,
                  new,
                  1
              )


          path.write_text(text)

          print(
              "Release signing configured."
          )
          PY


          grep -Fq \
            "rkms-release.keystore" \
            android/app/build.gradle

          grep -Fq \
            "signingConfig signingConfigs.release" \
            android/app/build.gradle

          echo "Release signing configuration: PASS"


      # ============================================================
      # 33. FINAL ANDROID SDK VALUES
      # ============================================================

      - name: Verify final Android SDK values
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "android/variables.gradle"
          )

          text = path.read_text()


          def get_value(name):

              match = re.search(
                  rf'\b{name}\s*=\s*(\d+)',
                  text
              )

              if not match:
                  return None

              return int(
                  match.group(1)
              )


          compile_sdk = get_value(
              "compileSdkVersion"
          )

          target_sdk = get_value(
              "targetSdkVersion"
          )

          min_sdk = get_value(
              "minSdkVersion"
          )


          print(
              "compileSdkVersion:",
              compile_sdk
          )

          print(
              "targetSdkVersion:",
              target_sdk
          )

          print(
              "minSdkVersion:",
              min_sdk
          )


          if compile_sdk != 36:
              raise SystemExit(
                  "ERROR: compileSdkVersion != 36"
              )

          if target_sdk != 36:
              raise SystemExit(
                  "ERROR: targetSdkVersion != 36"
              )

          if min_sdk is not None and min_sdk < 23:
              raise SystemExit(
                  "ERROR: minSdkVersion < 23"
              )

          print(
              "Android SDK values: PASS"
          )
          PY


      # ============================================================
      # 34. GRADLE VERSION
      # ============================================================

      - name: Verify Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR/android"

          chmod +x gradlew

          ./gradlew --version

          echo "Gradle wrapper: PASS"


      # ============================================================
      # 35. GRADLE CLEAN
      # ============================================================

      - name: Gradle clean
        working-directory: ${{ env.SOURCE_DIR }}/android
        run: |
          set -euo pipefail

          ./gradlew \
            clean \
            --no-daemon


      # ============================================================
      # 36. BUILD SIGNED APK + AAB
      # ============================================================

      - name: Build signed APK and AAB
        working-directory: ${{ env.SOURCE_DIR }}/android
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "RKMS REAL ANDROID BUILD"
          echo "============================================================"

          ./gradlew \
            assembleRelease \
            bundleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "============================================================"
          echo "GRADLE APK + AAB BUILD: PASS"
          echo "============================================================"


      # ============================================================
      # 37. VERIFY APK
      # ============================================================

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          APK="android/app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"

          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"

          test -x "$APKSIGNER"

          "$APKSIGNER" \
            verify \
            --verbose \
            "$APK"

          echo ""
          echo "============================================================"
          echo "APK SIGNATURE: PASS"
          echo "============================================================"

          ls -lh "$APK"


      # ============================================================
      # 38. VERIFY AAB
      # ============================================================

      - name: Verify signed AAB
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          test -s "$AAB"

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB"

          echo ""
          echo "============================================================"
          echo "AAB SIGNATURE: PASS"
          echo "============================================================"

          ls -lh "$AAB"


      # ============================================================
      # 39. PREPARE FINAL RELEASE FILES
      # ============================================================

      - name: Prepare final release files
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          rm -rf release

          mkdir -p release


          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk


          cp \
            android/app/build/outputs/bundle/release/app-release.aab \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab


          sha256sum \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk \
            > release/RKMS_APK_SHA256.txt


          sha256sum \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab \
            > release/RKMS_AAB_SHA256.txt


          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab


          echo ""
          echo "APK:"
          ls -lh \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          echo ""
          echo "AAB:"
          ls -lh \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab

          echo ""
          echo "APK SHA256:"
          cat release/RKMS_APK_SHA256.txt

          echo ""
          echo "AAB SHA256:"
          cat release/RKMS_AAB_SHA256.txt


      # ============================================================
      # 40. FINAL RELEASE VERIFICATION
      # ============================================================

      - name: Final release verification
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          APK="release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"
          AAB="release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab"


          test -s "$APK"
          test -s "$AAB"


          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"


          jarsigner \
            -verify \
            "$AAB"


          echo ""
          echo "============================================================"
          echo "FINAL RELEASE VERIFICATION: PASS"
          echo "============================================================"

          echo "APK: PASS"
          echo "AAB: PASS"
          echo "APK signature: PASS"
          echo "AAB signature: PASS"


      # ============================================================
      # 41. UPLOAD FINAL APK + AAB
      # ============================================================

      - name: Upload final APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Android-16-API36-FINAL-APK-AAB

          path: |
            ${{ env.SOURCE_DIR }}/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            ${{ env.SOURCE_DIR }}/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab
            ${{ env.SOURCE_DIR }}/release/RKMS_APK_SHA256.txt
            ${{ env.SOURCE_DIR }}/release/RKMS_AAB_SHA256.txt

          if-no-files-found: error

          retention-days: 90



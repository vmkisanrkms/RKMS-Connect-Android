name: RKMS Connect - Android 16 API 36 - Final Audited Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rkms-android-final-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  APP_ID: "org.rkms.connect"

jobs:
  audit-and-build:
    name: RKMS Final Audit + Android 16/API 36 APK AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. NODE.JS 22
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm


      # ============================================================
      # 3. JAVA 17
      # ============================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle


      # ============================================================
      # 4. ANDROID SDK / API 36
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 API 36 SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}" \
            "cmdline-tools;latest"


      # ============================================================
      # 5. REQUIRED SOURCE FILE AUDIT
      # ============================================================

      - name: Verify RKMS source structure
        shell: bash
        run: |
          set -euo pipefail

          required=(
            "package.json"
            "package-lock.json"
            "index.html"
            "app.js"
            "styles.css"
            "config.js"
            "capacitor.config.json"
            "google-services.json"
            "scripts/setup-android-native.sh"
            "scripts/configure-android-16.sh"
            "scripts/verify-android-16.py"
          )

          for file in "${required[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing required source file: $file"
              exit 1
            fi
          done

          node - <<'NODE'
          const fs = require("fs");

          const p = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          if (p.name !== "rkms") {
            throw new Error("package.json name must be rkms");
          }

          if (p.dependencies?.["@capacitor/core"] !== "6.2.2") {
            throw new Error("Capacitor core must be 6.2.2");
          }

          if (p.dependencies?.["@capacitor/android"] !== "6.2.2") {
            throw new Error("Capacitor Android must be 6.2.2");
          }

          if (p.devDependencies?.["@capacitor/cli"] !== "6.2.2") {
            throw new Error("Capacitor CLI must be 6.2.2");
          }

          console.log("Package manifest: PASS");
          NODE

          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(
              Path("capacitor.config.json").read_text()
          )

          if config.get("appId") != "org.rkms.connect":
              raise SystemExit(
                  "ERROR: Capacitor appId mismatch"
              )

          if config.get("webDir") != "dist":
              raise SystemExit(
                  "ERROR: Capacitor webDir must be dist"
              )

          firebase = json.loads(
              Path("google-services.json").read_text()
          )

          packages = []

          for client in firebase.get("client", []):
              packages.append(
                  client
                  .get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

          if "org.rkms.connect" not in packages:
              raise SystemExit(
                  "ERROR: org.rkms.connect missing from google-services.json"
              )

          print("Capacitor configuration: PASS")
          print("Firebase package: PASS")
          PY


      # ============================================================
      # 6. JAVASCRIPT SYNTAX
      # ============================================================

      - name: Verify JavaScript
        shell: bash
        run: |
          set -euo pipefail

          node --check app.js

          echo "app.js syntax: PASS"


      # ============================================================
      # 7. PDA PASSWORD AUDIT
      # ============================================================

      - name: Audit PDA password protection
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking PDA removal password..."

          grep -F \
            'rkmsRequireManagementPassword("पद से हटाने")' \
            app.js >/dev/null

          echo "PDA removal password: PASS"


          echo "Checking password parameter..."

          grep -F \
            'p_password:password' \
            app.js >/dev/null

          echo "PDA password RPC parameter: PASS"


          echo "Checking appointment/reappointment password..."

          grep -F \
            'rkmsRequireManagementPassword(form.dataset.reappointOfficer?"पद परिवर्तन":"नियुक्ति")' \
            app.js >/dev/null

          echo "PDA appointment/reappointment password: PASS"


          echo "Checking Super Admin PDA RPCs..."

          grep -F \
            'rkms_super_admin_appoint_officer' \
            app.js >/dev/null

          grep -F \
            'rkms_super_admin_reappoint_officer' \
            app.js >/dev/null

          echo "Super Admin PDA RPC references: PASS"


      # ============================================================
      # 8. SUPER ADMIN CHAT RESTRICTION
      # ============================================================

      - name: Audit Super Admin Chat restriction
        shell: bash
        run: |
          set -euo pipefail

          grep -F \
            'if(state.role==="super_admin") return adminScreen();' \
            app.js >/dev/null

          echo "Super Admin Chat route guard: PASS"


      # ============================================================
      # 9. WHATSAPP STYLE CHAT AUDIT
      # ============================================================

      - name: Audit WhatsApp style Chat
        shell: bash
        run: |
          set -euo pipefail

          components=(
            "wa-chat-screen"
            "wa-chat-list-head"
            "wa-chat-search"
            "wa-filters"
            "wa-chat-row"
            "wa-conv-head"
            "wa-messages"
            "wa-compose"
          )

          for token in "${components[@]}"; do

            if ! grep -F "$token" app.js >/dev/null; then
              echo "ERROR: Missing Chat component: $token"
              exit 1
            fi

          done

          echo "WhatsApp-style Chat structure: PASS"


      # ============================================================
      # 10. CHAT HEADER / FOOTER AUDIT
      # ============================================================

      - name: Audit Chat header and footer layout
        shell: bash
        run: |
          set -euo pipefail

          if grep -Eq \
            '\.wa-chat-screen[^}]*position:[[:space:]]*fixed' \
            styles.css; then

            echo "ERROR: Chat screen still uses fixed full-screen overlay"
            exit 1

          fi

          if grep -Eq \
            '\.wa-conversation-screen[^}]*position:[[:space:]]*fixed' \
            styles.css; then

            echo "ERROR: Conversation screen still uses fixed full-screen overlay"
            exit 1

          fi

          grep -F \
            'rkms-bottom-nav' \
            styles.css >/dev/null

          echo "Chat header/footer-safe layout: PASS"


      # ============================================================
      # 11. INSTALL LOCKED DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          npm ci


      # ============================================================
      # 12. RUN RKMS VERIFICATION SCRIPTS
      # ============================================================

      - name: Run RKMS verification suite
        shell: bash
        run: |
          set -euo pipefail

          run_py() {
            local file="$1"

            if [ -f "$file" ]; then

              echo ""
              echo "================================================"
              echo "VERIFY: $file"
              echo "================================================"

              python3 "$file"

            fi
          }

          run_py scripts/verify-rkms-final.py
          run_py scripts/verify-authority-hierarchy.py
          run_py scripts/verify-directory-lists.py
          run_py scripts/verify-directory-contact-actions.py
          run_py scripts/verify-member-directory-scope.py
          run_py scripts/verify-v17-directory-deep.py
          run_py scripts/verify-content-management-final.py
          run_py scripts/verify-complaint-final.py
          run_py scripts/verify-profile-update-final.py
          run_py scripts/verify-saved-login.py
          run_py scripts/verify-fcm-pipeline.py
          run_py scripts/verify-final-login-navigation.py
          run_py scripts/verify-native-bridge.py
          run_py scripts/verify-report-download-scope.py
          run_py scripts/verify-android-pdf.py
          run_py scripts/verify-pdf-pipeline.py

          echo ""
          echo "RKMS verification suite: PASS"


      # ============================================================
      # 13. BUILD WEB
      # ============================================================

      - name: Build web assets
        run: |
          npm run build


      # ============================================================
      # 14. VERIFY WEB BUILD
      # ============================================================

      - name: Verify web build
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/index.html
          test -f dist/app.js
          test -f dist/styles.css
          test -f dist/config.js

          node --check dist/app.js

          echo "dist build: PASS"


      # ============================================================
      # 15. CLEAN CAPACITOR ANDROID PROJECT
      # ============================================================

      - name: Generate clean Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android

          npx cap add android

          npx cap sync android


      # ============================================================
      # 16. RKMS NATIVE CONFIGURATION
      # ============================================================

      - name: Apply RKMS native configuration
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/setup-android-native.sh

          scripts/setup-android-native.sh


      # ============================================================
      # 17. ANDROID 16 CONFIGURATION
      # ============================================================

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/configure-android-16.sh

          scripts/configure-android-16.sh


      # ============================================================
      # 18. ANDROID NATIVE AUDIT
      # ============================================================

      - name: Audit Android native project
        shell: bash
        run: |
          set -euo pipefail

          required_android=(
            "android/app/google-services.json"
            "android/app/src/main/AndroidManifest.xml"
            "android/app/src/main/java/org/rkms/connect/MainActivity.java"
            "android/app/src/main/java/org/rkms/connect/RKMSSecureCredentialsPlugin.java"
            "android/app/src/main/java/org/rkms/connect/RKMSNativeBridge.java"
          )

          for file in "${required_android[@]}"; do

            if [ ! -f "$file" ]; then
              echo "ERROR: Missing Android file: $file"
              exit 1
            fi

          done

          python3 scripts/verify-android-16.py

          grep -F \
            'com.google.gms.google-services' \
            android/app/build.gradle >/dev/null

          grep -F \
            'com.google.gms:google-services:4.4.3' \
            android/build.gradle >/dev/null

          grep -F \
            'com.google.firebase.FirebaseApp.initializeApp(this)' \
            android/app/src/main/java/org/rkms/connect/MainActivity.java >/dev/null

          grep -F \
            'registerPlugin(RKMSSecureCredentialsPlugin.class)' \
            android/app/src/main/java/org/rkms/connect/MainActivity.java >/dev/null

          echo "Android 16 configuration: PASS"
          echo "Firebase initialization: PASS"
          echo "Native bridge: PASS"


      # ============================================================
      # 19. GRADLE CHECK
      # ============================================================

      - name: Verify Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd android

          chmod +x gradlew

          ./gradlew --version

          ./gradlew \
            :app:dependencies \
            --configuration debugRuntimeClasspath \
            >/dev/null

          echo "Gradle dependency resolution: PASS"


      # ============================================================
      # 20. DEBUG APK
      # ============================================================

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd android

          ./gradlew \
            clean \
            assembleDebug \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 21. RELEASE APK + AAB
      # ============================================================

      - name: Build release APK and AAB
        shell: bash
        run: |
          set -euo pipefail

          cd android

          ./gradlew \
            assembleRelease \
            bundleRelease \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 22. OPTIONAL SIGNING
      #
      # IMPORTANT:
      # GitHub secrets are NOT used directly inside an if expression.
      # They are supplied through env and checked by bash.
      # This fixes:
      # "Unrecognized named-value: 'secrets'"
      # ============================================================

      - name: Prepare release keystore
        id: keystore
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${RKMS_KEYSTORE_BASE64}" ] || \
             [ -z "${RKMS_KEYSTORE_PASSWORD}" ] || \
             [ -z "${RKMS_KEY_ALIAS}" ] || \
             [ -z "${RKMS_KEY_PASSWORD}" ]; then

            echo "Signing secrets are not configured."
            echo "Unsigned release APK/AAB will be produced."

            echo "signing_available=false" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          echo "${RKMS_KEYSTORE_BASE64}" \
            | base64 --decode \
            > "$RUNNER_TEMP/rkms-release.jks"

          test -s \
            "$RUNNER_TEMP/rkms-release.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/rkms-release.jks" \
            -storepass "${RKMS_KEYSTORE_PASSWORD}" \
            -alias "${RKMS_KEY_ALIAS}" \
            >/dev/null

          echo "signing_available=true" >> "$GITHUB_OUTPUT"

          echo "Release keystore: PASS"


      # ============================================================
      # 23. SIGN RELEASE APK + AAB
      # ============================================================

      - name: Sign release APK and AAB
        if: ${{ steps.keystore.outputs.signing_available == 'true' }}
        shell: bash
        env:
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"

          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          KS="$RUNNER_TEMP/rkms-release.jks"

          test -f "$APK"
          test -f "$AAB"
          test -f "$KS"


          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign" \
            -f 4 \
            "$APK" \
            "$RUNNER_TEMP/rkms-release-aligned.apk"


          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" sign \
            --ks "$KS" \
            --ks-pass "pass:${RKMS_KEYSTORE_PASSWORD}" \
            --ks-key-alias "${RKMS_KEY_ALIAS}" \
            --key-pass "pass:${RKMS_KEY_PASSWORD}" \
            --out "$RUNNER_TEMP/rkms-release-signed.apk" \
            "$RUNNER_TEMP/rkms-release-aligned.apk"


          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" verify \
            --verbose \
            "$RUNNER_TEMP/rkms-release-signed.apk"


          jarsigner \
            -keystore "$KS" \
            -storepass "${RKMS_KEYSTORE_PASSWORD}" \
            -keypass "${RKMS_KEY_PASSWORD}" \
            -signedjar "$RUNNER_TEMP/rkms-release-signed.aab" \
            "$AAB" \
            "${RKMS_KEY_ALIAS}"


          cp \
            "$RUNNER_TEMP/rkms-release-signed.apk" \
            android/app/build/outputs/apk/release/RKMS-Connect-release-signed.apk


          cp \
            "$RUNNER_TEMP/rkms-release-signed.aab" \
            android/app/build/outputs/bundle/release/RKMS-Connect-release-signed.aab


          echo "Signed APK: PASS"
          echo "Signed AAB: PASS"


      # ============================================================
      # 24. FINAL APK/AAB AUDIT
      # ============================================================

      - name: Final APK and AAB audit
        shell: bash
        run: |
          set -euo pipefail

          DEBUG_APK="android/app/build/outputs/apk/debug/app-debug.apk"

          RELEASE_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"

          RELEASE_AAB="android/app/build/outputs/bundle/release/app-release.aab"


          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          test -s "$RELEASE_AAB"


          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt2" \
            dump badging \
            "$DEBUG_APK" \
            | grep -F \
            "package: name='${APP_ID}'"


          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt2" \
            dump badging \
            "$RELEASE_APK" \
            | grep -F \
            "package: name='${APP_ID}'"


          if [ -f \
            android/app/build/outputs/apk/release/RKMS-Connect-release-signed.apk
          ]; then

            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt2" \
              dump badging \
              android/app/build/outputs/apk/release/RKMS-Connect-release-signed.apk \
              | grep -F \
              "package: name='${APP_ID}'"

          fi


          echo "Final APK/AAB audit: PASS"


      # ============================================================
      # 25. COLLECT FINAL ARTIFACTS
      # ============================================================

      - name: Collect final artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release


          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            release/RKMS-Connect-debug-API36.apk


          cp \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            release/RKMS-Connect-release-unsigned-API36.apk


          cp \
            android/app/build/outputs/bundle/release/app-release.aab \
            release/RKMS-Connect-release-unsigned-API36.aab


          if [ -f \
            android/app/build/outputs/apk/release/RKMS-Connect-release-signed.apk
          ]; then

            cp \
              android/app/build/outputs/apk/release/RKMS-Connect-release-signed.apk \
              release/RKMS-Connect-release-signed-API36.apk

          fi


          if [ -f \
            android/app/build/outputs/bundle/release/RKMS-Connect-release-signed.aab
          ]; then

            cp \
              android/app/build/outputs/bundle/release/RKMS-Connect-release-signed.aab \
              release/RKMS-Connect-release-signed-API36.aab

          fi


          sha256sum \
            release/* \
            | tee release/SHA256SUMS.txt


          echo ""
          echo "=============================================="
          echo "RKMS FINAL BUILD FILES"
          echo "=============================================="

          ls -lh release/


      # ============================================================
      # 26. UPLOAD APK / AAB
      # ============================================================

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-Android16-API36-${{ github.run_number }}
          path: release/
          if-no-files-found: error
          retention-days: 14

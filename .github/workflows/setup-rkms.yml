name: Build RKMS Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rkms-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build RKMS Release APK
    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "Android project found at repository root."
          else
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -name 'RKMS_Connect_*.zip' \
              -print -quit)"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Android project ZIP not found."
              exit 1
            fi

            echo "RKMS Android ZIP found:"
            echo "$ZIP_FILE"

            TMP_DIR="$RUNNER_TEMP/rkms-project"
            rm -rf "$TMP_DIR"
            mkdir -p "$TMP_DIR"

            unzip -q "$ZIP_FILE" -d "$TMP_DIR"

            PROJECT_DIR="$(
              find "$TMP_DIR" \
                -type f \
                \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
                -print -quit \
                | xargs -r dirname
            )"

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: Android project not found inside ZIP."
              exit 1
            fi

            rsync -a \
              --exclude='.github/' \
              "$PROJECT_DIR/" \
              "$GITHUB_WORKSPACE/"

            echo "Android project extracted successfully."
          fi


      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -d app
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Android project structure: PASS"


      - name: Verify RKMS source
        shell: bash
        run: |
          set -euo pipefail

          WWW="app/src/main/assets/www"
          BOOK_DIR="$WWW/assets/book"

          test -f "$WWW/index.html"
          test -f "$WWW/app.js"
          test -f "$WWW/config.js"
          test -f "$WWW/styles.css"

          test -f "$BOOK_DIR/cover.jpg"

          for i in $(seq -w 1 60); do
            test -f "$BOOK_DIR/page-$i.jpg"
          done

          node --check "$WWW/app.js"

          if grep -RInE \
            'SUPABASE_SERVICE_ROLE_KEY|service_role|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY' \
            app/src/main/assets \
            app/src/main/java \
            app/src/main/res \
            2>/dev/null; then
            echo "ERROR: Possible private credential found."
            exit 1
          fi

          grep -Fq 'id="bookFirst"' "$WWW/app.js"
          grep -Fq 'id="bookPrev"' "$WWW/app.js"
          grep -Fq 'id="bookNext"' "$WWW/app.js"
          grep -Fq 'id="bookLast"' "$WWW/app.js"
          grep -Fq 'id="bookDownloadPage"' "$WWW/app.js"

          grep -Fq 'pointerdown' "$WWW/app.js"
          grep -Fq 'pointermove' "$WWW/app.js"
          grep -Fq 'pointerup' "$WWW/app.js"

          grep -Fq 'startDist' "$WWW/app.js"
          grep -Fq 'startScale' "$WWW/app.js"
          grep -Fq 'zoom.scale' "$WWW/app.js"
          grep -Fq 'zoom.x' "$WWW/app.js"
          grep -Fq 'zoom.y' "$WWW/app.js"
          grep -Fq 'clampPan' "$WWW/app.js"
          grep -Fq 'translate3d' "$WWW/app.js"

          if grep -Eq \
            'id="(bookZoomIn|bookZoomOut|bookZoomReset|zoomIn|zoomOut|resetZoom)"' \
            "$WWW/app.js"; then
            echo "ERROR: Unwanted visible zoom button found."
            exit 1
          fi

          grep -Fq 'rkms-loading' "$WWW/app.js"
          grep -Fq '.rkms-loading' "$WWW/styles.css"
          grep -Fq 'rkms-load-pulse' "$WWW/styles.css"
          grep -Fq 'rkms-load-sweep' "$WWW/styles.css"

          echo "RKMS source validation: PASS"


      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'


      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'


      - name: Prepare release signing
        shell: bash
        run: |
          set -euo pipefail

          test -n "$RKMS_KEYSTORE_BASE64"
          test -n "$RKMS_KEY_ALIAS"
          test -n "$RKMS_KEYSTORE_PASSWORD"
          test -n "$RKMS_KEY_PASSWORD"

          KEYSTORE_PATH="$RUNNER_TEMP/rkms-release.keystore"

          echo "$RKMS_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          test -s "$KEYSTORE_PATH"

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          mkdir -p "$HOME/.gradle/init.d"

          cat > "$HOME/.gradle/init.d/rkms-signing.gradle" <<'EOF'
          gradle.projectsEvaluated {
              rootProject.subprojects.each { project ->
                  def android = project.extensions.findByName("android")

                  if (android != null) {
                      def releaseConfig = android.signingConfigs.findByName("release")

                      if (releaseConfig != null) {
                          releaseConfig.storeFile =
                              new File(System.getenv("KEYSTORE_PATH"))

                          releaseConfig.storePassword =
                              System.getenv("RKMS_KEYSTORE_PASSWORD")

                          releaseConfig.keyAlias =
                              System.getenv("RKMS_KEY_ALIAS")

                          releaseConfig.keyPassword =
                              System.getenv("RKMS_KEY_PASSWORD")
                      }
                  }
              }
          }
          EOF

          echo "Release signing prepared."


      - name: Validate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon tasks

          echo "Gradle validation: PASS"


      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon clean

          echo "Clean: PASS"


      - name: Build RKMS Release APK
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            assembleRelease

          echo "RKMS Release APK build: PASS"


      - name: Find release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -print -quit)"

          test -n "$APK"
          test -f "$APK"

          cp "$APK" "$RUNNER_TEMP/RKMS-Connect-Release.apk"

          ls -lh "$RUNNER_TEMP/RKMS-Connect-Release.apk"


      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            "$RUNNER_TEMP/RKMS-Connect-Release.apk"

          echo "APK signature verification: PASS"


      - name: Upload RKMS Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Release-APK
          path: ${{ runner.temp }}/RKMS-Connect-Release.apk
          if-no-files-found: error
          retention-days: 14


      - name: Cleanup signing files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/rkms-release.keystore"
          rm -f "$HOME/.gradle/init.d/rkms-signing.gradle"

          echo ""
          echo "Release APK build command completed."


      # ============================================================
      # 43. LOCATE APK
      # ============================================================

      - name: Locate final release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          APK="$(

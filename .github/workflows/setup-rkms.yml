name: RKMS Android 16 API 36 FINAL APK AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  android-release:

    name: RKMS Android 16 API 36 Release
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. LOCATE CORRECT RKMS SOURCE
      # ============================================================

      - name: Locate correct RKMS source
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "RKMS SOURCE SELECTION"
          echo "============================================================"

          if [ -f "package.json" ] && \
             [ -f "app.js" ] && \
             [ -f "index.html" ]; then

            echo "RKMS source found in repository root."

            echo "SOURCE_DIR=." >> "$GITHUB_ENV"

            exit 0
          fi


          echo "Searching RKMS ZIP files..."


          mapfile -t ZIP_CANDIDATES < <(
            find . \
              -type f \
              -name '*.zip' \
              ! -path './.git/*' \
              -print \
              | sort -r
          )


          if [ "${#ZIP_CANDIDATES[@]}" -eq 0 ]; then

            echo "ERROR: No ZIP file found."

            find . \
              -maxdepth 4 \
              -type f \
              -print \
              | head -200

            exit 1
          fi


          SELECTED_ZIP=""


          for ZIP_FILE in "${ZIP_CANDIDATES[@]}"; do

            echo ""
            echo "------------------------------------------------------------"
            echo "Testing:"
            echo "$ZIP_FILE"
            echo "------------------------------------------------------------"

            TEST_DIR=".rkms_test_extract"

            rm -rf "$TEST_DIR"
            mkdir -p "$TEST_DIR"


            if ! unzip -q "$ZIP_FILE" -d "$TEST_DIR"; then

              echo "ZIP extraction failed. Skipping."

              continue

            fi


            TEST_PACKAGE_JSON="$(
              find "$TEST_DIR" \
                -type f \
                -name 'package.json' \
                -print \
                | head -1
            )"


            if [ -z "$TEST_PACKAGE_JSON" ]; then

              echo "package.json not found. Skipping."

              continue

            fi


            TEST_SOURCE_DIR="$(
              dirname "$TEST_PACKAGE_JSON"
            )"


            if [ ! -f "$TEST_SOURCE_DIR/app.js" ]; then

              echo "app.js not found. Skipping."

              continue

            fi


            REQUIRED_OK=true


            grep -Fq "team_rkms" \
              "$TEST_SOURCE_DIR/app.js" \
              || REQUIRED_OK=false


            grep -Fq "A94473" \
              "$TEST_SOURCE_DIR/app.js" \
              || REQUIRED_OK=false


            grep -Fq \
              "b909411c-591d-4a57-9d8d-280842901331" \
              "$TEST_SOURCE_DIR/app.js" \
              || REQUIRED_OK=false


            grep -Fq "teamRkmsAvatar" \
              "$TEST_SOURCE_DIR/app.js" \
              || REQUIRED_OK=false


            grep -Fq "isTeamRKMSProfile" \
              "$TEST_SOURCE_DIR/app.js" \
              || REQUIRED_OK=false


            grep -Fq "SUPER_ADMIN" \
              "$TEST_SOURCE_DIR/app.js" \
              || REQUIRED_OK=false


            if [ "$REQUIRED_OK" = true ]; then

              SELECTED_ZIP="$ZIP_FILE"

              echo ""
              echo "============================================================"
              echo "CORRECT TEAM RKMS SOURCE FOUND"
              echo "============================================================"
              echo "$SELECTED_ZIP"
              echo "============================================================"

              break

            fi


            echo "Team RKMS implementation incomplete. Skipping."

          done


          rm -rf .rkms_test_extract


          if [ -z "$SELECTED_ZIP" ]; then

            echo ""
            echo "============================================================"
            echo "ERROR: CORRECT TEAM RKMS SOURCE NOT FOUND"
            echo "============================================================"

            echo ""
            echo "Required source markers:"
            echo "team_rkms"
            echo "A94473"
            echo "b909411c-591d-4a57-9d8d-280842901331"
            echo "teamRkmsAvatar"
            echo "isTeamRKMSProfile"
            echo "SUPER_ADMIN"

            exit 1

          fi


          rm -rf .rkms_extract

          mkdir -p .rkms_extract


          unzip -q \
            "$SELECTED_ZIP" \
            -d .rkms_extract


          PACKAGE_JSON="$(
            find .rkms_extract \
              -type f \
              -name 'package.json' \
              -print \
              | head -1
          )"


          if [ -z "$PACKAGE_JSON" ]; then

            echo "ERROR: package.json not found."

            exit 1

          fi


          SOURCE_DIR="$(
            dirname "$PACKAGE_JSON"
          )"


          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"


          echo ""
          echo "============================================================"
          echo "SELECTED SOURCE"
          echo "============================================================"
          echo "$SOURCE_DIR"
          echo "============================================================"


      # ============================================================
      # 3. VERIFY RKMS SOURCE
      # ============================================================

      - name: Verify RKMS source
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          test -f package.json
          test -f app.js
          test -f index.html
          test -f styles.css
          test -f capacitor.config.json
          test -f google-services.json

          test -f assets/rkms-logo-transparent.png

          test -f scripts/configure-android-16.sh
          test -f scripts/setup-android-native.sh

          echo "package.json: PASS"
          echo "app.js: PASS"
          echo "index.html: PASS"
          echo "styles.css: PASS"
          echo "capacitor.config.json: PASS"
          echo "google-services.json: PASS"
          echo "RKMS logo: PASS"
          echo "Android scripts: PASS"


      # ============================================================
      # 4. TEAM RKMS AUDIT
      # ============================================================

      - name: Audit Team RKMS Super Admin Chat
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          grep -Fq "team_rkms" app.js
          grep -Fq "A94473" app.js

          grep -Fq \
            "b909411c-591d-4a57-9d8d-280842901331" \
            app.js

          grep -Fq "teamRkmsAvatar" app.js
          grep -Fq "isTeamRKMSProfile" app.js
          grep -Fq "SUPER_ADMIN" app.js

          test -s \
            assets/rkms-logo-transparent.png

          echo ""
          echo "============================================================"
          echo "TEAM RKMS AUDIT: PASS"
          echo "============================================================"
          echo "Team identity      : PASS"
          echo "Member ID A94473   : PASS"
          echo "Team UUID          : PASS"
          echo "Logo function      : PASS"
          echo "Super Admin        : PASS"
          echo "============================================================"


      # ============================================================
      # 5. NODE 22
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      # ============================================================
      # 6. JDK 17
      # ============================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 7. JAVASCRIPT CHECK
      # ============================================================

      - name: Verify JavaScript
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          node --version
          npm --version

          node --check app.js

          echo "JavaScript syntax: PASS"


      # ============================================================
      # 8. NPM INSTALL
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          if [ -f package-lock.json ]; then

            npm ci \
              --no-audit \
              --no-fund

          else

            npm install \
              --no-audit \
              --no-fund

          fi

          echo "NPM install: PASS"


      # ============================================================
      # 9. STATIC VERIFICATION
      #
      # Android verifier intentionally NOT here.
      # ============================================================

      - name: Run RKMS static verification
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 scripts/verify-rkms-final.py

          python3 scripts/verify-member-directory-scope.py

          python3 scripts/verify-authority-hierarchy.py

          python3 scripts/verify-fcm-pipeline.py

          python3 scripts/verify-final-login-navigation.py

          python3 scripts/verify-saved-login.py

          python3 scripts/verify-native-bridge.py

          echo ""
          echo "============================================================"
          echo "RKMS STATIC VERIFICATION: PASS"
          echo "============================================================"


      # ============================================================
      # 10. WEB BUILD
      # ============================================================

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          npm run build

          test -f dist/index.html
          test -f dist/app.js
          test -f dist/assets/rkms-logo-transparent.png

          echo "Web build: PASS"


      # ============================================================
      # 11. ANDROID SDK
      #
      # Do NOT use android-actions/setup-android@v3.
      # ============================================================

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="$ANDROID_HOME"

          echo "ANDROID_HOME=$SDK"

          test -d "$SDK"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          echo "$SDK/cmdline-tools/latest/bin" \
            >> "$GITHUB_PATH"

          echo "$SDK/platform-tools" \
            >> "$GITHUB_PATH"

          echo "$SDK/build-tools/36.0.0" \
            >> "$GITHUB_PATH"

          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$SDK/build-tools/36.0.0:$PATH"

          "$SDKMANAGER" --version

          yes | \
            "$SDKMANAGER" \
            --licenses \
            >/dev/null 2>&1 \
            || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          test -d \
            "$SDK/platforms/android-36"

          test -d \
            "$SDK/build-tools/36.0.0"

          echo ""
          echo "============================================================"
          echo "ANDROID SDK: PASS"
          echo "API 36: PASS"
          echo "BUILD TOOLS 36.0.0: PASS"
          echo "============================================================"


      # ============================================================
      # 12. GENERATE ANDROID PROJECT
      # ============================================================

      - name: Generate Capacitor Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          rm -rf android

          npx cap add android

          test -f \
            android/app/build.gradle

          test -f \
            android/gradlew

          test -f \
            android/app/src/main/AndroidManifest.xml

          echo "Capacitor Android generation: PASS"


      # ============================================================
      # 13. CONFIGURE ANDROID 16
      # ============================================================

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          chmod +x \
            scripts/configure-android-16.sh

          ./scripts/configure-android-16.sh

          test -f \
            android/variables.gradle

          echo "Android 16 configuration: PASS"


      # ============================================================
      # 14. ANDROID 16 VERIFICATION
      #
      # NOW android/variables.gradle exists.
      # ============================================================

      - name: Verify Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          test -f \
            android/variables.gradle

          python3 \
            scripts/verify-android-16.py

          echo ""
          echo "============================================================"
          echo "ANDROID 16 API 36 VERIFICATION: PASS"
          echo "============================================================"


      # ============================================================
      # 15. CAPACITOR SYNC
      # ============================================================

      - name: Sync Capacitor Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          npx cap sync android

          echo "Capacitor sync: PASS"


      # ============================================================
      # 16. RKMS NATIVE ANDROID
      # ============================================================

      - name: Configure RKMS native Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          chmod +x \
            scripts/setup-android-native.sh

          ./scripts/setup-android-native.sh

          test -f \
            android/app/src/main/java/org/rkms/connect/MainActivity.java

          test -f \
            android/app/src/main/java/org/rkms/connect/RKMSNativeBridge.java

          test -s \
            android/app/google-services.json

          echo "MainActivity: PASS"
          echo "RKMSNativeBridge: PASS"
          echo "Firebase JSON: PASS"


      # ============================================================
      # 17. FIREBASE SDK DEPENDENCY
      #
      # IMPORTANT FIX:
      #
      # MainActivity.java uses:
      #
      # FirebaseApp.initializeApp(this)
      #
      # Therefore Firebase SDK must be present in Gradle.
      # ============================================================

      - name: Configure Firebase SDK dependency
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          ROOT_GRADLE="android/build.gradle"
          APP_GRADLE="android/app/build.gradle"

          test -f "$ROOT_GRADLE"
          test -f "$APP_GRADLE"

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(
              "android/build.gradle"
          )

          app = Path(
              "android/app/build.gradle"
          )

          root_text = root.read_text()
          app_text = app.read_text()


          # ========================================================
          # Google Services Gradle plugin
          # ========================================================

          if "com.google.gms:google-services:" not in root_text:

              match = re.search(
                  r'dependencies\s*\{',
                  root_text
              )

              if not match:

                  raise SystemExit(
                      "ERROR: root Gradle dependencies block not found."
                  )

              pos = match.end()

              line = (
                  '\n'
                  '        classpath '
                  '"com.google.gms:google-services:4.4.3"'
              )

              root_text = (
                  root_text[:pos]
                  + line
                  + root_text[pos:]
              )


          # ========================================================
          # Google Services plugin
          # ========================================================

          if "com.google.gms.google-services" not in app_text:

              app_text += """

          apply plugin: "com.google.gms.google-services"
          """


          # ========================================================
          # Firebase BOM
          # ========================================================

          if "com.google.firebase:firebase-bom:" not in app_text:

              match = re.search(
                  r'dependencies\s*\{',
                  app_text
              )

              if not match:

                  raise SystemExit(
                      "ERROR: app dependencies block not found."
                  )

              pos = match.end()

              firebase_bom = """
              implementation platform(
                  "com.google.firebase:firebase-bom:34.4.0"
              )
          """

              app_text = (
                  app_text[:pos]
                  + firebase_bom
                  + app_text[pos:]
              )


          # ========================================================
          # Firebase Messaging
          #
          # firebase-messaging brings FirebaseApp /
          # firebase-common transitively.
          # ========================================================

          if "com.google.firebase:firebase-messaging" not in app_text:

              match = re.search(
                  r'dependencies\s*\{',
                  app_text
              )

              if not match:

                  raise SystemExit(
                      "ERROR: app dependencies block not found."
                  )

              pos = match.end()

              messaging = """
              implementation "com.google.firebase:firebase-messaging"
          """

              app_text = (
                  app_text[:pos]
                  + messaging
                  + app_text[pos:]
              )


          root.write_text(
              root_text
          )

          app.write_text(
              app_text
          )


          print(
              "Firebase Gradle configuration written."
          )
          PY


          # ========================================================
          # Verify dependency actually exists.
          # ========================================================

          grep -Fq \
            "com.google.gms:google-services:4.4.3" \
            android/build.gradle

          grep -Fq \
            "com.google.gms.google-services" \
            android/app/build.gradle

          grep -Fq \
            "com.google.firebase:firebase-bom:" \
            android/app/build.gradle

          grep -Fq \
            "com.google.firebase:firebase-messaging" \
            android/app/build.gradle

          echo ""
          echo "============================================================"
          echo "FIREBASE SDK DEPENDENCY: PASS"
          echo "Google Services plugin : PASS"
          echo "Firebase BOM            : PASS"
          echo "Firebase Messaging      : PASS"
          echo "FirebaseApp available   : PASS"
          echo "============================================================"


      # ============================================================
      # 18. VERIFY FIREBASE JSON
      # ============================================================

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          test -s \
            android/app/google-services.json

          python3 - <<'PY'
          import json

          path = (
              "android/app/google-services.json"
          )

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          packages = []


          for client in data.get(
              "client",
              []
          ):

              package_name = (
                  client
                  .get(
                      "client_info",
                      {}
                  )
                  .get(
                      "android_client_info",
                      {}
                  )
                  .get(
                      "package_name"
                  )
              )

              if package_name:
                  packages.append(
                      package_name
                  )


          print(
              "Firebase packages:"
          )

          for package_name in packages:

              print(
                  " -",
                  package_name
              )


          if (
              "org.rkms.connect"
              not in packages
          ):

              raise SystemExit(
                  "ERROR: org.rkms.connect missing from Firebase."
              )


          print(
              "Firebase configuration: PASS"
          )
          PY


      # ============================================================
      # 19. VERIFY FIREBASE INITIALIZATION
      # ============================================================

      - name: Verify Firebase initialization
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          MAIN="android/app/src/main/java/org/rkms/connect/MainActivity.java"

          test -f "$MAIN"

          grep -Fq \
            "FirebaseApp.initializeApp(this)" \
            "$MAIN"

          COUNT="$(
            grep -F \
              -o \
              "FirebaseApp.initializeApp(this)" \
              "$MAIN" \
              | wc -l
          )"

          if [ "$COUNT" -ne 1 ]; then

            echo "ERROR:"
            echo "Firebase initialization count = $COUNT"

            exit 1
          fi

          echo "Firebase initialization source: PASS"


      # ============================================================
      # 20. APPLICATION ID
      # ============================================================

      - name: Verify application ID
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          grep -R -Fq \
            "org.rkms.connect" \
            android/app/build.gradle

          echo "Application ID org.rkms.connect: PASS"


      # ============================================================
      # 21. GRADLE 8.11.1
      # ============================================================

      - name: Configure Gradle 8.11.1
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR/android"

          mkdir -p \
            gradle/wrapper

          cat > \
            gradle/wrapper/gradle-wrapper.properties \
            <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          networkTimeout=100000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          chmod +x gradlew

          ./gradlew --version

          echo "Gradle 8.11.1: PASS"


      # ============================================================
      # 22. SIGNING SECRETS
      # ============================================================

      - name: Verify release signing secrets
        shell: bash
        run: |
          set -euo pipefail

          test -n \
            "${RKMS_KEYSTORE_BASE64:-}"

          test -n \
            "${RKMS_KEYSTORE_PASSWORD:-}"

          test -n \
            "${RKMS_KEY_ALIAS:-}"

          test -n \
            "${RKMS_KEY_PASSWORD:-}"

          echo "Release signing secrets: PASS"


      # ============================================================
      # 23. PREPARE KEYSTORE
      # ============================================================

      - name: Prepare release keystore
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          echo "$RKMS_KEYSTORE_BASE64" \
            | base64 --decode \
            > rkms-release.keystore

          test -s \
            rkms-release.keystore

          echo "Release keystore: PASS"


      # ============================================================
      # 24. CONFIGURE RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "android/app/build.gradle"
          )

          text = path.read_text()


          # ========================================================
          # Add signingConfigs.release if missing.
          # ========================================================

          if (
              "rkms-release.keystore"
              not in text
          ):

              android_match = re.search(
                  r'\bandroid\s*\{',
                  text
              )

              if not android_match:

                  raise SystemExit(
                      "ERROR: android block not found."
                  )


              pos = android_match.end()


              signing_block = """
              
              signingConfigs {
                  release {
                      storeFile file("../../rkms-release.keystore")
                      storePassword System.getenv("RKMS_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("RKMS_KEY_ALIAS")
                      keyPassword System.getenv("RKMS_KEY_PASSWORD")
                  }
              }

          """


              text = (
                  text[:pos]
                  + signing_block
                  + text[pos:]
              )


          # ========================================================
          # Add release signingConfig if missing.
          #
          # Match the release build type specifically after
          # buildTypes.
          # ========================================================

          if (
              "signingConfig signingConfigs.release"
              not in text
          ):

              match = re.search(
                  r'(buildTypes\s*\{\s*release\s*\{)',
                  text,
                  re.S
              )

              if not match:

                  raise SystemExit(
                      "ERROR: buildTypes release block not found."
                  )


              replacement = (
                  match.group(1)
                  + '\n'
                  + '            signingConfig signingConfigs.release'
              )


              text = text.replace(
                  match.group(1),
                  replacement,
                  1
              )


          path.write_text(
              text
          )


          print(
              "Release signing configured."
          )
          PY


          grep -Fq \
            "rkms-release.keystore" \
            android/app/build.gradle

          grep -Fq \
            "signingConfig signingConfigs.release" \
            android/app/build.gradle

          echo "Release signing configuration: PASS"


      # ============================================================
      # 25. FINAL ANDROID VALUES
      # ============================================================

      - name: Verify final Android SDK values
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "android/variables.gradle"
          )

          text = path.read_text()


          def get_value(name):

              match = re.search(
                  rf'\b{name}\s*=\s*(\d+)',
                  text
              )

              if not match:
                  return None

              return int(
                  match.group(1)
              )


          compile_sdk = get_value(
              "compileSdkVersion"
          )

          target_sdk = get_value(
              "targetSdkVersion"
          )

          min_sdk = get_value(
              "minSdkVersion"
          )


          print(
              "compileSdkVersion:",
              compile_sdk
          )

          print(
              "targetSdkVersion:",
              target_sdk
          )

          print(
              "minSdkVersion:",
              min_sdk
          )


          if compile_sdk != 36:

              raise SystemExit(
                  "ERROR: compileSdkVersion != 36"
              )


          if target_sdk != 36:

              raise SystemExit(
                  "ERROR: targetSdkVersion != 36"
              )


          print(
              "Android SDK values: PASS"
          )
          PY


      # ============================================================
      # 26. GRADLE CHECK
      # ============================================================

      - name: Final Gradle check
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR/android"

          chmod +x gradlew

          ./gradlew \
            --version

          echo "Gradle check: PASS"


      # ============================================================
      # 27. GRADLE CLEAN
      # ============================================================

      - name: Gradle clean
        working-directory: ${{ env.SOURCE_DIR }}/android
        run: |
          ./gradlew \
            clean \
            --no-daemon


      # ============================================================
      # 28. BUILD SIGNED APK + AAB
      # ============================================================

      - name: Build signed APK and AAB
        working-directory: ${{ env.SOURCE_DIR }}/android
        run: |
          set -euo pipefail

          ./gradlew \
            assembleRelease \
            bundleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "============================================================"
          echo "GRADLE APK + AAB BUILD: PASS"
          echo "============================================================"


      # ============================================================
      # 29. VERIFY APK
      # ============================================================

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          APK="android/app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"


          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"


          test -x "$APKSIGNER"


          "$APKSIGNER" \
            verify \
            --verbose \
            "$APK"


          echo ""
          echo "============================================================"
          echo "SIGNED APK VERIFICATION: PASS"
          echo "============================================================"

          ls -lh "$APK"


      # ============================================================
      # 30. VERIFY AAB
      # ============================================================

      - name: Verify signed AAB
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          test -s "$AAB"


          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB"


          echo ""
          echo "============================================================"
          echo "SIGNED AAB VERIFICATION: PASS"
          echo "============================================================"

          ls -lh "$AAB"


      # ============================================================
      # 31. PREPARE FINAL RELEASE FILES
      # ============================================================

      - name: Prepare final release files
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          rm -rf release

          mkdir -p release


          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk


          cp \
            android/app/build/outputs/bundle/release/app-release.aab \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab


          sha256sum \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk \
            > release/RKMS_APK_SHA256.txt


          sha256sum \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab \
            > release/RKMS_AAB_SHA256.txt


          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab


          echo ""
          echo "============================================================"
          echo "APK SHA256"
          echo "============================================================"

          cat \
            release/RKMS_APK_SHA256.txt


          echo ""
          echo "============================================================"
          echo "AAB SHA256"
          echo "============================================================"

          cat \
            release/RKMS_AAB_SHA256.txt


      # ============================================================
      # 32. FINAL RELEASE VERIFICATION
      # ============================================================

      - name: Final release verification
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"


          APK="release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"

          AAB="release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab"


          test -s "$APK"
          test -s "$AAB"


          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" \
            verify \
            "$APK"


          jarsigner \
            -verify \
            "$AAB"


          echo ""
          echo "============================================================"
          echo "FINAL RELEASE VERIFICATION: PASS"
          echo "============================================================"

          echo "APK: PASS"
          echo "AAB: PASS"
          echo "APK signature: PASS"
          echo "AAB signature: PASS"


      # ============================================================
      # 33. UPLOAD APK + AAB
      # ============================================================

      - name: Upload final APK and AAB
        uses: actions/upload-artifact@v4
        with:

          name: RKMS-Android-16-API36-FINAL-APK-AAB

          path: |
            ${{ env.SOURCE_DIR }}/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            ${{ env.SOURCE_DIR }}/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab
            ${{ env.SOURCE_DIR }}/release/RKMS_APK_SHA256.txt
            ${{ env.SOURCE_DIR }}/release/RKMS_AAB_SHA256.txt

          if-no-files-found: error

          retention-days: 90


      # ============================================================
      # 34. FINAL SUMMARY
      # ============================================================

      - name: FINAL BUILD SUMMARY
        shell: bash
        run: |
          echo ""
          echo "============================================================"
          echo "              RKMS FINAL BUILD SUCCESS"
          echo "============================================================"
          echo ""
          echo "Android API 36       : PASS"
          echo "compileSdk 36        : PASS"
          echo "targetSdk 36         : PASS"
          echo "Node.js 22           : PASS"
          echo "JDK 17               : PASS"
          echo "Firebase SDK         : PASS"
          echo "Firebase Init        : PASS"
          echo "Native Bridge        : PASS"
          echo "Saved Login          : PASS"
          echo "FCM                  : PASS"
          echo "Team RKMS Chat       : PASS"
          echo "Team RKMS Logo       : PASS"
          echo "Release Signing      : PASS"
          echo "APK                  : SIGNED"
          echo "AAB                  : SIGNED"
          echo ""
          echo "============================================================"

name: RKMS Android 16 API 36 - Final Release APK Only

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  AGP_VERSION: "8.9.1"
  GRADLE_VERSION: "8.11.1"
  APP_ID: "org.rkms.connect"

jobs:
  android-build:
    name: RKMS Android 16 API 36 Release APK
    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. RESOLVE RKMS SOURCE
      #
      # Priority:
      # 1. Repository root
      # 2. V6 final source ZIP
      # 3. Known newer sources
      # 4. Other RKMS ZIP fallback
      #
      # This prevents an older V2 source from being selected before
      # the V6 fixes.
      # ============================================================
      - name: Resolve RKMS source
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " RKMS SOURCE RESOLUTION"
          echo "=============================================="

          if [[ -f "package.json" ]] && \
             [[ -f "package-lock.json" ]] && \
             [[ -f "app.js" ]] && \
             [[ -f "index.html" ]] && \
             [[ -f "styles.css" ]] && \
             [[ -f "capacitor.config.json" ]] && \
             [[ -f "google-services.json" ]]; then

            echo "Root RKMS source detected."
            echo "RKMS_SOURCE_DIR=." >> "$GITHUB_ENV"
            exit 0
          fi

          echo "Root source not found."
          echo "Searching for RKMS source ZIP..."

          rm -rf rkms-source
          mkdir -p rkms-source

          ZIP=""

          # --------------------------------------------------------
          # V6 FINAL SOURCE - HIGHEST ZIP PRIORITY
          # --------------------------------------------------------
          for CANDIDATE in \
            "RKMS_CONNECT_FINAL_BUILD_V6_ALL_FIXES_GPM_APK_ONLY.zip" \
            "RKMS_CONNECT_FINAL_BUILD_V6_ALL_FIXES_GPM_APK_ONLY_FIXED.zip"
          do
            if [[ -f "$CANDIDATE" ]]; then
              ZIP="$CANDIDATE"
              break
            fi
          done

          # --------------------------------------------------------
          # V5 SOURCE
          # --------------------------------------------------------
          if [[ -z "$ZIP" ]] && \
             [[ -f "RKMS_CONNECT_FINAL_BUILD_V5_ALL_FIXES_FINAL.zip" ]]; then
            ZIP="RKMS_CONNECT_FINAL_BUILD_V5_ALL_FIXES_FINAL.zip"
          fi

          # --------------------------------------------------------
          # V2 SOURCES
          # --------------------------------------------------------
          if [[ -z "$ZIP" ]] && \
             [[ -f "RKMS_CONNECT_FINAL_CHAT_UI_PROFESSIONAL_FIXED_V2.zip" ]]; then
            ZIP="RKMS_CONNECT_FINAL_CHAT_UI_PROFESSIONAL_FIXED_V2.zip"
          fi

          if [[ -z "$ZIP" ]] && \
             [[ -f "RKMS_CONNECT_FINAL_RELEASE_APK_ONLY_CHAT_FIXED_V2.zip" ]]; then
            ZIP="RKMS_CONNECT_FINAL_RELEASE_APK_ONLY_CHAT_FIXED_V2.zip"
          fi

          if [[ -z "$ZIP" ]] && \
             [[ -f "RKMS_CONNECT_FINAL_CHAT_UI_PROFESSIONAL_FIXED_SCROLL_FOOTER_PATCHED.zip" ]]; then
            ZIP="RKMS_CONNECT_FINAL_CHAT_UI_PROFESSIONAL_FIXED_SCROLL_FOOTER_PATCHED.zip"
          fi

          if [[ -z "$ZIP" ]] && \
             [[ -f "RKMS_CONNECT_FINAL_CHAT_UI_PROFESSIONAL_FIXED.zip" ]]; then
            ZIP="RKMS_CONNECT_FINAL_CHAT_UI_PROFESSIONAL_FIXED.zip"
          fi

          # --------------------------------------------------------
          # OTHER KNOWN SOURCES
          # --------------------------------------------------------
          if [[ -z "$ZIP" ]]; then

            for CANDIDATE in \
              "RKMS_CONNECT_FINAL_CLEAN_ANDROID16_API36_APK_AAB_BUILD.zip" \
              "RKMS_CONNECT_CHAT_DIGITAL_ID_ANDROID16_API36_FINAL_APK_BUILD.zip"
            do

              if [[ -f "$CANDIDATE" ]]; then
                ZIP="$CANDIDATE"
                break
              fi

            done

          fi

          # --------------------------------------------------------
          # RECURSIVE FALLBACK
          # --------------------------------------------------------
          if [[ -z "$ZIP" ]]; then

            FOUND_ZIP="$(
              find . \
                -type f \
                -iname "RKMS_CONNECT*.zip" \
                -not -path "./.git/*" \
                -print \
                | sort \
                | head -n 1 || true
            )"

            if [[ -n "$FOUND_ZIP" ]]; then
              ZIP="$FOUND_ZIP"
            fi

          fi

          # --------------------------------------------------------
          # FAIL IF NOTHING FOUND
          # --------------------------------------------------------
          if [[ -z "$ZIP" ]]; then

            echo "::error::RKMS source ZIP not found."

            echo
            echo "Available repository files:"
            find . \
              -maxdepth 5 \
              -type f \
              -not -path "./.git/*" \
              | sort \
              | head -500

            exit 1
          fi

          echo
          echo "Selected RKMS source:"
          echo "$ZIP"
          echo

          unzip -q "$ZIP" -d rkms-source

          FOUND_PACKAGE="$(
            find rkms-source \
              -type f \
              -name "package.json" \
              -print \
              | head -n 1 || true
          )"

          if [[ -z "$FOUND_PACKAGE" ]]; then
            echo "::error::package.json not found after extraction."
            exit 1
          fi

          SOURCE="$(dirname "$FOUND_PACKAGE")"

          REQUIRED_FILES=(
            package.json
            package-lock.json
            app.js
            index.html
            styles.css
            capacitor.config.json
            google-services.json
            scripts/configure-android-16.sh
            scripts/setup-android-native.sh
            scripts/configure-release-signing.sh
          )

          for FILE in "${REQUIRED_FILES[@]}"; do

            if [[ ! -f "$SOURCE/$FILE" ]]; then
              echo "::error::Missing required source file:"
              echo "$SOURCE/$FILE"
              exit 1
            fi

          done

          echo "RKMS_SOURCE_DIR=$SOURCE" >> "$GITHUB_ENV"

          echo
          echo "=============================================="
          echo " RKMS SOURCE RESOLUTION: PASS"
          echo "=============================================="
          echo "Source: $SOURCE"
          echo


      # ============================================================
      # 3. VERIFY SOURCE
      # ============================================================
      - name: Verify RKMS source
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          REQUIRED_FILES=(
            package.json
            package-lock.json
            app.js
            index.html
            styles.css
            capacitor.config.json
            google-services.json
            scripts/configure-android-16.sh
            scripts/setup-android-native.sh
            scripts/configure-release-signing.sh
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            test -f "$FILE" || {
              echo "::error::Missing required file: $FILE"
              exit 1
            }
          done

          node --check app.js

          echo "RKMS source verification: PASS"


      # ============================================================
      # 4. VERIFY CHAT V2
      # ============================================================
      - name: Verify RKMS Chat V2 source
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          REQUIRED_CHAT_MARKERS=(
            "wa-chat-screen"
            "wa-chat-list"
            "wa-chat-row"
            "wa-conv-head"
            "wa-messages"
            "wa-compose-wrap"
            "rkms-bottom-nav"
            "visualViewport"
          )

          for MARKER in "${REQUIRED_CHAT_MARKERS[@]}"; do
            grep -Fq "$MARKER" app.js styles.css || {
              echo "::error::Chat marker missing: $MARKER"
              exit 1
            }
          done

          echo "Chat source verification: PASS"


      # ============================================================
      # 5. NODE 22
      # ============================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}


      # ============================================================
      # 6. VERIFY NODE
      # ============================================================
      - name: Verify Node and JavaScript
        shell: bash
        run: |
          set -euo pipefail

          node --version
          npm --version

          cd "$RKMS_SOURCE_DIR"

          node --check app.js


      # ============================================================
      # 7. VERIFY CAPACITOR
      # ============================================================
      - name: Verify Capacitor versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          node <<'NODE'
          const p = require("./package.json");

          const expected = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          for (const [name, version] of Object.entries(expected)) {
            const actual =
              (p.dependencies && p.dependencies[name]) ||
              (p.devDependencies && p.devDependencies[name]);

            if (!actual || !actual.includes(version)) {
              console.error(
                `${name}: expected ${version}, found ${actual}`
              );
              process.exit(1);
            }

            console.log(`${name}: ${actual}`);
          }

          console.log("Capacitor versions verified.");
          NODE


      # ============================================================
      # 8. NPM INSTALL
      # ============================================================
      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          npm ci --no-audit --no-fund


      # ============================================================
      # 9. CHAT CSS STRUCTURE
      # ============================================================
      - name: Verify Chat CSS integrity
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          python3 <<'PY'
          from pathlib import Path
          import re

          css = Path("styles.css").read_text(
              encoding="utf-8",
              errors="replace"
          )

          clean = re.sub(
              r"/\*.*?\*/",
              "",
              css,
              flags=re.S
          )

          if clean.count("{") != clean.count("}"):
              raise SystemExit(
                  "CSS brace mismatch"
              )

          required = [
              "wa-chat-screen",
              "wa-chat-list",
              "wa-chat-row",
              "wa-conv-head",
              "wa-messages",
              "wa-compose-wrap",
              "rkms-bottom-nav",
              "rkms-chat-vh",
              "rkms-site-header-h",
              "rkms-bottom-nav-h"
          ]

          for item in required:
              if item not in css:
                  raise SystemExit(
                      f"Missing CSS item: {item}"
                  )

          print("Chat CSS: PASS")
          PY


      # ============================================================
      # 10. BUILD WEB
      # ============================================================
      - name: Build RKMS web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          npm run build

          test -s dist/index.html

          echo "Web build: PASS"


      # ============================================================
      # 11. JAVA 17
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle


      # ============================================================
      # 12. VERIFY JAVA
      # ============================================================
      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail
          java -version


      # ============================================================
      # 13. ANDROID SDK API 36
      # ============================================================
      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses >/dev/null 2>&1 || true

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"


      # ============================================================
      # 14. VERIFY SDK
      # ============================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d \
            "${ANDROID_HOME}/platforms/android-${ANDROID_API}"

          test -d \
            "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}"

          "${ANDROID_HOME}/platform-tools/adb" version

          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt" version


      # ============================================================
      # 15. CREATE CAPACITOR ANDROID
      # ============================================================
      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          rm -rf android

          npx cap add android

          test -f android/gradlew
          test -f android/app/build.gradle

          chmod +x android/gradlew


      # ============================================================
      # 16. CONFIGURE ANDROID 16 API 36
      # ============================================================
      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          chmod +x scripts/configure-android-16.sh

          ./scripts/configure-android-16.sh

          chmod +x android/gradlew


      # ============================================================
      # 17. VERIFY ANDROID CONFIGURATION
      # ============================================================
      - name: Verify Android configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path("android")

          if not root.is_dir():
              raise SystemExit(
                  "android directory missing"
              )

          files = list(root.rglob("*.gradle"))
          files += list(root.rglob("*.gradle.kts"))

          combined = "\n".join(
              p.read_text(
                  encoding="utf-8",
                  errors="replace"
              )
              for p in files
          )

          compile_ok = any(
              re.search(x, combined)
              for x in [
                  r"\bcompileSdkVersion\s*=?\s*36\b",
                  r"\bcompileSdk\s*=?\s*36\b"
              ]
          )

          target_ok = any(
              re.search(x, combined)
              for x in [
                  r"\btargetSdkVersion\s*=?\s*36\b",
                  r"\btargetSdk\s*=?\s*36\b"
              ]
          )

          if not compile_ok:
              raise SystemExit(
                  "compileSdk 36 not found"
              )

          if not target_ok:
              raise SystemExit(
                  "targetSdk 36 not found"
              )

          if "8.9.1" not in combined:
              raise SystemExit(
                  "AGP 8.9.1 not found"
              )

          wrapper = Path(
              "android/gradle/wrapper/gradle-wrapper.properties"
          )

          if not wrapper.is_file():
              raise SystemExit(
                  "Gradle wrapper properties missing"
              )

          wrapper_text = wrapper.read_text(
              encoding="utf-8",
              errors="replace"
          )

          if "gradle-8.11.1" not in wrapper_text:
              raise SystemExit(
                  "Gradle 8.11.1 not configured"
              )

          print("Android configuration: PASS")
          print("compileSdk: 36")
          print("targetSdk: 36")
          print("AGP: 8.9.1")
          print("Gradle: 8.11.1")
          PY


      # ============================================================
      # 18. CAPACITOR SYNC
      # ============================================================
      - name: Capacitor sync
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          npx cap sync android

          chmod +x android/gradlew


      # ============================================================
      # 19. SETUP RKMS NATIVE
      # ============================================================
      - name: Setup RKMS native Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          chmod +x scripts/setup-android-native.sh

          ./scripts/setup-android-native.sh

          chmod +x android/gradlew


      # ============================================================
      # 20. VERIFY GOOGLE PASSWORD MANAGER /
      #     ANDROID CREDENTIAL MANAGER
      #
      # IMPORTANT:
      # V6 intentionally DOES NOT use:
      # RKMSSecureCredentials
      # RKMSSecureCredentialsPlugin
      #
      # Password saving is delegated to Android Credential Manager /
      # configured password provider such as Google Password Manager.
      # ============================================================
      - name: Verify Credential Manager / Google Password Manager
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          echo "Checking Credential Manager..."

          if grep -R \
            "RKMSSecureCredentialsPlugin" \
            app.js \
            scripts \
            >/dev/null 2>&1; then

            echo "::error::Old custom credential plugin still exists."
            exit 1

          fi

          if grep -R \
            "RKMSSecureCredentials" \
            app.js \
            scripts/setup-android-native.sh \
            >/dev/null 2>&1; then

            echo "::error::Old custom credential implementation still exists."
            exit 1

          fi

          grep -q \
            "androidx.credentials:credentials:1.5.0" \
            scripts/setup-android-native.sh || {
              echo "::error::AndroidX Credential Manager missing."
              exit 1
            }

          grep -q \
            "androidx.credentials:credentials-play-services-auth:1.5.0" \
            scripts/setup-android-native.sh || {
              echo "::error::Credential Manager Play Services integration missing."
              exit 1
            }

          grep -q \
            "CredentialManager" \
            scripts/setup-android-native.sh || {
              echo "::error::CredentialManager implementation missing."
              exit 1
            }

          grep -q \
            "CreatePasswordRequest" \
            scripts/setup-android-native.sh || {
              echo "::error::CreatePasswordRequest missing."
              exit 1
            }

          grep -q \
            "savePassword" \
            scripts/setup-android-native.sh || {
              echo "::error::savePassword bridge missing."
              exit 1
            }

          grep -q \
            'autocomplete="current-password"' \
            app.js || {
              echo "::error::current-password autocomplete missing."
              exit 1
            }

          echo "Credential Manager / Google Password Manager path: PASS"


      # ============================================================
      # 21. VERIFY NATIVE AUDIO / FILE PICKER
      # ============================================================
      - name: Verify microphone and file picker
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          SETUP="scripts/setup-android-native.sh"

          grep -q \
            "android.permission.RECORD_AUDIO" \
            "$SETUP" || {
              echo "::error::RECORD_AUDIO permission missing."
              exit 1
            }

          grep -q \
            "RESOURCE_AUDIO_CAPTURE" \
            "$SETUP" || {
              echo "::error::WebView audio permission bridge missing."
              exit 1
            }

          grep -q \
            "requestPermissions" \
            "$SETUP" || {
              echo "::error::Runtime microphone permission missing."
              exit 1
            }

          grep -q \
            "onShowFileChooser" \
            "$SETUP" || {
              echo "::error::File chooser bridge missing."
              exit 1
            }

          grep -q \
            "MediaRecorder" \
            app.js || {
              echo "::error::MediaRecorder voice recording missing."
              exit 1
            }

          echo "Microphone + file picker: PASS"


      # ============================================================
      # 22. VERIFY KEYBOARD RESIZE
      # ============================================================
      - name: Verify keyboard handling
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          grep -q \
            "visualViewport" \
            app.js || {
              echo "::error::visualViewport missing."
              exit 1
            }

          grep -q \
            "SOFT_INPUT_ADJUST_RESIZE" \
            scripts/setup-android-native.sh || {
              echo "::error::Native adjustResize missing."
              exit 1
            }

          echo "Keyboard handling: PASS"


      # ============================================================
      # 23. VERIFY FIREBASE CONFIGURATION
      # ============================================================
      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          test -s google-services.json
          test -s android/app/google-services.json

          node <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync(
              "google-services.json",
              "utf8"
            )
          );

          const valid =
            (data.client || []).some(client =>
              client.client_info &&
              client.client_info.android_client_info &&
              client.client_info.android_client_info.package_name ===
                "org.rkms.connect"
            );

          if (!valid) {
            console.error(
              "Firebase package org.rkms.connect not found."
            );
            process.exit(1);
          }

          console.log(
            "Firebase package verified."
          );
          NODE


      # ============================================================
      # 24. ENSURE FIREBASE DEPENDENCIES
      # ============================================================
      - name: Ensure Firebase dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          FILE="android/app/build.gradle"

          python3 <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          marker = "dependencies {"

          if marker not in s:
              raise SystemExit(
                  "dependencies block not found"
              )

          bom = (
              "implementation platform("
              "'com.google.firebase:firebase-bom:33.9.0'"
              ")"
          )

          messaging = (
              "implementation "
              "'com.google.firebase:firebase-messaging'"
          )

          if bom not in s:
              s = s.replace(
                  marker,
                  marker + "\n    " + bom,
                  1
              )

          if messaging not in s:
              s = s.replace(
                  marker,
                  marker + "\n    " + messaging,
                  1
              )

          p.write_text(s)

          print("Firebase dependencies ready.")
          PY


      # ============================================================
      # 25. VERIFY FIREBASE INITIALIZATION
      # ============================================================
      - name: Verify Firebase initialization
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          grep -R \
            "FirebaseApp.initializeApp" \
            android/app/src/main/java \
            >/dev/null || {
              echo "::error::FirebaseApp.initializeApp missing."
              exit 1
            }

          echo "Firebase initialization: PASS"


      # ============================================================
      # 26. VERIFY RKMS NATIVE BRIDGE
      # ============================================================
      - name: Verify RKMS native bridge
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          BRIDGE="$(
            find android/app/src/main/java \
              -name "RKMSNativeBridge.java" \
              -print \
              | head -n 1
          )"

          if [[ -z "$BRIDGE" ]]; then
            echo "::error::RKMSNativeBridge.java missing."
            exit 1
          fi

          grep -q \
            "RKMSNativeBridge(android.app.Activity activity" \
            "$BRIDGE" || {
              echo "::error::Native bridge Activity constructor missing."
              exit 1
            }

          grep -q \
            "CredentialManager" \
            "$BRIDGE" || {
              echo "::error::CredentialManager bridge missing."
              exit 1
            }

          echo "RKMSNativeBridge: PASS"


      # ============================================================
      # 27. VERIFY BIOMETRIC
      # ============================================================
      - name: Verify biometric dependency
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          grep -R \
            "androidx.biometric:biometric" \
            android \
            >/dev/null || {
              echo "::error::Biometric dependency missing."
              exit 1
            }

          echo "Biometric dependency: PASS"


      # ============================================================
      # 28. VERIFY NOTIFICATION CHANNEL
      # ============================================================
      - name: Verify Android notification channel
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          grep -R \
            "rkms_notifications_v2" \
            scripts/setup-android-native.sh \
            >/dev/null || {
              echo "::error::RKMS notification channel missing."
              exit 1
            }

          grep -R \
            "IMPORTANCE_HIGH" \
            scripts/setup-android-native.sh \
            >/dev/null || {
              echo "::error::High importance notification channel missing."
              exit 1
            }

          echo "Notification channel: PASS"


      # ============================================================
      # 29. VERIFY RELEASE SIGNING SECRETS
      # ============================================================
      - name: Verify release signing secrets
        shell: bash
        run: |
          set -euo pipefail

          [[ -n "${RKMS_KEYSTORE_BASE64:-}" ]] || {
            echo "::error::RKMS_KEYSTORE_BASE64 missing."
            exit 1
          }

          [[ -n "${RKMS_KEYSTORE_PASSWORD:-}" ]] || {
            echo "::error::RKMS_KEYSTORE_PASSWORD missing."
            exit 1
          }

          [[ -n "${RKMS_KEY_ALIAS:-}" ]] || {
            echo "::error::RKMS_KEY_ALIAS missing."
            exit 1
          }

          [[ -n "${RKMS_KEY_PASSWORD:-}" ]] || {
            echo "::error::RKMS_KEY_PASSWORD missing."
            exit 1
          }

          echo "Release signing secrets: PASS"


      # ============================================================
      # 30. CONFIGURE RELEASE SIGNING
      # ============================================================
      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          chmod +x scripts/configure-release-signing.sh

          ./scripts/configure-release-signing.sh

          test -s android/app/release.keystore


      # ============================================================
      # 31. VALIDATE KEYSTORE
      # ============================================================
      - name: Validate release keystore
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          keytool \
            -list \
            -keystore android/app/release.keystore \
            -storepass "$RKMS_KEYSTORE_PASSWORD" \
            -alias "$RKMS_KEY_ALIAS" \
            >/dev/null

          echo "Release keystore: PASS"


      # ============================================================
      # 32. VERIFY GRADLE
      # ============================================================
      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR/android"

          chmod +x gradlew

          ./gradlew --version

          ./gradlew --version \
            | grep -q "8.11.1" || {
              echo "::error::Gradle 8.11.1 expected."
              exit 1
            }


      # ============================================================
      # 33. BUILD RELEASE APK ONLY
      #
      # IMPORTANT:
      # assembleRelease ONLY
      #
      # No:
      # assembleDebug
      # bundleRelease
      # AAB
      # ============================================================
      - name: Build Final Release APK Only
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR/android"

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"

          test -s "$RELEASE_APK"

          echo
          echo "=============================================="
          echo " RELEASE APK BUILD: PASS"
          echo "=============================================="
          ls -lh "$RELEASE_APK"


      # ============================================================
      # 34. VERIFY APK PACKAGE
      # ============================================================
      - name: Verify Release APK package
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          AAPT="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt"

          BADGING="$(
            "$AAPT" dump badging \
              android/app/build/outputs/apk/release/app-release.apk
          )"

          echo "$BADGING"

          echo "$BADGING" \
            | grep -q \
            "package: name='org.rkms.connect'" || {
              echo "::error::Wrong APK package ID."
              exit 1
            }

          echo "$BADGING" \
            | grep -q \
            "targetSdkVersion:'36'" || {
              echo "::error::APK target SDK is not 36."
              exit 1
            }

          echo "APK package + target SDK: PASS"


      # ============================================================
      # 35. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify Release APK signature
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          APKSIGNER="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            android/app/build/outputs/apk/release/app-release.apk

          echo "APK signature: PASS"


      # ============================================================
      # 36. PREPARE FINAL APK
      # ============================================================
      - name: Prepare final APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          rm -rf release
          mkdir -p release

          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk


      # ============================================================
      # 37. SHA256
      # ============================================================
      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR/release"

          sha256sum \
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk \
            > RKMS_ANDROID16_API36_SHA256.txt

          cat RKMS_ANDROID16_API36_SHA256.txt


      # ============================================================
      # 38. FINAL ARTIFACT CHECK
      # ============================================================
      - name: Final artifact check
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          test -s \
            release/RKMS_ANDROID16_API36_SHA256.txt

          # No debug APK
          if find release \
            -type f \
            -iname "*debug*.apk" \
            -print \
            | grep -q .; then

            echo "::error::Debug APK found."
            exit 1

          fi

          # No AAB
          if find release \
            -type f \
            -name "*.aab" \
            -print \
            | grep -q .; then

            echo "::error::AAB found."
            exit 1

          fi

          APK_COUNT="$(
            find release \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              | wc -l
          )"

          if [[ "$APK_COUNT" -ne 1 ]]; then
            echo "::error::Exactly one APK expected."
            exit 1
          fi

          echo
          echo "=============================================="
          echo " RKMS FINAL RELEASE APK READY"
          echo "=============================================="
          echo "APK: YES"
          echo "AAB: NO"
          echo "DEBUG APK: NO"
          echo "Package: org.rkms.connect"
          echo "Android API: 36"
          echo "compileSdk: 36"
          echo "targetSdk: 36"
          echo "AGP: 8.9.1"
          echo "Gradle: 8.11.1"
          echo "Node: 22"
          echo "Java: 17"
          echo "Credential Manager: VERIFIED"
          echo "Custom Credential Vault: REMOVED"
          echo "Chat: VERIFIED"
          echo "Keyboard: VERIFIED"
          echo "Microphone: VERIFIED"
          echo "File Picker: VERIFIED"
          echo "Firebase: VERIFIED"
          echo "Native Bridge: VERIFIED"
          echo "Release Signing: VERIFIED"
          echo


      # ============================================================
      # 39. UPLOAD FINAL APK ONLY
      # ============================================================
      - name: Upload final Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-ANDROID16-API36-FINAL-RELEASE-APK

          path: |
            ${{ env.RKMS_SOURCE_DIR }}/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            ${{ env.RKMS_SOURCE_DIR }}/release/RKMS_ANDROID16_API36_SHA256.txt

          if-no-files-found: error
          retention-days: 30

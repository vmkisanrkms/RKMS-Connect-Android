name: RKMS CONNECT Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify supplied RKMS ZIP
        run: |
          test -f RKMS_CONNECT_APK_BUILD_READY.zip
          unzip -t RKMS_CONNECT_APK_BUILD_READY.zip >/dev/null
          echo "RKMS_CONNECT_APK_BUILD_READY.zip verified"

      - name: Extract supplied RKMS source
        run: |
          rm -rf build
          mkdir -p build
          unzip -q RKMS_CONNECT_APK_BUILD_READY.zip -d build
          test -f build/app.js
          test -f build/index.html
          test -f build/config.js
          echo "Verified extracted source"

      - name: Create Capacitor build configuration
        working-directory: build
        run: |
          cat > package.json <<'EOF'
          {
            "name": "rkms-connect",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "rm -rf dist && mkdir dist && rsync -a --exclude='dist' --exclude='android' --exclude='node_modules' --exclude='.git' --exclude='.github' --exclude='*.zip' ./ dist/"
            },
            "dependencies": {
              "@capacitor/core": "6.2.1",
              "@capacitor/android": "6.2.1",
              "@capacitor/app": "6.2.1",
              "@capacitor/haptics": "6.2.1",
              "@capacitor/keyboard": "6.2.1",
              "@capacitor/status-bar": "6.2.1"
            },
            "devDependencies": {
              "@capacitor/cli": "6.2.1"
            }
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "org.rkms.connect",
            "appName": "RKMS CONNECT",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https",
              "cleartext": true
            },
            "android": {
              "allowMixedContent": true,
              "captureInput": true,
              "webContentsDebuggingEnabled": false
            }
          }
          EOF

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor dependencies
        working-directory: build
        run: npm install --no-audit --no-fund

      - name: Build RKMS web application
        working-directory: build
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Capacitor Android project
        working-directory: build
        run: npx cap add android

      - name: Sync RKMS application to Android
        working-directory: build
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x build/android/gradlew

      - name: Build debug APK
        working-directory: build/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -f build/android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh build/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload RKMS CONNECT APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-CONNECT-debug-apk
          path: build/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

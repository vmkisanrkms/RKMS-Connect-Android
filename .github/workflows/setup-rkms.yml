name: RKMS Android 16 API 36 - Final Release APK Only

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  AGP_VERSION: "8.9.1"
  GRADLE_VERSION: "8.11.1"
  APP_ID: "org.rkms.connect"

jobs:
  android-build:
    name: RKMS Android 16 API 36 Release APK
    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. RESOLVE RKMS SOURCE
      # ============================================================
      - name: Resolve RKMS source
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking RKMS source..."

          if [[ -f "package.json" ]] && \
             [[ -f "package-lock.json" ]] && \
             [[ -f "app.js" ]] && \
             [[ -f "index.html" ]] && \
             [[ -f "styles.css" ]] && \
             [[ -f "capacitor.config.json" ]] && \
             [[ -f "google-services.json" ]]; then

            echo "Root RKMS source detected."
            echo "RKMS_SOURCE_DIR=." >> "$GITHUB_ENV"

          else

            ZIP_CANDIDATES=(
              "RKMS_CONNECT_FINAL_CHAT_UI_PROFESSIONAL_FIXED.zip"
              "RKMS_CONNECT_FINAL_CHAT_UI_PROFESSIONAL_FIXED_SCROLL_FOOTER_PATCHED.zip"
              "RKMS_CONNECT_FINAL_CLEAN_ANDROID16_API36_APK_AAB_BUILD.zip"
              "RKMS_CONNECT_CHAT_DIGITAL_ID_ANDROID16_API36_FINAL_APK_BUILD.zip"
            )

            ZIP=""

            for CANDIDATE in "${ZIP_CANDIDATES[@]}"; do
              if [[ -f "$CANDIDATE" ]]; then
                ZIP="$CANDIDATE"
                break
              fi
            done

            if [[ -z "$ZIP" ]]; then
              echo "::error::RKMS source ZIP not found."
              exit 1
            fi

            echo "Using source ZIP:"
            echo "$ZIP"

            rm -rf rkms-source
            mkdir -p rkms-source

            unzip -q "$ZIP" -d rkms-source

            SOURCE="rkms-source"

            if [[ ! -f "$SOURCE/package.json" ]]; then

              FOUND="$(
                find "$SOURCE" \
                  -type f \
                  -name package.json \
                  -print \
                  -quit || true
              )"

              if [[ -z "$FOUND" ]]; then
                echo "::error::package.json not found after extraction."
                exit 1
              fi

              SOURCE="$(dirname "$FOUND")"
            fi

            echo "Resolved RKMS source:"
            echo "$SOURCE"

            echo "RKMS_SOURCE_DIR=$SOURCE" >> "$GITHUB_ENV"
          fi


      # ============================================================
      # 3. VERIFY RKMS SOURCE
      # ============================================================
      - name: Verify RKMS source
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          REQUIRED_FILES=(
            package.json
            package-lock.json
            app.js
            index.html
            styles.css
            capacitor.config.json
            google-services.json
            scripts/configure-android-16.sh
            scripts/setup-android-native.sh
            scripts/configure-release-signing.sh
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$FILE" ]]; then
              echo "::error::Missing required file: $FILE"
              exit 1
            fi
          done

          echo "All required RKMS source files verified."


      # ============================================================
      # 4. NODE 22
      # ============================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.RKMS_SOURCE_DIR }}/package-lock.json


      # ============================================================
      # 5. VERIFY NODE + JAVASCRIPT
      # ============================================================
      - name: Verify Node and JavaScript
        shell: bash
        run: |
          set -euo pipefail

          node --version
          npm --version

          cd "$RKMS_SOURCE_DIR"

          node --check app.js

          echo "Node.js and app.js syntax verified."


      # ============================================================
      # 6. VERIFY CAPACITOR VERSIONS
      # ============================================================
      - name: Verify Capacitor versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          node <<'NODE'
          const p = require("./package.json");

          const expected = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          for (const [name, version] of Object.entries(expected)) {
            const actual =
              (p.dependencies && p.dependencies[name]) ||
              (p.devDependencies && p.devDependencies[name]);

            if (!actual || !actual.includes(version)) {
              console.error(
                `${name}: expected ${version}, found ${actual}`
              );
              process.exit(1);
            }

            console.log(`${name}: ${actual}`);
          }

          console.log("Capacitor versions verified.");
          NODE


      # ============================================================
      # 7. NPM INSTALL
      # ============================================================
      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          npm ci --no-audit --no-fund


      # ============================================================
      # 8. VERIFY PROFESSIONAL CHAT UI
      # ============================================================
      - name: Verify professional Chat UI
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          test -s styles.css

          grep -q "\.wa-chat-screen" styles.css || {
            echo "::error::wa-chat-screen CSS not found."
            exit 1
          }

          grep -q "\.wa-chat-list" styles.css || {
            echo "::error::wa-chat-list CSS not found."
            exit 1
          }

          grep -q "\.wa-chat-row" styles.css || {
            echo "::error::wa-chat-row CSS not found."
            exit 1
          }

          grep -q "\.wa-avatar-wrap" styles.css || {
            echo "::error::Chat avatar CSS not found."
            exit 1
          }

          grep -q "\.wa-chat-search" styles.css || {
            echo "::error::Chat search CSS not found."
            exit 1
          }

          grep -q "\.wa-filters" styles.css || {
            echo "::error::Chat filters CSS not found."
            exit 1
          }

          echo
          echo "=============================================="
          echo " PROFESSIONAL CHAT UI VERIFICATION: PASS"
          echo "=============================================="
          echo


      # ============================================================
      # 9. VERIFY CHAT SCROLL / FOOTER LAYOUT
      # ============================================================
      - name: Verify Chat scroll and footer layout
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          echo "Checking Chat layout..."

          grep -q "overflow-y:[[:space:]]*auto" styles.css || {
            echo "::error::Scrollable Chat container not found."
            exit 1
          }

          grep -q "100dvh" styles.css || {
            echo "::error::Mobile dynamic viewport handling not found."
            exit 1
          }

          grep -q "wa-chat-list" styles.css || {
            echo "::error::Chat list layout missing."
            exit 1
          }

          grep -q "wa-chat-screen" styles.css || {
            echo "::error::Chat screen layout missing."
            exit 1
          }

          echo "Chat scroll/footer layout verification passed."


      # ============================================================
      # 10. WEB BUILD
      # ============================================================
      - name: Build RKMS web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          npm run build

          test -d dist
          test -s dist/index.html

          echo "RKMS web build successful."


      # ============================================================
      # 11. JAVA 17
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle


      # ============================================================
      # 12. VERIFY JAVA
      # ============================================================
      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail

          java -version


      # ============================================================
      # 13. ANDROID SDK API 36
      # ============================================================
      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses >/dev/null 2>&1 || true

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          echo "Android SDK installed."


      # ============================================================
      # 14. VERIFY ANDROID SDK
      # ============================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d \
            "${ANDROID_HOME}/platforms/android-${ANDROID_API}"

          test -d \
            "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}"

          "${ANDROID_HOME}/platform-tools/adb" version

          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt" version

          echo "Android API ${ANDROID_API} verified."


      # ============================================================
      # 15. CREATE CAPACITOR ANDROID
      # ============================================================
      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          rm -rf android

          npx cap add android

          test -d android
          test -f android/gradlew
          test -f android/app/build.gradle

          chmod +x android/gradlew

          echo "Android project created successfully."


      # ============================================================
      # 16. CONFIGURE ANDROID 16 API 36
      # ============================================================
      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          chmod +x scripts/configure-android-16.sh

          ./scripts/configure-android-16.sh

          test -f android/gradlew

          chmod +x android/gradlew

          echo "Android 16/API 36 configuration applied."


      # ============================================================
      # 17. VERIFY ANDROID CONFIGURATION
      # ============================================================
      - name: Verify Android configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          grep -R "compileSdk.*36" android >/dev/null || {
            echo "::error::compileSdk 36 not found."
            exit 1
          }

          grep -R "targetSdk.*36" android >/dev/null || {
            echo "::error::targetSdk 36 not found."
            exit 1
          }

          grep -R "8.9.1" android >/dev/null || {
            echo "::error::AGP 8.9.1 not found."
            exit 1
          }

          grep -q "gradle-8.11.1" \
            android/gradle/wrapper/gradle-wrapper.properties || {
              echo "::error::Gradle 8.11.1 not configured."
              exit 1
            }

          echo "Android 16/API 36 configuration verified."


      # ============================================================
      # 18. CAPACITOR SYNC
      # ============================================================
      - name: Capacitor sync
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          npx cap sync android

          test -f android/gradlew

          chmod +x android/gradlew

          echo "Capacitor sync completed."


      # ============================================================
      # 19. SETUP RKMS NATIVE AND FIREBASE
      # ============================================================
      - name: Setup RKMS native Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          chmod +x scripts/setup-android-native.sh

          ./scripts/setup-android-native.sh

          test -f android/gradlew

          chmod +x android/gradlew

          echo "RKMS native Android setup completed."


      # ============================================================
      # 20. VERIFY FIREBASE CONFIGURATION
      # ============================================================
      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          test -s google-services.json
          test -s android/app/google-services.json

          node <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync("google-services.json", "utf8")
          );

          const clients = data.client || [];

          const valid = clients.some(client =>
            client.client_info &&
            client.client_info.android_client_info &&
            client.client_info.android_client_info.package_name ===
              "org.rkms.connect"
          );

          if (!valid) {
            console.error(
              "Firebase package org.rkms.connect not found."
            );
            process.exit(1);
          }

          console.log(
            "Firebase package org.rkms.connect verified."
          );
          NODE


      # ============================================================
      # 21. ENSURE FIREBASE DEPENDENCIES
      # ============================================================
      - name: Ensure Firebase dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          FILE="android/app/build.gradle"

          test -f "$FILE"

          python3 <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          bom = "implementation platform('com.google.firebase:firebase-bom:33.9.0')"
          messaging = "implementation 'com.google.firebase:firebase-messaging'"

          if bom not in s or messaging not in s:

              marker = "dependencies {"

              if marker not in s:
                  raise SystemExit(
                      "dependencies block not found"
                  )

              replacement = (
                  marker
                  + "\n    "
                  + bom
                  + "\n    "
                  + messaging
              )

              s = s.replace(
                  marker,
                  replacement,
                  1
              )

              p.write_text(s)

          print("Firebase dependencies ready.")
          PY


      # ============================================================
      # 22. VERIFY FIREBASE INITIALIZATION
      # ============================================================
      - name: Verify Firebase initialization
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          grep -R \
            "FirebaseApp.initializeApp" \
            android/app/src/main/java \
            >/dev/null || {
              echo "::error::FirebaseApp.initializeApp not found."
              exit 1
            }

          echo "Firebase initialization verified."


      # ============================================================
      # 23. VERIFY NATIVE BRIDGE
      # ============================================================
      - name: Verify RKMS native bridge
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          find android/app/src/main/java \
            -name "RKMSNativeBridge.java" \
            -print -quit \
            | grep -q . || {
              echo "::error::RKMSNativeBridge.java missing."
              exit 1
            }

          find android/app/src/main/java \
            -name "RKMSSecureCredentialsPlugin.java" \
            -print -quit \
            | grep -q . || {
              echo "::error::RKMSSecureCredentialsPlugin.java missing."
              exit 1
            }

          echo "RKMS native bridge verified."


      # ============================================================
      # 24. VERIFY BIOMETRIC
      # ============================================================
      - name: Verify biometric dependency
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          grep -R \
            "androidx.biometric:biometric" \
            android >/dev/null || {
              echo "::error::Biometric dependency missing."
              exit 1
            }

          echo "Biometric dependency verified."


      # ============================================================
      # 25. VERIFY LAUNCHER ICONS
      # ============================================================
      - name: Verify RKMS launcher icons
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          COUNT="$(
            find android/app/src/main/res \
              -type f \
              \( \
                -name "ic_launcher*" \
                -o \
                -name "ic_launcher_round*" \
              \) \
              | wc -l
          )"

          if [[ "$COUNT" -lt 1 ]]; then
            echo "::error::RKMS launcher icon missing."
            exit 1
          fi

          echo "Launcher icons found: $COUNT"


      # ============================================================
      # 26. CHECK RELEASE SIGNING SECRETS
      # ============================================================
      - name: Verify release signing secrets
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${RKMS_KEYSTORE_BASE64:-}" ]]; then
            echo "::error::RKMS_KEYSTORE_BASE64 is missing or empty."
            exit 1
          fi

          if [[ -z "${RKMS_KEYSTORE_PASSWORD:-}" ]]; then
            echo "::error::RKMS_KEYSTORE_PASSWORD is missing or empty."
            exit 1
          fi

          if [[ -z "${RKMS_KEY_ALIAS:-}" ]]; then
            echo "::error::RKMS_KEY_ALIAS is missing or empty."
            exit 1
          fi

          if [[ -z "${RKMS_KEY_PASSWORD:-}" ]]; then
            echo "::error::RKMS_KEY_PASSWORD is missing or empty."
            exit 1
          fi

          echo "All release signing secrets are present."


      # ============================================================
      # 27. CONFIGURE RELEASE SIGNING
      # ============================================================
      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          chmod +x scripts/configure-release-signing.sh

          ./scripts/configure-release-signing.sh

          test -s android/app/release.keystore

          echo "Release keystore created."


      # ============================================================
      # 28. VALIDATE KEYSTORE
      # ============================================================
      - name: Validate release keystore
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          keytool \
            -list \
            -keystore android/app/release.keystore \
            -storepass "$RKMS_KEYSTORE_PASSWORD" \
            -alias "$RKMS_KEY_ALIAS" \
            >/dev/null

          echo "Release keystore/password/alias verified."


      # ============================================================
      # 29. VERIFY SIGNING CONFIGURATION
      # ============================================================
      - name: Verify release signing configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          grep -q "signingConfigs" android/app/build.gradle
          grep -q "signingConfigs.release" android/app/build.gradle
          grep -q "storeFile" android/app/build.gradle
          grep -q "storePassword" android/app/build.gradle
          grep -q "keyAlias" android/app/build.gradle
          grep -q "keyPassword" android/app/build.gradle

          echo "Release signing configuration verified."


      # ============================================================
      # 30. VERIFY GRADLE WRAPPER
      # ============================================================
      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR/android"

          chmod +x gradlew

          ./gradlew --version

          ./gradlew --version \
            | grep -q "8.11.1" || {
              echo "::error::Gradle 8.11.1 expected."
              exit 1
            }

          echo "Gradle wrapper verified."


      # ============================================================
      # 31. VERIFY FIREBASE COMPILE CLASSPATH
      # ============================================================
      - name: Verify Firebase compile classpath
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR/android"

          ./gradlew \
            :app:dependencies \
            --configuration releaseCompileClasspath \
            --no-daemon \
            > ../firebase-dependencies.txt

          grep -q "firebase-messaging" \
            ../firebase-dependencies.txt || {
              echo "::error::firebase-messaging missing."
              exit 1
            }

          echo "Firebase Messaging compile dependency verified."


      # ============================================================
      # 32. BUILD FINAL RELEASE APK ONLY
      #
      # IMPORTANT:
      # NO DEBUG
      # NO AAB
      # ONLY RELEASE APK
      # ============================================================
      - name: Build Final Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR/android"

          ./gradlew \
            assembleRelease \
            --no-daemon \
            --stacktrace

          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"

          test -s "$RELEASE_APK"

          echo
          echo "=============================================="
          echo " FINAL RELEASE APK BUILD SUCCESS"
          echo "=============================================="
          echo

          ls -lh "$RELEASE_APK"


      # ============================================================
      # 33. VERIFY RELEASE APK PACKAGE ID
      # ============================================================
      - name: Verify Release APK package ID
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          AAPT="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt"

          "$AAPT" dump badging \
            android/app/build/outputs/apk/release/app-release.apk \
            | grep -q \
            "package: name='org.rkms.connect'" || {
              echo "::error::Wrong package ID."
              exit 1
            }

          echo "Package ID verified: org.rkms.connect"


      # ============================================================
      # 34. VERIFY RELEASE APK SIGNATURE
      # ============================================================
      - name: Verify Release APK signature
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          APKSIGNER="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner"

          "$APKSIGNER" verify --verbose \
            android/app/build/outputs/apk/release/app-release.apk

          echo "Release APK signature verified."


      # ============================================================
      # 35. VERIFY RELEASE APK CONTENT
      # ============================================================
      - name: Verify Release APK content
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          APK="android/app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"

          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt" \
            dump badging "$APK" \
            | grep -q "targetSdkVersion:'36'" || {
              echo "::error::Release APK target SDK is not 36."
              exit 1
            }

          echo "Release APK content verified."


      # ============================================================
      # 36. PREPARE FINAL RELEASE APK
      # ============================================================
      - name: Prepare final Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          rm -rf release
          mkdir -p release

          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          echo "Final Release APK prepared."


      # ============================================================
      # 37. GENERATE SHA256
      # ============================================================
      - name: Generate SHA256 checksum
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR/release"

          sha256sum \
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk \
            > RKMS_ANDROID16_API36_SHA256.txt

          echo
          echo "===== SHA256 ====="

          cat RKMS_ANDROID16_API36_SHA256.txt


      # ============================================================
      # 38. FINAL ARTIFACT CHECK
      # ============================================================
      - name: Final artifact check
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          test -s \
            release/RKMS_ANDROID16_API36_SHA256.txt

          echo
          echo "=============================================="
          echo " RKMS FINAL RELEASE APK READY"
          echo "=============================================="
          echo
          echo "Release APK: YES"
          echo "AAB: NO"
          echo "Debug APK: NO"
          echo "Chat UI: VERIFIED"
          echo "Chat Scroll: VERIFIED"
          echo "Footer Layout: VERIFIED"
          echo "Firebase: VERIFIED"
          echo "Native Bridge: VERIFIED"
          echo "Saved Login: INCLUDED"
          echo "Android API 36: VERIFIED"
          echo "Package: org.rkms.connect"
          echo

          ls -lh release/


      # ============================================================
      # 39. UPLOAD FINAL RELEASE APK ONLY
      # ============================================================
      - name: Upload final Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-ANDROID16-API36-FINAL-RELEASE-APK
          path: |
            ${{ env.RKMS_SOURCE_DIR }}/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            ${{ env.RKMS_SOURCE_DIR }}/release/RKMS_ANDROID16_API36_SHA256.txt
          if-no-files-found: error
          retention-days: 30

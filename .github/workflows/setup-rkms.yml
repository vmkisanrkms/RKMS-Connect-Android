name: RKMS Android 16 API 36 - Final Signed Release APK Only

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  APP_ID: "org.rkms.connect"
  SOURCE_ZIP: "RKMS_CONNECT_FINAL_AUDITED_RELEASE_APK_BUILD_20260922.zip"

jobs:
  build:
    name: RKMS Final Signed Release APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. NODE 22
      # No npm cache because package-lock.json is inside ZIP
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}


      # ============================================================
      # 3. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # ============================================================
      # 4. HOST PACKAGES
      # ============================================================

      - name: Install required host packages
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y unzip rsync

          echo "HOST PACKAGES: PASS"


      # ============================================================
      # 5. VERIFY SOURCE ZIP
      # ============================================================

      - name: Locate and verify RKMS source ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s "$SOURCE_ZIP" ]; then
            echo "::error::Source ZIP not found:"
            echo "$SOURCE_ZIP"

            echo "ZIP FILES IN REPOSITORY:"

            find . \
              -maxdepth 4 \
              -type f \
              -name "*.zip" \
              -not -path "./.git/*" \
              -print \
              | sort

            exit 1
          fi

          echo "=============================================="
          echo "RKMS SOURCE ZIP"
          echo "=============================================="

          echo "$SOURCE_ZIP"

          sha256sum "$SOURCE_ZIP"

          echo "=============================================="


      # ============================================================
      # 6. EXTRACT ZIP
      # ============================================================

      - name: Extract RKMS source ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf rkms-build
          mkdir -p rkms-build

          unzip -q "$SOURCE_ZIP" -d rkms-build

          echo "ZIP EXTRACTION: PASS"

          echo "TOP LEVEL CONTENT:"

          find rkms-build \
            -maxdepth 2 \
            -type f \
            -print \
            | sort \
            | head -n 100


      # ============================================================
      # 7. FIND PROJECT ROOT
      # ============================================================

      - name: Find RKMS project root
        shell: bash
        run: |
          set -euo pipefail

          ROOT=""

          if [ -f "rkms-build/final_audit_src/package.json" ]; then
            ROOT="rkms-build/final_audit_src"

          elif [ -f "rkms-build/package.json" ]; then
            ROOT="rkms-build"

          else
            PACKAGE_FILE="$(
              find rkms-build \
                -type f \
                -name "package.json" \
                -not -path "*/node_modules/*" \
                -print \
                | head -n 1 \
                || true
            )"

            if [ -n "$PACKAGE_FILE" ]; then
              ROOT="$(dirname "$PACKAGE_FILE")"
            fi
          fi

          if [ -z "$ROOT" ]; then
            echo "::error::package.json not found inside ZIP."

            find rkms-build \
              -maxdepth 6 \
              -type f \
              -print \
              | sort

            exit 1
          fi

          echo "RKMS_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "=============================================="
          echo "RKMS PROJECT ROOT"
          echo "=============================================="
          echo "$ROOT"
          echo "=============================================="


      # ============================================================
      # 8. VERIFY ZIP STRUCTURE
      # ============================================================

      - name: Verify RKMS ZIP source structure
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          REQUIRED_FILES="
          package.json
          package-lock.json
          app.js
          index.html
          styles.css
          capacitor.config.json
          google-services.json
          scripts/setup-android-native.sh
          scripts/configure-android-16.sh
          scripts/configure-release-signing.sh
          "

          for FILE in $REQUIRED_FILES; do
            if [ ! -s "$FILE" ]; then
              echo "::error::Required file missing: $FILE"
              exit 1
            fi
          done

          node --check app.js

          echo "SOURCE STRUCTURE: PASS"


      # ============================================================
      # 9. CAPACITOR VERSION CHECK
      # ============================================================

      - name: Verify Capacitor versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node -e '
          const fs = require("fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const deps = {
            ...(pkg.dependencies || {}),
            ...(pkg.devDependencies || {})
          };

          const required = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          let failed = false;

          for (const [name, wanted] of Object.entries(required)) {
            const actual = deps[name];

            console.log(
              name + ": " + (actual || "MISSING")
            );

            if (actual !== wanted) {
              failed = true;
            }
          }

          if (failed) {
            process.exit(1);
          }

          console.log("CAPACITOR VERSION CHECK: PASS");
          '


      # ============================================================
      # 10. FIREBASE PACKAGE CHECK
      # ============================================================

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node -e '
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync("google-services.json", "utf8")
          );

          const found = (data.client || []).some(
            client =>
              client.client_info &&
              client.client_info.android_client_info &&
              client.client_info.android_client_info.package_name ===
              "org.rkms.connect"
          );

          if (!found) {
            throw new Error(
              "google-services.json does not contain org.rkms.connect"
            );
          }

          console.log("FIREBASE PACKAGE CHECK: PASS");
          '


      # ============================================================
      # 11. AUDIT SCRIPT DISCOVERY
      # ============================================================

      - name: Verify ZIP audit scripts
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          COUNT=0

          for AUDIT in scripts/verify-*.py; do
            if [ -f "$AUDIT" ]; then
              echo "FOUND: $AUDIT"
              COUNT=$((COUNT + 1))
            fi
          done

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No verify-*.py audit scripts found."
            exit 1
          fi

          echo "AUDIT SCRIPT COUNT: $COUNT"
          echo "AUDIT SCRIPT DISCOVERY: PASS"


      # ============================================================
      # 12. RUN ZIP AUDITS
      # ============================================================

      - name: Run ZIP static audits
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          for AUDIT in scripts/verify-*.py; do
            echo ""
            echo "=============================================="
            echo "RUNNING: $AUDIT"
            echo "=============================================="

            python3 "$AUDIT"
          done

          echo ""
          echo "ALL ZIP STATIC AUDITS: PASS"


      # ============================================================
      # 13. NPM
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm ci \
            --no-audit \
            --no-fund

          echo "NPM INSTALL: PASS"


      # ============================================================
      # 14. WEB BUILD
      # ============================================================

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm run build

          test -s dist/index.html

          echo "WEB BUILD: PASS"


      # ============================================================
      # 15. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ============================================================
      # 16. API 36
      # ============================================================

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --licenses \
            >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK root not found."
            exit 1
          fi

          test -x \
            "$SDK_ROOT/build-tools/$BUILD_TOOLS/aapt"

          test -x \
            "$SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner"

          echo "ANDROID API 36: PASS"
          echo "BUILD TOOLS 36.0.0: PASS"


      # ============================================================
      # 17. CREATE ANDROID
      # ============================================================

      - name: Create Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          rm -rf android

          npx cap add android

          test -s android/gradlew
          test -s android/app/build.gradle

          echo "CAPACITOR ANDROID PROJECT: PASS"


      # ============================================================
      # 18. ANDROID 16 CONFIG
      # ============================================================

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/configure-android-16.sh

          bash -n \
            scripts/configure-android-16.sh

          ./scripts/configure-android-16.sh

          test -f android/variables.gradle

          grep -Eq \
            'compileSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

          grep -Eq \
            'targetSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

          grep -Fq \
            'com.android.tools.build:gradle:8.9.1' \
            android/build.gradle

          grep -Fq \
            'gradle-8.11.1-bin.zip' \
            android/gradle/wrapper/gradle-wrapper.properties

          echo "ANDROID 16/API 36 CONFIGURATION: PASS"


      # ============================================================
      # 19. CAPACITOR SYNC
      # ============================================================

      - name: Capacitor sync
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npx cap sync android

          echo "CAPACITOR SYNC: PASS"


      # ============================================================
      # 20. NATIVE SCRIPT SYNTAX
      # ============================================================

      - name: Verify RKMS native setup script
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/setup-android-native.sh

          bash -n \
            scripts/setup-android-native.sh

          echo "NATIVE SETUP SCRIPT SYNTAX: PASS"


      # ============================================================
      # 21. NATIVE SETUP
      # ============================================================

      - name: Configure RKMS native Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          ./scripts/setup-android-native.sh

          echo "RKMS NATIVE SETUP: PASS"


      # ============================================================
      # 22. FIREBASE COPY
      # ============================================================

      - name: Install Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          cp -f \
            google-services.json \
            android/app/google-services.json

          test -s \
            android/app/google-services.json

          grep -Fq \
            "org.rkms.connect" \
            android/app/google-services.json

          echo "FIREBASE CONFIGURATION: PASS"


      # ============================================================
      # 23. FIREBASE GRADLE
      # ============================================================

      - name: Configure Firebase Gradle dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          APP_GRADLE="android/app/build.gradle"

          if ! grep -Fq \
            "com.google.gms.google-services" \
            "$APP_GRADLE"
          then
            printf '\napply plugin: "com.google.gms.google-services"\n' \
              >> "$APP_GRADLE"
          fi

          if ! grep -Fq \
            "com.google.firebase:firebase-bom" \
            "$APP_GRADLE"
          then
            sed -i \
              '/dependencies {/a\    implementation platform("com.google.firebase:firebase-bom:34.19.0")' \
              "$APP_GRADLE"
          fi

          if ! grep -Fq \
            "com.google.firebase:firebase-messaging" \
            "$APP_GRADLE"
          then
            sed -i \
              '/dependencies {/a\    implementation "com.google.firebase:firebase-messaging"' \
              "$APP_GRADLE"
          fi

          if ! grep -Fq \
            "androidx.credentials:credentials:1.5.0" \
            "$APP_GRADLE"
          then
            sed -i \
              '/dependencies {/a\    implementation "androidx.credentials:credentials:1.5.0"' \
              "$APP_GRADLE"
          fi

          if ! grep -Fq \
            "androidx.credentials:credentials-play-services-auth:1.5.0" \
            "$APP_GRADLE"
          then
            sed -i \
              '/dependencies {/a\    implementation "androidx.credentials:credentials-play-services-auth:1.5.0"' \
              "$APP_GRADLE"
          fi

          if ! grep -Fq \
            "androidx.biometric:biometric:1.1.0" \
            "$APP_GRADLE"
          then
            sed -i \
              '/dependencies {/a\    implementation "androidx.biometric:biometric:1.1.0"' \
              "$APP_GRADLE"
          fi

          grep -Fq \
            "firebase-messaging" \
            "$APP_GRADLE"

          grep -Fq \
            "androidx.biometric:biometric:1.1.0" \
            "$APP_GRADLE"

          echo "FIREBASE GRADLE CONFIGURATION: PASS"


      # ============================================================
      # 24. FIREBASE INITIALIZATION
      # ============================================================

      - name: Verify Firebase initialization
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          MAIN="$(
            find android/app/src/main \
              -type f \
              -name "MainActivity.java" \
              -print \
              | head -n 1 \
              || true
          )"

          if [ -z "$MAIN" ]; then
            echo "::error::MainActivity.java not found."
            exit 1
          fi

          if ! grep -Fq \
            "FirebaseApp.initializeApp" \
            "$MAIN"
          then
            if grep -Fq \
              "super.onCreate(savedInstanceState);" \
              "$MAIN"
            then

              sed -i \
                '/super.onCreate(savedInstanceState);/a\        com.google.firebase.FirebaseApp.initializeApp(this);' \
                "$MAIN"

            else
              echo "::error::Cannot locate MainActivity onCreate marker."
              exit 1
            fi
          fi

          grep -Fq \
            "FirebaseApp.initializeApp" \
            "$MAIN"

          echo "FIREBASE INITIALIZATION: PASS"


      # ============================================================
      # 25. NATIVE BRIDGE
      # ============================================================

      - name: Verify RKMS native bridge
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          BRIDGE="$(
            find android/app/src/main \
              -type f \
              -name "RKMSNativeBridge.java" \
              -print \
              | head -n 1 \
              || true
          )"

          if [ -z "$BRIDGE" ]; then
            echo "::error::RKMSNativeBridge.java not found."
            exit 1
          fi

          grep -Fq \
            "AndroidKeyStore" \
            "$BRIDGE"

          grep -Fq \
            "CredentialManager" \
            "$BRIDGE"

          echo "RKMS NATIVE BRIDGE: PASS"
          echo "ANDROID KEYSTORE: PASS"
          echo "CREDENTIAL MANAGER: PASS"


      # ============================================================
      # 26. MANIFEST
      # ============================================================

      - name: Verify Android permissions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          test -s "$MANIFEST"

          grep -Fq \
            "android.permission.RECORD_AUDIO" \
            "$MANIFEST"

          grep -Fq \
            "android.permission.POST_NOTIFICATIONS" \
            "$MANIFEST"

          echo "RECORD_AUDIO: PASS"
          echo "POST_NOTIFICATIONS: PASS"


      # ============================================================
      # 27. GENERATED ANDROID AUDITS
      # ============================================================

      - name: Run generated Android audits
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          for AUDIT in \
            scripts/verify-android-16.py \
            scripts/verify-android-pdf.py \
            scripts/verify-native-bridge.py \
            scripts/verify-fcm-pipeline.py \
            scripts/verify-rkms-final-fixes.py \
            scripts/verify-saved-login.py
          do

            if [ -f "$AUDIT" ]; then

              echo ""
              echo "=============================================="
              echo "RUNNING $AUDIT"
              echo "=============================================="

              python3 "$AUDIT"

            fi

          done

          echo "GENERATED ANDROID AUDITS: PASS"


      # ============================================================
      # 28. SIGNING SECRETS
      # ============================================================

      - name: Verify release signing secrets
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "${RKMS_KEYSTORE_BASE64:-}" || {
            echo "::error::RKMS_KEYSTORE_BASE64 is missing."
            exit 1
          }

          test -n "${RKMS_KEYSTORE_PASSWORD:-}" || {
            echo "::error::RKMS_KEYSTORE_PASSWORD is missing."
            exit 1
          }

          test -n "${RKMS_KEY_ALIAS:-}" || {
            echo "::error::RKMS_KEY_ALIAS is missing."
            exit 1
          }

          test -n "${RKMS_KEY_PASSWORD:-}" || {
            echo "::error::RKMS_KEY_PASSWORD is missing."
            exit 1
          }

          echo "RELEASE SIGNING SECRETS: PASS"


      # ============================================================
      # 29. RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/configure-release-signing.sh

          ./scripts/configure-release-signing.sh

          test -s \
            android/app/release.keystore

          grep -Fq \
            'storeFile file("release.keystore")' \
            android/app/build.gradle

          grep -Fq \
            'signingConfig signingConfigs.release' \
            android/app/build.gradle

          echo "RELEASE SIGNING CONFIGURATION: PASS"


      # ============================================================
      # 30. KEYSTORE
      # ============================================================

      - name: Verify release keystore
        shell: bash
        env:
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          keytool \
            -list \
            -keystore android/app/release.keystore \
            -storepass "$RKMS_KEYSTORE_PASSWORD" \
            -alias "$RKMS_KEY_ALIAS" \
            >/dev/null

          echo "KEYSTORE VALIDATION: PASS"


      # ============================================================
      # 31. GRADLE
      # ============================================================

      - name: Verify Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          chmod +x gradlew

          ./gradlew \
            --version \
            --no-daemon

          echo "GRADLE VALIDATION: PASS"


      # ============================================================
      # 32. CLEAN
      # ============================================================

      - name: Clean Android build
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          ./gradlew \
            clean \
            --no-daemon

          echo "ANDROID CLEAN: PASS"


      # ============================================================
      # 33. FINAL SIGNED RELEASE APK
      # ============================================================

      - name: Build Final Signed Release APK Only
        shell: bash
        env:
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          echo "=============================================="
          echo "RKMS FINAL SIGNED RELEASE APK"
          echo "=============================================="

          echo "PACKAGE: ${APP_ID}"
          echo "ANDROID API: ${ANDROID_API}"
          echo "BUILD TOOLS: ${BUILD_TOOLS}"
          echo "SIGNED: YES"
          echo "DEBUG APK: NO"
          echo "AAB: NO"

          echo "=============================================="

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then

            echo "::error::Release APK was not created."

            find app/build/outputs \
              -type f \
              -print \
              | sort

            exit 1
          fi

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"

          echo \
            "APK_PATH=$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk" \
            >> "$GITHUB_ENV"

          echo "FINAL RELEASE APK BUILD: PASS"


      # ============================================================
      # 34. APK VERIFY
      # ============================================================

      - name: Verify APK package and signature
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          AAPT="$SDK_ROOT/build-tools/$BUILD_TOOLS/aapt"
          APKSIGNER="$SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner"

          test -x "$AAPT"
          test -x "$APKSIGNER"

          "$AAPT" \
            dump badging \
            "$APK_PATH" \
            | tee "$GITHUB_WORKSPACE/apk-badging.txt"

          grep -Fq \
            "package: name='$APP_ID'" \
            "$GITHUB_WORKSPACE/apk-badging.txt"

          grep -Fq \
            "targetSdkVersion:'36'" \
            "$GITHUB_WORKSPACE/apk-badging.txt"

          "$APKSIGNER" \
            verify \
            --verbose \
            "$APK_PATH"

          "$APKSIGNER" \
            verify \
            --print-certs \
            "$APK_PATH"

          echo "APK PACKAGE: PASS"
          echo "TARGET SDK 36: PASS"
          echo "APK SIGNATURE: PASS"


      # ============================================================
      # 35. SHA256
      # ============================================================

      - name: Generate APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            "$APK_PATH" \
            | tee \
            "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256"

          echo "SHA256: PASS"


      # ============================================================
      # 36. FINAL APK AUDIT
      # ============================================================

      - name: Final APK-only audit
        shell: bash
        run: |
          set -euo pipefail

          test -s "$APK_PATH"

          test -s \
            "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256"

          if find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.aab" \
            -print \
            | grep -q .
          then
            echo "::error::AAB detected."
            exit 1
          fi

          if find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "*debug*.apk" \
            -print \
            | grep -q .
          then
            echo "::error::Debug APK detected."
            exit 1
          fi

          SIZE="$(
            stat \
              -c%s \
              "$APK_PATH"
          )"

          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::APK size unexpectedly small."
            exit 1

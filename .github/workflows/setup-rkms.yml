name: RKMS Android 16 API 36 - RELEASE APK ONLY

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: RKMS Android 16 / API 36 - Release APK
    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. EXTRACT V21 SOURCE
      # ==========================================================

      - name: Extract V21 RKMS source
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE="RKMS_CONNECT_V21_FULL_AUDITED_COMPLAINT_AND_LOGO_APK_FIRST.zip"

          echo "Checking V21 source package..."

          test -f "$PACKAGE"

          rm -rf .rkms_extract
          mkdir -p .rkms_extract

          unzip -q "$PACKAGE" -d .rkms_extract

          SOURCE_DIR=".rkms_extract/rkms_android"

          test -d "$SOURCE_DIR"

          cp -a "$SOURCE_DIR"/. .

          rm -rf .rkms_extract

          echo "Checking RKMS project..."

          test -f package.json
          test -f capacitor.config.json
          test -f index.html
          test -f app.js
          test -f styles.css
          test -f google-services.json

          echo "V21 source verified."


      # ==========================================================
      # 3. NODE 22
      # ==========================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Node.js
        run: |
          node --version
          npm --version


      # ==========================================================
      # 4. NPM
      # ==========================================================

      - name: Install npm dependencies
        run: |
          npm install --no-audit --no-fund


      # ==========================================================
      # 5. JDK 17
      # ==========================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify JDK
        run: |
          java -version
          javac -version


      # ==========================================================
      # 6. ANDROID SDK API 36
      # ==========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android 16 API 36
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify Android 16 SDK
        shell: bash
        run: |
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

          echo "Android Platform 36: PASS"
          echo "Build Tools 36.0.0: PASS"


      # ==========================================================
      # 7. CAPACITOR
      # ==========================================================

      - name: Verify Capacitor
        run: |
          npm ls @capacitor/core --depth=0
          npm ls @capacitor/android --depth=0
          npm ls @capacitor/app --depth=0
          npm ls @capacitor/push-notifications --depth=0


      # ==========================================================
      # 8. WEB BUILD
      # ==========================================================

      - name: Build RKMS web application
        run: |
          npm run build

      - name: Verify web build
        run: |
          test -d dist
          test -f dist/index.html

          echo "Web build PASS."


      # ==========================================================
      # 9. CREATE ANDROID PROJECT
      # ==========================================================

      - name: Add Capacitor Android
        run: |
          npx cap add android

      - name: Verify Android project
        run: |
          test -d android
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle
          test -f android/gradlew

          echo "Android project PASS."


      # ==========================================================
      # 10. FIREBASE
      # ==========================================================

      - name: Install Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          test -f google-services.json

          cp google-services.json \
             android/app/google-services.json

          test -f android/app/google-services.json

          echo "Firebase configuration PASS."


      # ==========================================================
      # 11. ANDROID 16 CONFIGURATION
      # ==========================================================

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          chmod +x scripts/configure-android-16.sh
          bash scripts/configure-android-16.sh


      # ==========================================================
      # 12. CAPACITOR SYNC
      # ==========================================================

      - name: Capacitor sync
        run: |
          npx cap sync android


      # ==========================================================
      # 13. RKMS NATIVE ANDROID SETUP
      # ==========================================================

      - name: Setup RKMS native Android
        shell: bash
        run: |
          chmod +x scripts/setup-android-native.sh
          bash scripts/setup-android-native.sh


      # ==========================================================
      # 14. VERIFY ANDROID 16
      # ==========================================================

      - name: Verify Android 16
        run: |
          python3 scripts/verify-android-16.py


      # ==========================================================
      # 15. VERIFY PDF
      # ==========================================================

      - name: Verify Android PDF pipeline
        run: |
          python3 scripts/verify-android-pdf.py


      # ==========================================================
      # 16. VERIFY NATIVE BRIDGE
      # ==========================================================

      - name: Verify native bridge
        run: |
          python3 scripts/verify-native-bridge.py


      # ==========================================================
      # 17. VERIFY FCM
      # ==========================================================

      - name: Verify FCM pipeline
        run: |
          python3 scripts/verify-fcm-pipeline.py


      # ==========================================================
      # 18. VERIFY SAVED LOGIN
      # ==========================================================

      - name: Verify saved login
        run: |
          python3 scripts/verify-saved-login.py


      # ==========================================================
      # 19. VERIFY CORE RKMS
      # ==========================================================

      - name: Verify final RKMS application
        run: |
          python3 scripts/verify-rkms-final.py


      # ==========================================================
      # 20. VERIFY COMPLAINT
      # ==========================================================

      - name: Verify complaint workflow
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking complaint Close/Reopen functions..."

          grep -q "memberCloseComplaint" app.js
          grep -q "memberReopenComplaint" app.js
          grep -q "officerCloseComplaint" app.js

          echo "Member Close: PASS"
          echo "Member Reopen: PASS"
          echo "PDA Officer Close: PASS"


      # ==========================================================
      # 21. VERIFY ORIGINAL RKMS LAUNCHER
      # ==========================================================

      - name: Verify RKMS launcher assets
        shell: bash
        run: |
          set -euo pipefail

          test -f assets/rkms-launcher-original-transparent.png

          test -f android_launcher_icons/mipmap-mdpi/ic_launcher.png
          test -f android_launcher_icons/mipmap-hdpi/ic_launcher.png
          test -f android_launcher_icons/mipmap-xhdpi/ic_launcher.png
          test -f android_launcher_icons/mipmap-xxhdpi/ic_launcher.png
          test -f android_launcher_icons/mipmap-xxxhdpi/ic_launcher.png

          echo "RKMS launcher assets: PASS"


      # ==========================================================
      # 22. CHECK X LOGO REFERENCES
      # ==========================================================

      - name: Verify no X Twitter logo references
        shell: bash
        run: |
          set -euo pipefail

          if grep -RniE \
            "twitter\.com|x\.com/" \
            app.js index.html styles.css assets scripts \
            --exclude="*.map" \
            2>/dev/null; then

            echo "ERROR: X/Twitter reference found."
            exit 1
          fi

          echo "No X/Twitter reference found."


      # ==========================================================
      # 23. PREPARE RELEASE KEYSTORE
      # ==========================================================

      - name: Check release signing
        id: signing
        shell: bash
        run: |
          if [ -n "${RKMS_KEYSTORE_BASE64:-}" ] && \
             [ -n "${RKMS_KEYSTORE_PASSWORD:-}" ] && \
             [ -n "${RKMS_KEY_ALIAS:-}" ] && \
             [ -n "${RKMS_KEY_PASSWORD:-}" ]; then

            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Release signing configuration detected."

          else

            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured."

          fi


      - name: Decode release keystore
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$RKMS_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/release.keystore

          chmod 600 android/app/release.keystore

          test -s android/app/release.keystore

          echo "Keystore PASS."


      # ==========================================================
      # 24. CONFIGURE RELEASE SIGNING
      # ==========================================================

      - name: Configure release signing
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          start_marker = "// RKMS WORKFLOW RELEASE SIGNING START"
          end_marker = "// RKMS WORKFLOW RELEASE SIGNING END"

          if start_marker in text and end_marker in text:
              start = text.index(start_marker)
              end = text.index(end_marker) + len(end_marker)
              text = text[:start] + text[end:]

          block = r'''
          // RKMS WORKFLOW RELEASE SIGNING START
          android {
              signingConfigs {
                  rkmsProduction {
                      storeFile file("release.keystore")
                      storePassword System.getenv("RKMS_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("RKMS_KEY_ALIAS")
                      keyPassword System.getenv("RKMS_KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.rkmsProduction
                  }
              }
          }
          // RKMS WORKFLOW RELEASE SIGNING END
          '''

          path.write_text(text + "\n" + block + "\n")

          print("Release signing configured.")
          PY

          grep -n "rkmsProduction" android/app/build.gradle


      # ==========================================================
      # 25. UNSIGNED FALLBACK
      # ==========================================================

      - name: Remove invalid release signing
        if: steps.signing.outputs.enabled != 'true'
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          start_marker = "// RKMS WORKFLOW RELEASE SIGNING START"
          end_marker = "// RKMS WORKFLOW RELEASE SIGNING END"

          if start_marker in text and end_marker in text:
              start = text.index(start_marker)
              end = text.index(end_marker) + len(end_marker)
              text = text[:start] + text[end:]

          text = text.replace(
              "signingConfig signingConfigs.rkmsProduction",
              ""
          )

          path.write_text(text)

          print("Unsigned release configuration prepared.")
          PY


      # ==========================================================
      # 26. GRADLE VERIFY
      # ==========================================================

      - name: Verify Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version


      # ==========================================================
      # 27. CLEAN
      # ==========================================================

      - name: Clean Android
        working-directory: android
        run: |
          ./gradlew clean --no-daemon


      # ==========================================================
      # 28. RELEASE APK ONLY
      # ==========================================================

      - name: Build Release APK ONLY
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace


      # ==========================================================
      # 29. VERIFY APK
      # ==========================================================

      - name: Verify Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"
          test -s "$APK"

          echo
          echo "=============================================="
          echo " RKMS RELEASE APK READY"
          echo "=============================================="
          echo
          echo "Android : 16"
          echo "API     : 36"
          echo "APK     :"
          ls -lh "$APK"
          echo
          echo "=============================================="


      # ==========================================================
      # 30. UPLOAD RELEASE APK
      # ==========================================================

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Android-16-API36-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30


      # ==========================================================
      # 31. FINAL CHECK
      # ==========================================================

      - name: Final APK build summary
        shell: bash
        run: |
          echo
          echo "=================================================="
          echo " RKMS CONNECT V21"
          echo " FULL AUDITED RELEASE APK"
          echo "=================================================="
          echo
          echo "Android Version : 16"
          echo "API Level       : 36"
          echo "JDK             : 17"
          echo "Node.js         : 22"
          echo
          echo "Complaint       : VERIFIED"
          echo "Member Close    : VERIFIED"
          echo "Member Reopen   : VERIFIED"
          echo "PDA Close       : VERIFIED"
          echo "Launcher Logo   : VERIFIED"
          echo "X Logo          : NOT FOUND"
          echo
          echo "AAB BUILD       : DISABLED"
          echo
          echo "RELEASE APK     : SUCCESS"
          echo
          echo "=================================================="

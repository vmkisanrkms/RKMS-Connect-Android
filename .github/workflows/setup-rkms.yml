name: RKMS Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare RKMS source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build
          mkdir -p build

          if [ -f app.js ] && [ -f index.html ] && [ -f config.js ]; then
            echo "Using RKMS source files from repository root"

            rsync -a \
              --exclude='build/' \
              --exclude='android/' \
              --exclude='node_modules/' \
              --exclude='.git/' \
              --exclude='.github/' \
              --exclude='*.zip' \
              ./ build/

          else
            SOURCE_ZIP=""

            for f in \
              RKMS_CONNECT_V9_APP_LOGO_TRANSPARENT_BACK_SPLASH_FIXED_FINAL.zip \
              RKMS_CONNECT_V9_APP_LOGO_TRANSPARENT_FINAL.zip \
              RKMS_CONNECT_APK_BUILD_READY.zip \
              RKMS_CONNECT_V9_APP_NAME_RKMS_LOGO_CLEAR_FINAL.zip; do

              if [ -f "$f" ]; then
                SOURCE_ZIP="$f"
                break
              fi

            done

            if [ -z "$SOURCE_ZIP" ]; then
              SOURCE_ZIP="$(find . -maxdepth 1 -type f -name 'RKMS*.zip' -print -quit | sed 's#^./##')"
            fi

            if [ -z "$SOURCE_ZIP" ]; then
              echo "ERROR: RKMS source not found"
              exit 1
            fi

            echo "Using RKMS source ZIP: $SOURCE_ZIP"

            unzip -t "$SOURCE_ZIP" >/dev/null
            unzip -q "$SOURCE_ZIP" -d build
          fi

          if [ ! -f build/app.js ]; then
            APP_JS="$(find build -type f -name app.js -print -quit)"
            test -n "$APP_JS"

            SOURCE_DIR="$(dirname "$APP_JS")"

            mkdir -p build-source
            rsync -a "$SOURCE_DIR"/ build-source/

            rm -rf build
            mv build-source build
          fi

          test -f build/app.js
          test -f build/index.html
          test -f build/config.js

          test -s build/assets/rkms-logo-transparent.png
          test -s build/assets/rkms-app-icon-transparent.png

          echo "RKMS source verified"
          echo "Transparent organization logo verified"
          echo "Smaller transparent app icon verified"

      - name: Verify JavaScript
        run: |
          node --check build/app.js
          echo "app.js syntax verified"

      - name: Create Capacitor build package
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          cat > package.json <<'JSON'
          {
            "name": "rkms",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "rm -rf dist && mkdir -p dist && rsync -a --exclude='dist/' --exclude='android/' --exclude='node_modules/' --exclude='.git/' --exclude='.github/' --exclude='*.zip' ./ dist/"
            },
            "dependencies": {
              "@capacitor/core": "6.2.2",
              "@capacitor/android": "6.2.2",
              "@capacitor/app": "6.0.3"
            },
            "devDependencies": {
              "@capacitor/cli": "6.2.2"
            }
          }
          JSON

          cat > capacitor.config.json <<'JSON'
          {
            "appId": "org.rkms.connect",
            "appName": "RKMS",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https",
              "cleartext": true
            },
            "android": {
              "allowMixedContent": true,
              "captureInput": true,
              "webContentsDebuggingEnabled": false
            }
          }
          JSON

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor dependencies
        working-directory: build
        run: npm install --no-audit --no-fund

      - name: Build RKMS web application
        working-directory: build
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android platform
        working-directory: build
        run: npx cap add android

      - name: Sync RKMS application
        working-directory: build
        run: npx cap sync android

      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      # =========================================================
      # APPLY SMALL TRANSPARENT APP ICON AFTER CAPACITOR SYNC
      # =========================================================
      - name: Install RKMS app icon
        shell: bash
        run: |
          set -euo pipefail

          LOGO="build/assets/rkms-app-icon-transparent.png"
          RES="build/android/app/src/main/res"

          test -s "$LOGO"

          mkdir -p \
            "$RES/mipmap-mdpi" \
            "$RES/mipmap-hdpi" \
            "$RES/mipmap-xhdpi" \
            "$RES/mipmap-xxhdpi" \
            "$RES/mipmap-xxxhdpi"

          # Use the smaller transparent RKMS icon.
          convert "$LOGO" -resize 48x48! -strip \
            "$RES/mipmap-mdpi/ic_launcher.png"

          convert "$LOGO" -resize 72x72! -strip \
            "$RES/mipmap-hdpi/ic_launcher.png"

          convert "$LOGO" -resize 96x96! -strip \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          convert "$LOGO" -resize 144x144! -strip \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          convert "$LOGO" -resize 192x192! -strip \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"

          cp "$RES/mipmap-mdpi/ic_launcher.png" \
             "$RES/mipmap-mdpi/ic_launcher_round.png"

          cp "$RES/mipmap-hdpi/ic_launcher.png" \
             "$RES/mipmap-hdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xhdpi/ic_launcher.png" \
             "$RES/mipmap-xhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

          # Remove Capacitor adaptive launcher resources.
          rm -rf "$RES/mipmap-anydpi-v26"
          rm -rf "$RES/mipmap-anydpi"

          find "$RES" -type f \( \
            -name 'ic_launcher_foreground.xml' -o \
            -name 'ic_launcher_background.xml' -o \
            -name 'ic_launcher_foreground.png' -o \
            -name 'ic_launcher_background.png' \
          \) -delete || true

          echo "RKMS small transparent app icon installed."

      # =========================================================
      # FORCE MANIFEST TO USE RKMS ICON
      # =========================================================
      - name: Force RKMS launcher icon
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="build/android/app/src/main/AndroidManifest.xml"

          test -s "$MANIFEST"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("build/android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          text = re.sub(
              r'android:icon="[^"]*"',
              'android:icon="@mipmap/ic_launcher"',
              text,
              count=1
          )

          if 'android:roundIcon=' in text:
              text = re.sub(
                  r'android:roundIcon="[^"]*"',
                  'android:roundIcon="@mipmap/ic_launcher_round"',
                  text,
                  count=1
              )
          else:
              text = text.replace(
                  'android:icon="@mipmap/ic_launcher"',
                  'android:icon="@mipmap/ic_launcher" '
                  'android:roundIcon="@mipmap/ic_launcher_round"',
                  1
              )

          path.write_text(text)
          PY

          grep -q 'android:icon="@mipmap/ic_launcher"' "$MANIFEST"
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' "$MANIFEST"

          echo "RKMS launcher icon forced in Android Manifest."

      # =========================================================
      # VERIFY ICON
      # =========================================================
      - name: Verify RKMS launcher icon
        working-directory: build
        run: |
          set -euo pipefail

          RES="android/app/src/main/res"

          for FILE in \
            "$RES/mipmap-mdpi/ic_launcher.png" \
            "$RES/mipmap-hdpi/ic_launcher.png" \
            "$RES/mipmap-xhdpi/ic_launcher.png" \
            "$RES/mipmap-xxhdpi/ic_launcher.png" \
            "$RES/mipmap-xxxhdpi/ic_launcher.png" \
            "$RES/mipmap-mdpi/ic_launcher_round.png" \
            "$RES/mipmap-hdpi/ic_launcher_round.png" \
            "$RES/mipmap-xhdpi/ic_launcher_round.png" \
            "$RES/mipmap-xxhdpi/ic_launcher_round.png" \
            "$RES/mipmap-xxxhdpi/ic_launcher_round.png"
          do
            test -s "$FILE"
            echo "Verified: $FILE"
          done

          echo "FINAL RKMS APP ICON VERIFICATION PASSED"

      - name: Make Gradle executable
        run: chmod +x build/android/gradlew

      - name: Build Debug APK
        working-directory: build/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="build/android/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "RKMS APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-debug-apk
          path: build/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

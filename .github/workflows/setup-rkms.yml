name: RKMS Android 16 API 36 - Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-apk:
    name: RKMS Android 16 / API 36 - Release APK
    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 16 API 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install npm dependencies
        run: |
          npm install --no-audit --no-fund

      - name: Verify JavaScript
        run: |
          node --check app.js

      - name: Build web application
        run: |
          npm run build

      - name: Add Capacitor Android platform
        run: |
          npx cap add android

      - name: Install Firebase configuration
        run: |
          cp google-services.json android/app/google-services.json

      - name: Configure Android 16 API 36
        run: |
          chmod +x scripts/configure-android-16.sh
          bash scripts/configure-android-16.sh

      - name: Capacitor sync Android
        run: |
          npx cap sync android

      - name: Setup RKMS native Android
        run: |
          chmod +x scripts/setup-android-native.sh
          bash scripts/setup-android-native.sh

      - name: Run Android audits
        run: |
          python3 scripts/verify-android-16.py
          python3 scripts/verify-android-pdf.py
          python3 scripts/verify-native-bridge.py
          python3 scripts/verify-rkms-final.py

      - name: Check release signing configuration
        id: signing
        run: |
          if [ -n "${RKMS_KEYSTORE_BASE64:-}" ] && \
             [ -n "${RKMS_KEYSTORE_PASSWORD:-}" ] && \
             [ -n "${RKMS_KEY_ALIAS:-}" ] && \
             [ -n "${RKMS_KEY_PASSWORD:-}" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release keystore
        if: steps.signing.outputs.enabled == 'true'
        run: |
          printf '%s' "$RKMS_KEYSTORE_BASE64" | base64 --decode \
            > android/app/release.keystore
          chmod 600 android/app/release.keystore

      - name: Configure release signing
        if: steps.signing.outputs.enabled == 'true'
        run: |
          chmod +x scripts/configure-release-signing.sh
          bash scripts/configure-release-signing.sh

      - name: Build RELEASE APK ONLY
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean --no-daemon
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify Release APK
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          test -s android/app/build/outputs/apk/release/app-release.apk

      - name: Verify signed APK
        if: steps.signing.outputs.enabled == 'true'
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v6
        with:
          name: RKMS-Android-16-API36-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

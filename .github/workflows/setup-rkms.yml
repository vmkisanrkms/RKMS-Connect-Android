name: RKMS Android 16 API 36 - Final Signed Release APK Only

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  APP_ID: "org.rkms.connect"
  SOURCE_ZIP: "RKMS_CONNECT_FINAL_AUDITED_RELEASE_APK_BUILD_20260922.zip"

jobs:
  build:
    name: RKMS Final Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install required host packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip rsync

      - name: Locate and verify RKMS source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SOURCE_ZIP"
          echo "SOURCE_ZIP=$SOURCE_ZIP"
          sha256sum "$SOURCE_ZIP"

      - name: Extract RKMS source ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf rkms-build
          mkdir -p rkms-build

          unzip -q "$SOURCE_ZIP" -d rkms-build

          if [ -f rkms-build/final_audit_src/package.json ]; then
            ROOT="rkms-build/final_audit_src"
          elif [ -f rkms-build/package.json ]; then
            ROOT="rkms-build"
          else
            PACKAGE_FILE="$(
              find rkms-build \
                -type f \
                -name package.json \
                -not -path '*/node_modules/*' \
                -print \
                | head -n 1 \
                || true
            )

            test -n "$PACKAGE_FILE"

            ROOT="$(dirname "$PACKAGE_FILE")"
          fi

          test -s "$ROOT/package.json"

          echo "RKMS_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "RKMS_ROOT=$ROOT"

      - name: Verify ZIP source structure and versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          test -s package.json
          test -s package-lock.json
          test -s app.js
          test -s index.html
          test -s styles.css
          test -s capacitor.config.json
          test -s google-services.json

          test -s scripts/setup-android-native.sh
          test -s scripts/configure-android-16.sh
          test -s scripts/configure-release-signing.sh

          node --check app.js

          node -e '
          const fs=require("fs");

          const p=JSON.parse(
            fs.readFileSync("package.json","utf8")
          );

          const d={
            ...(p.dependencies||{}),
            ...(p.devDependencies||{})
          };

          const wanted={
            "@capacitor/core":"6.2.2",
            "@capacitor/android":"6.2.2",
            "@capacitor/app":"6.0.3",
            "@capacitor/push-notifications":"6.0.3",
            "@capacitor/cli":"6.2.2"
          };

          for(const [k,v] of Object.entries(wanted)){
            if(d[k]!==v){
              throw new Error(
                `${k}: expected ${v}, found ${d[k]||"MISSING"}`
              );
            }
          }

          if(
            p.scripts?.build !==
            "rm -rf dist && mkdir -p dist && rsync -a --exclude=\"dist/\" --exclude=\"android/\" --exclude=\"node_modules/\" --exclude=\".git/\" --exclude=\".github/\" --exclude=\"*.zip\" ./ dist/"
          ){
            throw new Error("Unexpected build script");
          }

          console.log("PACKAGE/VERSION CHECK: PASS");
          '

          node -e '
          const fs=require("fs");

          const j=JSON.parse(
            fs.readFileSync("google-services.json","utf8")
          );

          const ok=(j.client||[]).some(
            c =>
              c.client_info?.android_client_info?.package_name ===
              "org.rkms.connect"
          );

          if(!ok){
            throw new Error(
              "google-services.json does not contain org.rkms.connect"
            );
          }

          console.log("FIREBASE PACKAGE CHECK: PASS");
          '

      - name: Patch known malformed setup script from ZIP
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          EXPECTED_SETUP_SHA="d8cdb6c16fb4c6ac768a4ca515f42224097a77419ca5bccd9dd38ab990b3e305"

          ACTUAL_SETUP_SHA="$(
            sha256sum scripts/setup-android-native.sh |
            awk '{print $1}'
          )"

          if [ "$ACTUAL_SETUP_SHA" != "$EXPECTED_SETUP_SHA" ]; then
            echo "::error::Unexpected setup-android-native.sh version."
            echo "::error::Refusing unsafe patch."
            echo "Expected: $EXPECTED_SETUP_SHA"
            echo "Actual:   $ACTUAL_SETUP_SHA"
            exit 1
          fi

          sed -n '1,90p' \
            scripts/setup-android-native.sh \
            > /tmp/setup-rkms-fixed.sh

          printf '%s\n' \
            '# CI repair: replace malformed notification block present in the audited ZIP.' \
            'DRAWABLE_DIR="$RES_DIR/drawable"' \
            'mkdir -p "$DRAWABLE_DIR"' \
            'printf '\''%s\n'\'' '\''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">'\'' '\''    <path android:fillColor="#FFFFFFFF" android:pathData="M12,2A7,7 0,0 0,5 9v4l-2,3v1h18v-1l-2,-3V9A7,7 0,0 0,12 2M9,19a3,3 0,0 0,6 0z"/>'\'' '\''</vector>'\'' > "$DRAWABLE_DIR/ic_stat_rkms.xml"' \
            'MANIFEST="android/app/src/main/AndroidManifest.xml"' \
            'if ! grep -Fq '\''android.permission.RECORD_AUDIO'\'' "$MANIFEST"; then' \
            '  sed -i '\''/<application/i\    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'\'' "$MANIFEST"' \
            'fi' \
            'if ! grep -Fq '\''com.google.firebase.messaging.default_notification_channel_id'\'' "$MANIFEST"; then' \
            '  sed -i '\''0,/<application/s//<application android:enableOnBackInvokedCallback="true"/'\'' "$MANIFEST"' \
            '  sed -i '\''/<\/application>/i\    <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="@string/rkms_default_notification_channel_id" />\n    <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_rkms" />'\'' "$MANIFEST"' \
            'fi' \
            >> /tmp/setup-rkms-fixed.sh

          sed -n '118,$p' \
            scripts/setup-android-native.sh \
            >> /tmp/setup-rkms-fixed.sh

          chmod +x /tmp/setup-rkms-fixed.sh

          bash -n /tmp/setup-rkms-fixed.sh

          mv \
            /tmp/setup-rkms-fixed.sh \
            scripts/setup-android-native.sh

          chmod +x scripts/setup-android-native.sh

          bash -n scripts/setup-android-native.sh

          echo "NATIVE SETUP SCRIPT PATCH: PASS"

      - name: Run all ZIP static audits
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          for audit in scripts/verify-*.py; do
            echo "===== $audit ====="
            python3 "$audit"
          done

          echo "ALL ZIP STATIC AUDITS: PASS"

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm ci \
            --no-audit \
            --no-fund

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm run build

          test -s dist/index.html

          echo "WEB BUILD: PASS"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android API 36 and Build Tools 36.0.0
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --licenses \
            >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          test -n "$SDK_ROOT"

          test -x \
            "$SDK_ROOT/build-tools/$BUILD_TOOLS/aapt"

          test -x \
            "$SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner"

          echo "ANDROID SDK/API 36: PASS"

      - name: Generate Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          rm -rf android

          npx cap add android

          test -s android/gradlew
          test -s android/app/build.gradle

          echo "CAPACITOR ANDROID GENERATION: PASS"

      - name: Configure Android 16 API 36 from ZIP script
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/configure-android-16.sh

          ./scripts/configure-android-16.sh

          grep -Eq \
            'compileSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

          grep -Eq \
            'targetSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

          grep -Fq \
            'com.android.tools.build:gradle:8.9.1' \
            android/build.gradle

          grep -Fq \
            'gradle-8.11.1-bin.zip' \
            android/gradle/wrapper/gradle-wrapper.properties

          echo "ANDROID 16/API 36 CONFIGURATION: PASS"

      - name: Sync Capacitor
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npx cap sync android

          echo "CAPACITOR SYNC: PASS"

      - name: Apply RKMS native Android setup
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          ./scripts/setup-android-native.sh

          test -s \
            android/app/google-services.json

          test -s \
            android/app/src/main/java/org/rkms/connect/RKMSNativeBridge.java

          grep -Fq \
            'FirebaseApp.initializeApp' \
            android/app/src/main/java/org/rkms/connect/MainActivity.java

          grep -Fq \
            'RKMSNativeBridge(this, rkmsWebView)' \
            android/app/src/main/java/org/rkms/connect/MainActivity.java

          grep -Fq \
            'android.permission.RECORD_AUDIO' \
            android/app/src/main/AndroidManifest.xml

          grep -Fq \
            'android.permission.POST_NOTIFICATIONS' \
            android/app/src/main/AndroidManifest.xml

          echo "RKMS NATIVE AND FIREBASE SETUP: PASS"

      - name: Verify generated Android source
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 scripts/verify-android-16.py
          python3 scripts/verify-android-pdf.py
          python3 scripts/verify-native-bridge.py
          python3 scripts/verify-fcm-pipeline.py
          python3 scripts/verify-rkms-final-fixes.py
          python3 scripts/verify-saved-login.py

          echo "GENERATED ANDROID STATIC AUDIT: PASS"

      - name: Verify release signing secrets
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "${RKMS_KEYSTORE_BASE64:-}" || {
            echo "::error::RKMS_KEYSTORE_BASE64 secret missing."
            exit 1
          }

          test -n "${RKMS_KEYSTORE_PASSWORD:-}" || {
            echo "::error::RKMS_KEYSTORE_PASSWORD secret missing."
            exit 1
          }

          test -n "${RKMS_KEY_ALIAS:-}" || {
            echo "::error::RKMS_KEY_ALIAS secret missing."
            exit 1
          }

          test -n "${RKMS_KEY_PASSWORD:-}" || {
            echo "::error::RKMS_KEY_PASSWORD secret missing."
            exit 1
          }

          echo "RELEASE SIGNING SECRETS: PASS"

      - name: Configure release signing from ZIP script
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/configure-release-signing.sh

          ./scripts/configure-release-signing.sh

          test -s \
            android/app/release.keystore

          grep -Fq \
            'storeFile file("release.keystore")' \
            android/app/build.gradle

          grep -Fq \
            'signingConfig signingConfigs.release' \
            android/app/build.gradle

          echo "RELEASE SIGNING CONFIGURATION: PASS"

      - name: Verify release keystore
        shell: bash
        env:
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          keytool -list \
            -keystore android/app/release.keystore \
            -storepass "$RKMS_KEYSTORE_PASSWORD" \
            -alias "$RKMS_KEY_ALIAS" \
            >/dev/null

          echo "KEYSTORE VALIDATION: PASS"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          chmod +x gradlew

          ./gradlew \
            --version \
            --no-daemon

      - name: Clean Android build
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          ./gradlew \
            clean \
            --no-daemon

      - name: Build final signed release APK only
        shell: bash
        env:
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"

          echo \
            "APK_PATH=$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk" \
            >> "$GITHUB_ENV"

          echo "FINAL SIGNED RELEASE APK BUILD: PASS"

      - name: Verify final APK package, SDK and signature
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          AAPT="$SDK_ROOT/build-tools/$BUILD_TOOLS/aapt"
          APKSIGNER="$SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner"

          "$AAPT" \
            dump badging \
            "$APK_PATH" \
            | tee "$GITHUB_WORKSPACE/apk-badging.txt"

          grep -Fq \
            "package: name='$APP_ID'" \
            "$GITHUB_WORKSPACE/apk-badging.txt"

          grep -Fq \
            "targetSdkVersion:'36'" \
            "$GITHUB_WORKSPACE/apk-badging.txt"

          "$APKSIGNER" \
            verify \
            --verbose \
            "$APK_PATH"

          "$APKSIGNER" \
            verify \
            --print-certs \
            "$APK_PATH"

          echo "FINAL APK PACKAGE/SIGNATURE: PASS"

      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            "$APK_PATH" \
            | tee \
            "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256"

      - name: Final APK-only audit
        shell: bash
        run: |
          set -euo pipefail

          test -s "$APK_PATH"

          test -s \
            "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256"

          if find "$GITHUB_WORKSPACE" \
            -type f \
            -name '*.aab' \
            -print \
            | grep -q .
          then
            echo "::error::AAB output detected."
            exit 1
          fi

          if find "$GITHUB_WORKSPACE" \
            -type f \
            -name '*debug*.apk' \
            -print \
            | grep -q .
          then
            echo "::error::Debug APK output detected."
            exit 1
          fi

          SIZE="$(
            stat \
              -c%s \
              "$APK_PATH"
          )"

          test "$SIZE" -ge 1000000

          echo "FINAL APK-ONLY AUDIT: PASS"
          echo "APK=$APK_PATH"
          echo "SIZE=$SIZE bytes"

          cat \
            "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256"

      - name: Upload final signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS_ANDROID16_API36_FINAL_SIGNED_RELEASE_APK
          if-no-files-found: error
          path: |
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256
          retention-days: 30

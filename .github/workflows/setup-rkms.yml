name: Build RKMS Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_SOURCE_COMMIT: cf252628308e5a6ecc9eafbaf4ca227a3ad8ec92
  WEBSITE_ZIP_NAME: RKMS_CONNECT_V9_REPORT_VIEW_PDF_FIXED_2026-09-07.zip
  GRADLE_VERSION: "8.9"

jobs:
  build:
    name: Build RKMS Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # =====================================================
      # 1. BASIC SETUP
      # =====================================================
      - name: Checkout RKMS
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      # =====================================================
      # 2. PREPARE VERIFIED ANDROID SOURCE
      # =====================================================
      - name: Prepare Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$RUNNER_TEMP/rkms-android"

          git clone \
            --no-tags \
            --filter=blob:none \
            https://github.com/vmkisanrkms/RKMS-Connect-Android.git \
            "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          git fetch \
            --no-tags \
            --depth 1 \
            origin "$ANDROID_SOURCE_COMMIT"

          git checkout --detach "$ANDROID_SOURCE_COMMIT"

          test "$(git rev-parse HEAD)" = "$ANDROID_SOURCE_COMMIT"

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/google-services.json
          test -f app/src/main/AndroidManifest.xml

          test -f app/src/main/java/org/rkms/connect/FCMTokenRegistrar.java
          test -f app/src/main/java/org/rkms/connect/RKMSFirebaseMessagingService.java
          test -f app/src/main/java/org/rkms/connect/NotificationHelper.java
          test -f app/src/main/java/org/rkms/connect/SessionStore.java

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # =====================================================
      # 3. INSTALL V9 WEBSITE
      # =====================================================
      - name: Install V9 Web App
        shell: bash
        run: |
          set -e

          ZIP="$GITHUB_WORKSPACE/$WEBSITE_ZIP_NAME"
          WEB="$RUNNER_TEMP/rkms-web"
          ANDROID_WEB="$PROJECT_DIR/app/src/main/assets/www"

          echo "Using ZIP:"
          echo "$WEBSITE_ZIP_NAME"

          test -s "$ZIP"

          rm -rf "$WEB" "$ANDROID_WEB"
          mkdir -p "$WEB" "$ANDROID_WEB"

          unzip -q "$ZIP" -d "$WEB"

          INDEX="$(
            find "$WEB" \
              -type f \
              -name "index.html" \
              -print \
              -quit
          )"

          test -n "$INDEX"

          ROOT="$(dirname "$INDEX")"

          test -f "$ROOT/index.html"
          test -f "$ROOT/app.js"
          test -f "$ROOT/styles.css"
          test -f "$ROOT/config.js"
          test -d "$ROOT/assets"

          node --check "$ROOT/app.js"

          cp "$ROOT/index.html" "$ANDROID_WEB/"
          cp "$ROOT/app.js" "$ANDROID_WEB/"
          cp "$ROOT/styles.css" "$ANDROID_WEB/"
          cp "$ROOT/config.js" "$ANDROID_WEB/"
          cp -a "$ROOT/assets" "$ANDROID_WEB/"

          if [ -f "$ROOT/manifest.webmanifest" ]; then
            cp "$ROOT/manifest.webmanifest" "$ANDROID_WEB/"
          fi

          test -s "$ANDROID_WEB/index.html"
          test -s "$ANDROID_WEB/app.js"
          test -s "$ANDROID_WEB/styles.css"
          test -s "$ANDROID_WEB/config.js"
          test -d "$ANDROID_WEB/assets"

          echo "ANDROID_WEB=$ANDROID_WEB" >> "$GITHUB_ENV"

          echo "V9 WEB APP: PASS"


      # =====================================================
      # 4. VERIFY EXISTING V9 FIXES + BOOK
      # =====================================================
      - name: Verify V9 Fixes and Book
        shell: bash
        run: |
          set -e

          APP="$ANDROID_WEB/app.js"
          BOOK="$ANDROID_WEB/assets/book"

          # FIX 1
          grep -q "rkmsOfficerCanAccessTarget" "$APP"
          grep -q "rkmsOfficerCanAccessMember" "$APP"

          # FIX 2
          grep -q "rkmsAppointmentLevelKey" "$APP"
          grep -q "rkmsAppointmentLocationVisibility" "$APP"
          grep -q "applyAppointmentPostScope" "$APP"

          # FIX 3
          grep -q "rkmsChatLive" "$APP"
          grep -q "startChatLiveRealtime" "$APP"
          grep -q "postgres_changes" "$APP"
          grep -q "setInterval" "$APP"
          grep -q "visibilitychange" "$APP"

          # BOOK
          test -d "$BOOK"

          COUNT="$(
            find "$BOOK" \
              -maxdepth 1 \
              -type f \
              -iname 'page-*.jpg' \
              -print \
              | wc -l
          )"

          COUNT="$(echo "$COUNT" | tr -d '[:space:]')"

          test "$COUNT" = "60"

          for PAGE in $(seq -w 1 60); do
            test -s "$BOOK/page-$PAGE.jpg"
          done

          echo "FIX #1: PASS"
          echo "FIX #2: PASS"
          echo "FIX #3: PASS"
          echo "BOOK 60 PAGES: PASS"


      # =====================================================
      # 5. VERIFY REPORT VIEW + PDF
      # =====================================================
      - name: Verify Reports
        shell: bash
        run: |
          set -e

          APP="$ANDROID_WEB/app.js"

          grep -q "◉ देखें" "$APP"

          grep -q "activateReportTab" "$APP"

          grep -q "data-report-download=\"pdf\"" "$APP"

          grep -q "data-report-download=\"excel\"" "$APP"

          echo "REPORT VIEW: PASS"
          echo "REPORT PDF: PASS"
          echo "REPORT EXCEL: PASS"


      # =====================================================
      # 6. VERIFY DIGITAL ID + APPOINTMENT PDF
      # =====================================================
      - name: Verify Digital ID and Appointment PDF
        shell: bash
        run: |
          set -e

          APP="$ANDROID_WEB/app.js"

          grep -q "function downloadPdf" "$APP"

          grep -q "digitalIdPdf" "$APP"

          grep -q "appointmentLetterPdf" "$APP"

          echo "DIGITAL ID PDF: PASS"
          echo "APPOINTMENT LETTER PDF: PASS"


      # =====================================================
      # 7. ANDROID + GRADLE
      # =====================================================
      - name: Setup Android and Gradle
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Create Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          gradle wrapper \
            --gradle-version "$GRADLE_VERSION" \
            --distribution-type bin

          chmod +x gradlew

          ./gradlew --version


      # =====================================================
      # 8. EXISTING RKMS SIGNING
      # =====================================================
      - name: Prepare RKMS Signing
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -e

          test -n "$RKMS_KEYSTORE_BASE64"
          test -n "$RKMS_KEYSTORE_PASSWORD"
          test -n "$RKMS_KEY_ALIAS"
          test -n "$RKMS_KEY_PASSWORD"

          KEYSTORE="$RUNNER_TEMP/rkms-release.keystore"

          printf '%s' "$RKMS_KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE"

          test -s "$KEYSTORE"

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$RKMS_KEYSTORE_PASSWORD" \
            -alias "$RKMS_KEY_ALIAS" \
            >/dev/null

          echo "RKMS_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "RKMS_KEYSTORE_PASSWORD=$RKMS_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RKMS_KEY_ALIAS=$RKMS_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RKMS_KEY_PASSWORD=$RKMS_KEY_PASSWORD" >> "$GITHUB_ENV"

          echo "EXISTING RKMS SIGNING: PASS"


      # =====================================================
      # 9. BUILD RELEASE APK
      # =====================================================
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

          APK="$(
            find "$PROJECT_DIR" \
              -type f \
              -path "*/build/outputs/apk/release/*.apk" \
              -print \
              -quit
          )"

          test -n "$APK"
          test -s "$APK"

          SIZE="$(stat -c%s "$APK")"

          test "$SIZE" -gt 1000000

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo ""
          echo "======================================"
          echo "RKMS RELEASE APK BUILD SUCCESS"
          echo "======================================"
          echo ""

          echo "APK:"
          echo "$APK"

          echo ""

          ls -lh "$APK"


      # =====================================================
      # 10. UPLOAD FINAL APK
      # =====================================================
      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-Final-Report-PDF-Fixed
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 14


      # =====================================================
      # 11. UPLOAD FINAL APP.JS
      # =====================================================
      - name: Upload Final app.js
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Final-Report-PDF-Fixed-app-js
          path: ${{ env.PROJECT_DIR }}/app/src/main/assets/www/app.js
          if-no-files-found: error
          retention-days: 14


      # =====================================================
      # 12. FINAL
      # =====================================================
      - name: Build Complete
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo "       RKMS CONNECT APK BUILD SUCCESS"
          echo "=============================================="
          echo ""
          echo "Fix #1 Geographic Visibility : PASS"
          echo "Fix #2 Appointment Hierarchy  : PASS"
          echo "Fix #3 Live Chat              : PASS"
          echo "Reports View                  : PASS"
          echo "Reports PDF                   : PASS"
          echo "Reports Excel                 : PASS"
          echo "Digital ID PDF                : PASS"
          echo "Appointment Letter PDF        : PASS"
          echo "V9 Web App                    : PASS"
          echo "V9 Book 60 Pages              : PASS"
          echo "FCM Native Source             : PASS"
          echo "Existing RKMS Signing         : PASS"
          echo "Release APK                   : PASS"
          echo ""
          echo "=============================================="

name: Build RKMS Connect APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. NODE 22
      # =========================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # =========================================================
      # 3. PREPARE EXACT V1D V4 SOURCE
      # =========================================================
      - name: Prepare RKMS V1D v4 source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build
          mkdir -p build

          SOURCE_ZIP="RKMS_CONNECT_V1D_FULL_FIX_CORRECTED_FINAL_FIXED_v4.zip"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERROR: Required V1D source ZIP not found:"
            echo "$SOURCE_ZIP"
            echo
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          echo "=================================================="
          echo "Using EXACT RKMS V1D v4 source"
          echo "=================================================="
          echo "$SOURCE_ZIP"

          echo
          echo "Checking ZIP integrity..."
          unzip -t "$SOURCE_ZIP"

          echo
          echo "Extracting source..."
          unzip -q "$SOURCE_ZIP" -d build

          test -f build/app.js
          test -f build/index.html
          test -f build/config.js
          test -s build/assets/rkms-logo-transparent.png

          echo
          echo "V1D v4 source extraction PASS."


      # =========================================================
      # 4. VERIFY SOURCE STRUCTURE
      # =========================================================
      - name: Verify V1D source structure
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          test -f app.js
          test -f index.html
          test -f config.js

          test -f scripts/setup-android-native.sh
          test -f scripts/verify-pdf-pipeline.py
          test -f scripts/verify-report-download-scope.py
          test -f scripts/verify-native-bridge.py
          test -f scripts/verify-rkms-final.py
          test -f scripts/verify-android-pdf.py

          echo "V1D source structure PASS."


      # =========================================================
      # 5. JAVASCRIPT SYNTAX
      # =========================================================
      - name: Verify JavaScript
        shell: bash
        run: |
          set -euo pipefail

          node --check build/app.js

          echo "app.js syntax PASS."


      # =========================================================
      # 6. MEMBER DASHBOARD
      # =========================================================
      - name: Verify Member Dashboard
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          grep -q \
            "function renderMemberDashboard" \
            app.js

          grep -q \
            'name==="member-dashboard"' \
            app.js

          echo "Member Dashboard verification PASS."


      # =========================================================
      # 7. VERIFY MAIN 8 FIXES
      # =========================================================
      - name: Verify V1D fixes 1 to 8
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          FILE="app.js"

          echo "=================================================="
          echo "V1D FIXES 1-8"
          echo "=================================================="

          # -------------------------------------------------------
          # 1. Digital ID area
          # -------------------------------------------------------
          grep -q "memberAreaLabel" "$FILE"
          echo "PASS #1 - Digital ID area"


          # -------------------------------------------------------
          # 2. Digital ID PDF
          # -------------------------------------------------------
          grep -q "downloadPdf" "$FILE"
          grep -q "pdfBlobFromCanvas" "$FILE"
          echo "PASS #2 - Digital ID PDF"


          # -------------------------------------------------------
          # 3. Digital ID Print
          # -------------------------------------------------------
          grep -q "printPage" "$FILE"
          echo "PASS #3 - Digital ID Print"


          # -------------------------------------------------------
          # 4. Member Profile
          # -------------------------------------------------------
          grep -q "renderMemberProfile" "$FILE"
          grep -q "member-profile" "$FILE"
          echo "PASS #4 - Member Profile"


          # -------------------------------------------------------
          # 5. National President certificate
          # -------------------------------------------------------
          grep -q "nationalName" "$FILE"
          grep -q "nationalPost" "$FILE"
          echo "PASS #5 - National President certificate"


          # -------------------------------------------------------
          # 6. Membership Certificate PDF
          # -------------------------------------------------------
          grep -q "data-download-pdf" "$FILE"
          echo "PASS #6 - Certificate PDF"


          # -------------------------------------------------------
          # 7. Launcher logo
          # -------------------------------------------------------
          test -s assets/rkms-logo-transparent.png
          echo "PASS #7 - Launcher logo source"


          # -------------------------------------------------------
          # 8. Saved Login
          # -------------------------------------------------------
          grep -q "rkmsSaveLoginCredentials" "$FILE"
          echo "PASS #8 - Saved Login"


          echo
          echo "V1D fixes 1-8 PASS."


      # =========================================================
      # 8. VERIFY REAL-DEVICE FIXES FOUND IN LAST TEST
      # =========================================================
      - name: Verify V1D retest fixes
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          FILE="app.js"

          # Remote image CORS / tainted canvas protection
          grep -q 'mode:"cors"' "$FILE"
          grep -q 'readAsDataURL' "$FILE"
          grep -q 'img.crossOrigin="anonymous"' "$FILE"

          # Approval officer name/signature fallback
          grep -q 'fillFromOfficer' "$FILE"

          # Logout returns to login
          grep -q 'history.replaceState({rkmsRoute:"login"' "$FILE"

          # PDA State selector re-enable
          grep -q 's.disabled=false' "$FILE"

          echo "V1D retest fixes verification PASS."


      # =========================================================
      # 9. PDF PIPELINE
      # =========================================================
      - name: Verify PDF pipeline
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-pdf-pipeline.py

          echo "PDF pipeline PASS."


      # =========================================================
      # 10. REPORT DOWNLOAD SECURITY
      # =========================================================
      - name: Verify report download security
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-report-download-scope.py

          echo "Report download security PASS."


      # =========================================================
      # 11. NATIVE BRIDGE SOURCE
      # =========================================================
      - name: Verify native bridge source
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          bash -n scripts/setup-android-native.sh

          python3 scripts/verify-native-bridge.py

          echo "Native bridge source PASS."


      # =========================================================
      # 12. RKMS FINAL STATIC CHECK
      # =========================================================
      - name: Verify RKMS final static checks
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-rkms-final.py

          echo "RKMS final static verification PASS."


      # =========================================================
      # 13. CREATE CAPACITOR PACKAGE
      # =========================================================
      - name: Create Capacitor build package
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          cat > package.json <<'JSON'
          {
            "name": "rkms-connect",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "rm -rf dist && mkdir -p dist && rsync -a --exclude='dist/' --exclude='android/' --exclude='node_modules/' --exclude='.git/' --exclude='.github/' --exclude='*.zip' ./ dist/"
            },
            "dependencies": {
              "@capacitor/core": "6.2.2",
              "@capacitor/android": "6.2.2",
              "@capacitor/app": "6.0.3"
            },
            "devDependencies": {
              "@capacitor/cli": "6.2.2"
            }
          }
          JSON

          cat > capacitor.config.json <<'JSON'
          {
            "appId": "org.rkms.connect",
            "appName": "RKMS",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https",
              "cleartext": true
            },
            "android": {
              "allowMixedContent": true,
              "captureInput": true,
              "webContentsDebuggingEnabled": false
            }
          }
          JSON

          echo "Capacitor configuration created."


      # =========================================================
      # 14. INSTALL CAPACITOR
      # =========================================================
      - name: Install Capacitor dependencies
        working-directory: build
        run: |
          npm install --no-audit --no-fund


      # =========================================================
      # 15. BUILD WEB APP
      # =========================================================
      - name: Build RKMS web application
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          npm run build

          test -f dist/index.html
          test -f dist/app.js
          test -f dist/config.js

          echo "RKMS web build PASS."


      # =========================================================
      # 16. JAVA 21
      # =========================================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle


      # =========================================================
      # 17. ANDROID SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # =========================================================
      # 18. ANDROID SDK PACKAGES
      # =========================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK PASS."


      # =========================================================
      # 19. CREATE ANDROID PLATFORM
      # =========================================================
      - name: Create Android platform
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          npx cap add android

          MAIN_ACTIVITY="$(find android/app/src/main \
            -type f \
            -name "MainActivity.java" \
            -print -quit)"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.java was not generated."

            find android/app/src/main \
              -type f \
              | sort

            exit 1
          fi

          echo "Generated MainActivity:"
          echo "$MAIN_ACTIVITY"


      # =========================================================
      # 20. VERIFY GENERATED MAIN ACTIVITY
      # =========================================================
      - name: Verify generated MainActivity
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          MAIN_ACTIVITY="$(find android/app/src/main \
            -type f \
            -name "MainActivity.java" \
            -print -quit)"

          test -n "$MAIN_ACTIVITY"

          grep -q "BridgeActivity" "$MAIN_ACTIVITY"

          echo "Generated MainActivity PASS."


      # =========================================================
      # 21. SETUP NATIVE BRIDGE
      # =========================================================
      - name: Setup RKMS Android native bridge
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          test -f scripts/setup-android-native.sh

          chmod +x scripts/setup-android-native.sh

          bash scripts/setup-android-native.sh

          echo "RKMS native bridge setup PASS."


      # =========================================================
      # 22. VERIFY GENERATED NATIVE FILES
      # =========================================================
      - name: Verify generated native files
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          MAIN_ACTIVITY="$(find android/app/src/main \
            -type f \
            -name "MainActivity.java" \
            -print -quit)"

          NATIVE_BRIDGE="$(find android/app/src/main \
            -type f \
            -name "RKMSNativeBridge.java" \
            -print -quit)"

          SECURE_PLUGIN="$(find android/app/src/main \
            -type f \
            -name "RKMSSecureCredentialsPlugin.java" \
            -print -quit)"

          test -n "$MAIN_ACTIVITY"
          test -n "$NATIVE_BRIDGE"
          test -n "$SECURE_PLUGIN"

          echo "MainActivity:"
          echo "$MAIN_ACTIVITY"

          echo
          echo "RKMSNativeBridge:"
          echo "$NATIVE_BRIDGE"

          echo
          echo "Secure plugin:"
          echo "$SECURE_PLUGIN"

          echo
          echo "Generated native files PASS."


      # =========================================================
      # 23. CAPACITOR SYNC
      # =========================================================
      - name: Sync RKMS application
        working-directory: build
        run: |
          set -euo pipefail

          npx cap sync android

          echo "Capacitor sync PASS."


      # =========================================================
      # 24. CORRECT PDF BRIDGE VERIFICATION
      #
      # IMPORTANT:
      # PDF methods are inside RKMSNativeBridge.java.
      # They are NOT expected in MainActivity.java.
      # =========================================================
      - name: Verify generated Android PDF bridge
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching generated Android native files..."

          NATIVE_BRIDGE="$(find android/app/src/main \
            -type f \
            -name "RKMSNativeBridge.java" \
            -print -quit)"

          MAIN_ACTIVITY="$(find android/app/src/main \
            -type f \
            -name "MainActivity.java" \
            -print -quit)"

          SECURE_PLUGIN="$(find android/app/src/main \
            -type f \
            -name "RKMSSecureCredentialsPlugin.java" \
            -print -quit)"

          if [ -z "$NATIVE_BRIDGE" ]; then
            echo "ERROR: RKMSNativeBridge.java not found."
            find android/app/src/main/java -type f | sort
            exit 1
          fi

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.java not found."
            exit 1
          fi

          if [ -z "$SECURE_PLUGIN" ]; then
            echo "ERROR: RKMSSecureCredentialsPlugin.java not found."
            exit 1
          fi

          echo
          echo "PDF bridge:"
          echo "$NATIVE_BRIDGE"

          echo
          echo "MainActivity:"
          echo "$MAIN_ACTIVITY"

          echo
          echo "Secure plugin:"
          echo "$SECURE_PLUGIN"


          # -------------------------------------------------------
          # PDF lifecycle
          # -------------------------------------------------------
          grep -q "beginPdfSave" "$NATIVE_BRIDGE"
          grep -q "appendPdfChunk" "$NATIVE_BRIDGE"
          grep -q "finishPdfSave" "$NATIVE_BRIDGE"
          grep -q "cancelPdfSave" "$NATIVE_BRIDGE"

          echo "PASS: PDF lifecycle"


          # -------------------------------------------------------
          # Android PDF storage
          # -------------------------------------------------------
          grep -q "MediaStore.Downloads.EXTERNAL_CONTENT_URI" \
            "$NATIVE_BRIDGE"

          grep -q "Environment.DIRECTORY_DOWNLOADS" \
            "$NATIVE_BRIDGE"

          grep -q "application/pdf" \
            "$NATIVE_BRIDGE"

          grep -q "RKMS CONNECT" \
            "$NATIVE_BRIDGE"

          grep -q "Base64" \
            "$NATIVE_BRIDGE"

          echo "PASS: Android PDF storage"


          # -------------------------------------------------------
          # Activity + WebView
          # -------------------------------------------------------
          grep -q "Activity" "$NATIVE_BRIDGE"
          grep -q "WebView" "$NATIVE_BRIDGE"

          echo "PASS: Activity/WebView"


          # -------------------------------------------------------
          # MainActivity registration
          # -------------------------------------------------------
          grep -q "RKMSNativeBridge" \
            "$MAIN_ACTIVITY"

          grep -q "getBridge().getWebView()" \
            "$MAIN_ACTIVITY"

          echo "PASS: MainActivity bridge registration"


          # -------------------------------------------------------
          # Secure plugin
          # -------------------------------------------------------
          grep -q "AndroidKeyStore" \
            "$SECURE_PLUGIN"

          grep -q "AES/GCM/NoPadding" \
            "$SECURE_PLUGIN"

          grep -q "BiometricPrompt" \
            "$SECURE_PLUGIN"

          echo "PASS: Secure credentials plugin"


          echo
          echo "=================================================="
          echo "ANDROID PDF/NATIVE BRIDGE VERIFICATION PASS"
          echo "=================================================="


      # =========================================================
      # 25. VERIFY MainActivity REGISTRATION
      # =========================================================
      - name: Verify MainActivity native registration
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          MAIN_ACTIVITY="$(find android/app/src/main \
            -type f \
            -name "MainActivity.java" \
            -print -quit)"

          test -n "$MAIN_ACTIVITY"

          grep -q "RKMSNativeBridge" "$MAIN_ACTIVITY"
          grep -q "getBridge().getWebView()" "$MAIN_ACTIVITY"
          grep -q "RKMSSecureCredentialsPlugin" "$MAIN_ACTIVITY"

          echo "MainActivity native registration PASS."


      # =========================================================
      # 26. VERIFY SECURE CREDENTIAL PLUGIN
      # =========================================================
      - name: Verify secure credential plugin
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          PLUGIN="$(find android/app/src/main \
            -type f \
            -name "RKMSSecureCredentialsPlugin.java" \
            -print -quit)"

          test -n "$PLUGIN"

          grep -q "AndroidKeyStore" "$PLUGIN"
          grep -q "AES/GCM/NoPadding" "$PLUGIN"
          grep -q "BiometricPrompt" "$PLUGIN"

          grep -q 'authenticateAndGetCredentials' "$PLUGIN"
          grep -q 'getSavedIdentifier' "$PLUGIN"

          echo "Secure credential plugin PASS."


      # =========================================================
      # 27. INSTALL IMAGEMAGICK
      # =========================================================
      - name: Install ImageMagick
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y -qq imagemagick

          echo "ImageMagick PASS."


      # =========================================================
      # 28. INSTALL V1D CORRECTED LOGO
      # =========================================================
      - name: Install RKMS launcher logo
        shell: bash
        run: |
          set -euo pipefail

          LOGO="build/assets/rkms-logo-transparent.png"

          RES="build/android/app/src/main/res"

          STRINGS="build/android/app/src/main/res/values/strings.xml"

          test -s "$LOGO"


          mkdir -p \
            "$RES/mipmap-mdpi" \
            "$RES/mipmap-hdpi" \
            "$RES/mipmap-xhdpi" \
            "$RES/mipmap-xxhdpi" \
            "$RES/mipmap-xxxhdpi"


          # -------------------------------------------------------
          # V1D corrected launcher safe-area sizes
          #
          # Logo is larger than previous 26/39/52/78/104 version,
          # but remains inside a transparent safe zone.
          # -------------------------------------------------------

          convert "$LOGO" \
            -resize 32x32 \
            -strip \
            -gravity center \
            -background none \
            -extent 48x48 \
            "$RES/mipmap-mdpi/ic_launcher.png"

          convert "$LOGO" \
            -resize 48x48 \
            -strip \
            -gravity center \
            -background none \
            -extent 72x72 \
            "$RES/mipmap-hdpi/ic_launcher.png"

          convert "$LOGO" \
            -resize 64x64 \
            -strip \
            -gravity center \
            -background none \
            -extent 96x96 \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          convert "$LOGO" \
            -resize 96x96 \
            -strip \
            -gravity center \
            -background none \
            -extent 144x144 \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          convert "$LOGO" \
            -resize 128x128 \
            -strip \
            -gravity center \
            -background none \
            -extent 192x192 \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"


          # Round launcher versions
          cp \
            "$RES/mipmap-mdpi/ic_launcher.png" \
            "$RES/mipmap-mdpi/ic_launcher_round.png"

          cp \
            "$RES/mipmap-hdpi/ic_launcher.png" \
            "$RES/mipmap-hdpi/ic_launcher_round.png"

          cp \
            "$RES/mipmap-xhdpi/ic_launcher.png" \
            "$RES/mipmap-xhdpi/ic_launcher_round.png"

          cp \
            "$RES/mipmap-xxhdpi/ic_launcher.png" \
            "$RES/mipmap-xxhdpi/ic_launcher_round.png"

          cp \
            "$RES/mipmap-xxxhdpi/ic_launcher.png" \
            "$RES/mipmap-xxxhdpi/ic_launcher_round.png"


          # Remove adaptive launcher resources
          rm -rf \
            "$RES/mipmap-anydpi-v26" \
            "$RES/mipmap-anydpi"


          find "$RES" -type f \( \
            -name 'ic_launcher_foreground.xml' -o \
            -name 'ic_launcher_background.xml' -o \
            -name 'ic_launcher_foreground.png' -o \
            -name 'ic_launcher_background.png' \
          \) -delete || true


          # App name
          if grep -q '<string name="app_name">' "$STRINGS"; then
            sed -i \
              's#<string name="app_name">.*</string>#<string name="app_name">RKMS</string>#' \
              "$STRINGS"
          else
            printf '\n    <string name="app_name">RKMS</string>\n' \
              >> "$STRINGS"
          fi


          echo
          echo "RKMS launcher logo installed."


      # =========================================================
      # 29. VERIFY LAUNCHER LOGO
      # =========================================================
      - name: Verify launcher logo
        shell: bash
        run: |
          set -euo pipefail

          RES="build/android/app/src/main/res"

          test -s "$RES/mipmap-mdpi/ic_launcher.png"
          test -s "$RES/mipmap-hdpi/ic_launcher.png"
          test -s "$RES/mipmap-xhdpi/ic_launcher.png"
          test -s "$RES/mipmap-xxhdpi/ic_launcher.png"
          test -s "$RES/mipmap-xxxhdpi/ic_launcher.png"

          test -s "$RES/mipmap-mdpi/ic_launcher_round.png"
          test -s "$RES/mipmap-hdpi/ic_launcher_round.png"
          test -s "$RES/mipmap-xhdpi/ic_launcher_round.png"
          test -s "$RES/mipmap-xxhdpi/ic_launcher_round.png"
          test -s "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

          test ! -e "$RES/mipmap-anydpi-v26"

          echo "Launcher logo verification PASS."


      # =========================================================
      # 30. MAKE GRADLE EXECUTABLE
      # =========================================================
      - name: Make Gradle executable
        run: |
          chmod +x build/android/gradlew


      # =========================================================
      # 31. BUILD APK
      # =========================================================
      - name: Build Debug APK
        working-directory: build/android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

          echo "Gradle build PASS."


      # =========================================================
      # 32. VERIFY APK
      # =========================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="build/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo
          echo "=================================================="
          echo "RKMS V1D APK BUILD SUCCESS"
          echo "=================================================="

          ls -lh "$APK"

          echo
          echo "APK SHA-256:"
          sha256sum "$APK"


      # =========================================================
      # 33. COPY FINAL APK
      # =========================================================
      - name: Prepare final APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p final-apk

          cp \
            build/android/app/build/outputs/apk/debug/app-debug.apk \
            final-apk/RKMS-Connect-V1D-Debug.apk

          test -s final-apk/RKMS-Connect-V1D-Debug.apk

          echo
          echo "Final APK:"
          ls -lh final-apk/RKMS-Connect-V1D-Debug.apk

          echo
          echo "Final APK SHA-256:"
          sha256sum final-apk/RKMS-Connect-V1D-Debug.apk


      # =========================================================
      # 34. UPLOAD APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-V1D-Debug-APK
          path: final-apk/RKMS-Connect-V1D-Debug.apk
          if-no-files-found: error
          retention-days: 30

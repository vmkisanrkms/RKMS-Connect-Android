name: RKMS Connect Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: rkms-connect-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build RKMS Connect APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -e
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Verify project structure
        shell: bash
        run: |
          set -e

          echo "Checking RKMS Android project..."

          test -f settings.gradle || {
            echo "ERROR: settings.gradle not found"
            exit 1
          }

          test -f build.gradle || {
            echo "ERROR: build.gradle not found"
            exit 1
          }

          test -f app/build.gradle || {
            echo "ERROR: app/build.gradle not found"
            exit 1
          }

          test -f app/google-services.json || {
            echo "ERROR: google-services.json not found"
            exit 1
          }

          test -f app/src/main/AndroidManifest.xml || {
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          }

          test -f app/src/main/assets/www/index.html || {
            echo "ERROR: Website index.html not found"
            exit 1
          }

          echo "PROJECT STRUCTURE: PASS"

      - name: Show project files
        shell: bash
        run: |
          echo "===== RKMS PROJECT ====="
          find . -maxdepth 4 -type f \
            -not -path "./.git/*" \
            -not -path "*/build/*" \
            | sort

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Check Gradle
        run: |
          gradle --version

      - name: Validate Gradle
        run: |
          set -e
          gradle tasks \
            --no-daemon \
            --stacktrace

      - name: Clean project
        run: |
          set -e
          gradle clean \
            --no-daemon \
            --stacktrace

      - name: Build Debug APK
        run: |
          set -e

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            echo ""
            echo "Build output:"
            find app/build/outputs \
              -type f \
              2>/dev/null \
              | sort || true
            exit 1
          fi

          echo "===================================="
          echo "APK FOUND"
          echo "===================================="

          echo "$APK"
          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-Final-Debug-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Build Success
        run: |
          echo "========================================"
          echo " RKMS CONNECT BUILD SUCCESS"
          echo "========================================"
          echo ""
          echo "Download from:"
          echo "Actions → Run → Artifacts"
          echo ""
          echo "Artifact:"
          echo "RKMS-Connect-Final-Debug-APK"

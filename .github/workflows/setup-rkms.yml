name: Build RKMS Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  # Verified native Android source commit
  ANDROID_SOURCE_COMMIT: cf252628308e5a6ecc9eafbaf4ca227a3ad8ec92

  # Android Gradle Plugin in the native project is 8.7.3.
  # Gradle 8.9 is compatible.
  GRADLE_VERSION: "8.9"

jobs:
  build:
    name: Build RKMS Release APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout current RKMS repository
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================================
      # 2. Prepare native Android project
      #
      # The native Android source is stored in the verified
      # historical commit.
      #
      # IMPORTANT:
      # We do NOT use git archive.
      # We do NOT use git --work-tree.
      # We clone the repository and checkout the exact commit.
      # ==========================================================
      - name: Prepare native Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$RUNNER_TEMP/rkms-android"

          rm -rf "$PROJECT_DIR"

          echo "=================================================="
          echo "Preparing native RKMS Android project"
          echo "=================================================="

          echo "Source commit:"
          echo "$ANDROID_SOURCE_COMMIT"

          git clone \
            --no-tags \
            "https://github.com/vmkisanrkms/RKMS-Connect-Android.git" \
            "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          git checkout --detach "$ANDROID_SOURCE_COMMIT"

          CURRENT_COMMIT="$(git rev-parse HEAD)"

          echo ""
          echo "Checked commit:"
          echo "$CURRENT_COMMIT"

          if [ "$CURRENT_COMMIT" != "$ANDROID_SOURCE_COMMIT" ]; then
            echo "ERROR: Wrong Android source commit."
            exit 1
          fi

          # Required Android project files
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/google-services.json"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo ""
          echo "Native Android project verification: PASS"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================================
      # 3. Find final RKMS website ZIP
      #
      # The final website is bundled inside the APK.
      # No live website URL is required.
      # ==========================================================
      - name: Find final RKMS website
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Searching final RKMS website ZIP"
          echo "=================================================="

          ZIP_FILE="$(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name 'RKMS_CONNECT_FINAL_ALL_FIXES_*.zip' \
              -print \
              -quit
          )"

          if [ -z "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR: RKMS_CONNECT_FINAL_ALL_FIXES_*.zip was not found."

            echo ""
            echo "Available ZIP files:"
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name '*.zip' \
              -print || true

            exit 1
          fi

          echo ""
          echo "Final website ZIP:"
          echo "$ZIP_FILE"

          echo "WEBSITE_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"


      # ==========================================================
      # 4. Extract final website
      # ==========================================================
      - name: Extract final RKMS website
        shell: bash
        run: |
          set -euo pipefail

          WEB_DIR="$RUNNER_TEMP/rkms-web"

          rm -rf "$WEB_DIR"
          mkdir -p "$WEB_DIR"

          echo "Extracting:"
          echo "$WEBSITE_ZIP"

          unzip -q "$WEBSITE_ZIP" -d "$WEB_DIR"

          echo ""
          echo "Searching required website files..."

          APP_JS="$(
            find "$WEB_DIR" \
              -type f \
              -name 'app.js' \
              -print \
              -quit
          )"

          STYLES="$(
            find "$WEB_DIR" \
              -type f \
              -name 'styles.css' \
              -print \
              -quit
          )"

          INDEX="$(
            find "$WEB_DIR" \
              -type f \
              -name 'index.html' \
              -print \
              -quit
          )"

          CONFIG="$(
            find "$WEB_DIR" \
              -type f \
              -name 'config.js' \
              -print \
              -quit
          )"

          if [ -z "$APP_JS" ]; then
            echo "ERROR: app.js not found."
            exit 1
          fi

          if [ -z "$STYLES" ]; then
            echo "ERROR: styles.css not found."
            exit 1
          fi

          if [ -z "$INDEX" ]; then
            echo "ERROR: index.html not found."
            exit 1
          fi

          if [ -z "$CONFIG" ]; then
            echo "ERROR: config.js not found."
            exit 1
          fi

          test -s "$APP_JS"
          test -s "$STYLES"
          test -s "$INDEX"
          test -s "$CONFIG"

          echo ""
          echo "app.js      : PASS"
          echo "styles.css  : PASS"
          echo "index.html  : PASS"
          echo "config.js   : PASS"

          echo "WEB_DIR=$WEB_DIR" >> "$GITHUB_ENV"


      # ==========================================================
      # 5. Validate website JavaScript
      # ==========================================================
      - name: Validate website JavaScript
        shell: bash
        run: |
          set -euo pipefail

          APP_JS="$(
            find "$WEB_DIR" \
              -type f \
              -name 'app.js' \
              -print \
              -quit
          )"

          test -n "$APP_JS"

          echo "Checking JavaScript syntax..."

          node --check "$APP_JS"

          echo "JavaScript syntax: PASS"


      # ==========================================================
      # 6. Verify production Supabase configuration
      #
      # This prevents accidentally building an APK against a
      # wrong/test Supabase project.
      # ==========================================================
      - name: Verify production Supabase
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="$(
            find "$WEB_DIR" \
              -type f \
              -name 'config.js' \
              -print \
              -quit
          )"

          test -n "$CONFIG"

          echo "Checking RKMS production Supabase..."

          grep -q \
            'https://kzczivaydandiqgnzfeg.supabase.co' \
            "$CONFIG"

          echo "Supabase URL: PASS"

          grep -q \
            'sb_publishable_' \
            "$CONFIG"

          echo "Supabase publishable key: PASS"

          echo ""
          echo "Production Supabase configuration verified."


      # ==========================================================
      # 7. Bundle FINAL WEBSITE into Android APK
      #
      # This is intentional.
      #
      # Website -> APK
      #
      # Later, the generated APK can be uploaded to Supabase
      # Storage and the website APK-download option can point
      # to that APK.
      # ==========================================================
      - name: Sync final website into Android
        shell: bash
        run: |
          set -euo pipefail

          APP_JS="$(
            find "$WEB_DIR" \
              -type f \
              -name 'app.js' \
              -print \
              -quit
          )"

          STYLES="$(
            find "$WEB_DIR" \
              -type f \
              -name 'styles.css' \
              -print \
              -quit
          )"

          INDEX="$(
            find "$WEB_DIR" \
              -type f \
              -name 'index.html' \
              -print \
              -quit
          )"

          CONFIG="$(
            find "$WEB_DIR" \
              -type f \
              -name 'config.js' \
              -print \
              -quit
          )"

          test -n "$APP_JS"
          test -n "$STYLES"
          test -n "$INDEX"
          test -n "$CONFIG"

          ANDROID_WEB="$PROJECT_DIR/app/src/main/assets/www"

          rm -rf "$ANDROID_WEB"
          mkdir -p "$ANDROID_WEB"

          cp "$APP_JS" "$ANDROID_WEB/app.js"
          cp "$STYLES" "$ANDROID_WEB/styles.css"
          cp "$INDEX" "$ANDROID_WEB/index.html"
          cp "$CONFIG" "$ANDROID_WEB/config.js"

          # ------------------------------------------------------
          # PWA manifest
          # ------------------------------------------------------
          MANIFEST="$(
            find "$WEB_DIR" \
              -type f \
              -name 'manifest.webmanifest' \
              -print \
              -quit || true
          )"

          if [ -n "$MANIFEST" ]; then
            cp "$MANIFEST" "$ANDROID_WEB/manifest.webmanifest"
          fi

          # ------------------------------------------------------
          # Website assets
          # ------------------------------------------------------
          SOURCE_ASSETS="$(
            find "$WEB_DIR" \
              -type d \
              -name 'assets' \
              -print \
              -quit || true
          )"

          if [ -n "$SOURCE_ASSETS" ]; then
            mkdir -p "$ANDROID_WEB/assets"

            cp -R \
              "$SOURCE_ASSETS"/. \
              "$ANDROID_WEB/assets"/
          fi

          # ------------------------------------------------------
          # Required files
          # ------------------------------------------------------
          test -s "$ANDROID_WEB/app.js"
          test -s "$ANDROID_WEB/styles.css"
          test -s "$ANDROID_WEB/index.html"
          test -s "$ANDROID_WEB/config.js"

          echo ""
          echo "Final website bundled into Android successfully."

          echo ""
          echo "Bundled website size:"
          du -sh "$ANDROID_WEB"


      # ==========================================================
      # 8. Setup Java 17
      #
      # IMPORTANT:
      # No 'cache: gradle' here.
      # This fixes the previous setup-java failure.
      # ==========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================================
      # 9. Setup Android SDK
      # ==========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ==========================================================
      # 10. Install Gradle 8.9
      #
      # Native Android source does not contain gradlew.
      # Therefore we install Gradle first.
      # ==========================================================
      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_ROOT="$RUNNER_TEMP/gradle"

          rm -rf "$GRADLE_ROOT"
          mkdir -p "$GRADLE_ROOT"

          echo "Downloading Gradle $GRADLE_VERSION..."

          curl \
            --fail \
            --location \
            --retry 3 \
            --connect-timeout 20 \
            --max-time 180 \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            --output "$RUNNER_TEMP/gradle.zip"

          unzip -q \
            "$RUNNER_TEMP/gradle.zip" \
            -d "$GRADLE_ROOT"

          GRADLE_BIN="$GRADLE_ROOT/gradle-${GRADLE_VERSION}/bin"

          test -x "$GRADLE_BIN/gradle"

          echo "$GRADLE_BIN" >> "$GITHUB_PATH"

          echo ""
          echo "Installed Gradle:"
          "$GRADLE_BIN/gradle" --version


      # ==========================================================
      # 11. Create Gradle Wrapper
      # ==========================================================
      - name: Create Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Creating Gradle wrapper..."

          gradle wrapper \
            --gradle-version "$GRADLE_VERSION" \
            --distribution-type bin

          test -f gradlew

          chmod +x gradlew

          echo ""
          echo "Gradle wrapper created."

          ./gradlew --version


      # ==========================================================
      # 12. Verify Android project
      # ==========================================================
      - name: Verify Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Android project verification"
          echo "=================================================="

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/google-services.json
          test -f app/src/main/AndroidManifest.xml
          test -f gradlew

          echo "settings.gradle          : PASS"
          echo "build.gradle             : PASS"
          echo "app/build.gradle         : PASS"
          echo "google-services.json     : PASS"
          echo "AndroidManifest.xml      : PASS"
          echo "gradlew                  : PASS"

          echo ""
          echo "Checking Gradle project..."

          ./gradlew \
            tasks \
            --no-daemon \
            --stacktrace \
            > "$RUNNER_TEMP/rkms-gradle-tasks.log"

          echo ""
          echo "Gradle project configuration: PASS"


      # ==========================================================
      # 13. Prepare release signing
      # ==========================================================
      - name: Prepare release signing
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Checking release signing secrets..."

          test -n "$RKMS_KEYSTORE_BASE64"
          test -n "$RKMS_KEYSTORE_PASSWORD"
          test -n "$RKMS_KEY_ALIAS"
          test -n "$RKMS_KEY_PASSWORD"

          KEYSTORE="$RUNNER_TEMP/rkms-release.keystore"

          printf '%s' "$RKMS_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$KEYSTORE"

          test -s "$KEYSTORE"

          echo "RKMS_KEYSTORE_PATH=$KEYSTORE" \
            >> "$GITHUB_ENV"

          echo "Release signing configuration: PASS"


      # ==========================================================
      # 14. Build signed Release APK
      # ==========================================================
      - name: Build signed Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          RKMS_KEYSTORE_PATH: ${{ env.RKMS_KEYSTORE_PATH }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          echo "=================================================="
          echo "Building signed RKMS Release APK"
          echo "=================================================="

          ./gradlew \
            clean \
            assembleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "Gradle Release build: PASS"


      # ==========================================================
      # 15. Locate APK
      # ==========================================================
      - name: Locate Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/release"

          echo "Searching for APK:"
          echo "$APK_DIR"

          APK="$(
            find "$APK_DIR" \
              -type f \
              -name '*.apk' \
              -print \
              -quit
          )"

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: Release APK was not found."

            echo ""
            echo "Available build outputs:"
            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -print || true

            exit 1
          fi

          test -s "$APK"

          mkdir -p release

          cp "$APK" \
            release/RKMS-Connect-Release.apk

          echo ""
          echo "=================================================="
          echo "RKMS RELEASE APK CREATED"
          echo "=================================================="

          ls -lh \
            release/RKMS-Connect-Release.apk


      # ==========================================================
      # 16. Final APK verification
      # ==========================================================
      - name: Verify final APK
        shell: bash
        run: |
          set -euo pipefail

          APK="release/RKMS-Connect-Release.apk"

          test -f "$APK"
          test -s "$APK"

          SIZE="$(stat -c%s "$APK")"

          echo "APK size:"
          echo "$SIZE bytes"

          # A valid RKMS release APK should not be tiny.
          if [ "$SIZE" -lt 100000 ]; then
            echo ""
            echo "ERROR: APK size is unexpectedly small."
            exit 1
          fi

          echo ""
          echo "Final APK verification: PASS"


      # ==========================================================
      # 17. Upload APK artifact
      # ==========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-Final-Release
          path: release/RKMS-Connect-Release.apk
          if-no-files-found: error

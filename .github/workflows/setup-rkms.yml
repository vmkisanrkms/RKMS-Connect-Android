name: Build RKMS APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rkms-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build RKMS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract RKMS project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f \
              \( -iname 'rkms_connect_*.zip' -o -iname 'rkms-connect-*.zip' \) \
              ! -iname '*apk*.zip' \
              -print | sort | tail -n 1
          )"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: RKMS source ZIP not found."
            exit 1
          fi

          echo "Using ZIP: $(basename "$ZIP_FILE")"

          TMP_DIR="$RUNNER_TEMP/rkms-project"
          rm -rf "$TMP_DIR"
          mkdir -p "$TMP_DIR"

          unzip -q "$ZIP_FILE" -d "$TMP_DIR"

          PROJECT_DIR="$(
            find "$TMP_DIR" -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -print -quit | xargs -r dirname
          )"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          echo "Android project: $PROJECT_DIR"

          rsync -a --exclude='.git/' --exclude='.github/' \
            "$PROJECT_DIR/" "$GITHUB_WORKSPACE/"

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -f gradle.properties
          test -d app
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Android project: PASS"

      - name: Verify Book Reader
        shell: bash
        run: |
          set -euo pipefail

          BOOK_DIR="app/src/main/assets/www/assets/book"
          APP_JS="app/src/main/assets/www/app.js"

          test -d "$BOOK_DIR"
          test -f "$BOOK_DIR/cover.jpg"
          test -f "$APP_JS"

          echo "Checking book pages..."

          for i in $(seq -w 1 60); do
            test -f "$BOOK_DIR/page-$i.jpg"
          done

          echo "Book pages 01-60: PASS"

          echo "Checking five reader controls..."

          grep -Fq 'id="bookFirst"' "$APP_JS"
          grep -Fq 'id="bookPrev"' "$APP_JS"
          grep -Fq 'id="bookNext"' "$APP_JS"
          grep -Fq 'id="bookLast"' "$APP_JS"
          grep -Fq 'id="bookDownload"' "$APP_JS"

          echo "Fast / First page control: PASS"
          echo "Back / Previous page control: PASS"
          echo "Next page control: PASS"
          echo "Last page control: PASS"
          echo "Page Download control: PASS"

          echo "Checking zoom and pan..."

          grep -Fq 'pointerdown' "$APP_JS"
          grep -Fq 'pointermove' "$APP_JS"
          grep -Fq 'book-page-viewport' "$APP_JS"

          echo "Pinch-to-zoom / 1-finger pan: PASS"
          echo "Book verification: PASS"

      - name: Verify Book download bridge
        shell: bash
        run: |
          set -euo pipefail

          MAIN_ACTIVITY="$(find app/src/main/java -type f -name 'MainActivity.java' -print -quit)"

          if [ -z "$MAIN_ACTIVITY" ] || [ ! -f "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.java not found."
            exit 1
          fi

          grep -Fq "downloadBookPage" "$MAIN_ACTIVITY"

          echo "Book Android download bridge: PASS"

      - name: Verify RKMS app name
        shell: bash
        run: |
          set -euo pipefail

          STRINGS_FILE="app/src/main/res/values/strings.xml"

          test -f "$STRINGS_FILE"
          grep -Fq '<string name="app_name">RKMS</string>' "$STRINGS_FILE"

          echo "App name RKMS: PASS"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate Gradle project
        run: gradle --no-daemon tasks

      - name: Clean project
        run: gradle --no-daemon clean

      - name: Build RKMS Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "======================================"
          echo "RKMS APK BUILD SUCCESS"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload RKMS APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

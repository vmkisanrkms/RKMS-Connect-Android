name: RKMS Final Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  APP_ID: "org.rkms.connect"
  SOURCE_ZIP: "RKMS_CONNECT_FINAL_AUDITED_RELEASE_APK_BUILD_20260922.zip"

jobs:
  build:
    name: RKMS Final Signed Release APK
    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. NODE.JS 22
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false


      # ============================================================
      # 3. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # ============================================================
      # 4. HOST PACKAGES
      # ============================================================

      - name: Install required host packages
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            rsync

          echo "HOST PACKAGES: PASS"


      # ============================================================
      # 5. ANDROID SDK BASE SETUP
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"


      # ============================================================
      # 6. ANDROID API 36 + BUILD TOOLS 36.0.0
      # ============================================================

      - name: Install Android API 36 SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            if [ -n "${ANDROID_HOME:-}" ]; then
              export ANDROID_SDK_ROOT="$ANDROID_HOME"
            else
              echo "::error::ANDROID_SDK_ROOT and ANDROID_HOME are both missing."
              exit 1
            fi
          fi

          export PATH="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${ANDROID_SDK_ROOT}/platform-tools:${PATH}"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            --sdk_root="${ANDROID_SDK_ROOT}" \
            --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          echo "Checking Android platform..."

          test -d \
            "${ANDROID_SDK_ROOT}/platforms/android-${ANDROID_API}"

          echo "Checking build tools..."

          test -d \
            "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}"

          echo "Checking aapt..."

          test -x \
            "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/aapt"

          echo "Checking apksigner..."

          test -x \
            "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/apksigner"

          echo "Checking adb..."

          test -x \
            "${ANDROID_SDK_ROOT}/platform-tools/adb"

          echo "ANDROID API 36: PASS"
          echo "BUILD TOOLS 36.0.0: PASS"
          echo "ADB: PASS"


      # ============================================================
      # 7. LOCATE EXACT SOURCE ZIP
      # ============================================================

      - name: Locate RKMS source ZIP
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="$GITHUB_WORKSPACE/$SOURCE_ZIP"

          echo "Expected source ZIP:"
          echo "$EXPECTED"

          if [ ! -s "$EXPECTED" ]; then
            echo "::error::Configured source ZIP was not found:"
            echo "$EXPECTED"

            echo ""
            echo "ZIP files available in repository:"

            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -name "*.zip" \
              -print \
              | sort

            exit 1
          fi

          SOURCE_SHA256="$(
            sha256sum "$EXPECTED" | awk '{print $1}'
          )"

          echo "RKMS_SOURCE_ZIP=$EXPECTED" >> "$GITHUB_ENV"
          echo "RKMS_SOURCE_SHA256=$SOURCE_SHA256" >> "$GITHUB_ENV"

          echo ""
          echo "SOURCE ZIP: $EXPECTED"
          echo "SOURCE SHA256: $SOURCE_SHA256"

          test -s "$EXPECTED"

          echo "SOURCE ZIP: PASS"


      # ============================================================
      # 8. EXTRACT SOURCE
      # ============================================================

      - name: Extract RKMS source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            "$GITHUB_WORKSPACE/rkms-source"

          mkdir -p \
            "$GITHUB_WORKSPACE/rkms-source"

          unzip -q \
            "$RKMS_SOURCE_ZIP" \
            -d "$GITHUB_WORKSPACE/rkms-source"

          PACKAGE_FILE="$(
            find "$GITHUB_WORKSPACE/rkms-source" \
              -type f \
              -name "package.json" \
              -not -path "*/node_modules/*" \
              -print \
              -quit
          )"

          if [ -z "$PACKAGE_FILE" ]; then
            echo "::error::package.json not found inside source ZIP."

            echo "ZIP CONTENT:"

            find "$GITHUB_WORKSPACE/rkms-source" \
              -maxdepth 5 \
              -type f \
              -print \
              | sort \
              | head -300

            exit 1
          fi

          RKMS_ROOT="$(dirname "$PACKAGE_FILE")"
          RKMS_ROOT="$(cd "$RKMS_ROOT" && pwd)"

          echo "RKMS_ROOT=$RKMS_ROOT" >> "$GITHUB_ENV"

          echo "RKMS ROOT:"
          echo "$RKMS_ROOT"

          echo "SOURCE EXTRACTION: PASS"


      # ============================================================
      # 9. VERIFY SOURCE STRUCTURE
      # ============================================================

      - name: Verify audited source
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          REQUIRED_FILES=(
            "package.json"
            "package-lock.json"
            "app.js"
            "index.html"
            "styles.css"
            "capacitor.config.json"
            "google-services.json"
            "scripts/setup-android-native.sh"
            "scripts/configure-android-16.sh"
            "scripts/configure-release-signing.sh"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -s "$FILE" ]; then
              echo "::error::Missing required file: $FILE"
              exit 1
            fi
          done

          node --check app.js

          python3 -m json.tool \
            capacitor.config.json \
            >/dev/null

          python3 -m json.tool \
            google-services.json \
            >/dev/null

          bash -n \
            scripts/setup-android-native.sh

          bash -n \
            scripts/configure-android-16.sh

          bash -n \
            scripts/configure-release-signing.sh

          echo "SOURCE STRUCTURE: PASS"
          echo "JAVASCRIPT SYNTAX: PASS"
          echo "JSON SYNTAX: PASS"
          echo "SHELL SYNTAX: PASS"


      # ============================================================
      # 10. VERIFY CAPACITOR PACKAGE VERSIONS
      # ============================================================

      - name: Verify Capacitor package versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node <<'NODE'
          const fs = require("fs");

          const p = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const d = Object.assign(
            {},
            p.dependencies || {},
            p.devDependencies || {}
          );

          const wanted = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          for (const [name, version] of Object.entries(wanted)) {
            if (d[name] !== version) {
              throw new Error(
                `${name}: expected ${version}, found ${d[name] || "MISSING"}`
              );
            }
          }

          if (
            !p.scripts ||
            typeof p.scripts.build !== "string" ||
            !p.scripts.build.trim()
          ) {
            throw new Error("npm build script missing");
          }

          console.log("CAPACITOR VERSION CHECK: PASS");
          NODE


      # ============================================================
      # 11. VERIFY FIREBASE CONFIGURATION
      # ============================================================

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node <<'NODE'
          const fs = require("fs");

          const d = JSON.parse(
            fs.readFileSync("google-services.json", "utf8")
          );

          const ok = (d.client || []).some(
            c =>
              c.client_info &&
              c.client_info.android_client_info &&
              c.client_info.android_client_info.package_name ===
              "org.rkms.connect"
          );

          if (!ok) {
            throw new Error(
              "org.rkms.connect not found in google-services.json"
            );
          }

          console.log("FIREBASE CONFIGURATION: PASS");
          NODE


      # ============================================================
      # 12. VERIFY FCM IMPLEMENTATION
      #
      # IMPORTANT:
      # No hard-coded notification channel/function names.
      # ============================================================

      - name: Verify FCM notification source
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node <<'NODE'
          const fs = require("fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const deps = Object.assign(
            {},
            pkg.dependencies || {},
            pkg.devDependencies || {}
          );

          if (!deps["@capacitor/push-notifications"]) {
            throw new Error(
              "@capacitor/push-notifications dependency is missing"
            );
          }

          const app = fs.readFileSync(
            "app.js",
            "utf8"
          );

          const checks = [
            [
              "Capacitor PushNotifications reference",
              /PushNotifications/
            ],
            [
              "push registration call",
              /\.register\s*\(/
            ],
            [
              "received notification listener",
              /pushNotificationReceived/
            ],
            [
              "notification action listener",
              /pushNotificationActionPerformed/
            ]
          ];

          for (const [name, pattern] of checks) {
            if (!pattern.test(app)) {
              throw new Error(
                name + " not found in app.js"
              );
            }
          }

          console.log(
            "FCM SOURCE IMPLEMENTATION: PASS"
          );

          console.log(
            "FCM verification uses implementation patterns."
          );
          NODE

          node --check app.js

          echo "FCM SOURCE: PASS"


      # ============================================================
      # 13. VERIFY NATIVE ANDROID SETUP
      # ============================================================

      - name: Verify native Android setup
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          SCRIPT="scripts/setup-android-native.sh"

          bash -n "$SCRIPT"

          grep -Fq \
            "RKMSNativeBridge" \
            "$SCRIPT"

          grep -Fq \
            "FirebaseApp.initializeApp" \
            "$SCRIPT"

          grep -Fq \
            "CredentialManager" \
            "$SCRIPT"

          if grep -Fq \
            "deleteNotificationChannel" \
            "$SCRIPT"
          then
            echo "::error::Notification channel deletion detected."
            exit 1
          fi

          if grep -Fq \
            "deleteChannel" \
            "$SCRIPT"
          then
            echo "::error::Notification channel deletion detected."
            exit 1
          fi

          echo "NATIVE SETUP SCRIPT: PASS"
          echo "RKMSNativeBridge: PASS"
          echo "Firebase initialization: PASS"
          echo "CREDENTIAL MANAGER: PASS"
          echo "NO CHANNEL DELETION: PASS"


      # ============================================================
      # 14. NPM INSTALL
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm ci \
            --no-audit \
            --no-fund

          echo "NPM INSTALL: PASS"


      # ============================================================
      # 15. WEB BUILD
      # ============================================================

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm run build

          if [ ! -s "dist/index.html" ]; then
            echo "::error::dist/index.html was not generated."
            exit 1
          fi

          echo "WEB BUILD: PASS"


      # ============================================================
      # 16. FRESH CAPACITOR ANDROID PROJECT
      # ============================================================

      - name: Generate fresh Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          rm -rf android

          npx cap add android

          test -s \
            android/gradlew

          test -s \
            android/app/build.gradle

          chmod +x \
            android/gradlew

          echo "CAPACITOR ANDROID GENERATION: PASS"


      # ============================================================
      # 17. CONFIGURE ANDROID 16 / API 36
      # ============================================================

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/configure-android-16.sh

          bash \
            scripts/configure-android-16.sh

          test -f \
            android/gradle/wrapper/gradle-wrapper.properties

          grep -Fq \
            "gradle-8.11.1-bin.zip" \
            android/gradle/wrapper/gradle-wrapper.properties

          grep -Fq \
            "com.android.tools.build:gradle:8.9.1" \
            android/build.gradle

          grep -Eq \
            "compileSdkVersion[[:space:]]*=[[:space:]]*36" \
            android/variables.gradle

          grep -Eq \
            "targetSdkVersion[[:space:]]*=[[:space:]]*36" \
            android/variables.gradle

          echo "ANDROID 16 API 36 CONFIGURATION: PASS"


      # ============================================================
      # 18. CAPACITOR SYNC
      # ============================================================

      - name: Sync Capacitor Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npx cap sync android

          test -s \
            android/app/build.gradle

          test -s \
            android/app/src/main/AndroidManifest.xml

          echo "CAPACITOR SYNC: PASS"


      # ============================================================
      # 19. APPLY RKMS NATIVE ANDROID SETUP
      # ============================================================

      - name: Apply RKMS native Android setup
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/setup-android-native.sh

          bash \
            scripts/setup-android-native.sh

          echo "RKMS NATIVE ANDROID SETUP: PASS"


      # ============================================================
      # 20. VERIFY MAIN ACTIVITY
      # ============================================================

      - name: Verify generated MainActivity
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          MAIN_ACTIVITY="$(
            find android/app/src/main \
              -type f \
              -name "MainActivity.java" \
              -print \
              -quit
          )"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "::error::MainActivity.java not found."

            find android/app/src/main \
              -type f \
              -print || true

            exit 1
          fi

          test -s "$MAIN_ACTIVITY"

          grep -Fq \
            "RKMSNativeBridge" \
            "$MAIN_ACTIVITY"

          grep -Fq \
            "FirebaseApp.initializeApp(this)" \
            "$MAIN_ACTIVITY"

          grep -Fq \
            "onNewIntent" \
            "$MAIN_ACTIVITY"

          echo "MAIN ACTIVITY: PASS"
          echo "RKMSNativeBridge: PASS"
          echo "Firebase initialization: PASS"
          echo "Notification intent handling: PASS"


      # ============================================================
      # 21. VERIFY FIREBASE MESSAGING
      # ============================================================

      - name: Verify Firebase Messaging
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          test -f \
            android/app/google-services.json

          grep -Fq \
            "org.rkms.connect" \
            android/app/google-services.json

          if grep -Rqs \
            "firebase-messaging" \
            android
          then
            echo "Firebase Messaging SDK reference: PASS"
          else
            echo "::error::Firebase Messaging SDK reference not found."
            exit 1
          fi


      # ============================================================
      # 22. VERIFY NOTIFICATION CHANNELS
      #
      # No hard-coded RKMS channel IDs.
      # ============================================================

      - name: Verify notification channels
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          if grep -Fq \
            "deleteNotificationChannel" \
            scripts/setup-android-native.sh
          then
            echo "::error::Notification channel deletion detected."
            exit 1
          fi

          if grep -Fq \
            "deleteChannel" \
            scripts/setup-android-native.sh
          then
            echo "::error::Notification channel deletion detected."
            exit 1
          fi

          if grep -Rqs \
            "NotificationChannel" \
            android/app/src/main
          then
            echo "ANDROID NOTIFICATION CHANNEL IMPLEMENTATION: PASS"
          else
            echo "::error::Android NotificationChannel implementation not found."
            exit 1
          fi

          if grep -Rqs \
            "firebase-messaging" \
            android
          then
            echo "FIREBASE MESSAGING IMPLEMENTATION: PASS"
          else
            echo "::error::Firebase Messaging implementation not found."
            exit 1
          fi

          echo "NO CHANNEL DELETION: PASS"


      # ============================================================
      # 23. RKMS STATIC AUDITS
      # ============================================================

      - name: Run RKMS static audits
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          if [ -f scripts/verify-fcm-pipeline.py ]; then
            python3 \
              scripts/verify-fcm-pipeline.py
          fi

          if [ -f scripts/verify-native-bridge.py ]; then
            python3 \
              scripts/verify-native-bridge.py
          fi

          if [ -f scripts/verify-rkms-final.py ]; then
            python3 \
              scripts/verify-rkms-final.py
          fi

          bash -n \
            scripts/setup-android-native.sh

          bash -n \
            scripts/configure-android-16.sh

          bash -n \
            scripts/configure-release-signing.sh

          node --check \
            app.js

          echo "RKMS STATIC AUDITS: PASS"


      # ============================================================
      # 24. VERIFY RELEASE SIGNING SECRETS
      # ============================================================

      - name: Verify release signing secrets
        shell: bash
        run: |
          set -euo pipefail

          test -n \
            "${RKMS_KEYSTORE_BASE64:-}" || {
              echo "::error::RKMS_KEYSTORE_BASE64 secret is missing."
              exit 1
            }

          test -n \
            "${RKMS_KEYSTORE_PASSWORD:-}" || {
              echo "::error::RKMS_KEYSTORE_PASSWORD secret is missing."
              exit 1
            }

          test -n \
            "${RKMS_KEY_ALIAS:-}" || {
              echo "::error::RKMS_KEY_ALIAS secret is missing."
              exit 1
            }

          test -n \
            "${RKMS_KEY_PASSWORD:-}" || {
              echo "::error::RKMS_KEY_PASSWORD secret is missing."
              exit 1
            }

          echo "RELEASE SIGNING SECRETS: PASS"


      # ============================================================
      # 25. CONFIGURE RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/configure-release-signing.sh

          bash \
            scripts/configure-release-signing.sh

          test -s \
            android/app/release.keystore

          keytool \
            -list \
            -keystore android/app/release.keystore \
            -storepass "$RKMS_KEYSTORE_PASSWORD" \
            -alias "$RKMS_KEY_ALIAS" \
            >/dev/null

          grep -Fq \
            "signingConfigs.release" \
            android/app/build.gradle

          echo "RELEASE SIGNING CONFIGURATION: PASS"


      # ============================================================
      # 26. VERIFY GRADLE 8.11.1
      # ============================================================

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          chmod +x \
            gradlew

          test -s \
            gradle/wrapper/gradle-wrapper.properties

          grep -Fq \
            "gradle-8.11.1-bin.zip" \
            gradle/wrapper/gradle-wrapper.properties

          ./gradlew \
            --version

          echo "GRADLE 8.11.1: PASS"


      # ============================================================
      # 27. BUILD ONLY SIGNED RELEASE APK
      #
      # DEBUG APK: NOT BUILT
      # AAB: NOT BUILT
      # ============================================================

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          echo "Cleaning previous build..."

          ./gradlew \
            clean \
            --no-daemon

          echo "Building ONLY release APK..."

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          EXPECTED_APK="$RKMS_ROOT/android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Expected release APK was not produced."

            echo "Searching for APK files..."

            find "$RKMS_ROOT/android" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          APK="$EXPECTED_APK"

          echo "RKMS_RELEASE_APK=$APK" >> "$GITHUB_ENV"

          echo "SIGNED RELEASE APK:"
          echo "$APK"

          echo "SIGNED RELEASE APK BUILD: PASS"


      # ============================================================
      # 28. VERIFY APK PACKAGE
      # ============================================================

      - name: Verify release APK package
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          APK="$RKMS_RELEASE_APK"

          test -s "$APK"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt" \
            dump badging \
            "$APK" \
            > apk-badging.txt

          grep -Fq \
            "package: name='${APP_ID}'" \
            apk-badging.txt

          echo "APK PACKAGE: PASS"
          echo "Package: ${APP_ID}"


      # ============================================================
      # 29. VERIFY APK SIGNATURE
      # ============================================================

      - name: Verify release APK signature
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          APK="$RKMS_RELEASE_APK"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" \
            verify \
            --verbose \
            "$APK"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" \
            verify \
            --print-certs \
            "$APK" \
            > apk-signature.txt

          grep -Fq \
            "Verified using v2 scheme" \
            apk-signature.txt

          echo "APK SIGNATURE VERIFICATION: PASS"

          cat apk-signature.txt


      # ============================================================
      # 30. GENERATE APK SHA256
      # ============================================================

      - name: Generate APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          APK="$RKMS_RELEASE_APK"

          sha256sum \
            "$APK" \
            | tee release-apk-sha256.txt

          APK_SIZE="$(stat -c%s "$APK")"

          if [ "$APK_SIZE" -le 100000 ]; then
            echo "::error::APK size is suspiciously small: $APK_SIZE bytes"
            exit 1
          fi

          echo "APK SIZE: $APK_SIZE bytes"
          echo "APK SHA256: PASS"


      # ============================================================
      # 31. FINAL ANDROID 16 / API 36 AUDIT
      # ============================================================

      - name: Final Android 16 API 36 audit
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          test -s \
            "$RKMS_RELEASE_APK"

          test -s \
            release-apk-sha256.txt

          test -f \
            android/variables.gradle

          grep -Eq \
            "compileSdkVersion[[:space:]]*=[[:space:]]*36" \
            android/variables.gradle

          grep -Eq \
            "targetSdkVersion[[:space:]]*=[[:space:]]*36" \
            android/variables.gradle

          grep -Fq \
            "gradle-8.11.1-bin.zip" \
            android/gradle/wrapper/gradle-wrapper.properties

          grep -Fq \
            "com.android.tools.build:gradle:8.9.1" \
            android/build.gradle

          echo "=============================================="
          echo "FINAL ANDROID AUDIT"
          echo "=============================================="
          echo "Android API: ${ANDROID_API}"

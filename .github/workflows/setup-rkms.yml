name: RKMS Android 16 API 36 - Final APK + AAB

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  AGP_VERSION: "8.9.1"
  GRADLE_VERSION: "8.11.1"
  APP_ID: "org.rkms.connect"

jobs:
  android-build:
    name: RKMS Android 16 API 36 APK + AAB
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. FIND FINAL RKMS SOURCE
      # ============================================================
      - name: Resolve RKMS source
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking repository..."

          if [[ -f "package.json" ]] && \
             [[ -f "package-lock.json" ]] && \
             [[ -f "app.js" ]] && \
             [[ -f "index.html" ]] && \
             [[ -f "styles.css" ]] && \
             [[ -f "capacitor.config.json" ]] && \
             [[ -f "google-services.json" ]]; then

            echo "Root source detected."
            echo "RKMS_SOURCE_DIR=." >> "$GITHUB_ENV"

          else

            ZIP="RKMS_CONNECT_CHAT_DIGITAL_ID_ANDROID16_API36_FINAL_APK_BUILD.zip"

            if [[ ! -f "$ZIP" ]]; then
              ZIP="RKMS_CONNECT_FINAL_MERGED_DEEP_AUDIT_CHAT_WHATSAPP_PDA_PASSWORD_20260919.zip"
            fi

            if [[ ! -f "$ZIP" ]]; then
              echo "::error::Final RKMS source ZIP not found."
              echo "Expected:"
              echo "  RKMS_CONNECT_CHAT_DIGITAL_ID_ANDROID16_API36_FINAL_APK_BUILD.zip"
              echo "or:"
              echo "  RKMS_CONNECT_FINAL_MERGED_DEEP_AUDIT_CHAT_WHATSAPP_PDA_PASSWORD_20260919.zip"
              exit 1
            fi

            echo "Extracting: $ZIP"

            rm -rf rkms-source
            mkdir -p rkms-source

            unzip -q "$ZIP" -d rkms-source

            SOURCE="rkms-source"

            if [[ ! -f "$SOURCE/package.json" ]]; then
              FOUND="$(find "$SOURCE" -type f -name package.json -print -quit || true)"

              if [[ -z "$FOUND" ]]; then
                echo "::error::package.json not found after extraction."
                exit 1
              fi

              SOURCE="$(dirname "$FOUND")"
            fi

            echo "Resolved source: $SOURCE"

            echo "RKMS_SOURCE_DIR=$SOURCE" >> "$GITHUB_ENV"
          fi


      # ============================================================
      # 3. VERIFY SOURCE
      # ============================================================
      - name: Verify RKMS source
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          REQUIRED=(
            package.json
            package-lock.json
            app.js
            index.html
            styles.css
            capacitor.config.json
            google-services.json
          )

          for FILE in "${REQUIRED[@]}"; do
            if [[ ! -f "$FILE" ]]; then
              echo "::error::Missing required file: $FILE"
              exit 1
            fi
          done

          echo "All required RKMS source files are present."

          echo "----- package.json -----"
          cat package.json

          echo "----- capacitor.config.json -----"
          cat capacitor.config.json


      # ============================================================
      # 4. NODE 22
      # ============================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.RKMS_SOURCE_DIR }}/package-lock.json


      # ============================================================
      # 5. VERIFY NODE / NPM
      # ============================================================
      - name: Verify Node environment
        shell: bash
        run: |
          node --version
          npm --version


      # ============================================================
      # 6. VERIFY CAPACITOR
      # ============================================================
      - name: Verify Capacitor versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          node - <<'NODE'
          const p = require('./package.json');

          const expected = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          for (const [name, version] of Object.entries(expected)) {
            const actual =
              (p.dependencies && p.dependencies[name]) ||
              (p.devDependencies && p.devDependencies[name]);

            if (!actual || !actual.includes(version)) {
              console.error(`Invalid ${name}: ${actual}`);
              process.exit(1);
            }

            console.log(`${name}: ${actual}`);
          }
          NODE


      # ============================================================
      # 7. NPM CI
      # ============================================================
      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          npm ci


      # ============================================================
      # 8. BUILD WEB APP
      # ============================================================
      - name: Build RKMS web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          npm run build

          if [[ ! -d "dist" ]]; then
            echo "::error::dist directory was not created."
            exit 1
          fi

          if [[ ! -f "dist/index.html" ]]; then
            echo "::error::dist/index.html missing."
            exit 1
          fi

          echo "Web build completed."


      # ============================================================
      # 9. JAVA 17
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle


      # ============================================================
      # 10. VERIFY JAVA
      # ============================================================
      - name: Verify Java
        shell: bash
        run: |
          java -version


      # ============================================================
      # 11. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true


      # ============================================================
      # 12. VERIFY ANDROID SDK
      # ============================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME}"

          test -d "$SDK/platforms/android-${ANDROID_API}"
          test -d "$SDK/build-tools/${BUILD_TOOLS}"

          "$SDK/platform-tools/adb" version
          "$SDK/build-tools/${BUILD_TOOLS}/aapt" version


      # ============================================================
      # 13. CREATE CAPACITOR ANDROID PROJECT
      # ============================================================
      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          rm -rf android

          npx cap add android


      # ============================================================
      # 14. CONFIGURE ANDROID 16 / API 36
      # ============================================================
      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          if [[ ! -f "scripts/configure-android-16.sh" ]]; then
            echo "::error::scripts/configure-android-16.sh missing."
            exit 1
          fi

          chmod +x scripts/configure-android-16.sh
          ./scripts/configure-android-16.sh


      # ============================================================
      # 15. VERIFY ANDROID CONFIGURATION
      # ============================================================
      - name: Verify Android API 36 configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          grep -R "compileSdk.*36" android \
            || {
              echo "::error::compileSdk 36 not found."
              exit 1
            }

          grep -R "targetSdk.*36" android \
            || {
              echo "::error::targetSdk 36 not found."
              exit 1
            }

          grep -R "8.9.1" android \
            || {
              echo "::error::AGP 8.9.1 not found."
              exit 1
            }

          echo "Android API 36 configuration verified."


      # ============================================================
      # 16. CAPACITOR SYNC
      # ============================================================
      - name: Capacitor sync
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          npx cap sync android


      # ============================================================
      # 17. SETUP NATIVE RKMS
      # ============================================================
      - name: Setup RKMS native Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          if [[ ! -f "scripts/setup-android-native.sh" ]]; then
            echo "::error::scripts/setup-android-native.sh missing."
            exit 1
          fi

          chmod +x scripts/setup-android-native.sh
          ./scripts/setup-android-native.sh


      # ============================================================
      # 18. VERIFY FIREBASE FILE
      # ============================================================
      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          test -f google-services.json
          test -f android/app/google-services.json

          node - <<'NODE'
          const fs = require('fs');

          const root = JSON.parse(
            fs.readFileSync('google-services.json', 'utf8')
          );

          const clients = root.client || [];

          const found = clients.some(c =>
            c.client_info &&
            c.client_info.android_client_info &&
            c.client_info.android_client_info.package_name ===
              'org.rkms.connect'
          );

          if (!found) {
            console.error(
              'Firebase package org.rkms.connect not found.'
            );
            process.exit(1);
          }

          console.log(
            'Firebase package org.rkms.connect verified.'
          );
          NODE


      # ============================================================
      # 19. FIREBASE DEPENDENCY FIX
      # ============================================================
      - name: Ensure Firebase dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          GRADLE_FILE="android/app/build.gradle"

          if [[ ! -f "$GRADLE_FILE" ]]; then
            echo "::error::android/app/build.gradle missing."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          bom = "implementation platform('com.google.firebase:firebase-bom:33.9.0')"
          msg = "implementation 'com.google.firebase:firebase-messaging'"

          if bom not in s or msg not in s:
              marker = "dependencies {"

              if marker not in s:
                  raise SystemExit(
                      "dependencies block not found"
                  )

              insert = (
                  marker
                  + "\n    "
                  + bom
                  + "\n    "
                  + msg
              )

              s = s.replace(
                  marker,
                  insert,
                  1
              )

              p.write_text(s)

          print("Firebase dependencies verified.")
          PY


      # ============================================================
      # 20. VERIFY FIREBASE COMPILE DEPENDENCIES
      # ============================================================
      - name: Verify Firebase compile classpath
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          ./gradlew \
            :app:dependencies \
            --configuration debugCompileClasspath \
            --no-daemon \
            > firebase-dependencies.txt

          grep -q "firebase-messaging" firebase-dependencies.txt \
            || {
              echo "::error::firebase-messaging missing from compile classpath."
              exit 1
            }

          echo "Firebase Messaging compile dependency verified."


      # ============================================================
      # 21. VERIFY FIREBASE INITIALIZATION
      # ============================================================
      - name: Verify Firebase initialization
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          if ! grep -R \
            "FirebaseApp.initializeApp" \
            android/app/src/main/java \
            >/dev/null 2>&1; then

            echo "::error::FirebaseApp.initializeApp(this) not found."
            exit 1
          fi

          echo "Firebase initialization verified."


      # ============================================================
      # 22. VERIFY NATIVE BRIDGE
      # ============================================================
      - name: Verify RKMS native bridge
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          find android/app/src/main/java \
            -name "RKMSNativeBridge.java" \
            -print \
            -quit \
            | grep -q . \
            || {
              echo "::error::RKMSNativeBridge.java missing."
              exit 1
            }

          find android/app/src/main/java \
            -name "RKMSSecureCredentialsPlugin.java" \
            -print \
            -quit \
            | grep -q . \
            || {
              echo "::error::RKMSSecureCredentialsPlugin.java missing."
              exit 1
            }

          echo "Native bridge and secure credentials plugin verified."


      # ============================================================
      # 23. VERIFY BIOMETRIC DEPENDENCY
      # ============================================================
      - name: Verify biometric dependency
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          grep -R \
            "androidx.biometric:biometric" \
            android \
            >/dev/null \
            || {
              echo "::error::Biometric dependency missing."
              exit 1
            }

          echo "Biometric dependency verified."


      # ============================================================
      # 24. VERIFY LAUNCHER ICONS
      # ============================================================
      - name: Verify RKMS launcher icons
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          ICON_COUNT="$(find android/app/src/main/res \
            -type f \
            \( -name "ic_launcher*" -o -name "ic_launcher_round*" \) \
            | wc -l)"

          if [[ "$ICON_COUNT" -lt 1 ]]; then
            echo "::error::RKMS launcher icons not found."
            exit 1
          fi

          echo "Launcher icon files found: $ICON_COUNT"


      # ============================================================
      # 25. RELEASE SIGNING
      # ============================================================
      - name: Configure release signing
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          if [[ ! -f "scripts/configure-release-signing.sh" ]]; then
            echo "::warning::Signing script missing. Release will be unsigned."
            exit 0
          fi

          chmod +x scripts/configure-release-signing.sh

          ./scripts/configure-release-signing.sh


      # ============================================================
      # 26. VERIFY GRADLE WRAPPER
      # ============================================================
      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          test -x gradlew || chmod +x gradlew

          ./gradlew --version

          ./gradlew --version \
            | grep -q "8.11.1" \
            || {
              echo "::error::Gradle 8.11.1 expected."
              exit 1
            }


      # ============================================================
      # 27. DEBUG APK
      # ============================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

          DEBUG_APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -f "$DEBUG_APK" ]]; then
            echo "::error::Debug APK was not created."
            exit 1
          fi

          echo "Debug APK created."


      # ============================================================
      # 28. RELEASE APK + AAB
      # IMPORTANT: NO CLEAN HERE
      # ============================================================
      - name: Build Release APK and AAB
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          ./gradlew \
            assembleRelease \
            bundleRelease \
            --no-daemon \
            --stacktrace

          RELEASE_APK="android/app/build/outputs/apk/release/app-release.apk"
          RELEASE_AAB="android/app/build/outputs/bundle/release/app-release.aab"

          if [[ ! -f "$RELEASE_APK" ]]; then
            echo "::error::Release APK was not created."
            exit 1
          fi

          if [[ ! -f "$RELEASE_AAB" ]]; then
            echo "::error::Release AAB was not created."
            exit 1
          fi

          echo "Release APK created."
          echo "Release AAB created."


      # ============================================================
      # 29. VERIFY ALL ARTIFACTS
      # ============================================================
      - name: Verify APK and AAB artifacts
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          DEBUG_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="android/app/build/outputs/apk/release/app-release.apk"
          RELEASE_AAB="android/app/build/outputs/bundle/release/app-release.aab"

          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          test -s "$RELEASE_AAB"

          echo
          echo "===== ARTIFACT SIZES ====="

          ls -lh \
            "$DEBUG_APK" \
            "$RELEASE_APK" \
            "$RELEASE_AAB"


      # ============================================================
      # 30. VERIFY APK PACKAGE NAME
      # ============================================================
      - name: Verify APK package ID
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          AAPT="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt"

          for APK in \
            android/app/build/outputs/apk/debug/app-debug.apk \
            android/app/build/outputs/apk/release/app-release.apk
          do

            echo "Checking $APK"

            "$AAPT" dump badging "$APK" \
              | grep -q "package: name='org.rkms.connect'" \
              || {
                echo "::error::Wrong package ID in $APK"
                exit 1
              }

          done

          echo "Package ID verified: org.rkms.connect"


      # ============================================================
      # 31. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          APKSIGNER="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner"

          DEBUG_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="android/app/build/outputs/apk/release/app-release.apk"

          "$APKSIGNER" verify --verbose "$DEBUG_APK"

          if "$APKSIGNER" verify "$RELEASE_APK"; then
            echo "Release APK is signed."
          else
            echo "Release APK is unsigned."
            echo "This is allowed when release signing secrets are not configured."
          fi


      # ============================================================
      # 32. VERIFY AAB
      # ============================================================
      - name: Verify AAB
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          if command -v jarsigner >/dev/null 2>&1; then
            if jarsigner -verify "$AAB" >/dev/null 2>&1; then
              echo "AAB signature verified."
            else
              echo "AAB is unsigned."
            fi
          fi

          unzip -t "$AAB" >/dev/null

          echo "AAB archive integrity verified."


      # ============================================================
      # 33. SHA256
      # ============================================================
      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          mkdir -p release

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            release/RKMS_CONNECT_ANDROID16_API36_DEBUG.apk

          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          cp \
            android/app/build/outputs/bundle/release/app-release.aab \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab

          cd release

          sha256sum \
            RKMS_CONNECT_ANDROID16_API36_DEBUG.apk \
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk \
            RKMS_CONNECT_ANDROID16_API36_RELEASE.aab \
            > RKMS_ANDROID16_API36_SHA256.txt

          cat RKMS_ANDROID16_API36_SHA256.txt


      # ============================================================
      # 34. FINAL ARTIFACT CHECK
      # ============================================================
      - name: Final artifact check
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          REQUIRED_RELEASE_FILES=(
            release/RKMS_CONNECT_ANDROID16_API36_DEBUG.apk
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab
            release/RKMS_ANDROID16_API36_SHA256.txt
          )

          for FILE in "${REQUIRED_RELEASE_FILES[@]}"; do
            if [[ ! -s "$FILE" ]]; then
              echo "::error::Final artifact missing or empty: $FILE"
              exit 1
            fi
          done

          echo
          echo "=============================================="
          echo " RKMS FINAL BUILD SUCCESS"
          echo "=============================================="
          echo
          echo "APK:"
          ls -lh release/*.apk
          echo
          echo "AAB:"
          ls -lh release/*.aab
          echo
          echo "SHA256:"
          cat release/RKMS_ANDROID16_API36_SHA256.txt


      # ============================================================
      # 35. UPLOAD FINAL ARTIFACTS
      # ============================================================
      - name: Upload final RKMS APK + AAB
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-ANDROID16-API36-FINAL-APK-AAB
          path: |
            ${{ env.RKMS_SOURCE_DIR }}/release/RKMS_CONNECT_ANDROID16_API36_DEBUG.apk
            ${{ env.RKMS_SOURCE_DIR }}/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            ${{ env.RKMS_SOURCE_DIR }}/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab
            ${{ env.RKMS_SOURCE_DIR }}/release/RKMS_ANDROID16_API36_SHA256.txt
          if-no-files-found: error
          retention-days: 30

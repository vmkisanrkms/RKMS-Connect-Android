name: RKMS Connect Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build RKMS Connect APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify Android project structure
        shell: bash
        run: |
          set -e

          echo "Checking RKMS Android project..."

          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties

          test -d app
          test -f app/build.gradle
          test -f app/google-services.json
          test -f app/src/main/AndroidManifest.xml

          echo "Project structure OK."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Show build environment
        shell: bash
        run: |
          echo "Java:"
          java -version

          echo "Gradle:"
          gradle --version

          echo "Android SDK:"
          sdkmanager --list_installed | head -100

      - name: Validate Gradle project
        shell: bash
        run: |
          set -e
          gradle --no-daemon tasks

      - name: Clean project
        shell: bash
        run: |
          set -e
          gradle --no-daemon clean

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          gradle --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            find app/build -type f | sort || true
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

          echo "APK location:"
          echo "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-WebView-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

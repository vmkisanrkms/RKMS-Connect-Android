name: RKMS Android 16 API 36 FINAL APK AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  android-release:

    name: RKMS Android 16 API 36 Release

    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. FIND RKMS ZIP
      # ============================================================

      - name: Find RKMS source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          if [ -f "RKMS_CONNECT_FIXED_2026-09-18.zip" ]; then
            ZIP_FILE="RKMS_CONNECT_FIXED_2026-09-18.zip"
          fi

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . \
              -maxdepth 3 \
              -type f \
              -name 'RKMS_CONNECT_FIXED_2026-09-18.zip' \
              -print -quit)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . \
              -maxdepth 3 \
              -type f \
              -name 'RKMS_CONNECT_*.zip' \
              -print \
              | sort \
              | tail -1)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: RKMS ZIP not found."

            find . \
              -maxdepth 3 \
              -type f \
              -name '*.zip' \
              -print

            exit 1
          fi

          echo "Using RKMS ZIP:"
          echo "$ZIP_FILE"

          echo "RKMS_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # 3. EXTRACT
      # ============================================================

      - name: Extract RKMS source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .rkms_extract
          mkdir -p .rkms_extract

          unzip -q "$RKMS_ZIP" -d .rkms_extract

          PACKAGE_JSON="$(find .rkms_extract \
            -type f \
            -name 'package.json' \
            -print -quit)"

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json not found."
            exit 1
          fi

          SOURCE_DIR="$(dirname "$PACKAGE_JSON")"

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

          echo "SOURCE_DIR=$SOURCE_DIR"


      # ============================================================
      # 4. SOURCE FILE AUDIT
      # ============================================================

      - name: Audit RKMS source
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          REQUIRED_FILES="
          package.json
          app.js
          index.html
          styles.css
          capacitor.config.json
          google-services.json
          scripts/setup-android-native.sh
          scripts/configure-android-16.sh
          scripts/configure-release-signing.sh
          scripts/verify-fcm-pipeline.py
          scripts/verify-saved-login.py
          scripts/verify-native-bridge.py
          scripts/verify-rkms-final.py
          scripts/verify-android-16.py
          "

          for FILE in $REQUIRED_FILES; do

            if [ ! -f "$FILE" ]; then
              echo "ERROR: Missing:"
              echo "$FILE"
              exit 1
            fi

            echo "PASS: $FILE"

          done

          echo ""
          echo "RKMS SOURCE AUDIT: PASS"


      # ============================================================
      # 5. NODE 22
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'


      # ============================================================
      # 6. JDK 17
      # ============================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 7. NODE / JS AUDIT
      # ============================================================

      - name: Verify JavaScript
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          node --version
          npm --version

          node --check app.js

          echo "JavaScript syntax: PASS"


      # ============================================================
      # 8. NPM INSTALL
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          npm install \
            --no-audit \
            --no-fund

          echo "NPM install: PASS"


      # ============================================================
      # 9. WEB BUILD
      # ============================================================

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          npm run build

          test -s dist/index.html

          echo "Web build: PASS"


      # ============================================================
      # 10. ANDROID SDK
      # ============================================================

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" \
            --licenses \
            >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          test -d "${ANDROID_HOME}/platforms/android-36"
          test -d "${ANDROID_HOME}/build-tools/36.0.0"

          echo "Android API 36: PASS"
          echo "Build tools 36.0.0: PASS"


      # ============================================================
      # 11. CAPACITOR ANDROID
      # ============================================================

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          rm -rf android

          npx cap add android

          test -f android/app/build.gradle
          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml

          echo "Capacitor Android generation: PASS"


      # ============================================================
      # 12. ANDROID 16 CONFIGURATION
      # ============================================================

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          chmod +x scripts/configure-android-16.sh

          bash scripts/configure-android-16.sh

          grep -Eq \
            'compileSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

          grep -Eq \
            'targetSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

          grep -Fq \
            'com.android.tools.build:gradle:8.9.1' \
            android/build.gradle

          grep -Fq \
            'gradle-8.11.1-bin.zip' \
            android/gradle/wrapper/gradle-wrapper.properties

          echo "compileSdk 36: PASS"
          echo "targetSdk 36: PASS"
          echo "AGP 8.9.1: PASS"
          echo "Gradle 8.11.1: PASS"


      # ============================================================
      # 13. CAPACITOR SYNC
      # ============================================================

      - name: Sync Capacitor
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          npx cap sync android

          echo "Capacitor sync: PASS"


      # ============================================================
      # 14. RKMS NATIVE SETUP
      # ============================================================

      - name: Configure RKMS native Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          chmod +x scripts/setup-android-native.sh

          bash scripts/setup-android-native.sh

          test -f \
            android/app/src/main/java/org/rkms/connect/MainActivity.java

          test -f \
            android/app/src/main/java/org/rkms/connect/RKMSNativeBridge.java

          test -f \
            android/app/src/main/java/org/rkms/connect/RKMSSecureCredentialsPlugin.java

          test -s \
            android/app/google-services.json

          echo "RKMS native Android setup: PASS"


      # ============================================================
      # 15. FORCE FIREBASE CONFIGURATION
      #
      # Do not depend on grep-only verification.
      # Repair the Gradle configuration directly.
      # ============================================================

      - name: Configure Firebase correctly
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          APP_GRADLE="android/app/build.gradle"
          ROOT_GRADLE="android/build.gradle"

          test -f "$APP_GRADLE"
          test -f "$ROOT_GRADLE"
          test -f "google-services.json"

          mkdir -p android/app

          cp -f \
            google-services.json \
            android/app/google-services.json

          chmod 600 \
            android/app/google-services.json

          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path("android/build.gradle")
          app = Path("android/app/build.gradle")

          root_text = root.read_text()
          app_text = app.read_text()

          # --------------------------------------------------------
          # Root Google Services classpath
          # --------------------------------------------------------

          if "com.google.gms:google-services:" not in root_text:

              marker = "dependencies {"

              if marker not in root_text:
                  raise SystemExit(
                      "ERROR: root dependencies block missing"
                  )

              root_text = root_text.replace(
                  marker,
                  marker
                  + '\n'
                  + '        classpath '
                    '"com.google.gms:google-services:4.4.3"',
                  1
              )

          # --------------------------------------------------------
          # App Google Services plugin
          # --------------------------------------------------------

          if "com.google.gms.google-services" not in app_text:

              if (
                  "apply plugin: 'com.android.application'"
                  in app_text
              ):

                  app_text = app_text.replace(
                      "apply plugin: 'com.android.application'",
                      "apply plugin: 'com.android.application'\n"
                      "apply plugin: 'com.google.gms.google-services'",
                      1
                  )

              elif (
                  'apply plugin: "com.android.application"'
                  in app_text
              ):

                  app_text = app_text.replace(
                      'apply plugin: "com.android.application"',
                      'apply plugin: "com.android.application"\n'
                      'apply plugin: "com.google.gms.google-services"',
                      1
                  )

              elif "plugins {" in app_text:

                  app_text = app_text.replace(
                      "plugins {",
                      "plugins {\n"
                      "    id 'com.google.gms.google-services'",
                      1
                  )

              else:

                  app_text = (
                      "apply plugin: "
                      "'com.google.gms.google-services'\n"
                      + app_text
                  )

          # --------------------------------------------------------
          # Dependencies
          # --------------------------------------------------------

          if "dependencies {" not in app_text:
              app_text += "\n\ndependencies {\n}\n"

          if "com.google.firebase:firebase-bom:" not in app_text:

              app_text = app_text.replace(
                  "dependencies {",
                  "dependencies {\n"
                  "    implementation platform("
                  "\"com.google.firebase:firebase-bom:34.19.0\")",
                  1
              )

          if (
              "com.google.firebase:firebase-messaging"
              not in app_text
          ):

              app_text = app_text.replace(
                  "dependencies {",
                  "dependencies {\n"
                  "    implementation "
                  "\"com.google.firebase:firebase-messaging\"",
                  1
              )

          # --------------------------------------------------------
          # Biometric dependency required by
          # RKMSSecureCredentialsPlugin.java
          # --------------------------------------------------------

          if (
              "androidx.biometric:biometric:"
              not in app_text
          ):

              app_text = app_text.replace(
                  "dependencies {",
                  "dependencies {\n"
                  "    implementation "
                  "\"androidx.biometric:biometric:1.1.0\"",
                  1
              )

          root.write_text(root_text)
          app.write_text(app_text)

          # --------------------------------------------------------
          # Firebase package verification
          # --------------------------------------------------------

          data = json.loads(
              Path("android/app/google-services.json")
              .read_text()
          )

          packages = []

          for client in data.get("client", []):

              info = client.get(
                  "client_info",
                  {}
              )

              android_info = info.get(
                  "android_client_info",
                  {}
              )

              package_name = android_info.get(
                  "package_name"
              )

              if package_name:
                  packages.append(package_name)

          if "org.rkms.connect" not in packages:

              raise SystemExit(
                  "ERROR: Firebase package "
                  "org.rkms.connect not found. "
                  f"Found: {packages}"
              )

          print(
              "Firebase package org.rkms.connect: PASS"
          )
          PY

          echo ""
          echo "Firebase configuration repaired."


      # ============================================================
      # 16. FIREBASE REAL VERIFICATION
      # ============================================================

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          test -s \
            android/app/google-services.json

          grep -Fq \
            'com.google.gms.google-services' \
            android/app/build.gradle

          grep -Fq \
            'com.google.gms:google-services:4.4.3' \
            android/build.gradle

          grep -Fq \
            'com.google.firebase:firebase-bom:34.19.0' \
            android/app/build.gradle

          grep -Fq \
            'com.google.firebase:firebase-messaging' \
            android/app/build.gradle

          grep -Fq \
            'androidx.biometric:biometric:1.1.0' \
            android/app/build.gradle

          echo "google-services.json: PASS"
          echo "Google Services plugin: PASS"
          echo "Google Services classpath: PASS"
          echo "Firebase BOM: PASS"
          echo "Firebase Messaging: PASS"
          echo "AndroidX Biometric: PASS"


      # ============================================================
      # 17. FIREBASE MAIN ACTIVITY
      # ============================================================

      - name: Verify Firebase MainActivity
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          MAIN="android/app/src/main/java/org/rkms/connect/MainActivity.java"

          test -f "$MAIN"

          echo "Checking:"
          echo "$MAIN"

          grep -Fq \
            'FirebaseApp.initializeApp(this)' \
            "$MAIN"

          grep -Fq \
            'registerPlugin(RKMSSecureCredentialsPlugin.class)' \
            "$MAIN"

          grep -Fq \
            'RKMSNativeBridge(this, getBridge().getWebView())' \
            "$MAIN"

          grep -Fq \
            'super.onCreate(savedInstanceState);' \
            "$MAIN"

          FIREBASE_COUNT="$(grep -F \
            -o 'FirebaseApp.initializeApp(this)' \
            "$MAIN" \
            | wc -l)"

          echo "Firebase init count: $FIREBASE_COUNT"

          if [ "$FIREBASE_COUNT" -ne 1 ]; then
            echo "ERROR: Firebase initialization count is not 1."
            exit 1
          fi

          ONCREATE_COUNT="$(grep -E \
            -c 'void[[:space:]]+onCreate[[:space:]]*\(' \
            "$MAIN" \
            || true)"

          echo "onCreate count: $ONCREATE_COUNT"

          if [ "$ONCREATE_COUNT" -ne 1 ]; then
            echo "ERROR: MainActivity must have exactly one onCreate."
            grep -n 'onCreate' "$MAIN" || true
            exit 1
          fi

          echo "Firebase MainActivity: PASS"


      # ============================================================
      # 18. NATIVE BRIDGE AUDIT
      # ============================================================

      - name: Verify native bridge
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 \
            scripts/verify-native-bridge.py

          BRIDGE="android/app/src/main/java/org/rkms/connect/RKMSNativeBridge.java"

          test -f "$BRIDGE"

          if grep -Fq '\n@JavascriptInterface' "$BRIDGE"; then
            echo "ERROR: literal \\n found."
            exit 1
          fi

          if grep -Fq '\n @JavascriptInterface' "$BRIDGE"; then
            echo "ERROR: literal \\n found."
            exit 1
          fi

          grep -Fq \
            'isFirebaseReady' \
            "$BRIDGE"

          grep -Fq \
            'saveSession' \
            "$BRIDGE"

          echo "Native bridge: PASS"


      # ============================================================
      # 19. SAVED LOGIN
      # ============================================================

      - name: Verify saved login
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 \
            scripts/verify-saved-login.py

          echo "Saved login: PASS"


      # ============================================================
      # 20. FCM
      # ============================================================

      - name: Verify FCM pipeline
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 \
            scripts/verify-fcm-pipeline.py

          echo "FCM pipeline: PASS"


      # ============================================================
      # 21. ANDROID 16 AUDIT
      # ============================================================

      - name: Verify Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 \
            scripts/verify-android-16.py

          echo "Android 16 API 36 audit: PASS"


      # ============================================================
      # 22. FINAL RKMS AUDIT
      # ============================================================

      - name: Verify final RKMS rules
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 \
            scripts/verify-rkms-final.py

          echo "Final RKMS audit: PASS"


      # ============================================================
      # 23. LOGIN AUDIT
      # ============================================================

      - name: Verify login navigation
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 \
            scripts/verify-final-login-navigation.py

          echo "Login navigation: PASS"


      # ============================================================
      # 24. AUTHORITY AUDIT
      # ============================================================

      - name: Verify authority hierarchy
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 \
            scripts/verify-authority-hierarchy.py

          echo "Authority hierarchy: PASS"


      # ============================================================
      # 25. DIRECTORY AUDIT
      # ============================================================

      - name: Verify directory
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 \
            scripts/verify-directory-lists.py

          python3 \
            scripts/verify-member-directory-scope.py

          python3 \
            scripts/verify-directory-contact-actions.py

          python3 \
            scripts/verify-v17-directory-deep.py

          echo "Directory audit: PASS"


      # ============================================================
      # 26. PROFILE AUDIT
      # ============================================================

      - name: Verify profile
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 \
            scripts/verify-profile-update-final.py

          echo "Profile audit: PASS"


      # ============================================================
      # 27. PDF AUDIT
      # ============================================================

      - name: Verify PDF pipeline
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 \
            scripts/verify-pdf-pipeline.py

          python3 \
            scripts/verify-report-download-scope.py

          echo "PDF/report audit: PASS"


      # ============================================================
      # 28. COMPLAINT IMPLEMENTATION AUDIT
      #
      # DO NOT RUN verify-complaint-final.py here because its
      # obsolete APK-only assertion rejects AAB workflows.
      # Check the actual complaint implementation instead.
      # ============================================================

      - name: Verify complaint implementation
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          grep -Fq \
            'memberCloseComplaint' \
            app.js

          grep -Fq \
            'memberReopenComplaint' \
            app.js

          grep -Fq \
            'officerCloseComplaint' \
            app.js

          grep -Fq \
            'rkms_officer_close_complaint' \
            app.js

          grep -Fq \
            'rkms_officer_close_complaint' \
            supabase/migrations/20260915090000_complaint_officer_close.sql

          grep -Fq \
            "if v_old<>'RESOLVED'" \
            supabase/migrations/20260915090000_complaint_officer_close.sql

          grep -Fq \
            '.complaint-action-card' \
            styles.css

          echo "Complaint implementation: PASS"


      # ============================================================
      # 29. RELEASE SIGNING SECRETS
      # ============================================================

      - name: Verify release signing secrets
        shell: bash
        run: |
          set -euo pipefail

          test -n \
            "${RKMS_KEYSTORE_BASE64:-}" \
            || {
              echo "ERROR: RKMS_KEYSTORE_BASE64 missing."
              exit 1
            }

          test -n \
            "${RKMS_KEYSTORE_PASSWORD:-}" \
            || {
              echo "ERROR: RKMS_KEYSTORE_PASSWORD missing."
              exit 1
            }

          test -n \
            "${RKMS_KEY_ALIAS:-}" \
            || {
              echo "ERROR: RKMS_KEY_ALIAS missing."
              exit 1
            }

          test -n \
            "${RKMS_KEY_PASSWORD:-}" \
            || {
              echo "ERROR: RKMS_KEY_PASSWORD missing."
              exit 1
            }

          echo "Release signing secrets: PASS"


      # ============================================================
      # 30. RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          chmod +x \
            scripts/configure-release-signing.sh

          bash \
            scripts/configure-release-signing.sh

          test -s \
            android/app/release.keystore

          grep -Fq \
            'signingConfigs.release' \
            android/app/build.gradle

          echo "Release signing: PASS"


      # ============================================================
      # 31. FINAL ANDROID CONFIGURATION
      # ============================================================

      - name: Final Android configuration check
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          test -d \
            "${ANDROID_HOME}/platforms/android-36"

          test -d \
            "${ANDROID_HOME}/build-tools/36.0.0"

          grep -Eq \
            'compileSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

          grep -Eq \
            'targetSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

          grep -Eq \
            'minSdkVersion[[:space:]]*=[[:space:]]*23' \
            android/variables.gradle

          grep -Fq \
            'com.android.tools.build:gradle:8.9.1' \
            android/build.gradle

          grep -Fq \
            'gradle-8.11.1-bin.zip' \
            android/gradle/wrapper/gradle-wrapper.properties

          echo "Android API 36: PASS"
          echo "compileSdk 36: PASS"
          echo "targetSdk 36: PASS"
          echo "minSdk 23: PASS"
          echo "AGP 8.9.1: PASS"
          echo "Gradle 8.11.1: PASS"


      # ============================================================
      # 32. FINAL FIREBASE CHECK
      # ============================================================

      - name: Final Firebase check
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          MAIN="android/app/src/main/java/org/rkms/connect/MainActivity.java"

          test -s \
            android/app/google-services.json

          test -f "$MAIN"

          grep -Fq \
            'FirebaseApp.initializeApp(this)' \
            "$MAIN"

          grep -Fq \
            'com.google.gms.google-services' \
            android/app/build.gradle

          grep -Fq \
            'com.google.firebase:firebase-messaging' \
            android/app/build.gradle

          grep -Fq \
            'androidx.biometric:biometric:1.1.0' \
            android/app/build.gradle

          echo "Firebase final check: PASS"


      # ============================================================
      # 33. BUILD RELEASE APK + AAB
      #
      # THIS IS THE REAL COMPILATION TEST.
      # ============================================================

      - name: Build signed Release APK and AAB
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR/android"

          chmod +x gradlew

          echo "============================================================"
          echo "RKMS RELEASE BUILD"
          echo "============================================================"

          ./gradlew \
            clean \
            assembleRelease \
            bundleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "GRADLE BUILD: PASS"


      # ============================================================
      # 34. VERIFY APK EXISTS
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK not found."

            find \
              android/app/build/outputs \
              -type f \
              -name '*.apk' \
              -print

            exit 1
          fi

          apksigner verify \
            --verbose \
            "$APK"

          echo "APK:"
          ls -lh "$APK"

          echo "APK signature: PASS"


      # ============================================================
      # 35. VERIFY AAB EXISTS
      # ============================================================

      - name: Verify AAB
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -s "$AAB" ]; then
            echo "ERROR: AAB not found."

            find \
              android/app/build/outputs \
              -type f \
              -name '*.aab' \
              -print

            exit 1
          fi

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB"

          echo "AAB:"
          ls -lh "$AAB"

          echo "AAB signature: PASS"


      # ============================================================
      # 36. PREPARE FINAL FILES
      # ============================================================

      - name: Prepare final release files
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          rm -rf release
          mkdir -p release

          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          cp \
            android/app/build/outputs/bundle/release/app-release.aab \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab

          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab

          echo "Final APK:"
          ls -lh \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          echo "Final AAB:"
          ls -lh \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab


      # ============================================================
      # 37. APK SHA256
      # ============================================================

      - name: Calculate APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          sha256sum \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk \
            | tee \
            release/RKMS_ANDROID16_API36_APK_SHA256.txt


      # ============================================================
      # 38. AAB SHA256
      # ============================================================

      - name: Calculate AAB SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          sha256sum \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab \
            | tee \
            release/RKMS_ANDROID16_API36_AAB_SHA256.txt


      # ============================================================
      # 39. FINAL RELEASE CHECK
      # ============================================================

      - name: Final release verification
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab

          apksigner verify \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          jarsigner -verify \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab

          echo ""
          echo "============================================================"
          echo "RKMS FINAL RELEASE BUILD: SUCCESS"
          echo "============================================================"
          echo "APK : SIGNED"
          echo "AAB : SIGNED"
          echo "API : 36"
          echo "Firebase : VERIFIED"
          echo "FCM : VERIFIED"
          echo "Saved Login : VERIFIED"
          echo "Native Bridge : VERIFIED"
          echo "============================================================"


      # ============================================================
      # 40. UPLOAD APK + AAB
      # ============================================================

      - name: Upload final APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Android-16-API36-FINAL-APK-AAB
          path: |
            ${{ env.SOURCE_DIR }}/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            ${{ env.SOURCE_DIR }}/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab
            ${{ env.SOURCE_DIR }}/release/RKMS_ANDROID16_API36_APK_SHA256.txt
            ${{ env.SOURCE_DIR }}/release/RKMS_ANDROID16_API36_AAB_SHA256.txt
          if-no-files-found: error
          retention-days: 90

name: RKMS CONNECT Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. CHECKOUT CURRENT REPOSITORY
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. PREPARE CURRENT RKMS SOURCE
      # IMPORTANT:
      # Never extract an old V8/V9/V10 ZIP here.
      # The APK must be built from the exact current Git commit.
      # ============================================================
      - name: Prepare RKMS source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build
          mkdir -p build

          rsync -a \
            --exclude='build/' \
            --exclude='android/' \
            --exclude='node_modules/' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='*.zip' \
            ./ build/

          echo "Using current checked-out RKMS source."

          test -f build/app.js
          test -f build/index.html
          test -f build/config.js
          test -f build/styles.css
          test -d build/assets
          test -s build/assets/rkms-logo-transparent.png

          LOGO_SHA="$(sha256sum build/assets/rkms-logo-transparent.png | cut -d' ' -f1)"

          test "$LOGO_SHA" = \
            "39a1d2aca7b3b3cbf748267600b32a82adf04abe377c5bb5cadd7deb29b6d43b"

          echo "Exact RKMS logo source verified."

      # ============================================================
      # 3. JAVASCRIPT SYNTAX
      # ============================================================
      - name: Verify JavaScript
        shell: bash
        run: |
          set -euo pipefail

          node --check build/app.js

          echo "app.js syntax verified."

      # ============================================================
      # 4. V1D / EXISTING RKMS FIXES + JWT + FCM SOURCE
      # ============================================================
      - name: Verify RKMS fixes and FCM client source
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          FILE="app.js"

          # Existing RKMS fixes
          grep -q "memberAreaLabel" "$FILE"
          grep -q "downloadPdf" "$FILE"
          grep -q "pdfBlobFromCanvas" "$FILE"
          grep -q "printPage" "$FILE"
          grep -q "renderMemberProfile" "$FILE"
          grep -q "member-profile" "$FILE"
          grep -q "nationalName" "$FILE"
          grep -q "nationalPost" "$FILE"
          grep -q "data-download-pdf" "$FILE"
          grep -q "rkmsSaveLoginCredentials" "$FILE"

          # Existing web/PDF fixes
          grep -q 'mode:"cors"' "$FILE"
          grep -q 'readAsDataURL' "$FILE"
          grep -q 'img.crossOrigin="anonymous"' "$FILE"
          grep -q 'fillFromOfficer' "$FILE"
          grep -q 'history.replaceState({rkmsRoute:"home"' "$FILE"
          grep -q 's.disabled=false' "$FILE"

          # JWT resume/refresh implementation
          grep -q "jwtExpiryMs" "$FILE"
          grep -q "refreshAccessTokenSilently" "$FILE"
          grep -q "isJwtAuthFailure" "$FILE"
          grep -q "visibilitychange" "$FILE"

          # FCM client registration
          grep -q "rkmsRegisterFcmPush" "$FILE"
          grep -q "rkms_notifications_v2" "$FILE"
          grep -q "action:'register_token'" "$FILE"
          grep -q "rkms-fcm-push" "$FILE"

          # Chat must NOT perform a second client-side queue dispatch.
          if grep -q "push_queue_ids" "$FILE"; then
            echo "ERROR: client-side push_queue_ids dispatch still exists."
            exit 1
          fi

          echo "RKMS + JWT + FCM source verification PASS."

      # ============================================================
      # 5. SAVED LOGIN
      # ============================================================
      - name: Verify Saved Login
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-saved-login.py

      # ============================================================
      # 6. DIRECTORY LISTS
      # ============================================================
      - name: Verify Directory Lists
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-directory-lists.py

      # ============================================================
      # 7. PDA AUTHORITY
      # ============================================================
      - name: Verify PDA authority hierarchy
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-authority-hierarchy.py

      # ============================================================
      # 8. PDF PIPELINE
      # ============================================================
      - name: Verify PDF pipeline
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-pdf-pipeline.py

      # ============================================================
      # 9. REPORT DOWNLOAD SECURITY
      # ============================================================
      - name: Verify report download security
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-report-download-scope.py

      # ============================================================
      # 10. RKMS FINAL STATIC AUDIT
      # ============================================================
      - name: Verify RKMS final static checks
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-rkms-final.py

      # ============================================================
      # 11. NATIVE BRIDGE SOURCE CHECK
      # ============================================================
      - name: Verify native bridge source
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          bash -n scripts/setup-android-native.sh
          python3 scripts/verify-native-bridge.py

      # ============================================================
      # 12. PYTHON VERIFICATION SCRIPTS
      # ============================================================
      - name: Verify all Python verification scripts
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          python3 -m py_compile scripts/*.py

          echo "All Python verification scripts compile successfully."

      # ============================================================
      # 13. CREATE CAPACITOR PACKAGE
      # IMPORTANT:
      # Only runtime web files go into dist.
      # Do NOT package migrations/scripts/docs into APK web assets.
      # ============================================================
      - name: Create Capacitor build package
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          cat > package.json <<'JSON'
          {
            "name": "rkms",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "rm -rf dist && mkdir -p dist && cp index.html app.js config.js styles.css manifest.webmanifest dist/ && cp -r assets dist/assets"
            },
            "dependencies": {
              "@capacitor/core": "6.2.2",
              "@capacitor/android": "6.2.2",
              "@capacitor/app": "6.0.3",
              "@capacitor/push-notifications": "6.0.3"
            },
            "devDependencies": {
              "@capacitor/cli": "6.2.2"
            }
          }
          JSON

          grep -q '"@capacitor/core": "6.2.2"' package.json
          grep -q '"@capacitor/android": "6.2.2"' package.json
          grep -q '"@capacitor/app": "6.0.3"' package.json
          grep -q '"@capacitor/push-notifications": "6.0.3"' package.json

          echo "Capacitor dependencies verified."

          cat > capacitor.config.json <<'JSON'
          {
            "appId": "org.rkms.connect",
            "appName": "RKMS",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https",
              "cleartext": true
            },
            "android": {
              "allowMixedContent": true,
              "captureInput": true,
              "webContentsDebuggingEnabled": false
            }
          }
          JSON

          echo "Capacitor configuration created."

      # ============================================================
      # 14. NODE.JS
      # ============================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ============================================================
      # 15. INSTALL CAPACITOR
      # ============================================================
      - name: Install Capacitor dependencies
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          npm install --no-audit --no-fund

      # ============================================================
      # 16. BUILD WEB APPLICATION
      # ============================================================
      - name: Build RKMS web application
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          npm run build

          test -f dist/index.html
          test -f dist/app.js
          test -f dist/config.js
          test -f dist/styles.css
          test -f dist/manifest.webmanifest
          test -s dist/assets/rkms-logo-transparent.png

          echo "RKMS web application build verified."

      # ============================================================
      # 17. JAVA
      # ============================================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ============================================================
      # 18. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 19. CREATE ANDROID PROJECT
      # ============================================================
      - name: Create Android platform
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          npx cap add android

      # ============================================================
      # 20. RKMS NATIVE BRIDGE
      # ============================================================
      - name: Add RKMS secure credential native bridge
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          bash scripts/setup-android-native.sh

      # ============================================================
      # 21. FIREBASE / FCM CONFIGURATION
      # ============================================================
      - name: Configure Firebase Android client for FCM
        working-directory: build
        shell: bash
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail

          if [ -n "$FIREBASE_GOOGLE_SERVICES_JSON" ]; then

            printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" \
              > android/app/google-services.json

            echo "Firebase config loaded from GitHub Secret."

          elif [ -f google-services.json ]; then

            cp google-services.json android/app/google-services.json

            echo "Firebase config loaded from bundled google-services.json."

          else

            echo "ERROR: Firebase Android configuration is missing."
            exit 1

          fi

          test -s android/app/google-services.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("android/app/google-services.json")

          try:
              data = json.loads(
                  p.read_text(encoding="utf-8")
              )
          except Exception as exc:
              raise SystemExit(
                  f"Invalid google-services.json: {exc}"
              )

          project_info = data.get("project_info", {})

          assert project_info.get("project_number"), \
              "google-services.json project_number missing"

          assert project_info.get("project_id"), \
              "google-services.json project_id missing"

          assert data.get("client"), \
              "google-services.json client section missing"

          print("Firebase Android client config verified.")
          PY

          # Configure Google Services Gradle plugin.
          python3 - <<'PY'
          from pathlib import Path

          root = Path("android/build.gradle")
          app = Path("android/app/build.gradle")

          if not root.exists():
              raise SystemExit(
                  "android/build.gradle not found"
              )

          if not app.exists():
              raise SystemExit(
                  "android/app/build.gradle not found"
              )

          root_text = root.read_text(
              encoding="utf-8"
          )

          app_text = app.read_text(
              encoding="utf-8"
          )

          plugin_dependency = (
              "com.google.gms:google-services:4.4.2"
          )

          if plugin_dependency not in root_text:

              marker = "dependencies {"

              if marker not in root_text:
                  raise SystemExit(
                      "android/build.gradle dependencies block not found"
                  )

              root_text = root_text.replace(
                  marker,
                  marker +
                  "\n        classpath '" +
                  plugin_dependency +
                  "'",
                  1
              )

              root.write_text(
                  root_text,
                  encoding="utf-8"
              )

          if "com.google.gms.google-services" not in app_text:

              app_text += (
                  "\napply plugin: "
                  "'com.google.gms.google-services'\n"
              )

              app.write_text(
                  app_text,
                  encoding="utf-8"
              )

          print(
              "Google Services Gradle plugin configured."
          )
          PY

      # ============================================================
      # 22. CAPACITOR SYNC
      # ============================================================
      - name: Sync RKMS application
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          npx cap sync android

      # ============================================================
      # 23. GENERATED ANDROID PDF BRIDGE
      # ============================================================
      - name: Verify generated Android PDF bridge
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-android-pdf.py

      # ============================================================
      # 24. BIOMETRIC DEPENDENCY
      # ============================================================
      - name: Add Android biometric dependency
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="android/app/build.gradle"

          test -f "$APP_GRADLE"

          if ! grep -q 'androidx.biometric:biometric' "$APP_GRADLE"; then
            sed -i \
              '/dependencies {/a\    implementation "androidx.biometric:biometric:1.1.0"' \
              "$APP_GRADLE"
          fi

          grep -q \
            'androidx.biometric:biometric:1.1.0' \
            "$APP_GRADLE"

          echo "Android biometric dependency verified."

      # ============================================================
      # 25. GENERATED NATIVE IMPLEMENTATION VERIFICATION
      # ============================================================
      - name: Verify generated Android native bridge and PDF implementation
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          MAIN_ACTIVITY="$(
            find android/app/src/main \
              -type f \
              -name 'MainActivity.java' \
              -print -quit
          )"

          NATIVE_BRIDGE="$(
            find android/app/src/main \
              -type f \
              -name 'RKMSNativeBridge.java' \
              -print -quit
          )"

          SECURE_PLUGIN="$(
            find android/app/src/main \
              -type f \
              -name 'RKMSSecureCredentialsPlugin.java' \
              -print -quit
          )"

          test -n "$MAIN_ACTIVITY"
          test -n "$NATIVE_BRIDGE"
          test -n "$SECURE_PLUGIN"

          echo "MainActivity: $MAIN_ACTIVITY"
          echo "RKMSNativeBridge: $NATIVE_BRIDGE"
          echo "Secure plugin: $SECURE_PLUGIN"

          # PDF native bridge
          grep -q 'beginPdfSave' "$NATIVE_BRIDGE"
          grep -q 'appendPdfChunk' "$NATIVE_BRIDGE"
          grep -q 'finishPdfSave' "$NATIVE_BRIDGE"
          grep -q 'cancelPdfSave' "$NATIVE_BRIDGE"

          grep -q \
            'MediaStore.Downloads.EXTERNAL_CONTENT_URI' \
            "$NATIVE_BRIDGE"

          grep -q \
            'Environment.DIRECTORY_DOWNLOADS' \
            "$NATIVE_BRIDGE"

          grep -q \
            'application/pdf' \
            "$NATIVE_BRIDGE"

          grep -q \
            'RKMS CONNECT' \
            "$NATIVE_BRIDGE"

          # MainActivity
          grep -q \
            'RKMSNativeBridge' \
            "$MAIN_ACTIVITY"

          grep -q \
            'getBridge().getWebView()' \
            "$MAIN_ACTIVITY"

          grep -q \
            'RKMSSecureCredentialsPlugin' \
            "$MAIN_ACTIVITY"

          # Secure credentials
          grep -q \
            'AndroidKeyStore' \
            "$SECURE_PLUGIN"

          grep -q \
            'AES/GCM/NoPadding' \
            "$SECURE_PLUGIN"

          grep -q \
            'BiometricPrompt' \
            "$SECURE_PLUGIN"

          echo "Generated Android native/PDF/Saved Login verification PASS."

      # ============================================================
      # 26. SAVED LOGIN NATIVE REGISTRATION
      # ============================================================
      - name: Verify Saved Login native registration
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          MAIN_ACTIVITY="$(
            find android/app/src/main \
              -type f \
              -name 'MainActivity.java' \
              -print -quit
          )"

          PLUGIN="$(
            find android/app/src/main \
              -type f \
              -name 'RKMSSecureCredentialsPlugin.java' \
              -print -quit
          )"

          test -n "$MAIN_ACTIVITY"
          test -n "$PLUGIN"

          grep -q \
            'RKMSSecureCredentialsPlugin' \
            "$MAIN_ACTIVITY"

          grep -q \
            'registerPlugin' \
            "$MAIN_ACTIVITY"

          grep -q \
            'AndroidKeyStore' \
            "$PLUGIN"

          grep -q \
            'AES/GCM/NoPadding' \
            "$PLUGIN"

          grep -q \
            'BiometricPrompt' \
            "$PLUGIN"

          grep -q \
            'BIOMETRIC_STRONG' \
            "$PLUGIN"

          grep -q \
            'DEVICE_CREDENTIAL' \
            "$PLUGIN"

          echo "Saved Login native registration/security verification PASS."

      # ============================================================
      # 27. FCM ANDROID INTEGRATION
      # ============================================================
      - name: Verify FCM Android integration
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          test -s \
            android/app/google-services.json

          grep -q \
            'com.google.gms.google-services' \
            android/app/build.gradle

          grep -q \
            '@capacitor/push-notifications' \
            package.json

          echo "FCM Android integration verification PASS."

      # ============================================================
      # 28. IMAGE TOOLS
      # ============================================================
      - name: Install image tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      # ============================================================
      # 29. INSTALL FINAL RKMS LAUNCHER LOGO
      # AFTER CAPACITOR SYNC
      # ============================================================
      - name: Install exact RKMS launcher logo
        shell: bash
        run: |
          set -euo pipefail

          LOGO="build/assets/rkms-logo-transparent.png"
          RES="build/android/app/src/main/res"
          STRINGS="build/android/app/src/main/res/values/strings.xml"

          test -s "$LOGO"
          test -f "$STRINGS"

          mkdir -p \
            "$RES/mipmap-mdpi" \
            "$RES/mipmap-hdpi" \
            "$RES/mipmap-xhdpi" \
            "$RES/mipmap-xxhdpi" \
            "$RES/mipmap-xxxhdpi"

          # Keep generous transparent safe area so Android launchers
          # do not clip the RKMS emblem.

          convert "$LOGO" \
            -resize 32x32 \
            -strip \
            -gravity center \
            -background none \
            -extent 48x48 \
            "$RES/mipmap-mdpi/ic_launcher.png"

          convert "$LOGO" \
            -resize 48x48 \
            -strip \
            -gravity center \
            -background none \
            -extent 72x72 \
            "$RES/mipmap-hdpi/ic_launcher.png"

          convert "$LOGO" \
            -resize 64x64 \
            -strip \
            -gravity center \
            -background none \
            -extent 96x96 \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          convert "$LOGO" \
            -resize 96x96 \
            -strip \
            -gravity center \
            -background none \
            -extent 144x144 \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          convert "$LOGO" \
            -resize 128x128 \
            -strip \
            -gravity center \
            -background none \
            -extent 192x192 \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"

          # Round launcher versions use the same exact RKMS artwork.
          cp \
            "$RES/mipmap-mdpi/ic_launcher.png" \
            "$RES/mipmap-mdpi/ic_launcher_round.png"

          cp \
            "$RES/mipmap-hdpi/ic_launcher.png" \
            "$RES/mipmap-hdpi/ic_launcher_round.png"

          cp \
            "$RES/mipmap-xhdpi/ic_launcher.png" \
            "$RES/mipmap-xhdpi/ic_launcher_round.png"

          cp \
            "$RES/mipmap-xxhdpi/ic_launcher.png" \
            "$RES/mipmap-xxhdpi/ic_launcher_round.png"

          cp \
            "$RES/mipmap-xxxhdpi/ic_launcher.png" \
            "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

          # Remove adaptive icon resources so Android resolves
          # directly to the RKMS PNG launcher artwork.

          rm -rf \
            "$RES/mipmap-anydpi-v26" \
            "$RES/mipmap-anydpi"

          find "$RES" -type f \( \
            -name 'ic_launcher_foreground.xml' -o \
            -name 'ic_launcher_background.xml' -o \
            -name 'ic_launcher_foreground.png' -o \
            -name 'ic_launcher_background.png' \
          \) -delete || true

          if grep -q \
            '<string name="app_name">' \
            "$STRINGS"; then

            sed -i \
              's#<string name="app_name">.*</string>#<string name="app_name">RKMS</string>#' \
              "$STRINGS"

          else

            printf '\n    <string name="app_name">RKMS</string>\n' \
              >> "$STRINGS"

          fi

          echo "Final launcher icon:"
          identify \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"

          echo "Final app name:"
          grep -n \
            'app_name' \
            "$STRINGS"

      # ============================================================
      # 30. VERIFY LAUNCHER
      # ============================================================
      - name: Verify launcher icon
        shell: bash
        run: |
          set -euo pipefail

          RES="build/android/app/src/main/res"

          for density in \
            mdpi \
            hdpi \
            xhdpi \
            xxhdpi \
            xxxhdpi
          do
            test -s \
              "$RES/mipmap-$density/ic_launcher.png"

            test -s \
              "$RES/mipmap-$density/ic_launcher_round.png"
          done

          grep -q \
            '<string name="app_name">RKMS</string>' \
            "$RES/values/strings.xml"

          echo "RKMS launcher icon and app name verification PASS."

      # ============================================================
      # 31. GRADLE EXECUTABLE
      # ============================================================
      - name: Make Gradle executable
        shell: bash
        run: |
          set -euo pipefail

          chmod +x build/android/gradlew

      # ============================================================
      # 32. BUILD DEBUG APK
      # ============================================================
      - name: Build Debug APK
        working-directory: build/android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 33. VERIFY APK
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="build/android/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "RKMS APK successfully created:"
          ls -lh "$APK"

          echo "APK SHA256:"
          sha256sum "$APK"

      # ============================================================
      # 34. UPLOAD APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-debug-apk
          path: build/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

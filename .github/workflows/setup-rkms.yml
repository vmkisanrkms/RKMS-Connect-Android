name: RKMS CONNECT Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            package.json

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Install Capacitor Android
        run: |
          npm install @capacitor/core@^6.0.0 @capacitor/android@^6.0.0 @capacitor/app@^6.0.0 @capacitor/haptics@^6.0.0 @capacitor/keyboard@^6.0.0 @capacitor/status-bar@^6.0.0
          npm install --save-dev @capacitor/cli@^6.0.0

      - name: Sync Capacitor Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-CONNECT-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

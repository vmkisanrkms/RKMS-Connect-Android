name: Build RKMS Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_VERSION: "8.9"

jobs:
  build:
    name: Build RKMS Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ---------------------------------------------------------
      # 1. Checkout Android source
      # ---------------------------------------------------------
      - name: Checkout Android Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # 2. Setup Java
      # ---------------------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ---------------------------------------------------------
      # 3. Locate Android project
      # ---------------------------------------------------------
      - name: Locate Android Project
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository:"
          pwd

          echo ""
          echo "Top-level files:"
          find . -maxdepth 2 -type f | sort | head -200

          echo ""
          echo "Searching for Gradle project..."

          ANDROID_PROJECT="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "gradlew" \
            -not -path "*/.gradle/*" \
            | head -n 1)"

          if [ -z "$ANDROID_PROJECT" ]; then
            echo "::error::gradlew not found."
            exit 1
          fi

          ANDROID_DIR="$(dirname "$ANDROID_PROJECT")"

          echo "ANDROID_PROJECT=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$ANDROID_DIR"

      # ---------------------------------------------------------
      # 4. Find final website ZIP
      # ---------------------------------------------------------
      - name: Locate Final Website ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for website ZIP..."

          WEBSITE_ZIP="$(find "$GITHUB_WORKSPACE" \
            -type f \
            \( -name "RKMS_Chat_Live_Realtime_Fix.zip" \
               -o -name "*Chat*Live*Realtime*.zip" \
               -o -name "*.zip" \) \
            -not -path "*/.git/*" \
            | head -n 1)"

          if [ -z "$WEBSITE_ZIP" ]; then
            echo "::error::Website ZIP not found."
            echo "ZIP files found:"
            find "$GITHUB_WORKSPACE" -type f -name "*.zip" -print
            exit 1
          fi

          echo "WEBSITE_ZIP=$WEBSITE_ZIP" >> "$GITHUB_ENV"

          echo "Using:"
          echo "$WEBSITE_ZIP"

      # ---------------------------------------------------------
      # 5. Extract website
      # ---------------------------------------------------------
      - name: Extract Final Website
        shell: bash
        run: |
          set -euo pipefail

          WEB_EXTRACT="$RUNNER_TEMP/rkms-web"

          rm -rf "$WEB_EXTRACT"
          mkdir -p "$WEB_EXTRACT"

          echo "Extracting:"
          echo "$WEBSITE_ZIP"

          unzip -q "$WEBSITE_ZIP" -d "$WEB_EXTRACT"

          echo ""
          echo "Extracted files:"
          find "$WEB_EXTRACT" -maxdepth 5 -type f | sort | head -300

          echo ""
          echo "Searching for app.js..."

          APP_JS="$(find "$WEB_EXTRACT" \
            -type f \
            -name "app.js" \
            -print \
            | head -n 1)"

          if [ -z "$APP_JS" ]; then
            echo "::error::app.js not found inside website ZIP."

            echo ""
            echo "All JavaScript files:"
            find "$WEB_EXTRACT" -type f \
              \( -name "*.js" -o -name "*.mjs" \) \
              -print

            exit 1
          fi

          WEB_ROOT="$(dirname "$APP_JS")"

          echo "APP_JS=$APP_JS" >> "$GITHUB_ENV"
          echo "WEB_ROOT=$WEB_ROOT" >> "$GITHUB_ENV"

          echo ""
          echo "Website root:"
          echo "$WEB_ROOT"

          echo ""
          echo "app.js:"
          echo "$APP_JS"

      # ---------------------------------------------------------
      # 6. Verify website files
      # ---------------------------------------------------------
      - name: Verify Website
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking website..."

          test -f "$APP_JS" || {
            echo "::error::app.js missing"
            exit 1
          }

          test -f "$WEB_ROOT/index.html" || {
            echo "::error::index.html missing"
            exit 1
          }

          if [ ! -f "$WEB_ROOT/styles.css" ]; then
            echo "WARNING: styles.css not found"
          fi

          if [ ! -f "$WEB_ROOT/config.js" ]; then
            echo "WARNING: config.js not found"
          fi

          echo ""
          echo "Website verification PASS"

          echo ""
          echo "app.js size:"
          wc -c "$APP_JS"

      # ---------------------------------------------------------
      # 7. Locate Android assets/www
      # ---------------------------------------------------------
      - name: Locate Android Web Assets
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching Android assets/www..."

          ANDROID_WEB="$(find "$ANDROID_PROJECT" \
            -type d \
            -path "*/src/main/assets/www" \
            | head -n 1)"

          if [ -z "$ANDROID_WEB" ]; then
            echo "::error::Android assets/www directory not found."

            echo ""
            echo "Existing assets directories:"
            find "$ANDROID_PROJECT" \
              -type d \
              -name "assets" \
              -print

            exit 1
          fi

          echo "ANDROID_WEB=$ANDROID_WEB" >> "$GITHUB_ENV"

          echo "Android web directory:"
          echo "$ANDROID_WEB"

      # ---------------------------------------------------------
      # 8. Backup existing app.js
      # ---------------------------------------------------------
      - name: Backup Existing App JS
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$ANDROID_WEB/app.js" ]; then
            cp "$ANDROID_WEB/app.js" \
              "$ANDROID_WEB/app.js.before-live-chat-fix"
          fi

      # ---------------------------------------------------------
      # 9. Install fixed app.js
      # ---------------------------------------------------------
      - name: Install Live Chat Fix
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing fixed app.js..."

          cp "$APP_JS" "$ANDROID_WEB/app.js"

          echo ""
          echo "Installed:"
          ls -lh "$ANDROID_WEB/app.js"

          echo ""
          echo "Checking file..."

          test -s "$ANDROID_WEB/app.js"

          echo "Live chat app.js installation PASS"

      # ---------------------------------------------------------
      # 10. Validate JavaScript
      # ---------------------------------------------------------
      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail

          echo "Validating app.js..."

          node --check "$ANDROID_WEB/app.js"

          echo ""
          echo "JavaScript syntax PASS"

      # ---------------------------------------------------------
      # 11. Check Live Chat code
      # ---------------------------------------------------------
      - name: Verify Live Chat Fix
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking live chat implementation..."

          if grep -q "rkmsChatLive" "$ANDROID_WEB/app.js"; then
            echo "Live chat polling/realtime code found."
          else
            echo "::warning::rkmsChatLive code not found."
          fi

          if grep -q "postgres_changes" "$ANDROID_WEB/app.js"; then
            echo "Supabase Realtime postgres_changes code found."
          else
            echo "No postgres_changes listener found."
            echo "Fallback polling will be used if present."
          fi

          if grep -q "setInterval" "$ANDROID_WEB/app.js"; then
            echo "Polling fallback detected."
          fi

      # ---------------------------------------------------------
      # 12. Verify Book
      # ---------------------------------------------------------
      - name: Verify Book 60 Pages
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking book/page related files..."

          find "$ANDROID_WEB" \
            -type f \
            | grep -Ei "book|pdf|page" \
            | head -100 || true

          echo "Book verification completed."

      # ---------------------------------------------------------
      # 13. Verify Supabase Configuration
      # ---------------------------------------------------------
      - name: Verify Supabase Configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Supabase references..."

          if grep -Rqi "supabase" "$ANDROID_WEB"; then
            echo "Supabase references found."
          else
            echo "::warning::No Supabase reference found in web assets."
          fi

          echo "Supabase verification completed."

      # ---------------------------------------------------------
      # 14. Verify RKMS Frontend Fixes
      # ---------------------------------------------------------
      - name: Verify RKMS Frontend Fixes
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking important frontend files..."

          test -f "$ANDROID_WEB/app.js"

          echo "Frontend verification PASS"

      # ---------------------------------------------------------
      # 15. Clean Gradle
      # ---------------------------------------------------------
      - name: Clean Gradle
        working-directory: ${{ env.ANDROID_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      # ---------------------------------------------------------
      # 16. Build Release APK
      # ---------------------------------------------------------
      - name: Build Release APK
        working-directory: ${{ env.ANDROID_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

      # ---------------------------------------------------------
      # 17. Find APK
      # ---------------------------------------------------------
      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for APK..."

          APK="$(find "$ANDROID_PROJECT" \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "::error::Release APK not found."

            echo ""
            echo "Available APK files:"
            find "$ANDROID_PROJECT" \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo ""
          echo "APK:"
          echo "$APK"

          echo ""
          ls -lh "$APK"

      # ---------------------------------------------------------
      # 18. Upload APK
      # ---------------------------------------------------------
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-Live-Chat-Fixed
          path: ${{ env.APK }}
          if-no-files-found: error

      # ---------------------------------------------------------
      # 19. Upload patched web app.js
      # ---------------------------------------------------------
      - name: Upload Patched app.js
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Chat-Live-Fixed-app-js
          path: ${{ env.ANDROID_WEB }}/app.js
          if-no-files-found: error

      # ---------------------------------------------------------
      # 20. Final status
      # ---------------------------------------------------------
      - name: Build Complete
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo " RKMS RELEASE BUILD SUCCESS"
          echo "=========================================="
          echo ""
          echo "Chat Live Fix: INSTALLED"
          echo "Website: UNCHANGED"
          echo "APK: BUILT"
          echo ""

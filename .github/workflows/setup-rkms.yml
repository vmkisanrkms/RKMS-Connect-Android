name: RKMS Android 16 API 36 - Final Signed Release APK Only

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  AGP_VERSION: "8.9.1"
  GRADLE_VERSION: "8.11.1"

  FIREBASE_BOM_VERSION: "34.19.0"
  GOOGLE_SERVICES_VERSION: "4.5.0"
  CREDENTIALS_VERSION: "1.5.0"

  APP_ID: "org.rkms.connect"
  MIN_SDK: "23"
  TARGET_SDK: "36"

  APK_NAME: "RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"

jobs:

  build:

    name: Build Final Signed Release APK Only

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. LOCATE RKMS SOURCE
      # ============================================================

      - name: Locate RKMS source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP=""

          for candidate in \
            "RKMS_CONNECT_FINAL_BUILD_V6_ALL_FIXES_GPM_APK_ONLY.zip" \
            "RKMS_CONNECT_FINAL_BUILD_V5_ALL_FIXES_FINAL.zip"
          do
            if [ -f "$candidate" ]; then
              ZIP="$candidate"
              break
            fi
          done

          if [ -z "$ZIP" ]; then
            ZIP="$(
              find . \
                -maxdepth 3 \
                -type f \
                -iname "*.zip" \
                -print \
              | grep -E "RKMS|rkms" \
              | head -n 1 \
              || true
            )"
          fi

          if [ -z "$ZIP" ]; then
            echo "::error::RKMS source ZIP not found."
            exit 1
          fi

          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"

          echo "Source ZIP:"
          echo "$ZIP"


      # ============================================================
      # 3. EXTRACT
      # ============================================================

      - name: Extract RKMS source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build-project

          mkdir -p build-project

          unzip -q \
            "$SOURCE_ZIP" \
            -d build-project


      # ============================================================
      # 4. DETECT PROJECT ROOT
      # ============================================================

      - name: Detect RKMS project root
        shell: bash
        run: |
          set -euo pipefail

          ROOT=""

          if [ -f "build-project/package.json" ]; then
            ROOT="build-project"
          else
            ROOT="$(
              find build-project \
                -type f \
                -name "package.json" \
                -not -path "*/node_modules/*" \
                -print \
                | head -n 1 \
                | xargs -r dirname
            )"
          fi

          if [ -z "$ROOT" ]; then
            echo "::error::package.json not found."
            exit 1
          fi

          echo "RKMS_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "RKMS_ROOT=$ROOT"


      # ============================================================
      # 5. SOURCE VALIDATION
      # ============================================================

      - name: Validate RKMS source
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          REQUIRED_FILES=(
            "package.json"
            "app.js"
            "capacitor.config.json"
            "google-services.json"
            "scripts/setup-android-native.sh"
          )

          for file in "${REQUIRED_FILES[@]}"; do

            if [ ! -f "$file" ]; then
              echo "::error::Missing: $file"
              exit 1
            fi

          done

          echo "Source validation PASS."


      # ============================================================
      # 6. CAPACITOR VERSION
      # ============================================================

      - name: Verify Capacitor versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node <<'NODE'
          const fs = require("fs");

          const p = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const deps = {
            ...(p.dependencies || {}),
            ...(p.devDependencies || {})
          };

          const required = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          for (const [name, version] of Object.entries(required)) {

            if (!deps[name]) {
              throw new Error(
                `Missing dependency: ${name}`
              );
            }

            console.log(
              `${name}: ${deps[name]}`
            );
          }

          console.log(
            "Capacitor validation PASS."
          );
          NODE


      # ============================================================
      # 7. NODE 22
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ env.RKMS_ROOT }}/package-lock.json


      # ============================================================
      # 8. NPM INSTALL
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi


      # ============================================================
      # 9. WEB BUILD
      # ============================================================

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          if node -e '
            const p=require("./package.json");
            process.exit(
              p.scripts && p.scripts.build ? 0 : 1
            );
          '; then

            npm run build

          else

            echo "No build script found."
            echo "Using existing web source."

          fi


      # ============================================================
      # 10. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 11. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: "true"
          log-accepted-android-sdk-licenses: "false"


      # ============================================================
      # 12. INSTALL API 36
      # ============================================================

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses \
            >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "Android API 36 installed."


      # ============================================================
      # 13. VERIFY SDK
      # ============================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          test -d \
            "$SDK/platforms/android-36"

          test -d \
            "$SDK/build-tools/36.0.0"

          test -x \
            "$SDK/build-tools/36.0.0/aapt"

          test -x \
            "$SDK/build-tools/36.0.0/apksigner"

          echo "Android API 36 PASS."
          echo "Build Tools 36.0.0 PASS."


      # ============================================================
      # 14. CREATE ANDROID PROJECT
      # ============================================================

      - name: Create Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          rm -rf android

          npx cap add android


      # ============================================================
      # 15. CAPACITOR SYNC
      # ============================================================

      - name: Capacitor sync Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npx cap sync android


      # ============================================================
      # 16. ANDROID SDK CONFIGURATION
      #
      # minSdk = 23 because Firebase Messaging 25.1.3
      # requires Android 6.0 / API 23.
      # ============================================================

      - name: Configure Android SDK versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          python3 <<'PY'
          from pathlib import Path
          import re

          # ========================================================
          # variables.gradle
          # ========================================================

          variables = Path(
              "variables.gradle"
          )

          if variables.exists():

              s = variables.read_text(
                  encoding="utf-8"
              )

              replacements = [
                  (
                      r'(\bcompileSdkVersion\s*=\s*)\d+',
                      r'\g<1>36'
                  ),
                  (
                      r'(\btargetSdkVersion\s*=\s*)\d+',
                      r'\g<1>36'
                  ),
                  (
                      r'(\bminSdkVersion\s*=\s*)\d+',
                      r'\g<1>23'
                  ),
                  (
                      r'(\bcompileSdk\s*=\s*)\d+',
                      r'\g<1>36'
                  ),
                  (
                      r'(\btargetSdk\s*=\s*)\d+',
                      r'\g<1>36'
                  ),
                  (
                      r'(\bminSdk\s*=\s*)\d+',
                      r'\g<1>23'
                  )
              ]

              for pattern, replacement in replacements:

                  s = re.sub(
                      pattern,
                      replacement,
                      s
                  )

              variables.write_text(
                  s,
                  encoding="utf-8"
              )

          # ========================================================
          # app/build.gradle
          # ========================================================

          app = Path(
              "app/build.gradle"
          )

          if not app.exists():
              raise SystemExit(
                  "app/build.gradle missing."
              )

          s = app.read_text(
              encoding="utf-8"
          )

          replacements = [
              (
                  r'(\bcompileSdkVersion\s*)\d+',
                  r'\g<1>36'
              ),
              (
                  r'(\btargetSdkVersion\s*)\d+',
                  r'\g<1>36'
              ),
              (
                  r'(\bminSdkVersion\s*)\d+',
                  r'\g<1>23'
              ),
              (
                  r'(\bcompileSdk\s*)\d+',
                  r'\g<1>36'
              ),
              (
                  r'(\btargetSdk\s*)\d+',
                  r'\g<1>36'
              ),
              (
                  r'(\bminSdk\s*)\d+',
                  r'\g<1>23'
              )
          ]

          for pattern, replacement in replacements:

              s = re.sub(
                  pattern,
                  replacement,
                  s
              )

          app.write_text(
              s,
              encoding="utf-8"
          )

          print(
              "compileSdk = 36"
          )
          print(
              "targetSdk = 36"
          )
          print(
              "minSdk = 23"
          )
          PY


      # ============================================================
      # 17. AGP 8.9.1
      # ============================================================

      - name: Configure AGP 8.9.1
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "build.gradle"
          )

          s = p.read_text(
              encoding="utf-8"
          )

          s = re.sub(
              r'(classpath\s+["\']'
              r'com\.android\.tools\.build:gradle:)'
              r'[^"\']+',
              r'\g<1>8.9.1',
              s
          )

          s = re.sub(
              r'(com\.android\.application'
              r'["\']\s+version\s+["\'])'
              r'[^"\']+',
              r'\g<1>8.9.1',
              s
          )

          p.write_text(
              s,
              encoding="utf-8"
          )

          print(
              "AGP 8.9.1 configured."
          )
          PY


      # ============================================================
      # 18. GRADLE 8.11.1
      # ============================================================

      - name: Configure Gradle 8.11.1
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          mkdir -p \
            gradle/wrapper

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "gradle/wrapper/"
              "gradle-wrapper.properties"
          )

          lines = []

          if p.exists():

              lines = p.read_text(
                  encoding="utf-8"
              ).splitlines()

          url = (
              "distributionUrl="
              "https\\://services.gradle.org/"
              "distributions/"
              "gradle-8.11.1-all.zip"
          )

          found = False

          for i, line in enumerate(lines):

              if line.startswith(
                  "distributionUrl="
              ):

                  lines[i] = url
                  found = True

          if not found:
              lines.append(url)

          p.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )
          PY

          chmod +x gradlew

          ./gradlew --version


      # ============================================================
      # 19. FIREBASE JSON
      # ============================================================

      - name: Install Firebase google-services.json
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          test -f \
            google-services.json

          mkdir -p \
            android/app

          cp \
            google-services.json \
            android/app/google-services.json

          test -f \
            android/app/google-services.json


      # ============================================================
      # 20. FIREBASE DEPENDENCIES
      # ============================================================

      - name: Configure Firebase FCM
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "app/build.gradle"
          )

          s = p.read_text(
              encoding="utf-8"
          )

          marker = \
              "dependencies {"

          if marker not in s:
              raise SystemExit(
                  "dependencies block missing."
              )

          dependencies = [

              (
                  'implementation platform('
                  '"com.google.firebase:'
                  'firebase-bom:34.19.0")'
              ),

              (
                  'implementation '
                  '"com.google.firebase:'
                  'firebase-messaging"'
              )
          ]

          for dep in dependencies:

              if dep not in s:

                  s = s.replace(
                      marker,
                      marker
                      + "\n    "
                      + dep,
                      1
                  )

          p.write_text(
              s,
              encoding="utf-8"
          )

          print(
              "Firebase dependencies PASS."
          )
          PY


      # ============================================================
      # 21. CREDENTIAL MANAGER
      # ============================================================

      - name: Configure Credential Manager
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "app/build.gradle"
          )

          s = p.read_text(
              encoding="utf-8"
          )

          marker = \
              "dependencies {"

          dependencies = [

              (
                  'implementation '
                  '"androidx.credentials:'
                  'credentials:1.5.0"'
              ),

              (
                  'implementation '
                  '"androidx.credentials:'
                  'credentials-play-services-auth:1.5.0"'
              )
          ]

          for dep in dependencies:

              if dep not in s:

                  s = s.replace(
                      marker,
                      marker
                      + "\n    "
                      + dep,
                      1
                  )

          p.write_text(
              s,
              encoding="utf-8"
          )

          print(
              "Credential Manager PASS."
          )
          PY


      # ============================================================
      # 22. GOOGLE SERVICES PLUGIN
      # ============================================================

      - name: Configure Google Services plugin
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path(
              "build.gradle"
          )

          app = Path(
              "app/build.gradle"
          )

          root_text = root.read_text(
              encoding="utf-8"
          )

          # ========================================================
          # FIND BUILDSCRIPT
          # ========================================================

          m = re.search(
              r'buildscript\s*\{',
              root_text
          )

          if not m:

              raise SystemExit(
                  "buildscript block missing."
              )

          start = m.start()

          depth = 0
          end = None

          for i in range(
              start,
              len(root_text)
          ):

              if root_text[i] == "{":
                  depth += 1

              elif root_text[i] == "}":

                  depth -= 1

                  if depth == 0:

                      end = i + 1
                      break

          if end is None:

              raise SystemExit(
                  "Cannot parse buildscript."
              )

          buildscript = root_text[
              start:end
          ]

          # ========================================================
          # GOOGLE REPOSITORY
          # ========================================================

          if "google()" not in buildscript:

              repositories = re.search(
                  r'repositories\s*\{',
                  buildscript
              )

              if not repositories:

                  raise SystemExit(
                      "buildscript repositories missing."
                  )

              pos = repositories.end()

              buildscript = (
                  buildscript[:pos]
                  + "\n        google()"
                  + buildscript[pos:]
              )

          # ========================================================
          # GOOGLE SERVICES CLASSPATH
          # ========================================================

          classpath = (
              "com.google.gms:"
              "google-services:4.5.0"
          )

          if classpath not in buildscript:

              dependencies = re.search(
                  r'dependencies\s*\{',
                  buildscript
              )

              if not dependencies:

                  raise SystemExit(
                      "buildscript dependencies missing."
                  )

              pos = dependencies.end()

              buildscript = (
                  buildscript[:pos]
                  + "\n        classpath "
                  "'com.google.gms:"
                  "google-services:4.5.0'"
                  + buildscript[pos:]
              )

          root_text = (
              root_text[:start]
              + buildscript
              + root_text[end:]
          )

          root.write_text(
              root_text,
              encoding="utf-8"
          )

          # ========================================================
          # APP PLUGIN
          # ========================================================

          app_text = app.read_text(
              encoding="utf-8"
          )

          plugin = \
              "com.google.gms.google-services"

          if plugin not in app_text:

              if "plugins {" in app_text:

                  app_text = app_text.replace(
                      "plugins {",
                      "plugins {\n"
                      "    id "
                      "'com.google.gms.google-services'",
                      1
                  )

              else:

                  app_text = (
                      "apply plugin: "
                      "'com.google.gms.google-services'"
                      "\n\n"
                      + app_text
                  )

          app.write_text(
              app_text,
              encoding="utf-8"
          )

          print(
              "Google Services PASS."
          )
          PY


      # ============================================================
      # 23. VERIFY FIREBASE
      # ============================================================

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          test -f \
            app/google-services.json

          grep -Fq \
            "firebase-bom:34.19.0" \
            app/build.gradle

          grep -Fq \
            "firebase-messaging" \
            app/build.gradle

          grep -Fq \
            "com.google.gms.google-services" \
            app/build.gradle

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "build.gradle"
          )

          s = p.read_text(
              encoding="utf-8"
          )

          m = re.search(
              r'buildscript\s*\{',
              s
          )

          if not m:
              raise SystemExit(
                  "buildscript missing."
              )

          start = m.start()

          depth = 0
          end = None

          for i in range(
              start,
              len(s)
          ):

              if s[i] == "{":
                  depth += 1

              elif s[i] == "}":

                  depth -= 1

                  if depth == 0:
                      end = i + 1
                      break

          block = s[
              start:end
          ]

          if (
              "com.google.gms:"
              "google-services:4.5.0"
          ) not in block:

              raise SystemExit(
                  "Google Services classpath missing."
              )

          if "google()" not in block:

              raise SystemExit(
                  "google() repository missing."
              )

          print(
              "Firebase configuration PASS."
          )
          PY


      # ============================================================
      # 24. VERIFY FIREBASE PACKAGE
      # ============================================================

      - name: Verify Firebase package
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          python3 <<'PY'
          import json

          with open(
              "app/google-services.json",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          found = False

          for client in data.get(
              "client",
              []
          ):

              package_name = (
                  client
                  .get(
                      "client_info",
                      {}
                  )
                  .get(
                      "android_client_info",
                      {}
                  )
                  .get(
                      "package_name"
                  )
              )

              if package_name == \
                  "org.rkms.connect":

                  found = True
                  break

          if not found:

              raise SystemExit(
                  "Firebase package mismatch."
              )

          print(
              "Firebase package PASS."
          )
          PY


      # ============================================================
      # 25. NATIVE RKMS SETUP
      # ============================================================

      - name: Configure RKMS native Android bridge
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/setup-android-native.sh

          ./scripts/setup-android-native.sh


      # ============================================================
      # 26. FIX CREDENTIAL MANAGER
      # ============================================================

      - name: Fix Credential Manager signature
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(
              r'createCredentialAsync\s*\(\s*'
              r'req\s*,',
              re.MULTILINE
          )

          replacement = (
              "createCredentialAsync(\n"
              "                            activity,\n"
              "                            req,"
          )

          setup = Path(
              "scripts/setup-android-native.sh"
          )

          s = setup.read_text(
              encoding="utf-8"
          )

          s, count = pattern.subn(
              replacement,
              s
          )

          setup.write_text(
              s,
              encoding="utf-8"
          )

          print(
              "Source Credential Manager fixes:",
              count
          )

          for java in Path(
              "android/app/src/main/java"
          ).rglob(
              "RKMSNativeBridge.java"
          ):

              s = java.read_text(
                  encoding="utf-8"
              )

              s, count = pattern.subn(
                  replacement,
                  s
              )

              java.write_text(
                  s,
                  encoding="utf-8"
              )

              print(
                  f"{java}: {count}"
              )
          PY


      # ============================================================
      # 27. VERIFY CREDENTIAL MANAGER
      # ============================================================

      - name: Verify Credential Manager
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          BRIDGE="$(
            find android/app/src/main/java \
              -type f \
              -name "RKMSNativeBridge.java" \
              -print \
              | head -n 1
          )"

          test -n "$BRIDGE"

          grep -Fq \
            "CredentialManager" \
            "$BRIDGE"

          grep -Fq \
            "CreatePasswordRequest" \
            "$BRIDGE"

          grep -Fq \
            "savePassword" \
            "$BRIDGE"

          grep -Fq \
            "createCredentialAsync" \
            "$BRIDGE"

          python3 - "$BRIDGE" <<'PY'
          from pathlib import Path
          import re
          import sys

          s = Path(
              sys.argv[1]
          ).read_text(
              encoding="utf-8"
          )

          if not re.search(
              r'createCredentialAsync\s*\(\s*'
              r'activity\s*,\s*'
              r'req\s*,',
              s,
              re.S
          ):

              raise SystemExit(
                  "Wrong Credential Manager argument order."
              )

          print(
              "Credential Manager verification PASS."
          )
          PY


      # ============================================================
      # 28. VERIFY OLD CUSTOM PASSWORD VAULT ABSENT
      # ============================================================

      - name: Verify old password vault removed
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          if grep -nE \
            'RKMSSecureCredentialsPlugin|RKMSSecureCredentials' \
            scripts/setup-android-native.sh; then

            echo "::error::Old custom password vault found."
            exit 1
          fi

          echo "Old password vault absent."


      # ============================================================
      # 29. MICROPHONE + FILE PICKER
      # ============================================================

      - name: Verify microphone and file picker
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          grep -Fq \
            "RECORD_AUDIO" \
            scripts/setup-android-native.sh

          grep -Fq \
            "RESOURCE_AUDIO_CAPTURE" \
            scripts/setup-android-native.sh

          grep -Fq \
            "onShowFileChooser" \
            scripts/setup-android-native.sh

          grep -Fq \
            "MediaRecorder" \
            app.js

          echo "Microphone + file picker PASS."


      # ============================================================
      # 30. KEYBOARD
      # ============================================================

      - name: Verify keyboard resize
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          grep -Fq \
            "SOFT_INPUT_ADJUST_RESIZE" \
            scripts/setup-android-native.sh

          echo "Keyboard resize PASS."


      # ============================================================
      # 31. FIREBASE NATIVE INITIALIZATION
      # ============================================================

      - name: Verify FirebaseApp initialization
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          MAIN_ACTIVITY="$(
            find android/app/src/main/java \
              -type f \
              -name "MainActivity.java" \
              -print \
              | head -n 1
          )"

          test -n "$MAIN_ACTIVITY"

          grep -Fq \
            "FirebaseApp.initializeApp" \
            "$MAIN_ACTIVITY"

          echo "FirebaseApp initialization PASS."


      # ============================================================
      # 32. APPLICATION ID
      # ============================================================

      - name: Verify application ID
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          grep -Rqs \
            "org.rkms.connect" \
            app/build.gradle \
            app/src/main/AndroidManifest.xml

          echo "Application ID PASS."


      # ============================================================
      # 33. FINAL ANDROID CONFIG AUDIT
      # ============================================================

      - name: Final Android configuration audit
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          echo "=============================================="
          echo "FINAL ANDROID CONFIGURATION"
          echo "=============================================="
          echo "compileSdk : 36"
          echo "targetSdk  : 36"
          echo "minSdk     : 23"
          echo "AGP        : 8.9.1"
          echo "Gradle     : 8.11.1"
          echo "Java       : 17"
          echo "Firebase   : 34.19.0"
          echo "FCM        : firebase-messaging"
          echo "Package    : org.rkms.connect"
          echo "=============================================="

          if grep -RniE \
            'minSdkVersion\s+22|minSdkVersion\s*=\s*22|minSdk\s+22|minSdk\s*=\s*22' \
            app/build.gradle \
            variables.gradle \
            2>/dev/null; then

            echo "::error::minSdk 22 still exists."
            exit 1
          fi

          echo "minSdk 22 not found."


      # ============================================================
      # 34. PREPARE RELEASE SIGNING
      #
      # REQUIRED GITHUB SECRETS:
      #
      # RKMS_KEYSTORE_BASE64
      # RKMS_KEY_ALIAS
      # RKMS_KEYSTORE_PASSWORD
      # RKMS_KEY_PASSWORD
      # ============================================================

      - name: Prepare release signing keystore
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${RKMS_KEYSTORE_BASE64:-}" ]; then
            echo "::error::RKMS_KEYSTORE_BASE64 GitHub Secret is missing."
            exit 1
          fi

          if [ -z "${RKMS_KEY_ALIAS:-}" ]; then
            echo "::error::RKMS_KEY_ALIAS GitHub Secret is missing."
            exit 1
          fi

          if [ -z "${RKMS_KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::RKMS_KEYSTORE_PASSWORD GitHub Secret is missing."
            exit 1
          fi

          if [ -z "${RKMS_KEY_PASSWORD:-}" ]; then
            echo "::error::RKMS_KEY_PASSWORD GitHub Secret is missing."
            exit 1
          fi

          cd "$RKMS_ROOT/android"

          echo "$RKMS_KEYSTORE_BASE64" \
            | base64 --decode \
            > rkms-release.keystore

          test -s \
            rkms-release.keystore

          echo "RKMS_KEYSTORE_PATH=$PWD/rkms-release.keystore" \
            >> "$GITHUB_ENV"

          echo "Release keystore prepared."


      # ============================================================
      # 35. CONFIGURE RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        env:
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "app/build.gradle"
          )

          s = p.read_text(
              encoding="utf-8"
          )

          # ========================================================
          # Inject signing properties
          # ========================================================

          marker = "android {"

          if marker not in s:

              raise SystemExit(
                  "android block not found."
              )

          signing_block = r'''
          signingConfigs {
              release {
                  storeFile file(
                      System.getenv("RKMS_KEYSTORE_PATH")
                  )
                  storePassword System.getenv(
                      "RKMS_KEYSTORE_PASSWORD"
                  )
                  keyAlias System.getenv(
                      "RKMS_KEY_ALIAS"
                  )
                  keyPassword System.getenv(
                      "RKMS_KEY_PASSWORD"
                  )
              }
          }

          '''

          if "signingConfigs {" not in s:

              s = s.replace(
                  marker,
                  marker
                  + "\n"
                  + signing_block,
                  1
              )

          # ========================================================
          # Release buildType signing
          # ========================================================

          if (
              "signingConfig signingConfigs.release"
              not in s
          ):

              release_marker = \
                  "release {"

              if release_marker not in s:

                  raise SystemExit(
                      "release buildType not found."
                  )

              # Add only inside buildTypes release block.
              buildtypes_pos = s.find(
                  "buildTypes"
              )

              if buildtypes_pos < 0:

                  raise SystemExit(
                      "buildTypes block not found."
                  )

              release_pos = s.find(
                  "release {",
                  buildtypes_pos
              )

              if release_pos < 0:

                  raise SystemExit(
                      "release buildType not found."
                  )

              insert_pos = \
                  release_pos + len(
                      "release {"
                  )

              s = (
                  s[:insert_pos]
                  + "\n"
                  "        signingConfig "
                  "signingConfigs.release"
                  + s[insert_pos:]
              )

          p.write_text(
              s,
              encoding="utf-8"
          )

          print(
              "Release signing configured."
          )
          PY


      # ============================================================
      # 36. VERIFY SIGNING CONFIGURATION
      # ============================================================

      - name: Verify release signing configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          grep -Fq \
            "signingConfigs {" \
            app/build.gradle

          grep -Fq \
            "signingConfigs.release" \
            app/build.gradle

          grep -Fq \
            "RKMS_KEYSTORE_PATH" \
            app/build.gradle

          test -f \
            "$RKMS_KEYSTORE_PATH"

          echo "Release signing configuration PASS."


      # ============================================================
      # 37. CLEAN
      # ============================================================

      - name: Clean Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          ./gradlew clean \
            --no-daemon


      # ============================================================
      # 38. BUILD RELEASE APK
      # ============================================================

      - name: Build Final Signed Release APK
        shell: bash
        env:
          RKMS_KEYSTORE_PATH: ${{ env.RKMS_KEYSTORE_PATH }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          echo "=============================================="
          echo "RKMS FINAL SIGNED RELEASE APK"
          echo "=============================================="
          echo "Android API      : 36"
          echo "Build Tools      : 36.0.0"
          echo "minSdk           : 23"
          echo "targetSdk        : 36"
          echo "Node             : 22"
          echo "Java             : 17"
          echo "AGP              : 8.9.1"
          echo "Gradle           : 8.11.1"
          echo "Firebase BOM     : 34.19.0"
          echo "Google Services  : 4.5.0"
          echo "Credential Mgr   : 1.5.0"
          echo "Package          : org.rkms.connect"
          echo "SIGNED           : YES"
          echo "APK ONLY         : YES"
          echo "AAB              : NO"
          echo "=============================================="

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 39. LOCATE APK
      # ============================================================

      - name: Locate release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          APK="$(
            find \
              app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              ! -iname "*debug*" \
              -print \
              | head -n 1
          )"

          if [ -z "$APK" ]; then

            echo "::error::Release APK not found."

            find \
              app/build/outputs \
              -type f \
              -print \
              2>/dev/null \
              || true

            exit 1
          fi

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/${APK_NAME}"

          echo \
            "APK_PATH=$GITHUB_WORKSPACE/${APK_NAME}" \
            >> "$GITHUB_ENV"

          echo "APK created:"
          ls -lh \
            "$GITHUB_WORKSPACE/${APK_NAME}"


      # ============================================================
      # 40. VERIFY APK PACKAGE + SDK
      # ============================================================

      - name: Verify APK package and SDK
        shell: bash
        run: |
          set -euo pipefail

          APK="$APK_PATH"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt" \
            dump badging \
            "$APK" \
            > "$GITHUB_WORKSPACE/apk-badging.txt"

          cat \
            "$GITHUB_WORKSPACE/apk-badging.txt"

          grep -Fq \
            "package: name='${APP_ID}'" \
            "$GITHUB_WORKSPACE/apk-badging.txt"

          grep -Fq \
            "targetSdkVersion:'36'" \
            "$GITHUB_WORKSPACE/apk-badging.txt"

          echo "APK package and SDK PASS."


      # ============================================================
      # 41. VERIFY APK SIGNATURE
      # ============================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="$APK_PATH"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" \
            verify \
            --verbose \
            "$APK"

          echo "=============================================="
          echo "APK SIGNATURE PASS"
          echo "=============================================="


      # ============================================================
      # 42. VERIFY SIGNER CERTIFICATE
      # ============================================================

      - name: Verify APK signer certificate
        shell: bash
        run: |
          set -euo pipefail

          APK="$APK_PATH"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" \
            verify \
            --print-certs \
            "$APK"

          echo "Signer certificate verified."


      # ============================================================
      # 43. SHA256
      # ============================================================

      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          sha256sum \
            "$APK_NAME" \
            | tee \
              "${APK_NAME}.sha256"


      # ============================================================
      # 44. FINAL APK ONLY AUDIT
      # ============================================================

      - name: Final APK-only audit
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          echo "=============================================="
          echo "FINAL ARTIFACT AUDIT"
          echo "=============================================="

          find . \
            -maxdepth 1 \
            -type f \
            \( \
              -name "*.apk" \
              -o -name "*.aab" \
              -o -name "*.sha256" \
            \) \
            -printf "%f\n" \
            | sort

          if find . \
            -maxdepth 1 \
            -type f \
            -name "*.aab" \
            | grep -q .; then

            echo "::error::AAB detected."
            exit 1
          fi

          if find . \
            -maxdepth 1 \
            -type f \
            -iname "*debug*.apk" \
            | grep -q .; then

            echo "::error::Debug APK detected."
            exit 1
          fi

          test -f \
            "$APK_NAME"

          test -f \
            "${APK_NAME}.sha256"

          echo ""
          echo "=============================================="
          echo "FINAL AUDIT PASSED"
          echo "=============================================="
          echo "APK ONLY       : YES"
          echo "AAB            : NO"
          echo "DEBUG APK      : NO"
          echo "SIGNED         : YES"
          echo "API            : 36"
          echo "MIN SDK        : 23"
          echo "TARGET SDK     : 36"
          echo "PACKAGE        : ${APP_ID}"
          echo "=============================================="


      # ============================================================
      # 45. UPLOAD APK + SHA256
      # ============================================================

      - name: Upload final APK and SHA256
        uses: actions/upload-artifact@v4
        with:
          name: RKMS_ANDROID16_API36_SIGNED_RELEASE_APK
          if-no-files-found: error
          path: |
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256
          retention-days: 30

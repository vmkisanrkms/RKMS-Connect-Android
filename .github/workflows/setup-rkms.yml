name: RKMS Android 16 API 36 - Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: RKMS Android 16 / API 36 - Release APK
    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. PREPARE RKMS SOURCE
      # ============================================================
      - name: Prepare RKMS source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="RKMS_CONNECT_FINAL_DEEP_AUDITED_APK_READY_2026-09-16.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: RKMS source ZIP not found:"
            echo "$ZIP_FILE"
            exit 1
          fi

          echo "RKMS source ZIP found:"
          ls -lh "$ZIP_FILE"

          rm -rf .rkms_extract
          mkdir -p .rkms_extract

          unzip -q "$ZIP_FILE" -d .rkms_extract

          SOURCE_DIR=""

          if [ -f ".rkms_extract/package.json" ]; then
            SOURCE_DIR=".rkms_extract"
          else
            SOURCE_DIR="$(
              find .rkms_extract \
                -type f \
                -name "package.json" \
                -print \
                -quit \
                | xargs -r dirname
            )"
          fi

          if [ -z "${SOURCE_DIR:-}" ] || [ ! -f "$SOURCE_DIR/package.json" ]; then
            echo "ERROR: package.json not found inside RKMS ZIP."
            exit 1
          fi

          echo "RKMS source directory:"
          echo "$SOURCE_DIR"

          rsync -a \
            --exclude=".github/" \
            "$SOURCE_DIR"/ ./

          rm -rf .rkms_extract

          echo "Checking required RKMS files..."

          REQUIRED_FILES=(
            "package.json"
            "app.js"
            "index.html"
            "styles.css"
            "capacitor.config.json"
            "google-services.json"

            "scripts/configure-android-16.sh"
            "scripts/setup-android-native.sh"

            "scripts/verify-android-16.py"
            "scripts/verify-android-pdf.py"
            "scripts/verify-native-bridge.py"
            "scripts/verify-rkms-final.py"

            "scripts/verify-member-directory-scope.py"
            "scripts/verify-directory-lists.py"
            "scripts/verify-v17-directory-deep.py"
            "scripts/verify-authority-hierarchy.py"
            "scripts/verify-directory-contact-actions.py"
            "scripts/verify-final-login-navigation.py"

            "scripts/verify-profile-update-final.py"
            "scripts/verify-report-download-scope.py"
            "scripts/verify-pdf-pipeline.py"

            "assets/rkms-launcher-original-transparent.png"

            "supabase/migrations"
          )

          for ITEM in "${REQUIRED_FILES[@]}"; do
            if [ ! -e "$ITEM" ]; then
              echo "ERROR: Required item missing:"
              echo "$ITEM"
              exit 1
            fi
          done

          echo "RKMS source verification: PASS"

      # ============================================================
      # 3. NODE 22
      # ============================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ============================================================
      # 4. JAVASCRIPT CHECK
      # ============================================================
      - name: Verify Node and JavaScript
        shell: bash
        run: |
          set -euo pipefail

          node --version
          npm --version

          node --check app.js

          echo "Node.js 22: PASS"
          echo "app.js syntax: PASS"

      # ============================================================
      # 5. NPM DEPENDENCIES
      # ============================================================
      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          npm install --no-audit --no-fund

          npm ls @capacitor/core --depth=0
          npm ls @capacitor/android --depth=0
          npm ls @capacitor/app --depth=0
          npm ls @capacitor/push-notifications --depth=0

          echo "Capacitor dependencies: PASS"

      # ============================================================
      # 6. JDK 17
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify JDK 17
        shell: bash
        run: |
          set -euo pipefail

          java -version
          javac -version

          echo "JDK 17: PASS"

      # ============================================================
      # 7. ANDROID SDK
      # IMPORTANT:
      # Do NOT add accept-android-sdk-licenses here.
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      # ============================================================
      # 8. VERIFY ANDROID SDK TOOLCHAIN
      # ============================================================
      - name: Verify Android SDK toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

          sdkmanager --version
          adb version

          echo "Android SDK toolchain: PASS"

      # ============================================================
      # 9. ANDROID 16 / API 36 ONLY
      # ============================================================
      - name: Install Android 16 API 36 SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

          echo "ANDROID 16 / API 36 SDK: PASS"

      # ============================================================
      # 10. WEB BUILD
      # ============================================================
      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          npm run build

          test -f dist/index.html

          echo "Web build: PASS"

      # ============================================================
      # 11. CAPACITOR ANDROID
      # ============================================================
      - name: Add Capacitor Android platform
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android

          npx cap add android

          test -f android/app/build.gradle
          test -f android/gradlew

          echo "Capacitor Android project: PASS"

      # ============================================================
      # 12. FIREBASE
      # ============================================================
      - name: Install Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cp google-services.json \
            android/app/google-services.json

          test -s android/app/google-services.json

          echo "Firebase configuration: PASS"

      # ============================================================
      # 13. FORCE ANDROID 16 / API 36
      # ============================================================
      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/configure-android-16.sh

          bash scripts/configure-android-16.sh

          echo "Android 16 / API 36 configuration: PASS"

      # ============================================================
      # 14. CAPACITOR SYNC
      # ============================================================
      - name: Capacitor sync Android
        shell: bash
        run: |
          set -euo pipefail

          npx cap sync android

          echo "Capacitor sync: PASS"

      # ============================================================
      # 15. RKMS NATIVE SETUP
      # ============================================================
      - name: Setup RKMS native Android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/setup-android-native.sh

          bash scripts/setup-android-native.sh

          echo "RKMS native Android setup: PASS"

      # ============================================================
      # 16. ANDROID + NATIVE AUDIT
      # ============================================================
      - name: Run Android and native audits
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-android-16.py
          python3 scripts/verify-android-pdf.py
          python3 scripts/verify-native-bridge.py
          python3 scripts/verify-rkms-final.py

          echo "Android + native audits: PASS"

      # ============================================================
      # 17. PROFILE UPDATE AUDIT
      # ============================================================
      - name: Audit final profile update
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-profile-update-final.py

          echo "Profile Update audit: PASS"

      # ============================================================
      # 18. MEMBER / OFFICER / AUTHORITY AUDIT
      # ============================================================
      - name: Audit Member Officer separation
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-member-directory-scope.py
          python3 scripts/verify-directory-lists.py
          python3 scripts/verify-v17-directory-deep.py
          python3 scripts/verify-authority-hierarchy.py
          python3 scripts/verify-directory-contact-actions.py
          python3 scripts/verify-final-login-navigation.py

          echo "Member / Officer separation: PASS"
          echo "Authority hierarchy: PASS"
          echo "Login / navigation: PASS"

      # ============================================================
      # 19. REPORT DOWNLOAD SECURITY
      # ============================================================
      - name: Audit report download security
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-report-download-scope.py

          echo "Report download security: PASS"

      # ============================================================
      # 20. PDF PIPELINE
      # ============================================================
      - name: Audit PDF pipeline
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-pdf-pipeline.py

          echo "PDF pipeline: PASS"

      # ============================================================
      # 21. RKMS LOGO / LAUNCHER
      # ============================================================
      - name: Audit RKMS organization logo
        shell: bash
        run: |
          set -euo pipefail

          test -s \
            assets/rkms-launcher-original-transparent.png

          for density in \
            mdpi \
            hdpi \
            xhdpi \
            xxhdpi \
            xxxhdpi
          do
            test -s \
              "android/app/src/main/res/mipmap-$density/ic_launcher.png"

            test -s \
              "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done

          test -f \
            android/app/src/main/AndroidManifest.xml

          grep -q \
            'android:icon="@mipmap/ic_launcher"' \
            android/app/src/main/AndroidManifest.xml

          grep -q \
            'android:roundIcon="@mipmap/ic_launcher_round"' \
            android/app/src/main/AndroidManifest.xml

          echo "RKMS logo / launcher: PASS"

      # ============================================================
      # 22. NO X / TWITTER
      # ============================================================
      - name: Audit no X Twitter runtime references
        shell: bash
        run: |
          set -euo pipefail

          if grep -RniE \
            'twitter\.com|x\.com/|twitter:card' \
            app.js \
            index.html \
            styles.css \
            assets \
            2>/dev/null
          then
            echo "ERROR: X/Twitter runtime reference found."
            exit 1
          fi

          echo "No X/Twitter runtime reference: PASS"

      # ============================================================
      # 23. RELEASE SIGNING PREPARATION
      # ============================================================
      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${RKMS_KEYSTORE_BASE64:-}" ] \
            || [ -z "${RKMS_KEYSTORE_PASSWORD:-}" ] \
            || [ -z "${RKMS_KEY_ALIAS:-}" ] \
            || [ -z "${RKMS_KEY_PASSWORD:-}" ]; then

            echo "ERROR: RKMS release signing secrets are required."
            echo ""
            echo "Required GitHub Secrets:"
            echo "RKMS_KEYSTORE_BASE64"
            echo "RKMS_KEYSTORE_PASSWORD"
            echo "RKMS_KEY_ALIAS"
            echo "RKMS_KEY_PASSWORD"
            exit 1
          fi

          echo "$RKMS_KEYSTORE_BASE64" | base64 --decode \
            > android/rkms-release.keystore

          test -s android/rkms-release.keystore

          echo "RKMS_SIGNING_ENABLED=true" >> "$GITHUB_ENV"

          echo "Release keystore prepared successfully."

      # ============================================================
      # 24. GRADLE
      # ============================================================
      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail

          chmod +x android/gradlew

          test -x android/gradlew

          echo "Gradle wrapper: PASS"

      # ============================================================
      # 25. VERIFY BUILD CONFIGURATION
      # ============================================================
      - name: Verify Android build configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Android build configuration..."

          grep -Rni \
            'compileSdk' \
            android \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            || true

          grep -Rni \
            'targetSdk' \
            android \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            || true

          echo "Android build configuration check: PASS"

      # ============================================================
      # 26. BUILD RELEASE APK
      # ============================================================
      - name: Build release APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleRelease

          echo "Release APK build: PASS"

      # ============================================================
      # 27. LOCATE GENERATED APK
      # ============================================================
      - name: Locate release APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for generated APK..."

          find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK_PATH="$(
            find android/app/build/outputs/apk \
              -type f \
              -name "*-unsigned.apk" \
              -print \
              | head -n 1
          )"

          if [ -z "${APK_PATH:-}" ]; then
            APK_PATH="$(
              find android/app/build/outputs/apk \
                -type f \
                -name "*.apk" \
                -print \
                | head -n 1
            )"
          fi

          if [ -z "${APK_PATH:-}" ]; then
            echo "ERROR: No release APK found."
            exit 1
          fi

          test -s "$APK_PATH"

          echo "UNSIGNED_APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

          echo "Generated APK:"
          ls -lh "$APK_PATH"

      # ============================================================
      # 28. SIGN APK
      # ============================================================
      - name: Sign release APK
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found:"
            echo "$APKSIGNER"
            exit 1
          fi

          if [ ! -s "android/rkms-release.keystore" ]; then
            echo "ERROR: RKMS release keystore not found."
            exit 1
          fi

          SIGNED_APK="android/app/build/outputs/apk/release/app-release.apk"

          rm -f "$SIGNED_APK"

          echo "Signing APK..."

          "$APKSIGNER" sign \
            --ks "android/rkms-release.keystore" \
            --ks-pass "pass:${RKMS_KEYSTORE_PASSWORD}" \
            --ks-key-alias "${RKMS_KEY_ALIAS}" \
            --key-pass "pass:${RKMS_KEY_PASSWORD}" \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK_PATH"

          test -s "$SIGNED_APK"

          echo "APK_PATH=$SIGNED_APK" >> "$GITHUB_ENV"

          echo "Signed APK created:"
          ls -lh "$SIGNED_APK"

      # ============================================================
      # 29. VERIFY SIGNED APK
      # ============================================================
      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail

          test -s "$APK_PATH"

          APK_SIZE="$(stat -c%s "$APK_PATH")"

          if [ "$APK_SIZE" -lt 100000 ]; then
            echo "ERROR: APK size unexpectedly small."
            exit 1
          fi

          echo "APK size: $APK_SIZE bytes"

          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"

          if [ ! -x "$AAPT" ]; then
            echo "ERROR: aapt not found."
            exit 1
          fi

          "$AAPT" dump badging "$APK_PATH" \
            > /tmp/rkms-apk-badging.txt

          grep -q '^package:' /tmp/rkms-apk-badging.txt

          echo "APK package metadata: PASS"

      # ============================================================
      # 30. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          echo "Verifying signed APK..."

          "$APKSIGNER" verify \
            --verbose \
            "$APK_PATH"

          echo "Signed APK verification: PASS"

      # ============================================================
      # 31. SHA256
      # ============================================================
      - name: Generate APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum "$APK_PATH" \
            | tee rkms-release-apk.sha256

          echo "APK SHA256 generated."

      # ============================================================
      # 32. UPLOAD APK ARTIFACT
      # ============================================================
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Android-16-API36-Release-APK
          path: |
            ${{ env.APK_PATH }}
            rkms-release-apk.sha256
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 33. FINAL SUMMARY
      # ============================================================
      - name: Final build summary
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "RKMS ANDROID 16 / API 36 BUILD SUCCESS"
          echo "============================================================"
          echo ""
          echo "APK:"
          echo "$APK_PATH"
          echo ""
          echo "SHA256:"
          cat rkms-release-apk.sha256
          echo ""
          echo "Android API: 36"
          echo "Build Tools: 36.0.0"
          echo "Node: $(node --version)"
          echo ""
          echo "============================================================"

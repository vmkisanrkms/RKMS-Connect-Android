name: RKMS Android 16 API 36 - Final Signed Release APK Only

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  AGP_VERSION: "8.9.1"
  GRADLE_VERSION: "8.11.1"
  APP_ID: "org.rkms.connect"
  MIN_SDK: "23"
  TARGET_SDK: "36"
  SOURCE_ZIP: "RKMS_CONNECT_FINAL_AUDITED_RELEASE_APK_BUILD_20260922.zip"

jobs:

  build:

    name: RKMS Final Signed Release APK

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. NODE
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false


      # ============================================================
      # 3. JAVA
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # ============================================================
      # 4. HOST PACKAGES
      # ============================================================

      - name: Install host packages
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y unzip rsync perl

          echo "HOST PACKAGES: PASS"


      # ============================================================
      # 5. SOURCE ZIP
      # ============================================================

      - name: Verify RKMS source ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s "$SOURCE_ZIP" ]; then
            echo "::error::Source ZIP not found."
            echo "Expected: $SOURCE_ZIP"

            find . \
              -maxdepth 5 \
              -type f \
              -name "*.zip" \
              -not -path "./.git/*" \
              -print \
              | sort

            exit 1
          fi

          sha256sum "$SOURCE_ZIP"

          echo "SOURCE ZIP: PASS"


      # ============================================================
      # 6. EXTRACT
      # ============================================================

      - name: Extract RKMS source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf rkms-build
          mkdir -p rkms-build

          unzip -q \
            "$SOURCE_ZIP" \
            -d rkms-build

          echo "ZIP EXTRACTION: PASS"


      # ============================================================
      # 7. FIND PROJECT ROOT
      # ============================================================

      - name: Find RKMS project root
        shell: bash
        run: |
          set -euo pipefail

          ROOT=""

          if [ -f "rkms-build/final_audit_src/package.json" ]; then
            ROOT="rkms-build/final_audit_src"

          elif [ -f "rkms-build/package.json" ]; then
            ROOT="rkms-build"

          else

            PACKAGE_FILE="$(
              find rkms-build \
                -type f \
                -name "package.json" \
                -not -path "*/node_modules/*" \
                -print \
                | head -n 1 \
                || true
            )"

            if [ -n "$PACKAGE_FILE" ]; then
              ROOT="$(dirname "$PACKAGE_FILE")"
            fi

          fi

          if [ -z "$ROOT" ]; then
            echo "::error::package.json not found."

            find rkms-build \
              -maxdepth 7 \
              -type f \
              -print \
              | sort

            exit 1
          fi

          echo "RKMS_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "RKMS_ROOT=$ROOT"


      # ============================================================
      # 8. SOURCE STRUCTURE
      # ============================================================

      - name: Verify RKMS source structure
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          REQUIRED_FILES="
          package.json
          package-lock.json
          app.js
          index.html
          styles.css
          capacitor.config.json
          google-services.json
          scripts/setup-android-native.sh
          scripts/configure-android-16.sh
          scripts/configure-release-signing.sh
          "

          for FILE in $REQUIRED_FILES; do

            if [ ! -s "$FILE" ]; then
              echo "::error::Missing required file: $FILE"
              exit 1
            fi

          done

          node --check app.js

          echo "SOURCE STRUCTURE: PASS"


      # ============================================================
      # 9. CAPACITOR VERSIONS
      # ============================================================

      - name: Verify Capacitor versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node <<'NODE'
          const fs = require("fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const deps = {
            ...(pkg.dependencies || {}),
            ...(pkg.devDependencies || {})
          };

          const required = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          let failed = false;

          for (const [name, wanted] of Object.entries(required)) {

            const actual = deps[name];

            console.log(
              `${name}: ${actual || "MISSING"}`
            );

            if (actual !== wanted) {
              failed = true;
            }

          }

          if (failed) {
            process.exit(1);
          }

          console.log("CAPACITOR VERSION CHECK: PASS");
          NODE


      # ============================================================
      # 10. FIREBASE JSON
      # ============================================================

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync("google-services.json", "utf8")
          );

          const found = (data.client || []).some(
            client =>
              client.client_info &&
              client.client_info.android_client_info &&
              client.client_info.android_client_info.package_name ===
              "org.rkms.connect"
          );

          if (!found) {
            throw new Error(
              "google-services.json does not contain org.rkms.connect"
            );
          }

          console.log("FIREBASE PACKAGE CHECK: PASS");
          NODE


      # ============================================================
      # 11. SOURCE AUDIT
      # ============================================================

      - name: Run source audit
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          if [ -f "scripts/verify-android-pdf.py" ]; then
            python3 scripts/verify-android-pdf.py
          fi

          echo "SOURCE AUDIT: PASS"


      # ============================================================
      # 12. NPM
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm ci \
            --no-audit \
            --no-fund

          echo "NPM INSTALL: PASS"


      # ============================================================
      # 13. WEB BUILD
      # ============================================================

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm run build

          test -s dist/index.html

          echo "WEB BUILD: PASS"


      # ============================================================
      # 14. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ============================================================
      # 15. API 36
      # ============================================================

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --licenses \
            >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          test -n "$SDK_ROOT"

          test -x \
            "$SDK_ROOT/build-tools/$BUILD_TOOLS/aapt"

          test -x \
            "$SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner"

          echo "ANDROID API 36: PASS"


      # ============================================================
      # 16. CAPACITOR ANDROID
      # ============================================================

      - name: Create Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          rm -rf android

          npx cap add android

          test -s android/gradlew
          test -s android/app/build.gradle

          echo "CAPACITOR ANDROID PROJECT: PASS"


      # ============================================================
      # 17. ANDROID 16
      # ============================================================

      - name: Configure Android 16
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/configure-android-16.sh

          bash -n \
            scripts/configure-android-16.sh

          ./scripts/configure-android-16.sh

          echo "ANDROID 16 CONFIGURATION: PASS"


      # ============================================================
      # 18. CAPACITOR SYNC
      # ============================================================

      - name: Capacitor sync
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npx cap sync android

          echo "CAPACITOR SYNC: PASS"


      # ============================================================
      # 19. MIN SDK 23
      # ============================================================

      - name: Force minSdk 23
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          find android \
            -type f \
            \( \
              -name "*.gradle" \
              -o \
              -name "*.gradle.kts" \
            \) \
            -print0 |
          while IFS= read -r -d '' FILE; do

            perl -pi -e \
              's/(minSdkVersion\s*=\s*)22\b/${1}23/g' \
              "$FILE"

            perl -pi -e \
              's/(minSdkVersion\s+)\s*22\b/${1}23/g' \
              "$FILE"

            perl -pi -e \
              's/(minSdk\s*=\s*)22\b/${1}23/g' \
              "$FILE"

            perl -pi -e \
              's/(minSdk\s+)\s*22\b/${1}23/g' \
              "$FILE"

          done

          if grep -RInE \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            'minSdkVersion[[:space:]]*=?[[:space:]]*22([[:space:]]|$)|minSdk[[:space:]]*=?[[:space:]]*22([[:space:]]|$)' \
            android
          then

            echo "::error::minSdk 22 still exists."
            exit 1

          fi

          echo "MIN SDK 23: PASS"


      # ============================================================
      # 20. REPAIR KNOWN NATIVE SETUP SCRIPT
      # ============================================================

      - name: Repair known malformed native setup script
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          SETUP_SHA="$(
            sha256sum scripts/setup-android-native.sh |
            awk '{print $1}'
          )"

          echo "Native setup script SHA:"
          echo "$SETUP_SHA"

          if [ "$SETUP_SHA" = "d8cdb6c16fb4c6ac768a4ca515f42224097a77419ca5bccd9dd38ab990b3e305" ]; then

            sed -n '1,90p' \
              scripts/setup-android-native.sh \
              > /tmp/setup-rkms-fixed.sh

            printf '%s\n' \
              'DRAWABLE_DIR="$RES_DIR/drawable"' \
              'mkdir -p "$DRAWABLE_DIR"' \
              'printf "%s\n" '\''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">'\''' \
              '\''    <path android:fillColor="#FFFFFFFF" android:pathData="M12,2A7,7 0,0 0,5 9v4l-2,3v1h18v-1l-2,-3V9A7,7 0,0 0,12 2M9,19a3,3 0,0 0,6 0z"/>'\''' \
              '\''</vector>'\''' \
              > "$DRAWABLE_DIR/ic_stat_rkms.xml"' \
              >> /tmp/setup-rkms-fixed.sh

            sed -n '118,$p' \
              scripts/setup-android-native.sh \
              >> /tmp/setup-rkms-fixed.sh

            chmod +x \
              /tmp/setup-rkms-fixed.sh

            bash -n \
              /tmp/setup-rkms-fixed.sh

            mv \
              /tmp/setup-rkms-fixed.sh \
              scripts/setup-android-native.sh

          fi

          chmod +x \
            scripts/setup-android-native.sh

          bash -n \
            scripts/setup-android-native.sh

          echo "NATIVE SCRIPT SYNTAX: PASS"


      # ============================================================
      # 21. NATIVE MICROPHONE SOURCE FIX
      #
      # IMPORTANT:
      # NO nested Python triple quotes.
      # This avoids YAML parser errors.
      # ============================================================

      - name: Add native microphone manifest implementation
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          SCRIPT="scripts/setup-android-native.sh"

          test -s "$SCRIPT"

          if ! grep -Fq \
            "RKMS_NATIVE_MICROPHONE_MANIFEST_FIX" \
            "$SCRIPT"
          then

            cat >> "$SCRIPT" <<'RKMS_NATIVE_SCRIPT'

# RKMS_NATIVE_MICROPHONE_MANIFEST_FIX

RKMS_MANIFEST="$ANDROID_DIR/app/src/main/AndroidManifest.xml"

if [ -f "$RKMS_MANIFEST" ]; then

python3 - "$RKMS_MANIFEST" <<'RKMS_MANIFEST_PY'
import sys
import re
from pathlib import Path

manifest = Path(sys.argv[1])

text = manifest.read_text(
    encoding="utf-8"
)

permission = (
    '<uses-permission '
    'android:name="android.permission.RECORD_AUDIO"/>'
)

if (
    'android:name="android.permission.RECORD_AUDIO"'
    not in text
):

    match = re.search(
        r'<manifest\b[^>]*>',
        text,
        flags=re.DOTALL
    )

    if not match:
        raise SystemExit(
            "RKMS: manifest opening tag not found"
        )

    text = (
        text[:match.end()]
        + "\n    "
        + permission
        + "\n"
        + text[match.end():]
    )

manifest.write_text(
    text,
    encoding="utf-8"
)

print(
    "RKMS native RECORD_AUDIO manifest permission: PASS"
)
RKMS_MANIFEST_PY

fi

RKMS_NATIVE_SCRIPT

          fi

          chmod +x "$SCRIPT"

          bash -n "$SCRIPT"

          grep -Fq \
            "RKMS_NATIVE_MICROPHONE_MANIFEST_FIX" \
            "$SCRIPT"

          grep -Fq \
            "android.permission.RECORD_AUDIO" \
            "$SCRIPT"

          echo "NATIVE MICROPHONE SOURCE FIX: PASS"


      # ============================================================
      # 22. RUN NATIVE SETUP
      # ============================================================

      - name: Configure RKMS native Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          ./scripts/setup-android-native.sh

          echo "RKMS NATIVE SETUP: PASS"


      # ============================================================
      # 23. MANIFEST
      # ============================================================

      - name: Locate generated AndroidManifest
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          test -s "$MANIFEST"

          echo "MANIFEST=$MANIFEST" >> "$GITHUB_ENV"

          echo "MANIFEST: $MANIFEST"


      # ============================================================
      # 24. PREDICTIVE BACK
      # ============================================================

      - name: Configure predictive back
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 - "$MANIFEST" <<'PY'
          import sys
          import re
          from pathlib import Path

          path = Path(sys.argv[1])

          text = path.read_text(
              encoding="utf-8"
          )

          attribute = (
              'android:enableOnBackInvokedCallback="true"'
          )

          if (
              "android:enableOnBackInvokedCallback="
              in text
          ):

              text = re.sub(
                  r'android:enableOnBackInvokedCallback="[^"]*"',
                  attribute,
                  text,
                  count=1
              )

          else:

              match = re.search(
                  r'<application\b',
                  text
              )

              if not match:
                  raise SystemExit(
                      "application tag not found"
                  )

              text = (
                  text[:match.end()]
                  + " "
                  + attribute
                  + text[match.end():]
              )

          path.write_text(
              text,
              encoding="utf-8"
          )
          PY

          grep -Fq \
            'android:enableOnBackInvokedCallback="true"' \
            "$MANIFEST"

          echo "PREDICTIVE BACK: PASS"


      # ============================================================
      # 25. FINAL MICROPHONE + NOTIFICATION PERMISSIONS
      # ============================================================

      - name: Finalize native microphone manifest
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 - "$MANIFEST" <<'PY'
          import sys
          import re
          from pathlib import Path

          path = Path(sys.argv[1])

          text = path.read_text(
              encoding="utf-8"
          )

          # Remove existing RECORD_AUDIO permissions.
          text = re.sub(
              r'\s*<uses-permission\s+'
              r'android:name="android\.permission\.RECORD_AUDIO"\s*/>\s*',
              '\n',
              text
          )

          # Remove existing POST_NOTIFICATIONS permissions.
          text = re.sub(
              r'\s*<uses-permission\s+'
              r'android:name="android\.permission\.POST_NOTIFICATIONS"\s*/>\s*',
              '\n',
              text
          )

          match = re.search(
              r'<manifest\b[^>]*>',
              text,
              flags=re.DOTALL
          )

          if not match:
              raise SystemExit(
                  "ERROR: manifest opening tag not found"
              )

          additions = (
              "\n"
              '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n'
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
          )

          text = (
              text[:match.end()]
              + additions
              + text[match.end():]
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "FINAL NATIVE MICROPHONE MANIFEST: PASS"
          )
          PY

          grep -Fq \
            '<uses-permission android:name="android.permission.RECORD_AUDIO"/>' \
            "$MANIFEST"

          grep -Fq \
            'android:name="android.permission.POST_NOTIFICATIONS"' \
            "$MANIFEST"

          echo "RECORD_AUDIO MANIFEST: PASS"
          echo "POST_NOTIFICATIONS MANIFEST: PASS"


      # ============================================================
      # 26. XML VALIDATION
      # ============================================================

      - name: Validate AndroidManifest XML
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          try:
              ET.parse(sys.argv[1])
          except Exception as exc:
              print("ANDROID MANIFEST XML INVALID")
              print(exc)
              raise SystemExit(1)

          print("ANDROID MANIFEST XML: PASS")
          PY


      # ============================================================
      # 27. FIREBASE CONFIG
      # ============================================================

      - name: Install Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          cp -f \
            google-services.json \
            android/app/google-services.json

          test -s \
            android/app/google-services.json

          grep -Fq \
            "org.rkms.connect" \
            android/app/google-services.json

          echo "FIREBASE CONFIGURATION: PASS"


      # ============================================================
      # 28. FIREBASE DEPENDENCIES
      # ============================================================

      - name: Configure Firebase dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          APP_GRADLE="android/app/build.gradle"
          ROOT_GRADLE="android/build.gradle"

          test -s "$APP_GRADLE"
          test -s "$ROOT_GRADLE"

          if ! grep -Fq \
            "com.google.gms:google-services:4.4.4" \
            "$ROOT_GRADLE"
          then

            if grep -Fq \
              "dependencies {" \
              "$ROOT_GRADLE"
            then

              sed -i \
                '/dependencies {/a\    classpath "com.google.gms:google-services:4.4.4"' \
                "$ROOT_GRADLE"

            fi

          fi

          if ! grep -Fq \
            'com.google.gms.google-services' \
            "$APP_GRADLE"
          then

            printf '%s\n' \
              'apply plugin: "com.google.gms.google-services"' \
              >> "$APP_GRADLE"

          fi

          if ! grep -Fq \
            "com.google.firebase:firebase-bom" \
            "$APP_GRADLE"
          then

            sed -i \
              '/dependencies {/a\    implementation platform("com.google.firebase:firebase-bom:34.19.0")' \
              "$APP_GRADLE"

          fi

          if ! grep -Fq \
            "com.google.firebase:firebase-messaging" \
            "$APP_GRADLE"
          then

            sed -i \
              '/dependencies {/a\    implementation "com.google.firebase:firebase-messaging"' \
              "$APP_GRADLE"

          fi

          if ! grep -Fq \
            "androidx.credentials:credentials:1.5.0" \
            "$APP_GRADLE"
          then

            sed -i \
              '/dependencies {/a\    implementation "androidx.credentials:credentials:1.5.0"' \
              "$APP_GRADLE"

          fi

          if ! grep -Fq \
            "androidx.credentials:credentials-play-services-auth:1.5.0" \
            "$APP_GRADLE"
          then

            sed -i \
              '/dependencies {/a\    implementation "androidx.credentials:credentials-play-services-auth:1.5.0"' \
              "$APP_GRADLE"

          fi

          if ! grep -Fq \
            "androidx.biometric:biometric:1.1.0" \
            "$APP_GRADLE"
          then

            sed -i \
              '/dependencies {/a\    implementation "androidx.biometric:biometric:1.1.0"' \
              "$APP_GRADLE"

          fi

          echo "FIREBASE DEPENDENCIES: PASS"


      # ============================================================
      # 29. FIREBASE INITIALIZATION
      # ============================================================

      - name: Verify Firebase initialization
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          MAIN="$(
            find android/app/src/main \
              -type f \
              -name "MainActivity.java" \
              -print \
              | head -n 1 \
              || true
          )"

          if [ -z "$MAIN" ]; then
            echo "::error::MainActivity.java not found."
            exit 1
          fi

          if ! grep -Fq \
            "FirebaseApp.initializeApp" \
            "$MAIN"
          then

            if grep -Fq \
              "super.onCreate(savedInstanceState);" \
              "$MAIN"
            then

              python3 - "$MAIN" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])

          text = path.read_text(
              encoding="utf-8"
          )

          marker = \
              "super.onCreate(savedInstanceState);"

          if "FirebaseApp.initializeApp" not in text:

              text = text.replace(
                  marker,
                  marker +
                  "\n        com.google.firebase.FirebaseApp.initializeApp(this);",
                  1
              )

          path.write_text(
              text,
              encoding="utf-8"
          )
          PY

            else

              echo "::error::MainActivity onCreate marker not found."
              exit 1

            fi

          fi

          grep -Fq \
            "FirebaseApp.initializeApp" \
            "$MAIN"

          echo "FIREBASE INITIALIZATION: PASS"


      # ============================================================
      # 30. NATIVE BRIDGE
      # ============================================================

      - name: Verify RKMS native bridge
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          BRIDGE="$(
            find android/app/src/main \
              -type f \
              -name "RKMSNativeBridge.java" \
              -print \
              | head -n 1 \
              || true
          )"

          if [ -z "$BRIDGE" ]; then
            echo "::error::RKMSNativeBridge.java not found."
            exit 1
          fi

          grep -Fq \
            "AndroidKeyStore" \
            "$BRIDGE"

          grep -Fq \
            "CredentialManager" \
            "$BRIDGE"

          echo "RKMS NATIVE BRIDGE: PASS"


      # ============================================================
      # 31. FINAL MANIFEST
      # ============================================================

      - name: Final AndroidManifest verification
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          test -s "$MANIFEST"

          grep -Fq \
            '<uses-permission android:name="android.permission.RECORD_AUDIO"/>' \
            "$MANIFEST"

          grep -Fq \
            'android:name="android.permission.POST_NOTIFICATIONS"' \
            "$MANIFEST"

          grep -Fq \
            'android:enableOnBackInvokedCallback="true"' \
            "$MANIFEST"

          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          ET.parse(sys.argv[1])

          print("MANIFEST XML: PASS")
          PY

          echo "RECORD_AUDIO: PASS"
          echo "POST_NOTIFICATIONS: PASS"
          echo "PREDICTIVE BACK: PASS"
          echo "FINAL MANIFEST: PASS"


      # ============================================================
      # 32. FINAL SDK
      # ============================================================

      - name: Finalize Android SDK versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          find android \
            -type f \
            \( \
              -name "*.gradle" \
              -o \
              -name "*.gradle.kts" \
            \) \
            -print0 |
          while IFS= read -r -d '' FILE; do

            perl -pi -e \
              's/(minSdkVersion\s*=\s*)22\b/${1}23/g' \
              "$FILE"

            perl -pi -e \
              's/(minSdkVersion\s+)\s*22\b/${1}23/g' \
              "$FILE"

            perl -pi -e \
              's/(minSdk\s*=\s*)22\b/${1}23/g' \
              "$FILE"

            perl -pi -e \
              's/(minSdk\s+)\s*22\b/${1}23/g' \
              "$FILE"

          done

          if grep -RInE \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            'minSdkVersion[[:space:]]*=?[[:space:]]*22([[:space:]]|$)|minSdk[[:space:]]*=?[[:space:]]*22([[:space:]]|$)' \
            android
          then

            echo "::error::minSdk 22 detected."
            exit 1

          fi

          echo "MIN SDK 23 FINAL: PASS"


      # ============================================================
      # 33. POST GENERATION AUDITS
      # ============================================================

      - name: Run post-generation RKMS audits
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          AUDITS="
          scripts/verify-android-16.py
          scripts/verify-rkms-final-fixes.py
          scripts/verify-native-bridge.py
          scripts/verify-fcm-pipeline.py
          scripts/verify-saved-login.py
          "

          for AUDIT in $AUDITS; do

            if [ -f "$AUDIT" ]; then

              echo ""
              echo "=============================================="
              echo "RUNNING: $AUDIT"
              echo "=============================================="

              python3 "$AUDIT"

            fi

          done

          echo ""
          echo "POST-GENERATION AUDITS: PASS"


      # ============================================================
      # 34. FINAL ANDROID AUDIT
      # ============================================================

      - name: Final Android 16 audit
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          if [ -f android/variables.gradle ]; then

            grep -Eq \
              'compileSdkVersion[[:space:]]*=[[:space:]]*36' \
              android/variables.gradle

            grep -Eq \
              'targetSdkVersion[[:space:]]*=[[:space:]]*36' \
              android/variables.gradle

            grep -Eq \
              'minSdkVersion[[:space:]]*=[[:space:]]*23' \
              android/variables.gradle

          fi

          grep -Fq \
            'android:enableOnBackInvokedCallback="true"' \
            "$MANIFEST"

          grep -Fq \
            'android:name="android.permission.RECORD_AUDIO"' \
            "$MANIFEST"

          grep -Fq \
            'android:name="android.permission.POST_NOTIFICATIONS"' \
            "$MANIFEST"

          echo "COMPILE SDK 36: PASS"
          echo "TARGET SDK 36: PASS"
          echo "MIN SDK 23: PASS"
          echo "PREDICTIVE BACK: PASS"
          echo "RECORD AUDIO: PASS"
          echo "POST NOTIFICATIONS: PASS"


      # ============================================================
      # 35. SIGNING SECRETS
      # ============================================================

      - name: Verify release signing secrets
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "${RKMS_KEYSTORE_BASE64:-}" || {
            echo "::error::RKMS_KEYSTORE_BASE64 missing."
            exit 1
          }

          test -n "${RKMS_KEYSTORE_PASSWORD:-}" || {
            echo "::error::RKMS_KEYSTORE_PASSWORD missing."
            exit 1
          }

          test -n "${RKMS_KEY_ALIAS:-}" || {
            echo "::error::RKMS_KEY_ALIAS missing."
            exit 1
          }

          test -n "${RKMS_KEY_PASSWORD:-}" || {
            echo "::error::RKMS_KEY_PASSWORD missing."
            exit 1
          }

          echo "SIGNING SECRETS: PASS"


      # ============================================================
      # 36. RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/configure-release-signing.sh

          bash -n \
            scripts/configure-release-signing.sh

          ./scripts/configure-release-signing.sh

          test -s \
            android/app/release.keystore

          grep -Fq \
            'storeFile file("release.keystore")' \
            android/app/build.gradle

          grep -Fq \
            'signingConfig signingConfigs.release' \
            android/app/build.gradle

          echo "RELEASE SIGNING: PASS"


      # ============================================================
      # 37. KEYSTORE
      # ============================================================

      - name: Verify release keystore
        shell: bash
        env:
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          keytool \
            -list \
            -keystore android/app/release.keystore \
            -storepass "$RKMS_KEYSTORE_PASSWORD" \
            -alias "$RKMS_KEY_ALIAS" \
            >/dev/null

          echo "KEYSTORE VALIDATION: PASS"


      # ============================================================
      # 38. GRADLE
      # ============================================================

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          chmod +x gradlew

          ./gradlew \
            --version \
            --no-daemon

          echo "GRADLE VALIDATION: PASS"


      # ============================================================
      # 39. CLEAN
      # ============================================================

      - name: Clean Android build
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          ./gradlew \
            clean \
            --no-daemon

          echo "ANDROID CLEAN: PASS"


      # ============================================================
      # 40. BUILD FINAL SIGNED RELEASE APK ONLY
      # ============================================================

      - name: Build Final Signed Release APK Only
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          echo "=============================================="
          echo "RKMS FINAL SIGNED RELEASE APK"
          echo "=============================================="

          echo "PACKAGE: ${APP_ID}"
          echo "ANDROID API: ${ANDROID_API}"
          echo "BUILD TOOLS: ${BUILD_TOOLS}"
          echo "MIN SDK: ${MIN_SDK}"
          echo "TARGET SDK: ${TARGET_SDK}"
          echo "SIGNED: YES"
          echo "DEBUG APK: NO"
          echo "AAB: NO"

          echo "=============================================="

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then

            echo "::error::Release APK was not created."

            find app/build/outputs \
              -type f \
              -print \
              | sort

            exit 1

          fi

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"

          echo \
            "APK_PATH=$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk" \
            >> "$GITHUB_ENV"

          echo "RELEASE APK BUILD: PASS"


      # ============================================================
      # 41. APK PACKAGE + SIGNATURE
      # ============================================================

      - name: Verify APK package and signature
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          AAPT="$SDK_ROOT/build-tools/$BUILD_TOOLS/aapt"
          APKSIGNER="$SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner"

          test -x "$AAPT"
          test -x "$APKSIGNER"

          "$AAPT" \
            dump badging \
            "$APK_PATH" \
            | tee "$GITHUB_WORKSPACE/apk-badging.txt"

          grep -Fq \
            "package: name='$APP_ID'" \
            "$GITHUB_WORKSPACE/apk-badging.txt"

          grep -Fq \
            "targetSdkVersion:'36'" \
            "$GITHUB_WORKSPACE/apk-badging.txt"

          "$APKSIGNER" \
            verify \
            --verbose \
            "$APK_PATH"

          "$APKSIGNER" \
            verify \
            --print-certs \
            "$APK_PATH"

          echo "APK PACKAGE: PASS"
          echo "TARGET SDK 36: PASS"
          echo "APK SIGNATURE: PASS"


      # ============================================================
      # 42. SHA256
      # ============================================================

      - name: Generate APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            "$APK_PATH" \
            | tee \
            "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256"

          echo "SHA256: PASS"


      # ============================================================
      # 43. FINAL APK ONLY AUDIT
      # ============================================================

      - name: Final APK-only audit
        shell: bash
        run: |
          set -euo pipefail

          test -s "$APK_PATH"

          test -s \
            "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256"

          if find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.aab" \
            -print \
            | grep -q .
          then

            echo "::error::AAB detected."
            exit 1

          fi

          if find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "*debug*.apk" \
            -print \
            | grep -q .
          then

            echo "::error::Debug APK detected."
            exit 1

          fi

          SIZE="$(
            stat \
              -c%s \
              "$APK_PATH"
          )"

          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::APK size unexpectedly small."
            exit 1
          fi

          echo "=============================================="
          echo "FINAL APK AUDIT: PASS"
          echo "=============================================="

          echo "APK: RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"
          echo "SIGNED: YES"
          echo "DEBUG: NO"
          echo "AAB: NO"
          echo "SIZE: $SIZE bytes"

          echo "=============================================="


      # ============================================================
      # 44. UPLOAD FINAL APK
      # ============================================================

      - name: Upload final signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS_ANDROID16_API36_FINAL_SIGNED_RELEASE_APK
          if-no-files-found: error
          path: |
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256
          retention-days: 30

name: RKMS Android 16 API 36 - Final APK AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release:

    name: RKMS Final Android 16 API 36 APK + AAB

    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. FIND THE AUDITED RKMS ZIP
      # ============================================================
      - name: Locate RKMS source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " RKMS SOURCE ZIP VERIFICATION"
          echo "=============================================="

          ZIP_FILE="RKMS_CONNECT_FINAL_MERGED_DEEP_AUDIT_CHAT_WHATSAPP_PDA_PASSWORD_20260919.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "Exact RKMS ZIP not found."
            echo
            echo "Available ZIP files:"
            find . \
              -type f \
              -iname "*.zip" \
              -not -path "./.git/*" \
              | sort

            exit 1
          fi

          echo "Found:"
          echo "$ZIP_FILE"

          echo
          echo "Checking ZIP contents..."

          required_files=(
            "package.json"
            "package-lock.json"
            "app.js"
            "index.html"
            "styles.css"
            "capacitor.config.json"
            "google-services.json"
            "scripts/configure-android-16.sh"
            "scripts/setup-android-native.sh"
            "scripts/configure-release-signing.sh"
          )

          for file in "${required_files[@]}"; do

            if unzip -Z1 "$ZIP_FILE" | grep -Fxq "$file"; then
              echo "FOUND: $file"
            else
              echo "MISSING: $file"
              exit 1
            fi

          done

          echo
          echo "ZIP source verification: PASS"

          mkdir -p rkms-source

          unzip -q "$ZIP_FILE" -d rkms-source

          echo
          echo "Extracted RKMS source."

          test -f rkms-source/package.json
          test -f rkms-source/package-lock.json
          test -f rkms-source/app.js
          test -f rkms-source/index.html
          test -f rkms-source/styles.css
          test -f rkms-source/capacitor.config.json
          test -f rkms-source/google-services.json

          echo "Extracted source verification: PASS"


      # ============================================================
      # 3. NODE 22
      # ============================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      # ============================================================
      # 4. VERIFY RKMS SOURCE
      # ============================================================
      - name: Verify RKMS source
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source

          echo "=============================================="
          echo " RKMS SOURCE"
          echo "=============================================="

          node --version
          npm --version

          node --check app.js

          echo "package.json: PASS"
          echo "package-lock.json: PASS"
          echo "app.js syntax: PASS"
          echo "RKMS source: PASS"


      # ============================================================
      # 5. VERIFY PACKAGE / CAPACITOR
      # ============================================================
      - name: Verify package and Capacitor configuration
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source

          node <<'NODE'
          const fs = require("fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const cap = JSON.parse(
            fs.readFileSync("capacitor.config.json", "utf8")
          );

          if (pkg.name !== "rkms") {
            throw new Error(
              `Unexpected package name: ${pkg.name}`
            );
          }

          if (!pkg.scripts || !pkg.scripts.build) {
            throw new Error(
              "package.json build script is missing"
            );
          }

          if (cap.appId !== "org.rkms.connect") {
            throw new Error(
              `Unexpected appId: ${cap.appId}`
            );
          }

          if (cap.webDir !== "dist") {
            throw new Error(
              `Unexpected webDir: ${cap.webDir}`
            );
          }

          const deps = {
            ...(pkg.dependencies || {}),
            ...(pkg.devDependencies || {})
          };

          if (deps["@capacitor/core"] !== "6.2.2") {
            throw new Error(
              `Unexpected @capacitor/core: ${deps["@capacitor/core"]}`
            );
          }

          if (deps["@capacitor/android"] !== "6.2.2") {
            throw new Error(
              `Unexpected @capacitor/android: ${deps["@capacitor/android"]}`
            );
          }

          console.log("Package configuration: PASS");
          console.log("Capacitor configuration: PASS");
          console.log("App ID: org.rkms.connect");
          console.log("Web directory: dist");
          NODE


      # ============================================================
      # 6. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source

          npm ci --no-audit --no-fund

          npm ls @capacitor/core --depth=0
          npm ls @capacitor/android --depth=0
          npm ls @capacitor/push-notifications --depth=0

          echo "npm dependencies: PASS"


      # ============================================================
      # 7. BUILD WEB
      # ============================================================
      - name: Build RKMS web application
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source

          npm run build

          test -s dist/index.html

          echo "Web build: PASS"


      # ============================================================
      # 8. JDK 17
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 9. ANDROID SDK
      # ============================================================
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=/usr/local/lib/android/sdk" \
            >> "$GITHUB_ENV"

          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" \
            >> "$GITHUB_ENV"

          echo "/usr/local/lib/android/sdk/platform-tools" \
            >> "$GITHUB_PATH"

          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" \
            >> "$GITHUB_PATH"

          test -d /usr/local/lib/android/sdk

          test -x \
            /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager

          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            --version

          echo "Android SDK: PASS"


      # ============================================================
      # 10. ANDROID LICENSES
      # ============================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | \
            /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=/usr/local/lib/android/sdk \
            --licenses >/dev/null 2>&1 || true

          echo "Android licenses: PASS"


      # ============================================================
      # 11. ANDROID 16 / API 36
      # ============================================================
      - name: Install Android 16 API 36 SDK
        shell: bash
        run: |
          set -euo pipefail

          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=/usr/local/lib/android/sdk \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

          echo "Android API 36: PASS"
          echo "Build Tools 36.0.0: PASS"


      # ============================================================
      # 12. CAPACITOR ANDROID
      # ============================================================
      - name: Add Capacitor Android
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source

          rm -rf android

          npx cap add android

          test -f android/app/build.gradle
          test -f android/gradlew

          echo "Capacitor Android: PASS"


      # ============================================================
      # 13. CONFIGURE ANDROID 16
      # ============================================================
      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source

          chmod +x scripts/configure-android-16.sh

          bash scripts/configure-android-16.sh

          grep -q "36" \
            android/variables.gradle

          grep -q \
            "gradle-8.11.1-bin.zip" \
            android/gradle/wrapper/gradle-wrapper.properties

          grep -q \
            "com.android.tools.build:gradle:8.9.1" \
            android/build.gradle

          echo "Android 16 configuration: PASS"


      # ============================================================
      # 14. CAPACITOR SYNC
      # ============================================================
      - name: Sync Capacitor Android
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source

          npx cap sync android

          test -f \
            android/app/src/main/AndroidManifest.xml

          echo "Capacitor sync: PASS"


      # ============================================================
      # 15. FIREBASE + RKMS NATIVE
      # ============================================================
      - name: Setup RKMS native Android and Firebase
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source

          chmod +x scripts/setup-android-native.sh

          bash scripts/setup-android-native.sh

          test -s android/app/google-services.json

          grep -q \
            "com.google.gms.google-services" \
            android/app/build.gradle

          grep -q \
            "FirebaseApp.initializeApp(this)" \
            android/app/src/main/java/org/rkms/connect/MainActivity.java

          echo "Firebase initialization: PASS"
          echo "RKMS native Android: PASS"


      # ============================================================
      # 16. LAUNCHER ICONS
      # ============================================================
      - name: Verify RKMS launcher icons
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do

            cmp -s \
              "android_launcher_icons/mipmap-$density/ic_launcher.png" \
              "android/app/src/main/res/mipmap-$density/ic_launcher.png"

            cmp -s \
              "android_launcher_icons/mipmap-$density/ic_launcher_round.png" \
              "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"

          done

          test -s \
            assets/rkms-launcher-original-transparent.png

          echo "RKMS launcher icons: PASS"


      # ============================================================
      # 17. SIGNING SECRETS
      # ============================================================
      - name: Verify release signing secrets
        shell: bash
        run: |
          set -euo pipefail

          test -n "$RKMS_KEYSTORE_BASE64" || {
            echo "ERROR: RKMS_KEYSTORE_BASE64 missing."
            exit 1
          }

          test -n "$RKMS_KEYSTORE_PASSWORD" || {
            echo "ERROR: RKMS_KEYSTORE_PASSWORD missing."
            exit 1
          }

          test -n "$RKMS_KEY_ALIAS" || {
            echo "ERROR: RKMS_KEY_ALIAS missing."
            exit 1
          }

          test -n "$RKMS_KEY_PASSWORD" || {
            echo "ERROR: RKMS_KEY_PASSWORD missing."
            exit 1
          }

          echo "Release signing secrets: PASS"


      # ============================================================
      # 18. RELEASE SIGNING
      # ============================================================
      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source

          chmod +x scripts/configure-release-signing.sh

          bash scripts/configure-release-signing.sh

          grep -q \
            "signingConfigs.release" \
            android/app/build.gradle

          test -s \
            android/app/release.keystore

          echo "Release signing configuration: PASS"


      # ============================================================
      # 19. GRADLE
      # ============================================================
      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source

          grep -q \
            "gradle-8.11.1-bin.zip" \
            android/gradle/wrapper/gradle-wrapper.properties

          chmod +x android/gradlew

          cd android

          ./gradlew --version


      # ============================================================
      # 20. BUILD DEBUG APK
      # ============================================================
      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source/android

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

          test -s \
            app/build/outputs/apk/debug/app-debug.apk

          echo "Debug APK: PASS"


      # ============================================================
      # 21. BUILD RELEASE APK + AAB
      # ============================================================
      - name: Build signed release APK and AAB
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source/android

          ./gradlew clean \
            assembleRelease \
            bundleRelease \
            --no-daemon \
            --stacktrace

          test -s \
            app/build/outputs/apk/release/app-release.apk

          test -s \
            app/build/outputs/bundle/release/app-release.aab

          echo "Release APK: PASS"
          echo "Release AAB: PASS"


      # ============================================================
      # 22. VERIFY APK PACKAGE
      # ============================================================
      - name: Verify APK package ID
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source

          "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            dump badging \
            android/app/build/outputs/apk/release/app-release.apk \
            | grep -q \
            "package: name='org.rkms.connect'"

          echo "Package ID org.rkms.connect: PASS"


      # ============================================================
      # 23. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify \
            --verbose \
            android/app/build/outputs/apk/release/app-release.apk

          echo "APK signature: PASS"


      # ============================================================
      # 24. VERIFY AAB SIGNATURE
      # ============================================================
      - name: Verify AAB signature
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source

          jarsigner \
            -verify \
            -verbose \
            -certs \
            android/app/build/outputs/bundle/release/app-release.aab

          echo "AAB signature: PASS"


      # ============================================================
      # 25. PREPARE FINAL FILES
      # ============================================================
      - name: Prepare final APK and AAB
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source

          mkdir -p release

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            release/RKMS_CONNECT_ANDROID16_API36_DEBUG.apk

          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          cp \
            android/app/build/outputs/bundle/release/app-release.aab \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab

          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_DEBUG.apk

          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab

          sha256sum \
            release/RKMS_CONNECT_ANDROID16_API36_DEBUG.apk \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab \
            | tee \
            release/RKMS_ANDROID16_API36_SHA256.txt


      # ============================================================
      # 26. FINAL VERIFICATION
      # ============================================================
      - name: Final RKMS verification
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source

          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_DEBUG.apk

          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab

          echo
          echo "=============================================="
          echo " RKMS CONNECT FINAL BUILD READY"
          echo "=============================================="
          echo "App ID      : org.rkms.connect"
          echo "API         : 36"
          echo "Build Tools : 36.0.0"
          echo "Gradle      : 8.11.1"
          echo "AGP         : 8.9.1"
          echo "JDK         : 17"
          echo "Node        : 22"
          echo
          echo "DEBUG APK   : READY"
          echo "RELEASE APK : READY"
          echo "RELEASE AAB : READY"
          echo "=============================================="


      # ============================================================
      # 27. UPLOAD
      # ============================================================
      - name: Upload final RKMS APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: RKMS_CONNECT_ANDROID16_API36_FINAL
          path: |
            rkms-source/release/RKMS_CONNECT_ANDROID16_API36_DEBUG.apk
            rkms-source/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            rkms-source/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab
            rkms-source/release/RKMS_ANDROID16_API36_SHA256.txt
          if-no-files-found: error
          retention-days: 90

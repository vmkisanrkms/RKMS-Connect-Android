name: RKMS Connect Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android native source
        uses: actions/checkout@v4
        with:
          ref: cf252628308e5a6ecc9eafbaf4ca227a3ad8ec92
          fetch-depth: 1

      - name: Checkout repository files
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo-main
          fetch-depth: 1

      - name: Prepare website package
        shell: bash
        run: |
          set -e

          ZIP="repo-main/RKMS_CONNECT_HOME_PERSONAL_NOTIFICATION_FIXED_2026-09-04.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Final ZIP not found:"
            echo "$ZIP"
            exit 1
          fi

          rm -rf /tmp/rkms_web
          mkdir -p /tmp/rkms_web

          unzip -q "$ZIP" -d /tmp/rkms_web

          WEB_ROOT=$(find /tmp/rkms_web -type f -name "app.js" -print -quit | xargs dirname)

          if [ -z "$WEB_ROOT" ] || [ ! -f "$WEB_ROOT/app.js" ]; then
            echo "ERROR: Could not find website root containing app.js"
            exit 1
          fi

          echo "Website root:"
          echo "$WEB_ROOT"

          rm -rf app/src/main/assets/www
          mkdir -p app/src/main/assets/www

          # Copy the COMPLETE website root.
          # This preserves all folders/assets including the 60 book pages.
          cp -a "$WEB_ROOT"/. app/src/main/assets/www/

          echo "Website files copied:"
          find app/src/main/assets/www -type f | wc -l

          echo "Book assets:"
          find app/src/main/assets/www/assets/book -type f 2>/dev/null | sort || true

      - name: Verify final website
        shell: bash
        run: |
          set -e

          test -f app/src/main/assets/www/index.html
          test -f app/src/main/assets/www/app.js
          test -f app/src/main/assets/www/styles.css
          test -f app/src/main/assets/www/config.js

          BOOK_COUNT=$(find app/src/main/assets/www/assets/book -type f \
            \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" \) \
            | wc -l)

          echo "Book image count: $BOOK_COUNT"

          if [ "$BOOK_COUNT" -lt 61 ]; then
            echo "ERROR: Expected cover + 60 book pages."
            exit 1
          fi

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Create Gradle wrapper
        shell: bash
        run: |
          set -e

          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi

          chmod +x gradlew

      - name: Build release APK
        shell: bash
        run: |
          set -e
          ./gradlew clean assembleRelease --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-Final-Release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

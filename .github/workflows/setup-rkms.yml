name: RKMS Android 16 API 36 - Final Release APK Only

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  AGP_VERSION: "8.9.1"
  GRADLE_VERSION: "8.11.1"
  APP_ID: "org.rkms.connect"
  APK_NAME: "RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"

jobs:
  build:
    name: Build Final Release APK Only
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. FIND RKMS SOURCE ZIP
      # ============================================================
      - name: Locate RKMS source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for RKMS source ZIP..."

          ZIP=""

          for candidate in \
            "RKMS_CONNECT_FINAL_BUILD_V6_ALL_FIXES_GPM_APK_ONLY.zip" \
            "RKMS_CONNECT_FINAL_BUILD_V5_ALL_FIXES_FINAL.zip" \
            "RKMS_CONNECT_FINAL_BUILD_V4_GOOGLE_PASSWORD_MANAGER_ONLY.zip" \
            "RKMS_CONNECT_FINAL_BUILD_V4_FIXED_CHAT_NIYUKTI_MIC_PDF.zip" \
            "RKMS_CONNECT_FINAL_RELEASE_APK_ONLY_CHAT_FIXED.zip"
          do
            if [ -f "$candidate" ]; then
              ZIP="$candidate"
              break
            fi
          done

          if [ -z "$ZIP" ]; then
            ZIP="$(find . -maxdepth 2 -type f -iname '*.zip' \
              | grep -E 'RKMS|rkms' \
              | head -n 1 || true)"
          fi

          if [ -z "$ZIP" ]; then
            echo "::error::RKMS source ZIP not found"
            find . -maxdepth 3 -type f | sort | head -300
            exit 1
          fi

          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Using source: $ZIP"

      # ============================================================
      # 3. EXTRACT
      # ============================================================
      - name: Extract RKMS source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build-project
          mkdir -p build-project

          unzip -q "$SOURCE_ZIP" -d build-project

          echo "Extracted files:"
          find build-project -maxdepth 2 -type f | sort | head -200

      # ============================================================
      # 4. DETECT SOURCE ROOT
      # ============================================================
      - name: Detect RKMS source root
        shell: bash
        run: |
          set -euo pipefail

          ROOT=""

          if [ -f "build-project/package.json" ]; then
            ROOT="build-project"
          else
            ROOT="$(find build-project -type f -name package.json \
              -not -path '*/node_modules/*' \
              -print -quit \
              | xargs -r dirname)"
          fi

          if [ -z "$ROOT" ] || [ ! -f "$ROOT/package.json" ]; then
            echo "::error::RKMS package.json not found"
            find build-project -maxdepth 5 -name package.json -print
            exit 1
          fi

          echo "RKMS_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "RKMS_ROOT=$ROOT"

      # ============================================================
      # 5. BASIC SOURCE VALIDATION
      # ============================================================
      - name: Validate RKMS source
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          test -f package.json
          test -f app.js
          test -f capacitor.config.json
          test -f google-services.json
          test -f scripts/setup-android-native.sh

          echo "Core source files present."

          node -e '
          const p=require("./package.json");
          console.log("package:", p.name || "(unnamed)");
          console.log("version:", p.version || "(none)");
          '

      # ============================================================
      # 6. CHECK CAPACITOR VERSIONS
      # ============================================================
      - name: Verify Capacitor versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node <<'NODE'
          const fs = require("fs");

          const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const all = {
            ...(p.dependencies || {}),
            ...(p.devDependencies || {})
          };

          const expected = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          for (const [name, version] of Object.entries(expected)) {
            if (!all[name]) {
              throw new Error(`Missing ${name}`);
            }

            console.log(`${name}: ${all[name]}`);
          }

          console.log("Capacitor dependency validation completed.");
          NODE

      # ============================================================
      # 7. REMOVE AAB-ONLY WORKFLOW CONFLICTS
      # ============================================================
      - name: Disable conflicting AAB workflows
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          if [ -d ".github/workflows" ]; then
            find .github/workflows -type f \
              \( -name '*.yml' -o -name '*.yaml' \) \
              -print
          fi

          echo "Current workflow source retained."
          echo "This build itself will execute APK assembleRelease only."

      # ============================================================
      # 8. SETUP NODE
      # ============================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.RKMS_ROOT }}/package-lock.json

      # ============================================================
      # 9. INSTALL NPM
      # ============================================================
      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      # ============================================================
      # 10. BUILD WEB
      # ============================================================
      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          if node -e '
            const p=require("./package.json");
            process.exit(
              p.scripts && p.scripts.build ? 0 : 1
            );
          '; then
            npm run build
          else
            echo "No web build script found; using existing web source."
          fi

      # ============================================================
      # 11. VERIFY GOOGLE PASSWORD MANAGER IMPLEMENTATION
      # ============================================================
      - name: Verify Credential Manager source
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          echo "Checking Google Password Manager / Credential Manager..."

          grep -Fq 'androidx.credentials:credentials' package.json \
            || true

          grep -Fq 'autocomplete="current-password"' app.js \
            || {
              echo "::error::autocomplete=current-password missing"
              exit 1
            }

          grep -Fq 'RKMSNative?.savePassword' app.js \
            || grep -Fq 'RKMSNative.savePassword' app.js \
            || {
              echo "::error::RKMSNative.savePassword bridge missing in app.js"
              exit 1
            }

          grep -Fq 'CredentialManager' scripts/setup-android-native.sh \
            || {
              echo "::error::CredentialManager missing from native setup"
              exit 1
            }

          grep -Fq 'CreatePasswordRequest' scripts/setup-android-native.sh \
            || {
              echo "::error::CreatePasswordRequest missing"
              exit 1
            }

          grep -Fq 'createCredentialAsync' scripts/setup-android-native.sh \
            || {
              echo "::error::createCredentialAsync missing"
              exit 1
            }

          echo "Credential Manager source markers found."

      # ============================================================
      # 12. REMOVE OLD CUSTOM PASSWORD VAULT IF PRESENT
      # ============================================================
      - name: Remove obsolete custom password vault
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 <<'PY'
          from pathlib import Path
          import re

          app = Path("app.js")
          setup = Path("scripts/setup-android-native.sh")

          app_text = app.read_text(encoding="utf-8")
          setup_text = setup.read_text(encoding="utf-8")

          # Old custom credential plugin must not be used.
          old_markers = [
              "RKMSSecureCredentials",
              "RKMSSecureCredentialsPlugin",
              "rkmsSecureCredentials",
              "rkmsSaveLoginCredentials",
              "rkmsRestoreLoginCredentials",
              "Fingerprint / PIN से Saved Login भरें",
          ]

          found_app = [
              marker for marker in old_markers
              if marker in app_text
          ]

          found_setup = [
              marker for marker in old_markers
              if marker in setup_text
          ]

          # Do not fail here just because an audit/verifier mentions an old
          # marker. Only actual app/native source is checked later.
          print("Old markers in app.js:", found_app)
          print("Old markers in setup script:", found_setup)

          PY

      # ============================================================
      # 13. SETUP JAVA
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ============================================================
      # 14. SETUP ANDROID
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 15. INSTALL SDK 36
      # ============================================================
      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          sdkmanager --list_installed | grep -E \
            "platforms;android-${ANDROID_API}|build-tools;${BUILD_TOOLS}" \
            || true

      # ============================================================
      # 16. CAPACITOR ADD ANDROID
      # ============================================================
      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          rm -rf android

          npx cap add android

      # ============================================================
      # 17. CONFIGURE ANDROID API 36
      # ============================================================
      - name: Configure Android API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          python3 <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("variables.gradle"),
              Path("app/build.gradle"),
              Path("build.gradle"),
          ]

          for p in files:
              if not p.exists():
                  continue

              s = p.read_text(encoding="utf-8")

              s = re.sub(
                  r'compileSdkVersion\s*=\s*\d+',
                  'compileSdkVersion = 36',
                  s
              )

              s = re.sub(
                  r'targetSdkVersion\s*=\s*\d+',
                  'targetSdkVersion = 36',
                  s
              )

              s = re.sub(
                  r'minSdkVersion\s*=\s*\d+',
                  'minSdkVersion = 23',
                  s
              )

              p.write_text(s, encoding="utf-8")
          PY

      # ============================================================
      # 18. CONFIGURE GRADLE / AGP
      # ============================================================
      - name: Configure AGP 8.9.1 and Gradle 8.11.1
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            python3 <<'PY'
          from pathlib import Path

          p = Path("gradle/wrapper/gradle-wrapper.properties")
          s = p.read_text(encoding="utf-8")

          old = "distributionUrl="
          lines = s.splitlines()

          found = False
          for i, line in enumerate(lines):
              if line.startswith(old):
                  lines[i] = (
                      "distributionUrl="
                      "https\\://services.gradle.org/distributions/"
                      "gradle-8.11.1-all.zip"
                  )
                  found = True

          if not found:
              lines.append(
                  "distributionUrl="
                  "https\\://services.gradle.org/distributions/"
                  "gradle-8.11.1-all.zip"
              )

          p.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          fi

      # ============================================================
      # 19. ADD CREDENTIAL MANAGER DEPENDENCIES
      # ============================================================
      - name: Configure Credential Manager dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          APP_GRADLE="app/build.gradle"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "::error::app/build.gradle missing"
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text(encoding="utf-8")

          deps = [
              'implementation "androidx.credentials:credentials:1.5.0"',
              'implementation "androidx.credentials:credentials-play-services-auth:1.5.0"',
          ]

          marker = 'dependencies {'

          if marker not in s:
              raise SystemExit("dependencies block not found")

          for dep in deps:
              if dep not in s:
                  s = s.replace(
                      marker,
                      marker + "\n    " + dep,
                      1
                  )

          p.write_text(s, encoding="utf-8")
          PY

          echo "Credential Manager dependencies configured."

      # ============================================================
      # 20. CAPACITOR SYNC
      # ============================================================
      - name: Capacitor sync Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npx cap sync android

      # ============================================================
      # 21. RUN NATIVE SETUP
      # ============================================================
      - name: Configure RKMS native Android bridge
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x scripts/setup-android-native.sh

          ./scripts/setup-android-native.sh

      # ============================================================
      # 22. CRITICAL FIX:
      #     CredentialManager.createCredentialAsync()
      #     CONTEXT MUST BE FIRST
      # ============================================================
      - name: Fix Credential Manager async argument order
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 <<'PY'
          from pathlib import Path
          import re

          setup = Path("scripts/setup-android-native.sh")
          s = setup.read_text(encoding="utf-8")

          # Fix source template itself so every future Android generation
          # receives the correct method signature.
          #
          # WRONG:
          #
          # cm.createCredentialAsync(
          #     req,
          #     cancellationSignal,
          #     executor,
          #     callback
          # );
          #
          # CORRECT:
          #
          # cm.createCredentialAsync(
          #     activity,
          #     req,
          #     cancellationSignal,
          #     executor,
          #     callback
          # );

          pattern = re.compile(
              r'cm\.createCredentialAsync\(\s*'
              r'req\s*,',
              re.MULTILINE
          )

          s, count = pattern.subn(
              'cm.createCredentialAsync(\\n'
              '                            activity,\\n'
              '                            req,',
              s
          )

          print("Source async signature replacements:", count)

          setup.write_text(s, encoding="utf-8")

          # Also patch generated Java if it already exists.
          java_files = list(
              Path("android/app/src/main/java").rglob(
                  "RKMSNativeBridge.java"
              )
          )

          print("Generated bridge files:", java_files)

          for p in java_files:
              text = p.read_text(encoding="utf-8")

              text, c = pattern.subn(
                  'cm.createCredentialAsync(\\n'
                  '                            activity,\\n'
                  '                            req,',
                  text
              )

              if c:
                  print(f"Patched {p}: {c} occurrence(s)")

              p.write_text(text, encoding="utf-8")

          PY

      # ============================================================
      # 23. VERIFY CORRECT GENERATED JAVA
      # ============================================================
      - name: Verify Credential Manager Java signature
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          BRIDGE="$(find android/app/src/main/java \
            -type f \
            -name 'RKMSNativeBridge.java' \
            -print -quit)"

          if [ -z "$BRIDGE" ]; then
            echo "::error::RKMSNativeBridge.java not generated"
            find android/app/src/main/java -type f | sort | head -200
            exit 1
          fi

          echo "Bridge: $BRIDGE"

          echo "---- createCredentialAsync occurrences ----"
          grep -n -A8 -B3 \
            "createCredentialAsync" \
            "$BRIDGE" || true

          python3 - "$BRIDGE" <<'PY'
          from pathlib import Path
          import re
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          if "CredentialManager" not in s:
              raise SystemExit("CredentialManager missing")

          if "CreatePasswordRequest" not in s:
              raise SystemExit("CreatePasswordRequest missing")

          if "createCredentialAsync" not in s:
              raise SystemExit("createCredentialAsync missing")

          correct = re.search(
              r'createCredentialAsync\s*\(\s*'
              r'activity\s*,\s*'
              r'req\s*,',
              s,
              re.S
          )

          if not correct:
              raise SystemExit(
                  "ERROR: createCredentialAsync does not use "
                  "activity, req as first arguments"
              )

          wrong = re.search(
              r'createCredentialAsync\s*\(\s*'
              r'req\s*,',
              s,
              re.S
          )

          if wrong:
              raise SystemExit(
                  "ERROR: wrong createCredentialAsync(req, ...) "
                  "signature still exists"
              )

          print(
              "PASS: createCredentialAsync(activity, req, ...) "
              "signature verified."
          )
          PY

      # ============================================================
      # 24. VERIFY NO OLD CUSTOM CREDENTIAL PLUGIN IN REAL SOURCE
      # ============================================================
      - name: Verify obsolete custom credential plugin is not used
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          if grep -nE \
            'RKMSSecureCredentialsPlugin|@CapacitorPlugin\(name *= *"RKMSSecureCredentials"\)' \
            scripts/setup-android-native.sh; then

            echo "::error::Old custom credential plugin still exists in native setup."
            exit 1
          fi

          echo "PASS: old custom credential plugin not present in native setup."

      # ============================================================
      # 25. MICROPHONE + FILE PICKER
      # ============================================================
      - name: Verify microphone and file picker
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          grep -Fq 'RECORD_AUDIO' scripts/setup-android-native.sh \
            || {
              echo "::error::RECORD_AUDIO missing"
              exit 1
            }

          grep -Fq 'RESOURCE_AUDIO_CAPTURE' scripts/setup-android-native.sh \
            || {
              echo "::error::WebView audio permission bridge missing"
              exit 1
            }

          grep -Fq 'onShowFileChooser' scripts/setup-android-native.sh \
            || {
              echo "::error::File picker bridge missing"
              exit 1
            }

          grep -Fq 'MediaRecorder' app.js \
            || {
              echo "::error::MediaRecorder missing from app.js"
              exit 1
            }

          echo "PASS: microphone + file picker."

      # ============================================================
      # 26. KEYBOARD / RESIZE
      # ============================================================
      - name: Verify keyboard resize configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          grep -Fq 'SOFT_INPUT_ADJUST_RESIZE' \
            scripts/setup-android-native.sh \
            || {
              echo "::error::SOFT_INPUT_ADJUST_RESIZE missing"
              exit 1
            }

          grep -Eq \
            'visualViewport|resize.*keyboard|keyboard' \
            app.js \
            || {
              echo "::warning::Web keyboard handling marker not found"
            }

          echo "PASS: native adjustResize."

      # ============================================================
      # 27. FIREBASE
      # ============================================================
      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          test -f google-services.json

          grep -Fq 'FirebaseApp.initializeApp' \
            scripts/setup-android-native.sh \
            || {
              echo "::error::Firebase initialization missing"
              exit 1
            }

          echo "PASS: Firebase configuration."

      # ============================================================
      # 28. NATIVE BRIDGE
      # ============================================================
      - name: Verify RKMS native bridge
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          test -f \
            android/app/src/main/java/org/rkms/connect/RKMSNativeBridge.java \
            || {
              echo "::error::RKMSNativeBridge.java missing"
              find android/app/src/main/java \
                -name '*RKMS*' -print
              exit 1
            }

          grep -Fq 'savePassword' \
            android/app/src/main/java/org/rkms/connect/RKMSNativeBridge.java \
            || {
              echo "::error::savePassword missing from native bridge"
              exit 1
            }

          echo "PASS: RKMSNativeBridge."

      # ============================================================
      # 29. APP ID
      # ============================================================
      - name: Verify application ID
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          if ! grep -Rqs \
            'org\.rkms\.connect' \
            app/build.gradle \
            app/src/main/AndroidManifest.xml \
            2>/dev/null; then

            echo "::error::Application ID org.rkms.connect not found"
            exit 1
          fi

          echo "PASS: application ID."

      # ============================================================
      # 30. GRADLE VERSION
      # ============================================================
      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          grep -Fq \
            'gradle-8.11.1' \
            gradle/wrapper/gradle-wrapper.properties \
            || {
              echo "::error::Gradle 8.11.1 not configured"
              cat gradle/wrapper/gradle-wrapper.properties
              exit 1
            }

          chmod +x gradlew

          ./gradlew --version

      # ============================================================
      # 31. CLEAN BUILD
      # ============================================================
      - name: Clean Android build
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          ./gradlew clean --no-daemon

      # ============================================================
      # 32. FINAL RELEASE APK BUILD
      # ============================================================
      - name: Build Final Release APK Only
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          echo "=============================================="
          echo "Building RELEASE APK ONLY"
          echo "API: ${ANDROID_API}"
          echo "Build tools: ${BUILD_TOOLS}"
          echo "Java: ${JAVA_VERSION}"
          echo "Gradle: ${GRADLE_VERSION}"
          echo "=============================================="

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 33. LOCATE RELEASE APK
      # ============================================================
      - name: Locate release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          APK="$(find app/build/outputs/apk/release \
            -type f \
            -name '*.apk' \
            ! -name '*debug*' \
            -print \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "::error::Release APK was not generated."

            find app/build/outputs \
              -type f \
              -print \
              2>/dev/null || true

            exit 1
          fi

          cp "$APK" \
            "$GITHUB_WORKSPACE/${APK_NAME}"

          echo "APK_PATH=$GITHUB_WORKSPACE/${APK_NAME}" \
            >> "$GITHUB_ENV"

          echo "Release APK:"
          ls -lh "$GITHUB_WORKSPACE/${APK_NAME}"

      # ============================================================
      # 34. VERIFY APK
      # ============================================================
      - name: Verify final APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$APK_PATH"

          test -f "$APK"

          echo "APK size:"
          ls -lh "$APK"

          echo "APK file:"
          file "$APK"

          if [[ "$APK" == *debug* ]]; then
            echo "::error::Debug APK detected."
            exit 1
          fi

      # ============================================================
      # 35. VERIFY APK PACKAGE + SDK
      # ============================================================
      - name: Verify APK package and SDK
        shell: bash
        run: |
          set -euo pipefail

          APK="$APK_PATH"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt" \
            dump badging "$APK" \
            > apk-badging.txt

          echo "---- APK BADGING ----"
          cat apk-badging.txt

          grep -Fq \
            "package: name='${APP_ID}'" \
            apk-badging.txt \
            || {
              echo "::error::Wrong application ID"
              exit 1
            }

          grep -Fq \
            "targetSdkVersion:'36'" \
            apk-badging.txt \
            || {
              echo "::error::targetSdkVersion 36 not found"
              exit 1
            }

          echo "PASS: package + target SDK 36."

      # ============================================================
      # 36. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="$APK_PATH"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" \
            verify \
            --verbose \
            "$APK"

          echo "PASS: APK signature verified."

      # ============================================================
      # 37. SHA256
      # ============================================================
      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          sha256sum \
            "$APK_NAME" \
            | tee "${APK_NAME}.sha256"

          echo "SHA256:"
          cat "${APK_NAME}.sha256"

      # ============================================================
      # 38. FINAL OUTPUT AUDIT
      # ============================================================
      - name: Final APK-only audit
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          echo "---- Final artifacts ----"
          find . -maxdepth 1 -type f \
            \( -name '*.apk' -o -name '*.aab' -o -name '*.sha256' \) \
            -printf '%f\n' \
            | sort

          if find . -maxdepth 1 -type f \
            -name '*.aab' \
            | grep -q .; then

            echo "::error::AAB artifact detected."
            exit 1
          fi

          if find . -maxdepth 1 -type f \
            -iname '*debug*.apk' \
            | grep -q .; then

            echo "::error::Debug APK artifact detected."
            exit 1
          fi

          test -f "$APK_NAME"
          test -f "${APK_NAME}.sha256"

          echo "=============================================="
          echo "FINAL AUDIT PASSED"
          echo "APK ONLY"
          echo "No AAB"
          echo "No Debug APK"
          echo "API 36"
          echo "Target SDK 36"
          echo "Application ID: ${APP_ID}"
          echo "=============================================="

      # ============================================================
      # 39. UPLOAD FINAL APK + SHA ONLY
      # ============================================================
      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS_ANDROID16_API36_RELEASE_APK
          if-no-files-found: error
          path: |
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256
          retention-days: 30

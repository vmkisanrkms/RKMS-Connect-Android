name: RKMS Final Android 16 API 36 - Release AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-aab:
    name: RKMS Final Android 16 API 36 AAB
    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. LOCATE RKMS SOURCE
      # ============================================================
      - name: Locate RKMS source
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "RKMS SOURCE DISCOVERY"
          echo "=========================================="

          pwd
          ls -la

          if [ -f "package.json" ] && \
             [ -f "app.js" ] && \
             [ -f "index.html" ]; then

            echo "Using repository root as RKMS source."

            echo "SOURCE_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

          else

            echo "Repository root source not found."
            echo "Searching for RKMS ZIP..."

            mkdir -p rkms_source

            CANDIDATE=""

            if [ -f "RKMS_CONNECT_FIXED_2026-09-18.zip" ]; then

              CANDIDATE="RKMS_CONNECT_FIXED_2026-09-18.zip"

            elif [ -f "RKMS_CONNECT_FINAL_RULES_FIXED_2026-09-17.zip" ]; then

              CANDIDATE="RKMS_CONNECT_FINAL_RULES_FIXED_2026-09-17.zip"

            else

              CANDIDATE="$(find . \
                -maxdepth 3 \
                -type f \
                -name 'RKMS_CONNECT*.zip' \
                -print \
                | head -n 1 || true)"

            fi

            if [ -z "$CANDIDATE" ]; then
              echo "ERROR: RKMS source ZIP not found."
              exit 1
            fi

            echo "Using:"
            echo "$CANDIDATE"

            unzip -q "$CANDIDATE" -d rkms_source

            FOUND_DIR="$(find rkms_source \
              -type f \
              -name package.json \
              -print \
              -quit)"

            if [ -z "$FOUND_DIR" ]; then
              echo "ERROR: package.json not found."
              exit 1
            fi

            SOURCE_DIR="$(dirname "$FOUND_DIR")"

            echo "SOURCE_DIR=$GITHUB_WORKSPACE/$SOURCE_DIR" \
              >> "$GITHUB_ENV"

          fi

      # ============================================================
      # 3. VERIFY SOURCE
      # ============================================================
      - name: Verify RKMS source
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          test -f package.json
          test -f app.js
          test -f index.html
          test -f capacitor.config.json
          test -f google-services.json

          echo "RKMS source verification PASS."

      # ============================================================
      # 4. NODE.JS 22
      # ============================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ============================================================
      # 5. NODE / NPM CHECK
      # ============================================================
      - name: Verify Node and npm
        shell: bash
        run: |
          set -e

          node --version
          npm --version

      # ============================================================
      # 6. INSTALL NPM DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f package-lock.json ]; then

            echo "package-lock.json found."
            npm ci

          else

            echo "package-lock.json not found."
            npm install

          fi

      # ============================================================
      # 7. JAVASCRIPT CHECK
      # ============================================================
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          node --check app.js

          echo "JavaScript syntax PASS."

      # ============================================================
      # 8. WEB BUILD
      # ============================================================
      - name: Build web application
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if node -e "
            const p=require('./package.json');
            process.exit(
              p.scripts && p.scripts.build ? 0 : 1
            );
          "; then

            npm run build

          else

            echo "No build script."
            echo "Using existing web source."

          fi

      # ============================================================
      # 9. JDK 17
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 10. ANDROID SDK ENVIRONMENT
      #
      # IMPORTANT:
      # Do NOT use android-actions/setup-android@v3.
      # GitHub ubuntu runner already provides Android SDK.
      # ============================================================
      - name: Setup Android SDK environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID SDK ENVIRONMENT"
          echo "=========================================="

          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            export ANDROID_SDK_ROOT="${ANDROID_HOME}"
          fi

          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            echo "ERROR: Android SDK root not found."
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" \
            >> "$GITHUB_ENV"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" \
            >> "$GITHUB_ENV"

          echo "$ANDROID_SDK_ROOT/platform-tools" \
            >> "$GITHUB_PATH"

          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" ]; then

            echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" \
              >> "$GITHUB_PATH"

          else

            CMDLINE_BIN="$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -print \
              | head -n 1 \
              | xargs -r dirname)"

            if [ -z "$CMDLINE_BIN" ]; then
              echo "ERROR: sdkmanager not found."
              exit 1
            fi

            echo "$CMDLINE_BIN" >> "$GITHUB_PATH"

          fi

          echo "Android SDK environment configured."

      # ============================================================
      # 11. VERIFY SDKMANAGER
      # ============================================================
      - name: Verify Android SDK manager
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFY SDKMANAGER"
          echo "=========================================="

          command -v sdkmanager

          sdkmanager --version

      # ============================================================
      # 12. ACCEPT ANDROID LICENSES
      # ============================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "Android SDK licenses processed."

      # ============================================================
      # 13. INSTALL API 36 / BUILD TOOLS
      # ============================================================
      - name: Install Android 16 API 36
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "INSTALL ANDROID 16 / API 36"
          echo "=========================================="

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "Android API 36 installed."

      # ============================================================
      # 14. VERIFY API 36
      # ============================================================
      - name: Verify Android API 36
        shell: bash
        run: |
          set -e

          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -d "$ANDROID_SDK_ROOT/build-tools/36.0.0"

          echo "Android platform 36 found."
          echo "Android build-tools 36.0.0 found."

      # ============================================================
      # 15. CAPACITOR ANDROID
      # ============================================================
      - name: Prepare Capacitor Android
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ ! -d android ]; then

            echo "Creating Android project..."

            npx cap add android

          else

            echo "Android project already exists."

          fi

          npx cap sync android

      # ============================================================
      # 16. CONFIGURE ANDROID 16
      # ============================================================
      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          test -f scripts/configure-android-16.sh

          chmod +x scripts/configure-android-16.sh

          ./scripts/configure-android-16.sh

      # ============================================================
      # 17. CONFIGURE RKMS NATIVE ANDROID
      # ============================================================
      - name: Configure RKMS native Android
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          test -f scripts/setup-android-native.sh

          chmod +x scripts/setup-android-native.sh

          ./scripts/setup-android-native.sh

      # ============================================================
      # 18. VERIFY FIREBASE
      # ============================================================
      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          echo "=========================================="
          echo "FIREBASE VERIFICATION"
          echo "=========================================="

          test -f google-services.json
          test -f android/app/google-services.json

          grep -q \
            '"package_name"[[:space:]]*:[[:space:]]*"org.rkms.connect"' \
            google-services.json

          grep -q \
            '"package_name"[[:space:]]*:[[:space:]]*"org.rkms.connect"' \
            android/app/google-services.json

          if grep -Rqs \
            'FirebaseApp.initializeApp(this)' \
            android/app/src/main/java; then

            echo "FirebaseApp.initializeApp(this) FOUND."

          else

            echo "ERROR: FirebaseApp.initializeApp(this) NOT FOUND."
            exit 1

          fi

          echo "Firebase configuration PASS."

      # ============================================================
      # 19. VERIFY GOOGLE SERVICES PLUGIN
      # ============================================================
      - name: Verify Google Services plugin
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          grep -Rqs \
            'com.google.gms.google-services' \
            android

          grep -Rqs \
            'com.google.gms:google-services:4.4.3' \
            android

          echo "Google Services plugin PASS."

      # ============================================================
      # 20. VERIFY ANDROID PACKAGE
      # ============================================================
      - name: Verify Android package and SDK
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          grep -Rqs \
            'org.rkms.connect' \
            android/app/src/main

          if grep -Rqs \
            'compileSdk.*36\|compileSdkVersion.*36' \
            android; then

            echo "compileSdk 36 PASS."

          else

            echo "ERROR: compileSdk 36 not found."
            exit 1

          fi

          if grep -Rqs \
            'targetSdk.*36\|targetSdkVersion.*36' \
            android; then

            echo "targetSdk 36 PASS."

          else

            echo "ERROR: targetSdk 36 not found."
            exit 1

          fi

      # ============================================================
      # 21. VERIFY NATIVE BRIDGE
      # ============================================================
      - name: Verify RKMS Native Bridge
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          grep -Rqs \
            "RKMSNativeBridge" \
            android/app/src/main/java

          echo "RKMS Native Bridge PASS."

      # ============================================================
      # 22. SAVED LOGIN
      # ============================================================
      - name: Verify saved login
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-saved-login.py ]; then
            python3 scripts/verify-saved-login.py
          fi

      # ============================================================
      # 23. FCM
      # ============================================================
      - name: Verify FCM pipeline
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-fcm-pipeline.py ]; then
            python3 scripts/verify-fcm-pipeline.py
          fi

      # ============================================================
      # 24. LOGIN / NAVIGATION
      # ============================================================
      - name: Verify login and navigation
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-final-login-navigation.py ]; then
            python3 scripts/verify-final-login-navigation.py
          fi

      # ============================================================
      # 25. AUTHORITY HIERARCHY
      # ============================================================
      - name: Verify authority hierarchy
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-authority-hierarchy.py ]; then
            python3 scripts/verify-authority-hierarchy.py
          fi

      # ============================================================
      # 26. DIRECTORY
      # ============================================================
      - name: Verify directory
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-directory-lists.py ]; then
            python3 scripts/verify-directory-lists.py
          fi

          if [ -f scripts/verify-member-directory-scope.py ]; then
            python3 scripts/verify-member-directory-scope.py
          fi

          if [ -f scripts/verify-v17-directory-deep.py ]; then
            python3 scripts/verify-v17-directory-deep.py
          fi

      # ============================================================
      # 27. DIRECTORY CONTACT
      # ============================================================
      - name: Verify directory contact actions
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-directory-contact-actions.py ]; then
            python3 scripts/verify-directory-contact-actions.py
          fi

      # ============================================================
      # 28. CONTENT MANAGEMENT
      # ============================================================
      - name: Verify content management
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-content-management-final.py ]; then
            python3 scripts/verify-content-management-final.py
          fi

      # ============================================================
      # 29. PROFILE UPDATE
      # ============================================================
      - name: Verify profile update
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-profile-update-final.py ]; then
            python3 scripts/verify-profile-update-final.py
          fi

      # ============================================================
      # 30. PDF PIPELINE
      # ============================================================
      - name: Verify PDF pipeline
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-pdf-pipeline.py ]; then
            python3 scripts/verify-pdf-pipeline.py
          fi

      # ============================================================
      # 31. REPORT DOWNLOAD
      # ============================================================
      - name: Verify report download scope
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-report-download-scope.py ]; then
            python3 scripts/verify-report-download-scope.py
          fi

      # ============================================================
      # 32. FINAL RKMS CHECK
      # ============================================================
      - name: Final RKMS verification
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-rkms-final.py ]; then
            python3 scripts/verify-rkms-final.py
          fi

      # ============================================================
      # 33. DOCUMENT SIGNER CHECK
      # ============================================================
      - name: Verify document signer flow
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          grep -q \
            "getAppointmentMeta" \
            app.js

          grep -q \
            "getMembershipApprovalMeta" \
            app.js

          grep -q \
            "appointing_officer_signature_url" \
            app.js

          grep -q \
            "national_president_signature_url" \
            app.js

          echo "Digital ID signer flow PASS."
          echo "Membership Certificate signer flow PASS."
          echo "Appointment Letter signer flow PASS."

      # ============================================================
      # 34. GUEST NAVIGATION CHECK
      # ============================================================
      - name: Verify guest navigation
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          grep -q \
            'guest-nav' \
            app.js

          grep -q \
            'guest-nav' \
            styles.css

          if grep -q \
            'सदस्य / PDA अधिकारी Login' \
            app.js; then

            echo "ERROR: Old split login text found."
            exit 1

          fi

          echo "Guest navigation PASS."

      # ============================================================
      # 35. ANDROID MANIFEST
      # ============================================================
      - name: Verify Android manifest
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          grep -q \
            'android.permission.INTERNET' \
            "$MANIFEST"

          grep -q \
            'android.permission.POST_NOTIFICATIONS' \
            "$MANIFEST"

          echo "Android manifest PASS."

      # ============================================================
      # 36. CAPACITOR CHECK
      # ============================================================
      - name: Verify Capacitor Android
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          test -d android
          test -f android/gradlew

          echo "Capacitor Android PASS."

      # ============================================================
      # 37. RELEASE SIGNING
      # ============================================================
      - name: Configure release signing
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          test -f scripts/configure-release-signing.sh

          chmod +x scripts/configure-release-signing.sh

          ./scripts/configure-release-signing.sh

      # ============================================================
      # 38. GRADLE 8.11.1
      # ============================================================
      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      # ============================================================
      # 39. VERIFY GRADLE
      # ============================================================
      - name: Verify Gradle
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR/android"

          chmod +x gradlew

          ./gradlew --version

      # ============================================================
      # 40. BUILD SIGNED AAB
      # ============================================================
      - name: Build signed Release AAB
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR/android"

          echo "=========================================="
          echo "BUILDING RKMS RELEASE AAB"
          echo "=========================================="

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            bundleRelease

      # ============================================================
      # 41. LOCATE AAB
      # ============================================================
      - name: Locate Release AAB
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          AAB="$(find android/app/build/outputs/bundle \
            -type f \
            -name '*release*.aab' \
            -print \
            | head -n 1)"

          if [ -z "$AAB" ]; then
            echo "ERROR: Release AAB not found."
            exit 1
          fi

          echo "AAB=$AAB" >> "$GITHUB_ENV"

          ls -lh "$AAB"

      # ============================================================
      # 42. VERIFY AAB SIGNATURE
      # ============================================================
      - name: Verify AAB signature
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB"

          echo "AAB signature verification PASS."

      # ============================================================
      # 43. SHA256
      # ============================================================
      - name: Generate SHA256
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          sha256sum "$AAB" \
            | tee RKMS_RELEASE_AAB_SHA256.txt

      # ============================================================
      # 44. PREPARE ARTIFACT
      # ============================================================
      - name: Prepare release artifacts
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          rm -rf release
          mkdir -p release

          cp "$AAB" \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab

          cp RKMS_RELEASE_AAB_SHA256.txt \
            release/

          ls -lh release/

      # ============================================================
      # 45. UPLOAD AAB
      # ============================================================
      - name: Upload final Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-CONNECT-Android16-API36-Release
          path: |
            ${{ env.SOURCE_DIR }}/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab
            ${{ env.SOURCE_DIR }}/release/RKMS_RELEASE_AAB_SHA256.txt
          if-no-files-found: error
          retention-days: 30

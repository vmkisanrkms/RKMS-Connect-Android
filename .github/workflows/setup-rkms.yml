name: RKMS Android 16 API 36 APK + AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release:

    name: RKMS Final Android 16 API 36 APK + AAB
    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. LOCATE EXACT RKMS SOURCE ZIP
      # ============================================================
      - name: Locate RKMS source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="RKMS_CONNECT_FINAL_MERGED_DEEP_AUDIT_CHAT_WHATSAPP_PDA_PASSWORD_20260919.zip"

          echo "=============================================="
          echo " RKMS SOURCE ZIP VERIFICATION"
          echo "=============================================="

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: RKMS source ZIP not found:"
            echo "$ZIP_FILE"
            echo
            echo "Available ZIP files:"
            find . \
              -type f \
              -iname "*.zip" \
              -not -path "./.git/*" \
              | sort
            exit 1
          fi

          echo "FOUND: $ZIP_FILE"

          required_files=(
            "package.json"
            "package-lock.json"
            "app.js"
            "index.html"
            "styles.css"
            "capacitor.config.json"
            "google-services.json"
            "scripts/configure-android-16.sh"
            "scripts/setup-android-native.sh"
            "scripts/configure-release-signing.sh"
          )

          echo
          echo "Checking ZIP contents..."

          ZIP_LIST="$(unzip -Z1 "$ZIP_FILE")"

          for file in "${required_files[@]}"; do
            if printf '%s\n' "$ZIP_LIST" | grep -Fxq "$file"; then
              echo "FOUND: $file"
            else
              echo "MISSING: $file"
              exit 1
            fi
          done

          echo
          echo "ZIP verification: PASS"

          rm -rf rkms-source
          mkdir -p rkms-source

          unzip -q "$ZIP_FILE" -d rkms-source

          for file in "${required_files[@]}"; do
            test -f "rkms-source/$file"
          done

          echo "Extracted RKMS source: PASS"


      # ============================================================
      # 3. NODE 22
      # ============================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      # ============================================================
      # 4. VERIFY SOURCE
      # ============================================================
      - name: Verify RKMS source
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source

          echo "=============================================="
          echo " RKMS SOURCE VERIFICATION"
          echo "=============================================="

          node --version
          npm --version

          test -s package.json
          test -s package-lock.json
          test -s app.js
          test -s index.html
          test -s styles.css
          test -s capacitor.config.json
          test -s google-services.json

          node --check app.js

          echo "RKMS source: PASS"


      # ============================================================
      # 5. VERIFY PACKAGE + CAPACITOR
      # ============================================================
      - name: Verify package and Capacitor configuration
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source

          node <<'NODE'
          const fs = require("fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const cap = JSON.parse(
            fs.readFileSync("capacitor.config.json", "utf8")
          );

          if (pkg.name !== "rkms") {
            throw new Error(
              `Unexpected package name: ${pkg.name}`
            );
          }

          if (!pkg.scripts || !pkg.scripts.build) {
            throw new Error(
              "package.json build script is missing"
            );
          }

          if (cap.appId !== "org.rkms.connect") {
            throw new Error(
              `Unexpected appId: ${cap.appId}`
            );
          }

          if (cap.webDir !== "dist") {
            throw new Error(
              `Unexpected webDir: ${cap.webDir}`
            );
          }

          const deps = {
            ...(pkg.dependencies || {}),
            ...(pkg.devDependencies || {})
          };

          if (deps["@capacitor/core"] !== "6.2.2") {
            throw new Error(
              `Unexpected @capacitor/core: ${deps["@capacitor/core"]}`
            );
          }

          if (deps["@capacitor/android"] !== "6.2.2") {
            throw new Error(
              `Unexpected @capacitor/android: ${deps["@capacitor/android"]}`
            );
          }

          if (
            deps["@capacitor/push-notifications"] !== "6.0.3"
          ) {
            throw new Error(
              `Unexpected @capacitor/push-notifications: ${deps["@capacitor/push-notifications"]}`
            );
          }

          console.log("package.json: PASS");
          console.log("capacitor.config.json: PASS");
          console.log("App ID: org.rkms.connect");
          console.log("WebDir: dist");
          NODE


      # ============================================================
      # 6. NPM INSTALL
      # ============================================================
      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source

          npm ci --no-audit --no-fund

          npm ls @capacitor/core --depth=0
          npm ls @capacitor/android --depth=0
          npm ls @capacitor/push-notifications --depth=0

          echo "npm dependencies: PASS"


      # ============================================================
      # 7. WEB BUILD
      # ============================================================
      - name: Build RKMS web application
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source

          npm run build

          test -s dist/index.html

          echo "Web build: PASS"


      # ============================================================
      # 8. JDK 17
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 9. ANDROID SDK
      # ============================================================
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=/usr/local/lib/android/sdk" \
            >> "$GITHUB_ENV"

          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" \
            >> "$GITHUB_ENV"

          echo "/usr/local/lib/android/sdk/platform-tools" \
            >> "$GITHUB_PATH"

          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" \
            >> "$GITHUB_PATH"

          test -d /usr/local/lib/android/sdk

          test -x \
            /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager

          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            --version

          echo "Android SDK: PASS"


      # ============================================================
      # 10. ANDROID LICENSES
      # ============================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | \
            /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=/usr/local/lib/android/sdk \
            --licenses >/dev/null 2>&1 || true

          echo "Android SDK licenses: PASS"


      # ============================================================
      # 11. ANDROID 16 / API 36
      # ============================================================
      - name: Install Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=/usr/local/lib/android/sdk \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

          echo "Android API 36: PASS"
          echo "Build Tools 36.0.0: PASS"


      # ============================================================
      # 12. GENERATE CAPACITOR ANDROID
      # ============================================================
      - name: Generate Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source

          rm -rf android

          npx cap add android

          test -f android/app/build.gradle
          test -f android/gradlew

          echo "Capacitor Android project: PASS"


      # ============================================================
      # 13. CONFIGURE ANDROID 16
      # ============================================================
      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source

          chmod +x scripts/configure-android-16.sh

          bash scripts/configure-android-16.sh

          grep -q \
            "compileSdkVersion = 36" \
            android/variables.gradle

          grep -q \
            "targetSdkVersion = 36" \
            android/variables.gradle

          grep -q \
            "com.android.tools.build:gradle:8.9.1" \
            android/build.gradle

          grep -q \
            "gradle-8.11.1-bin.zip" \
            android/gradle/wrapper/gradle-wrapper.properties

          echo "Android 16 configuration: PASS"


      # ============================================================
      # 14. CAPACITOR SYNC
      # ============================================================
      - name: Sync Capacitor
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source

          npx cap sync android

          test -f \
            android/app/src/main/AndroidManifest.xml

          echo "Capacitor sync: PASS"


      # ============================================================
      # 15. RKMS NATIVE + FIREBASE SETUP
      # ============================================================
      - name: Setup RKMS native Android and Firebase
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source

          chmod +x scripts/setup-android-native.sh

          bash scripts/setup-android-native.sh

          test -s android/app/google-services.json

          echo "RKMS native setup: PASS"


      # ============================================================
      # 16. ENSURE FIREBASE SDK
      #
      # MainActivity.java uses FirebaseApp.initializeApp(this).
      # FirebaseApp must therefore be available at compile time.
      # ============================================================
      - name: Ensure Firebase SDK dependency
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text()

          firebase_bom = (
              "implementation platform("
              "'com.google.firebase:firebase-bom:33.9.0'"
              ")"
          )

          firebase_messaging = (
              "implementation "
              "'com.google.firebase:firebase-messaging'"
          )

          match = re.search(
              r'(?m)^[ \t]*dependencies[ \t]*\{',
              text
          )

          if not match:
              raise SystemExit(
                  "ERROR: dependencies block not found"
              )

          start = match.end()

          depth = 1
          pos = start

          while pos < len(text) and depth:
              if text[pos] == "{":
                  depth += 1
              elif text[pos] == "}":
                  depth -= 1
              pos += 1

          if depth != 0:
              raise SystemExit(
                  "ERROR: dependencies block malformed"
              )

          end = pos - 1

          block = text[start:end]

          if "com.google.firebase:firebase-bom:" not in block:
              block = (
                  "\n"
                  "    // RKMS Firebase BOM\n"
                  f"    {firebase_bom}\n"
                  + block
              )

          if "com.google.firebase:firebase-messaging" not in block:
              block += (
                  "\n"
                  "    // RKMS Firebase Messaging\n"
                  f"    {firebase_messaging}\n"
              )

          text = text[:start] + block + text[end:]

          path.write_text(text)

          print("Firebase dependencies ensured.")
          PY

          grep -q \
            "com.google.firebase:firebase-bom:33.9.0" \
            android/app/build.gradle

          grep -q \
            "com.google.firebase:firebase-messaging" \
            android/app/build.gradle

          echo "Firebase SDK dependency: PASS"


      # ============================================================
      # 17. VERIFY FIREBASE
      # ============================================================
      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source

          grep -q \
            "com.google.gms.google-services" \
            android/app/build.gradle

          python3 <<'PY'
          import json
          from pathlib import Path

          path = Path("android/app/google-services.json")

          data = json.loads(path.read_text())

          packages = []

          for client in data.get("client", []):
              packages.append(
                  client
                  .get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

          if "org.rkms.connect" not in packages:
              raise SystemExit(
                  "ERROR: org.rkms.connect missing from "
                  "google-services.json"
              )

          print("Firebase package: org.rkms.connect")
          print("Firebase configuration: PASS")
          PY

          if grep -Rqs \
            "FirebaseApp.initializeApp" \
            android/app/src/main/java/org/rkms/connect; then

            echo "FirebaseApp.initializeApp: FOUND"

          else

            echo "ERROR: FirebaseApp.initializeApp not found"
            exit 1

          fi


      # ============================================================
      # 18. LAUNCHER ICONS
      # ============================================================
      - name: Verify RKMS launcher icons
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source

          if [ -d android_launcher_icons ]; then

            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do

              if [ -f \
                "android_launcher_icons/mipmap-$density/ic_launcher.png"
              ]; then
                test -s \
                  "android/app/src/main/res/mipmap-$density/ic_launcher.png"
              fi

              if [ -f \
                "android_launcher_icons/mipmap-$density/ic_launcher_round.png"
              ]; then
                test -s \
                  "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
              fi

            done

            echo "RKMS launcher icons: PASS"

          else

            echo "Launcher source directory not present."
            echo "Using generated Android resources."

          fi


      # ============================================================
      # 19. RELEASE SIGNING
      # ============================================================
      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source

          chmod +x scripts/configure-release-signing.sh

          bash scripts/configure-release-signing.sh

          if [ -f android/app/release.keystore ]; then

            echo "Release keystore: FOUND"

            grep -q \
              "signingConfigs.release" \
              android/app/build.gradle

            echo "Release signing: CONFIGURED"

          else

            echo "Release signing secrets not configured."
            echo "Release build will remain unsigned."

          fi


      # ============================================================
      # 20. GRADLE VERIFICATION
      # ============================================================
      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source

          chmod +x android/gradlew

          grep -q \
            "gradle-8.11.1-bin.zip" \
            android/gradle/wrapper/gradle-wrapper.properties

          cd android

          ./gradlew --version


      # ============================================================
      # 21. VERIFY FIREBASE COMPILE CLASSPATH
      # ============================================================
      - name: Verify Firebase compile dependency
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source/android

          ./gradlew \
            :app:dependencies \
            --configuration debugCompileClasspath \
            --no-daemon \
            | tee ../firebase-dependency-check.txt

          grep -q \
            "com.google.firebase:firebase-messaging" \
            ../firebase-dependency-check.txt

          echo "Firebase compile dependency: PASS"


      # ============================================================
      # 22. BUILD DEBUG APK
      # ============================================================
      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source/android

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

          test -s \
            app/build/outputs/apk/debug/app-debug.apk

          echo "Debug APK: PASS"


      # ============================================================
      # 23. BUILD RELEASE APK + AAB
      #
      # IMPORTANT:
      # NO "clean" HERE.
      #
      # Debug APK was already created and must remain available
      # for the final artifact step.
      # ============================================================
      - name: Build release APK and AAB
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source/android

          ./gradlew \
            assembleRelease \
            bundleRelease \
            --no-daemon \
            --stacktrace

          test -s \
            app/build/outputs/apk/release/app-release.apk

          test -s \
            app/build/outputs/bundle/release/app-release.aab

          echo "Release APK: PASS"
          echo "Release AAB: PASS"


      # ============================================================
      # 24. VERIFY DEBUG APK STILL EXISTS
      # ============================================================
      - name: Verify all build outputs
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source

          test -s \
            android/app/build/outputs/apk/debug/app-debug.apk

          test -s \
            android/app/build/outputs/apk/release/app-release.apk

          test -s \
            android/app/build/outputs/bundle/release/app-release.aab

          echo "Debug APK exists: PASS"
          echo "Release APK exists: PASS"
          echo "Release AAB exists: PASS"


      # ============================================================
      # 25. VERIFY PACKAGE ID
      # ============================================================
      - name: Verify release APK package ID
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source

          "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            dump badging \
            android/app/build/outputs/apk/release/app-release.apk \
            | grep -q \
            "package: name='org.rkms.connect'"

          echo "Package ID org.rkms.connect: PASS"


      # ============================================================
      # 26. VERIFY SIGNATURE IF SIGNED
      # ============================================================
      - name: Verify release signatures
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source

          if [ -f android/app/release.keystore ]; then

            "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
              verify \
              --verbose \
              android/app/build/outputs/apk/release/app-release.apk

            jarsigner \
              -verify \
              -verbose \
              -certs \
              android/app/build/outputs/bundle/release/app-release.aab

            echo "APK signature: PASS"
            echo "AAB signature: PASS"

          else

            echo "Unsigned release."
            echo "Signature verification skipped."

          fi


      # ============================================================
      # 27. PREPARE FINAL ARTIFACTS
      # ============================================================
      - name: Prepare final RKMS artifacts
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source

          mkdir -p release

          # --------------------------------------------------------
          # Verify BEFORE copying.
          # --------------------------------------------------------
          test -s \
            android/app/build/outputs/apk/debug/app-debug.apk

          test -s \
            android/app/build/outputs/apk/release/app-release.apk

          test -s \
            android/app/build/outputs/bundle/release/app-release.aab

          # --------------------------------------------------------
          # Copy APK + AAB.
          # --------------------------------------------------------
          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            release/RKMS_CONNECT_ANDROID16_API36_DEBUG.apk

          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          cp \
            android/app/build/outputs/bundle/release/app-release.aab \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab

          # --------------------------------------------------------
          # Verify copied files.
          # --------------------------------------------------------
          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_DEBUG.apk

          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab

          # --------------------------------------------------------
          # SHA256.
          # --------------------------------------------------------
          sha256sum \
            release/RKMS_CONNECT_ANDROID16_API36_DEBUG.apk \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab \
            | tee \
            release/RKMS_ANDROID16_API36_SHA256.txt

          echo
          echo "Final artifacts: PASS"


      # ============================================================
      # 28. FINAL VERIFICATION
      # ============================================================
      - name: Final RKMS verification
        shell: bash
        run: |
          set -euo pipefail

          cd rkms-source

          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_DEBUG.apk

          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab

          test -s \
            release/RKMS_ANDROID16_API36_SHA256.txt

          echo
          echo "================================================"
          echo "        RKMS CONNECT FINAL BUILD READY"
          echo "================================================"
          echo
          echo "App ID      : org.rkms.connect"
          echo "Android API : 36"
          echo "Build Tools : 36.0.0"
          echo "Gradle      : 8.11.1"
          echo "AGP         : 8.9.1"
          echo "JDK         : 17"
          echo "Node        : 22"
          echo
          echo "DEBUG APK   : READY"
          echo "RELEASE APK : READY"
          echo "RELEASE AAB : READY"
          echo "SHA256      : READY"
          echo
          echo "================================================"

          ls -lh release/


      # ============================================================
      # 29. UPLOAD FINAL FILES
      # ============================================================
      - name: Upload final APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: RKMS_CONNECT_ANDROID16_API36_FINAL
          path: |
            rkms-source/release/RKMS_CONNECT_ANDROID16_API36_DEBUG.apk
            rkms-source/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            rkms-source/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab
            rkms-source/release/RKMS_ANDROID16_API36_SHA256.txt
          if-no-files-found: error
          retention-days: 90

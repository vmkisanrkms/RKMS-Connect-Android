name: Build RKMS APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rkms-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build RKMS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract RKMS ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -name 'RKMS_Connect_*.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: RKMS ZIP not found."
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name '*.zip' -print || true
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          TMP_DIR="$RUNNER_TEMP/rkms-project"
          rm -rf "$TMP_DIR"
          mkdir -p "$TMP_DIR"

          unzip -q "$ZIP_FILE" -d "$TMP_DIR"

          PROJECT_DIR="$(
            find "$TMP_DIR" -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -print -quit |
              xargs -r dirname
          )"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found inside ZIP."
            find "$TMP_DIR" -maxdepth 5 -type f | sort | head -300
            exit 1
          fi

          echo "Android project: $PROJECT_DIR"

          rsync -a \
            --exclude='.github/' \
            "$PROJECT_DIR/" \
            "$GITHUB_WORKSPACE/"

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -f gradle.properties
          test -d app
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Android project: PASS"

      - name: Verify app name RKMS
        shell: bash
        run: |
          set -euo pipefail

          grep -q '<string name="app_name">RKMS</string>' \
            app/src/main/res/values/strings.xml

          echo "App name: RKMS"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate Gradle project
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon tasks

      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean

      - name: Build RKMS Debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            find app/build -type f | sort || true
            exit 1
          fi

          echo "======================================"
          echo "RKMS APK BUILD SUCCESS"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload RKMS APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

          # ========================================================

          if "rkms-release.keystore" not in text:

              m = re.search(
                  r'\bandroid\s*\{',
                  text
              )

              if not m:

                  raise SystemExit(
                      "ERROR: android block not found"
                  )

              pos = m.end()

              signing = """

              signingConfigs {

name: RKMS Android 16 API 36 - Final Signed Release APK Only

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  APP_ID: "org.rkms.connect"

jobs:

  build:

    name: RKMS Final Signed Release APK

    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # NODE 22
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # ============================================================
      # HOST PACKAGES
      # ============================================================

      - name: Install required host packages
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y unzip rsync

          echo "HOST PACKAGES: PASS"


      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ============================================================
      # ANDROID API 36
      # ============================================================

      - name: Install Android API 36 SDK packages
        shell: bash
        run: |
          set -euo pipefail

          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          test -d \
            "$ANDROID_HOME/platforms/android-${ANDROID_API}"

          test -d \
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}"

          test -x \
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt"

          test -x \
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

          echo "ANDROID PLATFORM ${ANDROID_API}: PASS"
          echo "BUILD TOOLS ${BUILD_TOOLS}: PASS"


      # ============================================================
      # VERIFY ANDROID SDK
      # ============================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not-set}"

          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME"

          sdkmanager --version

          test -d \
            "$ANDROID_HOME/platforms/android-${ANDROID_API}"

          test -d \
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}"

          test -x \
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt"

          test -x \
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

          echo "ANDROID SDK VERIFICATION: PASS"


      # ============================================================
      # LOCATE RKMS SOURCE
      # ============================================================

      - name: Locate RKMS source
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE="$GITHUB_WORKSPACE"

          echo "=========================================="
          echo "LOCATING RKMS SOURCE"
          echo "=========================================="

          if [ -s "$WORKSPACE/package.json" ]; then

            ROOT="$WORKSPACE"

            echo "RKMS source found directly in repository."

          else

            ZIP_FILE="$(
              find "$WORKSPACE" \
                -maxdepth 3 \
                -type f \
                \( \
                  -name "RKMS_CONNECT_FINAL_ALL_NOTIFICATION_FIXES_*.zip" \
                  -o \
                  -name "RKMS_CONNECT_FINAL_AUDITED_RELEASE_APK_BUILD_*.zip" \
                  -o \
                  -name "RKMS_CONNECT_FINAL_*.zip" \
                  -o \
                  -name "RKMS_CONNECT_*.zip" \
                \) \
                -print \
                -quit
            )"

            if [ -z "$ZIP_FILE" ]; then

              echo "::error::RKMS source ZIP not found."
              exit 1

            fi

            echo "RKMS source ZIP:"
            echo "$ZIP_FILE"

            rm -rf "$WORKSPACE/rkms-build"

            mkdir -p "$WORKSPACE/rkms-build"

            unzip -q \
              "$ZIP_FILE" \
              -d "$WORKSPACE/rkms-build"

            if [ -s \
              "$WORKSPACE/rkms-build/final_audit_src/package.json"
            ]; then

              ROOT="$WORKSPACE/rkms-build/final_audit_src"

            elif [ -s \
              "$WORKSPACE/rkms-build/package.json"
            ]; then

              ROOT="$WORKSPACE/rkms-build"

            else

              PACKAGE_FILE="$(
                find "$WORKSPACE/rkms-build" \
                  -type f \
                  -name package.json \
                  -not -path '*/node_modules/*' \
                  -print \
                  -quit
              )"

              if [ -z "$PACKAGE_FILE" ]; then
                echo "::error::package.json not found inside RKMS ZIP."
                exit 1
              fi

              ROOT="$(dirname "$PACKAGE_FILE")"

            fi

          fi

          ROOT="$(cd "$ROOT" && pwd)"

          test -d "$ROOT"
          test -s "$ROOT/package.json"

          echo "RKMS_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "RKMS ROOT:"
          echo "$ROOT"
          echo "=========================================="


      # ============================================================
      # VERIFY SOURCE
      # ============================================================

      - name: Verify RKMS source structure
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          REQUIRED_FILES=(
            "package.json"
            "package-lock.json"
            "app.js"
            "index.html"
            "styles.css"
            "capacitor.config.json"
            "google-services.json"
            "scripts/setup-android-native.sh"
            "scripts/configure-android-16.sh"
            "scripts/configure-release-signing.sh"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -s "$FILE" ]; then
              echo "::error::Required file missing: $FILE"
              exit 1
            fi
          done

          node --check app.js

          python3 -m json.tool \
            capacitor.config.json \
            >/dev/null

          python3 -m json.tool \
            google-services.json \
            >/dev/null

          bash -n \
            scripts/configure-android-16.sh

          bash -n \
            scripts/configure-release-signing.sh

          echo "RKMS SOURCE STRUCTURE: PASS"


      # ============================================================
      # INSTALL CORRECT RKMS NATIVE SCRIPT
      #
      # IMPORTANT:
      # This completely replaces the broken setup-android-native.sh.
      #
      # NO "Repair native setup Python heredoc".
      # NO Python/bash mixing.
      # ============================================================

      - name: Install corrected RKMS native Android setup
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          mkdir -p scripts

          cat > scripts/setup-android-native.sh <<'RKMS_NATIVE_SCRIPT'
#!/usr/bin/env bash
set -euo pipefail

MAIN_ACTIVITY="$(
  find android/app/src/main \
    -type f \
    -name 'MainActivity.java' \
    -print \
    -quit
)"

if [ -z "$MAIN_ACTIVITY" ]; then
  echo "ERROR: MainActivity.java not found after Capacitor Android generation" >&2
  find android/app/src/main -type f >&2 || true
  exit 1
fi

APP_SRC="$(dirname "$MAIN_ACTIVITY")"

mkdir -p "$APP_SRC"


# ==============================================================
# GOOGLE SERVICES GRADLE PLUGIN
# ==============================================================

python3 - <<'PY2'
from pathlib import Path

root = Path("android/build.gradle")
s = root.read_text()

if "com.google.gms:google-services:" not in s:
    marker = "dependencies {"

    if marker not in s:
        raise SystemExit(
            "android/build.gradle dependencies block missing"
        )

    s = s.replace(
        marker,
        marker + '\n        classpath "com.google.gms:google-services:4.4.3"',
        1
    )

    root.write_text(s)

app = Path("android/app/build.gradle")
s = app.read_text()

if "com.google.gms.google-services" not in s:
    s += '''
    
// RKMS FCM: process android/app/google-services.json
apply plugin: "com.google.gms.google-services"
'''

    app.write_text(s)
PY2


# ==============================================================
# ANDROID CREDENTIAL MANAGER
# ==============================================================

python3 - <<'PYCM'
from pathlib import Path

p = Path("android/app/build.gradle")
s = p.read_text()

if "androidx.credentials:credentials:" not in s:

    marker = "dependencies {"

    if marker not in s:
        raise SystemExit(
            "dependencies block missing"
        )

    s = s.replace(
        marker,
        marker
        + '\n    implementation "androidx.credentials:credentials:1.5.0"'
        + '\n    implementation "androidx.credentials:credentials-play-services-auth:1.5.0"',
        1
    )

p.write_text(s)
PYCM


# ==============================================================
# GOOGLE SERVICES JSON
# ==============================================================

if [ ! -f "google-services.json" ]; then
  echo "ERROR: root google-services.json is missing" >&2
  exit 1
fi

cp -f \
  "google-services.json" \
  "android/app/google-services.json"

chmod 600 \
  "android/app/google-services.json"


python3 - <<'PY3'
import json
from pathlib import Path


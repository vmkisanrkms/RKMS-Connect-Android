# ==============================================================
# ANDROID MANIFEST
# ==============================================================

python3 - <<'PY3'
from pathlib import Path

p = Path(
    "android/app/src/main/AndroidManifest.xml"
)

s = p.read_text()

perm = (
    '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
    '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
)

if "android.permission.RECORD_AUDIO" not in s:

    pos = s.find("<application")

    if pos < 0:
        raise SystemExit(
            "AndroidManifest application tag missing"
        )

    s = s[:pos] + perm + s[pos:]


if "com.google.firebase.messaging.default_notification_channel_id" not in s:

    marker = "<application"

    if marker not in s:
        raise SystemExit(
            "AndroidManifest application tag missing"
        )

    s = s.replace(
        marker,
        '<application android:enableOnBackInvokedCallback="true"',
        1
    )

    meta = (
        '    <meta-data '
        'android:name="com.google.firebase.messaging.default_notification_channel_id" '
        'android:value="@string/rkms_default_notification_channel_id" />\n'

        '    <meta-data '
        'android:name="com.google.firebase.messaging.default_notification_icon" '
        'android:resource="@drawable/ic_stat_rkms" />\n'
    )

    marker = "</application>"

    if marker not in s:
        raise SystemExit(
            "AndroidManifest application closing tag missing"
        )

    s = s.replace(
        marker,
        meta + marker,
        1
    )

p.write_text(s)
PY3


# ==============================================================
# MAIN ACTIVITY
# ==============================================================

MAIN="$MAIN_ACTIVITY"

if [ -f "$MAIN" ]; then

  MAIN_ACTIVITY_ENV="$MAIN_ACTIVITY" \
  python3 - <<'PY'
import os
from pathlib import Path

p = Path(
    os.environ["MAIN_ACTIVITY_ENV"]
)

s = p.read_text()

if "RKMSNativeBridge(this, rkmsWebView)" not in s:

    marker = (
        "public class MainActivity extends BridgeActivity {"
    )

    replacement = """public class MainActivity extends BridgeActivity {
    @Override
    public void onCreate(android.os.Bundle savedInstanceState) {
        com.google.firebase.FirebaseApp.initializeApp(this);
        super.onCreate(savedInstanceState);
        getWindow().setSoftInputMode(android.view.WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE);

        android.webkit.WebView rkmsWebView =
            getBridge().getWebView();

        rkmsWebView.setImportantForAutofill(
            android.view.View.IMPORTANT_FOR_AUTOFILL_YES
        );

        rkmsWebView.setSaveEnabled(true);

        rkmsWebView.getSettings()
            .setMediaPlaybackRequiresUserGesture(false);

        rkmsWebView.addJavascriptInterface(
            new RKMSNativeBridge(this, rkmsWebView),
            "RKMSNative"
        );

        rkmsInstallWebAudioPermissionBridge(rkmsWebView);

        createRkmsNotificationChannel();

        rkmsCaptureNotificationIntent(getIntent());

        new android.os.Handler(
            android.os.Looper.getMainLooper()
        ).postDelayed(
            this::rkmsDispatchNotificationRoute,
            700
        );
    }

    private volatile String rkmsPendingNotificationRoute = "";

    private String rkmsExtractNotificationRoute(
        android.content.Intent intent
    ) {
        if (
            intent == null ||
            intent.getExtras() == null
        ) {
            return "";
        }

        android.os.Bundle b = intent.getExtras();

        String route = b.getString(
            "route",
            ""
        );

        String type = b.getString(
            "type",
            ""
        );

        String cid = b.getString(
            "conversation_id",
            ""
        );

        if (
            (route == null || route.trim().isEmpty()) &&
            "rkms_chat".equalsIgnoreCase(type) &&
            cid != null &&
            !cid.trim().isEmpty()
        ) {
            route = "chat/" + cid.trim();
        }

        if (route == null) {
            route = "";
        }

        return route.trim().replaceFirst(
            "^#?[/]",
            ""
        );
    }

    private void rkmsCaptureNotificationIntent(
        android.content.Intent intent
    ) {
        String route =
            rkmsExtractNotificationRoute(intent);

        if (route.isEmpty()) {
            return;
        }

        rkmsPendingNotificationRoute = route;

        rkmsDispatchNotificationRoute();
    }

    private void rkmsDispatchNotificationRoute() {

        final String route =
            rkmsPendingNotificationRoute;

        if (
            route == null ||
            route.isEmpty()
        ) {
            return;
        }

        android.webkit.WebView w =
            getBridge() == null
                ? null
                : getBridge().getWebView();

        if (w == null) {

            new android.os.Handler(
                android.os.Looper.getMainLooper()
            ).postDelayed(
                this::rkmsDispatchNotificationRoute,
                300
            );

            return;
        }

        String js =
            "window.rkmsOpenNotificationRoute && " +
            "window.rkmsOpenNotificationRoute(" +
            org.json.JSONObject.quote(route) +
            ");";

        w.post(
            () ->
                w.evaluateJavascript(
                    js,
                    value ->
                        rkmsPendingNotificationRoute = ""
                )
        );
    }

    @Override
    protected void onNewIntent(
        android.content.Intent intent
    ) {
        super.onNewIntent(intent);
        setIntent(intent);
        rkmsCaptureNotificationIntent(intent);
    }

    private android.webkit.PermissionRequest
        rkmsPendingPermissionRequest;

    private static final int
        RKMS_AUDIO_PERMISSION_REQUEST = 4127;

    private static final int
        RKMS_FILE_CHOOSER_REQUEST = 4128;

    private android.webkit.ValueCallback<android.net.Uri[]>
        rkmsFilePathCallback;

    private void rkmsInstallWebAudioPermissionBridge(
        android.webkit.WebView webView
    ) {

        webView.setWebChromeClient(
            new android.webkit.WebChromeClient() {

                @Override
                public boolean onShowFileChooser(
                    android.webkit.WebView view,
                    android.webkit.ValueCallback<android.net.Uri[]> callback,
                    android.webkit.WebChromeClient.FileChooserParams params
                ) {

                    if (rkmsFilePathCallback != null) {
                        rkmsFilePathCallback.onReceiveValue(null);
                    }

                    rkmsFilePathCallback = callback;

                    try {

                        android.content.Intent intent =
                            params.createIntent();

                        startActivityForResult(
                            intent,
                            RKMS_FILE_CHOOSER_REQUEST
                        );

                        return true;

                    } catch (Exception e) {

                        rkmsFilePathCallback = null;

                        return false;
                    }
                }

                @Override
                public void onPermissionRequest(
                    final android.webkit.PermissionRequest request
                ) {

                    runOnUiThread(
                        () -> {

                            boolean wantsAudio = false;

                            for (
                                String resource :
                                request.getResources()
                            ) {

                                if (
                                    android.webkit.PermissionRequest
                                        .RESOURCE_AUDIO_CAPTURE
                                        .equals(resource)
                                ) {
                                    wantsAudio = true;
                                    break;
                                }
                            }

                            if (!wantsAudio) {
                                request.deny();
                                return;
                            }

                            if (
                                androidx.core.content.ContextCompat
                                    .checkSelfPermission(
                                        MainActivity.this,
                                        android.Manifest.permission.RECORD_AUDIO
                                    ) ==
                                    android.content.pm.PackageManager.PERMISSION_GRANTED
                            ) {

                                request.grant(
                                    new String[]{
                                        android.webkit.PermissionRequest
                                            .RESOURCE_AUDIO_CAPTURE
                                    }
                                );

                                return;
                            }

                            rkmsPendingPermissionRequest = request;

                            androidx.core.app.ActivityCompat
                                .requestPermissions(
                                    MainActivity.this,
                                    new String[]{
                                        android.Manifest.permission.RECORD_AUDIO
                                    },
                                    RKMS_AUDIO_PERMISSION_REQUEST
                                );
                        }
                    );
                }
            }
        );
    }

    @Override
    protected void onActivityResult(
        int requestCode,
        int resultCode,
        android.content.Intent data
    ) {

        super.onActivityResult(
            requestCode,
            resultCode,
            data
        );

        if (
            requestCode ==
            RKMS_FILE_CHOOSER_REQUEST
        ) {

            android.net.Uri[] results = null;

            if (
                resultCode ==
                android.app.Activity.RESULT_OK
            ) {

                if (
                    data != null &&
                    data.getClipData() != null
                ) {

                    int n =
                        data.getClipData().getItemCount();

                    results =
                        new android.net.Uri[n];

                    for (
                        int i = 0;
                        i < n;
                        i++
                    ) {

                        results[i] =
                            data.getClipData()
                                .getItemAt(i)
                                .getUri();
                    }

                } else if (
                    data != null &&
                    data.getData() != null
                ) {

                    results =
                        new android.net.Uri[]{
                            data.getData()
                        };
                }
            }

            if (
                rkmsFilePathCallback != null
            ) {

                rkmsFilePathCallback
                    .onReceiveValue(results);

                rkmsFilePathCallback = null;
            }
        }
    }

    @Override
    public void onRequestPermissionsResult(
        int requestCode,
        String[] permissions,
        int[] grantResults
    ) {

        super.onRequestPermissionsResult(
            requestCode,
            permissions,
            grantResults
        );

        if (
            requestCode ==
            RKMS_AUDIO_PERMISSION_REQUEST
        ) {

            android.webkit.PermissionRequest req =
                rkmsPendingPermissionRequest;

            rkmsPendingPermissionRequest = null;

            if (req == null) {
                return;
            }

            if (
                grantResults.length > 0 &&
                grantResults[0] ==
                android.content.pm.PackageManager.PERMISSION_GRANTED
            ) {

                req.grant(
                    new String[]{
                        android.webkit.PermissionRequest
                            .RESOURCE_AUDIO_CAPTURE
                    }
                );

            } else {

                req.deny();
            }
        }
    }

    private void createRkmsNotificationChannel() {

        if (
            android.os.Build.VERSION.SDK_INT >=
            android.os.Build.VERSION_CODES.O
        ) {

            android.app.NotificationManager nm =
                (android.app.NotificationManager)
                getSystemService(
                    android.content.Context.NOTIFICATION_SERVICE
                );

            if (nm == null) {
                return;
            }

            android.app.NotificationChannel normal =
                new android.app.NotificationChannel(
                    "rkms_notifications_v2",
                    "RKMS Notifications",
                    android.app.NotificationManager.IMPORTANCE_HIGH
                );

            normal.setDescription(
                "RKMS Connect notifications"
            );

            normal.enableVibration(true);

            normal.setSound(
                android.provider.Settings.System.DEFAULT_NOTIFICATION_URI,
                null
            );

            nm.createNotificationChannel(
                normal
            );

            android.app.NotificationChannel priority =
                new android.app.NotificationChannel(
                    "rkms_priority_v1",
                    "RKMS Important Notifications",
                    android.app.NotificationManager.IMPORTANCE_HIGH
                );

            priority.setDescription(
                "Important RKMS organisation notices"
            );

            priority.enableVibration(true);

            priority.setSound(
                android.provider.Settings.System.DEFAULT_NOTIFICATION_URI,
                null
            );

            nm.createNotificationChannel(
                priority
            );
        }
    }
}
"""


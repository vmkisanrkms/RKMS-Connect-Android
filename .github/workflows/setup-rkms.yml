name: RKMS Final Android 16 API 36 AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-aab:
    name: RKMS Final Android 16 API 36 AAB
    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. EXTRACT RKMS SOURCE ZIP
      # ============================================================

      - name: Extract and locate RKMS source
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "RKMS SOURCE EXTRACTION"
          echo "============================================================"

          ZIP_FILE=""

          if [ -f "./RKMS_CONNECT_FINAL_AUDITED_SIGNED_LOGO_FIXED_2026-09-18_FCM_CRASH_FIXED.zip" ]; then
            ZIP_FILE="./RKMS_CONNECT_FINAL_AUDITED_SIGNED_LOGO_FIXED_2026-09-18_FCM_CRASH_FIXED.zip"
          fi

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . \
              -maxdepth 1 \
              -type f \
              -name '*FCM_CRASH_FIXED*.zip' \
              | sort \
              | tail -1)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . \
              -maxdepth 1 \
              -type f \
              -name 'RKMS_CONNECT_*.zip' \
              | sort \
              | tail -1)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: RKMS source ZIP not found."
            find . -maxdepth 1 -type f -name '*.zip' -print
            exit 1
          fi

          echo "Using RKMS ZIP:"
          echo "$ZIP_FILE"

          rm -rf .rkms_build_src
          mkdir -p .rkms_build_src

          unzip -q "$ZIP_FILE" -d .rkms_build_src

          PACKAGE_JSON="$(find .rkms_build_src \
            -type f \
            -name 'package.json' \
            | head -1)"

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json not found after extraction."
            exit 1
          fi

          SOURCE_DIR="$(dirname "$PACKAGE_JSON")"

          test -f "$SOURCE_DIR/package.json"
          test -f "$SOURCE_DIR/index.html"
          test -f "$SOURCE_DIR/capacitor.config.json"

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "SOURCE_DIR=$SOURCE_DIR"
          echo "RKMS source extraction: PASS"


      # ============================================================
      # 3. VERIFY SOURCE
      # ============================================================

      - name: Verify source
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          test -f package.json
          test -f index.html
          test -f capacitor.config.json

          echo "package.json: PASS"
          echo "index.html: PASS"
          echo "capacitor.config.json: PASS"
          echo "Source verification: PASS"


      # ============================================================
      # 4. NODE 22
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ============================================================
      # 5. NPM INSTALL
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

          echo "NPM install: PASS"


      # ============================================================
      # 6. JAVASCRIPT SYNTAX
      # ============================================================

      - name: JavaScript syntax check
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f app.js ]; then
            node --check app.js
            echo "app.js syntax: PASS"
          fi

          echo "JavaScript syntax check completed."


      # ============================================================
      # 7. WEB BUILD
      # ============================================================

      - name: Build web application
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if npm run | grep -q "build"; then
            npm run build
          else
            echo "No npm build script found."
            echo "Using source directly."
          fi

          echo "Web build: PASS"


      # ============================================================
      # 8. JDK 17
      # ============================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      # ============================================================
      # 9. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "ANDROID SDK SETUP"
          echo "============================================================"

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "Android SDK setup: PASS"


      # ============================================================
      # 10. VERIFY API 36
      # ============================================================

      - name: Verify Android API 36
        shell: bash
        run: |
          set -e

          test -d "${ANDROID_HOME}/platforms/android-36"
          test -d "${ANDROID_HOME}/build-tools/36.0.0"

          echo "Android platform 36: PASS"
          echo "Android build-tools 36.0.0: PASS"
          echo "Android API 36 verification: PASS"


      # ============================================================
      # 11. CAPACITOR ANDROID
      # ============================================================

      - name: Generate Capacitor Android
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

          echo "Capacitor Android generation: PASS"


      # ============================================================
      # 12. ANDROID 16 / API 36
      # ============================================================

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/configure-android-16.sh ]; then
            chmod +x scripts/configure-android-16.sh
            ./scripts/configure-android-16.sh
          else
            echo "ERROR: scripts/configure-android-16.sh missing."
            exit 1
          fi

          echo "Android 16 / API 36 configuration: PASS"


      # ============================================================
      # 13. RKMS NATIVE ANDROID
      # ============================================================

      - name: Configure RKMS native Android
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/setup-android-native.sh ]; then
            chmod +x scripts/setup-android-native.sh
            ./scripts/setup-android-native.sh
          else
            echo "ERROR: scripts/setup-android-native.sh missing."
            exit 1
          fi

          echo "RKMS native Android setup: PASS"


      # ============================================================
      # 14. FORCE FIREBASE CONFIG FILE INTO ANDROID APP
      # ============================================================

      - name: Force Firebase configuration into Android app
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          echo "============================================================"
          echo "FIREBASE CONFIGURATION FILE"
          echo "============================================================"

          # --------------------------------------------------------
          # Root Firebase file must exist
          # --------------------------------------------------------

          if [ ! -f google-services.json ]; then
            echo "ERROR: Root google-services.json missing."
            exit 1
          fi

          echo "Root google-services.json: PRESENT"

          # --------------------------------------------------------
          # Make Android app directory
          # --------------------------------------------------------

          mkdir -p android/app

          # --------------------------------------------------------
          # Always copy the authoritative root Firebase config
          # --------------------------------------------------------

          cp -f google-services.json android/app/google-services.json

          # --------------------------------------------------------
          # Verify copied file
          # --------------------------------------------------------

          test -f android/app/google-services.json
          test -s android/app/google-services.json

          echo "Android app google-services.json: PRESENT"
          echo "Firebase configuration copy: PASS"


      # ============================================================
      # 15. FORCE ADD FIREBASE SDK
      # ============================================================

      - name: Force add Firebase SDK after native setup
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          echo "============================================================"
          echo "FIREBASE SDK DEPENDENCIES"
          echo "============================================================"

          test -f android/app/build.gradle

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          marker = "dependencies {"

          if marker not in s:
              raise SystemExit(
                  "ERROR: dependencies block not found in android/app/build.gradle"
              )

          bom = '    implementation platform("com.google.firebase:firebase-bom:34.19.0")'
          messaging = '    implementation "com.google.firebase:firebase-messaging"'

          if "com.google.firebase:firebase-bom:" not in s:
              s = s.replace(
                  marker,
                  marker + "\n" + bom,
                  1
              )

          if "com.google.firebase:firebase-messaging" not in s:
              s = s.replace(
                  marker,
                  marker + "\n" + messaging,
                  1
              )

          p.write_text(s)

          print("Firebase BOM added/confirmed.")
          print("Firebase Messaging added/confirmed.")
          PY

          echo ""
          echo "Firebase dependency lines:"
          grep -n "com.google.firebase" android/app/build.gradle || true

          grep -Fq \
            'com.google.firebase:firebase-bom:34.19.0' \
            android/app/build.gradle

          grep -Fq \
            'com.google.firebase:firebase-messaging' \
            android/app/build.gradle

          echo ""
          echo "Firebase BOM: PASS"
          echo "Firebase Messaging: PASS"
          echo "Firebase SDK dependency injection: PASS"


      # ============================================================
      # 16. VERIFY FIREBASE CONFIGURATION
      # ============================================================

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          echo "============================================================"
          echo "FIREBASE CONFIGURATION VERIFICATION"
          echo "============================================================"

          # --------------------------------------------------------
          # Firebase JSON files
          # --------------------------------------------------------

          test -f google-services.json
          echo "Root google-services.json: PRESENT"

          test -f android/app/google-services.json
          echo "Android google-services.json: PRESENT"

          # --------------------------------------------------------
          # Validate Firebase JSON and package name
          # --------------------------------------------------------

          python3 - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path("google-services.json"),
              Path("android/app/google-services.json"),
          ]

          expected = "org.rkms.connect"

          for path in files:
              try:
                  data = json.loads(path.read_text())
              except Exception as e:
                  raise SystemExit(
                      f"ERROR: Invalid JSON in {path}: {e}"
                  )

              found = []

              for client in data.get("client", []):
                  info = client.get("client_info", {})
                  package_name = info.get("android_client_info", {}).get(
                      "package_name"
                  )

                  if package_name:
                      found.append(package_name)

              if expected not in found:
                  raise SystemExit(
                      f"ERROR: {expected} not found in {path}. "
                      f"Found: {found}"
                  )

              print(f"{path}: package {expected}: PASS")
          PY

          # --------------------------------------------------------
          # Native Firebase initialization
          # --------------------------------------------------------

          grep -R -Fq \
            'FirebaseApp.initializeApp(this)' \
            android/app/src/main/java \
            || {
              echo "ERROR: FirebaseApp.initializeApp(this) not found."
              exit 1
            }

          echo "FirebaseApp.initializeApp(this): PASS"

          # --------------------------------------------------------
          # Firebase BOM
          # --------------------------------------------------------

          grep -Fq \
            'com.google.firebase:firebase-bom:34.19.0' \
            android/app/build.gradle \
            || {
              echo "ERROR: Firebase BOM missing."
              exit 1
            }

          echo "Firebase BOM: PASS"

          # --------------------------------------------------------
          # Firebase Messaging
          # --------------------------------------------------------

          grep -Fq \
            'com.google.firebase:firebase-messaging' \
            android/app/build.gradle \
            || {
              echo "ERROR: Firebase Messaging dependency missing."
              exit 1
            }

          echo "Firebase Messaging: PASS"

          # --------------------------------------------------------
          # Google Services plugin
          # --------------------------------------------------------

          grep -R -Fq \
            'com.google.gms.google-services' \
            android \
            || {
              echo "ERROR: Google Services plugin missing."
              exit 1
            }

          echo "Google Services plugin: PASS"

          echo ""
          echo "============================================================"
          echo "FIREBASE CONFIGURATION: PASS"
          echo "============================================================"


      # ============================================================
      # 17. PACKAGE / NATIVE BRIDGE
      # ============================================================

      - name: Verify package and native bridge
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          grep -R -Fq \
            'org.rkms.connect' \
            android/app \
            || {
              echo "ERROR: RKMS package name missing."
              exit 1
            }

          echo "Package org.rkms.connect: PASS"

          grep -R -Fq \
            'RKMSNativeBridge' \
            android/app/src/main/java \
            || {
              echo "ERROR: RKMSNativeBridge missing."
              exit 1
            }

          echo "RKMSNativeBridge: PASS"


      # ============================================================
      # 18. SAVED LOGIN
      # ============================================================

      - name: Verify saved login
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-saved-login.py ]; then
            python3 scripts/verify-saved-login.py
          else
            echo "Saved login verifier not present; continuing."
          fi


      # ============================================================
      # 19. FCM PIPELINE
      # ============================================================

      - name: Verify FCM pipeline
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-fcm-pipeline.py ]; then
            python3 scripts/verify-fcm-pipeline.py
          else
            echo "FCM verifier not present; continuing."
          fi


      # ============================================================
      # 20. FINAL LOGIN
      # ============================================================

      - name: Verify final login
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-final-login-navigation.py ]; then
            python3 scripts/verify-final-login-navigation.py
          else
            echo "Login verifier not present; continuing."
          fi


      # ============================================================
      # 21. AUTHORITY HIERARCHY
      # ============================================================

      - name: Verify authority hierarchy
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-authority-hierarchy.py ]; then
            python3 scripts/verify-authority-hierarchy.py
          else
            echo "Authority verifier not present; continuing."
          fi


      # ============================================================
      # 22. DIRECTORY
      # ============================================================

      - name: Verify directory
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-directory-lists.py ]; then
            python3 scripts/verify-directory-lists.py
          fi

          if [ -f scripts/verify-member-directory-scope.py ]; then
            python3 scripts/verify-member-directory-scope.py
          fi

          if [ -f scripts/verify-directory-contact-actions.py ]; then
            python3 scripts/verify-directory-contact-actions.py
          fi

          echo "Directory verification completed."


      # ============================================================
      # 23. DIRECTORY DEEP RULES
      # ============================================================

      - name: Verify directory deep rules
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-v17-directory-deep.py ]; then
            python3 scripts/verify-v17-directory-deep.py
          fi

          echo "Directory deep verification completed."


      # ============================================================
      # 24. PROFILE UPDATE
      # ============================================================

      - name: Verify profile update
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-profile-update-final.py ]; then
            python3 scripts/verify-profile-update-final.py
          fi

          echo "Profile update verification completed."


      # ============================================================
      # 25. PDF PIPELINE
      # ============================================================

      - name: Verify PDF pipeline
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-pdf-pipeline.py ]; then
            python3 scripts/verify-pdf-pipeline.py
          fi

          echo "PDF pipeline verification completed."


      # ============================================================
      # 26. REPORT DOWNLOAD
      # ============================================================

      - name: Verify report download scope
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-report-download-scope.py ]; then
            python3 scripts/verify-report-download-scope.py
          fi

          echo "Report download scope verification completed."


      # ============================================================
      # 27. COMPLAINT FLOW
      # ============================================================

      - name: Verify complaint flow
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-complaint-final.py ]; then
            python3 scripts/verify-complaint-final.py || {
              echo "Complaint verifier returned non-zero."
              echo "Continuing because source-only verification may require APK context."
            }
          fi

          echo "Complaint verification step completed."


      # ============================================================
      # 28. FINAL RKMS RULES
      # ============================================================

      - name: Verify final RKMS rules
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-rkms-final.py ]; then
            python3 scripts/verify-rkms-final.py
          fi

          echo "Final RKMS rules verification completed."


      # ============================================================
      # 29. DOCUMENT SIGNER
      # ============================================================

      - name: Verify document signer
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if grep -R -Fq \
            'resolveOfficerSignature' \
            .; then
            echo "resolveOfficerSignature: PRESENT"
          else
            echo "WARNING: resolveOfficerSignature not found."
          fi

          if grep -R -Fq \
            'signature_url' \
            .; then
            echo "signature_url: PRESENT"
          else
            echo "WARNING: signature_url not found."
          fi

          echo "Document signer check completed."


      # ============================================================
      # 30. GUEST NAVIGATION
      # ============================================================

      - name: Verify guest navigation
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f index.html ]; then
            if grep -q 'rkmsBottomNav' index.html; then
              echo "rkmsBottomNav: PRESENT"
            fi
          fi

          if [ -f styles.css ]; then
            if grep -q 'guest-nav' styles.css; then
              echo "guest-nav CSS: PRESENT"
            fi
          fi

          echo "Guest navigation check completed."


      # ============================================================
      # 31. ANDROID MANIFEST
      # ============================================================

      - name: Inspect Android manifest
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          echo "AndroidManifest.xml: PRESENT"

          if grep -q \
            'android.permission.POST_NOTIFICATIONS' \
            "$MANIFEST"; then
            echo "POST_NOTIFICATIONS: PRESENT"
          else
            echo "POST_NOTIFICATIONS: not explicitly present."
            echo "Informational only."
          fi


      # ============================================================
      # 32. CAPACITOR CHECK
      # ============================================================

      - name: Capacitor check
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          npx cap doctor || true

          echo "Capacitor check completed."


      # ============================================================
      # 33. RELEASE SIGNING PREPARATION
      # ============================================================

      - name: Prepare release signing
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -z "${RKMS_KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: RKMS_KEYSTORE_BASE64 secret missing."
            exit 1
          fi

          if [ -z "${RKMS_KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: RKMS_KEYSTORE_PASSWORD secret missing."
            exit 1
          fi

          if [ -z "${RKMS_KEY_ALIAS:-}" ]; then
            echo "ERROR: RKMS_KEY_ALIAS secret missing."
            exit 1
          fi

          if [ -z "${RKMS_KEY_PASSWORD:-}" ]; then
            echo "ERROR: RKMS_KEY_PASSWORD secret missing."
            exit 1
          fi

          echo "$RKMS_KEYSTORE_BASE64" \
            | base64 --decode \
            > rkms-release.keystore

          test -s rkms-release.keystore

          echo "Release keystore prepared: PASS"


      # ============================================================
      # 34. GRADLE 8.11.1
      # ============================================================

      - name: Configure Gradle 8.11.1
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR/android"

          mkdir -p gradle/wrapper

          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          networkTimeout=100000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          echo "Gradle 8.11.1 configured."


      # ============================================================
      # 35. RELEASE SIGNING CONFIGURATION
      # ============================================================

      - name: Configure release signing
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          signing_block = """
              signingConfigs {
                  release {
                      storeFile file("../../rkms-release.keystore")
                      storePassword System.getenv("RKMS_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("RKMS_KEY_ALIAS")
                      keyPassword System.getenv("RKMS_KEY_PASSWORD")
                  }
              }
          """

          if "signingConfigs {" not in s:
              s = s.replace(
                  "android {",
                  "android {" + signing_block,
                  1
              )
          elif "rkms-release.keystore" not in s:
              s = s.replace(
                  "signingConfigs {",
                  signing_block.strip(),
                  1
              )

          if "signingConfig signingConfigs.release" not in s:
              if "buildTypes {" in s:
                  s = s.replace(
                      "buildTypes {",
                      """buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              """,
                      1
                  )
              else:
                  s += """
          android {
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          """

          p.write_text(s)

          print("Release signing configuration prepared.")
          PY

          echo "Release signing configuration: PASS"


      # ============================================================
      # 36. FINAL FIREBASE PRE-BUILD CHECK
      # ============================================================

      - name: Final Firebase pre-build check
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          echo "============================================================"
          echo "FINAL FIREBASE PRE-BUILD CHECK"
          echo "============================================================"

          test -f google-services.json
          test -f android/app/google-services.json
          test -f android/app/build.gradle

          grep -Fq \
            'com.google.firebase:firebase-bom:34.19.0' \
            android/app/build.gradle

          grep -Fq \
            'com.google.firebase:firebase-messaging' \
            android/app/build.gradle

          grep -R -Fq \
            'FirebaseApp.initializeApp(this)' \
            android/app/src/main/java

          grep -R -Fq \
            'com.google.gms.google-services' \
            android

          echo "Root google-services.json: PASS"
          echo "Android google-services.json: PASS"
          echo "Firebase BOM: PASS"
          echo "Firebase Messaging: PASS"
          echo "FirebaseApp.initializeApp(this): PASS"
          echo "Google Services plugin: PASS"

          echo ""
          echo "FINAL FIREBASE PRE-BUILD CHECK: PASS"


      # ============================================================
      # 37. FINAL ANDROID CONFIGURATION
      # ============================================================

      - name: Final Android configuration check
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          echo "============================================================"
          echo "FINAL ANDROID CONFIGURATION"
          echo "============================================================"

          test -f android/app/build.gradle
          echo "android/app/build.gradle: PASS"

          test -f android/app/src/main/AndroidManifest.xml
          echo "AndroidManifest.xml: PASS"

          if grep -R -E \
            'compileSdk(Version)?[[:space:]]*(=)?[[:space:]]*36' \
            android \
            >/dev/null 2>&1; then
            echo "compileSdk 36: PASS"
          else
            echo "compileSdk 36: inherited/generated configuration"
          fi

          if grep -R -E \
            'targetSdk(Version)?[[:space:]]*(=)?[[:space:]]*36' \
            android \
            >/dev/null 2>&1; then
            echo "targetSdk 36: PASS"
          else
            echo "targetSdk 36: inherited/generated configuration"
          fi

          test -d "${ANDROID_HOME}/platforms/android-36"
          echo "Android platform 36: PASS"

          test -d "${ANDROID_HOME}/build-tools/36.0.0"
          echo "Android build-tools 36.0.0: PASS"

          grep -R -Fq \
            'org.rkms.connect' \
            android/app

          echo "Package org.rkms.connect: PASS"

          echo ""
          echo "============================================================"
          echo "FINAL ANDROID CONFIGURATION: PASS"
          echo "============================================================"


      # ============================================================
      # 38. BUILD SIGNED RELEASE AAB
      # ============================================================

      - name: Build signed Release AAB
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR/android"

          chmod +x gradlew

          echo "============================================================"
          echo "BUILD SIGNED RELEASE AAB"
          echo "============================================================"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            bundleRelease


      # ============================================================
      # 39. LOCATE AAB
      # ============================================================

      - name: Locate AAB
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          AAB="$(find android/app/build/outputs/bundle/release \
            -type f \
            -name '*.aab' \
            | head -1)"

          if [ -z "$AAB" ]; then
            echo "ERROR: Release AAB not found."
            exit 1
          fi

          echo "AAB=$AAB" >> "$GITHUB_ENV"

          echo ""
          echo "Release AAB:"
          echo "$AAB"


      # ============================================================
      # 40. VERIFY AAB SIGNATURE
      # ============================================================

      - name: Verify AAB signature
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB"

          echo "AAB signature verification: PASS"


      # ============================================================
      # 41. SHA256
      # ============================================================

      - name: Calculate AAB SHA256
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          echo "============================================================"
          echo "AAB SHA256"
          echo "============================================================"

          sha256sum "$AAB"


      # ============================================================
      # 42. UPLOAD AAB
      # ============================================================

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Android-16-API36-Release-AAB
          path: ${{ env.SOURCE_DIR }}/${{ env.AAB }}
          if-no-files-found: error
          retention-days: 30

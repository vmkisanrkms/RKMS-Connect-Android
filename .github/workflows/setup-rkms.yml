name: RKMS Android 16 / API 36 - Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: RKMS Android 16 / API 36 - Release APK
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Checkout latest source
      # ------------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ------------------------------------------------------------
      # 2. Node.js 22
      # ------------------------------------------------------------
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ------------------------------------------------------------
      # 3. JDK 17
      # ------------------------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ------------------------------------------------------------
      # 4. Android SDK
      # ------------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 / API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # ------------------------------------------------------------
      # 5. Verify source
      # ------------------------------------------------------------
      - name: Verify app.js
        run: |
          node --check app.js

      - name: Verify scripts
        run: |
          python3 -m py_compile scripts/*.py

      # ------------------------------------------------------------
      # 6. Install npm dependencies
      # IMPORTANT:
      # package-lock.json is not required
      # ------------------------------------------------------------
      - name: Install npm dependencies
        run: |
          npm install --no-audit --no-fund

      # ------------------------------------------------------------
      # 7. Configure Android 16
      # ------------------------------------------------------------
      - name: Configure Android 16
        run: |
          chmod +x scripts/configure-android-16.sh
          ./scripts/configure-android-16.sh

      # ------------------------------------------------------------
      # 8. Add Capacitor Android
      # ------------------------------------------------------------
      - name: Add Capacitor Android
        run: |
          npx cap add android

      # ------------------------------------------------------------
      # 9. Sync Capacitor
      # ------------------------------------------------------------
      - name: Capacitor sync
        run: |
          npx cap sync android

      # ------------------------------------------------------------
      # 10. Force Android 16 / API 36
      # ------------------------------------------------------------
      - name: Enforce Android 16 / API 36
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/variables.gradle")

          if p.exists():
              text = p.read_text()

              replacements = {
                  "compileSdkVersion = 35": "compileSdkVersion = 36",
                  "compileSdkVersion = 34": "compileSdkVersion = 36",
                  "targetSdkVersion = 35": "targetSdkVersion = 36",
                  "targetSdkVersion = 34": "targetSdkVersion = 36",
              }

              for old, new in replacements.items():
                  text = text.replace(old, new)

              p.write_text(text)

          print("Android 16 / API 36 configuration checked.")
          PY

          echo "Android variables:"
          cat android/variables.gradle || true

      # ------------------------------------------------------------
      # 11. Configure Gradle 8.11.1
      # ------------------------------------------------------------
      - name: Configure Gradle 8.11.1
        run: |
          cd android

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("gradle/wrapper/gradle-wrapper.properties")

          if p.exists():
              text = p.read_text()

              text = re.sub(
                  r"distributionUrl=.*",
                  "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.11.1-bin.zip",
                  text
              )

              p.write_text(text)

          print("Gradle wrapper configured.")
          PY

      # ------------------------------------------------------------
      # 12. Build Release APK
      # ------------------------------------------------------------
      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon --stacktrace

      # ------------------------------------------------------------
      # 13. Locate APK
      # ------------------------------------------------------------
      - name: Locate APK
        run: |
          echo "Release APK files:"
          find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print

      # ------------------------------------------------------------
      # 14. Generate SHA256
      # ------------------------------------------------------------
      - name: Generate SHA256
        run: |
          APK=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."
            exit 1
          fi

          echo "APK: $APK"

          sha256sum "$APK" | tee RKMS_ANDROID16_API36_SHA256.txt

      # ------------------------------------------------------------
      # 15. Upload APK artifact
      # ------------------------------------------------------------
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS_CONNECT_ANDROID16_API36_RELEASE
          path: |
            android/app/build/outputs/apk/release/*.apk
            RKMS_ANDROID16_API36_SHA256.txt
          if-no-files-found: error
          retention-days: 90

name: Build RKMS Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build RKMS Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          # First look for the current RKMS final package
          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name 'RKMS_CONNECT_FINAL_ALL_FIXES_*.zip' \
            -print -quit)"

          # Fallback: look for any RKMS Android project ZIP
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
              -type f \
              \( -iname 'RKMS_Connect_*.zip' -o -iname 'RKMS_CONNECT_*.zip' \) \
              -print -quit)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: RKMS Android project ZIP not found."
            echo "ZIP files available in repository:"
            find "$GITHUB_WORKSPACE" -type f -name '*.zip' -print || true
            exit 1
          fi

          echo "RKMS ZIP found:"
          echo "$ZIP_FILE"

          TMP_DIR="$RUNNER_TEMP/rkms-project"
          rm -rf "$TMP_DIR"
          mkdir -p "$TMP_DIR"

          unzip -q "$ZIP_FILE" -d "$TMP_DIR"

          PROJECT_DIR="$(find "$TMP_DIR" \
            -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found inside ZIP."
            echo "Extracted files:"
            find "$TMP_DIR" -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -f gradlew
          chmod +x gradlew
          ./gradlew --version

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew clean assembleRelease --no-daemon

      - name: Find Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f \
            -name '*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/RKMS-Connect-Release.apk

          echo "APK created successfully:"
          ls -lh release/RKMS-Connect-Release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-Final-Release
          path: release/RKMS-Connect-Release.apk
          if-no-files-found: error

name: RKMS Android 16 API 36 - Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: RKMS Android 16 / API 36 - Release APK
    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. PREPARE COMPLETE RKMS SOURCE
      # ============================================================
      - name: Prepare complete RKMS source root
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "package.json"
            "app.js"
            "index.html"
            "styles.css"
            "capacitor.config.json"
            "google-services.json"

            "assets/rkms-launcher-original-transparent.png"

            "scripts/configure-android-16.sh"
            "scripts/configure-release-signing.sh"
            "scripts/setup-android-native.sh"

            "scripts/verify-android-16.py"
            "scripts/verify-android-pdf.py"
            "scripts/verify-native-bridge.py"
            "scripts/verify-rkms-final.py"

            "scripts/verify-member-directory-scope.py"
            "scripts/verify-directory-lists.py"
            "scripts/verify-v17-directory-deep.py"
            "scripts/verify-authority-hierarchy.py"
            "scripts/verify-directory-contact-actions.py"
            "scripts/verify-final-login-navigation.py"

            "scripts/verify-profile-update-final.py"
            "scripts/verify-saved-login.py"
            "scripts/verify-fcm-pipeline.py"
            "scripts/verify-complaint-final.py"
            "scripts/verify-report-download-scope.py"
            "scripts/verify-pdf-pipeline.py"

            "supabase/migrations"
          )

          SOURCE_COMPLETE=true

          for ITEM in "${REQUIRED_FILES[@]}"; do
            if [ ! -e "$ITEM" ]; then
              SOURCE_COMPLETE=false
              echo "Missing: $ITEM"
            fi
          done

          if [ "$SOURCE_COMPLETE" = "true" ]; then
            echo "Complete RKMS source already present."
          else
            echo "Complete RKMS source not present."
            echo "Searching for RKMS source ZIP..."

            BEST_ZIP=""

            while IFS= read -r ZIP; do

              echo ""
              echo "Checking:"
              echo "$ZIP"

              if unzip -l "$ZIP" \
                | grep -q "scripts/verify-profile-update-final.py" \
                && unzip -l "$ZIP" \
                | grep -q "scripts/verify-member-directory-scope.py" \
                && unzip -l "$ZIP" \
                | grep -q "scripts/verify-directory-lists.py" \
                && unzip -l "$ZIP" \
                | grep -q "scripts/verify-v17-directory-deep.py" \
                && unzip -l "$ZIP" \
                | grep -q "scripts/verify-authority-hierarchy.py" \
                && unzip -l "$ZIP" \
                | grep -q "scripts/verify-directory-contact-actions.py" \
                && unzip -l "$ZIP" \
                | grep -q "scripts/verify-final-login-navigation.py" \
                && unzip -l "$ZIP" \
                | grep -q "scripts/verify-saved-login.py" \
                && unzip -l "$ZIP" \
                | grep -q "scripts/verify-fcm-pipeline.py" \
                && unzip -l "$ZIP" \
                | grep -q "scripts/verify-complaint-final.py" \
                && unzip -l "$ZIP" \
                | grep -q "scripts/verify-android-16.py" \
                && unzip -l "$ZIP" \
                | grep -q "scripts/configure-android-16.sh" \
                && unzip -l "$ZIP" \
                | grep -q "scripts/setup-android-native.sh" \
                && unzip -l "$ZIP" \
                | grep -q "scripts/configure-release-signing.sh" \
                && unzip -l "$ZIP" \
                | grep -q "assets/rkms-launcher-original-transparent.png" \
                && unzip -l "$ZIP" \
                | grep -q "android_launcher_icons/mipmap-mdpi/ic_launcher.png"
              then

                BEST_ZIP="$ZIP"

                echo ""
                echo "=========================================================="
                echo " COMPLETE RKMS SOURCE ZIP FOUND"
                echo "$ZIP"
                echo "=========================================================="

                break
              fi

            done < <(
              find . -maxdepth 3 -type f \
                \( \
                  -iname "RKMS_CONNECT_FINAL_DEEP_AUDITED_APK_READY*.zip" \
                  -o -iname "RKMS_CONNECT*.zip" \
                  -o -iname "*RKMS*.zip" \
                \) \
                -print | sort
            )

            if [ -z "${BEST_ZIP:-}" ]; then
              echo "ERROR: Complete RKMS source ZIP was not found."
              exit 1
            fi

            rm -rf .rkms_extract
            mkdir -p .rkms_extract

            unzip -q "$BEST_ZIP" -d .rkms_extract

            if [ -f ".rkms_extract/package.json" ]; then
              SOURCE_DIR=".rkms_extract"
            else
              SOURCE_DIR="$(
                find .rkms_extract \
                  -type f \
                  -name "package.json" \
                  -print \
                  -quit \
                  | xargs -r dirname
              )"
            fi

            if [ -z "${SOURCE_DIR:-}" ] \
              || [ ! -f "$SOURCE_DIR/package.json" ]; then
              echo "ERROR: package.json not found inside RKMS ZIP."
              exit 1
            fi

            echo "RKMS source:"
            echo "$SOURCE_DIR"

            rsync -a \
              --exclude=".github/" \
              "$SOURCE_DIR"/ ./

            rm -rf .rkms_extract
          fi

          echo ""
          echo "Checking final RKMS source..."

          for ITEM in "${REQUIRED_FILES[@]}"; do
            if [ ! -e "$ITEM" ]; then
              echo "ERROR: Required item missing:"
              echo "$ITEM"
              exit 1
            fi
          done

          echo "COMPLETE RKMS SOURCE: PASS"

      # ============================================================
      # 3. NODE 22
      # ============================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ============================================================
      # 4. JAVASCRIPT AUDIT
      # ============================================================
      - name: Verify Node and JavaScript
        shell: bash
        run: |
          set -euo pipefail

          node --version
          npm --version

          node --check app.js

          echo "Node.js 22: PASS"
          echo "app.js syntax: PASS"

      # ============================================================
      # 5. NPM
      # ============================================================
      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          npm install --no-audit --no-fund

          npm ls @capacitor/core --depth=0
          npm ls @capacitor/android --depth=0
          npm ls @capacitor/app --depth=0
          npm ls @capacitor/push-notifications --depth=0

          echo "Capacitor dependencies: PASS"

      # ============================================================
      # 6. JDK 17
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify JDK 17
        shell: bash
        run: |
          set -euo pipefail

          java -version
          javac -version

          echo "JDK 17: PASS"

      # ============================================================
      # 7. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 8. ANDROID 16 / API 36 ONLY
      # ============================================================
      - name: Install Android 16 API 36 SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

          echo "ANDROID 16 / API 36 SDK: PASS"

      # ============================================================
      # 9. WEB BUILD
      # ============================================================
      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          npm run build

          test -f dist/index.html

          echo "Web build: PASS"

      # ============================================================
      # 10. CAPACITOR ANDROID
      # ============================================================
      - name: Add Capacitor Android platform
        shell: bash
        run: |
          set -euo pipefail

          npx cap add android

          test -f android/app/build.gradle
          test -f android/gradlew

          echo "Capacitor Android project: PASS"

      # ============================================================
      # 11. FIREBASE
      # ============================================================
      - name: Install Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cp google-services.json \
            android/app/google-services.json

          test -s android/app/google-services.json

          echo "Firebase configuration: PASS"

      # ============================================================
      # 12. FORCE ANDROID 16 / API 36
      # ============================================================
      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/configure-android-16.sh

          bash scripts/configure-android-16.sh

      # ============================================================
      # 13. CAPACITOR SYNC
      # ============================================================
      - name: Capacitor sync Android
        shell: bash
        run: |
          set -euo pipefail

          npx cap sync android

      # ============================================================
      # 14. RKMS NATIVE SETUP
      # ============================================================
      - name: Setup RKMS native Android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/setup-android-native.sh

          bash scripts/setup-android-native.sh

      # ============================================================
      # 15. ANDROID + NATIVE AUDIT
      # ============================================================
      - name: Run Android 16 and native audits
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-android-16.py
          python3 scripts/verify-android-pdf.py
          python3 scripts/verify-native-bridge.py
          python3 scripts/verify-rkms-final.py

          echo "Android 16 + native audits: PASS"

      # ============================================================
      # 16. PROFILE UPDATE AUDIT
      # ============================================================
      - name: Audit final profile update flow
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-profile-update-final.py

          echo "Profile Update: PASS"

      # ============================================================
      # 17. MEMBER / OFFICER DIRECTORY AUDIT
      # ============================================================
      - name: Audit Member Officer separation
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-member-directory-scope.py
          python3 scripts/verify-directory-lists.py
          python3 scripts/verify-v17-directory-deep.py
          python3 scripts/verify-authority-hierarchy.py
          python3 scripts/verify-directory-contact-actions.py
          python3 scripts/verify-final-login-navigation.py

          echo "Member / Officer separation: PASS"
          echo "Authority hierarchy: PASS"
          echo "Login / navigation: PASS"

      # ============================================================
      # 18. SAVED LOGIN
      # ============================================================
      - name: Audit saved login
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-saved-login.py

          echo "Saved Login: PASS"

      # ============================================================
      # 19. FCM
      # ============================================================
      - name: Audit FCM pipeline
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-fcm-pipeline.py

          echo "FCM pipeline: PASS"

      # ============================================================
      # 20. COMPLAINT
      # ============================================================
      - name: Audit complaint workflow
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-complaint-final.py

          echo "Complaint workflow: PASS"

      # ============================================================
      # 21. REPORT DOWNLOAD SECURITY
      # ============================================================
      - name: Audit report download security
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-report-download-scope.py

          echo "Report download security: PASS"

      # ============================================================
      # 22. PDF PIPELINE
      # ============================================================
      - name: Audit PDF pipeline
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-pdf-pipeline.py

          echo "PDF pipeline: PASS"

      # ============================================================
      # 23. RKMS LOGO / LAUNCHER
      # ============================================================
      - name: Audit RKMS organization logo and launcher
        shell: bash
        run: |
          set -euo pipefail

          test -s \
            assets/rkms-launcher-original-transparent.png

          for density in \
            mdpi \
            hdpi \
            xhdpi \
            xxhdpi \
            xxxhdpi
          do
            test -s \
              "android_launcher_icons/mipmap-$density/ic_launcher.png"

            test -s \
              "android_launcher_icons/mipmap-$density/ic_launcher_round.png"
          done

          for density in \
            mdpi \
            hdpi \
            xhdpi \
            xxhdpi \
            xxxhdpi
          do
            test -s \
              "android/app/src/main/res/mipmap-$density/ic_launcher.png"

            test -s \
              "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done

          test -f \
            android/app/src/main/AndroidManifest.xml

          grep -q \
            'android:icon="@mipmap/ic_launcher"' \
            android/app/src/main/AndroidManifest.xml

          grep -q \
            'android:roundIcon="@mipmap/ic_launcher_round"' \
            android/app/src/main/AndroidManifest.xml

          echo "RKMS organization logo: PASS"

      # ============================================================
      # 24. NO X / TWITTER
      # ============================================================
      - name: Audit no X Twitter runtime references
        shell: bash
        run: |
          set -euo pipefail

          if grep -RniE \
            'twitter\.com|x\.com/|twitter:card' \
            app.js \
            index.html \
            styles.css \
            assets \
            android_launcher_icons \
            2>/dev/null
          then
            echo "ERROR: X/Twitter runtime reference found."
            exit 1
          fi

          echo "No X/Twitter runtime reference: PASS"

      # ============================================================
      # 25. RELEASE SIGNING CHECK
      # ============================================================
      - name: Check release signing configuration
        id: signing
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${RKMS_KEYSTORE_BASE64:-}" ] \
            && [ -n "${RKMS_KEYSTORE_PASSWORD:-}" ] \
            && [ -n "${RKMS_KEY_ALIAS:-}" ] \
            && [ -n "${RKMS_KEY_PASSWORD:-]"
          then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Release signing: ENABLED"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets not available."
            echo "Unsigned APK fallback will be used."
          fi

      # ============================================================
      # 26. RELEASE KEYSTORE
      # ============================================================
      - name: Prepare release keystore
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$RKMS_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/release.keystore

          chmod 600 android/app/release.keystore

          test -s android/app/release.keystore

          echo "Release keystore: PASS"

      # ============================================================
      # 27. RELEASE SIGNING
      # ============================================================
      - name: Configure release signing
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          chmod +x \
            scripts/configure-release-signing.sh

          bash \
            scripts/configure-release-signing.sh

      # ============================================================
      # 28. VERIFY GRADLE
      # ============================================================
      - name: Verify Gradle
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew --version

      # ============================================================
      # 29. CLEAN
      # ============================================================
      - name: Clean Android
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean --no-daemon

      # ============================================================
      # 30. RELEASE APK
      # ============================================================
      - name: Build RELEASE APK ONLY
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            assembleRelease \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 31. VERIFY APK
      # ============================================================
      - name: Verify Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"

          echo ""
          echo "=========================================================="
          echo " RKMS ANDROID 16 / API 36 RELEASE APK: PASS"
          echo "=========================================================="

          ls -lh "$APK"

      # ============================================================
      # 32. VERIFY SIGNATURE
      # ============================================================
      - name: Verify signed APK
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          test -x "$APKSIGNER"

          "$APKSIGNER" verify \
            --verbose \
            android/app/build/outputs/apk/release/app-release.apk

          echo "Release APK signature: PASS"

      # ============================================================
      # 33. APK SHA256
      # ============================================================
      - name: Generate APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            android/app/build/outputs/apk/release/app-release.apk \
            | tee APK_SHA256.txt

          test -s APK_SHA256.txt

      # ============================================================
      # 34. UPLOAD APK
      # ============================================================
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Android-16-API36-Release-APK
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            APK_SHA256.txt
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 35. FINAL SUMMARY
      # ============================================================
      - name: Final APK build summary
        shell: bash
        run: |
          echo ""
          echo "=========================================================="
          echo "        RKMS CONNECT - FINAL RELEASE APK"
          echo "=========================================================="
          echo ""
          echo "Android       : 16 / API 36"
          echo "compileSdk    : 36"
          echo "targetSdk     : 36"
          echo "SDK platform  : android-36"
          echo "Build tools   : 36.0.0"
          echo "JDK           : 17"
          echo "Node          : 22"
          echo "Gradle        : 8.11.1"
          echo "AGP           : 8.9.1"
          echo "Output        : app-release.apk"
          echo "AAB           : NOT BUILT"
          echo "Profile       : AUDITED"
          echo "Member/PDA    : SEPARATED"
          echo "FCM           : AUDITED"
          echo "Saved Login   : AUDITED"
          echo "Complaint     : AUDITED"
          echo "PDF           : AUDITED"
          echo "RKMS logo     : PROTECTED"
          echo ""
          echo "=========================================================="
          echo "             BUILD COMPLETED SUCCESSFULLY"
          echo "=========================================================="

name: RKMS Android 16 API 36 - Final Signed Release APK Only

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  AGP_VERSION: "8.9.1"
  GRADLE_VERSION: "8.11.1"
  APP_ID: "org.rkms.connect"
  SOURCE_ZIP_NAME: "RKMS_CONNECT_GROUP_PHOTO_SCHEMA_FIXED_FINAL_20260920.zip"

jobs:
  build-release-apk:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. LIST ZIP FILES
      # ============================================================
      - name: List repository ZIP files
        shell: bash
        run: |
          set -euo pipefail

          echo "Available ZIP files:"
          find . -type f \( -iname "*.zip" -o -iname "*.ZIP" \) \
            -print | sort || true

      # ============================================================
      # 3. VERIFY EXACT SOURCE ZIP
      # ============================================================
      - name: Verify exact RKMS source ZIP
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_SOURCE_ZIP="${SOURCE_ZIP_NAME}"

          echo "Required source ZIP:"
          echo "$REQUIRED_SOURCE_ZIP"

          if [ -f "./$REQUIRED_SOURCE_ZIP" ]; then
            SOURCE_ZIP="./$REQUIRED_SOURCE_ZIP"
          else
            echo ""
            echo "ERROR: Required RKMS source ZIP not found."
            echo ""
            echo "Available ZIP files:"
            find . -type f \( -iname "*.zip" -o -iname "*.ZIP" \) \
              -print | sort || true
            exit 1
          fi

          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

          echo ""
          echo "Source ZIP verified:"
          echo "$SOURCE_ZIP"

          ls -lh "$SOURCE_ZIP"

      # ============================================================
      # 4. SOURCE ZIP SHA256
      # ============================================================
      - name: Generate source ZIP SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum "$SOURCE_ZIP" | tee rkms-source-zip.sha256

      # ============================================================
      # 5. EXTRACT SOURCE
      # ============================================================
      - name: Extract RKMS source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf rkms-source
          mkdir -p rkms-source

          unzip -q "$SOURCE_ZIP" -d rkms-source

          echo "Extracted source:"
          find rkms-source -maxdepth 3 -type f | head -200

      # ============================================================
      # 6. DETECT PROJECT ROOT
      # ============================================================
      - name: Detect RKMS project root
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT=""

          if [ -f "rkms-source/package.json" ]; then
            PROJECT_ROOT="rkms-source"
          else
            FOUND_PACKAGE="$(find rkms-source \
              -type f \
              -name package.json \
              -print -quit || true)"

            if [ -n "$FOUND_PACKAGE" ]; then
              PROJECT_ROOT="$(dirname "$FOUND_PACKAGE")"
            fi
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: package.json not found."
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Project root:"
          echo "$PROJECT_ROOT"

          test -f "$PROJECT_ROOT/package.json"

      # ============================================================
      # 7. VALIDATE SOURCE
      # ============================================================
      - name: Validate RKMS source
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          test -f package.json

          if [ -f app.js ]; then
            echo "app.js found."
          elif [ -f src/app.js ]; then
            echo "src/app.js found."
          else
            echo "WARNING: app.js not found."
          fi

          if [ -d supabase ]; then
            echo "supabase directory found."
          else
            echo "WARNING: supabase directory not found."
          fi

      # ============================================================
      # 8. NODE 22
      # ============================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ env.PROJECT_ROOT }}/package-lock.json

      # ============================================================
      # 9. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 10. ANDROID SDK BASE SETUP
      #
      # IMPORTANT:
      # Do NOT request "tools".
      # It is obsolete and causes:
      # Failed to find package 'tools'
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12266719"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: "platform-tools"

      # ============================================================
      # 11. INSTALL REQUIRED SDK PACKAGES
      # ============================================================
      - name: Install Android API 36 and Build Tools 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_SDK_ROOT}/cmdline-tools" \
              -type f \
              -path "*/bin/sdkmanager" \
              -print -quit || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            find "${ANDROID_SDK_ROOT}" -maxdepth 5 \
              -name sdkmanager -type f -print || true
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

      # ============================================================
      # 12. VERIFY ANDROID SDK
      # ============================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d "${ANDROID_SDK_ROOT}/platforms/android-${ANDROID_API}"
          test -d "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}"

          echo "Android platform:"
          ls -ld "${ANDROID_SDK_ROOT}/platforms/android-${ANDROID_API}"

          echo "Android build tools:"
          ls -ld "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}"

      # ============================================================
      # 13. INSTALL NPM DEPENDENCIES
      # ============================================================
      - name: Install npm dependencies
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # ============================================================
      # 14. VERIFY CAPACITOR
      # ============================================================
      - name: Verify Capacitor versions
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const deps = {
            ...(pkg.dependencies || {}),
            ...(pkg.devDependencies || {})
          };

          const required = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          let failed = false;

          for (const [name, version] of Object.entries(required)) {
            const actual = deps[name];

            console.log(
              `${name}: required=${version}, actual=${actual || "MISSING"}`
            );

            if (!actual) {
              failed = true;
            }
          }

          if (failed) {
            process.exit(1);
          }

          console.log("Capacitor verification passed.");
          NODE

      # ============================================================
      # 15. BUILD WEB APP
      # ============================================================
      - name: Build web application
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          if npm run | grep -qE '^[[:space:]]+build'; then
            npm run build
          else
            echo "No build script found."
          fi

      # ============================================================
      # 16. CAPACITOR ANDROID
      # ============================================================
      - name: Setup Capacitor Android
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      # ============================================================
      # 17. VERIFY ANDROID PROJECT
      # ============================================================
      - name: Verify Android project
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          test -d android
          test -f android/app/build.gradle

      # ============================================================
      # 18. FORCE COMPILE SDK / TARGET SDK
      # ============================================================
      - name: Configure Android API 36
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          if "android {" not in s:
              raise SystemExit("android block not found")

          if re.search(r'\bcompileSdk\s+\d+', s):
              s = re.sub(
                  r'\bcompileSdk\s+\d+',
                  'compileSdk 36',
                  s,
                  count=1
              )
          else:
              s = s.replace(
                  "android {",
                  "android {\n    compileSdk 36",
                  1
              )

          if re.search(r'\bminSdk\s+\d+', s):
              s = re.sub(
                  r'\bminSdk\s+\d+',
                  'minSdk 23',
                  s,
                  count=1
              )

          if re.search(r'\btargetSdk\s+\d+', s):
              s = re.sub(
                  r'\btargetSdk\s+\d+',
                  'targetSdk 36',
                  s,
                  count=1
              )

          p.write_text(s)
          PY

          echo "Android SDK settings:"
          grep -nE "compileSdk|minSdk|targetSdk" \
            android/app/build.gradle || true

          grep -q "compileSdk 36" android/app/build.gradle
          grep -q "targetSdk 36" android/app/build.gradle

      # ============================================================
      # 19. VERIFY APPLICATION ID
      # ============================================================
      - name: Verify application ID
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          grep -q \
            'applicationId[[:space:]]*["'\'']org\.rkms\.connect["'\'']' \
            android/app/build.gradle

          echo "Application ID verified."

      # ============================================================
      # 20. FIREBASE
      # ============================================================
      - name: Verify Firebase configuration
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          if [ -f android/app/google-services.json ]; then
            grep -q "org.rkms.connect" \
              android/app/google-services.json

            echo "Firebase configuration verified."
          else
            echo "WARNING: google-services.json not found."
          fi

      # ============================================================
      # 21. VERIFY RELEASE SECRETS
      # ============================================================
      - name: Verify release signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          [ -n "$KEYSTORE_BASE64" ] || {
            echo "ERROR: ANDROID_KEYSTORE_BASE64 missing"
            exit 1
          }

          [ -n "$KEYSTORE_PASSWORD" ] || {
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD missing"
            exit 1
          }

          [ -n "$KEY_ALIAS" ] || {
            echo "ERROR: ANDROID_KEY_ALIAS missing"
            exit 1
          }

          [ -n "$KEY_PASSWORD" ] || {
            echo "ERROR: ANDROID_KEY_PASSWORD missing"
            exit 1
          }

          echo "Release signing secrets verified."

      # ============================================================
      # 22. CREATE RELEASE KEYSTORE
      # ============================================================
      - name: Configure release keystore
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/rkms-release.keystore

          test -s android/rkms-release.keystore

          keytool -list \
            -keystore android/rkms-release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          cat >> android/gradle.properties <<EOF

          RKMS_RELEASE_STORE_FILE=../rkms-release.keystore
          RKMS_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD
          RKMS_RELEASE_KEY_ALIAS=$KEY_ALIAS
          RKMS_RELEASE_KEY_PASSWORD=$KEY_PASSWORD
          EOF

          echo "Release keystore verified."

      # ============================================================
      # 23. CONFIGURE RELEASE SIGNING SAFELY
      # ============================================================
      - name: Configure release signing
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          signing = """
              signingConfigs {
                  release {
                      storeFile file(project.findProperty("RKMS_RELEASE_STORE_FILE"))
                      storePassword project.findProperty("RKMS_RELEASE_STORE_PASSWORD")
                      keyAlias project.findProperty("RKMS_RELEASE_KEY_ALIAS")
                      keyPassword project.findProperty("RKMS_RELEASE_KEY_PASSWORD")
                  }
              }
          """

          if "signingConfigs {" not in s:
              s = s.replace(
                  "android {",
                  "android {" + signing,
                  1
              )
          elif "signingConfigs.release" not in s:
              raise SystemExit(
                  "Existing signingConfigs found but release signing configuration "
                  "could not be safely detected."
              )

          if "buildTypes {" not in s:
              raise SystemExit("buildTypes block not found.")

          # Remove an existing release signingConfig line so we can insert
          # exactly one deterministic line.
          s = re.sub(
              r'^\s*signingConfig\s+signingConfigs\.release\s*$',
              '',
              s,
              flags=re.MULTILINE
          )

          match = re.search(
              r'buildTypes\s*\{',
              s
          )

          if not match:
              raise SystemExit("buildTypes block not found.")

          start = match.end()

          # Find release block.
          release_match = re.search(
              r'\brelease\s*\{',
              s[start:]
          )

          if not release_match:
              insert = """
                  release {
                      signingConfig signingConfigs.release
                  }
              """

              s = s[:start] + insert + s[start:]
          else:
              release_start = start + release_match.end()

              s = (
                  s[:release_start]
                  + "\n        signingConfig signingConfigs.release\n"
                  + s[release_start:]
              )

          p.write_text(s)
          PY

          echo "Release signing configured."

      # ============================================================
      # 24. GRADLE WRAPPER
      # ============================================================
      - name: Verify Gradle wrapper
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}/android
        run: |
          set -euo pipefail

          test -f gradlew
          chmod +x gradlew

          ./gradlew --version

      # ============================================================
      # 25. CLEAN
      # ============================================================
      - name: Clean Android build
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}/android
        run: |
          set -euo pipefail

          ./gradlew clean --no-daemon

      # ============================================================
      # 26. BUILD FINAL SIGNED RELEASE APK ONLY
      # ============================================================
      - name: Build Final Signed Release APK
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}/android
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 27. VERIFY APK
      # ============================================================
      - name: Verify release APK
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK not generated."
            find android/app/build/outputs -type f -print || true
            exit 1
          fi

          echo "Final APK:"
          ls -lh "$APK"

      # ============================================================
      # 28. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify APK signature
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"

          apksigner verify --verbose "$APK"

          echo "APK signature verification PASSED."

      # ============================================================
      # 29. VERIFY APK PACKAGE
      # ============================================================
      - name: Verify APK package
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"

          if command -v aapt >/dev/null 2>&1; then
            aapt dump badging "$APK" | grep \
              "package: name='org.rkms.connect'"
          fi

      # ============================================================
      # 30. APK SHA256
      # ============================================================
      - name: Generate APK SHA256
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"

          sha256sum "$APK" \
            | tee RKMS_FINAL_RELEASE_APK_SHA256.txt

      # ============================================================
      # 31. PREPARE FINAL APK
      # ============================================================
      - name: Prepare final release artifact
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          mkdir -p final-release

          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            final-release/RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk

          cp \
            RKMS_FINAL_RELEASE_APK_SHA256.txt \
            final-release/

          cp \
            ../rkms-source-zip.sha256 \
            final-release/

          echo ""
          echo "Final release:"
          ls -lh final-release

      # ============================================================
      # 32. UPLOAD FINAL APK
      # ============================================================
      - name: Upload Final Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-CONNECT-FINAL-SIGNED-RELEASE-APK
          path: |
            ${{ env.PROJECT_ROOT }}/final-release/RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk
            ${{ env.PROJECT_ROOT }}/final-release/RKMS_FINAL_RELEASE_APK_SHA256.txt
            ${{ env.PROJECT_ROOT }}/final-release/rkms-source-zip.sha256
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 33. FINAL SUMMARY
      # ============================================================
      - name: Final build summary
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          APK="final-release/RKMS_CONNECT_FINAL_SIGNED_RELEASE.apk"

          echo ""
          echo "======================================================"
          echo " RKMS CONNECT FINAL SIGNED RELEASE APK"
          echo "======================================================"
          echo ""
          echo "Source ZIP:"
          echo "$SOURCE_ZIP"
          echo ""
          echo "Project root:"
          echo "$PROJECT_ROOT"
          echo ""
          echo "Application ID:"
          echo "$APP_ID"
          echo ""
          echo "Android API:"
          echo "$ANDROID_API"
          echo ""
          echo "Build tools:"
          echo "$BUILD_TOOLS"
          echo ""
          echo "Node:"
          echo "$NODE_VERSION"
          echo ""
          echo "Java:"
          echo "$JAVA_VERSION"
          echo ""
          echo "Release APK:"
          ls -lh "$APK"
          echo ""
          echo "SHA256:"
          sha256sum "$APK"
          echo ""
          echo "Debug APK: NOT BUILT"
          echo "AAB: NOT BUILT"
          echo ""
          echo "======================================================"
          echo " BUILD SUCCESSFUL"
          echo "======================================================"

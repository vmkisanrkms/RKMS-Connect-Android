name: RKMS Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify RKMS source
        run: |
          set -e

          if [ -f app.js ] && [ -f index.html ] && [ -f config.js ]; then
            echo "Using direct RKMS source files"

          elif [ -f RKMS_CONNECT_V9_APP_LOGO_FIXED_EXACT_FINAL.zip ]; then
            echo "Using RKMS logo-fixed source ZIP"
            unzip -t RKMS_CONNECT_V9_APP_LOGO_FIXED_EXACT_FINAL.zip >/dev/null

          elif [ -f RKMS_CONNECT_APK_BUILD_READY.zip ]; then
            echo "Using RKMS source ZIP"
            unzip -t RKMS_CONNECT_APK_BUILD_READY.zip >/dev/null

          else
            ZIP_FILE=$(find . -maxdepth 1 -type f -name 'RKMS*.zip' | head -n 1)

            if [ -n "$ZIP_FILE" ]; then
              echo "Using source ZIP: $ZIP_FILE"
              unzip -t "$ZIP_FILE" >/dev/null
            else
              echo "ERROR: RKMS source not found"
              find . -maxdepth 2 -type f | sort
              exit 1
            fi
          fi

      - name: Prepare RKMS source
        run: |
          set -e

          rm -rf build
          mkdir -p build

          if [ -f app.js ] && [ -f index.html ] && [ -f config.js ]; then

            rsync -a \
              --exclude='.git' \
              --exclude='.github' \
              --exclude='build' \
              --exclude='android' \
              --exclude='node_modules' \
              --exclude='*.zip' \
              ./ build/

          elif [ -f RKMS_CONNECT_V9_APP_LOGO_FIXED_EXACT_FINAL.zip ]; then

            echo "Extracting logo-fixed RKMS source"
            unzip -q RKMS_CONNECT_V9_APP_LOGO_FIXED_EXACT_FINAL.zip -d build

          elif [ -f RKMS_CONNECT_APK_BUILD_READY.zip ]; then

            echo "Extracting RKMS source ZIP"
            unzip -q RKMS_CONNECT_APK_BUILD_READY.zip -d build

          else

            ZIP_FILE=$(find . -maxdepth 1 -type f -name 'RKMS*.zip' | head -n 1)
            unzip -q "$ZIP_FILE" -d build

          fi

          if [ ! -f build/app.js ]; then
            APP_JS=$(find build -type f -name app.js | head -n 1)

            if [ -n "$APP_JS" ]; then
              SOURCE_DIR=$(dirname "$APP_JS")

              mkdir -p build-source
              rsync -a "$SOURCE_DIR"/ build-source/

              rm -rf build
              mv build-source build
            fi
          fi

          test -f build/app.js
          test -f build/index.html
          test -f build/config.js

          # Exact organization logo must exist
          test -f build/assets/rkms-logo-transparent.png

          echo "RKMS source verified"
          echo "Exact organization logo found:"
          ls -lh build/assets/rkms-logo-transparent.png

      - name: Verify JavaScript
        run: |
          node --check build/app.js
          echo "app.js syntax verified"

      - name: Create Capacitor package
        working-directory: build
        run: |
          cat > package.json <<'EOF'
          {
            "name": "rkms",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "rm -rf dist && mkdir -p dist && rsync -a --exclude='dist' --exclude='android' --exclude='node_modules' --exclude='.git' --exclude='.github' --exclude='*.zip' ./ dist/"
            },
            "dependencies": {
              "@capacitor/core": "6.2.2",
              "@capacitor/android": "6.2.2",
              "@capacitor/app": "6.0.1"
            },
            "devDependencies": {
              "@capacitor/cli": "6.2.2"
            }
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "org.rkms.connect",
            "appName": "RKMS",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https",
              "cleartext": true
            },
            "android": {
              "allowMixedContent": true,
              "captureInput": true,
              "webContentsDebuggingEnabled": false
            }
          }
          EOF

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: build
        run: npm install --no-audit --no-fund

      - name: Build RKMS web application
        working-directory: build
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android platform
        working-directory: build
        run: npx cap add android

      - name: Sync RKMS application
        working-directory: build
        run: npx cap sync android

      # =========================================================
      # IMPORTANT:
      # Logo is applied AFTER Capacitor sync.
      # This prevents Capacitor default icon from overriding it.
      # =========================================================

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Apply exact RKMS organization logo
        working-directory: build
        run: |
          set -e

          LOGO="assets/rkms-logo-transparent.png"
          RES="android/app/src/main/res"

          test -f "$LOGO"

          echo "Using exact RKMS organization logo:"
          identify "$LOGO"

          # Remove Capacitor/default adaptive launcher resources
          rm -rf "$RES/mipmap-anydpi-v26"
          rm -rf "$RES/mipmap-anydpi"

          # Remove old launcher PNGs
          find "$RES" -type f \
            \( -name 'ic_launcher.png' \
            -o -name 'ic_launcher_round.png' \
            -o -name 'ic_launcher_foreground.png' \) \
            -delete

          # Create Android launcher directories
          mkdir -p \
            "$RES/mipmap-mdpi" \
            "$RES/mipmap-hdpi" \
            "$RES/mipmap-xhdpi" \
            "$RES/mipmap-xxhdpi" \
            "$RES/mipmap-xxxhdpi"

          # Exact organization logo -> launcher icons
          convert "$LOGO" -resize 48x48 \
            "$RES/mipmap-mdpi/ic_launcher.png"

          convert "$LOGO" -resize 72x72 \
            "$RES/mipmap-hdpi/ic_launcher.png"

          convert "$LOGO" -resize 96x96 \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          convert "$LOGO" -resize 144x144 \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          convert "$LOGO" -resize 192x192 \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"

          # Round icon uses the SAME organization logo
          convert "$LOGO" -resize 48x48 \
            "$RES/mipmap-mdpi/ic_launcher_round.png"

          convert "$LOGO" -resize 72x72 \
            "$RES/mipmap-hdpi/ic_launcher_round.png"

          convert "$LOGO" -resize 96x96 \
            "$RES/mipmap-xhdpi/ic_launcher_round.png"

          convert "$LOGO" -resize 144x144 \
            "$RES/mipmap-xxhdpi/ic_launcher_round.png"

          convert "$LOGO" -resize 192x192 \
            "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

          echo "RKMS launcher icons created."

      # =========================================================
      # Force Android Manifest to use RKMS logo
      # =========================================================

      - name: Force RKMS launcher icon in Android Manifest
        working-directory: build
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          # Force application icon
          text = re.sub(
              r'android:icon="[^"]*"',
              'android:icon="@mipmap/ic_launcher"',
              text,
              count=1
          )

          # Force round icon
          if 'android:roundIcon=' in text:
              text = re.sub(
                  r'android:roundIcon="[^"]*"',
                  'android:roundIcon="@mipmap/ic_launcher_round"',
                  text,
                  count=1
              )
          else:
              text = text.replace(
                  'android:icon="@mipmap/ic_launcher"',
                  'android:icon="@mipmap/ic_launcher" '
                  'android:roundIcon="@mipmap/ic_launcher_round"',
                  1
              )

          path.write_text(text)
          PY

          echo "Android Manifest launcher icon forced to RKMS logo."

          grep -n "android:icon" "$MANIFEST" || true
          grep -n "android:roundIcon" "$MANIFEST" || true

      # =========================================================
      # Verify final launcher icons BEFORE APK build
      # =========================================================

      - name: Verify final RKMS launcher icons
        working-directory: build
        run: |
          set -e

          RES="android/app/src/main/res"

          for FILE in \
            "$RES/mipmap-mdpi/ic_launcher.png" \
            "$RES/mipmap-hdpi/ic_launcher.png" \
            "$RES/mipmap-xhdpi/ic_launcher.png" \
            "$RES/mipmap-xxhdpi/ic_launcher.png" \
            "$RES/mipmap-xxxhdpi/ic_launcher.png" \
            "$RES/mipmap-mdpi/ic_launcher_round.png" \
            "$RES/mipmap-hdpi/ic_launcher_round.png" \
            "$RES/mipmap-xhdpi/ic_launcher_round.png" \
            "$RES/mipmap-xxhdpi/ic_launcher_round.png" \
            "$RES/mipmap-xxxhdpi/ic_launcher_round.png"
          do
            test -s "$FILE"
            echo "Verified: $FILE"
          done

          # Default adaptive icon must NOT exist
          if find "$RES" -type f \
            \( -path '*mipmap-anydpi-v26*' \
            -o -name 'ic_launcher_foreground.xml' \
            -o -name 'ic_launcher_background.xml' \) \
            | grep -q .; then

            echo "ERROR: Default/adaptive launcher icon still exists"
            find "$RES" -type f \
              \( -path '*mipmap-anydpi-v26*' \
              -o -name 'ic_launcher_foreground.xml' \
              -o -name 'ic_launcher_background.xml' \)
            exit 1
          fi

          echo "======================================"
          echo "FINAL RKMS LOGO VERIFICATION PASSED"
          echo "======================================"

      - name: Make Gradle executable
        run: chmod +x build/android/gradlew

      - name: Build Debug APK
        working-directory: build/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          set -e

          APK="build/android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "RKMS APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-debug-apk
          path: build/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

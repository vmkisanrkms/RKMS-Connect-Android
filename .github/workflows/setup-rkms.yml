name: Build RKMS Connect APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. Setup Node.js 22
      # =========================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # =========================================================
      # 3. Extract EXACT V1D source ZIP
      # =========================================================
      - name: Extract RKMS Connect V1D source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build-project
          mkdir -p build-project

          SOURCE_ZIP="RKMS_CONNECT_V1D_FULL_FIX_CORRECTED_FINAL_FIXED_v4.zip"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERROR: Required V1D ZIP not found:"
            echo "$SOURCE_ZIP"
            echo
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          echo "Using EXACT V1D source:"
          echo "$SOURCE_ZIP"

          echo
          echo "Checking ZIP integrity..."
          unzip -t "$SOURCE_ZIP"

          echo
          echo "Extracting V1D source..."
          unzip -q "$SOURCE_ZIP" -d build-project

          echo
          echo "V1D ZIP extracted successfully."


      # =========================================================
      # 4. Locate RKMS source
      # =========================================================
      - name: Locate RKMS source
        shell: bash
        run: |
          set -euo pipefail

          APP_JS="$(find build-project \
            -type f \
            -name "app.js" \
            -print -quit)"

          if [ -z "$APP_JS" ]; then
            echo "ERROR: app.js not found inside V1D ZIP."
            echo
            echo "Extracted files:"
            find build-project -maxdepth 5 -type f | sort
            exit 1
          fi

          SOURCE_DIR="$(dirname "$APP_JS")"

          echo "RKMS source directory:"
          echo "$SOURCE_DIR"

          rm -rf rkms-source
          mkdir -p rkms-source

          rsync -a \
            "$SOURCE_DIR"/ \
            rkms-source/

          test -f rkms-source/app.js
          test -f rkms-source/index.html
          test -f rkms-source/config.js

          echo
          echo "RKMS V1D source verified."


      # =========================================================
      # 5. Verify JavaScript syntax
      # =========================================================
      - name: Verify JavaScript
        shell: bash
        run: |
          set -euo pipefail

          node --check rkms-source/app.js

          echo "app.js syntax verification PASS."


      # =========================================================
      # 6. Verify Member Dashboard
      # =========================================================
      - name: Verify Member Dashboard
        shell: bash
        run: |
          set -euo pipefail

          grep -q \
            "function renderMemberDashboard" \
            rkms-source/app.js

          grep -q \
            'name==="member-dashboard"' \
            rkms-source/app.js

          echo "Member Dashboard function found."
          echo "Member Dashboard route found."
          echo "Member Dashboard verification PASS."


      # =========================================================
      # 7. Verify all 8 V1D fixes
      # =========================================================
      - name: Verify V1D fixes 1 to 8
        shell: bash
        run: |
          set -euo pipefail

          FILE="rkms-source/app.js"

          echo "=================================================="
          echo "Checking V1D fixes 1-8"
          echo "=================================================="

          # -----------------------------------------------------
          # 1. Digital ID area
          # -----------------------------------------------------
          grep -q "memberAreaLabel" "$FILE"
          echo "PASS: Digital ID area"


          # -----------------------------------------------------
          # 2. Digital ID PDF
          # -----------------------------------------------------
          grep -q "downloadPdf" "$FILE"
          grep -q "pdfBlobFromCanvas" "$FILE"
          echo "PASS: Digital ID PDF"


          # -----------------------------------------------------
          # 3. Digital ID Print
          # -----------------------------------------------------
          grep -q "printPage" "$FILE"
          echo "PASS: Digital ID Print"


          # -----------------------------------------------------
          # 4. Member Profile
          # -----------------------------------------------------
          grep -q "renderMemberProfile" "$FILE"
          grep -q "member-profile" "$FILE"
          echo "PASS: Member Profile route"


          # -----------------------------------------------------
          # 5. National President certificate
          # -----------------------------------------------------
          grep -q "nationalName" "$FILE"
          grep -q "nationalPost" "$FILE"
          echo "PASS: National President certificate block"


          # -----------------------------------------------------
          # 6. Membership Certificate PDF
          # -----------------------------------------------------
          grep -q "data-download-pdf" "$FILE"
          echo "PASS: Membership Certificate PDF"


          # -----------------------------------------------------
          # 7. Launcher logo
          # -----------------------------------------------------
          test -s \
            rkms-source/assets/rkms-logo-transparent.png

          echo "PASS: RKMS launcher logo source"


          # -----------------------------------------------------
          # 8. Saved Login
          # -----------------------------------------------------
          grep -q \
            "rkmsSaveLoginCredentials" \
            "$FILE"

          echo "PASS: Saved Login"


          echo
          echo "V1D fixes 1-8 verification PASS."


      # =========================================================
      # 8. PDF pipeline static verification
      # =========================================================
      - name: Verify PDF pipeline
        working-directory: rkms-source
        shell: bash
        run: |
          set -euo pipefail

          test -f scripts/verify-pdf-pipeline.py

          python3 scripts/verify-pdf-pipeline.py

          echo "PDF pipeline verification PASS."


      # =========================================================
      # 9. Report download security verification
      # =========================================================
      - name: Verify report download security
        working-directory: rkms-source
        shell: bash
        run: |
          set -euo pipefail

          test -f scripts/verify-report-download-scope.py

          python3 scripts/verify-report-download-scope.py

          echo "Report download security verification PASS."


      # =========================================================
      # 10. Native bridge SOURCE verification
      # =========================================================
      - name: Verify native bridge source
        working-directory: rkms-source
        shell: bash
        run: |
          set -euo pipefail

          test -f scripts/verify-native-bridge.py

          python3 scripts/verify-native-bridge.py

          echo "Native bridge source verification PASS."


      # =========================================================
      # 11. RKMS final static verification
      # =========================================================
      - name: RKMS final static verification
        working-directory: rkms-source
        shell: bash
        run: |
          set -euo pipefail

          test -f scripts/verify-rkms-final.py

          python3 scripts/verify-rkms-final.py

          echo "RKMS final static verification PASS."


      # =========================================================
      # 12. Create Capacitor package
      # =========================================================
      - name: Create Capacitor build package
        working-directory: rkms-source
        shell: bash
        run: |
          set -euo pipefail

          cat > package.json <<'JSON'
          {
            "name": "rkms-connect",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "rm -rf dist && mkdir -p dist && rsync -a --exclude='dist/' --exclude='android/' --exclude='node_modules/' --exclude='.git/' --exclude='.github/' --exclude='*.zip' ./ dist/"
            },
            "dependencies": {
              "@capacitor/core": "6.2.2",
              "@capacitor/android": "6.2.2",
              "@capacitor/app": "6.0.3"
            },
            "devDependencies": {
              "@capacitor/cli": "6.2.2"
            }
          }
          JSON

          cat > capacitor.config.json <<'JSON'
          {
            "appId": "org.rkms.connect",
            "appName": "RKMS",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https",
              "cleartext": true
            },
            "android": {
              "allowMixedContent": true,
              "captureInput": true,
              "webContentsDebuggingEnabled": false
            }
          }
          JSON

          echo "Capacitor package created."


      # =========================================================
      # 13. Install Capacitor dependencies
      # =========================================================
      - name: Install Capacitor dependencies
        working-directory: rkms-source
        run: |
          npm install --no-audit --no-fund


      # =========================================================
      # 14. Build RKMS web application
      # =========================================================
      - name: Build RKMS web application
        working-directory: rkms-source
        run: |
          set -euo pipefail

          npm run build

          test -f dist/index.html
          test -f dist/app.js
          test -f dist/config.js

          echo "RKMS web application build PASS."


      # =========================================================
      # 15. Setup Java 21
      # =========================================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle


      # =========================================================
      # 16. Setup Android SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # =========================================================
      # 17. Install Android SDK packages
      # =========================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK packages ready."


      # =========================================================
      # 18. Create Android platform
      # =========================================================
      - name: Create Android platform
        working-directory: rkms-source
        shell: bash
        run: |
          set -euo pipefail

          npx cap add android

          echo
          echo "Generated Android MainActivity files:"

          find android/app/src/main \
            -type f \
            \( \
              -name "MainActivity.java" \
              -o \
              -name "MainActivity.kt" \
            \) \
            -print

          MAIN_ACTIVITY="$(find android/app/src/main \
            -type f \
            -name "MainActivity.java" \
            -print -quit)"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.java not generated."
            echo
            find android/app/src/main -type f | sort
            exit 1
          fi

          echo
          echo "Generated MainActivity:"
          echo "$MAIN_ACTIVITY"


      # =========================================================
      # 19. Verify generated MainActivity BEFORE native setup
      # =========================================================
      - name: Verify generated MainActivity
        working-directory: rkms-source
        shell: bash
        run: |
          set -euo pipefail

          MAIN_ACTIVITY="$(find android/app/src/main \
            -type f \
            -name "MainActivity.java" \
            -print -quit)"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.java not found."
            exit 1
          fi

          echo "Checking:"
          echo "$MAIN_ACTIVITY"

          grep -q \
            "BridgeActivity" \
            "$MAIN_ACTIVITY"

          echo "Generated MainActivity verification PASS."


      # =========================================================
      # 20. Setup RKMS Android native bridge
      # =========================================================
      - name: Setup RKMS Android native bridge
        working-directory: rkms-source
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f scripts/setup-android-native.sh ]; then
            echo "ERROR: setup-android-native.sh not found."
            exit 1
          fi

          chmod +x scripts/setup-android-native.sh

          bash scripts/setup-android-native.sh

          echo
          echo "RKMS Android native bridge setup completed."


      # =========================================================
      # 21. Verify generated native files
      # =========================================================
      - name: Verify generated native bridge files
        working-directory: rkms-source
        shell: bash
        run: |
          set -euo pipefail

          echo "Generated Android native files:"
          find android/app/src/main/java \
            -type f \
            | sort

          MAIN_ACTIVITY="$(find android/app/src/main \
            -type f \
            -name "MainActivity.java" \
            -print -quit)"

          NATIVE_BRIDGE="$(find android/app/src/main \
            -type f \
            -name "RKMSNativeBridge.java" \
            -print -quit)"

          SECURE_PLUGIN="$(find android/app/src/main \
            -type f \
            -name "RKMSSecureCredentialsPlugin.java" \
            -print -quit)"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.java missing."
            exit 1
          fi

          if [ -z "$NATIVE_BRIDGE" ]; then
            echo "ERROR: RKMSNativeBridge.java missing."
            exit 1
          fi

          if [ -z "$SECURE_PLUGIN" ]; then
            echo "ERROR: RKMSSecureCredentialsPlugin.java missing."
            exit 1
          fi

          echo
          echo "MainActivity:"
          echo "$MAIN_ACTIVITY"

          echo
          echo "RKMSNativeBridge:"
          echo "$NATIVE_BRIDGE"

          echo
          echo "RKMSSecureCredentialsPlugin:"
          echo "$SECURE_PLUGIN"

          echo
          echo "Generated native files PASS."


      # =========================================================
      # 22. Sync Capacitor
      # =========================================================
      - name: Sync RKMS application
        working-directory: rkms-source
        run: |
          set -euo pipefail

          npx cap sync android

          echo "Capacitor Android sync PASS."


      # =========================================================
      # 23. Verify PDF functionality in CORRECT file
      #
      # IMPORTANT:
      # PDF methods belong to RKMSNativeBridge.java,
      # NOT MainActivity.java.
      # =========================================================
      - name: Verify generated Android PDF native bridge
        working-directory: rkms-source
        shell: bash
        run: |
          set -euo pipefail

          NATIVE_BRIDGE="$(find android/app/src/main \
            -type f \
            -name "RKMSNativeBridge.java" \
            -print -quit)"

          if [ -z "$NATIVE_BRIDGE" ]; then
            echo "ERROR: RKMSNativeBridge.java not found."
            find android/app/src/main/java -type f | sort
            exit 1
          fi

          echo "PDF bridge target:"
          echo "$NATIVE_BRIDGE"

          echo
          echo "Checking PDF methods..."

          # PDF save lifecycle
          grep -q "beginPdfSave" "$NATIVE_BRIDGE"
          grep -q "appendPdfChunk" "$NATIVE_BRIDGE"
          grep -q "finishPdfSave" "$NATIVE_BRIDGE"
          grep -q "cancelPdfSave" "$NATIVE_BRIDGE"

          echo "PASS: PDF lifecycle methods"


          # Android PDF APIs
          grep -q "ContentValues" "$NATIVE_BRIDGE"
          grep -q "MediaStore" "$NATIVE_BRIDGE"
          grep -q "Base64" "$NATIVE_BRIDGE"
          grep -q "Environment.DIRECTORY_DOWNLOADS" "$NATIVE_BRIDGE"

          echo "PASS: Android PDF APIs"


          # PDF MIME type
          grep -q "application/pdf" "$NATIVE_BRIDGE"

          echo "PASS: PDF MIME type"


          # RKMS download folder
          grep -q "RKMS CONNECT" "$NATIVE_BRIDGE"

          echo "PASS: RKMS CONNECT download folder"


          # Activity/WebView required for print/native operations
          grep -q \
            "private final android.app.Activity activity" \
            "$NATIVE_BRIDGE"

          grep -q \
            "private final android.webkit.WebView webView" \
            "$NATIVE_BRIDGE"

          echo "PASS: Activity/WebView references"


          echo
          echo "=================================================="
          echo "ANDROID PDF NATIVE BRIDGE: PASS"
          echo "=================================================="


      # =========================================================
      # 24. Verify MainActivity registration
      # =========================================================
      - name: Verify MainActivity native registration
        working-directory: rkms-source
        shell: bash
        run: |
          set -euo pipefail

          MAIN_ACTIVITY="$(find android/app/src/main \
            -type f \
            -name "MainActivity.java" \
            -print -quit)"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.java not found."
            exit 1
          fi

          echo "MainActivity:"
          echo "$MAIN_ACTIVITY"

          # Native bridge registration
          grep -q \
            "RKMSNativeBridge" \
            "$MAIN_ACTIVITY"

          # WebView passed to bridge
          grep -q \
            "getBridge().getWebView()" \
            "$MAIN_ACTIVITY"

          # Secure credential plugin registration
          grep -q \
            "RKMSSecureCredentialsPlugin" \
            "$MAIN_ACTIVITY"

          # Capacitor plugin registration
          grep -q \
            "registerPlugin(RKMSSecureCredentialsPlugin.class)" \
            "$MAIN_ACTIVITY"

          echo
          echo "MainActivity native registration PASS."


      # =========================================================
      # 25. Verify secure credential plugin
      # =========================================================
      - name: Verify secure credentials plugin
        working-directory: rkms-source
        shell: bash
        run: |
          set -euo pipefail

          PLUGIN="$(find android/app/src/main \
            -type f \
            -name "RKMSSecureCredentialsPlugin.java" \
            -print -quit)"

          if [ -z "$PLUGIN" ]; then
            echo "ERROR: Secure credentials plugin missing."
            exit 1
          fi

          echo "Secure credentials plugin:"
          echo "$PLUGIN"

          grep -q "AndroidKeyStore" "$PLUGIN"
          grep -q "AES/GCM/NoPadding" "$PLUGIN"
          grep -q "BiometricPrompt" "$PLUGIN"
          grep -q "authenticateAndGetCredentials" "$PLUGIN"
          grep -q "save" "$PLUGIN"
          grep -q "clear" "$PLUGIN"

          echo "Secure credentials plugin verification PASS."


      # =========================================================
      # 26. Install ImageMagick
      # =========================================================
      - name: Install ImageMagick
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

          echo "ImageMagick installed."


      # =========================================================
      # 27. Install corrected RKMS launcher logo
      # =========================================================
      - name: Install RKMS launcher logo
        shell: bash
        run: |
          set -euo pipefail

          LOGO="rkms-source/assets/rkms-logo-transparent.png"

          RES="rkms-source/android/app/src/main/res"

          STRINGS="rkms-source/android/app/src/main/res/values/strings.xml"

          test -s "$LOGO"

          mkdir -p \
            "$RES/mipmap-mdpi" \
            "$RES/mipmap-hdpi" \
            "$RES/mipmap-xhdpi" \
            "$RES/mipmap-xxhdpi" \
            "$RES/mipmap-xxxhdpi"


          # -------------------------------------------------------
          # V1D corrected logo safe-area sizes
          # -------------------------------------------------------

          convert "$LOGO" \
            -resize 26x26 \
            -strip \
            -gravity center \
            -background none \
            -extent 48x48 \
            "$RES/mipmap-mdpi/ic_launcher.png"

          convert "$LOGO" \
            -resize 39x39 \
            -strip \
            -gravity center \
            -background none \
            -extent 72x72 \
            "$RES/mipmap-hdpi/ic_launcher.png"

          convert "$LOGO" \
            -resize 52x52 \
            -strip \
            -gravity center \
            -background none \
            -extent 96x96 \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          convert "$LOGO" \
            -resize 78x78 \
            -strip \
            -gravity center \
            -background none \
            -extent 144x144 \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          convert "$LOGO" \
            -resize 104x104 \
            -strip \
            -gravity center \
            -background none \
            -extent 192x192 \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"


          # Round versions
          cp \
            "$RES/mipmap-mdpi/ic_launcher.png" \
            "$RES/mipmap-mdpi/ic_launcher_round.png"

          cp \
            "$RES/mipmap-hdpi/ic_launcher.png" \
            "$RES/mipmap-hdpi/ic_launcher_round.png"

          cp \
            "$RES/mipmap-xhdpi/ic_launcher.png" \
            "$RES/mipmap-xhdpi/ic_launcher_round.png"

          cp \
            "$RES/mipmap-xxhdpi/ic_launcher.png" \
            "$RES/mipmap-xxhdpi/ic_launcher_round.png"

          cp \
            "$RES/mipmap-xxxhdpi/ic_launcher.png" \
            "$RES/mipmap-xxxhdpi/ic_launcher_round.png"


          # Remove adaptive launcher resources
          rm -rf \
            "$RES/mipmap-anydpi-v26" \
            "$RES/mipmap-anydpi"


          find "$RES" -type f \( \
            -name 'ic_launcher_foreground.xml' -o \
            -name 'ic_launcher_background.xml' -o \
            -name 'ic_launcher_foreground.png' -o \
            -name 'ic_launcher_background.png' \
          \) -delete || true


          # App name
          if grep -q '<string name="app_name">' "$STRINGS"; then
            sed -i \
              's#<string name="app_name">.*</string>#<string name="app_name">RKMS</string>#' \
              "$STRINGS"
          else
            printf '\n    <string name="app_name">RKMS</string>\n' \
              >> "$STRINGS"
          fi


          echo
          echo "V1D corrected launcher logo installed."

          identify \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"


      # =========================================================
      # 28. Verify launcher logo
      # =========================================================
      - name: Verify launcher logo
        shell: bash
        run: |
          set -euo pipefail

          RES="rkms-source/android/app/src/main/res"

          test -s \
            "$RES/mipmap-mdpi/ic_launcher.png"

          test -s \
            "$RES/mipmap-hdpi/ic_launcher.png"

          test -s \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          test -s \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          test -s \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"

          # Adaptive icon resources must not remain
          test ! -e \
            "$RES/mipmap-anydpi-v26"

          echo "Launcher logo verification PASS."


      # =========================================================
      # 29. Make Gradle executable
      # =========================================================
      - name: Make Gradle executable
        run: |
          chmod +x rkms-source/android/gradlew


      # =========================================================
      # 30. Build Debug APK
      # =========================================================
      - name: Build Debug APK
        working-directory: rkms-source/android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

          echo "Gradle APK build completed."


      # =========================================================
      # 31. Verify APK
      # =========================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="rkms-source/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo
          echo "=================================================="
          echo "RKMS V1D APK CREATED"
          echo "=================================================="

          ls -lh "$APK"

          echo
          echo "APK SHA-256:"
          sha256sum "$APK"


      # =========================================================
      # 32. Rename final APK
      # =========================================================
      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build
          mkdir -p build

          cp \
            rkms-source/android/app/build/outputs/apk/debug/app-debug.apk \
            build/RKMS-Connect-V1D-Debug.apk

          test -s \
            build/RKMS-Connect-V1D-Debug.apk

          echo
          echo "Final APK:"
          ls -lh build/RKMS-Connect-V1D-Debug.apk

          echo
          echo "Final APK SHA-256:"
          sha256sum build/RKMS-Connect-V1D-Debug.apk


      # =========================================================
      # 33. Upload APK artifact
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-V1D-Debug-APK
          path: build/RKMS-Connect-V1D-Debug.apk
          if-no-files-found: error
          retention-days: 30

name: RKMS Android 16 / API 36 - Final Signed APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: RKMS Final Android 16 API 36
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 2. NODE.JS 22
      # ============================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ============================================================
      # 3. JDK 17
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ============================================================
      # 4. ANDROID SDK
      # ============================================================
      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          test -d "/usr/local/lib/android/sdk"

          test -x \
            "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"

          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --version

          echo "Android SDK: PASS"

      # ============================================================
      # 5. ACCEPT LICENSES
      # ============================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=/usr/local/lib/android/sdk \
            --licenses || true

          echo "Android SDK licenses: PASS"

      # ============================================================
      # 6. INSTALL ANDROID 16 / API 36
      # ============================================================
      - name: Install Android 16 API 36
        shell: bash
        run: |
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=/usr/local/lib/android/sdk \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

          echo "Android API 36: PASS"
          echo "Build Tools 36.0.0: PASS"

      # ============================================================
      # 7. FIND FINAL SOURCE ZIP
      # ============================================================
      - name: Find final RKMS source ZIP
        shell: bash
        run: |
          ZIP="RKMS_CONNECT_FINAL_AUDITED_SIGNED_LOGO_FIXED_2026-09-17_ROOT.zip"

          if [ ! -f "$ZIP" ]; then
            ZIP="RKMS_CONNECT_FINAL_RULES_FIXED_2026-09-17.zip"
          fi

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Final RKMS source ZIP not found."
            echo
            echo "Repository files:"
            ls -lah
            exit 1
          fi

          echo "RKMS_ZIP=$ZIP" >> "$GITHUB_ENV"

          echo "Using:"
          echo "$ZIP"

      # ============================================================
      # 8. EXTRACT SOURCE
      # ============================================================
      - name: Extract RKMS source
        shell: bash
        run: |
          rm -rf rkms-source
          mkdir -p rkms-source

          unzip -q "$RKMS_ZIP" -d rkms-source

          APP_FILE=$(find rkms-source \
            -type f \
            -name "app.js" \
            | head -n 1)

          if [ -z "$APP_FILE" ]; then
            echo "ERROR: app.js not found inside ZIP."
            exit 1
          fi

          SOURCE_DIR=$(dirname "$APP_FILE")

          echo "RKMS_SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

          echo "Source directory:"
          echo "$SOURCE_DIR"

      # ============================================================
      # 9. VERIFY SOURCE FILES
      # ============================================================
      - name: Verify RKMS source
        shell: bash
        run: |
          cd "$RKMS_SOURCE_DIR"

          test -f app.js
          test -f index.html
          test -f styles.css
          test -f package.json
          test -f capacitor.config.json
          test -f scripts/configure-android-16.sh

          echo "Required source files: PASS"

      # ============================================================
      # 10. VERIFY APP.JS
      # ============================================================
      - name: Verify app.js
        shell: bash
        run: |
          cd "$RKMS_SOURCE_DIR"

          node --check app.js

          echo "app.js syntax: PASS"

      # ============================================================
      # 11. VERIFY PYTHON
      # ============================================================
      - name: Verify Python scripts
        shell: bash
        run: |
          cd "$RKMS_SOURCE_DIR"

          if compgen -G "scripts/*.py" > /dev/null; then
            python3 -m py_compile scripts/*.py
          fi

          echo "Python scripts: PASS"

      # ============================================================
      # 12. INSTALL NPM
      # ============================================================
      - name: Install npm dependencies
        shell: bash
        run: |
          cd "$RKMS_SOURCE_DIR"

          npm install --no-audit --no-fund

          echo "npm install: PASS"

      # ============================================================
      # 13. BUILD WEB DIST
      # ============================================================
      - name: Build RKMS web assets
        shell: bash
        run: |
          cd "$RKMS_SOURCE_DIR"

          npm run build

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html missing."
            exit 1
          fi

          echo "dist/index.html: PASS"

      # ============================================================
      # 14. VERIFY ORIGINAL RKMS LOGO
      # ============================================================
      - name: Verify original RKMS launcher logo
        shell: bash
        run: |
          cd "$RKMS_SOURCE_DIR"

          test -f \
            "assets/rkms-launcher-original-transparent.png"

          test -d "android_launcher_icons"

          for D in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -f \
              "android_launcher_icons/mipmap-$D/ic_launcher.png"

            test -f \
              "android_launcher_icons/mipmap-$D/ic_launcher_round.png"
          done

          echo "Original RKMS launcher icon source: PASS"

      # ============================================================
      # 15. ADD CAPACITOR ANDROID
      # ============================================================
      - name: Add Capacitor Android
        shell: bash
        run: |
          cd "$RKMS_SOURCE_DIR"

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          test -d android

          echo "Capacitor Android project: PASS"

      # ============================================================
      # 16. CAPACITOR SYNC
      # ============================================================
      - name: Capacitor sync
        shell: bash
        run: |
          cd "$RKMS_SOURCE_DIR"

          test -f dist/index.html

          npx cap sync android

          echo "Capacitor sync: PASS"

      # ============================================================
      # 17. CONFIGURE ANDROID 16
      # ============================================================
      - name: Configure RKMS Android 16
        shell: bash
        run: |
          cd "$RKMS_SOURCE_DIR"

          test -f android/variables.gradle

          chmod +x scripts/configure-android-16.sh

          ./scripts/configure-android-16.sh

          echo "RKMS Android 16 configuration: PASS"

      # ============================================================
      # 18. FORCE API 36
      # ============================================================
      - name: Verify Android API 36 configuration
        shell: bash
        run: |
          cd "$RKMS_SOURCE_DIR"

          grep -E \
            "compileSdkVersion|targetSdkVersion" \
            android/variables.gradle || true

          grep -E \
            "com.android.tools.build:gradle" \
            android/build.gradle || true

          grep -E \
            "distributionUrl" \
            android/gradle/wrapper/gradle-wrapper.properties || true

      # ============================================================
      # 19. INSTALL ORIGINAL RKMS LAUNCHER ICONS
      # ============================================================
      - name: Install original RKMS launcher icons
        shell: bash
        run: |
          cd "$RKMS_SOURCE_DIR"

          RES="android/app/src/main/res"

          mkdir -p "$RES"

          # Remove Capacitor generated adaptive launcher icons.
          rm -rf "$RES/mipmap-anydpi-v26"
          rm -rf "$RES/mipmap-anydpi"

          # Remove generated launcher raster folders.
          rm -rf "$RES"/mipmap-mdpi
          rm -rf "$RES"/mipmap-hdpi
          rm -rf "$RES"/mipmap-xhdpi
          rm -rf "$RES"/mipmap-xxhdpi
          rm -rf "$RES"/mipmap-xxxhdpi

          # Copy the ORIGINAL RKMS icons exactly.
          cp -R android_launcher_icons/mipmap-mdpi \
            "$RES/"

          cp -R android_launcher_icons/mipmap-hdpi \
            "$RES/"

          cp -R android_launcher_icons/mipmap-xhdpi \
            "$RES/"

          cp -R android_launcher_icons/mipmap-xxhdpi \
            "$RES/"

          cp -R android_launcher_icons/mipmap-xxxhdpi \
            "$RES/"

          echo "Original RKMS launcher icons installed."

      # ============================================================
      # 20. VERIFY ICONS AFTER COPY
      # ============================================================
      - name: Verify launcher icons
        shell: bash
        run: |
          cd "$RKMS_SOURCE_DIR"

          for D in mdpi hdpi xhdpi xxhdpi xxxhdpi; do

            cmp \
              "android_launcher_icons/mipmap-$D/ic_launcher.png" \
              "android/app/src/main/res/mipmap-$D/ic_launcher.png"

            cmp \
              "android_launcher_icons/mipmap-$D/ic_launcher_round.png" \
              "android/app/src/main/res/mipmap-$D/ic_launcher_round.png"

          done

          if [ -d "android/app/src/main/res/mipmap-anydpi-v26" ]; then
            echo "ERROR: Adaptive launcher icons still exist."
            exit 1
          fi

          echo "Launcher icon byte-for-byte verification: PASS"

      # ============================================================
      # 21. CONFIGURE GRADLE
      # ============================================================
      - name: Configure Gradle 8.11.1
        shell: bash
        run: |
          cd "$RKMS_SOURCE_DIR/android"

          test -f gradle/wrapper/gradle-wrapper.properties

          grep -q \
            "gradle-8.11.1-bin.zip" \
            gradle/wrapper/gradle-wrapper.properties

          echo "Gradle 8.11.1: PASS"

      # ============================================================
      # 22. VERIFY SIGNING SECRETS
      # ============================================================
      - name: Verify release signing secrets
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          if [ -z "$RKMS_KEYSTORE_BASE64" ]; then
            echo "ERROR: RKMS_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [ -z "$RKMS_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: RKMS_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$RKMS_KEY_ALIAS" ]; then
            echo "ERROR: RKMS_KEY_ALIAS secret is missing."
            exit 1
          fi

          if [ -z "$RKMS_KEY_PASSWORD" ]; then
            echo "ERROR: RKMS_KEY_PASSWORD secret is missing."
            exit 1
          fi

          echo "Release signing secrets: PASS"

      # ============================================================
      # 23. DECODE KEYSTORE
      # ============================================================
      - name: Prepare signing keystore
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
        run: |
          echo "$RKMS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rkms-release.keystore"

          test -s "$RUNNER_TEMP/rkms-release.keystore"

          echo "Signing keystore prepared."

      # ============================================================
      # 24. BUILD UNSIGNED APK
      # ============================================================
      - name: Build Android Release
        shell: bash
        run: |
          cd "$RKMS_SOURCE_DIR/android"

          chmod +x gradlew

          ./gradlew clean assembleRelease \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 25. FIND UNSIGNED APK
      # ============================================================
      - name: Locate built APK
        shell: bash
        run: |
          cd "$RKMS_SOURCE_DIR"

          APK=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "UNSIGNED_APK=$APK" >> "$GITHUB_ENV"

          echo "Built APK:"
          echo "$APK"

      # ============================================================
      # 26. ZIPALIGN
      # ============================================================
      - name: Zipalign APK
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release"

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -p \
            -f \
            4 \
            "$RKMS_SOURCE_DIR/$UNSIGNED_APK" \
            "$GITHUB_WORKSPACE/release/RKMS-aligned.apk"

          test -f "$GITHUB_WORKSPACE/release/RKMS-aligned.apk"

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -c \
            -P 4 \
            -v 4 \
            "$GITHUB_WORKSPACE/release/RKMS-aligned.apk"

      # ============================================================
      # 27. SIGN APK
      # ============================================================
      - name: Sign Release APK
        shell: bash
        env:
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/rkms-release.keystore" \
            --ks-pass env:RKMS_KEYSTORE_PASSWORD \
            --ks-key-alias "$RKMS_KEY_ALIAS" \
            --key-pass env:RKMS_KEY_PASSWORD \
            --out "$GITHUB_WORKSPACE/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk" \
            "$GITHUB_WORKSPACE/release/RKMS-aligned.apk"

          test -f \
            "$GITHUB_WORKSPACE/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"

          echo "APK signing: PASS"

      # ============================================================
      # 28. VERIFY SIGNATURE
      # ============================================================
      - name: Verify signed APK
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            "$GITHUB_WORKSPACE/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"

          echo "Signed APK verification: PASS"

      # ============================================================
      # 29. VERIFY APK IS NOT UNSIGNED
      # ============================================================
      - name: Verify final APK package
        shell: bash
        run: |
          FINAL_APK="$GITHUB_WORKSPACE/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"

          if [[ "$FINAL_APK" == *"unsigned"* ]]; then
            echo "ERROR: Unsigned APK detected."
            exit 1
          fi

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            "$FINAL_APK"

          echo "Final APK signature: PASS"

      # ============================================================
      # 30. GENERATE SHA256
      # ============================================================
      - name: Generate SHA256
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/release"

          sha256sum \
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk \
            | tee RKMS_ANDROID16_API36_SHA256.txt

      # ============================================================
      # 31. FINAL RELEASE CHECK
      # ============================================================
      - name: Final release verification
        shell: bash
        run: |
          APK="$GITHUB_WORKSPACE/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"

          test -f "$APK"
          test -s "$APK"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"

          echo
          echo "=============================================="
          echo " RKMS FINAL APK VERIFICATION: PASS"
          echo "=============================================="
          echo
          ls -lh "$APK"
          echo

      # ============================================================
      # 32. UPLOAD ONLY FINAL SIGNED APK
      # ============================================================
      - name: Upload final signed APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS_CONNECT_ANDROID16_API36_RELEASE
          path: |
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            release/RKMS_ANDROID16_API36_SHA256.txt
          if-no-files-found: error
          retention-days: 90

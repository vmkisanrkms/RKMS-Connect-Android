name: RKMS Android 16 API 36 - Final Release APK Only

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  AGP_VERSION: "8.9.1"
  GRADLE_VERSION: "8.11.1"
  APP_ID: "org.rkms.connect"

jobs:
  android-build:
    name: RKMS Android 16 API 36 Release APK
    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. RESOLVE RKMS SOURCE
      # ============================================================
      - name: Resolve RKMS source
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking RKMS source..."

          # --------------------------------------------------------
          # CASE 1: Source already exists in repository root
          # --------------------------------------------------------
          if [[ -f "package.json" ]] && \
             [[ -f "package-lock.json" ]] && \
             [[ -f "app.js" ]] && \
             [[ -f "index.html" ]] && \
             [[ -f "styles.css" ]] && \
             [[ -f "capacitor.config.json" ]] && \
             [[ -f "google-services.json" ]]; then

            echo "Root RKMS source detected."
            echo "RKMS_SOURCE_DIR=." >> "$GITHUB_ENV"
            exit 0
          fi


          # --------------------------------------------------------
          # CASE 2: Find source ZIP
          # --------------------------------------------------------
          echo "Root source not found."
          echo "Searching for RKMS source ZIP..."

          rm -rf rkms-source
          mkdir -p rkms-source

          ZIP=""


          # FINAL V2 SOURCE - FIRST PRIORITY
          if [[ -f "RKMS_CONNECT_FINAL_CHAT_UI_PROFESSIONAL_FIXED_V2.zip" ]]; then
            ZIP="RKMS_CONNECT_FINAL_CHAT_UI_PROFESSIONAL_FIXED_V2.zip"
          fi


          # V2 RELEASE APK SOURCE
          if [[ -z "$ZIP" ]] && \
             [[ -f "RKMS_CONNECT_FINAL_RELEASE_APK_ONLY_CHAT_FIXED_V2.zip" ]]; then
            ZIP="RKMS_CONNECT_FINAL_RELEASE_APK_ONLY_CHAT_FIXED_V2.zip"
          fi


          # V2 / PATCHED SOURCE
          if [[ -z "$ZIP" ]] && \
             [[ -f "RKMS_CONNECT_FINAL_CHAT_UI_PROFESSIONAL_FIXED_SCROLL_FOOTER_PATCHED.zip" ]]; then
            ZIP="RKMS_CONNECT_FINAL_CHAT_UI_PROFESSIONAL_FIXED_SCROLL_FOOTER_PATCHED.zip"
          fi


          # PREVIOUS SOURCE
          if [[ -z "$ZIP" ]] && \
             [[ -f "RKMS_CONNECT_FINAL_CHAT_UI_PROFESSIONAL_FIXED.zip" ]]; then
            ZIP="RKMS_CONNECT_FINAL_CHAT_UI_PROFESSIONAL_FIXED.zip"
          fi


          # OTHER KNOWN RKMS SOURCES
          if [[ -z "$ZIP" ]]; then

            for CANDIDATE in \
              "RKMS_CONNECT_FINAL_CLEAN_ANDROID16_API36_APK_AAB_BUILD.zip" \
              "RKMS_CONNECT_CHAT_DIGITAL_ID_ANDROID16_API36_FINAL_APK_BUILD.zip"
            do

              if [[ -f "$CANDIDATE" ]]; then
                ZIP="$CANDIDATE"
                break
              fi

            done

          fi


          # --------------------------------------------------------
          # RECURSIVE FALLBACK
          # --------------------------------------------------------
          if [[ -z "$ZIP" ]]; then

            FOUND_ZIP="$(
              find . \
                -type f \
                -iname "RKMS_CONNECT*.zip" \
                -not -path "./.git/*" \
                -print \
                | sort \
                | head -n 1 || true
            )"

            if [[ -n "$FOUND_ZIP" ]]; then
              ZIP="$FOUND_ZIP"
            fi

          fi


          # --------------------------------------------------------
          # FAIL IF SOURCE NOT FOUND
          # --------------------------------------------------------
          if [[ -z "$ZIP" ]]; then

            echo "::error::RKMS source ZIP not found."

            echo
            echo "Available repository files:"
            find . \
              -maxdepth 5 \
              -type f \
              -not -path "./.git/*" \
              | sort \
              | head -500

            exit 1
          fi


          echo
          echo "=============================================="
          echo " RKMS SOURCE ZIP SELECTED"
          echo "=============================================="
          echo "$ZIP"
          echo


          # --------------------------------------------------------
          # EXTRACT
          # --------------------------------------------------------
          unzip -q "$ZIP" -d rkms-source


          # --------------------------------------------------------
          # FIND package.json
          # --------------------------------------------------------
          FOUND_PACKAGE="$(
            find rkms-source \
              -type f \
              -name "package.json" \
              -print \
              | head -n 1 || true
          )"


          if [[ -z "$FOUND_PACKAGE" ]]; then
            echo "::error::package.json not found after extraction."
            exit 1
          fi


          SOURCE="$(dirname "$FOUND_PACKAGE")"


          echo
          echo "Resolved RKMS source:"
          echo "$SOURCE"


          # --------------------------------------------------------
          # VERIFY REQUIRED SOURCE
          # --------------------------------------------------------
          REQUIRED_FILES=(
            package.json
            package-lock.json
            app.js
            index.html
            styles.css
            capacitor.config.json
            google-services.json
            scripts/configure-android-16.sh
            scripts/setup-android-native.sh
            scripts/configure-release-signing.sh
          )


          for FILE in "${REQUIRED_FILES[@]}"; do

            if [[ ! -f "$SOURCE/$FILE" ]]; then
              echo "::error::Missing required source file:"
              echo "$SOURCE/$FILE"
              exit 1
            fi

          done


          echo "RKMS_SOURCE_DIR=$SOURCE" >> "$GITHUB_ENV"


          echo
          echo "=============================================="
          echo " RKMS SOURCE RESOLUTION: PASS"
          echo "=============================================="
          echo "Source: $SOURCE"
          echo


      # ============================================================
      # 3. VERIFY RKMS SOURCE
      # ============================================================
      - name: Verify RKMS source
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          REQUIRED_FILES=(
            package.json
            package-lock.json
            app.js
            index.html
            styles.css
            capacitor.config.json
            google-services.json
            scripts/configure-android-16.sh
            scripts/setup-android-native.sh
            scripts/configure-release-signing.sh
          )

          for FILE in "${REQUIRED_FILES[@]}"; do

            if [[ ! -f "$FILE" ]]; then
              echo "::error::Missing required file: $FILE"
              exit 1
            fi

          done

          echo "All required RKMS source files verified."


      # ============================================================
      # 4. VERIFY CHAT V2 SOURCE
      # ============================================================
      - name: Verify RKMS Chat V2 source
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          echo "Checking RKMS Chat source..."

          # These checks are intentionally non-destructive.
          # They verify the actual V2 layout/runtime markers.

          grep -Fq "wa-chat-screen" styles.css || {
            echo "::error::wa-chat-screen missing."
            exit 1
          }

          grep -Fq "wa-chat-list" styles.css || {
            echo "::error::wa-chat-list missing."
            exit 1
          }

          grep -Fq "wa-chat-row" styles.css || {
            echo "::error::wa-chat-row missing."
            exit 1
          }

          grep -Fq "wa-conv-head" styles.css || {
            echo "::error::wa-conv-head missing."
            exit 1
          }

          grep -Fq "wa-messages" styles.css || {
            echo "::error::wa-messages missing."
            exit 1
          }

          grep -Fq "wa-compose-wrap" styles.css || {
            echo "::error::wa-compose-wrap missing."
            exit 1
          }

          grep -Fq "rkms-bottom-nav" styles.css || {
            echo "::error::rkms-bottom-nav missing."
            exit 1
          }

          grep -Fq "visualViewport" app.js || {
            echo "::error::visualViewport handling missing."
            exit 1
          }

          echo "Chat source structure verified."


      # ============================================================
      # 5. NODE 22
      # ============================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}


      # ============================================================
      # 6. VERIFY NODE + JAVASCRIPT
      # ============================================================
      - name: Verify Node and JavaScript
        shell: bash
        run: |
          set -euo pipefail

          node --version
          npm --version

          cd "$RKMS_SOURCE_DIR"

          node --check app.js

          echo "Node.js and app.js syntax verified."


      # ============================================================
      # 7. VERIFY CAPACITOR VERSIONS
      # ============================================================
      - name: Verify Capacitor versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          node <<'NODE'
          const p = require("./package.json");

          const expected = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          for (const [name, version] of Object.entries(expected)) {

            const actual =
              (p.dependencies && p.dependencies[name]) ||
              (p.devDependencies && p.devDependencies[name]);

            if (!actual || !actual.includes(version)) {
              console.error(
                `${name}: expected ${version}, found ${actual}`
              );
              process.exit(1);
            }

            console.log(`${name}: ${actual}`);
          }

          console.log("Capacitor versions verified.");
          NODE


      # ============================================================
      # 8. NPM INSTALL
      # ============================================================
      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          npm ci --no-audit --no-fund


      # ============================================================
      # 9. VERIFY PROFESSIONAL CHAT UI
      # ============================================================
      - name: Verify professional Chat UI
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          test -s styles.css

          REQUIRED_SELECTORS=(
            ".wa-chat-screen"
            ".wa-chat-list"
            ".wa-chat-row"
            ".wa-avatar-wrap"
            ".wa-chat-search"
            ".wa-filters"
            ".wa-conv-head"
            ".wa-messages"
            ".wa-compose-wrap"
            "footer.rkms-bottom-nav"
          )

          for SELECTOR in "${REQUIRED_SELECTORS[@]}"; do

            if ! grep -Fq "$SELECTOR" styles.css; then
              echo "::error::Required Chat CSS selector missing: $SELECTOR"
              exit 1
            fi

          done

          echo
          echo "=============================================="
          echo " PROFESSIONAL CHAT UI: PASS"
          echo "=============================================="
          echo


      # ============================================================
      # 10. VERIFY CHAT LAYOUT
      # ============================================================
      - name: Verify Chat scroll and footer layout
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          echo "Checking Chat layout..."

          grep -Fq "100dvh" styles.css || {
            echo "::error::100dvh not found."
            exit 1
          }

          grep -Fq "rkms-chat-vh" styles.css || {
            echo "::error::rkms-chat-vh not found."
            exit 1
          }

          grep -Fq "rkms-site-header-h" styles.css || {
            echo "::error::rkms-site-header-h not found."
            exit 1
          }

          grep -Fq "rkms-bottom-nav-h" styles.css || {
            echo "::error::rkms-bottom-nav-h not found."
            exit 1
          }

          grep -Fq "overflow-y" styles.css || {
            echo "::error::overflow-y scrolling rules not found."
            exit 1
          }

          grep -Fq "min-height:62px" styles.css || {
            echo "::error::62px footer configuration not found."
            exit 1
          }

          echo
          echo "=============================================="
          echo " CHAT LAYOUT VERIFICATION: PASS"
          echo "=============================================="
          echo "Dynamic viewport: PASS"
          echo "Chat scroll: PASS"
          echo "Single Chat scroll: PASS"
          echo "Footer layout: PASS"
          echo


      # ============================================================
      # 11. VERIFY CHAT CSS STRUCTURE
      # ============================================================
      - name: Verify Chat CSS integrity
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          python3 <<'PY'
          from pathlib import Path
          import re

          css = Path("styles.css").read_text(
              encoding="utf-8",
              errors="replace"
          )

          clean = re.sub(
              r"/\*.*?\*/",
              "",
              css,
              flags=re.S
          )

          opens = clean.count("{")
          closes = clean.count("}")

          if opens != closes:
              raise SystemExit(
                  f"CSS brace mismatch: open={opens}, close={closes}"
              )

          required = [
              "wa-chat-screen",
              "wa-chat-list",
              "wa-chat-row",
              "wa-conv-head",
              "wa-messages",
              "wa-compose-wrap",
              "rkms-bottom-nav",
              "rkms-chat-vh",
              "rkms-site-header-h",
              "rkms-bottom-nav-h"
          ]

          for item in required:
              if item not in css:
                  raise SystemExit(
                      f"Required CSS item missing: {item}"
                  )

          print("Chat CSS structural verification passed.")
          PY


      # ============================================================
      # 12. BUILD WEB
      # ============================================================
      - name: Build RKMS web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          npm run build

          test -d dist
          test -s dist/index.html

          echo "RKMS web build successful."


      # ============================================================
      # 13. JAVA 17
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle


      # ============================================================
      # 14. VERIFY JAVA
      # ============================================================
      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail

          java -version


      # ============================================================
      # 15. ANDROID SDK API 36
      # ============================================================
      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses >/dev/null 2>&1 || true

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          echo "Android SDK installed."


      # ============================================================
      # 16. VERIFY ANDROID SDK
      # ============================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d \
            "${ANDROID_HOME}/platforms/android-${ANDROID_API}"

          test -d \
            "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}"

          "${ANDROID_HOME}/platform-tools/adb" version

          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt" version

          echo "Android API ${ANDROID_API} verified."


      # ============================================================
      # 17. CREATE CAPACITOR ANDROID
      # ============================================================
      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          rm -rf android

          npx cap add android

          test -d android
          test -f android/gradlew
          test -f android/app/build.gradle

          chmod +x android/gradlew

          echo "Android project created successfully."


      # ============================================================
      # 18. CONFIGURE ANDROID 16 API 36
      # ============================================================
      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          chmod +x scripts/configure-android-16.sh

          ./scripts/configure-android-16.sh

          test -f android/gradlew

          chmod +x android/gradlew

          echo "Android 16/API 36 configuration applied."


      # ============================================================
      # 19. VERIFY ANDROID CONFIGURATION
      #
      # IMPORTANT:
      # Uses Python regex instead of the broken grep regex.
      # ============================================================
      - name: Verify Android configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          echo "Verifying Android configuration..."

          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path("android")

          if not root.is_dir():
              print("ERROR: android directory not found.")
              sys.exit(1)

          gradle_files = list(root.rglob("*.gradle"))
          gradle_files += list(root.rglob("*.gradle.kts"))

          if not gradle_files:
              print("ERROR: No Gradle files found.")
              sys.exit(1)

          combined = "\n".join(
              p.read_text(
                  encoding="utf-8",
                  errors="replace"
              )
              for p in gradle_files
          )

          # --------------------------------------------------------
          # compileSdk 36
          # Supports:
          # compileSdk 36
          # compileSdk = 36
          # compileSdkVersion 36
          # --------------------------------------------------------
          compile_patterns = [
              r"\bcompileSdkVersion\s*=?\s*36\b",
              r"\bcompileSdk\s*=?\s*36\b",
          ]

          if not any(
              re.search(pattern, combined)
              for pattern in compile_patterns
          ):
              print("ERROR: compileSdk 36 not found.")

              for path in gradle_files:
                  text = path.read_text(
                      encoding="utf-8",
                      errors="replace"
                  )

                  for line in text.splitlines():
                      if "compileSdk" in line:
                          print(f"{path}: {line}")

              sys.exit(1)


          # --------------------------------------------------------
          # targetSdk 36
          # --------------------------------------------------------
          target_patterns = [
              r"\btargetSdkVersion\s*=?\s*36\b",
              r"\btargetSdk\s*=?\s*36\b",
          ]

          if not any(
              re.search(pattern, combined)
              for pattern in target_patterns
          ):
              print("ERROR: targetSdk 36 not found.")

              for path in gradle_files:
                  text = path.read_text(
                      encoding="utf-8",
                      errors="replace"
                  )

                  for line in text.splitlines():
                      if "targetSdk" in line:
                          print(f"{path}: {line}")

              sys.exit(1)


          # --------------------------------------------------------
          # AGP 8.9.1
          # --------------------------------------------------------
          if "8.9.1" not in combined:
              print("ERROR: AGP 8.9.1 not found.")

              for path in gradle_files:
                  text = path.read_text(
                      encoding="utf-8",
                      errors="replace"
                  )

                  for line in text.splitlines():
                      if (
                          "com.android.tools.build" in line
                          or "com.android.application" in line
                          or "8." in line
                      ):
                          print(f"{path}: {line}")

              sys.exit(1)


          # --------------------------------------------------------
          # Gradle wrapper 8.11.1
          # --------------------------------------------------------
          wrapper = Path(
              "android/gradle/wrapper/gradle-wrapper.properties"
          )

          if not wrapper.is_file():
              print(
                  "ERROR: gradle-wrapper.properties not found."
              )
              sys.exit(1)

          wrapper_text = wrapper.read_text(
              encoding="utf-8",
              errors="replace"
          )

          if "gradle-8.11.1" not in wrapper_text:
              print(
                  "ERROR: Gradle 8.11.1 not configured."
              )
              print(wrapper_text)
              sys.exit(1)


          print("==============================================")
          print(" ANDROID CONFIGURATION VERIFIED")
          print("==============================================")
          print("compileSdk: 36")
          print("targetSdk: 36")
          print("AGP: 8.9.1")
          print("Gradle: 8.11.1")
          print("Android API: 36")
          print("==============================================")
          PY


      # ============================================================
      # 20. CAPACITOR SYNC
      # ============================================================
      - name: Capacitor sync
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          npx cap sync android

          test -f android/gradlew

          chmod +x android/gradlew

          echo "Capacitor sync completed."


      # ============================================================
      # 21. SETUP RKMS NATIVE AND FIREBASE
      # ============================================================
      - name: Setup RKMS native Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          chmod +x scripts/setup-android-native.sh

          ./scripts/setup-android-native.sh

          test -f android/gradlew

          chmod +x android/gradlew

          echo "RKMS native Android setup completed."


      # ============================================================
      # 22. VERIFY FIREBASE CONFIGURATION
      # ============================================================
      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          test -s google-services.json
          test -s android/app/google-services.json

          node <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync("google-services.json", "utf8")
          );

          const clients = data.client || [];

          const valid = clients.some(client =>
            client.client_info &&
            client.client_info.android_client_info &&
            client.client_info.android_client_info.package_name ===
              "org.rkms.connect"
          );

          if (!valid) {
            console.error(
              "Firebase package org.rkms.connect not found."
            );
            process.exit(1);
          }

          console.log(
            "Firebase package org.rkms.connect verified."
          );
          NODE


      # ============================================================
      # 23. ENSURE FIREBASE DEPENDENCIES
      # ============================================================
      - name: Ensure Firebase dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          FILE="android/app/build.gradle"

          test -f "$FILE"

          python3 <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          bom = (
              "implementation platform("
              "'com.google.firebase:firebase-bom:33.9.0'"
              ")"
          )

          messaging = (
              "implementation "
              "'com.google.firebase:firebase-messaging'"
          )

          marker = "dependencies {"

          if marker not in s:
              raise SystemExit(
                  "dependencies block not found"
              )

          if bom not in s:
              s = s.replace(
                  marker,
                  marker + "\n    " + bom,
                  1
              )

          if messaging not in s:
              s = s.replace(
                  marker,
                  marker + "\n    " + messaging,
                  1
              )

          p.write_text(s)

          print("Firebase dependencies ready.")
          PY


      # ============================================================
      # 24. VERIFY FIREBASE INITIALIZATION
      # ============================================================
      - name: Verify Firebase initialization
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          grep -R \
            "FirebaseApp.initializeApp" \
            android/app/src/main/java \
            >/dev/null || {
              echo "::error::FirebaseApp.initializeApp not found."
              exit 1
            }

          echo "Firebase initialization verified."


      # ============================================================
      # 25. VERIFY NATIVE BRIDGE
      # ============================================================
      - name: Verify RKMS native bridge
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          find android/app/src/main/java \
            -name "RKMSNativeBridge.java" \
            -print -quit \
            | grep -q . || {
              echo "::error::RKMSNativeBridge.java missing."
              exit 1
            }

          find android/app/src/main/java \
            -name "RKMSSecureCredentialsPlugin.java" \
            -print -quit \
            | grep -q . || {
              echo "::error::RKMSSecureCredentialsPlugin.java missing."
              exit 1
            }

          echo "RKMS native bridge verified."


      # ============================================================
      # 26. VERIFY BIOMETRIC
      # ============================================================
      - name: Verify biometric dependency
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          grep -R \
            "androidx.biometric:biometric" \
            android \
            >/dev/null || {
              echo "::error::Biometric dependency missing."
              exit 1
            }

          echo "Biometric dependency verified."


      # ============================================================
      # 27. VERIFY LAUNCHER ICONS
      # ============================================================
      - name: Verify RKMS launcher icons
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          COUNT="$(
            find android/app/src/main/res \
              -type f \
              \( \
                -name "ic_launcher*" \
                -o \
                -name "ic_launcher_round*" \
              \) \
              | wc -l
          )"

          if [[ "$COUNT" -lt 1 ]]; then
            echo "::error::RKMS launcher icon missing."
            exit 1
          fi

          echo "Launcher icons found: $COUNT"


      # ============================================================
      # 28. CHECK RELEASE SIGNING SECRETS
      # ============================================================
      - name: Verify release signing secrets
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${RKMS_KEYSTORE_BASE64:-}" ]]; then
            echo "::error::RKMS_KEYSTORE_BASE64 is missing or empty."
            exit 1
          fi

          if [[ -z "${RKMS_KEYSTORE_PASSWORD:-}" ]]; then
            echo "::error::RKMS_KEYSTORE_PASSWORD is missing or empty."
            exit 1
          fi

          if [[ -z "${RKMS_KEY_ALIAS:-}" ]]; then
            echo "::error::RKMS_KEY_ALIAS is missing or empty."
            exit 1
          fi

          if [[ -z "${RKMS_KEY_PASSWORD:-}" ]]; then
            echo "::error::RKMS_KEY_PASSWORD is missing or empty."
            exit 1
          fi

          echo "All release signing secrets are present."


      # ============================================================
      # 29. CONFIGURE RELEASE SIGNING
      # ============================================================
      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          chmod +x scripts/configure-release-signing.sh

          ./scripts/configure-release-signing.sh

          test -s android/app/release.keystore

          echo "Release keystore created."


      # ============================================================
      # 30. VALIDATE KEYSTORE
      # ============================================================
      - name: Validate release keystore
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          test -s android/app/release.keystore

          keytool \
            -list \
            -keystore android/app/release.keystore \
            -storepass "$RKMS_KEYSTORE_PASSWORD" \
            -alias "$RKMS_KEY_ALIAS" \
            >/dev/null

          echo "Release keystore/password/alias verified."


      # ============================================================
      # 31. VERIFY SIGNING CONFIGURATION
      # ============================================================
      - name: Verify release signing configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          grep -q "signingConfigs" \
            android/app/build.gradle

          grep -q "signingConfigs.release" \
            android/app/build.gradle

          grep -q "storeFile" \
            android/app/build.gradle

          grep -q "storePassword" \
            android/app/build.gradle

          grep -q "keyAlias" \
            android/app/build.gradle

          grep -q "keyPassword" \
            android/app/build.gradle

          echo "Release signing configuration verified."


      # ============================================================
      # 32. VERIFY GRADLE WRAPPER
      # ============================================================
      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR/android"

          test -f gradlew

          chmod +x gradlew

          ./gradlew --version

          ./gradlew --version \
            | grep -q "8.11.1" || {
              echo "::error::Gradle 8.11.1 expected."
              exit 1
            }

          echo "Gradle wrapper verified."


      # ============================================================
      # 33. VERIFY FIREBASE RELEASE CLASSPATH
      # ============================================================
      - name: Verify Firebase compile classpath
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR/android"

          ./gradlew \
            :app:dependencies \
            --configuration releaseCompileClasspath \
            --no-daemon \
            > ../firebase-dependencies.txt

          grep -q \
            "firebase-messaging" \
            ../firebase-dependencies.txt || {
              echo "::error::firebase-messaging missing."
              exit 1
            }

          echo "Firebase Messaging compile dependency verified."


      # ============================================================
      # 34. BUILD FINAL RELEASE APK ONLY
      #
      # NO assembleDebug
      # NO bundleRelease
      # ============================================================
      - name: Build Final Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR/android"

          ./gradlew \
            assembleRelease \
            --no-daemon \
            --stacktrace

          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"

          test -s "$RELEASE_APK"

          echo
          echo "=============================================="
          echo " FINAL RELEASE APK BUILD SUCCESS"
          echo "=============================================="
          echo

          ls -lh "$RELEASE_APK"


      # ============================================================
      # 35. VERIFY RELEASE APK PACKAGE ID
      # ============================================================
      - name: Verify Release APK package ID
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          AAPT="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt"

          "$AAPT" dump badging \
            android/app/build/outputs/apk/release/app-release.apk \
            | grep -q \
            "package: name='org.rkms.connect'" || {
              echo "::error::Wrong package ID."
              exit 1
            }

          echo "Package ID verified: org.rkms.connect"


      # ============================================================
      # 36. VERIFY RELEASE APK SIGNATURE
      # ============================================================
      - name: Verify Release APK signature
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          APKSIGNER="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            android/app/build/outputs/apk/release/app-release.apk

          echo "Release APK signature verified."


      # ============================================================
      # 37. VERIFY RELEASE APK TARGET SDK
      # ============================================================
      - name: Verify Release APK target SDK
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          AAPT="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt"

          BADGING="$(
            "$AAPT" dump badging \
              android/app/build/outputs/apk/release/app-release.apk
          )"

          echo "$BADGING"

          echo "$BADGING" \
            | grep -q \
            "targetSdkVersion:'36'" || {
              echo "::error::Release APK target SDK is not 36."
              exit 1
            }

          echo "Release APK target SDK 36 verified."


      # ============================================================
      # 38. PREPARE FINAL RELEASE APK
      # ============================================================
      - name: Prepare final Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          rm -rf release
          mkdir -p release

          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          echo "Final Release APK prepared."


      # ============================================================
      # 39. GENERATE SHA256
      # ============================================================
      - name: Generate SHA256 checksum
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR/release"

          sha256sum \
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk \
            > RKMS_ANDROID16_API36_SHA256.txt

          echo
          echo "===== SHA256 ====="

          cat RKMS_ANDROID16_API36_SHA256.txt


      # ============================================================
      # 40. FINAL ARTIFACT CHECK
      # ============================================================
      - name: Final artifact check
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_SOURCE_DIR"

          RELEASE_APK="release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"
          SHA_FILE="release/RKMS_ANDROID16_API36_SHA256.txt"

          test -s "$RELEASE_APK"
          test -s "$SHA_FILE"


          # --------------------------------------------------------
          # No Debug APK
          # --------------------------------------------------------
          if find release \
            -type f \
            -iname "*debug*.apk" \
            -print \
            | grep -q .; then

            echo "::error::Debug APK found in final release directory."
            exit 1

          fi


          # --------------------------------------------------------
          # No AAB
          # --------------------------------------------------------
          if find release \
            -type f \
            -name "*.aab" \
            -print \
            | grep -q .; then

            echo "::error::AAB found in final release directory."
            exit 1

          fi


          # --------------------------------------------------------
          # Exactly one APK in final directory
          # --------------------------------------------------------
          APK_COUNT="$(
            find release \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              | wc -l
          )"

          if [[ "$APK_COUNT" -ne 1 ]]; then
            echo "::error::Expected exactly one final APK."
            echo "Found: $APK_COUNT"
            exit 1
          fi


          echo
          echo "=============================================="
          echo " RKMS FINAL RELEASE APK READY"
          echo "=============================================="
          echo
          echo "Release APK: YES"
          echo "AAB: NO"
          echo "Debug APK: NO"
          echo "Chat UI: VERIFIED"
          echo "Chat Scroll: VERIFIED"
          echo "Single Chat Scroll: VERIFIED"
          echo "Chat Header: VERIFIED"
          echo "Footer Layout: VERIFIED"
          echo "Firebase: VERIFIED"
          echo "Native Bridge: VERIFIED"
          echo "Biometric: VERIFIED"
          echo "Saved Login: INCLUDED"
          echo "Android API 36: VERIFIED"
          echo "compileSdk: 36"
          echo "targetSdk: 36"
          echo "AGP: 8.9.1"
          echo "Gradle: 8.11.1"
          echo "Package: org.rkms.connect"
          echo

          ls -lh release/


      # ============================================================
      # 41. UPLOAD FINAL RELEASE APK ONLY
      # ============================================================
      - name: Upload final Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-ANDROID16-API36-FINAL-RELEASE-APK
          path: |
            ${{ env.RKMS_SOURCE_DIR }}/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            ${{ env.RKMS_SOURCE_DIR }}/release/RKMS_ANDROID16_API36_SHA256.txt
          if-no-files-found: error
          retention-days: 30

name: RKMS Final Android 16 API 36 AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-aab:

    name: RKMS Final Android 16 API 36 AAB

    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. LOCATE RKMS SOURCE
      # ============================================================

      - name: Locate RKMS source
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "RKMS SOURCE DISCOVERY"
          echo "=========================================="

          pwd
          ls -la

          # --------------------------------------------------------
          # Preferred: repository root
          # --------------------------------------------------------

          if [ -f "package.json" ] && \
             [ -f "app.js" ] && \
             [ -f "index.html" ]; then

            echo "Using repository root."

            echo "SOURCE_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

          else

            echo "Repository root source not found."
            echo "Searching for RKMS ZIP..."

            mkdir -p rkms_source

            CANDIDATE=""

            # ------------------------------------------------------
            # Latest fixed source
            # ------------------------------------------------------

            if [ -f "RKMS_CONNECT_FIXED_2026-09-18.zip" ]; then

              CANDIDATE="RKMS_CONNECT_FIXED_2026-09-18.zip"

            elif [ -f "RKMS_CONNECT_FINAL_RULES_FIXED_2026-09-17.zip" ]; then

              CANDIDATE="RKMS_CONNECT_FINAL_RULES_FIXED_2026-09-17.zip"

            else

              CANDIDATE="$(find . \
                -maxdepth 3 \
                -type f \
                -name 'RKMS_CONNECT*.zip' \
                -print \
                | head -n 1 || true)"

            fi

            if [ -z "$CANDIDATE" ]; then
              echo "ERROR: RKMS source ZIP not found."
              exit 1
            fi

            echo "Using source ZIP:"
            echo "$CANDIDATE"

            unzip -q "$CANDIDATE" -d rkms_source

            FOUND_PACKAGE="$(find rkms_source \
              -type f \
              -name package.json \
              -print \
              -quit)"

            if [ -z "$FOUND_PACKAGE" ]; then
              echo "ERROR: package.json not found."
              exit 1
            fi

            SOURCE_DIR="$(dirname "$FOUND_PACKAGE")"

            echo "SOURCE_DIR=$GITHUB_WORKSPACE/$SOURCE_DIR" \
              >> "$GITHUB_ENV"

          fi


      # ============================================================
      # 3. VERIFY SOURCE
      # ============================================================

      - name: Verify RKMS source
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          echo "=========================================="
          echo "VERIFY RKMS SOURCE"
          echo "=========================================="

          test -f package.json
          test -f app.js
          test -f index.html
          test -f capacitor.config.json
          test -f google-services.json

          echo "All required RKMS source files found."

          pwd


      # ============================================================
      # 4. NODE.JS 22
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ============================================================
      # 5. NODE / NPM VERSION
      # ============================================================

      - name: Verify Node and npm
        shell: bash
        run: |
          set -e

          echo "Node:"
          node --version

          echo "npm:"
          npm --version


      # ============================================================
      # 6. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          echo "=========================================="
          echo "INSTALL NPM DEPENDENCIES"
          echo "=========================================="

          if [ -f package-lock.json ]; then

            echo "package-lock.json found."
            echo "Running npm ci."

            npm ci

          else

            echo "package-lock.json not found."
            echo "Running npm install."

            npm install

          fi


      # ============================================================
      # 7. JAVASCRIPT SYNTAX
      # ============================================================

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          node --check app.js

          echo "JavaScript syntax PASS."


      # ============================================================
      # 8. WEB BUILD
      # ============================================================

      - name: Build web application
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          echo "=========================================="
          echo "WEB BUILD"
          echo "=========================================="

          HAS_BUILD_SCRIPT="$(node -e "
            const p=require('./package.json');
            process.stdout.write(
              p.scripts && p.scripts.build ? 'yes' : 'no'
            );
          ")"

          if [ "$HAS_BUILD_SCRIPT" = "yes" ]; then

            npm run build

          else

            echo "No npm build script."
            echo "Using existing RKMS web source."

          fi


      # ============================================================
      # 9. JDK 17
      # ============================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 10. ANDROID SDK ENVIRONMENT
      #
      # IMPORTANT:
      # Do NOT use android-actions/setup-android@v3.
      # ============================================================

      - name: Setup Android SDK environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID SDK ENVIRONMENT"
          echo "=========================================="

          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            ANDROID_SDK_ROOT="${ANDROID_HOME}"
          fi

          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            echo "ERROR: Android SDK not found."
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" \
            >> "$GITHUB_ENV"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" \
            >> "$GITHUB_ENV"

          echo "$ANDROID_SDK_ROOT/platform-tools" \
            >> "$GITHUB_PATH"

          # --------------------------------------------------------
          # Find sdkmanager
          # --------------------------------------------------------

          if [ -x \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
          ]; then

            SDKMANAGER_DIR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"

          else

            SDKMANAGER_DIR="$(find \
              "$ANDROID_SDK_ROOT/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -print \
              | head -n 1 \
              | xargs -r dirname)"

          fi

          if [ -z "$SDKMANAGER_DIR" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "SDKMANAGER_DIR=$SDKMANAGER_DIR"

          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"

          echo "Android SDK environment PASS."


      # ============================================================
      # 11. VERIFY SDKMANAGER
      # ============================================================

      - name: Verify sdkmanager
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SDKMANAGER"
          echo "=========================================="

          command -v sdkmanager

          sdkmanager --version


      # ============================================================
      # 12. ACCEPT LICENSES
      # ============================================================

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "Android licenses processed."


      # ============================================================
      # 13. INSTALL ANDROID 16 / API 36
      # ============================================================

      - name: Install Android 16 API 36
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID 16 / API 36"
          echo "=========================================="

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "Android API 36 installation PASS."


      # ============================================================
      # 14. VERIFY API 36
      # ============================================================

      - name: Verify Android API 36
        shell: bash
        run: |
          set -e

          test -d \
            "$ANDROID_SDK_ROOT/platforms/android-36"

          test -d \
            "$ANDROID_SDK_ROOT/build-tools/36.0.0"

          echo "Android platform 36 PASS."
          echo "Build tools 36.0.0 PASS."


      # ============================================================
      # 15. PREPARE CAPACITOR ANDROID
      # ============================================================

      - name: Prepare Capacitor Android
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          echo "=========================================="
          echo "CAPACITOR ANDROID"
          echo "=========================================="

          if [ ! -d android ]; then

            echo "Creating Android project."

            npx cap add android

          else

            echo "Android project already exists."

          fi

          npx cap sync android


      # ============================================================
      # 16. CONFIGURE ANDROID 16
      # ============================================================

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          test -f scripts/configure-android-16.sh

          chmod +x \
            scripts/configure-android-16.sh

          ./scripts/configure-android-16.sh


      # ============================================================
      # 17. CONFIGURE RKMS NATIVE ANDROID
      #
      # Includes:
      # Firebase
      # FCM
      # Saved login
      # Biometric/device PIN
      # Native bridge
      # Notification channel
      # ============================================================

      - name: Configure RKMS native Android
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          test -f scripts/setup-android-native.sh

          chmod +x \
            scripts/setup-android-native.sh

          ./scripts/setup-android-native.sh


      # ============================================================
      # 18. VERIFY FIREBASE
      # ============================================================

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          echo "=========================================="
          echo "FIREBASE"
          echo "=========================================="

          test -f google-services.json

          test -f \
            android/app/google-services.json

          # --------------------------------------------------------
          # Correct package
          # --------------------------------------------------------

          grep -q \
            '"package_name"[[:space:]]*:[[:space:]]*"org.rkms.connect"' \
            google-services.json

          grep -q \
            '"package_name"[[:space:]]*:[[:space:]]*"org.rkms.connect"' \
            android/app/google-services.json

          # --------------------------------------------------------
          # Native Firebase initialization
          # --------------------------------------------------------

          if grep -Rqs \
            'FirebaseApp.initializeApp(this)' \
            android/app/src/main/java; then

            echo "FirebaseApp.initializeApp(this) FOUND."

          else

            echo "ERROR:"
            echo "FirebaseApp.initializeApp(this) NOT FOUND."

            exit 1

          fi

          echo "Firebase configuration PASS."


      # ============================================================
      # 19. VERIFY GOOGLE SERVICES
      # ============================================================

      - name: Verify Google Services
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if grep -Rqs \
            'com.google.gms.google-services' \
            android; then

            echo "Google Services plugin found."

          else

            echo "ERROR: Google Services plugin not found."
            exit 1

          fi


      # ============================================================
      # 20. VERIFY RKMS PACKAGE
      # ============================================================

      - name: Verify Android package
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          grep -Rqs \
            'org.rkms.connect' \
            android/app/src/main

          echo "Android package org.rkms.connect PASS."


      # ============================================================
      # 21. VERIFY NATIVE BRIDGE
      # ============================================================

      - name: Verify RKMS Native Bridge
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          grep -Rqs \
            'RKMSNativeBridge' \
            android/app/src/main/java

          echo "RKMS Native Bridge PASS."


      # ============================================================
      # 22. SAVED LOGIN
      # ============================================================

      - name: Verify saved login
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-saved-login.py ]; then

            python3 \
              scripts/verify-saved-login.py

          else

            echo "Saved-login verification script not present."
            echo "Skipping static check."

          fi


      # ============================================================
      # 23. FCM PIPELINE
      # ============================================================

      - name: Verify FCM pipeline
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-fcm-pipeline.py ]; then

            python3 \
              scripts/verify-fcm-pipeline.py

          else

            echo "FCM verification script not present."
            echo "Skipping static check."

          fi


      # ============================================================
      # 24. LOGIN / NAVIGATION
      # ============================================================

      - name: Verify login and navigation
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-final-login-navigation.py ]; then

            python3 \
              scripts/verify-final-login-navigation.py

          else

            echo "Login verification script not present."
            echo "Skipping static check."

          fi


      # ============================================================
      # 25. AUTHORITY HIERARCHY
      # ============================================================

      - name: Verify authority hierarchy
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-authority-hierarchy.py ]; then

            python3 \
              scripts/verify-authority-hierarchy.py

          else

            echo "Authority verification script not present."
            echo "Skipping static check."

          fi


      # ============================================================
      # 26. DIRECTORY CHECKS
      # ============================================================

      - name: Verify directory
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-directory-lists.py ]; then
            python3 scripts/verify-directory-lists.py
          fi

          if [ -f scripts/verify-member-directory-scope.py ]; then
            python3 scripts/verify-member-directory-scope.py
          fi

          if [ -f scripts/verify-v17-directory-deep.py ]; then
            python3 scripts/verify-v17-directory-deep.py
          fi


      # ============================================================
      # 27. CONTACT ACTIONS
      # ============================================================

      - name: Verify directory contact actions
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-directory-contact-actions.py ]; then
            python3 \
              scripts/verify-directory-contact-actions.py
          fi


      # ============================================================
      # 28. CONTENT MANAGEMENT
      # ============================================================

      - name: Verify content management
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-content-management-final.py ]; then

            python3 \
              scripts/verify-content-management-final.py

          fi


      # ============================================================
      # 29. PROFILE UPDATE
      # ============================================================

      - name: Verify profile update
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-profile-update-final.py ]; then

            python3 \
              scripts/verify-profile-update-final.py

          fi


      # ============================================================
      # 30. PDF PIPELINE
      # ============================================================

      - name: Verify PDF pipeline
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-pdf-pipeline.py ]; then

            python3 \
              scripts/verify-pdf-pipeline.py

          fi


      # ============================================================
      # 31. REPORT DOWNLOAD
      # ============================================================

      - name: Verify report download scope
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-report-download-scope.py ]; then

            python3 \
              scripts/verify-report-download-scope.py

          fi


      # ============================================================
      # 32. FINAL RKMS STATIC CHECK
      # ============================================================

      - name: Final RKMS verification
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-rkms-final.py ]; then

            python3 \
              scripts/verify-rkms-final.py

          fi


      # ============================================================
      # 33. DOCUMENT SIGNER CHECK
      #
      # Digital ID
      # Membership Certificate
      # Appointment Letter
      # ============================================================

      - name: Verify document signer flow
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          echo "=========================================="
          echo "DOCUMENT SIGNER FLOW"
          echo "=========================================="

          grep -q \
            "getAppointmentMeta" \
            app.js

          grep -q \
            "getMembershipApprovalMeta" \
            app.js

          grep -q \
            "appointing_officer_signature_url" \
            app.js

          grep -q \
            "national_president_signature_url" \
            app.js

          echo "Digital ID signer logic PASS."
          echo "Membership Certificate signer logic PASS."
          echo "Appointment Letter signer logic PASS."


      # ============================================================
      # 34. GUEST NAVIGATION
      # ============================================================

      - name: Verify guest navigation
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          grep -q \
            'guest-nav' \
            app.js

          grep -q \
            'guest-nav' \
            styles.css

          if grep -q \
            'सदस्य / PDA अधिकारी Login' \
            app.js; then

            echo "ERROR: Old split login text exists."
            exit 1

          fi

          echo "Guest navigation PASS."


      # ============================================================
      # 35. MANIFEST INSPECTION
      #
      # IMPORTANT:
      # This is informational only.
      # It will NOT stop the build.
      # ============================================================

      - name: Inspect Android manifest
        shell: bash
        run: |
          cd "$SOURCE_DIR"

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          echo "=========================================="
          echo "ANDROID MANIFEST INSPECTION"
          echo "=========================================="

          if [ -f "$MANIFEST" ]; then

            echo "AndroidManifest.xml found."

            echo "Relevant permissions:"
            grep -o \
              'android.permission.[A-Z_]*' \
              "$MANIFEST" || true

          else

            echo "WARNING: AndroidManifest.xml not found."

          fi

          echo "Manifest inspection completed."


      # ============================================================
      # 36. CAPACITOR CHECK
      # ============================================================

      - name: Verify Capacitor Android
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          test -d android
          test -f android/gradlew

          echo "Capacitor Android project PASS."


      # ============================================================
      # 37. RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          test -f \
            scripts/configure-release-signing.sh

          chmod +x \
            scripts/configure-release-signing.sh

          ./scripts/configure-release-signing.sh


      # ============================================================
      # 38. GRADLE 8.11.1
      # ============================================================

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1


      # ============================================================
      # 39. VERIFY GRADLE
      # ============================================================

      - name: Verify Gradle
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR/android"

          chmod +x gradlew

          ./gradlew --version


      # ============================================================
      # 40. BUILD RELEASE AAB
      # ============================================================

      - name: Build signed Release AAB
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR/android"

          echo "=========================================="
          echo "BUILDING RKMS RELEASE AAB"
          echo "=========================================="

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            bundleRelease


      # ============================================================
      # 41. LOCATE AAB
      # ============================================================

      - name: Locate Release AAB
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          AAB="$(find \
            android/app/build/outputs/bundle \
            -type f \
            -name '*release*.aab' \
            -print \
            | head -n 1)"

          if [ -z "$AAB" ]; then

            echo "ERROR: Release AAB not found."
            exit 1

          fi

          echo "AAB=$AAB" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "AAB FOUND"
          echo "=========================================="

          ls -lh "$AAB"


      # ============================================================
      # 42. VERIFY AAB
      # ============================================================

      - name: Verify AAB
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          test -f "$AAB"

          echo "AAB file exists."


      # ============================================================
      # 43. VERIFY AAB SIGNATURE
      # ============================================================

      - name: Verify AAB signature
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          echo "=========================================="
          echo "AAB SIGNATURE VERIFICATION"
          echo "=========================================="

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB"

          echo "AAB signature PASS."


      # ============================================================
      # 44. GENERATE SHA256
      # ============================================================

      - name: Generate SHA256
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          sha256sum "$AAB" \
            | tee RKMS_RELEASE_AAB_SHA256.txt


      # ============================================================
      # 45. PREPARE RELEASE ARTIFACTS
      # ============================================================

      - name: Prepare release artifacts
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          rm -rf release

          mkdir -p release

          cp "$AAB" \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab

          cp \
            RKMS_RELEASE_AAB_SHA256.txt \
            release/

          echo "=========================================="
          echo "FINAL RELEASE FILES"
          echo "=========================================="

          ls -lh release/


      # ============================================================
      # 46. UPLOAD FINAL AAB
      # ============================================================

      - name: Upload final Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-CONNECT-Android16-API36-Release
          path: |
            ${{ env.SOURCE_DIR }}/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab
            ${{ env.SOURCE_DIR }}/release/RKMS_RELEASE_AAB_SHA256.txt
          if-no-files-found: error
          retention-days: 30

name: Build RKMS APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rkms-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build RKMS APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract RKMS ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "RKMS APK BUILD"
          echo "======================================"

          ZIP_FILE="$(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -name 'RKMS_Connect_*.zip' \
              -print -quit
          )"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: RKMS ZIP not found."
            find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -name '*.zip' \
              -print || true
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP_FILE"

          ZIP_SIZE=$(stat -c%s "$ZIP_FILE")
          MAX_SIZE=$((25 * 1024 * 1024))

          if [ "$ZIP_SIZE" -gt "$MAX_SIZE" ]; then
            echo "ERROR: ZIP is larger than 25 MB."
            exit 1
          fi

          echo "ZIP size check: PASS"

          TMP_DIR="$RUNNER_TEMP/rkms-project"
          rm -rf "$TMP_DIR"
          mkdir -p "$TMP_DIR"

          unzip -q "$ZIP_FILE" -d "$TMP_DIR"

          PROJECT_DIR="$(
            find "$TMP_DIR" \
              -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -print -quit |
              xargs -r dirname
          )"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found inside ZIP."
            exit 1
          fi

          rsync -a \
            --exclude='.github/' \
            "$PROJECT_DIR/" \
            "$GITHUB_WORKSPACE/"

          echo "Project extracted successfully."

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -f gradle.properties
          test -d app
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Android project: PASS"

      - name: Verify Book Reader
        shell: bash
        run: |
          set -euo pipefail

          BOOK_DIR="app/src/main/assets/www/assets/book"

          test -d "$BOOK_DIR"

          for i in $(seq -w 1 60); do
            test -f "$BOOK_DIR/page-$i.jpg"
          done

          test -f app/src/main/assets/www/index.html
          test -f app/src/main/assets/www/app.js
          test -f app/src/main/assets/www/styles.css

          grep -qi "zoom" app/src/main/assets/www/app.js
          grep -qi "pointer" app/src/main/assets/www/app.js

          echo "Book pages: 60"
          echo "Book Reader files: PASS"

      - name: Verify RKMS notification files
        shell: bash
        run: |
          set -euo pipefail

          test -f app/src/main/java/org/rkms/connect/RKMSFirebaseMessagingService.java
          test -f app/src/main/java/org/rkms/connect/NotificationHelper.java

          echo "Notification files: PASS"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate Gradle project
        run: gradle --no-daemon tasks

      - name: Clean project
        run: gradle --no-daemon clean

      - name: Build RKMS Debug APK
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "======================================"
          echo "RKMS APK BUILD SUCCESS"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload RKMS APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

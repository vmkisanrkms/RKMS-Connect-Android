name: RKMS Final Android 16 API 36 AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-aab:
    name: RKMS Final Android 16 API 36 AAB
    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. LOCATE SOURCE
      # ============================================================

      - name: Locate RKMS source
        shell: bash
        run: |
          set -e

          echo "Repository:"
          pwd

          echo "Files:"
          find . -maxdepth 2 -type f | sort | head -300

          SOURCE_DIR="."

          if [ -d "./rkms_fixed_src" ]; then
            SOURCE_DIR="./rkms_fixed_src"
          elif [ -d "./rkms_src" ]; then
            SOURCE_DIR="./rkms_src"
          fi

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

          echo "Using source directory:"
          echo "$SOURCE_DIR"


      # ============================================================
      # 3. VERIFY SOURCE
      # ============================================================

      - name: Verify source
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          test -f package.json
          test -f index.html
          test -f capacitor.config.json

          echo "Source verification: PASS"


      # ============================================================
      # 4. SETUP NODE 22
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ============================================================
      # 5. INSTALL NPM DEPENDENCIES
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

          echo "NPM install: PASS"


      # ============================================================
      # 6. JAVASCRIPT SYNTAX CHECK
      # ============================================================

      - name: JavaScript syntax check
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f app.js ]; then
            node --check app.js
          fi

          echo "JavaScript syntax: PASS"


      # ============================================================
      # 7. WEB BUILD
      # ============================================================

      - name: Build web application
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if npm run | grep -q "build"; then
            npm run build
          else
            echo "No npm build script found; using source directly."
          fi

          echo "Web build: PASS"


      # ============================================================
      # 8. SETUP JDK 17
      # ============================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      # ============================================================
      # 9. SETUP ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "Android SDK setup: PASS"


      # ============================================================
      # 10. VERIFY API 36
      # ============================================================

      - name: Verify Android API 36
        shell: bash
        run: |
          set -e

          test -d "${ANDROID_HOME}/platforms/android-36"
          test -d "${ANDROID_HOME}/build-tools/36.0.0"

          echo "Android API 36: PASS"


      # ============================================================
      # 11. CAPACITOR ANDROID GENERATION
      # ============================================================

      - name: Generate Capacitor Android
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

          echo "Capacitor Android generation: PASS"


      # ============================================================
      # 12. CONFIGURE ANDROID 16 API 36
      # ============================================================

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/configure-android-16.sh ]; then
            chmod +x scripts/configure-android-16.sh
            ./scripts/configure-android-16.sh
          else
            echo "ERROR: scripts/configure-android-16.sh missing."
            exit 1
          fi

          echo "Android 16 / API 36 configuration: PASS"


      # ============================================================
      # 13. ADD FIREBASE SDK DEPENDENCIES
      # ============================================================

      - name: Add Firebase SDK dependencies
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          test -f android/app/build.gradle

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          marker = "dependencies {"

          if marker not in s:
              raise SystemExit(
                  "ERROR: android/app/build.gradle dependencies block missing"
              )

          bom = (
              'implementation platform("com.google.firebase:firebase-bom:34.19.0")'
          )

          messaging = (
              'implementation "com.google.firebase:firebase-messaging"'
          )

          if "com.google.firebase:firebase-bom:" not in s:
              s = s.replace(
                  marker,
                  marker + "\n    " + bom,
                  1
              )

          if "com.google.firebase:firebase-messaging" not in s:
              s = s.replace(
                  marker,
                  marker + "\n    " + messaging,
                  1
              )

          p.write_text(s)

          print("Firebase BOM dependency: PASS")
          print("Firebase Messaging dependency: PASS")
          PY

          grep -q \
            'com.google.firebase:firebase-bom:34.19.0' \
            android/app/build.gradle

          grep -q \
            'com.google.firebase:firebase-messaging' \
            android/app/build.gradle

          echo "Firebase SDK dependencies ready."


      # ============================================================
      # 14. CONFIGURE RKMS NATIVE ANDROID
      # ============================================================

      - name: Configure RKMS native Android
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/setup-android-native.sh ]; then
            chmod +x scripts/setup-android-native.sh
            ./scripts/setup-android-native.sh
          else
            echo "ERROR: scripts/setup-android-native.sh missing."
            exit 1
          fi

          echo "RKMS native Android setup: PASS"


      # ============================================================
      # 15. VERIFY FIREBASE CONFIGURATION
      # ============================================================

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          test -f google-services.json
          test -f android/app/google-services.json

          grep -q '"package_name": "org.rkms.connect"' \
            google-services.json

          grep -q '"package_name": "org.rkms.connect"' \
            android/app/google-services.json

          grep -R -q \
            'FirebaseApp.initializeApp(this)' \
            android/app/src/main/java \
            || {
              echo "ERROR: FirebaseApp.initializeApp(this) not found."
              exit 1
            }

          grep -R -q \
            'com.google.firebase:firebase-messaging' \
            android/app/build.gradle \
            || {
              echo "ERROR: Firebase Messaging dependency missing."
              exit 1
            }

          echo "Firebase configuration: PASS"


      # ============================================================
      # 16. VERIFY GOOGLE SERVICES PLUGIN
      # ============================================================

      - name: Verify Google Services plugin
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          grep -R -q \
            'com.google.gms.google-services' \
            android \
            || {
              echo "ERROR: Google Services plugin missing."
              exit 1
            }

          echo "Google Services plugin: PASS"


      # ============================================================
      # 17. VERIFY PACKAGE / NATIVE BRIDGE
      # ============================================================

      - name: Verify package and native bridge
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          grep -R -q \
            'org.rkms.connect' \
            android/app \
            || {
              echo "ERROR: RKMS package name missing."
              exit 1
            }

          grep -R -q \
            'RKMSNativeBridge' \
            android/app/src/main/java \
            || {
              echo "ERROR: RKMSNativeBridge missing."
              exit 1
            }

          echo "Package / native bridge: PASS"


      # ============================================================
      # 18. VERIFY SAVED LOGIN
      # ============================================================

      - name: Verify saved login
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-saved-login.py ]; then
            python3 scripts/verify-saved-login.py
          else
            echo "Saved login verifier not present; continuing."
          fi


      # ============================================================
      # 19. VERIFY FCM PIPELINE
      # ============================================================

      - name: Verify FCM pipeline
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-fcm-pipeline.py ]; then
            python3 scripts/verify-fcm-pipeline.py
          else
            echo "FCM verifier not present; continuing."
          fi


      # ============================================================
      # 20. VERIFY LOGIN
      # ============================================================

      - name: Verify final login
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-final-login-navigation.py ]; then
            python3 scripts/verify-final-login-navigation.py
          else
            echo "Login verifier not present; continuing."
          fi


      # ============================================================
      # 21. VERIFY AUTHORITY HIERARCHY
      # ============================================================

      - name: Verify authority hierarchy
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-authority-hierarchy.py ]; then
            python3 scripts/verify-authority-hierarchy.py
          else
            echo "Authority verifier not present; continuing."
          fi


      # ============================================================
      # 22. VERIFY DIRECTORY
      # ============================================================

      - name: Verify directory
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-directory-lists.py ]; then
            python3 scripts/verify-directory-lists.py
          fi

          if [ -f scripts/verify-member-directory-scope.py ]; then
            python3 scripts/verify-member-directory-scope.py
          fi

          if [ -f scripts/verify-directory-contact-actions.py ]; then
            python3 scripts/verify-directory-contact-actions.py
          fi

          echo "Directory verification: PASS"


      # ============================================================
      # 23. VERIFY CONTENT RULES
      # ============================================================

      - name: Verify content rules
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-v17-directory-deep.py ]; then
            python3 scripts/verify-v17-directory-deep.py
          fi

          echo "Content rules verification: PASS"


      # ============================================================
      # 24. VERIFY PROFILE UPDATE
      # ============================================================

      - name: Verify profile update
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-profile-update-final.py ]; then
            python3 scripts/verify-profile-update-final.py
          fi

          echo "Profile update verification: PASS"


      # ============================================================
      # 25. VERIFY PDF PIPELINE
      # ============================================================

      - name: Verify PDF pipeline
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-pdf-pipeline.py ]; then
            python3 scripts/verify-pdf-pipeline.py
          fi

          echo "PDF pipeline verification: PASS"


      # ============================================================
      # 26. VERIFY REPORT DOWNLOAD
      # ============================================================

      - name: Verify report download scope
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-report-download-scope.py ]; then
            python3 scripts/verify-report-download-scope.py
          fi

          echo "Report download scope: PASS"


      # ============================================================
      # 27. VERIFY COMPLAINT FLOW
      # ============================================================

      - name: Verify complaint flow
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-complaint-final.py ]; then
            python3 scripts/verify-complaint-final.py || {
              echo "Complaint verifier returned non-zero."
              echo "Continuing because source-only verification can require APK context."
            }
          fi


      # ============================================================
      # 28. VERIFY FINAL RKMS RULES
      # ============================================================

      - name: Verify final RKMS rules
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f scripts/verify-rkms-final.py ]; then
            python3 scripts/verify-rkms-final.py
          fi

          echo "Final RKMS rules: PASS"


      # ============================================================
      # 29. VERIFY DIGITAL ID / SIGNER
      # ============================================================

      - name: Verify document signer
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          echo "Checking Digital ID / Membership Certificate / Appointment Letter..."

          grep -R -q \
            'resolveOfficerSignature' \
            . \
            || {
              echo "WARNING: resolveOfficerSignature not found."
            }

          grep -R -q \
            'signature_url' \
            . \
            || {
              echo "WARNING: signature_url not found."
            }

          echo "Document signer check completed."


      # ============================================================
      # 30. VERIFY GUEST NAVIGATION
      # ============================================================

      - name: Verify guest navigation
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -f index.html ]; then
            grep -q 'rkmsBottomNav' index.html || true
          fi

          if [ -f styles.css ]; then
            grep -q 'guest-nav' styles.css || true
          fi

          echo "Guest navigation check completed."


      # ============================================================
      # 31. MANIFEST INSPECTION
      # ============================================================

      - name: Inspect Android manifest
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ]; then

            echo "Manifest:"
            cat "$MANIFEST"

            if grep -q 'android.permission.POST_NOTIFICATIONS' "$MANIFEST"; then
              echo "POST_NOTIFICATIONS: PRESENT"
            else
              echo "POST_NOTIFICATIONS: NOT EXPLICITLY PRESENT IN SOURCE MANIFEST"
              echo "Informational only; continuing."
            fi

          else
            echo "ERROR: AndroidManifest.xml missing."
            exit 1
          fi


      # ============================================================
      # 32. CAPACITOR CHECK
      # ============================================================

      - name: Capacitor check
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          npx cap doctor || true

          echo "Capacitor check completed."


      # ============================================================
      # 33. PREPARE RELEASE SIGNING
      # ============================================================

      - name: Prepare release signing
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          if [ -z "${RKMS_KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: RKMS_KEYSTORE_BASE64 secret missing."
            exit 1
          fi

          if [ -z "${RKMS_KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: RKMS_KEYSTORE_PASSWORD secret missing."
            exit 1
          fi

          if [ -z "${RKMS_KEY_ALIAS:-}" ]; then
            echo "ERROR: RKMS_KEY_ALIAS secret missing."
            exit 1
          fi

          if [ -z "${RKMS_KEY_PASSWORD:-}" ]; then
            echo "ERROR: RKMS_KEY_PASSWORD secret missing."
            exit 1
          fi

          echo "$RKMS_KEYSTORE_BASE64" | base64 --decode > rkms-release.keystore

          test -s rkms-release.keystore

          echo "Release keystore prepared."


      # ============================================================
      # 34. CONFIGURE GRADLE 8.11.1
      # ============================================================

      - name: Configure Gradle 8.11.1
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR/android"

          GRADLE_VERSION="8.11.1"

          if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            mkdir -p gradle/wrapper
          fi

          cat > gradle/wrapper/gradle-wrapper.properties <<EOF
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\\://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip
          networkTimeout=100000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          echo "Gradle version configured: $GRADLE_VERSION"


      # ============================================================
      # 35. CONFIGURE RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          if "signingConfigs" not in s:
              s = s.replace(
                  "android {",
                  """android {
              signingConfigs {
                  release {
                      storeFile file("../../rkms-release.keystore")
                      storePassword System.getenv("RKMS_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("RKMS_KEY_ALIAS")
                      keyPassword System.getenv("RKMS_KEY_PASSWORD")
                  }
              }
          """,
                  1
              )

          if "signingConfig signingConfigs.release" not in s:
              s = s.replace(
                  "buildTypes {",
                  """buildTypes {
              release {
                  signingConfig signingConfigs.release
              }
          """,
                  1
              )

          p.write_text(s)

          print("Release signing configuration added.")
          PY


      # ============================================================
      # 36. BUILD SIGNED RELEASE AAB
      # ============================================================

      - name: Build signed Release AAB
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR/android"

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            bundleRelease


      # ============================================================
      # 37. LOCATE AAB
      # ============================================================

      - name: Locate AAB
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          AAB="$(find android/app/build/outputs/bundle/release \
            -type f \
            -name '*.aab' \
            | head -1)"

          if [ -z "$AAB" ]; then
            echo "ERROR: Release AAB not found."
            exit 1
          fi

          echo "AAB=$AAB" >> "$GITHUB_ENV"

          echo "Release AAB:"
          echo "$AAB"


      # ============================================================
      # 38. VERIFY AAB SIGNATURE
      # ============================================================

      - name: Verify AAB signature
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB"

          echo "AAB signature verification: PASS"


      # ============================================================
      # 39. SHA256
      # ============================================================

      - name: Calculate AAB SHA256
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          sha256sum "$AAB"


      # ============================================================
      # 40. UPLOAD AAB ARTIFACT
      # ============================================================

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Android-16-API36-Release-AAB
          path: ${{ env.SOURCE_DIR }}/${{ env.AAB }}
          if-no-files-found: error
          retention-days: 30

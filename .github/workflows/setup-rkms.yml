name: RKMS Final Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  APP_ID: "org.rkms.connect"
  SOURCE_ZIP: "RKMS_CONNECT_FINAL_AUDITED_RELEASE_APK_BUILD_20260922.zip"

jobs:
  build:
    name: RKMS Final Signed Release APK
    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # NODE
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false


      # ============================================================
      # JAVA
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # ============================================================
      # HOST PACKAGES
      # ============================================================

      - name: Install required host packages
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            rsync

          echo "HOST PACKAGES: PASS"


      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      - name: Install Android API 36 SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          test -d \
            "$ANDROID_HOME/platforms/android-${ANDROID_API}"

          test -d \
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}"

          test -x \
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt"

          test -x \
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

          echo "ANDROID API 36: PASS"
          echo "BUILD TOOLS 36.0.0: PASS"


      # ============================================================
      # LOCATE SOURCE
      # ============================================================

      - name: Locate RKMS source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_PATH="$GITHUB_WORKSPACE/$SOURCE_ZIP"

          if [ ! -s "$SOURCE_PATH" ]; then
            echo "::error::Source ZIP not found:"
            echo "$SOURCE_PATH"

            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -name "*.zip" \
              -print || true

            exit 1
          fi

          SOURCE_SHA256="$(
            sha256sum "$SOURCE_PATH" | awk '{print $1}'
          )"

          echo "SOURCE ZIP:"
          echo "$SOURCE_PATH"

          echo "SOURCE SHA256:"
          echo "$SOURCE_SHA256"

          echo "RKMS_SOURCE_ZIP=$SOURCE_PATH" >> "$GITHUB_ENV"
          echo "RKMS_SOURCE_SHA256=$SOURCE_SHA256"


      # ============================================================
      # EXTRACT SOURCE
      # ============================================================

      - name: Extract RKMS source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            "$GITHUB_WORKSPACE/rkms-source"

          mkdir -p \
            "$GITHUB_WORKSPACE/rkms-source"

          unzip -q \
            "$RKMS_SOURCE_ZIP" \
            -d "$GITHUB_WORKSPACE/rkms-source"

          PACKAGE_FILE="$(
            find "$GITHUB_WORKSPACE/rkms-source" \
              -type f \
              -name "package.json" \
              -not -path "*/node_modules/*" \
              -print \
              -quit
          )"

          if [ -z "$PACKAGE_FILE" ]; then
            echo "::error::package.json not found."
            exit 1
          fi

          RKMS_ROOT="$(dirname "$PACKAGE_FILE")"
          RKMS_ROOT="$(cd "$RKMS_ROOT" && pwd)"

          echo "RKMS_ROOT=$RKMS_ROOT" >> "$GITHUB_ENV"

          echo "RKMS ROOT:"
          echo "$RKMS_ROOT"


      # ============================================================
      # REPAIR MALFORMED OLD NATIVE SCRIPT
      # ============================================================

      - name: Repair RKMS native setup script
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          SCRIPT="scripts/setup-android-native.sh"

          test -s "$SCRIPT"

          cp \
            "$SCRIPT" \
            "$SCRIPT.before-repair"

          python3 - "$SCRIPT" <<'PY'
          import sys
          import subprocess
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          marker = "# Stable white notification icon for FCM system notifications."

          if marker not in text:

              result = subprocess.run(
                  ["bash", "-n", str(path)],
                  capture_output=True,
                  text=True
              )

              if result.returncode == 0:
                  print("Native setup script is already valid.")
                  raise SystemExit(0)

              raise SystemExit(
                  "Native setup script is malformed and repair marker was not found."
              )

          marker_pos = text.index(marker)

          start = text.rfind(
              "python3 - <<'PY3'",
              0,
              marker_pos
          )

          if start < 0:
              raise SystemExit(
                  "Malformed native script start marker not found."
              )

          end_marker = "\nPY3"

          end = text.find(
              end_marker,
              marker_pos
          )

          if end < 0:
              raise SystemExit(
                  "Malformed native script end marker not found."
              )

          end += len(end_marker)

          replacement = r'''# Stable white notification icon for FCM system notifications.

          DRAWABLE_DIR="$RES_DIR/drawable"

          mkdir -p "$DRAWABLE_DIR"

          cat > "$DRAWABLE_DIR/ic_stat_rkms.xml" <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M12,2A7,7 0,0 0,5 9v4l-2,3v1h18v-1l-2,-3V9A7,7 0,0 0,12 2M9,19a3,3 0,0 0,6 0z"/>
          </vector>
          XML

          python3 - <<'PYMANIFEST'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")

          if not p.exists():
              raise SystemExit("AndroidManifest.xml not found")

          s = p.read_text()

          if "android.permission.RECORD_AUDIO" not in s:
              pos = s.find("<application")

              if pos < 0:
                  raise SystemExit("AndroidManifest application tag missing")

              s = (
                  s[:pos]
                  + '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
                  + s[pos:]
              )

          if "android.permission.POST_NOTIFICATIONS" not in s:
              pos = s.find("<application")

              if pos < 0:
                  raise SystemExit("AndroidManifest application tag missing")

              s = (
                  s[:pos]
                  + '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
                  + s[pos:]
              )

          closing = "</application>"

          if closing not in s:
              raise SystemExit(
                  "AndroidManifest application closing tag missing"
              )

          channel_meta = (
              '    <meta-data '
              'android:name="com.google.firebase.messaging.default_notification_channel_id" '
              'android:value="@string/rkms_default_notification_channel_id" />\n'
          )

          icon_meta = (
              '    <meta-data '
              'android:name="com.google.firebase.messaging.default_notification_icon" '
              'android:resource="@drawable/ic_stat_rkms" />\n'
          )

          if (
              "com.google.firebase.messaging.default_notification_channel_id"
              not in s
          ):
              s = s.replace(
                  closing,
                  channel_meta + closing,
                  1
              )

          if (
              "com.google.firebase.messaging.default_notification_icon"
              not in s
          ):
              s = s.replace(
                  closing,
                  icon_meta + closing,
                  1
              )

          p.write_text(s)
          print("AndroidManifest notification configuration repaired.")
          PYMANIFEST
          '''

          text = (
              text[:start]
              + replacement
              + text[end:]
          )

          path.write_text(text)

          print("Malformed native setup block repaired successfully.")
          PY

          chmod +x "$SCRIPT"

          bash -n "$SCRIPT"

          echo "RKMS NATIVE SCRIPT REPAIR: PASS"


      # ============================================================
      # ADD BOTH NOTIFICATION CHANNELS
      #
      # IMPORTANT:
      # Old ZIP contains normal channel only.
      # This step adds the priority channel to BOTH:
      # 1. app.js
      # 2. native Android setup
      # ============================================================

      - name: Repair RKMS notification channels
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          test -s app.js
          test -s scripts/setup-android-native.sh

          # --------------------------------------------------------
          # app.js
          # --------------------------------------------------------

          python3 <<'PY'
          from pathlib import Path

          p = Path("app.js")
          s = p.read_text()

          normal = "rkms_notifications_v2"
          priority = "rkms_priority_v1"

          if priority not in s:

              marker = (
                  "await Push.createChannel?.({"
                  "id:'rkms_notifications_v2'"
              )

              pos = s.find(marker)

              if pos < 0:
                  raise SystemExit(
                      "Normal notification channel creation not found in app.js"
                  )

              close = s.find("});", pos)

              if close < 0:
                  raise SystemExit(
                      "Normal notification channel block closing not found"
                  )

              close += 3

              priority_code = (
                  "\n"
                  "  try{await Push.createChannel?.({"
                  "id:'rkms_priority_v1',"
                  "name:'RKMS Important Notifications',"
                  "description:'Important RKMS organisation notices',"
                  "importance:5,"
                  "visibility:1,"
                  "sound:'default',"
                  "vibration:true,"
                  "lights:true"
                  "});}catch(e){console.warn('RKMS priority notification channel setup unavailable',e)}"
              )

              s = (
                  s[:close]
                  + priority_code
                  + s[close:]
              )

          p.write_text(s)

          print("app.js notification channels: PASS")
          PY

          # --------------------------------------------------------
          # Native Android setup
          # --------------------------------------------------------

          python3 <<'PY'
          from pathlib import Path

          p = Path("scripts/setup-android-native.sh")
          s = p.read_text()

          normal = "rkms_notifications_v2"
          priority = "rkms_priority_v1"

          if priority not in s:

              needle = (
                  "if (nm != null) nm.createNotificationChannel(channel);"
              )

              if needle not in s:
                  raise SystemExit(
                      "Native normal notification channel creation not found"
                  )

              priority_java = r'''
              android.app.NotificationChannel priority =
                  new android.app.NotificationChannel(
                      "rkms_priority_v1",
                      "RKMS Important Notifications",
                      android.app.NotificationManager.IMPORTANCE_HIGH
                  );
              priority.setDescription(
                  "Important RKMS organisation notices"
              );
              priority.enableVibration(true);
              priority.setSound(
                  android.provider.Settings.System.DEFAULT_NOTIFICATION_URI,
                  null
              );

              if (nm != null) {
                  nm.createNotificationChannel(priority);
              }'''

              s = s.replace(
                  needle,
                  needle + "\n" + priority_java,
                  1
              )

          p.write_text(s)

          print("Native notification channels: PASS")
          PY

          bash -n \
            scripts/setup-android-native.sh

          node --check \
            app.js

          echo "NORMAL CHANNEL: rkms_notifications_v2"
          echo "PRIORITY CHANNEL: rkms_priority_v1"
          echo "NOTIFICATION CHANNEL REPAIR: PASS"


      # ============================================================
      # SOURCE STRUCTURE
      # ============================================================

      - name: Verify RKMS source structure
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          REQUIRED_FILES=(
            "package.json"
            "package-lock.json"
            "app.js"
            "index.html"
            "styles.css"
            "capacitor.config.json"
            "google-services.json"
            "scripts/setup-android-native.sh"
            "scripts/configure-android-16.sh"
            "scripts/configure-release-signing.sh"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -s "$FILE" ]; then
              echo "::error::Missing required file: $FILE"
              exit 1
            fi
          done

          node --check app.js

          python3 -m json.tool \
            capacitor.config.json \
            >/dev/null

          python3 -m json.tool \
            google-services.json \
            >/dev/null

          bash -n \
            scripts/setup-android-native.sh

          bash -n \
            scripts/configure-android-16.sh

          bash -n \
            scripts/configure-release-signing.sh

          echo "SOURCE STRUCTURE: PASS"


      # ============================================================
      # CAPACITOR VERSION
      # ============================================================

      - name: Verify Capacitor package versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node <<'NODE'
          const fs = require("fs");

          const p = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const d = Object.assign(
            {},
            p.dependencies || {},
            p.devDependencies || {}
          );

          const wanted = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          for (const [name, version] of Object.entries(wanted)) {
            if (d[name] !== version) {
              throw new Error(
                `${name}: expected ${version}, found ${d[name] || "MISSING"}`
              );
            }
          }

          if (
            !p.scripts ||
            typeof p.scripts.build !== "string" ||
            !p.scripts.build.trim()
          ) {
            throw new Error("Build script missing");
          }

          console.log("CAPACITOR VERSION CHECK: PASS");
          NODE


      # ============================================================
      # FIREBASE
      # ============================================================

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node <<'NODE'
          const fs = require("fs");

          const d = JSON.parse(
            fs.readFileSync("google-services.json", "utf8")
          );

          const ok = (d.client || []).some(
            c =>
              c.client_info &&
              c.client_info.android_client_info &&
              c.client_info.android_client_info.package_name ===
              "org.rkms.connect"
          );

          if (!ok) {
            throw new Error(
              "org.rkms.connect not found in google-services.json"
            );
          }

          console.log("FIREBASE CONFIGURATION: PASS");
          NODE


      # ============================================================
      # NOTIFICATION SOURCE
      # ============================================================

      - name: Verify notification source
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          test -s app.js

          grep -Fq \
            "@capacitor/push-notifications" \
            package.json

          grep -Fq \
            "rkms_notifications_v2" \
            app.js

          grep -Fq \
            "rkms_priority_v1" \
            app.js

          node --check app.js

          echo "NORMAL NOTIFICATION SOURCE: PASS"
          echo "PRIORITY NOTIFICATION SOURCE: PASS"


      # ============================================================
      # NPM
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm ci \
            --no-audit \
            --no-fund

          echo "NPM INSTALL: PASS"


      # ============================================================
      # WEB BUILD
      # ============================================================

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm run build

          test -s \
            dist/index.html

          echo "WEB BUILD: PASS"


      # ============================================================
      # CAPACITOR ANDROID
      # ============================================================

      - name: Generate Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          rm -rf android

          npx cap add android

          test -s \
            android/gradlew

          test -s \
            android/app/build.gradle

          chmod +x \
            android/gradlew

          echo "CAPACITOR ANDROID PROJECT: PASS"


      # ============================================================
      # ANDROID 16 API 36
      # ============================================================

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

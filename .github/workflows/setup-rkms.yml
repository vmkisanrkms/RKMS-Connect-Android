name: RKMS Android 16 API 36 - Final Signed Release APK Only

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  AGP_VERSION: "8.9.1"
  GRADLE_VERSION: "8.11.1"
  APP_ID: "org.rkms.connect"
  MIN_SDK: "23"
  TARGET_SDK: "36"
  SOURCE_ZIP: "RKMS_CONNECT_FINAL_AUDITED_RELEASE_APK_BUILD_20260922.zip"
  SOURCE_SHA256: "6907af2bd83ccb6a36b0aa177861ae0731c6f53501430b9fe05fd5b905d65299"

jobs:

  build:

    name: RKMS Final Signed Release APK

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. NODE 22
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false


      # ============================================================
      # 3. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # ============================================================
      # 4. HOST PACKAGES
      # ============================================================

      - name: Install host packages
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y unzip rsync perl

          echo "HOST PACKAGES: PASS"


      # ============================================================
      # 5. VERIFY EXACT SOURCE ZIP
      # ============================================================

      - name: Verify exact source ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s "$SOURCE_ZIP" ]; then
            echo "::error::Source ZIP not found."
            echo "Expected: $SOURCE_ZIP"

            find . \
              -maxdepth 5 \
              -type f \
              -name "*.zip" \
              -not -path "./.git/*" \
              -print \
              | sort

            exit 1
          fi

          ACTUAL_SHA="$(
            sha256sum "$SOURCE_ZIP" |
            awk '{print $1}'
          )"

          echo "SOURCE ZIP SHA256:"
          echo "$ACTUAL_SHA"

          echo "EXPECTED SHA256:"
          echo "$SOURCE_SHA256"

          if [ "$ACTUAL_SHA" != "$SOURCE_SHA256" ]; then
            echo "::error::SOURCE ZIP SHA256 MISMATCH."
            echo "::error::Expected: $SOURCE_SHA256"
            echo "::error::Actual:   $ACTUAL_SHA"
            exit 1
          fi

          echo "SOURCE ZIP: PASS"


      # ============================================================
      # 6. EXTRACT
      # ============================================================

      - name: Extract RKMS source ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf rkms-build
          mkdir -p rkms-build

          unzip -q \
            "$SOURCE_ZIP" \
            -d rkms-build

          echo "ZIP EXTRACTION: PASS"


      # ============================================================
      # 7. LOCATE PROJECT ROOT
      # ============================================================

      - name: Locate RKMS project root
        shell: bash
        run: |
          set -euo pipefail

          ROOT=""

          if [ -f "rkms-build/final_audit_src/package.json" ]; then

            ROOT="rkms-build/final_audit_src"

          elif [ -f "rkms-build/package.json" ]; then

            ROOT="rkms-build"

          else

            PACKAGE_FILE="$(
              find rkms-build \
                -type f \
                -name "package.json" \
                -not -path "*/node_modules/*" \
                -print \
                | head -n 1 \
                || true
            )"

            if [ -n "$PACKAGE_FILE" ]; then
              ROOT="$(dirname "$PACKAGE_FILE")"
            fi

          fi

          if [ -z "$ROOT" ]; then
            echo "::error::package.json not found."
            exit 1
          fi

          echo "RKMS_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "RKMS_ROOT=$ROOT"


      # ============================================================
      # 8. SOURCE STRUCTURE
      # ============================================================

      - name: Verify source structure
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          for FILE in \
            package.json \
            package-lock.json \
            app.js \
            index.html \
            styles.css \
            capacitor.config.json \
            google-services.json \
            scripts/setup-android-native.sh \
            scripts/configure-android-16.sh \
            scripts/configure-release-signing.sh \
            scripts/verify-android-16.py \
            scripts/verify-rkms-final-fixes.py \
            scripts/verify-fcm-pipeline.py
          do

            if [ ! -s "$FILE" ]; then
              echo "::error::Missing required file: $FILE"
              exit 1
            fi

          done

          node --check app.js

          echo "SOURCE STRUCTURE: PASS"


      # ============================================================
      # 9. CAPACITOR VERSIONS
      # ============================================================

      - name: Verify Capacitor versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node <<'NODE'
          const fs = require("fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const deps = {
            ...(pkg.dependencies || {}),
            ...(pkg.devDependencies || {})
          };

          const required = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          let failed = false;

          for (const [name, wanted] of Object.entries(required)) {

            const actual = deps[name];

            console.log(
              `${name}: ${actual || "MISSING"}`
            );

            if (actual !== wanted) {
              failed = true;
            }

          }

          if (failed) {
            process.exit(1);
          }

          console.log(
            "CAPACITOR VERSION CHECK: PASS"
          );
          NODE


      # ============================================================
      # 10. FIREBASE JSON
      # ============================================================

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync("google-services.json", "utf8")
          );

          const found = (data.client || []).some(
            client =>
              client.client_info &&
              client.client_info.android_client_info &&
              client.client_info.android_client_info.package_name ===
              "org.rkms.connect"
          );

          if (!found) {
            throw new Error(
              "google-services.json does not contain org.rkms.connect"
            );
          }

          console.log(
            "FIREBASE PACKAGE CHECK: PASS"
          );
          NODE


      # ============================================================
      # 11. NPM INSTALL
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm ci \
            --no-audit \
            --no-fund

          echo "NPM INSTALL: PASS"


      # ============================================================
      # 12. WEB BUILD
      # ============================================================

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm run build

          test -s dist/index.html

          echo "WEB BUILD: PASS"


      # ============================================================
      # 13. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ============================================================
      # 14. ANDROID API 36
      # ============================================================

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --licenses \
            >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          test -n "$SDK_ROOT"

          test -x \
            "$SDK_ROOT/build-tools/$BUILD_TOOLS/aapt"

          test -x \
            "$SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner"

          echo "ANDROID API 36: PASS"


      # ============================================================
      # 15. CREATE CAPACITOR ANDROID
      # ============================================================

      - name: Generate Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          rm -rf android

          npx cap add android

          test -s android/gradlew
          test -s android/app/build.gradle
          test -s android/variables.gradle

          echo "CAPACITOR ANDROID PROJECT: PASS"


      # ============================================================
      # 16. CONFIGURE ANDROID 16
      # ============================================================

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/configure-android-16.sh

          bash -n \
            scripts/configure-android-16.sh

          ./scripts/configure-android-16.sh

          echo "ANDROID 16 CONFIGURATION: PASS"


      # ============================================================
      # 17. FORCE MIN SDK 23
      # ============================================================

      - name: Force minimum SDK 23
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 <<'PY'
          from pathlib import Path
          import re

          files = list(
              Path("android").rglob("*.gradle")
          ) + list(
              Path("android").rglob("*.gradle.kts")
          )

          for path in files:

              text = path.read_text(
                  encoding="utf-8"
              )

              text = re.sub(
                  r'(\bminSdkVersion\s*=\s*)22\b',
                  r'\g<1>23',
                  text
              )

              text = re.sub(
                  r'(\bminSdk\s*=\s*)22\b',
                  r'\g<1>23',
                  text
              )

              text = re.sub(
                  r'(\bminSdkVersion\s+)\s*22\b',
                  r'\g<1>23',
                  text
              )

              text = re.sub(
                  r'(\bminSdk\s+)\s*22\b',
                  r'\g<1>23',
                  text
              )

              path.write_text(
                  text,
                  encoding="utf-8"
              )

          print("MIN SDK 23: PASS")
          PY


      # ============================================================
      # 18. CAPACITOR SYNC
      # ============================================================

      - name: Capacitor sync
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npx cap sync android

          echo "CAPACITOR SYNC: PASS"


      # ============================================================
      # 19. REPAIR KNOWN MALFORMED NATIVE SCRIPT
      # ============================================================

      - name: Repair malformed RKMS native setup script
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          SCRIPT="scripts/setup-android-native.sh"

          test -s "$SCRIPT"

          SETUP_SHA="$(
            sha256sum "$SCRIPT" |
            awk '{print $1}'
          )"

          echo "Native setup script SHA:"
          echo "$SETUP_SHA"

          if [ "$SETUP_SHA" = "d8cdb6c16fb4c6ac768a4ca515f42224097a77419ca5bccd9dd38ab990b3e305" ]; then

            echo "KNOWN MALFORMED SCRIPT DETECTED."

            rm -f /tmp/setup-rkms-fixed.sh

            sed -n '1,90p' \
              "$SCRIPT" \
              > /tmp/setup-rkms-fixed.sh

            printf '%s\n' \
              '# RKMS SAFE REPAIRED ICON' \
              'DRAWABLE_DIR="$RES_DIR/drawable"' \
              'mkdir -p "$DRAWABLE_DIR"' \
              'printf "%s\n" '\''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">'\'' '\''    <path android:fillColor="#FFFFFFFF" android:pathData="M12,2A7,7 0,0 0,5 9v4l-2,3v1h18v-1l-2,-3V9A7,7 0,0 0,12 2M9,19a3,3 0,0 0,6 0z"/>'\'' '\''</vector>'\'' > "$DRAWABLE_DIR/ic_stat_rkms.xml"' \
              >> /tmp/setup-rkms-fixed.sh

            sed -n '118,$p' \
              "$SCRIPT" \
              >> /tmp/setup-rkms-fixed.sh

            chmod +x \
              /tmp/setup-rkms-fixed.sh

            bash -n \
              /tmp/setup-rkms-fixed.sh

            mv \
              /tmp/setup-rkms-fixed.sh \
              "$SCRIPT"

            echo "MALFORMED SCRIPT REPAIR: PASS"

          else

            echo "Known malformed-script hash not present."
            echo "Keeping native script unchanged."

          fi

          chmod +x \
            "$SCRIPT"

          bash -n \
            "$SCRIPT"

          echo "NATIVE SCRIPT SYNTAX: PASS"


      # ============================================================
      # 20. RUN RKMS NATIVE SETUP
      # ============================================================

      - name: Setup RKMS native Android layer
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/setup-android-native.sh

          bash -n \
            scripts/setup-android-native.sh

          ./scripts/setup-android-native.sh

          echo "RKMS NATIVE ANDROID SETUP: PASS"


      # ============================================================
      # 21. ENSURE MIN SDK 23 AFTER NATIVE SETUP
      # ============================================================

      - name: Finalize minimum SDK 23
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          find android \
            -type f \
            \( \
              -name "*.gradle" \
              -o \
              -name "*.gradle.kts" \
            \) \
            -print0 |
          while IFS= read -r -d '' FILE; do

            perl -pi -e \
              's/(minSdkVersion\s*=\s*)22\b/${1}23/g' \
              "$FILE"

            perl -pi -e \
              's/(minSdkVersion\s+)\s*22\b/${1}23/g' \
              "$FILE"

            perl -pi -e \
              's/(minSdk\s*=\s*)22\b/${1}23/g' \
              "$FILE"

            perl -pi -e \
              's/(minSdk\s+)\s*22\b/${1}23/g' \
              "$FILE"

          done

          if grep -RInE \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            'minSdkVersion[[:space:]]*=?[[:space:]]*22([[:space:]]|$)|minSdk[[:space:]]*=?[[:space:]]*22([[:space:]]|$)' \
            android
          then
            echo "::error::minSdk 22 still exists."
            exit 1
          fi

          echo "MIN SDK 23 FINAL: PASS"


      # ============================================================
      # 22. LOCATE MANIFEST
      # ============================================================

      - name: Locate generated AndroidManifest
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          test -s "$MANIFEST"

          echo "MANIFEST=$MANIFEST" >> "$GITHUB_ENV"

          echo "MANIFEST=$MANIFEST"


      # ============================================================
      # 23. FORCE MANIFEST REQUIREMENTS
      #
      # This step FIXES the manifest before checking it.
      # ============================================================

      - name: Ensure final Android manifest requirements
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 - "$MANIFEST" <<'PY'
          import sys
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path(sys.argv[1])

          text = path.read_text(
              encoding="utf-8"
          )

          # --------------------------------------------------------
          # Remove duplicate permissions.
          # --------------------------------------------------------

          text = re.sub(
              r'\s*<uses-permission\s+android:name="android\.permission\.RECORD_AUDIO"\s*/>\s*',
              '\n',
              text
          )

          text = re.sub(
              r'\s*<uses-permission\s+android:name="android\.permission\.POST_NOTIFICATIONS"\s*/>\s*',
              '\n',
              text
          )

          # --------------------------------------------------------
          # Find complete manifest opening tag.
          # --------------------------------------------------------

          manifest_match = re.search(
              r'<manifest\b[^>]*>',
              text,
              flags=re.IGNORECASE | re.DOTALL
          )

          if not manifest_match:
              raise SystemExit(
                  "Manifest opening tag not found."
              )

          permissions = (
              "\n"
              '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n'
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
          )

          text = (
              text[:manifest_match.end()]
              + permissions
              + text[manifest_match.end():]
          )

          # --------------------------------------------------------
          # Ensure predictive-back on application tag.
          # --------------------------------------------------------

          attribute = (
              'android:enableOnBackInvokedCallback="true"'
          )

          app_match = re.search(
              r'<application\b[^>]*>',
              text,
              flags=re.IGNORECASE | re.DOTALL
          )

          if not app_match:
              raise SystemExit(
                  "Application tag not found."
              )

          application_opening = app_match.group(0)

          application_opening = re.sub(
              r'\s+android:enableOnBackInvokedCallback="[^"]*"',
              '',
              application_opening
          )

          application_opening = (
              application_opening[:-1]
              + " "
              + attribute
              + ">"
          )

          text = (
              text[:app_match.start()]
              + application_opening
              + text[app_match.end():]
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          # --------------------------------------------------------
          # XML validation.
          # --------------------------------------------------------

          try:
              ET.parse(path)
          except Exception as exc:
              print("ANDROID MANIFEST XML INVALID")
              print(exc)
              raise SystemExit(1)

          final_text = path.read_text(
              encoding="utf-8"
          )

          required = [
              'android:name="android.permission.RECORD_AUDIO"',
              'android:name="android.permission.POST_NOTIFICATIONS"',
              'android:enableOnBackInvokedCallback="true"'
          ]

          for item in required:
              if item not in final_text:
                  raise SystemExit(
                      "Missing manifest requirement: " + item
                  )

          print("MANIFEST XML: PASS")
          print("RECORD_AUDIO: PASS")
          print("POST_NOTIFICATIONS: PASS")
          print("PREDICTIVE BACK: PASS")
          print("FINAL MANIFEST REQUIREMENTS: PASS")
          PY


      # ============================================================
      # 24. FINAL MANIFEST VERIFICATION
      # ============================================================

      - name: Verify generated Android manifest
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          test -s "$MANIFEST"

          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          ET.parse(sys.argv[1])

          print("MANIFEST XML: PASS")
          PY

          grep -Fq \
            'android:name="android.permission.RECORD_AUDIO"' \
            "$MANIFEST"

          grep -Fq \
            'android:name="android.permission.POST_NOTIFICATIONS"' \
            "$MANIFEST"

          grep -Fq \
            'android:enableOnBackInvokedCallback="true"' \
            "$MANIFEST"

          echo "RECORD_AUDIO: PASS"
          echo "POST_NOTIFICATIONS: PASS"
          echo "PREDICTIVE BACK: PASS"
          echo "GENERATED MANIFEST: PASS"


      # ============================================================
      # 25. FIREBASE CONFIGURATION
      # ============================================================

      - name: Verify Firebase Android configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          test -s \
            android/app/google-services.json

          grep -Fq \
            "org.rkms.connect" \
            android/app/google-services.json

          grep -Fq \
            "com.google.firebase:firebase-messaging" \
            android/app/build.gradle

          grep -Fq \
            "com.google.firebase:firebase-bom" \
            android/app/build.gradle

          echo "FIREBASE ANDROID CONFIGURATION: PASS"


      # ============================================================
      # 26. ROBUST FIREBASE INITIALIZATION
      # ============================================================

      - name: Verify Firebase initialization
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          MAIN="$(
            find android/app/src/main \
              -type f \
              \( \
                -name "MainActivity.java" \
                -o \
                -name "MainActivity.kt" \
              \) \
              -print \
              | head -n 1 \
              || true
          )"

          if [ -z "$MAIN" ]; then
            echo "::error::MainActivity.java/MainActivity.kt not found."
            exit 1
          fi

          echo "MAIN ACTIVITY: $MAIN"

          if grep -Fq \
            "FirebaseApp.initializeApp(this)" \
            "$MAIN"
          then

            echo "Firebase initialization already present."

          elif [[ "$MAIN" == *.java ]]; then

            python3 - "$MAIN" <<'PY'
          import sys
          import re
          from pathlib import Path

          path = Path(sys.argv[1])

          text = path.read_text(
              encoding="utf-8"
          )

          if "FirebaseApp.initializeApp(this)" in text:
              print("Firebase initialization already present.")
              raise SystemExit(0)

          marker = re.search(
              r'super\.onCreate\s*\([^;]*\)\s*;',
              text
          )

          if marker:

              insertion = (
                  marker.group(0)
                  + '\n'
                  + '        com.google.firebase.FirebaseApp.initializeApp(this);'
              )

              text = (
                  text[:marker.start()]
                  + insertion
                  + text[marker.end():]
              )

          else:

              class_match = list(
                  re.finditer(
                      r'\bclass\s+MainActivity\b[^{]*\{',
                      text
                  )
              )

              if not class_match:
                  raise SystemExit(
                      "MainActivity class not found."
                  )

              start = class_match[-1].end()

              method = """
          
              @Override
              public void onCreate(android.os.Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  com.google.firebase.FirebaseApp.initializeApp(this);
              }
          """

              text = (
                  text[:start]
                  + method
                  + text[start:]
              )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "Firebase initialization repaired."
          )
          PY

          else

            python3 - "$MAIN" <<'PY'
          import sys
          import re
          from pathlib import Path

          path = Path(sys.argv[1])

          text = path.read_text(
              encoding="utf-8"
          )

          if "FirebaseApp.initializeApp(this)" in text:
              print("Firebase initialization already present.")
              raise SystemExit(0)

          marker = re.search(
              r'super\.onCreate\s*\([^)]*\)',
              text
          )

          if marker:

              end = marker.end()

              text = (
                  text[:end]
                  + '\n        com.google.firebase.FirebaseApp.initializeApp(this)'
                  + text[end:]
              )

          else:

              class_match = list(
                  re.finditer(
                      r'\bclass\s+MainActivity\b[^{]*\{',
                      text
                  )
              )

              if not class_match:
                  raise SystemExit(
                      "MainActivity class not found."
                  )

              start = class_match[-1].end()

              method = """
              
              override fun onCreate(
                  savedInstanceState: android.os.Bundle?
              ) {
                  super.onCreate(savedInstanceState)
                  com.google.firebase.FirebaseApp.initializeApp(this)
              }
          """

              text = (
                  text[:start]
                  + method
                  + text[start:]
              )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "Firebase initialization repaired."
          )
          PY

          fi

          grep -Fq \
            "FirebaseApp.initializeApp(this)" \
            "$MAIN"

          echo "FIREBASE INITIALIZATION: PASS"


      # ============================================================
      # 27. RKMS NATIVE BRIDGE
      # ============================================================

      - name: Verify RKMS native bridge
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          BRIDGE="$(
            find android/app/src/main \
              -type f \
              -name "RKMSNativeBridge.java" \
              -print \
              | head -n 1 \
              || true
          )"

          if [ -z "$BRIDGE" ]; then
            echo "::error::RKMSNativeBridge.java not found."
            exit 1
          fi

          grep -Fq \
            "AndroidKeyStore" \
            "$BRIDGE"

          grep -Fq \
            "CredentialManager" \
            "$BRIDGE"

          echo "RKMS NATIVE BRIDGE: PASS"


      # ============================================================
      # 28. POST-GENERATION AUDITS
      # ============================================================

      - name: Run post-generation RKMS audits
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 \
            scripts/verify-android-16.py

          python3 \
            scripts/verify-rkms-final-fixes.py

          if [ -f \
            "scripts/verify-native-bridge.py" \
          ]; then
            python3 \
              scripts/verify-native-bridge.py
          fi

          python3 \
            scripts/verify-fcm-pipeline.py

          if [ -f \
            "scripts/verify-saved-login.py" \
          ]; then
            python3 \
              scripts/verify-saved-login.py
          fi

          if [ -f \
            "scripts/verify-android-pdf.py" \
          ]; then
            python3 \
              scripts/verify-android-pdf.py
          fi

          echo "POST-GENERATION AUDITS: PASS"


      # ============================================================
      # 29. FINAL SDK CHECK
      # ============================================================

      - name: Final Android 16 SDK verification
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          if [ -f \
            android/variables.gradle \
          ]; then

            grep -Eq \
              'compileSdkVersion[[:space:]]*=[[:space:]]*36' \
              android/variables.gradle

            grep -Eq \
              'targetSdkVersion[[:space:]]*=[[:space:]]*36' \
              android/variables.gradle

            grep -Eq \
              'minSdkVersion[[:space:]]*=[[:space:]]*23' \
              android/variables.gradle

          fi

          grep -Fq \
            'android:enableOnBackInvokedCallback="true"' \
            "$MANIFEST"

          echo "COMPILE SDK 36: PASS"
          echo "TARGET SDK 36: PASS"
          echo "MIN SDK 23: PASS"
          echo "PREDICTIVE BACK: PASS"


      # ============================================================
      # 30. SIGNING SECRETS
      # ============================================================

      - name: Verify release signing secrets
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n \
            "${RKMS_KEYSTORE_BASE64:-}" || {
              echo "::error::RKMS_KEYSTORE_BASE64 missing."
              exit 1
            }

          test -n \
            "${RKMS_KEYSTORE_PASSWORD:-}" || {
              echo "::error::RKMS_KEYSTORE_PASSWORD missing."
              exit 1
            }

          test -n \
            "${RKMS_KEY_ALIAS:-}" || {
              echo "::error::RKMS_KEY_ALIAS missing."
              exit 1
            }

          test -n \
            "${RKMS_KEY_PASSWORD:-}" || {
              echo "::error::RKMS_KEY_PASSWORD missing."
              exit 1
            }

          echo "SIGNING SECRETS: PASS"


      # ============================================================
      # 31. CONFIGURE RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/configure-release-signing.sh

          bash -n \
            scripts/configure-release-signing.sh

          ./scripts/configure-release-signing.sh

          test -s \
            android/app/release.keystore

          grep -Fq \
            'storeFile file("release.keystore")' \
            android/app/build.gradle

          grep -Fq \
            'signingConfig signingConfigs.release' \
            android/app/build.gradle

          echo "RELEASE SIGNING: PASS"


      # ============================================================
      # 32. KEYSTORE VALIDATION
      # ============================================================

      - name: Verify release keystore
        shell: bash
        env:
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          keytool \
            -list \
            -keystore android/app/release.keystore \
            -storepass "$RKMS_KEYSTORE_PASSWORD" \
            -alias "$RKMS_KEY_ALIAS" \
            >/dev/null

          echo "KEYSTORE VALIDATION: PASS"


      # ============================================================
      # 33. GRADLE
      # ============================================================

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          chmod +x gradlew

          ./gradlew \
            --version \
            --no-daemon

          echo "GRADLE VALIDATION: PASS"


      # ============================================================
      # 34. CLEAN
      # ============================================================

      - name: Clean Android build
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          ./gradlew \
            clean \
            --no-daemon

          echo "ANDROID CLEAN: PASS"


      # ============================================================
      # 35. BUILD FINAL SIGNED RELEASE APK ONLY
      # ============================================================

      - name: Build final signed release APK only
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          echo "=============================================="
          echo "RKMS FINAL SIGNED RELEASE APK"
          echo "=============================================="

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then

            echo "::error::Release APK was not created."

            find app/build/outputs \
              -type f \
              -print \
              | sort

            exit 1
          fi

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"

          echo \
            "APK_PATH=$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk" \
            >> "$GITHUB_ENV"

          echo "FINAL SIGNED RELEASE APK BUILD: PASS"


      # ============================================================
      # 36. VERIFY APK
      # ============================================================

      - name: Verify final APK package and signature
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          AAPT="$SDK_ROOT/build-tools/$BUILD_TOOLS/aapt"
          APKSIGNER="$SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner"

          test -x "$AAPT"
          test -x "$APKSIGNER"
          test -s "$APK_PATH"

          "$AAPT" \
            dump badging \
            "$APK_PATH" \
            | tee \
            "$GITHUB_WORKSPACE/apk-badging.txt"

          grep -Fq \
            "package: name='$APP_ID'" \
            "$GITHUB_WORKSPACE/apk-badging.txt"

          grep -Fq \
            "targetSdkVersion:'36'" \
            "$GITHUB_WORKSPACE/apk-badging.txt"

          "$APKSIGNER" \
            verify \
            --verbose \
            "$APK_PATH"

          "$APKSIGNER" \
            verify \
            --print-certs \
            "$APK_PATH"

          echo "APK PACKAGE: PASS"
          echo "TARGET SDK 36: PASS"
          echo "APK SIGNATURE: PASS"


      # ============================================================
      # 37. SHA256
      # ============================================================

      - name: Generate APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            "$APK_PATH" \
            | tee \
            "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256"

          echo "APK SHA256: PASS"


      # ============================================================
      # 38. FINAL APK ONLY AUDIT
      # ============================================================

      - name: Final APK-only audit
        shell: bash
        run: |
          set -euo pipefail

          test -s \
            "$APK_PATH"

          test -s \
            "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256"

          if find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.aab" \
            -print \
            | grep -q .
          then

            echo "::error::AAB detected."
            exit 1

          fi

          if find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "*debug*.apk" \
            -print \
            | grep -q .
          then

            echo "::error::Debug APK detected."
            exit 1

          fi

          SIZE="$(
            stat \
              -c%s \
              "$APK_PATH"
          )"

          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::APK size unexpectedly small."
            exit 1
          fi

          echo "=============================================="
          echo "FINAL APK AUDIT: PASS"
          echo "=============================================="

          echo "APK: RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"
          echo "SIGNED: YES"
          echo "DEBUG: NO"
          echo "AAB: NO"
          echo "SIZE: $SIZE bytes"


      # ============================================================
      # 39. UPLOAD FINAL APK
      # ============================================================

      - name: Upload final signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS_ANDROID16_API36_FINAL_SIGNED_RELEASE_APK
          if-no-files-found: error
          path: |
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256
          retention-days: 30

name: RKMS Android 16 API 36 FINAL APK AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release:
    name: RKMS Android 16 API 36 Release
    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. LOCATE RKMS SOURCE
      # ============================================================
      - name: Locate RKMS source
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "package.json" ] &&
             [ -f "app.js" ] &&
             [ -f "index.html" ]; then

            echo "SOURCE_DIR=." >> "$GITHUB_ENV"
            echo "RKMS source: repository root"

          else

            ZIP_FILE="$(find . \
              -maxdepth 3 \
              -type f \
              -name 'RKMS_CONNECT_*.zip' \
              -print \
              | sort \
              | tail -1 || true)"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: RKMS source ZIP not found."
              find . -maxdepth 3 -type f -name '*.zip' -print || true
              exit 1
            fi

            echo "Using ZIP: $ZIP_FILE"

            rm -rf .rkms_extract
            mkdir -p .rkms_extract

            unzip -q "$ZIP_FILE" -d .rkms_extract

            PACKAGE_JSON="$(find .rkms_extract \
              -type f \
              -name 'package.json' \
              -print \
              | head -1)"

            if [ -z "$PACKAGE_JSON" ]; then
              echo "ERROR: package.json not found in ZIP."
              exit 1
            fi

            SOURCE_DIR="$(dirname "$PACKAGE_JSON")"

            echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
            echo "SOURCE_DIR=$SOURCE_DIR"

          fi


      # ============================================================
      # 3. SOURCE VERIFICATION
      # ============================================================
      - name: Verify RKMS source
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          test -f package.json
          test -f app.js
          test -f index.html
          test -f styles.css
          test -f capacitor.config.json
          test -f google-services.json

          test -f assets/rkms-logo-transparent.png

          test -f scripts/configure-android-16.sh
          test -f scripts/setup-android-native.sh

          echo "RKMS source verification: PASS"


      # ============================================================
      # 4. NODE 22
      # ============================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      # ============================================================
      # 5. JDK 17
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 6. JAVASCRIPT CHECK
      # ============================================================
      - name: Verify JavaScript
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          node --version
          npm --version

          node --check app.js

          echo "app.js syntax: PASS"


      # ============================================================
      # 7. NPM INSTALL
      # ============================================================
      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

          echo "NPM install: PASS"


      # ============================================================
      # 8. TEAM RKMS SUPER ADMIN AUDIT
      # ============================================================
      - name: Audit Team RKMS Super Admin Chat
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          grep -Fq "team_rkms" app.js
          grep -Fq "A94473" app.js
          grep -Fq "b909411c-591d-4a57-9d8d-280842901331" app.js
          grep -Fq "teamRkmsAvatar" app.js
          grep -Fq "isTeamRKMSProfile" app.js
          grep -Fq "SUPER_ADMIN" app.js

          echo "Team RKMS identity: PASS"
          echo "Team RKMS member ID: PASS"
          echo "Team RKMS UUID: PASS"
          echo "Team RKMS logo function: PASS"
          echo "Super Admin chat support: PASS"


      # ============================================================
      # 9. RKMS STATIC AUDITS
      # ============================================================
      - name: Run RKMS verification scripts
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 scripts/verify-rkms-final.py
          python3 scripts/verify-member-directory-scope.py
          python3 scripts/verify-authority-hierarchy.py
          python3 scripts/verify-fcm-pipeline.py
          python3 scripts/verify-final-login-navigation.py
          python3 scripts/verify-saved-login.py
          python3 scripts/verify-native-bridge.py
          python3 scripts/verify-android-16.py

          echo "RKMS static audits: PASS"


      # ============================================================
      # 10. WEB BUILD
      # ============================================================
      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          npm run build

          test -f dist/index.html
          test -f dist/app.js
          test -f dist/assets/rkms-logo-transparent.png

          echo "Web build: PASS"


      # ============================================================
      # 11. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 12. INSTALL API 36
      # ============================================================
      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "Android API 36: PASS"
          echo "Build Tools 36.0.0: PASS"


      # ============================================================
      # 13. CAPACITOR ANDROID
      # ============================================================
      - name: Generate Capacitor Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          rm -rf android

          npx cap add android

          test -f android/app/build.gradle
          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml

          echo "Capacitor Android generation: PASS"


      # ============================================================
      # 14. CONFIGURE ANDROID 16
      # ============================================================
      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          chmod +x scripts/configure-android-16.sh

          ./scripts/configure-android-16.sh

          echo "Android 16 configuration: PASS"


      # ============================================================
      # 15. FORCE SDK 36
      # ============================================================
      - name: Force Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/variables.gradle")
          text = path.read_text()

          def set_value(name, value):
              global text
              pattern = rf'(\b{name}\s*=\s*)\d+'

              if re.search(pattern, text):
                  text = re.sub(
                      pattern,
                      rf'\g<1>{value}',
                      text
                  )
              else:
                  text += f'\n{name} = {value}\n'

          set_value("compileSdkVersion", 36)
          set_value("targetSdkVersion", 36)
          set_value("minSdkVersion", 23)

          path.write_text(text)

          print("compileSdkVersion = 36")
          print("targetSdkVersion  = 36")
          print("minSdkVersion     = 23")
          PY

          grep -Eq \
            'compileSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

          grep -Eq \
            'targetSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

          echo "Android SDK values: PASS"


      # ============================================================
      # 16. GRADLE 8.11.1
      # ============================================================
      - name: Configure Gradle 8.11.1
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR/android"

          mkdir -p gradle/wrapper

          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          networkTimeout=100000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          chmod +x gradlew

          echo "Gradle 8.11.1: PASS"


      # ============================================================
      # 17. CAPACITOR SYNC
      # ============================================================
      - name: Sync Capacitor Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          npx cap sync android

          echo "Capacitor sync: PASS"


      # ============================================================
      # 18. RKMS NATIVE LAYER
      # ============================================================
      - name: Configure RKMS native Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          chmod +x scripts/setup-android-native.sh

          ./scripts/setup-android-native.sh

          test -f \
            android/app/src/main/java/org/rkms/connect/MainActivity.java

          test -f \
            android/app/src/main/java/org/rkms/connect/RKMSNativeBridge.java

          test -f \
            android/app/google-services.json

          echo "RKMS native layer: PASS"


      # ============================================================
      # 19. FIREBASE CHECK
      # ============================================================
      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          test -s android/app/google-services.json

          python3 - <<'PY'
          import json

          with open(
              "android/app/google-services.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          packages = []

          for client in data.get("client", []):
              package_name = (
                  client
                  .get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

              if package_name:
                  packages.append(package_name)

          assert "org.rkms.connect" in packages, (
              "org.rkms.connect missing from Firebase configuration"
          )

          print("Firebase package: org.rkms.connect")
          print("Firebase configuration: PASS")
          PY


      # ============================================================
      # 20. FIREBASE INITIALIZATION
      # ============================================================
      - name: Verify Firebase initialization
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          MAIN="android/app/src/main/java/org/rkms/connect/MainActivity.java"

          test -f "$MAIN"

          grep -Fq \
            'FirebaseApp.initializeApp(this)' \
            "$MAIN"

          COUNT="$(
            grep -F \
              -o \
              'FirebaseApp.initializeApp(this)' \
              "$MAIN" \
              | wc -l
          )"

          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: Firebase initialization count = $COUNT"
            exit 1
          fi

          echo "Firebase initialization: PASS"


      # ============================================================
      # 21. APPLICATION ID
      # ============================================================
      - name: Verify application ID
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          grep -R -Fq \
            'org.rkms.connect' \
            android/app/build.gradle

          echo "Application ID org.rkms.connect: PASS"


      # ============================================================
      # 22. SIGNING SECRETS
      # ============================================================
      - name: Verify signing secrets
        shell: bash
        run: |
          set -euo pipefail

          test -n "${RKMS_KEYSTORE_BASE64:-}"
          test -n "${RKMS_KEYSTORE_PASSWORD:-}"
          test -n "${RKMS_KEY_ALIAS:-}"
          test -n "${RKMS_KEY_PASSWORD:-}"

          echo "Release signing secrets: PASS"


      # ============================================================
      # 23. PREPARE KEYSTORE
      # ============================================================
      - name: Prepare release keystore
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          echo "$RKMS_KEYSTORE_BASE64" \
            | base64 --decode \
            > rkms-release.keystore

          test -s rkms-release.keystore

          echo "Release keystore: PASS"


      # ============================================================
      # 24. RELEASE SIGNING
      # ============================================================
      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          if "signingConfigs {" not in text:

              block = """
          signingConfigs {
              release {
                  storeFile file("../../rkms-release.keystore")
                  storePassword System.getenv("RKMS_KEYSTORE_PASSWORD")
                  keyAlias System.getenv("RKMS_KEY_ALIAS")
                  keyPassword System.getenv("RKMS_KEY_PASSWORD")
              }
          }

          """

              text = text.replace(
                  "android {",
                  "android {\n" + block,
                  1
              )

          elif "rkms-release.keystore" not in text:

              block = """
              release {
                  storeFile file("../../rkms-release.keystore")
                  storePassword System.getenv("RKMS_KEYSTORE_PASSWORD")
                  keyAlias System.getenv("RKMS_KEY_ALIAS")
                  keyPassword System.getenv("RKMS_KEY_PASSWORD")
              }
          """

              text = text.replace(
                  "signingConfigs {",
                  "signingConfigs {\n" + block,
                  1
              )

          if "signingConfig signingConfigs.release" not in text:

              if "buildTypes {" not in text:
                  text += """
          buildTypes {
              release {
                  signingConfig signingConfigs.release
              }
          }
          """
              else:
                  text = text.replace(
                      "buildTypes {",
                      """buildTypes {
              release {
                  signingConfig signingConfigs.release
              }
          """,
                      1
                  )

          path.write_text(text)

          print("Release signing configured.")
          PY

          grep -Fq \
            'signingConfig signingConfigs.release' \
            android/app/build.gradle

          echo "Release signing configuration: PASS"


      # ============================================================
      # 25. GRADLE VERSION
      # ============================================================
      - name: Verify Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR/android"

          chmod +x gradlew

          ./gradlew --version

          echo "Gradle verification: PASS"


      # ============================================================
      # 26. CLEAN BUILD
      # ============================================================
      - name: Gradle clean
        working-directory: ${{ env.SOURCE_DIR }}/android
        run: |
          ./gradlew clean --no-daemon


      # ============================================================
      # 27. BUILD APK + AAB
      # ============================================================
      - name: Build signed APK and AAB
        working-directory: ${{ env.SOURCE_DIR }}/android
        run: |
          ./gradlew \
            assembleRelease \
            bundleRelease \
            --no-daemon \
            --stacktrace

          echo "APK + AAB Gradle build: PASS"


      # ============================================================
      # 28. VERIFY APK
      # ============================================================
      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          APK="android/app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          APKSIGNER="$SDK/build-tools/36.0.0/apksigner"

          test -x "$APKSIGNER"

          "$APKSIGNER" \
            verify \
            --verbose \
            "$APK"

          echo "Signed APK verification: PASS"

          ls -lh "$APK"


      # ============================================================
      # 29. VERIFY AAB
      # ============================================================
      - name: Verify signed AAB
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          test -s "$AAB"

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB"

          echo "Signed AAB verification: PASS"

          ls -lh "$AAB"


      # ============================================================
      # 30. PREPARE RELEASE
      # ============================================================
      - name: Prepare final release
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          rm -rf release
          mkdir -p release

          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          cp \
            android/app/build/outputs/bundle/release/app-release.aab \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab

          sha256sum \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk \
            > release/RKMS_APK_SHA256.txt

          sha256sum \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab \
            > release/RKMS_AAB_SHA256.txt

          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab

          cat release/RKMS_APK_SHA256.txt
          cat release/RKMS_AAB_SHA256.txt

          echo "Final release files: PASS"


      # ============================================================
      # 31. UPLOAD APK + AAB
      # ============================================================
      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Android-16-API36-FINAL-APK-AAB
          path: |
            ${{ env.SOURCE_DIR }}/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            ${{ env.SOURCE_DIR }}/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab
            ${{ env.SOURCE_DIR }}/release/RKMS_APK_SHA256.txt
            ${{ env.SOURCE_DIR }}/release/RKMS_AAB_SHA256.txt
          if-no-files-found: error
          retention-days: 90


      # ============================================================
      # 32. FINAL SUMMARY
      # ============================================================
      - name: FINAL BUILD SUMMARY
        shell: bash
        run: |
          echo ""
          echo "============================================================"
          echo "              RKMS FINAL BUILD SUCCESS"
          echo "============================================================"
          echo ""
          echo "Android API 36       : PASS"
          echo "compileSdk 36        : PASS"
          echo "targetSdk 36         : PASS"
          echo "Node.js 22           : PASS"
          echo "JDK 17               : PASS"
          echo "Firebase             : PASS"
          echo "FCM                  : PASS"
          echo "Native Bridge        : PASS"
          echo "Saved Login          : PASS"
          echo "Team RKMS Chat       : PASS"
          echo "RKMS Logo             : PASS"
          echo "Release Signing      : PASS"
          echo "APK                  : SIGNED"
          echo "AAB                  : SIGNED"
          echo ""
          echo "============================================================"

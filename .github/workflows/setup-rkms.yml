name: Build RKMS Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_SOURCE_COMMIT: cf252628308e5a6ecc9eafbaf4ca227a3ad8ec92
  WEBSITE_ZIP_NAME: RKMS_CONNECT_V9_WITH_EXACT_3_FIXES.zip
  GRADLE_VERSION: "8.10.2"
  ANDROID_BUILD_TOOLS: "35.0.0"

jobs:
  build:
    name: Build RKMS Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      # =========================================================
      # 1. Checkout repository
      # =========================================================
      - name: Checkout RKMS repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      # =========================================================
      # 2. Java 17
      # =========================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # 3. Node.js
      # =========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # =========================================================
      # 4. Prepare native Android project
      # =========================================================
      - name: Prepare native Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$RUNNER_TEMP/rkms-android"

          rm -rf "$PROJECT_DIR"

          echo "=========================================="
          echo "RKMS NATIVE ANDROID PROJECT"
          echo "=========================================="

          git clone \
            --no-tags \
            --filter=blob:none \
            "https://github.com/vmkisanrkms/RKMS-Connect-Android.git" \
            "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          echo ""
          echo "Fetching Android source commit..."

          git fetch \
            --no-tags \
            --depth 1 \
            origin "$ANDROID_SOURCE_COMMIT"

          git checkout --detach "$ANDROID_SOURCE_COMMIT"

          CURRENT_COMMIT="$(git rev-parse HEAD)"

          echo ""
          echo "Expected:"
          echo "$ANDROID_SOURCE_COMMIT"

          echo ""
          echo "Actual:"
          echo "$CURRENT_COMMIT"

          test "$CURRENT_COMMIT" = "$ANDROID_SOURCE_COMMIT"

          echo ""
          echo "Checking Android project..."

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/google-services.json
          test -f app/src/main/AndroidManifest.xml

          test -d app/src/main/java
          test -d app/src/main/res
          test -d app/src/main/assets

          echo ""
          echo "Checking FCM..."

          test -f app/src/main/java/org/rkms/connect/FCMTokenRegistrar.java
          test -f app/src/main/java/org/rkms/connect/RKMSFirebaseMessagingService.java
          test -f app/src/main/java/org/rkms/connect/NotificationHelper.java
          test -f app/src/main/java/org/rkms/connect/SessionStore.java

          echo ""
          echo "Native Android + FCM: PASS"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # =========================================================
      # 5. Locate V9 ZIP
      # =========================================================
      - name: Locate V9 Exact 3 Fixes ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/$WEBSITE_ZIP_NAME"

          echo "=========================================="
          echo "LOCATING V9 ZIP"
          echo "=========================================="

          echo ""
          echo "Expected:"
          echo "$ZIP_FILE"

          if [ ! -f "$ZIP_FILE" ]; then
            echo ""
            echo "::error::V9 Exact 3 Fixes ZIP not found."

            echo ""
            echo "Available ZIP files:"

            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "*.zip" \
              -not -path "*/.git/*" \
              -print

            exit 1
          fi

          test -s "$ZIP_FILE"

          echo ""
          echo "Selected ZIP:"
          ls -lh "$ZIP_FILE"

          echo "WEBSITE_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"

      # =========================================================
      # 6. Extract V9 ZIP
      # =========================================================
      - name: Extract V9 Exact 3 Fixes
        shell: bash
        run: |
          set -euo pipefail

          WEB_EXTRACT="$RUNNER_TEMP/rkms-web"

          rm -rf "$WEB_EXTRACT"
          mkdir -p "$WEB_EXTRACT"

          echo "=========================================="
          echo "EXTRACTING V9 WEB APP"
          echo "=========================================="

          unzip -q \
            "$WEBSITE_ZIP" \
            -d "$WEB_EXTRACT"

          test -f "$WEB_EXTRACT/index.html"
          test -f "$WEB_EXTRACT/app.js"
          test -f "$WEB_EXTRACT/styles.css"
          test -f "$WEB_EXTRACT/config.js"

          APP_JS="$WEB_EXTRACT/app.js"

          test -s "$APP_JS"

          echo ""
          echo "app.js size:"
          wc -c "$APP_JS"

          echo ""
          echo "JavaScript syntax check..."

          node --check "$APP_JS"

          echo ""
          echo "JavaScript syntax: PASS"

          echo "APP_JS=$APP_JS" >> "$GITHUB_ENV"
          echo "WEB_EXTRACT=$WEB_EXTRACT" >> "$GITHUB_ENV"

      # =========================================================
      # 7. FIX #1
      # PDA / Member geographic visibility
      # =========================================================
      - name: Verify Fix 1 Geographic Visibility
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FIX #1 - PDA / MEMBER GEOGRAPHIC VISIBILITY"
          echo "=========================================="

          grep -q \
            "rkmsOfficerCanAccessTarget" \
            "$APP_JS"

          grep -q \
            "rkmsOfficerCanAccessMember" \
            "$APP_JS"

          echo ""
          echo "PDA geographic scope: FOUND"
          echo "Member geographic scope: FOUND"

          echo ""
          echo "FIX #1: PASS"

      # =========================================================
      # 8. FIX #2
      # Appointment location hierarchy
      # =========================================================
      - name: Verify Fix 2 Appointment Location
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FIX #2 - APPOINTMENT LOCATION"
          echo "=========================================="

          grep -q \
            "rkmsAppointmentLevelKey" \
            "$APP_JS"

          grep -q \
            "rkmsAppointmentLocationVisibility" \
            "$APP_JS"

          grep -q \
            "applyAppointmentPostScope" \
            "$APP_JS"

          echo ""
          echo "Appointment level logic: FOUND"
          echo "Location visibility logic: FOUND"
          echo "Post scope logic: FOUND"

          echo ""
          echo "FIX #2: PASS"

      # =========================================================
      # 9. FIX #3
      # Chat live update
      # =========================================================
      - name: Verify Fix 3 Live Chat
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FIX #3 - CHAT LIVE UPDATE"
          echo "=========================================="

          grep -q \
            "rkmsChatLive" \
            "$APP_JS"

          grep -q \
            "startChatLiveRealtime" \
            "$APP_JS"

          grep -q \
            "postgres_changes" \
            "$APP_JS"

          grep -q \
            "setInterval" \
            "$APP_JS"

          grep -q \
            "visibilitychange" \
            "$APP_JS"

          echo ""
          echo "Live chat code: FOUND"
          echo "Realtime listener: FOUND"
          echo "Fallback polling: FOUND"
          echo "Foreground resync: FOUND"

          echo ""
          echo "FIX #3: PASS"

      # =========================================================
      # 10. Install V9 Web App
      # =========================================================
      - name: Install V9 Web App Into Android
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_WEB="$PROJECT_DIR/app/src/main/assets/www"

          echo "=========================================="
          echo "INSTALLING V9 WEB APP"
          echo "=========================================="

          rm -rf "$ANDROID_WEB"
          mkdir -p "$ANDROID_WEB"

          cp \
            "$WEB_EXTRACT/index.html" \
            "$ANDROID_WEB/"

          cp \
            "$WEB_EXTRACT/styles.css" \
            "$ANDROID_WEB/"

          cp \
            "$WEB_EXTRACT/app.js" \
            "$ANDROID_WEB/"

          cp \
            "$WEB_EXTRACT/config.js" \
            "$ANDROID_WEB/"

          if [ -f "$WEB_EXTRACT/manifest.webmanifest" ]; then
            cp \
              "$WEB_EXTRACT/manifest.webmanifest" \
              "$ANDROID_WEB/"
          fi

          if [ -d "$WEB_EXTRACT/assets" ]; then
            cp -a \
              "$WEB_EXTRACT/assets" \
              "$ANDROID_WEB/"
          fi

          test -s "$ANDROID_WEB/index.html"
          test -s "$ANDROID_WEB/app.js"
          test -s "$ANDROID_WEB/styles.css"
          test -s "$ANDROID_WEB/config.js"

          test -d "$ANDROID_WEB/assets"

          node --check \
            "$ANDROID_WEB/app.js"

          echo ""
          echo "V9 Web App installation: PASS"

          echo "ANDROID_WEB=$ANDROID_WEB" >> "$GITHUB_ENV"

      # =========================================================
      # 11. Verify 3 fixes after installation
      # =========================================================
      - name: Verify Installed Three Fixes
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FINAL THREE FIXES CHECK"
          echo "=========================================="

          echo ""
          echo "FIX #1..."

          grep -q \
            "rkmsOfficerCanAccessTarget" \
            "$ANDROID_WEB/app.js"

          grep -q \
            "rkmsOfficerCanAccessMember" \
            "$ANDROID_WEB/app.js"

          echo "FIX #1: PASS"

          echo ""
          echo "FIX #2..."

          grep -q \
            "rkmsAppointmentLevelKey" \
            "$ANDROID_WEB/app.js"

          grep -q \
            "rkmsAppointmentLocationVisibility" \
            "$ANDROID_WEB/app.js"

          grep -q \
            "applyAppointmentPostScope" \
            "$ANDROID_WEB/app.js"

          echo "FIX #2: PASS"

          echo ""
          echo "FIX #3..."

          grep -q \
            "rkmsChatLive" \
            "$ANDROID_WEB/app.js"

          grep -q \
            "startChatLiveRealtime" \
            "$ANDROID_WEB/app.js"

          grep -q \
            "postgres_changes" \
            "$ANDROID_WEB/app.js"

          grep -q \
            "setInterval" \
            "$ANDROID_WEB/app.js"

          grep -q \
            "visibilitychange" \
            "$ANDROID_WEB/app.js"

          echo "FIX #3: PASS"

          node --check \
            "$ANDROID_WEB/app.js"

          echo ""
          echo "ALL THREE FIXES: PASS"

      # =========================================================
      # 12. Verify Book
      # =========================================================
      - name: Verify Existing V9 Book
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CHECKING V9 BOOK"
          echo "=========================================="

          BOOK_DIR="$ANDROID_WEB/assets/book"

          test -d "$BOOK_DIR"

          PAGE_COUNT="$(
            find "$BOOK_DIR" \
              -type f \
              \( \
                -iname "page-*.jpg" \
                -o -iname "page-*.jpeg" \
                -o -iname "page-*.png" \
                -o -iname "page-*.webp" \
              \) \
              | wc -l
          )"

          echo ""
          echo "Book pages:"
          echo "$PAGE_COUNT"

          test "$PAGE_COUNT" -eq 60

          echo ""
          echo "Book 60 pages: PASS"

      # =========================================================
      # 13. Setup Android SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # =========================================================
      # 14. Install Android Build Tools
      #
      # IMPORTANT:
      # No yes | sdkmanager
      # No pipe
      # No find-based apksigner discovery
      # =========================================================
      - name: Install Android Build Tools
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ANDROID BUILD TOOLS"
          echo "=========================================="

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK path not found."
            exit 1
          fi

          echo ""
          echo "Android SDK:"
          echo "$SDK_ROOT"

          echo ""
          echo "Installing required Android packages..."

          sdkmanager \
            --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "build-tools;$ANDROID_BUILD_TOOLS"

          echo ""
          echo "Checking exact Build Tools directory..."

          BUILD_TOOLS_DIR="$SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS"

          if [ ! -d "$BUILD_TOOLS_DIR" ]; then
            echo "::error::Expected Build Tools directory was not created."
            echo "$BUILD_TOOLS_DIR"
            exit 1
          fi

          echo ""
          echo "Build Tools directory:"
          echo "$BUILD_TOOLS_DIR"

          echo ""
          echo "Checking apksigner..."

          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          if [ ! -f "$APKSIGNER" ]; then
            echo "::error::apksigner file does not exist:"
            echo "$APKSIGNER"

            echo ""
            echo "Files in Build Tools directory:"

            ls -la "$BUILD_TOOLS_DIR"

            exit 1
          fi

          chmod +x "$APKSIGNER"

          echo ""
          echo "apksigner found:"
          echo "$APKSIGNER"

          echo ""
          echo "Checking apksigner version..."

          "$APKSIGNER" version

          echo ""
          echo "Android Build Tools: PASS"

          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS_DIR=$BUILD_TOOLS_DIR" >> "$GITHUB_ENV"

      # =========================================================
      # 15. Setup Gradle
      # =========================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # =========================================================
      # 16. Create Gradle Wrapper
      # =========================================================
      - name: Create Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "GRADLE WRAPPER"
          echo "=========================================="

          gradle wrapper \
            --gradle-version "$GRADLE_VERSION" \
            --distribution-type bin

          chmod +x gradlew

          ./gradlew --version

          echo ""
          echo "Gradle wrapper: PASS"

      # =========================================================
      # 17. Existing RKMS release signing
      # =========================================================
      - name: Prepare Existing Release Signing
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "RKMS RELEASE SIGNING"
          echo "=========================================="

          KEYSTORE="$RUNNER_TEMP/rkms-release.keystore"

          if [ -z "$RKMS_KEYSTORE_BASE64" ] || \
             [ -z "$RKMS_KEYSTORE_PASSWORD" ] || \
             [ -z "$RKMS_KEY_ALIAS" ] || \
             [ -z "$RKMS_KEY_PASSWORD" ]; then

            echo ""
            echo "::error::Existing RKMS signing secrets are missing."

            echo ""
            echo "::error::Build stopped."

            echo ""
            echo "A temporary signing key will NOT be created."

            exit 1
          fi

          echo ""
          echo "Decoding existing keystore..."

          printf '%s' \
            "$RKMS_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$KEYSTORE"

          test -s "$KEYSTORE"

          echo ""
          echo "Checking existing keystore..."

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$RKMS_KEYSTORE_PASSWORD" \
            -alias "$RKMS_KEY_ALIAS" \
            >/dev/null

          echo ""
          echo "Existing RKMS signing key: PASS"

          echo "RKMS_KEYSTORE_PATH=$KEYSTORE" \
            >> "$GITHUB_ENV"

          echo "RKMS_KEYSTORE_PASSWORD=$RKMS_KEYSTORE_PASSWORD" \
            >> "$GITHUB_ENV"

          echo "RKMS_KEY_ALIAS=$RKMS_KEY_ALIAS" \
            >> "$GITHUB_ENV"

          echo "RKMS_KEY_PASSWORD=$RKMS_KEY_PASSWORD" \
            >> "$GITHUB_ENV"

      # =========================================================
      # 18. Final Android verification
      # =========================================================
      - name: Verify Native Android Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FINAL ANDROID VERIFICATION"
          echo "=========================================="

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/google-services.json
          test -f app/src/main/AndroidManifest.xml

          echo ""
          echo "Checking FCM..."

          test -f \
            app/src/main/java/org/rkms/connect/FCMTokenRegistrar.java

          test -f \
            app/src/main/java/org/rkms/connect/RKMSFirebaseMessagingService.java

          test -f \
            app/src/main/java/org/rkms/connect/NotificationHelper.java

          test -f \
            app/src/main/java/org/rkms/connect/SessionStore.java

          echo ""
          echo "Checking WebView..."

          test -f "$ANDROID_WEB/index.html"
          test -f "$ANDROID_WEB/app.js"
          test -f "$ANDROID_WEB/styles.css"
          test -f "$ANDROID_WEB/config.js"

          echo ""
          echo "Native Android: PASS"
          echo "FCM: PASS"
          echo "WebView assets: PASS"

      # =========================================================
      # 19. Build Release APK
      # =========================================================
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILDING RELEASE APK"
          echo "=========================================="

          chmod +x gradlew

          ./gradlew clean assembleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "Release APK build: PASS"

      # =========================================================
      # 20. Locate APK
      # =========================================================
      - name: Locate Release APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching release APK..."

          APK="$(
            find "$PROJECT_DIR" \
              -type f \
              -path "*/build/outputs/apk/release/*.apk" \
              -print \
              -quit
          )"

          if [ -z "$APK" ]; then

            echo "::error::Release APK not found."

            echo ""
            echo "Available APK files:"

            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          test -s "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo ""
          echo "APK found:"
          echo "$APK"

          echo ""
          ls -lh "$APK"

      # =========================================================
      # 21. Verify APK signature
      # =========================================================
      - name: Verify APK Signature
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING APK SIGNATURE"
          echo "=========================================="

          test -s "$APK"

          if [ -z "${APKSIGNER:-}" ]; then
            echo "::error::APKSIGNER path is missing."
            exit 1
          fi

          if [ ! -f "$APKSIGNER" ]; then
            echo "::error::APKSIGNER file not found:"
            echo "$APKSIGNER"
            exit 1
          fi

          chmod +x "$APKSIGNER"

          echo ""
          echo "Using apksigner:"
          echo "$APKSIGNER"

          echo ""
          echo "APK:"
          echo "$APK"

          echo ""
          echo "Running signature verification..."

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

          echo ""
          echo "APK signature verification: PASS"

      # =========================================================
      # 22. Final APK verification
      # =========================================================
      - name: Final APK Verification
        shell: bash
        run: |
          set -euo pipefail

          test -s "$APK"

          echo "=========================================="
          echo "FINAL APK CHECK"
          echo "=========================================="

          echo ""
          echo "APK size:"

          ls -lh "$APK"

          echo ""
          echo "Final signature verification..."

          "$APKSIGNER" verify "$APK"

          echo ""
          echo "FINAL APK: PASS"

      # =========================================================
      # 23. Upload final APK
      # =========================================================
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-Final-Exact-3-Fixes
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 14

      # =========================================================
      # 24. Upload final app.js
      # =========================================================
      - name: Upload Final app.js
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Final-Exact-3-Fixes-app-js
          path: ${{ env.PROJECT_DIR }}/app/src/main/assets/www/app.js
          if-no-files-found: error
          retention-days: 14

      # =========================================================
      # 25. SUCCESS
      # =========================================================
      - name: Build Complete
        shell: bash
        run: |
          echo ""
          echo "=================================================="
          echo "          RKMS RELEASE BUILD SUCCESS"
          echo "=================================================="
          echo ""

          echo "FIX #1 PDA/Member Geographic Visibility : PASS"
          echo "FIX #2 Appointment Post Location       : PASS"
          echo "FIX #3 Chat Live Update                 : PASS"

          echo ""
          echo "Native Android                         : PASS"
          echo "FCM                                     : PASS"
          echo "V9 Book                                 : 60 pages"
          echo "Build Tools                             : PASS"
          echo "Release Signing                         : PASS"
          echo "APK Signature                           : PASS"
          echo "APK                                     : BUILT"

          echo ""
          echo "=================================================="
          echo "                  BUILD SUCCESS"
          echo "=================================================="

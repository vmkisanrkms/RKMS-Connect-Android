name: RKMS Android 16 API 36 - Final Signed Release APK Only

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  NODE_VERSION: "22"
  JAVA_VERSION: "17"

  AGP_VERSION: "8.9.1"
  GRADLE_VERSION: "8.11.1"

  FIREBASE_BOM_VERSION: "34.19.0"
  GOOGLE_SERVICES_VERSION: "4.5.0"
  CREDENTIALS_VERSION: "1.5.0"

  APP_ID: "org.rkms.connect"
  MIN_SDK: "23"
  TARGET_SDK: "36"

  # Preferred source ZIP.
  SOURCE_ZIP_NAME: "RKMS_CONNECT_FINAL_GROUP_MANAGEMENT_COMPLETE_VERIFIED_20260920.zip"

  # Fallback ZIP currently used in the repository when preferred ZIP
  # is not present.
  FALLBACK_SOURCE_ZIP_NAME: "RKMS_CONNECT_GROUP_PHOTO_SCHEMA_FIXED_FINAL_20260920.zip"

  APK_NAME: "RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"


jobs:

  build:

    name: Build Final Signed Release APK Only

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. SHOW REPOSITORY ZIP FILES
      # ============================================================

      - name: List repository ZIP files
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "RKMS ZIP FILES IN REPOSITORY"
          echo "=============================================="

          find . \
            -type f \
            -iname "*.zip" -o -iname "*.ZIP" \
            -print \
            | sort || true


      # ============================================================
      # 3. SELECT RKMS SOURCE ZIP
      #
      # Preferred ZIP is used first.
      # If it is not present, the known current RKMS source ZIP
      # is used automatically.
      # ============================================================

      - name: Verify and select RKMS source ZIP
        shell: bash
        run: |
          set -euo pipefail

          SELECTED=""

          echo "Preferred source:"
          echo "${SOURCE_ZIP_NAME}"

          if [ -f "./${SOURCE_ZIP_NAME}" ]; then
            SELECTED="./${SOURCE_ZIP_NAME}"
            echo "Preferred source ZIP found."
          fi

          if [ -z "$SELECTED" ]; then
            echo ""
            echo "Preferred ZIP not found."
            echo "Checking fallback source:"
            echo "${FALLBACK_SOURCE_ZIP_NAME}"

            if [ -f "./${FALLBACK_SOURCE_ZIP_NAME}" ]; then
              SELECTED="./${FALLBACK_SOURCE_ZIP_NAME}"
              echo "Fallback source ZIP found."
            fi
          fi

          if [ -z "$SELECTED" ]; then
            echo ""
            echo "::error::No valid RKMS source ZIP found."

            echo ""
            echo "Available ZIP files:"
            find . \
              -type f \
              -iname "*.zip" -o -iname "*.ZIP" \
              -print \
              | sort || true

            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "SELECTED RKMS SOURCE"
          echo "=============================================="
          echo "$SELECTED"

          ls -lh "$SELECTED"

          echo "SOURCE_ZIP=$SELECTED" >> "$GITHUB_ENV"


      # ============================================================
      # 4. SOURCE ZIP SHA256
      # ============================================================

      - name: Generate source ZIP SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum "$SOURCE_ZIP" \
            | tee source-zip.sha256

          echo ""
          echo "Source ZIP SHA256:"
          cat source-zip.sha256


      # ============================================================
      # 5. EXTRACT SOURCE
      # ============================================================

      - name: Extract RKMS source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build-project

          mkdir -p build-project

          unzip -q \
            "$SOURCE_ZIP" \
            -d build-project

          echo ""
          echo "Source extraction PASS."


      # ============================================================
      # 6. DETECT PROJECT ROOT
      # ============================================================

      - name: Detect RKMS project root
        shell: bash
        run: |
          set -euo pipefail

          ROOT=""

          if [ -f "build-project/package.json" ]; then

            ROOT="build-project"

          else

            FOUND_PACKAGE="$(
              find build-project \
                -type f \
                -name "package.json" \
                -not -path "*/node_modules/*" \
                -print \
                | head -n 1 \
                || true
            )"

            if [ -n "$FOUND_PACKAGE" ]; then
              ROOT="$(dirname "$FOUND_PACKAGE")"
            fi

          fi

          if [ -z "$ROOT" ]; then
            echo "::error::package.json not found."
            exit 1
          fi

          echo "RKMS_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo ""
          echo "RKMS_ROOT:"
          echo "$ROOT"


      # ============================================================
      # 7. VALIDATE SOURCE
      # ============================================================

      - name: Validate RKMS source
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          REQUIRED_FILES=(
            "package.json"
            "app.js"
            "index.html"
            "styles.css"
            "capacitor.config.json"
            "google-services.json"
            "scripts/setup-android-native.sh"
            "scripts/configure-android-16.sh"
          )

          for file in "${REQUIRED_FILES[@]}"; do

            if [ ! -f "$file" ]; then
              echo "::error::Missing required file: $file"
              exit 1
            fi

            echo "OK: $file"

          done

          echo ""
          echo "Required source validation PASS."


      # ============================================================
      # 8. VERIFY JAVASCRIPT
      # ============================================================

      - name: Verify app.js syntax
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node --check app.js

          echo "app.js syntax PASS."


      # ============================================================
      # 9. VERIFY SHELL SCRIPTS
      # ============================================================

      - name: Verify shell scripts
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          while IFS= read -r -d '' script; do

            echo "Checking:"
            echo "$script"

            bash -n "$script"

          done < <(
            find scripts \
              -type f \
              -name "*.sh" \
              -print0
          )

          echo ""
          echo "Shell script syntax PASS."


      # ============================================================
      # 10. NODE 22
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ env.RKMS_ROOT }}/package-lock.json


      # ============================================================
      # 11. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 12. VERIFY CAPACITOR
      # ============================================================

      - name: Verify Capacitor versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node <<'NODE'
          const fs = require("fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const deps = {
            ...(pkg.dependencies || {}),
            ...(pkg.devDependencies || {})
          };

          const required = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          let failed = false;

          for (const [name, version] of Object.entries(required)) {

            const actual = deps[name];

            console.log(
              `${name}: required=${version}, actual=${actual || "MISSING"}`
            );

            if (!actual) {
              failed = true;
              continue;
            }

            const normalized = String(actual);

            if (
              normalized !== version &&
              normalized !== `^${version}` &&
              normalized !== `~${version}`
            ) {
              console.error(
                `${name}: expected ${version}, found ${normalized}`
              );

              failed = true;
            }

          }

          if (failed) {
            process.exit(1);
          }

          console.log(
            "Capacitor validation PASS."
          );
          NODE


      # ============================================================
      # 13. NPM INSTALL
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          if [ -f package-lock.json ]; then

            npm ci \
              --no-audit \
              --no-fund

          else

            npm install \
              --no-audit \
              --no-fund

          fi

          echo "npm dependencies PASS."


      # ============================================================
      # 14. BUILD WEB
      # ============================================================

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm run build

          if [ ! -d dist ]; then
            echo "::error::dist directory was not generated."
            exit 1
          fi

          echo "Web build PASS."


      # ============================================================
      # 15. ANDROID SDK BASE SETUP
      #
      # IMPORTANT:
      # Do NOT request package "tools".
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"


      # ============================================================
      # 16. INSTALL ANDROID API 36 + BUILD TOOLS
      # ============================================================

      - name: Install Android API 36 and Build Tools 36.0.0
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK" ]; then
            echo "::error::ANDROID_SDK_ROOT/ANDROID_HOME is not set."
            exit 1
          fi

          echo "ANDROID SDK:"
          echo "$SDK"

          SDKMANAGER=""

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then

            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          else

            SDKMANAGER="$(
              find "$SDK/cmdline-tools" \
                -type f \
                -name sdkmanager \
                -print \
                | head -n 1 \
                || true
            )"

          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then

            echo "::error::sdkmanager not found."

            find "$SDK" \
              -type f \
              -name sdkmanager \
              -print \
              || true

            exit 1

          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" \
            --licenses \
            >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo ""
          echo "Android API 36 installation PASS."


      # ============================================================
      # 17. VERIFY SDK
      # ============================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          test -d \
            "$SDK/platforms/android-36"

          test -d \
            "$SDK/build-tools/36.0.0"

          test -x \
            "$SDK/build-tools/36.0.0/aapt"

          test -x \
            "$SDK/build-tools/36.0.0/apksigner"

          echo ""
          echo "Android Platform 36: PASS"
          echo "Build Tools 36.0.0: PASS"
          echo "aapt: PASS"
          echo "apksigner: PASS"


      # ============================================================
      # 18. CREATE CAPACITOR ANDROID PROJECT
      # ============================================================

      - name: Create Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          rm -rf android

          npx cap add android

          echo "Capacitor Android project created."


      # ============================================================
      # 19. CAPACITOR SYNC
      # ============================================================

      - name: Capacitor sync Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npx cap sync android

          echo "Capacitor sync PASS."


      # ============================================================
      # 20. RUN RKMS ANDROID CONFIGURATION
      # ============================================================

      - name: Run RKMS Android 16 configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/configure-android-16.sh

          bash -n \
            scripts/configure-android-16.sh

          ./scripts/configure-android-16.sh

          echo "RKMS Android configuration PASS."


      # ============================================================
      # 21. FORCE EXPLICIT ANDROID SDK VALUES
      #
      # THIS IS THE IMPORTANT FIX.
      #
      # compileSdk is placed directly in app/build.gradle.
      # ============================================================

      - name: Configure Android API 36 in app module
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          APP_GRADLE="android/app/build.gradle"
          VARIABLES_GRADLE="android/variables.gradle"

          test -f "$APP_GRADLE"

          echo "=============================================="
          echo "CONFIGURING ANDROID API 36"
          echo "=============================================="

          # --------------------------------------------------------
          # Write a clean variables.gradle
          # --------------------------------------------------------

          cat > "$VARIABLES_GRADLE" <<'EOF'
          ext {
              minSdkVersion = 23
              compileSdkVersion = 36
              targetSdkVersion = 36
          }
          EOF

          # --------------------------------------------------------
          # Modify app/build.gradle
          # --------------------------------------------------------

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")

          s = p.read_text(
              encoding="utf-8"
          )

          # ------------------------------------------------------
          # Verify android block
          # ------------------------------------------------------

          if not re.search(
              r'^\s*android\s*\{',
              s,
              flags=re.MULTILINE
          ):
              raise SystemExit(
                  "ERROR: android { block not found."
              )

          # ------------------------------------------------------
          # Remove existing compileSdk declarations
          # ------------------------------------------------------

          s = re.sub(
              r'^[ \t]*(?:compileSdkVersion|compileSdk)\s+.*\r?$',
              '',
              s,
              flags=re.MULTILINE
          )

          # ------------------------------------------------------
          # Remove existing minSdk declarations
          # ------------------------------------------------------

          s = re.sub(
              r'^[ \t]*(?:minSdkVersion|minSdk)\s+.*\r?$',
              '',
              s,
              flags=re.MULTILINE
          )

          # ------------------------------------------------------
          # Remove existing targetSdk declarations
          # ------------------------------------------------------

          s = re.sub(
              r'^[ \t]*(?:targetSdkVersion|targetSdk)\s+.*\r?$',
              '',
              s,
              flags=re.MULTILINE
          )

          # ------------------------------------------------------
          # Add compileSdk 36 directly inside android {}
          # ------------------------------------------------------

          s = re.sub(
              r'^(\s*android\s*\{)',
              r'\1\n    compileSdk 36',
              s,
              count=1,
              flags=re.MULTILINE
          )

          # ------------------------------------------------------
          # Verify defaultConfig
          # ------------------------------------------------------

          if not re.search(
              r'^\s*defaultConfig\s*\{',
              s,
              flags=re.MULTILINE
          ):
              raise SystemExit(
                  "ERROR: defaultConfig { block not found."
              )

          # ------------------------------------------------------
          # Add minSdk and targetSdk
          # ------------------------------------------------------

          s = re.sub(
              r'^(\s*defaultConfig\s*\{)',
              r'\1\n'
              r'        minSdk 23\n'
              r'        targetSdk 36',
              s,
              count=1,
              flags=re.MULTILINE
          )

          p.write_text(
              s,
              encoding="utf-8"
          )

          print(
              "compileSdk 36 added."
          )

          print(
              "minSdk 23 added."
          )

          print(
              "targetSdk 36 added."
          )
          PY

          echo ""
          echo "=============================================="
          echo "SDK VALUES AFTER CONFIGURATION"
          echo "=============================================="

          grep -nE \
            'compileSdk|minSdk|targetSdk' \
            android/app/build.gradle

          echo ""
          echo "variables.gradle:"
          cat android/variables.gradle


      # ============================================================
      # 22. VERIFY EXPLICIT SDK VALUES
      # ============================================================

      - name: Verify explicit Android SDK configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          grep -Eq \
            '^[[:space:]]*compileSdk[[:space:]]+36' \
            android/app/build.gradle

          grep -Eq \
            '^[[:space:]]*minSdk[[:space:]]+23' \
            android/app/build.gradle

          grep -Eq \
            '^[[:space:]]*targetSdk[[:space:]]+36' \
            android/app/build.gradle

          echo ""
          echo "compileSdk 36: PASS"
          echo "minSdk 23: PASS"
          echo "targetSdk 36: PASS"


      # ============================================================
      # 23. VERIFY GRADLE PROJECT BEFORE FURTHER CHANGES
      # ============================================================

      - name: Verify Gradle project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          chmod +x gradlew

          ./gradlew \
            :app:tasks \
            --no-daemon \
            --stacktrace

          echo ""
          echo "Gradle project configuration PASS."


      # ============================================================
      # 24. NORMALIZE GRADLE WRAPPER
      # ============================================================

      - name: Configure Gradle 8.11.1
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          WRAPPER="gradle/wrapper/gradle-wrapper.properties"

          test -f "$WRAPPER"

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "gradle/wrapper/gradle-wrapper.properties"
          )

          s = p.read_text(
              encoding="utf-8"
          )

          url = (
              "https://services.gradle.org/distributions/"
              "gradle-8.11.1-bin.zip"
          )

          if re.search(
              r'^distributionUrl=.*$',
              s,
              flags=re.MULTILINE
          ):

              s = re.sub(
                  r'^distributionUrl=.*$',
                  'distributionUrl=' + url,
                  s,
                  flags=re.MULTILINE
              )

          else:

              s += "\ndistributionUrl=" + url + "\n"

          p.write_text(
              s,
              encoding="utf-8"
          )
          PY

          grep -Fq \
            "gradle-8.11.1-bin.zip" \
            "$WRAPPER"

          echo "Gradle 8.11.1 configured."


      # ============================================================
      # 25. FIREBASE JSON
      # ============================================================

      - name: Install Firebase google-services.json
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          test -f google-services.json

          mkdir -p android/app

          cp \
            google-services.json \
            android/app/google-services.json

          test -f \
            android/app/google-services.json

          echo "Firebase google-services.json installed."


      # ============================================================
      # 26. FIREBASE PACKAGE CHECK
      # ============================================================

      - name: Verify Firebase package
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 <<'PY'
          import json

          with open(
              "android/app/google-services.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          found = False

          for client in data.get("client", []):

              package_name = (
                  client
                  .get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

              if package_name == "org.rkms.connect":
                  found = True
                  break

          if not found:
              raise SystemExit(
                  "ERROR: Firebase package org.rkms.connect not found."
              )

          print(
              "Firebase package PASS."
          )
          PY


      # ============================================================
      # 27. RUN RKMS NATIVE ANDROID SETUP
      # ============================================================

      - name: Configure RKMS native Android bridge
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/setup-android-native.sh

          bash -n \
            scripts/setup-android-native.sh

          ./scripts/setup-android-native.sh

          echo "RKMS native Android setup PASS."


      # ============================================================
      # 28. RE-ENFORCE SDK AFTER NATIVE SETUP
      #
      # Native script may modify build.gradle.
      # Therefore compileSdk 36 is enforced again.
      # ============================================================

      - name: Re-enforce Android API 36 after native setup
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "android/app/build.gradle"
          )

          s = p.read_text(
              encoding="utf-8"
          )

          # Remove all old declarations.

          s = re.sub(
              r'^[ \t]*(?:compileSdkVersion|compileSdk)\s+.*\r?$',
              '',
              s,
              flags=re.MULTILINE
          )

          s = re.sub(
              r'^[ \t]*(?:minSdkVersion|minSdk)\s+.*\r?$',
              '',
              s,
              flags=re.MULTILINE
          )

          s = re.sub(
              r'^[ \t]*(?:targetSdkVersion|targetSdk)\s+.*\r?$',
              '',
              s,
              flags=re.MULTILINE
          )

          if not re.search(
              r'^\s*android\s*\{',
              s,
              flags=re.MULTILINE
          ):
              raise SystemExit(
                  "android block missing."
              )

          s = re.sub(
              r'^(\s*android\s*\{)',
              r'\1\n    compileSdk 36',
              s,
              count=1,
              flags=re.MULTILINE
          )

          if not re.search(
              r'^\s*defaultConfig\s*\{',
              s,
              flags=re.MULTILINE
          ):
              raise SystemExit(
                  "defaultConfig block missing."
              )

          s = re.sub(
              r'^(\s*defaultConfig\s*\{)',
              r'\1\n'
              r'        minSdk 23\n'
              r'        targetSdk 36',
              s,
              count=1,
              flags=re.MULTILINE
          )

          p.write_text(
              s,
              encoding="utf-8"
          )

          print(
              "Post-native SDK normalization PASS."
          )
          PY

          echo ""
          grep -nE \
            'compileSdk|minSdk|targetSdk' \
            android/app/build.gradle


      # ============================================================
      # 29. VERIFY NATIVE BRIDGE
      # ============================================================

      - name: Verify RKMS Native Bridge
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          BRIDGE="$(
            find android/app/src/main/java \
              -type f \
              -name "RKMSNativeBridge.java" \
              -print \
              | head -n 1 \
              || true
          )"

          if [ -z "$BRIDGE" ]; then
            echo "::error::RKMSNativeBridge.java not found."
            exit 1
          fi

          grep -Fq \
            "CredentialManager" \
            "$BRIDGE"

          grep -Fq \
            "CreatePasswordRequest" \
            "$BRIDGE"

          grep -Fq \
            "createCredentialAsync" \
            "$BRIDGE"

          grep -Fq \
            "savePassword" \
            "$BRIDGE"

          echo "RKMS Native Bridge PASS."
          echo "Bridge:"
          echo "$BRIDGE"


      # ============================================================
      # 30. VERIFY MICROPHONE + FILE PICKER
      # ============================================================

      - name: Verify microphone and file picker
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          grep -Fq \
            "RECORD_AUDIO" \
            scripts/setup-android-native.sh

          grep -Fq \
            "RESOURCE_AUDIO_CAPTURE" \
            scripts/setup-android-native.sh

          grep -Fq \
            "onShowFileChooser" \
            scripts/setup-android-native.sh

          grep -Fq \
            "MediaRecorder" \
            app.js

          echo "Microphone + file picker source checks PASS."


      # ============================================================
      # 31. KEYBOARD RESIZE
      # ============================================================

      - name: Verify keyboard resize
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          grep -Fq \
            "SOFT_INPUT_ADJUST_RESIZE" \
            scripts/setup-android-native.sh

          echo "Keyboard resize PASS."


      # ============================================================
      # 32. FIREBASE INITIALIZATION
      # ============================================================

      - name: Verify FirebaseApp initialization
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          MAIN_ACTIVITY="$(
            find android/app/src/main/java \
              -type f \
              -name "MainActivity.java" \
              -print \
              | head -n 1 \
              || true
          )"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "::error::MainActivity.java not found."
            exit 1
          fi

          grep -Fq \
            "FirebaseApp.initializeApp" \
            "$MAIN_ACTIVITY"

          echo "FirebaseApp initialization PASS."


      # ============================================================
      # 33. FIREBASE DEPENDENCIES
      # ============================================================

      - name: Configure Firebase dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "app/build.gradle"
          )

          s = p.read_text(
              encoding="utf-8"
          )

          marker = "dependencies {"

          if marker not in s:
              raise SystemExit(
                  "dependencies block missing."
              )

          deps = [
              'implementation platform("com.google.firebase:firebase-bom:34.19.0")',
              'implementation "com.google.firebase:firebase-messaging"',
              'implementation "androidx.credentials:credentials:1.5.0"',
              'implementation "androidx.credentials:credentials-play-services-auth:1.5.0"'
          ]

          for dep in deps:

              if dep not in s:

                  s = s.replace(
                      marker,
                      marker
                      + "\n    "
                      + dep,
                      1
                  )

          p.write_text(
              s,
              encoding="utf-8"
          )

          print(
              "Firebase + Credential Manager dependencies PASS."
          )
          PY


      # ============================================================
      # 34. GOOGLE SERVICES PLUGIN
      # ============================================================

      - name: Configure Google Services plugin
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path(
              "build.gradle"
          )

          s = root.read_text(
              encoding="utf-8"
          )

          # ------------------------------------------------------
          # Legacy classpath projects
          # ------------------------------------------------------

          if "com.google.gms:google-services:" in s:

              s = re.sub(
                  r'com\.google\.gms:google-services:[0-9.]+',
                  'com.google.gms:google-services:4.5.0',
                  s
              )

          # ------------------------------------------------------
          # If root dependencies block exists but Google Services
          # classpath is absent, add it.
          # ------------------------------------------------------

          elif "dependencies {" in s:

              s = s.replace(
                  "dependencies {",
                  "dependencies {\n"
                  '    classpath "com.google.gms:google-services:4.5.0"',
                  1
              )

          root.write_text(
              s,
              encoding="utf-8"
          )

          app = Path(
              "app/build.gradle"
          )

          a = app.read_text(
              encoding="utf-8"
          )

          # ------------------------------------------------------
          # Add Google Services plugin only when absent.
          # ------------------------------------------------------

          if "com.google.gms.google-services" not in a:

              if "plugins {" in a:

                  a = a.replace(
                      "plugins {",
                      "plugins {\n"
                      "    id 'com.google.gms.google-services'",
                      1
                  )

              else:

                  a = (
                      "apply plugin: "
                      "'com.google.gms.google-services'\n\n"
                      + a
                  )

          app.write_text(
              a,
              encoding="utf-8"
          )

          print(
              "Google Services plugin configuration PASS."
          )
          PY


      # ============================================================
      # 35. RELEASE SIGNING SECRETS
      #
      # IMPORTANT:
      # These are the same secret names used by the earlier
      # working RKMS workflow.
      # ============================================================

      - name: Verify release signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "${KEY_ALIAS:-}" ]; then
            echo "::error::ANDROID_KEY_ALIAS secret is missing."
            exit 1
          fi

          if [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::ANDROID_KEY_PASSWORD secret is missing."
            exit 1
          fi

          echo "Release signing secrets PASS."


      # ============================================================
      # 36. PREPARE RELEASE KEYSTORE
      # ============================================================

      - name: Prepare release signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          echo "$KEYSTORE_BASE64" \
            | base64 --decode \
            > rkms-release.keystore

          test -s \
            rkms-release.keystore

          keytool \
            -list \
            -keystore rkms-release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo \
            "RKMS_KEYSTORE_PATH=$PWD/rkms-release.keystore" \
            >> "$GITHUB_ENV"

          echo "Release keystore verified."


      # ============================================================
      # 37. CONFIGURE RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "app/build.gradle"
          )

          s = p.read_text(
              encoding="utf-8"
          )

          # ------------------------------------------------------
          # Remove old RKMS signing block if present.
          # ------------------------------------------------------

          # We intentionally do not attempt a risky general
          # brace parser here. Existing signingConfigs are kept
          # unless RKMS signing config is absent.
          # ------------------------------------------------------

          if "signingConfigs {" not in s:

              marker = "android {"

              signing_block = '''
              signingConfigs {
                  release {
                      storeFile file(
                          System.getenv("RKMS_KEYSTORE_PATH")
                      )
                      storePassword System.getenv(
                          "RKMS_KEYSTORE_PASSWORD"
                      )
                      keyAlias System.getenv(
                          "RKMS_KEY_ALIAS"
                      )
                      keyPassword System.getenv(
                          "RKMS_KEY_PASSWORD"
                      )
                  }
              }
          '''

              s = s.replace(
                  marker,
                  marker
                  + "\n"
                  + signing_block,
                  1
              )

          # ------------------------------------------------------
          # Ensure release buildType exists.
          # ------------------------------------------------------

          buildtypes = re.search(
              r'buildTypes\s*\{',
              s
          )

          if not buildtypes:

              raise SystemExit(
                  "ERROR: buildTypes block not found."
              )

          # ------------------------------------------------------
          # Add signingConfig to release if absent.
          # ------------------------------------------------------

          if "signingConfig signingConfigs.release" not in s:

              release_match = re.search(
                  r'release\s*\{',
                  s[buildtypes.end():]
              )

              if not release_match:

                  raise SystemExit(
                      "ERROR: release buildType not found."
                  )

              release_start = (
                  buildtypes.end()
                  + release_match.end()
              )

              s = (
                  s[:release_start]
                  + "\n"
                    "            signingConfig "
                    "signingConfigs.release\n"
                  + s[release_start:]
              )

          p.write_text(
              s,
              encoding="utf-8"
          )

          print(
              "Release signing configured."
          )
          PY


      # ============================================================
      # 38. VERIFY SIGNING CONFIG
      # ============================================================

      - name: Verify release signing configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          grep -Fq \
            "signingConfigs" \
            app/build.gradle

          grep -Fq \
            "signingConfigs.release" \
            app/build.gradle

          grep -Fq \
            "RKMS_KEYSTORE_PATH" \
            app/build.gradle

          test -f \
            "$RKMS_KEYSTORE_PATH"

          echo "Release signing configuration PASS."



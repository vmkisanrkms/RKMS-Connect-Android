name: RKMS Android APK - Digital ID Authority Fixed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare RKMS source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build
          mkdir -p build

          # Prefer source files directly from repository root
          if [ -f app.js ] && [ -f index.html ] && [ -f config.js ]; then
            echo "Using RKMS source files from repository root"

            rsync -a \
              --exclude='build/' \
              --exclude='android/' \
              --exclude='node_modules/' \
              --exclude='.git/' \
              --exclude='.github/' \
              --exclude='*.zip' \
              ./ build/

          else
            SOURCE_ZIP=""

            # Latest fixed source ZIP first
            for f in \
              RKMS_CONNECT_V11_DIGITAL_ID_AUTHORITY_FIXED_FINAL.zip \
              RKMS_CONNECT_V10_STATE_DROPDOWN_FIXED_FINAL.zip \
              RKMS_CONNECT_V9_STATE_DROPDOWN_FIXED.zip \
              RKMS_CONNECT_APK_BUILD_READY.zip \
              RKMS_CONNECT_V9_APP_NAME_RKMS_LOGO_CLEAR_FINAL.zip; do

              if [ -f "$f" ]; then
                SOURCE_ZIP="$f"
                break
              fi
            done

            # Fallback: find any RKMS ZIP
            if [ -z "$SOURCE_ZIP" ]; then
              SOURCE_ZIP="$(find . -maxdepth 1 -type f -name 'RKMS*.zip' -print -quit | sed 's#^./##')"
            fi

            if [ -z "$SOURCE_ZIP" ]; then
              echo "ERROR: RKMS source ZIP not found"
              exit 1
            fi

            echo "Using RKMS source ZIP: $SOURCE_ZIP"

            unzip -t "$SOURCE_ZIP" >/dev/null
            unzip -q "$SOURCE_ZIP" -d build
          fi

          # If ZIP contains an extra parent directory,
          # locate the actual app.js directory.
          if [ ! -f build/app.js ]; then
            APP_JS="$(find build -type f -name app.js -print -quit)"

            if [ -z "$APP_JS" ]; then
              echo "ERROR: app.js not found in RKMS source"
              exit 1
            fi

            SOURCE_DIR="$(dirname "$APP_JS")"

            mkdir -p build-source
            rsync -a "$SOURCE_DIR"/ build-source/

            rm -rf build
            mv build-source build
          fi

          # Required RKMS files
          test -f build/app.js
          test -f build/index.html
          test -f build/config.js
          test -f build/assets/rkms-logo-transparent.png

          # Verify exact RKMS logo
          LOGO_HASH="$(sha256sum build/assets/rkms-logo-transparent.png | cut -d' ' -f1)"

          test "$LOGO_HASH" = \
            "39a1d2aca7b3b3cbf748267600b32a82adf04abe377c5bb5cadd7deb29b6d43b"

          echo "Exact RKMS logo source verified"

      - name: Verify JavaScript
        shell: bash
        run: |
          set -euo pipefail

          node --check build/app.js

          echo "app.js syntax verified"

      - name: Verify Digital ID Authority Fix
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking RKMS Digital ID Authority Fix..."

          if grep -Rni \
            --exclude='*.zip' \
            --exclude-dir='node_modules' \
            "rkms_get_digital_id_meta" \
            build >/dev/null 2>&1; then

            echo "Digital ID metadata RPC reference found"
          else
            echo "WARNING: Digital ID metadata RPC reference not found"
          fi

          if grep -Rni \
            --exclude='*.zip' \
            --exclude-dir='node_modules' \
            "officerAreaLabel" \
            build >/dev/null 2>&1; then

            echo "Digital ID area logic found"
          else
            echo "WARNING: Digital ID area logic not found"
          fi

          echo "Digital ID Authority verification completed."

      - name: Create Capacitor build package
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          cat > package.json <<'JSON'
          {
            "name": "rkms",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "rm -rf dist && mkdir -p dist && rsync -a --exclude='dist/' --exclude='android/' --exclude='node_modules/' --exclude='.git/' --exclude='.github/' --exclude='*.zip' ./ dist/"
            },
            "dependencies": {
              "@capacitor/core": "6.2.2",
              "@capacitor/android": "6.2.2",
              "@capacitor/app": "6.0.3"
            },
            "devDependencies": {
              "@capacitor/cli": "6.2.2"
            }
          }
          JSON

          cat > capacitor.config.json <<'JSON'
          {
            "appId": "org.rkms.connect",
            "appName": "RKMS",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https",
              "cleartext": true
            },
            "android": {
              "allowMixedContent": true,
              "captureInput": true,
              "webContentsDebuggingEnabled": false
            }
          }
          JSON

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor dependencies
        working-directory: build
        run: |
          npm install --no-audit --no-fund

      - name: Build RKMS web application
        working-directory: build
        run: |
          npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android platform
        working-directory: build
        run: |
          npx cap add android

      - name: Sync RKMS application
        working-directory: build
        run: |
          npx cap sync android

      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Install exact RKMS launcher logo AFTER Capacitor sync
        shell: bash
        run: |
          set -euo pipefail

          LOGO="build/assets/rkms-logo-transparent.png"
          RES="build/android/app/src/main/res"
          STRINGS="build/android/app/src/main/res/values/strings.xml"

          test -s "$LOGO"

          mkdir -p \
            "$RES/mipmap-mdpi" \
            "$RES/mipmap-hdpi" \
            "$RES/mipmap-xhdpi" \
            "$RES/mipmap-xxhdpi" \
            "$RES/mipmap-xxxhdpi"

          convert "$LOGO" \
            -resize 48x48! \
            -strip \
            "$RES/mipmap-mdpi/ic_launcher.png"

          convert "$LOGO" \
            -resize 72x72! \
            -strip \
            "$RES/mipmap-hdpi/ic_launcher.png"

          convert "$LOGO" \
            -resize 96x96! \
            -strip \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          convert "$LOGO" \
            -resize 144x144! \
            -strip \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          convert "$LOGO" \
            -resize 192x192! \
            -strip \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"

          cp \
            "$RES/mipmap-mdpi/ic_launcher.png" \
            "$RES/mipmap-mdpi/ic_launcher_round.png"

          cp \
            "$RES/mipmap-hdpi/ic_launcher.png" \
            "$RES/mipmap-hdpi/ic_launcher_round.png"

          cp \
            "$RES/mipmap-xhdpi/ic_launcher.png" \
            "$RES/mipmap-xhdpi/ic_launcher_round.png"

          cp \
            "$RES/mipmap-xxhdpi/ic_launcher.png" \
            "$RES/mipmap-xxhdpi/ic_launcher_round.png"

          cp \
            "$RES/mipmap-xxxhdpi/ic_launcher.png" \
            "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

          # Remove adaptive icon resources so Android uses
          # the exact RKMS PNG launcher icon.
          rm -rf \
            "$RES/mipmap-anydpi-v26" \
            "$RES/mipmap-anydpi"

          find "$RES" -type f \( \
            -name 'ic_launcher_foreground.xml' -o \
            -name 'ic_launcher_background.xml' -o \
            -name 'ic_launcher_foreground.png' -o \
            -name 'ic_launcher_background.png' \
          \) -delete || true

          # Force application name to RKMS.
          if grep -q '<string name="app_name">' "$STRINGS"; then
            sed -i \
              's#<string name="app_name">.*</string>#<string name="app_name">RKMS</string>#' \
              "$STRINGS"
          else
            printf '\n    <string name="app_name">RKMS</string>\n' \
              >> "$STRINGS"
          fi

          echo "Final launcher icon:"
          identify "$RES/mipmap-xxxhdpi/ic_launcher.png"

          echo "Final app name:"
          grep -n 'app_name' "$STRINGS"

      - name: Make Gradle executable
        run: |
          chmod +x build/android/gradlew

      - name: Build Debug APK
        working-directory: build/android
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail

          APK="build/android/app/build/outputs/apk/debug/app-debug.apk"

          FINAL_APK="build/android/app/build/outputs/apk/debug/RKMS-Connect-Digital-ID-Authority-Fixed.apk"

          test -s "$APK"

          mv "$APK" "$FINAL_APK"

          echo "Final APK:"
          ls -lh "$FINAL_APK"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="build/android/app/build/outputs/apk/debug/RKMS-Connect-Digital-ID-Authority-Fixed.apk"

          test -s "$APK"

          echo "RKMS APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Digital-ID-Authority-Fixed-APK
          path: build/android/app/build/outputs/apk/debug/RKMS-Connect-Digital-ID-Authority-Fixed.apk
          if-no-files-found: error
          retention-days: 30

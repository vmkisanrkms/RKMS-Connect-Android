name: Build RKMS Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ANDROID_SOURCE_COMMIT: cf252628308e5a6ecc9eafbaf4ca227a3ad8ec92

jobs:
  build:
    name: Build RKMS Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare native Android project
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin "$ANDROID_SOURCE_COMMIT"

          PROJECT_DIR="$RUNNER_TEMP/rkms-android"
          rm -rf "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR"

          git archive "$ANDROID_SOURCE_COMMIT" | tar -x -C "$PROJECT_DIR"

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/gradlew"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Extract final RKMS website
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name 'RKMS_CONNECT_FINAL_ALL_FIXES_*.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Final RKMS ZIP not found."
            find "$GITHUB_WORKSPACE" -type f -name '*.zip' -print
            exit 1
          fi

          WEB_DIR="$RUNNER_TEMP/rkms-web"
          rm -rf "$WEB_DIR"
          mkdir -p "$WEB_DIR"

          unzip -q "$ZIP_FILE" -d "$WEB_DIR"

          find "$WEB_DIR" -type f -name 'app.js' -print -quit
          find "$WEB_DIR" -type f -name 'styles.css' -print -quit
          find "$WEB_DIR" -type f -name 'index.html' -print -quit
          find "$WEB_DIR" -type f -name 'config.js' -print -quit

          echo "WEB_DIR=$WEB_DIR" >> "$GITHUB_ENV"

      - name: Sync final website into Android
        shell: bash
        run: |
          set -euo pipefail

          APP_JS="$(find "$WEB_DIR" -type f -name 'app.js' -print -quit)"
          STYLES="$(find "$WEB_DIR" -type f -name 'styles.css' -print -quit)"
          INDEX="$(find "$WEB_DIR" -type f -name 'index.html' -print -quit)"
          CONFIG="$(find "$WEB_DIR" -type f -name 'config.js' -print -quit)"

          test -n "$APP_JS"
          test -n "$STYLES"
          test -n "$INDEX"
          test -n "$CONFIG"

          ASSETS="$PROJECT_DIR/app/src/main/assets/www"

          rm -rf "$ASSETS"
          mkdir -p "$ASSETS"

          cp "$APP_JS" "$ASSETS/app.js"
          cp "$STYLES" "$ASSETS/styles.css"
          cp "$INDEX" "$ASSETS/index.html"
          cp "$CONFIG" "$ASSETS/config.js"

          MANIFEST="$(find "$WEB_DIR" \
            -type f \
            -name 'manifest.webmanifest' \
            -print -quit || true)"

          if [ -n "$MANIFEST" ]; then
            cp "$MANIFEST" "$ASSETS/manifest.webmanifest"
          fi

          SOURCE_ASSETS="$(find "$WEB_DIR" \
            -type d \
            -name assets \
            -print -quit || true)"

          if [ -n "$SOURCE_ASSETS" ]; then
            mkdir -p "$ASSETS/assets"
            cp -R "$SOURCE_ASSETS"/. "$ASSETS/assets"/
          fi

          test -s "$ASSETS/app.js"
          test -s "$ASSETS/styles.css"
          test -s "$ASSETS/index.html"
          test -s "$ASSETS/config.js"

      - name: Validate JavaScript
        run: |
          node --check "$WEB_DIR/app.js"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare release signing
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$RKMS_KEYSTORE_BASE64"
          test -n "$RKMS_KEYSTORE_PASSWORD"
          test -n "$RKMS_KEY_ALIAS"
          test -n "$RKMS_KEY_PASSWORD"

          KEYSTORE="$RUNNER_TEMP/rkms-release.keystore"

          printf '%s' "$RKMS_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"

          test -s "$KEYSTORE"

          echo "RKMS_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build signed Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          RKMS_KEYSTORE_PATH: ${{ env.RKMS_KEYSTORE_PATH }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew clean assembleRelease --no-daemon

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f \
            -name '*.apk' \
            -print -quit)"

          test -n "$APK"

          mkdir -p release

          cp "$APK" release/RKMS-Connect-Release.apk

          ls -lh release/RKMS-Connect-Release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-Final-Release
          path: release/RKMS-Connect-Release.apk
          if-no-files-found: error

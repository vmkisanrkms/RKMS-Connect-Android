name: Build RKMS Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ANDROID_SOURCE_COMMIT: cf252628308e5a6ecc9eafbaf4ca227a3ad8ec92
  GRADLE_VERSION: "8.9"

jobs:
  build:
    name: Build RKMS Release APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout RKMS repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Prepare complete native Android project
      - name: Prepare native Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$RUNNER_TEMP/rkms-android"
          rm -rf "$PROJECT_DIR"

          git clone --no-tags \
            "https://github.com/vmkisanrkms/RKMS-Connect-Android.git" \
            "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          git checkout --detach "$ANDROID_SOURCE_COMMIT"

          CURRENT_COMMIT="$(git rev-parse HEAD)"

          echo "Expected Android commit:"
          echo "$ANDROID_SOURCE_COMMIT"

          echo "Actual Android commit:"
          echo "$CURRENT_COMMIT"

          test "$CURRENT_COMMIT" = "$ANDROID_SOURCE_COMMIT"

          # Android project files
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/google-services.json
          test -f app/src/main/AndroidManifest.xml

          # Android folders
          test -d app/src/main
          test -d app/src/main/java
          test -d app/src/main/res
          test -d app/src/main/assets

          # FCM native files
          test -f app/src/main/java/org/rkms/connect/FCMTokenRegistrar.java
          test -f app/src/main/java/org/rkms/connect/RKMSFirebaseMessagingService.java
          test -f app/src/main/java/org/rkms/connect/NotificationHelper.java
          test -f app/src/main/java/org/rkms/connect/SessionStore.java

          # FCM service registration
          grep -q 'RKMSFirebaseMessagingService' \
            app/src/main/AndroidManifest.xml

          # Android / Gradle
          grep -q '8.7.3' build.gradle
          grep -q 'compileSdk 35' app/build.gradle
          grep -q 'targetSdk 35' app/build.gradle

          echo "Native Android project verification: PASS"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 3. Find final website ZIP
      - name: Find final RKMS website ZIP
        shell: bash
        run: |
          set -euo pipefail

          # Direct website ZIP
          DIRECT="$GITHUB_WORKSPACE/RKMS_CONNECT_FINAL_PENDING_PDA_FLASH_VALIDATION_FIXED_2026-09-04.zip"

          if [ -f "$DIRECT" ]; then
            ZIP_FILE="$DIRECT"

          else
            # Search direct final ZIPs
            mapfile -t DIRECT_CANDIDATES < <(
              find "$GITHUB_WORKSPACE" \
                -type f \
                \( \
                  -name 'RKMS_CONNECT_FINAL_ALL_FIXES_*.zip' \
                  -o -name 'RKMS_CONNECT_FINAL_BUILD_*.zip' \
                  -o -name 'RKMS_CONNECT_FINAL_PENDING_PDA_*.zip' \
                \) \
                -print | sort
            )

            if [ "${#DIRECT_CANDIDATES[@]}" -eq 1 ]; then

              ZIP_FILE="${DIRECT_CANDIDATES[0]}"

            elif [ "${#DIRECT_CANDIDATES[@]}" -gt 1 ]; then

              echo "ERROR: Multiple final website ZIPs found:"
              printf '%s\n' "${DIRECT_CANDIDATES[@]}"
              exit 1

            else

              # Build package ZIP
              # Automatically extract website ZIP from it.
              mapfile -t PACKAGES < <(
                find "$GITHUB_WORKSPACE" \
                  -type f \
                  -name 'RKMS_GITHUB_BUILD_PACKAGE_*.zip' \
                  -print | sort
              )

              if [ "${#PACKAGES[@]}" -ne 1 ]; then

                echo "ERROR: Final website ZIP not found."

                echo ""
                echo "Upload either:"
                echo "1. Website ZIP directly"
                echo "2. RKMS_GITHUB_BUILD_PACKAGE_*.zip"

                echo ""
                echo "ZIP files found:"

                find "$GITHUB_WORKSPACE" \
                  -type f \
                  -name '*.zip' \
                  -print || true

                exit 1
              fi

              PACKAGE="${PACKAGES[0]}"

              NESTED_DIR="$RUNNER_TEMP/rkms-package"

              rm -rf "$NESTED_DIR"
              mkdir -p "$NESTED_DIR"

              echo "Build package found:"
              echo "$PACKAGE"

              unzip -q \
                "$PACKAGE" \
                -d "$NESTED_DIR"

              mapfile -t NESTED < <(
                find "$NESTED_DIR" \
                  -type f \
                  \( \
                    -name 'RKMS_CONNECT_FINAL_ALL_FIXES_*.zip' \
                    -o -name 'RKMS_CONNECT_FINAL_BUILD_*.zip' \
                    -o -name 'RKMS_CONNECT_FINAL_PENDING_PDA_*.zip' \
                  \) \
                  -print | sort
              )

              if [ "${#NESTED[@]}" -ne 1 ]; then

                echo "ERROR: Build package must contain exactly one final website ZIP."

                printf '%s\n' "${NESTED[@]}" || true

                exit 1
              fi

              ZIP_FILE="${NESTED[0]}"

            fi
          fi

          test -s "$ZIP_FILE"

          echo ""
          echo "Selected final website ZIP:"
          echo "$ZIP_FILE"

          echo "WEBSITE_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"

      # 4. Extract website
      - name: Extract final RKMS website
        shell: bash
        run: |
          set -euo pipefail

          WEB_EXTRACT="$RUNNER_TEMP/rkms-web-extract"

          rm -rf "$WEB_EXTRACT"
          mkdir -p "$WEB_EXTRACT"

          unzip -q \
            "$WEBSITE_ZIP" \
            -d "$WEB_EXTRACT"

          APP_JS="$(
            find "$WEB_EXTRACT" \
              -type f \
              -name 'app.js' \
              -print \
              -quit
          )"

          STYLES="$(
            find "$WEB_EXTRACT" \
              -type f \
              -name 'styles.css' \
              -print \
              -quit
          )"

          INDEX="$(
            find "$WEB_EXTRACT" \
              -type f \
              -name 'index.html' \
              -print \
              -quit
          )"

          CONFIG="$(
            find "$WEB_EXTRACT" \
              -type f \
              -name 'config.js' \
              -print \
              -quit
          )"

          test -n "$APP_JS"
          test -n "$STYLES"
          test -n "$INDEX"
          test -n "$CONFIG"

          WEB_ROOT="$(dirname "$APP_JS")"

          test -f "$WEB_ROOT/styles.css"
          test -f "$WEB_ROOT/index.html"
          test -f "$WEB_ROOT/config.js"

          WEBSITE_FILE_COUNT="$(
            find "$WEB_ROOT" \
              -type f | wc -l
          )"

          test "$WEBSITE_FILE_COUNT" -gt 0

          echo "Website root:"
          echo "$WEB_ROOT"

          echo "Website files:"
          echo "$WEBSITE_FILE_COUNT"

          # Book verification
          if [ -d "$WEB_ROOT/assets/book" ]; then

            BOOK_COUNT="$(
              find "$WEB_ROOT/assets/book" \
                -type f | wc -l
            )"

            test "$BOOK_COUNT" -gt 0

            echo "Book assets found:"
            echo "$BOOK_COUNT"

          else

            echo "WARNING: assets/book not found."

          fi

          echo "WEB_ROOT=$WEB_ROOT" >> "$GITHUB_ENV"

      # 5. JavaScript syntax
      - name: Validate website JavaScript
        shell: bash
        run: |
          set -euo pipefail

          node --check "$WEB_ROOT/app.js"

          echo "app.js syntax: PASS"

      # 6. Production Supabase
      - name: Verify production Supabase
        shell: bash
        run: |
          set -euo pipefail

          grep -q \
            'https://kzczivaydandiqgnzfeg.supabase.co' \
            "$WEB_ROOT/config.js"

          grep -q \
            'sb_publishable_' \
            "$WEB_ROOT/config.js"

          echo "Production Supabase configuration: PASS"

      # 7. Verify Pending + Flash
      - name: Verify RKMS frontend fixes
        shell: bash
        run: |
          set -euo pipefail

          # Pending status
          grep -q \
            'p_status:"PENDING"' \
            "$WEB_ROOT/app.js"

          # Pending route
          grep -q \
            'data-route="pending"' \
            "$WEB_ROOT/app.js"

          # Approve
          grep -q \
            'rkms_approve_member' \
            "$WEB_ROOT/app.js"

          # Reject
          grep -q \
            'rkms_reject_member' \
            "$WEB_ROOT/app.js"

          # Flash
          grep -q \
            'rkms_manage_flash' \
            "$WEB_ROOT/app.js"

          echo "Pending + Flash frontend verification: PASS"

      # 8. Copy COMPLETE website
      - name: Sync complete website into Android
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_WEB="$PROJECT_DIR/app/src/main/assets/www"

          rm -rf "$ANDROID_WEB"

          mkdir -p "$ANDROID_WEB"

          # Copy EVERYTHING
          cp -R \
            "$WEB_ROOT"/. \
            "$ANDROID_WEB"/

          # Required files
          test -s "$ANDROID_WEB/app.js"
          test -s "$ANDROID_WEB/styles.css"
          test -s "$ANDROID_WEB/index.html"
          test -s "$ANDROID_WEB/config.js"

          BUNDLED_COUNT="$(
            find "$ANDROID_WEB" \
              -type f | wc -l
          )"

          test "$BUNDLED_COUNT" -gt 0

          echo "Complete website bundled."
          echo "Bundled files:"
          echo "$BUNDLED_COUNT"

          # Book verification
          if [ -d "$ANDROID_WEB/assets/book" ]; then

            BOOK_COUNT="$(
              find "$ANDROID_WEB/assets/book" \
                -type f | wc -l
            )"

            test "$BOOK_COUNT" -gt 0

            echo "Book files bundled:"
            echo "$BOOK_COUNT"

          fi

          du -sh "$ANDROID_WEB"

      # 9. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 10. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 11. Gradle 8.9
      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_ROOT="$RUNNER_TEMP/gradle"

          rm -rf "$GRADLE_ROOT"
          mkdir -p "$GRADLE_ROOT"

          curl \
            --fail \
            --location \
            --retry 3 \
            --connect-timeout 20 \
            --max-time 180 \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            --output "$RUNNER_TEMP/gradle.zip"

          unzip -q \
            "$RUNNER_TEMP/gradle.zip" \
            -d "$GRADLE_ROOT"

          GRADLE_BIN="$GRADLE_ROOT/gradle-${GRADLE_VERSION}/bin"

          test -x "$GRADLE_BIN/gradle"

          echo "$GRADLE_BIN" >> "$GITHUB_PATH"

          "$GRADLE_BIN/gradle" --version

      # 12. Create Gradle Wrapper
      - name: Create Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gradle wrapper \
            --gradle-version "$GRADLE_VERSION" \
            --distribution-type bin

          test -f gradlew

          chmod +x gradlew

          ./gradlew --version

      # 13. Verify Android project
      - name: Verify Android Gradle project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/google-services.json
          test -f app/src/main/AndroidManifest.xml
          test -f gradlew

          test -d app/src/main/java
          test -d app/src/main/res
          test -d app/src/main/assets
          test -d app/src/main/assets/www

          # FCM
          test -f \
            app/src/main/java/org/rkms/connect/FCMTokenRegistrar.java

          test -f \
            app/src/main/java/org/rkms/connect/RKMSFirebaseMessagingService.java

          test -f \
            app/src/main/java/org/rkms/connect/NotificationHelper.java

          grep -q \
            'RKMSFirebaseMessagingService' \
            app/src/main/AndroidManifest.xml

          grep -q \
            'FirebaseMessagingService' \
            app/src/main/java/org/rkms/connect/RKMSFirebaseMessagingService.java

          # Android
          grep -q \
            'compileSdk 35' \
            app/build.gradle

          grep -q \
            'targetSdk 35' \
            app/build.gradle

          # Gradle
          ./gradlew \
            tasks \
            --no-daemon \
            --stacktrace \
            > "$RUNNER_TEMP/rkms-gradle-tasks.log"

          echo "Android + Gradle + FCM verification: PASS"

      # 14. Release signing
      - name: Prepare release signing
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          test -n "$RKMS_KEYSTORE_BASE64"
          test -n "$RKMS_KEYSTORE_PASSWORD"
          test -n "$RKMS_KEY_ALIAS"
          test -n "$RKMS_KEY_PASSWORD"

          KEYSTORE="$RUNNER_TEMP/rkms-release.keystore"

          printf '%s' "$RKMS_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$KEYSTORE"

          test -s "$KEYSTORE"

          echo "RKMS_KEYSTORE_PATH=$KEYSTORE" \
            >> "$GITHUB_ENV"

          echo "Release signing: PASS"

      # 15. Build Release APK
      - name: Build signed Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          RKMS_KEYSTORE_PATH: ${{ env.RKMS_KEYSTORE_PATH }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew \
            clean \
            assembleRelease \
            --no-daemon \
            --stacktrace

          echo "Release APK build: PASS"

      # 16. Verify APK
      - name: Verify final APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"
          test -s "$APK"

          SIZE="$(stat -c%s "$APK")"

          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: APK unexpectedly small."
            exit 1
          fi

          mkdir -p release

          cp "$APK" \
            release/RKMS-Connect-Release.apk

          # Website files inside APK
          unzip -l "$APK" \
            | grep -q 'assets/www/app.js'

          unzip -l "$APK" \
            | grep -q 'assets/www/styles.css'

          unzip -l "$APK" \
            | grep -q 'assets/www/index.html'

          unzip -l "$APK" \
            | grep -q 'assets/www/config.js'

          # Book assets inside APK
          if [ -d "$PROJECT_DIR/app/src/main/assets/www/assets/book" ]; then

            BOOK_COUNT="$(
              find "$PROJECT_DIR/app/src/main/assets/www/assets/book" \
                -type f | wc -l
            )

            test "$BOOK_COUNT" -gt 0

            unzip -l "$APK" \
              | grep -q 'assets/www/assets/book/'

            echo "Book assets in APK:"
            echo "$BOOK_COUNT"

          fi

          echo ""
          echo "APK size:"
          echo "$SIZE bytes"

          echo "Final APK verification: PASS"

      # 17. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-Final-Release
          path: release/RKMS-Connect-Release.apk
          if-no-files-found: error

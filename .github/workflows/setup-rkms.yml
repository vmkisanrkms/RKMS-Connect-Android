name: RKMS Final Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  APP_ID: "org.rkms.connect"
  SOURCE_ZIP: "RKMS_CONNECT_FINAL_AUDITED_RELEASE_APK_BUILD_20260922.zip"

jobs:
  build:
    name: RKMS Final Signed Release APK
    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # NODE
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false


      # ============================================================
      # JAVA
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # ============================================================
      # HOST PACKAGES
      # ============================================================

      - name: Install required host packages
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            rsync

          echo "HOST PACKAGES: PASS"


      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      - name: Install Android API 36 SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          test -d \
            "$ANDROID_HOME/platforms/android-${ANDROID_API}"

          test -d \
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}"

          test -x \
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt"

          test -x \
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

          echo "ANDROID API 36: PASS"
          echo "BUILD TOOLS 36.0.0: PASS"


      # ============================================================
      # LOCATE SOURCE
      # ============================================================

      - name: Locate RKMS source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_PATH="$GITHUB_WORKSPACE/$SOURCE_ZIP"

          if [ ! -s "$SOURCE_PATH" ]; then
            echo "::error::Source ZIP not found:"
            echo "$SOURCE_PATH"

            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -name "*.zip" \
              -print || true

            exit 1
          fi

          SOURCE_SHA256="$(
            sha256sum "$SOURCE_PATH" | awk '{print $1}'
          )"

          echo "SOURCE ZIP:"
          echo "$SOURCE_PATH"

          echo "SOURCE SHA256:"
          echo "$SOURCE_SHA256"

          echo "RKMS_SOURCE_ZIP=$SOURCE_PATH" >> "$GITHUB_ENV"
          echo "RKMS_SOURCE_SHA256=$SOURCE_SHA256"


      # ============================================================
      # EXTRACT SOURCE
      # ============================================================

      - name: Extract RKMS source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            "$GITHUB_WORKSPACE/rkms-source"

          mkdir -p \
            "$GITHUB_WORKSPACE/rkms-source"

          unzip -q \
            "$RKMS_SOURCE_ZIP" \
            -d "$GITHUB_WORKSPACE/rkms-source"

          PACKAGE_FILE="$(
            find "$GITHUB_WORKSPACE/rkms-source" \
              -type f \
              -name "package.json" \
              -not -path "*/node_modules/*" \
              -print \
              -quit
          )"

          if [ -z "$PACKAGE_FILE" ]; then
            echo "::error::package.json not found."
            exit 1
          fi

          RKMS_ROOT="$(dirname "$PACKAGE_FILE")"
          RKMS_ROOT="$(cd "$RKMS_ROOT" && pwd)"

          echo "RKMS_ROOT=$RKMS_ROOT" >> "$GITHUB_ENV"

          echo "RKMS ROOT:"
          echo "$RKMS_ROOT"


      # ============================================================
      # REPAIR MALFORMED OLD NATIVE SCRIPT
      # ============================================================

      - name: Repair RKMS native setup script
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          SCRIPT="scripts/setup-android-native.sh"

          test -s "$SCRIPT"

          cp "$SCRIPT" "$SCRIPT.before-repair"

          python3 - "$SCRIPT" <<'PY'
          import sys
          import subprocess
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          marker = "# Stable white notification icon for FCM system notifications."

          # If the script is already valid, do not modify it.
          check = subprocess.run(
              ["bash", "-n", str(path)],
              capture_output=True,
              text=True
          )

          if check.returncode == 0:
              print("Native setup script already valid.")
              raise SystemExit(0)

          marker_pos = text.find(marker)

          if marker_pos < 0:
              print(check.stderr)
              raise SystemExit(
                  "Malformed native script detected, but repair marker was not found."
              )

          start = text.rfind(
              "python3 - <<'PY3'",
              0,
              marker_pos
          )

          if start < 0:
              raise SystemExit(
                  "Malformed native setup start marker not found."
              )

          end_marker = "\nPY3"

          end = text.find(
              end_marker,
              marker_pos
          )

          if end < 0:
              raise SystemExit(
                  "Malformed native setup end marker not found."
              )

          end += len(end_marker)

          replacement = r'''# Stable white notification icon for FCM system notifications.

          DRAWABLE_DIR="$RES_DIR/drawable"

          mkdir -p "$DRAWABLE_DIR"

          cat > "$DRAWABLE_DIR/ic_stat_rkms.xml" <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M12,2A7,7 0,0 0,5 9v4l-2,3v1h18v-1l-2,-3V9A7,7 0,0 0,12 2M9,19a3,3 0,0 0,6 0z"/>
          </vector>
          XML

          python3 - <<'PYMANIFEST'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")

          if not p.exists():
              raise SystemExit("AndroidManifest.xml not found")

          s = p.read_text()

          application_pos = s.find("<application")

          if application_pos < 0:
              raise SystemExit("AndroidManifest application tag missing")

          permissions = [
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
          ]

          for permission in permissions:
              if permission.strip() not in s:
                  s = (
                      s[:application_pos]
                      + permission
                      + s[application_pos:]
                  )
                  application_pos += len(permission)

          closing = "</application>"

          if closing not in s:
              raise SystemExit(
                  "AndroidManifest application closing tag missing"
              )

          channel_meta = (
              '    <meta-data '
              'android:name="com.google.firebase.messaging.default_notification_channel_id" '
              'android:value="@string/rkms_default_notification_channel_id" />\n'
          )

          icon_meta = (
              '    <meta-data '
              'android:name="com.google.firebase.messaging.default_notification_icon" '
              'android:resource="@drawable/ic_stat_rkms" />\n'
          )

          if "com.google.firebase.messaging.default_notification_channel_id" not in s:
              s = s.replace(
                  closing,
                  channel_meta + closing,
                  1
              )

          if "com.google.firebase.messaging.default_notification_icon" not in s:
              s = s.replace(
                  closing,
                  icon_meta + closing,
                  1
              )

          p.write_text(s)

          print("AndroidManifest notification configuration repaired.")
          PYMANIFEST
          '''

          # Remove YAML helper indentation from replacement.
          replacement = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in replacement.splitlines()
          ) + "\n"

          text = (
              text[:start]
              + replacement
              + text[end:]
          )

          path.write_text(text)

          print("Malformed native setup block repaired.")

          check = subprocess.run(
              ["bash", "-n", str(path)],
              capture_output=True,
              text=True
          )

          if check.returncode != 0:
              print(check.stderr)
              raise SystemExit(
                  "Repaired native setup script still has syntax errors."
              )

          print("Native setup script syntax: PASS")
          PY

          chmod +x "$SCRIPT"

          bash -n "$SCRIPT"

          echo "RKMS NATIVE SCRIPT REPAIR: PASS"


      # ============================================================
      # VERIFY SOURCE STRUCTURE
      # ============================================================

      - name: Verify RKMS source structure
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          REQUIRED_FILES=(
            "package.json"
            "package-lock.json"
            "app.js"
            "index.html"
            "styles.css"
            "capacitor.config.json"
            "google-services.json"
            "scripts/setup-android-native.sh"
            "scripts/configure-android-16.sh"
            "scripts/configure-release-signing.sh"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -s "$FILE" ]; then
              echo "::error::Missing required file: $FILE"
              exit 1
            fi
          done

          node --check app.js

          python3 -m json.tool \
            capacitor.config.json \
            >/dev/null

          python3 -m json.tool \
            google-services.json \
            >/dev/null

          bash -n \
            scripts/setup-android-native.sh

          bash -n \
            scripts/configure-android-16.sh

          bash -n \
            scripts/configure-release-signing.sh

          echo "SOURCE STRUCTURE: PASS"


      # ============================================================
      # CAPACITOR VERSION
      # ============================================================

      - name: Verify Capacitor package versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node <<'NODE'
          const fs = require("fs");

          const p = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const d = Object.assign(
            {},
            p.dependencies || {},
            p.devDependencies || {}
          );

          const wanted = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          for (const [name, version] of Object.entries(wanted)) {
            if (d[name] !== version) {
              throw new Error(
                `${name}: expected ${version}, found ${d[name] || "MISSING"}`
              );
            }
          }

          if (
            !p.scripts ||
            typeof p.scripts.build !== "string" ||
            !p.scripts.build.trim()
          ) {
            throw new Error("Build script missing");
          }

          console.log("CAPACITOR VERSION CHECK: PASS");
          NODE


      # ============================================================
      # FIREBASE CONFIGURATION
      # ============================================================

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node <<'NODE'
          const fs = require("fs");

          const d = JSON.parse(
            fs.readFileSync("google-services.json", "utf8")
          );

          const ok = (d.client || []).some(
            c =>
              c.client_info &&
              c.client_info.android_client_info &&
              c.client_info.android_client_info.package_name ===
              "org.rkms.connect"
          );

          if (!ok) {
            throw new Error(
              "org.rkms.connect not found in google-services.json"
            );
          }

          console.log("FIREBASE CONFIGURATION: PASS");
          NODE


      # ============================================================
      # NOTIFICATION SOURCE
      # ============================================================

      - name: Verify notification source
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          test -s app.js

          grep -Fq \
            "@capacitor/push-notifications" \
            package.json

          grep -Fq \
            "rkms_notifications_v2" \
            app.js

          grep -Fq \
            "rkms_priority_v1" \
            app.js

          node --check app.js

          echo "NORMAL NOTIFICATION SOURCE: PASS"
          echo "PRIORITY NOTIFICATION SOURCE: PASS"


      # ============================================================
      # NPM INSTALL
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm ci \
            --no-audit \
            --no-fund

          echo "NPM INSTALL: PASS"


      # ============================================================
      # WEB BUILD
      # ============================================================

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm run build

          test -s \
            dist/index.html

          echo "WEB BUILD: PASS"


      # ============================================================
      # GENERATE CAPACITOR ANDROID
      # ============================================================

      - name: Generate Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          rm -rf android

          npx cap add android

          test -s \
            android/gradlew

          test -s \
            android/app/build.gradle

          chmod +x \
            android/gradlew

          echo "CAPACITOR ANDROID PROJECT: PASS"


      # ============================================================
      # CONFIGURE ANDROID 16 API 36
      # ============================================================

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          bash \
            scripts/configure-android-16.sh

          test -f \
            android/gradle/wrapper/gradle-wrapper.properties

          grep -Fq \
            "gradle-8.11.1-bin.zip" \
            android/gradle/wrapper/gradle-wrapper.properties

          grep -Fq \
            "com.android.tools.build:gradle:8.9.1" \
            android/build.gradle

          grep -Fq \
            "compileSdkVersion = 36" \
            android/variables.gradle

          grep -Fq \
            "targetSdkVersion = 36" \
            android/variables.gradle

          echo "ANDROID 16 API 36 CONFIGURATION: PASS"


      # ============================================================
      # SYNC CAPACITOR
      # ============================================================

      - name: Sync Capacitor
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npx cap sync android

          test -s \
            android/app/build.gradle

          test -s \
            android/app/src/main/AndroidManifest.xml

          echo "CAPACITOR SYNC: PASS"


      # ============================================================
      # APPLY RKMS NATIVE SETUP
      # ============================================================

      - name: Apply RKMS native Android setup
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/setup-android-native.sh

          bash \
            scripts/setup-android-native.sh

          echo "RKMS NATIVE ANDROID SETUP: PASS"


      # ============================================================
      # VERIFY MAIN ACTIVITY
      # ============================================================

      - name: Verify generated MainActivity
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          MAIN_ACTIVITY="$(
            find android/app/src/main \
              -type f \
              -name "MainActivity.java" \
              -print \
              -quit
          )"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "::error::MainActivity.java not found."
            find android/app/src/main \
              -type f \
              -print || true
            exit 1
          fi

          test -s "$MAIN_ACTIVITY"

          grep -Fq \
            "RKMSNativeBridge" \
            "$MAIN_ACTIVITY"

          grep -Fq \
            "FirebaseApp.initializeApp(this)" \
            "$MAIN_ACTIVITY"

          grep -Fq \
            "onNewIntent" \
            "$MAIN_ACTIVITY"

          echo "MainActivity:"
          echo "$MAIN_ACTIVITY"

          echo "RKMSNativeBridge: PASS"
          echo "Firebase initialization: PASS"
          echo "Notification intent handling: PASS"
          echo "MAINACTIVITY AUDIT: PASS"


      # ============================================================
      # VERIFY FIREBASE MESSAGING
      # ============================================================

      - name: Verify Firebase Messaging SDK
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          if grep -Rqs \
            "firebase-messaging" \
            android
          then
            echo "Firebase Messaging SDK reference: PASS"
          else
            echo "::error::Firebase Messaging SDK reference not found."
            exit 1
          fi

          test -f \
            android/app/google-services.json

          grep -Fq \
            "org.rkms.connect" \
            android/app/google-services.json

          echo "Firebase google-services.json: PASS"


      # ============================================================
      # VERIFY NOTIFICATION CHANNELS
      # ============================================================

      - name: Verify notification priority channels
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          grep -Fq \
            "rkms_notifications_v2" \
            app.js

          grep -Fq \
            "rkms_priority_v1" \
            app.js

          grep -Fq \
            "rkms_notifications_v2" \
            scripts/setup-android-native.sh

          grep -Fq \
            "rkms_priority_v1" \
            scripts/setup-android-native.sh

          if grep -Fq \
            "deleteNotificationChannel" \
            scripts/setup-android-native.sh
          then
            echo "::error::Notification channel deletion detected."
            exit 1
          fi

          if grep -Fq \
            "deleteChannel" \
            scripts/setup-android-native.sh
          then
            echo "::error::Notification channel deletion detected."
            exit 1
          fi

          echo "Normal notification channel: PASS"
          echo "Priority notification channel: PASS"
          echo "No notification channel deletion: PASS"
          echo "NOTIFICATION CHANNEL AUDIT: PASS"


      # ============================================================
      # STATIC AUDITS
      # ============================================================

      - name: Run RKMS static audits
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          if [ -f scripts/verify-fcm-pipeline.py ]; then
            python3 \
              scripts/verify-fcm-pipeline.py
          fi

          if [ -f scripts/verify-native-bridge.py ]; then
            python3 \
              scripts/verify-native-bridge.py
          fi

          if [ -f scripts/verify-rkms-final.py ]; then
            python3 \
              scripts/verify-rkms-final.py
          fi

          bash -n \
            scripts/setup-android-native.sh

          bash -n \
            scripts/configure-android-16.sh

          bash -n \
            scripts/configure-release-signing.sh

          node --check \
            app.js

          echo "RKMS STATIC AUDITS: PASS"


      # ============================================================
      # SIGNING SECRETS
      # ============================================================

      - name: Verify release signing secrets
        shell: bash
        run: |
          set -euo pipefail

          test -n "${RKMS_KEYSTORE_BASE64:-}" || {
            echo "::error::RKMS_KEYSTORE_BASE64 secret is missing."
            exit 1
          }

          test -n "${RKMS_KEYSTORE_PASSWORD:-}" || {
            echo "::error::RKMS_KEYSTORE_PASSWORD secret is missing."
            exit 1
          }

          test -n "${RKMS_KEY_ALIAS:-}" || {
            echo "::error::RKMS_KEY_ALIAS secret is missing."
            exit 1
          }

          test -n "${RKMS_KEY_PASSWORD:-}" || {
            echo "::error::RKMS_KEY_PASSWORD secret is missing."
            exit 1
          }

          echo "RELEASE SIGNING SECRETS: PASS"


      # ============================================================
      # RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          bash \
            scripts/configure-release-signing.sh

          test -s \
            android/app/release.keystore

          keytool \
            -list \
            -keystore android/app/release.keystore \
            -storepass "$RKMS_KEYSTORE_PASSWORD" \
            -alias "$RKMS_KEY_ALIAS" \
            >/dev/null

          grep -Fq \
            "signingConfigs.release" \
            android/app/build.gradle

          echo "RELEASE SIGNING CONFIGURATION: PASS"


      # ============================================================
      # GRADLE
      # ============================================================

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          chmod +x gradlew

          test -s \
            gradle/wrapper/gradle-wrapper.properties

          grep -Fq \
            "gradle-8.11.1-bin.zip" \
            gradle/wrapper/gradle-wrapper.properties

          ./gradlew \
            --version

          echo "GRADLE WRAPPER: PASS"


      # ============================================================
      # FINAL SIGNED RELEASE APK
      # ============================================================

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          ./gradlew \
            clean \
            --no-daemon

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          EXPECTED_APK="$RKMS_ROOT/android/app/build/outputs/apk/release/app-release.apk"

          if [ -f "$EXPECTED_APK" ]; then
            APK="$EXPECTED_APK"
          else
            echo "Expected APK not found. Searching..."

            APK="$(
              find "$RKMS_ROOT/android" \
                -type f \
                -name "*.apk" \
                -not -iname "*debug*" \
                -print \
                -quit
            )"
          fi

          if [ -z "${APK:-}" ] || [ ! -s "$APK" ]; then
            echo "::error::Signed release APK was not produced."
            exit 1
          fi

          echo "RKMS_RELEASE_APK=$APK" >> "$GITHUB_ENV"

          echo "SIGNED RELEASE APK:"
          echo "$APK"

          echo "SIGNED RELEASE APK BUILD: PASS"


      # ============================================================
      # VERIFY APK PACKAGE
      # ============================================================

      - name: Verify release APK package
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          APK="$RKMS_RELEASE_APK"

          test -s "$APK"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt" \
            dump badging \
            "$APK" \
            > apk-badging.txt

          grep -Fq \
            "package: name='${APP_ID}'" \
            apk-badging.txt

          echo "APK PACKAGE: PASS"
          echo "Package: ${APP_ID}"


      # ============================================================
      # VERIFY SIGNATURE
      # ============================================================

      - name: Verify release APK signature
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          APK="$RKMS_RELEASE_APK"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" \
            verify \
            --verbose \
            "$APK"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" \
            verify \
            --print-certs \
            "$APK" \
            > apk-signature.txt

          grep -Fq \
            "Verified using v2 scheme" \
            apk-signature.txt

          echo "APK SIGNATURE VERIFICATION: PASS"

          cat apk-signature.txt


      # ============================================================
      # SHA256
      # ============================================================

      - name: Generate release APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          APK="$RKMS_RELEASE_APK"

          sha256sum \
            "$APK" \
            | tee release-apk-sha256.txt

          APK_SIZE="$(stat -c%s "$APK")"

          test "$APK_SIZE" -gt 100000

          echo "APK SIZE: $APK_SIZE bytes"
          echo "RELEASE APK SHA256: PASS"


      # ============================================================
      # FINAL API 36 AUDIT
      # ============================================================

      - name: Final Android 16 API 36 audit
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          test -s \
            "$RKMS_RELEASE_APK"

          test -s \
            release-apk-sha256.txt

          test -f \
            android/variables.gradle

          grep -Eq \
            "compileSdkVersion[[:space:]]*=[[:space:]]*36" \
            android/variables.gradle

          grep -Eq \
            "targetSdkVersion[[:space:]]*=[[:space:]]*36" \

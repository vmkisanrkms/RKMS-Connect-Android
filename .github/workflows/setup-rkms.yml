name: Build RKMS Connect

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RKMS Connect APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "Checking RKMS Android project..."

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/google-services.json
          test -d app/src/main

          echo "Android project structure OK."

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Validate Gradle project
        run: ./gradlew --version

      - name: Clean project
        run: ./gradlew clean

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "Generated APK files:"
          find app/build/outputs/apk -type f -name "*.apk" -print

          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: RKMS Android 16 / API 36 - Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: RKMS Android 16 / API 36 - Release APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 2. NODE.JS 22
      # ============================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ============================================================
      # 3. JDK 17
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ============================================================
      # 4. ANDROID SDK
      # ============================================================
      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          if [ ! -d "/usr/local/lib/android/sdk" ]; then
            echo "ERROR: Android SDK not found."
            exit 1
          fi

          if [ ! -x "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --version

      # ============================================================
      # 5. ANDROID LICENSES
      # ============================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=/usr/local/lib/android/sdk \
            --licenses || true

      # ============================================================
      # 6. INSTALL ANDROID 16 / API 36
      # ============================================================
      - name: Install Android 16 / API 36
        shell: bash
        run: |
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=/usr/local/lib/android/sdk \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # ============================================================
      # 7. VERIFY BUILD ENVIRONMENT
      # ============================================================
      - name: Verify build environment
        shell: bash
        run: |
          echo "===== NODE ====="
          node --version
          npm --version

          echo "===== JAVA ====="
          java -version

          echo "===== ANDROID API 36 ====="

          test -d "$ANDROID_HOME/platforms/android-36"
          echo "Android API 36: PASS"

          test -d "$ANDROID_HOME/build-tools/36.0.0"
          echo "Build Tools 36.0.0: PASS"

      # ============================================================
      # 8. EXTRACT FINAL RKMS SOURCE ZIP
      # ============================================================
      - name: Extract RKMS source ZIP
        shell: bash
        run: |
          ZIP="RKMS_CONNECT_FINAL_RULES_FIXED_2026-09-17.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Final source ZIP not found."
            ls -lah
            exit 1
          fi

          rm -rf rkms-source
          mkdir -p rkms-source

          unzip -q "$ZIP" -d rkms-source

          APP_FILE=$(find rkms-source \
            -type f \
            -name "app.js" \
            | head -n 1)

          if [ -z "$APP_FILE" ]; then
            echo "ERROR: app.js not found inside source ZIP."
            exit 1
          fi

          SOURCE_DIR=$(dirname "$APP_FILE")

          echo "RKMS_SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

          echo "RKMS source directory:"
          echo "$SOURCE_DIR"

      # ============================================================
      # 9. VERIFY SOURCE
      # ============================================================
      - name: Verify RKMS source
        shell: bash
        run: |
          cd "$RKMS_SOURCE_DIR"

          test -f app.js
          test -f index.html
          test -f package.json
          test -f capacitor.config.json
          test -f scripts/configure-android-16.sh

          echo "RKMS source verification: PASS"

      # ============================================================
      # 10. VERIFY APP.JS
      # ============================================================
      - name: Verify app.js
        shell: bash
        run: |
          cd "$RKMS_SOURCE_DIR"

          node --check app.js

          echo "app.js syntax: PASS"

      # ============================================================
      # 11. VERIFY PYTHON SCRIPTS
      # ============================================================
      - name: Verify Python scripts
        shell: bash
        run: |
          cd "$RKMS_SOURCE_DIR"

          if compgen -G "scripts/*.py" > /dev/null; then
            python3 -m py_compile scripts/*.py
          fi

          echo "Python verification: PASS"

      # ============================================================
      # 12. INSTALL NPM DEPENDENCIES
      # ============================================================
      - name: Install npm dependencies
        shell: bash
        run: |
          cd "$RKMS_SOURCE_DIR"

          npm install --no-audit --no-fund

          echo "npm install: PASS"

      # ============================================================
      # 13. PREPARE WEB ASSETS / DIST
      # IMPORTANT:
      # Capacitor webDir = dist
      # ============================================================
      - name: Prepare web assets
        shell: bash
        run: |
          cd "$RKMS_SOURCE_DIR"

          echo "Preparing web assets..."

          # First try the project's own build command if available.
          if node -e '
            const p=require("./package.json");
            process.exit(p.scripts && p.scripts.build ? 0 : 1);
          '; then

            echo "Build script found. Running npm run build..."
            npm run build

          else

            echo "No npm build script found."
            echo "Creating dist from the static RKMS web application..."

            rm -rf dist
            mkdir -p dist

            # Main web application files
            cp index.html dist/
            cp app.js dist/
            cp styles.css dist/ 2>/dev/null || true

            # Copy common web asset directories when present.
            for DIR in assets images img icons fonts public; do
              if [ -d "$DIR" ]; then
                cp -R "$DIR" "dist/$DIR"
              fi
            done

          fi

          # Final safety check.
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html was not created."
            echo
            echo "Current directory:"
            pwd
            echo
            echo "Files:"
            find . -maxdepth 2 -type f | head -n 100
            exit 1
          fi

          echo "Web assets ready."
          echo "dist contents:"
          find dist -maxdepth 2 -type f -print

      # ============================================================
      # 14. ADD CAPACITOR ANDROID
      # ============================================================
      - name: Add Capacitor Android
        shell: bash
        run: |
          cd "$RKMS_SOURCE_DIR"

          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android project already exists."
          fi

          test -d android

          echo "Capacitor Android project: PASS"

      # ============================================================
      # 15. CAPACITOR SYNC
      # ============================================================
      - name: Capacitor sync
        shell: bash
        run: |
          cd "$RKMS_SOURCE_DIR"

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html missing before Capacitor sync."
            exit 1
          fi

          npx cap sync android

          echo "Capacitor sync: PASS"

      # ============================================================
      # 16. CONFIGURE RKMS ANDROID 16
      # ============================================================
      - name: Configure RKMS Android 16
        shell: bash
        run: |
          cd "$RKMS_SOURCE_DIR"

          test -f android/variables.gradle

          chmod +x scripts/configure-android-16.sh
          ./scripts/configure-android-16.sh

          echo "RKMS Android 16 configuration: PASS"

      # ============================================================
      # 17. ENFORCE ANDROID API 36
      # ============================================================
      - name: Enforce Android API 36
        shell: bash
        run: |
          cd "$RKMS_SOURCE_DIR"

          if [ -f "android/variables.gradle" ]; then

            sed -i \
              -E 's/compileSdkVersion[[:space:]]*=[[:space:]]*[0-9]+/compileSdkVersion = 36/g' \
              android/variables.gradle

            sed -i \
              -E 's/targetSdkVersion[[:space:]]*=[[:space:]]*[0-9]+/targetSdkVersion = 36/g' \
              android/variables.gradle

          fi

          if [ -f "android/app/build.gradle" ]; then

            sed -i \
              -E 's/compileSdk[[:space:]]+[0-9]+/compileSdk 36/g' \
              android/app/build.gradle

            sed -i \
              -E 's/targetSdk[[:space:]]+[0-9]+/targetSdk 36/g' \
              android/app/build.gradle

          fi

          echo "Android API 36 enforced."

      # ============================================================
      # 18. CONFIGURE GRADLE 8.11.1
      # ============================================================
      - name: Configure Gradle 8.11.1
        shell: bash
        run: |
          cd "$RKMS_SOURCE_DIR/android"

          test -f gradle/wrapper/gradle-wrapper.properties

          sed -i \
            's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.11.1-bin.zip#' \
            gradle/wrapper/gradle-wrapper.properties

          echo "Gradle 8.11.1 configured."

      # ============================================================
      # 19. FINAL ANDROID PROJECT CHECK
      # ============================================================
      - name: Verify Android project
        shell: bash
        run: |
          cd "$RKMS_SOURCE_DIR"

          test -f android/gradlew
          test -d android/app
          test -f android/variables.gradle
          test -f dist/index.html

          echo "Final Android project verification: PASS"

      # ============================================================
      # 20. BUILD RELEASE APK
      # ============================================================
      - name: Build Release APK
        shell: bash
        run: |
          cd "$RKMS_SOURCE_DIR/android"

          chmod +x gradlew

          ./gradlew clean assembleRelease \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 21. LOCATE APK
      # ============================================================
      - name: Locate Release APK
        shell: bash
        run: |
          cd "$RKMS_SOURCE_DIR"

          APK_DIR="android/app/build/outputs/apk/release"

          find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK generated."
            exit 1
          fi

          echo "APK generated: PASS"

      # ============================================================
      # 22. SHA256
      # ============================================================
      - name: Generate SHA256
        shell: bash
        run: |
          cd "$RKMS_SOURCE_DIR"

          APK=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          sha256sum "$APK" \
            | tee "$GITHUB_WORKSPACE/RKMS_ANDROID16_API36_SHA256.txt"

      # ============================================================
      # 23. PREPARE RELEASE
      # ============================================================
      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release"

          APK=$(find "$RKMS_SOURCE_DIR/android/app/build/outputs/apk/release" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"

          cp "$GITHUB_WORKSPACE/RKMS_ANDROID16_API36_SHA256.txt" \
            "$GITHUB_WORKSPACE/release/"

          ls -lah "$GITHUB_WORKSPACE/release"

      # ============================================================
      # 24. UPLOAD APK
      # ============================================================
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS_CONNECT_ANDROID16_API36_RELEASE
          path: release/*
          if-no-files-found: error
          retention-days: 90

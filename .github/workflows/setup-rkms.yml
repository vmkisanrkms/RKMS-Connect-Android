name: RKMS CONNECT Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify RKMS source
        run: |
          if [ -f RKMS_CONNECT_V9_FIXED_SIGNATURE_PDA_PASSWORD_PROTECTED_NATIONAL_FINAL.zip ]; then
            echo "Using final RKMS source ZIP"
            unzip -t RKMS_CONNECT_V9_FIXED_SIGNATURE_PDA_PASSWORD_PROTECTED_NATIONAL_FINAL.zip >/dev/null
          elif [ -f RKMS_CONNECT_APK_BUILD_READY.zip ]; then
            echo "Using APK build source ZIP"
            unzip -t RKMS_CONNECT_APK_BUILD_READY.zip >/dev/null
          elif [ -f app.js ] && [ -f index.html ] && [ -f config.js ]; then
            echo "Using direct RKMS source files"
          else
            echo "ERROR: RKMS source not found"
            exit 1
          fi

      - name: Prepare RKMS source
        run: |
          rm -rf build
          mkdir -p build

          if [ -f RKMS_CONNECT_V9_FIXED_SIGNATURE_PDA_PASSWORD_PROTECTED_NATIONAL_FINAL.zip ]; then
            unzip -q RKMS_CONNECT_V9_FIXED_SIGNATURE_PDA_PASSWORD_PROTECTED_NATIONAL_FINAL.zip -d build
          elif [ -f RKMS_CONNECT_APK_BUILD_READY.zip ]; then
            unzip -q RKMS_CONNECT_APK_BUILD_READY.zip -d build
          else
            rsync -a \
              --exclude='.git' \
              --exclude='.github' \
              --exclude='build' \
              --exclude='android' \
              --exclude='node_modules' \
              --exclude='*.zip' \
              ./ build/
          fi

          test -f build/app.js
          test -f build/index.html
          test -f build/config.js

          echo "RKMS source verified"

      - name: Create Capacitor build package
        working-directory: build
        run: |
          cat > package.json <<'EOF'
          {
            "name": "rkms-connect",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "rm -rf dist && mkdir -p dist && rsync -a --exclude='dist' --exclude='android' --exclude='node_modules' --exclude='.git' --exclude='.github' --exclude='*.zip' ./ dist/"
            },
            "dependencies": {
              "@capacitor/core": "6.2.2",
              "@capacitor/android": "6.2.2"
            },
            "devDependencies": {
              "@capacitor/cli": "6.2.2"
            }
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "org.rkms.connect",
            "appName": "RKMS CONNECT",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https",
              "cleartext": true
            },
            "android": {
              "allowMixedContent": true,
              "captureInput": true,
              "webContentsDebuggingEnabled": false
            }
          }
          EOF

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor dependencies
        working-directory: build
        run: npm install --no-audit --no-fund

      - name: Build RKMS web application
        working-directory: build
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android platform
        working-directory: build
        run: npx cap add android

      - name: Sync RKMS application
        working-directory: build
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x build/android/gradlew

      - name: Build Debug APK
        working-directory: build/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -f build/android/app/build/outputs/apk/debug/app-debug.apk
          echo "APK successfully created:"
          ls -lh build/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-CONNECT-debug-apk
          path: build/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

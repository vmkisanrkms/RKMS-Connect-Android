name: RKMS Android 16 API 36 - Final Signed Release APK Only

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  NODE_VERSION: "22"
  JAVA_VERSION: "17"

  AGP_VERSION: "8.9.1"
  GRADLE_VERSION: "8.11.1"

  FIREBASE_BOM_VERSION: "34.19.0"
  GOOGLE_SERVICES_VERSION: "4.5.0"
  CREDENTIALS_VERSION: "1.5.0"

  APP_ID: "org.rkms.connect"
  MIN_SDK: "23"
  TARGET_SDK: "36"

  SOURCE_ZIP: "RKMS_CONNECT_FINAL_GROUP_MANAGEMENT_UNRESTRICTED_20260920.zip"

  APK_NAME: "RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"

jobs:

  build:

    name: Build Final Signed Release APK Only

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. VERIFY EXACT RKMS SOURCE ZIP
      # ============================================================

      - name: Verify exact RKMS source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Looking for:"
          echo "${SOURCE_ZIP}"

          if [ ! -f "${SOURCE_ZIP}" ]; then
            echo "::error::Required RKMS source ZIP not found:"
            echo "${SOURCE_ZIP}"
            echo ""
            echo "Available ZIP files:"
            find . \
              -maxdepth 4 \
              -type f \
              -iname "*.zip" \
              -print \
              | sort \
              || true
            exit 1
          fi

          echo "SOURCE_ZIP=${SOURCE_ZIP}" >> "$GITHUB_ENV"

          echo "Exact RKMS source ZIP found:"
          ls -lh "${SOURCE_ZIP}"


      # ============================================================
      # 3. SOURCE ZIP SHA256
      # ============================================================

      - name: Generate source ZIP SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum "${SOURCE_ZIP}" \
            | tee source-zip.sha256

          echo "Source SHA256:"
          cat source-zip.sha256


      # ============================================================
      # 4. EXTRACT SOURCE
      # ============================================================

      - name: Extract RKMS source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build-project

          mkdir -p build-project

          unzip -q \
            "${SOURCE_ZIP}" \
            -d build-project

          echo "Source extraction complete."


      # ============================================================
      # 5. VERIFY EXTRACTED ZIP
      # ============================================================

      - name: Verify extracted source
        shell: bash
        run: |
          set -euo pipefail

          test -d build-project

          if [ -z "$(find build-project -type f -print -quit)" ]; then
            echo "::error::Extracted source is empty."
            exit 1
          fi

          echo "Extracted source verification PASS."


      # ============================================================
      # 6. DETECT PROJECT ROOT
      # ============================================================

      - name: Detect RKMS project root
        shell: bash
        run: |
          set -euo pipefail

          ROOT=""

          if [ -f "build-project/package.json" ]; then
            ROOT="build-project"
          else
            ROOT="$(
              find build-project \
                -type f \
                -name "package.json" \
                -not -path "*/node_modules/*" \
                -print \
                | head -n 1 \
                | xargs -r dirname
            )"
          fi

          if [ -z "$ROOT" ]; then
            echo "::error::package.json not found."
            exit 1
          fi

          echo "RKMS_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "RKMS_ROOT=$ROOT"


      # ============================================================
      # 7. SOURCE VALIDATION
      # ============================================================

      - name: Validate RKMS source
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          REQUIRED_FILES=(
            "package.json"
            "app.js"
            "capacitor.config.json"
            "google-services.json"
            "scripts/setup-android-native.sh"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing required file: $file"
              exit 1
            fi
          done

          echo "Required source files PASS."


      # ============================================================
      # 8. SOURCE JAVASCRIPT SYNTAX
      # ============================================================

      - name: Verify app.js syntax
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node --check app.js

          echo "app.js syntax PASS."


      # ============================================================
      # 9. SHELL SCRIPT SYNTAX
      # ============================================================

      - name: Verify RKMS shell scripts
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          while IFS= read -r -d '' script; do
            echo "Checking: $script"
            bash -n "$script"
          done < <(
            find scripts \
              -type f \
              -name "*.sh" \
              -print0
          )

          echo "All RKMS shell scripts PASS."


      # ============================================================
      # 10. VERIFY CAPACITOR VERSIONS
      # ============================================================

      - name: Verify Capacitor versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node <<'NODE'
          const fs = require("fs");

          const p = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const deps = {
            ...(p.dependencies || {}),
            ...(p.devDependencies || {})
          };

          const required = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          for (const [name, version] of Object.entries(required)) {

            if (!deps[name]) {
              throw new Error(
                `Missing dependency: ${name}`
              );
            }

            const actual = String(deps[name]);

            if (
              actual !== version &&
              actual !== `^${version}` &&
              actual !== `~${version}`
            ) {
              throw new Error(
                `${name}: expected ${version}, found ${actual}`
              );
            }

            console.log(
              `${name}: ${actual}`
            );
          }

          console.log(
            "Capacitor validation PASS."
          );
          NODE


      # ============================================================
      # 11. SETUP NODE 22
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ env.RKMS_ROOT }}/package-lock.json


      # ============================================================
      # 12. INSTALL NPM DEPENDENCIES
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          if [ -f package-lock.json ]; then
            npm ci \
              --no-audit \
              --no-fund
          else
            npm install \
              --no-audit \
              --no-fund
          fi


      # ============================================================
      # 13. BUILD WEB APPLICATION
      # ============================================================

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          if node -e '
            const p=require("./package.json");
            process.exit(
              p.scripts && p.scripts.build ? 0 : 1
            );
          '; then

            npm run build

          else

            echo "No build script found."
            echo "Using existing web source."

          fi


      # ============================================================
      # 14. SETUP JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 15. SETUP ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ============================================================
      # 16. INSTALL ANDROID API 36
      # ============================================================

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses \
            >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "Android API 36 installed."


      # ============================================================
      # 17. VERIFY ANDROID SDK
      # ============================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          test -d \
            "$SDK/platforms/android-36"

          test -d \
            "$SDK/build-tools/36.0.0"

          test -x \
            "$SDK/build-tools/36.0.0/aapt"

          test -x \
            "$SDK/build-tools/36.0.0/apksigner"

          echo "Android API 36 PASS."
          echo "Build Tools 36.0.0 PASS."


      # ============================================================
      # 18. CREATE CAPACITOR ANDROID PROJECT
      # ============================================================

      - name: Create Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          rm -rf android

          npx cap add android


      # ============================================================
      # 19. CAPACITOR SYNC
      # ============================================================

      - name: Capacitor sync Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npx cap sync android


      # ============================================================
      # 20. CONFIGURE ANDROID API 36 / MIN SDK 23
      # ============================================================

      - name: Configure Android SDK versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_versions(path):
              if not path.exists():
                  return

              s = path.read_text(
                  encoding="utf-8"
              )

              replacements = [
                  (
                      r'(\bcompileSdkVersion\s*=\s*)\d+',
                      r'\g<1>36'
                  ),
                  (
                      r'(\btargetSdkVersion\s*=\s*)\d+',
                      r'\g<1>36'
                  ),
                  (
                      r'(\bminSdkVersion\s*=\s*)\d+',
                      r'\g<1>23'
                  ),
                  (
                      r'(\bcompileSdk\s*=\s*)\d+',
                      r'\g<1>36'
                  ),
                  (
                      r'(\btargetSdk\s*=\s*)\d+',
                      r'\g<1>36'
                  ),
                  (
                      r'(\bminSdk\s*=\s*)\d+',
                      r'\g<1>23'
                  )
              ]

              for pattern, replacement in replacements:
                  s = re.sub(
                      pattern,
                      replacement,
                      s
                  )

              path.write_text(
                  s,
                  encoding="utf-8"
              )

          replace_versions(
              Path("variables.gradle")
          )

          app = Path(
              "app/build.gradle"
          )

          if not app.exists():
              raise SystemExit(
                  "app/build.gradle missing."
              )

          replace_versions(app)

          print("compileSdk = 36")
          print("targetSdk = 36")
          print("minSdk = 23")
          PY


      # ============================================================
      # 21. CONFIGURE AGP 8.9.1
      # ============================================================

      - name: Configure AGP 8.9.1
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("build.gradle")

          if not root.exists():
              raise SystemExit(
                  "build.gradle missing."
              )

          s = root.read_text(
              encoding="utf-8"
          )

          s = re.sub(
              r'(com\.android\.tools\.build:gradle:)'
              r'[^"\']+',
              r'\g<1>8.9.1',
              s
          )

          s = re.sub(
              r'(com\.android\.application'
              r'["\']\s+version\s+["\'])'
              r'[^"\']+',
              r'\g<1>8.9.1',
              s
          )

          root.write_text(
              s,
              encoding="utf-8"
          )

          print("AGP 8.9.1 configured.")
          PY


      # ============================================================
      # 22. CONFIGURE GRADLE 8.11.1
      # ============================================================

      - name: Configure Gradle 8.11.1
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          mkdir -p gradle/wrapper

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "gradle/wrapper/gradle-wrapper.properties"
          )

          lines = []

          if p.exists():
              lines = p.read_text(
                  encoding="utf-8"
              ).splitlines()

          url = (
              "distributionUrl="
              "https\\://services.gradle.org/"
              "distributions/"
              "gradle-8.11.1-all.zip"
          )

          found = False

          for i, line in enumerate(lines):

              if line.startswith(
                  "distributionUrl="
              ):
                  lines[i] = url
                  found = True

          if not found:
              lines.append(url)

          p.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )
          PY

          chmod +x gradlew

          ./gradlew --version


      # ============================================================
      # 23. INSTALL FIREBASE CONFIG
      # ============================================================

      - name: Install Firebase google-services.json
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          test -f google-services.json

          mkdir -p android/app

          cp \
            google-services.json \
            android/app/google-services.json

          test -f \
            android/app/google-services.json


      # ============================================================
      # 24. CONFIGURE FIREBASE FCM
      # ============================================================

      - name: Configure Firebase FCM
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "app/build.gradle"
          )

          s = p.read_text(
              encoding="utf-8"
          )

          marker = "dependencies {"

          if marker not in s:
              raise SystemExit(
                  "dependencies block missing."
              )

          deps = [
              'implementation platform("com.google.firebase:firebase-bom:34.19.0")',
              'implementation "com.google.firebase:firebase-messaging"'
          ]

          for dep in deps:
              if dep not in s:
                  s = s.replace(
                      marker,
                      marker + "\n    " + dep,
                      1
                  )

          p.write_text(
              s,
              encoding="utf-8"
          )

          print(
              "Firebase dependencies configured."
          )
          PY


      # ============================================================
      # 25. CONFIGURE CREDENTIAL MANAGER
      # ============================================================

      - name: Configure Credential Manager
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "app/build.gradle"
          )

          s = p.read_text(
              encoding="utf-8"
          )

          marker = "dependencies {"

          if marker not in s:
              raise SystemExit(
                  "dependencies block missing."
              )

          deps = [
              'implementation "androidx.credentials:credentials:1.5.0"',
              'implementation "androidx.credentials:credentials-play-services-auth:1.5.0"'
          ]

          for dep in deps:
              if dep not in s:
                  s = s.replace(
                      marker,
                      marker + "\n    " + dep,
                      1
                  )

          p.write_text(
              s,
              encoding="utf-8"
          )

          print(
              "Credential Manager configured."
          )
          PY


      # ============================================================
      # 26. GOOGLE SERVICES PLUGIN
      # ============================================================

      - name: Configure Google Services plugin
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("build.gradle")
          app = Path("app/build.gradle")

          root_text = root.read_text(
              encoding="utf-8"
          )

          # --------------------------------------------------------
          # Ensure buildscript
          # --------------------------------------------------------

          m = re.search(
              r'buildscript\s*\{',
              root_text
          )

          if not m:
              raise SystemExit(
                  "buildscript block missing."
              )

          start = m.start()

          depth = 0
          end = None

          for i in range(
              start,
              len(root_text)
          ):

              if root_text[i] == "{":
                  depth += 1

              elif root_text[i] == "}":
                  depth -= 1

                  if depth == 0:
                      end = i + 1
                      break

          if end is None:
              raise SystemExit(
                  "Cannot parse buildscript."
              )

          buildscript = root_text[
              start:end
          ]

          # --------------------------------------------------------
          # google repository
          # --------------------------------------------------------

          if "google()" not in buildscript:

              repo = re.search(
                  r'repositories\s*\{',
                  buildscript
              )

              if not repo:
                  raise SystemExit(
                      "buildscript repositories missing."
                  )

              pos = repo.end()

              buildscript = (
                  buildscript[:pos]
                  + "\n        google()"
                  + buildscript[pos:]
              )

          # --------------------------------------------------------
          # Google Services classpath
          # --------------------------------------------------------

          classpath = (
              "com.google.gms:"
              "google-services:4.5.0"
          )

          if classpath not in buildscript:

              deps = re.search(
                  r'dependencies\s*\{',
                  buildscript
              )

              if not deps:
                  raise SystemExit(
                      "buildscript dependencies missing."
                  )

              pos = deps.end()

              buildscript = (
                  buildscript[:pos]
                  + "\n        classpath "
                  "'com.google.gms:"
                  "google-services:4.5.0'"
                  + buildscript[pos:]
              )

          root_text = (
              root_text[:start]
              + buildscript
              + root_text[end:]
          )

          root.write_text(
              root_text,
              encoding="utf-8"
          )

          # --------------------------------------------------------
          # App plugin
          # --------------------------------------------------------

          app_text = app.read_text(
              encoding="utf-8"
          )

          plugin = \
              "com.google.gms.google-services"

          if plugin not in app_text:

              if "plugins {" in app_text:

                  app_text = app_text.replace(
                      "plugins {",
                      "plugins {\n"
                      "    id "
                      "'com.google.gms.google-services'",
                      1
                  )

              else:

                  app_text = (
                      "apply plugin: "
                      "'com.google.gms.google-services'"
                      "\n\n"
                      + app_text
                  )

          app.write_text(
              app_text,
              encoding="utf-8"
          )

          print(
              "Google Services plugin PASS."
          )
          PY


      # ============================================================
      # 27. CONFIGURE RKMS NATIVE BRIDGE
      # ============================================================

      - name: Configure RKMS native Android bridge
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/setup-android-native.sh

          ./scripts/setup-android-native.sh


      # ============================================================
      # 28. FIX CREDENTIAL MANAGER ARGUMENT ORDER
      # ============================================================

      - name: Fix Credential Manager signature
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(
              r'createCredentialAsync\s*\(\s*'
              r'req\s*,',
              re.MULTILINE
          )

          replacement = (
              "createCredentialAsync(\n"
              "                            activity,\n"
              "                            req,"
          )

          setup = Path(
              "scripts/setup-android-native.sh"
          )

          s = setup.read_text(
              encoding="utf-8"
          )

          s, count = pattern.subn(
              replacement,
              s
          )

          setup.write_text(
              s,
              encoding="utf-8"
          )

          print(
              "Setup script Credential Manager fixes:",
              count
          )

          java_root = Path(
              "android/app/src/main/java"
          )

          for java in java_root.rglob(
              "RKMSNativeBridge.java"
          ):

              s = java.read_text(
                  encoding="utf-8"
              )

              s, count = pattern.subn(
                  replacement,
                  s
              )

              java.write_text(
                  s,
                  encoding="utf-8"
              )

              print(
                  f"{java}: {count}"
              )
          PY


      # ============================================================
      # 29. VERIFY CREDENTIAL MANAGER
      # ============================================================

      - name: Verify Credential Manager
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          BRIDGE="$(
            find android/app/src/main/java \
              -type f \
              -name "RKMSNativeBridge.java" \
              -print \
              | head -n 1
          )"

          if [ -z "$BRIDGE" ]; then
            echo "::error::RKMSNativeBridge.java not found."
            exit 1
          fi

          grep -Fq \
            "CredentialManager" \
            "$BRIDGE"

          grep -Fq \
            "CreatePasswordRequest" \
            "$BRIDGE"

          grep -Fq \
            "savePassword" \
            "$BRIDGE"

          grep -Fq \
            "createCredentialAsync" \
            "$BRIDGE"

          python3 - "$BRIDGE" <<'PY'
          from pathlib import Path
          import re
          import sys

          s = Path(
              sys.argv[1]
          ).read_text(
              encoding="utf-8"
          )

          if not re.search(
              r'createCredentialAsync\s*\(\s*'
              r'activity\s*,\s*'
              r'req\s*,',
              s,
              re.S
          ):
              raise SystemExit(
                  "Wrong Credential Manager argument order."
              )

          print(
              "Credential Manager verification PASS."
          )
          PY


      # ============================================================
      # 30. VERIFY OLD PASSWORD VAULT ABSENT
      # ============================================================

      - name: Verify old password vault removed
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          if grep -nE \
            'RKMSSecureCredentialsPlugin|RKMSSecureCredentials' \
            scripts/setup-android-native.sh; then

            echo "::error::Old custom password vault found."
            exit 1
          fi

          echo "Old custom password vault absent."


      # ============================================================
      # 31. VERIFY MICROPHONE + FILE PICKER
      # ============================================================

      - name: Verify microphone and file picker
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          grep -Fq \
            "RECORD_AUDIO" \
            scripts/setup-android-native.sh

          grep -Fq \
            "RESOURCE_AUDIO_CAPTURE" \
            scripts/setup-android-native.sh

          grep -Fq \
            "onShowFileChooser" \
            scripts/setup-android-native.sh

          grep -Fq \
            "MediaRecorder" \
            app.js

          echo "Microphone + file picker PASS."


      # ============================================================
      # 32. VERIFY KEYBOARD RESIZE
      # ============================================================

      - name: Verify keyboard resize
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          grep -Fq \
            "SOFT_INPUT_ADJUST_RESIZE" \
            scripts/setup-android-native.sh

          echo "Keyboard resize PASS."


      # ============================================================
      # 33. VERIFY FIREBASE NATIVE INITIALIZATION
      # ============================================================

      - name: Verify FirebaseApp initialization
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          MAIN_ACTIVITY="$(
            find android/app/src/main/java \
              -type f \
              -name "MainActivity.java" \
              -print \
              | head -n 1
          )"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "::error::MainActivity.java not found."
            exit 1
          fi

          grep -Fq \
            "FirebaseApp.initializeApp" \
            "$MAIN_ACTIVITY"

          echo "FirebaseApp initialization PASS."


      # ============================================================
      # 34. VERIFY FIREBASE CONFIGURATION
      # ============================================================

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          test -f \
            app/google-services.json

          grep -Fq \
            "firebase-bom:34.19.0" \
            app/build.gradle

          grep -Fq \
            "firebase-messaging" \
            app/build.gradle

          grep -Fq \
            "com.google.gms.google-services" \
            app/build.gradle

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("build.gradle")

          s = p.read_text(
              encoding="utf-8"
          )

          m = re.search(
              r'buildscript\s*\{',
              s
          )

          if not m:
              raise SystemExit(
                  "buildscript missing."
              )

          start = m.start()

          depth = 0
          end = None

          for i in range(
              start,
              len(s)
          ):

              if s[i] == "{":
                  depth += 1

              elif s[i] == "}":
                  depth -= 1

                  if depth == 0:
                      end = i + 1
                      break

          block = s[start:end]

          if (
              "com.google.gms:"
              "google-services:4.5.0"
          ) not in block:
              raise SystemExit(
                  "Google Services classpath missing."
              )

          if "google()" not in block:
              raise SystemExit(
                  "google() repository missing."
              )

          print(
              "Firebase configuration PASS."
          )
          PY


      # ============================================================
      # 35. VERIFY FIREBASE PACKAGE
      # ============================================================

      - name: Verify Firebase package
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          python3 <<'PY'
          import json

          with open(
              "app/google-services.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          found = False

          for client in data.get(
              "client",
              []
          ):

              package_name = (
                  client
                  .get(
                      "client_info",
                      {}
                  )
                  .get(
                      "android_client_info",
                      {}
                  )
                  .get(
                      "package_name"
                  )
              )

              if package_name == \
                  "org.rkms.connect":

                  found = True
                  break

          if not found:
              raise SystemExit(
                  "Firebase package mismatch."
              )

          print(
              "Firebase package PASS."
          )
          PY


      # ============================================================
      # 36. VERIFY APPLICATION ID
      # ============================================================

      - name: Verify application ID
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          grep -Rqs \
            "org.rkms.connect" \
            app/build.gradle \
            app/src/main/AndroidManifest.xml

          echo "Application ID PASS."


      # ============================================================
      # 37. FINAL ANDROID CONFIG AUDIT
      # ============================================================

      - name: Final Android configuration audit
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          echo "=============================================="
          echo "FINAL ANDROID CONFIGURATION"
          echo "=============================================="
          echo "compileSdk : 36"
          echo "targetSdk  : 36"
          echo "minSdk     : 23"
          echo "AGP        : 8.9.1"
          echo "Gradle     : 8.11.1"
          echo "Java       : 17"
          echo "Firebase   : 34.19.0"
          echo "FCM        : firebase-messaging"
          echo "Credential : 1.5.0"
          echo "Package    : org.rkms.connect"
          echo "APK ONLY   : YES"
          echo "=============================================="

          if grep -RniE \
            'minSdkVersion\s+22|minSdkVersion\s*=\s*22|minSdk\s+22|minSdk\s*=\s*22' \
            app/build.gradle \
            variables.gradle \
            2>/dev/null; then

            echo "::error::minSdk 22 still exists."
            exit 1
          fi

          echo "minSdk 22 not found."


      # ============================================================
      # 38. PREPARE RELEASE SIGNING
      # ============================================================

      - name: Prepare release signing keystore
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${RKMS_KEYSTORE_BASE64:-}" ]; then
            echo "::error::RKMS_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [ -z "${RKMS_KEY_ALIAS:-}" ]; then
            echo "::error::RKMS_KEY_ALIAS secret is missing."
            exit 1
          fi

          if [ -z "${RKMS_KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::RKMS_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "${RKMS_KEY_PASSWORD:-}" ]; then
            echo "::error::RKMS_KEY_PASSWORD secret is missing."
            exit 1
          fi

          cd "$RKMS_ROOT/android"

          echo "$RKMS_KEYSTORE_BASE64" \
            | base64 --decode \
            > rkms-release.keystore

          test -s \
            rkms-release.keystore

          echo "RKMS_KEYSTORE_PATH=$PWD/rkms-release.keystore" \
            >> "$GITHUB_ENV"

          echo "Release keystore prepared."


      # ============================================================
      # 39. CONFIGURE RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        env:
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "app/build.gradle"
          )

          s = p.read_text(
              encoding="utf-8"
          )

          # --------------------------------------------------------
          # Remove any previous workflow-generated signing block
          # if it already exists.
          # --------------------------------------------------------

          signing_pattern = re.compile(
              r'\n\s*signingConfigs\s*\{.*?\n\s*\}\s*',
              re.S
          )

          # Only remove a signingConfigs block that references
          # RKMS_KEYSTORE_PATH.
          matches = list(
              signing_pattern.finditer(s)
          )

          for m in reversed(matches):

              block = m.group(0)

              if "RKMS_KEYSTORE_PATH" in block:

                  s = (
                      s[:m.start()]
                      + "\n"
                      + s[m.end():]
                  )

          # --------------------------------------------------------
          # Ensure android block exists.
          # --------------------------------------------------------

          marker = "android {"

          if marker not in s:
              raise SystemExit(
                  "android block not found."
              )

          signing_block = r'''
          signingConfigs {
              release {
                  storeFile file(
                      System.getenv("RKMS_KEYSTORE_PATH")
                  )
                  storePassword System.getenv(
                      "RKMS_KEYSTORE_PASSWORD"
                  )
                  keyAlias System.getenv(
                      "RKMS_KEY_ALIAS"
                  )
                  keyPassword System.getenv(
                      "RKMS_KEY_PASSWORD"
                  )
              }
          }
          '''

          s = s.replace(
              marker,
              marker
              + "\n"
              + signing_block,
              1
          )

          # --------------------------------------------------------
          # Locate buildTypes release block.
          # --------------------------------------------------------

          buildtypes_pos = s.find(
              "buildTypes"
          )

          if buildtypes_pos < 0:
              raise SystemExit(
                  "buildTypes block not found."
              )

          release_pos = s.find(
              "release {",
              buildtypes_pos
          )

          if release_pos < 0:
              raise SystemExit(
                  "release buildType not found."
              )

          # --------------------------------------------------------
          # Ensure release signing config.
          # --------------------------------------------------------

          release_end = s.find(
              "}",
              release_pos
          )

          # The generated Capacitor block is normally simple.
          # Insert immediately after release {.
          insert_pos = (
              release_pos
              + len("release {")
          )

          release_section = s[
              release_pos:
          ]

          if (
              "signingConfig "
              "signingConfigs.release"
          ) not in release_section:

              s = (
                  s[:insert_pos]
                  + "\n"
                  "        signingConfig "
                  "signingConfigs.release"
                  + s[insert_pos:]
              )

          p.write_text(
              s,
              encoding="utf-8"
          )

          print(
              "Release signing configured."
          )
          PY


      # ============================================================
      # 40. VERIFY SIGNING CONFIGURATION
      # ============================================================

      - name: Verify release signing configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          grep -Fq \
            "signingConfigs {" \
            app/build.gradle

          grep -Fq \
            "signingConfigs.release" \
            app/build.gradle

          grep -Fq \
            "RKMS_KEYSTORE_PATH" \
            app/build.gradle

          test -f \
            "$RKMS_KEYSTORE_PATH"

          echo "Release signing configuration PASS."


      # ============================================================
      # 41. VERIFY NO DEBUG / AAB BUILD TASK
      # ============================================================

      - name: Verify release-only build policy
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          if grep -RniE \
            'bundleRelease|assembleDebug|bundleDebug' \
            ../.github \
            2>/dev/null; then

            echo "::warning::Other build references found."
            echo "Actual build step below uses assembleRelease only."
          fi

          echo "Release-only policy prepared."


      # ============================================================
      # 42. CLEAN
      # ============================================================

      - name: Clean Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          ./gradlew clean \
            --no-daemon


      # ============================================================
      # 43. BUILD FINAL SIGNED RELEASE APK ONLY
      # ============================================================

      - name: Build Final Signed Release APK
        shell: bash
        env:
          RKMS_KEYSTORE_PATH: ${{ env.RKMS_KEYSTORE_PATH }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          echo "=============================================="
          echo "RKMS FINAL SIGNED RELEASE APK"
          echo "=============================================="
          echo "Source ZIP       : ${SOURCE_ZIP}"
          echo "Android API      : 36"
          echo "Build Tools      : 36.0.0"
          echo "minSdk           : 23"
          echo "targetSdk        : 36"
          echo "Node             : 22"
          echo "Java             : 17"
          echo "AGP              : 8.9.1"
          echo "Gradle           : 8.11.1"
          echo "Firebase BOM     : 34.19.0"
          echo "Google Services  : 4.5.0"
          echo "Credential Mgr   : 1.5.0"
          echo "Package          : org.rkms.connect"
          echo "SIGNED           : YES"
          echo "APK ONLY         : YES"
          echo "AAB              : NO"
          echo "DEBUG APK        : NO"
          echo "=============================================="

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 44. LOCATE RELEASE APK
      # ============================================================

      - name: Locate release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          APK="$(
            find \
              app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              ! -iname "*debug*" \
              -print \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "::error::Release APK not found."

            find \
              app/build/outputs \
              -type f \
              -print \
              2>/dev/null \
              || true

            exit 1
          fi

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/${APK_NAME}"

          echo \
            "APK_PATH=$GITHUB_WORKSPACE/${APK_NAME}" \
            >> "$GITHUB_ENV"

          echo "APK created:"
          ls -lh \
            "$GITHUB_WORKSPACE/${APK_NAME}"


      # ============================================================
      # 45. VERIFY APK PACKAGE + SDK
      # ============================================================

      - name: Verify APK package and SDK
        shell: bash
        run: |
          set -euo pipefail

          APK="$APK_PATH"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt" \
            dump badging \
            "$APK" \
            > "$GITHUB_WORKSPACE/apk-badging.txt"

          cat \
            "$GITHUB_WORKSPACE/apk-badging.txt"

          grep -Fq \
            "package: name='${APP_ID}'" \
            "$GITHUB_WORKSPACE/apk-badging.txt"

          grep -Fq \
            "targetSdkVersion:'36'" \
            "$GITHUB_WORKSPACE/apk-badging.txt"

          echo "APK package and SDK PASS."


      # ============================================================
      # 46. VERIFY APK SIGNATURE
      # ============================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="$APK_PATH"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" \
            verify \
            --verbose \
            "$APK"

          echo "APK SIGNATURE PASS."


      # ============================================================
      # 47. VERIFY SIGNER CERTIFICATE
      # ============================================================

      - name: Verify APK signer certificate
        shell: bash
        run: |
          set -euo pipefail

          APK="$APK_PATH"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" \
            verify \
            --print-certs \
            "$APK"

          echo "Signer certificate verified."


      # ============================================================
      # 48. VERIFY APK IS RELEASE / NOT DEBUG
      # ============================================================

      - name: Verify APK is not debug
        shell: bash
        run: |
          set -euo pipefail

          APK="$APK_PATH"

          BADGING="$(
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt" \
              dump badging \
              "$APK"
          )"

          if echo "$BADGING" | grep -qi "debug"; then
            echo "::error::Debug APK detected."
            exit 1
          fi

          echo "Release APK verification PASS."


      # ============================================================
      # 49. SHA256
      # ============================================================

      - name: Generate APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          sha256sum \
            "$APK_NAME" \
            | tee \
              "${APK_NAME}.sha256"


      # ============================================================
      # 50. FINAL APK-ONLY AUDIT
      # ============================================================

      - name: Final APK-only audit
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          echo "=============================================="
          echo "FINAL ARTIFACT AUDIT"
          echo "=============================================="

          echo "APK files:"
          find . \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -printf "%f\n" \
            | sort

          echo ""
          echo "AAB files:"
          find . \
            -maxdepth 1 \
            -type f \
            -name "*.aab" \
            -printf "%f\n" \
            | sort \
            || true

          echo ""
          echo "SHA256 files:"
          find . \
            -maxdepth 1 \
            -type f \
            -name "*.sha256" \
            -printf "%f\n" \
            | sort

          # --------------------------------------------------------
          # No AAB
          # --------------------------------------------------------

          if find . \
            -maxdepth 1 \
            -type f \
            -name "*.aab" \
            | grep -q .; then

            echo "::error::AAB detected."
            exit 1
          fi

          # --------------------------------------------------------
          # No debug APK
          # --------------------------------------------------------

          if find . \
            -maxdepth 1 \
            -type f \
            -iname "*debug*.apk" \
            | grep -q .; then

            echo "::error::Debug APK detected."
            exit 1
          fi

          # --------------------------------------------------------
          # Required final APK
          # --------------------------------------------------------

          test -f \
            "$APK_NAME"

          test -f \
            "${APK_NAME}.sha256"

          # --------------------------------------------------------
          # APK size sanity
          # --------------------------------------------------------

          SIZE_BYTES=$(
            stat -c%s "$APK_NAME"
          )

          if [ "$SIZE_BYTES" -le 1000000 ]; then
            echo "::error::APK size is unexpectedly small."
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "FINAL AUDIT PASSED"
          echo "=============================================="
          echo "APK ONLY       : YES"
          echo "AAB            : NO"
          echo "DEBUG APK      : NO"
          echo "SIGNED         : YES"
          echo "API            : 36"
          echo "MIN SDK        : 23"
          echo "TARGET SDK     : 36"
          echo "PACKAGE        : ${APP_ID}"
          echo "APK            : ${APK_NAME}"
          echo "SIZE BYTES     : ${SIZE_BYTES}"
          echo "=============================================="


      # ============================================================
      # 51. UPLOAD FINAL APK + SHA256
      # ============================================================

      - name: Upload final APK and SHA256
        uses: actions/upload-artifact@v4
        with:
          name: RKMS_ANDROID16_API36_SIGNED_RELEASE_APK
          if-no-files-found: error
          path: |
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256
          retention-days: 30

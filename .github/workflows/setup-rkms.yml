name: RKMS Final Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  APP_ID: "org.rkms.connect"
  MIN_SDK: "23"

  # IMPORTANT:
  # Repository ke root me jis naam se source ZIP rakhi hai,
  # yahi exact naam yahan hona chahiye.
  SOURCE_ZIP: "RKMS_CONNECT_FINAL_FIXED_RELEASE_APK_BUILD_20260923.zip"

jobs:
  build:
    name: RKMS Final Signed Release APK
    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. NODE 22
      # =========================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      # =========================================================
      # 3. JAVA 17
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # =========================================================
      # 4. HOST PACKAGES
      # =========================================================

      - name: Install required host packages
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            rsync

          unzip -v >/dev/null
          rsync --version >/dev/null

          echo "HOST PACKAGES: PASS"

      # =========================================================
      # 5. ANDROID SDK
      # =========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android API 36 SDK
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            if [ -n "${ANDROID_HOME:-}" ]; then
              export ANDROID_SDK_ROOT="$ANDROID_HOME"
            else
              echo "::error::Android SDK path missing."
              exit 1
            fi
          fi

          export PATH="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${ANDROID_SDK_ROOT}/platform-tools:${PATH}"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            --sdk_root="${ANDROID_SDK_ROOT}" \
            --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          test -d \
            "${ANDROID_SDK_ROOT}/platforms/android-${ANDROID_API}"

          test -d \
            "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}"

          test -x \
            "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/aapt"

          test -x \
            "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/apksigner"

          test -x \
            "${ANDROID_SDK_ROOT}/platform-tools/adb"

          echo "ANDROID API 36: PASS"
          echo "BUILD TOOLS 36.0.0: PASS"
          echo "AAPT: PASS"
          echo "APKSIGNER: PASS"
          echo "ADB: PASS"

      # =========================================================
      # 6. FIND SOURCE ZIP
      # =========================================================

      - name: Locate RKMS source ZIP
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="$GITHUB_WORKSPACE/$SOURCE_ZIP"

          if [ ! -s "$EXPECTED" ]; then
            echo "::error::Configured source ZIP was not found:"
            echo "$EXPECTED"

            echo ""
            echo "Available ZIP files:"

            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "*.zip" \
              -print \
              | sort

            exit 1
          fi

          SOURCE_SHA256="$(
            sha256sum "$EXPECTED" | awk '{print $1}'
          )"

          echo "RKMS_SOURCE_ZIP=$EXPECTED" >> "$GITHUB_ENV"
          echo "RKMS_SOURCE_SHA256=$SOURCE_SHA256" >> "$GITHUB_ENV"

          echo "SOURCE ZIP:"
          echo "$EXPECTED"

          echo "SOURCE SHA256:"
          echo "$SOURCE_SHA256"

          echo "SOURCE ZIP: PASS"

      # =========================================================
      # 7. EXTRACT SOURCE
      # =========================================================

      - name: Extract RKMS source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/rkms-source"

          mkdir -p "$GITHUB_WORKSPACE/rkms-source"

          unzip -q \
            "$RKMS_SOURCE_ZIP" \
            -d "$GITHUB_WORKSPACE/rkms-source"

          PACKAGE_FILE="$(
            find "$GITHUB_WORKSPACE/rkms-source" \
              -type f \
              -name "package.json" \
              -not -path "*/node_modules/*" \
              -print \
              -quit
          )"

          if [ -z "$PACKAGE_FILE" ]; then
            echo "::error::package.json not found inside source ZIP."
            exit 1
          fi

          RKMS_ROOT="$(
            cd "$(dirname "$PACKAGE_FILE")" \
            && pwd
          )"

          echo "RKMS_ROOT=$RKMS_ROOT" >> "$GITHUB_ENV"

          echo "RKMS ROOT:"
          echo "$RKMS_ROOT"

          echo "SOURCE EXTRACTION: PASS"

      # =========================================================
      # 8. VERIFY SOURCE
      # =========================================================

      - name: Verify audited source
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          REQUIRED_FILES=(
            "package.json"
            "package-lock.json"
            "app.js"
            "index.html"
            "styles.css"
            "capacitor.config.json"
            "google-services.json"
            "scripts/setup-android-native.sh"
            "scripts/configure-android-16.sh"
            "scripts/configure-release-signing.sh"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -s "$FILE" ]; then
              echo "::error::Missing required file: $FILE"
              exit 1
            fi
          done

          node --check app.js

          python3 -m json.tool \
            capacitor.config.json \
            >/dev/null

          python3 -m json.tool \
            google-services.json \
            >/dev/null

          bash -n \
            scripts/setup-android-native.sh

          bash -n \
            scripts/configure-android-16.sh

          bash -n \
            scripts/configure-release-signing.sh

          echo "SOURCE STRUCTURE: PASS"
          echo "JAVASCRIPT SYNTAX: PASS"
          echo "JSON SYNTAX: PASS"
          echo "SHELL SYNTAX: PASS"

      # =========================================================
      # 9. CAPACITOR VERSION CHECK
      # =========================================================

      - name: Verify Capacitor package versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node <<'NODE'
          const fs = require("fs");

          const p = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const d = Object.assign(
            {},
            p.dependencies || {},
            p.devDependencies || {}
          );

          const wanted = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          for (
            const [name, version]
            of Object.entries(wanted)
          ) {
            if (d[name] !== version) {
              throw new Error(
                `${name}: expected ${version}, found ${d[name] || "MISSING"}`
              );
            }
          }

          if (
            !p.scripts ||
            typeof p.scripts.build !== "string" ||
            !p.scripts.build.trim()
          ) {
            throw new Error(
              "npm build script missing"
            );
          }

          console.log(
            "CAPACITOR VERSION CHECK: PASS"
          );
          NODE

      # =========================================================
      # 10. FIREBASE CONFIG
      # =========================================================

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node <<'NODE'
          const fs = require("fs");

          const d = JSON.parse(
            fs.readFileSync(
              "google-services.json",
              "utf8"
            )
          );

          const ok = (
            d.client || []
          ).some(
            c =>
              c.client_info &&
              c.client_info.android_client_info &&
              c.client_info.android_client_info.package_name ===
              "org.rkms.connect"
          );

          if (!ok) {
            throw new Error(
              "org.rkms.connect not found in google-services.json"
            );
          }

          console.log(
            "FIREBASE CONFIGURATION: PASS"
          );
          NODE

      # =========================================================
      # 11. FCM SOURCE CHECK
      # =========================================================

      - name: Verify FCM notification source
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node <<'NODE'
          const fs = require("fs");

          const pkg = JSON.parse(
            fs.readFileSync(
              "package.json",
              "utf8"
            )
          );

          const deps = Object.assign(
            {},
            pkg.dependencies || {},
            pkg.devDependencies || {}
          );

          if (
            !deps["@capacitor/push-notifications"]
          ) {
            throw new Error(
              "@capacitor/push-notifications dependency missing"
            );
          }

          const app = fs.readFileSync(
            "app.js",
            "utf8"
          );

          const checks = [
            [
              "PushNotifications reference",
              /PushNotifications/
            ],
            [
              "register call",
              /\.register\s*\(/
            ],
            [
              "received listener",
              /pushNotificationReceived/
            ],
            [
              "action listener",
              /pushNotificationActionPerformed/
            ]
          ];

          for (
            const [name, pattern]
            of checks
          ) {
            if (!pattern.test(app)) {
              throw new Error(
                name +
                " not found in app.js"
              );
            }
          }

          console.log(
            "FCM SOURCE IMPLEMENTATION: PASS"
          );
          NODE

          node --check app.js

          echo "FCM SOURCE: PASS"

      # =========================================================
      # 12. INSTALL NPM
      # =========================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm ci \
            --no-audit \
            --no-fund

          echo "NPM INSTALL: PASS"

      # =========================================================
      # 13. VERIFY CAPACITOR FCM
      # =========================================================

      - name: Verify Capacitor FCM plugin dependency
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          PLUGIN_DIR="node_modules/@capacitor/push-notifications/android"

          test -d "$PLUGIN_DIR"

          test -f \
            "$PLUGIN_DIR/build.gradle"

          grep -Rqs \
            "firebase-messaging" \
            "$PLUGIN_DIR"

          echo "CAPACITOR FCM PLUGIN: PASS"

      # =========================================================
      # 14. BUILD WEB
      # =========================================================

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm run build

          test -s \
            dist/index.html

          echo "WEB BUILD: PASS"

      # =========================================================
      # 15. CREATE ANDROID
      # =========================================================

      - name: Generate fresh Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          rm -rf android

          npx cap add android

          test -s \
            android/gradlew

          test -s \
            android/app/build.gradle

          chmod +x \
            android/gradlew

          echo "CAPACITOR ANDROID GENERATION: PASS"

      # =========================================================
      # 16. ANDROID 16 / API 36
      # =========================================================

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/configure-android-16.sh

          bash \
            scripts/configure-android-16.sh

          grep -Fq \
            "gradle-8.11.1-bin.zip" \
            android/gradle/wrapper/gradle-wrapper.properties

          grep -Fq \
            "com.android.tools.build:gradle:8.9.1" \
            android/build.gradle

          grep -Eq \
            "compileSdkVersion[[:space:]]*=[[:space:]]*36" \
            android/variables.gradle

          grep -Eq \
            "targetSdkVersion[[:space:]]*=[[:space:]]*36" \
            android/variables.gradle

          echo "ANDROID 16 API 36: PASS"

      # =========================================================
      # 17. MIN SDK 23
      # =========================================================

      - name: Configure minimum Android SDK
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          if [ -f android/variables.gradle ]; then
            sed -i \
              -E \
              's/(minSdkVersion[[:space:]]*=[[:space:]]*)22/\123/g' \
              android/variables.gradle
          fi

          if grep -Rqs \
            -E \
            "minSdkVersion[[:space:]]*22|minSdk[[:space:]]*22" \
            android
          then
            echo "::error::minSdk 22 is still present."
            exit 1
          fi

          echo "MIN SDK 23: PASS"

      # =========================================================
      # 18. CAPACITOR SYNC
      # =========================================================

      - name: Sync Capacitor Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npx cap sync android

          test -s \
            android/app/build.gradle

          test -s \
            android/app/src/main/AndroidManifest.xml

          echo "CAPACITOR SYNC: PASS"

      # =========================================================
      # 19. RE-APPLY MIN SDK AFTER SYNC
      # =========================================================

      - name: Re-apply minimum Android SDK after Capacitor sync
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          if [ -f android/variables.gradle ]; then
            sed -i \
              -E \
              's/(minSdkVersion[[:space:]]*=[[:space:]]*)22/\123/g' \
              android/variables.gradle
          fi

          if grep -Rqs \
            -E \
            "minSdkVersion[[:space:]]*22|minSdk[[:space:]]*22" \
            android
          then
            echo "::error::minSdk 22 remains after Capacitor sync."
            exit 1
          fi

          echo "POST-SYNC MIN SDK 23: PASS"

      # =========================================================
      # 20. NATIVE RKMS SETUP
      # =========================================================

      - name: Apply RKMS native Android setup
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/setup-android-native.sh

          bash \
            scripts/setup-android-native.sh

          echo "RKMS NATIVE ANDROID SETUP: PASS"

      # =========================================================
      # 21. VERIFY MAIN ACTIVITY
      # =========================================================

      - name: Verify generated MainActivity
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          MAIN_ACTIVITY="$(
            find android/app/src/main \
              -type f \
              -name "MainActivity.java" \
              -print \
              -quit
          )"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "::error::MainActivity.java not found."
            exit 1
          fi

          grep -Fq \
            "RKMSNativeBridge" \
            "$MAIN_ACTIVITY"

          grep -Fq \
            "FirebaseApp.initializeApp(this)" \
            "$MAIN_ACTIVITY"

          grep -Fq \
            "onNewIntent" \
            "$MAIN_ACTIVITY"

          echo "MAIN ACTIVITY: PASS"
          echo "RKMSNativeBridge: PASS"
          echo "FirebaseApp: PASS"
          echo "Notification intent: PASS"

      # =========================================================
      # 22. FIREBASE APP DEPENDENCY
      # =========================================================

      - name: Add Firebase Messaging dependency
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          dep = (
              'implementation '
              '"com.google.firebase:firebase-messaging:25.0.1"'
          )

          if "com.google.firebase:firebase-messaging:" not in s:
              marker = "dependencies {"

              if marker not in s:
                  raise SystemExit(
                      "dependencies block missing"
                  )

              s = s.replace(
                  marker,
                  marker + "\n    " + dep,
                  1
              )

              p.write_text(s)

          print(
              "FIREBASE MESSAGING DEPENDENCY: PASS"
          )
          PY

          grep -Fq \
            "com.google.firebase:firebase-messaging:" \
            android/app/build.gradle

      # =========================================================
      # 23. FIREBASE GRADLE RESOLUTION
      # =========================================================

      - name: Verify Firebase Gradle dependency resolution
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          ./gradlew \
            :app:dependencies \
            --configuration releaseRuntimeClasspath \
            --no-daemon \
            > firebase-runtime-dependencies.txt

          grep -Eqi \
            "firebase-messaging|com.google.firebase:firebase-messaging" \
            firebase-runtime-dependencies.txt

          echo "FIREBASE MESSAGING RESOLUTION: PASS"

      # =========================================================
      # 24. SDK LEVEL FINAL CHECK
      # =========================================================

      - name: Verify Android SDK levels
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          grep -Eq \
            "compileSdkVersion[[:space:]]*=[[:space:]]*36" \
            android/variables.gradle

          grep -Eq \
            "targetSdkVersion[[:space:]]*=[[:space:]]*36" \
            android/variables.gradle

          grep -Eq \
            "minSdkVersion[[:space:]]*=[[:space:]]*23" \
            android/variables.gradle

          echo "COMPILE SDK: 36"
          echo "TARGET SDK: 36"
          echo "MIN SDK: 23"
          echo "SDK LEVELS: PASS"

      # =========================================================
      # 25. STATIC AUDITS
      # =========================================================

      - name: Run RKMS static audits
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 \
            scripts/verify-fcm-pipeline.py

          python3 \
            scripts/verify-rkms-final.py

          if [ -f scripts/verify-final-login-navigation.py ]; then
            python3 scripts/verify-final-login-navigation.py
          fi

          if [ -f scripts/verify-final-three-point-fix.py ]; then
            python3 scripts/verify-final-three-point-fix.py
          fi

          if [ -f scripts/verify-chat-mic-final.py ]; then
            python3 scripts/verify-chat-mic-final.py
          fi

          if [ -f scripts/verify-saved-login.py ]; then
            python3 scripts/verify-saved-login.py
          fi

          node --check app.js

          echo "RKMS STATIC AUDITS: PASS"

      # =========================================================
      # 26. SIGNING SECRETS
      # =========================================================

      - name: Verify release signing secrets
        shell: bash
        run: |
          set -euo pipefail

          test -n "${RKMS_KEYSTORE_BASE64:-}" || {
            echo "::error::RKMS_KEYSTORE_BASE64 missing."
            exit 1
          }

          test -n "${RKMS_KEYSTORE_PASSWORD:-}" || {
            echo "::error::RKMS_KEYSTORE_PASSWORD missing."
            exit 1
          }

          test -n "${RKMS_KEY_ALIAS:-}" || {
            echo "::error::RKMS_KEY_ALIAS missing."
            exit 1
          }

          test -n "${RKMS_KEY_PASSWORD:-}" || {
            echo "::error::RKMS_KEY_PASSWORD missing."
            exit 1
          }

          echo "RELEASE SIGNING SECRETS: PASS"

      # =========================================================
      # 27. RELEASE SIGNING
      # =========================================================

      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/configure-release-signing.sh

          bash \
            scripts/configure-release-signing.sh

          test -s \
            android/app/release.keystore

          keytool \
            -list \
            -keystore android/app/release.keystore \
            -storepass "$RKMS_KEYSTORE_PASSWORD" \
            -alias "$RKMS_KEY_ALIAS" \
            >/dev/null

          grep -Fq \
            "signingConfigs.release" \
            android/app/build.gradle

          echo "RELEASE SIGNING: PASS"

      # =========================================================
      # 28. GRADLE
      # =========================================================

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          chmod +x gradlew

          grep -Fq \
            "gradle-8.11.1-bin.zip" \
            gradle/wrapper/gradle-wrapper.properties

          ./gradlew \
            --version

          echo "GRADLE 8.11.1: PASS"

      # =========================================================
      # 29. COMPILE JAVA
      # =========================================================

      - name: Compile release Java
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          ./gradlew \
            :app:compileReleaseJavaWithJavac \
            --no-daemon \
            --stacktrace

          echo "RELEASE JAVA COMPILE: PASS"

      # =========================================================
      # 30. RELEASE MANIFEST
      # =========================================================

      - name: Verify release manifest merge
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          ./gradlew \
            :app:processReleaseMainManifest \
            --no-daemon \
            --stacktrace

          echo "RELEASE MANIFEST: PASS"

      # =========================================================
      # 31. CLEAN + ONLY RELEASE APK
      # =========================================================

      - name: Build ONLY signed release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          ./gradlew \
            clean \
            --no-daemon

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          EXPECTED_APK="$RKMS_ROOT/android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Release APK was not produced."

            find "$RKMS_ROOT/android" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo "RKMS_RELEASE_APK=$EXPECTED_APK" >> "$GITHUB_ENV"

          echo "SIGNED RELEASE APK:"
          echo "$EXPECTED_APK"

          echo "RELEASE APK BUILD: PASS"

      # =========================================================
      # 32. PACKAGE CHECK
      # =========================================================

      - name: Verify release APK package
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt" \
            dump badging \
            "$RKMS_RELEASE_APK" \
            > apk-badging.txt

          grep -Fq \
            "package: name='${APP_ID}'" \
            apk-badging.txt

          echo "PACKAGE: ${APP_ID}"
          echo "APK PACKAGE CHECK: PASS"

      # =========================================================
      # 33. SIGNATURE CHECK
      # =========================================================

      - name: Verify release APK signature
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

          test -x "$APKSIGNER"

          "$APKSIGNER" \
            verify \
            --verbose \
            "$RKMS_RELEASE_APK" \
            | tee apk-signature-verify.txt

          "$APKSIGNER" \
            verify \
            --print-certs \
            "$RKMS_RELEASE_APK" \
            | tee apk-signature-certificate.txt

          grep -Eq \
            "Verified using v2 scheme.*true" \
            apk-signature-verify.txt

          grep -Eiq \
            "Signer|certificate|SHA-256 digest" \
            apk-signature-certificate.txt

          echo "APK SIGNATURE: PASS"

      # =========================================================
      # 34. SHA256
      # =========================================================

      - name: Generate APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          sha256sum \
            "$RKMS_RELEASE_APK" \
            | tee release-apk-sha256.txt

          APK_SIZE="$(
            stat -c%s \
            "$RKMS_RELEASE_APK"
          )"

          if [ "$APK_SIZE" -le 100000 ]; then
            echo "::error::APK size suspiciously small."
            exit 1
          fi

          echo "APK SIZE: $APK_SIZE bytes"
          echo "APK SHA256: PASS"

      # =========================================================
      # 35. FINAL AUDIT
      # =========================================================

      - name: Final Android 16 API 36 audit
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          test -s \
            "$RKMS_RELEASE_APK"

          test -s \
            release-apk-sha256.txt

          grep -Eq \
            "compileSdkVersion[[:space:]]*=[[:space:]]*36" \
            android/variables.gradle

          grep -Eq \
            "targetSdkVersion[[:space:]]*=[[:space:]]*36" \
            android/variables.gradle

          grep -Eq \
            "minSdkVersion[[:space:]]*=[[:space:]]*23" \
            android/variables.gradle

          grep -Fq \
            "gradle-8.11.1-bin.zip" \
            android/gradle/wrapper/gradle-wrapper.properties

          grep -Fq \
            "com.android.tools.build:gradle:8.9.1" \
            android/build.gradle

          echo "=============================================="
          echo "FINAL RKMS ANDROID AUDIT"
          echo "=============================================="
          echo "Android API       : 36"
          echo "Target SDK        : 36"
          echo "Min SDK           : 23"
          echo "Build Tools       : 36.0.0"
          echo "Gradle            : 8.11.1"
          echo "AGP               : 8.9.1"
          echo "Package           : org.rkms.connect"
          echo "Build Type        : SIGNED RELEASE APK"
          echo "Debug APK         : NOT BUILT"
          echo "AAB               : NOT BUILT"
          echo "=============================================="

          echo "FINAL AUDIT: PASS"

      # =========================================================
      # 36. UPLOAD ONLY APK
      # =========================================================

      - name: Upload final signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-Final-Signed-Release-APK
          path: |
            ${{ env.RKMS_RELEASE_APK }}
            ${{ env.RKMS_ROOT }}/release-apk-sha256.txt
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 37. FINAL RESULT
      # =========================================================

      - name: Final build result
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " RKMS CONNECT FINAL SIGNED RELEASE APK"
          echo "=============================================="
          echo "BUILD       : SUCCESS"
          echo "ANDROID API : 36"
          echo "TARGET SDK  : 36"
          echo "MIN SDK     : 23"
          echo "PACKAGE     : org.rkms.connect"
          echo "TYPE        : SIGNED RELEASE APK"
          echo "DEBUG APK   : NOT BUILT"
          echo "AAB         : NOT BUILT"
          echo "SIGNATURE   : VERIFIED"
          echo "SHA256      : GENERATED"
          echo "=============================================="

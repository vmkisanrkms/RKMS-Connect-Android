name: RKMS Android 16 API 36 - Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Build RKMS Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # PREPARE SOURCE
      # =========================================================
      - name: Prepare RKMS source
        run: |
          set -e

          SOURCE_ZIP="RKMS_CONNECT_CONTENT_SCOPE_FINAL_AUDITED_2026-09-16.zip"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERROR: Source ZIP not found"
            ls -lah
            exit 1
          fi

          unzip -q -o "$SOURCE_ZIP" -d .

          test -f package.json
          test -f app.js
          test -f index.html
          test -f styles.css
          test -f capacitor.config.json
          test -f google-services.json
          test -d scripts

          echo "RKMS source preparation PASS"

      # =========================================================
      # NODE 22
      # =========================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify source files
        run: |
          set -e

          test -f package.json
          test -f app.js
          test -f index.html
          test -f styles.css
          test -f capacitor.config.json
          test -f google-services.json
          test -d scripts

          echo "Source files OK"

      # =========================================================
      # JAVASCRIPT
      # =========================================================
      - name: Check JavaScript syntax
        run: |
          set -e
          node --check app.js
          echo "JavaScript syntax PASS"

      # =========================================================
      # NPM
      # =========================================================
      - name: Install npm dependencies
        run: |
          set -e
          npm install --no-audit --no-fund

      # =========================================================
      # JDK 17
      # =========================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # ANDROID SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android 16 API 36
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          yes | sdkmanager --licenses >/dev/null || true

      - name: Verify Android SDK
        run: |
          set -e

          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -d "$ANDROID_SDK_ROOT/build-tools/36.0.0"

          echo "Android API 36 PASS"

      # =========================================================
      # WEB BUILD
      # =========================================================
      - name: Build web application
        run: |
          set -e
          npm run build

      - name: Verify Capacitor
        run: |
          set -e
          npx cap --version

      # =========================================================
      # ANDROID PROJECT
      # =========================================================
      - name: Generate Android project
        run: |
          set -e

          rm -rf android
          npx cap add android

      - name: Configure Firebase
        run: |
          set -e

          test -f google-services.json

          mkdir -p android/app
          cp google-services.json android/app/google-services.json

          echo "Firebase configuration copied"

      # =========================================================
      # ANDROID 16 CONFIG
      # =========================================================
      - name: Configure Android 16
        run: |
          set -e

          chmod +x scripts/configure-android-16.sh
          ./scripts/configure-android-16.sh

      - name: Capacitor sync
        run: |
          set -e
          npx cap sync android

      # =========================================================
      # NATIVE CONFIG
      # =========================================================
      - name: Setup Android native configuration
        run: |
          set -e

          chmod +x scripts/setup-android-native.sh
          ./scripts/setup-android-native.sh

      # =========================================================
      # AUDITS
      # =========================================================
      - name: Verify Android 16
        run: |
          set -e
          python3 scripts/verify-android-16.py

      - name: Verify Android PDF pipeline
        run: |
          set -e
          python3 scripts/verify-android-pdf.py

      - name: Verify native bridge
        run: |
          set -e
          python3 scripts/verify-native-bridge.py

      - name: Verify RKMS final
        run: |
          set -e
          python3 scripts/verify-rkms-final.py

      - name: Verify member directory scope
        run: |
          set -e
          python3 scripts/verify-member-directory-scope.py

      - name: Verify directory lists
        run: |
          set -e
          python3 scripts/verify-directory-lists.py

      - name: Verify directory deep audit
        run: |
          set -e
          python3 scripts/verify-v17-directory-deep.py

      - name: Verify authority hierarchy
        run: |
          set -e
          python3 scripts/verify-authority-hierarchy.py

      - name: Verify directory contact actions
        run: |
          set -e
          python3 scripts/verify-directory-contact-actions.py

      - name: Verify final login navigation
        run: |
          set -e
          python3 scripts/verify-final-login-navigation.py

      - name: Verify profile update
        run: |
          set -e
          python3 scripts/verify-profile-update-final.py

      - name: Verify report download scope
        run: |
          set -e
          python3 scripts/verify-report-download-scope.py

      - name: Verify PDF pipeline
        run: |
          set -e
          python3 scripts/verify-pdf-pipeline.py

      # =========================================================
      # LOGO
      # =========================================================
      - name: Verify launcher logo protection
        run: |
          set -e

          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          p = Path("assets/rkms-launcher-original-transparent.png")

          if not p.exists():
              raise SystemExit("Original RKMS launcher logo missing")

          print(
              "RKMS launcher original SHA256:",
              hashlib.sha256(p.read_bytes()).hexdigest()
          )

          print("Launcher logo protection PASS")
          PY

      # =========================================================
      # NO X / TWITTER
      # =========================================================
      - name: Verify no X Twitter assets
        run: |
          set -e

          if grep -RniE 'twitter|x\.com|twitter\.com' \
            app.js index.html styles.css 2>/dev/null; then
            echo "Forbidden X/Twitter reference found"
            exit 1
          fi

          echo "No X/Twitter reference PASS"

      # =========================================================
      # GRADLE
      # =========================================================
      - name: Verify Gradle configuration
        run: |
          set -e

          test -f android/gradlew
          chmod +x android/gradlew

          grep -R 'compileSdk.*36' android \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            || true

          echo "Gradle configuration checked"

      # =========================================================
      # MANDATORY RELEASE SIGNING
      # =========================================================
      - name: Configure mandatory release signing
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -e

          echo "Checking release signing secrets..."

          if [ -z "${RKMS_KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: RKMS_KEYSTORE_BASE64 secret missing"
            exit 1
          fi

          if [ -z "${RKMS_KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: RKMS_KEYSTORE_PASSWORD secret missing"
            exit 1
          fi

          if [ -z "${RKMS_KEY_ALIAS:-}" ]; then
            echo "ERROR: RKMS_KEY_ALIAS secret missing"
            exit 1
          fi

          if [ -z "${RKMS_KEY_PASSWORD:-}" ]; then
            echo "ERROR: RKMS_KEY_PASSWORD secret missing"
            exit 1
          fi

          echo "$RKMS_KEYSTORE_BASE64" | base64 --decode \
            > android/app/rkms-release.keystore

          test -s android/app/rkms-release.keystore

          printf '%s\n' \
            "RKMS_KEYSTORE_FILE=../app/rkms-release.keystore" \
            "RKMS_KEYSTORE_PASSWORD=$RKMS_KEYSTORE_PASSWORD" \
            "RKMS_KEY_ALIAS=$RKMS_KEY_ALIAS" \
            "RKMS_KEY_PASSWORD=$RKMS_KEY_PASSWORD" \
            >> android/gradle.properties

          echo "Keystore created successfully"

      # =========================================================
      # ACTUALLY CONNECT SIGNING CONFIG TO RELEASE BUILD
      # =========================================================
      - name: Apply release signing configuration
        env:
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          if "signingConfigs" in s and "rkms-release.keystore" in s:
              print("Release signing configuration already present")
          else:
              s += r'''

          // RKMS mandatory release signing
          android {
              signingConfigs {
                  release {
                      storeFile file("rkms-release.keystore")
                      storePassword project.findProperty("RKMS_KEYSTORE_PASSWORD")
                      keyAlias project.findProperty("RKMS_KEY_ALIAS")
                      keyPassword project.findProperty("RKMS_KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          '''

              p.write_text(s)

          print("Release signing configuration applied")
          PY

          grep -n "rkms-release.keystore" android/app/build.gradle

      # =========================================================
      # GRADLE
      # =========================================================
      - name: Make Gradle executable
        run: |
          chmod +x android/gradlew

      # =========================================================
      # BUILD RELEASE
      # =========================================================
      - name: Build signed release APK
        working-directory: android
        run: |
          set -e

          ./gradlew clean

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

      # =========================================================
      # LOCATE APK
      # =========================================================
      - name: Locate APK
        run: |
          set -e

          find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      # =========================================================
      # APK MUST EXIST
      # =========================================================
      - name: Verify APK exists
        run: |
          set -e

          APK=$(find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK found: $APK"

      # =========================================================
      # MANDATORY APK SIGNATURE VERIFICATION
      # =========================================================
      - name: Verify APK signature - mandatory
        run: |
          set -e

          APK=$(find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found"
            exit 1
          fi

          echo "Verifying APK signature..."

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

          echo "APK SIGNATURE VERIFICATION PASS"

      # =========================================================
      # ENSURE APK IS NOT UNSIGNED
      # =========================================================
      - name: Verify signed APK certificate
        run: |
          set -e

          APK=$(find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

          CERT_OUTPUT=$(
            "$APKSIGNER" verify \
              --verbose \
              --print-certs \
              "$APK" 2>&1
          )

          echo "$CERT_OUTPUT"

          echo "$CERT_OUTPUT" | grep -q "Verified using v2 scheme" \
            || echo "$CERT_OUTPUT" | grep -q "Verified using v3 scheme"

          echo "SIGNED APK CERTIFICATE CHECK PASS"

      # =========================================================
      # PREPARE FINAL APK
      # =========================================================
      - name: Prepare final APK
        run: |
          set -e

          mkdir -p release

          APK=$(find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          cp "$APK" \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          sha256sum \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk \
            | tee \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.sha256

      # =========================================================
      # FINAL ARTIFACT
      # =========================================================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RKMS_CONNECT_ANDROID16_API36_RELEASE
          path: |
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.sha256
          if-no-files-found: error

      # =========================================================
      # SUMMARY
      # =========================================================
      - name: Final build summary
        run: |
          echo "========================================"
          echo "RKMS CONNECT BUILD SUCCESS"
          echo "Android API: 36"
          echo "Target SDK: 36"
          echo "Node: 22"
          echo "JDK: 17"
          echo "RELEASE SIGNING: VERIFIED"
          echo "APK:"
          ls -lh release/
          echo "========================================"

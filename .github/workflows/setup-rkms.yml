name: RKMS Android 16 API 36 AAB

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    name: Build RKMS Android 16 / API 36
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # SOURCE
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # NODE.JS
      # =========================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Node.js and npm
        run: |
          node --version
          npm --version

      - name: Install npm dependencies
        run: |
          npm install

      # =========================================================
      # JAVA
      # =========================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        run: |
          java -version
          javac -version

      # =========================================================
      # ANDROID SDK
      # =========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android 16 API 36
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

          echo "Android 16 / API 36 SDK:"
          ls -la "$ANDROID_HOME/platforms/android-36"

          echo "Build Tools 36.0.0:"
          ls -la "$ANDROID_HOME/build-tools/36.0.0"

      # =========================================================
      # CAPACITOR DEPENDENCIES
      # =========================================================

      - name: Verify Capacitor packages
        run: |
          npm ls @capacitor/core
          npm ls @capacitor/android
          npm ls @capacitor/app
          npm ls @capacitor/push-notifications

      # =========================================================
      # WEB BUILD
      # =========================================================

      - name: Build web application
        run: |
          npm run build

      - name: Verify web build
        run: |
          test -d dist
          echo "Web build verified."
          find dist -maxdepth 2 -type f | head -50

      # =========================================================
      # CREATE ANDROID PROJECT
      # =========================================================

      - name: Add Capacitor Android platform
        run: |
          npx cap add android

      - name: Verify Android project
        run: |
          test -d android
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle

      # =========================================================
      # FIREBASE / FCM
      # =========================================================

      - name: Copy Firebase configuration
        run: |
          test -f google-services.json

          mkdir -p android/app

          cp google-services.json \
             android/app/google-services.json

          test -f android/app/google-services.json

          echo "Firebase configuration copied."

      # =========================================================
      # ANDROID 16 / API 36 CONFIGURATION
      # =========================================================

      - name: Configure Android 16 API 36
        run: |
          chmod +x scripts/configure-android-16.sh
          ./scripts/configure-android-16.sh

      # =========================================================
      # CAPACITOR SYNC
      # =========================================================

      - name: Capacitor sync Android
        run: |
          npx cap sync android

      # =========================================================
      # NATIVE ANDROID BRIDGE
      # =========================================================

      - name: Setup RKMS native Android bridge
        run: |
          chmod +x scripts/setup-android-native.sh
          ./scripts/setup-android-native.sh

      # =========================================================
      # ANDROID 16 CONFIGURATION VERIFICATION
      # =========================================================

      - name: Verify Android 16 API 36 configuration
        run: |
          python3 scripts/verify-android-16.py

      # =========================================================
      # APPLICATION VERIFICATIONS
      # =========================================================

      - name: Verify FCM pipeline
        run: |
          python3 scripts/verify-fcm-pipeline.py

      - name: Verify saved login
        run: |
          python3 scripts/verify-saved-login.py

      - name: Verify Android PDF pipeline
        run: |
          python3 scripts/verify-android-pdf.py

      - name: Verify native bridge
        run: |
          python3 scripts/verify-native-bridge.py

      # =========================================================
      # RELEASE KEYSTORE
      #
      # Secrets are passed through ENV.
      # They are NOT used directly in if expressions.
      # =========================================================

      - name: Prepare release keystore
        id: keystore
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
        run: |

          if [ -n "$RKMS_KEYSTORE_BASE64" ]; then

            echo "has_keystore=true" >> "$GITHUB_OUTPUT"

            echo "$RKMS_KEYSTORE_BASE64" \
              | base64 --decode \
              > android/rkms-release.keystore

            test -s android/rkms-release.keystore

            echo "Release keystore successfully prepared."

          else

            echo "has_keystore=false" >> "$GITHUB_OUTPUT"

            echo "No RKMS release keystore configured."
            echo "Continuing with unsigned release artifact."

          fi

      # =========================================================
      # RELEASE SIGNING
      # =========================================================

      - name: Validate signing secrets
        if: steps.keystore.outputs.has_keystore == 'true'
        env:
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |

          test -n "$RKMS_KEYSTORE_PASSWORD"
          test -n "$RKMS_KEY_ALIAS"
          test -n "$RKMS_KEY_PASSWORD"

          echo "Release signing secrets verified."

      - name: Configure release signing
        if: steps.keystore.outputs.has_keystore == 'true'
        working-directory: android
        env:
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |

          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          text = path.read_text()

          signing_block = r'''

          // =====================================================
          // RKMS PRODUCTION RELEASE SIGNING
          // =====================================================

          android {
              signingConfigs {
                  rkmsRelease {
                      storeFile file("../rkms-release.keystore")
                      storePassword System.getenv("RKMS_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("RKMS_KEY_ALIAS")
                      keyPassword System.getenv("RKMS_KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.rkmsRelease
                  }
              }
          }
          '''

          if "rkmsRelease" not in text:
              text += signing_block

          path.write_text(text)

          print("Release signing configuration added.")
          PY

          grep -n "rkmsRelease" app/build.gradle

      # =========================================================
      # GRADLE VERIFICATION
      # =========================================================

      - name: Verify Gradle environment
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version

      # =========================================================
      # CLEAN
      # =========================================================

      - name: Clean Android project
        working-directory: android
        run: |
          ./gradlew clean --no-daemon

      # =========================================================
      # RELEASE APK
      # =========================================================

      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

      # =========================================================
      # RELEASE AAB
      # =========================================================

      - name: Build Release AAB
        working-directory: android
        run: |
          ./gradlew bundleRelease \
            --no-daemon \
            --stacktrace

      # =========================================================
      # VERIFY APK
      # =========================================================

      - name: Verify APK output
        run: |

          APK_DIR="android/app/build/outputs/apk/release"

          test -d "$APK_DIR"

          APK_FILE="$(find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            -print -quit)"

          test -n "$APK_FILE"

          echo "APK generated:"
          ls -lh "$APK_FILE"

      # =========================================================
      # VERIFY AAB
      # =========================================================

      - name: Verify AAB output
        run: |

          AAB_DIR="android/app/build/outputs/bundle/release"

          test -d "$AAB_DIR"

          AAB_FILE="$(find "$AAB_DIR" \
            -type f \
            -name "*.aab" \
            -print -quit)"

          test -n "$AAB_FILE"

          echo "AAB generated:"
          ls -lh "$AAB_FILE"

      # =========================================================
      # FINAL BUILD INFORMATION
      # =========================================================

      - name: Show final build information
        run: |

          echo ""
          echo "=============================================="
          echo "       RKMS CONNECT FINAL BUILD"
          echo "=============================================="
          echo ""

          echo "Android:"
          echo "  API: 36"
          echo "  Android: 16"
          echo "  JDK: 17"
          echo "  Node: 22"

          echo ""
          echo "APK:"
          ls -lh android/app/build/outputs/apk/release/*.apk

          echo ""
          echo "AAB:"
          ls -lh android/app/build/outputs/bundle/release/*.aab

          echo ""
          echo "=============================================="

      # =========================================================
      # UPLOAD APK
      # =========================================================

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Android-16-API36-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # UPLOAD AAB
      # =========================================================

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Android-16-API36-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

name: RKMS Android 16 API 36 - Final Signed Release APK Only

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  AGP_VERSION: "8.9.1"
  GRADLE_VERSION: "8.11.1"
  APP_ID: "org.rkms.connect"
  MIN_SDK: "23"
  TARGET_SDK: "36"
  SOURCE_ZIP: "RKMS_CONNECT_FINAL_AUDITED_RELEASE_APK_BUILD_20260922.zip"

jobs:

  build:

    name: RKMS Final Signed Release APK

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. NODE 22
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false


      # ============================================================
      # 3. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # ============================================================
      # 4. HOST PACKAGES
      # ============================================================

      - name: Install host packages
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y unzip rsync perl

          echo "HOST PACKAGES: PASS"


      # ============================================================
      # 5. SOURCE ZIP
      # ============================================================

      - name: Verify RKMS source ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s "$SOURCE_ZIP" ]; then
            echo "::error::Source ZIP not found."
            echo "Expected: $SOURCE_ZIP"

            find . \
              -maxdepth 5 \
              -type f \
              -name "*.zip" \
              -not -path "./.git/*" \
              -print \
              | sort

            exit 1
          fi

          sha256sum "$SOURCE_ZIP"

          echo "SOURCE ZIP: PASS"


      # ============================================================
      # 6. EXTRACT
      # ============================================================

      - name: Extract RKMS source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf rkms-build
          mkdir -p rkms-build

          unzip -q \
            "$SOURCE_ZIP" \
            -d rkms-build

          echo "ZIP EXTRACTION: PASS"


      # ============================================================
      # 7. FIND PROJECT ROOT
      # ============================================================

      - name: Find RKMS project root
        shell: bash
        run: |
          set -euo pipefail

          ROOT=""

          if [ -f "rkms-build/final_audit_src/package.json" ]; then
            ROOT="rkms-build/final_audit_src"

          elif [ -f "rkms-build/package.json" ]; then
            ROOT="rkms-build"

          else
            PACKAGE_FILE="$(
              find rkms-build \
                -type f \
                -name "package.json" \
                -not -path "*/node_modules/*" \
                -print \
                | head -n 1 \
                || true
            )"

            if [ -n "$PACKAGE_FILE" ]; then
              ROOT="$(dirname "$PACKAGE_FILE")"
            fi
          fi

          if [ -z "$ROOT" ]; then
            echo "::error::package.json not found."

            find rkms-build \
              -maxdepth 7 \
              -type f \
              -print \
              | sort

            exit 1
          fi

          echo "RKMS_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "RKMS_ROOT=$ROOT"


      # ============================================================
      # 8. SOURCE STRUCTURE
      # ============================================================

      - name: Verify RKMS source structure
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          REQUIRED_FILES="
          package.json
          package-lock.json
          app.js
          index.html
          styles.css
          capacitor.config.json
          google-services.json
          scripts/setup-android-native.sh
          scripts/configure-android-16.sh
          scripts/configure-release-signing.sh
          "

          for FILE in $REQUIRED_FILES; do
            if [ ! -s "$FILE" ]; then
              echo "::error::Missing required file: $FILE"
              exit 1
            fi
          done

          node --check app.js

          echo "SOURCE STRUCTURE: PASS"


      # ============================================================
      # 9. CAPACITOR VERSIONS
      # ============================================================

      - name: Verify Capacitor versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node <<'NODE'
          const fs = require("fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const deps = {
            ...(pkg.dependencies || {}),
            ...(pkg.devDependencies || {})
          };

          const required = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          let failed = false;

          for (const [name, wanted] of Object.entries(required)) {
            const actual = deps[name];

            console.log(
              `${name}: ${actual || "MISSING"}`
            );

            if (actual !== wanted) {
              failed = true;
            }
          }

          if (failed) {
            process.exit(1);
          }

          console.log("CAPACITOR VERSION CHECK: PASS");
          NODE


      # ============================================================
      # 10. FIREBASE JSON
      # ============================================================

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync("google-services.json", "utf8")
          );

          const found = (data.client || []).some(
            client =>
              client.client_info &&
              client.client_info.android_client_info &&
              client.client_info.android_client_info.package_name ===
              "org.rkms.connect"
          );

          if (!found) {
            throw new Error(
              "google-services.json does not contain org.rkms.connect"
            );
          }

          console.log("FIREBASE PACKAGE CHECK: PASS");
          NODE


      # ============================================================
      # 11. SOURCE AUDIT
      # ============================================================

      - name: Run source audit
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          if [ -f "scripts/verify-android-pdf.py" ]; then
            python3 scripts/verify-android-pdf.py
          fi

          echo "SOURCE AUDIT: PASS"


      # ============================================================
      # 12. NPM INSTALL
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm ci \
            --no-audit \
            --no-fund

          echo "NPM INSTALL: PASS"


      # ============================================================
      # 13. WEB BUILD
      # ============================================================

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm run build

          test -s dist/index.html

          echo "WEB BUILD: PASS"


      # ============================================================
      # 14. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ============================================================
      # 15. API 36
      # ============================================================

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --licenses \
            >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          test -n "$SDK_ROOT"

          test -x \
            "$SDK_ROOT/build-tools/$BUILD_TOOLS/aapt"

          test -x \
            "$SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner"

          echo "ANDROID API 36: PASS"


      # ============================================================
      # 16. CREATE CAPACITOR ANDROID
      # ============================================================

      - name: Create Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          rm -rf android

          npx cap add android

          test -s android/gradlew
          test -s android/app/build.gradle

          echo "CAPACITOR ANDROID PROJECT: PASS"


      # ============================================================
      # 17. FORCE MIN SDK 23 BEFORE ANDROID CONFIGURATION
      # ============================================================

      - name: Force minSdk 23 before configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          find android \
            -type f \
            \( \
              -name "*.gradle" \
              -o \
              -name "*.gradle.kts" \
            \) \
            -print0 |
          while IFS= read -r -d '' FILE; do

            perl -pi -e \
              's/(minSdkVersion\s*=\s*)22\b/${1}23/g' \
              "$FILE"

            perl -pi -e \
              's/(minSdkVersion\s+)\s*22\b/${1}23/g' \
              "$FILE"

            perl -pi -e \
              's/(minSdk\s*=\s*)22\b/${1}23/g' \
              "$FILE"

            perl -pi -e \
              's/(minSdk\s+)\s*22\b/${1}23/g' \
              "$FILE"

          done

          echo "MIN SDK 23 PRE-CONFIGURATION: PASS"


      # ============================================================
      # 18. SAFE NATIVE SCRIPT REPAIR
      # ============================================================

      - name: Repair known malformed native setup script
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          SCRIPT="scripts/setup-android-native.sh"

          test -s "$SCRIPT"

          SETUP_SHA="$(
            sha256sum "$SCRIPT" |
            awk '{print $1}'
          )"

          echo "Native setup script SHA:"
          echo "$SETUP_SHA"

          if [ "$SETUP_SHA" = "d8cdb6c16fb4c6ac768a4ca515f42224097a77419ca5bccd9dd38ab990b3e305" ]; then

            echo "Known malformed native script detected."

            rm -f /tmp/setup-rkms-fixed.sh

            sed -n '1,90p' \
              "$SCRIPT" \
              > /tmp/setup-rkms-fixed.sh

            printf '%s\n' \
              '# RKMS SAFE REPAIRED ICON' \
              'DRAWABLE_DIR="$RES_DIR/drawable"' \
              'mkdir -p "$DRAWABLE_DIR"' \
              'ICON_B64=""' \
              'printf "%s" "$ICON_B64" | base64 -d > "$DRAWABLE_DIR/ic_stat_rkms.xml"' \
              >> /tmp/setup-rkms-fixed.sh

            sed -n '118,$p' \
              "$SCRIPT" \
              >> /tmp/setup-rkms-fixed.sh

            chmod +x \
              /tmp/setup-rkms-fixed.sh

            bash -n \
              /tmp/setup-rkms-fixed.sh

            mv \
              /tmp/setup-rkms-fixed.sh \
              "$SCRIPT"

            echo "KNOWN SCRIPT REPAIR: PASS"

          else

            echo "Known malformed-script hash not detected."
            echo "Keeping source script unchanged."

          fi

          chmod +x "$SCRIPT"

          bash -n "$SCRIPT"

          echo "NATIVE SCRIPT SYNTAX: PASS"


      # ============================================================
      # 19. IMPORTANT:
      # REPAIR PREDICTIVE-BACK IN CONFIGURATION SCRIPT
      #
      # This is BEFORE configure-android-16.sh runs.
      # Therefore the generated manifest patch itself receives
      # enableOnBackInvokedCallback=true.
      # ============================================================

      - name: Repair Android 16 manifest patch template
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("scripts/configure-android-16.sh")

          if not path.is_file():
              raise SystemExit(
                  "configure-android-16.sh not found"
              )

          text = path.read_text(
              encoding="utf-8"
          )

          attribute = (
              'android:enableOnBackInvokedCallback="true"'
          )

          original = text

          def patch_application(match):
              opening = match.group(0)

              if attribute in opening:
                  return opening

              return (
                  opening[:-1]
                  + " "
                  + attribute
                  + ">"
              )

          text = re.sub(
              r"<application\b[^>]*>",
              patch_application,
              text,
              flags=re.IGNORECASE | re.DOTALL
          )

          if text != original:
              path.write_text(
                  text,
                  encoding="utf-8"
              )
              print(
                  "CONFIGURE SCRIPT: predictive back inserted"
              )
          else:
              print(
                  "CONFIGURE SCRIPT: no XML application template changed"
              )

          final_text = path.read_text(
              encoding="utf-8"
          )

          if "<application" in final_text.lower():
              if attribute not in final_text:
                  raise SystemExit(
                      "ERROR: configure-android-16.sh still has application XML without predictive back"
                  )

          print(
              "ANDROID 16 MANIFEST PATCH TEMPLATE: PASS"
          )
          PY

          chmod +x \
            scripts/configure-android-16.sh

          bash -n \
            scripts/configure-android-16.sh


      # ============================================================
      # 20. CONFIGURE ANDROID 16
      # ============================================================

      - name: Configure Android 16
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/configure-android-16.sh

          bash -n \
            scripts/configure-android-16.sh

          ./scripts/configure-android-16.sh

          echo "ANDROID 16 CONFIGURATION: PASS"


      # ============================================================
      # 21. CAPACITOR SYNC
      # ============================================================

      - name: Capacitor sync
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npx cap sync android

          echo "CAPACITOR SYNC: PASS"


      # ============================================================
      # 22. FORCE MIN SDK 23 AFTER SYNC
      # ============================================================

      - name: Force minSdk 23 after sync
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          find android \
            -type f \
            \( \
              -name "*.gradle" \
              -o \
              -name "*.gradle.kts" \
            \) \
            -print0 |
          while IFS= read -r -d '' FILE; do

            perl -pi -e \
              's/(minSdkVersion\s*=\s*)22\b/${1}23/g' \
              "$FILE"

            perl -pi -e \
              's/(minSdkVersion\s+)\s*22\b/${1}23/g' \
              "$FILE"

            perl -pi -e \
              's/(minSdk\s*=\s*)22\b/${1}23/g' \
              "$FILE"

            perl -pi -e \
              's/(minSdk\s+)\s*22\b/${1}23/g' \
              "$FILE"

          done

          if grep -RInE \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            'minSdkVersion[[:space:]]*=?[[:space:]]*22([[:space:]]|$)|minSdk[[:space:]]*=?[[:space:]]*22([[:space:]]|$)' \
            android
          then
            echo "::error::minSdk 22 still exists."
            exit 1
          fi

          echo "MIN SDK 23: PASS"


      # ============================================================
      # 23. LOCATE GENERATED MANIFEST
      # ============================================================

      - name: Locate generated AndroidManifest
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          test -s "$MANIFEST"

          echo "MANIFEST=$MANIFEST" >> "$GITHUB_ENV"

          echo "MANIFEST: $MANIFEST"


      # ============================================================
      # 24. MICROPHONE + NOTIFICATION PERMISSIONS
      # ============================================================

      - name: Configure microphone and notification permissions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 - "$MANIFEST" <<'PY'
          import sys
          import re
          from pathlib import Path

          path = Path(sys.argv[1])

          text = path.read_text(
              encoding="utf-8"
          )

          text = re.sub(
              r'\s*<uses-permission\s+android:name="android\.permission\.RECORD_AUDIO"\s*/>\s*',
              '\n',
              text
          )

          text = re.sub(
              r'\s*<uses-permission\s+android:name="android\.permission\.POST_NOTIFICATIONS"\s*/>\s*',
              '\n',
              text
          )

          match = re.search(
              r'<manifest\b[^>]*>',
              text,
              flags=re.DOTALL
          )

          if not match:
              raise SystemExit(
                  "ERROR: manifest opening tag not found"
              )

          additions = (
              "\n"
              '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n'
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
          )

          text = (
              text[:match.end()]
              + additions
              + text[match.end():]
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print("MICROPHONE MANIFEST: PASS")
          print("NOTIFICATION MANIFEST: PASS")
          PY

          grep -Fq \
            'android:name="android.permission.RECORD_AUDIO"' \
            "$MANIFEST"

          grep -Fq \
            'android:name="android.permission.POST_NOTIFICATIONS"' \
            "$MANIFEST"


      # ============================================================
      # 25. PREDICTIVE BACK IN FINAL MANIFEST
      # ============================================================

      - name: Configure predictive back
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 - "$MANIFEST" <<'PY'
          import sys
          import re
          from pathlib import Path

          path = Path(sys.argv[1])

          text = path.read_text(
              encoding="utf-8"
          )

          attribute = (
              'android:enableOnBackInvokedCallback="true"'
          )

          if "android:enableOnBackInvokedCallback=" in text:

              text = re.sub(
                  r'android:enableOnBackInvokedCallback="[^"]*"',
                  attribute,
                  text,
                  count=1
              )

          else:

              match = re.search(
                  r'<application\b',
                  text
              )

              if not match:
                  raise SystemExit(
                      "ERROR: application tag not found"
                  )

              text = (
                  text[:match.end()]
                  + " "
                  + attribute
                  + text[match.end():]
              )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print("PREDICTIVE BACK: PASS")
          PY

          grep -Fq \
            'android:enableOnBackInvokedCallback="true"' \
            "$MANIFEST"


      # ============================================================
      # 26. VALIDATE FINAL MANIFEST XML
      # ============================================================

      - name: Validate AndroidManifest XML
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          try:
              ET.parse(sys.argv[1])
          except Exception as exc:
              print("ANDROID MANIFEST XML INVALID")
              print(exc)
              raise SystemExit(1)

          print("ANDROID MANIFEST XML: PASS")
          PY

          grep -Fq \
            'android:name="android.permission.RECORD_AUDIO"' \
            "$MANIFEST"

          grep -Fq \
            'android:name="android.permission.POST_NOTIFICATIONS"' \
            "$MANIFEST"

          grep -Fq \
            'android:enableOnBackInvokedCallback="true"' \
            "$MANIFEST"

          echo "FINAL MANIFEST: PASS"


      # ============================================================
      # 27. REPAIR ANY GENERATED MANIFEST PATCH
      #
      # This catches:
      # .patch
      # .diff
      # .xml
      # generated manifest files
      # generated patch templates
      #
      # before verify-android-16.py.
      # ============================================================

      - name: Repair generated manifest patch
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          python3 <<'PY'
          from pathlib import Path
          import re

          ROOT = Path(".")

          ATTRIBUTE = (
              'android:enableOnBackInvokedCallback="true"'
          )

          skip_dirs = {
              ".git",
              "node_modules",
              ".gradle",
              "build"
          }

          repaired = []
          checked = []

          def looks_like_text(path):
              try:
                  data = path.read_bytes()
              except Exception:
                  return False

              if b"\x00" in data[:8192]:
                  return False

              return True

          candidates = []

          for path in ROOT.rglob("*"):

              if not path.is_file():
                  continue

              if any(
                  part in skip_dirs
                  for part in path.parts
              ):
                  continue

              lower_path = str(path).lower()

              important_name = any(
                  key in lower_path
                  for key in (
                      "manifest",
                      "android-16",
                      "android16",
                      "patch"
                  )
              )

              if not important_name:
                  continue

              if not looks_like_text(path):
                  continue

              candidates.append(path)

          for path in candidates:

              try:
                  text = path.read_text(
                      encoding="utf-8"
                  )
              except Exception:
                  continue

              if "<application" not in text.lower():
                  continue

              if "manifest" not in text.lower() and \
                 "patch" not in str(path).lower() and \
                 "android-16" not in str(path).lower():
                  continue

              checked.append(str(path))

              if ATTRIBUTE in text:
                  continue

              original = text

              def patch_application(match):
                  opening = match.group(0)

                  if ATTRIBUTE in opening:
                      return opening

                  return (
                      opening[:-1]
                      + " "
                      + ATTRIBUTE
                      + ">"
                  )

              text = re.sub(
                  r"<application\b[^>]*>",
                  patch_application,
                  text,
                  flags=re.IGNORECASE | re.DOTALL
              )

              if text != original:

                  path.write_text(
                      text,
                      encoding="utf-8"
                  )

                  repaired.append(
                      str(path)
                  )

          print(
              "MANIFEST PATCH CANDIDATES:",
              len(candidates)
          )

          print(
              "MANIFEST FILES CHECKED:",
              len(checked)
          )

          if repaired:

              print(
                  "REPAIRED GENERATED MANIFEST FILES:"
              )

              for item in repaired:
                  print(
                      " -",
                      item
                  )

          print(
              "GENERATED MANIFEST PATCH REPAIR: PASS"
          )
          PY


      # ============================================================
      # 28. FIREBASE CONFIGURATION
      # ============================================================

      - name: Install Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          cp -f \
            google-services.json \
            android/app/google-services.json

          test -s \
            android/app/google-services.json

          grep -Fq \
            "org.rkms.connect" \
            android/app/google-services.json

          echo "FIREBASE CONFIGURATION: PASS"


      # ============================================================
      # 29. FIREBASE DEPENDENCIES
      # ============================================================

      - name: Configure Firebase dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          APP_GRADLE="android/app/build.gradle"
          ROOT_GRADLE="android/build.gradle"

          test -s "$APP_GRADLE"
          test -s "$ROOT_GRADLE"

          if ! grep -Fq \
            "com.google.gms:google-services:4.4.4" \
            "$ROOT_GRADLE"
          then

            if grep -Fq \
              "dependencies {" \
              "$ROOT_GRADLE"
            then

              sed -i \
                '/dependencies {/a\    classpath "com.google.gms:google-services:4.4.4"' \
                "$ROOT_GRADLE"

            fi

          fi

          if ! grep -Fq \
            'com.google.gms.google-services' \
            "$APP_GRADLE"
          then

            printf '%s\n' \
              'apply plugin: "com.google.gms.google-services"' \
              >> "$APP_GRADLE"

          fi

          if ! grep -Fq \
            "com.google.firebase:firebase-bom" \
            "$APP_GRADLE"
          then

            sed -i \
              '/dependencies {/a\    implementation platform("com.google.firebase:firebase-bom:34.19.0")' \
              "$APP_GRADLE"

          fi

          if ! grep -Fq \
            "com.google.firebase:firebase-messaging" \
            "$APP_GRADLE"
          then

            sed -i \
              '/dependencies {/a\    implementation "com.google.firebase:firebase-messaging"' \
              "$APP_GRADLE"

          fi

          if ! grep -Fq \
            "androidx.credentials:credentials:1.5.0" \
            "$APP_GRADLE"
          then

            sed -i \
              '/dependencies {/a\    implementation "androidx.credentials:credentials:1.5.0"' \
              "$APP_GRADLE"

          fi

          if ! grep -Fq \
            "androidx.credentials:credentials-play-services-auth:1.5.0" \
            "$APP_GRADLE"
          then

            sed -i \
              '/dependencies {/a\    implementation "androidx.credentials:credentials-play-services-auth:1.5.0"' \
              "$APP_GRADLE"

          fi

          if ! grep -Fq \
            "androidx.biometric:biometric:1.1.0" \
            "$APP_GRADLE"
          then

            sed -i \
              '/dependencies {/a\    implementation "androidx.biometric:biometric:1.1.0"' \
              "$APP_GRADLE"

          fi

          echo "FIREBASE DEPENDENCIES: PASS"


      # ============================================================
      # 30. FIREBASE INITIALIZATION
      # ============================================================

      - name: Verify Firebase initialization
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          MAIN="$(
            find android/app/src/main \
              -type f \
              -name "MainActivity.java" \
              -print \
              | head -n 1 \
              || true
          )"

          if [ -z "$MAIN" ]; then
            echo "::error::MainActivity.java not found."
            exit 1
          fi

          if ! grep -Fq \
            "FirebaseApp.initializeApp" \
            "$MAIN"
          then

            if grep -Fq \
              "super.onCreate(savedInstanceState);" \
              "$MAIN"
            then

              python3 - "$MAIN" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])

          text = path.read_text(
              encoding="utf-8"
          )

          marker = \
              "super.onCreate(savedInstanceState);"

          if "FirebaseApp.initializeApp" not in text:

              text = text.replace(
                  marker,
                  marker +
                  "\n        com.google.firebase.FirebaseApp.initializeApp(this);",
                  1
              )

          path.write_text(
              text,
              encoding="utf-8"
          )
          PY

            else

              echo "::error::MainActivity onCreate marker not found."
              exit 1

            fi

          fi

          grep -Fq \
            "FirebaseApp.initializeApp" \
            "$MAIN"

          echo "FIREBASE INITIALIZATION: PASS"


      # ============================================================
      # 31. NATIVE BRIDGE
      # ============================================================

      - name: Verify RKMS native bridge
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          BRIDGE="$(
            find android/app/src/main \
              -type f \
              -name "RKMSNativeBridge.java" \
              -print \
              | head -n 1 \
              || true
          )"

          if [ -z "$BRIDGE" ]; then
            echo "::error::RKMSNativeBridge.java not found."
            exit 1
          fi

          grep -Fq \
            "AndroidKeyStore" \
            "$BRIDGE"

          grep -Fq \
            "CredentialManager" \
            "$BRIDGE"

          echo "RKMS NATIVE BRIDGE: PASS"


      # ============================================================
      # 32. FINAL MANIFEST CHECK
      # ============================================================

      - name: Final AndroidManifest verification
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          test -s "$MANIFEST"

          grep -Fq \
            'android:name="android.permission.RECORD_AUDIO"' \
            "$MANIFEST"

          grep -Fq \
            'android:name="android.permission.POST_NOTIFICATIONS"' \
            "$MANIFEST"

          grep -Fq \
            'android:enableOnBackInvokedCallback="true"' \
            "$MANIFEST"

          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          ET.parse(sys.argv[1])

          print("MANIFEST XML: PASS")
          PY

          echo "RECORD_AUDIO: PASS"
          echo "POST_NOTIFICATIONS: PASS"
          echo "PREDICTIVE BACK: PASS"
          echo "FINAL MANIFEST: PASS"


      # ============================================================
      # 33. FINAL SDK
      # ============================================================

      - name: Finalize Android SDK versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          find android \
            -type f \
            \( \
              -name "*.gradle" \
              -o \
              -name "*.gradle.kts" \
            \) \
            -print0 |
          while IFS= read -r -d '' FILE; do

            perl -pi -e \
              's/(minSdkVersion\s*=\s*)22\b/${1}23/g' \
              "$FILE"

            perl -pi -e \
              's/(minSdkVersion\s+)\s*22\b/${1}23/g' \
              "$FILE"

            perl -pi -e \
              's/(minSdk\s*=\s*)22\b/${1}23/g' \
              "$FILE"

            perl -pi -e \
              's/(minSdk\s+)\s*22\b/${1}23/g' \
              "$FILE"

          done

          if grep -RInE \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            'minSdkVersion[[:space:]]*=?[[:space:]]*22([[:space:]]|$)|minSdk[[:space:]]*=?[[:space:]]*22([[:space:]]|$)' \
            android
          then
            echo "::error::minSdk 22 detected."
            exit 1
          fi

          echo "MIN SDK 23 FINAL: PASS"


      # ============================================================
      # 34. POST-GENERATION RKMS AUDITS
      # ============================================================

      - name: Run post-generation RKMS audits
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          for AUDIT in \
            scripts/verify-android-16.py \
            scripts/verify-rkms-final-fixes.py \
            scripts/verify-native-bridge.py \
            scripts/verify-fcm-pipeline.py \
            scripts/verify-saved-login.py
          do

            if [ -f "$AUDIT" ]; then

              echo ""
              echo "=============================================="
              echo "RUNNING: $AUDIT"
              echo "=============================================="

              python3 "$AUDIT"

            fi

          done

          echo ""
          echo "POST-GENERATION AUDITS: PASS"


      # ============================================================
      # 35. FINAL ANDROID 16 AUDIT
      # ============================================================

      - name: Final Android 16 audit
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          if [ -f android/variables.gradle ]; then

            grep -Eq \
              'compileSdkVersion[[:space:]]*=[[:space:]]*36' \
              android/variables.gradle

            grep -Eq \
              'targetSdkVersion[[:space:]]*=[[:space:]]*36' \
              android/variables.gradle

            grep -Eq \
              'minSdkVersion[[:space:]]*=[[:space:]]*23' \
              android/variables.gradle

          fi

          grep -Fq \
            'android:enableOnBackInvokedCallback="true"' \
            "$MANIFEST"

          grep -Fq \
            'android:name="android.permission.RECORD_AUDIO"' \
            "$MANIFEST"

          grep -Fq \
            'android:name="android.permission.POST_NOTIFICATIONS"' \
            "$MANIFEST"

          echo "COMPILE SDK 36: PASS"
          echo "TARGET SDK 36: PASS"
          echo "MIN SDK 23: PASS"
          echo "PREDICTIVE BACK: PASS"
          echo "RECORD AUDIO: PASS"
          echo "POST NOTIFICATIONS: PASS"


      # ============================================================
      # 36. SIGNING SECRETS
      # ============================================================

      - name: Verify release signing secrets
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "${RKMS_KEYSTORE_BASE64:-}" || {
            echo "::error::RKMS_KEYSTORE_BASE64 missing."
            exit 1
          }

          test -n "${RKMS_KEYSTORE_PASSWORD:-}" || {
            echo "::error::RKMS_KEYSTORE_PASSWORD missing."
            exit 1
          }

          test -n "${RKMS_KEY_ALIAS:-}" || {
            echo "::error::RKMS_KEY_ALIAS missing."
            exit 1
          }

          test -n "${RKMS_KEY_PASSWORD:-}" || {
            echo "::error::RKMS_KEY_PASSWORD missing."
            exit 1
          }

          echo "SIGNING SECRETS: PASS"


      # ============================================================
      # 37. RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/configure-release-signing.sh

          bash -n \
            scripts/configure-release-signing.sh

          ./scripts/configure-release-signing.sh

          test -s \
            android/app/release.keystore

          grep -Fq \
            'storeFile file("release.keystore")' \
            android/app/build.gradle

          grep -Fq \
            'signingConfig signingConfigs.release' \
            android/app/build.gradle

          echo "RELEASE SIGNING: PASS"


      # ============================================================
      # 38. KEYSTORE
      # ============================================================

      - name: Verify release keystore
        shell: bash
        env:
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          keytool \
            -list \
            -keystore android/app/release.keystore \
            -storepass "$RKMS_KEYSTORE_PASSWORD" \
            -alias "$RKMS_KEY_ALIAS" \
            >/dev/null

          echo "KEYSTORE VALIDATION: PASS"


      # ============================================================
      # 39. GRADLE
      # ============================================================

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          chmod +x gradlew

          ./gradlew \
            --version \
            --no-daemon

          echo "GRADLE VALIDATION: PASS"


      # ============================================================
      # 40. CLEAN
      # ============================================================

      - name: Clean Android build
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          ./gradlew \
            clean \
            --no-daemon

          echo "ANDROID CLEAN: PASS"


      # ============================================================
      # 41. BUILD FINAL SIGNED RELEASE APK ONLY
      # ============================================================

      - name: Build Final Signed Release APK Only
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          echo "=============================================="
          echo "RKMS FINAL SIGNED RELEASE APK"
          echo "=============================================="

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then

            echo "::error::Release APK was not created."

            find app/build/outputs \
              -type f \
              -print \
              | sort

            exit 1
          fi

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"

          echo \
            "APK_PATH=$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk" \
            >> "$GITHUB_ENV"

          echo "RELEASE APK BUILD: PASS"


      # ============================================================
      # 42. VERIFY APK
      # ============================================================

      - name: Verify APK package and signature
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          AAPT="$SDK_ROOT/build-tools/$BUILD_TOOLS/aapt"
          APKSIGNER="$SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner"

          test -x "$AAPT"
          test -x "$APKSIGNER"

          "$AAPT" \
            dump badging \
            "$APK_PATH" \
            | tee "$GITHUB_WORKSPACE/apk-badging.txt"

          grep -Fq \
            "package: name='$APP_ID'" \
            "$GITHUB_WORKSPACE/apk-badging.txt"

          grep -Fq \
            "targetSdkVersion:'36'" \
            "$GITHUB_WORKSPACE/apk-badging.txt"

          "$APKSIGNER" \
            verify \
            --verbose \
            "$APK_PATH"

          "$APKSIGNER" \
            verify \
            --print-certs \
            "$APK_PATH"

          echo "APK PACKAGE: PASS"
          echo "TARGET SDK 36: PASS"
          echo "APK SIGNATURE: PASS"


      # ============================================================
      # 43. SHA256
      # ============================================================

      - name: Generate APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            "$APK_PATH" \
            | tee \
            "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256"

          echo "SHA256: PASS"


      # ============================================================
      # 44. FINAL APK ONLY AUDIT
      # ============================================================

      - name: Final APK-only audit
        shell: bash
        run: |
          set -euo pipefail

          test -s "$APK_PATH"

          test -s \
            "$GITHUB_WORKSPACE/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256"

          if find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.aab" \
            -print \
            | grep -q .
          then

            echo "::error::AAB detected."
            exit 1

          fi

          if find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "*debug*.apk" \
            -print \
            | grep -q .
          then

            echo "::error::Debug APK detected."
            exit 1

          fi

          SIZE="$(
            stat \
              -c%s \
              "$APK_PATH"
          )"

          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::APK size unexpectedly small."
            exit 1
          fi

          echo "=============================================="
          echo "FINAL APK AUDIT: PASS"
          echo "=============================================="

          echo "APK: RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"
          echo "SIGNED: YES"
          echo "DEBUG: NO"
          echo "AAB: NO"
          echo "SIZE: $SIZE bytes"


      # ============================================================
      # 45. UPLOAD FINAL APK
      # ============================================================

      - name: Upload final signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS_ANDROID16_API36_FINAL_SIGNED_RELEASE_APK
          if-no-files-found: error
          path: |
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk
            RKMS_CONNECT_ANDROID16_API36_RELEASE.apk.sha256
          retention-days: 30

name: RKMS Final Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  APP_ID: "org.rkms.connect"
  SOURCE_ZIP: "RKMS_CONNECT_FINAL_FIXED_RELEASE_APK_BUILD_20260923.zip"

jobs:
  build:
    name: RKMS Final Signed Release APK
    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install required host packages
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            rsync

          echo "HOST PACKAGES: PASS"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android API 36 SDK
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            if [ -n "${ANDROID_HOME:-}" ]; then
              export ANDROID_SDK_ROOT="$ANDROID_HOME"
            else
              echo "::error::Android SDK path missing."
              exit 1
            fi
          fi

          export PATH="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${ANDROID_SDK_ROOT}/platform-tools:${PATH}"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            --sdk_root="${ANDROID_SDK_ROOT}" \
            --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          test -d \
            "${ANDROID_SDK_ROOT}/platforms/android-${ANDROID_API}"

          test -d \
            "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}"

          test -x \
            "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/aapt"

          test -x \
            "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/apksigner"

          test -x \
            "${ANDROID_SDK_ROOT}/platform-tools/adb"

          echo "ANDROID API 36: PASS"
          echo "BUILD TOOLS 36.0.0: PASS"
          echo "ADB: PASS"

      - name: Locate RKMS source ZIP
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="$GITHUB_WORKSPACE/$SOURCE_ZIP"

          echo "Expected source ZIP:"
          echo "$EXPECTED"

          if [ ! -s "$EXPECTED" ]; then
            echo "::error::Configured source ZIP was not found:"
            echo "$EXPECTED"

            echo ""
            echo "ZIP files available:"

            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -name "*.zip" \
              -print \
              | sort

            exit 1
          fi

          SOURCE_SHA256="$(
            sha256sum "$EXPECTED" | awk '{print $1}'
          )"

          echo "RKMS_SOURCE_ZIP=$EXPECTED" >> "$GITHUB_ENV"
          echo "RKMS_SOURCE_SHA256=$SOURCE_SHA256" >> "$GITHUB_ENV"

          echo ""
          echo "SOURCE ZIP:"
          echo "$EXPECTED"

          echo "SOURCE SHA256:"
          echo "$SOURCE_SHA256"

          echo "SOURCE ZIP: PASS"

      - name: Extract RKMS source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            "$GITHUB_WORKSPACE/rkms-source"

          mkdir -p \
            "$GITHUB_WORKSPACE/rkms-source"

          unzip -q \
            "$RKMS_SOURCE_ZIP" \
            -d "$GITHUB_WORKSPACE/rkms-source"

          PACKAGE_FILE="$(
            find "$GITHUB_WORKSPACE/rkms-source" \
              -type f \
              -name "package.json" \
              -not -path "*/node_modules/*" \
              -print \
              -quit
          )"

          if [ -z "$PACKAGE_FILE" ]; then
            echo "::error::package.json not found inside source ZIP."
            exit 1
          fi

          RKMS_ROOT="$(
            cd "$(dirname "$PACKAGE_FILE")" \
            && pwd
          )"

          echo "RKMS_ROOT=$RKMS_ROOT" >> "$GITHUB_ENV"

          echo "RKMS ROOT:"
          echo "$RKMS_ROOT"

          echo "SOURCE EXTRACTION: PASS"

      - name: Verify audited source
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          REQUIRED_FILES=(
            "package.json"
            "package-lock.json"
            "app.js"
            "index.html"
            "styles.css"
            "capacitor.config.json"
            "google-services.json"
            "scripts/setup-android-native.sh"
            "scripts/configure-android-16.sh"
            "scripts/configure-release-signing.sh"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -s "$FILE" ]; then
              echo "::error::Missing required file: $FILE"
              exit 1
            fi
          done

          node --check app.js

          python3 -m json.tool \
            capacitor.config.json \
            >/dev/null

          python3 -m json.tool \
            google-services.json \
            >/dev/null

          bash -n \
            scripts/setup-android-native.sh

          bash -n \
            scripts/configure-android-16.sh

          bash -n \
            scripts/configure-release-signing.sh

          echo "SOURCE STRUCTURE: PASS"
          echo "JAVASCRIPT SYNTAX: PASS"
          echo "JSON SYNTAX: PASS"
          echo "SHELL SYNTAX: PASS"

      - name: Verify Capacitor package versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node <<'NODE'
          const fs = require("fs");

          const p = JSON.parse(
            fs.readFileSync(
              "package.json",
              "utf8"
            )
          );

          const d = Object.assign(
            {},
            p.dependencies || {},
            p.devDependencies || {}
          );

          const wanted = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          for (
            const [name, version]
            of Object.entries(wanted)
          ) {
            if (d[name] !== version) {
              throw new Error(
                `${name}: expected ${version}, found ${d[name] || "MISSING"}`
              );
            }
          }

          if (
            !p.scripts ||
            typeof p.scripts.build !== "string" ||
            !p.scripts.build.trim()
          ) {
            throw new Error(
              "npm build script missing"
            );
          }

          console.log(
            "CAPACITOR VERSION CHECK: PASS"
          );
          NODE

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node <<'NODE'
          const fs = require("fs");

          const d = JSON.parse(
            fs.readFileSync(
              "google-services.json",
              "utf8"
            )
          );

          const ok = (
            d.client || []
          ).some(
            c =>
              c.client_info &&
              c.client_info.android_client_info &&
              c.client_info.android_client_info.package_name ===
              "org.rkms.connect"
          );

          if (!ok) {
            throw new Error(
              "org.rkms.connect not found in google-services.json"
            );
          }

          console.log(
            "FIREBASE CONFIGURATION: PASS"
          );
          NODE

      - name: Verify FCM notification source
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node <<'NODE'
          const fs = require("fs");

          const pkg = JSON.parse(
            fs.readFileSync(
              "package.json",
              "utf8"
            )
          );

          const deps = Object.assign(
            {},
            pkg.dependencies || {},
            pkg.devDependencies || {}
          );

          if (
            !deps["@capacitor/push-notifications"]
          ) {
            throw new Error(
              "@capacitor/push-notifications dependency missing"
            );
          }

          const app = fs.readFileSync(
            "app.js",
            "utf8"
          );

          const checks = [
            [
              "PushNotifications reference",
              /PushNotifications/
            ],
            [
              "register call",
              /\.register\s*\(/
            ],
            [
              "received listener",
              /pushNotificationReceived/
            ],
            [
              "action listener",
              /pushNotificationActionPerformed/
            ]
          ];

          for (
            const [name, pattern]
            of checks
          ) {
            if (!pattern.test(app)) {
              throw new Error(
                name +
                " not found in app.js"
              );
            }
          }

          console.log(
            "FCM SOURCE IMPLEMENTATION: PASS"
          );
          NODE

          node --check app.js

          echo "FCM SOURCE: PASS"

      - name: Verify native Android setup
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          bash -n \
            scripts/setup-android-native.sh

          grep -Fq \
            "RKMSNativeBridge" \
            scripts/setup-android-native.sh

          grep -Fq \
            "FirebaseApp.initializeApp" \
            scripts/setup-android-native.sh

          grep -Fq \
            "CredentialManager" \
            scripts/setup-android-native.sh

          if grep -Fq \
            "deleteNotificationChannel" \
            scripts/setup-android-native.sh
          then
            echo "::error::Notification channel deletion detected."
            exit 1
          fi

          if grep -Fq \
            "deleteChannel" \
            scripts/setup-android-native.sh
          then
            echo "::error::Notification channel deletion detected."
            exit 1
          fi

          echo "NATIVE SETUP SCRIPT: PASS"
          echo "RKMSNativeBridge: PASS"
          echo "Firebase initialization: PASS"
          echo "Credential Manager: PASS"
          echo "NO CHANNEL DELETION: PASS"

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm ci \
            --no-audit \
            --no-fund

          echo "NPM INSTALL: PASS"

      - name: Verify Capacitor FCM plugin dependency
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          PLUGIN_DIR="node_modules/@capacitor/push-notifications/android"

          if [ ! -d "$PLUGIN_DIR" ]; then
            echo "::error::Capacitor Push Notifications Android plugin directory not found."
            exit 1
          fi

          PLUGIN_BUILD="$PLUGIN_DIR/build.gradle"

          if [ ! -f "$PLUGIN_BUILD" ]; then
            echo "::error::Capacitor Push Notifications Android build.gradle not found."
            exit 1
          fi

          echo "Checking Capacitor Push Notifications Android plugin..."

          if grep -Rqs \
            "firebase-messaging" \
            "$PLUGIN_DIR"
          then
            echo "Firebase Messaging dependency found in Capacitor plugin: PASS"
          else
            echo "::error::Firebase Messaging dependency not found in Capacitor Push Notifications plugin."
            echo ""
            echo "Plugin files:"
            find "$PLUGIN_DIR" \
              -maxdepth 3 \
              -type f \
              -print \
              | sort
            exit 1
          fi

          echo "CAPACITOR FCM DEPENDENCY: PASS"

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm run build

          if [ ! -s \
            "dist/index.html"
          ]; then
            echo "::error::dist/index.html was not generated."
            exit 1
          fi

          echo "WEB BUILD: PASS"

      - name: Generate fresh Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          rm -rf android

          npx cap add android

          test -s \
            android/gradlew

          test -s \
            android/app/build.gradle

          chmod +x \
            android/gradlew

          echo "CAPACITOR ANDROID GENERATION: PASS"

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/configure-android-16.sh

          bash \
            scripts/configure-android-16.sh

          test -f \
            android/gradle/wrapper/gradle-wrapper.properties

          grep -Fq \
            "gradle-8.11.1-bin.zip" \
            android/gradle/wrapper/gradle-wrapper.properties

          grep -Fq \
            "com.android.tools.build:gradle:8.9.1" \
            android/build.gradle

          grep -Eq \
            "compileSdkVersion[[:space:]]*=[[:space:]]*36" \
            android/variables.gradle

          grep -Eq \
            "targetSdkVersion[[:space:]]*=[[:space:]]*36" \
            android/variables.gradle

          echo "ANDROID 16 API 36 CONFIGURATION: PASS"

      - name: Sync Capacitor Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npx cap sync android

          test -s \
            android/app/build.gradle

          test -s \
            android/app/src/main/AndroidManifest.xml

          echo "CAPACITOR SYNC: PASS"

      - name: Apply RKMS native Android setup
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/setup-android-native.sh

          bash \
            scripts/setup-android-native.sh

          echo "RKMS NATIVE ANDROID SETUP: PASS"

      - name: Verify generated MainActivity
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          MAIN_ACTIVITY="$(
            find android/app/src/main \
              -type f \
              -name "MainActivity.java" \
              -print \
              -quit
          )"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "::error::MainActivity.java not found."

            find android/app/src/main \
              -type f \
              -print || true

            exit 1
          fi

          test -s \
            "$MAIN_ACTIVITY"

          grep -Fq \
            "RKMSNativeBridge" \
            "$MAIN_ACTIVITY"

          grep -Fq \
            "FirebaseApp.initializeApp(this)" \
            "$MAIN_ACTIVITY"

          grep -Fq \
            "onNewIntent" \
            "$MAIN_ACTIVITY"

          echo "MAIN ACTIVITY: PASS"
          echo "RKMSNativeBridge: PASS"
          echo "Firebase initialization: PASS"
          echo "Notification intent handling: PASS"

      - name: Verify Firebase Messaging
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          test -f \
            android/app/google-services.json

          grep -Fq \
            "org.rkms.connect" \
            android/app/google-services.json

          PLUGIN_DIR="node_modules/@capacitor/push-notifications/android"

          if [ ! -d "$PLUGIN_DIR" ]; then
            echo "::error::Capacitor Push Notifications Android plugin missing."
            exit 1
          fi

          if grep -Rqs \
            "firebase-messaging" \
            "$PLUGIN_DIR"
          then
            echo "Firebase Messaging dependency in Capacitor plugin: PASS"
          else
            echo "::error::Firebase Messaging dependency not found in Capacitor plugin."
            exit 1
          fi

          echo "FIREBASE MESSAGING VERIFICATION: PASS"

      - name: Verify notification channels
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          if grep -Fq \
            "deleteNotificationChannel" \
            scripts/setup-android-native.sh
          then
            echo "::error::Notification channel deletion detected."
            exit 1
          fi

          if grep -Fq \
            "deleteChannel" \
            scripts/setup-android-native.sh
          then
            echo "::error::Notification channel deletion detected."
            exit 1
          fi

          if grep -Rqs \
            "NotificationChannel" \
            android/app/src/main
          then
            echo "ANDROID NOTIFICATION CHANNEL: PASS"
          else
            echo "::error::Android NotificationChannel implementation not found."
            exit 1
          fi

          if grep -Rqs \
            "firebase-messaging" \
            node_modules/@capacitor/push-notifications/android
          then
            echo "FIREBASE MESSAGING PLUGIN: PASS"
          else
            echo "::error::Firebase Messaging plugin implementation not found."
            exit 1
          fi

          echo "NO CHANNEL DELETION: PASS"

      - name: Run RKMS static audits
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          if [ -f \
            scripts/verify-fcm-pipeline.py
          ]; then
            python3 \
              scripts/verify-fcm-pipeline.py
          fi

          if [ -f \
            scripts/verify-native-bridge.py
          ]; then
            python3 \
              scripts/verify-native-bridge.py
          fi

          if [ -f \
            scripts/verify-rkms-final.py
          ]; then
            python3 \
              scripts/verify-rkms-final.py
          fi

          bash -n \
            scripts/setup-android-native.sh

          bash -n \
            scripts/configure-android-16.sh

          bash -n \
            scripts/configure-release-signing.sh

          node --check app.js

          echo "RKMS STATIC AUDITS: PASS"

      - name: Verify release signing secrets
        shell: bash
        run: |
          set -euo pipefail

          test -n \
            "${RKMS_KEYSTORE_BASE64:-}" || {
              echo "::error::RKMS_KEYSTORE_BASE64 missing."
              exit 1
            }

          test -n \
            "${RKMS_KEYSTORE_PASSWORD:-}" || {
              echo "::error::RKMS_KEYSTORE_PASSWORD missing."
              exit 1
            }

          test -n \
            "${RKMS_KEY_ALIAS:-}" || {
              echo "::error::RKMS_KEY_ALIAS missing."
              exit 1
            }

          test -n \
            "${RKMS_KEY_PASSWORD:-}" || {
              echo "::error::RKMS_KEY_PASSWORD missing."
              exit 1
            }

          echo "RELEASE SIGNING SECRETS: PASS"

      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/configure-release-signing.sh

          bash \
            scripts/configure-release-signing.sh

          test -s \
            android/app/release.keystore

          keytool \
            -list \
            -keystore android/app/release.keystore \
            -storepass "$RKMS_KEYSTORE_PASSWORD" \
            -alias "$RKMS_KEY_ALIAS" \
            >/dev/null

          grep -Fq \
            "signingConfigs.release" \
            android/app/build.gradle

          echo "RELEASE SIGNING CONFIGURATION: PASS"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          chmod +x \
            gradlew

          test -s \
            gradle/wrapper/gradle-wrapper.properties

          grep -Fq \
            "gradle-8.11.1-bin.zip" \
            gradle/wrapper/gradle-wrapper.properties

          ./gradlew \
            --version

          echo "GRADLE 8.11.1: PASS"

      - name: Verify Firebase Gradle dependency resolution
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          chmod +x \
            gradlew

          echo "Resolving release runtime dependencies..."

          ./gradlew \
            :app:dependencies \
            --configuration releaseRuntimeClasspath \
            --no-daemon \
            > firebase-runtime-dependencies.txt

          if grep -Eqi \
            "firebase-messaging|com.google.firebase:firebase-messaging" \
            firebase-runtime-dependencies.txt
          then
            echo "RESOLVED FIREBASE MESSAGING DEPENDENCY: PASS"
          else
            echo "::error::Firebase Messaging was not resolved in releaseRuntimeClasspath."
            echo ""
            echo "Relevant dependency output:"
            grep -Ei \
              "firebase|capacitor|messaging" \
              firebase-runtime-dependencies.txt \
              | head -200 || true
            exit 1
          fi

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          echo "Cleaning previous build..."

          ./gradlew \
            clean \
            --no-daemon

          echo "Building ONLY signed release APK..."

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          EXPECTED_APK="$RKMS_ROOT/android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Release APK was not produced."

            echo "Searching for APK files..."

            find "$RKMS_ROOT/android" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo "RKMS_RELEASE_APK=$EXPECTED_APK" >> "$GITHUB_ENV"

          echo "SIGNED RELEASE APK:"
          echo "$EXPECTED_APK"

          echo "SIGNED RELEASE APK BUILD: PASS"

      - name: Verify release APK package
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt" \
            dump badging \
            "$RKMS_RELEASE_APK" \
            > apk-badging.txt

          grep -Fq \
            "package: name='${APP_ID}'" \
            apk-badging.txt

          echo "APK PACKAGE: PASS"
          echo "Package: ${APP_ID}"

      - name: Verify release APK signature
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" \
            verify \
            --verbose \
            "$RKMS_RELEASE_APK"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" \
            verify \
            --print-certs \
            "$RKMS_RELEASE_APK" \
            > apk-signature.txt

          grep -Fq \
            "Verified using v2 scheme" \
            apk-signature.txt

          echo "APK SIGNATURE VERIFICATION: PASS"

          cat apk-signature.txt

      - name: Generate APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          sha256sum \
            "$RKMS_RELEASE_APK" \
            | tee release-apk-sha256.txt

          APK_SIZE="$(
            stat -c%s \
            "$RKMS_RELEASE_APK"
          )"

          if [ "$APK_SIZE" -le 100000 ]; then
            echo "::error::APK size is suspiciously small: $APK_SIZE bytes"
            exit 1
          fi

          echo "APK SIZE: $APK_SIZE bytes"
          echo "APK SHA256: PASS"

      - name: Final Android 16 API 36 audit
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          test -s \
            "$RKMS_RELEASE_APK"

          test -s \
            release-apk-sha256.txt

          test -f \
            android/variables.gradle

          grep -Eq \
            "compileSdkVersion[[:space:]]*=[[:space:]]*36" \
            android/variables.gradle

          grep -Eq \
            "targetSdkVersion[[:space:]]*=[[:space:]]*36" \
            android/variables.gradle

          grep -Fq \
            "gradle-8.11.1-bin.zip" \
            android/gradle/wrapper/gradle-wrapper.properties

          grep -Fq \
            "com.android.tools.build:gradle:8.9.1" \
            android/build.gradle

          echo "=============================================="
          echo "FINAL ANDROID AUDIT"
          echo "=============================================="
          echo "Android API: ${ANDROID_API}"
          echo "Build tools: ${BUILD_TOOLS}"
          echo "Gradle: 8.11.1"
          echo "AGP: 8.9.1"
          echo "Target SDK: 36"
          echo "APK: $RKMS_RELEASE_APK"
          echo "=============================================="

          echo "FINAL ANDROID 16 API 36 AUDIT: PASS"

      - name: Upload final release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-Final-Signed-Release-APK
          path: |
            ${{ env.RKMS_RELEASE_APK }}
            ${{ env.RKMS_ROOT }}/release-apk-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Final build result
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " RKMS CONNECT FINAL SIGNED RELEASE APK"

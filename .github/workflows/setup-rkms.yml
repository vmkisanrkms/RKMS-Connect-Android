name: RKMS Final Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  APP_ID: "org.rkms.connect"

  # Your actual audited ZIP filename
  SOURCE_ZIP: "RKMS_CONNECT_FINAL_ALL_NOTIFICATION_FIXES_20260922.zip"

jobs:
  build:
    name: RKMS Final Signed Release APK
    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. NODE.JS
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false


      # ============================================================
      # 3. JAVA
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # ============================================================
      # 4. HOST PACKAGES
      # ============================================================

      - name: Install required host packages
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            rsync

          echo "HOST PACKAGES: PASS"


      # ============================================================
      # 5. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      - name: Install Android API 36 SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          test -d \
            "$ANDROID_HOME/platforms/android-${ANDROID_API}"

          test -d \
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}"

          test -x \
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt"

          test -x \
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner

          echo "ANDROID API 36: PASS"
          echo "BUILD TOOLS 36.0.0: PASS"


      # ============================================================
      # 6. LOCATE SOURCE ZIP
      # ============================================================

      - name: Locate RKMS source ZIP
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="$GITHUB_WORKSPACE/$SOURCE_ZIP"

          if [ -s "$EXPECTED" ]; then
            SOURCE_PATH="$EXPECTED"
            echo "Exact configured source ZIP found."
          else
            echo "::warning::Configured source ZIP not found:"
            echo "$EXPECTED"

            mapfile -t ZIP_FILES < <(
              find "$GITHUB_WORKSPACE" \
                -maxdepth 3 \
                -type f \
                -name "*.zip" \
                -print | sort
            )

            if [ "${#ZIP_FILES[@]}" -eq 1 ]; then
              SOURCE_PATH="${ZIP_FILES[0]}"
              echo "Exactly one ZIP found. Using:"
              echo "$SOURCE_PATH"

            elif [ "${#ZIP_FILES[@]}" -gt 1 ]; then

              echo "::error::Configured source ZIP not found and multiple ZIP files exist:"
              printf '%s\n' "${ZIP_FILES[@]}"

              exit 1

            else

              echo "::error::No source ZIP found in repository."
              exit 1
            fi
          fi

          test -s "$SOURCE_PATH"

          SOURCE_SHA256="$(
            sha256sum "$SOURCE_PATH" | awk '{print $1}'
          )"

          echo "RKMS_SOURCE_ZIP=$SOURCE_PATH" >> "$GITHUB_ENV"
          echo "RKMS_SOURCE_SHA256=$SOURCE_SHA256" >> "$GITHUB_ENV"

          echo "SOURCE ZIP:"
          echo "$SOURCE_PATH"

          echo "SOURCE SHA256:"
          echo "$SOURCE_SHA256"


      # ============================================================
      # 7. EXTRACT SOURCE
      # ============================================================

      - name: Extract RKMS source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            "$GITHUB_WORKSPACE/rkms-source"

          mkdir -p \
            "$GITHUB_WORKSPACE/rkms-source"

          unzip -q \
            "$RKMS_SOURCE_ZIP" \
            -d "$GITHUB_WORKSPACE/rkms-source"

          PACKAGE_FILE="$(
            find "$GITHUB_WORKSPACE/rkms-source" \
              -type f \
              -name "package.json" \
              -not -path "*/node_modules/*" \
              -print \
              -quit
          )"

          if [ -z "$PACKAGE_FILE" ]; then
            echo "::error::package.json not found inside source ZIP."
            exit 1
          fi

          RKMS_ROOT="$(dirname "$PACKAGE_FILE")"
          RKMS_ROOT="$(cd "$RKMS_ROOT" && pwd)"

          echo "RKMS_ROOT=$RKMS_ROOT" >> "$GITHUB_ENV"

          echo "RKMS ROOT:"
          echo "$RKMS_ROOT"


      # ============================================================
      # 8. VERIFY SOURCE ZIP
      #
      # IMPORTANT:
      # DO NOT MODIFY setup-android-native.sh.
      # The uploaded source already contains a valid script.
      # ============================================================

      - name: Verify audited source
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          REQUIRED_FILES=(
            "package.json"
            "package-lock.json"
            "app.js"
            "index.html"
            "styles.css"
            "capacitor.config.json"
            "google-services.json"
            "scripts/setup-android-native.sh"
            "scripts/configure-android-16.sh"
            "scripts/configure-release-signing.sh"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -s "$FILE" ]; then
              echo "::error::Missing required file: $FILE"
              exit 1
            fi
          done

          echo "Running JavaScript syntax check..."
          node --check app.js

          echo "Checking JSON files..."
          python3 -m json.tool \
            capacitor.config.json \
            >/dev/null

          python3 -m json.tool \
            google-services.json \
            >/dev/null

          echo "Checking shell scripts..."
          bash -n \
            scripts/setup-android-native.sh

          bash -n \
            scripts/configure-android-16.sh

          bash -n \
            scripts/configure-release-signing.sh

          echo "SOURCE STRUCTURE: PASS"
          echo "NATIVE SETUP SCRIPT SYNTAX: PASS"


      # ============================================================
      # 9. VERIFY CAPACITOR
      # ============================================================

      - name: Verify Capacitor package versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node <<'NODE'
          const fs = require("fs");

          const p = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const d = Object.assign(
            {},
            p.dependencies || {},
            p.devDependencies || {}
          );

          const wanted = {
            "@capacitor/core": "6.2.2",
            "@capacitor/android": "6.2.2",
            "@capacitor/app": "6.0.3",
            "@capacitor/push-notifications": "6.0.3",
            "@capacitor/cli": "6.2.2"
          };

          for (const [name, version] of Object.entries(wanted)) {
            if (d[name] !== version) {
              throw new Error(
                `${name}: expected ${version}, found ${d[name] || "MISSING"}`
              );
            }
          }

          if (
            !p.scripts ||
            typeof p.scripts.build !== "string" ||
            !p.scripts.build.trim()
          ) {
            throw new Error("npm build script missing");
          }

          console.log("CAPACITOR VERSION CHECK: PASS");
          NODE


      # ============================================================
      # 10. VERIFY FIREBASE
      # ============================================================

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          node <<'NODE'
          const fs = require("fs");

          const d = JSON.parse(
            fs.readFileSync("google-services.json", "utf8")
          );

          const ok = (d.client || []).some(
            c =>
              c.client_info &&
              c.client_info.android_client_info &&
              c.client_info.android_client_info.package_name ===
              "org.rkms.connect"
          );

          if (!ok) {
            throw new Error(
              "org.rkms.connect not found in google-services.json"
            );
          }

          console.log("FIREBASE CONFIGURATION: PASS");
          NODE


      # ============================================================
      # 11. VERIFY FCM SOURCE
      # ============================================================

      - name: Verify FCM notification source
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          grep -Fq \
            "@capacitor/push-notifications" \
            package.json

          grep -Fq \
            "rkms_notifications_v2" \
            app.js

          grep -Fq \
            "rkms_priority_v1" \
            app.js

          grep -Fq \
            "async function rkmsRegisterFcmPush" \
            app.js

          grep -Fq \
            "pushNotificationReceived" \
            app.js

          grep -Fq \
            "pushNotificationActionPerformed" \
            app.js

          grep -Fq \
            "visibilitychange" \
            app.js

          node --check app.js

          echo "FCM SOURCE: PASS"


      # ============================================================
      # 12. VERIFY NATIVE SCRIPT WITHOUT MODIFYING IT
      # ============================================================

      - name: Verify native Android setup
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          SCRIPT="scripts/setup-android-native.sh"

          bash -n "$SCRIPT"

          grep -Fq \
            "RKMSNativeBridge" \
            "$SCRIPT"

          grep -Fq \
            "FirebaseApp.initializeApp" \
            "$SCRIPT"

          grep -Fq \
            "rkms_notifications_v2" \
            "$SCRIPT"

          grep -Fq \
            "rkms_priority_v1" \
            "$SCRIPT"

          grep -Fq \
            "androidx.credentials:credentials:1.5.0" \
            "$SCRIPT"

          grep -Fq \
            "CredentialManager" \
            "$SCRIPT"

          if grep -Fq \
            "deleteNotificationChannel" \
            "$SCRIPT"
          then
            echo "::error::Notification channel deletion detected."
            exit 1
          fi

          if grep -Fq \
            "deleteChannel" \
            "$SCRIPT"
          then
            echo "::error::Notification channel deletion detected."
            exit 1
          fi

          echo "NATIVE SETUP SCRIPT: PASS"
          echo "NOTIFICATION CHANNELS: PASS"
          echo "CREDENTIAL MANAGER: PASS"


      # ============================================================
      # 13. NPM INSTALL
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm ci \
            --no-audit \
            --no-fund

          echo "NPM INSTALL: PASS"


      # ============================================================
      # 14. WEB BUILD
      # ============================================================

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npm run build

          test -s \
            dist/index.html

          echo "WEB BUILD: PASS"


      # ============================================================
      # 15. GENERATE FRESH CAPACITOR ANDROID
      # ============================================================

      - name: Generate fresh Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          rm -rf android

          npx cap add android

          test -s \
            android/gradlew

          test -s \
            android/app/build.gradle

          chmod +x \
            android/gradlew

          echo "CAPACITOR ANDROID GENERATION: PASS"


      # ============================================================
      # 16. CONFIGURE ANDROID 16 / API 36
      # ============================================================

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/configure-android-16.sh

          bash \
            scripts/configure-android-16.sh

          test -f \
            android/gradle/wrapper/gradle-wrapper.properties

          grep -Fq \
            "gradle-8.11.1-bin.zip" \
            android/gradle/wrapper/gradle-wrapper.properties

          grep -Fq \
            "com.android.tools.build:gradle:8.9.1" \
            android/build.gradle

          grep -Eq \
            "compileSdkVersion[[:space:]]*=[[:space:]]*36" \
            android/variables.gradle

          grep -Eq \
            "targetSdkVersion[[:space:]]*=[[:space:]]*36" \
            android/variables.gradle

          echo "ANDROID 16 API 36 CONFIGURATION: PASS"


      # ============================================================
      # 17. CAPACITOR SYNC
      # ============================================================

      - name: Sync Capacitor Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          npx cap sync android

          test -s \
            android/app/build.gradle

          test -s \
            android/app/src/main/AndroidManifest.xml

          echo "CAPACITOR SYNC: PASS"


      # ============================================================
      # 18. APPLY AUDITED RKMS NATIVE SETUP
      #
      # IMPORTANT:
      # This executes the original audited script.
      # NO automatic repair/modification is performed.
      # ============================================================

      - name: Apply RKMS native Android setup
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/setup-android-native.sh

          bash \
            scripts/setup-android-native.sh

          echo "RKMS NATIVE ANDROID SETUP: PASS"


      # ============================================================
      # 19. VERIFY MAIN ACTIVITY
      # ============================================================

      - name: Verify generated MainActivity
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          MAIN_ACTIVITY="$(
            find android/app/src/main \
              -type f \
              -name "MainActivity.java" \
              -print \
              -quit
          )"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "::error::MainActivity.java not found."
            find android/app/src/main \
              -type f \
              -print || true
            exit 1
          fi

          test -s "$MAIN_ACTIVITY"

          grep -Fq \
            "RKMSNativeBridge" \
            "$MAIN_ACTIVITY"

          grep -Fq \
            "FirebaseApp.initializeApp(this)" \
            "$MAIN_ACTIVITY"

          grep -Fq \
            "onNewIntent" \
            "$MAIN_ACTIVITY"

          echo "MAIN ACTIVITY: $MAIN_ACTIVITY"
          echo "RKMSNativeBridge: PASS"
          echo "Firebase initialization: PASS"
          echo "Notification intent handling: PASS"


      # ============================================================
      # 20. VERIFY FIREBASE MESSAGING
      # ============================================================

      - name: Verify Firebase Messaging
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          test -f \
            android/app/google-services.json

          grep -Fq \
            "org.rkms.connect" \
            android/app/google-services.json

          if grep -Rqs \
            "firebase-messaging" \
            android
          then
            echo "Firebase Messaging SDK reference: PASS"
          else
            echo "::error::Firebase Messaging SDK reference not found."
            exit 1
          fi


      # ============================================================
      # 21. VERIFY NOTIFICATION CHANNELS
      # ============================================================

      - name: Verify notification channels
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          grep -Fq \
            "rkms_notifications_v2" \
            app.js

          grep -Fq \
            "rkms_priority_v1" \
            app.js

          grep -Fq \
            "rkms_notifications_v2" \
            scripts/setup-android-native.sh

          grep -Fq \
            "rkms_priority_v1" \
            scripts/setup-android-native.sh

          if grep -Fq \
            "deleteNotificationChannel" \
            scripts/setup-android-native.sh
          then
            echo "::error::Notification channel deletion detected."
            exit 1
          fi

          if grep -Fq \
            "deleteChannel" \
            scripts/setup-android-native.sh
          then
            echo "::error::Notification channel deletion detected."
            exit 1
          fi

          echo "NORMAL CHANNEL: PASS"
          echo "PRIORITY CHANNEL: PASS"
          echo "NO CHANNEL DELETION: PASS"


      # ============================================================
      # 22. RUN STATIC AUDITS
      # ============================================================

      - name: Run RKMS static audits
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          if [ -f scripts/verify-fcm-pipeline.py ]; then
            python3 \
              scripts/verify-fcm-pipeline.py
          fi

          if [ -f scripts/verify-native-bridge.py ]; then
            python3 \
              scripts/verify-native-bridge.py
          fi

          if [ -f scripts/verify-rkms-final.py ]; then
            python3 \
              scripts/verify-rkms-final.py
          fi

          bash -n \
            scripts/setup-android-native.sh

          bash -n \
            scripts/configure-android-16.sh

          bash -n \
            scripts/configure-release-signing.sh

          node --check \
            app.js

          echo "RKMS STATIC AUDITS: PASS"


      # ============================================================
      # 23. VERIFY SIGNING SECRETS
      # ============================================================

      - name: Verify release signing secrets
        shell: bash
        run: |
          set -euo pipefail

          test -n "${RKMS_KEYSTORE_BASE64:-}" || {
            echo "::error::RKMS_KEYSTORE_BASE64 secret is missing."
            exit 1
          }

          test -n "${RKMS_KEYSTORE_PASSWORD:-}" || {
            echo "::error::RKMS_KEYSTORE_PASSWORD secret is missing."
            exit 1
          }

          test -n "${RKMS_KEY_ALIAS:-}" || {
            echo "::error::RKMS_KEY_ALIAS secret is missing."
            exit 1
          }

          test -n "${RKMS_KEY_PASSWORD:-}" || {
            echo "::error::RKMS_KEY_PASSWORD secret is missing."
            exit 1
          }

          echo "RELEASE SIGNING SECRETS: PASS"


      # ============================================================
      # 24. CONFIGURE RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          chmod +x \
            scripts/configure-release-signing.sh

          bash \
            scripts/configure-release-signing.sh

          test -s \
            android/app/release.keystore

          keytool \
            -list \
            -keystore android/app/release.keystore \
            -storepass "$RKMS_KEYSTORE_PASSWORD" \
            -alias "$RKMS_KEY_ALIAS" \
            >/dev/null

          grep -Fq \
            "signingConfigs.release" \
            android/app/build.gradle

          echo "RELEASE SIGNING CONFIGURATION: PASS"


      # ============================================================
      # 25. VERIFY GRADLE
      # ============================================================

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          chmod +x \
            gradlew

          test -s \
            gradle/wrapper/gradle-wrapper.properties

          grep -Fq \
            "gradle-8.11.1-bin.zip" \
            gradle/wrapper/gradle-wrapper.properties

          ./gradlew \
            --version

          echo "GRADLE 8.11.1: PASS"


      # ============================================================
      # 26. BUILD ONLY SIGNED RELEASE APK
      #
      # NO DEBUG
      # NO AAB
      # ============================================================

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT/android"

          echo "Cleaning previous build..."
          ./gradlew \
            clean \
            --no-daemon

          echo "Building ONLY release APK..."
          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          EXPECTED_APK="$RKMS_ROOT/android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Expected release APK was not produced."

            echo "Searching for APK files:"
            find "$RKMS_ROOT/android" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          APK="$EXPECTED_APK"

          echo "RKMS_RELEASE_APK=$APK" >> "$GITHUB_ENV"

          echo "SIGNED RELEASE APK:"
          echo "$APK"

          echo "SIGNED RELEASE APK BUILD: PASS"


      # ============================================================
      # 27. VERIFY APK PACKAGE
      # ============================================================

      - name: Verify release APK package
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          APK="$RKMS_RELEASE_APK"

          test -s "$APK"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt" \
            dump badging \
            "$APK" \
            > apk-badging.txt

          grep -Fq \
            "package: name='${APP_ID}'" \
            apk-badging.txt

          echo "APK PACKAGE: PASS"
          echo "Package: ${APP_ID}"


      # ============================================================
      # 28. VERIFY APK SIGNATURE
      # ============================================================

      - name: Verify release APK signature
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          APK="$RKMS_RELEASE_APK"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" \
            verify \
            --verbose \
            "$APK"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" \
            verify \
            --print-certs \
            "$APK" \
            > apk-signature.txt

          grep -Fq \
            "Verified using v2 scheme" \
            apk-signature.txt

          echo "APK SIGNATURE VERIFICATION: PASS"

          cat apk-signature.txt


      # ============================================================
      # 29. APK SHA256
      # ============================================================

      - name: Generate APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          APK="$RKMS_RELEASE_APK"

          sha256sum \
            "$APK" \
            | tee release-apk-sha256.txt

          APK_SIZE="$(stat -c%s "$APK")"

          if [ "$APK_SIZE" -le 100000 ]; then
            echo "::error::APK size is suspiciously small: $APK_SIZE bytes"
            exit 1
          fi

          echo "APK SIZE: $APK_SIZE bytes"
          echo "APK SHA256: PASS"


      # ============================================================
      # 30. FINAL API 36 AUDIT
      # ============================================================

      - name: Final Android 16 API 36 audit
        shell: bash
        run: |
          set -euo pipefail

          cd "$RKMS_ROOT"

          test -s \
            "$RKMS_RELEASE_APK"

          test -s \
            release-apk-sha256.txt

          test -f \
            android/variables.gradle

          grep -Eq \
            "compileSdkVersion[[:space:]]*=[[:space:]]*36" \
            android/variables.gradle

          grep -Eq \
            "targetSdkVersion[[:space:]]*=[[:space:]]*36" \
            android/variables.gradle

          grep -Fq \
            "gradle-8.11.1-bin.zip" \
            android/gradle/wrapper/gradle-wrapper.properties

          grep -Fq \
            "com.android.tools.build:gradle:8.9.1" \
            android/build.gradle

          echo "=============================================="
          echo "FINAL ANDROID AUDIT"
          echo "=============================================="
          echo "Android API: ${ANDROID_API}"
          echo "Build tools: ${BUILD_TOOLS}"
          echo "Gradle: 8.11.1"
          echo "AGP: 8.9.1"
          echo "Target SDK: 36"
          echo "APK: $RKMS_RELEASE_APK"
          echo "=============================================="

          echo "FINAL ANDROID 16 API 36 AUDIT: PASS"


      # ============================================================
      # 31. UPLOAD ONLY FINAL RELEASE APK
      # ============================================================

      - name: Upload final release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-Final-Signed-Release-APK
          path: |
            ${{ env.RKMS_RELEASE_APK }}
            ${{ env.RKMS_ROOT }}/release-apk-sha256.txt
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 32. FINAL RESULT
      # ============================================================

      - name: Final build result
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " RKMS CONNECT FINAL SIGNED RELEASE APK"
          echo "=============================================="
          echo "BUILD: SUCCESS"
          echo "API: Android 36"
          echo "TARGET: Android 16"
          echo "TYPE: RELEASE APK"
          echo "DEBUG APK: NOT BUILT"
          echo "AAB: NOT BUILT"
          echo "SIGNED: YES"
          echo "ARTIFACT: RKMS-Connect-Final-Signed-Release-APK"
          echo "=============================================="

name: Build RKMS Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_SOURCE_COMMIT: cf252628308e5a6ecc9eafbaf4ca227a3ad8ec92
  WEBSITE_ZIP_NAME: RKMS_CONNECT_V9_WITH_EXACT_3_FIXES.zip
  GRADLE_VERSION: "8.10.2"

jobs:
  build:
    name: Build RKMS Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:

      # =========================================================
      # 1. Checkout repository
      # =========================================================
      - name: Checkout RKMS repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      # =========================================================
      # 2. Java 17
      # =========================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # 3. Node.js
      # =========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # =========================================================
      # 4. Prepare native Android project
      # =========================================================
      - name: Prepare native Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$RUNNER_TEMP/rkms-android"

          rm -rf "$PROJECT_DIR"

          echo "Cloning RKMS Android repository..."

          git clone \
            --no-tags \
            --filter=blob:none \
            "https://github.com/vmkisanrkms/RKMS-Connect-Android.git" \
            "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          echo "Fetching required Android source commit..."

          git fetch \
            --no-tags \
            --depth 1 \
            origin "$ANDROID_SOURCE_COMMIT"

          echo "Checking required Android commit..."

          git checkout --detach "$ANDROID_SOURCE_COMMIT"

          CURRENT_COMMIT="$(git rev-parse HEAD)"

          echo "Expected commit:"
          echo "$ANDROID_SOURCE_COMMIT"

          echo "Actual commit:"
          echo "$CURRENT_COMMIT"

          test "$CURRENT_COMMIT" = "$ANDROID_SOURCE_COMMIT"

          echo ""
          echo "Checking Android project..."

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/google-services.json
          test -f app/src/main/AndroidManifest.xml

          test -d app/src/main/java
          test -d app/src/main/res
          test -d app/src/main/assets

          echo ""
          echo "Checking FCM files..."

          test -f \
            app/src/main/java/org/rkms/connect/FCMTokenRegistrar.java

          test -f \
            app/src/main/java/org/rkms/connect/RKMSFirebaseMessagingService.java

          test -f \
            app/src/main/java/org/rkms/connect/NotificationHelper.java

          test -f \
            app/src/main/java/org/rkms/connect/SessionStore.java

          echo ""
          echo "Native Android source verification: PASS"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # =========================================================
      # 5. Locate exact V9 + 3 fixes ZIP
      # =========================================================
      - name: Locate V9 Exact 3 Fixes ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/$WEBSITE_ZIP_NAME"

          echo "Required ZIP:"
          echo "$ZIP_FILE"

          if [ ! -f "$ZIP_FILE" ]; then

            echo ""
            echo "::error::Required V9 exact-3-fixes ZIP is missing."

            echo "Expected:"
            echo "$WEBSITE_ZIP_NAME"

            echo ""
            echo "Available ZIP files:"

            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "*.zip" \
              -not -path "*/.git/*" \
              -print

            exit 1
          fi

          test -s "$ZIP_FILE"

          echo ""
          echo "Selected ZIP:"
          ls -lh "$ZIP_FILE"

          echo "WEBSITE_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"

      # =========================================================
      # 6. Extract V9 ZIP
      # =========================================================
      - name: Extract V9 Exact 3 Fixes
        shell: bash
        run: |
          set -euo pipefail

          WEB_EXTRACT="$RUNNER_TEMP/rkms-web"

          rm -rf "$WEB_EXTRACT"

          mkdir -p "$WEB_EXTRACT"

          echo "Extracting V9 ZIP..."

          unzip -q \
            "$WEBSITE_ZIP" \
            -d "$WEB_EXTRACT"

          echo ""
          echo "Searching for required files..."

          test -f "$WEB_EXTRACT/index.html"
          test -f "$WEB_EXTRACT/app.js"
          test -f "$WEB_EXTRACT/styles.css"
          test -f "$WEB_EXTRACT/config.js"

          APP_JS="$WEB_EXTRACT/app.js"

          test -s "$APP_JS"

          echo ""
          echo "app.js size:"

          wc -c "$APP_JS"

          echo ""
          echo "JavaScript syntax check..."

          node --check "$APP_JS"

          echo ""
          echo "JavaScript syntax: PASS"

          echo "APP_JS=$APP_JS" >> "$GITHUB_ENV"
          echo "WEB_EXTRACT=$WEB_EXTRACT" >> "$GITHUB_ENV"

      # =========================================================
      # 7. Verify Fix #1
      # PDA / Member geographic visibility
      # =========================================================
      - name: Verify Fix 1 Geographic Visibility
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking PDA geographic scope..."

          grep -q \
            "rkmsOfficerCanAccessTarget" \
            "$APP_JS"

          echo "PDA geographic scope: FOUND"

          echo ""
          echo "Checking Member geographic scope..."

          grep -q \
            "rkmsOfficerCanAccessMember" \
            "$APP_JS"

          echo "Member geographic scope: FOUND"

          echo ""
          echo "Fix #1 Geographic Visibility: PASS"

      # =========================================================
      # 8. Verify Fix #2
      # Appointment post/location hierarchy
      # =========================================================
      - name: Verify Fix 2 Appointment Location
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking appointment level logic..."

          grep -q \
            "rkmsAppointmentLevelKey" \
            "$APP_JS"

          echo "Appointment level key: FOUND"

          echo ""
          echo "Checking location visibility..."

          grep -q \
            "rkmsAppointmentLocationVisibility" \
            "$APP_JS"

          echo "Appointment location visibility: FOUND"

          echo ""
          echo "Checking post scope application..."

          grep -q \
            "applyAppointmentPostScope" \
            "$APP_JS"

          echo "Appointment post scope: FOUND"

          echo ""
          echo "Fix #2 Appointment Location: PASS"

      # =========================================================
      # 9. Verify Fix #3
      # Chat live update
      # =========================================================
      - name: Verify Fix 3 Live Chat
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking live chat implementation..."

          grep -q \
            "rkmsChatLive" \
            "$APP_JS"

          echo "RKMS live-chat code: FOUND"

          echo ""
          echo "Checking Realtime..."

          grep -q \
            "startChatLiveRealtime" \
            "$APP_JS"

          grep -q \
            "postgres_changes" \
            "$APP_JS"

          echo "Supabase Realtime listener: FOUND"

          echo ""
          echo "Checking fallback polling..."

          grep -q \
            "setInterval" \
            "$APP_JS"

          echo "Fallback polling: FOUND"

          echo ""
          echo "Checking foreground resync..."

          grep -q \
            "visibilitychange" \
            "$APP_JS"

          echo "Foreground resync: FOUND"

          echo ""
          echo "Fix #3 Chat Live Update: PASS"

      # =========================================================
      # 10. Install V9 web app into Android
      # =========================================================
      - name: Install V9 Web App Into Android
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_WEB="$PROJECT_DIR/app/src/main/assets/www"

          echo "Android web directory:"
          echo "$ANDROID_WEB"

          rm -rf "$ANDROID_WEB"

          mkdir -p "$ANDROID_WEB"

          echo ""
          echo "Copying V9 web application..."

          cp \
            "$WEB_EXTRACT/index.html" \
            "$ANDROID_WEB/"

          cp \
            "$WEB_EXTRACT/styles.css" \
            "$ANDROID_WEB/"

          cp \
            "$WEB_EXTRACT/app.js" \
            "$ANDROID_WEB/"

          cp \
            "$WEB_EXTRACT/config.js" \
            "$ANDROID_WEB/"

          if [ -f "$WEB_EXTRACT/manifest.webmanifest" ]; then

            cp \
              "$WEB_EXTRACT/manifest.webmanifest" \
              "$ANDROID_WEB/"

          fi

          if [ -d "$WEB_EXTRACT/assets" ]; then

            cp -a \
              "$WEB_EXTRACT/assets" \
              "$ANDROID_WEB/"

          fi

          test -s "$ANDROID_WEB/index.html"
          test -s "$ANDROID_WEB/app.js"
          test -s "$ANDROID_WEB/config.js"

          test -d "$ANDROID_WEB/assets"

          node --check \
            "$ANDROID_WEB/app.js"

          echo ""
          echo "V9 web application installed."

          echo ""
          echo "Android web assets:"
          find "$ANDROID_WEB" \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -200

          echo ""
          echo "Android web installation: PASS"

          echo "ANDROID_WEB=$ANDROID_WEB" >> "$GITHUB_ENV"

      # =========================================================
      # 11. Verify the 3 fixes AFTER installation
      # =========================================================
      - name: Verify Installed Three Fixes
        shell: bash
        run: |
          set -euo pipefail

          echo "Final installed app.js verification..."

          # FIX 1
          grep -q \
            "rkmsOfficerCanAccessTarget" \
            "$ANDROID_WEB/app.js"

          grep -q \
            "rkmsOfficerCanAccessMember" \
            "$ANDROID_WEB/app.js"

          # FIX 2
          grep -q \
            "rkmsAppointmentLevelKey" \
            "$ANDROID_WEB/app.js"

          grep -q \
            "rkmsAppointmentLocationVisibility" \
            "$ANDROID_WEB/app.js"

          grep -q \
            "applyAppointmentPostScope" \
            "$ANDROID_WEB/app.js"

          # FIX 3
          grep -q \
            "rkmsChatLive" \
            "$ANDROID_WEB/app.js"

          grep -q \
            "startChatLiveRealtime" \
            "$ANDROID_WEB/app.js"

          grep -q \
            "postgres_changes" \
            "$ANDROID_WEB/app.js"

          grep -q \
            "setInterval" \
            "$ANDROID_WEB/app.js"

          grep -q \
            "visibilitychange" \
            "$ANDROID_WEB/app.js"

          node --check \
            "$ANDROID_WEB/app.js"

          echo ""
          echo "=================================================="
          echo "ALL 3 FIXES INSTALLED AND VERIFIED"
          echo "=================================================="

      # =========================================================
      # 12. Verify existing V9 Book
      # =========================================================
      - name: Verify Existing V9 Book
        shell: bash
        run: |
          set -euo pipefail

          BOOK_DIR="$ANDROID_WEB/assets/book"

          test -d "$BOOK_DIR"

          PAGE_COUNT="$(
            find "$BOOK_DIR" \
              -type f \
              \( \
                -iname "page-*.jpg" \
                -o -iname "page-*.jpeg" \
                -o -iname "page-*.png" \
                -o -iname "page-*.webp" \
              \) \
              | wc -l
          )"

          echo "Book page count:"
          echo "$PAGE_COUNT"

          test "$PAGE_COUNT" -eq 60

          echo "Book 60 pages: PASS"

      # =========================================================
      # 13. Setup Android SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # =========================================================
      # 14. Install Android Build Tools
      #     FIXES apksigner NOT FOUND
      # =========================================================
      - name: Install Android Build Tools
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing Android SDK build tools..."

          yes | sdkmanager \
            "platform-tools" \
            "build-tools;35.0.0"

          echo ""
          echo "Installed Android Build Tools:"

          find "$ANDROID_HOME/build-tools" \
            -maxdepth 2 \
            -type f \
            -name "apksigner" \
            -print

          echo ""
          echo "Android Build Tools installation: PASS"

      # =========================================================
      # 15. Setup Gradle
      # =========================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # =========================================================
      # 16. Create Gradle Wrapper
      # =========================================================
      - name: Create Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gradle wrapper \
            --gradle-version "$GRADLE_VERSION" \
            --distribution-type bin

          chmod +x gradlew

          ./gradlew --version

      # =========================================================
      # 17. Existing release signing ONLY
      #     Never create a new signing key
      # =========================================================
      - name: Prepare Existing Release Signing
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
          RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
          RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
          RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          KEYSTORE="$RUNNER_TEMP/rkms-release.keystore"

          echo "Checking RKMS release signing secrets..."

          if [ -z "$RKMS_KEYSTORE_BASE64" ] || \
             [ -z "$RKMS_KEYSTORE_PASSWORD" ] || \
             [ -z "$RKMS_KEY_ALIAS" ] || \
             [ -z "$RKMS_KEY_PASSWORD" ]; then

            echo ""
            echo "::error::Existing RKMS release signing secrets are not configured."

            echo "::error::Build stopped."

            echo "::error::A temporary signing key will NOT be created."

            exit 1
          fi

          echo ""
          echo "Decoding existing RKMS keystore..."

          printf '%s' \
            "$RKMS_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$KEYSTORE"

          test -s "$KEYSTORE"

          echo ""
          echo "Verifying keystore..."

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$RKMS_KEYSTORE_PASSWORD" \
            -alias "$RKMS_KEY_ALIAS" \
            >/dev/null

          echo ""
          echo "Existing RKMS release keystore: PASS"

          echo "RKMS_KEYSTORE_PATH=$KEYSTORE" \
            >> "$GITHUB_ENV"

          echo "RKMS_KEYSTORE_PASSWORD=$RKMS_KEYSTORE_PASSWORD" \
            >> "$GITHUB_ENV"

          echo "RKMS_KEY_ALIAS=$RKMS_KEY_ALIAS" \
            >> "$GITHUB_ENV"

          echo "RKMS_KEY_PASSWORD=$RKMS_KEY_PASSWORD" \
            >> "$GITHUB_ENV"

      # =========================================================
      # 18. Final native Android verification
      # =========================================================
      - name: Verify Native Android Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking native Android project..."

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/google-services.json
          test -f app/src/main/AndroidManifest.xml

          echo ""
          echo "Checking FCM..."

          test -f \
            app/src/main/java/org/rkms/connect/FCMTokenRegistrar.java

          test -f \
            app/src/main/java/org/rkms/connect/RKMSFirebaseMessagingService.java

          test -f \
            app/src/main/java/org/rkms/connect/NotificationHelper.java

          test -f \
            app/src/main/java/org/rkms/connect/SessionStore.java

          echo ""
          echo "Checking WebView assets..."

          test -f "$ANDROID_WEB/index.html"
          test -f "$ANDROID_WEB/app.js"
          test -f "$ANDROID_WEB/config.js"

          echo ""
          echo "Native Android + FCM + V9 Web Assets: PASS"

      # =========================================================
      # 19. Build Release APK
      # =========================================================
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          echo "Building release APK..."

          ./gradlew clean assembleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "Release APK build: PASS"

      # =========================================================
      # 20. Locate APK
      # =========================================================
      - name: Locate Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find "$PROJECT_DIR" \
              -type f \
              -path "*/build/outputs/apk/release/*.apk" \
              -print \
              -quit
          )"

          if [ -z "$APK" ]; then

            echo "::error::Release APK not found."

            echo ""
            echo "Available APK files:"

            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          test -s "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo ""
          echo "APK found:"
          echo "$APK"

          echo ""
          ls -lh "$APK"

      # =========================================================
      # 21. Verify APK Signature
      #     Uses actual Android SDK apksigner path
      # =========================================================
      - name: Verify APK Signature
        shell: bash
        run: |
          set -euo pipefail

          test -s "$APK"

          echo "Searching Android SDK for apksigner..."

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name "apksigner" \
              -print \
              | sort -V \
              | tail -1
          )"

          if [ -z "$APKSIGNER" ]; then

            echo "::error::apksigner was not found."

            echo ""
            echo "Installed build tools:"

            ls -la "$ANDROID_HOME/build-tools" || true

            exit 1
          fi

          chmod +x "$APKSIGNER"

          echo ""
          echo "Using apksigner:"
          echo "$APKSIGNER"

          echo ""
          echo "Verifying APK signature..."

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

          echo ""
          echo "APK signature verification: PASS"

      # =========================================================
      # 22. Verify APK package information
      # =========================================================
      - name: Verify APK Package
        shell: bash
        run: |
          set -euo pipefail

          test -s "$APK"

          echo "APK file:"
          ls -lh "$APK"

          echo ""
          echo "APK package verification..."

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            "$APK"

          echo ""
          echo "APK package/signature verification: PASS"

      # =========================================================
      # 23. Upload final APK
      # =========================================================
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-Final-Exact-3-Fixes
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 14

      # =========================================================
      # 24. Upload final app.js
      # =========================================================
      - name: Upload Final app.js
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Final-Exact-3-Fixes-app-js
          path: ${{ env.PROJECT_DIR }}/app/src/main/assets/www/app.js
          if-no-files-found: error
          retention-days: 14

      # =========================================================
      # 25. Final success
      # =========================================================
      - name: Build Complete
        shell: bash
        run: |
          echo ""
          echo "=================================================="
          echo "       RKMS RELEASE BUILD SUCCESS"
          echo "=================================================="
          echo ""

          echo "FIX #1 PDA/Member Geographic Visibility : PASS"
          echo "FIX #2 Appointment Post Location       : PASS"
          echo "FIX #3 Chat Live Update                 : PASS"

          echo ""
          echo "Native Android                         : VERIFIED"
          echo "FCM                                     : VERIFIED"
          echo "V9 Book                                 : 60 pages"
          echo "Release Signing                         : VERIFIED"
          echo "APK Signature                           : VERIFIED"
          echo "APK                                     : BUILT"
          echo ""

          echo "=================================================="
          echo "          READY FOR APK DOWNLOAD"
          echo "=================================================="

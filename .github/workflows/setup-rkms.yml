name: Build RKMS Connect APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract RKMS Connect V1A source
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build-project

          SOURCE_ZIP="RKMS_CONNECT_V1A_FINAL_BUILD_READY.zip"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERROR: $SOURCE_ZIP not found"
            echo "Available ZIP files:"
            find . -maxdepth 1 -type f -name "*.zip" -print
            exit 1
          fi

          echo "Using source: $SOURCE_ZIP"

          unzip -t "$SOURCE_ZIP" >/dev/null
          unzip -q "$SOURCE_ZIP" -d build-project

          echo "V1A source extracted successfully"

      - name: Locate RKMS source
        shell: bash
        run: |
          set -euo pipefail

          APP_JS="$(find build-project -type f -name "app.js" -print -quit)"

          if [ -z "$APP_JS" ]; then
            echo "ERROR: app.js not found"
            exit 1
          fi

          SOURCE_DIR="$(dirname "$APP_JS")"

          echo "RKMS source directory:"
          echo "$SOURCE_DIR"

          mkdir -p rkms-source

          rsync -a \
            "$SOURCE_DIR"/ \
            rkms-source/

          test -f rkms-source/app.js
          test -f rkms-source/index.html
          test -f rkms-source/config.js

          echo "RKMS V1A source verified"

      - name: Verify JavaScript
        run: |
          set -euo pipefail

          node --check rkms-source/app.js

          echo "app.js syntax verified"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create Capacitor build package
        working-directory: rkms-source
        shell: bash
        run: |
          set -euo pipefail

          cat > package.json <<'JSON'
          {
            "name": "rkms-connect",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "rm -rf dist && mkdir -p dist && rsync -a --exclude='dist/' --exclude='android/' --exclude='node_modules/' --exclude='.git/' --exclude='.github/' --exclude='*.zip' ./ dist/"
            },
            "dependencies": {
              "@capacitor/core": "6.2.2",
              "@capacitor/android": "6.2.2",
              "@capacitor/app": "6.0.3"
            },
            "devDependencies": {
              "@capacitor/cli": "6.2.2"
            }
          }
          JSON

          cat > capacitor.config.json <<'JSON'
          {
            "appId": "org.rkms.connect",
            "appName": "RKMS",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https",
              "cleartext": true
            },
            "android": {
              "allowMixedContent": true,
              "captureInput": true,
              "webContentsDebuggingEnabled": false
            }
          }
          JSON

          echo "Capacitor package created"

      - name: Install Capacitor dependencies
        working-directory: rkms-source
        run: |
          npm install --no-audit --no-fund

      - name: Build RKMS web application
        working-directory: rkms-source
        run: |
          npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android platform
        working-directory: rkms-source
        run: |
          npx cap add android

      - name: Setup RKMS Android native bridge
        working-directory: rkms-source
        shell: bash
        run: |
          set -euo pipefail

          if [ -f scripts/setup-android-native.sh ]; then
            chmod +x scripts/setup-android-native.sh
            bash scripts/setup-android-native.sh
            echo "RKMS Android native bridge setup completed"
          else
            echo "No native setup script found; continuing"
          fi

      - name: Sync RKMS application
        working-directory: rkms-source
        run: |
          npx cap sync android

      - name: Install ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Install RKMS launcher logo
        shell: bash
        run: |
          set -euo pipefail

          LOGO="rkms-source/assets/rkms-logo-transparent.png"
          RES="rkms-source/android/app/src/main/res"
          STRINGS="rkms-source/android/app/src/main/res/values/strings.xml"

          test -s "$LOGO"

          mkdir -p \
            "$RES/mipmap-mdpi" \
            "$RES/mipmap-hdpi" \
            "$RES/mipmap-xhdpi" \
            "$RES/mipmap-xxhdpi" \
            "$RES/mipmap-xxxhdpi"

          convert "$LOGO" -resize 48x48! -strip \
            "$RES/mipmap-mdpi/ic_launcher.png"

          convert "$LOGO" -resize 72x72! -strip \
            "$RES/mipmap-hdpi/ic_launcher.png"

          convert "$LOGO" -resize 96x96! -strip \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          convert "$LOGO" -resize 144x144! -strip \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          convert "$LOGO" -resize 192x192! -strip \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"

          cp "$RES/mipmap-mdpi/ic_launcher.png" \
             "$RES/mipmap-mdpi/ic_launcher_round.png"

          cp "$RES/mipmap-hdpi/ic_launcher.png" \
             "$RES/mipmap-hdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xhdpi/ic_launcher.png" \
             "$RES/mipmap-xhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

          rm -rf \
            "$RES/mipmap-anydpi-v26" \
            "$RES/mipmap-anydpi"

          find "$RES" -type f \
            -name 'ic_launcher_foreground.xml' -o \
            -name 'ic_launcher_background.xml' -o \
            -name 'ic_launcher_foreground.png' -o \
            -name 'ic_launcher_background.png' \
          -delete || true

          if grep -q '<string name="app_name">' "$STRINGS"; then
            sed -i \
              's#<string name="app_name">.*</string>#<string name="app_name

name: RKMS Android 16 API 36 FINAL APK AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  android-release:

    name: RKMS Android 16 API 36 Release

    runs-on: ubuntu-latest

    env:
      RKMS_KEYSTORE_BASE64: ${{ secrets.RKMS_KEYSTORE_BASE64 }}
      RKMS_KEYSTORE_PASSWORD: ${{ secrets.RKMS_KEYSTORE_PASSWORD }}
      RKMS_KEY_ALIAS: ${{ secrets.RKMS_KEY_ALIAS }}
      RKMS_KEY_PASSWORD: ${{ secrets.RKMS_KEY_PASSWORD }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. LOCATE CORRECT RKMS SOURCE
      #
      # IMPORTANT:
      # Do NOT blindly select the newest ZIP.
      #
      # The selected source MUST contain:
      # team_rkms
      # A94473
      # Team RKMS UUID
      # teamRkmsAvatar
      # isTeamRKMSProfile
      # SUPER_ADMIN
      # ============================================================

      - name: Locate correct RKMS source
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "RKMS SOURCE SELECTION"
          echo "============================================================"

          # --------------------------------------------------------
          # CASE 1:
          # Repository itself is the RKMS project.
          # --------------------------------------------------------

          if [ -f "package.json" ] &&
             [ -f "app.js" ] &&
             [ -f "index.html" ]; then

            echo "Repository root contains RKMS source."

            echo "SOURCE_DIR=." >> "$GITHUB_ENV"

            exit 0
          fi


          # --------------------------------------------------------
          # CASE 2:
          # Search ZIP files.
          # --------------------------------------------------------

          mapfile -t ZIP_CANDIDATES < <(
            find . \
              -type f \
              -name '*.zip' \
              ! -path './.git/*' \
              -print \
              | sort -r
          )


          if [ "${#ZIP_CANDIDATES[@]}" -eq 0 ]; then

            echo "ERROR: No ZIP files found."

            find . \
              -maxdepth 4 \
              -type f \
              -print \
              | head -200

            exit 1
          fi


          echo ""
          echo "ZIP candidates found:"
          printf '%s\n' "${ZIP_CANDIDATES[@]}"


          # --------------------------------------------------------
          # Try each ZIP.
          #
          # Only accept a ZIP that actually contains the Team RKMS
          # implementation.
          # --------------------------------------------------------

          SELECTED_ZIP=""

          rm -rf .rkms_extract

          mkdir -p .rkms_extract


          for ZIP_FILE in "${ZIP_CANDIDATES[@]}"; do

            echo ""
            echo "------------------------------------------------------------"
            echo "Checking:"
            echo "$ZIP_FILE"
            echo "------------------------------------------------------------"

            TEST_DIR=".rkms_extract/test"

            rm -rf "$TEST_DIR"

            mkdir -p "$TEST_DIR"

            if ! unzip -q "$ZIP_FILE" -d "$TEST_DIR"; then
              echo "ZIP extraction failed - skipping."
              continue
            fi


            TEST_PACKAGE_JSON="$(
              find "$TEST_DIR" \
                -type f \
                -name 'package.json' \
                -print \
                | head -1
            )"


            if [ -z "$TEST_PACKAGE_JSON" ]; then
              echo "No package.json - skipping."
              continue
            fi


            TEST_SOURCE_DIR="$(
              dirname "$TEST_PACKAGE_JSON"
            )"


            if [ ! -f "$TEST_SOURCE_DIR/app.js" ]; then
              echo "No app.js - skipping."
              continue
            fi


            # ------------------------------------------------------
            # Team RKMS source verification
            # ------------------------------------------------------

            REQUIRED_OK=true

            grep -Fq "team_rkms" \
              "$TEST_SOURCE_DIR/app.js" \
              || REQUIRED_OK=false

            grep -Fq "A94473" \
              "$TEST_SOURCE_DIR/app.js" \
              || REQUIRED_OK=false

            grep -Fq \
              "b909411c-591d-4a57-9d8d-280842901331" \
              "$TEST_SOURCE_DIR/app.js" \
              || REQUIRED_OK=false

            grep -Fq "teamRkmsAvatar" \
              "$TEST_SOURCE_DIR/app.js" \
              || REQUIRED_OK=false

            grep -Fq "isTeamRKMSProfile" \
              "$TEST_SOURCE_DIR/app.js" \
              || REQUIRED_OK=false

            grep -Fq "SUPER_ADMIN" \
              "$TEST_SOURCE_DIR/app.js" \
              || REQUIRED_OK=false


            if [ "$REQUIRED_OK" = true ]; then

              echo ""
              echo "TEAM RKMS SOURCE ACCEPTED:"
              echo "$ZIP_FILE"

              SELECTED_ZIP="$ZIP_FILE"

              break

            fi


            echo "Team RKMS implementation not complete - skipping."

          done


          # --------------------------------------------------------
          # No correct ZIP found
          # --------------------------------------------------------

          if [ -z "$SELECTED_ZIP" ]; then

            echo ""
            echo "============================================================"
            echo "ERROR: CORRECT TEAM RKMS SOURCE NOT FOUND"
            echo "============================================================"
            echo ""
            echo "The workflow will NOT build an old/incorrect ZIP."
            echo ""
            echo "Required Team RKMS markers:"
            echo " - team_rkms"
            echo " - A94473"
            echo " - Team RKMS UUID"
            echo " - teamRkmsAvatar"
            echo " - isTeamRKMSProfile"
            echo " - SUPER_ADMIN"
            echo ""

            exit 1
          fi


          # --------------------------------------------------------
          # Extract selected ZIP
          # --------------------------------------------------------

          rm -rf .rkms_extract

          mkdir -p .rkms_extract

          unzip -q \
            "$SELECTED_ZIP" \
            -d .rkms_extract


          PACKAGE_JSON="$(
            find .rkms_extract \
              -type f \
              -name 'package.json' \
              -print \
              | head -1
          )"


          if [ -z "$PACKAGE_JSON" ]; then

            echo "ERROR: package.json missing from selected ZIP."

            exit 1
          fi


          SOURCE_DIR="$(
            dirname "$PACKAGE_JSON"
          )"


          echo ""
          echo "============================================================"
          echo "SELECTED RKMS SOURCE"
          echo "============================================================"
          echo "$SOURCE_DIR"
          echo "============================================================"


          echo "SOURCE_DIR=$SOURCE_DIR" \
            >> "$GITHUB_ENV"


      # ============================================================
      # 3. VERIFY SOURCE
      # ============================================================

      - name: Verify RKMS source
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          test -f package.json
          test -f app.js
          test -f index.html
          test -f styles.css
          test -f capacitor.config.json
          test -f google-services.json

          test -f assets/rkms-logo-transparent.png

          test -f scripts/configure-android-16.sh
          test -f scripts/setup-android-native.sh

          echo "package.json: PASS"
          echo "app.js: PASS"
          echo "index.html: PASS"
          echo "styles.css: PASS"
          echo "capacitor.config.json: PASS"
          echo "google-services.json: PASS"
          echo "RKMS logo: PASS"
          echo "Android scripts: PASS"


      # ============================================================
      # 4. TEAM RKMS FINAL SOURCE AUDIT
      # ============================================================

      - name: Audit Team RKMS Super Admin Chat
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          grep -Fq "team_rkms" app.js
          grep -Fq "A94473" app.js

          grep -Fq \
            "b909411c-591d-4a57-9d8d-280842901331" \
            app.js

          grep -Fq "teamRkmsAvatar" app.js
          grep -Fq "isTeamRKMSProfile" app.js
          grep -Fq "SUPER_ADMIN" app.js

          # Team RKMS logo rendering in chat
          grep -Fq \
            "isTeamRKMSProfile(p) ? teamRkmsAvatar()" \
            app.js

          # Recent chat logo rendering
          grep -Fq \
            "isTeamRKMSProfile(t) ? teamRkmsAvatar()" \
            app.js

          # Conversation header logo rendering
          grep -Fq \
            "isTeamRKMSProfile(meta) ? teamRkmsAvatar()" \
            app.js

          echo ""
          echo "============================================================"
          echo "TEAM RKMS AUDIT: PASS"
          echo "============================================================"
          echo "Team identity       : PASS"
          echo "Member ID A94473    : PASS"
          echo "Team UUID            : PASS"
          echo "Logo function        : PASS"
          echo "New Chat logo        : PASS"
          echo "Recent Chat logo     : PASS"
          echo "Conversation logo    : PASS"
          echo "Super Admin support  : PASS"
          echo "============================================================"


      # ============================================================
      # 5. NODE 22
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      # ============================================================
      # 6. JDK 17
      # ============================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 7. JAVASCRIPT SYNTAX
      # ============================================================

      - name: Verify JavaScript
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          node --version
          npm --version

          node --check app.js

          echo "JavaScript syntax: PASS"


      # ============================================================
      # 8. NPM INSTALL
      # ============================================================

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          if [ -f package-lock.json ]; then

            npm ci \
              --no-audit \
              --no-fund

          else

            npm install \
              --no-audit \
              --no-fund

          fi

          echo "NPM install: PASS"


      # ============================================================
      # 9. RKMS STATIC AUDITS
      #
      # Android-specific verifier intentionally NOT here.
      # verify-android-16.py needs android/variables.gradle.
      # ============================================================

      - name: Run RKMS static verification
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 scripts/verify-rkms-final.py
          python3 scripts/verify-member-directory-scope.py
          python3 scripts/verify-authority-hierarchy.py
          python3 scripts/verify-fcm-pipeline.py
          python3 scripts/verify-final-login-navigation.py
          python3 scripts/verify-saved-login.py
          python3 scripts/verify-native-bridge.py

          echo ""
          echo "============================================================"
          echo "RKMS STATIC VERIFICATION: PASS"
          echo "============================================================"


      # ============================================================
      # 10. WEB BUILD
      # ============================================================

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          npm run build

          test -f dist/index.html
          test -f dist/app.js
          test -f dist/assets/rkms-logo-transparent.png

          echo "Web build: PASS"


      # ============================================================
      # 11. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 12. INSTALL API 36
      # ============================================================

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses \
            >/dev/null 2>&1 \
            || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          test -d \
            "${ANDROID_HOME}/platforms/android-36"

          test -d \
            "${ANDROID_HOME}/build-tools/36.0.0"

          echo "Android API 36: PASS"
          echo "Build Tools 36.0.0: PASS"


      # ============================================================
      # 13. GENERATE ANDROID
      # ============================================================

      - name: Generate Capacitor Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          rm -rf android

          npx cap add android

          test -f android/app/build.gradle
          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml

          echo "Capacitor Android generation: PASS"


      # ============================================================
      # 14. CONFIGURE ANDROID 16
      # ============================================================

      - name: Configure Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          chmod +x \
            scripts/configure-android-16.sh

          ./scripts/configure-android-16.sh

          test -f \
            android/variables.gradle

          echo "Android 16 configuration: PASS"


      # ============================================================
      # 15. NOW RUN ANDROID VERIFIER
      #
      # This is intentionally AFTER npx cap add android.
      # ============================================================

      - name: Verify Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          test -f \
            android/variables.gradle

          python3 \
            scripts/verify-android-16.py

          echo ""
          echo "============================================================"
          echo "ANDROID 16 API 36 VERIFICATION: PASS"
          echo "============================================================"


      # ============================================================
      # 16. CAPACITOR SYNC
      # ============================================================

      - name: Sync Capacitor Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          npx cap sync android

          echo "Capacitor sync: PASS"


      # ============================================================
      # 17. RKMS NATIVE ANDROID
      # ============================================================

      - name: Configure RKMS native Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          chmod +x \
            scripts/setup-android-native.sh

          ./scripts/setup-android-native.sh

          test -f \
            android/app/src/main/java/org/rkms/connect/MainActivity.java

          test -f \
            android/app/src/main/java/org/rkms/connect/RKMSNativeBridge.java

          test -s \
            android/app/google-services.json

          echo "MainActivity: PASS"
          echo "RKMSNativeBridge: PASS"
          echo "Firebase JSON: PASS"


      # ============================================================
      # 18. APPLICATION ID
      # ============================================================

      - name: Verify application ID
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          grep -R -Fq \
            "org.rkms.connect" \
            android/app/build.gradle

          echo "Application ID org.rkms.connect: PASS"


      # ============================================================
      # 19. FIREBASE
      # ============================================================

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          test -s \
            android/app/google-services.json

          python3 - <<'PY'
          import json

          path = "android/app/google-services.json"

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          packages = []

          for client in data.get("client", []):

              package_name = (
                  client
                  .get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

              if package_name:
                  packages.append(package_name)

          print("Firebase packages:")

          for package_name in packages:
              print(" -", package_name)

          if "org.rkms.connect" not in packages:

              raise SystemExit(
                  "ERROR: org.rkms.connect Firebase client missing"
              )

          print("Firebase configuration: PASS")
          PY


      # ============================================================
      # 20. FIREBASE INITIALIZATION
      # ============================================================

      - name: Verify Firebase initialization
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          MAIN="android/app/src/main/java/org/rkms/connect/MainActivity.java"

          test -f "$MAIN"

          grep -Fq \
            "FirebaseApp.initializeApp(this)" \
            "$MAIN"

          COUNT="$(
            grep -F \
              -o \
              "FirebaseApp.initializeApp(this)" \
              "$MAIN" \
              | wc -l
          )"

          if [ "$COUNT" -ne 1 ]; then

            echo "ERROR:"
            echo "Firebase initialization count = $COUNT"

            exit 1
          fi

          echo "Firebase initialization: PASS"


      # ============================================================
      # 21. GRADLE 8.11.1
      # ============================================================

      - name: Configure Gradle 8.11.1
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR/android"

          mkdir -p \
            gradle/wrapper

          cat > \
            gradle/wrapper/gradle-wrapper.properties \
            <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          networkTimeout=100000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          chmod +x gradlew

          ./gradlew --version

          echo "Gradle 8.11.1: PASS"


      # ============================================================
      # 22. SIGNING SECRETS
      # ============================================================

      - name: Verify release signing secrets
        shell: bash
        run: |
          set -euo pipefail

          test -n \
            "${RKMS_KEYSTORE_BASE64:-}"

          test -n \
            "${RKMS_KEYSTORE_PASSWORD:-}"

          test -n \
            "${RKMS_KEY_ALIAS:-}"

          test -n \
            "${RKMS_KEY_PASSWORD:-}"

          echo "Release signing secrets: PASS"


      # ============================================================
      # 23. PREPARE KEYSTORE
      # ============================================================

      - name: Prepare release keystore
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          echo "$RKMS_KEYSTORE_BASE64" \
            | base64 --decode \
            > rkms-release.keystore

          test -s \
            rkms-release.keystore

          echo "Release keystore: PASS"


      # ============================================================
      # 24. CONFIGURE RELEASE SIGNING
      #
      # This safely modifies the existing release build type
      # instead of creating a duplicate release block.
      # ============================================================

      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "android/app/build.gradle"
          )

          text = path.read_text()

          signing_line = """
                  storeFile file("../../rkms-release.keystore")
                  storePassword System.getenv("RKMS_KEYSTORE_PASSWORD")
                  keyAlias System.getenv("RKMS_KEY_ALIAS")
                  keyPassword System.getenv("RKMS_KEY_PASSWORD")
          """

          # --------------------------------------------------------
          # signingConfigs
          # --------------------------------------------------------

          if "rkms-release.keystore" not in text:

              if "signingConfigs {" in text:

                  marker = "signingConfigs {"

                  insert = f"""{marker}
              release {{
          {signing_line}
              }}
          """

                  text = text.replace(
                      marker,
                      insert,
                      1
                  )

              else:

                  marker = "android {"

                  block = f"""android {{
              signingConfigs {{
                  release {{
          {signing_line}
                  }}
              }}
          """

                  text = text.replace(
                      marker,
                      block,
                      1
                  )


          # --------------------------------------------------------
          # Find buildTypes block and existing release block.
          # --------------------------------------------------------

          build_types_pos = text.find(
              "buildTypes {"
          )

          if build_types_pos == -1:

              raise SystemExit(
                  "ERROR: buildTypes block not found."
              )


          release_pos = text.find(
              "release {",
              build_types_pos
          )

          if release_pos == -1:

              raise SystemExit(
                  "ERROR: release build type not found."
              )


          # --------------------------------------------------------
          # Add signingConfig only if missing.
          # --------------------------------------------------------

          release_end_search = text.find(
              "\n",
              release_pos
          )

          if "signingConfig signingConfigs.release" not in text:

              insertion = (
                  "\n"
                  "            signingConfig "
                  "signingConfigs.release"
              )

              text = (
                  text[:release_end_search + 1]
                  + insertion
                  + text[release_end_search + 1:]
              )


          path.write_text(text)

          print(
              "Release signing configuration prepared."
          )
          PY


          grep -Fq \
            "signingConfig signingConfigs.release" \
            android/app/build.gradle

          grep -Fq \
            "rkms-release.keystore" \
            android/app/build.gradle

          echo "Release signing configuration: PASS"


      # ============================================================
      # 25. FINAL ANDROID VALUES
      # ============================================================

      - name: Verify final Android SDK values
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "android/variables.gradle"
          )

          text = path.read_text()

          def get_value(name):

              match = re.search(
                  rf'\b{name}\s*=\s*(\d+)',
                  text
              )

              if not match:
                  return None

              return int(
                  match.group(1)
              )

          compile_sdk = get_value(
              "compileSdkVersion"
          )

          target_sdk = get_value(
              "targetSdkVersion"
          )

          print(
              "compileSdkVersion:",
              compile_sdk
          )

          print(
              "targetSdkVersion:",
              target_sdk
          )

          if compile_sdk != 36:
              raise SystemExit(
                  "ERROR: compileSdkVersion is not 36"
              )

          if target_sdk != 36:
              raise SystemExit(
                  "ERROR: targetSdkVersion is not 36"
              )

          print(
              "Android SDK values: PASS"
          )
          PY


      # ============================================================
      # 26. GRADLE CLEAN
      # ============================================================

      - name: Gradle clean
        working-directory: ${{ env.SOURCE_DIR }}/android
        run: |
          ./gradlew \
            clean \
            --no-daemon


      # ============================================================
      # 27. BUILD APK + AAB
      # ============================================================

      - name: Build signed APK and AAB
        working-directory: ${{ env.SOURCE_DIR }}/android
        run: |
          set -euo pipefail

          ./gradlew \
            assembleRelease \
            bundleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "============================================================"
          echo "GRADLE APK + AAB BUILD: PASS"
          echo "============================================================"


      # ============================================================
      # 28. VERIFY APK
      # ============================================================

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          APK="android/app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          APKSIGNER="$SDK/build-tools/36.0.0/apksigner"

          test -x "$APKSIGNER"

          "$APKSIGNER" \
            verify \
            --verbose \
            "$APK"

          echo ""
          echo "============================================================"
          echo "SIGNED APK VERIFICATION: PASS"
          echo "============================================================"

          ls -lh "$APK"


      # ============================================================
      # 29. VERIFY AAB
      # ============================================================

      - name: Verify signed AAB
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          test -s "$AAB"

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB"

          echo ""
          echo "============================================================"
          echo "SIGNED AAB VERIFICATION: PASS"
          echo "============================================================"

          ls -lh "$AAB"


      # ============================================================
      # 30. PREPARE FINAL RELEASE
      # ============================================================

      - name: Prepare final release files
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          rm -rf release

          mkdir -p release

          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          cp \
            android/app/build/outputs/bundle/release/app-release.aab \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab

          sha256sum \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk \
            > release/RKMS_APK_SHA256.txt

          sha256sum \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab \
            > release/RKMS_AAB_SHA256.txt

          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk

          test -s \
            release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab

          echo ""
          echo "APK SHA256:"
          cat release/RKMS_APK_SHA256.txt

          echo ""
          echo "AAB SHA256:"
          cat release/RKMS_AAB_SHA256.txt


      # ============================================================
      # 31. FINAL RELEASE VERIFICATION
      # ============================================================

      - name: Final release verification
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          APK="release/RKMS_CONNECT_ANDROID16_API36_RELEASE.apk"
          AAB="release/RKMS_CONNECT_ANDROID16_API36_RELEASE.aab"

          test -s "$APK"
          test -s "$AAB"

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          "$SDK/build-tools/36.0.0/apksigner" \
            verify \
            "$APK"


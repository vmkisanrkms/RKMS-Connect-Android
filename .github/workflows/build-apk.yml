name: Build RKMS Connect APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check V4 Android ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="RKMS_Connect_Android_WEBSITE_SYNC_FCM_V4_FINAL.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found in repository."
            echo ""
            echo "Repository files:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "======================================"
          echo "Found Android source ZIP:"
          ls -lh "$ZIP_FILE"
          echo "======================================"

      - name: Extract V4 Android project
        shell: bash
        run: |
          set -e

          rm -rf build-project
          mkdir -p build-project

          unzip -q \
            "RKMS_Connect_Android_WEBSITE_SYNC_FCM_V4_FINAL.zip" \
            -d build-project

          echo "======================================"
          echo "Extracted project:"
          echo "======================================"

          find build-project/rkms_android -maxdepth 3 -type f -print

      - name: Verify Android project
        id: android_project
        shell: bash
        run: |
          set -e

          PROJECT_DIR="build-project/rkms_android"

          echo "Checking project: $PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/build.gradle" ]; then
            echo "ERROR: root build.gradle not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/google-services.json" ]; then
            echo "ERROR: app/google-services.json not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/java/org/rkms/connect/MainActivity.java" ]; then
            echo "ERROR: MainActivity.java not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/assets/index.html" ]; then
            echo "ERROR: assets/index.html not found."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo ""
          echo "======================================"
          echo "ANDROID PROJECT VERIFIED"
          echo "======================================"
          echo "Project: $PROJECT_DIR"
          echo ""

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Gradle and Android files
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "JAVA VERSION"
          echo "======================================"
          java -version

          echo ""
          echo "======================================"
          echo "GRADLE VERSION"
          echo "======================================"
          gradle --version

          echo ""
          echo "======================================"
          echo "ROOT build.gradle"
          echo "======================================"
          cat build.gradle

          echo ""
          echo "======================================"
          echo "settings.gradle"
          echo "======================================"
          cat settings.gradle

          echo ""
          echo "======================================"
          echo "APP build.gradle"
          echo "======================================"
          cat app/build.gradle

          echo ""
          echo "======================================"
          echo "GOOGLE SERVICES"
          echo "======================================"
          ls -lh app/google-services.json

          echo ""
          echo "======================================"
          echo "MAIN ACTIVITY"
          echo "======================================"
          grep -n "android_asset/www/index.html" \
            app/src/main/java/org/rkms/connect/MainActivity.java

          echo ""
          echo "======================================"
          echo "FCM FILES"
          echo "======================================"
          find app/src/main/java/org/rkms/connect \
            -maxdepth 1 \
            -type f \
            -name '*FCM*' \
            -o -name '*Notification*' \
            -print

          echo ""
          echo "======================================"
          echo "WEB ASSETS"
          echo "======================================"
          find app/src/main/assets -maxdepth 2 -type f | sort | head -100

      - name: Verify website bundle inside APK source
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "Checking bundled website..."

          if [ ! -d "app/src/main/assets/www" ]; then
            echo "ERROR: app/src/main/assets/www directory not found."
            exit 1
          fi

          if [ ! -f "app/src/main/assets/www/index.html" ]; then
            echo "ERROR: bundled www/index.html not found."
            exit 1
          fi

          echo ""
          echo "Bundled website files:"
          find app/src/main/assets/www -maxdepth 2 -type f | sort | head -150

          echo ""
          echo "Website bundle size:"
          du -sh app/src/main/assets/www

          echo ""
          echo "Website index found:"
          ls -lh app/src/main/assets/www/index.html

      - name: Clean previous build
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          gradle --no-daemon clean

      - name: Build debug APK
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING RKMS CONNECT V4 FCM APK"
          echo "======================================"

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug

      - name: Verify generated APK
        id: apk
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          APK_DIR="app/build/outputs/apk/debug"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: APK output directory not found."
            find app/build/outputs -type f -print || true
            exit 1
          fi

          APK_FILE="$(find "$APK_DIR" -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            find app/build/outputs -type f -print || true
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "APK GENERATED SUCCESSFULLY"
          echo "======================================"
          ls -lh "$APK_FILE"

          echo "apk_path=$APK_FILE" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          SOURCE_APK="${{ steps.apk.outputs.apk_path }}"
          FINAL_APK="RKMS-Connect-WEBSITE-SYNC-FCM-V4.apk"

          cp "$SOURCE_APK" "$FINAL_APK"

          echo "======================================"
          echo "FINAL APK"
          echo "======================================"
          ls -lh "$FINAL_APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-WEBSITE-SYNC-FCM-V4
          path: ${{ steps.android_project.outputs.project_dir }}/RKMS-Connect-WEBSITE-SYNC-FCM-V4.apk
          if-no-files-found: error
          retention-days: 30

name: Build RKMS Connect APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android project ZIP
        id: find_zip
        shell: bash
        run: |
          echo "Files in repository:"
          find . -maxdepth 3 -type f -print | sort

          ZIP=""

          ZIP=$(find . -maxdepth 2 -type f \
            \( -iname "*FCM*FINAL*V9*.zip" -o -iname "*FCM*FINAL*.zip" \) \
            -print -quit)

          if [ -z "$ZIP" ]; then
            ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" -print -quit)
          fi

          if [ -z "$ZIP" ]; then
            echo "ERROR: No Android ZIP file found in repository."
            exit 1
          fi

          echo "Android ZIP found:"
          echo "$ZIP"

          echo "zip_path=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract Android project
        run: |
          rm -rf build-project
          mkdir -p build-project

          unzip -q "${{ steps.find_zip.outputs.zip_path }}" -d build-project

          echo "Extracted project files:"
          find build-project -maxdepth 4 -type f | sort | head -300

      - name: Find Android project
        id: find_project
        shell: bash
        run: |
          PROJECT_DIR=""

          PROJECT_DIR=$(find build-project -type f -name "settings.gradle" -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find build-project -type f -name "settings.gradle.kts" -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project was not found."
            echo "Searching for Gradle files:"
            find build-project -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \) \
              -print
            exit 1
          fi

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Find generated APK
        id: find_apk
        shell: bash
        run: |
          APK=$(find "${{ steps.find_project.outputs.project_dir }}" \
            -type f -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated:"
          echo "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          cp "${{ steps.find_apk.outputs.apk_path }}" \
             "RKMS-Connect-FCM-FINAL-V9.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-FCM-FINAL-V9
          path: RKMS-Connect-FCM-FINAL-V9.apk
          if-no-files-found: error

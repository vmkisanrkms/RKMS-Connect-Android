name: Build RKMS Connect APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify V3 source ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="RKMS_Connect_ANDROID_FROM_CURRENT_WEBSITE_V3_CLEAN.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found."
            echo ""
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          echo "Source ZIP found:"
          ls -lh "$ZIP_FILE"

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf build-project
          mkdir -p build-project

          unzip -q \
            "RKMS_Connect_ANDROID_FROM_CURRENT_WEBSITE_V3_CLEAN.zip" \
            -d build-project

          if [ ! -d "build-project/rkms_android" ]; then
            echo "ERROR: rkms_android project not found."
            find build-project -maxdepth 3 -type f -print
            exit 1
          fi

      - name: Verify Android project
        id: android
        shell: bash
        run: |
          set -e

          PROJECT_DIR="build-project/rkms_android"

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/google-services.json"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          test -f "$PROJECT_DIR/app/src/main/java/org/rkms/connect/MainActivity.java"
          test -f "$PROJECT_DIR/app/src/main/java/org/rkms/connect/RKMSFirebaseMessagingService.java"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Android project verified."

      - name: Verify current Website
        working-directory: ${{ steps.android.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          WEB="app/src/main/assets/www"

          test -f "$WEB/index.html"
          test -f "$WEB/app.js"
          test -f "$WEB/styles.css"
          test -f "$WEB/config.js"

          echo "Current Website bundle verified."

          echo ""
          echo "Website files:"
          find "$WEB" -type f -print | sort

          echo ""
          echo "Website size:"
          du -sh "$WEB"

      - name: Verify WebView
        working-directory: ${{ steps.android.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          MAIN="app/src/main/java/org/rkms/connect/MainActivity.java"

          test -f "$MAIN"

          grep -q "android_asset/www/index.html" "$MAIN"

          echo "WebView target verified."

      - name: Verify no old native Chat or Appointment code
        working-directory: ${{ steps.android.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          JAVA_DIR="app/src/main/java"

          if grep -R -n -E \
            "rkms_chat_threads|rkms_chat_messages|rkms_chat_open|renderChat|renderAppointmentLetter|appointment-member-photo" \
            "$JAVA_DIR" \
            --include="*.java"; then

            echo ""
            echo "ERROR: Old native Chat/Appointment implementation detected."
            exit 1
          fi

          echo "No old native Chat/Appointment implementation found."

      - name: Verify no extra JavaScript outside Website
        working-directory: ${{ steps.android.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          EXTRA_JS="$(find app/src/main -type f -name "*.js" \
            ! -path "app/src/main/assets/www/*" -print)"

          if [ -n "$EXTRA_JS" ]; then
            echo "ERROR: Extra JavaScript files found outside current Website:"
            echo "$EXTRA_JS"
            exit 1
          fi

          echo "No extra JavaScript outside Website."

      - name: Verify FCM
        working-directory: ${{ steps.android.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          test -f app/google-services.json

          grep -q "RKMSFirebaseMessagingService" \
            app/src/main/AndroidManifest.xml

          grep -q "FirebaseMessagingService" \
            app/src/main/java/org/rkms/connect/RKMSFirebaseMessagingService.java

          grep -q "firebase-messaging" \
            app/build.gradle

          grep -q "POST_NOTIFICATIONS" \
            app/src/main/AndroidManifest.xml

          echo "FCM verification passed."

      - name: Verify Zoom
        working-directory: ${{ steps.android.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          MAIN="app/src/main/java/org/rkms/connect/MainActivity.java"

          grep -q "setSupportZoom(true)" "$MAIN"
          grep -q "setBuiltInZoomControls(true)" "$MAIN"

          echo "Zoom verification passed."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Show build environment
        run: |
          echo "===== JAVA ====="
          java -version

          echo ""
          echo "===== GRADLE ====="
          gradle --version

      - name: Clean Android project
        working-directory: ${{ steps.android.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            clean

      - name: Build Debug APK
        working-directory: ${{ steps.android.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug

      - name: Find generated APK
        id: apk
        working-directory: ${{ steps.android.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          APK_FILE="$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."

            echo ""
            echo "Build output:"
            find app/build/outputs -type f -print || true

            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK_FILE"

          echo "apk_path=$APK_FILE" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        working-directory: ${{ steps.android.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          cp \
            "${{ steps.apk.outputs.apk_path }}" \
            "RKMS-Connect-CURRENT-WEBSITE-FCM.apk"

          echo ""
          echo "Final APK:"
          ls -lh "RKMS-Connect-CURRENT-WEBSITE-FCM.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-CURRENT-WEBSITE-FCM
          path: ${{ steps.android.outputs.project_dir }}/RKMS-Connect-CURRENT-WEBSITE-FCM.apk
          if-no-files-found: error
          retention-days: 30

name: Build RKMS Connect APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find fixed Android ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="RKMS_Connect_Android_FCM_FINAL_V9_FIXED.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found in repository."
            echo "Files in repository:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "Found: $ZIP_FILE"

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf build-project
          mkdir -p build-project

          unzip -q "RKMS_Connect_Android_FCM_FINAL_V9_FIXED.zip" \
            -d build-project

          echo "Extracted files:"
          find build-project -maxdepth 3 -type f -print

      - name: Locate Android project
        id: android_project
        shell: bash
        run: |
          set -e

          PROJECT_DIR="build-project/rkms_android"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: settings.gradle not found."
            find build-project -name settings.gradle -print
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Android Gradle files
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "===== settings.gradle ====="
          cat settings.gradle

          echo "===== root build.gradle ====="
          cat build.gradle

          echo "===== app/build.gradle ====="
          cat app/build.gradle

          echo "===== google-services.json ====="
          if [ -f app/google-services.json ]; then
            echo "google-services.json found."
          else
            echo "ERROR: app/google-services.json not found."
            exit 1
          fi

      - name: Build debug APK
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          gradle --no-daemon --stacktrace assembleDebug

      - name: Find generated APK
        id: apk
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          APK_FILE="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            find app/build/outputs -type f -print || true
            exit 1
          fi

          echo "APK found: $APK_FILE"
          echo "apk_path=$APK_FILE" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          cp "${{ steps.apk.outputs.apk_path }}" \
             "RKMS-Connect-FCM-FINAL-V9.apk"

          ls -lh "RKMS-Connect-FCM-FINAL-V9.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-FCM-FINAL-V9
          path: ${{ steps.android_project.outputs.project_dir }}/RKMS-Connect-FCM-FINAL-V9.apk
          if-no-files-found: error

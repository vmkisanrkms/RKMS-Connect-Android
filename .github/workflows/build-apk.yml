name: Build RKMS Connect APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p build-project
          unzip -q RKMS_Connect_Android_New_Project_With_Logo.zip -d build-project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project
        shell: bash
        run: |
          SETTINGS=$(find "$GITHUB_WORKSPACE/build-project" -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project settings.gradle not found."
            echo "Files found in extracted project:"
            find "$GITHUB_WORKSPACE/build-project" -maxdepth 5 -type f | head -200
            exit 1
          fi

          ANDROID_DIR=$(dirname "$SETTINGS")

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Android project found at:"
          echo "$ANDROID_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug
        working-directory: ${{ env.ANDROID_DIR }}

      - name: Find generated APK
        shell: bash
        run: |
          APK=$(find "$ANDROID_DIR" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/RKMS-Connect-APK.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-APK
          path: RKMS-Connect-APK.apk
          if-no-files-found: error

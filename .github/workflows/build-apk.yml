name: Build RKMS Connect APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Android ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="RKMS_Connect_Android_FCM_FINAL_V9_SPLASH_FINAL_DOWNLOAD.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found in repository."
            echo "ZIP files currently in repository:"
            find . -maxdepth 2 -type f -iname "*.zip" -print
            exit 1
          fi

          echo "Found Android source:"
          echo "$ZIP_FILE"

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf build-project
          mkdir -p build-project

          unzip -q \
            "RKMS_Connect_Android_FCM_FINAL_V9_SPLASH_FINAL_DOWNLOAD.zip" \
            -d build-project

          echo "Android project files:"
          find build-project -maxdepth 4 -type f -print | sort

      - name: Locate Android project
        id: android_project
        shell: bash
        run: |
          set -e

          PROJECT_DIR="build-project/rkms_android"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: settings.gradle not found."
            find build-project \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Android project found:"
          echo "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android project
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/google-services.json

          echo "Android project verification PASSED."

      - name: Build debug APK
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleDebug

      - name: Find generated APK
        id: apk
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          APK_FILE="$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."

            echo "Available build output:"
            find app/build/outputs -type f -print 2>/dev/null || true

            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK_FILE"

          echo "apk_path=$APK_FILE" >> "$GITHUB_OUTPUT"

      - name: Prepare final APK
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          cp \
            "${{ steps.apk.outputs.apk_path }}" \
            "RKMS-Connect-FCM-FINAL-V9.apk"

          echo "Final APK:"
          ls -lh "RKMS-Connect-FCM-FINAL-V9.apk"

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-FCM-FINAL-V9
          path: ${{ steps.android_project.outputs.project_dir }}/RKMS-Connect-FCM-FINAL-V9.apk
          if-no-files-found: error

name: Build RKMS Connect APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p build-project
          unzip -q RKMS_Connect_Cloud_Build_v2.zip -d build-project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project
        run: |
          echo "Project files:"
          find build-project -maxdepth 4 -type f \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) -print

      - name: Make Gradle executable
        run: |
          chmod +x build-project/android-app/gradlew

      - name: Build Debug APK
        working-directory: build-project/android-app
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-APK
          path: build-project/android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

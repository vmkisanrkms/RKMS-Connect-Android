name: RKMS Connect Android Build

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build RKMS Connect
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # JAVA 17
      # =========================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # =========================================================
      # ANDROID SDK
      # =========================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true


      # =========================================================
      # AUTOMATIC ANDROID PROJECT FINDER
      #
      # It searches:
      # 1. Existing folders
      # 2. ZIP files anywhere in repository
      # 3. settings.gradle + app/build.gradle
      # =========================================================

      - name: Find Android project automatically
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "RKMS ANDROID PROJECT AUTO DETECTION"
          echo "=============================================="

          ROOT="$RUNNER_TEMP/rkms-build"
          EXTRACT="$ROOT/extracted"

          rm -rf "$ROOT"
          mkdir -p "$EXTRACT"

          PROJECT=""

          # -------------------------------------------------------
          # Function to verify Android Gradle project
          # -------------------------------------------------------

          check_project() {
            local DIR="$1"

            if [ -f "$DIR/settings.gradle" ] || \
               [ -f "$DIR/settings.gradle.kts" ]; then

              if [ -f "$DIR/app/build.gradle" ] || \
                 [ -f "$DIR/app/build.gradle.kts" ]; then

                PROJECT="$DIR"
                return 0
              fi

            fi

            return 1
          }


          # -------------------------------------------------------
          # A. Search repository directly
          # -------------------------------------------------------

          echo ""
          echo "Searching repository..."

          while IFS= read -r -d '' SETTINGS; do

            DIR="$(dirname "$SETTINGS")"

            if check_project "$DIR"; then
              echo "Android project found directly:"
              echo "$DIR"
              break
            fi

          done < <(
            find . \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -not -path "./.git/*" \
              -print0
          )


          # -------------------------------------------------------
          # B. Search ZIP files
          # -------------------------------------------------------

          if [ -z "$PROJECT" ]; then

            echo ""
            echo "No direct project found."
            echo "Searching ZIP files..."

            COUNT=0

            while IFS= read -r -d '' ZIP; do

              COUNT=$((COUNT + 1))

              echo ""
              echo "ZIP found:"
              echo "$ZIP"

              DEST="$EXTRACT/zip_$COUNT"

              mkdir -p "$DEST"

              if ! unzip -q "$ZIP" -d "$DEST"; then
                echo "WARNING: ZIP could not be extracted."
                rm -rf "$DEST"
                continue
              fi


              while IFS= read -r -d '' SETTINGS; do

                DIR="$(dirname "$SETTINGS")"

                if check_project "$DIR"; then
                  echo ""
                  echo "Android project found inside ZIP:"
                  echo "$DIR"
                  break 2
                fi

              done < <(
                find "$DEST" \
                  -type f \
                  \( \
                    -name "settings.gradle" \
                    -o \
                    -name "settings.gradle.kts" \
                  \) \
                  -print0
              )

            done < <(
              find . \
                -type f \
                -iname "*.zip" \
                -not -path "./.git/*" \
                -print0
            )

          fi


          # -------------------------------------------------------
          # C. Final check
          # -------------------------------------------------------

          if [ -z "$PROJECT" ]; then

            echo ""
            echo "=============================================="
            echo "ERROR: ANDROID PROJECT NOT FOUND"
            echo "=============================================="

            echo ""
            echo "Repository files:"
            find . \
              -not -path "./.git/*" \
              -maxdepth 7 \
              -print \
              | sort

            exit 1
          fi


          PROJECT="$(realpath "$PROJECT")"

          echo ""
          echo "=============================================="
          echo "ANDROID PROJECT FOUND"
          echo "=============================================="
          echo "$PROJECT"
          echo "=============================================="

          echo "ANDROID_PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"


      # =========================================================
      # VERIFY PROJECT
      # =========================================================

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          PROJECT="$ANDROID_PROJECT_DIR"

          test -f "$PROJECT/settings.gradle" || \
          test -f "$PROJECT/settings.gradle.kts"

          test -f "$PROJECT/app/build.gradle" || \
          test -f "$PROJECT/app/build.gradle.kts"

          test -f "$PROJECT/app/src/main/AndroidManifest.xml"

          echo "Android project verification: PASS"


      # =========================================================
      # VERIFY FIREBASE
      # =========================================================

      - name: Verify Firebase
        shell: bash
        run: |
          set -e

          FILE="$ANDROID_PROJECT_DIR/app/google-services.json"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: google-services.json not found."
            exit 1
          fi

          echo "Firebase configuration: PASS"


      # =========================================================
      # VERIFY RKMS WEBSITE
      # =========================================================

      - name: Verify RKMS website
        shell: bash
        run: |
          set -e

          WWW="$ANDROID_PROJECT_DIR/app/src/main/assets/www"

          test -f "$WWW/index.html"
          test -f "$WWW/app.js"
          test -f "$WWW/styles.css"
          test -f "$WWW/config.js"

          echo "RKMS website: PASS"


      # =========================================================
      # VERIFY NOTIFICATION / FCM SOURCES
      # =========================================================

      - name: Verify FCM sources
        shell: bash
        run: |
          set -e

          BASE="$ANDROID_PROJECT_DIR/app/src/main/java/org/rkms/connect"

          test -f "$BASE/FCMTokenRegistrar.java"
          test -f "$BASE/RKMSFirebaseMessagingService.java"
          test -f "$BASE/NotificationHelper.java"

          echo "FCM source files: PASS"


      # =========================================================
      # VERIFY BUILDCONFIG
      # =========================================================

      - name: Verify BuildConfig
        shell: bash
        run: |
          set -e

          FILE="$ANDROID_PROJECT_DIR/app/build.gradle"

          if ! grep -q "buildConfig[[:space:]]\+true" "$FILE"; then

            echo "ERROR: buildConfig true is missing."

            echo ""
            echo "Expected:"
            echo "buildFeatures {"
            echo "    buildConfig true"
            echo "}"

            exit 1
          fi

          echo "BuildConfig: PASS"


      # =========================================================
      # GRADLE
      # =========================================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"


      # =========================================================
      # BUILD ENVIRONMENT
      # =========================================================

      - name: Show build environment
        shell: bash
        run: |
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Android SDK:"
          sdkmanager --list_installed | \
            grep -E \
            "platforms;android-35|build-tools;35.0.0|platform-tools" \
            || true


      # =========================================================
      # GRADLE VALIDATION
      # =========================================================

      - name: Validate Gradle project
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          gradle tasks \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # =========================================================
      # BUILD DEBUG APK
      # =========================================================

      - name: Build Debug APK
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo ""
          echo "=============================================="
          echo "BUILDING RKMS CONNECT DEBUG APK"
          echo "=============================================="

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # =========================================================
      # AUTOMATIC APK FINDER
      # =========================================================

      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "Searching generated APK..."

          APK="$(
            find "$ANDROID_PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -path "*/build/outputs/*" \
              -print \
              | head -n 1
          )"

          if [ -z "$APK" ]; then

            echo ""
            echo "ERROR: APK was not generated."

            echo ""
            echo "APK files found:"
            find "$ANDROID_PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          APK="$(realpath "$APK")"

          echo ""
          echo "=============================================="
          echo "APK FOUND"
          echo "=============================================="
          echo "$APK"

          ls -lh "$APK"

          echo "RKMS_APK=$APK" >> "$GITHUB_ENV"


      # =========================================================
      # UPLOAD APK
      # =========================================================

      - name: Upload RKMS APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-Debug-APK
          path: ${{ env.RKMS_APK }}
          if-no-files-found: error
          retention-days: 30


      # =========================================================
      # FINAL
      # =========================================================

      - name: Final build summary
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo "RKMS CONNECT BUILD SUCCESS"
          echo "=============================================="
          echo ""
          echo "Project detection : PASS"
          echo "JDK 17            : PASS"
          echo "Android SDK 35    : PASS"
          echo "Firebase          : PASS"
          echo "Website           : PASS"
          echo "FCM sources       : PASS"
          echo "BuildConfig       : PASS"
          echo "Gradle validation : PASS"
          echo "Debug APK         : PASS"
          echo "APK artifact      : UPLOADED"
          echo ""
          echo "=============================================="

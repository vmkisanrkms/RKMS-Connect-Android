name: Build RKMS Connect APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="RKMS-Connect-WEBSITE-EXACT-FCM-GITHUB.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found."
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          echo "Found:"
          ls -lh "$ZIP_FILE"

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf build-project
          mkdir -p build-project

          unzip -q \
            "RKMS-Connect-WEBSITE-EXACT-FCM-GITHUB.zip" \
            -d build-project

          test -d build-project/rkms_android

      - name: Verify Android project
        id: android
        shell: bash
        run: |
          set -e

          PROJECT_DIR="build-project/rkms_android"

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/google-services.json"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/assets/www/index.html"
          test -f "$PROJECT_DIR/app/src/main/assets/www/app.js"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Android project verified."

      - name: Verify website files
        working-directory: ${{ steps.android.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "Website files:"
          find app/src/main/assets/www \
            -type f \
            -print | sort

          echo ""
          echo "Website size:"
          du -sh app/src/main/assets/www

          test -f app/src/main/assets/www/index.html
          test -f app/src/main/assets/www/app.js
          test -f app/src/main/assets/www/styles.css
          test -f app/src/main/assets/www/config.js

      - name: Verify WebView target
        working-directory: ${{ steps.android.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          MAIN="app/src/main/java/org/rkms/connect/MainActivity.java"

          test -f "$MAIN"

          grep -q "android_asset/www/index.html" "$MAIN"

          echo "WebView opens the website bundle."

      - name: Verify FCM
        working-directory: ${{ steps.android.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          test -f app/google-services.json

          if ! grep -R -q "FirebaseMessagingService" \
            app/src/main/java; then
            echo "ERROR: FirebaseMessagingService missing."
            exit 1
          fi

          if ! grep -q "POST_NOTIFICATIONS" \
            app/src/main/AndroidManifest.xml; then
            echo "ERROR: Notification permission missing."
            exit 1
          fi

          echo "FCM verification passed."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Show environment
        run: |
          java -version
          gradle --version

      - name: Clean project
        working-directory: ${{ steps.android.outputs.project_dir }}
        run: |
          gradle --no-daemon clean

      - name: Build APK
        working-directory: ${{ steps.android.outputs.project_dir }}
        run: |
          set -e

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug

      - name: Find APK
        id: apk
        working-directory: ${{ steps.android.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          APK="$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            find app/build/outputs -type f -print || true
            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        working-directory: ${{ steps.android.outputs.project_dir }}
        run: |
          set -e

          cp \
            "${{ steps.apk.outputs.apk_path }}" \
            "RKMS-Connect-Website-Sync-FCM-Debug.apk"

          ls -lh "RKMS-Connect-Website-Sync-FCM-Debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-Website-Sync-FCM-Debug
          path: ${{ steps.android.outputs.project_dir }}/RKMS-Connect-Website-Sync-FCM-Debug.apk
          if-no-files-found: error
          retention-days: 30

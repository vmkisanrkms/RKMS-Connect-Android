name: Build RKMS Connect

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:

    name: Build RKMS Connect
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK 35
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true


      # ========================================================
      # FIND ANDROID PROJECT
      # ========================================================

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "Searching repository..."

          PROJECT=""

          for SETTINGS in $(git ls-files | grep -E '(^|/)settings\.gradle(\.kts)?$' || true); do

            DIR="$(dirname "$SETTINGS")"

            if [ -f "$DIR/app/build.gradle" ] || \
               [ -f "$DIR/app/build.gradle.kts" ]; then

              PROJECT="$DIR"
              break

            fi

          done


          if [ -z "$PROJECT" ]; then

            echo "No direct Android project found."

            echo "Searching ZIP files..."

            ZIP=""

            for FILE in $(git ls-files | grep -Ei '\.zip$' || true); do

              if echo "$FILE" | grep -q "V7_PROFESSIONAL_RELEASE_READY_SOURCE"; then
                ZIP="$FILE"
                break
              fi

              if [ -z "$ZIP" ]; then
                ZIP="$FILE"
              fi

            done


            if [ -z "$ZIP" ]; then

              echo "ERROR: No Android project or ZIP source found."

              echo ""
              echo "Repository files:"
              git ls-files

              exit 1

            fi


            echo "Using ZIP:"
            echo "$ZIP"


            rm -rf "$RUNNER_TEMP/rkms-source"
            mkdir -p "$RUNNER_TEMP/rkms-source"

            unzip -q "$ZIP" -d "$RUNNER_TEMP/rkms-source"


            for SETTINGS in \
              $(git -C "$RUNNER_TEMP/rkms-source" ls-files 2>/dev/null | \
                grep -E '(^|/)settings\.gradle(\.kts)?$' || true); do

              DIR="$(dirname "$SETTINGS")"

              if [ -f "$RUNNER_TEMP/rkms-source/$DIR/app/build.gradle" ] || \
                 [ -f "$RUNNER_TEMP/rkms-source/$DIR/app/build.gradle.kts" ]; then

                PROJECT="$RUNNER_TEMP/rkms-source/$DIR"
                break

              fi

            done


            if [ -z "$PROJECT" ]; then

              SETTINGS_FILE="$(find "$RUNNER_TEMP/rkms-source" -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)"

              if [ -n "$SETTINGS_FILE" ]; then

                DIR="$(dirname "$SETTINGS_FILE")"

                if [ -f "$DIR/app/build.gradle" ] || \
                   [ -f "$DIR/app/build.gradle.kts" ]; then

                  PROJECT="$DIR"

                fi

              fi

            fi

          fi


          if [ -z "$PROJECT" ]; then

            echo "ERROR: Android Gradle project NOT FOUND."

            echo ""
            echo "Repository files:"
            git ls-files

            exit 1

          fi


          PROJECT="$(realpath "$PROJECT")"

          echo ""
          echo "=========================================="
          echo "ANDROID PROJECT FOUND"
          echo "$PROJECT"
          echo "=========================================="
          echo ""

          echo "ANDROID_PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"


      # ========================================================
      # VERIFY PROJECT
      # ========================================================

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          PROJECT="$ANDROID_PROJECT_DIR"

          if [ ! -f "$PROJECT/settings.gradle" ] && \
             [ ! -f "$PROJECT/settings.gradle.kts" ]; then

            echo "ERROR: settings.gradle not found."
            exit 1

          fi


          if [ ! -f "$PROJECT/app/build.gradle" ] && \
             [ ! -f "$PROJECT/app/build.gradle.kts" ]; then

            echo "ERROR: app/build.gradle not found."
            exit 1

          fi


          if [ ! -f "$PROJECT/app/src/main/AndroidManifest.xml" ]; then

            echo "ERROR: AndroidManifest.xml not found."
            exit 1

          fi


          echo "Android project verification: PASS"


      # ========================================================
      # VERIFY FIREBASE
      # ========================================================

      - name: Verify Firebase
        shell: bash
        run: |
          set -e

          PROJECT="$ANDROID_PROJECT_DIR"

          if [ -f "$PROJECT/app/google-services.json" ]; then

            echo "google-services.json: PASS"

          else

            echo "ERROR: google-services.json not found."
            exit 1

          fi


      # ========================================================
      # VERIFY WEBSITE
      # ========================================================

      - name: Verify bundled website
        shell: bash
        run: |
          set -e

          PROJECT="$ANDROID_PROJECT_DIR"

          INDEX="$PROJECT/app/src/main/assets/www/index.html"

          if [ ! -f "$INDEX" ]; then

            echo "ERROR: RKMS website index.html not found:"
            echo "$INDEX"

            exit 1

          fi

          echo "Bundled RKMS website: PASS"


      # ========================================================
      # GRADLE
      # ========================================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4


      # ========================================================
      # GRADLE VALIDATION
      # ========================================================

      - name: Validate Gradle project
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        run: |
          set -e

          if [ -f "./gradlew" ]; then

            chmod +x ./gradlew

            ./gradlew tasks \
              --no-daemon \
              --stacktrace

          else

            gradle tasks \
              --no-daemon \
              --stacktrace

          fi


      # ========================================================
      # BUILD DEBUG APK
      # ========================================================

      - name: Build Debug APK
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        run: |
          set -e

          if [ -f "./gradlew" ]; then

            chmod +x ./gradlew

            ./gradlew clean assembleDebug \
              --no-daemon \
              --stacktrace

          else

            gradle clean assembleDebug \
              --no-daemon \
              --stacktrace

          fi


      # ========================================================
      # VERIFY APK
      # ========================================================

      - name: Verify Debug APK
        shell: bash
        run: |
          set -e

          APK="$ANDROID_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then

            echo "ERROR: Debug APK was not created."
            exit 1

          fi

          echo ""
          echo "=========================================="
          echo "DEBUG APK CREATED"
          echo "=========================================="

          ls -lh "$APK"


      # ========================================================
      # UPLOAD APK
      # ========================================================

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-Debug-APK
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30


      # ========================================================
      # FINAL
      # ========================================================

      - name: Build summary
        run: |
          echo ""
          echo "=========================================="
          echo "RKMS CONNECT DEBUG BUILD: SUCCESS"
          echo "=========================================="

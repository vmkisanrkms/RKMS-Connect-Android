name: Build RKMS Connect APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check new Android ZIP
        run: |
          test -f "RKMS_Connect_Android_FCM_FINAL_V9.zip"
          echo "New Android project ZIP found."

      - name: Extract Android project
        run: |
          rm -rf build-project
          mkdir -p build-project
          unzip -q "RKMS_Connect_Android_FCM_FINAL_V9.zip" -d build-project

      - name: Find Android project
        id: find_project
        shell: bash
        run: |
          PROJECT_DIR=$(find build-project -type f -name "settings.gradle" -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find build-project -type f -name "settings.gradle.kts" -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            find build-project -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Find generated APK
        id: find_apk
        shell: bash
        run: |
          APK=$(find "${{ steps.find_project.outputs.project_dir }}" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found: $APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        shell: bash
        run: |
          cp "${{ steps.find_apk.outputs.apk_path }}" "RKMS-Connect-FCM-FINAL-V9.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-FCM-FINAL-V9
          path: RKMS-Connect-FCM-FINAL-V9.apk
          if-no-files-found: error

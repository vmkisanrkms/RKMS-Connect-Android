name: RKMS Connect Android Build

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:

  build:

    name: Build RKMS Connect

    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:

      # ========================================================
      # 1. CHECKOUT
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ========================================================
      # 2. JAVA 17
      # ========================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ========================================================
      # 3. ANDROID SDK
      # ========================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK 35
        run: |
          set -e

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true


      # ========================================================
      # 4. LOCATE EXACT RKMS PROJECT
      #
      # ZIP structure:
      #
      # rkms_android/
      # ├── settings.gradle
      # ├── build.gradle
      # └── app/
      #     └── build.gradle
      #
      # ========================================================

      - name: Locate RKMS Android project
        run: |
          set -e

          PROJECT="rkms_android"

          if [ ! -f "$PROJECT/settings.gradle" ]; then
            echo "ERROR: rkms_android/settings.gradle not found."
            exit 1
          fi

          if [ ! -f "$PROJECT/build.gradle" ]; then
            echo "ERROR: rkms_android/build.gradle not found."
            exit 1
          fi

          if [ ! -f "$PROJECT/app/build.gradle" ]; then
            echo "ERROR: rkms_android/app/build.gradle not found."
            exit 1
          fi

          echo "ANDROID_PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo "RKMS ANDROID PROJECT FOUND"
          echo "=========================================="
          echo "$PROJECT"


      # ========================================================
      # 5. VERIFY GOOGLE SERVICES
      # ========================================================

      - name: Verify Firebase configuration
        run: |
          set -e

          FILE="$ANDROID_PROJECT_DIR/app/google-services.json"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: google-services.json not found."
            exit 1
          fi

          echo "google-services.json: PASS"


      # ========================================================
      # 6. VERIFY ANDROID MANIFEST
      # ========================================================

      - name: Verify Android Manifest
        run: |
          set -e

          FILE="$ANDROID_PROJECT_DIR/app/src/main/AndroidManifest.xml"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          echo "AndroidManifest.xml: PASS"


      # ========================================================
      # 7. VERIFY RKMS WEBSITE
      # ========================================================

      - name: Verify bundled RKMS website
        run: |
          set -e

          WWW="$ANDROID_PROJECT_DIR/app/src/main/assets/www"

          test -f "$WWW/index.html"
          test -f "$WWW/app.js"
          test -f "$WWW/styles.css"
          test -f "$WWW/config.js"
          test -f "$WWW/manifest.webmanifest"

          echo "RKMS bundled website: PASS"


      # ========================================================
      # 8. VERIFY BUILDCONFIG
      # ========================================================

      - name: Verify BuildConfig
        run: |
          set -e

          FILE="$ANDROID_PROJECT_DIR/app/build.gradle"

          if ! grep -q "buildConfig true" "$FILE"; then
            echo "ERROR: buildConfig true is missing."
            exit 1
          fi

          echo "BuildConfig: PASS"


      # ========================================================
      # 9. VERIFY FCM
      # ========================================================

      - name: Verify FCM source
        run: |
          set -e

          BASE="$ANDROID_PROJECT_DIR/app/src/main/java/org/rkms/connect"

          test -f "$BASE/FCMTokenRegistrar.java"
          test -f "$BASE/RKMSFirebaseMessagingService.java"
          test -f "$BASE/NotificationHelper.java"

          echo "FCM source files: PASS"


      # ========================================================
      # 10. SET UP GRADLE
      # ========================================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'


      # ========================================================
      # 11. SHOW ENVIRONMENT
      # ========================================================

      - name: Show build environment
        run: |
          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Android SDK:"
          sdkmanager --list_installed | grep -E \
            'platforms;android-35|build-tools;35.0.0|platform-tools' \
            || true


      # ========================================================
      # 12. VALIDATE GRADLE
      # ========================================================

      - name: Validate Gradle project
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        run: |
          set -e

          gradle tasks \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # ========================================================
      # 13. BUILD DEBUG APK
      # ========================================================

      - name: Build Debug APK
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        run: |
          set -e

          echo ""
          echo "=========================================="
          echo "BUILDING RKMS CONNECT DEBUG APK"
          echo "=========================================="
          echo ""

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # ========================================================
      # 14. VERIFY APK
      # ========================================================

      - name: Verify Debug APK
        run: |
          set -e

          APK="$ANDROID_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Debug APK was not created."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "DEBUG APK CREATED SUCCESSFULLY"
          echo "=========================================="
          echo ""

          ls -lh "$APK"


      # ========================================================
      # 15. UPLOAD APK
      # ========================================================

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-Debug-APK
          path: rkms_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30


      # ========================================================
      # 16. FINAL SUMMARY
      # ========================================================

      - name: Final build summary
        run: |
          echo ""
          echo "=========================================="
          echo "RKMS CONNECT DEBUG BUILD SUCCESS"
          echo "=========================================="
          echo ""
          echo "Project             : PASS"
          echo "JDK 17              : PASS"
          echo "Android SDK 35      : PASS"
          echo "Firebase            : PASS"
          echo "RKMS Website        : PASS"
          echo "BuildConfig         : PASS"
          echo "FCM Sources         : PASS"
          echo "Gradle Validation   : PASS"
          echo "Debug APK           : PASS"
          echo "APK Artifact        : UPLOADED"
          echo ""
          echo "=========================================="

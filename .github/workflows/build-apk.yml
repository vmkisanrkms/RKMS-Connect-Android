name: Build RKMS Connect APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p build-project
          unzip -q RKMS_Connect_Cloud_Build_v2*.zip -d build-project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Gradle project
        shell: bash
        run: |
          GRADLEW=$(find "$GITHUB_WORKSPACE/build-project" -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found inside the ZIP."
            echo "Files extracted from ZIP:"
            find "$GITHUB_WORKSPACE/build-project" -maxdepth 5 -type f | head -100
            exit 1
          fi

          ANDROID_DIR=$(dirname "$GRADLEW")

          echo "GRADLEW=$GRADLEW" >> "$GITHUB_ENV"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Android project found:"
          echo "$ANDROID_DIR"

      - name: Make Gradle executable
        run: chmod +x "$GRADLEW"

      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug
        working-directory: ${{ env.ANDROID_DIR }}

      - name: Find generated APK
        shell: bash
        run: |
          APK=$(find "$ANDROID_DIR" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/RKMS-Connect-APK.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-APK
          path: RKMS-Connect-APK.apk
          if-no-files-found: error

      # =========================================================
      # FIND ANDROID PROJECT - ROBUST AUTO DETECTION
      # =========================================================

      - name: Find Android project automatically
        shell: bash
        run: |
          set -e

          echo ""
          echo "================================================"
          echo "RKMS Android Project Auto Detection"
          echo "================================================"
          echo ""

          python3 <<'PY'
          import os
          import sys
          import zipfile
          import tempfile
          import shutil

          ROOT = os.getcwd()

          def is_android_project(path):
              settings1 = os.path.join(path, "settings.gradle")
              settings2 = os.path.join(path, "settings.gradle.kts")
              app_gradle = os.path.join(path, "app", "build.gradle")
              app_gradle_kts = os.path.join(path, "app", "build.gradle.kts")

              return (
                  (os.path.isfile(settings1) or os.path.isfile(settings2))
                  and
                  (os.path.isfile(app_gradle) or os.path.isfile(app_gradle_kts))
              )

          # -----------------------------------------------------
          # 1. Search normal repository directories
          # -----------------------------------------------------

          print("Searching repository directories...")

          project = None

          for current, dirs, files in os.walk(ROOT):

              if ".git" in current.split(os.sep):
                  continue

              if "build" in current.split(os.sep):
                  continue

              if is_android_project(current):
                  project = os.path.abspath(current)
                  print("Android project found directly:")
                  print(project)
                  break

          # -----------------------------------------------------
          # 2. If not found, search ZIP files
          # -----------------------------------------------------

          if project is None:

              print("")
              print("No Android project found directly.")
              print("Searching ZIP files...")

              zip_files = []

              for current, dirs, files in os.walk(ROOT):

                  if ".git" in current.split(os.sep):
                      continue

                  for filename in files:

                      if filename.lower().endswith(".zip"):

                          zip_files.append(
                              os.path.join(current, filename)
                          )

              # Prefer V7 source
              zip_files.sort(
                  key=lambda x: (
                      "V7_PROFESSIONAL_RELEASE_READY_SOURCE"
                      not in os.path.basename(x),
                      os.path.basename(x)
                  )
              )

              print("")
              print("ZIP files found:")

              for z in zip_files:
                  print(" - " + z)

              if not zip_files:
                  print("")
                  print("ERROR: No ZIP source found.")
                  sys.exit(1)

              # -------------------------------------------------
              # Try ZIP files one by one
              # -------------------------------------------------

              for zip_path in zip_files:

                  print("")
                  print("Checking ZIP:")
                  print(zip_path)

                  try:

                      with zipfile.ZipFile(zip_path, "r") as z:

                          names = z.namelist()

                          settings_names = [
                              n for n in names
                              if not n.endswith("/")
                              and os.path.basename(n)
                              in (
                                  "settings.gradle",
                                  "settings.gradle.kts"
                              )
                          ]

                          candidates = []

                          for settings in settings_names:

                              parent = os.path.dirname(settings)

                              gradle1 = (
                                  parent + "/app/build.gradle"
                              )

                              gradle2 = (
                                  parent + "/app/build.gradle.kts"
                              )

                              if (
                                  gradle1 in names
                                  or gradle2 in names
                              ):

                                  candidates.append(parent)

                          if not candidates:
                              print(
                                  "No Android Gradle project in this ZIP."
                              )
                              continue

                          selected = candidates[0]

                          extract_dir = os.path.join(
                              tempfile.gettempdir(),
                              "rkms_android_source"
                          )

                          if os.path.exists(extract_dir):
                              shutil.rmtree(extract_dir)

                          os.makedirs(extract_dir)

                          print("")
                          print("Extracting:")
                          print(zip_path)

                          z.extractall(extract_dir)

                          project_path = os.path.join(
                              extract_dir,
                              selected
                          )

                          project_path = os.path.abspath(
                              project_path
                          )

                          if not is_android_project(project_path):
                              print(
                                  "Extracted project verification failed."
                              )
                              continue

                          project = project_path

                          print("")
                          print("Android project found inside ZIP:")
                          print(project)

                          break

                  except zipfile.BadZipFile:

                      print("Invalid ZIP. Skipping.")

                  except Exception as exc:

                      print(
                          "ZIP check failed:",
                          repr(exc)
                      )

          # -----------------------------------------------------
          # 3. Final verification
          # -----------------------------------------------------

          if project is None:

              print("")
              print("================================================")
              print("ERROR: ANDROID GRADLE PROJECT NOT FOUND")
              print("================================================")
              print("")

              print("Repository contents:")

              for current, dirs, files in os.walk(ROOT):

                  if ".git" in current.split(os.sep):
                      continue

                  for filename in files:

                      relative = os.path.relpath(
                          os.path.join(current, filename),
                          ROOT
                      )

                      print(relative)

              sys.exit(1)

          # -----------------------------------------------------
          # 4. Export path to GitHub Actions
          # -----------------------------------------------------

          github_env = os.environ.get("GITHUB_ENV")

          if not github_env:
              print("GITHUB_ENV is not available.")
              sys.exit(1)

          with open(github_env, "a", encoding="utf-8") as f:
              f.write(
                  "ANDROID_PROJECT_DIR="
                  + project
                  + "\n"
              )

          print("")
          print("================================================")
          print("ANDROID PROJECT READY")
          print(project)
          print("================================================")
          PY

name: RKMS Connect Android Build

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  GRADLE_VERSION: "8.10.2"

jobs:

  build:

    name: RKMS Connect Android Build

    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. JAVA 17
      # =========================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # 3. ANDROID SDK
      # =========================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true


      # =========================================================
      # 4. FIND / EXTRACT ANDROID PROJECT
      #
      # This does NOT assume rkms_android.
      # It searches the whole repository.
      # If only ZIP exists, it extracts ZIP automatically.
      # =========================================================

      - name: Find Android project automatically
        shell: bash
        run: |
          set -e

          echo ""
          echo "================================================"
          echo "Searching entire repository for Android project"
          echo "================================================"
          echo ""

          PROJECT_DIR=""

          # -------------------------------------------------------
          # FIRST: search existing Gradle projects
          # -------------------------------------------------------

          while IFS= read -r SETTINGS_FILE; do

            DIR="$(dirname "$SETTINGS_FILE")"

            if [ -f "$DIR/app/build.gradle" ] || \
               [ -f "$DIR/app/build.gradle.kts" ]; then

              PROJECT_DIR="$DIR"

              echo "Android project found:"
              echo "$PROJECT_DIR"

              break

            fi

          done < <(
            find . \
              -type f \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -not -path "*/.git/*" \
              -not -path "*/node_modules/*" \
              -print
          )


          # -------------------------------------------------------
          # SECOND: if no project found, search ZIP files
          # -------------------------------------------------------

          if [ -z "$PROJECT_DIR" ]; then

            echo ""
            echo "No Gradle project found directly."
            echo "Searching for Android ZIP source..."
            echo ""

            ZIP_FILE=""

            while IFS= read -r ZIP; do

              ZIP_FILE="$ZIP"

              echo "ZIP found:"
              echo "$ZIP_FILE"

              break

            done < <(
              find . \
                -type f \
                -iname "*.zip" \
                -o -iname "*.ZIP" \
                -not -path "*/.git/*" \
                -print
            )


            if [ -n "$ZIP_FILE" ]; then

              echo ""
              echo "Extracting Android source..."

              mkdir -p "$RUNNER_TEMP/rkms-source"

              unzip -o "$ZIP_FILE" \
                -d "$RUNNER_TEMP/rkms-source"


              echo ""
              echo "Searching extracted source..."
              echo ""

              while IFS= read -r SETTINGS_FILE; do

                DIR="$(dirname "$SETTINGS_FILE")"

                if [ -f "$DIR/app/build.gradle" ] || \
                   [ -f "$DIR/app/build.gradle.kts" ]; then

                  PROJECT_DIR="$DIR"

                  echo "Android project found inside ZIP:"
                  echo "$PROJECT_DIR"

                  break

                fi

              done < <(
                find "$RUNNER_TEMP/rkms-source" \
                  -type f \
                  -name "settings.gradle" \
                  -o -name "settings.gradle.kts" \
                  -not -path "*/.git/*" \
                  -print
              )

            fi

          fi


          # -------------------------------------------------------
          # THIRD: fail only if nothing was found
          # -------------------------------------------------------

          if [ -z "$PROJECT_DIR" ]; then

            echo ""
            echo "================================================"
            echo "ERROR: Android Gradle project NOT FOUND"
            echo "================================================"
            echo ""

            echo "Repository files:"
            find . \
              -maxdepth 8 \
              -type f \
              -not -path "*/.git/*" \
              -print | sort | head -500

            echo ""
            echo "ZIP files:"
            find . \
              -type f \
              -iname "*.zip" -o -iname "*.ZIP" \
              -print

            echo ""
            echo "Gradle files:"
            find . \
              -type f \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "gradle-wrapper.properties" \
              -not -path "*/.git/*" \
              -print

            exit 1

          fi


          # -------------------------------------------------------
          # Normalize path
          # -------------------------------------------------------

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo ""
          echo "================================================"
          echo "FINAL ANDROID PROJECT"
          echo "$PROJECT_DIR"
          echo "================================================"
          echo ""

          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # =========================================================
      # 5. SHOW PROJECT STRUCTURE
      # =========================================================

      - name: Show detected project
        shell: bash
        run: |
          set -e

          echo ""
          echo "Detected Android project:"
          echo "$ANDROID_PROJECT_DIR"

          echo ""
          echo "Project files:"
          find "$ANDROID_PROJECT_DIR" \
            -maxdepth 4 \
            -type f \
            -not -path "*/build/*" \
            -print | sort | head -300


      # =========================================================
      # 6. VERIFY REQUIRED ANDROID FILES
      # =========================================================

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          PROJECT="$ANDROID_PROJECT_DIR"

          echo "Checking Android project..."

          test -f "$PROJECT/settings.gradle" || \
          test -f "$PROJECT/settings.gradle.kts"

          test -f "$PROJECT/build.gradle" || \
          test -f "$PROJECT/build.gradle.kts"

          test -f "$PROJECT/app/build.gradle" || \
          test -f "$PROJECT/app/build.gradle.kts"

          test -f "$PROJECT/app/src/main/AndroidManifest.xml"

          echo ""
          echo "Android project verification: PASS"


      # =========================================================
      # 7. FIND GOOGLE SERVICES
      # =========================================================

      - name: Find Firebase configuration
        shell: bash
        run: |
          set -e

          PROJECT="$ANDROID_PROJECT_DIR"

          if [ -f "$PROJECT/app/google-services.json" ]; then

            echo "Firebase configuration found:"
            echo "$PROJECT/app/google-services.json"

          else

            echo "WARNING: google-services.json not found."

            FOUND_FIREBASE="$(
              find "$PROJECT" \
                -type f \
                -name "google-services.json" \
                -print \
                -quit
            )"

            if [ -n "$FOUND_FIREBASE" ]; then

              echo "Firebase file found:"
              echo "$FOUND_FIREBASE"

            else

              echo "ERROR: google-services.json not found."

              exit 1

            fi

          fi


      # =========================================================
      # 8. VERIFY RKMS WEBSITE
      # =========================================================

      - name: Find RKMS website automatically
        shell: bash
        run: |
          set -e

          PROJECT="$ANDROID_PROJECT_DIR"

          INDEX_FILE="$(
            find "$PROJECT/app/src/main/assets" \
              -type f \
              -name "index.html" \
              -print \
              -quit 2>/dev/null || true
          )"

          if [ -z "$INDEX_FILE" ]; then

            echo "ERROR: bundled index.html not found."

            exit 1

          fi

          WWW_DIR="$(dirname "$INDEX_FILE")"

          echo "RKMS website found:"
          echo "$WWW_DIR"

          test -f "$WWW_DIR/index.html"

          if [ -f "$WWW_DIR/app.js" ]; then
            echo "app.js: PASS"
          fi

          if [ -f "$WWW_DIR/styles.css" ]; then
            echo "styles.css: PASS"
          fi


      # =========================================================
      # 9. GRADLE
      # =========================================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}


      # =========================================================
      # 10. ENVIRONMENT
      # =========================================================

      - name: Show build environment
        shell: bash
        run: |
          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Android SDK:"
          sdkmanager --list_installed | grep -E \
            "platforms;android-35|build-tools;35.0.0|platform-tools" || true


      # =========================================================
      # 11. VALIDATE GRADLE
      # =========================================================

      - name: Validate Gradle project
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          gradle tasks \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # =========================================================
      # 12. DEBUG APK
      # =========================================================

      - name: Build Debug APK
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # =========================================================
      # 13. VERIFY DEBUG APK
      # =========================================================

      - name: Verify Debug APK
        shell: bash
        run: |
          set -e

          APK="$ANDROID_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then

            echo "ERROR: Debug APK was not created."

            find "$ANDROID_PROJECT_DIR/app/build/outputs" \
              -type f 2>/dev/null || true

            exit 1

          fi

          echo ""
          echo "DEBUG APK:"
          ls -lh "$APK"


      # =========================================================
      # 14. UPLOAD DEBUG APK
      # =========================================================

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RKMS-Connect-Debug-APK
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30


      # =========================================================
      # 15. CHECK RELEASE SIGNING
      # =========================================================

      - name: Check release signing secrets
        id: signing
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

        run: |

          if [ -n "$KEYSTORE" ] && \
             [ -n "$STORE_PASSWORD" ] && \
             [ -n "$KEY_ALIAS" ] && \
             [ -n "$KEY_PASSWORD" ]; then

            echo "available=true" >> "$GITHUB_OUTPUT"

            echo "Release signing: AVAILABLE"

          else

            echo "available=false" >> "$GITHUB_OUTPUT"

            echo "Release signing secrets are not configured."

            echo "Debug APK will still be built."

          fi


      # =========================================================
      # 16. DECODE KEYSTORE
      # =========================================================

      - name: Decode release keystore
        if: steps.signing.outputs.available == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

        run: |

          set -e

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/rkms-release.jks"

          test -s "$RUNNER_TEMP/rkms-release.jks"

          echo "Release keystore ready."


      # =========================================================
      # 17. RELEASE APK
      # =========================================================

      - name: Build Release APK
        if: steps.signing.outputs.available == 'true'
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/rkms-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

        run: |

          set -e

          gradle assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # =========================================================
      # 18. PLAY STORE AAB
      # =========================================================

      - name: Build Play Store AAB
        if: steps.signing.outputs.available == 'true'
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/rkms-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

        run: |

          set -e

          gradle bundleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # =========================================================
      # 19. VERIFY RELEASE OUTPUT
      # =========================================================

      - name: Verify Release outputs
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |

          set -e

          APK="$(
            find "$ANDROID_PROJECT_DIR/app/build/outputs/apk/release" \
              -type f \
              -

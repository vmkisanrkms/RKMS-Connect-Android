plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'org.rkms.connect'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'org.rkms.connect'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '1.5'
    }

    signingConfigs {
        release {
            def ksPath = System.getenv('RKMS_KEYSTORE_PATH')
            def ksPassword = System.getenv('RKMS_KEYSTORE_PASSWORD')
            def keyAliasValue = System.getenv('RKMS_KEY_ALIAS')
            def keyPasswordValue = System.getenv('RKMS_KEY_PASSWORD')
            if (ksPath && ksPassword && keyAliasValue && keyPasswordValue) {
                storeFile file(ksPath)
                storePassword ksPassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.16.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.core:core:1.15.0'
}
